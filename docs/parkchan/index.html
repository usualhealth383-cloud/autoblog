는 약 5억 4천만 년 전부터의 마지막 12 %에 해당한다. 고생대는 5.41억 년 전, 중생대는 2.52억 년 전, 신생대는 {{㉢}} 년 전에 시작되었다.", "고생대·중생대처럼 큰 단위를 <b>대(代)<\/b>라 하고, 그 속의 쥐라기·백악기 같은 작은 단위를 <b>기(紀)<\/b>라 한다. 지층은 아래쪽이 먼저 쌓이므로, 지층의 순서에 화석을 대응시키면 지구 역사의 시간표가 만들어진다. 시대의 경계는 대부분 대멸종의 자리와 겹친다(개념 04)."], "terms": [{"k": "지질시대", "v": "지구 탄생(46억 년 전)부터 현재까지를 생물계의 변화를 기준으로 나눈 시대 구분."}, {"k": "대(代)와 기(紀)", "v": "고생대·중생대처럼 큰 단위가 '대', 그 속의 쥐라기·백악기 같은 작은 단위가 '기'다."}, {"k": "선캄브리아 시대", "v": "지구 탄생부터 고생대 시작(5.41억 년 전)까지. 생물의 흔적이 드물며 지구 역사의 약 88 %를 차지한다."}], "myths": [{"x": "지질시대는 같은 시간 간격으로 나눈 것이다.", "o": "지층 속 <b>화석(생물계)의 급격한 변화<\/b>가 기준이다."}, {"x": "고생대가 지구 역사의 대부분을 차지한다.", "o": "대부분(약 88 %)은 <b>선캄브리아 시대<\/b>다."}], "point": "지질시대(46억 년)는 화석의 급격한 변화를 기준으로 선캄브리아 시대 → 고생대 → 중생대 → 신생대로 나눈다. 생물의 흔적이 드문 선캄브리아 시대가 약 88 %를 차지한다.", "answers": "정답 ㉠ 화석(생물계) ㉡ 선캄브리아 ㉢ 6600만 — '같은 시간 간격으로 나눈다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "화석(생물계)", "㉡": "선캄브리아", "㉢": "6600만"}, "warning": "'같은 시간 간격으로 나눈다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "지질시대의 구분 — 같은 시간 간격이 아니라, 생물(화석)이 크게 바뀐 곳에서 시대를 나눈다", "file": "figures/2101-01.svg"}}, {"id": "2101-02", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2101", "lessonName": "지질시대와 생물의 변천", "no": "02", "title": "화석", "subtitle": "표준 화석과 시상 화석", "steps": [{"n": "①", "t": "화석", "d": "지질시대 생물의 유해나 흔적(발자국·알·배설물)이 지층 속에 남은 것."}, {"n": "②", "t": "표준 화석", "d": "생존 기간이 짧고 분포가 넓은 생물의 화석. 지층이 쌓인 {{㉠}}를 알려 준다."}, {"n": "③", "t": "시상 화석", "d": "특정 환경에서만 살았던 생물의 화석. 지층이 쌓일 당시의 <b>환경<\/b>을 알려 준다."}], "howto": [], "body": ["<b>화석<\/b>은 지질시대에 살았던 생물의 유해나 흔적이 지층 속에 남은 것으로, 발자국·알·배설물의 흔적도 포함한다. 뼈나 껍데기처럼 단단한 부분이 있고, 죽은 뒤 빠르게 퇴적물에 묻힐수록 화석이 되기 쉽다. 화석은 묻는 질문에 따라 두 가지로 나누어 읽는다.", "<b>표준 화석<\/b>은 짧은 기간에만 살았고 넓은 지역에 퍼져 있던 생물의 화석으로, 그 지층이 쌓인 <b>시대<\/b>를 알려 준다. <b>삼엽충<\/b>은 고생대, <b>암모나이트<\/b>와 <b>공룡<\/b>은 중생대, <b>매머드<\/b>와 <b>화폐석<\/b>은 신생대의 표준 화석이다.", "<b>시상 화석<\/b>은 특정 환경에서만 살았던 생물의 화석으로, 지층이 쌓일 당시의 <b>환경<\/b>을 알려 준다. 산호 화석이 나오면 그곳은 따뜻하고 얕은 {{㉡}}였고, 고사리 화석이 나오면 따뜻하고 습한 육지였다는 뜻이다.", "표준 화석은 '언제'를, 시상 화석은 '어떤 환경'을 알려 주므로 좋은 화석의 조건도 서로 반대다. 표준 화석은 생존 기간이 {{㉢}} 분포가 넓을수록 시대를 좁게 짚을 수 있고, 시상 화석은 특정 환경에서만 오래 살았던 생물일수록 환경을 정확히 알려 준다. 한 지층에서 두 화석이 함께 나오면 시대와 환경을 동시에 읽을 수 있다."], "terms": [{"k": "표준 화석", "v": "생존 기간이 짧고 분포가 넓은 생물의 화석. 지층의 생성 시대를 알려 준다. 삼엽충(고생대), 암모나이트·공룡(중생대), 매머드·화폐석(신생대)."}, {"k": "시상 화석", "v": "특정 환경에서만 살았던 생물의 화석. 지층이 쌓일 당시의 환경을 알려 준다. 산호(따뜻하고 얕은 바다), 고사리(따뜻하고 습한 육지)."}, {"k": "화폐석", "v": "동전 모양의 신생대 표준 화석."}], "myths": [{"x": "표준 화석은 오래 산 생물일수록 좋다.", "o": "생존 기간이 <b>짧아야<\/b> 시대를 좁게 짚을 수 있다."}, {"x": "고사리 화석은 지층의 시대를 알려 주는 표준 화석이다.", "o": "따뜻하고 습한 육지 환경을 알려 주는 <b>시상 화석<\/b>이다."}], "point": "표준 화석은 '언제'(짧고 넓게), 시상 화석은 '어떤 환경'(좁고 길게)을 말해 준다. 삼엽충-고생대 · 암모나이트/공룡-중생대 · 매머드/화폐석-신생대.", "answers": "정답 ㉠ 시대 ㉡ 바다 ㉢ 짧고 — 표준 화석의 조건을 '오래 살수록'으로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "시대", "㉡": "바다", "㉢": "짧고"}, "warning": "표준 화석의 조건을 '오래 살수록'으로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "지층 속 두 화석 — 삼엽충은 '언제'(고생대), 산호는 '어떤 환경'(따뜻하고 얕은 바다)을 알려 준다", "file": "figures/2101-02.svg"}}, {"id": "2101-03", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2101", "lessonName": "지질시대와 생물의 변천", "no": "03", "title": "지질시대의 생물", "subtitle": "시대별 대표 생물", "steps": [{"n": "①", "t": "선캄브리아 시대", "d": "바다에서 최초의 생명과 광합성 생물(남세균)이 나타났다. 말기에 다세포 생물 등장."}, {"n": "②", "t": "고생대", "d": "삼엽충·어류·양치식물. {{㉠}}이 자외선을 막아 생물이 육지로 진출했다."}, {"n": "③", "t": "중생대 → 신생대", "d": "공룡·암모나이트·겉씨식물의 시대에서 <b>포유류<\/b>·속씨식물·인류의 시대로."}], "howto": [], "body": ["<b>선캄브리아 시대<\/b>의 바다에서 최초의 생명과 광합성 생물인 <b>남세균<\/b>이 나타났다. 남세균이 켜켜이 쌓아 만든 층상 구조의 암석이 <b>스트로마톨라이트<\/b>이며, 지구 최초의 생명 활동 증거 중 하나이다. 남세균이 내뿜은 산소는 대기를 바꾸었고, 시대 말에는 부드러운 몸의 다세포 생물이 등장하였다.", "<b>고생대<\/b>에는 생물이 폭발적으로 다양해졌다. 바다에서는 <b>삼엽충<\/b>과 어류가 번성하였고, 광합성으로 늘어난 산소(O<sub>2<\/sub>)의 일부가 상공에서 오존(O<sub>3<\/sub>)이 되어 <b>오존층<\/b>을 이루었다. 오존층이 자외선을 막아 주면서 생물이 처음으로 <b>육지에 진출<\/b>하였다 — 양치식물의 숲과 양서류의 시대이다.", "<b>중생대<\/b>는 파충류의 전성기이다. 육지의 <b>공룡<\/b>, 바다의 <b>암모나이트<\/b>, 그리고 소철·은행과 같은 {{㉡}}식물의 시대였다. <b>신생대<\/b>에는 공룡이 사라진 빈자리를 {{㉢}}가 채웠고, 속씨식물이 번성하였으며, 매머드가 초원에 살았고 시대의 끝자락에 <b>인류<\/b>가 등장하였다.", "시대마다 대표 생물이 바뀐 것은 우연이 아니라 그 사이에 있었던 <b>환경의 격변<\/b>(개념 04)의 결과이다. 식물은 고생대의 양치식물, 중생대의 겉씨식물, 신생대의 속씨식물로 정리한다."], "terms": [{"k": "남세균", "v": "선캄브리아 시대의 바다에 나타난 광합성 생물. 이들이 내뿜은 산소가 대기를 바꾸었다."}, {"k": "스트로마톨라이트", "v": "남세균이 켜켜이 쌓아 만든 층상 구조의 암석. 지구 최초의 생명 활동 증거 중 하나."}, {"k": "오존층", "v": "광합성이 만든 산소(O₂)의 일부가 상공에서 오존(O₃)이 되어 이룬 층. 자외선을 막아 생물의 육상 진출을 가능하게 했다."}], "myths": [{"x": "공룡과 암모나이트는 신생대의 표준 화석이다.", "o": "둘 다 <b>중생대<\/b>의 대표 생물이다. 신생대는 포유류·매머드."}, {"x": "생물의 육상 진출은 오존층과 관계없이 일어났다.", "o": "광합성 → 산소 → <b>오존층<\/b> → 자외선 차단 뒤에야 가능했다."}], "point": "고생대: 삼엽충·어류·양치식물, 오존층 형성 뒤 육상 진출. 중생대: 공룡·암모나이트·겉씨식물. 신생대: 포유류·속씨식물, 말기에 인류 등장.", "answers": "정답 ㉠ 오존층 ㉡ 겉씨 ㉢ 포유류 — 식물 짝(양치-고생대 · 겉씨-중생대 · 속씨-신생대)을 바꾼 선지에 주의한다.", "blanks": {"㉠": "오존층", "㉡": "겉씨", "㉢": "포유류"}, "warning": "식물 짝(양치-고생대 · 겉씨-중생대 · 속씨-신생대)을 바꾼 선지에 주의한다.", "figure": {"caption": "지질시대의 생물 — 남세균의 산소가 오존층을 만들고, 오존층이 자외선을 막자 생물이 육지로 올라왔다", "file": "figures/2101-03.svg"}}, {"id": "2101-04", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2101", "lessonName": "지질시대와 생물의 변천", "no": "04", "title": "대멸종", "subtitle": "환경 변화와 생물의 소멸", "steps": [{"n": "①", "t": "대멸종", "d": "수많은 생물 종이 짧은 기간에 한꺼번에 사라진 사건. 지질시대 동안 다섯 차례 있었다."}, {"n": "②", "t": "고생대 말 — 최대 규모", "d": "거대한 화산 분출 → 기후 급변·바다 산소 부족 → 바다 생물 종의 약 {{㉠}} % 소멸."}, {"n": "③", "t": "중생대 말 — 소행성", "d": "지름 약 10 km의 소행성 충돌 → 먼지가 햇빛 차단 → 광합성 정지 → 먹이 사슬 붕괴."}], "howto": [], "body": ["지질시대의 경계에서는 <b>대멸종<\/b>, 곧 수많은 생물 종이 짧은 기간에 한꺼번에 사라진 사건이 발견된다. 지질시대 동안 다섯 차례의 큰 멸종이 있었으며, 규모가 가장 컸던 것은 <b>고생대 말<\/b>의 대멸종이다. 거대한 화산 분출로 기후가 급변하고 바다의 산소가 부족해지면서 바다 생물 종의 약 <b>90 %<\/b>가 사라졌고, 삼엽충의 3억 년 역사도 여기서 끝났다.", "가장 널리 알려진 것은 <b>중생대 말<\/b>의 대멸종이다. 지름 약 10 km의 <b>소행성 충돌<\/b>이 유력한 원인으로, 충돌로 생긴 먼지가 햇빛을 가려 기온이 떨어지고 광합성이 멎으면서 먹이 사슬이 무너졌다. 공룡과 암모나이트가 사라진 사건이다.", "두 대멸종의 공통 구조는 <b>급격한 {{㉡}} 변화(원인) → 대규모 멸종(결과)<\/b>이다. 생물이 원인 없이 사라지는 일은 없으며, 환경과 생물다양성은 하나로 묶여 있다. 중생대 말 대멸종의 유력한 원인인 {{㉢}} 충돌의 증거로, 멕시코 유카탄반도에 지름 약 180 km의 충돌구가 남아 있다.", "대멸종의 원인은 '유력한 설명'이며, 과학은 증거가 쌓일수록 설명을 다듬어 간다. 시대의 경계가 대멸종의 자리와 겹치는 것은 지질시대를 화석의 급격한 변화로 나누기 때문이다(개념 01)."], "terms": [{"k": "대멸종", "v": "짧은 지질학적 시간에 수많은 종이 함께 사라지는 사건. 지질시대 동안 다섯 차례의 큰 멸종이 있었다."}, {"k": "고생대 말 대멸종", "v": "거대한 화산 분출로 기후가 급변하고 바다의 산소가 부족해져 바다 생물 종의 약 90 %가 사라진, 규모가 가장 큰 대멸종. 삼엽충이 사라졌다."}, {"k": "중생대 말 대멸종", "v": "지름 약 10 km의 소행성 충돌이 유력한 원인. 먼지가 햇빛을 가려 광합성이 멎고 먹이 사슬이 무너져 공룡·암모나이트가 사라졌다."}], "myths": [{"x": "규모가 가장 컸던 대멸종은 공룡이 사라진 중생대 말이다.", "o": "최대 규모는 <b>고생대 말<\/b>(바다 생물 종의 약 90 %)이다."}, {"x": "대멸종은 환경 변화와 무관하게 일어난다.", "o": "<b>급격한 환경 변화<\/b>가 원인이다. 원인 없는 멸종은 없다."}], "point": "고생대 말 = 화산 분출·최대 규모, 중생대 말 = 소행성 충돌·공룡 소멸. 공통 구조는 급격한 환경 변화 → 대규모 멸종이며, 시대의 경계는 대멸종의 자리다.", "answers": "정답 ㉠ 90 ㉡ 환경 ㉢ 소행성 — '가장 큰 대멸종 = 중생대 말'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "90", "㉡": "환경", "㉢": "소행성"}, "warning": "'가장 큰 대멸종 = 중생대 말'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "두 차례의 대멸종 — 급격한 환경 변화(원인)가 대규모 멸종(결과)으로 이어진다", "file": "figures/2101-04.svg"}}, {"id": "2101-05", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2101", "lessonName": "지질시대와 생물의 변천", "no": "05", "title": "대멸종 이후", "subtitle": "빈자리와 다양성의 재편", "steps": [{"n": "①", "t": "빈자리", "d": "지배자가 사라진 생태계에는 거대한 <b>빈자리<\/b>가 생긴다."}, {"n": "②", "t": "재편", "d": "살아남은 생물이 빈자리로 퍼져 나가 새로운 종으로 다양해진다. 공룡이 사라진 뒤 {{㉠}}가 퍼져 나갔다."}, {"n": "③", "t": "다양성의 계단", "d": "생물다양성은 멸종으로 꺾이고, 회복하며 더 높이 오른다. 회복에는 <b>수백만 년<\/b>이 걸린다."}], "howto": ["가로축은 시간(왼쪽이 과거, 오른쪽이 현재), 세로축은 생물다양성이다. 선이 높을수록 지구에 사는 생물의 종류가 많다는 뜻이며, '과(科)'는 여러 종을 묶은 분류 단위다.", "선이 아래로 뚝 떨어지는 두 곳이 대멸종이다. 왼쪽이 <b>고생대 말<\/b>(과의 수가 약 절반으로 — 최대 낙폭), 오른쪽이 <b>중생대 말<\/b>(낙폭은 그보다 작다). 붉은 화살표의 길이가 실제 낙폭에 비례한다.", "떨어진 뒤 선은 다시 올라가 이전 봉우리보다 높아진다. 회복한 뒤의 봉우리가 더 높다는 것이 이 그래프의 핵심이며, 현재가 역사상 가장 높은 다양성이다.", "선 아래의 생물은 각 시기의 대표 생물이다 — 삼엽충은 첫 번째 낙폭에서, 공룡은 두 번째 낙폭에서 사라졌고, 그 뒤 포유류와 인류의 시대가 왔다. 가로축의 한 칸은 수백만 년 단위다."], "body": ["대멸종은 생물다양성의 끝이 아니라 <b>재편<\/b>이었다. 지배자가 사라진 생태계에는 거대한 <b>빈자리<\/b>가 생기고, 살아남은 생물이 그 자리로 퍼져 나가며 <b>새로운 종으로 다양해진다<\/b>. 공룡이 사라진 뒤에야 작은 포유류가 하늘(박쥐)·바다(고래)·초원(말)으로 퍼져 나갔으며, 인류도 그 후손이다.", "그래서 지질시대 전체로 보면 생물다양성은 <b>멸종으로 꺾이고, 회복하며 더 높이 오르는 계단<\/b>을 그린다. 다만 회복에는 {{㉡}} 년이 걸렸다. 생존자들이 빈 서식지로 퍼져 나가며 여러 종으로 갈라지는 것을 <b>적응 방산<\/b>이라 하며, 그 원리는 02(진화와 생물다양성)에서 배운다.", "오늘날 과학자들은 인간 활동으로 인한 서식지 파괴와 기후변화가 '{{㉢}} 번째 대멸종'급의 속도로 종을 지우고 있다고 경고한다. 이번 격변의 원인은 화산도 소행성도 아닌 <b>인간 활동<\/b>이다. 환경 변화가 생물다양성을 결정한다는 이 소단원의 결론은 현재에도 그대로 적용된다."], "terms": [{"k": "재편", "v": "대멸종으로 생긴 빈자리를 살아남은 생물이 채우며 생태계의 구성이 새로 짜이는 것. 공룡 소멸 뒤 포유류가 하늘·바다·초원으로 퍼져 나갔다."}, {"k": "적응 방산", "v": "생존자들이 빈 서식지로 퍼져 나가며 여러 종으로 갈라지는 것. 원리는 02(진화와 생물다양성)에서 배운다."}, {"k": "여섯 번째 대멸종", "v": "현재의 멸종 속도가 과거의 대멸종에 비견된다는 경고. 원인은 서식지 파괴·기후변화 등 인간 활동이다."}], "myths": [{"x": "대멸종으로 꺾인 생물다양성은 곧바로 회복된다.", "o": "회복에는 <b>수백만 년<\/b>이 걸렸다."}, {"x": "대멸종 이후 생물다양성은 회복되지 못하고 계속 감소했다.", "o": "회복하며 <b>이전보다 더 높이<\/b> 올라갔다 — 현재가 역사상 최고다."}], "point": "멸종 → 빈자리 → 생존자의 재편 — 환경 변화가 생물다양성을 결정한다. 다양성은 꺾이고 회복하며 더 높이 오르지만, 회복에는 수백만 년이 걸린다.", "answers": "정답 ㉠ 포유류 ㉡ 수백만 ㉢ 여섯 — '회복하지 못하고 계속 감소'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "포유류", "㉡": "수백만", "㉢": "여섯"}, "warning": "'회복하지 못하고 계속 감소'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "대멸종과 생물다양성의 계단 — 꺾이고, 회복하며, 더 높이 오른다", "file": "figures/2101-05.svg"}}, {"id": "2102-01", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2102", "lessonName": "진화와 생물다양성", "no": "01", "title": "변이", "subtitle": "진화의 재료", "steps": [{"n": "①", "t": "변이", "d": "같은 종의 개체 사이에서 나타나는 <b>형질의 차이<\/b>. 무당벌레의 무늬, 사람의 눈동자 색."}, {"n": "②", "t": "유전적 변이", "d": "환경 때문에 생긴 차이는 전달되지 않는다. 진화의 재료는 <b>자손에게 전달되는 변이<\/b>다."}, {"n": "③", "t": "두 발생 경로", "d": "DNA에 변화가 생기는 {{㉠}}와, 부모의 유전자가 새롭게 조합되는 유성 생식."}], "howto": [], "body": ["무당벌레의 딱지날개 무늬는 한 종 안에서도 개체마다 다르고, 달팽이의 껍데기 색과 사람의 눈동자 색도 저마다 다르다. 이처럼 <b>같은 종의 개체 사이에서 나타나는 형질의 차이<\/b>를 <b>변이<\/b>라 한다. 그림 1 왼쪽의 네 마리 무당벌레는 모두 같은 종이지만 점의 수, 바탕색, 무늬의 유무가 서로 다르다.", "다만 모든 차이가 진화의 재료가 되는 것은 아니다. 운동으로 커진 근육이나 햇볕에 그을린 피부처럼 <b>환경 때문에 생긴 차이<\/b>는 자손에게 전달되지 않는다. 진화의 재료가 되는 것은 유전자의 차이에서 비롯되어 <b>자손에게 전달되는 변이<\/b>, 곧 <b>유전적 변이<\/b>다. 그림 1 오른쪽은 부모에게서 자손이 태어날 때 유전적 변이가 생기는 두 경로를 보여 준다.", "유전적 변이는 두 경로로 생긴다. 하나는 DNA에 변화가 생겨 이전에 없던 새로운 유전자가 만들어지는 <b>돌연변이<\/b>이고, 다른 하나는 부모의 유전자가 {{㉡}} 과정에서 새롭게 조합되는 것이다. 돌연변이는 대부분 영향이 없거나 불리하지만, 드물게 유리한 변이가 되어 진화의 출발점이 된다. 유성 생식은 부모의 유전자가 생식세포를 통해 자손에게 전달되는 과정에서 유전자의 새로운 조합을 만든다.", "변이는 결함이나 병이 아니라 한 종 안의 '서로 다름' 그 자체다. 다음 개념에서 살펴볼 자연선택은 이 서로 다름 가운데에서 환경에 알맞은 것을 고르는 과정이므로, 자손에게 전달되는 {{㉢}} 변이가 없다면 진화도 일어날 수 없다."], "terms": [{"k": "변이", "v": "같은 종의 개체 사이에서 나타나는 형질(모양·색·크기 등)의 차이."}, {"k": "유전적 변이", "v": "유전자의 차이에서 비롯되어 자손에게 전달되는 변이. 진화의 재료가 된다. 환경 때문에 생긴 차이는 전달되지 않는다."}, {"k": "돌연변이", "v": "DNA에 생긴 변화. 대부분 영향이 없거나 불리하지만, 드물게 유리한 변이가 되어 진화의 출발점이 된다."}], "myths": [{"x": "운동으로 커진 근육처럼 후천적으로 생긴 차이도 자손에게 유전된다.", "o": "환경 때문에 생긴 차이는 전달되지 않는다. 전달되는 것은 <b>유전적 변이<\/b>뿐이다."}, {"x": "변이는 정상에서 벗어난 결함이다.", "o": "같은 종 안의 <b>형질 차이 그 자체<\/b>이며, 진화의 재료다."}], "point": "변이는 같은 종 안의 형질 차이이며, 그중 자손에게 전달되는 유전적 변이(돌연변이 + 유성 생식의 유전자 조합)만이 진화의 재료가 된다.", "answers": "정답 ㉠ 돌연변이 ㉡ 유성 생식 ㉢ 유전적 — 후천적으로 얻은 형질이 유전된다고 쓴 선지가 단골 오답이다.", "blanks": {"㉠": "돌연변이", "㉡": "유성 생식", "㉢": "유전적"}, "warning": "후천적으로 얻은 형질이 유전된다고 쓴 선지가 단골 오답이다.", "figure": {"caption": "같은 종 안의 변이(왼쪽)와 유전적 변이가 생기는 두 경로(오른쪽) — 유성 생식의 유전자 조합과 돌연변이", "file": "figures/2102-01.svg"}}, {"id": "2102-02", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2102", "lessonName": "진화와 생물다양성", "no": "02", "title": "자연선택", "subtitle": "환경이 고르고 세대가 쌓는다", "steps": [{"n": "①", "t": "과잉 생산과 변이", "d": "생물은 살아남을 수 있는 수보다 <b>많은 자손<\/b>을 낳고, 그 자손들은 저마다 다르다."}, {"n": "②", "t": "생존 경쟁과 선택", "d": "먹이와 공간이 부족해 경쟁이 일어나고, 유리한 변이를 가진 개체가 더 많이 살아남아 번식한다 — {{㉠}}."}, {"n": "③", "t": "진화", "d": "이 과정이 세대를 거듭하면 <b>집단의 형질 구성<\/b>이 달라진다."}], "howto": [], "body": ["다윈이 제시한 자연선택설은 다섯 단계의 논리로 이루어진다. 생물은 살아남을 수 있는 수보다 많은 자손을 낳으며(<b>과잉 생산<\/b>), 그 자손들은 저마다 다르다(<b>변이<\/b>). 먹이와 공간이 한정되어 있으므로 <b>생존 경쟁<\/b>이 일어나고, 이때 <b>환경에 유리한 변이를 가진 개체가 더 많이 살아남아 더 많은 자손을 남긴다<\/b>. 이 과정을 <b>자연선택<\/b>이라 한다. 자연선택이 세대를 거듭하며 쌓이면 집단의 형질 구성이 달라지는데, 이것이 <b>진화<\/b>다.", "그림 2는 이 과정을 기린으로 나타낸 것이다. ① 기린 집단에는 처음부터 목 길이가 다양한 개체가 있었고(변이), ② 낮은 곳의 잎이 부족한 환경에서는 높은 잎을 먹을 수 있는 긴 목의 개체만 살아남아 번식하였으며(자연선택), ③ 여러 세대가 지나자 집단에 긴 목 개체가 많아졌다(진화). 환경이 새로운 변이를 만들어 준 것이 아니라, <b>이미 있던 변이 가운데에서 고른 것<\/b>이다.", "기린의 목이 길어진 까닭에 대한 두 설명을 비교하면 차이가 분명해진다. 라마르크의 {{㉡}}은 자주 쓰는 기관은 발달하고 쓰지 않는 기관은 퇴화하며, 그 결과가 자손에게 유전된다고 보았다. 곧 목을 늘여 쓴 결과 길어진 목이 유전되었다는 것이다. 그러나 후천적으로 얻은 형질은 유전되지 않으므로 이 설명은 받아들여지지 않는다.", "다윈의 설명은 다르다. 기린 집단에는 처음부터 목 길이가 다양한 개체가 있었고, 높은 곳의 잎을 먹을 수 있는 긴 목의 개체가 더 많이 살아남아 번식하였다는 것이다. 이때 변하는 것은 한 개체의 몸이 아니라 세대를 거친 {{㉢}}의 형질 구성이다. 오늘날의 진화론은 다윈의 자연선택설에 유전학이 결합하여 완성되었다."], "terms": [{"k": "자연선택", "v": "환경에 유리한 변이를 가진 개체가 더 많이 살아남아 더 많은 자손을 남기는 과정. 다윈 진화론의 핵심 개념."}, {"k": "용불용설", "v": "자주 쓰는 기관은 발달하고 쓰지 않으면 퇴화하며, 그 결과가 유전된다는 라마르크의 가설. 후천 형질은 유전되지 않으므로 기각되었다."}, {"k": "적응", "v": "자연선택이 쌓여 생물이 환경에 알맞은 형질을 갖게 되는 것."}], "myths": [{"x": "생물이 노력하여 얻은 형질은 자손에게 유전된다.", "o": "후천적 형질은 유전되지 않는다. 라마르크의 <b>용불용설<\/b>은 기각되었다."}, {"x": "진화가 일어나면 한 개체의 몸이 일생 동안 변한다.", "o": "변하는 것은 세대를 거친 <b>집단의 형질 구성<\/b>이다."}], "point": "과잉 생산 → 변이 → 생존 경쟁 → 자연선택 → 진화. 환경은 변이를 만들지 않고 이미 있던 변이 가운데에서 고르며, 변하는 것은 개체가 아니라 집단이다.", "answers": "정답 ㉠ 자연선택 ㉡ 용불용설 ㉢ 집단 — 다섯 단계의 순서와 '개체가 아니라 집단'이 함께 출제된다.", "blanks": {"㉠": "자연선택", "㉡": "용불용설", "㉢": "집단"}, "warning": "다섯 단계의 순서와 '개체가 아니라 집단'이 함께 출제된다.", "figure": {"caption": "기린의 목으로 본 자연선택 — 다양한 변이 가운데 환경에 유리한 것이 살아남아 세대를 거치며 집단이 변한다", "file": "figures/2102-02.svg"}}, {"id": "2102-03", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2102", "lessonName": "진화와 생물다양성", "no": "03", "title": "자연선택의 현장", "subtitle": "항생제 내성 세균", "steps": [{"n": "①", "t": "투여 전", "d": "세균 집단에는 항생제를 만나기 <b>전부터<\/b> 내성 변이를 가진 개체가 드물게 섞여 있다."}, {"n": "②", "t": "항생제 투여", "d": "보통 세균은 죽고, 내성 변이를 가진 세균만 살아남는다."}, {"n": "③", "t": "살아남은 세균의 번식", "d": "내성균이 집단을 차지한다. 항생제가 내성을 만든 것이 아니라 이미 있던 변이를 {{㉠}}한 것이다."}], "howto": [], "body": ["진화는 과거에만 일어난 일이 아니라 지금도 관찰된다. 대표적인 예가 <b>항생제 내성 세균<\/b>이다. 세균 집단에는 항생제를 만나기 전부터 내성 변이를 가진 개체가 드물게 섞여 있다(그림 3의 ①, 주황색). 항생제가 투여되면 보통 세균은 죽고 <b>내성 변이를 가진 세균만 살아남아 번식<\/b>한다(②, ③). 항생제라는 환경이 집단을 거르는 체의 역할을 한 것이다.", "순서가 핵심이다. 항생제가 내성을 <b>만들어 준 것이 아니라<\/b>, 이미 있던 변이를 <b>골라낸 것<\/b>이다. 살충제에 저항성을 갖게 되는 곤충도 같은 구조로 설명된다.", "갈라파고스 제도의 <b>핀치<\/b>도 자연선택의 대표적인 사례다. 섬마다 {{㉡}}가 달라, 씨앗을 깨는 두툼한 부리부터 벌레를 집는 가는 부리까지 부리 모양이 다르게 선택되었다. 어느 섬에서는 1977년 큰 가뭄으로 작고 부드러운 씨앗이 사라지고 크고 단단한 씨앗만 남자 부리가 큰 개체가 더 많이 살아남았고, 다음 세대의 평균 부리 깊이는 약 9.4 mm에서 약 9.7 mm로 커졌다. 개체의 부리가 자란 것이 아니라 <b>집단의 구성이 바뀐 것<\/b>이다.", "항생제를 처방대로 끝까지 복용해야 하는 까닭도 여기에 있다. 어중간한 복용은 내성 {{㉢}}를 가진 세균만 골라 살리는 선택압이 되어, 항생제가 듣지 않는 세균 집단을 만들 수 있다. 내성은 약을 먹은 사람의 몸이 아니라 세균 집단이 세대를 거치며 얻는 성질이다."], "terms": [{"k": "핀치", "v": "갈라파고스 제도의 작은 새. 섬과 먹이에 따라 부리 모양이 다르게 진화하여 '다윈의 핀치'로 불린다."}, {"k": "내성", "v": "약물이 잘 듣지 않게 되는 성질. 사람의 몸이 아니라 세균 집단이 세대를 거치며 얻는다."}, {"k": "선택압", "v": "집단을 거르는 환경의 작용. 항생제·살충제·가뭄이 모두 이미 있던 변이 가운데 유리한 것을 골라낸다."}], "myths": [{"x": "내성 세균은 항생제를 투여한 뒤에 처음 생겨난다.", "o": "내성 변이는 투여 <b>전부터<\/b> 집단에 있었다. 항생제는 이를 골라낼 뿐이다."}, {"x": "항생제 내성은 약을 먹은 사람의 몸이 얻는 성질이다.", "o": "<b>세균 집단<\/b>이 세대를 거치며 얻는 성질이다."}], "point": "변이가 먼저 있고 선택은 나중이다. 항생제·살충제·가뭄은 새 변이를 만들지 않고 이미 있던 변이를 고르며, 그 결과 집단의 구성이 바뀐다.", "answers": "정답 ㉠ 선택 ㉡ 먹이 ㉢ 변이 — \"항생제 투여 후에 내성이 처음 생겼다\"가 최다 오답이다.", "blanks": {"㉠": "선택", "㉡": "먹이", "㉢": "변이"}, "warning": "\"항생제 투여 후에 내성이 처음 생겼다\"가 최다 오답이다.", "figure": {"caption": "항생제 내성 세균 집단의 형성 — 투여 전부터 있던 내성 변이가 선택되어 집단을 차지한다", "file": "figures/2102-03.svg"}}, {"id": "2102-04", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2102", "lessonName": "진화와 생물다양성", "no": "04", "title": "생물다양성", "subtitle": "세 층으로 읽는다", "steps": [{"n": "①", "t": "유전적 다양성", "d": "<b>같은 종 안<\/b>에서 {{㉠}}가 얼마나 다양한가. 무당벌레의 무늬, 사람의 눈동자 색."}, {"n": "②", "t": "종 다양성", "d": "한 생태계 안에 종이 얼마나 <b>많고<\/b>, 얼마나 <b>고르게<\/b> 분포하는가."}, {"n": "③", "t": "생태계 다양성", "d": "숲·갯벌·사막·강처럼 <b>생태계 자체<\/b>가 얼마나 다양한가."}], "howto": [], "body": ["변이가 생기고 환경이 고르고 세대가 쌓이는 과정이 오랜 세월 반복된 결과, 지구는 다채로운 생물로 채워졌다. 일정한 생태계에 존재하는 생물의 다양한 정도를 <b>생물다양성<\/b>이라 하며, 그림 4처럼 세 층으로 나누어 본다. 첫째 층은 <b>유전적 다양성<\/b>으로, <b>같은 종 안<\/b>에서 유전자(변이)가 얼마나 다양한가를 뜻한다. 왼쪽 렌즈 속의 무당벌레는 모두 한 종이지만 무늬가 다르다. 사람의 눈동자 색도 같은 예다.", "둘째 층은 <b>종 다양성<\/b>으로, 한 생태계 안에 <b>종이 얼마나 많고 고르게 분포하는가<\/b>다(가운데 렌즈의 새·토끼·나비·꽃). 셋째 층은 <b>생태계 다양성<\/b>으로, 숲·강·사막·갯벌·바다처럼 <b>생태계 자체의 다양함<\/b>이다(그림 아래의 풍경 전체).", "종 다양성에서는 종의 수뿐 아니라 분포의 고름까지 본다. 종 수가 같더라도 한 종이 대부분을 차지한 숲보다 여러 종이 {{㉡}} 사는 숲의 종 다양성이 더 높다. 분포의 고름이란 전체 개체 수에서 각 종이 차지하는 비율이 균등한 정도를 말한다.", "세 층은 서로 연결되어 있다. <b>유전적 다양성이 높은 종일수록 환경이 급변해도 살아남는 개체가 있을 가능성이 크고<\/b>, 다양한 {{㉢}}가 다양한 종을 품는다. 따라서 세 층이 함께 높아야 생물다양성이 높다고 할 수 있다."], "terms": [{"k": "생물다양성", "v": "일정한 생태계에 존재하는 생물의 다양한 정도. 유전자·종·생태계의 세 수준을 아우른다."}, {"k": "분포의 고름", "v": "전체 개체 수에서 각 종이 차지하는 비율이 균등한 정도. 종의 수와 함께 종 다양성을 결정한다."}, {"k": "생태계 다양성", "v": "숲·갯벌·사막·강·바다처럼 생태계 자체가 다양한 정도. 한 생태계 안의 종의 수(종 다양성)와 구별한다."}], "myths": [{"x": "생태계 다양성은 한 생태계 안에 사는 종의 수를 뜻한다.", "o": "그것은 <b>종 다양성<\/b>이다. 생태계 다양성은 <b>생태계 자체<\/b>의 다양함이다."}, {"x": "종의 수만 많으면 종 다양성이 높다.", "o": "종의 수와 함께 <b>분포의 고름<\/b>까지 보아야 한다."}], "point": "유전적 다양성 = 같은 종 안의 유전자 차이, 종 다양성 = 종의 수 + 분포의 고름, 생태계 다양성 = 생태계 자체의 다양함. 층을 바꾸어 묻는 문제에 주의한다.", "answers": "정답 ㉠ 유전자 ㉡ 고르게 ㉢ 생태계 — 종 다양성과 생태계 다양성을 바꿔 놓은 선지가 단골 오답이다.", "blanks": {"㉠": "유전자", "㉡": "고르게", "㉢": "생태계"}, "warning": "종 다양성과 생태계 다양성을 바꿔 놓은 선지가 단골 오답이다.", "figure": {"caption": "생물다양성의 세 층 — 한 종 안의 유전자(유전적), 한 생태계 안의 여러 종(종), 여러 생태계(생태계)", "file": "figures/2102-04.svg"}}, {"id": "2102-05", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2102", "lessonName": "진화와 생물다양성", "no": "05", "title": "생물다양성의 중요성과 보전", "subtitle": "단일 품종의 위험", "steps": [{"n": "①", "t": "생태계의 안정", "d": "먹이 관계가 복잡하게 얽힌 생태계일수록 한 종이 사라져도 <b>다른 경로<\/b>가 유지된다."}, {"n": "②", "t": "인류의 자원", "d": "식량·의약품·유전자원이 모두 생물에서 온다. 푸른곰팡이의 페니실린, 주목의 항암제 원료."}, {"n": "③", "t": "다양성 감소의 위험", "d": "유전적으로 거의 동일한 {{㉠}} 품종 집단은 전염병 하나에 무너질 수 있다."}], "howto": [], "body": ["생물다양성은 왜 지켜야 하는가. 첫째, <b>생태계의 안정<\/b>을 위해서다. 먹이 관계가 복잡하게 얽힌 생태계일수록 한 종이 사라져도 다른 경로가 유지되어 생태계가 쉽게 무너지지 않는다. 둘째, <b>인류의 자원<\/b>이기 때문이다. 식량·의약품·유전자원은 모두 생물에서 온다. 푸른곰팡이에서 페니실린이, 주목이라는 나무에서 항암제의 원료가 나왔으며, 아직 연구되지 않은 종에는 알려지지 않은 자원이 남아 있다.", "유전적 다양성이 낮은 집단이 왜 위험한지는 그림 5가 보여 준다. 유전자가 거의 같은 단일 품종 밭(왼쪽)에서는 모든 개체가 같은 약점을 지니므로, 전염병 하나가 뚫으면 <b>집단 전체가 함께 무너진다<\/b>. 유전적 다양성이 높은 집단(오른쪽)에서는 환경이 급변해도 <b>살아남는 개체가 있을 가능성이 크다<\/b>.", "실제 사례가 <b>바나나<\/b>다. 오늘날 수출용 바나나는 대부분 유전적으로 거의 동일한 {{㉡}} 단일 품종이다. 씨 없이 꺾꽂이로 번식시키기 때문에 어디서 자라든 유전자가 거의 같다. 과거의 주력 품종이던 그로 미셸은 곰팡이가 일으키는 {{㉢}}으로 몰락하여 캐번디시로 교체되었고, 캐번디시 역시 지금 신종 파나마병의 위협을 받고 있다. 변이가 없는 집단은 하나의 전염병에 집단 전체가 무너질 수 있다.", "오늘날 생물다양성은 서식지 파괴·남획·외래종·오염·기후변화로 줄어들고 있다. 생물다양성의 보전은 미래의 식량과 의약품을 지키는 일이며, 품종을 다양하게 재배하는 것처럼 유전적 다양성을 높이는 활동도 보전에 속한다."], "terms": [{"k": "캐번디시 바나나", "v": "씨 없이 꺾꽂이(무성 생식)로 늘린 품종. 전 세계 어디서나 유전자가 거의 같아 유전적 다양성이 매우 낮다."}, {"k": "파나마병", "v": "곰팡이가 일으키는 바나나 전염병. 1950년대 그로 미셸 품종을 몰락시켰고, 신종이 캐번디시를 위협하고 있다."}, {"k": "다양성 감소의 원인", "v": "서식지 파괴, 남획, 외래종, 오염, 기후변화의 다섯 가지."}], "myths": [{"x": "캐번디시 바나나는 개체 수가 많으므로 유전적 다양성이 높다.", "o": "꺾꽂이로 늘린 집단이라 유전자가 <b>거의 같다<\/b>. 개체 수와 유전적 다양성은 다르다."}, {"x": "품종을 다양하게 재배하는 것은 생물다양성 보전과 무관하다.", "o": "<b>유전적 다양성<\/b>을 높이는 보전 활동이다."}], "point": "생물다양성은 생태계의 안정과 인류의 자원을 떠받친다. 단일 품종처럼 유전적 다양성이 낮은 집단은 전염병 하나에 무너질 수 있으므로, 보전은 생존의 문제다.", "answers": "정답 ㉠ 단일 ㉡ 캐번디시 ㉢ 파나마병 — 바나나 자료는 종 다양성이 아니라 유전적 다양성을 묻는 문제다.", "blanks": {"㉠": "단일", "㉡": "캐번디시", "㉢": "파나마병"}, "warning": "바나나 자료는 종 다양성이 아니라 유전적 다양성을 묻는 문제다.", "figure": {"caption": "전염병이 퍼질 때의 단일 품종 밭과 여러 품종 밭 — 유전적 다양성이 낮으면 집단 전체가 함께 무너진다", "file": "figures/2102-05.svg"}}, {"id": "2103-01", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2103", "lessonName": "산화와 환원", "no": "01", "title": "산소의 이동으로 본 산화와 환원", "subtitle": "얻으면 산화, 잃으면 환원", "steps": [{"n": "①", "t": "산소를 얻는 반응", "d": "물질이 산소를 얻는 반응을 <b>산화<\/b>라 한다. 철이 녹슬고 장작이 타는 것이 그 예이다."}, {"n": "②", "t": "산소를 잃는 반응", "d": "물질이 산소를 잃는 반응을 {{㉠}}이라 한다. 용광로의 제련이 이 방향이다."}, {"n": "③", "t": "언제나 동시에", "d": "한 물질이 산소를 얻으면 다른 물질은 반드시 산소를 잃는다."}], "howto": [], "body": ["못이 붉게 녹슬고, 장작이 타고, 깎아 둔 사과가 갈색으로 변하는 것은 겉모습이 서로 다르지만 모두 <b>산소와 결합하는 반응<\/b>이다. 이처럼 물질이 산소를 얻는 반응을 <b>산화<\/b>라 한다. 철이 산소와 결합하면 산화 철(녹)이 되고, 메테인이 연소하면 탄소가 산소와 결합하여 이산화 탄소가 된다. 산화(酸化)라는 이름은 '산소와 화합한다'는 뜻에서 왔다.", "그림 1의 왼쪽은 철못이 공기 중의 산소와 결합하여 붉은 산화 철(녹)이 되는 산화이고, 오른쪽은 용광로 안에서 산화 철이 산소를 잃고 쇳물, 즉 철로 돌아가는 환원이다. 산소가 철에 붙는지 철에서 떨어져 나가는지에 따라 같은 두 물질 사이의 반응이 산화가 되기도 하고 환원이 되기도 한다.", "반대로 물질이 산소를 잃는 반응을 <b>환원<\/b>이라 한다. 환원(還元)은 '원래로 돌아간다'는 뜻으로, 산화 철에서 산소를 떼어 내면 본래의 철로 돌아간다. 철이 공기 중의 산소·물과 만나 천천히 산화되어 생기는 붉은 녹의 성분이 {{㉡}}이다. 산소는 저절로 생기거나 사라지지 않으므로, 한 물질이 산소를 얻으면 반드시 다른 물질은 산소를 잃는다. 따라서 산화와 환원은 따로 일어나지 않고 한 반응 안에서 언제나 {{㉢}}에 일어난다.", "물질이 빛과 열을 내며 산소와 빠르게 결합하는 반응이 <b>연소<\/b>이고, 철이 산소·물과 만나 천천히 산화되는 것이 <b>녹(부식)<\/b>이다. 두 반응은 속도가 다를 뿐 모두 산소를 얻는 산화이다. 화학 반응의 전후에 원자의 종류와 수는 변하지 않으므로, 산소가 어느 물질에서 어느 물질로 옮겨 갔는지 추적하면 어느 쪽이 산화되고 어느 쪽이 환원되었는지 판정할 수 있다."], "terms": [{"k": "산화", "v": "물질이 산소를 얻는 반응. 철이 산화 철(녹)이 되는 것, 연료의 연소, 과일의 갈변이 모두 산화이다."}, {"k": "환원", "v": "물질이 산소를 잃는 반응. 용광로에서 산화 철이 산소를 잃고 철이 되는 제련이 대표적인 예이다."}, {"k": "연소 / 녹", "v": "연소는 빛과 열을 내며 산소와 빠르게 결합하는 격렬한 산화, 녹(부식)은 철이 공기 중의 산소·물과 만나 천천히 일어나는 산화이다."}], "myths": [{"x": "철이 녹스는 것은 환원의 예이다.", "o": "철이 산소를 <b>얻어<\/b> 산화 철이 되므로 <b>산화<\/b>이다."}, {"x": "산화만 단독으로 일어나는 반응도 있다.", "o": "산소를 얻은 물질이 있으면 잃은 물질이 반드시 있다 — 산화와 환원은 <b>동시<\/b>에 일어난다."}], "point": "산소를 얻으면 산화, 잃으면 환원이다. 산소는 한 물질에서 다른 물질로 이동할 뿐이므로, 한 반응 안에서 산화와 환원은 언제나 동시에 일어난다.", "answers": "정답 ㉠ 환원 ㉡ 산화 철 ㉢ 동시 — \"철이 녹스는 것은 환원\"으로 방향을 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "환원", "㉡": "산화 철", "㉢": "동시"}, "warning": "\"철이 녹스는 것은 환원\"으로 방향을 바꾼 선지가 단골 오답이다.", "figure": {"caption": "산소의 이동으로 본 산화와 환원 — 왼쪽은 철못이 공기 중의 산소를 얻어 녹스는 산화, 오른쪽은 용광로에서 산화 철이 산소를 잃는 환원", "file": "figures/2103-01.svg"}}, {"id": "2103-02", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2103", "lessonName": "산화와 환원", "no": "02", "title": "문명을 바꾼 세 가지 반응", "subtitle": "광합성 · 화석 연료의 연소 · 철의 제련", "steps": [{"n": "①", "t": "광합성", "d": "이산화 탄소와 물이 빛에너지를 받아 포도당과 산소가 된다. 이산화 탄소는 산소를 잃고 {{㉠}}된다."}, {"n": "②", "t": "화석 연료의 연소", "d": "석탄·석유 속 탄소가 산소를 얻어 이산화 탄소가 되는 <b>산화<\/b> 반응이다."}, {"n": "③", "t": "철의 제련", "d": "용광로에서 산화 철이 산소를 잃고 철로 <b>환원<\/b>된다."}], "howto": [], "body": ["역사의 방향을 바꾼 세 가지 산화·환원 반응이 있다. 첫째는 <b>광합성<\/b>이다. 이산화 탄소와 물이 빛에너지를 받아 포도당과 산소가 되는 반응으로, 이때 이산화 탄소는 산소를 잃고 포도당으로 <b>환원<\/b>된다. 이 반응이 대기에 산소를 채워 오존층의 재료가 되었고(01), 지구 생명이 에너지를 얻는 출발점이 되었다.", "그림 2의 세 장면에서 들어가는 물질과 나오는 물질을 비교하면, 잎에서는 이산화 탄소가 산소를 잃고, 굴뚝이 있는 공장에서는 석탄의 탄소가 산소를 얻으며, 용광로에서는 산화 철이 산소를 잃는다. 각 반응에서 <b>어느 물질이 산소를 얻고 어느 물질이 잃는지<\/b>를 먼저 표시하는 것이 분석의 출발점이다.", "둘째는 <b>화석 연료의 연소<\/b>이다. 석탄·석유 속 탄소가 산소를 얻어 이산화 탄소가 되는 {{㉡}} 반응으로, 산업 혁명 이후 인류 문명의 동력이 되었다. 셋째는 <b>철의 제련<\/b>이다. 용광로에서 철광석의 주성분인 산화 철이 산소를 잃고 철로 환원되는 반응으로, 철기 시대부터 오늘날의 건축물까지 도구 문명의 바탕이 되었다.", "제련의 전체 반응을 단순화하면 '산화 철 + 탄소 → 철 + 이산화 탄소'이다. 반응 전에 철에 붙어 있던 산소가 반응 후에는 탄소에 붙어 있으므로 산소는 철에서 탄소로 이동하였다. 산소를 잃은 산화 철은 환원되고, 석탄을 가공해 만든 탄소 덩어리인 {{㉢}}는 산소를 얻어 산화되어 이산화 탄소가 된다. 한 반응 안에 산화와 환원이 동시에 들어 있다."], "terms": [{"k": "광합성", "v": "이산화 탄소 + 물 → 포도당 + 산소. 이산화 탄소가 산소를 잃고 포도당으로 환원되며, 대기에 산소를 채운 반응이다."}, {"k": "제련", "v": "광석에서 금속을 뽑아내는 일. 용광로에서 산화 철이 산소를 잃고 철로 환원된다."}, {"k": "코크스", "v": "석탄을 가공해 만든 탄소 덩어리. 제련에서 산화 철의 산소를 받아 산화되어 이산화 탄소가 된다."}], "myths": [{"x": "광합성에서 이산화 탄소는 산화된다.", "o": "산소를 <b>잃고<\/b> 포도당으로 <b>환원<\/b>된다."}, {"x": "제련에서 산화 철은 산소를 얻는다.", "o": "산화 철은 산소를 <b>잃고<\/b>(환원), 코크스가 산소를 얻는다(산화)."}], "point": "광합성은 이산화 탄소의 환원, 화석 연료의 연소는 연료의 산화, 철의 제련은 산화 철의 환원이다. 세 반응의 공통점은 산소가 한 물질에서 다른 물질로 이동한다는 것이다.", "answers": "정답 ㉠ 환원 ㉡ 산화 ㉢ 코크스 — \"코크스가 환원된다\"로 주어를 바꾼 선지에 주의한다.", "blanks": {"㉠": "환원", "㉡": "산화", "㉢": "코크스"}, "warning": "\"코크스가 환원된다\"로 주어를 바꾼 선지에 주의한다.", "figure": {"caption": "잎·굴뚝·용광로 — 광합성, 화석 연료의 연소, 철의 제련은 겉모습이 다르지만 모두 산소가 이동하는 산화·환원 반응이다", "file": "figures/2103-02.svg"}}, {"id": "2103-03", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2103", "lessonName": "산화와 환원", "no": "03", "title": "전자의 이동으로 본 산화와 환원", "subtitle": "넓어진 정의", "steps": [{"n": "①", "t": "구리선을 질산 은 수용액에", "d": "구리선 표면에 은이 석출되어 자라고, 용액은 점차 푸른색으로 변한다."}, {"n": "②", "t": "구리는 전자를 잃는다", "d": "구리는 {{㉠}}를 잃고 구리 이온이 되어 용액에 녹아 들어간다(산화)."}, {"n": "③", "t": "은 이온은 전자를 얻는다", "d": "은 이온이 그 전자를 받아 은으로 석출된다(환원)."}], "howto": ["두 비커에는 모두 <b>질산 은 수용액<\/b>이 들어 있고, 위에서 꽂은 갈색 막대가 구리선이다. '처음'은 무색 용액에 매끈한 구리선을 넣은 직후, '나중'은 시간이 지난 뒤의 모습이다.", "'나중' 비커에서 구리선에 붙은 회색 가지 모양이 용액 속 은 이온이 고체 은으로 바뀌어 붙은 <b>은 결정<\/b>이고, 용액이 푸르게 변한 것은 구리선에서 녹아 나온 <b>구리 이온<\/b> 때문이다. 푸른색의 원인은 은 이온이 아니다.", "오른쪽 확대 그림의 노란 알갱이 e<sup>−<\/sup>는 <b>전자<\/b>이다. 전자는 구리(Cu)에서 나와 은 이온(Ag<sup>+<\/sup>)으로 옮겨 가며, 전자를 잃은 구리는 Cu<sup>2+<\/sup>가 되어 용액으로, 전자를 얻은 은 이온은 은(Ag)이 되어 구리선 표면에 붙는다. 전자를 준 쪽이 산화, 받은 쪽이 환원이다."], "body": ["산소가 관여하지 않는데도 산화·환원이라 부르는 반응이 있다. 구리선을 <b>질산 은 수용액<\/b>에 담그면 구리선 표면에 은이 석출되어 자라고, 용액은 점차 <b>푸른색<\/b>으로 변한다. 이 반응에서 이동하는 것은 산소가 아니라 <b>전자<\/b>이다. 구리는 전자를 잃고 구리 이온이 되어 용액을 푸르게 만들며, 은 이온은 그 전자를 얻어 은으로 석출된다.", "따라서 산화·환원의 정의는 전자의 이동으로 넓어진다. 전자를 잃으면 {{㉡}}, 전자를 얻으면 <b>환원<\/b>이다. 이 정의는 산소로 본 정의와 모순되지 않는다. 산소는 전자를 끌어당기는 힘이 강하여, 산소와 결합한 물질은 사실상 전자를 내준 셈이기 때문이다.", "전자로 보아도 규칙은 같다. 전자를 준 물질 없이 전자를 받은 물질이 있을 수 없으므로, 산화와 환원은 여전히 한 반응 안에서 동시에 일어난다. 이 실험에서는 ① 구리가 전자를 잃어 산화되고, ② 은 이온이 전자를 얻어 은으로 석출되며(환원), ③ 용액의 푸른색은 은 이온이 아니라 {{㉢}} 때문이라는 세 가지를 함께 기억한다."], "terms": [{"k": "전자로 본 정의", "v": "전자를 잃는 반응이 산화, 전자를 얻는 반응이 환원. 산소가 없는 반응에도 적용되는 넓은 정의이다."}, {"k": "이온", "v": "전자를 잃거나 얻어 전하를 띤 입자. 전자를 잃으면 (+) 전하, 얻으면 (−) 전하를 띤다."}, {"k": "석출", "v": "용액 속 이온이 고체가 되어 나오는 것. 은 이온이 전자를 얻어 은 결정으로 나오는 것이 그 예이다."}], "myths": [{"x": "용액의 푸른색은 은 이온 때문이다.", "o": "구리가 전자를 잃고 녹아 나온 <b>구리 이온<\/b> 때문이다."}, {"x": "산소가 없는 반응은 산화·환원이 아니다.", "o": "<b>전자<\/b>가 이동하면 산화·환원이다 — 잃으면 산화, 얻으면 환원."}], "point": "전자를 잃으면 산화, 얻으면 환원이다. 구리와 은 이온의 반응에서 구리는 산화되고 은 이온은 환원되며, 용액의 푸른색은 구리 이온 때문이다.", "answers": "정답 ㉠ 전자 ㉡ 산화 ㉢ 구리 이온 — \"푸른색은 은 이온 때문\"이라는 선지가 단골 함정이다.", "blanks": {"㉠": "전자", "㉡": "산화", "㉢": "구리 이온"}, "warning": "\"푸른색은 은 이온 때문\"이라는 선지가 단골 함정이다.", "figure": {"caption": "질산 은 수용액에 넣은 구리선 — 시간이 지나면 구리선에 은이 석출되고 용액은 푸른색으로 변한다. 오른쪽은 구리선 표면의 확대", "file": "figures/2103-03.svg"}}, {"id": "2103-04", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2103", "lessonName": "산화와 환원", "no": "04", "title": "생활 속의 산화와 환원", "subtitle": "호흡 · 손난로 · 갈변", "steps": [{"n": "①", "t": "세포 호흡", "d": "포도당이 산소를 얻어 이산화 탄소와 물이 되며 에너지를 내놓는 {{㉠}} 반응이다."}, {"n": "②", "t": "손난로", "d": "철가루가 공기 중의 산소와 천천히 결합(산화)하며 열을 낸다."}, {"n": "③", "t": "사과의 갈변", "d": "과일 속 물질이 산소와 반응하는 산화이다."}], "howto": [], "body": ["우리 몸속에서는 <b>세포 호흡<\/b>이 쉬지 않고 일어난다. 포도당이 산소를 얻어 이산화 탄소와 물이 되면서 에너지를 내놓는 <b>산화<\/b> 반응이다. 반응물과 생성물을 광합성(이산화 탄소 + 물 → 포도당 + 산소)과 비교하면, 두 반응은 정확히 반대 방향임을 알 수 있다.", "겨울철 <b>손난로<\/b>는 철가루가 공기 중의 산소와 천천히 결합(산화)하면서 내는 열을 이용한다. 철이 녹스는 것과 같은 반응을 난방에 이용한 것이다. 그림 4에서 사람의 호흡, 손에 든 손난로, 탁자 위 사과의 갈변은 모두 산소를 얻는 산화이고, 창밖 식물의 광합성만 이산화 탄소가 환원되는 반대 방향의 반응이다.", "깎아 둔 사과가 갈색으로 변하는 <b>갈변<\/b>도 과일 속 물질이 산소와 반응하는 산화이다. 갈변을 늦추기 위해 설탕물이나 레몬즙을 바르는 것은 {{㉡}}와의 접촉을 줄여 산화를 늦추는 방법이다.", "이처럼 타고, 녹슬고, 숨 쉬고, 데우는 일상의 변화는 모두 산소·전자의 이동이라는 <b>하나의 규칙<\/b>으로 읽힌다. 세포 호흡은 포도당의 산화이고 {{㉢}}은 이산화 탄소의 환원으로 서로 반대 방향이며, 손난로·갈변·연소는 모두 산화 쪽의 사례이다. 생활 주변의 변화를 이 규칙으로 분석하는 것이 이 소단원의 목표이다."], "terms": [{"k": "세포 호흡", "v": "포도당 + 산소 → 이산화 탄소 + 물 + 에너지. 포도당이 산화되는 반응으로, 광합성과 반대 방향이다."}, {"k": "손난로", "v": "철가루가 공기 중의 산소와 천천히 결합(산화)하며 내는 열을 이용한 물건."}, {"k": "갈변", "v": "과일 속 물질이 산소와 반응하여 갈색으로 변하는 산화. 설탕물·레몬즙은 산소와의 접촉을 줄여 갈변을 늦춘다."}], "myths": [{"x": "세포 호흡에서 포도당은 환원된다.", "o": "포도당은 산소를 얻어 <b>산화<\/b>된다. 환원되는 것은 광합성의 이산화 탄소이다."}, {"x": "사과의 갈변은 산소와 무관한 변화이다.", "o": "과일 속 물질과 <b>산소<\/b>의 반응이다 — 그래서 산소를 막으면 늦춰진다."}], "point": "호흡은 포도당의 산화, 광합성은 이산화 탄소의 환원으로 서로 반대 방향이다. 손난로·갈변·연소는 모두 산소를 얻는 산화의 예이다.", "answers": "정답 ㉠ 산화 ㉡ 산소 ㉢ 광합성 — \"호흡에서 포도당이 환원된다\"로 방향을 뒤집는 선지가 반복 출제된다.", "blanks": {"㉠": "산화", "㉡": "산소", "㉢": "광합성"}, "warning": "\"호흡에서 포도당이 환원된다\"로 방향을 뒤집는 선지가 반복 출제된다.", "figure": {"caption": "방 안의 산화·환원 — 사람의 호흡, 손난로, 탁자 위 사과의 갈변은 산화이고, 창밖 식물의 광합성은 호흡과 반대 방향이다", "file": "figures/2103-04.svg"}}, {"id": "2103-05", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2103", "lessonName": "산화와 환원", "no": "05", "title": "산화·환원 반응의 규칙", "subtitle": "주는 물질과 받는 물질", "steps": [{"n": "①", "t": "이동한 것 찾기", "d": "반응에서 이동한 것이 산소인지 전자인지 확인한다."}, {"n": "②", "t": "얻은 쪽과 잃은 쪽 표시", "d": "어느 물질이 얻고 어느 물질이 잃었는지 표시한다."}, {"n": "③", "t": "이름 붙이기", "d": "산소는 얻은 쪽이 {{㉠}}, 전자는 잃은 쪽이 산화이다."}], "howto": [], "body": ["이 소단원의 모든 반응은 하나의 규칙으로 정리된다. 산소든 전자든 무언가를 주고받을 때, 주는 물질과 받는 물질은 반드시 함께 있다. 따라서 산화와 환원은 따로 일어날 수 없고 한 반응 안에서 언제나 동시에 일어나며, 이를 산화·환원 반응의 <b>동시성<\/b>이라 한다.", "그림 5의 왼쪽은 용광로 안에서 산소가 산화 철에서 탄소로 옮겨 가는 장면이고, 오른쪽은 용액 속에서 전자가 구리에서 은 이온으로 옮겨 가는 장면이다. 두 장면 모두 ① 이동한 것을 찾고 ② 잃은 쪽과 얻은 쪽을 표시한 뒤 ③ 이름을 붙이는 순서로 판정한다. 산소 기준에서는 <b>얻는 쪽<\/b>이 산화이지만 전자 기준에서는 <b>잃는 쪽<\/b>이 산화이므로, 두 기준의 방향이 서로 반대임에 주의한다.", "문제를 풀 때의 순서도 이 규칙에서 나온다. 먼저 무엇이 이동했는지(산소인지 전자인지) 찾고, 다음으로 어느 물질이 얻고 어느 물질이 잃었는지 표시한 뒤, 마지막으로 이름을 붙인다. 산소 기준에서는 얻은 쪽이 산화이고, 전자 기준에서는 {{㉡}}를 잃은 쪽이 산화, 얻은 쪽이 {{㉢}}이다.", "이 규칙은 I단원 전체를 관통한다. 광합성이 채운 산소가 오존층이 되어 생물을 육지로 올렸고(01), 생물의 호흡과 인류의 연료·제련이 다시 산소를 주고받으며 문명을 세웠다. 변화의 화학적 측면이 곧 산화·환원인 셈이다. 다음 소단원에서는 또 다른 짝 개념인 산과 염기를 다룬다."], "terms": [{"k": "동시성", "v": "한 반응 안에서 산화된 물질과 환원된 물질이 반드시 함께 존재한다는 규칙."}, {"k": "분석의 3단계", "v": "① 이동한 것 찾기 ② 얻은 쪽·잃은 쪽 표시 ③ 산화·환원 이름 붙이기."}, {"k": "두 가지 기준", "v": "산소 기준: 얻으면 산화, 잃으면 환원. 전자 기준: 잃으면 산화, 얻으면 환원. 두 기준은 방향이 반대이다."}], "myths": [{"x": "전자를 얻는 반응은 산화이다.", "o": "전자를 <b>잃는<\/b> 반응이 산화, 얻는 반응이 <b>환원<\/b>이다."}, {"x": "산소 기준과 전자 기준은 방향이 같다.", "o": "산소는 <b>얻으면<\/b> 산화, 전자는 <b>잃으면<\/b> 산화 — 방향이 반대이다."}], "point": "산소 기준은 얻으면 산화·잃으면 환원, 전자 기준은 잃으면 산화·얻으면 환원이다. 어느 기준으로 보아도 주는 물질 없이 받는 물질은 없으므로, 산화와 환원은 언제나 동시에 일어난다.", "answers": "정답 ㉠ 산화 ㉡ 전자 ㉢ 환원 — 산소 기준과 전자 기준의 방향을 뒤바꾼 선지가 최다 오답이다.", "blanks": {"㉠": "산화", "㉡": "전자", "㉢": "환원"}, "warning": "산소 기준과 전자 기준의 방향을 뒤바꾼 선지가 최다 오답이다.", "figure": {"caption": "같은 규칙, 두 가지 기준 — 용광로에서는 산소가, 용액에서는 전자가 이동하며, 잃은 쪽과 얻은 쪽은 언제나 함께 있다", "file": "figures/2103-05.svg"}}, {"id": "2104-01", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2104", "lessonName": "염기와 중화 반응", "no": "01", "title": "산", "subtitle": "수소 이온을 내놓는 물질", "steps": [{"n": "①", "t": "산의 공통 성질", "d": "레몬·식초·탄산음료의 <b>신맛<\/b>. 마그네슘·아연 같은 금속과 반응하여 <b>수소 기체<\/b>가 발생한다."}, {"n": "②", "t": "공통 원인", "d": "종류가 달라도 성질이 같은 것은 산이 물에 녹아 {{㉠}}을 내놓기 때문이다."}, {"n": "③", "t": "전류가 흐르는 까닭", "d": "수용액 속을 ㉠과 같은 <b>이온<\/b>이 떠다니며 전하를 나르므로 전류가 흐른다."}], "howto": [], "body": ["레몬·식초·탄산음료는 모두 신맛이 난다. 이 신맛을 내는 물질이 <b>산<\/b>으로, 염산·황산·아세트산(식초의 산)·탄산(탄산음료의 산) 등이 있다. 산 수용액은 신맛 외에도 뚜렷한 공통 성질을 보인다. 그림 1처럼 <b>마그네슘·아연 같은 금속<\/b>을 넣으면 <b>수소 기체<\/b>가 발생하고, <b>달걀 껍데기·대리석(탄산 칼슘)<\/b>과 반응하여 이산화 탄소 기체를 내놓으며, 수용액에 <b>전류가 흐른다<\/b>.", "종류가 다른 산이 같은 성질을 보인다는 것은 공통의 원인이 있다는 뜻이다. 아레니우스는 산을 <b>물에 녹아 수소 이온(H<sup>+<\/sup>)을 내놓는 물질<\/b>로 정의하였다. 신맛, 금속과의 반응, 전류가 흐르는 성질은 모두 수용액 속에 떠다니는 이 H<sup>+<\/sup>에서 비롯된다.", "산 수용액에 전류가 흐르는 것은 수용액 속에 전하를 띤 입자인 {{㉡}}이 떠다니며 전하를 나르기 때문이다. 산은 종류마다 쓰임이 다르다. 염산은 위산과 청소에, 황산은 배터리에, 아세트산은 식초에, 시트르산은 레몬에 들어 있다. 그러나 물에 녹아 내놓는 것은 모두 H<sup>+<\/sup>이다. 산 수용액에 마그네슘을 넣으면 {{㉢}} 기체가 발생하는 것도 이 때문이다. 한편 실험실에서 맛으로 산을 확인하는 것은 위험하므로, 산과 염기의 확인에는 지시약(개념 03)을 이용한다."], "terms": [{"k": "산", "v": "물에 녹아 수소 이온(H⁺)을 내놓는 물질(아레니우스의 정의). 신맛이 나고, 금속과 반응하여 수소 기체를, 대리석과 반응하여 이산화 탄소를 발생시키며, 수용액에 전류가 흐른다."}, {"k": "산의 예", "v": "염산(위산·청소), 황산(배터리), 아세트산(식초), 탄산(탄산음료), 시트르산(레몬)."}, {"k": "이온과 전류", "v": "이온은 전하를 띤 입자이다. 수용액 속을 떠다니는 이온이 전하를 나르므로 전류가 흐른다."}], "myths": [{"x": "산의 공통 성질은 수산화 이온 때문이다.", "o": "<b>수소 이온(H<sup>+<\/sup>)<\/b> 때문이다. 수산화 이온(OH<sup>−<\/sup>)은 염기의 이온이다."}, {"x": "산 수용액에는 전류가 흐르지 않는다.", "o": "수용액 속 <b>이온<\/b>이 전하를 나르므로 전류가 흐른다."}], "point": "산 = 물에 녹아 H<sup>+<\/sup>를 내놓는 물질. 신맛, 금속과 반응(수소 기체), 대리석과 반응(이산화 탄소), 전류가 흐름 — 네 가지 성질의 원인은 모두 H<sup>+<\/sup> 하나이다.", "answers": "정답 ㉠ 수소 이온(H⁺) ㉡ 이온 ㉢ 수소 — ㉠을 '수산화 이온'으로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "수소 이온(H⁺)", "㉡": "이온", "㉢": "수소"}, "warning": "㉠을 '수산화 이온'으로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "산 수용액의 네 가지 공통 성질 — 어느 잔, 어느 비커에도 같은 수소 이온(H⁺)이 들어 있다", "file": "figures/2104-01.svg"}}, {"id": "2104-02", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2104", "lessonName": "염기와 중화 반응", "no": "02", "title": "염기", "subtitle": "수산화 이온을 내놓는 물질", "steps": [{"n": "①", "t": "염기의 공통 성질", "d": "<b>쓴맛<\/b>이 나고 만지면 <b>미끈거리며<\/b>, 수용액에 전류가 흐른다."}, {"n": "②", "t": "산과 다른 점", "d": "금속이나 대리석과는 <b>반응하지 않는다<\/b>. 산과 뚜렷이 갈리는 지점이다."}, {"n": "③", "t": "공통 원인", "d": "염기가 물에 녹아 {{㉠}}을 내놓기 때문이다."}], "howto": [], "body": ["비누·하수구 세정제·제산제의 주성분은 <b>염기<\/b>로, 수산화 나트륨·수산화 칼슘·암모니아 등이 있다. 염기 수용액은 <b>쓴맛<\/b>이 나고 만지면 <b>미끈거린다<\/b>. 미끈거리는 것은 염기가 피부 표면의 단백질을 녹이기 때문이며, 그래서 진한 염기는 산 못지않게 위험하다.", "염기 수용액에도 산과 마찬가지로 <b>전류가 흐른다<\/b>. 그러나 산과 달리 <b>금속이나 대리석과는 반응하지 않는다<\/b>. 그림 2에서 같은 마그네슘 조각을 넣었을 때 왼쪽 산 수용액에서만 기체가 발생하고, 전구는 두 비커 모두에서 켜지는 것이 바로 이 차이와 공통점이다.", "염기의 공통 성질은 염기가 물에 녹아 내놓는 <b>수산화 이온(OH<sup>−<\/sup>)<\/b>에서 비롯된다(아레니우스의 정의). 염기 수용액이 미끈거리는 것은 염기가 피부 표면의 {{㉡}}을 녹이기 때문이다. 정리하면 산의 공통 성질은 H<sup>+<\/sup>가, 염기의 공통 성질은 OH<sup>−<\/sup>가 만든다. 두 수용액 모두 이온이 들어 있으므로 {{㉢}}가 흐른다는 공통점이 있다. 이 두 이온이 만나면 어떤 일이 일어나는지는 개념 04의 중화 반응에서 다룬다."], "terms": [{"k": "염기", "v": "물에 녹아 수산화 이온(OH⁻)을 내놓는 물질(아레니우스의 정의). 쓴맛이 나고 미끈거리며, 수용액에 전류가 흐른다."}, {"k": "염기의 예", "v": "수산화 나트륨(비누·세정제), 수산화 칼슘(석회수), 암모니아(청소·비료), 제산제의 성분."}, {"k": "미끈거림", "v": "염기가 피부 표면의 단백질을 녹일 때 느껴지는 감촉. 진한 염기가 위험한 까닭이기도 하다."}], "myths": [{"x": "염기는 금속과 반응하여 수소 기체를 낸다.", "o": "금속과 반응하는 것은 <b>산<\/b>이다. 염기는 금속·대리석과 반응하지 않는다."}, {"x": "산 수용액은 만지면 미끈거린다.", "o": "미끈거림은 <b>염기<\/b>의 성질이다. 산은 신맛, 염기는 쓴맛과 미끈거림."}], "point": "염기 = 물에 녹아 OH<sup>−<\/sup>를 내놓는 물질. 쓴맛·미끈거림·전류. 금속·대리석과의 반응은 산만의 성질이고, 전류는 산과 염기 수용액 모두에 흐른다.", "answers": "정답 ㉠ 수산화 이온(OH⁻) ㉡ 단백질 ㉢ 전류 — \"전류는 산 수용액에만 흐른다\"는 선지가 단골 오답이다.", "blanks": {"㉠": "수산화 이온(OH⁻)", "㉡": "단백질", "㉢": "전류"}, "warning": "\"전류는 산 수용액에만 흐른다\"는 선지가 단골 오답이다.", "figure": {"caption": "산 수용액과 염기 수용액에 마그네슘과 전극을 넣은 모습 — 갈리는 성질과 공통점(전류)", "file": "figures/2104-02.svg"}}, {"id": "2104-03", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2104", "lessonName": "염기와 중화 반응", "no": "03", "title": "지시약", "subtitle": "색으로 확인하는 산과 염기", "steps": [{"n": "①", "t": "지시약", "d": "용액의 액성(산성·중성·염기성)에 따라 <b>색이 변하는 물질<\/b>. 맛보지 않고 산·염기를 확인한다."}, {"n": "②", "t": "3대 지시약", "d": "리트머스 종이 · 페놀프탈레인 · BTB 용액. 페놀프탈레인은 염기성에서만 {{㉠}}이 된다."}, {"n": "③", "t": "천연 지시약", "d": "자주색 양배추·포도 껍질·검은콩을 우린 물도 액성에 따라 색이 변한다."}], "howto": ["세로 방향은 용액의 액성(산성·중성·염기성), 가로 방향은 지시약의 종류이다. 각 칸의 종이 색·시험관 속 색이 그 액성에서 지시약이 나타내는 색이다.", "리트머스 종이는 푸른 종이와 붉은 종이 두 가지를 쓴다. 산성 용액에 담근 푸른 종이는 붉게, 염기성 용액에 담근 붉은 종이는 푸르게 변하고, 중성에서는 두 종이 모두 변하지 않는다.", "페놀프탈레인은 산성과 중성에서 모두 무색이고 염기성에서만 붉은색이 된다. 무색이라고 해서 산성이라 단정할 수 없다.", "BTB 용액은 산성 노란색, 중성 초록색, 염기성 파란색으로 세 액성을 모두 구별한다."], "body": ["산과 염기를 맛으로 확인하는 것은 위험하다. 대신 산성·염기성에 따라 <b>색이 변하는 물질<\/b>인 <b>지시약<\/b>을 이용한다. <b>리트머스 종이<\/b>는 산성에서 푸른 종이가 <b>붉게<\/b>, 염기성에서 붉은 종이가 <b>푸르게<\/b> 변한다. <b>페놀프탈레인 용액<\/b>은 산성에서 <b>무색<\/b>이고 염기성에서만 <b>붉은색<\/b>이 된다. <b>BTB 용액<\/b>은 산성에서 <b>노란색<\/b>, 중성에서 <b>초록색<\/b>, 염기성에서 <b>파란색<\/b>을 띤다.", "지시약은 실험실에만 있는 것이 아니다. <b>자주색 양배추<\/b>를 우린 물은 산성에서 붉은 계열, 염기성에서 푸른·노란 계열로 변하는 <b>천연 지시약<\/b>이다. 포도 껍질이나 검은콩을 우린 물도 같은 구실을 한다.", "지시약의 색은 용액의 액성과 이온을 연결하는 단서가 된다. 예를 들어 BTB 용액을 넣은 용액이 {{㉡}}이면 산성이므로 H<sup>+<\/sup>가 들어 있고, 마그네슘을 넣으면 수소 기체가 발생할 것이라 예상할 수 있다. 반대로 페놀프탈레인 용액이 무색이라는 것만으로는 산성인지 {{㉢}}인지 알 수 없다. 두 액성에서 모두 무색이기 때문이다."], "terms": [{"k": "지시약", "v": "용액의 액성(산성·중성·염기성)에 따라 색이 변하는 물질. 맛보지 않고 산과 염기를 확인하는 데 쓴다."}, {"k": "리트머스 종이", "v": "산성에서 푸른 종이가 붉게, 염기성에서 붉은 종이가 푸르게 변하는 지시약. 중성에서는 변하지 않는다."}, {"k": "천연 지시약", "v": "자주색 양배추·포도 껍질·검은콩을 우린 물처럼 색소가 액성에 따라 변하는 천연 물질."}], "myths": [{"x": "BTB 용액은 산성에서 파란색을 띤다.", "o": "산성에서는 <b>노란색<\/b>이다. 파란색은 염기성, 초록색은 중성."}, {"x": "페놀프탈레인 용액이 무색이면 산성이다.", "o": "<b>산성 또는 중성<\/b>이다. 페놀프탈레인은 염기성에서만 붉은색이 된다."}], "point": "리트머스는 산성에서 붉게·염기성에서 푸르게, 페놀프탈레인은 염기성에서만 붉게, BTB는 노란색(산성)·초록색(중성)·파란색(염기성). 세 지시약의 색 변화는 통째로 기억한다.", "answers": "정답 ㉠ 붉은색 ㉡ 노란색 ㉢ 중성 — 페놀프탈레인의 '무색 = 산성 확정'이 단골 오답이다.", "blanks": {"㉠": "붉은색", "㉡": "노란색", "㉢": "중성"}, "warning": "페놀프탈레인의 '무색 = 산성 확정'이 단골 오답이다.", "figure": {"caption": "3대 지시약의 색 변화 — 리트머스 종이 · 페놀프탈레인 · BTB 용액을 세 가지 용액에 넣었을 때", "file": "figures/2104-03.svg"}}, {"id": "2104-04", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2104", "lessonName": "염기와 중화 반응", "no": "04", "title": "중화 반응", "subtitle": "H⁺와 OH⁻가 만나 물이 되는 반응", "steps": [{"n": "①", "t": "산 + 염기", "d": "산의 H<sup>+<\/sup>와 염기의 OH<sup>−<\/sup>가 만나 {{㉠}}이 된다. 서로의 성질이 사라진다."}, {"n": "②", "t": "물과 염", "d": "물과 함께 남은 이온들이 만드는 물질이 <b>염<\/b>이다. 산 + 염기 → 물 + 염."}, {"n": "③", "t": "확인 신호", "d": "<b>중화열<\/b>로 온도가 오르고, <b>지시약<\/b>의 색이 변한다."}], "howto": ["네 비커는 한 실험의 네 순간이다. 처음 비커에는 H<sup>+<\/sup> 4개와 Cl<sup>−<\/sup> 4개가 든 묽은 염산(BTB 넣음)이 있고, 위의 가는 관에서 같은 농도의 수산화 나트륨 수용액을 2단위(Na<sup>+<\/sup> 2개 + OH<sup>−<\/sup> 2개)씩 떨어뜨린다.", "공의 색이 이온의 종류이다 — 주황은 H<sup>+<\/sup>(산), 초록은 OH<sup>−<\/sup>(염기), 파랑은 Na<sup>+<\/sup>, 회색은 Cl<sup>−<\/sup>. 용액의 색은 BTB의 색(노랑·초록·파랑)이고, 오른쪽 온도계의 붉은 기둥은 그 순간의 온도이다.", "넣은 OH<sup>−<\/sup>는 H<sup>+<\/sup>와 만나는 즉시 물이 되어 이온 목록에서 사라진다. 그래서 ②·③에는 OH<sup>−<\/sup> 공이 없고, H<sup>+<\/sup> 공이 2개씩 줄어드는 대신 Na<sup>+<\/sup> 공이 2개씩 들어온다.", "③에서 H<sup>+<\/sup>가 모두 사라진 순간이 완전 중화이다 — 용액은 중성(초록색), 온도는 가장 높다. ④처럼 더 넣은 OH<sup>−<\/sup>는 반응할 H<sup>+<\/sup>가 없어 그대로 남고, 용액은 염기성(파란색)이 되며 온도는 내려간다."], "body": ["산과 염기를 섞으면 산의 <b>H<sup>+<\/sup><\/b>와 염기의 <b>OH<sup>−<\/sup><\/b>가 만나 <b>물(H<sub>2<\/sub>O)<\/b>이 된다. 이 반응이 <b>중화 반응<\/b>이며, 이때 산과 염기의 성질은 서로 사라진다. 그림 4에서 완전 중화까지 총 이온 수가 8개로 일정한 것은, H<sup>+<\/sup>가 1개 사라질 때마다 Na<sup>+<\/sup>가 1개 들어와 그 자리를 채우기 때문이다.", "물과 함께 남은 이온들이 만드는 물질을 <b>염<\/b>이라 한다. 염산과 수산화 나트륨이 중화하면 염화 나트륨(소금)이 생기며, 이를 정리하면 <b>산 + 염기 → 물 + 염<\/b>이다.", "중화가 일어났는지는 두 가지 신호로 확인한다. 첫째, <b>온도가 올라간다<\/b>. 중화 반응은 열(<b>중화열<\/b>)을 내놓으므로, 산과 염기가 꼭 맞게 반응하는 <b>완전 중화점<\/b>에서 온도가 가장 높다. 그 뒤에 더 넣은 염기는 반응할 H<sup>+<\/sup>가 없어 열이 더 나오지 않고 상온의 용액만 섞이므로 온도는 내려간다. 둘째, <b>지시약의 색이 변한다<\/b>. BTB 용액을 넣은 묽은 염산에 수산화 나트륨 수용액을 조금씩 넣으면 노란색 → {{㉡}}(완전 중화) → 파란색으로 액성의 변화가 그대로 나타난다.", "완전 중화까지 반응에 참여하지 않고 처음 개수 그대로인 Cl<sup>−<\/sup> 같은 이온을 {{㉢}} 이온이라 한다. 이온 수 그래프에서 수평선으로 나타나는 이온이다. 온도 그래프의 꼭짓점과 BTB의 초록색은 같은 사건, 곧 완전 중화를 알리는 두 신호이다."], "terms": [{"k": "중화 반응", "v": "산의 H⁺와 염기의 OH⁻가 만나 물이 되면서 서로의 성질이 사라지는 반응. 산 + 염기 → 물 + 염."}, {"k": "염", "v": "중화 반응에서 물과 함께 생기는 물질. 염산과 수산화 나트륨의 중화에서는 염화 나트륨(소금)이 생긴다."}, {"k": "중화열", "v": "중화 반응에서 나오는 열. 완전 중화점에서 온도가 가장 높다. 다음 소단원(05)의 발열 반응으로 이어진다."}], "myths": [{"x": "염기를 계속 넣으면 온도가 계속 올라간다.", "o": "<b>완전 중화점에서 최고<\/b>이고, 그 뒤에는 반응할 H<sup>+<\/sup>가 없어 내려간다."}, {"x": "완전 중화까지 총 이온 수는 줄어든다.", "o": "<b>일정<\/b>하다. H<sup>+<\/sup> 1개가 사라질 때 Na<sup>+<\/sup> 1개가 들어온다."}], "point": "중화 반응 = H<sup>+<\/sup> + OH<sup>−<\/sup> → H<sub>2<\/sub>O(산 + 염기 → 물 + 염). 신호는 온도 상승(완전 중화점에서 최고)과 지시약의 색 변화(BTB 노란색 → 초록색 → 파란색). 이온 수는 H<sup>+<\/sup> 감소, Na<sup>+<\/sup> 증가, Cl<sup>−<\/sup> 일정.", "answers": "정답 ㉠ 물(H₂O) ㉡ 초록색 ㉢ 구경꾼 — '넣을수록 온도가 계속 오른다'는 선지는 완전 중화점 이후의 하강으로 반박한다.", "blanks": {"㉠": "물(H₂O)", "㉡": "초록색", "㉢": "구경꾼"}, "warning": "'넣을수록 온도가 계속 오른다'는 선지는 완전 중화점 이후의 하강으로 반박한다.", "figure": {"caption": "묽은 염산에 수산화 나트륨 수용액을 넣을 때 비커 속 이온·색·온도의 변화 — H⁺는 줄고 Na⁺는 늘며 Cl⁻는 그대로이다", "file": "figures/2104-04.svg"}}, {"id": "2104-05", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2104", "lessonName": "염기와 중화 반응", "no": "05", "title": "생활 속의 중화 반응", "subtitle": "산에는 염기를, 염기에는 산을", "steps": [{"n": "①", "t": "약과 부엌", "d": "제산제(염기)가 지나친 위산({{㉠}})을 중화하고, 생선 비린내(염기성)에는 레몬즙(산)을 뿌린다."}, {"n": "②", "t": "농장과 환경", "d": "산성화된 토양·호수에 <b>석회 가루(염기)<\/b>를 뿌려 되살린다."}, {"n": "③", "t": "공장과 몸", "d": "산성 배기가스를 염기성 물질로 걸러 내고, <b>치약<\/b>이 입안의 산을 중화하여 충치를 예방한다."}], "howto": [], "body": ["중화 반응은 일상 곳곳에서 이용된다. 속이 쓰릴 때 먹는 <b>제산제<\/b>는 염기성 물질로, 지나치게 분비된 <b>위산(염산)<\/b>을 중화한다. 생선의 비린내는 염기성 물질이 내므로 <b>레몬즙(산)<\/b>을 뿌려 없앤다. 산성화된 토양이나 호수에는 <b>석회 가루(염기)<\/b>를 뿌려 되살린다. 벌레 물린 곳에 바르는 암모니아수, 신 김치찌개에 넣는 소다도 같은 원리이다. 그림 5의 네 장면에서 화살표는 지나친 쪽을 중화하기 위해 더해 주는 물질을 가리킨다.", "공장 굴뚝의 산성 배기가스를 염기성 물질로 걸러 내는 것, 치약이 입안의 산을 중화하여 충치를 예방하는 것도 모두 중화 반응이다. 원리는 하나이다. 지나치게 많은 H<sup>+<\/sup>(또는 OH<sup>−<\/sup>)를 반대 이온으로 중화하는 것 — 산이 강한 곳에는 {{㉡}}를, 염기가 강한 곳에는 산을 더한다. 이 규칙 하나가 약국·부엌·농장·공장을 관통한다.", "위산은 위에서 분비되는 묽은 염산으로 소화와 살균을 담당하지만, 지나치면 속쓰림을 일으킨다. 제산제는 이 과다한 H<sup>+<\/sup>를 OH<sup>−<\/sup> 쪽 물질로 중화하는 약이다. 산성비로 산성화된 호수와 토양에 {{㉢}}(염기)를 뿌리는 것은 실제로 쓰이는 환경 복원 기술이다. 앞 소단원(03)에서 전자를 주고받는 반응이 산화·환원이었다면, 이 소단원에서는 H<sup>+<\/sup>와 OH<sup>−<\/sup>가 만나는 반응이 중화이다."], "terms": [{"k": "위산", "v": "위에서 분비되는 묽은 염산. 소화와 살균을 담당하며, 지나치면 속쓰림을 일으킨다."}, {"k": "제산제", "v": "과다한 위산(염산)을 중화하는 염기성 물질의 약."}, {"k": "석회와 산성 토양", "v": "산성화된 호수·토양에 석회(염기)를 뿌려 중화하는 환경 복원 기술."}], "myths": [{"x": "생선 비린내에 레몬즙을 뿌리는 것은 산화·환원 반응이다.", "o": "염기성 물질을 산으로 중화하는 <b>중화 반응<\/b>이다."}, {"x": "제산제는 산성 물질이다.", "o": "<b>염기성<\/b> 물질이다. 위산(염산)이 산이므로 그 반대인 염기로 중화한다."}], "point": "산 = H<sup>+<\/sup>, 염기 = OH<sup>−<\/sup>, 중화 = H<sup>+<\/sup> + OH<sup>−<\/sup> → 물(산 + 염기 → 물 + 염). 제산제·레몬즙·석회·치약은 모두 지나친 쪽을 반대 이온으로 중화하는 같은 원리이다.", "answers": "정답 ㉠ 염산 ㉡ 염기 ㉢ 석회 — '레몬즙 = 산화·환원'처럼 반응의 종류를 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "염산", "㉡": "염기", "㉢": "석회"}, "warning": "'레몬즙 = 산화·환원'처럼 반응의 종류를 바꾼 선지가 단골 오답이다.", "figure": {"caption": "생활 속 중화 반응의 네 장면 — 지나친 산에는 염기를, 지나친 염기에는 산을 더하여 중화한다", "file": "figures/2104-05.svg"}}, {"id": "2105-01", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2105", "lessonName": "화학 변화와 에너지 출입", "no": "01", "title": "발열 반응", "subtitle": "열을 내놓는 화학 변화", "steps": [{"n": "①", "t": "에너지의 출입", "d": "화학 변화에는 <b>물질의 변화<\/b>와 함께 <b>에너지의 출입<\/b>이 있다."}, {"n": "②", "t": "열의 방출", "d": "반응이 열을 내놓으면 주위의 온도가 {{㉠}}간다."}, {"n": "③", "t": "대표적인 예", "d": "연소, 중화 반응, 금속과 산의 반응, 세포 호흡."}], "howto": [], "body": ["화학 변화가 일어날 때는 물질만 변하는 것이 아니라 <b>에너지의 출입<\/b>이 함께 일어난다(①). 장작이 타면 열이 나고, 묽은 산에 금속을 넣으면 시험관이 따뜻해진다. 이처럼 반응이 일어나면서 <b>열을 방출<\/b>하여 주위의 온도를 높이는 반응을 <b>발열 반응<\/b>이라 한다. 반응물이 지니고 있던 에너지의 일부가 열의 형태로 주위에 나오는 것이다.", "그림 1에서 금속을 넣기 전의 묽은 산과 비교하면, 반응이 일어나는 동안 열은 반응에서 <b>주위<\/b>로 이동하고, 주위(용액·손·공기)에 놓인 온도계의 눈금은 올라간다(②). 연료의 <b>연소<\/b>, 산과 염기의 <b>중화 반응<\/b>, <b>금속과 산의 반응<\/b>이 대표적인 발열 반응이다(③).", "열을 방출하며 일어나는 반응을 {{㉡}} 반응이라 한다. 03에서 배운 연소는 격렬한 산화 반응이고, 04의 중화 반응에서 용액의 온도가 오른 까닭도 중화열이 방출되기 때문이다. 우리 몸의 {{㉢}}도 포도당을 천천히 산화시켜 열을 얻는 발열 반응으로, 체온 <b>36.5 ℃<\/b>는 이 반응으로 유지된다.", "연소와 세포 호흡은 둘 다 산화 반응이며 발열 반응이지만, 연소는 빠르고 격렬하게, 세포 호흡은 느리고 조용하게 진행된다는 점이 다르다. 발열 반응인지 판단하는 기준은 반응 자신이 아니라 <b>주위의 온도<\/b>가 올라갔는지 여부이다."], "terms": [{"k": "발열 반응", "v": "열을 방출하며 일어나는 화학 반응. 반응이 일어나면 주위의 온도가 올라간다."}, {"k": "연소", "v": "연료가 산소와 결합하며 빛과 열을 내는 격렬한 산화 반응. 대표적인 발열 반응이다."}, {"k": "세포 호흡", "v": "포도당을 천천히 산화시켜 에너지를 얻는 발열 반응. 체온 36.5 ℃를 유지하는 근원이다."}], "myths": [{"x": "세포 호흡은 흡열 반응이다.", "o": "포도당을 산화시켜 열을 내는 <b>발열 반응<\/b>이다 — 체온의 근원."}, {"x": "화학 변화에서는 에너지 출입이 일어나지 않는다.", "o": "물질의 변화에는 <b>에너지의 출입<\/b>이 언제나 함께 있다."}], "point": "발열 반응 = 열 방출 → 주위의 온도 상승. 연소·중화 반응·금속과 산의 반응·세포 호흡이 여기에 속한다.", "answers": "정답 ㉠ 올라 ㉡ 발열 ㉢ 세포 호흡 — '세포 호흡은 흡열 반응'으로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "올라", "㉡": "발열", "㉢": "세포 호흡"}, "warning": "'세포 호흡은 흡열 반응'으로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "발열 반응 — 묽은 산에 금속을 넣으면 열이 주위로 나와 온도계의 눈금이 올라가고 손이 따뜻해진다", "file": "figures/2105-01.svg"}}, {"id": "2105-02", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2105", "lessonName": "화학 변화와 에너지 출입", "no": "02", "title": "흡열 반응", "subtitle": "열을 흡수하는 화학 변화", "steps": [{"n": "①", "t": "열의 흡수", "d": "반응이 <b>주위의 열을 흡수<\/b>하며 일어난다."}, {"n": "②", "t": "주위의 온도", "d": "열을 빼앗긴 주위의 온도가 {{㉠}}간다."}, {"n": "③", "t": "대표적인 예", "d": "광합성, 탄산수소 나트륨의 열분해, 질산 암모늄과 물의 반응."}], "howto": [], "body": ["반대로 <b>주위에서 열을 흡수<\/b>하며 일어나 주위의 온도를 낮추는 반응을 <b>흡열 반응<\/b>이라 한다(①). 그림 2에서 열은 주위에서 반응으로 이동하고, 온도계의 눈금은 내려간다(②).", "수산화 바륨과 염화 암모늄을 삼각 플라스크에서 섞으면 온도가 크게 떨어져, 물 몇 방울을 얹어 둔 <b>나무판이 플라스크에 얼어붙는다<\/b>. 반응이 주위(물)의 열을 흡수하여 온도가 내려갔기 때문이다.", "이처럼 열을 흡수하는 반응이 {{㉡}} 반응이다(③). <b>광합성<\/b>은 빛에너지를 흡수하여 포도당에 저장하는 반응으로, 03에서 배운 환원 반응이기도 하다. 탄산수소 나트륨의 {{㉢}}는 열을 계속 공급해야 진행되는 반응으로, 빵 반죽이 부푸는 원리이다. 이 밖에 <b>질산 암모늄과 물의 반응<\/b>, 탄산수소 나트륨과 시트르산의 반응도 흡열 반응이다.", "에너지의 관점에서 보면 광합성(흡열·저장)과 세포 호흡(발열·사용)은 서로 짝을 이루는 한 쌍의 반응이다."], "terms": [{"k": "흡열 반응", "v": "주위에서 열을 흡수하며 일어나는 화학 반응. 반응이 일어나면 주위의 온도가 내려간다."}, {"k": "열분해", "v": "열을 가하여 물질을 분해하는 반응. 열 공급을 멈추면 반응도 멈춘다."}, {"k": "광합성과 세포 호흡", "v": "광합성은 빛에너지를 흡수해 포도당에 저장하는 흡열 반응, 세포 호흡은 그 에너지를 꺼내 쓰는 발열 반응."}], "myths": [{"x": "광합성은 발열 반응이다.", "o": "빛에너지를 <b>흡수<\/b>하여 저장하는 <b>흡열 반응<\/b>이다."}, {"x": "수산화 바륨과 염화 암모늄의 반응은 발열 반응이다.", "o": "주위의 열을 흡수하는 <b>흡열 반응<\/b>이다 — 나무판이 얼어붙는다."}], "point": "흡열 반응 = 열 흡수 → 주위의 온도 하강. 광합성·탄산수소 나트륨의 열분해·질산 암모늄과 물의 반응이 여기에 속한다.", "answers": "정답 ㉠ 내려 ㉡ 흡열 ㉢ 열분해 — '광합성은 발열 반응'이 가장 많이 나오는 오답이다.", "blanks": {"㉠": "내려", "㉡": "흡열", "㉢": "열분해"}, "warning": "'광합성은 발열 반응'이 가장 많이 나오는 오답이다.", "figure": {"caption": "흡열 반응 — 두 물질을 섞으면 열이 주위에서 반응으로 들어가 온도가 크게 내려가고, 나무판이 플라스크에 얼어붙는다", "file": "figures/2105-02.svg"}}, {"id": "2105-03", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2105", "lessonName": "화학 변화와 에너지 출입", "no": "03", "title": "발열 반응의 이용", "subtitle": "손난로와 발열 도시락", "steps": [{"n": "①", "t": "손난로", "d": "철가루가 산소와 결합하여 {{㉠}}되며 열을 낸다."}, {"n": "②", "t": "발열 도시락", "d": "<b>산화 칼슘과 물<\/b>의 발열 반응으로 음식을 데운다."}, {"n": "③", "t": "연료의 연소", "d": "가스레인지·보일러·엔진 — 열과 동력을 얻는다."}], "howto": [], "body": ["<b>손난로<\/b>는 부직포 주머니 속의 <b>철가루가 공기 중의 산소와 천천히 결합(산화)<\/b>하면서 내는 열을 이용한다(①). 03에서 배운 철이 녹스는 반응을 난방에 쓰는 것이다. 손난로를 흔들면 철가루가 공기와 닿는 면적이 넓어져 산화가 빨라지므로 더 빨리 따뜻해지며, 함께 들어 있는 소금물과 활성탄은 반응을 돕는 역할을 한다.", "그림 3의 두 장치는 반응의 속도는 다르지만 모두 <b>발열 반응<\/b>에서 나오는 열을 이용한다는 점에서 같다. 반응에서 나오는 열을 필요한 곳에 골라 쓰는 것이 발열 반응을 이용하는 기술이다.", "끈을 당기면 데워지는 <b>발열 도시락<\/b>은 {{㉡}}(생석회)과 물의 발열 반응을 이용한다(②). 불이나 전기 없이도 반응열만으로 음식을 데울 수 있다. 가장 오래된 발열 반응의 이용은 연료의 {{㉢}}이다(③). 가스레인지와 보일러는 연소열로 물과 공간을 데우고, 자동차 엔진은 연소에서 동력을 얻는다.", "우리 몸의 세포 호흡까지 포함하면, 생명 활동과 문명의 에너지 대부분이 발열 반응에서 나오는 열과 동력에 기대고 있음을 알 수 있다."], "terms": [{"k": "손난로", "v": "철가루가 산소와 천천히 결합(산화)하며 내는 열을 이용하는 장치. 소금물과 활성탄이 반응을 돕는다."}, {"k": "생석회(산화 칼슘)", "v": "물과 만나면 많은 열을 내는 흰 고체. 발열 도시락과 습기 제거제에 쓰인다."}, {"k": "흔들면 빨라지는 이유", "v": "철가루가 공기(산소)와 닿는 면적이 넓어져 산화 반응이 빨라지기 때문이다."}], "myths": [{"x": "손난로 속 철가루는 반응하면서 환원된다.", "o": "산소와 결합하므로 <b>산화<\/b>된다 — 이 산화가 발열 반응이다."}, {"x": "손난로는 전기 에너지를 열로 바꾸는 장치다.", "o": "전기가 아니라 <b>화학 반응(철의 산화)의 열<\/b>을 이용한다."}], "point": "손난로 = 철 + 산소(산화), 발열 도시락 = 산화 칼슘 + 물, 연료의 연소 — 모두 발열 반응의 열을 이용한다.", "answers": "정답 ㉠ 산화 ㉡ 산화 칼슘 ㉢ 연소 — '철가루가 환원된다'로 바꾼 선지가 03과 연계되어 출제된다.", "blanks": {"㉠": "산화", "㉡": "산화 칼슘", "㉢": "연소"}, "warning": "'철가루가 환원된다'로 바꾼 선지가 03과 연계되어 출제된다.", "figure": {"caption": "발열 반응의 이용 — 손난로는 철의 산화열로 손을, 발열 도시락은 산화 칼슘과 물의 반응열로 음식을 데운다", "file": "figures/2105-03.svg"}}, {"id": "2105-04", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2105", "lessonName": "화학 변화와 에너지 출입", "no": "04", "title": "흡열 반응의 이용", "subtitle": "냉각 팩과 빵 굽기", "steps": [{"n": "①", "t": "순간 냉각 팩", "d": "{{㉠}}이 물과 만나 열을 흡수하며 차가워진다."}, {"n": "②", "t": "빵 굽기", "d": "<b>탄산수소 나트륨<\/b>이 열을 흡수하며 분해되어 기체를 낸다."}, {"n": "③", "t": "광합성", "d": "숲이 <b>빛에너지<\/b>를 흡수하여 포도당에 저장한다."}], "howto": [], "body": ["흡열 반응도 생활에 이용된다. 운동장 구급 가방에 든 <b>순간 냉각 팩<\/b>은 겉주머니를 꺾으면 안쪽의 물주머니가 터지면서 <b>질산 암모늄이 물과 만나(용해) 열을 흡수<\/b>하고, 팩은 몇 초 만에 차가워진다(①). 얼음 없이 만드는 얼음주머니로, 삔 발목의 부기를 가라앉히는 <b>냉찜질<\/b>에 바로 쓸 수 있다.", "그림 4의 두 장면은 차갑게 하는 것과 부풀리는 것으로 쓰임은 다르지만, 모두 반응이 <b>주위의 열을 흡수<\/b>하면서 일어난다는 점에서 같다.", "빵 반죽 속의 <b>베이킹 소다(탄산수소 나트륨)<\/b>는 오븐의 열을 흡수하며 분해되어 {{㉡}}를 내놓고, 이 기체 방울이 빵을 부풀린다(②). 열을 계속 공급해야 반응이 진행되는 흡열 반응의 성질이 그대로 나타난다.", "지구 전체에서 가장 큰 규모의 흡열 반응은 숲의 {{㉢}}이다(③). 식물은 태양의 빛에너지를 흡수하여 포도당에 저장하고, 우리는 그 저장된 에너지를 음식과 연료로 꺼내 쓴다. 흡열(저장)과 발열(사용)이 이어지는 거대한 에너지의 순환이다."], "terms": [{"k": "순간 냉각 팩", "v": "질산 암모늄이 물과 만나 열을 흡수하는 반응을 이용한 도구. 다친 직후의 냉찜질에 쓴다."}, {"k": "베이킹 소다", "v": "탄산수소 나트륨. 열을 흡수하며 분해되어 이산화 탄소를 내놓는다."}, {"k": "냉찜질", "v": "다친 직후 차갑게 하여 혈관을 수축시켜 부기와 통증을 줄이는 처치. 흡열 반응이 응급 처치에 쓰이는 예."}], "myths": [{"x": "광합성은 에너지를 방출하는 반응이다.", "o": "빛에너지를 <b>흡수·저장<\/b>하는 흡열 반응이다."}, {"x": "순간 냉각 팩은 발열 반응을 이용한 도구다.", "o": "질산 암모늄이 물과 만나 열을 <b>흡수<\/b>하는 <b>흡열 반응<\/b>을 이용한다."}], "point": "냉각 팩 = 질산 암모늄 + 물, 빵 굽기 = 탄산수소 나트륨의 열분해, 광합성 = 빛에너지의 저장 — 모두 열(에너지)을 흡수하는 반응의 이용이다.", "answers": "정답 ㉠ 질산 암모늄 ㉡ 이산화 탄소 ㉢ 광합성 — 냉각 팩 서술형은 '열 흡수'와 '온도 하강' 두 단어가 채점 기준이다.", "blanks": {"㉠": "질산 암모늄", "㉡": "이산화 탄소", "㉢": "광합성"}, "warning": "냉각 팩 서술형은 '열 흡수'와 '온도 하강' 두 단어가 채점 기준이다.", "figure": {"caption": "흡열 반응의 이용 — 냉각 팩은 발목의 열을 빼앗아 차갑게 하고, 오븐 속 탄산수소 나트륨은 열을 흡수하며 분해되어 빵을 부풀린다", "file": "figures/2105-04.svg"}}, {"id": "2105-05", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2105", "lessonName": "화학 변화와 에너지 출입", "no": "05", "title": "발열·흡열의 판정", "subtitle": "주위의 온도 변화", "steps": [{"n": "①", "t": "온도계를 놓는 곳", "d": "반응 자신이 아니라 {{㉠}}(용액·손·공기)의 온도를 잰다."}, {"n": "②", "t": "온도가 올라가면", "d": "반응이 열을 내놓은 것 — <b>발열 반응<\/b>."}, {"n": "③", "t": "온도가 내려가면", "d": "반응이 열을 가져간 것 — <b>흡열 반응<\/b>."}], "howto": ["컵 A에는 물에 <b>산화 칼슘<\/b>을, 컵 B에는 물에 <b>질산 암모늄<\/b>을 같은 시각에 넣었다. 두 컵의 물은 모두 처음 20 ℃였으며, 이 20 ℃가 점선으로 그은 <b>기준선<\/b>이다.", "가로축은 시간, 세로축은 물의 온도이다. 선이 기준선 <b>위<\/b>로 가면 물이 뜨거워진 것(발열), <b>아래<\/b>로 가면 차가워진 것(흡열)이다.", "반응 초반에 선이 가장 가파르다 — 반응이 가장 활발한 때이다. 시간이 지나면 반응이 끝나고, 두 컵 모두 주위와 열을 주고받으며 서서히 20 ℃로 되돌아간다.", "컵 A의 원리는 발열 도시락, 컵 B의 원리는 순간 냉각 팩이다. 한 그래프에서 두 도구의 원리를 함께 읽을 수 있다."], "body": ["발열 반응인지 흡열 반응인지 판정하는 도구는 <b>온도계 하나<\/b>이다. 이때 온도를 재는 것은 반응 자신이 아니라 <b>주위<\/b> — 반응 용기 속 용액, 그것을 쥔 손, 둘레의 공기 — 이다(①). 반응 전후에 주위의 온도가 올라가면 발열(②), 내려가면 흡열(③)이다.", "에너지의 출입은 눈에 보이지 않지만 <b>온도 곡선에는 그대로 드러난다<\/b>. 그림 5에서 처음 온도의 기준선 위로 가는 컵 A의 반응은 {{㉡}} 반응이고, 기준선 아래로 가는 컵 B의 반응은 {{㉢}} 반응이다. 시간이 지나 온도가 처음으로 되돌아오는 것은 반응이 계속되기 때문이 아니라, 반응이 끝난 뒤 주위와 열이 오가며 온도가 같아지기 때문이다.", "이것으로 I단원의 화학이 정리된다. 산소와 전자의 이동(03), 산과 염기의 중화(04), 그리고 열의 출입(05)까지 — <b>화학 변화에는 물질의 변화와 에너지의 출입이 언제나 함께 있다<\/b>."], "terms": [{"k": "판정의 기준", "v": "반응 자신이 아니라 주위(용액·손·공기)의 온도 변화. 올라가면 발열, 내려가면 흡열이다."}, {"k": "기준선", "v": "온도 곡선에서 반응 전의 처음 온도를 나타내는 선. 곡선이 이 선의 위로 가는지 아래로 가는지로 판정한다."}, {"k": "화학 변화와 에너지", "v": "화학 변화 = 물질의 변화 + 에너지의 출입. 두 가지는 항상 함께 일어난다."}], "myths": [{"x": "에너지 출입의 판정 기준은 반응 자신의 온도다.", "o": "온도계가 놓이는 <b>주위<\/b>의 온도 변화가 기준이다."}, {"x": "시간이 지나 온도가 되돌아오는 것은 반응이 계속되기 때문이다.", "o": "반응이 끝난 뒤 <b>주위와 열이 오가며<\/b> 온도가 같아지는 것이다."}], "point": "판정은 주위의 온도 변화 하나로 한다 — 올라가면 발열, 내려가면 흡열. 온도 곡선에서는 기준선 위가 발열, 아래가 흡열이다.", "answers": "정답 ㉠ 주위 ㉡ 발열 ㉢ 흡열 — 판정 기준을 '반응 자신의 온도'로 바꾼 선지가 오답이다.", "blanks": {"㉠": "주위", "㉡": "발열", "㉢": "흡열"}, "warning": "판정 기준을 '반응 자신의 온도'로 바꾼 선지가 오답이다.", "figure": {"caption": "두 컵의 온도 곡선과 판정의 기준 — 기준선 위로 가면 발열, 아래로 가면 흡열", "file": "figures/2105-05.svg"}}, {"id": "2201-01", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2201", "lessonName": "생태계의 구성과 상호 관계", "no": "01", "title": "생태계의 구성", "subtitle": "개체에서 생태계까지", "steps": [{"n": "①", "t": "개체와 개체군", "d": "생물 한 마리가 <b>개체<\/b>이고, 일정한 지역에 사는 같은 종의 개체들의 무리가 {{㉠}}이다."}, {"n": "②", "t": "군집", "d": "한 지역의 여러 개체군이 어울린 전체. 생물만의 모임이다."}, {"n": "③", "t": "생태계", "d": "생물 군집이 빛·물·흙과 같은 <b>비생물 환경<\/b>과 영향을 주고받는 시스템 전체."}], "howto": ["점선 상자는 안쪽에서 바깥쪽으로 커진다. 빨간 원 하나가 개체, 주황 상자가 개체군, 초록 상자가 군집, 그림 전체 테두리가 생태계다.", "주황 상자 안에는 붕어만 있다(같은 종). 초록 상자에는 붕어·수초·물벼룩이 함께 있지만 모두 살아 있는 것이다.", "가장 바깥 테두리에 와서야 햇빛·물·흙처럼 살아 있지 않은 것이 들어온다. 그래서 생태계는 군집과 다르다."], "body": ["연못을 예로 들어 생태계의 구성을 살펴보자. 붕어 한 마리는 <b>개체<\/b>이다. 그 연못에 사는 붕어 전체, 즉 일정한 지역에 사는 <b>같은 종<\/b>의 개체들의 무리를 <b>개체군<\/b>이라 한다. 붕어 개체군, 수초 개체군, 물벼룩 개체군처럼 <b>여러 개체군이 어울린 전체<\/b>를 <b>군집<\/b>이라 하며, 군집은 생물만의 모임이다. 이 군집이 물·햇빛·흙과 같은 <b>비생물 환경<\/b>과 서로 영향을 주고받는 시스템 전체가 <b>생태계<\/b>이다.", "생태계는 생물의 목록이 아니라, 생물과 환경이 서로 영향을 주고받는 <b>관계<\/b>의 체계이다. 따라서 생태계의 크기는 정해져 있지 않다. 연못 하나, 썩은 통나무 하나도 생태계가 될 수 있고, 지구 전체도 하나의 생태계로 볼 수 있다. 생태계를 정의하는 것은 크기가 아니라 관계이다.", "단계를 구분하는 기준을 정확히 한다. 같은 종의 무리가 개체군이고, 여러 개체군이 모인 {{㉡}}은 생물만으로 이루어진다. 여기에 물·햇빛·흙과 같은 {{㉢}} 환경이 더해져 상호 작용이 일어날 때 비로소 생태계가 된다."], "terms": [{"k": "개체군", "v": "일정한 지역에 사는 같은 종 개체들의 무리."}, {"k": "군집", "v": "한 지역의 여러 개체군 전체. 생물만의 모임으로, 비생물 환경은 포함하지 않는다."}, {"k": "생태계", "v": "생물 군집과 비생물 환경이 서로 영향을 주고받는 시스템 전체."}], "myths": [{"x": "군집에는 물·햇빛 같은 비생물 환경이 포함된다.", "o": "군집은 <b>생물만의 모임<\/b>이다. 환경까지 포함하면 생태계다."}, {"x": "개체군은 한 지역의 여러 종이 모인 무리다.", "o": "개체군은 <b>같은 종<\/b>의 무리다. 여러 종의 모임은 군집이다."}], "point": "개체 → 개체군(같은 종) → 군집(여러 종) → 생태계(생물 + 환경). 생태계를 정의하는 것은 크기가 아니라 생물과 환경의 관계이다.", "answers": "정답 ㉠ 개체군 ㉡ 군집 ㉢ 비생물 — 군집에 '환경'을 넣은 선지가 대표 오답이다.", "blanks": {"㉠": "개체군", "㉡": "군집", "㉢": "비생물"}, "warning": "군집에 '환경'을 넣은 선지가 대표 오답이다.", "figure": {"caption": "연못 생태계의 구성 — 붕어 한 마리(개체) → 붕어 전부(개체군) → 여러 개체군(군집) → 군집 + 햇빛·물·흙(생태계)", "file": "figures/2201-01.svg"}}, {"id": "2201-02", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2201", "lessonName": "생태계의 구성과 상호 관계", "no": "02", "title": "생물적 요인", "subtitle": "생산자·소비자·분해자", "steps": [{"n": "①", "t": "생산자", "d": "{{㉠}}으로 스스로 양분을 만든다. 식물·조류·식물 플랑크톤 — 양분의 입구."}, {"n": "②", "t": "소비자", "d": "다른 생물을 먹어 양분을 얻는다. 풀 → 메뚜기(1차) → 개구리(2차)로 이어진다."}, {"n": "③", "t": "분해자", "d": "죽은 생물·배설물을 분해해 물질을 <b>흙과 공기로 되돌린다<\/b>. 세균·곰팡이·버섯."}], "howto": [], "body": ["생태계의 생물적 요인은 양분을 얻는 방법에 따라 세 가지로 구분한다. <b>생산자<\/b>는 광합성으로 <b>스스로 양분을 만드는<\/b> 생물이다. 식물, 조류(藻類), 식물 플랑크톤이 여기에 속하며, 생태계로 들어오는 <b>모든 양분의 입구<\/b>가 된다. <b>소비자<\/b>는 다른 생물을 먹어 양분을 얻는 생물이다. 풀을 먹는 메뚜기는 1차 소비자, 메뚜기를 먹는 개구리는 2차 소비자이다. <b>분해자<\/b>는 세균·곰팡이·버섯처럼 죽은 생물과 배설물을 분해하여 양분을 얻는 생물이다. 그림 2의 흙 속 화살표처럼, 분해된 물질은 흙과 공기로 되돌아가 생산자가 다시 이용한다.", "분해자가 없다면 낙엽과 사체가 쌓이기만 하고, 그 속의 물질은 더 이상 생산자에게 돌아가지 못한다. 즉 분해자는 생태계의 <b>물질 순환<\/b>을 완성하는 역할을 한다. 생산자가 만들고, 소비자가 먹고, 분해자가 되돌리는 세 단계가 이어져야 순환이 닫힌다.", "세 구분을 판별하는 기준은 한 가지, <b>스스로 양분을 만드는가<\/b>이다. 버섯은 식물처럼 보이지만 광합성을 하지 못하므로 {{㉡}}이고, 물속의 식물 플랑크톤은 광합성을 하므로 {{㉢}}이다. 생김새나 크기가 아니라 양분을 얻는 방법으로 구분한다."], "terms": [{"k": "조류(藻類)", "v": "미역·다시마·식물 플랑크톤처럼 물속에서 광합성을 하는 생물. 생산자에 속한다."}, {"k": "버섯", "v": "곰팡이의 한 무리. 식물처럼 보이지만 광합성을 하지 못하는 분해자이다."}, {"k": "분해자", "v": "죽은 생물과 배설물을 분해해 양분을 얻으며, 물질을 흙과 공기로 되돌려 생산자가 다시 쓸 수 있게 하는 생물."}], "myths": [{"x": "버섯은 광합성으로 양분을 만드는 생산자다.", "o": "버섯은 광합성을 하지 못하는 <b>분해자<\/b>다."}, {"x": "식물 플랑크톤은 소비자다.", "o": "광합성을 하므로 <b>생산자<\/b>다."}], "point": "생산자는 스스로 만들고, 소비자는 먹어서 얻으며, 분해자는 물질을 흙과 공기로 되돌린다. 분해자가 있어야 물질 순환이 닫힌다.", "answers": "정답 ㉠ 광합성 ㉡ 분해자 ㉢ 생산자 — 판별 기준은 '스스로 양분을 만드는가' 하나다.", "blanks": {"㉠": "광합성", "㉡": "분해자", "㉢": "생산자"}, "warning": "판별 기준은 '스스로 양분을 만드는가' 하나다.", "figure": {"caption": "풀밭의 생물적 요인 — 풀(생산자)을 메뚜기·개구리(소비자)가 먹고, 죽은 생물을 버섯·세균(분해자)이 분해해 흙으로 되돌린다", "file": "figures/2201-02.svg"}}, {"id": "2201-03", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2201", "lessonName": "생태계의 구성과 상호 관계", "no": "03", "title": "비생물적 요인", "subtitle": "생물이 살아가는 환경", "steps": [{"n": "①", "t": "다섯 가지 요인", "d": "빛·온도·물·토양·공기처럼 살아 있지 않은 환경 요인을 {{㉠}} 요인이라 한다."}, {"n": "②", "t": "빛과 온도", "d": "빛은 광합성의 에너지원이자 개화·번식 시기의 신호, 온도는 몸속 화학 반응의 속도를 좌우한다."}, {"n": "③", "t": "물·토양·공기", "d": "물은 생명 활동의 용매, 토양은 터전, 공기는 <b>산소와 이산화 탄소<\/b>를 공급한다."}], "howto": [], "body": ["생태계의 구성 요소 가운데 살아 있지 않은 것을 <b>비생물적 요인<\/b>이라 한다. <b>빛·온도·물·토양·공기<\/b>가 대표적이며, 이들이 생물이 살아가는 환경을 이룬다. <b>빛<\/b>은 광합성의 에너지원이며, 하루 중 해가 비추는 시간인 <b>일조 시간<\/b>은 식물의 개화와 동물의 번식 시기를 알리는 신호가 된다. <b>온도<\/b>는 생물의 몸속에서 일어나는 화학 반응의 속도를 좌우하므로, 계절에 따라 생물의 모습이 달라진다.", "<b>물<\/b>은 생명 활동의 용매이다. 몸속의 화학 반응은 대부분 물에 녹은 상태에서 일어나며, 물이 부족한 곳의 생물은 물을 지키는 형태를 갖는다. <b>토양<\/b>은 식물의 터전이자 수많은 미생물이 사는 곳이고, <b>공기<\/b>는 호흡에 필요한 산소와 광합성에 필요한 이산화 탄소를 공급한다.", "환경이 달라지면 그곳에 사는 생물도 달라진다. 사막·극지·심해의 생물이 서로 다른 까닭은 이 다섯 요인의 조건이 다르기 때문이다. 요인을 분류할 때의 기준은 <b>살아 있는가<\/b>이다. 붓꽃과 코스모스의 개화 시기를 가르는 일조 시간은 {{㉡}}의 조건이고, 세균은 크기가 작아도 살아 있으므로 비생물적 요인이 아니라 {{㉢}} 요인(분해자)에 속한다."], "terms": [{"k": "비생물적 요인", "v": "빛·온도·물·토양·공기처럼 생태계를 이루는 살아 있지 않은 환경 요인."}, {"k": "일조 시간", "v": "하루 중 해가 비추는 시간. 붓꽃과 코스모스의 개화 시기가 다른 원인이다."}, {"k": "용매로서의 물", "v": "몸속의 화학 반응은 대부분 물에 녹은 상태에서 일어난다. 물은 생명 활동의 바탕이 되는 용매이다."}], "myths": [{"x": "세균은 크기가 작으므로 비생물적 요인이다.", "o": "작아도 살아 있으면 <b>생물적 요인<\/b>이다. 세균은 분해자다."}, {"x": "빛은 광합성에만 관여한다.", "o": "일조 시간은 <b>개화·번식 시기<\/b>를 알리는 신호이기도 하다."}], "point": "비생물적 요인 = 빛·온도·물·토양·공기, 생물적 요인 = 생산자·소비자·분해자. 분류의 기준은 살아 있는가이다.", "answers": "정답 ㉠ 비생물적 ㉡ 빛 ㉢ 생물적 — \"세균은 비생물적 요인이다\"가 대표 함정이다.", "blanks": {"㉠": "비생물적", "㉡": "빛", "㉢": "생물적"}, "warning": "\"세균은 비생물적 요인이다\"가 대표 함정이다.", "figure": {"caption": "비생물적 요인 다섯 가지 — 햇빛(빛), 온도, 비와 연못(물), 뿌리와 미생물이 사는 흙(토양), 나무가 주고받는 산소·이산화 탄소(공기)", "file": "figures/2201-03.svg"}}, {"id": "2201-04", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2201", "lessonName": "생태계의 구성과 상호 관계", "no": "04", "title": "환경이 생물에 미치는 영향", "subtitle": "적응", "steps": [{"n": "①", "t": "온도", "d": "사막여우는 <b>큰 귀<\/b>로 열을 내보내고, 북극여우는 <b>작은 귀<\/b>로 열 손실을 줄인다. 겨울잠·낙엽·철새의 이동도 온도에 대한 적응."}, {"n": "②", "t": "빛", "d": "강한 빛을 받는 양엽은 두껍고, 그늘의 음엽은 넓고 얇다."}, {"n": "③", "t": "물", "d": "선인장은 잎을 {{㉠}}로 바꾸어 수분 증발을 줄이고 줄기에 물을 저장한다."}], "howto": [], "body": ["환경은 생물의 형태와 생활 방식을 바꾼다. 먼저 <b>온도<\/b>의 영향을 보자. 더운 사막에 사는 사막여우는 <b>큰 귀<\/b>로 몸의 열을 내보내고, 추운 북극에 사는 북극여우는 <b>작은 귀<\/b>로 열 손실을 줄인다. 같은 여우이지만 사는 곳의 온도가 다르기 때문에 귀의 크기가 다르다. 곰의 겨울잠, 나무의 낙엽, 철새의 이동도 온도 변화에 대한 적응이다.", "<b>빛<\/b>의 영향은 잎의 모양에서 확인된다. 강한 빛을 받는 <b>양엽<\/b>은 두껍고, 그늘에서 자라는 <b>음엽<\/b>은 넓고 얇아 약한 빛을 최대한 받아들인다. 같은 나무에서도 볕이 드는 쪽과 그늘진 쪽의 잎이 다르다.", "<b>물<\/b>의 영향으로 선인장은 잎을 가시로 바꾸어 수분 증발을 줄이고 줄기에 물을 저장한다. 우거진 숲의 <b>층상 구조<\/b>도 빛의 영향이다. 위층의 나무가 빛을 먼저 가로채므로 아래로 갈수록 빛이 줄어들고, 교목·관목·풀·이끼가 각 층의 빛에 맞는 잎을 가지고 산다.", "이러한 적응은 하루아침에 이루어진 것이 아니다. 유리한 변이가 세대를 거치며 선택된 {{㉡}}의 결과이다(I단원). 사례와 요인을 짝지으면 여우의 귀·겨울잠·낙엽은 온도, 양엽과 음엽·개화 시기·층상 구조는 {{㉢}}, 선인장의 가시는 물에 대한 적응이다."], "terms": [{"k": "양엽과 음엽", "v": "같은 나무에서도 볕이 드는 쪽의 잎은 두껍고, 그늘진 쪽의 잎은 넓고 얇다. 빛에 맞춘 잎의 형태."}, {"k": "겨울잠", "v": "먹이가 부족하고 추운 겨울에 체온과 대사를 낮추어 에너지를 아끼는 온도에 대한 적응."}, {"k": "층상 구조", "v": "숲에서 교목·관목·풀·이끼가 높이에 따라 층을 이루는 구조. 층을 나누는 요인은 빛이다."}], "myths": [{"x": "강한 빛을 받는 양엽은 음엽보다 얇다.", "o": "양엽은 <b>두껍고<\/b>, 음엽이 넓고 얇다."}, {"x": "선인장의 가시는 낮은 온도에 대한 적응이다.", "o": "<b>물 부족<\/b>에 대한 적응이다. 온도 적응은 여우의 귀·겨울잠·낙엽."}], "point": "여우의 귀·겨울잠·낙엽 = 온도, 양엽과 음엽·개화 시기·층상 구조 = 빛, 선인장의 가시 = 물. 모든 적응은 자연선택의 결과이다.", "answers": "정답 ㉠ 가시 ㉡ 자연선택 ㉢ 빛 — \"양엽이 음엽보다 얇다\"는 뒤집기 함정이다.", "blanks": {"㉠": "가시", "㉡": "자연선택", "㉢": "빛"}, "warning": "\"양엽이 음엽보다 얇다\"는 뒤집기 함정이다.", "figure": {"caption": "온도에 대한 적응 — 더운 사막의 사막여우는 큰 귀로 열을 내보내고(물결 화살표), 추운 북극의 북극여우는 작은 귀와 둥근 몸으로 열 손실을 줄인다", "file": "figures/2201-04.svg"}}, {"id": "2201-05", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2201", "lessonName": "생태계의 구성과 상호 관계", "no": "05", "title": "생물이 환경에 미치는 영향", "subtitle": "상호 관계의 완성", "steps": [{"n": "①", "t": "대기의 변화", "d": "광합성 생물이 대기에 {{㉠}}를 채우고 오존층을 만들어 지구 환경을 바꾸었다(I단원)."}, {"n": "②", "t": "토양과 숲의 변화", "d": "지렁이는 토양의 통기성을 높이고, 숲은 그늘과 증산으로 둘레의 온도·습도를 조절한다."}, {"n": "③", "t": "쌍방향의 관계", "d": "환경 → 생물은 <b>적응<\/b>, 생물 → 환경은 <b>개조<\/b>. 두 화살표가 함께 생태계의 관계를 이룬다."}], "howto": [], "body": ["생물과 환경 사이의 영향은 한 방향으로만 흐르지 않는다. 생물이 환경을 바꾼 가장 큰 사건은 통합과학 2의 첫 부분에서 배운 산소 대기의 형성이다. 광합성 생물이 대기에 <b>산소<\/b>를 채우고 <b>오존층<\/b>을 만들어 지구의 환경 자체를 바꾸었다(I-01·I-03). 작은 규모의 변화는 매일 일어난다. <b>지렁이<\/b>는 흙을 헤집어 토양의 통기성을 높이고 배설물로 토양을 비옥하게 하며, <b>숲<\/b>은 그늘과 증산 작용으로 둘레의 온도와 습도를 조절하고, <b>낙엽<\/b>은 분해되어 토양의 양분이 된다.", "숲의 층상 구조에서도 두 방향을 모두 읽을 수 있다. 빛이 층을 나누는 것은 환경 → 생물의 방향이지만, 층상 구조 자체가 숲 내부의 빛·온도·습도를 다시 바꾸어 숲 바닥을 서늘하고 축축하게 만드는 것은 생물 → 환경의 방향이다.", "이처럼 생태계의 관계는 두 화살표로 완성된다. 환경 → 생물의 방향이 <b>적응<\/b>이라면, 생물 → 환경의 방향은 {{㉡}}이다. 일조 시간이 개화 시기를 결정하는 것은 환경 → 생물이고, 광합성이 대기의 산소 농도를 높이는 것은 생물 → 환경이다. 사례를 판단할 때는 화살표의 방향을 먼저 정한다. 이 {{㉢}} 관계의 균형이 어떻게 유지되는지는 다음 소단원, 생태계 평형에서 다룬다."], "terms": [{"k": "증산", "v": "식물이 잎을 통해 물을 수증기로 내보내는 작용. 숲이 둘레의 온도와 습도를 조절하는 원인이다."}, {"k": "산소 대기의 기원", "v": "남세균의 광합성이 만든 산소가 대기에 쌓인 사건. 생물이 지구 환경을 바꾼 가장 큰 예(I단원)."}, {"k": "상호 관계", "v": "환경이 생물에 영향을 주고(적응), 생물이 환경을 바꾸는(개조) 쌍방향의 관계."}], "myths": [{"x": "생물과 환경의 영향은 환경에서 생물로, 한 방향으로만 흐른다.", "o": "산소 대기·지렁이·숲처럼 <b>생물도 환경을 바꾼다<\/b>. 화살표는 쌍방향이다."}, {"x": "비생물적 요인은 생물의 영향을 받지 않는다.", "o": "광합성이 대기의 조성을 바꾼 것처럼 <b>비생물적 요인도 생물의 영향을 받는다<\/b>."}], "point": "환경 → 생물은 적응, 생물 → 환경은 개조. 생태계의 상호 관계는 언제나 쌍방향이며, 사례 문제는 화살표의 방향을 먼저 정해 푼다.", "answers": "정답 ㉠ 산소 ㉡ 개조 ㉢ 쌍방향 — '한 방향 화살표'로 서술한 선지는 모두 오답이다.", "blanks": {"㉠": "산소", "㉡": "개조", "㉢": "쌍방향"}, "warning": "'한 방향 화살표'로 서술한 선지는 모두 오답이다.", "figure": {"caption": "생물이 환경을 바꾼다 — 남세균의 광합성이 산소 대기와 오존층을 만들고, 숲이 그늘과 증산으로 온도·습도를 바꾸며, 낙엽과 지렁이가 토양을 바꾼다", "file": "figures/2201-05.svg"}}, {"id": "2202-01", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2202", "lessonName": "생태계 평형", "no": "01", "title": "먹이 사슬과 먹이 그물", "subtitle": "얽힐수록 안정되는 관계", "steps": [{"n": "①", "t": "먹이 사슬", "d": "벼 → 메뚜기 → 개구리 → 뱀 → 매처럼 {{㉠}}에서 최종 소비자까지 한 줄로 이은 것."}, {"n": "②", "t": "먹이 그물", "d": "실제 생태계에서는 여러 먹이 사슬이 <b>그물처럼 얽혀<\/b> 있다."}, {"n": "③", "t": "그물의 안정성", "d": "한 종이 줄어도 포식자가 다른 먹이를 택할 수 있어 충격이 분산된다."}], "howto": [], "body": ["생태계의 생물들은 먹고 먹히는 관계로 이어져 있다. 그림 1의 굵은 화살표처럼 벼 → 메뚜기 → 개구리 → 뱀 → 매, 곧 <b>생산자에서 최종 소비자까지 한 줄로 이은 것<\/b>을 <b>먹이 사슬<\/b>이라 한다. 화살표는 먹히는 생물에서 먹는 생물 쪽으로 향하며, 먹이 사슬의 출발점은 언제나 양분을 스스로 만드는 <b>생산자<\/b>이다.", "그러나 실제 생태계에서 메뚜기는 벼만 먹지 않고 옥수수도 먹으며, 올빼미는 메뚜기와 들쥐를 모두 먹는다. 그림 1의 가는 화살표까지 모두 합치면 여러 먹이 사슬이 서로 얽혀 그물 모양을 이루는데, 이것이 자연의 실제 모습이다.", "여러 먹이 사슬이 그물처럼 얽힌 관계망을 {{㉡}}이라 한다. 먹이 관계가 복잡하게 얽힌 그물일수록 생태계는 {{㉢}}이다. 한 줄로 이어진 사슬에서는 고리 하나가 끊기면 그 위의 단계가 모두 영향을 받지만, 그물에서는 한 종이 줄어도 그 종을 먹던 포식자가 <b>다른 먹이를 택할 수 있어<\/b> 충격이 여러 갈래로 분산되기 때문이다. 그림 1에서 메뚜기가 줄어도 올빼미는 들쥐를 먹을 수 있는 것이 그 예이다. '복잡할수록 불안정하다'는 직관과 반대로, 생태계에서는 복잡한 먹이 그물이 곧 튼튼한 안전망이 된다."], "terms": [{"k": "먹이 사슬", "v": "먹고 먹히는 관계를 한 줄로 나타낸 것. 화살표는 '먹히는 생물 → 먹는 생물'의 방향이다."}, {"k": "먹이 그물", "v": "여러 먹이 사슬이 서로 얽힌 실제 관계망. 복잡할수록 생태계가 안정된다."}, {"k": "생산자", "v": "양분을 스스로 만드는 생물. 먹이 사슬의 출발점이며 생태 피라미드의 맨 아래 단계다."}], "myths": [{"x": "먹이 사슬의 화살표는 먹는 생물에서 먹히는 생물로 향한다.", "o": "<b>먹히는 생물 → 먹는 생물<\/b>이다. 화살표는 양분이 옮겨 가는 방향이다."}, {"x": "먹이 그물이 단순할수록 생태계는 안정적이다.", "o": "<b>복잡할수록<\/b> 안정적이다. 끊긴 줄을 다른 줄이 받쳐 준다."}], "point": "사슬은 한 줄, 그물은 얽힌 여러 줄이다. 먹이 그물이 복잡할수록 한 종의 변화가 여러 갈래로 분산되어 생태계가 안정된다.", "answers": "정답 ㉠ 생산자 ㉡ 먹이 그물 ㉢ 안정적 — '그물이 단순할수록 안정'으로 뒤집은 선지가 단골 오답이다.", "blanks": {"㉠": "생산자", "㉡": "먹이 그물", "㉢": "안정적"}, "warning": "'그물이 단순할수록 안정'으로 뒤집은 선지가 단골 오답이다.", "figure": {"caption": "논과 들판의 먹이 관계 — 굵은 화살표 한 줄이 먹이 사슬, 얽힌 화살표 전체가 먹이 그물이다", "file": "figures/2202-01.svg"}}, {"id": "2202-02", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2202", "lessonName": "생태계 평형", "no": "02", "title": "생태 피라미드", "subtitle": "위로 갈수록 좁아지는 이유", "steps": [{"n": "①", "t": "영양 단계", "d": "생산자, 1차 소비자, 2차 소비자처럼 먹이 사슬에서 같은 위치에 있는 생물들의 층을 {{㉠}}라 한다."}, {"n": "②", "t": "생태 피라미드", "d": "각 단계의 <b>개체 수·생물량·에너지양<\/b>을 아래부터 쌓아 올리면 피라미드 모양이 된다."}, {"n": "③", "t": "에너지의 손실", "d": "각 단계가 에너지의 대부분을 호흡과 생명 활동에 쓰므로 위로 갈수록 줄어든다."}], "howto": ["층 하나가 영양 단계 하나다. 맨 아래가 생산자(벼), 그 위가 1차 소비자(메뚜기), 2차 소비자(개구리), 맨 위가 최종 소비자(매)다 — 먹이 사슬의 순서를 아래에서 위로 쌓은 것이다.", "층의 가로 폭이 그 단계의 크기다. 개체 수(마릿수)로 재든, 생물량(생물의 총 무게)으로 재든, 에너지양으로 재든 위로 갈수록 폭이 좁아진다.", "오른쪽 주황색 광선이 위로 전달되는 에너지다. 층을 하나 지날 때마다 붉은 물결 화살표(열)만큼 빠져나가므로 광선이 점점 가늘어지고, 맨 위에는 일부만 도착한다."], "body": ["먹이 사슬에서 생산자, 1차 소비자, 2차 소비자와 같이 같은 위치에 있는 생물들의 층을 <b>영양 단계<\/b>라 한다. 각 영양 단계의 <b>개체 수·생물량·에너지양<\/b>을 아래 단계부터 차례로 쌓아 올리면 대체로 피라미드 모양이 되는데, 이를 <b>생태 피라미드<\/b>라 한다. 안정된 생태계에서는 위 영양 단계로 갈수록 개체 수도, 생물량도, 에너지양도 줄어든다.", "위로 갈수록 줄어드는 까닭은 에너지가 단계를 거칠 때마다 손실되기 때문이다. 메뚜기는 벼에게서 얻은 에너지의 대부분을 {{㉡}}과 생명 활동에 사용하고, 개구리에게 전달되는 것은 그중 일부뿐이다. 호흡은 I단원에서 배운 <b>발열 반응<\/b>으로, 얻은 에너지의 상당 부분이 이 과정에서 열로 빠져나간다.", "단계를 오를 때마다 에너지가 크게 줄어들므로 위 단계는 아래 단계보다 클 수 없다. 따라서 안정된 생태계에서는 위 단계로 갈수록 개체 수·{{㉢}}·에너지양이 모두 줄어든다. 매 한 마리를 떠받치는 데 넓은 논 전체가 필요한 것도, 먹이 사슬의 길이에 한계가 있는 것도 같은 이유이다."], "terms": [{"k": "영양 단계", "v": "먹이 사슬에서 같은 위치에 있는 생물들의 층. 생산자, 1차 소비자, 2차 소비자, 최종 소비자 등."}, {"k": "생물량", "v": "한 영양 단계에 속한 생물의 총량(무게). 개체 수·에너지양과 함께 생태 피라미드를 만드는 재료다."}, {"k": "생태 피라미드", "v": "영양 단계별 개체 수·생물량·에너지양을 아래부터 쌓아 올린 그림. 안정된 생태계에서는 위로 갈수록 좁아진다."}], "myths": [{"x": "위 영양 단계로 갈수록 에너지양이 많아진다.", "o": "<b>줄어든다<\/b>. 단계마다 에너지가 손실되기 때문이다."}, {"x": "각 단계는 받은 에너지를 전부 위 단계로 전달한다.", "o": "대부분을 <b>호흡 등으로 소비<\/b>하고 일부만 전달한다."}], "point": "생태 피라미드가 위로 갈수록 좁아지는 원인은 에너지의 손실이다. 각 단계가 에너지 대부분을 호흡과 생명 활동에 쓰고 일부만 전달하므로, 먹이 사슬은 무한히 길어질 수 없다.", "answers": "정답 ㉠ 영양 단계 ㉡ 호흡 ㉢ 생물량 — '위로 갈수록 에너지양이 많아진다'가 기본 함정, 심화형은 '왜 줄어드는가'를 묻는다.", "blanks": {"㉠": "영양 단계", "㉡": "호흡", "㉢": "생물량"}, "warning": "'위로 갈수록 에너지양이 많아진다'가 기본 함정, 심화형은 '왜 줄어드는가'를 묻는다.", "figure": {"caption": "생태 피라미드와 에너지의 흐름 — 각 단계에서 열이 빠져나가므로 위층은 아래층보다 작다", "file": "figures/2202-02.svg"}}, {"id": "2202-03", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2202", "lessonName": "생태계 평형", "no": "03", "title": "생태계 평형", "subtitle": "흔들려도 되돌아오는 조절 작용", "steps": [{"n": "①", "t": "1차 소비자의 급증", "d": "어떤 원인으로 메뚜기(1차 소비자)가 갑자기 늘어난다."}, {"n": "②", "t": "위아래 단계의 반응", "d": "먹이인 벼(생산자)는 줄고, 천적인 개구리(2차 소비자)는 {{㉠}}한다."}, {"n": "③", "t": "평형의 회복", "d": "먹이 부족과 천적 증가로 메뚜기가 다시 줄고, 벼와 개구리도 원래 수준으로 돌아온다."}], "howto": ["세 장면은 같은 논을 시간 순서로 그린 것이다. 왼쪽 ①에서 시작해 화살표를 따라 ② → ③으로 읽는다.", "장면마다 위에서부터 개구리(2차 소비자) · 메뚜기(1차 소비자) · 벼(생산자)가 있다. 그려진 마릿수와 벼의 포기 수가 그 시점의 개체 수다 — 잘린 밑동은 메뚜기에게 먹힌 벼다.", "▲는 늘어남, ▼는 줄어듦, —는 원래 수준이다. ②에서 벼는 먹혀서 줄고 개구리는 먹이가 많아 늘어난 것을 눈으로 확인한다."], "body": ["<b>생태계 평형<\/b>이란 생태계를 이루는 생물의 종류와 개체 수, 물질과 에너지의 흐름이 <b>크게 변하지 않고 유지되는 상태<\/b>를 말한다. 이는 모든 것이 멈추어 있다는 뜻이 아니다. 어떤 원인으로 개체 수가 흔들리더라도 다시 원래 상태로 되돌아오는 능력이 평형의 본질이며, 이 복원력은 먹이 관계 속에 들어 있다.", "그림 3처럼 1차 소비자인 메뚜기가 갑자기 늘어났다고 하자. 먼저 메뚜기의 먹이인 벼(생산자)는 <b>줄어들고<\/b>, 메뚜기를 먹는 개구리(2차 소비자)는 먹이가 많아져 <b>늘어난다<\/b>. 그러면 메뚜기는 먹이가 부족해지고 {{㉡}}은 많아졌으므로 다시 줄어든다. 메뚜기가 줄면 벼는 회복되고 개구리도 원래 수준으로 돌아와 평형이 회복된다.", "이처럼 어느 한 영양 단계가 흔들려도 위아래 단계가 함께 반응하여 되돌려 놓는 작용이 생태계에 내장된 <b>자동 조절 장치<\/b>이다. 생태계 평형은 정지 상태가 아니라, 흔들려도 되돌아오는 {{㉢}}을 갖춘 상태이다. 다만 이 조절 작용에는 한계가 있으며, 이는 개념 04에서 다룬다."], "terms": [{"k": "생태계 평형", "v": "생물의 종류와 개체 수, 물질과 에너지의 흐름이 크게 변하지 않고 안정적으로 유지되는 상태."}, {"k": "천적", "v": "어떤 생물을 잡아먹는 상위 포식자. 급증한 생물을 다시 줄이는 평형 조절의 제동 장치 역할을 한다."}, {"k": "복원력", "v": "개체 수가 흔들려도 먹이 관계를 통해 원래 상태로 되돌아오는 능력. 생태계 평형의 본질이다."}], "myths": [{"x": "1차 소비자가 급증하면 2차 소비자는 감소한다.", "o": "먹이가 많아져 <b>일시적으로 증가<\/b>한다. 감소하는 것은 생산자다."}, {"x": "생태계 평형은 개체 수가 변하지 않는 정지 상태다.", "o": "흔들려도 <b>되돌아오는 상태<\/b>다. 개체 수는 일시적으로 변한다."}], "point": "1차 소비자 증가 → 생산자 감소·2차 소비자 증가 → 1차 소비자 감소 → 회복. 각 단계에서 누가 늘고 누가 주는지를 순서대로 서술한다.", "answers": "정답 ㉠ 증가 ㉡ 천적 ㉢ 복원력 — '생산자 증가·2차 소비자 감소'처럼 방향을 뒤집은 선지가 최다 오답이다.", "blanks": {"㉠": "증가", "㉡": "천적", "㉢": "복원력"}, "warning": "'생산자 증가·2차 소비자 감소'처럼 방향을 뒤집은 선지가 최다 오답이다.", "figure": {"caption": "같은 논을 시간 순서로 본 세 장면 — 급증한 메뚜기를 먹이 부족과 천적 증가가 함께 되돌린다", "file": "figures/2202-03.svg"}}, {"id": "2202-04", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2202", "lessonName": "생태계 평형", "no": "04", "title": "평형의 파괴", "subtitle": "복원력의 한계를 넘는 충격", "steps": [{"n": "①", "t": "복원력의 한계", "d": "자동 조절 작용은 만능이 아니다. <b>한계를 넘는 충격<\/b>이 오면 평형이 깨진다."}, {"n": "②", "t": "자연적 원인", "d": "홍수·가뭄·산불·화산 폭발과 같은 자연재해."}, {"n": "③", "t": "인위적 원인", "d": "서식지 파괴, {{㉠}}, 외래종 유입, 환경 오염 — 오늘날 가장 큰 충격은 인간 활동이다."}], "howto": [], "body": ["생태계의 자동 조절 작용은 만능이 아니다. <b>복원력의 한계<\/b>를 넘는 충격이 가해지면 평형은 깨진다. 홍수·가뭄·산불·화산 폭발과 같은 <b>자연재해<\/b>도 원인이 되지만, 오늘날 가장 큰 충격은 <b>인간 활동<\/b>이다.", "그림 4는 그 네 가지를 한 장면에 담았다. 왼쪽에서는 도로가 숲을 둘로 갈라 사슴이 건너지 못한다 — <b>서식지의 파괴·단절<\/b>이다. 공장의 매연과 폐수는 <b>환경 오염<\/b>으로 생물이 사는 환경 자체를 바꾸고, 그물로 물고기를 한꺼번에 잡는 <b>남획<\/b>은 먹이 그물을 이루는 한 종을 통째로 없앤다. 오른쪽의 큰 물고기처럼 새로 들어온 <b>외래종<\/b>은 기존의 먹이 그물을 교란한다. 여기에 기후변화(소단원 03)가 더해진다.", "특히 위험한 것이 {{㉡}}의 제거이다. 20세기 초 미국 옐로스톤 국립공원에서 늑대를 모두 없애자, 천적이 사라진 사슴 무리(엘크)가 {{㉢}}하여 어린 나무를 먹어 치웠고, 숲과 강기슭이 무너지면서 다른 생물들까지 연쇄적으로 피해를 입었다. 먹이 그물 꼭대기의 한 종이 그물 전체를 지탱하고 있었던 것이다.", "1995년 늑대를 다시 방사하자 엘크가 줄고 강가에 머물지 못하게 되면서 버드나무와 사시나무가 회복되었고, 비버와 새가 늘어 물길까지 안정되었다. 그물 꼭대기의 한 종이 바뀌면 그 영향은 <b>여러 영양 단계를 타고 연쇄적으로<\/b> 전달되며, 나무가 돌아오자 비버가 둑을 지어 물길을 바꾼 것은 <b>생물이 환경에 영향을 주는<\/b> 예이다. 복원은 가능했지만 약 70년이 걸렸다."], "terms": [{"k": "외래종", "v": "원래 살지 않던 곳에 들어온 종. 천적이 없으면 급증하여 기존의 먹이 그물을 교란한다."}, {"k": "최상위 포식자", "v": "먹이 그물 꼭대기의 종. 수는 적어도 아래 단계 전체의 개체 수를 조절하며 그물을 지탱한다."}, {"k": "남획", "v": "특정 생물을 지나치게 많이 잡아 한 종을 급감시키는 것. 먹이 그물의 한 매듭을 통째로 없앤다."}], "myths": [{"x": "생태계는 어떤 충격에도 스스로 회복한다.", "o": "복원력에는 <b>한계<\/b>가 있다. 한계를 넘는 충격이 오면 평형이 깨진다."}, {"x": "늑대가 늘어나면 강가의 식물이 줄어든다.", "o": "늑대 ▲ → 엘크 ▼ → 식물 <b>▲<\/b>. 한 칸 건너뛴 방향 착오에 주의한다."}], "point": "평형을 깨뜨리는 인위적 원인은 서식지 파괴·남획·외래종·환경 오염의 네 가지다. 최상위 포식자가 사라지면 초식 동물 급증 → 식물 황폐화 → 연쇄 붕괴의 순서로 위에서 아래로 무너진다.", "answers": "정답 ㉠ 남획 ㉡ 최상위 포식자 ㉢ 급증 — 옐로스톤 연쇄는 늑대 ▲ → 엘크 ▼ → 식물 ▲ → 비버 ▲, 한 칸 건너뛴 방향 착오가 대표 함정이다.", "blanks": {"㉠": "남획", "㉡": "최상위 포식자", "㉢": "급증"}, "warning": "옐로스톤 연쇄는 늑대 ▲ → 엘크 ▼ → 식물 ▲ → 비버 ▲, 한 칸 건너뛴 방향 착오가 대표 함정이다.", "figure": {"caption": "한 지역에서 동시에 일어나는 네 가지 인간 활동 — 서식지 파괴 · 환경 오염 · 남획 · 외래종 유입", "file": "figures/2202-04.svg"}}, {"id": "2202-05", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2202", "lessonName": "생태계 평형", "no": "05", "title": "생태계 보전", "subtitle": "잇고, 지키고, 되살리고, 함께 결정한다", "steps": [{"n": "①", "t": "잇는다", "d": "도로 등으로 끊긴 서식지를 {{㉠}}로 이어 야생동물이 오가게 한다."}, {"n": "②", "t": "지키고 되살린다", "d": "<b>보호 구역·국립공원<\/b> 지정, 사라진 종의 <b>복원 사업<\/b>, 생태 하천 복원."}, {"n": "③", "t": "함께 결정한다", "d": "개발·보전·생계가 얽힌 문제이므로 자료에 근거해 토론하고 협력적으로 소통한다."}], "howto": [], "body": ["생태계 평형의 보전은 기술이자 약속이다. 그림 5의 왼쪽처럼 도로로 끊긴 서식지는 <b>생태 통로<\/b>로 잇는다. 생태 통로는 도로 위를 가로지르는 야생동물의 다리로, 우리나라 고속도로에도 설치되어 있다. 훼손이 심한 곳은 <b>보호 구역·국립공원<\/b>으로 지정하여 생태계가 회복할 시간을 확보하고, 사라지거나 줄어든 종을 되살리는 <b>복원 사업<\/b>(반달가슴곰·여우 복원 등)과 훼손된 하천을 되살리는 <b>생태 하천 복원<\/b>이 이어진다.", "생태계 보전의 마지막 열쇳말은 {{㉡}}이다. 생태계 문제는 한 사람의 정답으로 해결되는 것이 아니라 개발·보전·생계 등 <b>여러 이해가 얽힌 사회적 결정<\/b>이기 때문이다. 그림 5의 오른쪽처럼 자료에 근거하여 토론하고 함께 결정하는 것까지가 과학의 일이다. 개인의 실천(소비·분리배출)과 제도(보호 구역·규제)가 만나야 먹이 그물은 지켜진다.", "이 소단원을 한 줄로 정리하면 다음과 같다. 먹이 그물이 복잡할수록 생태계는 안정되고, 생태 피라미드는 에너지 손실 때문에 위로 갈수록 좁아진다. 평형은 흔들려도 되돌아오는 복원력을 갖지만 그 {{㉢}}를 넘는 충격이 오면 깨지며, 서식지 파괴·남획·외래종·환경 오염이라는 네 원인에 맞서 잇고 지키고 되살리는 보전 기술이 있다."], "terms": [{"k": "생태 통로", "v": "도로 등으로 끊긴 서식지를 이어 야생동물이 오갈 수 있게 만든 길. 우리나라 고속도로에도 설치되어 있다."}, {"k": "복원 사업", "v": "사라지거나 줄어든 종과 서식지를 되살리는 일. 지리산 반달가슴곰 복원이 대표적이다."}, {"k": "협력적 소통", "v": "개발·보전·생계가 얽힌 생태계 문제를 자료에 근거해 토론하고 함께 결정하는 과정."}], "myths": [{"x": "보호 구역 지정은 생태계 회복에 도움이 되지 않는다.", "o": "훼손된 곳이 <b>회복할 시간<\/b>을 벌어 주는 보전 기술이다."}, {"x": "생태계 보전은 과학자만의 문제다.", "o": "과학 자료와 <b>사회적 소통<\/b>이 함께 필요한 문제다."}], "point": "잇고(생태 통로), 지키고(보호 구역·국립공원), 되살린다(복원 사업·생태 하천). 여기에 자료에 근거한 협력적 소통이 더해져야 생태계 평형이 지켜진다.", "answers": "정답 ㉠ 생태 통로 ㉡ 협력적 소통 ㉢ 한계 — 생태 통로가 '끊긴 서식지를 잇는' 시설이라는 점과 복원력에 한계가 있다는 점이 함께 출제된다.", "blanks": {"㉠": "생태 통로", "㉡": "협력적 소통", "㉢": "한계"}, "warning": "생태 통로가 '끊긴 서식지를 잇는' 시설이라는 점과 복원력에 한계가 있다는 점이 함께 출제된다.", "figure": {"caption": "생태계 평형을 지키는 기술 — 생태 통로 · 보호 구역 · 복원 사업 · 협력적 소통을 한 장면에 담았다", "file": "figures/2202-05.svg"}}, {"id": "2203-01", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2203", "lessonName": "지구온난화와 기후변화", "no": "01", "title": "온실효과", "subtitle": "대기의 보온 작용", "steps": [{"n": "①", "t": "태양 복사의 흡수", "d": "태양 에너지는 주로 <b>가시광선<\/b>의 형태로 들어와 지표를 데운다."}, {"n": "②", "t": "지구 복사의 방출", "d": "데워진 지표는 {{㉠}} 형태로 열을 내보낸다."}, {"n": "③", "t": "온실 기체의 재방출", "d": "온실 기체가 ㉠을 흡수했다가 사방으로 재방출한다."}], "howto": [], "body": ["지구의 평균 기온은 약 <b>15 ℃<\/b>로 유지된다. 지구와 거의 같은 거리에서 태양 빛을 받는 달의 표면이 밤에는 영하 100 ℃ 아래로 떨어지는 것과 비교하면, 이 차이를 만드는 원인이 지구의 <b>대기<\/b>에 있음을 알 수 있다.", "태양 복사 에너지는 주로 <b>가시광선<\/b>의 형태로 대기를 통과해 지표를 데운다(①). 데워진 지표는 파장이 긴 <b>적외선<\/b>의 형태로 에너지를 내보내는데, 이를 <b>지구 복사<\/b>라 한다(②). 이때 대기 중의 <b>온실 기체<\/b> — 수증기, 이산화 탄소, 메테인 — 는 나가려는 적외선을 흡수했다가 사방으로 재방출하여, 에너지의 일부를 지표 근처에 머무르게 한다(③).", "이처럼 대기가 지구 복사 에너지의 일부를 붙잡아 지표의 온도를 높게 유지하는 작용이 {{㉡}}다. 온실 기체가 흡수하는 것은 태양의 가시광선이 아니라 지표가 내보내는 <b>적외선<\/b>이라는 점에 주의한다. 온실효과 덕분에 지구의 평균 기온은 15 ℃로 유지되며, 온실효과가 전혀 없다면 약 {{㉢}} ℃까지 낮아져 바다가 얼어붙었을 것이다."], "terms": [{"k": "온실효과", "v": "대기가 지구 복사 에너지의 일부를 흡수·재방출하여 지표의 온도를 높게 유지하는 작용."}, {"k": "온실 기체", "v": "적외선을 흡수·재방출하는 기체. 수증기(바다의 증발), 이산화 탄소(화석 연료의 연소), 메테인(농축산·폐기물) 등."}, {"k": "지구 복사", "v": "데워진 지표가 내보내는 적외선. 태양 복사(가시광선 중심)와 파장이 다르다."}], "myths": [{"x": "온실효과가 곧 지구온난화다.", "o": "온실효과는 정상적인 대기의 작용이며, 온난화는 그것의 <b>'강화'<\/b>다."}, {"x": "온실 기체는 가시광선을 흡수한다.", "o": "흡수하는 것은 지표가 내보내는 <b>적외선<\/b>이다."}], "point": "온실효과는 지구 평균 기온을 15 ℃로 유지하는 정상적인 대기의 작용이다. 문제는 온실효과 자체가 아니라, 온실 기체 증가로 이 작용이 강해지는 것이다.", "answers": "정답 ㉠ 적외선(지구 복사) ㉡ 온실효과 ㉢ −18 — ㉠을 '가시광선'으로 바꾼 선지가 최다 오답이다.", "blanks": {"㉠": "적외선(지구 복사)", "㉡": "온실효과", "㉢": "−18"}, "warning": "㉠을 '가시광선'으로 바꾼 선지가 최다 오답이다.", "figure": {"caption": "온실효과의 구조 — 들어오는 ①, 나가는 ②, 재방출되는 ③. 오른쪽은 온실효과가 만드는 33 ℃의 차이", "file": "figures/2203-01.svg"}}, {"id": "2203-02", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2203", "lessonName": "지구온난화와 기후변화", "no": "02", "title": "지구온난화", "subtitle": "온실효과의 강화", "steps": [{"n": "①", "t": "온실 기체의 증가", "d": "화석 연료의 {{㉠}}로 대기 중 이산화 탄소가 늘어난다."}, {"n": "②", "t": "온실효과의 강화", "d": "나가려는 적외선이 더 많이 흡수·재방출된다."}, {"n": "③", "t": "새로운 복사 평형", "d": "기온이 오른 뒤 <b>더 높은 온도에서 새로운 평형<\/b>을 이룬다."}], "howto": ["'킬링'은 사람 이름이다 — 1958년부터 하와이의 산꼭대기 관측소에서 공기 속 이산화 탄소의 양을 재기 시작한 과학자 찰스 킬링. 그 기록이 이 곡선이다.", "가로축은 연도, 세로축은 공기 속 이산화 탄소의 양이다. <b>ppm은 '100만 개 중 몇 개'<\/b>라는 단위 — 430 ppm이면 공기 입자 100만 개 중 430개가 이산화 탄소라는 뜻이다.", "선의 잔물결(톱니)은 1년마다 반복된다 — <b>여름에는 나무와 풀이 광합성으로 이산화 탄소를 흡수<\/b>해 조금 내려가고, 겨울에는 다시 올라간다.", "잔물결을 무시하고 멀리서 보면 선은 꾸준히 오른쪽 위로 오른다 — 이 큰 흐름이 <b>화석 연료 사용이 남긴 인간 활동의 신호<\/b>다."], "body": ["산업혁명 이후 화석 연료의 사용이 늘면서 대기 중 온실 기체의 양이 빠르게 증가하고 있다. 석탄·석유·천연가스를 태우는 연소는 I단원에서 배운 <b>산화 반응<\/b>이며, 그 생성물인 이산화 탄소가 대기에 쌓인다. 산업화 이전 약 <b>280 ppm<\/b>이던 이산화 탄소 농도는 현재 약 <b>430 ppm<\/b>(2026년)에 이른다.", "그 결과 지구의 평균 기온은 산업화 이전보다 이미 <b>1 ℃ 남짓<\/b> 상승하였다. 온난화는 복사 평형이 깨져 기온이 무한히 오르는 현상이 아니라, {{㉡}} 온도에서 <b>새로운 평형<\/b>을 이루는 현상이다. 다만 지구 <b>평균<\/b> 기온의 1 ℃ 변화는 결코 작지 않다.", "기온 상승으로 빙하가 줄고 {{㉢}}이 상승하며, 폭염·가뭄·집중호우와 같은 이상 기상이 잦아진다. 대처는 원인의 사슬을 거꾸로 읽는 데서 출발한다 — 화석 연료의 연소를 줄이고(신재생 에너지, 에너지 효율 개선), 배출된 탄소를 숲이 흡수하도록 산림을 보전하는 것이다. 이 내용은 II-05(발전과 에너지의 효율적 이용)로 이어진다."], "terms": [{"k": "지구온난화", "v": "온실 기체 증가로 온실효과가 강해져 지구의 평균 기온이 상승하는 현상."}, {"k": "복사 평형", "v": "흡수하는 에너지와 방출하는 에너지가 같아 평균 온도가 일정하게 유지되는 상태."}, {"k": "킬링 곡선", "v": "1958년부터 하와이 마우나로아 관측소에서 측정해 온 대기 중 이산화 탄소 농도 기록."}], "myths": [{"x": "곡선의 톱니는 측정 오차다.", "o": "<b>여름철 광합성<\/b>이 만드는 규칙적인 계절 변화다."}, {"x": "온난화는 평형이 깨진 폭주다.", "o": "<b>더 높은 온도의 새 평형<\/b>이다 — 그래서 되돌리기 어렵다."}], "point": "화석 연료의 연소(산화)가 온실 기체를 늘리고, 강해진 온실효과가 지구를 더 높은 온도의 평형으로 옮긴다 — I단원의 화학과 II단원의 환경은 한 사슬로 이어져 있다.", "answers": "정답 ㉠ 연소 ㉡ 더 높은 ㉢ 해수면 — '무한 상승'과 '새로운 평형'의 구분이 최고난도 선지로 출제된다.", "blanks": {"㉠": "연소", "㉡": "더 높은", "㉢": "해수면"}, "warning": "'무한 상승'과 '새로운 평형'의 구분이 최고난도 선지로 출제된다.", "figure": {"caption": "오르내리는 톱니(계절 변화)와 장기적인 상승(인간 활동) — 두 신호를 한 그래프에서 읽는다", "file": "figures/2203-02.svg"}}, {"id": "2203-03", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2203", "lessonName": "지구온난화와 기후변화", "no": "03", "title": "지구온난화의 영향", "subtitle": "평균 1 ℃의 무게", "steps": [{"n": "①", "t": "해수면 상승", "d": "빙하가 녹고, 데워진 바닷물의 부피가 커지는 {{㉠}}으로 해수면이 오른다."}, {"n": "②", "t": "극한 기상과 생태계 변화", "d": "폭염·집중호우·가뭄이 잦아지고, 생물의 서식지와 개화 시기가 달라진다."}, {"n": "③", "t": "해양 산성화", "d": "바다가 이산화 탄소를 흡수하여 산성 쪽으로 기운다."}], "howto": [], "body": ["지구 평균 기온의 1 ℃ 상승은 작은 변화가 아니다. 첫째, <b>해수면이 상승<\/b>한다. 빙하가 녹아 바다로 흘러드는 것과 함께, 온도가 오른 바닷물 자체의 부피가 커지는 <b>열팽창<\/b>이 일어나기 때문이다. 해발 고도가 낮은 섬나라와 해안 도시가 먼저 영향을 받는다.", "둘째, <b>극한 기상<\/b>이 잦아진다. 대기가 가진 에너지가 많아지면서 폭염·집중호우·가뭄·강한 태풍의 빈도와 강도가 커진다. 셋째, <b>생태계가 이동<\/b>한다. 개화 시기가 달라져 곤충과 식물의 관계가 어긋나고, 생물의 서식지가 고위도로 옮겨 간다.", "우리나라에서도 변화는 관찰된다. 사과 재배지가 {{㉡}}쪽으로 이동하고 있으며, 남해와 동해에서는 아열대 어종이 늘고 있다. 넷째, <b>해양 산성화<\/b>가 진행된다. 바다는 대기 중 이산화 탄소의 일부를 흡수하는데, 이 과정에서 바닷물이 {{㉢}} 쪽으로 기울어 산호와 조개처럼 탄산 칼슘 껍데기를 만드는 생물이 피해를 입는다 — I단원에서 배운 산과 염기가 바다에서 다시 등장하는 것이다."], "terms": [{"k": "열팽창", "v": "온도가 오르면 물질의 부피가 커지는 현상. 바닷물의 열팽창은 빙하 융해와 함께 해수면 상승의 두 원인 중 하나다."}, {"k": "극한 기상", "v": "폭염·집중호우·가뭄·강한 태풍처럼 평년의 범위를 크게 벗어나는 기상 현상."}, {"k": "해양 산성화", "v": "바다가 이산화 탄소를 흡수하여 바닷물이 산성 쪽으로 기우는 현상. 껍데기를 만드는 해양 생물에 영향을 준다."}], "myths": [{"x": "해수면 상승은 빙하가 녹기 때문만이다.", "o": "빙하 융해 <b>그리고<\/b> 바닷물의 <b>열팽창<\/b> — 원인은 두 가지다."}, {"x": "온난화로 사과 재배지는 남쪽으로 내려간다.", "o": "서식지·재배지는 <b>고위도(북쪽)<\/b>로 이동한다."}], "point": "온난화의 영향은 해수면 상승(융해 + 열팽창), 극한 기상, 생태계의 이동, 해양 산성화의 네 갈래로 정리한다. 평균 기온 1 ℃의 변화가 바다·대기·생태계를 동시에 움직인다.", "answers": "정답 ㉠ 열팽창 ㉡ 북 ㉢ 산성 — 해수면 상승의 원인에서 '열팽창'을 빠뜨리면 반쪽 답이다.", "blanks": {"㉠": "열팽창", "㉡": "북", "㉢": "산성"}, "warning": "해수면 상승의 원인에서 '열팽창'을 빠뜨리면 반쪽 답이다.", "figure": {"caption": "온난화의 네 가지 영향 — 해수면 · 극한 기상 · 생태계 · 바다의 화학", "file": "figures/2203-03.svg"}}, {"id": "2203-04", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2203", "lessonName": "지구온난화와 기후변화", "no": "04", "title": "엘니뇨", "subtitle": "대기와 해양의 상호 작용", "steps": [{"n": "①", "t": "평상시", "d": "적도 태평양에서 동에서 서로 부는 {{㉠}}이 따뜻한 표층수를 서쪽으로 밀어 놓는다."}, {"n": "②", "t": "무역풍의 약화", "d": "몇 년에 한 번 이 바람이 약해지면, 따뜻한 물이 동쪽으로 되밀려 온다."}, {"n": "③", "t": "동태평양 수온 상승", "d": "동태평양의 표층 수온이 평소보다 높아지는 현상 — 이것이 엘니뇨다."}], "howto": ["두 상자는 적도 태평양을 옆에서 자른 단면이다. 왼쪽이 서쪽(인도네시아), 오른쪽이 동쪽(페루) — 지도와 같은 방향이다.", "주황색은 따뜻한 물, 파란색은 찬물이다. 위쪽 화살표는 바다 위를 부는 바람(무역풍)의 방향과 세기를 나타낸다.", "평상시(왼쪽)에는 바람이 따뜻한 물을 서쪽으로 밀어 동쪽에는 아래에서 찬물이 올라온다. 엘니뇨(오른쪽)에는 바람이 약해져 따뜻한 물이 동쪽까지 퍼지고, 찬물은 올라오지 못한다."], "body": ["기후는 대기와 해양이 함께 만드는 시스템이다. 평상시 적도 태평양에서는 <b>무역풍<\/b>이 동에서 서로 불어 따뜻한 표층수를 서쪽으로 밀어 놓는다. 동쪽의 페루 연안에서는 그 빈자리를 채우려 깊은 곳의 <b>찬물이 올라오며<\/b>(용승), 이 찬물이 실어 온 영양분이 세계적인 어장을 만든다.", "몇 년에 한 번 무역풍이 약해지면 따뜻한 물이 동쪽으로 되밀려 와 동태평양의 표층 수온이 평소보다 {{㉡}}진다. 이 현상이 <b>엘니뇨<\/b>다. 페루 연안에서는 찬물이 올라오지 못해 어획량이 줄고 건조하던 지역에 폭우가 내리며, 서태평양의 인도네시아·오스트레일리아에는 가뭄과 산불이 잦아진다.", "반대로 무역풍이 평소보다 강해져 동태평양이 더 차가워지는 현상을 {{㉢}}라 한다. 태평양 한쪽의 수온 변화가 지구 반대편의 강수와 기온까지 바꾸는 것은, 기후가 <b>전 지구적으로 연결된 하나의 시스템<\/b>임을 보여 준다."], "terms": [{"k": "무역풍", "v": "적도 부근에서 동쪽에서 서쪽으로 부는 바람. 평상시 따뜻한 표층수를 서태평양 쪽으로 밀어 놓는다."}, {"k": "용승", "v": "표층의 물이 밀려 나간 자리를 채우려 깊은 곳의 찬물이 올라오는 현상. 영양분을 실어 와 좋은 어장을 만든다."}, {"k": "엘니뇨 / 라니냐", "v": "무역풍이 약해져 동태평양 수온이 높아지는 현상 / 무역풍이 강해져 동태평양 수온이 낮아지는 반대 현상."}], "myths": [{"x": "엘니뇨는 무역풍이 강해질 때 일어난다.", "o": "무역풍이 <b>약해질 때<\/b>다. 강해지는 것은 라니냐."}, {"x": "엘니뇨 때 동태평양 수온은 낮아진다.", "o": "따뜻한 물이 동쪽까지 퍼져 <b>높아진다<\/b>."}], "point": "엘니뇨 = 무역풍 약화 + 동태평양 수온 상승 + 페루 폭우·서태평양 가뭄. 바람(대기)과 수온(해양)은 한 팀으로 움직이며, 그 변화는 전 지구의 기상에 영향을 준다.", "answers": "정답 ㉠ 무역풍 ㉡ 높아 ㉢ 라니냐 — \"무역풍이 강해질 때\"로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "무역풍", "㉡": "높아", "㉢": "라니냐"}, "warning": "\"무역풍이 강해질 때\"로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "평상시와 엘니뇨 시기의 적도 태평양 단면 — 무역풍 약화가 따뜻한 물을 동쪽으로 되돌린다", "file": "figures/2203-04.svg"}}, {"id": "2203-05", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2203", "lessonName": "지구온난화와 기후변화", "no": "05", "title": "사막화와 기후변화에 대한 대처", "subtitle": "", "steps": [{"n": "①", "t": "사막화의 원인", "d": "오랜 가뭄이라는 자연적 원인 위에, 과도한 {{㉠}}·경작과 삼림 벌채가 더해진다."}, {"n": "②", "t": "완화", "d": "원인 자체를 줄인다 — 화석 연료 감축, 신재생 에너지, 산림 보전."}, {"n": "③", "t": "적응", "d": "이미 시작된 변화에 대비한다 — 방재 시설, 가뭄에 강한 작물, 조기 경보."}], "howto": [], "body": ["<b>사막화<\/b>는 건조한 땅이 생산력을 잃고 사막처럼 변해 가는 현상이다. 원인은 두 겹이다. 오랜 <b>가뭄<\/b>과 같은 자연적 원인 위에, 과도한 방목과 경작, 삼림 벌채와 같은 <b>인위적 원인<\/b>이 더해진다. 풀과 나무가 사라지면 땅이 물을 붙잡지 못해 더 건조해지는 악순환이 이어진다.", "사하라 사막 남쪽의 사헬 지대가 대표적인 사례이며, 동아시아의 사막화는 우리나라에 날아오는 <b>황사<\/b>를 심하게 만든다. 기후변화와 사막화는 먼 나라의 문제가 아니다.", "기후변화에 대한 대처는 두 갈래로 나뉜다. {{㉡}}는 원인 자체를 줄이는 것으로, 화석 연료 사용을 줄이고 신재생 에너지로 전환하며 숲을 보전·복원하는 일이다. <b>적응<\/b>은 이미 시작된 변화에 대비하는 것으로, 방파제와 배수 시설, 가뭄에 강한 작물, 조기 경보 체계가 여기에 속한다. 여기에 국제 협력이 더해진다. 2015년 채택된 <b>파리 협정<\/b>은 지구 평균 기온 상승을 산업화 이전 대비 2 ℃보다 훨씬 낮은 수준, 나아가 {{㉢}} ℃ 이내로 억제하자는 국제 사회의 약속이다."], "terms": [{"k": "사막화", "v": "건조한 지역의 땅이 생산력을 잃고 사막처럼 변해 가는 현상. 자연적 원인(가뭄)과 인위적 원인(과도한 방목·경작·벌채)이 함께 작용한다."}, {"k": "완화 / 적응", "v": "완화는 온실 기체 배출을 줄여 원인을 없애는 대처, 적응은 이미 나타난 기후변화의 피해에 대비하는 대처."}, {"k": "파리 협정", "v": "2015년 채택된 국제 협약. 지구 평균 기온 상승을 산업화 이전 대비 1.5 ℃ 이내로 억제하는 것을 목표로 한다."}], "myths": [{"x": "사막화는 가뭄이라는 자연 현상일 뿐이다.", "o": "가뭄 위에 <b>인간의 과도한 방목·경작·벌채<\/b>가 더해진 결과다."}, {"x": "방파제를 쌓는 것은 온난화의 '완화'다.", "o": "피해에 대비하는 <b>적응<\/b>이다. 완화는 원인(배출)을 줄이는 것."}], "point": "원인을 정확히 짚어야 대처가 나온다 — 연소 → 온실 기체 → 온실효과 강화 → 기온 상승의 사슬을 거꾸로 끊는 것이 완화, 이미 온 변화에 대비하는 것이 적응이다.", "answers": "정답 ㉠ 방목 ㉡ 완화 ㉢ 1.5 — 완화(원인 감축)와 적응(피해 대비)의 구분이 서술형 단골이다.", "blanks": {"㉠": "방목", "㉡": "완화", "㉢": "1.5"}, "warning": "완화(원인 감축)와 적응(피해 대비)의 구분이 서술형 단골이다.", "figure": {"caption": "사막화의 악순환과 기후변화 대처의 두 갈래 — 원인을 줄이는 완화, 변화에 대비하는 적응", "file": "figures/2203-05.svg"}}, {"id": "2204-01", "book": "2", "bookName": "통합과학 2", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2204", "lessonName": "태양 에너지와 에너지 전환", "no": "01", "title": "수소 핵융합", "subtitle": "태양 에너지의 근원", "steps": [{"n": "①", "t": "반응의 조건", "d": "태양 <b>중심부<\/b>의 초고온·초고압 환경에서 반응이 일어난다."}, {"n": "②", "t": "수소에서 헬륨으로", "d": "수소 원자핵 4개가 합쳐져 {{㉠}} 원자핵 1개가 된다."}, {"n": "③", "t": "질량이 에너지로", "d": "반응 후 질량이 조금 줄어들고, 줄어든 만큼이 빛과 열로 방출된다."}], "howto": [], "body": ["태양은 연료를
