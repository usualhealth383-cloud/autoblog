 부전패다.", "orig": "It is impossible to live without failing at something, unless you live so cautiously that you might as well not have lived at all – in which case, you fail by default.", "who": "J.K. 롤링", "role": "소설가", "src": "2008년 6월 하버드대 졸업식 연설 「The Fringe Benefits of Failure」", "url": "https://www.harvardmagazine.com/2008/06/the-fringe-benefits-failure-the-importance-imagination", "note": "틀릴까 봐 안 풀어 본 문제는, 틀린 문제보다 더 아무것도 남기지 않는다."}, {"id": "w218", "kind": "classic", "kindName": "고전", "ko": "너는 먼저 눈을 깜박이지 않는 법부터 배워라. 그다음에야 활쏘기를 말할 수 있다.", "orig": "爾先學不瞬 而後可言射矣", "who": "열자", "role": "열자", "src": "『열자』 탕문편 (비위가 기창에게 한 말)", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%88%97%E5%AD%90/%E6%B1%A4%E9%97%AE/text.txt", "note": "어려운 응용문제보다 기본 개념이 먼저다. 기초가 서야 응용을 말할 수 있다."}, {"id": "w219", "kind": "classic", "kindName": "고전", "ko": "뜻을 쓰는 데 흩어짐이 없으면 정신이 한곳에 모인다.", "orig": "用志不分 乃凝於神", "who": "장자", "role": "장자", "src": "『장자』 외편 달생", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%BA%84%E5%AD%90/%E5%A4%96%E7%AF%87/%E8%BE%BE%E7%94%9F", "note": "매미 잡는 노인처럼 한 가지에 마음을 모아 보자. 25분만 휴대폰을 멀리 두고."}, {"id": "w220", "kind": "west", "kindName": "서양 고전", "ko": "참된 지식을 원하는 이는 누구나 '고난의 언덕'을 홀로 올라야 한다. 정상에 이르는 왕도는 없으니, 나는 내 식대로 지그재그로 오른다.", "orig": "every one who wishes to gain true knowledge must climb the Hill Difficulty alone, and since there is no royal road to the summit, I must zigzag it in my own way.", "who": "헬렌 켈러", "role": "미국의 작가·사회운동가", "src": "『내 삶의 이야기(The Story of My Life)』(1903) 제20장 (래드클리프 대학 시절)", "url": "https://www.gutenberg.org/cache/epub/2397/pg2397.txt", "note": "남들과 다른 공부법이어도 괜찮고, 중요한 건 오늘도 언덕을 오르고 있다는 사실이다."}, {"id": "w221", "kind": "korea", "kindName": "우리 인물", "ko": "얼굴 좋음이 몸 좋음만 못하고, 몸 좋음이 마음 좋음만 못하다. 이것을 보고 나는 마음 좋은 사람이 되기로 굳게 결심하였다.", "orig": "相好不如身好 身好不如心好", "who": "김구", "role": "독립운동가", "src": "『백범일지』 · 관상 공부 중 『마의상서』의 한 구절을 읽고 한 결심", "url": "https://ko.wikisource.org/wiki/백범일지", "note": "성적표보다 오래 남는 건 마음씨다. 오늘 친구에게 노트를 한 번 빌려주자."}, {"id": "w222", "kind": "west", "kindName": "서양 고전", "ko": "벌을 본받으라고들 한다. 벌은 꽃 사이를 날아다니며 꿀이 될 만한 것을 골라 모은다.", "orig": "We should follow, men say, the example of the bees, who flit about and cull the flowers that are suitable for producing honey", "who": "세네카", "role": "로마의 스토아 철학자", "src": "『루킬리우스에게 보내는 편지』 제84편 3절 (거미어 영역)", "url": "https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_84", "note": "여기저기서 배운 것을 내 노트 한 권에 정리할 때 비로소 꿀이 된다."}, {"id": "w223", "kind": "writer", "kindName": "작가·사상가", "ko": "열정 없이 이루어진 위대한 일은 하나도 없다.", "orig": "Nothing great was ever achieved without enthusiasm.", "who": "랠프 월도 에머슨", "role": "시인·사상가", "src": "에세이 「원(Circles)」(1841)", "url": "https://www.gutenberg.org/cache/epub/2944/pg2944.txt", "note": "좋아하는 단원 하나에서 시작해도 된다. 열정은 작은 흥미에서 자란다."}, {"id": "w224", "kind": "classic", "kindName": "고전", "ko": "배움은 나무를 심는 것과 같아서, 봄에는 그 꽃을 즐기고 가을에는 그 열매를 거둔다.", "orig": "夫學者猶種樹也 春玩其華 秋登其實", "who": "안지추", "role": "안씨가훈", "src": "『안씨가훈』 면학편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E9%A2%9C%E6%B0%8F%E5%AE%B6%E8%AE%AD/%E5%8B%89%E5%AD%A6%E7%AF%87/text.txt", "note": "지금 외우는 개념은 봄꽃이고, 시험장에서 푸는 문제가 가을 열매다."}, {"id": "w225", "kind": "science", "kindName": "과학자", "ko": "나는 과학에 위대한 아름다움이 있다고 생각하는 사람 중 하나다.", "orig": "I am among those who think that science has great beauty.", "who": "마리 퀴리", "role": "물리학자·화학자 · 1903·1911년 노벨상", "src": "1933년 5월 마드리드 '문화의 미래' 회의 발언 (이브 퀴리 『마담 퀴리』 24장)", "url": "https://www.themarginalian.org/2014/09/23/marie-curie-on-science-and-wonder/", "note": "오늘 배운 식 하나가 세상의 무엇을 설명하는지 떠올려 보자."}, {"id": "w226", "kind": "west", "kindName": "서양 고전", "ko": "누구나 실수할 수 있다. 그러나 어리석은 사람만이 그 잘못을 고집한다.", "orig": "Any man is liable to a mistake; but no one but a downright fool will persist in error.", "who": "키케로", "role": "로마의 정치가·웅변가", "src": "『필리피카』 제12연설 5절 (C. D. 영 영역)", "url": "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0474/phi035/phi0474.phi035.perseus-eng1.xml", "note": "오답 노트는 실수를 고집하지 않겠다는 가장 성실한 약속이다."}, {"id": "w227", "kind": "classic", "kindName": "고전", "ko": "널리 배우고, 자세히 묻고, 신중히 생각하고, 분명하게 분별하고, 독실하게 행하라.", "orig": "博學之 審問之 愼思之 明辨之 篤行之", "who": "자사", "role": "중용", "src": "『중용』 제20장", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E4%B8%AD%E5%BA%B8/%E7%AC%AC%E4%BA%8C%E5%8D%81%E7%AB%A0", "note": "배우고, 묻고, 생각하고, 따져 보고, 해 보기. 오늘 공부도 이 다섯 걸음이면 된다."}, {"id": "w228", "kind": "korea", "kindName": "우리 인물", "ko": "황금 백만 냥도 자식 하나 가르치는 것만 못하다.", "orig": "黃金百萬兩 不如一敎子", "who": "안중근", "role": "독립운동가", "src": "1910년 3월 뤼순감옥에서 쓴 유묵 · 2022년 보물 지정", "url": "https://m.seoul.co.kr/news/2022/05/03/20220503500193", "note": "배움은 금보다 오래 남는 재산이다. 오늘 익힌 한 가지가 평생 내 것이 된다."}, {"id": "w229", "kind": "west", "kindName": "서양 고전", "ko": "뜻이 있는 곳에 길이 있다는 말은 옳다. 하지만 바라는 것은 좋아도, 바람이 노력을 대신해서는 안 된다.", "orig": "It is a good saying that where there's a will there's a way; but while it is all very well to wish, wishes must not take the place of work.", "who": "존 러벅", "role": "영국의 과학자·정치가", "src": "『인생의 즐거움(The Pleasures of Life)』 제2부 제10장 「일과 휴식」", "url": "https://www.gutenberg.org/cache/epub/7952/pg7952.txt", "note": "목표 대학을 책상 앞에 붙였다면 그 아래에는 오늘 할 일 목록도 붙어 있어야 한다."}, {"id": "w230", "kind": "classic", "kindName": "고전", "ko": "아직 보지 못한 책을 읽으면 좋은 벗을 얻은 듯하고, 이미 읽은 책을 다시 보면 옛 친구를 만난 듯하다.", "orig": "讀未見書 如得良友 見已讀書 如逢故人", "who": "작자 미상", "role": "증광현문", "src": "『증광현문』", "url": "https://raw.githubusercontent.com/chinese-poetry/chinese-poetry/master/%E8%92%99%E5%AD%A6/zengguangxianwen.json", "note": "새 문제집은 새 친구, 다시 펼친 교과서는 반가운 옛 친구다."}, {"id": "w231", "kind": "west", "kindName": "서양 고전", "ko": "어려서부터 어떤 습관을 들이느냐는 작은 차이가 아니다. 큰 차이, 아니 모든 차이를 만든다.", "orig": "It makes no small difference, therefore, whether a man be trained from his youth up in this way or in that, but a great difference, or rather all the difference.", "who": "아리스토텔레스", "role": "고대 그리스 철학자", "src": "『니코마코스 윤리학』 제2권 제1장 (F. H. 피터스 영역)", "url": "https://github.com/standardebooks/aristotle_nicomachean-ethics_f-h-peters/blob/master/src/epub/text/book-2.xhtml", "note": "지금 들이는 공부 습관이 앞으로 공부하는 방식이 된다."}, {"id": "w232", "kind": "classic", "kindName": "고전", "ko": "뜻을 쓰는 것이 이처럼 정밀하다면, 무슨 일인들 이르지 못하고 무엇인들 이루지 못하겠는가?", "orig": "用志如此其精也 何事而不達 何爲而不成", "who": "여불위(편찬)", "role": "여씨춘추", "src": "『여씨춘추』 불구론 박지편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%90%95%E6%B0%8F%E6%98%A5%E7%A7%8B/%E8%AE%BA/%E4%B8%8D%E8%8B%9F%E8%AE%BA/text.txt", "note": "한 가지에 정밀하게 마음을 모으면 막히던 문제도 결국 뚫린다."}, {"id": "w233", "kind": "writer", "kindName": "작가·사상가", "ko": "나이 들어 쓴 경험을 많이 겪은 사람으로서 장담한다. 실패하지 않겠다고 굳게 결심하면 너는 실패할 수 없다.", "orig": "I know not how to aid you, save in the assurance of one of mature age, and much severe experience, that you can not fail, if you resolutely determine, that you will not.", "who": "에이브러햄 링컨", "role": "미국 제16대 대통령", "src": "조지 레이섬에게 보낸 편지(1860.7.22)", "url": "https://abrahamlincolnonline.abrahamlincolnonline.org/lincoln/speeches/latham.htm", "note": "하버드 입학시험에 떨어진 소년에게 쓴 편지다. 시험 한 번이 끝은 아니다."}, {"id": "w234", "kind": "modern", "kindName": "운동·예술", "ko": "나는 9,000번 넘게 슛을 놓쳤고 300번 가까이 졌다. 결승 슛을 맡고도 26번 실패했다.", "orig": "I've missed more than 9,000 shots in my career. I've lost almost 300 games. 26 times I've been trusted to take the game-winning shot and missed.", "who": "마이클 조던", "role": "농구 선수", "src": "1997년 나이키 광고 「Failure」", "url": "https://www.shmoop.com/quotes/failed-why-i-succeed.html", "note": "틀린 문제 수를 세는 날이 있다면, 그만큼 많이 던져 본 날이기도 하다."}, {"id": "w235", "kind": "science", "kindName": "과학자", "ko": "좋은 정신을 가진 것만으로는 충분하지 않다. 중요한 것은 그것을 잘 쓰는 일이다.", "orig": "Car ce n'est pas assez d'avoir l'esprit bon, mais le principal est de l'appliquer bien.", "who": "르네 데카르트", "role": "수학자·철학자 · 해석기하학의 창시자", "src": "『방법서설』(1637) 제1부", "url": "https://people.duke.edu/~garci/cibertextos/frances/DESCARTES-RENE/TRANSLATE/DISCOURS-METHODE-FR-EN.HTM", "note": "머리가 좋은지보다 오늘 그 머리를 어떻게 썼는지가 실력을 만든다."}, {"id": "w236", "kind": "korea", "kindName": "우리 인물", "ko": "하나의 장편소설을 쓸 때마다 나는 질문들을 견디며 그 안에 산다.", "who": "한강", "role": "소설가·2024 노벨문학상 수상자", "src": "2024 노벨문학상 강연 「빛과 실」", "url": "https://www.nobelprize.org/prizes/literature/2024/han/225027-nobel-lecture-korean/", "note": "어려운 문제 앞에서 바로 해설을 펴지 말고, 질문을 5분만 더 견뎌 보자."}, {"id": "w237", "kind": "west", "kindName": "서양 고전", "ko": "인간은 자연에서 가장 연약한 한 줄기 갈대일 뿐이다. 그러나 생각하는 갈대다.", "orig": "Man is but a reed, the most feeble thing in nature; but he is a thinking reed.", "who": "블레즈 파스칼", "role": "프랑스의 수학자·철학자", "src": "『팡세』 347 (더턴판 영역(T. S. 엘리엇 서문), 브룅슈비크 번호)", "url": "https://www.gutenberg.org/ebooks/18269", "note": "지친 날에도 생각하는 힘만큼은 여전히 우리 손에 있다."}, {"id": "w238", "kind": "classic", "kindName": "고전", "ko": "나는 열다섯 살에 배움에 뜻을 두었다.", "orig": "吾十有五而志于學", "who": "공자", "role": "논어", "src": "『논어』 위정편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%AE%BA%E8%AF%AD/%E4%B8%BA%E6%94%BF%E7%AF%87/text.txt", "note": "공자가 뜻을 세운 것도 지금 우리 나이였다. 오늘 공부할 이유를 한 줄 적어 보자."}, {"id": "w239", "kind": "west", "kindName": "서양 고전", "ko": "마음은 대비해 둔 불행이라면 충분히 견딜 만큼 강하다.", "orig": "The mind is strong enough to bear those evils for which it is prepared.", "who": "세네카", "role": "로마의 스토아 철학자", "src": "『분노에 관하여』 제3권 제37장 (Aubrey Stewart 역)", "url": "https://www.gutenberg.org/cache/epub/64576/pg64576.txt", "note": "시험장에서 처음 보는 유형이 나올 수 있다고 미리 각오해 두면 덜 흔들린다."}, {"id": "w240", "kind": "classic", "kindName": "고전", "ko": "죽순은 껍질을 벗어야 대나무가 되고, 물고기는 거센 물결을 헤쳐야 용이 된다.", "orig": "筍因落籜方成竹 魚爲奔波始化龍", "who": "작자 미상", "role": "증광현문", "src": "『증광현문』", "url": "https://raw.githubusercontent.com/chinese-poetry/chinese-poetry/master/%E8%92%99%E5%AD%A6/zengguangxianwen.json", "note": "익숙한 공부 습관이라는 껍질을 한 번 벗어 보자. 거기서 한 뼘 자란다."}, {"id": "w241", "kind": "west", "kindName": "서양 고전", "ko": "하루 세 시간씩 힘차게 걷는 사람은 7년이면 지구 한 바퀴만큼의 거리를 지나게 된다.", "orig": "He that shall walk with vigour three hours a day, will pass in seven years a space equal to the circumference of the globe.", "who": "새뮤얼 존슨", "role": "영국의 문인", "src": "『라셀라스』 제13장, 임락의 말", "url": "https://github.com/standardebooks/samuel-johnson_the-history-of-rasselas-prince-of-abissinia/blob/master/src/epub/text/chapter-13.xhtml", "note": "하루 분량은 작아도, 쌓이면 지구 한 바퀴가 된다."}, {"id": "w242", "kind": "korea", "kindName": "우리 인물", "ko": "홀로 자만하는 것보다 더한 외톨이는 없다.", "orig": "孤莫孤於自恃", "who": "안중근", "role": "독립운동가", "src": "1910년 뤼순감옥 유묵 · 보물 제569-16호 · 황석공 『소서』 구절", "url": "https://www.khan.co.kr/article/202010200600001", "note": "잘하는 과목일수록 친구의 풀이를 들어 보자. 혼자 아는 척하면 거기서 멈춘다."}, {"id": "w243", "kind": "classic", "kindName": "고전", "ko": "학업은 부지런함으로 정밀해지고 노는 데서 거칠어지며, 행실은 생각함으로 이루어지고 되는 대로 따르면 무너진다.", "orig": "業精於勤 荒於嬉 行成於思 毁於隨", "who": "한유", "role": "진학해", "src": "한유 「진학해(進學解)」 (『구당서』·『신당서』 한유전 수록)", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E6%97%A7%E5%94%90%E4%B9%A6/%E5%88%97%E4%BC%A0/%E5%8D%B7%E4%B8%80%E7%99%BE%E4%B8%80%E5%8D%81", "note": "공부의 정밀함은 머리보다 부지런함에서 온다. 오늘도 책상에 앉은 나를 믿자."}, {"id": "w244", "kind": "writer", "kindName": "작가·사상가", "ko": "날 수 없다면 뛰어라. 뛸 수 없다면 걸어라. 걸을 수 없다면 기어라. 무엇을 하든 계속 나아가라.", "orig": "If you can't fly, run; if you can't run, walk; if you can't walk, crawl; but by all means keep moving.", "who": "마틴 루서 킹 주니어", "role": "목사·민권운동가", "src": "스펠먼 칼리지 연설 「Keep Moving from This Mountain」(1960.4.10)", "url": "https://kinginstitute.stanford.edu/king-papers/documents/keep-moving-mountain-address-spelman-college-10-april-1960", "note": "컨디션이 나쁜 날은 한 쪽만 읽어도 된다. 멈추지만 않으면 된다."}, {"id": "w245", "kind": "west", "kindName": "서양 고전", "ko": "바라던 완벽함에는 한참 못 미쳤지만, 그 노력 덕분에 나는 시도하지 않았을 때보다 더 낫고 더 행복한 사람이 되었다.", "orig": "tho' I never arrived at the perfection I had been so ambitious of obtaining, but fell far short of it, yet I was, by the endeavour, a better and a happier man than I otherwise should have been if I had not attempted it", "who": "벤저민 프랭클린", "role": "미국의 정치가·과학자", "src": "『프랭클린 자서전』 제9장 「도덕적 완성을 위한 계획」", "url": "https://www.gutenberg.org/cache/epub/20203/pg20203.txt", "note": "목표 점수에 못 미쳐도 그 목표를 향해 공부한 나는 이미 예전의 내가 아니다."}, {"id": "w246", "kind": "science", "kindName": "과학자", "ko": "인생은 자전거를 타는 것과 같다. 균형을 잡으려면 계속 움직여야 한다.", "orig": "Life is like riding a bicycle. To keep your balance you must keep moving.", "who": "알베르트 아인슈타인", "role": "물리학자 · 1921년 노벨 물리학상", "src": "1930년 2월 5일 아들 에두아르트에게 보낸 편지 (월터 아이작슨 『아인슈타인: 삶과 우주』 2007, 367쪽 영역)", "url": "https://en.wikiquote.org/wiki/Albert_Einstein", "note": "하루 한 쪽이라도 이어 가면, 흔들리는 날에도 넘어지지 않는다."}, {"id": "w247", "kind": "west", "kindName": "서양 고전", "ko": "가장 좋은 발전은 비교적 느리다. 큰 결과는 단번에 이뤄지지 않으니, 걷듯이 한 걸음씩 나아가는 데 만족해야 한다.", "orig": "Progress, however, of the best kind, is comparatively slow. Great results cannot be achieved at once; and we must be satisfied to advance in life as we walk, step by step.", "who": "새뮤얼 스마일스", "role": "영국의 저술가", "src": "『자조론(Self-Help)』 제4장 「근면과 인내」", "url": "https://www.gutenberg.org/cache/epub/935/pg935.txt", "note": "성적이 계단처럼 오르는 것은 평평한 구간에서도 걸음을 멈추지 않았기 때문이다."}, {"id": "w248", "kind": "classic", "kindName": "고전", "ko": "혼자 배우고 벗이 없으면 견문이 좁아지고 듣는 것이 적어진다.", "orig": "獨學而無友 則孤陋而寡聞", "who": "작자 미상", "role": "예기", "src": "『예기』 학기편", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E7%A4%BC%E8%AE%B0/%E5%AD%A6%E8%AE%B0", "note": "가끔은 친구와 풀이를 바꿔 보자. 같은 문제를 다른 길로 푸는 법을 배운다."}, {"id": "w249", "kind": "korea", "kindName": "우리 인물", "ko": "청산은 어찌하여 만고에 푸르며 / 유수는 어찌하여 밤낮으로 그치지 않는가 / 우리도 그치지 말아 만고상청하리라", "orig": "靑山은 엇졔ᄒᆞ여 萬古에 프르르며 / 流水ᄂᆞᆫ 엇졔하여 晝夜애 긋지 아니ᄂᆞᆫ고 / 우리도 그치지 마라 萬古常靑 ᄒᆞ리라", "who": "이황", "role": "조선 중기 학자", "src": "연시조 「도산십이곡」 제11곡 · 1565년", "url": "https://ko.wikisource.org/wiki/도산십이곡", "note": "강물은 쉬지 않아서 바다에 닿는다. 하루 30분이라도 끊기지 않게 이어 가자."}, {"id": "w250", "kind": "classic", "kindName": "고전", "ko": "배움은 멈출 수 없다. 푸른 물감은 쪽풀에서 얻지만 쪽풀보다 더 푸르다.", "orig": "學不可以已 靑取之於藍而靑於藍", "who": "순자", "role": "순자", "src": "『순자』 권학편", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%8D%80%E5%AD%90/%E5%8A%9D%E5%AD%A6", "note": "배운 것에 내 노력을 더하면 배운 것보다 더 멀리 갈 수 있다. 멈추지만 말자."}, {"id": "w251", "kind": "west", "kindName": "서양 고전", "ko": "나는 강의실을 세 번 쓸었다. 그러고는 걸레를 가져와 네 번 닦았다.", "orig": "I swept the recitation-room three times. Then I got a dusting-cloth and dusted it four times.", "who": "부커 T. 워싱턴", "role": "미국의 교육자", "src": "『노예의 굴레를 벗고(Up From Slavery)』(1901) 제3장 (햄프턴 학교 입학 시험 대목)", "url": "https://www.gutenberg.org/cache/epub/2376/pg2376.txt", "note": "이 청소가 그의 입학시험이었고, 그는 작은 일을 끝까지 해내는 것으로 합격했다."}, {"id": "w252", "kind": "modern", "kindName": "운동·예술", "ko": "앞을 내다보며 점들을 이을 수는 없다. 뒤돌아볼 때에야 이어진다. 그러니 언젠가 이어지리라 믿어야 한다.", "orig": "You can't connect the dots looking forward; you can only connect them looking backwards. So you have to trust that the dots will somehow connect in your future.", "who": "스티브 잡스", "role": "애플 공동 창업자", "src": "2005년 6월 12일 스탠퍼드대 졸업식 연설", "url": "https://www.rev.com/blog/transcripts/steve-jobs-stanford-commencement-speech-transcript-2005", "note": "지금 배우는 단원이 어디에 쓰일지 몰라도, 언젠가 다른 단원과 이어지는 날이 온다."}, {"id": "w015", "kind": "classic", "kindName": "고전", "ko": "아침에 도를 들으면 저녁에 죽어도 좋다.", "orig": "朝聞道 夕死可矣", "who": "공자", "role": "논어", "src": "『논어』 이인편 제8장", "url": "https://zh.wikisource.org/wiki/%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B", "note": "오늘 하나를 확실히 알고 자면, 그 하루는 헛되지 않다."}, {"id": "w253", "kind": "writer", "kindName": "작가·사상가", "ko": "공중에 성을 쌓았다고 해서 그 수고가 헛된 것은 아니다. 성은 원래 거기 있어야 한다. 이제 그 밑에 토대를 놓아라.", "orig": "If you have built castles in the air, your work need not be lost; that is where they should be. Now put the foundations under them.", "who": "헨리 데이비드 소로", "role": "작가·사상가", "src": "『월든』(1854) 「맺음말」", "url": "https://sites.lafayette.edu/evst254-fa15/2015/11/16/conclusion-of-walden/", "note": "꿈을 크게 꾼 건 잘못이 아니다. 오늘 푸는 문제집 한 장이 그 성의 토대다."}, {"id": "w254", "kind": "west", "kindName": "서양 고전", "ko": "“아니요, 계속 돌려요, 계속. 곧 반짝반짝해질 겁니다. 지금은 아직 얼룩덜룩할 뿐이에요.” 대장장이가 말했다.", "orig": "\"No,\" said the smith, \"turn on, turn on; we shall have it bright by-and-by; as yet, it is only speckled.\"", "who": "벤저민 프랭클린", "role": "미국의 정치가·과학자", "src": "『프랭클린 자서전』 제9장 「도덕적 완성을 위한 계획」 — 이웃 대장장이와 도끼 일화", "url": "https://www.gutenberg.org/cache/epub/20203/pg20203.txt", "note": "대충 아는 단계에서 멈추면 그 개념은 끝내 얼룩덜룩한 도끼로 남는다."}, {"id": "w255", "kind": "classic", "kindName": "고전", "ko": "구하면 얻고, 내버려 두면 잃는다.", "orig": "求則得之 舍則失之", "who": "맹자", "role": "맹자", "src": "『맹자』 진심 상 제3장", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%AD%9F%E5%AD%90/%E5%B0%BD%E5%BF%83%E7%AB%A0%E5%8F%A5%E4%B8%8A/%E7%AC%AC%E4%B8%89%E8%8A%82/text.txt", "note": "어제 외운 단어도 오늘 한 번 더 불러내지 않으면 흩어져 버린다."}, {"id": "w256", "kind": "korea", "kindName": "우리 인물", "ko": "파고들어 가는 것도 부지런함이요, 뚫는 방도도 부지런함이요, 닦는 방법도 부지런함이다.", "who": "정약용", "role": "조선 후기 실학자", "src": "강진 유배 시절 제자 황상에게 준 가르침(삼근계)", "url": "https://mediahub.seoul.go.kr/archives/919591", "note": "머리 좋은 친구가 부러운 날엔 이 말을 떠올리자. 결국 남는 건 오늘 앉아 있던 시간이다."}, {"id": "w257", "kind": "science", "kindName": "과학자", "ko": "수학이 어렵다고 걱정하지 마라. 장담하건대 내 어려움은 그보다 더 크다.", "orig": "Do not worry about your difficulties in mathematics; I can assure you that mine are still greater.", "who": "알베르트 아인슈타인", "role": "물리학자 · 1921년 노벨 물리학상", "src": "1943년 1월 7일 학생 바버라에게 보낸 답장 (칼라프라이스 『친애하는 아인슈타인 박사님』)", "url": "https://www.askamathematician.com/2009/12/q-do-you-exactly-know-what-einstein-meant-by-do-not-worry-about-your-difficulties-in-mathematics-i-can-assure-you-mine-are-still-greater/", "note": "막힌다는 건 실력이 없어서가 아니라 제대로 된 문제를 만났다는 뜻이다."}, {"id": "w258", "kind": "west", "kindName": "서양 고전", "ko": "계획하기엔 어려워 보이는 일도 막상 해 보면 쉬운 경우가 많다.", "orig": "Many things difficult to design prove easy to performance.", "who": "새뮤얼 존슨", "role": "영국의 문인·사전 편찬자", "src": "『라셀라스』(1759) 제13장, 등장인물 임락(Imlac)의 말", "url": "https://www.gutenberg.org/cache/epub/652/pg652.txt", "note": "머릿속으로 걱정만 하던 수행평가도 목차부터 적기 시작하면 의외로 풀린다."}, {"id": "w259", "kind": "classic", "kindName": "고전", "ko": "세상의 어려운 일은 반드시 쉬운 데서 시작되고, 세상의 큰일은 반드시 작은 데서 시작된다.", "orig": "天下難事 必作於易 天下大事 必作於細", "who": "노자", "role": "도덕경", "src": "『도덕경』 제63장", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%80%81%E5%AD%90/%E5%BE%B7%E7%BB%8F/%E7%AC%AC%E5%85%AD%E5%8D%81%E4%B8%89%E7%AB%A0", "note": "어려운 단원도 쪼개면 쉬운 조각이 된다. 가장 쉬운 조각부터 시작하자."}, {"id": "w260", "kind": "west", "kindName": "서양 고전", "ko": "춤추는 별을 낳으려면 자기 안에 아직 혼돈을 품고 있어야 한다.", "orig": "one must still have chaos in one, to give birth to a dancing star.", "who": "프리드리히 니체", "role": "독일의 철학자", "src": "『차라투스트라는 이렇게 말했다』 서문 5절 (토머스 커먼 영역)", "url": "https://github.com/standardebooks/friedrich-nietzsche_thus-spake-zarathustra_thomas-common/blob/master/src/epub/text/prologue.xhtml", "note": "머릿속이 뒤죽박죽인 날에도 무언가는 자라고 있다."}, {"id": "w261", "kind": "classic", "kindName": "고전", "ko": "나는 일찍이 하루 종일 생각만 해 보았지만, 잠깐 배운 것만 못했다.", "orig": "吾嘗終日而思矣 不如須臾之所學也", "who": "순자", "role": "순자", "src": "『순자』 권학편", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%8D%80%E5%AD%90/%E5%8A%9D%E5%AD%A6", "note": "혼자 오래 헤매다 막히면 교과서를 펴거나 물어보자. 잠깐 배우는 것이 더 빠른 길일 때가 있다."}, {"id": "w262", "kind": "korea", "kindName": "우리 인물", "ko": "뜻을 세우는 것, 밝게 아는 것, 독실하게 행하는 것은 모두 나에게 달려 있으니 어찌 남에게서 구하겠는가.", "orig": "志之立 知之明 行之篤 皆在我耳 豈可他求哉", "who": "이이", "role": "조선 중기 학자", "src": "『격몽요결』 「입지장」", "url": "https://db.itkc.or.kr/dir/node?dataId=ITKC_MO_0201A_0280_010_0020", "note": "좋은 강의보다 먼저, 오늘 내가 책상에 앉아 있는 시간이 실력을 만든다."}, {"id": "w263", "kind": "writer", "kindName": "작가·사상가", "ko": "지금은 질문을 살아가세요. 그러면 언젠가, 알아차리지 못하는 사이에 조금씩 답 속으로 들어가 살게 될지도 모릅니다.", "orig": "Live the questions now. Perhaps you will then gradually, without noticing it, live along some distant day into the answer.", "who": "라이너 마리아 릴케", "role": "시인", "src": "『젊은 시인에게 보내는 편지』 네 번째 편지(1903.7.16)", "url": "https://en.wikiquote.org/wiki/Rainer_Maria_Rilke", "note": "‘왜 그럴까’를 품고 지내는 시간이 과학 공부의 진짜 시작이다."}, {"id": "w264", "kind": "west", "kindName": "서양 고전", "ko": "사람은 대개 남이 떠올린 이유보다 스스로 찾아낸 이유에 더 잘 설득된다.", "orig": "People are generally better persuaded by the reasons which they have themselves discovered than by those which have come into the mind of others.", "who": "블레즈 파스칼", "role": "프랑스의 수학자·철학자", "src": "『팡세』 10 (더턴판 영역(T. S. 엘리엇 서문), 브룅슈비크 번호)", "url": "https://www.gutenberg.org/ebooks/18269", "note": "해설지를 펴기 전 5분만 더 고민해 보면, 그 답은 내 것이 된다."}, {"id": "w265", "kind": "classic", "kindName": "고전", "ko": "군자는 글과 학문으로 벗을 모으고, 벗을 통해 인(仁)을 키운다.", "orig": "君子以文會友 以友輔仁", "who": "증자", "role": "논어", "src": "『논어』 안연편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%AE%BA%E8%AF%AD/%E9%A2%9C%E6%B8%8A%E7%AF%87/text.txt", "note": "함께 문제를 푸는 친구는 서로의 빈틈을 채워 주는 좋은 선생이다."}, {"id": "w266", "kind": "science", "kindName": "과학자", "ko": "중요한 것은 질문을 멈추지 않는 것이다. 호기심은 그 자체로 존재할 이유가 있다.", "orig": "The important thing is not to stop questioning. Curiosity has its own reason for existence.", "who": "알베르트 아인슈타인", "role": "물리학자 · 1921년 노벨 물리학상", "src": "『라이프』 1955년 5월 2일호, 편집자 윌리엄 밀러와의 대화", "url": "https://en.wikiquote.org/wiki/Albert_Einstein", "note": "시험에 안 나와도 궁금하면 찾아보자. 그 궁금함이 공부를 오래 버티게 한다."}, {"id": "w267", "kind": "west", "kindName": "서양 고전", "ko": "현명한 사람은 찾아낸 기회보다 더 많은 기회를 만들어 낸다.", "orig": "A wise man will make more opportunities, than he finds.", "who": "프랜시스 베이컨", "role": "영국의 철학자", "src": "『수상록』 「예절과 존중에 대하여(Of Ceremonies and Respects)」", "url": "https://www.gutenberg.org/ebooks/575", "note": "질문 하나 들고 선생님을 찾아가는 것도 스스로 만든 기회다."}, {"id": "w268", "kind": "classic", "kindName": "고전", "ko": "널리 배우되 뜻을 굳게 하고, 절실하게 묻되 가까운 것부터 생각한다.", "orig": "博學而篤志 切問而近思", "who": "자하", "role": "논어", "src": "『논어』 자장편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%AE%BA%E8%AF%AD/%E5%AD%90%E5%BC%A0%E7%AF%87/text.txt", "note": "막연히 고민하기보다 지금 푸는 문제에서 구체적으로 묻는 것이 공부다."}, {"id": "w269", "kind": "korea", "kindName": "우리 인물", "ko": "구름 빛이 좋다 하나 검기를 자주 한다 / 바람 소리 맑다 하나 그칠 적이 많구나 / 좋고도 그칠 때 없기는 물뿐인가 하노라", "orig": "구룸빗치조타ᄒᆞ나검기ᄅᆞᆯᄌᆞ로ᄒᆞᆫ다 / ᄇᆞ람소ᄅᆡᄆᆞᆰ다ᄒᆞ나그칠적이하노매라 / 조코도그츨뉘업기ᄂᆞᆫ믈뿐인가ᄒᆞ노라", "who": "윤선도", "role": "조선 중기 문신·시인", "src": "「오우가(五友歌)」 중 물 · 『산중신곡』(1642년)", "url": "https://ko.wikisource.org/wiki/오우가", "note": "반짝 열심보다 그치지 않는 꾸준함이 이긴다. 오늘도 물처럼 조금씩 흘러가자."}, {"id": "w270", "kind": "modern", "kindName": "운동·예술", "ko": "마음속에서 '너는 화가가 아니야'라는 목소리가 들리면, 그럴수록 그려라. 그 목소리는 오직 작업으로만 잠잠해진다.", "orig": "If you hear a voice within you saying, 'You are not a painter,' then by all means paint, boy, and that voice will be silenced, but only by working.", "who": "빈센트 반 고흐", "role": "화가", "src": "1883년 10월 초 니우암스테르담에서 테오에게 보낸 편지(1958년 『The Complete Letters』 영역)", "url": "https://quoteinvestigator.com/2026/06/24/voice-paint/", "note": "'나는 수학 머리가 없어'라는 생각은 한 문제 더 풀 때마다 조금씩 작아진다."}, {"id": "w271", "kind": "west", "kindName": "서양 고전", "ko": "모든 습관과 능력은 그에 맞는 행동으로 유지되고 자란다. 잘 읽고 싶으면 읽고, 잘 쓰고 싶으면 써라.", "orig": "Every habit and faculty is maintained and increased by the corresponding actions… If you would be a good reader, read; if a writer, write.", "who": "에픽테토스", "role": "그리스의 스토아 철학자", "src": "『담화록』 제2권 18장 (조지 롱 영역)", "url": "https://github.com/standardebooks/epictetus_discourses_george-long/blob/master/src/epub/text/book-2.xhtml", "note": "잘 풀고 싶으면 풀면 된다. 오늘의 한 문제가 내일의 습관이 된다."}, {"id": "w272", "kind": "classic", "kindName": "고전", "ko": "남을 아는 사람은 지혜롭고, 자신을 아는 사람은 밝다. 남을 이기는 사람은 힘이 있고, 자신을 이기는 사람은 강하다.", "orig": "知人者智 自知者明 勝人者有力 自勝者强", "who": "노자", "role": "도덕경", "src": "『도덕경』 제33장", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%80%81%E5%AD%90/%E9%81%93%E7%BB%8F/%E7%AC%AC%E4%B8%89%E5%8D%81%E4%B8%89%E7%AB%A0", "note": "친구를 이기는 것보다 어제 미뤘던 나를 이기는 것이 더 큰 힘이다."}, {"id": "w273", "kind": "classic", "kindName": "고전", "ko": "장인이 일을 잘하려면 먼저 연장부터 날카롭게 벼린다.", "orig": "工欲善其事 必先利其器", "who": "공자", "role": "논어", "src": "『논어』 위령공편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%AE%BA%E8%AF%AD/%E5%8D%AB%E7%81%B5%E5%85%AC%E7%AF%87/text.txt", "note": "공부 전 5분, 책상을 치우고 오답 노트를 펼치는 것이 연장을 가는 일이다."}, {"id": "w274", "kind": "west", "kindName": "서양 고전", "ko": "우리는 우리의 밭을 가꾸어야 합니다.", "orig": "we must cultivate our garden.", "who": "볼테르", "role": "프랑스의 작가·사상가", "src": "『캉디드』 제30장, 캉디드의 말 (모던 라이브러리 영역)", "url": "https://www.gutenberg.org/ebooks/19942", "note": "남의 점수보다 내 책상 위 오늘 할 일을 가꾸는 것이 먼저다."}, {"id": "w275", "kind": "writer", "kindName": "작가·사상가", "ko": "지성에 인격을 더하는 것, 그것이 참된 교육의 목표다.", "orig": "Intelligence plus character—that is the goal of true education.", "who": "마틴 루서 킹 주니어", "role": "목사·민권운동가", "src": "「교육의 목적(The Purpose of Education)」, 모어하우스 대학 신문 『Maroon Tiger』(1947)", "url": "https://kinginstitute.stanford.edu/king-papers/documents/purpose-education", "note": "문제를 잘 푸는 머리와 친구에게 설명해 주는 마음, 둘 다 공부다."}, {"id": "w276", "kind": "korea", "kindName": "우리 인물", "ko": "입으로만 읽고 마음으로 새기지 않고 몸으로 행하지 않으면, 책은 책이고 나는 나일 뿐이니 무슨 도움이 되겠는가.", "orig": "若口讀而心不體 身不行 則書自書 我自我 何益之有", "who": "이이", "role": "조선 중기 학자", "src": "『격몽요결』 「독서장」", "url": "https://db.itkc.or.kr/dir/node?dataId=ITKC_MO_0201A_0280_010_0050", "note": "한 쪽을 읽었으면 책을 덮고 방금 읽은 내용을 내 말로 설명해 보자."}, {"id": "w277", "kind": "classic", "kindName": "고전", "ko": "글씨를 좋아한 사람은 많았지만 창힐의 이름만 전해지는 것은, 그가 한결같았기 때문이다.", "orig": "好書者衆矣 而倉頡獨傳者 壹也", "who": "순자", "role": "순자", "src": "『순자』 해폐편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%8D%80%E5%AD%90/%E8%A7%A3%E8%94%BD/text.txt", "note": "여러 개를 조금씩 건드리기보다 하나를 끝까지 붙드는 힘이 실력을 만든다."}, {"id": "w278", "kind": "science", "kindName": "과학자", "ko": "이 편지가 길어진 것은 더 짧게 쓸 여유가 없었기 때문이다.", "orig": "Je n'ai fait celle-ci plus longue que parce que je n'ai pas eu le loisir de la faire plus courte.", "who": "블레즈 파스칼", "role": "수학자·물리학자", "src": "『시골 친구에게 보내는 편지(Lettres provinciales)』 제16신 (1656년 12월 4일)", "url": "https://en.wikiquote.org/wiki/Blaise_Pascal", "note": "요약 노트를 한 장으로 줄이는 데 드는 시간이 곧 이해하는 시간이다."}, {"id": "w279", "kind": "west", "kindName": "서양 고전", "ko": "사람을 흔드는 것은 일어난 일 자체가 아니라, 그 일에 대한 생각이다.", "orig": "Men are disturbed not by the things which happen, but by the opinions about the things", "who": "에픽테토스", "role": "그리스의 스토아 철학자", "src": "『엥케이리디온』 제5장 (조지 롱 영역)", "url": "https://github.com/standardebooks/epictetus_short-works_george-long/blob/master/src/epub/text/the-enchiridion.xhtml", "note": "모의고사 점수보다 ‘이제 끝났다’는 해석이 마음을 더 크게 흔든다."}, {"id": "w280", "kind": "classic", "kindName": "고전", "ko": "마음 비우기를 끝까지 하고, 고요함을 두텁게 지킨다.", "orig": "致虛極 守靜篤", "who": "노자", "role": "도덕경", "src": "『도덕경』 제16장", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%80%81%E5%AD%90/%E9%81%93%E7%BB%8F/%E7%AC%AC%E5%8D%81%E5%85%AD%E7%AB%A0/text.txt", "note": "시험 전날에는 새 문제보다 마음을 비우고 차분히 앉는 것이 먼저다."}, {"id": "w281", "kind": "west", "kindName": "서양 고전", "ko": "안을 들여다보라. 선의 샘은 네 안에 있고, 계속 파면 계속 솟아오른다.", "orig": "Look within. Within is the fountain of good, and it will ever bubble up, if thou wilt ever dig.", "who": "마르쿠스 아우렐리우스", "role": "로마 황제·스토아 철학자", "src": "『명상록』 제7권 59절 (조지 롱 영역)", "url": "https://github.com/standardebooks/marcus-aurelius_meditations_george-long/blob/master/src/epub/text/book-7.xhtml", "note": "파고들수록 더 궁금해지는 것, 그때 공부는 샘이 된다."}, {"id": "w282", "kind": "korea", "kindName": "우리 인물", "ko": "날이 추운 뒤에야 소나무와 잣나무가 시들지 않음을 안다.", "orig": "歲寒然後知松柏之不彫", "who": "안중근", "role": "독립운동가", "src": "1910년 뤼순감옥 유묵 · 보물 제569-10호(안중근의사기념관 소장) · 『논어』 「자한」 구절", "url": "https://www.khan.co.kr/article/202010200600001", "note": "힘들 때 실력이 드러난다. 시험 기간에 버틴 오늘 한 시간이 그 증거가 된다."}, {"id": "w283", "kind": "classic", "kindName": "고전", "ko": "스스로 돌아보아 떳떳하다면, 천만 명이 막아서도 나는 나아간다.", "orig": "自反而縮 雖千萬人 吾往矣", "who": "공자(증자 전언)", "role": "맹자", "src": "『맹자』 공손추 상 제2장 (증자가 전한 공자의 말)", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%AD%9F%E5%AD%90/%E5%85%AC%E5%AD%99%E4%B8%91%E7%AB%A0%E5%8F%A5%E4%B8%8A/%E7%AC%AC%E4%BA%8C%E8%8A%82/text.txt", "note": "남들이 다 쉬어도 내가 세운 계획이 옳다면 흔들리지 말고 가면 된다."}, {"id": "w284", "kind": "west", "kindName": "서양 고전", "ko": "아는 것만으로는 부족하다. 적용해야 한다. 원하는 것만으로는 부족하다. 행해야 한다.", "orig": "It is not enough to know, we must also apply; it is not enough to will, we must also do.", "who": "요한 볼프강 폰 괴테", "role": "독일의 작가", "src": "『잠언과 성찰』 324 (T. B. 손더스 영역)", "url": "https://www.gutenberg.org/ebooks/33670", "note": "공식을 외웠다면 오늘은 그 공식으로 문제를 직접 풀어 볼 차례다."}, {"id": "w285", "kind": "writer", "kindName": "작가·사상가", "ko": "우리가 정할 수 있는 건, 우리에게 주어진 시간으로 무엇을 할지뿐이다.", "orig": "All we have to decide is what to do with the time that is given us.", "who": "J. R. R. 톨킨", "role": "작가·언어학자", "src": "『반지의 제왕: 반지 원정대』(1954) 2장 「과거의 그림자」, 간달프의 말", "url": "https://wist.info/tolkien-jrr/3881/", "note": "시험까지 남은 날은 못 바꿔도, 오늘 하루를 어떻게 쓸지는 정할 수 있다."}, {"id": "w286", "kind": "classic", "kindName": "고전", "ko": "마음이 있지 않으면 보아도 보이지 않고, 들어도 들리지 않으며, 먹어도 그 맛을 모른다.", "orig": "心不在焉 視而不見 聽而不聞 食而不知其味", "who": "증자(전승)", "role": "대학", "src": "『대학』 전7장", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%A4%A7%E5%AD%A6%E7%AB%A0%E5%8F%A5%E9%9B%86%E6%B3%A8/%E7%AC%AC%E5%85%AB%E7%AB%A0", "note": "책을 펴 놓고 딴생각하면 한 시간도 빈 시간이 된다. 짧게라도 마음을 두자."}, {"id": "w287", "kind": "west", "kindName": "서양 고전", "ko": "생각할수록 늘 새롭고 커지는 경탄으로 마음을 채우는 두 가지가 있다. 내 위의 별이 빛나는 하늘과 내 안의 도덕 법칙이다.", "orig": "Two things fill the mind with ever new and increasing admiration and awe, the oftener and the more steadily we reflect on them: the starry heavens above and the moral law within.", "who": "이마누엘 칸트", "role": "독일의 철학자", "src": "『실천이성비판』 맺음말 (T. K. 애벗 영역)", "url": "https://www.gutenberg.org/ebooks/5683", "note": "밤하늘을 궁금해하는 마음과 바르게 살고 싶은 마음, 둘 다 공부의 이유가 된다."}, {"id": "w288", "kind": "modern", "kindName": "운동·예술", "ko": "그건 그저 한 포인트일 뿐이다.", "orig": "It's only a point.", "who": "로저 페더러", "role": "테니스 선수", "src": "2024년 6월 9일 다트머스대 졸업식 연설", "url": "https://home.dartmouth.edu/news/2024/06/2024-commencement-address-roger-federer", "note": "경기의 80%를 이긴 페더러도 포인트는 54%만 땄다. 한 문제 놓친 건 한 포인트다."}, {"id": "w006", "kind": "science", "kindName": "과학자", "ko": "우리는 알아야 한다. 우리는 알게 될 것이다.", "orig": "Wir müssen wissen. Wir werden wissen.", "who": "다비트 힐베르트", "role": "수학자", "src": "1930년 9월 8일 쾨니히스베르크 독일과학자·의사협회 연설 마무리", "url": "https://en.wikiquote.org/wiki/David_Hilbert", "note": "모르는 게 있다는 사실이 부끄러운 게 아니다. 모른 채로 두는 것이 부끄러운 것이다."}, {"id": "w289", "kind": "korea", "kindName": "우리 인물", "ko": "학문의 길은 다른 길이 없다. 모르는 것이 있으면 길 가는 사람이라도 붙들고 물어야 한다.", "orig": "學問之道無他 有不識 執塗之人而問之可也", "who": "박지원", "role": "조선 후기 실학자·문장가", "src": "「북학의서(北學議序)」 · 박제가 『북학의』에 붙인 서문, 『연암집』 권7", "url": "https://db.itkc.or.kr/dir/node?dataId=ITKC_BT_0568A_0070_010_0060", "note": "모르는 걸 묻는 건 창피가 아니라 지름길이다. 오늘 막힌 문제 하나를 꼭 물어보자."}, {"id": "w290", "kind": "classic", "kindName": "고전", "ko": "회오리바람은 아침 내내 불지 못하고, 소나기는 하루 종일 내리지 못한다.", "orig": "飄風不終朝 驟雨不終日", "who": "노자", "role": "도덕경", "src": "『도덕경』 제23장", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%80%81%E5%AD%90/%E9%81%93%E7%BB%8F/%E7%AC%AC%E4%BA%8C%E5%8D%81%E4%B8%89%E7%AB%A0/text.txt", "note": "지금의 슬럼프도 소나기처럼 지나간다. 오늘은 우산 쓰고 한 걸음만 가자."}, {"id": "w291", "kind": "west", "kindName": "서양 고전", "ko": "마음에도 휴식이 필요하다. 쉬고 나면 더 좋아지고 더 힘차게 일어선다.", "orig": "Men’s minds ought to have relaxation: they rise up better and more vigorous after rest.", "who": "세네카", "role": "로마의 스토아 철학자", "src": "『마음의 평정에 대하여』 제17장 (오브리 스튜어트 영역)", "url": "https://github.com/standardebooks/seneca_dialogues_aubrey-stewart/blob/master/src/epub/text/on-peace-of-mind.xhtml", "note": "쉬는 시간 10분은 도망이 아니라 다음 공부를 위한 준비다."}, {"id": "w292", "kind": "classic", "kindName": "고전", "ko": "마음에서 잊지도 말고, 억지로 자라게 돕지도 말라.", "orig": "心勿忘 勿助長也", "who": "맹자", "role": "맹자", "src": "『맹자』 공손추 상 제2장", "url": "https://chinesetexts.stanford.edu/5-mengzi-%e5%ad%9f%e5%ad%90-mencius", "note": "싹을 뽑아 올린 송나라 농부처럼 서두르지 말자. 잊지 않고 매일 물 주면 자란다."}, {"id": "w293", "kind": "west", "kindName": "서양 고전", "ko": "삶은 모든 원 바깥에 또 하나의 원을 그릴 수 있다는 진리를 배우는 수습 기간이다. 자연에 끝은 없으며 모든 끝은 시작이다.", "orig": "Our life is an apprenticeship to the truth that around every circle another can be drawn; that there is no end in nature, but every end is a beginning", "who": "랠프 월도 에머슨", "role": "미국의 사상가·시인", "src": "『에세이 제1집』(1841) 「원(Circles)」", "url": "https://www.gutenberg.org/cache/epub/2944/pg2944.txt", "note": "시험이 끝난 날은 다음 공부가 시작되는 날이기도 하다."}, {"id": "w294", "kind": "writer", "kindName": "작가·사상가", "ko": "네 장미를 그토록 소중하게 만든 건, 네가 그 장미를 위해 쓴 시간이야.", "orig": "It is the time you have wasted for your rose that makes your rose so important.", "who": "앙투안 드 생텍쥐페리", "role": "작가·비행사", "src": "『어린 왕자』(1943) 여우와의 대화", "url": "https://media.franceintheus.org/12090/", "note": "오래 붙잡은 과목일수록 정이 든다. 들인 시간이 곧 의미가 된다."}, {"id": "w295", "kind": "korea", "kindName": "우리 인물", "ko": "제 삶에서 기본 중의 기본이 청소, 운동, 독서라고 생각합니다.", "who": "손웅정", "role": "축구 지도자·손흥민 선수의 아버지", "src": "2024년 4월 CBS 『김현정의 뉴스쇼』 인터뷰", "url": "https://www.nocutnews.co.kr/news/6136011", "note": "책상 정리 5분, 스트레칭 5분, 그리고 책. 기본부터 챙기면 하루가 선다."}, {"id": "w296", "kind": "west", "kindName": "서양 고전", "ko": "위대한 일은 힘이 아니라 끈기로 이루어진다.", "orig": "Great works are performed not by strength, but perseverance", "who": "새뮤얼 존슨", "role": "영국의 문인", "src": "『라셀라스』 제13장, 임락의 말", "url": "https://github.com/standardebooks/samuel-johnson_the-history-of-rasselas-prince-of-abissinia/blob/master/src/epub/text/chapter-13.xhtml", "note": "저 궁전도 돌 하나씩 쌓아 올린 것이라고, 소설 속 스승은 말한다."}, {"id": "w007", "kind": "classic", "kindName": "고전", "ko": "배우고 때에 맞추어 익히니, 또한 기쁘지 아니한가.", "orig": "學而時習之 不亦說乎", "who": "공자", "role": "논어", "src": "『논어』 학이편 제1장", "url": "https://zh.wikisource.org/wiki/%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80", "note": "배우는 것과 익히는 것은 다른 일이다. 오늘 읽은 개념을 문제로 한 번 더 만나야 내 것이 된다."}, {"id": "w297", "kind": "classic", "kindName": "고전", "ko": "만족할 줄 알면 욕되지 않고, 멈출 줄 알면 위태롭지 않아 오래갈 수 있다.", "orig": "知足不辱 知止不殆 可以長久", "who": "노자", "role": "도덕경", "src": "『도덕경』 제44장", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%80%81%E5%AD%90/%E5%BE%B7%E7%BB%8F/%E7%AC%AC%E5%9B%9B%E5%8D%81%E5%9B%9B%E7%AB%A0/text.txt", "note": "밤샘의 무리보다 멈출 때를 아는 계획이 한 학기를 끝까지 버티게 한다."}, {"id": "w298", "kind": "science", "kindName": "과학자", "ko": "나는 바닷가에서 놀며 이따금 더 매끈한 조약돌이나 더 예쁜 조개껍데기를 찾고 즐거워하는 소년에 불과했던 것 같다. 그동안 거대한 진리의 바다는 온통 미지인 채 내 앞에 놓여 있었다.", "orig": "to myself I seem to have been only like a boy playing on the sea-shore, and diverting myself in now and then finding a smoother pebble or a prettier shell than ordinary, whilst the great ocean of truth lay all undiscovered before me.", "who": "아이작 뉴턴", "role": "물리학자·수학자", "src": "말년의 말로 전함 (스펜스 『일화집』; 브루스터 『뉴턴 회고록』 1855, 2권 27장)", "url": "https://todayinsci.com/N/Newton_Isaac/NewtonIsaac-PlayingOnTheSeashore.htm", "note": "한 단원을 끝냈는데 모르는 게 더 보인다면, 제대로 들어가고 있다는 뜻이다."}, {"id": "w299", "kind": "west", "kindName": "서양 고전", "ko": "시간을 허비하지 말라. 늘 유익한 일을 하고, 불필요한 행동은 모두 끊어라.", "orig": "Lose no time; be always employed in something useful; cut off all unnecessary actions.", "who": "벤저민 프랭클린", "role": "미국의 과학자·정치가", "src": "『프랭클린 자서전』 13가지 덕목 중 ‘근면’", "url": "https://standardebooks.org/ebooks/benjamin-franklin/the-autobiography-of-benjamin-franklin/text/single-page", "note": "휴대폰을 다른 방에 두는 것도 불필요한 행동을 끊는 작은 방법이다."}, {"id": "w300", "kind": "korea", "kindName": "우리 인물", "ko": "제 대학 생활은 잘 포장해서 이야기해도 길 잃음의 연속이었습니다.", "who": "허준이", "role": "수학자·2022 필즈상 수상자", "src": "2022년 8월 29일 서울대 제76회 후기 학위수여식 축사", "url": "https://www.joongang.co.kr/article/25097830", "note": "필즈상 수학자도 길을 잃었다. 지금 헤매고 있다면 가는 중이라는 뜻이다."}, {"id": "w301", "kind": "west", "kindName": "서양 고전", "ko": "습관은 어린 시절에 시작될 때 가장 완전하다. 이것을 우리는 교육이라 부르니, 교육이란 결국 일찍 들인 습관이다.", "orig": "Certainly custom is most perfect, when it beginneth in young years: this we call education; which is, in effect, but an early custom.", "who": "프랜시스 베이컨", "role": "영국의 철학자·정치가", "src": "『수상록(Essays)』 「습관과 교육에 관하여(Of Custom and Education)」", "url": "https://www.gutenberg.org/cache/epub/575/pg575.txt", "note": "지금 몸에 붙인 책상 앞 습관이 대학에 가서도 나를 계속 데려간다."}, {"id": "w302", "kind": "modern", "kindName": "운동·예술", "ko": "영감은 아마추어나 기다리는 것이다. 나머지 우리는 그냥 나타나서 일을 시작한다.", "orig": "Inspiration is for amateurs—the rest of us just show up and get to work.", "who": "척 클로스", "role": "화가", "src": "2006년 4월 조 피그와의 인터뷰, 『Inside the Painter's Studio』(2009) 수록", "url": "https://en.wikiquote.org/wiki/Chuck_Close", "note": "공부할 기분이 나기를 기다리지 말고, 일단 책상에 앉으면 기분이 따라온다."}, {"id": "w303", "kind": "writer", "kindName": "작가·사상가", "ko": "어둠은 어둠을 몰아낼 수 없다. 오직 빛만이 할 수 있다. 미움은 미움을 몰아낼 수 없다. 오직 사랑만이 할 수 있다.", "orig": "Darkness cannot drive out darkness; only light can do that. Hate cannot drive out hate; only love can do that.", "who": "마틴 루서 킹 주니어", "role": "목사·민권운동가", "src": "『사랑의 힘(Strength to Love)』(1963)", "url": "https://africacheck.org/fbcheck/darkness-cannot-drive-out-darkness-quote-is-by-martin-luther-king/", "note": "경쟁이 치열한 교실일수록, 친구에게 건네는 작은 친절이 빛이 된다."}, {"id": "w304", "kind": "classic", "kindName": "고전", "ko": "활시위를 한 번 당기면 한 번은 늦추는 것, 그것이 문왕과 무왕의 도리였다.", "orig": "一張一弛 文武之道也", "who": "공자(전승)", "role": "예기", "src": "『예기』 잡기 하편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E7%A4%BC%E8%AE%B0/%E6%9D%82%E8%AE%B0%E4%B8%8B/text.txt", "note": "쉼도 공부 계획의 일부다. 50분 집중했다면 10분은 제대로 쉬자."}, {"id": "w305", "kind": "classic", "kindName": "고전", "ko": "사람들은 일을 거의 다 이룰 무렵에 그르치곤 한다. 끝을 처음처럼 삼가면 실패하는 일이 없다.", "orig": "民之從事 常於幾成而敗之 愼終如始 則無敗事", "who": "노자", "role": "도덕경", "src": "『도덕경』 제64장", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%80%81%E5%AD%90/%E5%BE%B7%E7%BB%8F/%E7%AC%AC%E5%85%AD%E5%8D%81%E5%9B%9B%E7%AB%A0/text.txt", "note": "마지막 문제, 마지막 한 주가 가장 위험하다. 처음 마음으로 끝까지 검토하자."}, {"id": "w306", "kind": "west", "kindName": "서양 고전", "ko": "지나치게 조심하는 사람은 이루는 것이 적다.", "orig": "The man that’s over-cautious will do little.", "who": "프리드리히 실러", "role": "독일의 극작가·시인", "src": "『빌헬름 텔』 제3막 1장, 텔의 대사 (시어도어 마틴 영역)", "url": "https://www.gutenberg.org/ebooks/6788", "note": "완벽한 계획을 기다리기보다 일단 한 단원을 시작해 보는 날도 필요하다."}, {"id": "w307", "kind": "classic", "kindName": "고전", "ko": "군자의 배움은 귀로 들어와 마음에 붙고, 온몸에 퍼져 행동으로 드러난다.", "orig": "君子之學也 入乎耳 箸乎心 布乎四體 形乎動靜", "who": "순자", "role": "순자", "src": "『순자』 권학편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%8D%80%E5%AD%90/%E5%8A%9D%E5%AD%A6/text.txt", "note": "들은 설명을 내 손으로 한 번 써 봐야 비로소 마음에 붙는다."}, {"id": "w308", "kind": "west", "kindName": "서양 고전", "ko": "검토하는 어려움 하나하나를 가능한 한, 그리고 해결에 필요한 만큼 작은 부분으로 나누어라.", "orig": "to divide each of the difficulties under examination into as many parts as possible, and as might be necessary for its adequate solution.", "who": "르네 데카르트", "role": "프랑스의 철학자·수학자", "src": "『방법서설』 제2부 (존 비치 영역)", "url": "https://www.gutenberg.org/ebooks/59", "note": "막히는 서술형 문제도 조건을 하나씩 쪼개면 풀 수 있는 조각이 된다."}, {"id": "w309", "kind": "korea", "kindName": "우리 인물", "ko": "독서야말로 인간의 제일가는 깨끗한 일이다.", "orig": "讀書是人間第一件淸事", "who": "정약용", "role": "조선 후기 실학자", "src": "강진 유배지에서 두 아들에게 보낸 편지 「기이아(寄二兒)」 · 1802년 12월 22일", "url": "https://db.itkc.or.kr/dir/node?dataId=ITKC_MO_0597A_0210_010_0030", "note": "오늘 밤엔 화면 대신 책 열 쪽으로 하루를 닫아 보자."}, {"id": "w310", "kind": "science", "kindName": "과학자", "ko": "자연의 법칙에 맞기만 하다면, 너무 놀라워서 참일 수 없는 것은 없다. 그리고 이런 일에서 그 맞음을 가리는 가장 좋은 시험은 실험이다.", "orig": "Nothing is too wonderful to be true, if it be consistent with the laws of nature; and in such things as these, experiment is the best test of such consistency.", "who": "마이클 패러데이", "role": "물리학자·화학자", "src": "1849년 3월 19일 실험 일지 제10,040항 (『패러데이의 생애와 편지』 1870 수록)", "url": "https://en.wikiquote.org/wiki/Michael_Faraday", "note": "'설마' 싶은 답도 조건과 맞는지 끝까지 확인해 보면 정답일 때가 있다."}, {"id": "w311", "kind": "classic", "kindName": "고전", "ko": "군자의 사귐은 물처럼 담백하고, 소인의 사귐은 단술처럼 달다.", "orig": "君子之交淡若水 小人之交甘若醴", "who": "장자", "role": "장자", "src": "『장자』 외편 산목", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%BA%84%E5%AD%90/%E5%A4%96%E7%AF%87/%E5%B1%B1%E6%9C%A8/text.txt", "note": "요란하지 않아도 오래 곁에 있는 친구가 공부 길에서도 가장 든든하다."}, {"id": "w312", "kind": "west", "kindName": "서양 고전", "ko": "나아지고 싶다면, 겉으로 보이는 일에서는 어리석고 둔해 보이는 것도 받아들여라.", "orig": "If you would improve, be content to be thought foolish and dull with regard to externals.", "who": "에픽테토스", "role": "고대 그리스의 스토아 철학자", "src": "『엥케이리디온』 제13절 (T. W. Higginson 역)", "url": "https://www.gutenberg.org/cache/epub/45109/pg45109.txt", "note": "모르는 걸 묻는 순간 잠깐 멍청해 보여도 그 질문이 실력으로 남는다."}, {"id": "w313", "kind": "writer", "kindName": "작가·사상가", "ko": "완벽함이란 더할 것이 없을 때가 아니라, 더 뺄 것이 없을 때 이루어지는 듯하다.", "orig": "Il semble que la perfection soit atteinte non quand il n'y a plus rien à ajouter, mais quand il n'y a plus rien à retrancher.", "who": "앙투안 드 생텍쥐페리", "role": "작가·비행사", "src": "『인간의 대지(Terre des hommes)』(1939) 3장", "url": "https://en.wikiquote.org/wiki/Antoine_de_Saint-Exup%C3%A9ry", "note": "요약 노트도 그렇다. 더 쓸 게 없을 때보다 더 뺄 게 없을 때 완성이다."}, {"id": "w314", "kind": "classic", "kindName": "고전", "ko": "천하의 책을 두루 보지 않았다면, 함부로 고치거나 옳고 그름을 단정해서는 안 된다.", "orig": "觀天下書未遍 不得妄下雌黃", "who": "안지추", "role": "안씨가훈", "src": "『안씨가훈』 면학편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E9%A2%9C%E6%B0%8F%E5%AE%B6%E8%AE%AD/%E5%8B%89%E5%AD%A6%E7%AF%87/text.txt", "note": "한 권 읽고 다 안다고 단정하지 말자. 아직 모르는 부분이 늘 남아 있다."}, {"id": "w315", "kind": "korea", "kindName": "우리 인물", "ko": "나는 나에게 작은 손을 내밀어 / 눈물과 위안으로 잡는 최초의 악수.", "orig": "나는 나에게 적은 손을 내밀어 / 눈물과 慰安으로 잡는 最初의 握手.", "who": "윤동주", "role": "시인", "src": "「쉽게 씌어진 시」(1942) · 『하늘과 바람과 별과 시』", "url": "https://ko.wikisource.org/wiki/하늘과_바람과_별과_시_(1955년)/쉽게_씨워진_시", "note": "시험을 망친 날엔 나에게 먼저 손을 내밀자. 다시 일어설 힘은 거기서 나온다."}, {"id": "w316", "kind": "classic", "kindName": "고전", "ko": "오곡은 씨앗 가운데 좋은 것이지만, 여물지 않으면 돌피만도 못하다.", "orig": "五穀者 種之美者也 苟爲不熟 不如荑稗", "who": "맹자", "role": "맹자", "src": "『맹자』 고자 상 제19장", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%AD%9F%E5%AD%90/%E5%91%8A%E5%AD%90%E7%AB%A0%E5%8F%A5%E4%B8%8A/%E7%AC%AC%E5%8D%81%E4%B9%9D%E8%8A%82/text.txt", "note": "좋은 문제집도 끝까지 익혀야 내 것이 된다. 반쯤 푼 한 권을 마저 익히자."}, {"id": "w317", "kind": "west", "kindName": "서양 고전", "ko": "너 자신을 고수하라. 결코 흉내 내지 마라.", "orig": "Insist on yourself; never imitate.", "who": "랠프 월도 에머슨", "role": "미국의 사상가·시인", "src": "『에세이 제1집』(1841) 「자기 신뢰(Self-Reliance)」", "url": "https://www.gutenberg.org/cache/epub/2944/pg2944.txt", "note": "1등의 공부법을 그대로 베끼기보다 내게 맞는 방법을 찾는 데 시간을 쓴다."}, {"id": "w318", "kind": "science", "kindName": "과학자", "ko": "인간은 자연에서 가장 약한 한 줄기 갈대일 뿐이다. 그러나 생각하는 갈대다.", "orig": "L'homme n'est qu'un roseau, le plus faible de la nature; mais c'est un roseau pensant.", "who": "블레즈 파스칼", "role": "수학자·물리학자", "src": "『팡세』 (브랑슈비크 판 단장 347)", "url": "https://primarysources.learnquebec.ca/resources-edu/pensees-de-blaise-pascal/", "note": "지친 날에도 한 문제를 끝까지 생각해 냈다면, 그날은 충분히 강했다."}, {"id": "w319", "kind": "classic", "kindName": "고전", "ko": "누가 흐린 물을 멈추게 하여, 고요히 두어 서서히 맑아지게 할 수 있는가?", "orig": "孰能濁以止 靜之徐清", "who": "노자", "role": "도덕경", "src": "『도덕경』 제15장", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%80%81%E5%AD%90/%E9%81%93%E7%BB%8F/%E7%AC%AC%E5%8D%81%E4%BA%94%E7%AB%A0/text.txt", "note": "머릿속이 뒤죽박죽일 땐 억지로 풀지 말고 3분만 가만히 가라앉히자."}, {"id": "w320", "kind": "west", "kindName": "서양 고전", "ko": "기억하라. 지금이 시합이고 지금이 올림픽이며, 그것은 미룰 수 없다.", "orig": "remember that now is the contest, now are the Olympic games, and they cannot be deferred", "who": "에픽테토스", "role": "그리스의 스토아 철학자", "src": "『엥케이리디온』 제51장 (조지 롱 영역)", "url": "https://github.com/standardebooks/epictetus_short-works_george-long/blob/master/src/epub/text/the-enchiridion.xhtml", "note": "먼 시험날보다 오늘의 책상 앞이 진짜 경기장이다."}, {"id": "w321", "kind": "modern", "kindName": "운동·예술", "ko": "아직도 조금씩 나아지고 있다고 생각하니까요.", "orig": "Because I think I am making progress.", "who": "파블로 카잘스", "role": "첼리스트", "src": "1958년 신문 칼럼 보도: 81세에 하루 4~5시간 연습하는 이유를 묻는 감독 로버트 스나이더에게 한 답", "url": "https://quoteinvestigator.com/2014/02/12/casals-progress/", "note": "어제보다 한 문제라도 더 이해했다면, 오늘 공부할 이유는 충분하다."}, {"id": "w322", "kind": "west", "kindName": "서양 고전", "ko": "설리번 선생님은 내 이마에 손을 대고 힘주어 손바닥에 철자를 적어 주셨다. “생각해.”", "orig": "Miss Sullivan touched my forehead and spelled with decided emphasis, \"Think.\"", "who": "헬렌 켈러", "role": "미국의 작가·사회운동가", "src": "『내 삶의 이야기(The Story of My Life)』(1903) 제6장", "url": "https://www.gutenberg.org/cache/epub/2397/pg2397.txt", "note": "헬렌이 처음 깨친 추상어가 '생각'이었듯, 틀린 문제 앞에선 답지보다 생각이 먼저다."}, {"id": "w323", "kind": "korea", "kindName": "우리 인물", "ko": "지금부터는 본전에 출근하지 말고 집에서 전심으로 글을 읽어 성과를 나타내어 내 뜻에 맞게 하라.", "orig": "自今勿仕本殿 在家專心讀書 以著成效 以副予意", "who": "세종", "role": "조선 제4대 임금", "src": "집현전 학사 권채 등에게 사가독서를 명하며 · 『세종실록』 34권, 세종 8년(1426) 12월 11일", "url": "https://sillok.history.go.kr/id/kda_10812011_004", "note": "세종은 인재에게 일 대신 책 읽을 시간을 내줬다. 오늘 한 시간은 온전히 책에만 쓰자."}, {"id": "w324", "kind": "classic", "kindName": "고전", "ko": "진실로 하루를 새롭게 했다면, 날마다 새롭게 하고 또 날마다 새롭게 하라.", "orig": "苟日新 日日新 又日新", "who": "탕왕(반명)", "role": "대학", "src": "『대학』 전2장 (탕왕의 세숫대야 명문)", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%A4%A7%E5%AD%A6%E7%AB%A0%E5%8F%A5%E9%9B%86%E6%B3%A8/%E7%AC%AC%E4%B8%89%E7%AB%A0", "note": "어제보다 한 문제 더, 한 개념 더. 날마다 새로워지는 일은 그렇게 작게 시작된다."}, {"id": "w325", "kind": "writer", "kindName": "작가·사상가", "ko": "실패로 얼룩지더라도 큰일에 도전해 빛나는 승리를 거두는 편이, 승리도 패배도 모르는 잿빛 황혼 속에 사는 것보다 훨씬 낫다.", "orig": "Far better it is to dare mighty things, to win glorious triumphs, even though checkered by failure, than to take rank with those poor spirits who neither enjoy much nor suffer much, because they live in the gray twilight that knows not victory nor defeat.", "who": "시어도어 루스벨트", "role": "미국 제26대 대통령", "src": "연설 「분투하는 삶(The Strenuous Life)」(1899.4.10, 시카고)", "url": "https://www.trlibrary.com/tr/quotes/strenuous-life", "note": "어려운 문제에 도전해 틀린 오답 노트가, 비어 있는 노트보다 훨씬 값지다."}, {"id": "w326", "kind": "west", "kindName": "서양 고전", "ko": "내가 '가르침'보다 '교육'을 말하는 까닭은, 기억을 채우는 것보다 마음을 기르는 일이 훨씬 중요하기 때문이다.", "orig": "I say education rather than instruction, because it is far more important to cultivate the mind than to store the memory.", "who": "존 러벅", "role": "영국의 과학자·정치가", "src": "『인생의 즐거움(The Pleasures of Life)』 제1부 제10장 「교육」", "url": "https://www.gutenberg.org/cache/epub/7952/pg7952.txt", "note": "외운 공식이 왜 그렇게 되는지 한 번 따져 보는 순간 공부가 내 것이 된다."}, {"id": "w327", "kind": "classic", "kindName": "고전", "ko": "흐르는 물은 썩지 않고, 자주 여닫는 문지도리는 좀먹지 않는다. 움직이기 때문이다.", "orig": "流水不腐 戶樞不蠹 動也", "who": "여불위(편찬)", "role": "여씨춘추", "src": "『여씨춘추』 계춘기", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%90%95%E6%B0%8F%E6%98%A5%E7%A7%8B/%E7%BA%AA/%E5%AD%A3%E6%98%A5%E7%BA%AA", "note": "매일 조금씩 꺼내 쓰는 지식은 녹슬지 않는다. 오늘도 한 번 꺼내 보자."}, {"id": "w328", "kind": "west", "kindName": "서양 고전", "ko": "바람과 파도가 가장 뛰어난 항해사 편이듯, 행운은 대개 부지런한 사람 편이다.", "orig": "fortune is usually on the side of the industrious, as the winds and waves are on the side of the best navigators.", "who": "새뮤얼 스마일스", "role": "영국의 저술가", "src": "『자조론(Self-Help)』 제4장 「근면과 인내」", "url": "https://www.gutenberg.org/cache/epub/935/pg935.txt", "note": "운이 좋았다는 말 뒤에는 대개 그 운을 받아낼 준비를 해 둔 시간이 있다."}, {"id": "w016", "kind": "korea", "kindName": "우리 인물", "ko": "죽고자 하면 살고, 살고자 하면 죽는다.", "orig": "必死則生 必生則死", "who": "이순신", "role": "조선 수군 통제사", "src": "『난중일기』 1597년 9월 15일 · 명량 해전 전날 장수들에게 병법을 들어 한 약속 (『이충무공전서』 권8)", "url": "https://db.itkc.or.kr/dir/node?dataId=ITKC_MO_0232A_0110_010_0060", "note": "도망갈 구멍을 하나 남겨 두면 마음이 늘 그쪽으로 샌다. 오늘은 이 한 개념만 붙들자."}, {"id": "w329", "kind": "classic", "kindName": "고전", "ko": "마음이 하는 일은 생각하는 것이다. 생각하면 얻고, 생각하지 않으면 얻지 못한다.", "orig": "心之官則思 思則得之 不思則不得也", "who": "맹자", "role": "맹자", "src": "『맹자』 고자 상 제15장", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%AD%9F%E5%AD%90/%E5%91%8A%E5%AD%90%E7%AB%A0%E5%8F%A5%E4%B8%8A/%E7%AC%AC%E5%8D%81%E4%BA%94%E8%8A%82", "note": "외우기 전에 '왜 이렇게 될까'를 한 번 생각해 보자. 생각한 만큼 내 것이 된다."}, {"id": "w330", "kind": "science", "kindName": "과학자", "ko": "오직 확실성만을 줄 수 있는 논리는 증명의 도구이고, 직관은 발견의 도구다.", "orig": "Logic, which can only give certainties, is the instrument of demonstration; intuition is that of invention.", "who": "앙리 푸앵카레", "role": "수학자·물리학자", "src": "『과학의 가치』(1905)", "url": "https://en.wikipedia.org/wiki/The_Value_of_Science", "note": "감으로 떠올린 풀이는 식으로 한 줄씩 확인하자. 떠올리기와 확인 둘 다 공부다."}, {"id": "w331", "kind": "west", "kindName": "서양 고전", "ko": "사람 안에 깃든 힘은 세상에 처음 나온 것이라, 무엇을 할 수 있는지는 그 자신만 알고, 그조차 해 보기 전에는 모른다.", "orig": "The power which resides in him is new in nature, and none but he knows what that is which he can do, nor does he know until he has tried.", "who": "랠프 월도 에머슨", "role": "미국의 사상가·시인", "src": "『에세이 제1집』(1841) 「자기 신뢰(Self-Reliance)」", "url": "https://www.gutenberg.org/cache/epub/2944/pg2944.txt", "note": "안 해 본 과목을 '난 원래 못해'라고 단정하기엔 아직 증거가 부족하다."}, {"id": "w332", "kind": "classic", "kindName": "고전", "ko": "배움은 재능을 더해 주는 것이고, 숫돌은 칼날을 세워 주는 것이다.", "orig": "學所以益才也 礪所以致刃也", "who": "자사", "role": "설원", "src": "『설원』 건본편 (자사의 말)", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%AF%B4%E8%8B%91/%E5%BB%BA%E6%9C%AC/text.txt", "note": "타고난 머리보다 오늘 갈아 둔 날이 더 잘 든다."}, {"id": "w333", "kind": "writer", "kindName": "작가·사상가", "ko": "인간에게서 모든 것을 빼앗을 수 있어도, 단 하나, 어떤 상황에서든 자기 태도를 선택할 마지막 자유만은 빼앗을 수 없다.", "orig": "Everything can be taken from a man but one thing: the last of the human freedoms—to choose one's attitude in any given set of circumstances", "who": "빅터 프랭클", "role": "정신과 의사·작가", "src": "『죽음의 수용소에서(Man's Search for Meaning)』(1946)", "url": "https://www.penguin.co.uk/books/347571/mans-search-for-meaning-by-frankl-viktor-e/9781846046384", "note": "시험 결과는 고를 수 없어도, 결과를 받아 든 뒤의 태도는 고를 수 있다."}, {"id": "w334", "kind": "west", "kindName": "서양 고전", "ko": "아무리 어둡고 낙담스러운 날에도, 무슨 수를 써서라도 교육을 받겠다는 결심만은 젊은 날 내내 내 안에 남아 있었다.", "orig": "There was never a time in my youth, no matter how dark and discouraging the days might be, when one resolve did not continually remain with me, and that was a determination to secure an education at any cost.", "who": "부커 T. 워싱턴", "role": "미국의 교육자", "src": "『노예의 굴레를 벗고(Up From Slavery)』(1901) 제2장", "url": "https://www.gutenberg.org/cache/epub/2376/pg2376.txt", "note": "공부할 이유 하나를 분명히 붙잡고 있으면 힘든 날에도 책상으로 돌아올 수 있다."}, {"id": "w335", "kind": "classic", "kindName": "고전", "ko": "뼈와 힘줄이 엉킨 곳에 이를 때마다 어려움을 보고 조심하여, 눈길을 멈추고 손을 늦추며 칼을 아주 조금씩 움직인다.", "orig": "每至於族 吾見其難爲 怵然爲戒 視爲止 行爲遲 動刀甚微", "who": "장자", "role": "장자", "src": "『장자』 내편 양생주 (포정의 말)", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%BA%84%E5%AD%90/%E5%86%85%E7%AF%87/%E5%85%BB%E7%94%9F%E4%B8%BB/text.txt", "note": "어려운 문제 앞에서는 속도를 늦추고 조건 하나하나에 눈을 멈추자."}, {"id": "w336", "kind": "korea", "kindName": "우리 인물", "ko": "사랑이란 어디 있을까? / 팔딱팔딱 뛰는 나의 가슴 속에 있지. / 사랑이란 무얼까? / 우리의 가슴과 가슴 사이를 연결해주는 금실이지.", "who": "한강", "role": "소설가·2024 노벨문학상 수상자", "src": "여덟 살(1979년)에 쓴 시 · 2024 노벨문학상 강연 「빛과 실」에서", "url": "https://www.nobelprize.org/prizes/literature/2024/han/225027-nobel-lecture-korean/", "note": "공부로 날이 선 하루에도 옆자리 친구에게 한마디 건네 보자. 그게 금실이다."}, {"id": "w337", "kind": "west", "kindName": "서양 고전", "ko": "어떤 일이든 시작이 가장 중요하다.", "orig": "the beginning is the most important part of any work", "who": "플라톤", "role": "고대 그리스 철학자", "src": "『국가』 제2권 377a (조엣 영역)", "url": "https://github.com/standardebooks/plato_dialogues_benjamin-jowett/blob/master/src/epub/text/republic.xhtml", "note": "책상에 앉아 첫 줄을 쓰는 순간이 가장 무겁고, 또 가장 중요하다."}, {"id": "w338", "kind": "modern", "kindName": "운동·예술", "ko": "작은 것을 쌓아 가는 것이 엄청난 곳에 이르는 단 하나의 길이구나, 하고 지금 느끼고 있습니다.", "orig": "小っちゃいことを重ねることが、とんでもないところにたどり着くただ一つの道なんだなと、今、感じています", "who": "스즈키 이치로", "role": "야구 선수", "src": "2004년 10월 1일 시즌 258번째 안타로 조지 시슬러의 최다 안타(257) 기록을 넘은 직후 (집영사 『Sportiva』 2025.1.23 칼럼 인용)", "url": "https://sportiva.shueisha.co.jp/clm/baseball/mlb/2025/01/23/84_2004/?page=3", "note": "하루 한 쪽씩 쌓은 복습이, 어느 날 전혀 다른 곳에 나를 데려다 놓는다."}, {"id": "w339", "kind": "classic", "kindName": "고전", "ko": "사람은 하지 않는 것이 있어야, 그 뒤에 해낼 수 있는 것이 생긴다.", "orig": "人有不爲也 而後可以有爲", "who": "맹자", "role": "맹자", "src": "『맹자』 이루 하 제8장", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%AD%9F%E5%AD%90/%E7%A6%BB%E5%A8%84%E7%AB%A0%E5%8F%A5%E4%B8%8B/%E7%AC%AC%E5%85%AB%E8%8A%82/text.txt", "note": "휴대폰을 잠시 내려놓는 '안 하기'가 오늘의 공부를 '하게' 만든다."}, {"id": "w002", "kind": "science", "kindName": "과학자", "ko": "나는 특별한 재능이 없다. 다만 열렬히 호기심이 많을 뿐이다.", "orig": "Ich habe keine besondere Begabung, sondern bin nur leidenschaftlich neugierig.", "who": "알베르트 아인슈타인", "role": "물리학자 · 1921년 노벨물리학상", "src": "1952년 3월 11일 칼 젤리히에게 보낸 편지 · 아인슈타인 아카이브 39-013", "url": "https://en.wikiquote.org/wiki/Albert_Einstein", "note": "재능이 있어서 오래 보는 게 아니라, 오래 보다 보면 재능처럼 보인다."}, {"id": "w340", "kind": "classic", "kindName": "고전", "ko": "길이 아무리 가까워도 가지 않으면 이르지 못하고, 일이 아무리 작아도 하지 않으면 이루지 못한다.", "orig": "道雖邇 不行不至 事雖小 不爲不成", "who": "순자", "role": "순자", "src": "『순자』 수신편", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%8D%80%E5%AD%90/%E4%BF%AE%E8%BA%AB", "note": "'쉬우니까 나중에' 미뤄 둔 문제일수록 지금 풀어 두자. 안 하면 끝내 남는다."}, {"id": "w341", "kind": "west", "kindName": "서양 고전", "ko": "나는 모든 일을 해낼 수 있다는 생각으로 시작했고, 왜 안 되는지부터 설명하려 드는 사람들에게는 좀처럼 귀 기울이지 않았다.", "orig": "I have begun everything with the idea that I could succeed, and I never had much patience with the multitudes of people who are always ready to explain why one cannot succeed.", "who": "부커 T. 워싱턴", "role": "미국의 교육자", "src": "『노예의 굴레를 벗고(Up From Slavery)』(1901) 제4장", "url": "https://www.gutenberg.org/cache/epub/2376/pg2376.txt", "note": "'그 성적으로 되겠어?'라는 말보다 오늘 푼 문제 수를 더 믿기로 한다."}, {"id": "w342", "kind": "korea", "kindName": "우리 인물", "ko": "낮에 졸음이 오면 마음을 불러 깨워 정신을 번쩍 차려라. 눈꺼풀이 무거우면 일어나 걸어서 또렷하게 하라.", "orig": "晝有睡思 當喚醒此心 十分猛醒 眼皮若重 起而周步 使之惺惺", "who": "이이", "role": "조선 중기 학자", "src": "「자경문(自警文)」 · 1555년(20세)", "url": "https://db.itkc.or.kr/dir/node?dataId=ITKC_MO_0201A_0150_050_0100", "note": "졸리면 억지로 버티지 말고 일어나 한 바퀴 걷자. 율곡이 스스로에게 준 처방이다."}, {"id": "w343", "kind": "west", "kindName": "서양 고전", "ko": "반박하려고도, 그대로 믿으려고도, 이야깃거리를 찾으려고도 말고, 따져 보고 생각하려고 읽어라.", "orig": "Read not to contradict and confute; nor to believe and take for granted; nor to find talk and discourse; but to weigh and consider.", "who": "프랜시스 베이컨", "role": "영국의 철학자", "src": "『수상록』 「학문에 대하여(Of Studies)」", "url": "https://www.gutenberg.org/ebooks/575", "note": "‘정말 그럴까?’ 하고 한 번 따져 볼 때 읽은 것이 내 것이 된다."}, {"id": "w344", "kind": "writer", "kindName": "작가·사상가", "ko": "하지만 언젠가 너는 다시 동화를 읽기 시작할 만큼 나이가 들 거야.", "orig": "But some day you will be old enough to start reading fairy tales again.", "who": "C. S. 루이스", "role": "작가·영문학자", "src": "『사자와 마녀와 옷장』(1950) 헌사", "url": "https://en.wikipedia.org/wiki/Lucy_Barfield", "note": "교과서 말고 좋아하는 책 한 권도 곁에 두자. 읽는 즐거움은 돌아온다."}, {"id": "w345", "kind": "classic", "kindName": "고전", "ko": "거의 다 된 일을 마무리하는 것은 여울을 거슬러 오르는 배를 끄는 것과 같으니, 노 한 번도 쉬지 말라.", "orig": "圖垂成之功者 如挽上灘之舟 莫少停一棹", "who": "홍자성", "role": "채근담", "src": "『채근담』 (건륭본 응수편)", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%8F%9C%E6%A0%B9%E8%B0%AD/%E5%BA%94%E9%85%AC/text.txt", "note": "시험 직전 몇 주는 여울을 오르는 배다. 노를 멈추면 뒤로 밀린다."}, {"id": "w346", "kind": "west", "kindName": "서양 고전", "ko": "쇠가 달궈졌을 때 두드리는 것만으로는 부족하다. 달궈질 때까지 두드려야 한다.", "orig": "we must not only strike the iron while it is hot, but strike it till it is made hot.", "who": "새뮤얼 스마일스", "role": "영국의 저술가", "src": "『자조론(Self-Help)』 제11장 「자기 수양」", "url": "https://www.gutenberg.org/cache/epub/935/pg935.txt", "note": "공부할 기분이 날 때를 기다리지 말고 책을 펴서 기분이 날 때까지 버텨 본다."}, {"id": "w347", "kind": "classic", "kindName": "고전", "ko": "군자의 허물은 일식·월식과 같다. 잘못하면 모두가 보지만, 고치면 모두가 우러러본다.", "orig": "君子之過也 如日月之食焉 過也人皆見之 更也人皆仰之", "who": "자공", "role": "논어", "src": "『논어』 자장편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%AE%BA%E8%AF%AD/%E5%AD%90%E5%BC%A0%E7%AF%87/text.txt", "note": "틀린 걸 들키는 건 창피해도, 고쳐 가는 모습은 누구에게나 멋져 보인다."}, {"id": "w348", "kind": "korea", "kindName": "우리 인물", "ko": "서로에게, 그리고 자신에게 친절하시길, 그리고 그 친절을 먼 미래의 우리에게 잘 전달해 주길 바랍니다.", "who": "허준이", "role": "수학자·2022 필즈상 수상자", "src": "2022년 8월 29일 서울대 제76회 후기 학위수여식 축사", "url": "https://www.joongang.co.kr/article/25097830", "note": "틀린 문제 앞에서 자신을 몰아세우지 말자. 친절하게 다시 풀어 보는 쪽이 더 빨리 는다."}, {"id": "w349", "kind": "west", "kindName": "서양 고전", "ko": "우리는 곤란과 어려움을 부풀리곤 한다. 너무 오래 들여다보면 실제보다 훨씬 커 보인다.", "orig": "We often magnify troubles and difficulties, and look at them till they seem much greater than they really are.", "who": "존 러벅", "role": "영국의 과학자·정치가", "src": "『인생의 즐거움(The Pleasures of Life)』 제2부 제9장 「인생의 괴로움」", "url": "https://www.gutenberg.org/cache/epub/7952/pg7952.txt", "note": "막막한 과제도 첫 줄을 쓰고 나면 생각보다 작다는 것을 알게 된다."}, {"id": "w350", "kind": "classic", "kindName": "고전", "ko": "군자는 단정하고 삼가면 날로 굳세지고, 편안함에 풀어지면 날로 느슨해진다.", "orig": "君子莊敬日强 安肆日偸", "who": "공자(전승)", "role": "예기", "src": "『예기』 표기편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E7%A4%BC%E8%AE%B0/%E8%A1%A8%E8%AE%B0/text.txt", "note": "책상 앞에 바르게 앉는 작은 습관이 하루하루 공부 체력을 만든다."}, {"id": "w003", "kind": "science", "kindName": "과학자", "ko": "천재는 1퍼센트의 영감과 99퍼센트의 땀이다.", "orig": "Genius is one per cent inspiration, ninety-nine per cent perspiration.", "who": "토머스 에디슨", "role": "발명가", "src": "1927년 편지에서 본인이 한 말임을 확인 · Harper’s Monthly Magazine 1932년 9월호에 처음 인쇄", "url": "https://en.wikiquote.org/wiki/Thomas_Edison", "note": "1퍼센트가 없으면 99퍼센트도 헛돌지만, 99퍼센트 없이 1퍼센트가 오는 일도 없다."}, {"id": "w351", "kind": "west", "kindName": "서양 고전", "ko": "그러니 작은 일부터 시작하라.", "orig": "Begin therefore with little things.", "who": "에픽테토스", "role": "고대 그리스의 스토아 철학자", "src": "『엥케이리디온』 제12절 (T. W. Higginson 역)", "url": "https://www.gutenberg.org/cache/epub/45109/pg45109.txt", "note": "오늘 할 공부가 막막하면 문제집 한 쪽을 펴는 것으로 충분하다."}, {"id": "w352", "kind": "writer", "kindName": "작가·사상가", "ko": "한 명의 아이, 한 명의 선생님, 한 권의 책, 한 자루의 펜이 세상을 바꿀 수 있다.", "orig": "One child, one teacher, one book and one pen can change the world.", "who": "말랄라 유사프자이", "role": "교육운동가·노벨평화상 수상자", "src": "유엔 청소년 총회 연설(2013.7.12)", "url": "https://en.wikiquote.org/wiki/Malala_Yousafzai", "note": "오늘 펼친 책 한 권, 손에 쥔 펜 한 자루가 그 시작이다."}, {"id": "w353", "kind": "classic", "kindName": "고전", "ko": "해 뜨는 동쪽에서 잃은 것을 해 지는 서쪽에서 거두었다.", "orig": "失之東隅 收之桑楡", "who": "광무제", "role": "후한서", "src": "『후한서』 풍이열전", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%90%8E%E6%B1%89%E4%B9%A6/%E5%88%97%E4%BC%A0/%E5%86%AF%E5%B2%91%E8%B4%BE%E5%88%97%E4%BC%A0", "note": "첫 시험을 망쳐도 다음 시험에서 되찾을 수 있다. 오늘의 실패는 끝이 아니다."}, {"id": "w354", "kind": "korea", "kindName": "우리 인물", "ko": "하루라도 책을 읽지 않으면 입 안에 가시가 돋는다.", "orig": "一日不讀書 口中生荊棘", "who": "안중근", "role": "독립운동가", "src": "1910년 뤼순감옥에서 쓴 유묵 · 보물 제569-2호(동국대학교박물관 소장)", "url": "https://www.khan.co.kr/article/202010200600001", "note": "하루 10분이라도 읽는 날이 쌓이면 생각이 달라진다. 오늘도 책 한 쪽을 펴자."}, {"id": "w355", "kind": "modern", "kindName": "운동·예술", "ko": "실패는 내게 시험에 합격해서는 결코 얻지 못했던 내면의 단단함을 주었다.", "orig": "Failure gave me an inner security that I had never attained by passing examinations.", "who": "J.K. 롤링", "role": "소설가", "src": "2008년 6월 하버드대 졸업식 연설 「The Fringe Benefits of Failure」", "url": "https://www.harvardmagazine.com/2008/06/the-fringe-benefits-failure-the-importance-imagination", "note": "시험을 망친 날에도 다시 책을 폈다면, 점수로는 안 보이는 힘이 자란 것이다."}, {"id": "w356", "kind": "west", "kindName": "서양 고전", "ko": "공부에서 겨냥해야 할 두 가지 핵심은 철저함과 정확함이다.", "orig": "Thoroughness and accuracy are two principal points to be aimed at in study.", "who": "새뮤얼 스마일스", "role": "영국의 저술가", "src": "『자조론(Self-Help)』 제11장 「자기 수양」", "url": "https://www.gutenberg.org/cache/epub/935/pg935.txt", "note": "열 문제를 대충 푸는 것보다 세 문제를 끝까지 정확히 푸는 날이 실력을 만든다."}, {"id": "w357", "kind": "classic", "kindName": "고전", "ko": "사물에는 근본과 말단이 있고 일에는 끝과 시작이 있으니, 먼저 할 것과 나중 할 것을 알면 도에 가깝다.", "orig": "物有本末 事有終始 知所先後 則近道矣", "who": "증자(전승)", "role": "대학", "src": "『대학』 경1장", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%A4%A7%E5%AD%A6%E7%AB%A0%E5%8F%A5%E9%9B%86%E6%B3%A8/%E7%AC%AC%E4%B8%80%E7%AB%A0", "note": "오늘 할 공부를 적고 순서를 매겨 보자. 무엇을 먼저 할지 아는 것만으로 반은 된다."}, {"id": "w358", "kind": "west", "kindName": "서양 고전", "ko": "쓰는 법을 안다면, 삶은 충분히 길다.", "orig": "Life is long enough, if you know how to use it.", "who": "세네카", "role": "로마의 스토아 철학자", "src": "『삶의 짧음에 관하여』 제2장 (Aubrey Stewart 역, 『Minor Dialogues』 수록)", "url": "https://www.gutenberg.org/cache/epub/64576/pg64576.txt", "note": "시간이 모자란 날보다 시간을 어디에 쓸지 정하지 않은 날이 더 많다."}, {"id": "w359", "kind": "classic", "kindName": "고전", "ko": "어진 사람은 어려운 일을 먼저 하고, 얻는 것은 뒤로 미룬다.", "orig": "仁者先難而後獲", "who": "공자", "role": "논어", "src": "『논어』 옹야편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%AE%BA%E8%AF%AD/%E9%9B%8D%E4%B9%9F%E7%AF%87/text.txt", "note": "가장 하기 싫은 과목을 첫 시간에 두면 나머지 하루가 가벼워진다."}, {"id": "w005", "kind": "science", "kindName": "과학자", "ko": "내가 더 멀리 보았다면, 그것은 거인들의 어깨 위에 서 있었기 때문이다.", "orig": "If I have seen further it is by standing on the shoulders of Giants.", "who": "아이작 뉴턴", "role": "물리학자·수학자", "src": "1675년 2월 5일 로버트 훅에게 보낸 편지", "url": "https://en.wikiquote.org/wiki/Isaac_Newton", "note": "교과서의 한 줄은 누군가 평생을 걸어 얻은 결론이다. 그 어깨를 빌리는 게 공부다."}, {"id": "w360", "kind": "korea", "kindName": "우리 인물", "ko": "공부는 늦추지도 서두르지도 말고 평생 이어 가야 한다. 효과를 빨리 보려는 것 또한 이익을 탐하는 마음이다.", "orig": "用功不緩不急 死而後已 若求速其效 則此亦利心", "who": "이이", "role": "조선 중기 학자", "src": "「자경문(自警文)」 · 1555년(20세)", "url": "https://db.itkc.or.kr/dir/node?dataId=ITKC_MO_0201A_0150_050_0100", "note": "한 달 만에 성적을 뒤집겠다는 조급함이 오히려 발목을 잡는다. 오늘 분량만 채우자."}, {"id": "w361", "kind": "west", "kindName": "서양 고전", "ko": "이미 안다고 생각하는 것을 새로 배우기 시작할 수는 없다.", "orig": "For it is impossible for a man to begin to learn that which he thinks that he knows.", "who": "에픽테토스", "role": "그리스의 스토아 철학자", "src": "『담화록』 제2권 17장 (조지 롱 영역)", "url": "https://github.com/standardebooks/epictetus_discourses_george-long/blob/master/src/epub/text/book-2.xhtml", "note": "‘이거 아는 건데’ 싶은 단원일수록 소리 내어 설명해 보면 빈틈이 보인다."}, {"id": "w362", "kind": "classic", "kindName": "고전", "ko": "잘하면서도 못하는 이에게 묻고, 많이 알면서도 적게 아는 이에게 물었다.", "orig": "以能問於不能 以多問於寡", "who": "증자", "role": "논어", "src": "『논어』 태백편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%AE%BA%E8%AF%AD/%E6%B3%B0%E4%BC%AF%E7%AF%87/text.txt", "note": "친구나 후배에게 묻는 것도 부끄럽지 않다. 모르는 건 오늘 바로 묻자."}, {"id": "w363", "kind": "writer", "kindName": "작가·사상가", "ko": "삶의 목적은 사는 것, 경험을 한껏 맛보고 더 새롭고 풍부한 경험을 향해 두려움 없이 손을 뻗는 것이다.", "orig": "The purpose of life...is to live it, to taste experience to the utmost, to reach out eagerly and without fear for newer and richer experience.", "who": "엘리너 루스벨트", "role": "작가·인권운동가", "src": "『You Learn by Living』(1960) 서문", "url": "https://en.wikiquote.org/wiki/Eleanor_Roosevelt", "note": "새 단원은 부담이 아니라, 아직 맛보지 않은 경험이다."}, {"id": "w364", "kind": "west", "kindName": "서양 고전", "ko": "그해가 가기 전에, 나는 가장 행복한 사람은 남을 위해 가장 많이 애쓰는 사람이라는 것을 배우기 시작했던 것 같다.", "orig": "Before the end of the year, I think I began learning that those who are happiest are those who do the most for others.", "who": "부커 T. 워싱턴", "role": "미국의 교육자", "src": "『노예의 굴레를 벗고(Up From Slavery)』(1901) 제4장", "url": "https://www.gutenberg.org/cache/epub/2376/pg2376.txt", "note": "친구에게 노트를 빌려주고 설명해 준 날은 이상하게 내 공부도 더 잘된다."}, {"id": "w365", "kind": "west", "kindName": "서양 고전", "ko": "누군가 동료들과 발을 맞추지 않는다면 다른 북소리를 듣고 있기 때문일지 모른다. 그가 듣는 음악에 맞춰 걷게 하라.", "orig": "If a man does not keep pace with his companions, perhaps it is because he hears a different drummer. Let him step to the music which he hears, however measured or far away.", "who": "헨리 데이비드 소로", "role": "미국의 사상가·작가", "src": "『월든』(1854) 「맺음말」 장", "url": "https://www.gutenberg.org/cache/epub/205/pg205.txt", "note": "남보다 늦게 트이는 과목이 있다고 해서 내 걸음이 틀린 것은 아니다."}, {"id": "w366", "kind": "classic", "kindName": "고전", "ko": "날이 추워진 뒤에야 소나무와 잣나무가 늦게 시든다는 것을 안다.", "orig": "歲寒然後知松柏之後彫也", "who": "공자", "role": "논어", "src": "『논어』 자한편", "url": "https://zh.wikisource.org/wiki/論語/子罕第九", "note": "성적이 안 오르는 시기에도 책상에 앉는 힘, 그게 진짜 실력의 뿌리가 된다."}, {"id": "w017", "kind": "korea", "kindName": "우리 인물", "ko": "너희는 지금 폐족이다. 폐족이 된 처지를 잘 다스려 처음보다 더 온전하게 된다면 기특하고 좋은 일이 아니겠느냐. 폐족을 잘 다스리는 길이 무엇이냐? 오직 책 읽는 일 하나뿐이다.", "orig": "汝今廢族。若因其廢而善處之。得完好勝初。則不亦寄且善乎。何謂因其廢而善處之。唯讀書一事是已。", "who": "정약용", "role": "실학자", "src": "강진 유배지에서 두 아들에게 보낸 편지 「기이아(寄二兒)」(1802년 12월 22일) · 『여유당전서』 시문집 권21", "url": "https://db.itkc.or.kr/dir/node?dataId=ITKC_MO_0597A_0210_010_0030", "note": "형편이 어떻든 오늘 읽은 것은 아무도 못 가져간다."}, {"id": "w367", "kind": "classic", "kindName": "고전", "ko": "좋은 일은 미뤄 두지 않고, 질문은 하룻밤을 묵히지 않는다.", "orig": "無留善 無宿問", "who": "순자", "role": "순자", "src": "『순자』 대략편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%8D%80%E5%AD%90/%E5%A4%A7%E7%95%A5/text.txt", "note": "오늘 생긴 질문은 오늘 풀자. 하룻밤 묵히면 모르는 채로 굳어 버린다."}, {"id": "w368", "kind": "science", "kindName": "과학자", "ko": "실험실의 과학자는 기술자이기만 한 것이 아니다. 동화처럼 마음을 사로잡는 자연 현상 앞에 선 아이이기도 하다.", "orig": "A scientist in his laboratory is not only a technician: he is also a child placed before natural phenomena which impress him like a fairy tale.", "who": "마리 퀴리", "role": "물리학자·화학자 · 1903·1911년 노벨상", "src": "1933년 5월 마드리드 '문화의 미래' 회의 발언 (이브 퀴리 『마담 퀴리』 24장)", "url": "https://www.themarginalian.org/2014/09/23/marie-curie-on-science-and-wonder/", "note": "교과서 속 그래프도 처음 본 아이처럼 들여다보면 질문이 생긴다."}, {"id": "w369", "kind": "modern", "kindName": "운동·예술", "ko": "무슨 생각을 해. 그냥 하는 거지.", "orig": "무슨 생각을 해. 그냥 하는 거지.", "who": "김연아", "role": "피겨스케이팅 선수", "src": "선수 시절 방송 인터뷰(스트레칭하며 무슨 생각을 하냐는 질문에 한 답)", "url": "https://www.osen.co.kr/article/G1112320312", "note": "하기 싫다는 생각이 길어지기 전에, 일단 첫 문제부터 펴 본다."}, {"id": "w370", "kind": "writer", "kindName": "작가·사상가", "ko": "두려움을 정면으로 마주할 때마다 힘과 용기와 자신감이 생긴다. 할 수 없다고 생각하는 일을 해야 한다.", "orig": "You gain strength, courage and confidence by every experience in which you really stop to look fear in the face. … You must do the thing you think you cannot do.", "who": "엘리너 루스벨트", "role": "작가·인권운동가", "src": "『You Learn by Living』(1960) 2장 「두려움, 가장 큰 적」", "url": "https://wist.info/roosevelt-eleanor/3318/", "note": "제일 자신 없는 단원을 오늘 딱 한 쪽만 펴 보자. 거기서 용기가 생긴다."}, {"id": "w371", "kind": "west", "kindName": "서양 고전", "ko": "오늘을 붙잡아라. 내일은 되도록 믿지 말고.", "orig": "carpe diem, quam minimum credula postero.", "who": "호라티우스", "role": "로마의 시인", "src": "『송가』 제1권 11편 8행", "url": "https://github.com/PerseusDL/canonical-latinLit/blob/master/data/phi0893/phi001/phi0893.phi001.perseus-lat2.xml", "note": "‘내일 몰아서 하자’는 내일의 나에게 떠넘기는 가장 무거운 짐이다."}, {"id": "w372", "kind": "west", "kindName": "서양 고전", "ko": "나는 가장 빠른 여행자는 걸어서 가는 사람이라는 것을 배웠다.", "orig": "I have learned that the swiftest traveller is he that goes afoot.", "who": "헨리 데이비드 소로", "role": "미국의 사상가·작가", "src": "『월든』(1854) 「경제」 장", "url": "https://www.gutenberg.org/cache/epub/205/pg205.txt", "note": "요약본만 찾아다니기보다 교과서를 처음부터 걸어가는 편이 결국 먼저 도착한다."}, {"id": "w373", "kind": "classic", "kindName": "고전", "ko": "옛것을 익혀 새것을 알면 스승이 될 만하다.", "orig": "溫故而知新 可以爲師矣", "who": "공자", "role": "논어", "src": "『논어』 위정편 제11장", "url": "https://zh.wikisource.org/wiki/論語/爲政第二", "note": "지난주 배운 단원을 다시 펼치면, 오늘 배운 개념이 훨씬 또렷하게 보인다."}, {"id": "w019", "kind": "korea", "kindName": "우리 인물", "ko": "나는 우리나라가 세계에서 가장 아름다운 나라가 되기를 원한다. … 오직 한없이 가지고 싶은 것은 높은 문화의 힘이다.", "who": "김구", "role": "독립운동가", "src": "『백범일지』 「나의 소원」 · 내가 원하는 우리나라", "url": "https://ko.wikisource.org/wiki/%EB%B0%B1%EB%B2%94%EC%9D%BC%EC%A7%80", "note": "공부는 나를 위해 하지만, 결국은 누군가를 도울 힘이 된다."}, {"id": "w374", "kind": "classic", "kindName": "고전", "ko": "도는 큰길과 같으니 어찌 알기 어렵겠는가? 사람들이 찾지 않는 것이 병일 뿐이다.", "orig": "夫道若大路然 豈難知哉 人病不求耳", "who": "맹자", "role": "맹자", "src": "『맹자』 고자 하 제2장", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%AD%9F%E5%AD%90/%E5%91%8A%E5%AD%90%E7%AB%A0%E5%8F%A5%E4%B8%8B/%E7%AC%AC%E4%BA%8C%E8%8A%82/text.txt", "note": "모르는 건 부끄럽지 않다. 찾아보지 않고 넘기는 것이 아쉬운 일이다."}, {"id": "w375", "kind": "west", "kindName": "서양 고전", "ko": "어느 항구로 가는지 모르는 사람에게는 어떤 바람도 순풍이 아니다.", "orig": "When a man does not know what harbour he is making for, no wind is the right wind.", "who": "세네카", "role": "로마의 스토아 철학자", "src": "『루킬리우스에게 보내는 편지』 제71편 3절 (거미어 영역)", "url": "https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_71", "note": "오늘 공부의 목표를 한 줄로 적어 두면 바람의 방향이 보인다."}, {"id": "w376", "kind": "classic", "kindName": "고전", "ko": "설담은 진청에게 노래를 배우다가, 스승의 기예를 다 익히지 못했는데도 다 배웠다고 여겨 작별하고 돌아가려 했다.", "orig": "薛譚學謳於秦靑 未窮靑之技 自謂盡之 遂辭歸", "who": "열자", "role": "열자", "src": "『열자』 탕문편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%88%97%E5%AD%90/%E6%B1%A4%E9%97%AE/text.txt", "note": "'이제 다 안다' 싶을 때가 한 번 더 확인할 때다. 오늘은 복습 문제로 점검하자."}, {"id": "w377", "kind": "west", "kindName": "서양 고전", "ko": "좋은 책을 읽는 것은 그 책을 쓴 지난 시대의 가장 훌륭한 사람들과 마주 앉아 이야기하는 것과 같다.", "orig": "the perusal of all excellent books is, as it were, to interview with the noblest men of past ages, who have written them", "who": "르네 데카르트", "role": "프랑스의 철학자·수학자", "src": "『방법서설』 제1부 (존 비치 영역)", "url": "https://www.gutenberg.org/ebooks/59", "note": "교과서 속 법칙 이름 하나하나에도 그 사람과 나눌 이야기가 숨어 있다."}, {"id": "w378", "kind": "classic", "kindName": "고전", "ko": "세상에 어려운 일은 없다. 다만 마음을 한곳에 모으지 않는 것이 두려울 뿐이다.", "orig": "世上無難事 只怕不專心", "who": "작자 미상", "role": "증광현문", "src": "『증광현문』", "url": "https://raw.githubusercontent.com/chinese-poetry/chinese-poetry/master/%E8%92%99%E5%AD%A6/zengguangxianwen.json", "note": "어렵게 느껴지는 건 대개 딴생각 탓이다. 휴대폰을 멀리 두고 25분만 몰입하자."}, {"id": "w379", "kind": "korea", "kindName": "우리 인물", "ko": "별을 노래하는 마음으로 / 모든 죽어 가는 것을 사랑해야지 / 그리고 나한테 주어진 길을 / 걸어가야겠다.", "orig": "별을 노래하는 마음으로 / 모든 죽어가는것을 사랑해야지 / 그리고 나한테 주어진 길을 / 걸어가야겠다.", "who": "윤동주", "role": "시인", "src": "「서시」(1941) · 『하늘과 바람과 별과 시』", "url": "https://ko.wikisource.org/wiki/하늘과_바람과_별과_시_(1955년)/서시", "note": "남의 길과 비교하지 말고, 나한테 주어진 오늘의 분량을 걸어가자."}, {"id": "w380", "kind": "science", "kindName": "과학자", "ko": "우리에게는 끈기, 무엇보다 자신에 대한 믿음이 있어야 한다. 우리가 무언가에 재능이 있다고, 그것을 어떤 대가를 치르더라도 이뤄내야 한다고 믿어야 한다.", "orig": "We must have perseverance and above all confidence in ourselves. We must believe that we are gifted for something, and that this thing, at whatever cost, must be attained.", "who": "마리 퀴리", "role": "물리학자·화학자 · 1903·1911년 노벨상", "src": "1894년 3월 18일 오빠 유제프에게 보낸 편지 (이브 퀴리 『마담 퀴리』 1937 수록)", "url": "https://wist.info/curie-marie/61973/", "note": "아직 잘하는 과목이 없어도 괜찮다. 믿고 붙잡은 한 과목이 길을 연다."}, {"id": "w381", "kind": "writer", "kindName": "작가·사상가", "ko": "그럴 때면 나는 온갖 불행이 아니라, 아직 남아 있는 아름다움을 생각한다.", "orig": "At such moments I don't think about all the misery, but about the beauty that still remains.", "who": "안네 프랑크", "role": "『안네의 일기』 작가", "src": "『안네의 일기』 1944년 3월 7일", "url": "https://en.wikiquote.org/wiki/Anne_Frank", "note": "힘든 하루에도 잘 풀린 문제 하나는 남아 있다. 그것부터 떠올리자."}, {"id": "w382", "kind": "west", "kindName": "서양 고전", "ko": "우리는 그저 즐기고 있을 뿐인데 배우고 있다고 착각하곤 한다.", "orig": "Thus we often imagine we are being educated while we are only being amused.", "who": "새뮤얼 스마일스", "role": "영국의 저술가", "src": "『자조론(Self-Help)』 제11장 「자기 수양」", "url": "https://www.gutenberg.org/cache/epub/935/pg935.txt", "note": "강의 영상을 틀어 둔 시간과 스스로 풀어 본 시간은 따로 계산해야 한다."}, {"id": "w383", "kind": "classic", "kindName": "고전", "ko": "우러러볼수록 더욱 높고, 파고들수록 더욱 단단하다.", "orig": "仰之彌高 鑽之彌堅", "who": "안연", "role": "논어", "src": "『논어』 자한편", "url": "https://raw.githubusercontent.com/NiuTrans/Classical-Modern/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E8%AE%BA%E8%AF%AD/%E5%AD%90%E7%BD%95%E7%AF%87/text.txt", "note": "어려운 단원이 끝없이 높아 보인다면, 그만큼 파고들 가치가 있다는 뜻이다."}, {"id": "w384", "kind": "west", "kindName": "서양 고전", "ko": "네 삶 전체를 한꺼번에 떠올리며 스스로를 어지럽히지 마라.", "orig": "Do not disturb thyself by thinking of the whole of thy life.", "who": "마르쿠스 아우렐리우스", "role": "로마 황제·스토아 철학자", "src": "『명상록』 제8권 36절 (조지 롱 영역)", "url": "https://github.com/standardebooks/marcus-aurelius_meditations_george-long/blob/master/src/epub/text/book-8.xhtml", "note": "남은 시험 범위 전체 말고, 지금 펼친 한 쪽만 보면 된다."}, {"id": "w385", "kind": "classic", "kindName": "고전", "ko": "우물 안 개구리에게 바다를 이야기할 수 없는 것은 그가 사는 곳에 갇혀 있기 때문이다.", "orig": "井蛙不可以語於海者 拘於虛也", "who": "장자", "role": "장자", "src": "『장자』 외편 추수", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%BA%84%E5%AD%90/%E5%A4%96%E7%AF%87/%E7%A7%8B%E6%B0%B4", "note": "익숙한 유형만 풀면 우물 안에 머문다. 가끔은 낯선 문제에도 손을 뻗어 보자."}, {"id": "w386", "kind": "korea", "kindName": "우리 인물", "ko": "가벼이 움직이지 말고, 산처럼 고요하고 무겁게 행동하라.", "orig": "勿令妄動 靜重如山", "who": "이순신", "role": "조선 중기 수군 장수", "src": "1592년 5월 옥포해전 직전 휘하 장수들에게 내린 군령 · 장계 「옥포파왜병장」(『이충무공전서』 권2)", "url": "https://db.itkc.or.kr/dir/node?dataId=ITKC_MO_0232A_0050_010_0070", "note": "시험지를 받으면 서두르기 쉽다. 숨 한 번 고르고 첫 문제를 끝까지 읽자."}, {"id": "w387", "kind": "modern", "kindName": "운동·예술", "ko": "삶에서 자유로운 사람은 절제하는 사람뿐이다. 절제하지 못하면 기분의 노예, 욕망의 노예가 된다.", "orig": "Only the disciplined ones are free in life. If you are undisciplined you are a slave to your moods, you are a slave to your passions.", "who": "엘리우드 킵초게", "role": "마라톤 선수", "src": "2018년 1월 5일 옥스퍼드 유니언 강연·질의응답", "url": "https://en.wikiquote.org/wiki/Eliud_Kipchoge", "note": "정해 둔 공부 시간을 지키면, 나머지 시간은 마음 편히 쉴 수 있다."}, {"id": "w388", "kind": "west", "kindName": "서양 고전", "ko": "확신으로 시작하면 의심으로 끝나지만, 기꺼이 의심으로 시작하면 확신으로 끝난다.", "orig": "if a man will begin with certainties, he shall end in doubts; but if he will be content to begin with doubts, he shall end in certainties.", "who": "프랜시스 베이컨", "role": "영국의 철학자", "src": "『학문의 진보』 제1권", "url": "https://www.gutenberg.org/ebooks/5500", "note": "과학의 답들은 ‘정말 확실해?’라는 물음을 견디며 쌓여 왔다."}, {"id": "w389", "kind": "classic", "kindName": "고전", "ko": "거센 바람이 불어야 굳센 풀을 알아본다.", "orig": "疾風知勁草", "who": "광무제", "role": "후한서", "src": "『후한서』 왕패열전", "url": "https://github.com/NiuTrans/Classical-Modern/tree/main/%E5%8F%A4%E6%96%87%E5%8E%9F%E6%96%87/%E5%90%8E%E6%B1%89%E4%B9%A6/%E5%88%97%E4%BC%A0/%E9%93%AB%E6%9C%9F%E7%8E%8B%E9%9C%B8%E7%A5%AD%E9%81%B5%E5%88%97%E4%BC%A0", "note": "모두가 흔들리는 시험 기간에도 제자리를 지키는 사람이 강한 사람이다."}, {"id": "w390", "kind": "science", "kindName": "과학자", "ko": "관찰의 영역에서 우연은 준비된 정신에게만 찾아온다.", "orig": "Dans les champs de l'observation le hasard ne favorise que les esprits préparés.", "who": "루이 파스퇴르", "role": "화학자·미생물학자", "src": "1854년 12월 7일 릴 이학부 교수 취임 강연", "url": "https://en.wikiquote.org/wiki/Louis_Pasteur", "note": "시험장에서 번뜩인 풀이도 결국 어제 풀어 둔 문제에서 나온다."}, {"id": "w391", "kind": "writer", "kindName": "작가·사상가", "ko": "온전한 교육은 집중하는 힘뿐 아니라, 집중할 만한 가치 있는 목표도 함께 준다.", "orig": "The complete education gives one not only power of concentration, but worthy objectives upon which to concentrate.", "who": "마틴 루서 킹 주니어", "role": "목사·민권운동가", "src": "「교육의 목적(The Purpose of Education)」, 『Maroon Tiger』(1947)", "url": "https://kinginstitute.stanford.edu/king-papers/documents/purpose-education", "note": "집중력을 탓하기 전에, 내가 왜 이 공부를 하는지 한 줄 적어 보자."}, {
