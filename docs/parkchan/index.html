igure": {"caption": "규산염 사면체와 결합 방식 — 독립(감람석) · 사슬(휘석) · 판(흑운모) · 망상(석영). 구조가 성질을 만든다", "file": "figures/1204-02.svg"}}, {"id": "1204-03", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1204", "lessonName": "지각과 생명체를 이루는 물질의 규칙성", "no": "03", "title": "단백질", "subtitle": "아미노산 20종, 순서가 정체성이다", "steps": [{"n": "①", "t": "생명의 일꾼", "d": "생명체의 큰 분자는 대부분 <b>탄소 화합물<\/b>. 그 대표가 <b>단백질<\/b> — 근육·머리카락·효소·항체·헤모글로빈. 물을 빼면 몸에서 가장 많다(약 16 %)."}, {"n": "②", "t": "단위체", "d": "<b>아미노산<\/b>, 생명체가 쓰는 것은 약 {{㉠}}종류. 수십~수천 개가 사슬처럼 이어져 단백질이 된다."}, {"n": "③", "t": "순서 → 구조 → 기능", "d": "배열 순서에 따라 다르게 접혀 고유한 <b>입체 구조<\/b>를 만들고, 이 구조가 <b>기능을 결정<\/b>한다. 20개 알파벳으로 수만 가지 단어를 쓰듯이."}], "howto": [], "body": ["이제 생명체 쪽을 보자. 생명체의 큰 분자들은 대부분 <b>탄소 화합물<\/b>이다 — 탄소는 최대 네 곳과 결합할 수 있어 사슬·가지·고리 같은 다양한 뼈대를 만들기 때문에, 생명의 골격 원소가 되었다. 그 대표 주자가 <b>단백질<\/b>이다. 근육과 머리카락, 효소, 항체, 헤모글로빈 — 몸속에서 일이란 일은 거의 다 하는 물질이며, 몸의 약 3분의 2를 차지하는 물을 빼면 가장 많은 성분(약 16 %)이기도 하다.", "단백질의 기본 단위체는 <b>아미노산<\/b>이다. 생명체가 쓰는 아미노산은 약 20종류뿐인데, 이들이 {{㉡}} 결합으로 수십~수천 개씩 사슬처럼 이어져 단백질이 된다. 중요한 것은 <b>어떤 아미노산이, 몇 개, 어떤 순서로 이어지는가<\/b>다.", "아미노산 사슬은 배열 순서에 따라 서로 다르게 접혀 고유한 <b>입체 구조<\/b>를 만들고, 이 구조가 단백질의 {{㉢}}을 결정한다. 배열 순서가 달라지면 다른 모양으로 접히고, 다른 일을 하는 단백질이 된다. 20개의 알파벳으로 수십만 개의 단어를 만들 수 있는 것처럼, 20종의 아미노산으로 <b>수만 가지 단백질<\/b>이 만들어진다. 달걀을 익히면 열로 단백질의 입체 구조가 풀리며 굳는다 — 구조가 변하면 성질도 변한다는 것을 눈으로 보는 셈이다. '순서 = 정체성'만 기억한다."], "terms": [{"k": "아미노산", "v": "단백질의 기본 단위체. 생명체는 약 20종을 조합해 쓴다."}, {"k": "펩타이드 결합", "v": "아미노산과 아미노산을 잇는 결합의 이름. 사슬이 길게 이어지는 비결이다."}, {"k": "효소", "v": "몸속 화학 반응을 빠르게 돕는 단백질. 소화 효소가 대표적이다. 항체·헤모글로빈도 단백질."}], "myths": [{"x": "아미노산의 배열 순서가 달라져도 단백질의 기능은 같다.", "o": "순서 → 입체 구조 → <b>기능<\/b>. 순서가 바뀌면 다른 단백질이다."}, {"x": "단백질의 종류가 수만 가지이니 아미노산도 수만 종류다.", "o": "아미노산은 약 <b>20종<\/b>뿐. 다양성은 배열 순서에서 나온다."}], "point": "단백질: 단위체 = 아미노산(약 20종) → 펩타이드 결합으로 사슬 → 배열 순서 → 입체 구조 → 기능 결정. 순서가 정체성이다.", "answers": "정답 ㉠ 20 ㉡ 펩타이드 ㉢ 기능 — '순서가 달라도 기능은 같다', '아미노산은 수만 종'이 단골 오답이다.", "blanks": {"㉠": "20", "㉡": "펩타이드", "㉢": "기능"}, "warning": "'순서가 달라도 기능은 같다', '아미노산은 수만 종'이 단골 오답이다.", "figure": {"caption": "단백질이 만들어지는 과정 ①→④ — 같은 재료라도 배열 순서가 구조를, 구조가 기능을 결정한다", "file": "figures/1204-03.svg"}}, {"id": "1204-04", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1204", "lessonName": "지각과 생명체를 이루는 물질의 규칙성", "no": "04", "title": "핵산(DNA)", "subtitle": "네 글자로 쓴 생명의 설계도", "steps": [{"n": "①", "t": "설계도", "d": "세포가 수만 가지 단백질을 틀리지 않고 만들려면 설계도가 있어야 한다. 그것이 <b>핵산<\/b> — 유전 정보를 저장·전달하는 물질, <b>DNA<\/b>와 <b>RNA<\/b>."}, {"n": "②", "t": "단위체", "d": "<b>뉴클레오타이드<\/b> = 인산 + 당 + 염기. DNA의 염기는 A·G·C·T {{㉠}}종류. 두 가닥이 마주 보며 꼬여 <b>이중 나선<\/b>."}, {"n": "③", "t": "짝과 서열", "d": "A는 T와, G는 C와만 손을 잡는다. 한쪽 서열을 알면 반대쪽이 정해지고, 염기가 늘어선 순서(<b>염기 서열<\/b>)가 곧 유전 정보다."}], "howto": [], "body": ["그런데 세포는 수만 가지 단백질을 어떻게 '틀리지 않고' 만들까? 어딘가에 <b>설계도<\/b>가 있어야 한다. 그 설계도가 <b>핵산<\/b> — 유전 정보를 저장하고 전달하는 물질로, <b>DNA<\/b>와 <b>RNA<\/b> 두 종류가 있다. 세포의 핵에서 처음 발견되어 붙은 이름이다.", "핵산의 기본 단위체는 <b>뉴클레오타이드<\/b>다. 뉴클레오타이드는 인산, 당, 그리고 <b>염기<\/b>로 이루어지는데, DNA에 쓰이는 염기는 아데닌(A)·구아닌(G)·사이토신(C)·타이민(T)의 <b>4종류<\/b>다. 뉴클레오타이드가 길게 이어진 두 가닥이 마주 보며 꼬여, DNA 특유의 <b>{{㉡}}<\/b> 구조를 만든다.", "두 가닥이 마주 볼 때 염기는 정해진 짝하고만 손을 잡는다 — <b>A는 T와, G는 {{㉢}}와<\/b>. 그래서 한쪽 가닥의 서열만 알면 반대쪽이 자동으로 정해진다. 그리고 이 염기가 늘어선 순서(<b>염기 서열<\/b>)가 바로 유전 정보다. 겨우 네 글자로 쓰였지만, 어떤 단백질을 언제 만들지에 대한 생명의 설계도 전체가 이 서열 속에 들어 있다. RNA는 DNA와 달리 한 가닥이며, 염기로 T 대신 유라실(U)을 쓰고 유전 정보를 단백질 공장으로 전달한다. 시험 단골 비교 — 아미노산 = 약 20종, DNA 염기 = 4종. 두 숫자 바꿔치기가 최다 빈출이다."], "terms": [{"k": "핵산", "v": "유전 정보를 저장(DNA)·전달(RNA)하는 물질. 세포의 핵에서 처음 발견되어 붙은 이름이다."}, {"k": "뉴클레오타이드", "v": "핵산의 기본 단위체 = 인산 + 당 + 염기. DNA 염기는 A·G·C·T 4종."}, {"k": "RNA", "v": "DNA와 달리 한 가닥이며, 염기로 T 대신 유라실(U)을 쓴다. 유전 정보를 단백질 공장으로 전달한다."}], "myths": [{"x": "DNA에서 A는 G와 짝을 이루어 결합한다.", "o": "<b>A는 T와, G는 C와<\/b> 짝을 이룬다."}, {"x": "DNA의 염기는 약 20종류다.", "o": "<b>4종<\/b>(A·G·C·T)이다. 20종은 아미노산."}], "point": "핵산(DNA·RNA): 단위체 = 뉴클레오타이드(인산+당+염기), DNA 염기 4종. 이중 나선, A–T / G–C 짝, 염기 서열 = 유전 정보.", "answers": "정답 ㉠ 4 ㉡ 이중 나선 ㉢ C — 'A–G 짝', '염기 20종'이 단골 오답이다.", "blanks": {"㉠": "4", "㉡": "이중 나선", "㉢": "C"}, "warning": "'A–G 짝', '염기 20종'이 단골 오답이다.", "figure": {"caption": "뉴클레오타이드와 DNA — 단위체가 이어져 이중 나선이 되고, 서열이 정보가 된다", "file": "figures/1204-04.svg"}}, {"id": "1204-05", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1204", "lessonName": "지각과 생명체를 이루는 물질의 규칙성", "no": "05", "title": "적은 재료, 무한한 다양성", "subtitle": "자연의 제작 전략", "steps": [{"n": "①", "t": "세 주인공 나란히", "d": "사면체 <b>1종<\/b>으로 수백 가지 광물, 아미노산 <b>20종<\/b>으로 수만 가지 단백질, 염기 <b>4종<\/b>으로 모든 생명의 설계도."}, {"n": "②", "t": "전략", "d": "적은 종류의 단위체 + 반복 결합 + <b>{{㉠}}의 다양성<\/b>. 다양성은 단위체의 '수'가 아니라 결합 방식·배열 순서·서열에서 나온다."}, {"n": "③", "t": "계산해 보면", "d": "아미노산 3개 잇기 = 20 × 20 × 20 = <b>8000<\/b>가지. 염기 10개 서열 = 4<sup>10<\/sup> ≈ 105만 가지. 수백 개짜리 사슬이면 사실상 무한."}], "howto": [], "body": ["이제 세 주인공을 나란히 놓고 보자. <b>사면체 한 종류<\/b>로 수백 가지 광물을, <b>아미노산 20종<\/b>으로 수만 가지 단백질을, <b>염기 4종<\/b>으로 모든 생명의 설계도를 만든다. 자연은 어디서나 같은 전략을 쓴다 — <b>적은 종류의 단위체 + 반복 결합 + 배열의 다양성<\/b>.", "이 전략의 힘은 계산해 보면 실감 난다. 아미노산 <b>3개<\/b>를 이어 붙이는 경우의 수만 해도 20 × 20 × 20 = {{㉡}}가지다. 실제 단백질은 아미노산 수백 개짜리 사슬이니, 배열의 경우의 수는 사실상 무한이다. DNA도 마찬가지 — 염기 네 글자면 아무리 긴 설계도라도 쓸 수 있다. A·G·C·T로 만들 수 있는 길이 10짜리 서열은 4<sup>10<\/sup> = 약 105만 가지이고, 사람의 DNA는 염기 약 30억 쌍이다.", "돌덩이와 생명체처럼 달라 보이는 것들이 같은 원리로 지어졌다는 것. 우주가 만든 원소들이 규칙적인 결합을 통해 지각이 되고 생명이 되었다는 것 — 이것이 물질과 규칙성 단원이 관통해 온 큰 그림이다. 비교표 자료가 나오면 ① 단위체 이름 → ② 단위체 종류 수(1·20·4) → ③ 다양성의 {{㉢}} 순서로 세로줄을 훑는다. 칸을 서로 바꿔 놓는 것이 출제의 전부라 해도 과언이 아니다."], "terms": [{"k": "자연의 전략", "v": "적은 종류의 단위체 + 반복 결합 + 배열의 다양성. 다양성은 단위체의 수가 아니라 결합 방식·배열 순서·서열에서 나온다."}, {"k": "경우의 수", "v": "아미노산 3개 = 20³ = 8000가지. 염기 10개 = 4¹⁰ ≈ 105만 가지. 사람 DNA 약 30억 쌍."}, {"k": "생명체의 구성 물질", "v": "물(약 66 %) > 단백질(약 16 %) > 지질 > 핵산·탄수화물 순. 물을 뺀 1등이 단백질이다."}], "myths": [{"x": "단백질이 수만 가지인 것은 아미노산의 종류가 많기 때문이다.", "o": "아미노산은 약 20종뿐. 다양성은 <b>배열 순서<\/b>에서 나온다."}, {"x": "지각의 광물은 생명체의 물질과 전혀 다른 원리로 만들어진다.", "o": "둘 다 <b>단위체의 반복 결합 + 배열의 다양성<\/b>이라는 같은 규칙을 따른다."}], "point": "사면체(1종) → 결합 방식 → 광물 / 아미노산(20종) → 배열 순서 → 단백질 / 뉴클레오타이드(염기 4종) → 염기 서열 → 핵산. 자연은 단순한 재료로 복잡함을 짓는다.", "answers": "정답 ㉠ 배열 ㉡ 8000 ㉢ 비결 — '다양성은 단위체 종류가 많아서'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "배열", "㉡": "8000", "㉢": "비결"}, "warning": "'다양성은 단위체 종류가 많아서'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "배열이 다양성을 만든다 — 지각과 생명이 공유하는 제작 전략. 단위체는 1 · 20 · 4종뿐이다", "file": "figures/1204-05.svg"}}, {"id": "1205-01", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1205", "lessonName": "물질의 전기적 성질과 신소재", "no": "01", "title": "도체 · 부도체 · 반도체", "subtitle": "전기 전도성으로 나눈 세 무리", "steps": [{"n": "①", "t": "도체", "d": "구리·철·알루미늄 같은 금속. 원자에서 떨어져 나와 자유롭게 돌아다니는 <b>자유 전자<\/b>가 많아 전압을 걸면 전류가 잘 흐른다."}, {"n": "②", "t": "부도체", "d": "유리·고무·플라스틱. 전자가 원자에 단단히 붙들려 전기가 거의 통하지 않는다. 전선의 속(구리)과 겉(고무)이 두 무리의 분업."}, {"n": "③", "t": "반도체", "d": "규소·저마늄. 전도성이 도체와 부도체의 <b>중간<\/b>이면서, 조건에 따라 전도성이 크게 달라진다 — '통하는 정도를 {{㉠}}할 수 있다'가 정체성."}], "howto": [], "body": ["소단원 03에서 우리는 전기가 통하는 조건을 배웠다 — <b>움직일 수 있는 전하 운반 입자<\/b>. 지구의 물질들을 이 기준으로 다시 세워 보면, 깔끔하게 세 무리로 나뉜다. <b>도체<\/b>는 구리·철·알루미늄 같은 금속이다. 금속 안에는 원자에서 떨어져 나와 자유롭게 돌아다니는 <b>자유 전자<\/b>가 많아서, 전압을 걸면 전자들이 일제히 움직이며 전류가 잘 흐른다 — 04에서 '구리는 고체인데도 통한다'고 한 복선을 여기서 회수한다.", "반대로 <b>부도체<\/b>(절연체)인 유리·고무·플라스틱은 전자가 원자에 단단히 붙들려 있어 전기가 거의 통하지 않는다. 전선의 속(구리)과 겉(고무)이 바로 이 두 무리의 분업이다. 절연체는 전기를 '끊는(絶)' 물질이라는 뜻으로, 감전을 막는 피복 재료가 된다.", "그리고 그 중간에, 이 소단원의 주인공이 있다. <b>반도체<\/b> — 규소(Si)·저마늄(Ge)처럼 전도성이 도체와 부도체의 {{㉡}}이면서, 결정적으로 조건에 따라 전도성이 크게 달라지는 물질이다. '반쯤 통한다'가 아니라 '<b>통하는 정도를 바꿀 수 있다<\/b>'는 것이 반도체의 진짜 정체성이다. '반(半)도체'는 전도성이 도체의 절반이라서가 아니라, 도체와 부도체의 '사이' 성질이라는 뜻이다. \"부도체는 자유 전자가 {{㉢}} 안 통한다\" 같은 이유 바꿔치기 선지에 주의한다 — 부도체는 자유 전자가 거의 없다."], "terms": [{"k": "자유 전자", "v": "금속 원자에서 떨어져 나와 물질 속을 자유롭게 이동하는 전자. 도체의 전류·열 전도를 담당한다."}, {"k": "절연체", "v": "부도체의 다른 이름. 전기를 '끊는(絶)' 물질이라는 뜻으로, 감전을 막는 피복 재료가 된다."}, {"k": "반도체", "v": "규소·저마늄. 전도성이 도체와 부도체의 중간이며, 조건(불순물·온도·빛)에 따라 크게 달라진다 — 핵심은 조절 가능성."}], "myths": [{"x": "부도체는 자유 전자가 많아서 전기가 안 통한다.", "o": "자유 전자가 <b>거의 없어서<\/b> 안 통한다. 많으면 도체다."}, {"x": "반도체는 전기가 도체의 절반만큼 통하는 물질이다.", "o": "핵심은 중간값이 아니라 <b>조절 가능성<\/b>이다."}], "point": "도체 = 자유 전자 많다(구리), 부도체 = 거의 없다(고무·유리), 반도체 = 중간 + 조절이 된다(규소). '통하는 정도를 바꿀 수 있다'가 반도체의 정체성이다.", "answers": "정답 ㉠ 조절 ㉡ 중간 ㉢ 많아서 — '부도체는 자유 전자가 많다', '반도체 = 절반만 통한다'가 단골 오답이다.", "blanks": {"㉠": "조절", "㉡": "중간", "㉢": "많아서"}, "warning": "'부도체는 자유 전자가 많다', '반도체 = 절반만 통한다'가 단골 오답이다.", "figure": {"caption": "전기 전도성에 따른 물질의 세 무리 — 자유 전자의 양과 '조절 가능성'이 가른다", "file": "figures/1205-01.svg"}}, {"id": "1205-02", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1205", "lessonName": "물질의 전기적 성질과 신소재", "no": "02", "title": "반도체", "subtitle": "마음대로 조절되는 전도성", "steps": [{"n": "①", "t": "불순물", "d": "순수한 규소는 전기가 잘 통하지 않는다. 다른 원소의 불순물을 아주 조금 첨가하면 전도성이 <b>크게 커진다<\/b>. 종류와 양으로 원하는 만큼 {{㉠}}."}, {"n": "②", "t": "왜 혁명인가", "d": "전류를 흐르게 할지 말지를 정할 수 있다 = <b>스위치<\/b>. 켜짐(1)·꺼짐(0)의 스위치가 모이면 계산하는 기계 — 컴퓨터."}, {"n": "③", "t": "온도와 빛", "d": "온도가 높아지거나 빛을 받으면 전도성이 <b>커진다<\/b>. 뒤집어 쓰면 <b>센서<\/b> — 온도 센서, 광센서(자동으로 켜지는 가로등)."}], "howto": [], "body": ["순수한 규소는 전기가 잘 통하지 않는다. 그런데 여기에 다른 원소의 불순물을 아주 조금 첨가하면, 놀랍게도 <b>전기 전도성이 크게 커진다<\/b>. 첨가하는 불순물의 종류와 양에 따라 전도성을 원하는 만큼 조절할 수 있다 — 말하자면 규소는 <b>전기가 통하는 정도를 다이얼처럼 돌릴 수 있는 물질<\/b>인 것이다. 이 기술을 도핑이라 한다.", "이 '조절 가능성'이 왜 혁명일까? <b>전류를 흐르게 할지 말지<\/b>를 인간이 정할 수 있다는 것은 곧 <b>{{㉡}}<\/b>를 만들 수 있다는 뜻이고, 켜짐(1)과 꺼짐(0)의 스위치가 모이면 계산하는 기계 — 컴퓨터가 된다. 스마트폰과 컴퓨터의 시대는 모래에서 뽑아낸 규소의 전도성을 다스리면서 열렸다.", "반도체의 전도성은 불순물만이 아니라 <b>온도와 빛<\/b>에도 반응한다. 온도가 높아지거나 빛을 받으면 전도성이 {{㉢}}진다. 이 성질을 뒤집어 쓰면 <b>센서<\/b>가 된다 — 전도성의 변화를 읽어 온도를 재는 온도 센서, 빛을 감지하는 광센서(자동으로 켜지는 가로등)가 그것이다. 시험은 두 방향만 정확히 — ① 불순물 첨가 → 전도성 커진다 ② 온도 상승·빛 → 전도성 커진다. \"작아진다\"로 뒤집는 선지가 단골이다."], "terms": [{"k": "불순물 첨가(도핑)", "v": "순수 반도체에 다른 원소를 미량 섞어 전기적 성질을 바꾸는 기술. 전도성이 크게 커진다."}, {"k": "규소와 모래", "v": "반도체의 원료 규소는 모래·석영(이산화 규소)에서 뽑는다. 소단원 04의 그 규산염이다."}, {"k": "센서", "v": "온도·빛에 따라 달라지는 전도성을 거꾸로 읽어 온도·빛을 감지하는 장치. 광센서는 자동 가로등에."}], "myths": [{"x": "순수한 규소는 금속처럼 전기가 잘 통한다.", "o": "<b>잘 통하지 않는다<\/b>. 불순물을 소량 첨가해야 전도성이 커진다."}, {"x": "반도체는 빛을 받으면 전도성이 작아진다.", "o": "빛·온도 상승 → 전도성 <b>커진다<\/b>. 그래서 광센서가 된다."}], "point": "반도체 = 조절되는 전도성. 불순물 첨가 → 커짐(스위치 → 컴퓨터), 온도 상승·빛 → 커짐(센서). 핵심은 중간값이 아니라 조절 가능성.", "answers": "정답 ㉠ 조절 ㉡ 스위치 ㉢ 커 — '순수 규소는 잘 통한다', '빛을 받으면 작아진다'가 단골 오답이다.", "blanks": {"㉠": "조절", "㉡": "스위치", "㉢": "커"}, "warning": "'순수 규소는 잘 통한다', '빛을 받으면 작아진다'가 단골 오답이다.", "figure": {"caption": "불순물 첨가와 전도성 — 소량의 불순물이 규소를 '조절 가능한 도선'으로 바꾸고, 그 조절이 스위치와 센서가 된다", "file": "figures/1205-02.svg"}}, {"id": "1205-03", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1205", "lessonName": "물질의 전기적 성질과 신소재", "no": "03", "title": "반도체 소자", "subtitle": "거르고, 키우고, 모으고, 바꾼다", "steps": [{"n": "①", "t": "다이오드", "d": "전류를 <b>한 방향으로만<\/b> 흐르게 하는 소자. 흐를 때 빛을 내도록 만든 것이 <b>발광 다이오드(LED)<\/b> — 전력 적게, 수명 길게."}, {"n": "②", "t": "트랜지스터 · 집적 회로", "d": "작은 신호를 크게 키우고({{㉠}}), 전류를 켜고 끈다(스위치). 수십억 개를 손톱만 한 칩에 새긴 것이 <b>집적 회로<\/b> — 스마트폰의 두뇌."}, {"n": "③", "t": "태양 전지", "d": "거꾸로 빛을 받으면 전기를 만드는 소자. 지붕 위 태양광 패널이 바로 반도체 판이다."}], "howto": [], "body": ["전도성을 제어할 수 있게 된 인간은, 반도체로 전류를 다루는 부품 — <b>반도체 소자<\/b>를 만들었다. <b>다이오드<\/b>는 전류를 한 방향으로만 흐르게 하는 소자다. 교류를 직류로 바꾸는 데도 쓰인다. 그중 전류가 흐를 때 빛을 내도록 만든 것이 <b>발광 다이오드(LED)<\/b> — 전력을 적게 쓰고 수명이 길어 조명·신호등·전광판을 점령했다.", "<b>트랜지스터<\/b>는 작은 신호를 크게 키우고(<b>증폭<\/b>), 전류를 켜고 끄는(<b>스위치<\/b>) 소자다. 이 스위치 수십억 개를 손톱만 한 칩 하나에 새겨 넣은 것이 <b>{{㉡}}<\/b>(반도체 칩) — 스마트폰과 컴퓨터의 두뇌다. 사람 머리카락 굵기보다 수천 배 가는 회로 덕분이다.", "거꾸로 빛을 받으면 전기를 만드는 소자도 있다. <b>태양 전지<\/b>다. 지붕 위 태양광 패널이 바로 반도체 판이다. 태양 전지는 {{㉢}}에너지를 전기 에너지로 바꾼다 — \"전기를 빛으로 바꾼다\"로 뒤집은 선지가 함정이며, 그쪽은 LED다. 소자 넷은 동사로 외운다 — 다이오드는 '거른다', 트랜지스터는 '키우고 끈다', 칩은 '모은다', 태양 전지는 '바꾼다'. 기능 바꿔치기 선지는 이걸로 전부 걸러진다."], "terms": [{"k": "다이오드 · LED", "v": "전류를 한 방향으로만 통과시키는 소자(교류 → 직류에도). LED는 전류가 흐를 때 빛을 낸다 — 전력 적게, 수명 수십 배."}, {"k": "트랜지스터 · 집적 회로", "v": "트랜지스터는 증폭·스위치. 수십억 개를 손톱만 한 칩에 새긴 것이 집적 회로 — 스마트폰·컴퓨터의 두뇌."}, {"k": "태양 전지", "v": "빛에너지 → 전기 에너지로 바꾸는 반도체 소자. 지붕 위 태양광 패널."}], "myths": [{"x": "태양 전지는 전기 에너지를 빛에너지로 바꾼다.", "o": "<b>빛 → 전기<\/b>다. 전기 → 빛은 LED."}, {"x": "다이오드는 전류를 양방향으로 흐르게 한다.", "o": "<b>한 방향으로만<\/b> 흐르게 한다 — '거른다'."}], "point": "다이오드(한 방향 · LED는 빛) · 트랜지스터(증폭 · 스위치) · 집적 회로(모은다) · 태양 전지(빛 → 전기). 동사 넷 — 거른다 · 키우고 끈다 · 모은다 · 바꾼다.", "answers": "정답 ㉠ 증폭 ㉡ 집적 회로 ㉢ 빛 — '태양 전지 = 전기 → 빛', '다이오드 = 양방향'이 단골 오답이다.", "blanks": {"㉠": "증폭", "㉡": "집적 회로", "㉢": "빛"}, "warning": "'태양 전지 = 전기 → 빛', '다이오드 = 양방향'이 단골 오답이다.", "figure": {"caption": "대표 반도체 소자 — 한 방향으로 보내고(다이오드), 키우고 끄고(트랜지스터), 모으고(칩), 빛과 전기를 서로 바꾼다(LED · 태양 전지)", "file": "figures/1205-03.svg"}}, {"id": "1205-04", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1205", "lessonName": "물질의 전기적 성질과 신소재", "no": "04", "title": "탄소 신소재", "subtitle": "연필심에서 꿈의 소재로", "steps": [{"n": "①", "t": "신소재", "d": "자연에 없던 재료를 설계한 것. 첫 주인공은 연필심의 원소 <b>탄소<\/b> — 결합의 달인이라 <b>배열만 바꾸면 전혀 다른 물질<\/b>이 된다."}, {"n": "②", "t": "그래핀", "d": "탄소 원자가 벌집 모양 육각형으로 <b>단 한 층<\/b> 배열. 두께가 원자 하나인데 전기가 구리보다 잘 통하고, 투명하며, 강철보다 튼튼하면서 잘 휘어진다."}, {"n": "③", "t": "탄소 나노 튜브", "d": "그래핀을 {{㉠}} 만 모양. 매우 가벼우면서 강도가 커 초경량 구조재·스포츠 장비에 쓰인다."}], "howto": [], "body": ["물질의 전기적 성질을 이해한 인간은, 이제 자연에 없던 재료를 설계하기 시작했다. 이런 재료를 <b>신소재<\/b>라 한다. 첫 주인공은 뜻밖에도 연필심의 원소, <b>탄소<\/b>다. 소단원 04에서 봤듯 탄소는 결합의 달인이라, <b>배열만 바꾸면 전혀 다른 물질<\/b>이 된다. 그래핀은 2004년 흑연에 셀로판테이프를 붙였다 떼는 기발한 방법으로 처음 분리되었고, 이 연구는 2010년 노벨 물리학상을 받았다.", "<b>그래핀<\/b>은 탄소 원자가 벌집 모양 육각형으로 <b>단 한 층<\/b> 배열된 물질이다. 두께가 원자 하나뿐인데 <b>전기가 구리보다 잘 통하고<\/b>, {{㉡}}하며, 강철보다 튼튼하면서 잘 휘어진다 — 접거나 두르는 디스플레이, 웨어러블 기기의 유력한 재료다. 이 그래핀을 <b>둥글게 만 모양<\/b>이 <b>탄소 나노 튜브<\/b>다. 매우 가벼우면서 강도가 커서 초경량 구조재·스포츠 장비 등에 쓰인다. 나노(nano)는 10억분의 1로, 탄소 나노 튜브의 지름은 수 나노미터 — 머리카락의 수만분의 1이다.", "놀라운 점은 이것이다 — 흑연(연필심)도, 그래핀도, 탄소 나노 튜브도, 다이아몬드도 모두 <b>같은 {{㉢}}<\/b>다. 소단원 04의 결론이 신소재에서 다시 증명된다. 재료가 아니라 배열이 성질을 만든다."], "terms": [{"k": "신소재", "v": "기존 재료에 없는 성질을 갖도록 설계·합성한 재료. 반도체·그래핀·초전도체가 대표다."}, {"k": "그래핀", "v": "탄소 원자가 벌집 모양으로 한 층 배열된 물질. 구리보다 전기가 잘 통하고, 투명하며, 강하고 유연하다."}, {"k": "탄소 나노 튜브", "v": "그래핀을 둥글게 만 모양. 지름 수 nm. 가볍고 강도가 커 초경량 구조재·스포츠 장비에 쓰인다."}], "myths": [{"x": "그래핀은 불투명하고 잘 부러진다.", "o": "<b>투명하고 유연<\/b>하다. 그래서 접는 디스플레이 재료다."}, {"x": "그래핀과 다이아몬드는 서로 다른 원소로 되어 있다.", "o": "둘 다 <b>탄소<\/b>다. 배열이 다를 뿐이다."}], "point": "그래핀(한 층 · 투명 · 유연 · 구리보다 잘 통함) · 탄소 나노 튜브(그래핀을 만 것 · 경량·고강도). 흑연·그래핀·나노 튜브·다이아몬드는 모두 탄소 — 배열이 성질을 만든다.", "answers": "정답 ㉠ 둥글게 ㉡ 투명 ㉢ 탄소 — '그래핀은 불투명하고 잘 부러진다'가 단골 오답이다.", "blanks": {"㉠": "둥글게", "㉡": "투명", "㉢": "탄소"}, "warning": "'그래핀은 불투명하고 잘 부러진다'가 단골 오답이다.", "figure": {"caption": "탄소 신소재의 가족 — 흑연에서 한 층을 벗기면 그래핀, 그래핀을 말면 나노 튜브. 접는 디스플레이·초경량 구조재의 재료", "file": "figures/1205-04.svg"}}, {"id": "1205-05", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1205", "lessonName": "물질의 전기적 성질과 신소재", "no": "05", "title": "초전도체와 액정", "subtitle": "'중간'의 성질이 곧 기술이다", "steps": [{"n": "①", "t": "초전도체", "d": "특정 온도(<b>임계 온도<\/b>) 이하로 식히면 전기 저항이 완전히 {{㉠}}이 되는 물질. 열 손실 없이 강한 전류 → 강력한 <b>전자석<\/b>."}, {"n": "②", "t": "쓰임과 조건", "d": "병원의 <b>MRI<\/b>, 선로 위에 떠서 달리는 <b>자기 부상 열차<\/b>. 단, 저항 0은 임계 온도 <b>이하에서만<\/b>이다."}, {"n": "③", "t": "액정", "d": "액체처럼 흐르면서 결정처럼 분자가 규칙적으로 배열되는 중간 상태. <b>전압<\/b>을 걸면 배열 방향이 바뀌어 빛을 통과·차단 — <b>LCD<\/b>."}], "howto": [], "body": ["어떤 물질은 특정 온도(<b>임계 온도<\/b>) 이하로 차갑게 식히면 <b>전기 저항이 완전히 0<\/b>이 된다. 이런 물질이 <b>초전도체<\/b>다. 저항이 없으니 전류가 흘러도 <b>열 손실이 전혀 없고<\/b>, 아주 강한 전류를 흘려 강력한 <b>전자석<\/b>을 만들 수 있다. 병원의 <b>MRI(자기 공명 영상 장치)<\/b>, 선로 위에 떠서 달리는 <b>자기 부상 열차<\/b>가 초전도 전자석의 작품이다. 몸속을 찍는 강한 자기장은 초전도 전자석이 만들기에 MRI 장치는 늘 극저온으로 냉각된다.", "단, 조건을 잊으면 안 된다 — 저항이 0인 것은 <b>임계 온도 {{㉡}}에서만<\/b>이다. 임계 온도는 물질마다 다르며 대부분 매우 낮다. 상온에서도 초전도가 되는 물질을 찾는 것은 지금도 물리학의 큰 꿈으로 남아 있다.", "한편 <b>액정<\/b>은 액체처럼 흐르면서 고체 결정처럼 분자가 규칙적으로 배열되는 중간 상태의 물질이다. {{㉢}}을 걸면 분자의 배열 방향이 바뀌어 <b>빛을 통과시키거나 차단<\/b>할 수 있다 — 이 성질로 만든 것이 LCD(액정 디스플레이)다. 도체도 부도체도 아닌 어중간함(반도체), 고체도 액체도 아닌 어중간함(액정) — '중간'의 성질을 읽어 낸 것이 곧 기술이 되었다. 이 소단원을 정리하면: 도체(자유 전자 多) / 부도체(거의 없음) / 반도체(중간 + 조절: 불순물·온도·빛), 소자는 다이오드·트랜지스터·집적 회로·태양 전지, 신소재는 그래핀·탄소 나노 튜브·초전도체·액정이다."], "terms": [{"k": "초전도체 · 임계 온도", "v": "임계 온도 이하에서 전기 저항이 0이 되는 물질. 열 손실 없이 강한 전류 → 강력한 전자석(MRI · 자기 부상 열차). 임계 온도는 대부분 매우 낮다."}, {"k": "액정", "v": "액체처럼 흐르면서 결정처럼 분자가 규칙 배열되는 중간 상태. 전압으로 배열 방향을 바꿔 빛을 조절 → LCD."}, {"k": "신소재 한 줄", "v": "그래핀(한 층·투명·유연) · 탄소 나노 튜브(경량·고강도) · 초전도체(임계 온도 이하 저항 0) · 액정(전압으로 빛 조절)."}], "myths": [{"x": "초전도체는 어떤 온도에서도 저항이 0이다.", "o": "<b>임계 온도 이하에서만<\/b>이다. 상온 초전도체는 아직 꿈이다."}, {"x": "액정은 전압을 걸어도 분자 배열이 변하지 않는다.", "o": "전압을 걸면 <b>배열이 바뀌어<\/b> 빛을 조절한다 — 그것이 LCD의 원리다."}], "point": "초전도체 = 임계 온도 이하에서 저항 0 → 강한 전자석(MRI · 자기 부상 열차). 액정 = 고체와 액체의 중간, 전압으로 빛 조절(LCD). '중간'의 성질이 곧 기술이다.", "answers": "정답 ㉠ 0 ㉡ 이하 ㉢ 전압 — '어떤 온도에서도 저항 0', '액정은 전압에 반응하지 않는다'가 단골 오답이다.", "blanks": {"㉠": "0", "㉡": "이하", "㉢": "전압"}, "warning": "'어떤 온도에서도 저항 0', '액정은 전압에 반응하지 않는다'가 단골 오답이다.", "figure": {"caption": "초전도체와 액정 — 저항 0의 그래프(임계 온도 이하), 떠오르는 열차와 MRI, 전압으로 줄 세운 액정 분자", "file": "figures/1205-05.svg"}}, {"id": "1301-01", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1301", "lessonName": "물질 순환", "no": "01", "title": "지구시스템", "subtitle": "시스템 속의 시스템, 다섯 권역", "steps": [{"n": "①", "t": "시스템", "d": "여러 구성 요소가 서로 영향을 주고받으며 <b>하나로 작동하는 집합<\/b>. 태양계도 시스템이고 지구는 그 구성 요소다."}, {"n": "②", "t": "딱 좋은 자리", "d": "태양에서 적당히 떨어져 물이 {{㉠}}로 존재하고, 적당한 크기와 중력으로 대기를 붙잡았다. 끓어 버린 금성과 대기를 놓친 화성 사이."}, {"n": "③", "t": "다섯 권역", "d": "<b>기권<\/b>(대기) · <b>수권<\/b>(물) · <b>지권<\/b>(땅) · <b>생물권<\/b>(생명) · <b>외권<\/b>(우주 공간). 핵심은 권역들 '사이'의 교환이다."}], "howto": [], "body": ["여러 구성 요소가 서로 영향을 주고받으며 하나로 작동하는 집합을 <b>시스템(계)<\/b>이라고 한다. 태양과 행성들이 중력으로 묶여 도는 <b>태양계<\/b>도 시스템이고, 지구는 그 <b>구성 요소<\/b>다. 그리고 시야를 지구로 좁히면, 지구 자체가 다시 여러 권역으로 이루어진 정교한 시스템 — <b>지구시스템<\/b>이다. 교실·급식실·운동장이 따로 있어도 종소리 하나에 다 같이 움직이는 학교처럼, 서로 연결돼 하나로 굴러가면 그것이 시스템이다.", "지구가 생명이 넘치는 시스템이 될 수 있었던 데는 <b>태양계 안에서의 위치<\/b>가 결정적이었다. 태양에서 적당히 떨어져 있어 <b>물이 액체로 존재<\/b>하고, 적당한 크기와 중력 덕분에 {{㉡}}를 붙잡아 둘 수 있었다. 너무 가까워 끓어 버린 금성, 너무 작아 대기를 놓친 화성 사이 — 지구는 딱 좋은 자리에 있다.", "지구시스템은 다섯 권역으로 나눈다. 대기의 <b>기권<\/b>, 물의 <b>수권<\/b>, 땅의 <b>지권<\/b>, 모든 생명의 <b>생물권<\/b>, 그리고 기권 바깥 우주 공간의 <b>{{㉢}}<\/b>. 외권에서는 지구 자기장이 만드는 자기권이 태양에서 오는 해로운 입자를 막아 준다. 중요한 것은 <b>다섯 권역이 따로 놀지 않는다<\/b>는 사실이다 — 이번 소단원의 진짜 주제는 권역들 '사이'에서 벌어지는 일이다. 태양계·지구시스템·생명 시스템(이 단원 후반) 모두 같은 눈으로 본다."], "terms": [{"k": "시스템(계)", "v": "서로 영향을 주고받는 구성 요소들의 집합. 태양계·지구시스템·생명 시스템 모두 같은 눈으로 본다."}, {"k": "다섯 권역", "v": "기권(대기) · 수권(물) · 지권(땅) · 생물권(생명) · 외권(기권 바깥의 우주 공간). \"기·수·지·생·외\"."}, {"k": "외권", "v": "기권 바깥의 우주 공간. 지구 자기장이 만드는 자기권이 태양에서 오는 해로운 입자를 막아 준다."}], "myths": [{"x": "지구시스템의 다섯 권역은 각각 독립적으로 작동한다.", "o": "권역들은 물질과 에너지를 <b>끊임없이 주고받는다<\/b>. 핵심은 '사이'의 교환이다."}, {"x": "지구에 생명이 있는 것은 지구가 특별한 원소로 되어 있기 때문이다.", "o": "<b>태양계 안의 위치<\/b>(액체 물, 대기를 붙잡는 중력)가 결정적이었다."}], "point": "시스템 = 서로 영향을 주고받으며 하나로 작동하는 집합. 지구는 태양계의 구성 요소이자, 기·수·지·생·외 다섯 권역의 시스템이다. 핵심은 권역 사이의 교환.", "answers": "정답 ㉠ 액체 ㉡ 대기 ㉢ 외권 — '권역들은 독립적으로 작동한다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "액체", "㉡": "대기", "㉢": "외권"}, "warning": "'권역들은 독립적으로 작동한다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "시스템 속의 시스템 — 태양계의 구성 요소인 지구가, 다시 기권·수권·지권·생물권·외권의 시스템이 된다", "file": "figures/1301-01.svg"}}, {"id": "1301-02", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1301", "lessonName": "물질 순환", "no": "02", "title": "기권과 수권", "subtitle": "지그재그 기온 구조, 그리고 귀한 물", "steps": [{"n": "①", "t": "기권 네 층", "d": "높이에 따른 <b>{{㉠}} 변화<\/b>를 기준으로 대류권 · 성층권 · 중간권 · 열권. 기온이 ↓↑↓↑ 지그재그로 바뀌는 곳이 경계다."}, {"n": "②", "t": "층의 간판", "d": "대류권 = 구름·비·눈 등 <b>기상 현상<\/b>. 성층권 = <b>오존층<\/b>(자외선 흡수). 중간권 = 유성. 열권 = 오로라."}, {"n": "③", "t": "수권", "d": "지구의 모든 물. 약 <b>97 %가 해수<\/b>, 담수의 대부분은 <b>빙하<\/b>, 그다음 지하수, 강·호수는 아주 조금. 쓸 수 있는 물은 귀하다."}], "howto": [], "body": ["<b>기권<\/b>은 지구를 둘러싼 대기의 층으로, <b>높이에 따른 기온 변화<\/b>를 기준으로 네 층으로 나눈다. 지표에 붙은 <b>대류권<\/b>은 위로 갈수록 기온이 낮아져 공기가 활발히 뒤섞이고(대류), 수증기가 많아 구름·비·눈 같은 <b>기상 현상<\/b>이 모두 여기서 일어난다. 그 위 <b>성층권<\/b>에는 <b>오존층<\/b>이 있어 태양의 자외선을 흡수한다 — 그 열 때문에 위로 갈수록 오히려 따뜻해진다.", "더 올라가면 다시 추워지는 <b>중간권<\/b>(유성이 타는 층), 그리고 태양 에너지를 직접 받아 위로 갈수록 뜨거워지는 <b>열권<\/b>(오로라의 무대)이 이어진다. 기온이 내려가고-올라가고-내려가고-올라가는 지그재그가 네 층의 경계다. 층별 '간판' 바꿔치기가 시험의 단골이다 — 기상 현상 = {{㉡}}, 오존층 = 성층권, 유성 = 중간권, 오로라 = 열권. 그리고 구분 기준은 기압이 아니라 기온 변화다.", "<b>수권<\/b>은 지구의 모든 물이다. 대부분(약 97 %)은 <b>해수<\/b>이고, 나머지 담수도 대부분은 <b>{{㉢}}<\/b>로 얼어 있으며, 그다음이 지하수, 강과 호수의 물은 아주 조금이다. 우리가 쓸 수 있는 물이 생각보다 훨씬 귀한 이유다. 이 소단원에서는 물이 '권역 사이를 어떻게 오가는지'로 시야를 넓힌다(개념 05)."], "terms": [{"k": "기권의 네 층", "v": "대류권(기상 현상, 위로 갈수록 추움) · 성층권(오존층, 따뜻해짐) · 중간권(유성, 추워짐) · 열권(오로라, 뜨거워짐). 기준은 기온 변화."}, {"k": "대류 · 오존층", "v": "대류는 따뜻한 것이 위로, 찬 것이 아래로 뒤섞이는 현상(대류권은 아래가 따뜻해 활발). 오존층은 성층권의 오존 밀집 구역으로 자외선을 흡수한다."}, {"k": "수권의 구성", "v": "해수 약 97 % > 담수(대부분 빙하 > 지하수 > 강·호수 아주 조금)."}], "myths": [{"x": "구름과 비는 주로 성층권에서 만들어진다.", "o": "기상 현상은 모두 <b>대류권<\/b>에서. 성층권의 간판은 오존층이다."}, {"x": "기권의 네 층은 기압을 기준으로 나눈다.", "o": "<b>높이에 따른 기온 변화<\/b>(지그재그)가 기준이다."}], "point": "기권: 대-성-중-열, 기온은 ↓↑↓↑ 지그재그. 날씨는 대류권, 오존층은 성층권. 수권: 해수 97 %, 담수의 대부분은 빙하 — 쓸 수 있는 물은 귀하다.", "answers": "정답 ㉠ 기온 ㉡ 대류권 ㉢ 빙하 — '구름은 성층권', '기준은 기압'이 단골 오답이다.", "blanks": {"㉠": "기온", "㉡": "대류권", "㉢": "빙하"}, "warning": "'구름은 성층권', '기준은 기압'이 단골 오답이다.", "figure": {"caption": "기권의 지그재그 기온 구조와 수권의 구성 — 층의 간판(기상 현상 · 오존층 · 유성 · 오로라)을 붙여 둔다", "file": "figures/1301-02.svg"}}, {"id": "1301-03", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1301", "lessonName": "물질 순환", "no": "03", "title": "지권 · 생물권 · 외권", "subtitle": "땅과 생명과 우주", "steps": [{"n": "①", "t": "지권 네 층", "d": "겉의 얇은 <b>지각<\/b> → 부피의 약 80 %인 <b>맨틀<\/b>(고체지만 서서히 대류, 판을 움직인다) → 액체 <b>외핵<\/b> → 고체 <b>내핵<\/b>."}, {"n": "②", "t": "생물권", "d": "지구의 모든 생명체. 땅 위·땅속·바다·하늘까지 — 기권·수권·지권에 <b>걸쳐 있다<\/b>는 점이 특징."}, {"n": "③", "t": "외권", "d": "기권 바깥의 우주 공간. 철이 많은 {{㉠}}의 흐름이 만든 지구 자기장 → <b>자기권<\/b>이 태양의 해로운 입자를 막는 방패."}], "howto": [], "body": ["<b>지권<\/b>은 지구의 땅 전체 — 겉의 얇은 <b>지각<\/b>부터 중심까지다. 지각 아래에는 지권 부피의 약 80 %를 차지하는 <b>맨틀<\/b>이 있는데, 고체이지만 오랜 시간에 걸쳐 서서히 <b>대류<\/b>한다(1년에 수 cm — 이 움직임이 다음 소단원의 주인공, 판을 움직인다). 그 아래로 액체 상태의 <b>외핵<\/b>과 고체인 <b>내핵<\/b>이 있다 — 철이 많은 외핵의 흐름이 지구 자기장을 만든다.", "<b>생물권<\/b>은 지구의 모든 생명체다. 땅 위와 땅속, 바다와 하늘까지 — 생물이 사는 곳이면 어디든 생물권이며, 기권·수권·지권에 <b>걸쳐 있다<\/b>는 점이 특징이다. <b>외권<\/b>은 기권 바깥의 우주 공간으로, 지구 자기장이 만드는 <b>{{㉡}}<\/b>이 태양에서 날아오는 해로운 입자들을 막아 생물권의 방패가 되어 준다. 태양풍 입자의 일부는 극지방으로 들어와 오로라가 된다.", "지권 네 층은 '지-맨-외-내'로 리듬을 타면 끝이다. 단, <b>액체는 {{㉢}} 하나뿐<\/b>이라는 것, 부피 1등은 맨틀이라는 것 — 이 둘이 시험 포인트다. 내핵을 액체라고 바꾼 선지, 중심으로 갈수록 부피가 크다고 한 선지가 함정이다."], "terms": [{"k": "지권의 층", "v": "지각(얇음) · 맨틀(부피 약 80 %, 고체이지만 서서히 대류) · 외핵(액체, 철 — 자기장의 근원) · 내핵(고체)."}, {"k": "맨틀의 대류", "v": "고체인 맨틀이 아주 느리게(1년에 수 cm) 흐르는 현상. 판을 움직이는 원동력이다."}, {"k": "자기권", "v": "지구 자기장이 미치는 공간. 태양풍 입자를 막고, 일부가 극지방으로 들어와 오로라가 된다."}], "myths": [{"x": "내핵은 액체 상태다.", "o": "액체는 <b>외핵<\/b> 하나뿐. 내핵은 고체다."}, {"x": "생물권은 지권의 일부다.", "o": "생물권은 기권·수권·지권에 <b>걸쳐<\/b> 분포한다."}], "point": "지권 = 지각-맨틀(부피 1등, 대류)-외핵(액체, 자기장)-내핵. 생물권은 세 권역에 걸쳐 있고, 외권의 자기권이 태양풍을 막는 방패다.", "answers": "정답 ㉠ 외핵 ㉡ 자기권 ㉢ 외핵 — '내핵은 액체', '생물권은 지권의 일부'가 단골 오답이다.", "blanks": {"㉠": "외핵", "㉡": "자기권", "㉢": "외핵"}, "warning": "'내핵은 액체', '생물권은 지권의 일부'가 단골 오답이다.", "figure": {"caption": "지권의 층상 구조와 생물권·외권 — 외핵의 흐름이 만든 자기장이 외권에서 태양풍을 막는 방패가 된다", "file": "figures/1301-03.svg"}}, {"id": "1301-04", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1301", "lessonName": "물질 순환", "no": "04", "title": "세 에너지원", "subtitle": "태양 ≫ 지구 내부 > 조력", "steps": [{"n": "①", "t": "태양 에너지", "d": "압도적 1위. 바닷물을 증발시켜 구름·비를, 바람을, 광합성으로 생물권을 먹여 살린다. <b>지표 현상 대부분의 동력<\/b>."}, {"n": "②", "t": "지구 내부 에너지", "d": "내부의 {{㉠}} 원소가 붕괴하며 내는 열. 맨틀을 대류시켜 판을 움직이고 <b>지진·화산<\/b>을 일으킨다. 땅의 사건은 전부 이것."}, {"n": "③", "t": "조력 에너지", "d": "달과 태양의 인력. 양은 가장 적지만 <b>밀물과 썰물<\/b>을 일으켜 갯벌 생태계를 부양한다."}], "howto": [], "body": ["권역들을 움직이게 하는 에너지는 어디서 올까? 출처는 딱 셋이다. 압도적 1위는 <b>태양 에너지<\/b> — <b>바닷물을 증발시켜 구름과 비를 만들고<\/b>, 바람을 일으키고, 광합성으로 생물권을 먹여 살린다. 지표에서 일어나는 <b>자연 현상 대부분의 동력<\/b>이다.", "2위는 <b>지구 내부 에너지<\/b>다. 지구 내부의 방사성 원소가 붕괴하며 내는 열(지구 탄생 때의 열도 일부)로, 맨틀을 대류시켜 판을 움직이고 <b>{{㉡}}과 화산<\/b>을 일으킨다. 땅의 사건은 전부 이 에너지의 작품이다. 3위는 달과 태양의 인력이 만드는 <b>조력 에너지<\/b> — 양은 가장 적지만 <b>밀물과 썰물<\/b>을 일으켜 갯벌 생태계를 부양한다. 밀물과 썰물로 해수면이 하루 약 두 번 오르내리는 현상이 조석이며, 서해 갯벌이 그 무대다.", "셋의 담당 구역을 정확히 나누는 것이 이 개념의 전부다. 하늘·물·생명의 일은 태양이, 땅속의 일은 지구 내부가, 바닷가의 하루 두 번 드나듦은 {{㉢}}이 맡는다. 담당 바꿔치기가 단골 — \"화산은 태양 에너지로\"(X), \"물의 순환은 지구 내부 에너지로\"(X). 태양이 멈춘다면 바람도 비도 광합성도 멈추지만, 화산과 지진은 계속된다 — 에너지원이 다르기 때문이다."], "terms": [{"k": "태양 에너지", "v": "지표 현상 대부분의 동력 — 물의 순환(증발), 바람, 광합성. 양이 압도적으로 가장 많다."}, {"k": "지구 내부 에너지", "v": "주로 내부 방사성 원소가 붕괴하며 내는 열(탄생 때의 열도 일부). 맨틀 대류 → 판 이동 → 지진·화산."}, {"k": "조력 에너지 · 조석", "v": "달과 태양의 인력. 밀물·썰물로 해수면이 하루 약 두 번 오르내리는 조석을 일으킨다. 양은 가장 적다."}], "myths": [{"x": "지진과 화산 활동의 에너지원은 태양 에너지다.", "o": "<b>지구 내부 에너지<\/b>다. 태양이 멈춰도 화산은 계속된다."}, {"x": "물의 순환은 지구 내부 에너지가 일으킨다.", "o": "바닷물을 증발시키는 것은 <b>태양<\/b>이다. 하늘·물·생명 = 태양."}], "point": "에너지원 셋: 태양(하늘·물·생명, 압도적) ≫ 지구 내부(땅속 — 지진·화산) > 조력(밀물·썰물). 현상을 보면 에너지원이 나온다.", "answers": "정답 ㉠ 방사성 ㉡ 지진 ㉢ 조력 — '화산 = 태양', '물의 순환 = 지구 내부'처럼 담당을 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "방사성", "㉡": "지진", "㉢": "조력"}, "warning": "'화산 = 태양', '물의 순환 = 지구 내부'처럼 담당을 바꾼 선지가 단골 오답이다.", "figure": {"caption": "세 에너지원의 담당 구역과 크기 — 하늘·물·생명은 태양, 땅속은 지구 내부, 바닷가의 드나듦은 조력", "file": "figures/1301-04.svg"}}, {"id": "1301-05", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1301", "lessonName": "물질 순환", "no": "05", "title": "상호작용과 순환", "subtitle": "물질은 돌고, 에너지는 흐른다", "steps": [{"n": "①", "t": "국경을 넘는다", "d": "증발은 수권→기권, 비가 땅을 깎으면 수권→지권, 화산재는 지권→기권. 문제는 <b>'이동한 물질'을 추적<\/b>하면 풀린다. 나무 한 그루는 네 권역과 동시에 거래한다."}, {"n": "②", "t": "물질은 순환", "d": "<b>물<\/b>: 증발 → 구름 → 비·눈 → 강·지하수 → 바다, 총량은 거의 일정. <b>탄소<\/b>: 광합성·호흡·바다·석회암·화석 연료 — 연소는 지권의 오래된 탄소 창고를 기권으로 여는 일."}, {"n": "③", "t": "에너지는 흐른다", "d": "태양 에너지는 저위도에 남고 고위도에 모자란다. 이 불균형을 <b>대기와 해수의 순환<\/b>이 실어 날라 균형을 지킨다. 순환하지 않고 {{㉠}}."}], "howto": [], "body": ["다섯 권역은 국경이 닫힌 나라들이 아니다. 물질과 에너지가 쉼 없이 국경을 넘는다 — 이것이 지구시스템의 <b>상호작용<\/b>이다. 바닷물이 증발해 구름이 되는 것은 <b>수권→기권<\/b>, 그 비가 땅을 깎아 계곡을 만드는 것은 <b>수권→지권<\/b>, 화산이 화산재와 기체를 내뿜는 것은 <b>지권→기권<\/b>의 상호작용이다. 생물권은 가장 부지런한 교환원이다 — 식물은 기권의 이산화 탄소를 마시고 산소를 내놓으며(광합성), 뿌리로 지권의 물과 양분을 빨아들이고, 잎으로 수증기를 내보낸다(증산). 한 그루 나무가 네 권역과 동시에 거래하는 셈이다.", "권역 사이의 교환을 길게 이어 붙이면 <b>순환<\/b>이 보인다. 대표가 <b>물의 순환<\/b>이다. 태양 에너지가 바닷물을 증발시키면(수권→기권), 수증기는 구름이 되어 비와 눈으로 내리고(기권→수권·지권), 강과 지하수로 흘러 다시 바다로 돌아간다. 물은 권역을 옮겨 다닐 뿐 지구 전체의 양은 거의 {{㉡}}하다. <b>탄소의 순환<\/b>도 같다 — 기권의 이산화 탄소는 광합성으로 생물권에 들어왔다가 호흡으로 돌아가고, 바다에 녹아들고(수권), 오랜 세월 석회암과 화석 연료로 지권에 저장된다. 인간이 화석 연료를 태우는 것은 <b>지권의 오래된 탄소 창고를 기권으로 여는 일<\/b>이다.", "한편 <b>에너지는 순환하지 않고 흐른다<\/b>. 둥근 지구는 적도가 햇빛을 수직으로, 극은 비스듬히 받아 태양 에너지가 저위도에 남고 고위도에 모자라는데, 이 불균형을 대기와 해수의 순환이 실어 날라 지구 전체의 균형을 지킨다 — 해류는 지구의 난방 배관이다. 태풍도 재해이지만, 지구 전체로는 저위도의 남는 열을 {{㉢}}로 나르는 에너지 수송의 한 방법이다. 상호작용 문제에서는 권역 이름부터 고르지 말고 '뭐가 움직였지?'를 먼저 묻는다."], "terms": [{"k": "물의 순환 · 탄소의 순환", "v": "물질은 권역 사이를 돌고 총량은 거의 일정하다. 화석 연료 연소는 지권의 탄소를 기권으로 옮긴다(결과는 통합과학2에서)."}, {"k": "에너지 불균형 · 해류", "v": "적도는 햇빛을 수직으로, 극은 비스듬히 받는다. 대기와 해수의 순환(해류)이 저위도의 남는 열을 고위도로 나른다."}, {"k": "증산 작용 · 석회동굴", "v": "증산은 식물이 뿌리로 흡수한 물을 잎의 기공으로 내보내는 것(생물권→기권). 석회동굴은 지하수가 석회암을 녹인 수권·지권의 합작품."}], "myths": [{"x": "대기와 해수의 순환은 고위도의 남는 열을 저위도로 옮긴다.", "o": "<b>저위도의 남는 열을 고위도로<\/b> 옮긴다. 태풍도 그 수송 방법의 하나다."}, {"x": "한 권역의 변화는 그 권역 안에서만 영향을 미친다.", "o": "연결망을 타고 <b>다른 권역으로 번진다<\/b>. 그래서 '시스템'으로 본다."}], "point": "상호작용 = 이동한 물질을 따라가라. 물질(물·탄소)은 순환하며 총량이 일정하고, 에너지는 저위도 → 고위도로 흐른다(대기·해수 운반). 동력은 태양.", "answers": "정답 ㉠ 흐른다 ㉡ 일정 ㉢ 고위도 — '열은 고위도에서 저위도로', '변화는 한 권역 안에만'이 단골 오답이다.", "blanks": {"㉠": "흐른다", "㉡": "일정", "㉢": "고위도"}, "warning": "'열은 고위도에서 저위도로', '변화는 한 권역 안에만'이 단골 오답이다.", "figure": {"caption": "물과 탄소의 순환 — 물질은 권역 사이를 돌고(총량 일정), 그 동력은 태양 에너지다. 에너지는 순환하지 않고 저위도에서 고위도로 흐른다", "file": "figures/1301-05.svg"}}, {"id": "1302-01", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1302", "lessonName": "판구조론과 지권의 변화", "no": "01", "title": "판과 맨틀 대류", "subtitle": "움직이는 땅", "steps": [{"n": "①", "t": "판", "d": "지각과 맨틀 최상부를 합친 단단한 암석층(<b>암석권<\/b>)이 10여 개 조각으로 갈라진 것. 아래의 물렁한 <b>연약권<\/b> 위에 뜬 뗏목이다."}, {"n": "②", "t": "물살", "d": "{{㉠}} 에너지로 가열된 맨틀이 1년에 수 cm씩 <b>대류<\/b>하고, 그 흐름을 따라 판이 움직인다. 이것이 <b>판구조론<\/b>."}, {"n": "③", "t": "두 종류", "d": "<b>대륙판<\/b>은 두껍고 밀도가 작다. <b>해양판<\/b>은 얇고 밀도가 크다. 이 밀도 차가 판이 만났을 때의 열쇠다."}], "howto": [], "body": ["지구의 겉껍질은 한 장으로 이어진 껍데기가 아니다. <b>지각과 맨틀 최상부를 합친 단단한 암석층(암석권)<\/b>이 <b>10여 개의 조각<\/b>으로 갈라져 있는데, 이 조각 하나하나가 <b>판<\/b>이다. 판 아래에는 부분적으로 물렁해 흐를 수 있는 <b>연약권<\/b>이 있다 — 판은 그 위에 떠 있는 <b>뗏목<\/b>인 셈이다. 중학교의 대륙 이동설은 '무엇이 미는가'를 답하지 못했는데, 그 답(맨틀 대류)을 지금 배운다.", "뗏목을 미는 물살은 <b>맨틀 대류<\/b>다. <b>지구 내부 에너지<\/b>로 가열된 맨틀이 1년에 수 cm씩 서서히 대류하고, 그 흐름을 따라 판이 움직인다 — 지권의 모든 사건이 지구 내부 에너지의 작품이라던 소단원 01의 이야기가 여기서 구체화된다. 이렇게 <b>지권의 변동을 판의 운동으로 설명하는 이론<\/b>이 <b>{{㉡}}<\/b>이다. 1년에 수 cm는 손톱 자라는 속도지만, 1억 년이면 수천 km — 대서양이 그렇게 벌어졌다.", "판에는 두 종류가 있다. 대륙을 싣고 있는 <b>대륙판<\/b>은 두껍고 밀도가 작으며, 바다 밑바닥의 <b>해양판<\/b>은 얇고 밀도가 {{㉢}}. 이 밀도 차이가 다음 개념 — 판들이 만났을 때 벌어지는 일 — 의 열쇠가 된다. 판 = 뗏목, 맨틀 대류 = 물살, 동력 = 지구 내부 에너지."], "terms": [{"k": "암석권과 연약권", "v": "암석권 = 지각 + 맨틀 최상부(단단함, 판의 재료). 연약권 = 그 아래의 물렁한 층(판을 실어 나름)."}, {"k": "판구조론", "v": "지권의 변동(지진·화산·산맥 형성)을 판의 운동으로 통합해 설명하는 이론. 동력은 맨틀 대류 = 지구 내부 에너지."}, {"k": "대륙판 · 해양판", "v": "대륙판은 두껍고 밀도가 작다. 해양판은 얇고 밀도가 크다 — 만나면 해양판이 아래로 파고든다."}], "myths": [{"x": "판은 지각만을 말한다.", "o": "<b>지각 + 맨틀 최상부(암석권)<\/b>다. 그 아래 연약권 위에 떠 있다."}, {"x": "판을 움직이는 에너지는 태양 에너지다.", "o": "<b>지구 내부 에너지<\/b>가 맨틀을 대류시켜 판을 나른다."}], "point": "판(암석권 조각) = 뗏목, 맨틀 대류 = 물살, 동력 = 지구 내부 에너지 → 판구조론. 대륙판은 두껍고 가볍고, 해양판은 얇고 무겁다.", "answers": "정답 ㉠ 지구 내부 ㉡ 판구조론 ㉢ 크다 — '판 = 지각만', '동력 = 태양'이 단골 오답이다.", "blanks": {"㉠": "지구 내부", "㉡": "판구조론", "㉢": "크다"}, "warning": "'판 = 지각만', '동력 = 태양'이 단골 오답이다.", "figure": {"caption": "판과 맨틀 대류 — 지구 내부 에너지가 맨틀을 돌리고, 맨틀이 판을 나른다. 대륙판은 두껍고 가볍고, 해양판은 얇고 무겁다", "file": "figures/1302-01.svg"}}, {"id": "1302-02", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1302", "lessonName": "판구조론과 지권의 변화", "no": "02", "title": "발산형 경계", "subtitle": "판이 태어나는 곳, 해령", "steps": [{"n": "①", "t": "세 가지뿐", "d": "판이 만나는 방식은 멀어지거나, 모이거나, 스치거나. 서로 <b>멀어지는<\/b> 경계가 <b>발산형 경계<\/b>다."}, {"n": "②", "t": "판의 산부인과", "d": "갈라진 틈으로 <b>맨틀 물질<\/b>이 올라와 식으면서 <b>새로운 해양 지각<\/b>이 만들어진다. 바다 한가운데의 긴 산맥 {{㉠}}(대서양 중앙 해령)."}, {"n": "③", "t": "사건", "d": "해령 꼭대기의 골짜기(열곡), 양쪽으로 밀려나 <b>넓어지는 바다<\/b>, 마그마의 <b>화산 활동<\/b>, 비교적 얕은 <b>지진<\/b>. 대륙에서는 동아프리카 열곡대."}], "howto": [], "body": ["판들이 만나는 방식은 세 가지뿐이다 — <b>멀어지거나, 모이거나, 스치거나<\/b>. 첫 번째, 두 판이 서로 멀어지는 경계가 <b>발산형 경계<\/b>다. 판이 갈라진 틈으로 맨틀 물질이 올라와 식으면서 <b>새로운 해양 지각<\/b>이 만들어진다 — 판이 태어나는 산부인과인 셈이다.", "바다 한가운데의 발산형 경계에는 길게 솟은 바다 밑 산맥, <b>해령<\/b>이 발달한다(대서양 중앙 해령이 대표) — 지구에서 가장 긴 산맥은 육지가 아니라 바다 밑에 있다. 해령의 한가운데는 갈라진 골짜기({{㉡}})가 있고, 새로 만들어진 지각이 양쪽으로 밀려나며 <b>바다가 조금씩 넓어진다<\/b>. 대륙에서 갈라지면 동아프리카 열곡대처럼 긴 골짜기가 생긴다 — 먼 훗날 이곳이 새 바다가 된다.", "갈라지는 곳이니 사건도 잦다. 마그마가 오르내리는 <b>화산 활동<\/b>, 그리고 판이 벌어지며 생기는 <b>지진<\/b>(비교적 얕은 곳에서)이 발산형 경계의 일상이다. \"해령에서 판이 소멸한다\"(X) — 해령은 {{㉢}}, 소멸은 해구다. '령(嶺) = 산맥 = 태어남 / 구(溝) = 골짜기 = 사라짐'으로 글자에 묶어 두면 헷갈리지 않는다."], "terms": [{"k": "발산형 경계", "v": "두 판이 서로 멀어지는 경계. 맨틀 물질이 올라와 새 해양 지각이 생기며(판 생성), 화산 활동과 얕은 지진이 잦다."}, {"k": "해령 · 열곡", "v": "해령은 바다 밑의 긴 산맥(대서양 중앙 해령). 열곡은 갈라져 내려앉은 골짜기 — 해령 꼭대기와 동아프리카 열곡대."}, {"k": "넓어지는 대서양", "v": "대서양은 지금도 1년에 수 cm씩 넓어진다. 유럽과 아메리카는 매년 조금씩 멀어지는 중이다."}], "myths": [{"x": "해령은 두 판이 모여드는 곳에 만들어진다.", "o": "<b>멀어지는<\/b> 곳 — 발산형 경계다. 모이는 곳에는 해구."}, {"x": "해령에서 판이 소멸한다.", "o": "해령은 <b>생성<\/b>, 소멸은 <b>해구<\/b>다. 령 = 태어남, 구 = 사라짐."}], "point": "발산형(멀어짐): 해령·열곡대 — 판 생성, 화산·얕은 지진, 바다가 넓어진다. 해령은 태어나는 곳, 해구는 사라지는 곳.", "answers": "정답 ㉠ 해령 ㉡ 열곡 ㉢ 생성 — '해령 = 판 소멸', '해령 = 모이는 곳'이 단골 오답이다.", "blanks": {"㉠": "해령", "㉡": "열곡", "㉢": "생성"}, "warning": "'해령 = 판 소멸', '해령 = 모이는 곳'이 단골 오답이다.", "figure": {"caption": "발산형 경계의 단면 — 갈라진 틈으로 맨틀 물질이 올라와 새 판이 된다 (예: 대서양 중앙 해령)", "file": "figures/1302-02.svg"}}, {"id": "1302-03", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1302", "lessonName": "판구조론과 지권의 변화", "no": "03", "title": "수렴형과 보존형", "subtitle": "판이 사라지는 곳, 스치는 곳", "steps": [{"n": "①", "t": "섭입", "d": "해양판과 대륙판이 모이면 밀도가 큰 <b>해양판이 아래로 파고든다<\/b>. 깊은 골짜기 <b>해구<\/b>, 줄지어 선 화산, 깊은 곳까지 강한 지진 — 일본 열도."}, {"n": "②", "t": "충돌", "d": "가벼운 대륙판끼리는 어느 쪽도 못 파고든다. 땅이 구겨지며 솟아 <b>{{㉠}} 산맥<\/b> — 히말라야(인도판 + 유라시아판), 지금도 높아진다."}, {"n": "③", "t": "보존형", "d": "생성도 소멸도 없이 수평으로 어긋나며 스치는 경계. <b>변환 단층<\/b>(산안드레아스). 마그마가 없어 화산은 없고 <b>지진만<\/b>."}], "howto": [], "body": ["두 판이 서로 모여드는 경계가 <b>수렴형 경계<\/b>다. 해양판과 대륙판이 만나면, <b>밀도가 큰 해양판이 대륙판 아래로 파고든다(섭입)<\/b>. 그 경계선에는 깊은 골짜기 <b>해구<\/b>가 패이고, 파고든 판 때문에 마그마가 만들어져 <b>화산이 줄지어 서고<\/b>, 깊은 곳까지 <b>강한 지진<\/b>이 잦다 — 일본 열도가 바로 이런 자리다.", "가벼운 대륙판끼리 만나면 어느 쪽도 파고들지 못한다. 대신 땅이 구겨지며 밀려 올라가 <b>습곡 산맥<\/b>이 된다 — 세계의 지붕 히말라야는 인도판과 유라시아판의 충돌 현장이고, 지금도 조금씩 높아지고 있다. 대륙판끼리 충돌하면 해구가 아니라 {{㉡}}이 생긴다는 점이 함정 포인트다.", "마지막으로 두 판이 생성도 소멸도 없이 수평으로 어긋나며 스치는 경계가 <b>보존형 경계<\/b>다. 여기에는 <b>변환 단층<\/b>(미국 산안드레아스 단층)이 발달하는데, 마그마가 없어 {{㉢}}은 없지만 판이 어긋날 때마다 <b>지진<\/b>이 난다. 3종 세트로 정리한다 — 발산형(멀어짐): 해령·열곡대, 판 생성, 화산·지진 / 수렴형(모임): 섭입 → 해구·화산, 충돌 → 습곡 산맥, 판 소멸, 강한 지진 / 보존형(스침): 변환 단층, 생성·소멸 없음, 화산 없이 지진만."], "terms": [{"k": "섭입 · 해구", "v": "밀도가 큰 판이 다른 판 아래로 비스듬히 파고드는 것(해양판이 늘 지는 쪽). 그 자리에 패인 깊은 골짜기가 해구."}, {"k": "습곡 산맥", "v": "두 대륙판이 충돌해 지층이 구겨지며 솟은 산맥. 히말라야·알프스가 대표."}, {"k": "보존형 경계 · 변환 단층", "v": "판이 생성·소멸 없이 수평으로 스치는 경계. 산안드레아스 단층. 마그마가 없어 화산은 없고 지진만."}], "myths": [{"x": "대륙판끼리 충돌하면 깊은 해구가 만들어진다.", "o": "<b>습곡 산맥<\/b>이 솟는다. 해구는 해양판이 섭입하는 곳."}, {"x": "보존형 경계에서도 화산 활동이 활발하다.", "o": "마그마가 없어 <b>화산은 없고 지진만<\/b> 난다."}], "point": "수렴형(모임): 섭입 → 해구·화산·강한 지진(판 소멸), 대륙판끼리 → 습곡 산맥. 보존형(스침): 변환 단층, 화산 없이 지진만. 멀어지면 낳고, 모이면 삼키고, 스치면 흔든다.", "answers": "정답 ㉠ 습곡 ㉡ 습곡 산맥 ㉢ 화산 — '대륙판 충돌 = 해구', '보존형 = 화산 활발'이 단골 오답이다.", "blanks": {"㉠": "습곡", "㉡": "습곡 산맥", "㉢": "화산"}, "warning": "'대륙판 충돌 = 해구', '보존형 = 화산 활발'이 단골 오답이다.", "figure": {"caption": "수렴형과 보존형 경계 — 밀도가 큰 해양판이 가라앉아 해구·화산·강한 지진을 만들고, 스치는 곳(변환 단층)은 흔들리기만 한다", "file": "figures/1302-03.svg"}}, {"id": "1302-04", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1302", "lessonName": "판구조론과 지권의 변화", "no": "04", "title": "지진대와 화산대", "subtitle": "불의 고리", "steps": [{"n": "①", "t": "띠", "d": "지진·화산의 위치를 지도에 찍으면 흩어지지 않고 <b>좁고 긴 띠<\/b>를 이룬다 — 지진대·화산대. 판 경계선과 <b>거의 정확히 일치<\/b>한다."}, {"n": "②", "t": "불의 고리", "d": "태평양을 빙 둘러싼 <b>환태평양 지진대·화산대<\/b>. 전 세계 지진의 대부분이 이 고리 위에서. 여러 판의 경계에 걸터앉은 {{㉠}}이 지진·화산의 나라인 이유."}, {"n": "③", "t": "적다 ≠ 없다", "d": "판 경계에서 떨어진 우리나라는 상대적으로 적다. 그러나 판 내부에서도 지진은 난다(경주·포항). 확률의 차이이지 면제가 아니다 — <b>대비<\/b>가 필요하다."}], "howto": [], "body": ["세계에서 일어난 지진과 화산의 위치를 지도에 찍어 보면 놀라운 그림이 나온다. 아무렇게나 흩어져 있는 것이 아니라 <b>좁고 긴 띠<\/b>를 이룬다 — 이 띠가 <b>지진대<\/b>와 <b>화산대<\/b>다. 그리고 이 띠를 판의 경계선과 겹쳐 보면 <b>거의 정확히 일치한다<\/b>. 지진과 화산이 판이 부딪치고 갈라지고 스치는 곳의 사건이라는, 판구조론의 가장 강력한 증거다.", "가장 유명한 띠는 태평양을 빙 둘러싼 <b>환태평양 지진대·화산대<\/b> — 별명 '<b>불의 고리<\/b>'다. 전 세계 지진의 대부분이 이 고리 위에서 일어나며, 전 세계 활화산의 절반 이상이 여기에 있다. 여러 판의 경계에 걸터앉은 <b>일본<\/b>이 지진·화산의 나라인 이유이고, 판 경계에서 비교적 떨어진 <b>우리나라<\/b>가 상대적으로 지진이 {{㉡}} 이유다.", "단, '적다'는 '없다'가 아니다. 판 내부에서도 지진은 일어난다 — 경주와 포항의 지진이 그 증거다. 위치가 알려 주는 것은 <b>확률의 차이<\/b>이지 면제가 아니므로, 우리에게도 <b>{{㉢}} 설계<\/b>와 대피 훈련 같은 대비가 필요하다. \"우리나라는 판 내부에 있으므로 지진이 전혀 일어나지 않는다\"(X) — '절대·전혀·항상'이 들어간 선지는 우선 의심한다."], "terms": [{"k": "지진대 · 화산대", "v": "지진·화산이 잦은 곳을 이은 띠 모양의 지역. 판 경계와 거의 일치한다 — 판구조론의 강력한 증거."}, {"k": "불의 고리", "v": "환태평양 지진대·화산대. 태평양 가장자리를 화산들이 고리처럼 둘러싸 붙은 별명. 전 세계 지진 대부분, 활화산 절반 이상."}, {"k": "내진 설계", "v": "지진의 흔들림을 견디도록 건물을 짓는 것. 판 내부(우리나라)라도 필요한 대비다."}], "myths": [{"x": "우리나라는 판 내부에 있으므로 지진이 전혀 일어나지 않는다.", "o": "드물지만 일어난다(경주·포항). <b>'적다'와 '없다'는 다르다<\/b> — 대비가 필요하다."}, {"x": "지진과 화산은 지구 어디서나 고르게 일어난다.", "o": "<b>판 경계를 따라 띠<\/b>를 이룬다. 그것이 판구조론의 증거다."}], "point": "지진대·화산대는 판 경계와 일치한다(판구조론의 증거). 불의 고리 = 환태평양. 일본은 경계 위, 우리나라는 떨어져 있어 적지만 없지는 않다 — 내진 설계·대피 훈련.", "answers": "정답 ㉠ 일본 ㉡ 적은 ㉢ 내진 — '우리나라는 지진이 전혀 없다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "일본", "㉡": "적은", "㉢": "내진"}, "warning": "'우리나라는 지진이 전혀 없다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "환태평양 지진대·화산대(불의 고리) 개념도 — 붉은 점(지진·화산)이 판 경계를 따라 줄을 선다. 전 세계 활화산의 절반 이상이 이 고리에 있다", "file": "figures/1302-04.svg"}}, {"id": "1302-05", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1302", "lessonName": "판구조론과 지권의 변화", "no": "05", "title": "지권의 변동과 지구시스템", "subtitle": "흔드는 손, 빚어 온 손", "steps": [{"n": "①", "t": "화산이 번지는 길", "d": "화산재·기체 → <b>기권<\/b>(항공기 정지, 햇빛 가려 기온 하강). 용암·재 → <b>생물권<\/b>(마을·숲). 오랜 뒤 재 쌓인 땅 → <b>비옥한 토양<\/b>."}, {"n": "②", "t": "지진이 번지는 길", "d": "건물 붕괴(생물권). 바다 밑 지진 → <b>지진 해일(쓰나미)<\/b> → 수권을 거쳐 해안 — 지권→{{㉠}}→생물권. 재해의 연쇄 = 권역의 연쇄."}, {"n": "③", "t": "재앙만은 아니다", "d": "온천·지열 발전, 산맥과 섬 — 우리가 사는 땅 자체를 만들어 왔다. 인간의 일은 리듬을 읽고 <b>대비<\/b>하는 것."}], "howto": [], "body": ["화산과 지진은 지권의 사건이지만, 소단원 01에서 배웠듯 <b>한 권역의 변화는 연결망을 타고 번진다<\/b>. <b>화산 분출<\/b>을 보자. 하늘 높이 오른 화산재와 화산 기체는 기권으로 들어가 항공기를 세우고, 햇빛을 가려 지구의 기온을 일시적으로 낮추기도 한다. 용암과 화산재는 마을과 숲(생물권)을 덮치지만, 오랜 세월이 지나면 화산재 쌓인 땅은 <b>비옥한 토양<\/b>이 되어 농사를 살찌운다.", "<b>지진<\/b>은 땅을 흔들어 건물을 무너뜨리고(생물권 피해), 바다 밑에서 일어나면 <b>지진 해일(쓰나미)<\/b>을 일으켜 수권을 거쳐 해안을 덮친다. 재해의 연쇄가 곧 권역의 연쇄인 것이다. '영향 추론' 서술형은 공식이 있다 — ①어느 권역에서 ②무엇이 ③어느 권역으로 갔고 ④그 결과는. 네 칸만 채우면 만점 답안이다.", "그러나 판의 운동이 재앙이기만 한 것은 아니다. 화산은 온천과 {{㉡}} 발전을 주고, 판의 충돌은 산맥과 섬 — 우리가 사는 땅 자체를 만들어 왔다. 지권의 변동은 지구시스템을 흔드는 동시에, <b>지구의 얼굴을 빚어 온 손<\/b>이다. 인간이 할 일은 그 리듬을 읽고 {{㉢}}하는 것 — 내진 설계, 화산 감시, 대피 훈련이 그 답이다."], "terms": [{"k": "지진 해일(쓰나미)", "v": "해저 지진으로 바닷물 전체가 밀려 만들어지는 큰 파도. 지권 → 수권 → 생물권으로 번지는 재해다."}, {"k": "지열 발전", "v": "화산 지대의 땅속 열로 전기를 만드는 것 — 지권의 에너지를 이롭게 쓰는 사례. 온천도 같은 선물."}, {"k": "영향 추론 공식", "v": "① 어느 권역에서 ② 무엇이 ③ 어느 권역으로 갔고 ④ 그 결과는 — 네 칸을 채운다."}], "myths": [{"x": "화산 활동의 영향은 지권 내부에만 머문다.", "o": "화산재는 <b>기권<\/b>으로, 용암은 <b>생물권<\/b>으로, 해저 지진은 <b>수권<\/b>으로 번진다."}, {"x": "판의 운동은 인간에게 재앙만 준다.", "o": "온천·지열 발전, 비옥한 토양, 산맥과 섬 — <b>지구의 얼굴을 빚어 온 손<\/b>이기도 하다."}], "point": "지권의 변동은 연결망을 타고 번진다(화산재 → 기권, 쓰나미 → 수권 → 생물권). 재앙이자 선물(토양·온천·지열·산맥). 할 일은 읽고 대비하기.", "answers": "정답 ㉠ 수권 ㉡ 지열 ㉢ 대비 — '화산의 영향은 지권 안에만'으로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "수권", "㉡": "지열", "㉢": "대비"}, "warning": "'화산의 영향은 지권 안에만'으로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "지권의 변동이 번지는 길 — 화산재는 기권으로, 용암은 생물권으로, 해저 지진은 수권을 거쳐 해안으로. 재해의 연쇄가 곧 권역의 연쇄다", "file": "figures/1302-05.svg"}}, {"id": "1303-01", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1303", "lessonName": "중력과 운동", "no": "01", "title": "중력", "subtitle": "질량이 서로를 당긴다, 질량과 무게", "steps": [{"n": "①", "t": "중력", "d": "질량이 있는 물체들이 <b>서로 당기는 힘<\/b>. 지구가 사과를 당길 때 사과도 지구를 당긴다. 지구 위 어디서든 방향은 <b>지구 중심 쪽(연직 아래)<\/b>."}, {"n": "②", "t": "질량", "d": "물질의 양 그 자체. <b>어디서나 같다<\/b>(kg)."}, {"n": "③", "t": "무게", "d": "그 물체가 받는 <b>중력의 크기<\/b>(N). 장소에 따라 달라진다 — 달의 중력은 지구의 약 {{㉠}}, 그래서 달에서는 무게만 1/6, 질량은 그대로."}], "howto": [], "body": ["<b>중력<\/b>은 <b>질량이 있는 물체들이 서로 당기는 힘<\/b>이다. 지구가 사과를 당길 때 사과도 지구를 당긴다 — 다만 지구의 질량이 압도적이라, 우리 눈에는 사과만 떨어지는 것으로 보일 뿐이다. 지구 위 어디에 있든 중력의 방향은 <b>지구 중심 쪽(연직 아래)<\/b>이다. 지구 반대편 사람이 '거꾸로' 서고도 떨어지지 않는 이유다. 연직 방향은 실에 추를 매달았을 때 실이 가리키는 방향이다.", "여기서 평생 쓸 구분 하나를 확실히 하자. <b>질량<\/b>은 물질의 양 그 자체로 <b>어디서나 같고<\/b>, <b>무게<\/b>는 그 물체가 받는 <b>{{㉡}}의 크기<\/b>라서 장소에 따라 달라진다. 무게는 힘이므로 N(뉴턴)으로 재며, 질량 1 kg인 물체의 지구 무게는 약 9.8 N이다.", "달의 중력은 지구의 약 1/6 — 그래서 달에서는 <b>무게만 1/6<\/b>이 되고 질량은 그대로다. 몸이 가벼워진 것이 아니라, 달이 덜 당길 뿐이다. 다이어트 하러 달에 갈 필요는 없다 — 저울 숫자(무게)만 줄지, 몸({{㉢}})은 그대로다. 중학교에서 중력·마찰력·탄성력을 배웠는데, 이 소단원은 그중 중력 하나가 만들어 내는 '운동들'을 모아 본다."], "terms": [{"k": "중력 · 연직 방향", "v": "질량이 있는 물체들이 서로 당기는 힘. 방향은 지구 중심 쪽 — 실에 추를 매달았을 때 실이 가리키는 연직 방향."}, {"k": "질량 vs 무게", "v": "질량 = 물질의 양, 어디서나 같다(kg). 무게 = 받는 중력의 크기, 장소 따라 다르다(N). 1 kg의 지구 무게 ≈ 9.8 N."}, {"k": "달에서", "v": "중력이 지구의 약 1/6 → 무게만 1/6, 질량은 그대로."}], "myths": [{"x": "달에 가면 질량이 1/6로 줄어든다.", "o": "줄어드는 것은 <b>무게<\/b>뿐. 질량은 어디서나 같다."}, {"x": "지구는 사과를 당기지만 사과는 지구를 당기지 않는다.", "o": "<b>서로<\/b> 당긴다. 지구 질량이 압도적이라 사과만 움직여 보일 뿐이다."}], "point": "중력 = 질량 있는 것끼리 서로 당기는 힘, 방향은 지구 중심. 질량은 그대로(kg), 무게는 장소 따라(N) — 달에선 무게만 1/6.", "answers": "정답 ㉠ 1/6 ㉡ 중력 ㉢ 질량 — '달에서 질량이 줄어든다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "1/6", "㉡": "중력", "㉢": "질량"}, "warning": "'달에서 질량이 줄어든다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "중력의 방향과 질량·무게 — 무게는 '얼마나 당겨지는가'의 값이다. 달에서는 무게만 1/6이 되고 질량은 그대로다", "file": "figures/1303-01.svg"}}, {"id": "1303-02", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1303", "lessonName": "중력과 운동", "no": "02", "title": "자유 낙하", "subtitle": "1초마다 9.8 m/s씩", "steps": [{"n": "①", "t": "자유 낙하", "d": "중력만 받으며 떨어지는 운동. 중력이 쉬지 않고 당기므로 <b>점점 빨라진다<\/b> — 아주 규칙적으로."}, {"n": "②", "t": "9.8", "d": "속력이 1초에 약 <b>9.8 m/s씩<\/b> 늘어난다. 1초 뒤 9.8, 2초 뒤 {{㉠}}, 3초 뒤 29.4 m/s — <b>일정하게 빨라지는<\/b> 운동."}, {"n": "③", "t": "질량과 무관", "d": "공기 저항이 없다면 모든 물체는 <b>똑같이<\/b> 떨어진다. 깃털이 늦는 것은 무거워서가 아니라 <b>공기 저항<\/b> 때문."}], "howto": [], "body": ["중력만 받으며 떨어지는 운동을 <b>자유 낙하<\/b>라고 한다. 떨어지는 동안 중력이 쉬지 않고 계속 잡아당기므로, 물체는 점점 빨라진다 — 그것도 아주 규칙적으로. 지구에서 자유 낙하 하는 물체의 속력은 <b>1초에 약 9.8 m/s씩<\/b> 늘어난다. 출발 1초 뒤 9.8 m/s, 2초 뒤 19.6 m/s, 3초 뒤 29.4 m/s — <b>일정하게 빨라지는 운동<\/b>이다. 이 1초마다 늘어나는 속력, 약 9.8 m/s가 <b>중력 가속도<\/b>다.", "그렇다면 무거운 것이 더 빨리 떨어질까? 갈릴레이의 답은 '아니오'였다. <b>공기 저항이 없다면 모든 물체는 질량과 관계없이 똑같이 떨어진다.<\/b> 진공 통에서 깃털과 쇠구슬을 동시에 놓으면 나란히, 동시에 바닥에 닿는다. 일상에서 깃털이 늦는 것은 무거워서가 아니라 {{㉡}}이 가벼운 깃털의 발목을 잡기 때문이다. 갈릴레이는 무거운 것이 먼저 떨어진다는 2천 년의 상식을 사고 실험과 빗면 실험으로 뒤집었고, 아폴로 15호 우주비행사는 진공인 달에서 깃털과 망치를 동시에 떨어뜨려 이를 눈으로 보여 주었다.", "두 함정만 지킨다 — ① \"일정한 <b>속력<\/b>으로 떨어진다\"(X, 일정하게 <b>빨라진다<\/b>) ② \"무거울수록 빨리 떨어진다\"(X, 공기 저항이 없으면 {{㉢}}). 속력 계산은 '9.8 × 시간'이면 끝이다."], "terms": [{"k": "자유 낙하", "v": "중력만 받으며 떨어지는 운동. 속력이 매초 약 9.8 m/s씩 일정하게 늘어난다(속력 = 9.8 × 시간)."}, {"k": "중력 가속도", "v": "자유 낙하에서 1초마다 늘어나는 속력, 약 9.8 m/s. 지구가 물체를 빨라지게 하는 '비율'이다."}, {"k": "갈릴레이의 실험", "v": "무거운 것이 먼저 떨어진다는 2천 년의 상식을 뒤집었다. 공기 저항이 없으면 질량과 무관하게 동시에 닿는다."}], "myths": [{"x": "자유 낙하 하는 물체는 일정한 속력으로 떨어진다.", "o": "일정하게 <b>빨라진다<\/b> — 매초 9.8 m/s씩."}, {"x": "공기 저항이 없어도 무거운 물체가 더 빨리 떨어진다.", "o": "질량과 무관하게 <b>동시에<\/b> 떨어진다. 깃털이 늦는 것은 공기 저항 때문."}], "point": "자유 낙하: 매초 약 9.8 m/s씩 일정하게 빨라진다(속력 = 9.8 × 시간). 공기 저항이 없으면 질량과 무관하게 동시에 떨어진다.", "answers": "정답 ㉠ 19.6 ㉡ 공기 저항 ㉢ 동시 — '일정한 속력', '무거울수록 빨리'가 단골 오답이다.", "blanks": {"㉠": "19.6", "㉡": "공기 저항", "㉢": "동시"}, "warning": "'일정한 속력', '무거울수록 빨리'가 단골 오답이다.", "figure": {"caption": "자유 낙하 — 매초 9.8 m/s씩 빨라지고, 공기 저항이 없으면 질량과 무관하게 함께 떨어진다", "file": "figures/1303-02.svg"}}, {"id": "1303-03", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1303", "lessonName": "중력과 운동", "no": "03", "title": "수평으로 던진 공", "subtitle": "포물선의 비밀, 두 운동의 독립", "steps": [{"n": "①", "t": "두 방향으로 나눈다", "d": "<b>수평<\/b>: 힘이 없으므로 던진 속력 그대로 <b>등속 운동<\/b>. <b>연직<\/b>: 중력을 받아 <b>자유 낙하<\/b>. 둘이 합쳐진 자취가 <b>포물선<\/b>."}, {"n": "②", "t": "독립", "d": "두 운동은 서로 간섭하지 않는다. 같은 높이에서 하나는 놓고 하나는 수평으로 던지면 — 아무리 세게 던져도 — <b>{{㉠}}에 바닥에 닿는다<\/b>."}, {"n": "③", "t": "담당", "d": "낙하 <b>시간<\/b>은 오직 <b>높이<\/b>가 정하고, 수평 <b>속력<\/b>은 '얼마나 <b>멀리<\/b>'만 정한다."}], "howto": [], "body": ["이번에는 공을 수평으로 던져 보자. 공은 곧게 가지도, 곧장 떨어지지도 않고 <b>포물선<\/b>을 그린다. 비밀은 <b>운동을 두 방향으로 나누어 보는 것<\/b>이다. <b>수평 방향<\/b>으로는 힘이 없으므로 던진 속력 그대로 <b>등속 운동<\/b>을 하고, <b>연직 방향<\/b>으로는 중력을 받아 <b>자유 낙하<\/b>를 한다. 두 운동이 동시에 합쳐진 자취가 포물선이다 — 분수의 물줄기, 던진 농구공의 길이다.", "여기서 놀라운 결론이 나온다. <b>두 방향의 운동은 서로 간섭하지 않는다(독립)<\/b>. 그래서 같은 높이에서 공 하나는 가만히 놓고 하나는 수평으로 던지면 — 아무리 세게 던져도 — 두 공은 <b>동시에 바닥에 닿는다<\/b>. 낙하 시간은 오직 {{㉡}}가 정하고, 수평 속력은 '얼마나 멀리'만 정한다.", "'세게 던지면 오래 떠 있겠지'가 최대 오개념이다. 시간은 높이 담당, 거리만 속력 담당 — 담당을 갈라 두면 틀리지 않는다. 멀티 플래시 사진 자료는 ① 가로(같은 시각의 높이 비교 → 연직은 A와 같은 자유 낙하) → ② 세로(B의 수평 간격 일정 → 등속) → ③ 간격 변화(연직 간격이 벌어짐 → 점점 빨라짐) 순서로 읽는다. \"B가 늦게 떨어진다\", \"B는 연직 힘을 안 받는다\"가 단골 함정이다. 책상 모서리에서 동전 두 개를 하나는 떨어뜨리고 하나는 수평으로 튕기면, 바닥 소리가 \"딱\" 한 번 — {{㉢}} 착지다."], "terms": [{"k": "운동의 독립성", "v": "수평 운동과 연직 운동은 서로 영향을 주지 않는다. 각각 따로 분석한 뒤 합치면 된다."}, {"k": "포물선", "v": "수평 등속과 연직 낙하가 합쳐질 때 그려지는 곡선. 분수의 물줄기, 던진 농구공의 길이다."}, {"k": "담당 구분", "v": "낙하 시간 = 높이가 정한다. 수평 도달 거리 = 수평 속력이 정한다. 세게 던져도 시간은 같다."}], "myths": [{"x": "수평으로 더 세게 던질수록 낙하 시간이 길어진다.", "o": "시간은 <b>같고 거리만<\/b> 멀어진다. 시간은 높이가 정한다."}, {"x": "수평으로 던진 공은 연직 방향으로 힘을 받지 않는다.", "o": "연직으로는 <b>중력을 받아 자유 낙하<\/b>한다. 힘이 없는 쪽은 수평이다."}], "point": "수평 = 등속(힘 없음), 연직 = 자유 낙하(중력). 두 운동은 독립 — 가만히 놓은 공과 수평으로 던진 공은 동시에 닿는다. 시간은 높이가 정한다.", "answers": "정답 ㉠ 동시 ㉡ 높이 ㉢ 동시 — '세게 던지면 낙하 시간이 길다', 'B는 연직 힘을 안 받는다'가 단골 오답이다.", "blanks": {"㉠": "동시", "㉡": "높이", "㉢": "동시"}, "warning": "'세게 던지면 낙하 시간이 길다', 'B는 연직 힘을 안 받는다'가 단골 오답이다.", "figure": {"caption": "수평으로 던진 공의 운동 — 수평 등속 + 연직 자유 낙하, 두 운동은 서로 독립이다. 가만히 놓은 공과 동시에 닿는다", "file": "figures/1303-03.svg"}}, {"id": "1303-04", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1303", "lessonName": "중력과 운동", "no": "04", "title": "인공위성과 달", "subtitle": "계속 떨어지는데 닿지 않는다", "steps": [{"n": "①", "t": "뉴턴의 대포", "d": "높은 산꼭대기에서 세게 쏠수록 포탄은 더 멀리 가서 떨어진다. 속력을 계속 키우면 어느 순간 <b>떨어지는 정도 = 둥근 지구가 휘어져 멀어지는 정도<\/b>."}, {"n": "②", "t": "궤도", "d": "그 순간부터 포탄은 계속 떨어지면서도 영원히 지면에 닿지 않는다 — 지구를 <b>돈다<\/b>. 이것이 <b>인공위성<\/b>의 원리."}, {"n": "③", "t": "달도 위성", "d": "위성은 무중력이라 떠 있는 게 아니라 <b>{{㉠}}을 받아 끊임없이 낙하하는 중<\/b>. 달도 매 순간 지구로 떨어지고 있다 — 사과와 달은 같은 법칙."}], "howto": [], "body": ["수평으로 던지는 속력을 점점 키우면 어떻게 될까? 뉴턴은 상상했다 — 아주 높은 산꼭대기에서 대포를 쏘면, 세게 쏠수록 포탄은 더 멀리 가서 떨어진다. 그런데 속력을 계속 키우다 보면 어느 순간, 포탄이 떨어지는 정도와 둥근 지구 표면이 휘어져 멀어지는 정도가 똑같아진다. 그 순간부터 포탄은 <b>계속 떨어지면서도 영원히 지면에 닿지 않는다<\/b> — 지구를 도는 것이다. '프린키피아'에 실린 이 사고 실험은 지상의 낙하와 천체의 공전이 같은 중력임을 보였다.", "이것이 바로 <b>인공위성<\/b>의 원리다. 위성은 무중력이라 떠 있는 것이 아니다 — <b>중력을 받아 끊임없이 낙하하는 중<\/b>이고, 다만 {{㉡}} 속력이 충분히 커서 지면을 계속 '비껴가는' 것뿐이다. 인공위성은 통신·GPS·기상 관측·지구 관측에 쓰여, 소단원 I-04(정보)와 III-01(기상)의 눈이 되어 준다.", "그리고 인류가 쏘아 올리기 45억 년 전부터, 자연은 이미 위성 하나를 돌리고 있었다. <b>달<\/b>이다. 달도 지구를 향해 매 순간 떨어지고 있다 — 사과와 달은 같은 법칙을 따른다. 이것을 꿰뚫어 본 것이 뉴턴의 위대함이었다. \"궤도를 도는 위성에는 중력이 작용하지 않는다\"(X) — 최다 빈출 오개념이다. 중력이 없으면 위성은 {{㉢}}으로 날아간다. 도는 것 자체가 중력이 일하고 있다는 증거다."], "terms": [{"k": "뉴턴의 사고 실험", "v": "'프린키피아'에 실린 대포 상상 실험. 지상의 낙하와 천체의 공전이 같은 중력임을 보였다."}, {"k": "인공위성의 원리", "v": "중력을 받아 끊임없이 낙하하되, 수평 속력이 충분히 커서 지면을 계속 비껴간다. 무중력이 아니다."}, {"k": "인공위성의 쓰임", "v": "통신·GPS·기상 관측·지구 관측 — 소단원 I-04(정보)와 III-01(기상)의 눈이 되어 준다."}], "myths": [{"x": "궤도를 도는 인공위성에는 중력이 작용하지 않는다.", "o": "중력을 받아 <b>계속 떨어지는 중<\/b>이다. 중력이 없으면 직선으로 날아간다."}, {"x": "달은 지구의 중력과 무관하게 떠 있다.", "o": "달도 <b>매 순간 지구로 낙하<\/b>하고 있다 — 사과와 같은 법칙."}], "point": "위성 = 계속 떨어지는 중, 떨어지는 만큼 지면이 비껴갈 뿐. 수평 속력이 충분히 크면 낙하가 궤도가 된다. 달도 사과도 같은 중력.", "answers": "정답 ㉠ 중력 ㉡ 수평 ㉢ 직선 — '위성에는 중력이 작용하지 않는다'가 단골 오답이다.", "blanks": {"㉠": "중력", "㉡": "수평", "㉢": "직선"}, "warning": "'위성에는 중력이 작용하지 않는다'가 단골 오답이다.", "figure": {"caption": "뉴턴의 사고 실험 — 수평 속력이 충분히 크면 낙하가 궤도가 된다. 위성도 달도 계속 떨어지는 중이다", "file": "figures/1303-04.svg"}}, {"id": "1303-05", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1303", "lessonName": "중력과 운동", "no": "05", "title": "중력이 빚는 세계", "subtitle": "날씨에서 생명, 별의 탄생까지", "steps": [{"n": "①", "t": "지구시스템", "d": "차가워져 무거워진 공기·물을 아래로 끌어내리는 것이 중력 — <b>대류<\/b>, 비, 바람. 강물이 바다로, 눈사태·산사태도 중력이 만드는 흐름."}, {"n": "②", "t": "생명", "d": "식물의 뿌리는 중력 방향으로 자라고({{㉠}}), 뼈와 근육은 중력을 버티도록 발달했다. 무중력에 오래 있으면 약해져 재활이 필요."}, {"n": "③", "t": "우주", "d": "성운을 수축시켜 <b>별<\/b>을 만든 것도, 티끌을 뭉쳐 <b>지구<\/b>를 만든 것도 중력. 사과를 떨어뜨리는 힘과 별을 빚는 힘이 <b>같은 힘<\/b>."}], "howto": [], "body": ["중력은 떨어뜨리는 힘만이 아니다 — 지구시스템 곳곳에서 조용히 일하고 있다. 소단원 III-01의 <b>대류<\/b>를 떠올려 보자. 차가워져 무거워진 공기·물을 아래로 끌어내리는 것이 중력이다. 중력이 없다면 대류도, 비도, 바람도 없다. 강물이 바다로 흐르는 것도, 눈사태와 산사태도 <b>중력이 만드는 흐름<\/b>이다.", "생명도 중력에 맞춰 설계되었다. 식물의 뿌리는 중력 방향으로 자라고(굴지성 — 줄기는 반대쪽), 우리의 <b>뼈와 근육<\/b>은 중력을 버티도록 발달했다 — 그래서 무중력의 우주에 오래 머문 우주비행사는 뼈와 근육이 약해져 돌아온 뒤 {{㉡}}이 필요하다. 우주 정거장에서 매일 운동을 하는 이유다.", "그리고 스케일을 우주로 키우면, 중력은 <b>창조자<\/b>가 된다. 소단원 II-02에서 본 것처럼 <b>성운을 수축시켜 별을 만든 것<\/b>도, <b>티끌을 뭉쳐 지구를 만든 것<\/b>도 중력이다. 성운은 남의 힘이 아니라 {{㉢}}의 중력으로 수축한다. 사과를 떨어뜨리는 힘과 별을 빚는 힘이 같은 힘이라는 것 — 이것이 이 소단원이 남기는 가장 큰 그림이다."], "terms": [{"k": "굴지성", "v": "식물이 중력 방향에 반응해 자라는 성질. 뿌리는 중력 쪽, 줄기는 반대쪽."}, {"k": "우주비행사의 재활", "v": "무중력에선 뼈·근육이 빠르게 약해진다. 우주 정거장에서 매일 운동을 하는 이유다."}, {"k": "중력의 작품", "v": "대류·유수·산사태(지구시스템), 굴지성·뼈(생명), 별과 지구의 탄생(우주) — 전부 같은 힘."}], "myths": [{"x": "성운이 수축하여 별이 되는 것은 중력과 무관하다.", "o": "성운 <b>자신의 중력<\/b>으로 수축한다. 별과 지구를 만든 힘이 중력이다."}, {"x": "대류는 온도 차만 있으면 되고 중력과는 관계없다.", "o": "무거워진 것을 아래로 끌어내리는 <b>중력이 있어야<\/b> 대류가 일어난다."}], "point": "중력의 작품: 대류·강물·산사태(흐름) · 굴지성·뼈와 근육(생명) · 별과 지구의 탄생(우주). 사과를 떨어뜨리는 힘과 별을 빚는 힘은 같은 힘이다.", "answers": "정답 ㉠ 굴지성 ㉡ 재활 ㉢ 자신 — '별의 탄생은 중력과 무관', '대류는 중력과 무관'이 단골 오답이다.", "blanks": {"㉠": "굴지성", "㉡": "재활", "㉢": "자신"}, "warning": "'별의 탄생은 중력과 무관', '대류는 중력과 무관'이 단골 오답이다.", "figure": {"caption": "중력이 만드는 현상들 — 날씨(대류·비)에서 생명(굴지성·뼈), 별의 탄생까지. 같은 힘이다", "file": "figures/1303-05.svg"}}, {"id": "1304-01", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1304", "lessonName": "운동량과 충격량", "no": "01", "title": "관성", "subtitle": "힘이 없으면 하던 대로", "steps": [{"n": "①", "t": "힘이 없으면", "d": "아무것도 바뀌지 않는다. 정지한 물체는 <b>계속 정지<\/b>, 움직이던 물체는 <b>같은 속도로 계속<\/b> 움직인다(가속되지 않는다)."}, {"n": "②", "t": "관성", "d": "물체가 운동 상태를 <b>유지하려는 성질<\/b>. {{㉠}}이 클수록 관성도 크다 — 볼링공이 탁구공보다 멈추기 힘든 이유."}, {"n": "③", "t": "급정거·급출발", "d": "급정거하면 몸은 <b>앞으로<\/b>, 급출발하면 <b>뒤로<\/b> 쏠린다. 몸이 힘을 받아서가 아니라 <b>하던 운동을 계속하려<\/b> 하기 때문."}], "howto": [], "body": ["앞 소단원에서 힘(중력)이 운동을 어떻게 <b>바꾸는지<\/b> 보았다. 이번에는 거꾸로 묻는다 — 힘이 없으면? 답은 '아무것도 바뀌지 않는다'이다. 상호작용이 없으면 정지한 물체는 계속 정지해 있고, 움직이던 물체는 같은 속도로 계속 움직인다(가속되지 않는다). 물체가 이렇게 <b>운동 상태를 유지하려는 성질<\/b>이 <b>관성<\/b>이며, 질량이 클수록 관성도 크다. 뉴턴은 이것을 운동 제1법칙으로 정리했다 — \"모든 물체는 외력이 없는 한 정지 또는 등속 직선 운동 상태를 유지한다.\"", "일상은 관성의 사례로 가득하다. 버스가 <b>급정거<\/b>하면 몸은 앞으로 쏠린다 — 몸이 힘을 받아서가 아니라, 버스는 멈췄는데 몸은 <b>하던 운동을 계속하려<\/b> 하기 때문이다. <b>급출발<\/b>하면 반대로 {{㉡}}로 쏠린다. 몸은 '하던 대로' 정지해 있으려 하는데 버스만 먼저 앞으로 나가는 것이다. 쏠림 방향이 헷갈리면 '버스가 한 일의 반대'가 아니라 '내 몸이 하던 일 그대로'를 보면 된다.", "이불을 두드려 먼지를 터는 것, 망치 자루를 바닥에 내리쳐 머리를 단단히 박는 것도 관성이다. 이불은 멈추는데 먼지는 계속 움직이고, 자루는 멈추는데 망치 머리는 계속 내려간다. 관성은 {{㉢}}이 클수록 크다 — 그래서 자동차의 안전띠는 급정거 때 '하던 대로' 앞으로 가려는 몸을 붙잡아 주는 <b>관성 대비책<\/b>이다. 중학교에서 \"힘은 물체의 모양이나 운동 상태를 바꾼다\"고 배웠는데, 이것을 뒤집으면 \"힘이 없으면 운동 상태는 그대로\"라는 이 개념이 된다."], "terms": [{"k": "관성", "v": "힘(상호작용)이 없을 때 물체가 운동 상태를 유지하려는 성질. 정지는 정지대로, 운동은 같은 속도대로."}, {"k": "관성과 질량", "v": "질량이 클수록 운동 상태를 바꾸기 어렵다 — 볼링공이 탁구공보다 멈추기 힘든 이유."}, {"k": "안전띠", "v": "급정거 때 앞으로 계속 가려는 몸을 붙잡는 장치. 관성에 대비한 설계다."}], "myths": [{"x": "힘을 받지 않는 물체는 결국 저절로 멈춘다.", "o": "힘이 없으면 <b>같은 속도로 계속<\/b> 움직인다. 멈추는 것은 마찰 같은 힘이 있어서다."}, {"x": "급정거 때 몸이 앞으로 쏠리는 것은 몸이 앞으로 힘을 받기 때문이다.", "o": "힘을 받아서가 아니라 <b>하던 운동을 계속하려<\/b> 하기 때문이다."}], "point": "힘 없음 = 변화 없음. 관성은 질량이 클수록 크다. 급정거 → 앞으로, 급출발 → 뒤로 — 몸이 하던 운동 그대로.", "answers": "정답 ㉠ 질량 ㉡ 뒤 ㉢ 질량 — '질량이 클수록 관성이 작다', '급출발하면 앞으로 쏠린다'가 단골 오답이다.", "blanks": {"㉠": "질량", "㉡": "뒤", "㉢": "질량"}, "warning": "'질량이 클수록 관성이 작다', '급출발하면 앞으로 쏠린다'가 단골 오답이다.", "figure": {"caption": "급정거와 급출발 — 쏠림의 방향은 버스가 아니라 '몸이 하던 운동'이 결정한다", "file": "figures/1304-01.svg"}}, {"id": "1304-02", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1304", "lessonName": "운동량과 충격량", "no": "02", "title": "운동량", "subtitle": "운동의 양을 재는 법, 질량 × 속도", "steps": [{"n": "①", "t": "운동의 양", "d": "느린 트럭과 빠른 자전거 — 빠르기만으로도, 무게만으로도 답할 수 없다. 그래서 '운동의 양'을 재는 자를 만든다."}, {"n": "②", "t": "운동량", "d": "<b>운동량 = 질량 × {{㉠}}<\/b>. 단위는 kg·m/s. 무겁거나 빠르면 크다 — 비교는 반드시 <b>곱셈<\/b>으로."}, {"n": "③", "t": "방향이 있다", "d": "속도처럼 <b>방향<\/b>을 가진다. 반대로 달리는 두 공의 운동량은 부호가 다르다. 운동량이 클수록 멈추기 위한 '노력'이 크다."}], "howto": [], "body": ["천천히 구르는 트럭과 쌩쌩 달리는 자전거 — 어느 쪽을 멈추기가 더 어려울까? 빠르기만으로도, 무게만으로도 답할 수 없다. 그래서 물리학은 '운동의 양'을 재는 자를 만들었다. <b>운동량 = 질량 × 속도<\/b>. 단위는 kg·m/s이고, 속도처럼 <b>방향을 가진다<\/b>. 같은 속도라면 질량이 큰 트럭의 운동량이 크고, 같은 질량이라면 빠른 쪽이 크다.", "계산은 곱셈 한 번이면 끝이다. 질량 2 kg인 공이 3 m/s로 구르면 운동량은 2 × 3 = {{㉡}} kg·m/s이다. 단위가 kg·m/s인 이유도 같다 — 질량(kg)과 속도(m/s)를 곱했으니 단위도 곱이 된다. 그리고 운동량은 속도의 {{㉢}}을 그대로 물려받는다. 오른쪽으로 구르는 공과 왼쪽으로 구르는 공은 크기가 같아도 운동량의 부호가 다르다.", "운동량 비교 문제에서는 반드시 곱셈으로 검산한다. 질량만 보게 하거나 속력만 보게 하는 선지가 단골이다. 예를 들어 A(2 kg, 4 m/s)는 8, B(4 kg, 1 m/s)는 4, C(1 kg, 6 m/s)는 6 kg·m/s — 가장 무거운 B가 가장 작고, 가장 빠른 C가 1등도 아니다. <b>운동량이 큰 물체일수록 멈추거나 방향을 바꾸기 위해 더 큰 '노력'이 필요하다.<\/b> 그 노력의 정체가 다음 개념, 충격량이다."], "terms": [{"k": "운동량", "v": "운동의 양. 운동량 = 질량 × 속도. 무겁거나 빠르면 크다."}, {"k": "운동량의 단위", "v": "kg·m/s — 질량(kg)과 속도(m/s)를 곱했으니 단위도 곱이다."}, {"k": "방향이 있는 양", "v": "속도의 방향을 그대로 물려받는다. 반대로 달리는 두 공의 운동량은 부호가 다르다."}], "myths": [{"x": "속력이 같다면 질량과 관계없이 운동량은 같다.", "o": "같은 속력이면 <b>질량이 클수록<\/b> 운동량이 크다. 반드시 곱으로 비교한다."}, {"x": "운동량은 크기만 있는 양이다.", "o": "속도처럼 <b>방향<\/b>이 있다. 방향이 반대면 부호가 다르다."}], "point": "운동량 = m × v (kg·m/s, 방향 있음). 무겁거나 빠르면 크다 — 비교는 반드시 곱셈으로 검산한다.", "answers": "정답 ㉠ 속도 ㉡ 6 ㉢ 방향 — 질량만 또는 속력만 보고 비교하게 만드는 선지가 단골 오답이다.", "blanks": {"㉠": "속도", "㉡": "6", "㉢": "방향"}, "warning": "질량만 또는 속력만 보고 비교하게 만드는 선지가 단골 오답이다.", "figure": {"caption": "운동량 비교 — 질량과 속도, 반드시 둘의 곱으로 판단한다. 단위는 kg·m/s, 방향은 속도와 같다", "file": "figures/1304-02.svg"}}, {"id": "1304-03", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1304", "lessonName": "운동량과 충격량", "no": "03", "title": "충격량", "subtitle": "힘 × 시간 = 운동량의 변화량", "steps": [{"n": "①", "t": "충격량", "d": "운동량을 바꾸려면 힘이 필요하다. 얼마나 바뀌는지는 힘의 크기와 <b>얼마나 오래 작용했는가<\/b>가 함께 정한다. <b>충격량 = 힘 × {{㉠}}<\/b>."}, {"n": "②", "t": "핵심 등식", "d": "<b>충격량 = 운동량의 변화량<\/b>. 이 소단원의 심장이다."}, {"n": "③", "t": "힘-시간 그래프", "d": "그래프 아래의 <b>넓이<\/b>가 충격량. 같은 넓이를 '높고 좁게' 받으면 힘이 크고(아프다), '낮고 넓게' 받으면 힘이 작다(덜 아프다)."}], "howto": ["<b>넓이부터<\/b>. 같은 높이에서 같은 속도로 닿아 정지하므로 운동량 변화량이 같다 → 충격량(그래프 아래 넓이)도 같다. \"넓이가 같다\"는 조건이 문제의 절반을 미리 풀어 준다.", "<b>가로 폭(시간)<\/b>. (나)의 봉우리는 옆으로 넓다 = 방석이 눌리며 충돌 시간을 벌었다.", "<b>봉우리 높이(최대 힘)<\/b>. 같은 넓이가 긴 시간에 퍼지면 봉우리가 낮아진다. 컵이 깨지고 안 깨지고는 충격량이 아니라 <b>최대 힘<\/b>이 갈랐다."], "body": ["운동량을 바꾸려면 힘이 필요하다. 그런데 얼마나 바뀌는지는 힘의 크기만으로 정해지지 않는다 — <b>얼마나 오래 작용했는가<\/b>도 똑같이 중요하다. 그래서 <b>충격량 = 힘 × 시간<\/b>으로 정의한다. 그리고 이 소단원의 심장인 등식이 나온다. <b>충격량 = {{㉡}}<\/b>. 충돌하는 동안 힘은 계속 변하므로, 문제에서는 보통 평균 힘으로 따진다.", "이 등식을 그림으로 보는 방법이 <b>힘-시간 그래프<\/b>다. 그래프 아래의 {{㉢}}가 곧 충격량이고, 봉우리가 최대 힘이다. 같은 공이 같은 속도에서 멈춘다면 운동량 변화량 — 즉 넓이 — 는 정해져 있다. 그렇다면 남는 선택지는 하나뿐이다. 그 넓이를 '높고 좁게' 받을 것인가, '낮고 넓게' 받을 것인가. 짧은 시간에 받으면 힘이 크고(아프다), 긴 시간에 나눠 받으면 힘이 작다(덜 아프다). 이 선택이 다음 두 개념 — 안전장치와 스포츠 — 의 갈림길이다."], "terms": [{"k": "충격량", "v": "힘 × 시간. 물체가 받은 충격량은 그 물체의 운동량 변화량과 같다."}, {"k": "힘-시간 그래프", "v": "충돌하는 동안 힘이 어떻게 변했는지 보여 준다. 넓이가 충격량, 봉우리가 최대 힘."}, {"k": "평균 힘", "v": "충돌 동안 힘은 계속 변하므로, 문제에서는 보통 평균 힘으로 따진다."}], "myths": [{"x": "충격량이 같을 때 충돌 시간이 길수록 받는 힘이 커진다.", "o": "넓이가 같으면 시간이 길수록 힘은 <b>작아진다<\/b>. 시간과 힘은 반비례."}, {"x": "그래프의 봉우리가 낮으면 충격량도 작다.", "o": "충격량은 <b>넓이<\/b>다. 봉우리가 낮아도 폭이 넓으면 넓이는 같을 수 있다."}], "point": "충격량 = F × t = 운동량의 변화량. F-t 그래프의 넓이가 충격량, 봉우리가 최대 힘 — 넓이가 같으면 t↑ ⇒ F↓.", "answers": "정답 ㉠ 시간 ㉡ 운동량의 변화량 ㉢ 넓이 — 넓이(충격량)와 봉우리(최대 힘)를 바꿔치기한 선지가 단골 오답이다.", "blanks": {"㉠": "시간", "㉡": "운동량의 변화량", "㉢": "넓이"}, "warning": "넓이(충격량)와 봉우리(최대 힘)를 바꿔치기한 선지가 단골 오답이다.", "figure": {"caption": "힘-시간 그래프 — 같은 충격량이라도 '높고 좁게' 또는 '낮고 넓게' 받을 수 있다. 컵을 깨는 것은 넓이가 아니라 봉우리다", "file": "figures/1304-03.svg"}}, {"id": "1304-04", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1304", "lessonName": "운동량과 충격량", "no": "04", "title": "시간을 늘려 힘을 줄이다", "subtitle": "안전장치의 원리", "steps": [{"n": "①", "t": "정해진 것", "d": "충돌에서 멈춰야 할 <b>운동량 변화량<\/b>은 이미 정해져 있다 — 달리던 속도에서 0까지. 안전장치도 이것은 못 줄인다."}, {"n": "②", "t": "할 수 있는 일", "d": "그 변화를 <b>최대한 천천히<\/b> 일어나게 하는 것. 충돌 {{㉠}}이 길어지면 같은 충격량이라도 매 순간 받는 힘이 작아진다."}, {"n": "③", "t": "사례", "d": "에어백, 범퍼·크럼플 존, 놀이터 푹신한 바닥, 글러브를 뒤로 빼며 받기, 무릎 굽혀 착지, 번지점프 줄, 헬멧 완충재 — 전부 같은 공식."}], "howto": [], "body": ["충돌에서 멈춰야 할 운동량 변화량은 이미 정해져 있다 — 달리던 속도에서 0까지. 안전장치가 할 수 있는 일은 그 변화를 <b>최대한 천천히 일어나게 하는 것<\/b>뿐이다. 시간이 길어지면, 같은 충격량이라도 <b>매 순간 받는 힘이 작아진다<\/b>. 이 한 줄이 모든 안전 설계의 원리다.", "자동차의 <b>에어백<\/b>은 몸이 푹 꺼지며 멈추는 시간을 늘리고, 범퍼와 차체 앞부분(크럼플 존)은 구겨지면서 충돌 시간을 번다. 찌그러짐이 곧 안전이다. 놀이터의 푹신한 바닥, 야구 선수가 글러브를 뒤로 빼며 공을 받는 것, 높은 데서 내릴 때 무릎을 굽히는 것, 번지점프의 잘 늘어나는 줄 — 전부 같은 공식의 다른 얼굴이다. 헬멧 속 완충재도 머리가 멈추는 시간을 몇 배로 늘려 {{㉡}}을 줄인다. 한 번 충격을 받은 헬멧을 교체하는 이유는 눌린 완충재가 다시 시간을 벌어 주지 못하기 때문이다.", "최다 빈출 함정은 \"에어백은 운동량 변화량(충격량)을 줄여 준다\"이다. 이것은 틀렸다. {{㉢}}은 정해져 있고, 에어백이 바꾸는 것은 <b>시간과 힘의 배분<\/b>이다. 안전장치의 일은 딱 하나, '시간 벌기'다."], "terms": [{"k": "크럼플 존", "v": "충돌 때 일부러 구겨지도록 설계한 자동차 앞뒤 구역. 찌그러지며 충돌 시간을 번다."}, {"k": "안전모의 속", "v": "딱딱한 겉껍질 안의 완충재가 눌리며 시간을 번다. 한 번 충격을 받은 헬멧을 교체하는 이유."}, {"k": "시간 벌기", "v": "변화량은 정해져 있으므로, 안전장치가 할 수 있는 유일한 일은 충돌 시간을 늘려 힘을 줄이는 것."}], "myths": [{"x": "에어백은 사람의 운동량 변화량 자체를 줄여 준다.", "o": "변화량(충격량)은 <b>같고<\/b>, 시간을 늘려 <b>힘만<\/b> 줄인다."}, {"x": "차체가 찌그러지는 차는 안전하지 않은 차다.", "o": "크럼플 존은 <b>일부러<\/b> 구겨져 충돌 시간을 번다. 찌그러짐이 곧 안전이다."}], "point": "안전장치의 일 = '시간 벌기' 하나. 운동량 변화량은 못 줄인다 — 충돌 시간 ↑ ⇒ 힘 ↓ (에어백·크럼플 존·글러브·무릎·번지 줄·헬멧).", "answers": "정답 ㉠ 시간 ㉡ 힘 ㉢ 변화량(운동량 변화량) — '에어백은 충격량을 줄인다'가 최다 빈출 오답이다.", "blanks": {"㉠": "시간", "㉡": "힘", "㉢": "변화량(운동량 변화량)"}, "warning": "'에어백은 충격량을 줄인다'가 최다 빈출 오답이다.", "figure": {"caption": "안전장치의 4가지 얼굴 — 모두 '충돌 시간 늘리기'라는 한 가지 일을 한다", "file": "figures/1304-04.svg"}}, {"id": "1304-05", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1304", "lessonName": "운동량과 충격량", "no": "05", "title": "힘과 시간을 키워 멀리", "subtitle": "스포츠 속 충격량", "steps": [{"n": "①", "t": "같은 식, 반대로", "d": "공을 더 빠르게 날리려면 운동량 변화량 — 곧 <b>충격량<\/b>을 키워야 한다. 방법은 둘: 더 큰 힘으로 치거나, <b>더 오래<\/b> 밀어 주거나."}, {"n": "②", "t": "팔로스루", "d": "공을 친 뒤에도 끝까지 휘두르기. 채와 공의 {{㉠}}을 늘려 충격량을 키운다. 힘을 빼는 동작이 아니라 <b>더 멀리 보내는<\/b> 동작."}, {"n": "③", "t": "격파", "d": "아주 짧은 시간에 힘을 <b>집중<\/b>시켜 순간의 힘을 키운다. 같은 등식의 양 끝을 오간다."}], "howto": [], "body": ["같은 공식을 반대로 쓰면 공격의 기술이 된다. 공을 더 빠르게 날리고 싶다면 공의 운동량 변화량 — 곧 충격량 — 을 키워야 한다. 충격량 = 힘 × 시간이니 방법은 둘이다. <b>더 큰 힘으로 치거나, 더 오래 밀어 주거나.<\/b>", "골프와 야구의 <b>팔로스루<\/b>(공을 친 뒤에도 끝까지 휘두르기)는 채와 공의 접촉 시간을 늘려 {{㉡}}을 키우는 기술이다. 힘을 빼려는 동작이 아니라 더 멀리 보내려는 동작인 것이다. 접촉 시간과 함께 힘의 방향도 안정시켜 준다. 반대로 태권도 <b>격파<\/b>는 아주 짧은 시간에 {{㉢}}을 집중시켜 순간의 힘을 키운다 — 같은 등식의 양 끝을 오가며, 스포츠는 물리학을 몸으로 쓴다.", "정리하면 이 소단원의 등식 하나가 <b>두 방향<\/b>으로 일한다. 지킬 때는 시간을 늘려 힘을 줄이고(안전), 보낼 때는 힘·시간을 키워 충격량을 늘린다(스포츠). 문제를 만나면 먼저 묻는다 — \"지금 목적이 보호인가, 발사인가?\" 멈출 충돌이면 변화량이 정해져 있어 시간 승부이고, 보낼 공이면 변화량을 키우는 것이 목표다."], "terms": [{"k": "팔로스루", "v": "타격 후에도 스윙을 끝까지 이어 가는 동작. 접촉 시간을 늘려 충격량을 키우고 힘의 방향도 안정시킨다."}, {"k": "격파", "v": "아주 짧은 시간에 힘을 집중시켜 순간의 힘을 키우는 기술."}, {"k": "등식의 두 방향", "v": "보호(시간 ↑ 힘 ↓)와 발사(힘·시간 ↑ 충격량 ↑) — 같은 '충격량 = 힘 × 시간'의 앞뒤 면."}], "myths": [{"x": "팔로스루는 공이 받는 힘을 줄이기 위한 동작이다.", "o": "접촉 시간을 늘려 <b>충격량을 키우는<\/b> 동작이다. 더 멀리 보내기 위해서다."}, {"x": "같은 힘이라면 접촉 시간이 길어도 충격량은 같다.", "o": "충격량 = 힘 × 시간이므로 접촉 시간이 길수록 충격량이 <b>크다<\/b>."}], "point": "보낼 때는 충격량을 키운다 — 더 큰 힘(격파) 또는 더 오래(팔로스루). 문제를 만나면 먼저 묻는다: 보호인가, 발사인가?", "answers": "정답 ㉠ 접촉 시간 ㉡ 충격량 ㉢ 힘 — '팔로스루는 힘을 줄이는 동작'이 단골 오답이다.", "blanks": {"㉠": "접촉 시간", "㉡": "충격량", "㉢": "힘"}, "warning": "'팔로스루는 힘을 줄이는 동작'이 단골 오답이다.", "figure": {"caption": "스포츠 속 충격량 — 팔로스루는 충격량 키우기, 격파는 힘 집중하기. 안전장치와 같은 식의 반대 방향이다", "file": "figures/1304-05.svg"}}, {"id": "1305-01", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1305", "lessonName": "생명 시스템과 화학 반응", "no": "01", "title": "세포", "subtitle": "생명 시스템의 기본 단위", "steps": [{"n": "①", "t": "생명 시스템", "d": "지구시스템이 다섯 권역의 상호작용으로 굴러가듯, 생명체도 하나의 <b>시스템<\/b>이다. 기본 단위는 {{㉠}}."}, {"n": "②", "t": "층층 구조", "d": "<b>세포 → 조직 → 기관 → 개체<\/b>. 비슷한 세포가 모여 조직, 여러 조직이 모여 기관, 기관들이 모여 개체."}, {"n": "③", "t": "세포 속 분업", "d": "<b>핵<\/b>은 유전 정보 보관, <b>마이토콘드리아<\/b>는 에너지 생산, <b>라이보솜<\/b>은 단백질 조립, <b>세포막<\/b>은 물질 출입 관리."}], "howto": [], "body": ["지구시스템이 다섯 권역의 상호작용으로 굴러가듯, 생명체도 하나의 <b>시스템<\/b>이다. 그 기본 단위가 <b>세포<\/b>다. 비슷한 세포가 모여 <b>조직<\/b>을, 여러 조직이 모여 <b>기관<\/b>을, 기관들이 모여 하나의 <b>개체<\/b>를 이룬다 — 세포 → 조직 → 기관 → 개체의 층층 구조다. 그리고 이 시스템이 유지되려면 세포 하나하나가 쉼 없이 일해야 한다. '세포는 작다'가 아니라 '세포는 바쁘다'로 기억한다.", "세포 속을 들여다보면 분업이 정교하다. <b>핵<\/b>은 유전 정보(설계도)를 보관하고, {{㉡}}는 양분을 분해해 세포가 쓸 에너지를 만들며, <b>라이보솜<\/b>은 단백질을 조립한다. 그리고 이 모든 것을 감싸는 {{㉢}}이 물질의 출입을 관리한다. 공장에 비유하면 설계실·발전소·조립 라인·정문 경비실이 한 건물 안에 다 있는 셈이다.", "중학교에서 \"모든 생물은 세포로 이루어져 있다\"고 배웠다. 이 소단원은 거기에 '세포 안에서 무슨 일이 일어나는가'를 더한다. 지금 이 순간에도 몸의 세포 하나에서 수많은 화학 반응이 처리되고 있으며, 그 반응들의 총칭이 다음 개념의 <b>물질대사<\/b>다. 마이토콘드리아는 그 가운데 <b>세포 호흡<\/b>이 일어나는 현장이다."], "terms": [{"k": "생명 시스템", "v": "구성 요소(세포·조직·기관)들이 상호작용하며 생명 활동을 유지하는 시스템."}, {"k": "구성 단계", "v": "세포 → 조직 → 기관 → 개체. 세포가 기본 단위."}, {"k": "마이토콘드리아", "v": "양분을 분해해 에너지를 만드는 세포 소기관 — 세포 호흡의 현장이다."}], "myths": [{"x": "생명 시스템의 기본 단위는 기관이다.", "o": "기본 단위는 <b>세포<\/b>. 세포 → 조직 → 기관 → 개체 순으로 커진다."}, {"x": "세포의 에너지는 핵에서 만들어진다.", "o": "핵은 <b>유전 정보 보관<\/b>, 에너지 생산은 <b>마이토콘드리아<\/b>다."}], "point": "세포 = 생명의 기본 단위(세포 → 조직 → 기관 → 개체). 핵 = 설계실, 마이토콘드리아 = 발전소, 라이보솜 = 조립 라인, 세포막 = 정문.", "answers": "정답 ㉠ 세포 ㉡ 마이토콘드리아 ㉢ 세포막 — 핵과 마이토콘드리아의 역할을 바꿔치기한 선지가 단골 오답이다.", "blanks": {"㉠": "세포", "㉡": "마이토콘드리아", "㉢": "세포막"}, "warning": "핵과 마이토콘드리아의 역할을 바꿔치기한 선지가 단골 오답이다.", "figure": {"caption": "생명 시스템의 구성 단계 — 세포가 모든 층의 출발점이다. 세포 속에는 핵·마이토콘드리아·라이보솜·세포막의 분업이 있다", "file": "figures/1305-01.svg"}}, {"id": "1305-02", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1305", "lessonName": "생명 시스템과 화학 반응", "no": "02", "title": "물질대사", "subtitle": "세포 안의 화학 반응, 동화와 이화", "steps": [{"n": "①", "t": "물질대사", "d": "생명체 안에서 일어나는 <b>모든 화학 반응<\/b>. 방향은 두 가지뿐 — 합성이냐, 분해냐."}, {"n": "②", "t": "동화 · 이화", "d": "작고 간단한 물질로 크고 복잡한 물질을 <b>합성<\/b>하면 동화(에너지 흡수), 분해하면 {{㉠}}(에너지 방출). 광합성 = 동화, 세포 호흡 = 이화."}, {"n": "③", "t": "연소와 다른 점", "d": "세포 호흡도 포도당 + 산소 → 이산화 탄소 + 물. 그러나 연소는 한꺼번에 고온, 물질대사는 <b>체온에서 여러 단계로<\/b> 조금씩."}], "howto": [], "body": ["생명체 안에서 일어나는 모든 화학 반응을 <b>물질대사<\/b>라고 한다. 방향은 두 가지뿐이다. 작고 간단한 물질로 크고 복잡한 물질을 <b>합성<\/b>하면 <b>동화 작용<\/b>(에너지 흡수), 크고 복잡한 물질을 작고 간단한 물질로 <b>분해<\/b>하면 <b>이화 작용<\/b>(에너지 방출)이다. 식물이 이산화 탄소와 물로 포도당을 만드는 <b>광합성<\/b>이 동화의 대표라면, 세포가 포도당을 분해해 에너지를 꺼내 쓰는 <b>세포 호흡<\/b>은 이화의 대표다.", "세포 호흡은 연소와 닮았다 — 포도당과 산소가 반응해 이산화 탄소와 물이 되기 때문이다. 그러나 결정적 차이가 있다. 연소는 한꺼번에 높은 온도로 타오르지만, 물질대사는 {{㉡}} 정도의 낮은 온도에서, <b>여러 단계로 나뉘어 조금씩<\/b> 진행된다. 그래서 세포는 타 버리지 않고 에너지를 차곡차곡 꺼내 쓴다. 이 '저온의 마법'을 가능하게 하는 주인공이 다음 개념, 효소다.", "판정은 언제나 <b>합성이냐 분해냐<\/b>부터다. \"세포 호흡은 동화 작용이다\"는 최다 빈출 오답이다 — 포도당을 분해하므로 {{㉢}} 작용이다. 광합성은 식물 세포의 엽록체에서 일어나는 동화 작용이며, 생명체 안의 반응이면 광합성도 물질대사다. 물질대사는 세포 안에서, 효소의 도움으로, 체온 수준에서 일어난다."], "terms": [{"k": "물질대사", "v": "생명체 안에서 일어나는 모든 화학 반응. 세포 안에서, 효소의 도움으로, 체온 수준에서 일어난다."}, {"k": "동화 · 이화", "v": "동화 = 합성, 에너지 흡수(광합성). 이화 = 분해, 에너지 방출(세포 호흡)."}, {"k": "연소와의 차이", "v": "연소는 한꺼번에 고온, 세포 호흡은 체온에서 여러 단계로 조금씩."}], "myths": [{"x": "세포 호흡은 포도당을 합성하는 동화 작용이다.", "o": "포도당을 <b>분해<\/b>해 에너지를 방출하는 <b>이화 작용<\/b>이다."}, {"x": "물질대사는 연소처럼 높은 온도에서 한꺼번에 일어난다.", "o": "<b>체온에서 단계적으로<\/b> 일어난다. 그래서 세포가 타지 않는다."}], "point": "합성 = 동화 = 에너지 흡수(광합성) / 분해 = 이화 = 에너지 방출(세포 호흡). 연소와 달리 저온·단계적 — 효소 덕분이다.", "answers": "정답 ㉠ 이화 ㉡ 체온 ㉢ 이화 — '세포 호흡은 동화 작용'이 최다 빈출 오답이다.", "blanks": {"㉠": "이화", "㉡": "체온", "㉢": "이화"}, "warning": "'세포 호흡은 동화 작용'이 최다 빈출 오답이다.", "figure": {"caption": "동화 작용과 이화 작용 — 만들 때는 에너지를 넣고, 부술 때는 에너지가 나온다. 세포 호흡은 연소와 달리 저온에서 단계적이다", "file": "figures/1305-02.svg"}}, {"id": "1305-03", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1305", "lessonName": "생명 시스템과 화학 반응", "no": "03", "title": "효소", "subtitle": "활성화 에너지를 낮추는 생체 촉매", "steps": [{"n": "①", "t": "에너지 언덕", "d": "반응물이 넘어야 할 에너지 언덕의 높이가 {{㉠}}. 언덕이 높으면 반응은 느리거나 거의 일어나지 않는다."}, {"n": "②", "t": "효소", "d": "반응물과 결합해 활성화 에너지를 <b>낮추어<\/b> 반응을 빠르게 하는 <b>생체 촉매<\/b>. 실험실이면 고온·고압이 필요할 반응이 몸속에서는 37 ℃에서 끝난다."}, {"n": "③", "t": "두 가지 성격", "d": "입체 구조가 맞는 특정 기질하고만 결합(<b>기질 특이성<\/b>), 반응 후에도 <b>소모되지 않고<\/b> 다시 일한다."}], "howto": ["왼쪽 그래프의 세로축은 에너지, 가로축은 반응이 진행되는 순서다. 왼쪽 평평한 선이 반응물, 오른쪽이 생성물의 에너지다.", "둘 사이의 <b>봉우리 높이<\/b>가 활성화 에너지다. 붉은 선(효소 없음)은 높고, 파란 선(효소 있음)은 낮다 — 효소는 봉우리만 깎을 뿐, 반응물과 생성물의 에너지는 바꾸지 않는다.", "오른쪽 상자는 효소가 <b>모양이 맞는 기질<\/b>하고만 결합하는 것(기질 특이성)과, 반응 뒤 효소가 그대로 나와 다시 쓰이는 것(소모되지 않음)을 보여 준다."], "body": ["화학 반응이 일어나려면 반응물이 넘어야 할 에너지 언덕이 있다 — 이 언덕의 높이가 <b>활성화 에너지<\/b>다. 언덕이 높으면 반응은 느리거나 거의 일어나지 않는다. <b>효소<\/b>는 반응물과 결합해 활성화 에너지를 낮추어 반응이 빠르게 일어나게 하는 <b>생체 촉매<\/b>다. 언덕을 깎아 지름길을 내는 것이다. 덕분에 실험실에서라면 고온·고압이 필요할 반응이 몸속에서는 37 ℃에서 순식간에 끝난다. 촉매란 자신은 변하지 않으면서 반응 속도를 바꾸는 물질이고, 효소는 생명체가 만든 촉매다.", "효소에게는 두 가지 성격이 더 있다. 첫째, 가리는 것이 확실하다 — 효소는 입체 구조가 맞는 특정 반응물(기질)하고만 결합한다. 열쇠 하나가 자물쇠 하나만 여는 것과 같다({{㉡}}). 둘째, 반응 후에도 {{㉢}}되지 않는다 — 반응을 도운 효소는 그대로 빠져나와 다음 반응물을 붙잡는다. 소량으로도 계속 일할 수 있는 이유다. 효소의 주성분은 <b>단백질<\/b>이어서, 높은 온도에서는 구조가 변해 기능을 잃는다."], "terms": [{"k": "활성화 에너지", "v": "반응이 일어나기 위해 반응물이 넘어야 할 에너지 언덕의 높이."}, {"k": "효소 · 촉매", "v": "촉매 = 자신은 변하지 않으면서 반응 속도를 바꾸는 물질. 효소 = 생명체가 만든 촉매, 주성분은 단백질."}, {"k": "기질 특이성", "v": "효소는 입체 구조가 맞는 특정 기질에만 작용한다. 반응 후에도 소모되지 않고 재사용된다."}], "myths": [{"x": "효소는 반응이 끝나면 소모되어 없어진다.", "o": "<b>소모되지 않고<\/b> 그대로 나와 다음 기질을 붙잡는다. 소량으로 계속 일한다."}, {"x": "효소는 반응물과 생성물의 에너지 차이를 바꾼다.", "o": "효소가 낮추는 것은 <b>활성화 에너지(봉우리)<\/b>뿐이다."}], "point": "효소 = 생체 촉매(단백질). 활성화 에너지 ↓ → 반응 속도 ↑ / 짝 맞는 기질만(기질 특이성) / 반응 후에도 소모 없이 재사용.", "answers": "정답 ㉠ 활성화 에너지 ㉡ 기질 특이성 ㉢ 소모 — '효소는 반응 후 소모된다'가 단골 오답이다.", "blanks": {"㉠": "활성화 에너지", "㉡": "기질 특이성", "㉢": "소모"}, "warning": "'효소는 반응 후 소모된다'가 단골 오답이다.", "figure": {"caption": "효소의 작동 원리 — 활성화 에너지 언덕을 낮추고, 짝이 맞는 기질만 골라 돕고, 반응 후에도 남는다", "file": "figures/1305-03.svg"}}, {"id": "1305-04", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1305", "lessonName": "생명 시스템과 화학 반응", "no": "04", "title": "세포막", "subtitle": "드나듦을 관리하는 경계, 선택적 투과성", "steps": [{"n": "①", "t": "구조", "d": "{{㉠}}에 단백질이 곳곳에 박힌 구조. 인지질은 물과 친한 머리를 바깥, 물을 피하는 꼬리를 안쪽으로 두 겹."}, {"n": "②", "t": "작은 분자", "d": "산소·이산화 탄소는 인지질 2중층 사이를 <b>직접<\/b> 빠져나가며, 농도가 높은 쪽에서 낮은 쪽으로 저절로 퍼진다(<b>확산<\/b>)."}, {"n": "③", "t": "큰 분자 · 이온", "d": "포도당이나 이온은 <b>막단백질이 만든 통로<\/b>로만 드나든다. 물질을 가려 받는 이 성질이 <b>선택적 투과성<\/b>."}], "howto": [], "body": ["물질대사가 돌아가려면 재료(산소·양분)는 들어오고 폐기물(이산화 탄소 등)은 나가야 한다. 이 출입을 관리하는 것이 <b>세포막<\/b>이다. 세포막은 <b>인지질 2중층에 단백질이 곳곳에 박힌 구조<\/b>다. 인지질 분자는 물과 친한 머리를 바깥쪽으로, 물을 피하는 꼬리를 안쪽으로 향한 채 두 겹으로 늘어서 있고, 그 사이사이에 <b>막단백질<\/b>이 통로와 검문소 역할을 한다.", "출입 방식은 물질마다 다르다. 산소나 이산화 탄소처럼 <b>작은 분자<\/b>는 인지질 2중층 사이를 직접 빠져나가며, 농도가 높은 쪽에서 낮은 쪽으로 저절로 퍼진다({{㉡}}). 분자가 스스로 운동해 퍼지는 것이므로 에너지가 들지 않는다. 허파꽈리에서 산소와 이산화 탄소가 오가는 것도 세포막을 사이에 둔 확산이다.", "반면 포도당이나 이온처럼 <b>크거나 전하를 띤 물질<\/b>은 막단백질이 만든 통로를 통해서만 드나든다. 아무나 통과시키지 않고 물질을 가려 받는 이 성질을 {{㉢}}이라 한다 — 세포가 안정된 화학 공장으로 유지되는 비결이다. 시험에서는 \"세포막은 모든 물질을 통과시킨다\"(✗)와, 산소·이산화 탄소(직접)와 포도당·이온(통로)의 짝을 바꿔치기한 선지를 조심한다."], "terms": [{"k": "세포막의 구조", "v": "인지질 2중층 + 막단백질. 인지질은 물과 친한 머리를 바깥, 물을 피하는 꼬리를 안쪽으로 두 겹."}, {"k": "확산", "v": "분자가 스스로 운동해 농도가 높은 쪽에서 낮은 쪽으로 퍼지는 현상. 에너지가 들지 않는다."}, {"k": "선택적 투과성", "v": "세포막이 물질을 가려 통과시키는 성질. 작은 것 = 직접 확산, 큰 것·이온 = 막단백질 통로."}], "myths": [{"x": "세포막은 물질의 종류와 관계없이 모두 통과시킨다.", "o": "<b>선택적 투과성<\/b> — 물질을 가려 받는다."}, {"x": "포도당은 인지질 2중층 사이를 직접 통과한다.", "o": "포도당·이온은 <b>막단백질 통로<\/b>로만. 직접 통과는 산소·이산화 탄소 같은 작은 분자다."}], "point": "세포막 = 인지질 2중층 + 막단백질. 작은 것(산소·이산화 탄소) = 직접 확산, 큰 것·이온(포도당·이온) = 단백질 통로 — 선택적 투과성.", "answers": "정답 ㉠ 인지질 2중층 ㉡ 확산 ㉢ 선택적 투과성 — '산소는 통로, 포도당은 직접'으로 짝을 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "인지질 2중층", "㉡": "확산", "㉢": "선택적 투과성"}, "warning": "'산소는 통로, 포도당은 직접'으로 짝을 바꾼 선지가 단골 오답이다.", "figure": {"caption": "세포막의 구조와 물질 출입 — 작은 분자는 직접 확산, 크거나 전하를 띤 물질은 막단백질 통로로. 이것이 선택적 투과성이다", "file": "figures/1305-04.svg"}}, {"id": "1305-05", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1305", "lessonName": "생명 시스템과 화학 반응", "no": "05", "title": "식탁 위의 화학", "subtitle": "생활 속 효소와 발효, 그리고 감자 실험", "steps": [{"n": "①", "t": "발효", "d": "김치가 익는 것은 젖산균의 물질대사({{㉠}})로 신맛 물질이 생기기 때문, 빵이 부푸는 것은 효모가 당을 분해하며 내놓는 이산화 탄소 때문."}, {"n": "②", "t": "효소를 직접", "d": "<b>소화제<\/b>(녹말·단백질·지방 분해), <b>파인애플·키위즙<\/b>(고기 단백질 분해 → 연육), <b>효소 세제<\/b>, <b>혈당 측정기<\/b> — 열쇠는 전부 '분해'."}, {"n": "③", "t": "감자 실험", "d": "과산화수소수에 생감자를 넣으면 거품(산소) 활발, 삶은 감자는 거품 없음 — 효소(카탈레이스)는 <b>단백질<\/b>이라 열에 약하다."}], "howto": [], "body": ["효소의 무대는 몸속만이 아니다. 김치가 익는 것은 젖산균이라는 미생물이 자신의 물질대사(<b>발효<\/b>)로 배추 속 양분을 분해해 신맛 물질을 만들기 때문이고, 빵 반죽이 부푸는 것은 효모가 당을 분해하며 내놓는 이산화 탄소 기체 때문이다. 요구르트·된장·식초 — 인류는 효소의 정체를 알기 수천 년 전부터 미생물의 물질대사를 빌려 음식을 만들어 왔다. 오른쪽 실험은 그 효소가 <b>단백질<\/b>이라는 증거다 — 생감자에서만 거품(산소)이 활발하고, 삶은 감자에서는 거의 없다.", "효소를 직접 꺼내 쓰기도 한다. <b>소화제<\/b>에는 녹말·단백질·지방을 분해하는 효소가 들어 있어 소화를 돕고, 질긴 고기를 <b>파인애플이나 키위즙<\/b>에 재우면 과일 속 단백질 분해 효소가 고기의 단백질을 끊어 연하게 만든다 — 합성이 아니라 {{㉡}}다. 때가 잘 빠지는 <b>효소 세제<\/b>, 혈당을 재는 <b>혈당 측정기<\/b>의 감지 원리에도 효소가 들어 있다. 미생물이 효소로 양분을 분해하는 물질대사가 사람에게 이로우면 발효, 해로우면 부패라 부른다.", "감자 실험을 읽는 순서는 셋이다. ① (다)를 보면 과산화수소는 혼자서도 분해되지만 매우 느리다 — 생감자 속 카탈레이스가 활성화 에너지를 낮추어 분해를 극적으로 빠르게 했다. ② 삶으면 왜 안 되는가 — 효소의 주성분은 {{㉢}}이다. 높은 온도에서 입체 구조가 변하면(변성) 기질과 결합할 수 없어 촉매 기능을 잃는다. 감자 속 물질이 사라진 것이 아니라 <b>모양이 무너진 것<\/b>이다. ③ (다)는 '효소가 없으면 어떻게 되는가'를 보여 주는 대조군이며, (가)와 (다)의 차이가 곧 효소의 효과다."], "terms": [{"k": "발효", "v": "미생물이 효소로 양분을 분해하는 물질대사. 사람에게 이로우면 발효, 해로우면 부패."}, {"k": "연육의 원리", "v": "파인애플·키위즙의 단백질 분해 효소가 고기의 단백질 사슬을 끊는다 — 합성이 아니라 분해."}, {"k": "카탈레이스", "v": "감자·간에 든 효소. 과산화수소를 물과 산소로 분해한다. 단백질이라 삶으면 변성되어 기능을 잃는다."}], "myths": [{"x": "파인애플즙은 고기의 단백질 합성을 촉진해 고기를 연하게 한다.", "o": "단백질을 <b>분해<\/b>한다. 생활 속 효소는 전부 '분해'가 열쇠다."}, {"x": "삶은 감자에는 카탈레이스가 없어서 거품이 나지 않는다.", "o": "효소는 <b>있지만 변성<\/b>되어 기능을 잃은 것이다."}], "point": "김치·빵·요구르트 = 발효, 소화제·연육·세제 = 효소 — 전부 '분해'. 감자 실험 = ① 촉매 작용(거품 = 산소) ② 단백질 변성 ③ 대조군.", "answers": "정답 ㉠ 발효 ㉡ 분해 ㉢ 단백질 — '삶은 감자에는 효소가 없다'(있지만 변성)가 단골 오답이다.", "blanks": {"㉠": "발효", "㉡": "분해", "㉢": "단백질"}, "warning": "'삶은 감자에는 효소가 없다'(있지만 변성)가 단골 오답이다.", "figure": {"caption": "생활 속 효소와 발효, 그리고 카탈레이스 실험 — 김치·빵·연육은 '분해'가 열쇠이고, 삶은 감자는 효소가 변성돼 거품이 없다", "file": "figures/1305-05.svg"}}, {"id": "1306-01", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1306", "lessonName": "유전자에서 단백질까지", "no": "01", "title": "설계도의 주소", "subtitle": "염색체, DNA, 유전자", "steps": [{"n": "①", "t": "형질과 DNA", "d": "눈동자 색·혈액형·귓불 모양 같은 고유한 특징이 <b>형질<\/b>. 그 정보는 세포핵 속 <b>DNA<\/b>에 담겨 있다."}, {"n": "②", "t": "정보 = 염기의 순서", "d": "DNA는 두 가닥이 꼬인 <b>이중나선<\/b>. 안쪽에 A·G·C·T 네 종류 염기가 줄지어 있고, 그 <b>순서(서열)<\/b>가 곧 유전 정보다."}, {"n": "③", "t": "주소 체계", "d": "DNA 전체가 설계도 책이라면 {{㉠}}는 단백질 하나의 정보가 담긴 한 단원. 염색체는 DNA가 단백질과 함께 감겨 뭉친 덩어리 — <b>염색체 ⊃ DNA ⊃ 유전자<\/b>."}], "howto": [], "body": ["눈동자 색, 혈액형, 귓불 모양처럼 생물이 가진 고유한 특징을 <b>형질<\/b>이라 한다. 형질의 정보는 세포핵 속 <b>DNA<\/b>에 담겨 있다. DNA는 두 가닥이 꼬인 이중나선 구조이고, 그 안쪽에 아데닌(A)·구아닌(G)·사이토신(C)·타이민(T) 네 종류의 <b>염기<\/b>가 줄지어 있다 — 이 <b>염기의 순서(서열)<\/b>가 곧 유전 정보다. 네 글자로 쓰인 생명의 문장인 셈이다.", "이때 주소를 정확히 잡는다. DNA 전체가 하나의 설계도 책이라면, <b>유전자<\/b>는 그중 특정 단백질 하나에 대한 정보가 담긴 부분 — 책 속의 한 단원이다. 하나의 DNA에는 수많은 유전자가 들어 있다. 사람의 DNA에는 약 2만 개의 유전자가 있다 — 단원이 2만 개인 설계도 책이다. 그리고 <b>염색체<\/b>는 긴 DNA가 단백질과 함께 촘촘히 감겨 뭉쳐진 덩어리다. 크기로 줄 세우면 {{㉢}} ⊃ DNA ⊃ 유전자가 된다.", "도서관으로 기억한다 — 핵은 도서관, 염색체는 책장, DNA는 책, 유전자는 그 책의 한 단원. 시험은 늘 '누가 누구를 포함하나'를 묻는다. 그리고 정보의 실체는 물질이 아니라 {{㉡}}가 늘어선 순서라는 것을 놓치지 않는다. 중학교에서 부모의 형질이 자손에게 전해지는 것을 배웠다면, 이 소단원은 그 정보가 '무엇으로, 어떻게' 형질이 되는지를 본다."], "terms": [{"k": "형질", "v": "눈동자 색·혈액형·귓불 모양처럼 생물이 가진 고유한 특징. 정보는 DNA에 있다."}, {"k": "염기 서열", "v": "DNA에서 A·G·C·T가 늘어선 순서. 이 순서가 바로 유전 정보다."}, {"k": "염색체 ⊃ DNA ⊃ 유전자", "v": "염색체 = DNA가 단백질과 감겨 뭉친 덩어리, 유전자 = DNA 중 단백질 하나의 정보가 담긴 부분."}], "myths": [{"x": "유전자가 DNA를 포함한다.", "o": "반대다. <b>DNA가 유전자를 포함<\/b>한다 — 유전자는 DNA의 한 부분."}, {"x": "유전 정보는 염기의 종류가 많아서 다양해진다.", "o": "염기는 네 종류뿐. 다양성은 염기의 <b>순서<\/b>에서 나온다."}], "point": "염색체 ⊃ DNA ⊃ 유전자. 정보 = 염기(A·G·C·T)의 순서. 핵 = 도서관, 염색체 = 책장, DNA = 책, 유전자 = 한 단원.", "answers": "정답 ㉠ 유전자 ㉡ 염기 ㉢ 염색체 — 포함 관계를 거꾸로 쓴 선지가 단골 오답이다.", "blanks": {"㉠": "유전자", "㉡": "염기", "㉢": "염색체"}, "warning": "포함 관계를 거꾸로 쓴 선지가 단골 오답이다.", "figure": {"caption": "설계도의 주소 체계 — 핵에서 염색체, DNA, 유전자로 확대해 들어간다. 정보의 실체는 염기의 순서다", "file": "figures/1306-01.svg"}}, {"id": "1306-02", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1306", "lessonName": "유전자에서 단백질까지", "no": "02", "title": "정보의 흐름", "subtitle": "DNA에서 RNA, 단백질까지", "steps": [{"n": "①", "t": "일꾼은 단백질", "d": "형질을 실제로 만드는 것은 <b>단백질<\/b>. 효소도, 케라틴도, 헤모글로빈도 단백질이다. 문제 — 공장(라이보솜)은 핵 밖, 원본(DNA)은 핵 밖으로 안 나간다."}, {"n": "②", "t": "해법은 복사본", "d": "핵 안에서 DNA의 정보를 {{㉠}}에 옮겨 적고(전사), 복사본이 라이보솜으로 나가면 그 정보대로 아미노산을 연결해 단백질을 만든다(번역)."}, {"n": "③", "t": "생명 중심 원리", "d": "<b>DNA → (전사) → RNA → (번역) → 단백질<\/b>, 한 방향. 전사는 <b>핵 안<\/b>, 번역은 <b>세포질의 라이보솜<\/b>."}], "howto": [], "body": ["형질을 실제로 만들어 내는 일꾼은 <b>단백질<\/b>이다. 앞 소단원의 효소도, 머리카락의 케라틴도, 산소를 나르는 헤모글로빈도 전부 단백질이다. 그런데 문제가 하나 있다 — 단백질 조립 공장인 라이보솜은 핵 밖(세포질)에 있고, 설계도 원본인 DNA는 핵 밖으로 나가지 않는다. 귀중한 원본을 공장에 들고 다닐 수는 없는 노릇이다.", "세포의 해법은 <b>복사본<\/b>이다. 핵 안에서 DNA의 유전 정보를 <b>RNA<\/b>라는 물질에 옮겨 적고({{㉡}}), 이 복사본이 핵 밖 라이보솜으로 나가면 라이보솜이 그 정보대로 아미노산을 연결해 단백질을 만든다({{㉢}}). 즉 세포 내 정보는 DNA → (전사) → RNA → (번역) → 단백질, 한 방향으로 흐른다 — 이것이 <b>생명의 중심 원리<\/b>다. 그리고 만들어진 단백질이 형질을 나타낸다. 멜라닌 합성 효소(단백질)가 많이 일하면 눈동자가 진해진다 — 형질의 실행자는 단백질이다.", "RNA는 DNA와 비슷하지만 <b>한 가닥<\/b>이고, 타이민(T) 대신 유라실(U)을 쓰는 정보의 전달자다. 시험의 최다 빈출은 <b>장소 바꿔치기<\/b>다 — 전사는 <b>핵 안<\/b>, 번역은 <b>세포질의 라이보솜<\/b>. \"DNA가 직접 라이보솜으로 간다\"(✗), \"번역이 핵 안에서 일어난다\"(✗)를 반사적으로 거른다."], "terms": [{"k": "생명 중심 원리", "v": "DNA → (전사) → RNA → (번역) → 단백질. 유전 정보는 한 방향으로 흐른다."}, {"k": "RNA", "v": "DNA와 비슷하지만 한 가닥이고, 타이민(T) 대신 유라실(U)을 쓴다. 정보의 전달자(복사본)."}, {"k": "전사 · 번역의 장소", "v": "전사 = 핵 안(DNA → RNA), 번역 = 세포질의 라이보솜(RNA → 단백질). 원본은 핵 밖으로 나가지 않는다."}], "myths": [{"x": "전사는 라이보솜에서, 번역은 핵 안에서 일어난다.", "o": "반대다. 전사는 <b>핵 안<\/b>, 번역은 <b>라이보솜<\/b>."}, {"x": "DNA가 직접 라이보솜으로 가서 단백질을 만든다.", "o": "DNA는 핵에 남고, 복사본 <b>RNA<\/b>가 나간다."}], "point": "전사 = 핵 안, DNA → RNA / 번역 = 라이보솜, RNA → 단백질. 원본은 안 나간다 — 단백질이 형질을 만든다.", "answers": "정답 ㉠ RNA ㉡ 전사 ㉢ 번역 — 전사·번역의 장소를 바꿔치기한 선지가 최다 빈출 오답이다.", "blanks": {"㉠": "RNA", "㉡": "전사", "㉢": "번역"}, "warning": "전사·번역의 장소를 바꿔치기한 선지가 최다 빈출 오답이다.", "figure": {"caption": "생명 중심 원리 — 원본(DNA)은 핵에, 복사본(RNA)이 공장(라이보솜)으로 간다. 전사는 핵 안, 번역은 세포질이다", "file": "figures/1306-02.svg"}}, {"id": "1306-03", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1306", "lessonName": "유전자에서 단백질까지", "no": "03", "title": "전사", "subtitle": "원본을 옮겨 적다, T 자리에 U", "steps": [{"n": "①", "t": "상보결합", "d": "DNA 두 가닥은 염기끼리 정해진 짝으로만 마주 본다 — <b>A는 T와, G는 C와<\/b>. 한 가닥의 서열만 알면 반대 가닥은 자동으로 정해진다."}, {"n": "②", "t": "전사", "d": "유전자 부분의 이중나선이 살짝 풀리면, 한 가닥을 <b>틀<\/b>로 삼아 짝이 맞는 염기를 붙여 RNA 가닥을 만든다."}, {"n": "③", "t": "T 대신 U", "d": "RNA에는 타이민이 없다. DNA의 A를 만나면 RNA에는 {{㉠}}이 붙는다. 주형 가닥 TAC → RNA <b>AUG<\/b>."}], "howto": [], "body": ["DNA 이중나선의 두 가닥은 염기끼리 정해진 짝으로만 마주 본다 — A는 T와, G는 C와 결합한다(<b>상보결합<\/b>). 덕분에 한 가닥의 서열만 알면 반대 가닥은 자동으로 정해진다. <b>전사<\/b>는 이 성질을 이용한다. 유전자 부분의 이중나선이 살짝 풀리면, 두 가닥 중 한 가닥을 틀(거푸집)로 삼아 짝이 맞는 염기를 하나씩 붙여 RNA 가닥을 만들어 간다.", "단, RNA의 세계에는 타이민(T)이 없다. T가 설 자리에는 <b>유라실(U)<\/b>이 대신 들어간다 — DNA의 A를 만나면 RNA에는 U가 붙는 것이다. 예컨대 DNA 주형 가닥이 T A C라면 RNA에는 A U G가 새겨진다. 전사 문제에서 실수의 대부분은 U다. 'DNA의 A를 만나면 RNA엔 U' — 이 한 줄만 붙잡으면 서열 변환은 기계적으로 풀린다. 짝이 정해져 있는 {{㉡}}결합 덕분에 복사는 정확하다.", "완성된 RNA는 {{㉢}}짜리 짧은 복사본이 되어 핵막의 작은 구멍(핵공)을 통해 세포질로 빠져나간다 — DNA는 커서 못 나가지만 RNA는 이 문으로 나간다. 다음 무대는 라이보솜이다."], "terms": [{"k": "상보결합", "v": "A↔T(RNA에서는 U), G↔C — 정해진 짝으로만 결합하는 성질. 복사의 정확성이 여기서 나온다."}, {"k": "전사", "v": "DNA 한 가닥을 틀로 삼아 짝이 맞는 염기를 붙여 RNA를 만드는 과정. 핵 안에서 일어난다."}, {"k": "핵공", "v": "핵막에 뚫린 작은 구멍. RNA는 이 문으로 세포질에 나간다 — DNA는 커서 못 나간다."}], "myths": [{"x": "DNA 주형 가닥의 염기가 A이면 전사된 RNA의 염기는 T이다.", "o": "RNA에는 T가 없다. A의 짝은 <b>U<\/b>다."}, {"x": "전사된 RNA는 DNA처럼 두 가닥이다.", "o": "RNA는 <b>한 가닥<\/b>짜리 짧은 복사본이다."}], "point": "DNA: A-T, G-C(상보결합). 전사되면 A → U! RNA는 한 가닥 — 주형 가닥 TAC → RNA AUG.", "answers": "정답 ㉠ 유라실(U) ㉡ 상보 ㉢ 한 가닥 — 'A의 짝을 T로' 쓰는 실수가 전사 문제 오답의 대부분이다.", "blanks": {"㉠": "유라실(U)", "㉡": "상보", "㉢": "한 가닥"}, "warning": "'A의 짝을 T로' 쓰는 실수가 전사 문제 오답의 대부분이다.", "figure": {"caption": "전사 — 주형 가닥 TAC···에서 RNA AUG···가 태어난다. T 자리에는 U가 들어간다", "file": "figures/1306-03.svg"}}, {"id": "1306-04", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1306", "lessonName": "유전자에서 단백질까지", "no": "04", "title": "번역", "subtitle": "세 글자가 아미노산 하나, 코돈", "steps": [{"n": "①", "t": "글자는 4, 재료는 20", "d": "염기는 A·G·C·U 넷뿐인데 아미노산은 스무 가지. 한 글자면 4가지, 두 글자면 4 × 4 = 16가지 — 모자란다."}, {"n": "②", "t": "코돈", "d": "그래서 <b>세 글자를 한 묶음<\/b>으로 읽는다. 4 × 4 × 4 = 64가지면 스무 가지를 지정하고도 남는다. 이 세 염기 묶음이 {{㉠}}."}, {"n": "③", "t": "번역", "d": "라이보솜이 RNA를 붙잡고 코돈을 한 칸씩 읽으며 대응하는 아미노산을 <b>차례로 연결<\/b>. 사슬이 고유한 입체 구조로 접히면 일하는 단백질."}], "howto": ["붉은 가로선이 RNA다. 아래 상자처럼 <b>세 글자씩<\/b> 끊어 읽는다. 끊는 위치가 밀리면 전혀 다른 답이 나오므로 처음부터 세 칸씩 반듯하게.", "초록 덩어리(라이보솜)가 코돈 위에 앉아 한 칸씩 이동하며, 위의 아미노산 사슬에 하나씩 더 붙인다. 코돈 수 = 아미노산 수, 즉 <b>염기 수 ÷ 3<\/b>.", "오른쪽 표에서 코돈을 찾는다 — AUG는 메싸이오닌, GUG는 발린, CAU는 히스티딘. 표는 <b>RNA 기준<\/b>이므로 DNA 서열로 찾으면 안 된다."], "body": ["라이보솜에 도착한 RNA의 정보는 염기 네 종류(A·G·C·U)뿐인데, 단백질의 재료인 아미노산은 <b>스무 가지<\/b>다. 글자 하나로 하나씩 지정하면 4가지, 두 글자씩 묶어도 4 × 4 = 16가지 — 모자란다. 그래서 생명은 <b>세 글자를 한 묶음<\/b>으로 읽는다. 4 × 4 × 4 = {{㉡}}가지 조합이면 스무 가지 아미노산을 지정하고도 남는다. 이 세 염기 묶음이 유전 암호의 단위, <b>코돈<\/b>이다.", "<b>번역<\/b>은 라이보솜이 RNA를 붙잡고 코돈을 한 칸씩 읽으며 대응하는 아미노산을 차례로 연결하는 과정이다. RNA 서열 AUG-GUG-CAU는 '메싸이오닌-발린-히스티딘' 세 아미노산이 된다. 계산 단골: 염기 수 ÷ 3 = 아미노산 수 — RNA 염기 12개면 아미노산 {{㉢}}개다. 이렇게 이어진 아미노산 사슬이 II단원에서 본 것처럼 고유한 입체 구조로 접히면 비로소 일하는 단백질이 완성된다. 아미노산은 20종뿐이지만 잇는 순서와 길이가 다르면 전혀 다른 단백질이 된다 — 알파벳 26자로 모든 책을 쓰듯. 염기 서열이 아미노산 서열을, 아미노산 서열이 단백질의 모양과 기능을 결정한다."], "terms": [{"k": "코돈", "v": "RNA에서 아미노산 하나를 지정하는 연속된 염기 3개. 유전 암호의 최소 단위."}, {"k": "번역", "v": "라이보솜이 코돈을 한 칸씩 읽으며 아미노산을 차례로 연결하는 과정. 세포질의 라이보솜에서 일어난다."}, {"k": "20종으로 수만 가지", "v": "아미노산은 20종뿐이지만 잇는 순서와 길이가 다르면 전혀 다른 단백질이 된다."}], "myths": [{"x": "RNA의 염기가 12개이면 지정되는 아미노산은 6개이다.", "o": "세 글자가 하나 — 12 ÷ 3 = <b>4개<\/b>다."}, {"x": "염기 두 개씩 읽어도 아미노산 20종을 지정할 수 있다.", "o": "4 × 4 = 16 < 20이라 부족하다. 세 개면 64 ≥ 20으로 충분하다."}], "point": "3염기 = 코돈 = 아미노산 1개. 4³ = 64 ≥ 20이라 세 글자로 읽는다. 염기 수 ÷ 3 = 아미노산 수 — 표는 RNA 기준.", "answers": "정답 ㉠ 코돈 ㉡ 64 ㉢ 4 — '12개 염기 = 6개 아미노산'처럼 2로 나눈 선지가 단골 오답이다.", "blanks": {"㉠": "코돈", "㉡": "64", "㉢": "4"}, "warning": "'12개 염기 = 6개 아미노산'처럼 2로 나눈 선지가 단골 오답이다.", "figure": {"caption": "번역 — 라이보솜이 코돈을 읽어 아미노산을 줄줄이 잇는다. 염기 9개는 아미노산 3개가 된다", "file": "figures/1306-04.svg"}}, {"id": "1306-05", "book": "1", "bookName": "통합과학 1", "unit": "III", "unitName": "시스템과 상호작용", "lessonId": "1306", "lessonName": "유전자에서 단백질까지", "no": "05", "title": "한 글자의 무게", "subtitle": "유전자 이상과 형질, 낫 모양 적혈구", "steps": [{"n": "①", "t": "사슬이 이어져 있다면", "d": "DNA → RNA → 단백질 → 형질. 첫 고리(염기 서열)가 바뀌면 마지막 고리(형질)도 바뀌어야 한다."}, {"n": "②", "t": "염기 하나", "d": "헤모글로빈 유전자의 염기 단 {{㉠}}가 바뀌면 코돈이 지정하는 아미노산이 글루탐산에서 발린으로 바뀌고, 헤모글로빈은 <b>다른 모양으로 접힌다<\/b>."}, {"n": "③", "t": "형질까지", "d": "변형된 헤모글로빈이 엉겨 붙어 막대처럼 굳고, 적혈구가 <b>낫 모양<\/b>이 된다 → 산소 운반 저하, 모세혈관 막힘, 빈혈과 통증."}], "howto": [], "body": ["'DNA → RNA → 단백질 → 형질'의 사슬이 정말 이어져 있다면, 첫 고리(염기 서열)가 바뀌면 마지막 고리(형질)도 바뀌어야 한다. 실제 사례가 <b>낫 모양 적혈구 빈혈증<\/b>이다. 헤모글로빈 유전자의 염기 <b>단 하나<\/b>가 바뀌면, 그 코돈이 지정하는 아미노산이 글루탐산에서 발린으로 하나 바뀌고, 아미노산 서열이 달라진 헤모글로빈은 <b>다른 모양으로 접힌다<\/b>.", "변형된 헤모글로빈은 서로 엉겨 붙어 긴 막대처럼 굳고, 둥글넓적하던 적혈구를 <b>낫 모양<\/b>으로 찌그러뜨린다. 낫 모양 적혈구는 산소를 잘 나르지 못하고 좁은 모세혈관을 막아 빈혈과 통증을 일으킨다. 염기 한 글자의 변화가 단백질을 거쳐 몸 전체의 형질로 증폭된 것이다 — <b>유전자가 {{㉢}}을 통해 형질을 결정한다<\/b>는 사실을 이보다 선명하게 보여 주는 증거는 없다. 이때 헤모글로빈의 아미노산 서열은 정상과 다르다 — 글루탐산이 {{㉡}}으로 바뀌었다.", "DNA 염기 서열에 생긴 변화를 <b>돌연변이<\/b>라 한다. 형질에 영향이 없을 수도 있고, 이 사례처럼 클 수도 있다. II단원에서 본 대로 아미노산 순서가 접히는 모양을, 모양이 기능을 결정하기 때문이다. 이 소단원 전체를 한 줄로 줄이면 — 염색체 ⊃ DNA ⊃ 유전자, 정보의 실체는 염기의 순서, 전사(핵 안, T 대신 U) → 번역(라이보솜, 코돈 3염기 = 아미노산 1개), 그리고 단백질이 형질을 만든다."], "terms": [{"k": "낫 모양 적혈구 빈혈증", "v": "헤모글로빈 유전자의 염기 하나 변화 → 글루탐산이 발린으로 → 헤모글로빈이 다르게 접혀 엉김 → 적혈구가 낫 모양 → 빈혈·통증."}, {"k": "돌연변이", "v": "DNA 염기 서열에 생긴 변화. 형질에 영향이 없을 수도, 클 수도 있다."}, {"k": "단백질 접힘", "v": "아미노산 순서가 접히는 모양을, 모양이 기능을 결정한다(II단원 04 복습)."}], "myths": [{"x": "낫 모양 적혈구 빈혈증에서 헤모글로빈의 아미노산 서열은 정상과 같다.", "o": "글루탐산 → <b>발린<\/b>으로 하나 다르다. 그래서 다르게 접힌다."}, {"x": "염기 하나쯤 바뀌어도 형질은 달라지지 않는다.", "o": "영향이 없을 수도 있지만, 이 사례처럼 <b>형질 전체가 바뀔 수도<\/b> 있다."}], "point": "염기 1개 → 아미노산 1개 → 단백질 모양 → 형질. 낫 모양 적혈구로 기억한다 — 유전자는 단백질을 통해 형질을 결정한다.", "answers": "정답 ㉠ 하나 ㉡ 발린 ㉢ 단백질 — '아미노산 서열은 정상과 같다'가 단골 오답이다.", "blanks": {"㉠": "하나", "㉡": "발린", "㉢": "단백질"}, "warning": "'아미노산 서열은 정상과 같다'가 단골 오답이다.", "figure": {"caption": "낫 모양 적혈구 빈혈증 — 염기 하나가 아미노산, 단백질의 모양, 적혈구, 형질까지 바꾸는 전 과정", "file": "figures/1306-05.svg"}}, {"id": "2101-01", "book": "2", "bookName": "통합과학 2", "unit": "I", "unitName": "변화와 다양성", "lessonId": "2101", "lessonName": "지질시대와 생물의 변천", "no": "01", "title": "지질시대", "subtitle": "화석으로 나눈 지구의 역사", "steps": [{"n": "①", "t": "지구의 나이", "d": "지구의 나이는 약 <b>46억 년<\/b>이다. 이 긴 시간을 몇 개의 큰 단위로 나눈 것이 지질시대다."}, {"n": "②", "t": "구분 기준", "d": "시간 간격이 아니라 지층 속 {{㉠}}의 급격한 변화를 기준으로 나눈다."}, {"n": "③", "t": "네 시대", "d": "선캄브리아 시대 → 고생대 → 중생대 → 신생대. 선캄브리아 시대가 약 <b>88 %<\/b>를 차지한다."}], "howto": ["위쪽 긴 막대 전체가 지구의 역사 46억 년이다. 왼쪽 끝이 지구 탄생, 오른쪽 끝이 현재이며, 각 시대의 길이는 실제 시간 비율대로 그렸다. 옅은 색 부분이 <b>선캄브리아 시대(약 88 %)<\/b>다.", "오른쪽 끝의 좁은 12 %를 아래에 늘려 놓았다. 왼쪽부터 고생대(삼엽충·어류·양치식물), 중생대(공룡·암모나이트), 신생대(매머드)다. 고(古)·중(中)·신(新)은 각각 옛, 가운데, 새를 뜻한다.", "아래 숫자는 각 시대가 시작된 시점이다 — 고생대 5.41억 년 전, 중생대 2.52억 년 전, 신생대 6600만 년 전. '억'과 '만'의 단위가 다른 것에 주의한다.", "붉은 점선이 시대의 경계다. 이 경계는 지층 속 화석이 크게 바뀌는 곳, 곧 대멸종의 자리와 겹친다(개념 04)."], "body": ["지구의 나이는 약 <b>46억 년<\/b>이다. 이 긴 역사를 다루기 위해 지구의 시간을 몇 개의 큰 단위로 나눈 것이 <b>지질시대<\/b>다. 지질시대를 나누는 기준은 시간 간격이 아니라 지층 속 <b>화석의 변화<\/b>, 곧 생물계의 급격한 변화이다. 어느 지층을 경계로 화석의 종류가 크게 바뀌면 그곳에서 시대를 구분한다.", "이렇게 나눈 큰 단위가 <b>선캄브리아 시대 · 고생대 · 중생대 · 신생대<\/b>이다. 생물의 흔적이 드문 {{㉡}} 시대가 지구 역사의 약 88 %를 차지하고, 삼엽충·공룡·매머드가 살았던 나머지 세 시대
