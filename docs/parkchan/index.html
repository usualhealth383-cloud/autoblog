.kv{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--hair)}
.kv:last-child{border:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;font-weight:700;padding:10px 16px;border-radius:999px;z-index:40;box-shadow:var(--shadow);animation:tst 2.4s forwards;max-width:86%;text-align:center}
@keyframes tst{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
</style>

<script type="application/json" id="d-concepts">[{"id": "1101-01", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1101", "lessonName": "자연을 재는 눈 — 시간과 공간", "no": "01", "title": "시간과 공간", "subtitle": "모든 사건에는 주소가 있다", "steps": [{"n": "①", "t": "사건의 주소", "d": "\"공이 날아갔다\"만으로는 과학이 되지 않는다. <b>언제 · 어디서 · 얼마나<\/b>를 적어야 분석할 수 있다."}, {"n": "②", "t": "두 축", "d": "자연의 모든 사건은 {{㉠}}과 공간이라는 두 축 위에서 기술된다. 과학이 자연을 담는 좌표다."}, {"n": "③", "t": "측정의 역사", "d": "별의 위치 → 달력, 진자의 흔들림 → 시계, 낙하하는 공의 거리·시간 → 낙하 법칙. 과학의 역사는 곧 <b>측정의 역사<\/b>다."}], "howto": [], "body": ["\"운동장에서 공이 날아갔다\"는 말로는 과학이 시작되지 않는다. <b>언제<\/b>(오후 3시 12분), <b>어디서<\/b>(골대에서 20 m 지점), <b>얼마나<\/b>(초속 15 m로) — 이렇게 적는 순간 비로소 자연은 분석할 수 있는 대상이 된다. 자연에서 일어나는 모든 사건은 <b>시간과 공간이라는 두 축<\/b> 위에서 기술된다. 시간과 공간은 과학이 자연을 담는 좌표이자, 이 단원 전체의 출발점이다.", "그래서 과학의 역사는 곧 <b>측정의 역사<\/b>였다. 별의 위치를 재면서 {{㉡}}이 나왔고, 진자의 흔들림을 재면서 정밀한 시계가 나왔다. 갈릴레이는 떨어지는 공의 <b>거리와 시간<\/b>을 재어 낙하 법칙을 찾았다 — III단원의 자유 낙하가 바로 그 유산이다. 측정 없이는 법칙도, 예측도, 기술도 없다.", "중학교에서 시간에 따른 위치 변화로 속력을 구한 것도 시간·공간 좌표 위의 과학이었다. 물리량의 대부분은 이 두 축에서 출발하며, 측정 도구를 사용해 양을 수치로 나타내는 활동인 {{㉢}}은 03에서 본격적으로 다룬다. II·III단원의 스펙트럼, 지진계, 힘-시간 그래프가 전부 측정 이야기였듯, 이 단원은 그 모든 것의 문법이다."], "terms": [{"k": "시간과 공간", "v": "자연 현상을 기술하는 가장 기본적인 두 축. 사건의 '언제'와 '어디서'에 해당하며, 물리량의 대부분이 이 둘에서 출발한다."}, {"k": "측정", "v": "측정 도구를 사용해 양을 수치로 나타내는 활동. 03(측정과 어림, 측정 표준)에서 본격적으로 다룬다."}, {"k": "측정의 역사", "v": "별의 위치 → 달력, 진자 → 시계, 낙하 거리·시간 → 낙하 법칙. 측정이 법칙·예측·기술을 낳았다."}], "myths": [{"x": "사건을 말로 묘사하면 과학적 기술이 된다.", "o": "<b>시간·공간의 좌표(수치)<\/b>가 붙어야 분석할 수 있는 대상이 된다."}, {"x": "법칙이 먼저 있고 측정은 그것을 확인하는 절차다.", "o": "갈릴레이의 낙하 법칙처럼 <b>측정이 법칙을 찾아냈다<\/b> — 측정 없이는 법칙도 없다."}], "point": "사건 = 언제(시간) + 어디서(공간). 자연의 모든 사건은 시간과 공간이라는 두 축 위에서 기술되며, 과학의 역사는 곧 측정의 역사다.", "answers": "정답 ㉠ 시간 ㉡ 달력 ㉢ 측정 — '측정은 법칙을 확인하는 절차일 뿐'으로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "시간", "㉡": "달력", "㉢": "측정"}, "warning": "'측정은 법칙을 확인하는 절차일 뿐'으로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "시간과 공간 — 날아가는 공에 '언제·어디서·얼마나'가 붙는 순간 과학이 시작된다", "file": "figures/1101-01.svg"}}, {"id": "1101-02", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1101", "lessonName": "자연을 재는 눈 — 시간과 공간", "no": "02", "title": "공간의 규모", "subtitle": "원자에서 우주까지", "steps": [{"n": "①", "t": "양 끝", "d": "원자핵 10<sup>−15<\/sup> m, 원자 10<sup>−10<\/sup> m … 관측 가능한 우주 약 <b>10<sup>26<\/sup> m<\/b>. 원자가 야구장이면 핵은 그 가운데의 콩알이다."}, {"n": "②", "t": "표기법", "d": "0을 스물여섯 개 쓰는 대신 <b>10의 {{㉠}}<\/b>으로 크기를 적는다. 지수 하나 차이가 10배 차이다."}, {"n": "③", "t": "규모와 도구", "d": "원자는 전자 현미경, 세포는 광학 현미경, 천체는 망원경 — 규모가 도구를 정한다."}], "howto": ["가로축은 크기이되 <b>한 칸이 10배<\/b>다(로그 눈금). 10<sup>26<\/sup>은 0이 스물여섯 개 붙은 큰 수, 10<sup>−15<\/sup>은 소수점 아래 0이 열네 개 붙은 작은 수다. 오른쪽으로 갈수록 크다.", "음수 지수의 대소에 주의한다. −15는 −10보다 작으므로 10<sup>−15<\/sup> m(원자핵)가 10<sup>−10<\/sup> m(원자)보다 <b>10만 배 작다<\/b>. 배수는 지수의 뺄셈이다: (−10) − (−15) = 5.", "사람(10<sup>0<\/sup> m = 1 m)이 사다리의 한가운데다. 왼쪽 원자까지 10<sup>10<\/sup>배, 오른쪽 지구까지 10<sup>7<\/sup>배 — 우리는 미시 세계와 거시 세계의 중간쯤에 서 있다.", "아래 띠는 그 규모를 보는 도구다. 원자·분자는 전자 현미경, 세포는 광학 현미경, 천체는 망원경 — 규모가 도구를 정한다."], "body": ["자연의 크기는 상상을 뛰어넘게 다양하다. 원자는 약 <b>10<sup>−10<\/sup> m<\/b>, 그 속의 원자핵은 <b>10<sup>−15<\/sup> m<\/b> — 원자가 잠실야구장이라면 핵은 그 가운데 놓인 콩알이다. 반대쪽 끝, 관측 가능한 우주의 크기는 약 <b>10<sup>26<\/sup> m<\/b>에 이른다. 이렇게 넓은 범위를 다루기 위해 과학은 <b>10의 거듭제곱<\/b>으로 크기를 표기한다.", "거듭제곱 표기의 진짜 힘은 <b>비교<\/b>에 있다. 사람(10<sup>0<\/sup> m ≈ 1 m)은 원자보다 {{㉡}}배 크고, 지구(10<sup>7<\/sup> m)보다 10<sup>7<\/sup>배 작다 — 우리는 미시 세계와 거시 세계의 중간쯤에 서서 양쪽을 관측하는 존재다. 배수는 지수의 뺄셈으로 구한다: 원자(10<sup>−10<\/sup>)는 원자핵(10<sup>−15<\/sup>)보다 10<sup>5<\/sup>배, 곧 10만 배 크다.", "각 규모마다 그 세계를 보는 도구도 다르다. 원자는 {{㉢}} 현미경으로, 세포는 광학 현미경으로, 별과 은하는 망원경으로 — 규모가 도구를 정한다. 크기 순서는 원자핵(10<sup>−15<\/sup>) < 원자(10<sup>−10<\/sup>) < 세포(10<sup>−5<\/sup>) < 사람(10<sup>0<\/sup>) < 지구(10<sup>7<\/sup>) < 우주(10<sup>26<\/sup>)로 정리한다. 지수가 클수록 크다 — 음수 지수의 대소에서 실수가 가장 많다."], "terms": [{"k": "10의 거듭제곱", "v": "10² = 100, 10⁻² = 0.01. 지수 하나 차이가 10배 차이다. 매우 크거나 작은 수를 지수 하나로 나타낸다."}, {"k": "공간의 규모", "v": "원자핵 10⁻¹⁵ m · 원자 10⁻¹⁰ m · 세포 10⁻⁵ m · 사람 10⁰ m · 지구 10⁷ m · 관측 가능한 우주 10²⁶ m."}, {"k": "규모와 도구", "v": "전자 현미경(원자·분자) → 광학 현미경(세포) → 맨눈 → 망원경(천체). 규모가 도구를 정한다."}], "myths": [{"x": "10<sup>−5<\/sup> m는 10<sup>−10<\/sup> m보다 작다.", "o": "−5가 −10보다 크므로 10<sup>−5<\/sup> m가 <b>10만 배 크다<\/b>. 지수가 클수록 크다."}, {"x": "원자핵은 원자와 비슷한 크기다.", "o": "원자핵은 원자 속에 있고 <b>10<sup>5<\/sup>배 작다<\/b> — 야구장 속의 콩알이다."}], "point": "공간의 규모는 10의 거듭제곱으로 적고, 지수가 클수록 크다. 원자 10<sup>−10<\/sup> m · 사람 10<sup>0<\/sup> m · 지구 10<sup>7<\/sup> m · 우주 10<sup>26<\/sup> m — 배수는 지수의 뺄셈이다.", "answers": "정답 ㉠ 거듭제곱 ㉡ 10¹⁰ ㉢ 전자 — '지수가 작을수록 크다'로 바꾼 선지, 음수 지수의 대소를 뒤집은 선지가 단골 오답이다.", "blanks": {"㉠": "거듭제곱", "㉡": "10¹⁰", "㉢": "전자"}, "warning": "'지수가 작을수록 크다'로 바꾼 선지, 음수 지수의 대소를 뒤집은 선지가 단골 오답이다.", "figure": {"caption": "공간 규모의 사다리 — 원자핵(10⁻¹⁵ m)에서 관측 가능한 우주(10²⁶ m)까지, 그리고 각 규모를 보는 도구", "file": "figures/1101-02.svg"}}, {"id": "1101-03", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1101", "lessonName": "자연을 재는 눈 — 시간과 공간", "no": "03", "title": "시간의 규모", "subtitle": "찰나에서 138억 년까지", "steps": [{"n": "①", "t": "양 끝", "d": "화학 결합이 생기고 끊어지는 데 약 10<sup>−15<\/sup>초(<b>펨토초<\/b>) … 우주의 나이 약 <b>138억 년<\/b>(10<sup>17<\/sup>초)."}, {"n": "②", "t": "우리의 창문", "d": "눈 깜박임 0.1초, 심장 1초, 1년 3 × 10<sup>7<\/sup>초. 사람이 체감하는 시간은 초에서 년 사이의 좁은 창문뿐이다."}, {"n": "③", "t": "재는 방법", "d": "초고속 현상은 레이저로 순간을 포착하고, 지질시대·우주는 {{㉠}}의 붕괴나 별빛 같은 자연의 시계를 읽는다."}], "howto": [], "body": ["시간의 사다리도 공간 못지않게 아찔하다. 화학 결합이 만들어지고 끊어지는 데는 약 <b>10<sup>−15<\/sup>초(펨토초)<\/b> — 눈 깜박임(약 0.1초)조차 이 세계에서는 영겁이다. 심장은 약 1초에 한 번 뛰고, 지구는 약 <b>3 × 10<sup>7<\/sup>초(1년)<\/b>에 태양을 한 바퀴 돈다. 그리고 가장 긴 끝에는 우주의 나이, 약 <b>138억 년(10<sup>17<\/sup>초)<\/b>이 있다 — II단원의 빅뱅이 바로 그 출발점이다.", "규모가 다르면 재는 방법도 다르다. 짧은 쪽 끝의 초고속 현상은 초정밀 {{㉡}}를 극히 짧게 쏘아 순간순간을 사진 찍듯 포착하고, 긴 쪽 끝의 지질시대와 우주의 역사는 <b>방사성 동위 원소의 붕괴<\/b>나 <b>별빛<\/b>처럼 자연이 남긴 시계를 읽어 알아낸다. 방사성 동위 원소는 일정한 빠르기로 붕괴하므로, 암석의 나이는 이 '시계'로 잰다.", "인간이 직접 체감하는 시간은 초에서 년 사이의 좁은 창문뿐이지만, 측정 기술은 그 창문을 짧은 쪽으로는 10<sup>−15<\/sup>초(펨토초)까지, 긴 쪽으로는 {{㉢}}초(우주의 나이)까지 넓혀 놓았다. 시험은 시간 규모를 측정 방법과 짝지어 묻는다 — 초고속 현상 ↔ 레이저, 지질시대·우주 ↔ 방사성 동위 원소·별빛. \"암석의 나이를 초시계로 잰다\"류의 엉뚱한 짝을 고르게 하는 선지가 미끼다."], "terms": [{"k": "펨토초", "v": "10⁻¹⁵초. 화학 결합이 생기고 끊어지는 시간 규모. 빛조차 1펨토초에 0.0003 mm밖에 못 간다."}, {"k": "자연의 시계", "v": "방사성 동위 원소는 일정한 빠르기로 붕괴한다 — 암석의 나이는 이 시계로 잰다. 별빛도 우주의 역사를 알려 주는 시계다."}, {"k": "시간의 규모", "v": "화학 반응 10⁻¹⁵초 · 눈 깜박임 0.1초 · 심장 1초 · 1년 ≈ 3 × 10⁷초 · 우주의 나이 138억 년(10¹⁷초)."}], "myths": [{"x": "화학 반응이 일어나는 시간은 눈 깜박임보다 길다.", "o": "약 10<sup>−15<\/sup>초로 <b>훨씬 짧다<\/b>. 눈 깜박임(0.1초)이 그 세계에서는 영겁이다."}, {"x": "우주의 나이는 약 138만 년이다.", "o": "약 <b>138억 년<\/b>이다. '만'과 '억'을 바꿔치기하는 선지에 속지 않는다."}], "point": "시간의 규모는 10<sup>−15<\/sup>초(화학 반응)에서 10<sup>17<\/sup>초(우주의 나이 138억 년)까지. 초고속 현상은 레이저로, 지질시대·우주는 방사성 동위 원소·별빛이라는 자연의 시계로 잰다.", "answers": "정답 ㉠ 방사성 동위 원소 ㉡ 레이저 ㉢ 10¹⁷ — '암석의 나이를 초시계로 잰다'처럼 규모와 측정법의 짝을 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "방사성 동위 원소", "㉡": "레이저", "㉢": "10¹⁷"}, "warning": "'암석의 나이를 초시계로 잰다'처럼 규모와 측정법의 짝을 바꾼 선지가 단골 오답이다.", "figure": {"caption": "시간 규모의 사다리 — 화학 반응의 찰나(10⁻¹⁵초)에서 우주의 나이(138억 년)까지, 그리고 각 규모를 재는 방법", "file": "figures/1101-03.svg"}}, {"id": "1101-04", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1101", "lessonName": "자연을 재는 눈 — 시간과 공간", "no": "04", "title": "1 m의 현대적 정의", "subtitle": "빛으로 길이를 재다", "steps": [{"n": "①", "t": "기준의 변천", "d": "몸(뼘·발·팔꿈치) → 백금 막대 <b>미터원기<\/b> → 빛. 막대는 닳고 온도에 따라 늘어난다."}, {"n": "②", "t": "현대의 1 m", "d": "빛이 {{㉠}}에서 1/299 792 458초 동안 나아간 거리. 우주 어디서나 변하지 않는 <b>빛의 속력<\/b>이 기준이다."}, {"n": "③", "t": "빛은 자이기도", "d": "레이저의 왕복 시간을 재면 거리 = 빛의 속력 × 시간 <b>÷ 2<\/b>. 달까지 약 38만 km를 mm 정밀도로 안다."}], "howto": [], "body": ["옛날의 길이 기준은 몸이었다 — 한 뼘, 한 발, 왕의 팔꿈치. 사람마다 달라 다툼이 끊이지 않자 인류는 백금 막대(<b>미터원기<\/b>)를 만들어 '이것이 1 m'라고 정했다. 그러나 막대는 닳고, 온도에 따라 늘어난다. 그래서 현대 과학은 우주 어디서나 절대 변하지 않는 것을 골랐다. <b>빛의 속력<\/b>이다. 오늘날 <b>1 m<\/b>는 빛이 진공에서 <b>1/299 792 458초<\/b> 동안 나아간 거리로 정의된다.", "빛은 기준일 뿐 아니라 <b>자(尺) 그 자체<\/b>이기도 하다. 레이저를 쏘아 반사되어 돌아오는 시간을 재면 '거리 = 빛의 속력 × 시간 ÷ {{㉡}}'로 먼 곳까지의 거리가 나온다. 아폴로 우주인들이 달에 놓고 온 반사경에 레이저를 쏘면 약 2.6초 만에 돌아오고, 그로부터 달까지 거리 약 38만 km가 밀리미터 수준의 정밀도로 측정된다. 건설 현장의 레이저 거리계, 자율주행차의 <b>라이다<\/b>도 같은 원리다.", "계산의 채점 포인트는 세 가지다. ① 왕복이므로 <b>÷2<\/b>, ② 10의 거듭제곱 계산, ③ m ↔ km 단위 환산. 빛의 속력은 정의된 {{㉢}}의 값이므로, 시간만 정확히 재면 거리도 그만큼 정확해진다 — 길이 측정의 현대적 방법은 결국 <b>시간 측정<\/b>이다."], "terms": [{"k": "빛의 속력", "v": "진공에서 299 792 458 m/s — 자연의 최고 속력이자 불변의 기준. 1 m의 정의는 이 값 위에 서 있다."}, {"k": "미터원기", "v": "과거의 1 m 기준이었던 백금 막대. 닳거나 온도에 따라 변형될 수 있어 빛으로 기준을 바꾸었다."}, {"k": "라이다(LiDAR)", "v": "레이저를 쏘아 반사 시간으로 주변의 거리를 재는 장치. 자율주행차의 눈이다."}], "myths": [{"x": "1 m는 지금도 미터원기의 길이로 정의된다.", "o": "과거의 방식이다. 현대의 핵심어는 <b>빛 · 진공 · 1/299 792 458초<\/b>다."}, {"x": "레이저 왕복 시간 2.56초에 빛의 속력을 곱하면 달까지의 거리다.", "o": "왕복이므로 반드시 <b>÷2<\/b> — 편도 1.28초로 계산한다. 이 유형 최대의 함정이다."}], "point": "1 m = 빛이 진공에서 1/299 792 458초 동안 나아간 거리. 빛은 기준이자 자다 — 거리 = 빛의 속력 × 시간 ÷ 2(왕복). 정확한 시간이 정확한 길이가 된다.", "answers": "정답 ㉠ 진공 ㉡ 2 ㉢ 불변 — '÷2를 빠뜨린 값'과 '미터원기로 정의된다'가 단골 오답이다.", "blanks": {"㉠": "진공", "㉡": "2", "㉢": "불변"}, "warning": "'÷2를 빠뜨린 값'과 '미터원기로 정의된다'가 단골 오답이다.", "figure": {"caption": "길이의 현대적 측정 — 정의도 빛, 도구도 빛이다. 왕복 시간을 재면 달까지의 거리가 나온다", "file": "figures/1101-04.svg"}}, {"id": "1101-05", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1101", "lessonName": "자연을 재는 눈 — 시간과 공간", "no": "05", "title": "1초의 현대적 정의", "subtitle": "원자가 시계가 되다", "steps": [{"n": "①", "t": "기준의 변천", "d": "지구의 자전(하루)을 쪼개 1초를 정했지만 자전은 미세하게 흔들린다. 가장 한결같은 진자는 <b>원자<\/b>였다."}, {"n": "②", "t": "현대의 1초", "d": "{{㉠}} 원자가 내는 빛이 9 192 631 770번 진동하는 데 걸리는 시간. 원자시계는 수천만 년에 1초도 어긋나지 않는다."}, {"n": "③", "t": "GPS", "d": "위성의 원자시계 신호가 도착한 <b>시간 차<\/b> × 빛의 속력 = 거리 → 내 위치. 정확한 시간이 곧 정확한 공간이다."}], "howto": [], "body": ["시간의 기준도 같은 길을 걸었다. 처음엔 지구의 자전(하루)을 쪼개 1초를 정했지만, 지구의 자전은 미세하게 흔들린다. 현대 과학이 찾아낸 가장 한결같은 진자는 <b>원자<\/b>였다. 세슘 원자는 특정한 빛을 흡수·방출하며 정확히 같은 진동을 반복한다. 오늘날 <b>1초<\/b>는 세슘 원자가 내는 빛이 <b>9 192 631 770번<\/b> 진동하는 데 걸리는 시간으로 정의된다. 이 <b>원자시계<\/b>는 수천만 년이 지나도 1초도 어긋나지 않는다.", "이 초정밀 시계가 일상을 바꾼 대표가 내비게이션(<b>GPS<\/b>)이다. 위성들은 저마다 원자시계를 싣고 시각 신호를 쏘는데, 수신기는 여러 위성 신호의 <b>도착 시간 차이<\/b>에 {{㉡}}을 곱해 각 위성까지의 거리를 구하고, 그로부터 내 위치를 계산한다. 시간 오차가 100만분의 1초만 나도 위치는 {{㉢}} m나 틀어진다 — 정확한 시간이 곧 정확한 공간이 되는 것이다.", "길이의 기준이 몸 → 미터원기 → 빛으로, 시간의 기준이 지구의 자전 → 세슘 원자의 진동으로 옮겨 온 방향은 하나다. <b>누가 언제 재도 같을 것<\/b> — 기준은 점점 '변하지 않는 자연 현상' 쪽으로 진화했다. 같은 종류의 원자는 어디서나 같은 진동수를 가지므로 표준이 될 수 있었다. 시간과 공간의 측정은 이렇게 하나로 만난다."], "terms": [{"k": "세슘(Cs)", "v": "주기율표 1족의 알칼리 금속. 특정한 빛을 흡수·방출하며 정확히 같은 진동을 반복한다 — 원자시계의 심장."}, {"k": "원자시계", "v": "세슘 원자의 진동 9 192 631 770번을 1초로 삼는 시계. 수천만 년에 1초도 어긋나지 않는다."}, {"k": "GPS", "v": "위성의 원자시계 신호가 도착한 시간 차 × 빛의 속력 = 거리 → 위치. 빛은 100만분의 1초에 약 300 m를 간다."}], "myths": [{"x": "1초의 기준은 지금도 지구의 자전이다.", "o": "자전은 흔들려서 <b>세슘 원자의 진동<\/b>으로 바꾸었다."}, {"x": "세슘 원자의 진동수는 시계마다 달라서 표준이 될 수 없다.", "o": "같은 종류의 원자는 어디서나 <b>같은 진동수<\/b>를 가진다 — 그래서 표준이 되었다."}], "point": "1초 = 세슘 원자의 진동 9 192 631 770번. GPS는 시간 차 × 빛의 속력으로 공간을 잰다. 기준은 몸·물체에서 변하지 않는 자연 현상(빛·원자)으로 옮겨 왔다.", "answers": "정답 ㉠ 세슘 ㉡ 빛의 속력 ㉢ 300 — '원자시계는 하루에 1초씩 오차가 쌓인다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "세슘", "㉡": "빛의 속력", "㉢": "300"}, "warning": "'원자시계는 하루에 1초씩 오차가 쌓인다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "시간의 현대적 측정 — 세슘 원자의 진동이 1초를 정하고, 그 위에 GPS가 서 있다", "file": "figures/1101-05.svg"}}, {"id": "1102-01", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1102", "lessonName": "기본량과 단위", "no": "01", "title": "단위의 힘", "subtitle": "숫자만으로는 부족하다", "steps": [{"n": "①", "t": "수치 + 단위", "d": "\"3만큼 가서 5만큼 기다려\"는 실행할 수 없다. 3 m인지 3 km인지가 빠졌다. 측정값은 반드시 <b>수치 + 단위<\/b>의 짝으로 쓴다."}, {"n": "②", "t": "단위란", "d": "'무엇을 기준으로 몇 배인가'를 알려 주는 {{㉠}}. 이것이 있어야 측정이 소통이 된다."}, {"n": "③", "t": "약속이 어긋나면", "d": "1999년 NASA 화성 기후 궤도선 — 한 팀은 뉴턴, 다른 팀은 파운드힘. 숫자는 맞았지만 단위가 달라 탐사선을 잃었다."}], "howto": [], "body": ["\"3만큼 가서 5만큼 기다려.\"라는 지시는 실행할 수 없다. 3 m인지 3 km인지, 5초인지 5분인지가 빠졌기 때문이다. 측정값은 반드시 <b>수치 + 단위<\/b>의 짝으로 쓴다. <b>단위<\/b>는 '무엇을 기준으로 몇 배인가'를 알려 주는 약속이며, 이 약속이 있어야 측정이 소통이 된다. 길이·질량·시간처럼 측정할 수 있는 자연의 양을 <b>물리량<\/b>이라 하고, 모든 물리량은 수치와 단위로 쓴다.", "약속이 어긋나면 대가는 혹독하다. 1999년 미국 항공우주국(NASA)의 <b>화성 기후 궤도선<\/b>은 화성에 도착하자마자 실종됐다. 조사 결과, 한 팀은 힘의 크기를 미터법 단위({{㉡}} 기준)로, 다른 팀은 야드파운드법 단위(파운드힘 기준)로 계산해 주고받은 것이 원인이었다. 1파운드힘 ≈ 4.45뉴턴 — 추진력이 약 {{㉢}}배 어긋난 채 항법 계산이 누적되었고, 탐사선은 예정보다 화성에 너무 가깝게 진입해 파괴된 것으로 추정된다.", "수치 계산은 양쪽 다 정확했다. 틀린 것은 딱 하나, 단위의 약속이었다. 0이 몇 개씩 차이 나는 실수와 달리 단위 혼동은 언뜻 그럴듯한 크기의 숫자가 오가므로 티가 잘 나지 않는다 — 그래서 더 위험하다. 재발을 막는 방법은 계산서에 단위를 반드시 함께 쓰고, 주고받는 데이터의 단위를 계약처럼 명시하는 것이다. 단위는 형식이 아니라 <b>안전장치<\/b>이며, 과학의 문법이다."], "terms": [{"k": "물리량", "v": "길이·질량·시간처럼 측정할 수 있는 자연의 양. 모든 물리량은 수치와 단위로 쓴다."}, {"k": "단위", "v": "'무엇을 기준으로 몇 배인가'를 알려 주는 약속. 측정값 = 수치 + 단위."}, {"k": "미터법과 야드파운드법", "v": "세계 대부분은 미터법(SI)을 쓰지만 일부 국가는 야드·파운드를 병용한다 — 혼용이 사고를 부른다."}], "myths": [{"x": "화성 기후 궤도선 사고의 원인은 계산 실수였다.", "o": "계산은 정확했다. <b>단위의 약속<\/b>(뉴턴 ↔ 파운드힘)이 어긋난 것이 원인이다."}, {"x": "단위는 답안의 형식일 뿐, 수치가 맞으면 된다.", "o": "단위 없는 숫자는 과학이 아니다. 단위는 <b>안전장치<\/b>다."}], "point": "측정값 = 수치 + 단위. 단위는 '기준의 몇 배'라는 약속이며, 약속이 어긋나면 숫자가 맞아도 우주선이 떨어진다(화성 기후 궤도선, 뉴턴 ↔ 파운드힘 4.45배).", "answers": "정답 ㉠ 약속 ㉡ 뉴턴 ㉢ 4.45 — '계산 실수가 원인'으로 바꾼 선지가 단골 오답이다(원인은 단위 혼동).", "blanks": {"㉠": "약속", "㉡": "뉴턴", "㉢": "4.45"}, "warning": "'계산 실수가 원인'으로 바꾼 선지가 단골 오답이다(원인은 단위 혼동).", "figure": {"caption": "단위의 힘 — 1999년 화성 기후 궤도선. 한 팀은 파운드힘, 한 팀은 뉴턴으로 계산해 탐사선이 너무 낮게 진입했다", "file": "figures/1102-01.svg"}}, {"id": "1102-02", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1102", "lessonName": "기본량과 단위", "no": "02", "title": "국제단위계의 기본량", "subtitle": "자연의 알파벳 일곱 글자", "steps": [{"n": "①", "t": "기본량", "d": "다른 양으로부터 유도되지 않고 <b>그 자체로 정의되는 양<\/b>. 물리량의 세계에서 가장 기본이 되는 재료다."}, {"n": "②", "t": "SI의 7가지", "d": "길이(m) · 질량(kg) · 시간(s) · 전류(A) · 온도(K) · {{㉠}}(mol) · 광도(cd). 각각에 기본단위가 있다."}, {"n": "③", "t": "왜 알파벳인가", "d": "세상의 모든 물리량이 이 일곱의 <b>조합<\/b>으로 표현된다 — 자음과 모음 몇 개로 모든 단어를 쓰듯이."}], "howto": [], "body": ["수많은 물리량을 제각각 정의하면 끝이 없다. 그래서 과학은 물리량의 세계에서 가장 기본이 되는 재료를 골라냈다. <b>기본량<\/b> — 다른 양으로부터 유도되지 않고 그 자체로 정의되는 양이다. <b>국제단위계(SI)<\/b>는 길이(m) · 질량(kg) · 시간(s) · 전류(A) · 온도(K) · 물질량(mol) · 광도(cd)의 <b>7가지<\/b>를 기본량으로 정하고, 각각에 기본단위를 부여했다.", "일곱 개의 낯익은 얼굴들을 보라. 길이와 시간은 01에서 만났고, 물질량(mol)은 화학에서, 온도(K)와 전류(A)는 물리에서 계속 만나게 된다. 이 일곱이 자연의 '알파벳'인 이유는 단순하다 — 세상의 모든 물리량이 이 일곱 가지의 {{㉡}}으로 표현되기 때문이다. 마치 자음과 모음 몇 개로 모든 단어를 쓰듯이. 2019년부터 SI의 모든 기본단위는 빛의 속력·플랑크 상수 같은 '자연의 상수'에 붙들어 정의된다 — 03에서 다시 만난다.", "시험에서 \"다음 중 기본량이 아닌 것은?\" 유형에는 속도·부피·밀도·힘이 미끼로 나온다 — 전부 유도량이다. 그리고 질량의 기본단위는 g이 아니라 {{㉢}}이라는 점도 단골 함정이다. 일곱 개는 단위로 외운다: m · kg · s · A · K · mol · cd. 목록이 입에 붙으면 '기본량 아닌 것 고르기'는 자동으로 풀린다."], "terms": [{"k": "기본량", "v": "다른 양으로부터 유도되지 않고 그 자체로 정의되는 양. SI에서는 길이·질량·시간·전류·온도·물질량·광도의 7가지."}, {"k": "국제단위계(SI)", "v": "전 세계가 함께 쓰기로 약속한 단위 체계. 과학·산업·무역의 공용어다. 기본단위: m · kg · s · A · K · mol · cd."}, {"k": "기본량의 정의", "v": "2019년부터 SI의 모든 기본단위는 빛의 속력·플랑크 상수 같은 '자연의 상수'에 붙들어 정의된다(03에서 다시 만난다)."}], "myths": [{"x": "속도는 SI 기본량 중 하나다.", "o": "속도는 길이와 시간에서 유도되는 <b>유도량<\/b>이다. 기본량은 딱 7개."}, {"x": "질량의 SI 기본단위는 g이다.", "o": "<b>kg<\/b>이다. 기본단위 중 유일하게 접두어(k)가 붙은 채로 정의된다."}], "point": "SI 기본량 7가지 = 길이 m · 질량 kg · 시간 s · 전류 A · 온도 K · 물질량 mol · 광도 cd. 모든 물리량은 이 일곱의 조합이며, 속도·부피·밀도·힘은 유도량이다.", "answers": "정답 ㉠ 물질량 ㉡ 조합 ㉢ kg — 속도·밀도·힘을 기본량에 끼워 넣은 선지, 질량 단위를 g으로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "물질량", "㉡": "조합", "㉢": "kg"}, "warning": "속도·밀도·힘을 기본량에 끼워 넣은 선지, 질량 단위를 g으로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "SI 기본량과 기본단위 — 실험대 위의 일곱 가지 도구, 일곱 개면 자연을 다 쓴다", "file": "figures/1102-02.svg"}}, {"id": "1102-03", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1102", "lessonName": "기본량과 단위", "no": "03", "title": "유도량과 유도단위", "subtitle": "조합의 기술", "steps": [{"n": "①", "t": "유도량", "d": "기본량을 곱하고 나누어 정의되는 양. 속도 = 길이 ÷ 시간, 부피 = 길이 × 길이 × 길이, 밀도 = 질량 ÷ 부피."}, {"n": "②", "t": "단위 = 정의의 요약본", "d": "속도 m/s, 부피 m<sup>3<\/sup>, 밀도 {{㉠}}. 단위를 보면 그 양이 어떻게 만들어졌는지 보인다."}, {"n": "③", "t": "이름 붙은 별명", "d": "힘 N(뉴턴) = kg·m/s<sup>2<\/sup>, 에너지 J, 일률 W. 별명이 있어도 정체는 <b>기본단위의 조합<\/b>이다."}], "howto": [], "body": ["기본량을 곱하고 나누면 새로운 물리량이 태어난다. 이렇게 <b>기본량의 조합으로 정의되는 양<\/b>이 <b>유도량<\/b>이다. 속도는 거리(길이)를 시간으로 나눈 것이니 단위도 그대로 <b>m/s<\/b>가 되고, 부피는 길이를 세 번 곱해 <b>m<sup>3<\/sup><\/b>, 밀도는 질량을 부피로 나눠 <b>kg/m<sup>3<\/sup><\/b>가 된다. 단위를 보면 그 양이 어떻게 만들어졌는지가 보인다 — 단위는 정의의 요약본이다.", "III단원에서 만난 양들을 다시 보자. 운동량의 단위 kg·m/s는 '질량 × 속도'라는 정의를 그대로 읽은 것이고, 힘의 단위 <b>뉴턴(N)<\/b>도 풀어 쓰면 {{㉡}}이다. 이렇게 자주 쓰는 유도단위에는 과학자의 이름을 붙인 별명(N, J, W 등)을 주기도 한다. 별명이 있어도 정체는 언제나 <b>기본단위의 조합<\/b>이다.", "단위는 검산 도구이기도 하다. 공식이 헷갈리면 단위를 계산해 보라 — 양변의 단위가 다르면 그 식은 무조건 틀렸다. 밀도는 질량을 부피로 나눈 {{㉢}}이지 기본량이 아니며, 속도·부피·힘도 마찬가지다. '기본량 아닌 것 고르기'는 결국 '조합으로 만들어진 것 찾기'다."], "terms": [{"k": "유도량", "v": "기본량의 조합(곱·나눗셈)으로 정의되는 양. 속도 m/s · 부피 m³ · 밀도 kg/m³ · 힘 N(= kg·m/s²)."}, {"k": "이름 붙은 유도단위", "v": "힘 N(뉴턴), 에너지 J(줄), 일률 W(와트) — 편의상의 별명일 뿐, 정체는 기본단위의 조합이다."}, {"k": "단위 검산법", "v": "공식이 헷갈리면 단위를 계산해 본다 — 양변의 단위가 다르면 그 식은 무조건 틀렸다."}], "myths": [{"x": "밀도는 기본량이다.", "o": "질량 ÷ 부피로 만든 <b>유도량<\/b>이다(kg/m<sup>3<\/sup>)."}, {"x": "힘의 단위 N은 기본단위로 나타낼 수 없는 독립된 단위다.", "o": "N = <b>kg·m/s<sup>2<\/sup><\/b> — 별명일 뿐 기본단위의 조합이다."}], "point": "유도량 = 기본량의 조합. 속도 m/s · 부피 m<sup>3<\/sup> · 밀도 kg/m<sup>3<\/sup> · 힘 N = kg·m/s<sup>2<\/sup>. 단위가 곧 정의이고, 단위가 다르면 식이 틀린 것이다.", "answers": "정답 ㉠ kg/m³ ㉡ kg·m/s² ㉢ 유도량 — 'N은 기본단위'로 바꾼 선지, 밀도·속도를 기본량에 넣은 선지가 단골 오답이다.", "blanks": {"㉠": "kg/m³", "㉡": "kg·m/s²", "㉢": "유도량"}, "warning": "'N은 기본단위'로 바꾼 선지, 밀도·속도를 기본량에 넣은 선지가 단골 오답이다.", "figure": {"caption": "유도량 — 기본량 m · kg · s를 곱하고 나누어 속도 · 부피 · 밀도 · 힘이 만들어진다. 단위가 곧 정의다", "file": "figures/1102-03.svg"}}, {"id": "1102-04", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1102", "lessonName": "기본량과 단위", "no": "04", "title": "접두어", "subtitle": "크기에 맞는 옷", "steps": [{"n": "①", "t": "접두어", "d": "단위 앞에 붙어 크기를 조절하는 말. 킬로(k) 10<sup>3<\/sup>배, 밀리(m) 10<sup>−3<\/sup>배 — 1 km = 1000 m, 1 mm = 0.001 m."}, {"n": "②", "t": "사다리", "d": "n(10<sup>−9<\/sup>) → μ(10<sup>−6<\/sup>) → m(10<sup>−3<\/sup>) → 기준 → k(10<sup>3<\/sup>) → M(10<sup>6<\/sup>) → G(10<sup>9<\/sup>). 한 칸 = {{㉠}}배."}, {"n": "③", "t": "규모에 맞는 옷", "d": "세균 2 μm, 반도체 선폭 몇 nm, 데이터 GB. '나노 기술'은 10<sup>−9<\/sup> m 규모를 다루는 기술이라는 뜻이다."}], "howto": [], "body": ["단위 앞에 붙어 크기를 조절하는 말이 <b>접두어<\/b>다. 킬로(k)는 10<sup>3<\/sup>배, 밀리(m)는 10<sup>−3<\/sup>배 — 그래서 1 km는 1000 m, 1 mm는 0.001 m다. 더 작은 쪽으로 마이크로(μ, 10<sup>−6<\/sup>)와 나노(n, 10<sup>−9<\/sup>)가, 더 큰 쪽으로 메가(M, 10<sup>6<\/sup>)와 기가(G, 10<sup>9<\/sup>)가 있다. 01에서 배운 10의 거듭제곱에 이름을 붙인 것이라 보면 정확하다.", "접두어는 규모에 맞는 옷이다. 세균의 크기는 0.000002 m라 쓰는 대신 <b>2 μm<\/b>로, 반도체 회로 선폭은 몇 nm로, 데이터 용량은 GB(기가바이트)로 쓴다. '<b>나노 기술<\/b>'이라는 이름 자체가 {{㉡}} m 규모 — 원자 몇십 개 크기의 세계를 다루는 기술이라는 뜻이다. II단원의 그래핀처럼 나노 세계의 신소재가 첨단 기술의 앞줄에 선 이유도, 그 규모에서 물질이 새로운 성질을 드러내기 때문이다.", "환산 문제의 급소는 지수의 <b>부호<\/b>다 — 1 nm = 10<sup>−9<\/sup> m이지 10<sup>9<\/sup> m가 아니다. \"2 μm = 몇 m?\"처럼 접두어 → 거듭제곱 변환은 기계적으로 한다: 2 × 10<sup>−6<\/sup> m. 의료 현장에서 단위를 두 번 확인하는 이유도 여기 있다 — 의약품 용량의 mg(10<sup>−3<\/sup> g)과 μg은 접두어 한 칸, 곧 {{㉢}}배 차이다."], "terms": [{"k": "접두어", "v": "단위 앞에 붙어 크기를 조절하는 말. n(10⁻⁹) · μ(10⁻⁶) · m(10⁻³) · k(10³) · M(10⁶) · G(10⁹). 한 칸 = 1000배."}, {"k": "나노 기술", "v": "10⁻⁹ m 규모에서 물질을 다루는 기술 — 그래핀, 반도체 미세 공정, 나노 약물 전달."}, {"k": "처방전의 mg", "v": "의약품 용량은 밀리그램(10⁻³ g) 단위 — 접두어 하나 착오가 1000배 차이를 만든다."}], "myths": [{"x": "1 nm는 10<sup>9<\/sup> m이다.", "o": "나노는 작은 쪽 — <b>10<sup>−9<\/sup> m<\/b>다. 지수의 부호가 급소다."}, {"x": "접두어 한 칸(m ↔ μ)은 10배 차이다.", "o": "<b>1000배<\/b> 차이다. mg과 μg을 혼동하면 용량이 1000배 틀어진다."}], "point": "접두어 = 10의 거듭제곱에 붙인 이름. n → μ → m → (기준) → k → M → G, 한 칸 = 1000배. 환산은 지수 부호부터 — 1 nm = 10<sup>−9<\/sup> m.", "answers": "정답 ㉠ 1000 ㉡ 10⁻⁹ ㉢ 1000 — 'nm = 10⁹ m'처럼 지수 부호를 뒤집은 선지가 단골 오답이다.", "blanks": {"㉠": "1000", "㉡": "10⁻⁹", "㉢": "1000"}, "warning": "'nm = 10⁹ m'처럼 지수 부호를 뒤집은 선지가 단골 오답이다.", "figure": {"caption": "접두어의 사다리 — 반도체 선폭(nm)에서 산(km)·데이터(GB)까지, 규모에 맞는 옷을 골라 입는다", "file": "figures/1102-04.svg"}}, {"id": "1102-05", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1102", "lessonName": "기본량과 단위", "no": "05", "title": "생활 속의 단위", "subtitle": "단위는 매일 우리를 판정하고 보호한다", "steps": [{"n": "①", "t": "일상은 단위의 세계", "d": "도로의 km/h, 처방전의 mg, 식품의 g·kcal, 혈압 mmHg, 기온 ℃, 강수량 mm, 전기 요금 kWh."}, {"n": "②", "t": "관용 단위", "d": "℃는 K에서, kcal는 {{㉠}}에서 환산되는 관용 단위. 편리해서 남아 있지만 최종 기준은 언제나 SI다."}, {"n": "③", "t": "같은 자", "d": "같은 단위 체계를 쓴다는 것은 전 세계가 <b>같은 자로 재고 같은 언어로 말한다<\/b>는 뜻. 그 자를 지키는 장치가 03의 측정 표준이다."}], "howto": [], "body": ["단위는 교과서 밖에서 더 바쁘다. 도로 표지판의 <b>km/h<\/b>는 속도위반의 기준이 되고, 처방전의 <b>mg<\/b>은 약효와 부작용의 경계가 되며, 식품 포장의 <b>g과 kcal<\/b>는 영양 관리의 잣대가 된다. 병원의 혈압(mmHg), 날씨의 기온(℃)과 강수량(mm), 전기 요금 고지서의 kWh — 일상은 온통 단위로 기술되고, 단위로 관리된다.", "생활 단위 중에는 SI 기본단위가 아닌 것도 많다. ℃는 {{㉡}}에서, kcal는 J에서 환산되는 <b>관용 단위<\/b>다. 편리해서 남아 있지만, 과학·산업의 최종 기준은 언제나 SI다. kWh는 일률(kW)에 시간(h)을 곱한 에너지의 단위로, 전기 요금은 '에너지를 얼마나 썼나'로 매긴다.", "국가 간 무역에서 저울이, 병원 간 이송에서 검사 수치가, 나라마다 다르면 어떻게 되겠는가 — <b>같은 단위 체계를 쓴다는 것<\/b>은 전 세계가 같은 자로 재고 같은 언어로 말한다는 뜻이다. 그 '같은 자'를 지키는 장치가 다음 소단원의 주제, {{㉢}}이다. 오늘 하루 눈에 띄는 단위를 기본단위의 조합으로 풀어 보면(kWh = kW × h = 에너지) 유도량 개념이 저절로 정리된다."], "terms": [{"k": "관용 단위", "v": "℃(온도), kcal(에너지), L(부피)처럼 SI는 아니지만 널리 쓰이는 단위 — 모두 SI로 환산된다."}, {"k": "kWh", "v": "일률(kW)에 시간(h)을 곱한 에너지의 단위 — 전기 요금은 '에너지를 얼마나 썼나'로 매긴다."}, {"k": "같은 자", "v": "전 세계가 같은 단위 체계(SI)를 쓰기에 과학·무역·의료가 통한다. 그 자를 지키는 장치가 측정 표준(03)이다."}], "myths": [{"x": "℃와 kcal는 SI 기본단위다.", "o": "K·J에서 환산되는 <b>관용 단위<\/b>다. 기본단위는 m·kg·s·A·K·mol·cd뿐이다."}, {"x": "나라마다 단위가 달라도 환산만 하면 문제없다.", "o": "환산 과정의 혼동이 화성 궤도선을 떨어뜨렸다. <b>같은 자<\/b>를 쓰는 것이 과학·무역·의료의 전제다."}], "point": "일상은 단위의 세계(km/h · mg · kcal · mmHg · ℃ · kWh)이고, 관용 단위의 뿌리도 SI다. 같은 자 = 통하는 세계 — 그 자를 지키는 것이 측정 표준이다.", "answers": "정답 ㉠ J(줄) ㉡ K(켈빈) ㉢ 측정 표준 — '℃·kcal는 SI 기본단위'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "J(줄)", "㉡": "K(켈빈)", "㉢": "측정 표준"}, "warning": "'℃·kcal는 SI 기본단위'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "생활 속의 단위 — 표지판 · 처방전 · 식품 · 혈압계 · 일기예보 · 전기 고지서, 그리고 그 뿌리인 SI", "file": "figures/1102-05.svg"}}, {"id": "1103-01", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1103", "lessonName": "측정과 어림, 측정 표준", "no": "01", "title": "측정", "subtitle": "도구로 자연에 숫자를 붙이다", "steps": [{"n": "①", "t": "측정이란", "d": "적절한 <b>도구<\/b>를 사용해 물리량을 수치와 단위로 나타내는 활동. 도구의 눈금이 기준(단위)과의 비교를 대신해 준다."}, {"n": "②", "t": "완벽한 측정은 없다", "d": "같은 물체를 같은 자로 재도 읽는 각도·눈금 한계·온도에 따라 값이 조금씩 다르다. 참값과 측정값의 차이가 {{㉠}}다."}, {"n": "③", "t": "줄이는 법", "d": "없앨 수는 없지만 <b>더 정밀한 도구<\/b>와 <b>여러 번의 반복 측정·평균<\/b>으로 줄인다. 과학이 같은 실험을 수십 번 반복하는 이유다."}], "howto": [], "body": ["<b>측정<\/b>은 적절한 도구를 사용해 물리량을 수치와 단위로 나타내는 활동이다. 자로 길이를, 저울로 질량을, 온도계로 체온을 — 도구가 눈금이라는 형태로 기준(단위)과의 비교를 대신해 준다. 과학 탐구의 데이터도, 병원의 진단도, 시장의 거래도 모두 측정에서 시작된다.", "기억할 것 하나 — <b>완벽한 측정은 없다<\/b>. 같은 물체를 같은 자로 재도 읽는 각도, 도구의 눈금 한계, 온도 변화에 따라 값이 조금씩 달라진다. 참값과 측정값의 이 차이가 <b>오차<\/b>다. 오차는 없앨 수 없지만 더 정밀한 도구와 여러 번의 {{㉡}} 측정으로 줄일 수는 있다. 과학이 같은 실험을 수십 번 반복하고 평균을 내는 이유가 여기에 있다.", "도구가 정밀할수록 오차의 방은 좁아진다. 줄자 → 버니어 캘리퍼스 → 레이저 간섭계 — 눈금이 {{㉢}}수록 눈금 사이를 어림해야 하는 폭이 줄어든다. 실험 시간에 세 번 재서 평균을 내라는 지시는 귀찮은 형식이 아니라, 오차와 싸우는 과학의 정식 무기다."], "terms": [{"k": "측정", "v": "적절한 도구를 사용해 물리량을 수치와 단위로 나타내는 활동. 도구의 눈금이 기준(단위)과의 비교를 대신한다."}, {"k": "오차", "v": "참값과 측정값의 차이. 도구의 한계·읽기 방식·환경 때문에 언제나 존재한다."}, {"k": "정밀한 도구", "v": "줄자 → 버니어 캘리퍼스 → 레이저 간섭계 — 눈금이 촘촘할수록 오차의 방이 좁아진다."}], "myths": [{"x": "좋은 도구로 정확히 재면 오차는 0이 된다.", "o": "오차는 <b>없앨 수 없다<\/b>. 정밀한 도구와 반복·평균으로 <b>줄일<\/b> 뿐이다."}, {"x": "세 번 재서 평균 내는 것은 형식적인 절차다.", "o": "반복 측정과 평균은 오차를 줄이는 <b>과학의 정식 방법<\/b>이다."}], "point": "측정 = 도구로 물리량을 수치 + 단위로 나타내기. 오차(참값과 측정값의 차이)는 0이 되지 않으며, 정밀한 도구와 반복·평균으로 줄인다.", "answers": "정답 ㉠ 오차 ㉡ 반복 ㉢ 촘촘할 — '정밀한 도구를 쓰면 오차가 0이 된다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "오차", "㉡": "반복", "㉢": "촘촘할"}, "warning": "'정밀한 도구를 쓰면 오차가 0이 된다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "측정과 오차 — 재는 순간 오차도 함께 태어난다. 반복해서 평균을 내는 것이 오차와 싸우는 과학의 정식 무기다", "file": "figures/1103-01.svg"}}, {"id": "1103-02", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1103", "lessonName": "측정과 어림, 측정 표준", "no": "02", "title": "어림", "subtitle": "재지 않고도 헤아리는 지혜", "steps": [{"n": "①", "t": "어림이란", "d": "도구 없이, 또는 정확히 잴 수 없는 상황에서 <b>경험과 지식<\/b>으로 양을 대략적으로 헤아리는 것. 빠르게 '규모'를 잡아 판단하게 한다."}, {"n": "②", "t": "세 걸음", "d": "큰 문제를 아는 조각으로 <b>쪼개고<\/b>, 조각마다 합리적인 값을 <b>대입하고<\/b>, <b>곱한다<\/b>. 이런 계산의 달인 페르미의 이름을 따 '{{㉠}} 추정'이라 한다."}, {"n": "③", "t": "목표는 자릿수", "d": "실험 전에 예상값의 규모를 잡고, 결과가 말이 되는 값인지 <b>검산<\/b>한다. 어림과 100배 다르면 틀린 쪽은 대개 계산기 입력이다."}], "howto": [], "body": ["도구 없이, 또는 정확히 잴 수 없는 상황에서 경험과 지식으로 양을 대략적으로 헤아리는 것이 <b>어림<\/b>이다. 소풍에 물이 몇 병 필요할지, 태풍으로 대피할 인원이 얼마일지, 공사에 자재가 얼마나 들지 — 정밀한 측정이 불가능하거나 필요 이상일 때, 어림은 빠르게 '규모'를 잡아 판단을 가능하게 한다.", "어림은 대충이 아니라 <b>전략<\/b>이다. 큰 문제를 아는 조각으로 쪼개고, 조각마다 합리적인 값을 넣어 곱하는 것 — 물리학자 엔리코 페르미는 이런 계산의 달인이라 '페르미 추정'이라는 이름이 남았다. 과학 현장에서도 어림은 실험 전에 예상값의 규모를 잡고, 측정 결과가 말이 되는 값인지 {{㉡}}하는 데 쓰인다. 계산기가 내놓은 답이 어림한 규모와 100배 다르면, 틀린 쪽은 대개 계산기 입력이다.", "측정과 어림의 구분이 시험의 단골이다 — 도구·눈금으로 수치화하면 측정, 경험·지식으로 대략 헤아리면 어림. 어림 문제의 채점 기준은 답의 일치가 아니라 <b>과정의 합리성<\/b>이다: ① 곱셈 구조로 쪼갰는가 ② 대입한 값이 상식적인가 ③ {{㉢}}가 맞는가. 셋을 갖추면 값이 2~3배 달라도 정답이다. 어림과 측정은 경쟁자가 아니라 역할 분담이다."], "terms": [{"k": "어림", "v": "도구 없이, 또는 정확히 잴 수 없을 때 경험과 지식으로 양을 대략적으로 헤아리는 것. 목표는 자릿수(규모)다."}, {"k": "페르미 추정", "v": "큰 문제를 쪼개 각 조각에 합리적 값을 넣어 곱하는 어림법. 면접·재난 대비에도 쓰인다."}, {"k": "어림이 유용한 순간", "v": "정밀 측정이 불가능할 때(태풍 피해 예측), 불필요할 때(장보기), 검산할 때(실험값 확인)."}], "myths": [{"x": "어림은 부정확하므로 과학 탐구에서는 쓰이지 않는다.", "o": "규모 판단과 <b>검산<\/b>에 필수다. 실험 전 예상값의 규모를 잡는 것이 어림이다."}, {"x": "어림 문제는 정답 숫자와 정확히 맞아야 한다.", "o": "채점 기준은 <b>과정의 합리성과 자릿수<\/b>다. 값이 2~3배 달라도 정답이다."}], "point": "도구로 재면 측정, 머리로 헤아리면 어림. 어림은 쪼개고 → 대입하고 → 곱하는 전략이며, 목표는 자릿수다. 규모 판단과 검산에 필수다.", "answers": "정답 ㉠ 페르미 ㉡ 검산 ㉢ 자릿수 — '어림은 과학에서 쓰지 않는다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "페르미", "㉡": "검산", "㉢": "자릿수"}, "warning": "'어림은 과학에서 쓰지 않는다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "어림의 세 걸음 — 쪼개고, 대입하고, 곱한다. 수영장 물은 생수병 백만 병 규모다", "file": "figures/1103-02.svg"}}, {"id": "1103-03", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1103", "lessonName": "측정과 어림, 측정 표준", "no": "03", "title": "측정 표준", "subtitle": "모두의 자는 왜 필요한가", "steps": [{"n": "①", "t": "자가 다르면", "d": "시장의 저울과 병원의 저울이 다른 1 kg을 가리키면 — 거래는 다툼이 되고, 검사 수치는 의미를 잃고, 부품은 조립되지 않는다."}, {"n": "②", "t": "측정 표준", "d": "모두가 따르는 측정의 기준. <b>언제 어디서 누가 재어도 같은 값<\/b>이 나오게 하는 공통의 {{㉠}}다."}, {"n": "③", "t": "지키는 곳", "d": "우리나라에서는 <b>한국표준과학연구원(KRISS)<\/b>이 국가 표준을 세우고, 시중의 저울·온도계·계량기를 <b>교정<\/b>하는 체계를 운영한다."}], "howto": [], "body": ["시장의 저울과 병원의 저울, 학교의 자와 공장의 자 — 이들이 서로 다른 1 kg, 다른 1 m를 가리킨다면 어떻게 될까. 거래는 다툼이 되고, 검사 수치는 병원을 옮길 때마다 의미를 잃고, 부품은 조립되지 않는다. 그래서 사회는 모두가 따르는 측정의 기준, 곧 <b>측정 표준<\/b>을 정한다. 측정 표준은 언제 어디서 누가 재어도 같은 값이 나오게 하는 <b>공통의 자<\/b>다.", "표준은 정하는 것으로 끝나지 않고 지켜져야 한다. 우리나라에서는 <b>한국표준과학연구원({{㉡}})<\/b>이 국가 측정 표준을 세우고 유지하며, 시중의 저울·온도계·계량기가 표준과 일치하는지 <b>교정<\/b>하는 체계를 운영한다. 교정이란 도구의 눈금을 표준과 비교해 바로잡는 일로, 병원의 혈압계도 정기적으로 교정받는다.", "주유소 계량기 검사, 전자저울의 정기 검정처럼, 표준은 보이지 않는 곳에서 매일 우리의 거래와 안전을 지키는 <b>사회 기반 시설<\/b>이다. 표준의 효과는 세 가지로 정리한다 — 공정한 {{㉢}} · 신뢰할 수 있는 진단 · 맞물리는 산업. 측정 표준이 다르면 국가 간 무역에서 거래 분쟁과 규격 불일치가 생긴다."], "terms": [{"k": "측정 표준", "v": "모두가 따르는 측정의 기준. 언제 어디서 누가 재어도 같은 값이 나오게 하는 공통의 자."}, {"k": "교정", "v": "도구의 눈금을 표준과 비교해 바로잡는 일. 병원 혈압계도 정기적으로 교정받는다."}, {"k": "KRISS", "v": "한국표준과학연구원 — 대한민국의 1 kg, 1 m, 1초를 지키는 국가 기관."}], "myths": [{"x": "측정 표준이 달라도 국가 간 무역에는 지장이 없다.", "o": "저울이 다르면 <b>거래 분쟁·규격 불일치<\/b>가 생긴다. 표준은 무역의 바닥이다."}, {"x": "표준은 한 번 정해 두면 저절로 지켜진다.", "o": "시중 도구를 표준과 맞추는 <b>교정·검정<\/b> 체계가 있어야 지켜진다(KRISS)."}], "point": "측정 표준 = 모두의 자 — 언제 어디서 누가 재어도 같은 값. 거래·의료·산업의 신뢰 기반이며, 한국은 KRISS가 세우고 교정으로 지킨다.", "answers": "정답 ㉠ 자 ㉡ KRISS ㉢ 거래 — '표준이 달라도 무역에 지장 없다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "자", "㉡": "KRISS", "㉢": "거래"}, "warning": "'표준이 달라도 무역에 지장 없다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "측정 표준의 유용성 — 국가 표준(KRISS)에서 교정을 거쳐 시장·병원·공장·주유소로, 하나의 자가 사회를 지탱한다", "file": "figures/1103-03.svg"}}, {"id": "1103-04", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1103", "lessonName": "측정과 어림, 측정 표준", "no": "04", "title": "표준의 진화", "subtitle": "물체에서 자연 상수로", "steps": [{"n": "①", "t": "공통 줄거리", "d": "길이(미터원기 → 빛), 시간(자전 → 세슘)의 이야기는 모든 표준의 줄거리다. 마지막 주자가 <b>질량<\/b>이었다."}, {"n": "②", "t": "흔들리는 원기", "d": "1 kg은 130년 가까이 파리의 백금-이리듐 원기였다. 그런데 복제 원기와 비교할 때마다 수십 {{㉠}}씩 어긋났다."}, {"n": "③", "t": "2019년 재정의", "d": "1 kg을 자연의 기본 상수인 <b>플랑크 상수<\/b>에 붙들어 정의. SI 기본단위 전부가 변하지 않는 자연 상수 위에 섰다."}], "howto": [], "body": ["01에서 본 길이(미터원기 → 빛)와 시간(자전 → 세슘)의 이야기는 사실 모든 표준의 공통 줄거리다. 마지막 주자가 질량이었다. 1 kg은 130년 가까이 파리에 보관된 <b>백금-이리듐 원기<\/b> 덩어리였다 — 그런데 세계 각국의 복제 원기와 비교할 때마다 값이 수십 μg씩 어긋나는 문제가 드러났다. 기준 자체가 변하는데, 무엇에 대고 바로잡을 것인가.", "그래서 2019년, 국제 사회는 1 kg을 자연의 기본 상수인 <b>{{㉡}} 상수<\/b>에 붙들어 다시 정의했다. 이로써 SI의 기본단위 전부가 닳지도 변하지도 않는 <b>자연 상수<\/b> 위에 서게 되었다 — 금고 속 물체가 아니라, 우주 어디서나 똑같은 값이 표준이 된 것이다. 이제 어떤 나라든 장비만 있으면 금고를 참조하지 않고 자기 실험실에서 1 kg을 구현할 수 있다.", "시험은 길이·시간·질량 3종 세트로 낸다 — 미터원기 → 빛 / 자전 → 세슘 원자 / 킬로그램 원기 → 플랑크 상수. 공통 논리는 늘 같다: <b>물체는 변하고, 자연 상수는 {{㉢}} 않는다<\/b>. 원기의 어긋남은 μg(10<sup>−6<\/sup> g) 수준의 티끌이지만, '기준이 변한다'는 사실 자체가 문제였다. 은퇴한 원기는 지금도 파리 금고에 역사 유물로 보관돼 있다."], "terms": [{"k": "플랑크 상수(h)", "v": "양자 물리의 기본 상수. 2019년부터 1 kg의 정의가 이 값에 고정되었다 — 값 자체는 외울 필요 없다."}, {"k": "μg(마이크로그램)", "v": "10⁻⁶ g. 원기의 어긋남은 티끌 수준이지만, '기준이 변한다'는 사실 자체가 문제였다."}, {"k": "표준의 진화", "v": "길이 → 빛 · 시간 → 세슘 · 질량 → 플랑크 상수. 물체에서 자연 상수로, 더 변하지 않는 쪽으로."}], "myths": [{"x": "킬로그램 원기는 시간이 지나도 질량이 전혀 변하지 않았다.", "o": "복제본과 <b>수십 μg씩 어긋났다<\/b>. 그래서 재정의했다."}, {"x": "1 kg은 지금도 파리의 원기로 정의된다.", "o": "2019년부터 <b>플랑크 상수<\/b>로 정의된다. 원기는 은퇴했다."}], "point": "길이 → 빛, 시간 → 세슘, 질량 → 플랑크 상수(2019). 물체는 변하고 자연 상수는 변하지 않는다 — 표준은 물체에서 자연 상수로 진화했다.", "answers": "정답 ㉠ μg ㉡ 플랑크 ㉢ 변하지 — '원기는 전혀 변하지 않았다', '지금도 원기로 정의된다'가 단골 오답이다.", "blanks": {"㉠": "μg", "㉡": "플랑크", "㉢": "변하지"}, "warning": "'원기는 전혀 변하지 않았다', '지금도 원기로 정의된다'가 단골 오답이다.", "figure": {"caption": "킬로그램의 재정의 — 금고 속 금속 덩어리(변한다)에서 플랑크 상수(변하지 않는다)로, 마지막 '물체 표준'이 은퇴했다", "file": "figures/1103-04.svg"}}, {"id": "1103-05", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1103", "lessonName": "측정과 어림, 측정 표준", "no": "05", "title": "일상 곳곳의 표준", "subtitle": "우리는 표준 속에 산다", "steps": [{"n": "①", "t": "생활 속 표준", "d": "콘센트의 <b>220 V<\/b>, 시력 검사의 <b>1.0<\/b>, 혈압 <b>120/80<\/b>, 신발의 mm 치수, A4 용지 — 표준이 있어야 비교가 되고, 비교가 되어야 판단이 선다."}, {"n": "②", "t": "방법까지 표준", "d": "혈압은 앉아서 5분 안정 후 심장 높이의 팔에서 — {{㉠}}까지 표준이어야 값이 비교된다."}, {"n": "③", "t": "합의의 과정", "d": "나라마다 다른 콘센트, 미터법과 야드파운드법의 병존. 표준은 한 번 정하면 끝이 아니라 <b>계속 합의하고 맞춰 가는 과정<\/b>이다."}], "howto": [], "body": ["측정 표준은 실험실 밖에서 더 광범위하게 일한다. 콘센트의 <b>220 V<\/b>는 전국 어디서나 같은 전압이라는 약속이고, 시력 검사의 <b>1.0<\/b>은 정해진 거리에서 정해진 크기의 고리를 구별하는 표준화된 기준이며, 혈압 <b>120/80<\/b>은 전 세계 병원이 같은 방식으로 재기로 한 값이다. 신발의 mm 치수, 옷의 호수, A4 용지의 크기까지 — 표준이 있어야 비교가 되고, 비교가 되어야 판단이 선다.", "표준이 없던 시절의 흔적도 남아 있다. 나라마다 다른 콘센트 모양 때문에 여행 가방에는 어댑터가 들어가고, 미터법과 야드파운드법의 병존은 02에서 본 우주선 사고까지 낳았다. 표준은 한 번 정하면 끝이 아니라 <b>계속 {{㉡}}하고 맞춰 가는 과정<\/b>이다 — 킬로그램 재정의처럼 진화한다.", "표준은 과학적 근거 위의 사회적 합의다. 가정용 전압이 220 V인 까닭은 같은 전력을 더 낮은 {{㉢}}로 보낼 수 있어 손실이 줄기 때문이고, 혈압은 앉아서 5분 안정 후 심장 높이의 팔에서 재기로 했기에 병원이 달라도 값이 비교된다. 그리고 다음 소단원에서 보듯, 디지털 시대에는 정보를 주고받는 '신호의 표준'까지 그 무대가 넓어진다."], "terms": [{"k": "왜 220 V인가", "v": "같은 전력을 더 낮은 전류로 보낼 수 있어 손실이 준다 — 표준은 과학적 근거 위의 사회적 합의다."}, {"k": "혈압 측정 표준", "v": "앉아서 5분 안정 후, 심장 높이의 팔에서 — 방법까지 표준이어야 값이 비교된다."}, {"k": "표준의 무대", "v": "길이·질량·시간을 넘어 전압·시력·용지 규격, 그리고 디지털 시대의 '신호의 표준'(04)까지."}], "myths": [{"x": "표준은 한 번 정해지면 다시 바뀌지 않는다.", "o": "킬로그램 재정의처럼 <b>계속 합의하고 진화<\/b>한다."}, {"x": "혈압은 값만 표준이면 되고 재는 방법은 상관없다.", "o": "<b>방법까지 표준<\/b>이어야(앉아서 5분, 심장 높이) 값이 비교된다."}], "point": "표준 = 비교의 조건. 220 V · 시력 1.0 · 혈압 120/80 · A4 — 일상 전체가 표준 위에 있고, 표준은 과학적 근거 위의 사회적 합의로서 계속 진화한다.", "answers": "정답 ㉠ 방법 ㉡ 합의 ㉢ 전류 — '표준은 한 번 정하면 바뀌지 않는다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "방법", "㉡": "합의", "㉢": "전류"}, "warning": "'표준은 한 번 정하면 바뀌지 않는다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "생활 속의 측정 표준 — 콘센트 · 시력표 · 혈압계 · A4, 그리고 표준이 다른 나라에 갈 때 챙기는 어댑터", "file": "figures/1103-05.svg"}}, {"id": "1104-01", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1104", "lessonName": "정보와 신호, 디지털 문명", "no": "01", "title": "측정에서 정보로", "subtitle": "변화를 재면 정보가 된다", "steps": [{"n": "①", "t": "자연은 변한다", "d": "기온이 오르내리고, 심장이 뛰고, 땅이 흔들린다. 이 변화를 <b>측정·분석해 쓸모 있는 형태로 정리한 것<\/b>이 {{㉠}}다."}, {"n": "②", "t": "세 가지 예", "d": "관측 장비의 기온·기압·습도 → <b>일기예보<\/b>. 심장의 전기 신호 → <b>심전도<\/b>. 지진계의 흔들림 → <b>지진 경보<\/b>."}, {"n": "③", "t": "쌓여야 보인다", "d": "25 ℃는 숫자다. '어제보다 8도 급락'이면 외투를 챙기게 하는 정보다. 측정이 쌓여야 변화가 보이고, 변화가 보여야 예측이 선다."}], "howto": [], "body": ["자연은 끊임없이 변한다 — 기온이 오르내리고, 심장이 뛰고, 땅이 흔들린다. 이 변화를 <b>측정·분석해 쓸모 있는 형태로 정리한 것<\/b>이 <b>정보<\/b>다. 전국의 관측 장비가 잰 기온·기압·습도가 모여 <b>일기예보<\/b>가 되고, 심장이 뛸 때 생기는 전기 신호의 변화를 기록한 곡선이 <b>심전도<\/b>가 되어 심장병 진단의 근거가 된다. 지진계의 흔들림 기록이 지진 경보가 되는 것도 같다.", "측정값 하나는 숫자일 뿐이지만, 모으고 비교하고 분석하는 순간 <b>판단의 근거<\/b>가 된다. 오늘 기온 25 ℃는 숫자다. 그런데 '어제보다 8도 급락'이라면 외투를 챙기게 하는 정보다. 과학이 측정을 쌓는 이유, 병원이 검사 기록을 쌓는 이유가 여기에 있다 — 측정이 쌓여야 {{㉡}}가 보이고, 변화가 보여야 {{㉢}}이 선다.", "스마트워치가 하는 일이 정확히 이 세 단계다 — 맥박을 재고(측정), 기록을 쌓고, '심박이 평소보다 높아요'라고 알려 준다(정보). 심전도(ECG)는 심장이 뛸 때 생기는 전기 신호의 변화를 시간에 따라 기록한 곡선이며, 정보의 원료는 언제나 측정값이다."], "terms": [{"k": "정보", "v": "측정·분석을 거쳐 판단에 쓸 수 있게 정리된 지식. 원료는 언제나 측정값이다."}, {"k": "심전도(ECG)", "v": "심장이 뛸 때 생기는 전기 신호의 변화를 시간에 따라 기록한 곡선. 심장병 진단의 근거가 된다."}, {"k": "변화 → 측정 → 정보", "v": "일기예보(기온·기압·습도), 심전도(전기 신호), 지진 경보(지진계의 흔들림) — 모두 같은 사슬이다."}], "myths": [{"x": "측정값 하나가 곧 정보다.", "o": "숫자 하나는 숫자일 뿐이다. <b>모으고 비교하고 분석<\/b>해야 판단의 근거(정보)가 된다."}, {"x": "병원이 검사 기록을 쌓는 것은 보관 의무 때문이다.", "o": "측정이 <b>쌓여야 변화가 보이고<\/b>, 변화가 보여야 예측(진단)이 선다."}], "point": "변화 → 측정 → 분석 → 정보. 일기예보·심전도·지진 경보는 모두 측정값이 쌓여 판단의 근거가 된 것이다. 숫자가 쌓여야 예측이 선다.", "answers": "정답 ㉠ 정보 ㉡ 변화 ㉢ 예측 — '측정값 하나가 곧 정보'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "정보", "㉡": "변화", "㉢": "예측"}, "warning": "'측정값 하나가 곧 정보'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "측정에서 정보로 — 심장의 변화를 재고(측정), 기록을 쌓고, '평소보다 높다'는 판단(정보)이 되는 세 걸음", "file": "figures/1104-01.svg"}}, {"id": "1104-02", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1104", "lessonName": "정보와 신호, 디지털 문명", "no": "02", "title": "아날로그와 디지털", "subtitle": "두 가지 신호", "steps": [{"n": "①", "t": "신호", "d": "측정된 변화를 담아 나르는 형식. 두 갈래가 있다."}, {"n": "②", "t": "아날로그", "d": "자연의 변화를 <b>{{㉠}}적인 값<\/b> 그대로 담는다 — 수은 온도계의 눈금, 바늘 시계, LP판의 소리 골."}, {"n": "③", "t": "디지털", "d": "값을 띄엄띄엄한(불연속적인) 숫자, 최종적으로 <b>0과 1의 나열<\/b>로 담는다 — 전자 체온계의 '36.5', 디지털시계, 스마트폰 속 파일."}], "howto": [], "body": ["측정된 변화를 담아 나르는 형식, 곧 <b>신호<\/b>에는 두 갈래가 있다. <b>아날로그 신호<\/b>는 자연의 변화를 <b>연속적인 값<\/b> 그대로 담는다 — 수은 온도계의 눈금, 바늘 시계의 부드러운 움직임, LP판의 소리 골. 반면 <b>디지털 신호<\/b>는 값을 띄엄띄엄한(불연속적인) 숫자, 최종적으로는 <b>0과 1의 나열<\/b>로 담는다 — 전자 체온계의 '36.5', 디지털시계의 숫자, 스마트폰 속 모든 파일.", "자연 자체는 {{㉡}}다 — 기온은 25 ℃와 26 ℃ 사이의 모든 값을 지나며 변한다. 그런데 왜 문명은 굳이 그것을 0과 1로 바꿔 담을까? 답은 간단하다. 0과 1은 '있다/없다'만 구별하면 되는 <b>가장 단순한 약속<\/b>이라, 잡음이 조금 끼어도 값이 흔들리지 않고, 기계끼리 주고받기 쉽기 때문이다. 그 강력함은 개념 04에서 확인하고, 먼저 '어떻게 바꾸는가'(개념 03)부터 본다.", "구분 기준은 딱 하나 — <b>연속이면 아날로그, 불연속이면 디지털<\/b>. 바늘 시계 vs 숫자 시계, 수은 체온계 vs 전자 체온계의 짝으로 출제된다. 0 또는 1 하나를 {{㉢}}(bit)라 하며 디지털 정보의 최소 단위다. 8비트가 모이면 1바이트(B)가 된다."], "terms": [{"k": "신호", "v": "측정된 변화를 담아 전달하는 형식. 연속(아날로그)과 불연속(디지털)으로 나뉜다."}, {"k": "아날로그 / 디지털", "v": "아날로그 = 연속적인 값 그대로(수은 온도계·바늘 시계·LP). 디지털 = 불연속적인 숫자, 최종적으로 0과 1(전자 체온계·디지털시계·파일)."}, {"k": "비트(bit)", "v": "0 또는 1 하나 — 디지털 정보의 최소 단위. 8비트가 모이면 1바이트(B)다."}], "myths": [{"x": "수은 온도계의 눈금은 디지털 신호다.", "o": "눈금 사이의 모든 값을 지나므로 <b>연속 — 아날로그<\/b>다."}, {"x": "자연의 신호는 원래 디지털이다.", "o": "자연은 <b>아날로그<\/b>다. 저장·전송을 위해 문명이 디지털로 바꾼다."}], "point": "연속 = 아날로그, 불연속(0과 1) = 디지털. 자연은 아날로그이고, 0과 1은 '있다/없다'만 구별하면 되는 가장 단순한 약속이라 잡음에 강하고 기계끼리 주고받기 쉽다.", "answers": "정답 ㉠ 연속 ㉡ 아날로그 ㉢ 비트 — '수은 온도계 = 디지털', '자연의 신호는 원래 디지털'이 단골 오답이다.", "blanks": {"㉠": "연속", "㉡": "아날로그", "㉢": "비트"}, "warning": "'수은 온도계 = 디지털', '자연의 신호는 원래 디지털'이 단골 오답이다.", "figure": {"caption": "아날로그 신호와 디지털 신호 — 곡선과 계단. 바늘 시계·수은 온도계·LP는 연속, 디지털시계·전자 체온계·파일은 0과 1", "file": "figures/1104-02.svg"}}, {"id": "1104-03", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1104", "lessonName": "정보와 신호, 디지털 문명", "no": "03", "title": "디지털 변환", "subtitle": "곡선이 숫자가 되는 법", "steps": [{"n": "①", "t": "표본화", "d": "연속 신호를 <b>일정한 시간 간격<\/b>으로 잘라 값을 뽑는다 — 점찍기."}, {"n": "②", "t": "수치화", "d": "뽑은 각 값을 정해진 단계의 <b>가장 가까운 숫자<\/b>로 반올림해 기록한다. 그 숫자를 0과 1의 {{㉠}}로 적으면 변환 끝."}, {"n": "③", "t": "정밀함 ↔ 용량", "d": "촘촘히 자를수록, 단계를 잘게 나눌수록 원래 곡선에 가까워진다 — 대신 데이터의 양은 커진다."}], "howto": [], "body": ["아날로그를 디지털로 바꾸는 공정은 두 걸음이다. 첫째, <b>표본화<\/b> — 연속 신호를 일정한 시간 간격으로 잘라 값을 뽑는다. 둘째, <b>수치화<\/b> — 뽑은 각 값을 정해진 단계의 가장 가까운 숫자로 반올림해 기록한다. 이렇게 얻은 숫자들을 0과 1의 이진수로 적으면 변환 끝이다. 매끈한 소리 곡선이 '점찍기'와 '반올림'을 거쳐 숫자 목록이 되는 것이다.", "촘촘히 자를수록(표본을 많이 뽑을수록), 단계를 잘게 나눌수록 원래 곡선에 가까워진다 — 대신 데이터의 양은 {{㉡}}진다. 음악 파일의 음질과 용량이 함께 오르내리는 이유가 바로 이 '정밀함 ↔ 용량'의 저울질이다. 음악 CD는 1초에 44 100번 표본을 뽑는다. 스마트폰의 통화 음성, 카메라의 사진, 병원의 디지털 심전도까지 — 우리 곁의 모든 디지털 데이터가 이 두 걸음을 거쳐 태어났다.", "그래프 자료에서는 ① 표본 간격(가로) ② 단계 수(세로) ③ 뽑힌 숫자열을 읽게 한다. 8단계는 이진수 세 자리(000~111)로 적을 수 있으므로 3, 5, 7…은 011, 101, 111…로 저장된다. 재생기는 숫자 목록을 받아 점을 찍고 곡선으로 이어 소리를 되살린다. \"표본화를 촘촘히 하면 용량이 {{㉢}}든다\"(X — 늘어난다) 함정을 조심한다."], "terms": [{"k": "표본화", "v": "연속 신호에서 일정 간격으로 값을 뽑는 일. 음악 CD는 1초에 44 100번 뽑는다."}, {"k": "수치화", "v": "뽑은 값을 정해진 단계의 가장 가까운 숫자로 반올림해 기록하는 일. 단계가 잘수록 정밀하다."}, {"k": "이진수", "v": "0과 1 두 글자로 수를 적는 법 — 예: 5 = 101. 기계의 '있다/없다'와 딱 맞는 표기다."}], "myths": [{"x": "표본을 촘촘히 뽑으면 데이터의 용량은 작아진다.", "o": "정밀해지는 대신 숫자가 많아져 <b>용량이 커진다<\/b>."}, {"x": "표본 사이의 정보는 영원히 사라진다.", "o": "필요하면 <b>더 촘촘히 뽑아<\/b> 살리면 된다 — 음질과 용량의 저울질이다."}], "point": "변환 = 표본화(일정 간격으로 값 뽑기) + 수치화(가까운 단계로 반올림) → 이진수. 촘촘할수록 정밀하지만 용량이 커진다.", "answers": "정답 ㉠ 이진수 ㉡ 커 ㉢ 줄어 — '촘촘히 표본화하면 용량이 준다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "이진수", "㉡": "커", "㉢": "줄어"}, "warning": "'촘촘히 표본화하면 용량이 준다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "아날로그 → 디지털 변환 — 점찍기(표본화)와 반올림(수치화)의 두 걸음. 소리 곡선이 3, 5, 7, 6, 4, 2, 1, 3 → 011, 101, 111…이 된다", "file": "figures/1104-03.svg"}}, {"id": "1104-04", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1104", "lessonName": "정보와 신호, 디지털 문명", "no": "04", "title": "0과 1의 힘", "subtitle": "디지털은 왜 강한가", "steps": [{"n": "①", "t": "아날로그의 약점", "d": "복사할 때마다 잡음이 쌓이고, 멀리 보낼수록 뭉개진다. 연속적인 값은 조금만 흐트러져도 '다른 값'이 되기 때문이다."}, {"n": "②", "t": "디지털의 해방", "d": "0과 1은 '있다/없다'만 구별하면 되므로 {{㉠}}이 조금 끼어도 원래 값을 되살린다. 아무리 복사해도, 지구 반대편으로 보내도 변하지 않는다."}, {"n": "③", "t": "세 단어", "d": "<b>저장<\/b>(손톱만 한 메모리에 도서관) · <b>전송<\/b>(빛의 속력으로 세계를) · <b>가공<\/b>(검색·편집·분석·압축이 자유)."}], "howto": [], "body": ["<b>아날로그의 약점은 복사와 전송에서 드러난다.<\/b> 카세트테이프를 복사할 때마다 잡음이 쌓이고, 먼 곳으로 보낼수록 신호가 뭉개진다 — 연속적인 값은 조금만 흐트러져도 '다른 값'이 되어 버리기 때문이다. 디지털은 다르다. 0과 1은 '있다/없다'만 구별하면 되므로, <b>잡음이 조금 끼어도 원래 값을 되살릴 수 있다<\/b>. 그래서 디지털 정보는 아무리 복사해도, 지구 반대편으로 보내도 변하지 않는다.", "디지털의 장점은 세 단어로 정리된다. <b>저장<\/b> — 손톱만 한 메모리에 도서관 분량의 글이 들어간다. <b>전송<\/b> — 광섬유와 전파를 타고 빛의 속력으로 세계를 돈다. <b>{{㉡}}<\/b> — 숫자이므로 컴퓨터로 검색·편집·분석·압축이 자유롭다. 사진 보정, 음악 스트리밍, 인공지능의 학습까지, 전부 '정보가 숫자라서' 가능한 일이다.", "신호가 복사·전송을 거치며 품질이 나빠지는 것을 {{㉢}}라 한다 — 아날로그의 숙명, 디지털의 해방이다. 압축은 숫자이기에 가능한 가공으로, 반복되는 패턴을 줄여 용량을 확 줄인다(음악·영상 파일). 시험은 디지털의 장점 3종(저장·전송·가공)과 \"복사해도 변하지 않는다\"를 묻고, 거꾸로 \"디지털은 잡음의 영향을 아날로그보다 크게 받는다\"(X) 선지로도 낸다."], "terms": [{"k": "열화", "v": "신호가 복사·전송을 거치며 품질이 나빠지는 것. 아날로그의 숙명, 디지털의 해방."}, {"k": "디지털의 장점 3종", "v": "저장(손톱만 한 메모리에 도서관) · 전송(빛의 속력으로 세계를) · 가공(검색·편집·분석·압축)."}, {"k": "압축", "v": "숫자이기에 가능한 가공 — 반복되는 패턴을 줄여 용량을 확 줄인다(음악·영상 파일)."}], "myths": [{"x": "디지털은 잡음의 영향을 아날로그보다 크게 받는다.", "o": "0과 1은 '있다/없다'만 가리면 되므로 잡음에 <b>강하다<\/b>. 복사해도 그대로다."}, {"x": "디지털 정보는 컴퓨터로 검색·편집·분석하기 어렵다.", "o": "숫자라서 <b>가공이 자유롭다<\/b> — 압축·보정·스트리밍·AI 학습까지."}], "point": "디지털 = 잡음에 강함 · 복사해도 불변 · 저장·전송·가공 자유. 아날로그는 복사·전송마다 열화된다. 전부 '정보가 숫자라서' 가능한 일이다.", "answers": "정답 ㉠ 잡음 ㉡ 가공 ㉢ 열화 — '디지털은 잡음에 더 약하다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "잡음", "㉡": "가공", "㉢": "열화"}, "warning": "'디지털은 잡음에 더 약하다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "아날로그와 디지털의 복사 — 열화되는 곡선, 변하지 않는 숫자. 판정선 위는 1, 아래는 0이면 그만이다", "file": "figures/1104-04.svg"}}, {"id": "1104-05", "book": "1", "bookName": "통합과학 1", "unit": "I", "unitName": "과학의 기초", "lessonId": "1104", "lessonName": "정보와 신호, 디지털 문명", "no": "05", "title": "정보 통신과 현대 문명", "subtitle": "디지털이 바꾼 세계", "steps": [{"n": "①", "t": "사슬이 통신을 만나다", "d": "측정 → 정보 → 디지털이 <b>통신<\/b>과 만나자 문명의 속도가 바뀌었다. 스마트폰은 전화기이자 카메라, 지도(GPS), 은행, 진료 예약 창구다."}, {"n": "②", "t": "연결된 측정", "d": "디지털 의료 영상은 어디서든 열람·전송되어 원격 판독을, 관측소 데이터는 실시간으로 모여 태풍 경로 예측·지진 조기 경보가 된다."}, {"n": "③", "t": "자원과 숙제", "d": "데이터는 석유에 비유되는 {{㉠}}이 되었다. 그림자 — 개인 정보 유출, 디지털 격차, 가짜 정보. 다루는 <b>책임<\/b>도 커졌다."}], "howto": [], "body": ["측정 → 정보 → 디지털의 사슬이 <b>통신<\/b>과 만나자 문명의 속도가 바뀌었다. 손안의 스마트폰은 전화기이자 카메라, 지도(01의 GPS), 은행, 진료 예약 창구다. 병원에서는 디지털화된 영상과 검사 기록이 <b>어디서든 열람·전송<\/b>되어 원격 판독과 협진을 가능하게 하고, 관측소의 데이터는 실시간으로 모여 태풍 경로 예측과 지진 조기 경보가 된다. 측정이 데이터가 되고, 데이터가 연결되는 것 — 그것이 정보 통신 문명의 뼈대다.", "이제 데이터는 석유에 비유될 만큼 중요한 <b>자원<\/b>이 되었다. 검색 기록과 이동 경로가 서비스를 개선하고, 축적된 진료 데이터가 새 치료법 연구의 바탕이 된다. 물론 그림자도 있다 — 개인 정보 유출, {{㉡}}(디지털 기술 접근성의 차이가 만드는 정보의 불평등), 가짜 정보의 확산. 기술을 누리는 것만큼 데이터를 다루는 {{㉢}}도 커졌다는 것, 그것이 디지털 문명이 우리 세대에게 남긴 숙제다.", "이 소단원을 한 장으로 정리한다. 변화 → 측정 → 분석 → 정보(일기예보·심전도·지진 경보). 아날로그(연속) vs 디지털(0과 1), 변환 = 표본화 + 수치화. 디지털의 힘 = 잡음에 강함 · 저장·전송·가공 자유 · 복사해도 불변. 정보 통신 문명 = 스마트폰·원격 의료·재난 경보 — 데이터는 자원, 책임은 숙제. 측정 장치가 달린 사물들이 서로 데이터를 주고받는 사물인터넷(IoT)은 통합과학2에서 다시 만난다."], "terms": [{"k": "사물인터넷(IoT)", "v": "측정 장치가 달린 사물들이 서로 데이터를 주고받는 연결망 — 통합과학2에서 다시 만난다."}, {"k": "디지털 격차", "v": "디지털 기술 접근성의 차이가 만드는 정보의 불평등 — 기술 문명의 그림자다."}, {"k": "데이터 = 자원", "v": "검색 기록·이동 경로·진료 데이터가 서비스 개선과 새 치료법 연구의 바탕이 된다. 다루는 책임이 함께 커진다."}], "myths": [{"x": "디지털 문명에는 개인 정보 유출 같은 그림자가 없다.", "o": "<b>유출 · 격차 · 가짜 정보<\/b>가 숙제다. 누리는 만큼 책임도 커졌다."}, {"x": "의료 영상은 촬영한 병원에서만 볼 수 있다.", "o": "디지털화된 영상은 <b>어디서든 열람·전송<\/b>되어 원격 판독과 협진이 된다."}], "point": "측정 → 데이터 → 연결 = 정보 통신 문명(스마트폰·원격 의료·재난 경보). 데이터는 자원이고, 유출·격차·가짜 정보를 다루는 책임까지가 문명이다.", "answers": "정답 ㉠ 자원 ㉡ 디지털 격차 ㉢ 책임 — '디지털 문명에는 그림자가 없다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "자원", "㉡": "디지털 격차", "㉢": "책임"}, "warning": "'디지털 문명에는 그림자가 없다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "정보 통신과 현대 문명 — 스마트폰을 중심으로 의료 영상·재난 경보·GPS·은행이 연결되고, 그 그림자(유출·격차·가짜 정보)까지 함께 온다", "file": "figures/1104-05.svg"}}, {"id": "1201-01", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1201", "lessonName": "우주의 시작과 원소의 탄생", "no": "01", "title": "빅뱅", "subtitle": "우주는 한 점에서 시작해 팽창한다", "steps": [{"n": "①", "t": "시작", "d": "약 <b>138억 년 전<\/b>, 매우 뜨겁고 밀도가 큰 한 점에서 시작된 대폭발, 곧 <b>빅뱅<\/b>과 함께 우주가 탄생하였다."}, {"n": "②", "t": "팽창", "d": "빅뱅 이후 우주는 지금까지 계속 {{㉠}}하고 있으며, 그동안 온도와 밀도는 점점 낮아졌다."}, {"n": "③", "t": "증거", "d": "외부 은하들은 대부분 우리에게서 멀어지고, <b>멀리 있는 은하일수록 더 빨리<\/b> 멀어진다. 시간을 거꾸로 돌리면 한 점에 모인다."}], "howto": [], "body": ["약 <b>138억 년 전<\/b>, 우주는 매우 뜨겁고 밀도가 큰 한 점에서 시작된 대폭발, 곧 <b>빅뱅<\/b>과 함께 탄생하였다. 빅뱅 이후 우주는 지금까지 계속 <b>팽창<\/b>하고 있으며, 팽창하는 동안 우주의 온도와 밀도는 점점 낮아졌다. 우주가 한 점에서 시작해 팽창하며 현재에 이르렀다는 이론이 <b>빅뱅 우주론<\/b>이며, 조지 가모프가 체계화했다.", "우주가 팽창한다는 사실은 먼 <b>은하<\/b>들을 관측하여 알아냈다. 외부 은하들은 대부분 우리에게서 멀어지고 있으며, <b>멀리 있는 은하일수록 더 {{㉡}} 멀어진다<\/b>. 모든 방향의 은하가 서로 멀어진다 — 시간을 거꾸로 돌리면 우주가 한 점에 모여 있었다는 뜻이다.", "풍선에 스티커를 붙이고 불어 보면, 어느 스티커에서 보아도 다른 스티커가 모두 멀어진다. 우주 팽창에는 '{{㉢}}'이 따로 없다는 것이 요점이다 — 우리 은하가 특별한 자리에 있어서 모두가 우리에게서 멀어지는 것이 아니라, 공간 자체가 늘어나기 때문에 어디서 보아도 같은 일이 일어난다. 팽창하며 식어 간 우주에서 어떤 순서로 입자가 태어났는지가 다음 개념이다."], "terms": [{"k": "빅뱅 우주론", "v": "우주가 한 점에서 시작해 팽창하며 현재에 이르렀다는 이론. 조지 가모프가 체계화했다."}, {"k": "우주의 팽창", "v": "외부 은하들이 우리에게서 멀어지며, 멀리 있는 은하일수록 더 빨리 멀어진다. 팽창의 중심은 따로 없다."}, {"k": "온도와 밀도", "v": "팽창하는 동안 우주의 온도와 밀도는 점점 낮아졌다 — 입자가 결합할 수 있게 된 조건이다."}], "myths": [{"x": "우리 은하가 우주의 중심이라 모든 은하가 우리에게서 멀어진다.", "o": "공간 자체가 늘어나므로 <b>어느 은하에서 보아도<\/b> 모두가 멀어진다. 중심은 없다."}, {"x": "우주는 팽창하면서 점점 뜨거워졌다.", "o": "팽창하는 동안 온도와 밀도는 <b>낮아졌다<\/b>."}], "point": "빅뱅(약 138억 년 전) 이후 우주는 팽창하고, 온도·밀도는 감소했다. 증거는 은하의 후퇴 — 멀수록 빨리 멀어지며, 팽창에 중심은 없다.", "answers": "정답 ㉠ 팽창 ㉡ 빨리 ㉢ 중심 — '팽창하며 온도가 올라갔다', '우리 은하가 중심'이 단골 오답이다.", "blanks": {"㉠": "팽창", "㉡": "빨리", "㉢": "중심"}, "warning": "'팽창하며 온도가 올라갔다', '우리 은하가 중심'이 단골 오답이다.", "figure": {"caption": "빅뱅과 우주의 팽창 — 시간을 거꾸로 돌리면 모든 은하가 한 점에 모인다", "file": "figures/1201-01.svg"}}, {"id": "1201-02", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1201", "lessonName": "우주의 시작과 원소의 탄생", "no": "02", "title": "입자의 탄생", "subtitle": "식는 순서대로 작은 것부터 뭉친다", "steps": [{"n": "①", "t": "기본 입자", "d": "빅뱅 직후, 더 쪼갤 수 없는 <b>쿼크<\/b>와 <b>전자<\/b> 등이 생겼다. 너무 뜨거워 어떤 물질도 온전한 형태를 유지할 수 없었다."}, {"n": "②", "t": "양성자·중성자 → 원자핵", "d": "쿼크 {{㉠}}개가 결합해 양성자·중성자. 빅뱅 후 약 <b>3분<\/b>, 양성자 2개 + 중성자 2개 = <b>헬륨 원자핵<\/b>."}, {"n": "③", "t": "원자", "d": "빅뱅 후 약 <b>38만 년<\/b>, 온도가 약 3000 K까지 낮아지자 원자핵이 전자를 붙잡아 <b>수소 원자와 헬륨 원자<\/b>가 완성되었다."}], "howto": [], "body": ["빅뱅 직후의 우주는 너무 뜨거워서 어떤 물질도 온전한 형태를 유지할 수 없었다. 우주가 팽창하며 <b>식어 가는 순서대로<\/b>, 작은 입자들이 결합하여 점점 더 큰 입자가 만들어졌다. 먼저 더 쪼갤 수 없는 <b>쿼크<\/b>와 <b>전자<\/b> 등 기본 입자가 생겼고, 쿼크 3개가 결합해 <b>양성자·중성자<\/b>가 되었다. 양성자 1개가 곧 <b>수소 원자핵<\/b>이다.", "빅뱅 후 약 <b>3분<\/b>, 양성자 2개와 중성자 2개가 결합하여 <b>헬륨 원자핵<\/b>이 되었다. 그리고 빅뱅 후 약 {{㉡}}년, 우주 온도가 약 3000 K까지 낮아지자 원자핵이 전자를 붙잡아 <b>수소 원자와 헬륨 원자<\/b>가 완성되었다. K(켈빈)는 절대 온도의 단위로, 0 K = −273 ℃이며 우주 초기 온도를 나타낼 때 쓴다.", "순서를 한 줄로 외운다 — 기본 입자 → 양성자·중성자 → 원자핵(3분) → 원자(38만 년), \"작은 것부터 뭉친다\". 시험의 함정은 \"별과 은하는 언제?\"다. 별은 원자(재료)가 생긴 뒤 {{㉢}}년이 지나 만들어진다 — 원자핵 생성(3분)과 원자 생성(38만 년) 사이에는 별이 없다. 쿼크는 업 쿼크 2개 + 다운 쿼크 1개가 양성자, 업 1개 + 다운 2개가 중성자다."], "terms": [{"k": "쿼크", "v": "물질을 이루는 가장 작은 기본 입자 중 하나. 업 쿼크 2개 + 다운 쿼크 1개 = 양성자, 업 1개 + 다운 2개 = 중성자."}, {"k": "K(켈빈)", "v": "절대 온도의 단위. 0 K = −273 ℃. 우주 초기 온도를 나타낼 때 쓴다(원자 생성 무렵 약 3000 K)."}, {"k": "생성 순서", "v": "기본 입자 → 양성자·중성자 → 헬륨 원자핵(약 3분) → 원자(약 38만 년). 별과 은하는 그 뒤 수억 년."}], "myths": [{"x": "빅뱅 직후 원자가 먼저 생기고, 나중에 쪼개져 원자핵과 전자가 되었다.", "o": "반대다. 식는 순서대로 <b>작은 것부터 결합<\/b>해 원자가 마지막에 완성된다."}, {"x": "별과 은하는 헬륨 원자핵이 생성된 직후에 만들어졌다.", "o": "원자(재료)가 생긴 뒤 <b>수억 년<\/b>이 지나서다. 3분~38만 년 사이에는 별이 없다."}], "point": "기본 입자(쿼크·전자) → 양성자·중성자 → 헬륨 원자핵(3분) → 원자(38만 년, 약 3000 K). 우주가 식는 순서대로 작은 것부터 뭉친다.", "answers": "정답 ㉠ 3 ㉡ 38만 ㉢ 수억 — 생성 순서를 뒤집거나 '별이 원자핵 직후에 생겼다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "3", "㉡": "38만", "㉢": "수억"}, "warning": "생성 순서를 뒤집거나 '별이 원자핵 직후에 생겼다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "빅뱅 이후 입자가 생성된 순서 — 기본 입자 → 양성자·중성자 → 헬륨 원자핵(3분) → 원자(38만 년)", "file": "figures/1201-02.svg"}}, {"id": "1201-03", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1201", "lessonName": "우주의 시작과 원소의 탄생", "no": "03", "title": "우주 배경 복사", "subtitle": "우주가 투명해진 날의 빛", "steps": [{"n": "①", "t": "불투명한 우주", "d": "원자가 생기기 전, 빛은 사방에 널린 <b>자유 전자<\/b>와 끊임없이 충돌해 멀리 나아가지 못했다 — 안개 속 같은 우주."}, {"n": "②", "t": "투명해지다", "d": "빅뱅 후 약 38만 년, 전자가 원자핵에 붙잡혀 {{㉠}}가 완성되자 빛은 방해받지 않고 <b>직진<\/b>하게 되었다."}, {"n": "③", "t": "남은 빛", "d": "그때 퍼진 빛이 팽창하는 동안 식어, 오늘날 모든 방향에서 희미한 <b>전파<\/b>로 관측된다 — <b>우주 배경 복사<\/b>, 빅뱅의 증거 ①."}], "howto": [], "body": ["원자가 만들어지기 전의 우주에서는 빛이 사방에 널린 <b>자유 전자<\/b>와 끊임없이 충돌하여 멀리 나아가지 못했다. 안개 속처럼 <b>불투명한 우주<\/b>였던 셈이다. 빅뱅 후 약 38만 년, 전자가 원자핵에 붙잡혀 원자가 완성되자 빛은 더 이상 방해받지 않고 우주 공간을 <b>직진<\/b>하게 되었다 — 우주가 <b>투명<\/b>해진 것이다.", "이때 우주 전체로 퍼져 나간 빛은 우주가 팽창하는 동안 식어서, 오늘날 우주의 모든 방향에서 관측되는 희미한 {{㉡}}로 남아 있다. 이것이 <b>우주 배경 복사<\/b>이며, 빅뱅 우주론이 예측한 것을 실제 관측으로 확인한 <b>결정적 증거<\/b>가 되었다. 그 온도는 현재 약 {{㉢}} K — 138억 년 동안 우주가 팽창하며 식은 결과다.", "우주 배경 복사는 1965년 펜지어스와 윌슨이 안테나 잡음을 조사하다 우연히 발견했고, 노벨 물리학상을 받았다. 정리하면, 원자 생성 → 우주가 투명해짐 → 그때 퍼진 빛 = 우주 배경 복사(빅뱅의 증거 ①)이다. 두 번째 증거(수소 : 헬륨 질량비)는 개념 05에서 만난다."], "terms": [{"k": "자유 전자", "v": "원자에 묶이지 않고 홀로 돌아다니는 전자. 빛(광자)과 잘 충돌한다 — 원자 생성 전 우주를 불투명하게 만든 주인공."}, {"k": "우주 배경 복사", "v": "원자 생성 무렵 우주로 퍼져 나간 빛이 식어 남은 것. 모든 방향에서 관측되는 희미한 전파, 현재 약 2.7 K."}, {"k": "발견", "v": "1965년 펜지어스와 윌슨이 안테나 잡음을 조사하다 우연히 발견 — 노벨 물리학상."}], "myths": [{"x": "원자가 만들어지기 전의 우주는 투명했다.", "o": "빛이 자유 전자에 산란되어 <b>불투명<\/b>했다. 원자가 생긴 뒤에야 투명해졌다."}, {"x": "우주 배경 복사는 별들이 내는 빛이 모인 것이다.", "o": "별이 생기기 전, <b>원자 생성 무렵 퍼져 나간 빛<\/b>의 흔적이다."}], "point": "원자 생성(38만 년) → 우주가 투명해짐 → 그때 퍼진 빛이 식어 모든 방향의 전파(약 2.7 K)로 남았다 = 우주 배경 복사, 빅뱅의 증거 ①.", "answers": "정답 ㉠ 원자 ㉡ 전파 ㉢ 2.7 — '원자 생성 전 우주는 투명했다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "원자", "㉡": "전파", "㉢": "2.7"}, "warning": "'원자 생성 전 우주는 투명했다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "원자 생성과 우주 배경 복사 — 빛의 길이 뚫리는 순간. 그날의 빛이 138억 년 식어 모든 방향의 전파로 남았다", "file": "figures/1201-03.svg"}}, {"id": "1201-04", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1201", "lessonName": "우주의 시작과 원소의 탄생", "no": "04", "title": "스펙트럼", "subtitle": "빛에 새겨진 원소의 지문", "steps": [{"n": "①", "t": "스펙트럼", "d": "빛을 프리즘이나 분광기에 통과시켜 <b>파장별로 나누어 놓은 색의 띠<\/b>. 별에 가지 않고도 별빛으로 성분을 읽는다."}, {"n": "②", "t": "세 종류", "d": "<b>연속<\/b>(고온 광원, 무지개) · <b>방출<\/b>(고온·저밀도 기체, 어두운 바탕에 밝은 선) · <b>흡수<\/b>(광원 + 저온 기체, 무지개 위 {{㉠}} 선)."}, {"n": "③", "t": "지문", "d": "원소마다 선의 위치(파장)가 정해져 있고, <b>같은 원소의 방출선과 흡수선은 같은 위치<\/b>다. 대조하면 성분이 나온다."}], "howto": [], "body": ["우주 초기에 수소와 헬륨이 만들어졌다는 것을 어떻게 <b>확인<\/b>할까? 별에 직접 갈 수는 없지만, 별이 보내온 <b>빛<\/b>을 분석하면 된다. 빛을 프리즘이나 분광기에 통과시켜 파장별로 나누어 놓은 색의 띠를 <b>스펙트럼<\/b>이라고 한다. 파장은 빛(파동)의 골에서 골까지 거리로, 가시광선은 파장이 짧을수록 보라, 길수록 빨강이다.", "<b>연속 스펙트럼<\/b>은 고온의 광원(백열등, 별의 표면)이 내는 빛으로 무지개처럼 모든 색이 연속으로 나타난다. <b>방출 스펙트럼<\/b>은 고온·저밀도의 기체가 내는 빛으로, 어두운 바탕에 특정 위치의 밝은 선(방출선)만 나타난다. <b>흡수 스펙트럼<\/b>은 광원의 빛이 {{㉡}}의 기체를 통과할 때 기체가 특정 파장만 흡수하여 연속 스펙트럼 위에 검은 선(흡수선)이 나타난 것이다.", "원소의 종류에 따라 선이 나타나는 파장(위치)이 정해져 있고, <b>같은 원소의 방출선과 흡수선은 항상 {{㉢}} 위치<\/b>에 나타난다. 그래서 스펙트럼의 선은 사람의 지문처럼 원소를 구별하는 표지가 된다. 별빛의 흡수선 위치를 실험실에서 얻은 원소별 스펙트럼과 대조하면, 별의 대기에 어떤 원소가 얼마나 있는지 알 수 있다. 시험은 \"바탕이 무엇인지\"부터 본다 — 어두운 바탕 + 밝은 선 = 방출, 무지개 바탕 + 검은 선 = 흡수."], "terms": [{"k": "스펙트럼", "v": "빛을 프리즘·분광기로 파장별로 나누어 놓은 색의 띠. 연속(고온 광원) / 방출(고온·저밀도 기체, 밝은 선) / 흡수(광원 + 저온 기체, 검은 선)."}, {"k": "파장 · 분광기", "v": "파장은 빛의 골에서 골까지 거리(짧을수록 보라, 길수록 빨강). 분광기는 빛을 파장별로 나누어 스펙트럼을 보여 주는 장치."}, {"k": "원소의 지문", "v": "원소마다 선의 위치가 정해져 있고, 같은 원소의 방출선·흡수선은 같은 위치 — 별빛과 대조해 성분을 알아낸다."}], "myths": [{"x": "같은 원소라도 방출선과 흡수선의 위치는 서로 다르다.", "o": "<b>항상 같은 위치<\/b>다. 그래서 대조가 가능하다."}, {"x": "고온·저밀도 기체가 내는 빛에서는 연속 스펙트럼이 나타난다.", "o": "어두운 바탕에 <b>밝은 선<\/b>만 나타나는 방출 스펙트럼이다. 연속은 고온의 광원."}], "point": "연속(고온 광원) · 방출(고온·저밀도 기체, 밝은 선) · 흡수(광원 + 저온 기체, 검은 선). 같은 원소 → 방출선·흡수선 위치 동일 = 원소의 지문 → 별빛 분석으로 성분 파악.", "answers": "정답 ㉠ 검은 ㉡ 저온 ㉢ 같은 — '흡수선 = 그 파장의 빛을 방출했다', '방출선과 흡수선 위치가 다르다'가 단골 오답이다.", "blanks": {"㉠": "검은", "㉡": "저온", "㉢": "같은"}, "warning": "'흡수선 = 그 파장의 빛을 방출했다', '방출선과 흡수선 위치가 다르다'가 단골 오답이다.", "figure": {"caption": "스펙트럼의 세 종류 — 연속 · 방출 · 흡수. 같은 원소의 방출선과 흡수선은 항상 같은 위치에 나타난다", "file": "figures/1201-04.svg"}}, {"id": "1201-05", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1201", "lessonName": "우주의 시작과 원소의 탄생", "no": "05", "title": "우주의 조성", "subtitle": "수소 : 헬륨 = 약 3 : 1", "steps": [{"n": "①", "t": "관측", "d": "별빛과 은하의 스펙트럼을 분석하면, 우주 어디를 보아도 질량비가 <b>수소 약 74 %, 헬륨 약 24 %<\/b>로 거의 일정하다. 곧 <b>3 : 1<\/b>."}, {"n": "②", "t": "예측과 일치", "d": "빅뱅 우주론이 초기 우주의 양성자·중성자 개수비로부터 <b>계산으로 예측한 값<\/b>이 바로 3 : 1이다 — 빅뱅의 증거 ②."}, {"n": "③", "t": "질량비 vs 개수비", "d": "헬륨 1개의 질량은 수소의 약 4배. 개수비 약 {{㉠}} : 1 → 질량비 12 : 4 = 3 : 1. 문제가 어느 쪽을 묻는지 확인한다."}], "howto": [], "body": ["별빛과 은하의 스펙트럼을 분석해 보면, 우주 어디를 보아도 구성 원소의 질량비가 <b>수소 약 74 %, 헬륨 약 24 %<\/b>로 거의 일정하다. 즉 <b>수소 : 헬륨 ≈ 3 : 1<\/b>이다. 우주에서 가장 풍부한 원소는 수소이며, 이 비율은 가까운 별에서도 먼 은하에서도 같다.", "놀라운 점은, 빅뱅 우주론이 초기 우주의 양성자와 중성자 개수비로부터 <b>계산으로 예측한 값<\/b>이 바로 이 3 : 1이라는 것이다. 이론의 예측과 관측 결과가 {{㉡}}하므로, 수소·헬륨의 질량비는 개념 03의 우주 배경 복사에 이어 빅뱅 우주론의 <b>두 번째 결정적 증거<\/b>가 된다. 증거 두 개는 세트로 외운다 — ① 우주 배경 복사, ② 수소 : 헬륨 = 3 : 1.", "시험은 <b>질량비 3 : 1<\/b>과 <b>개수비 약 12 : 1<\/b>을 바꿔치기한다. 헬륨 원자 1개의 질량이 수소의 약 {{㉢}}배이므로, 개수비 12 : 1 → 질량비 12 : 4 = 3 : 1이다. 문제가 어느 쪽을 묻는지 꼭 확인한다. 별 S의 흡수선 위치가 원소 A의 방출선과 일치하면 별의 대기에 A가 있고, B의 방출선 자리에 흡수선이 없으면 B는 검출되지 않은 것이다 — 이런 방법으로 우주 전체의 3 : 1도 알아냈다."], "terms": [{"k": "우주의 조성", "v": "질량비 수소 약 74 % · 헬륨 약 24 % · 그 외 약 2 %. 우주 어디를 보아도 거의 일정하다."}, {"k": "질량비와 개수비", "v": "He 1개 질량 ≈ H 4개 질량. 개수비 H : He = 12 : 1 → 질량비 = 12 : 4 = 3 : 1."}, {"k": "빅뱅 우주론의 2대 증거", "v": "① 우주 배경 복사 ② 수소 : 헬륨 질량비 약 3 : 1(이론의 예측 = 관측)."}], "myths": [{"x": "수소와 헬륨의 '개수비'가 약 3 : 1이다.", "o": "<b>질량비<\/b>가 3 : 1이고, 개수비는 약 <b>12 : 1<\/b>이다."}, {"x": "흡수선이 있다는 것은 별이 그 파장의 빛을 방출했다는 뜻이다.", "o": "별의 대기가 그 파장을 <b>흡수<\/b>한 자리다. 같은 원소의 방출선 위치와 대조한다."}], "point": "우주의 질량비는 수소 : 헬륨 ≈ 3 : 1(개수비 12 : 1). 빅뱅 우주론의 예측과 관측이 일치한다 — 증거 ②. 증거 ①은 우주 배경 복사.", "answers": "정답 ㉠ 12 ㉡ 일치 ㉢ 4 — 질량비와 개수비를 바꿔치기한 선지가 단골 오답이다.", "blanks": {"㉠": "12", "㉡": "일치", "㉢": "4"}, "warning": "질량비와 개수비를 바꿔치기한 선지가 단골 오답이다.", "figure": {"caption": "우주의 원소 조성 — 어디를 관측해도 수소 : 헬륨 ≈ 3 : 1(질량비). 개수비 12 : 1과 헷갈리지 않는다", "file": "figures/1201-05.svg"}}, {"id": "1202-01", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1202", "lessonName": "별에서 만들어지는 원소", "no": "01", "title": "별의 탄생", "subtitle": "성운에서 별로", "steps": [{"n": "①", "t": "성운", "d": "빅뱅이 남긴 수소·헬륨이 기체와 티끌의 구름으로 짙게 모인 곳. 밀도가 높은 부분이 자신의 <b>중력<\/b>으로 {{㉠}}하기 시작한다."}, {"n": "②", "t": "원시별", "d": "수축할수록 중심이 뜨거워지고, 달아오른 기체 덩어리가 붉게 빛난다. 아직 핵융합은 시작되지 않은 '별의 아기'."}, {"n": "③", "t": "별", "d": "중심 온도가 약 <b>1000만 K<\/b>에 이르면 수소 원자핵 4개 → 헬륨 원자핵 1개의 <b>수소 핵융합<\/b>이 시작된다. 이 순간부터 별이다."}], "howto": [], "body": ["빅뱅이 남긴 수소와 헬륨은 우주 공간에 고르게 퍼져 있지만은 않았다. 기체와 티끌이 구름처럼 짙게 모여 있는 곳이 있는데, 이것을 <b>성운<\/b>이라고 한다. 성운 속에서 밀도가 높은 부분은 자신의 <b>중력<\/b>으로 주변 물질을 끌어당기며 <b>수축<\/b>하기 시작한다. 수축할수록 중심부는 점점 뜨거워지고, 달아오른 기체 덩어리는 어둠 속에서 붉게 빛나는 <b>원시별<\/b>이 된다.", "원시별이 계속 수축하여 중심부 온도가 약 <b>1000만 K<\/b>에 이르면, 드디어 수소 원자핵 {{㉡}}개가 융합하여 헬륨 원자핵 1개가 되는 <b>수소 핵융합 반응<\/b>이 시작된다. 이때 줄어든 질량의 일부가 에너지로 바뀌어 뿜어져 나오고, 천체는 스스로 빛을 내게 된다. 이 순간부터 우리는 그 천체를 <b>별<\/b>이라고 부른다. 중심에서 수소 핵융합을 하며 안정적으로 빛나는 단계의 별이 <b>주계열성<\/b>이며, 태양도 지금 이 단계다.", "여기서 놓치지 말아야 할 것이 있다. 별은 그저 빛나는 천체가 아니라, 가벼운 원소를 무거운 원소로 바꾸어 내는 {{㉢}}라는 점이다. 우주의 원소 목록이 수소·헬륨 둘에서 오늘날의 주기율표로 늘어난 것은, 수많은 별들이 수십억 년 동안 이 용광로를 돌려 온 결과다. 스스로 빛을 내면 별, 별빛을 반사하면 행성 — 이 소단원은 별이 '왜' 빛나는지를 배운다."], "terms": [{"k": "성운", "v": "우주 공간에 기체(주로 수소)와 티끌이 구름처럼 모여 있는 것. 별이 태어나는 재료 창고다."}, {"k": "원시별", "v": "수축 중이라 아직 핵융합을 시작하지 못한 '별의 아기' 단계. 수축 자체에서 나오는 열로 빛난다."}, {"k": "주계열성", "v": "중심에서 수소 핵융합을 하며 안정적으로 빛나는 단계의 별. 태양도 지금 이 단계다."}], "myths": [{"x": "원시별은 이미 핵융합을 하고 있는 작은 별이다.", "o": "아직 핵융합이 없다. <b>수축열<\/b>로 빛날 뿐이며, 1000만 K에 이르러야 별이 된다."}, {"x": "목성은 크니까 별이 될 뻔했다.", "o": "질량이 모자라 중심이 <b>1000만 K<\/b>까지 오르지 못했다 — 별의 조건은 온도(질량)다."}], "point": "성운 → (중력 수축) 원시별 → 중심 약 1000만 K → 수소 핵융합(H 4개 → He 1개 + 에너지) = 별. 별은 가벼운 원소를 무거운 원소로 바꾸는 용광로다.", "answers": "정답 ㉠ 수축 ㉡ 4 ㉢ 용광로 — '원시별은 핵융합을 한다'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "수축", "㉡": "4", "㉢": "용광로"}, "warning": "'원시별은 핵융합을 한다'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "별의 탄생 — 성운이 중력으로 수축하고, 중심 온도가 약 1000만 K에 이르러 수소 핵융합이 시작되면 별이 된다", "file": "figures/1202-01.svg"}}, {"id": "1202-02", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1202", "lessonName": "별에서 만들어지는 원소", "no": "02", "title": "태양 같은 별의 일생", "subtitle": "탄소·질소·산소를 만들고 조용히 떠난다", "steps": [{"n": "①", "t": "적색 거성", "d": "중심부 수소가 바닥나면 중심은 수축하며 뜨거워지고, 바깥층은 크게 부푼다. 표면 온도가 낮아져 <b>붉게<\/b> 보인다."}, {"n": "②", "t": "헬륨 핵융합", "d": "뜨거워진 중심에서 헬륨 원자핵들이 융합해 {{㉠}}가, 이어서 질소·산소가 만들어진다. 우리 몸의 핵심 원소들이다."}, {"n": "③", "t": "최후", "d": "바깥층을 서서히 내보내 둥근 고리 <b>행성상 성운<\/b>을 만들고, 중심엔 작고 뜨거운 <b>백색 왜성<\/b>만 남는다."}], "howto": [], "body": ["별은 중심의 수소가 헬륨으로 바뀌는 동안 수십억 년을 안정적으로 빛난다. 그런데 연료인 <b>중심부의 수소가 바닥나면<\/b> 중심부는 다시 수축하며 뜨거워지고, 그 열에 밀려 바깥층이 크게 부풀어 오른다. 표면 온도가 낮아져 붉게 보이는 거대한 별, <b>적색 거성<\/b>이 된 것이다. 약 50억 년 뒤 태양도 적색 거성으로 부풀어 오르며, 계산상 지구 궤도 근처까지 커진다.", "수축하던 중심부가 충분히 뜨거워지면 이번에는 <b>헬륨 원자핵들이 융합하여 탄소<\/b>가, 이어지는 핵융합 반응으로 질소와 산소 같은 원소들이 만들어진다. 우리 몸의 핵심 원소들이 바로 이 단계의 별 내부에서 태어나는 것이다. 탄소는 수소 핵융합이 아니라 {{㉡}} 핵융합으로 만들어진다는 점에 주의한다.", "태양 정도 질량의 별은 여기까지다. 중심부가 그 이상의 핵융합을 일으킬 만큼 뜨거워지지 못하기 때문이다. 별은 마지막에 바깥층을 서서히 내보내 둥근 고리 모양의 <b>행성상 성운<\/b>을 만들고, 중심에는 작고 뜨거운 <b>{{㉢}}<\/b>만 남는다. '행성상 성운'은 망원경으로 행성처럼 둥글게 보여 붙은 이름일 뿐 행성과 아무 관계가 없다 — 태양 정도 질량 별의 최후를 초신성 폭발과 바꿔치기하는 선지가 단골이다. 평생 만든 탄소·질소·산소는 이때 우주로 흩어져 다음 세대의 별과 행성, 생명의 재료가 된다."], "terms": [{"k": "적색 거성", "v": "중심부 수소가 소진된 별이 부풀어 커진 단계. 표면 온도가 낮아 붉게 보인다."}, {"k": "행성상 성운", "v": "별이 내보낸 바깥층 기체가 만든 둥근 고리 모양의 성운. 행성처럼 둥글게 보여 붙은 이름일 뿐이다."}, {"k": "백색 왜성", "v": "바깥층을 다 내보낸 뒤 남은 작고 뜨거운 중심핵. 서서히 식어 간다."}], "myths": [{"x": "탄소는 별 중심부의 수소 핵융합으로 만들어진다.", "o": "<b>헬륨 핵융합<\/b>으로 만들어진다. 수소 핵융합은 헬륨까지다."}, {"x": "태양 정도 질량의 별은 초신성 폭발로 최후를 맞는다.", "o": "<b>행성상 성운 + 백색 왜성<\/b>이다. 초신성은 태양의 10배 이상 무거운 별의 최후다."}], "point": "태양 질량 별: 수소 소진 → 적색 거성 → 헬륨 핵융합으로 탄소(질소·산소) → 행성상 성운 + 백색 왜성. 만든 원소는 우주로 돌아가 다음 세대의 재료가 된다.", "answers": "정답 ㉠ 탄소 ㉡ 헬륨 ㉢ 백색 왜성 — '탄소 = 수소 핵융합', '태양의 최후 = 초신성'이 단골 오답이다.", "blanks": {"㉠": "탄소", "㉡": "헬륨", "㉢": "백색 왜성"}, "warning": "'탄소 = 수소 핵융합', '태양의 최후 = 초신성'이 단골 오답이다.", "figure": {"caption": "태양 정도 질량인 별의 진화 — 주계열성 → 적색 거성 → 행성상 성운 + 백색 왜성. 만든 원소를 고리로 내보낸다", "file": "figures/1202-02.svg"}}, {"id": "1202-03", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1202", "lessonName": "별에서 만들어지는 원소", "no": "03", "title": "무거운 별의 용광로", "subtitle": "철에서 멈추고, 폭발로 그 너머를 만든다", "steps": [{"n": "①", "t": "양파 구조", "d": "태양의 <b>10배 이상<\/b> 무거운 별은 중심이 훨씬 뜨거워 탄소 뒤에도 핵융합이 이어진다. 산소·네온·마그네슘·규소를 지나 <b>철<\/b>까지, 무거울수록 안쪽에 쌓인다."}, {"n": "②", "t": "왜 철에서 멈추나", "d": "철 원자핵은 <b>가장 안정한 원자핵<\/b>이라 더 융합해도 에너지가 나오지 않는다. 에너지를 못 내는 용광로는 꺼진다."}, {"n": "③", "t": "초신성 폭발", "d": "연료가 끊긴 중심이 순식간에 무너지고 별 전체가 폭발. 이 에너지 속에서 철보다 무거운 {{㉠}}·은·우라늄이 만들어져 흩뿌려진다."}], "howto": [], "body": ["질량이 <b>태양의 10배 이상<\/b>인 무거운 별은 이야기가 다르다. 강한 중력 덕분에 중심부가 훨씬 높은 온도까지 올라가므로, 탄소가 만들어진 뒤에도 핵융합이 멈추지 않는다. 탄소에서 산소·네온·마그네슘·규소를 지나, 마침내 <b>철<\/b>까지 만들어진다. 무거운 원소일수록 중심 쪽에 쌓이므로, 별의 내부는 양파처럼 <b>겹겹의 층 구조<\/b>가 된다. 무거운 별이 부풀어 오른 이 단계를 <b>초거성<\/b>이라 한다.", "그런데 왜 하필 철에서 멈출까? 철 원자핵은 <b>가장 {{㉡}}한 원자핵<\/b>이어서, 철을 더 융합해도 에너지가 나오지 않기 때문이다. 에너지를 내지 못하는 용광로는 꺼질 수밖에 없다. 그래서 별 내부의 핵융합으로 만들어지는 가장 무거운 원소는 <b>철<\/b>이다.", "연료가 끊긴 중심부는 순식간에 무너져 내리고, 그 충격으로 별 전체가 격렬하게 폭발한다. 이것이 <b>초신성 폭발<\/b>이다. 이 폭발의 막대한 에너지 속에서 비로소 철보다 무거운 금·은·우라늄 같은 원소들이 만들어지고, 별이 평생 만든 원소들과 함께 우주 공간으로 흩뿌려진다. 폭발 뒤 중심핵은 밀도가 어마어마한 중성자별이나 블랙홀이 된다. 시험의 최다 빈출은 원소의 '출생지 바꿔치기' — 핵융합은 철까지, 철보다 무거우면 {{㉢}} 폭발. \"금이 별 중심부의 핵융합으로 만들어졌다\"는 선지는 무조건 틀린 선지다."], "terms": [{"k": "초거성", "v": "무거운 별이 부풀어 오른, 적색 거성보다 훨씬 큰 단계. 이 안에서 핵융합이 층층이 이어진다."}, {"k": "철(Fe)", "v": "가장 안정한 원자핵. 더 융합해도 에너지가 나오지 않아 별 내부 핵융합의 종착점이다."}, {"k": "초신성(超新星)", "v": "폭발로 갑자기 밝아져 '새로 나타난 별'처럼 보인다고 붙은 이름. 실제로는 별의 탄생이 아니라 최후다. 남는 것은 중성자별·블랙홀."}], "myths": [{"x": "금·은·우라늄은 무거운 별의 중심부 핵융합으로 만들어진다.", "o": "핵융합은 <b>철까지<\/b>. 철보다 무거운 원소는 <b>초신성 폭발<\/b>의 에너지 속에서 만들어진다."}, {"x": "무거운 별의 내부는 중심으로 갈수록 가벼운 원소가 분포한다.", "o": "중심으로 갈수록 <b>무거운<\/b> 원소다. 중심에는 철."}], "point": "무거운 별(태양의 10배 이상): 양파 구조로 철까지 핵융합 → 철은 가장 안정해 에너지가 안 나옴 → 중심 붕괴 → 초신성 폭발 → 금·은·우라늄 생성·방출.", "answers": "정답 ㉠ 금 ㉡ 안정 ㉢ 초신성 — '금이 핵융합으로 만들어졌다', '중심으로 갈수록 가벼운 원소'가 단골 오답이다.", "blanks": {"㉠": "금", "㉡": "안정", "㉢": "초신성"}, "warning": "'금이 핵융합으로 만들어졌다', '중심으로 갈수록 가벼운 원소'가 단골 오답이다.", "figure": {"caption": "무거운 별의 최후 — 층층이 원소를 쌓다가 철에서 멈추고, 초신성 폭발로 철보다 무거운 원소까지 만들어 내보낸다", "file": "figures/1202-03.svg"}}, {"id": "1202-04", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1202", "lessonName": "별에서 만들어지는 원소", "no": "04", "title": "태양계의 형성", "subtitle": "별의 유산으로 만들어졌다", "steps": [{"n": "①", "t": "태양계 성운", "d": "초신성이 흩뿌린 원소가 수소·헬륨 구름과 섞여 새 성운이 된다. 약 <b>50억 년 전<\/b> 그중 하나가 수축을 시작했다."}, {"n": "②", "t": "원반과 미행성체", "d": "수축하며 빨리 회전해 납작한 <b>원반<\/b>이 되고, 중심에 <b>원시 태양<\/b>. 원반의 티끌이 뭉쳐 수 km의 {{㉠}}가 되고, 충돌·합체해 행성으로."}, {"n": "③", "t": "거리가 재료를 정한다", "d": "안쪽은 뜨거워 금속·암석만 → 작고 밀도 큰 <b>지구형<\/b>. 바깥쪽은 차가워 얼음·기체까지 → 크고 밀도 작은 <b>목성형<\/b>."}], "howto": [], "body": ["초신성이 흩뿌린 원소들은 사라지지 않는다. 우주 공간을 떠돌다가 수소·헬륨 구름과 섞여 새로운 <b>성운<\/b>이 된다. 약 <b>50억 년 전<\/b>, 이런 성운 하나가 — 근처 초신성 폭발의 충격 등으로 — 수축하기 시작했다. 이것이 <b>태양계 성운<\/b>, 우리 태양계의 출발점이다. 성운은 수축하면서 점점 빨리 회전하여 납작한 원반 모양이 되었고, 물질이 몰린 중심부에서는 <b>원시 태양<\/b>이 자라났다.", "원반에 남은 티끌들은 서로 뭉쳐 수 km 크기의 <b>미행성체<\/b>가 되었고, 미행성체들이 충돌하고 합쳐지며 행성으로 성장했다. 행성의 재료는 태양으로부터의 거리에 따라 달랐다. 태양과 가까운 안쪽은 온도가 높아 녹는점이 높은 <b>금속과 암석<\/b>만 남아 뭉쳤다 — 작지만 밀도가 큰 <b>{{㉡}} 행성<\/b>(수성·금성·지구·화성)이다. 멀어서 차가운 바깥쪽에서는 얼음과 수소·헬륨 기체까지 끌어모아 크고 밀도가 작은 <b>목성형 행성<\/b>(목성·토성·천왕성·해왕성)이 되었다. 지구형이냐 목성형이냐는 결국 '온도' 문제다.", "갓 태어난 지구는 쉼 없는 미행성체 충돌의 열로 표면이 온통 녹은 <b>마그마 바다<\/b> 상태였다. 이때 무거운 {{㉢}}이 중심으로 가라앉아 <b>핵<\/b>이 되고, 가벼운 물질은 겉에서 맨틀과 지각이 되었다. 지구가 식자 수증기가 비가 되어 내려 <b>원시 바다<\/b>가 만들어졌고, 그 바다에서 생명의 역사가 시작되었다."], "terms": [{"k": "미행성체", "v": "원반의 티끌이 뭉쳐 만들어진 수 km 크기의 작은 천체. 행성의 벽돌이다."}, {"k": "지구형 vs 목성형", "v": "지구형: 작다·밀도 크다·암석/금속(안쪽, 뜨거움). 목성형: 크다·밀도 작다·기체/얼음(바깥쪽, 차가움)."}, {"k": "마그마 바다", "v": "초기 지구 표면이 미행성체 충돌열로 녹아 있던 상태. 핵·맨틀 분리가 이때 일어났다."}], "myths": [{"x": "태양에서 가까운 곳에서는 얼음과 기체가 뭉쳐 행성이 되었다.", "o": "가까운 곳은 뜨거워 <b>금속·암석<\/b>만 남았다 — 지구형. 얼음·기체는 바깥쪽 목성형."}, {"x": "태양계 성운은 빅뱅 직후의 순수한 수소·헬륨 구름이었다.", "o": "이전 세대 별과 <b>초신성이 만든 무거운 원소<\/b>가 섞여 있었다 — 그래서 지구에 철과 금이 있다."}], "point": "약 50억 년 전 태양계 성운 수축 → 회전 원반 + 원시 태양 → 미행성체 → 충돌·성장 → 행성. 가까우면 암석(지구형), 멀면 얼음·기체(목성형). 초기 지구는 마그마 바다에서 핵·맨틀이 나뉘었다.", "answers": "정답 ㉠ 미행성체 ㉡ 지구형 ㉢ 철 — 안쪽·바깥쪽 재료를 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "미행성체", "㉡": "지구형", "㉢": "철"}, "warning": "안쪽·바깥쪽 재료를 바꾼 선지가 단골 오답이다.", "figure": {"caption": "태양계의 형성 — 성운 수축 → 회전 원반과 원시 태양 → 미행성체 → 행성(안쪽은 암석, 바깥쪽은 얼음·기체), 그리고 초기 지구", "file": "figures/1202-04.svg"}}, {"id": "1202-05", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1202", "lessonName": "별에서 만들어지는 원소", "no": "05", "title": "몸속 원소의 족보", "subtitle": "우리는 별의 먼지다", "steps": [{"n": "①", "t": "몸의 원소", "d": "사람 몸 질량의 대부분은 <b>산소(약 65 %) · 탄소(약 18 %) · 수소(약 10 %) · 질소(약 3 %)<\/b>가 차지한다."}, {"n": "②", "t": "출생지", "d": "수소는 <b>빅뱅<\/b>(01), 탄소·질소·산소는 <b>별 내부의 핵융합<\/b>, 칼슘·철과 금은 <b>무거운 별과 {{㉠}} 폭발<\/b>이 만들었다."}, {"n": "③", "t": "결론", "d": "몸속 산소 원자 하나하나는 태양계가 생기기 전 어느 별의 중심에서 만들어진, <b>태양보다 나이 많은 존재<\/b>다."}], "howto": [], "body": ["이제 처음의 질문으로 돌아가자. 사람 몸 질량의 대부분은 <b>산소(약 65 %)·탄소(약 18 %)·수소(약 10 %)·질소(약 3 %)<\/b>가 차지한다. 이 네 원소가 몸 질량의 약 96 %이며, 단백질·DNA·물이 모두 이 원소들로 되어 있다. 그런데 이 네 원소의 '출생지'를 우리는 이미 모두 배웠다.", "<b>수소<\/b>는 빅뱅 직후의 우주 초기에 만들어졌다(소단원 01). <b>탄소·질소·산소<\/b>는 별 내부의 {{㉡}}이, 뼈의 칼슘과 피의 철, 반지의 금은 무거운 별과 초신성 폭발이 만들었다. 그 원소들이 모여 태양계와 지구가, 바다에서 생명이 되었다. 지각에서 가장 많은 원소도 산소(약 47 %)로, 몸속 산소와 출생지가 같다 — 별 내부.", "그러므로 몸속의 산소 원자 하나하나는 태양계가 생기기 전 어느 별의 중심에서 만들어진, <b>태양보다 나이 많은 존재<\/b>다. \"우리는 별의 먼지\"는 낭만적 비유가 아니라 별의 진화 연구로 확인된 {{㉢}}이며, 지구와 생명의 역사는 우주 역사의 한 갈래로 이어져 있다. 족보 세 줄만 외운다 — 수소는 빅뱅, 철까지는 별, 철 너머는 초신성. 몸무게 60 kg이면 산소 약 39 kg, 탄소 약 11 kg, 수소 약 6 kg, 질소 약 2 kg — 이 중 빅뱅 출신은 수소뿐이고 나머지는 모두 별이 만들었다."], "terms": [{"k": "생명체의 원소", "v": "산소·탄소·수소·질소가 몸 질량의 약 96 %를 차지한다. 단백질·DNA·물이 모두 이 원소들로 되어 있다."}, {"k": "원소의 족보", "v": "수소·헬륨 = 빅뱅 / 탄소~철 = 별 내부 핵융합 / 철 너머(금·은·우라늄) = 초신성 폭발."}, {"k": "지각의 산소", "v": "지각에서 가장 많은 원소도 산소(약 47 %)다. 몸속 산소와 출생지가 같다 — 별 내부."}], "myths": [{"x": "사람 몸에서 질량 기준으로 가장 많은 원소는 탄소다.", "o": "<b>산소(약 65 %)<\/b>다. 탄소는 약 18 %."}, {"x": "지구와 생명의 역사는 우주의 역사와 무관하게 진행되었다.", "o": "지구와 생명은 별이 남긴 물질로 되어 있다 — <b>우주 역사의 일부<\/b>다."}], "point": "몸의 원소 산소 65 · 탄소 18 · 수소 10 · 질소 3 %. 수소는 빅뱅, 철까지는 별, 철 너머는 초신성 — 몸의 약 90 %는 문자 그대로 별의 먼지다.", "answers": "정답 ㉠ 초신성 ㉡ 핵융합 ㉢ 과학적 사실 — '몸에서 가장 많은 원소는 탄소'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "초신성", "㉡": "핵융합", "㉢": "과학적 사실"}, "warning": "'몸에서 가장 많은 원소는 탄소'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "몸속 원소의 족보 — 산소 65 % · 탄소 18 % · 수소 10 % · 질소 3 %, 그리고 각 원소가 태어난 곳", "file": "figures/1202-05.svg"}}, {"id": "1203-01", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1203", "lessonName": "원소의 주기성과 화학 결합", "no": "01", "title": "주기율표", "subtitle": "원소를 정리하는 지도, 같은 족은 한 가족", "steps": [{"n": "①", "t": "주기성", "d": "원소 118가지를 <b>원자 번호<\/b>(양성자 수) 순으로 늘어놓으면 성질이 비슷한 원소가 <b>일정한 간격으로 반복<\/b>된다."}, {"n": "②", "t": "족과 주기", "d": "세로줄이 {{㉠}}(1~18), 가로줄이 주기(1~7). <b>같은 족 원소는 화학적 성질이 비슷하다.<\/b> 왼쪽·가운데는 금속, 오른쪽 위는 비금속."}, {"n": "③", "t": "두 가족", "d": "1족 <b>알칼리 금속<\/b>(Li·Na·K): 무르고 물·산소와 격렬히 반응 → 석유 보관. 17족 <b>할로젠<\/b>(F·Cl·Br·I): 반응성 커 살균·소독에 쓰인다."}], "howto": [], "body": ["별들이 만들어 낸 원소는 자연에 약 90가지, 인공 원소까지 더하면 <b>118가지<\/b>다. 과학자들은 이 원소들을 <b>원자 번호<\/b>(양성자 수) 순으로 늘어놓다가 놀라운 사실을 발견했다 — <b>성질이 비슷한 원소가 일정한 간격으로 반복해서 나타난다<\/b>는 것이다. 이 규칙성을 <b>주기성<\/b>이라 하고, 성질이 비슷한 원소가 같은 세로줄에 오도록 배열한 표가 <b>주기율표<\/b>다. 1869년 멘델레예프가 처음 만들었고, 빈칸의 원소들을 예언해 실제로 발견되었다.", "주기율표의 세로줄을 <b>족<\/b>(1~18족), 가로줄을 <b>주기<\/b>(1~7주기)라고 한다. 핵심은 이것이다 — <b>같은 족 원소들은 화학적 성질이 비슷하다.<\/b> 그래서 주기율표는 외우는 표가 아니라, 원소의 성격을 위치로 읽어 내는 지도가 된다. 왼쪽과 가운데는 대부분 {{㉡}}, 오른쪽 위는 비금속 원소의 구역이다.", "대표 선수 두 가족으로 확인한다. <b>1족<\/b>의 리튬(Li)·나트륨(Na)·칼륨(K)은 <b>알칼리 금속<\/b>이다. 하나같이 칼로 잘릴 만큼 무르고, 산소와 빠르게 반응해 광택을 잃으며, 물과 만나면 격렬하게 반응한다 — 물기와 공기를 피해 <b>석유 속에 보관<\/b>할 정도다. <b>17족<\/b>의 플루오린(F)·염소(Cl)·브로민(Br)·아이오딘(I)은 <b>할로젠<\/b>이다. 역시 반응성이 커서 금속이나 수소와 잘 반응해 화합물을 만든다. 수돗물 소독(염소), 충치 예방(플루오린), 상처 소독(아이오딘) — 살균·소독 물질에 할로젠이 많은 이유다. 단, <b>수소(H)는 1족이지만 알칼리 금속이 {{㉢}}<\/b> — 알칼리 금속은 '수소를 제외한' 1족 금속 원소다."], "terms": [{"k": "족 · 주기", "v": "세로줄이 족(1~18), 가로줄이 주기(1~7). 같은 족은 화학적 성질이 비슷하다. 배열 기준은 원자 번호(양성자 수)."}, {"k": "알칼리 금속", "v": "수소를 제외한 1족 금속(Li·Na·K). 무르고, 물·산소와 격렬히 반응 → 석유 보관. 물과 반응한 용액이 염기성(알칼리성)이라 붙은 이름."}, {"k": "할로젠", "v": "17족(F·Cl·Br·I). '염(소금)을 만드는 자'. 반응성이 커 금속·수소와 잘 반응하며, F₂·Cl₂처럼 이원자 분자로 존재한다."}], "myths": [{"x": "수소는 1족이므로 알칼리 금속이다.", "o": "알칼리 금속은 <b>수소를 제외한<\/b> 1족 금속 원소다. 이 예외가 단골 함정이다."}, {"x": "할로젠은 다른 원소와 거의 반응하지 않는다.", "o": "<b>반응성이 크다<\/b>. 거의 반응하지 않는 것은 18족 비활성 기체다."}], "point": "주기율표: 세로줄 = 족(성질 비슷), 가로줄 = 주기. 1족 알칼리 금속(무르다, 물·산소와 격렬 반응, 석유 보관) · 17족 할로젠(반응성 큼, 소독·살균).", "answers": "정답 ㉠ 족 ㉡ 금속 ㉢ 아니다 — '수소 = 알칼리 금속', '할로젠은 반응성이 작다'가 단골 오답이다.", "blanks": {"㉠": "족", "㉡": "금속", "㉢": "아니다"}, "warning": "'수소 = 알칼리 금속', '할로젠은 반응성이 작다'가 단골 오답이다.", "figure": {"caption": "주기율표의 구조와 두 가족 — 같은 족 원소는 행동이 닮았다. 수소(H)는 1족이지만 알칼리 금속이 아니다", "file": "figures/1203-01.svg"}}, {"id": "1203-02", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1203", "lessonName": "원소의 주기성과 화학 결합", "no": "02", "title": "전자 배치", "subtitle": "주기성의 진짜 이유는 바깥 전자", "steps": [{"n": "①", "t": "전자껍질", "d": "전자는 원자핵 주위의 <b>전자껍질<\/b>에 안쪽부터 차례로 들어간다. 첫 껍질 최대 <b>2<\/b>개, 둘째 <b>8<\/b>개, 셋째 <b>8<\/b>개. 나트륨(전자 11개)은 2, 8, 1."}, {"n": "②", "t": "원자가 전자", "d": "화학 반응에서 실제로 일하는 <b>가장 바깥 껍질의 전자<\/b>. 주고받거나 공유되는 것이 이 전자들이라 {{㉠}} 수가 화학적 성질을 결정한다."}, {"n": "③", "t": "비밀이 풀린다", "d": "Li(2, 1) · Na(2, 8, 1) · K(2, 8, 8, 1) — 껍질 수도 전자 수도 다르지만 원자가 전자가 모두 <b>1개<\/b>. 그래서 같은 1족, 그래서 닮았다."}], "howto": [], "body": ["원자 속 전자들은 아무렇게나 흩어져 있지 않고, 원자핵 주위의 <b>전자껍질<\/b>에 안쪽부터 차례로 들어간다. 첫 번째 껍질에는 최대 <b>2개<\/b>, 두 번째 껍질에는 최대 <b>8개<\/b>, 세 번째 껍질에도 <b>8개<\/b>까지 채워진다. 예를 들어 전자가 11개인 나트륨의 배치는 2, 8, 1 — 안쪽 두 껍질을 채우고 가장 바깥에 1개가 남는다. 원자는 (+)전하의 원자핵과 (−)전하의 전자로 이루어져 있고, 전체적으로 중성이다.", "화학 반응에서 실제로 일하는 전자는 <b>가장 바깥 껍질의 전자<\/b>다. 이를 <b>원자가 전자<\/b>라고 한다. 다른 원자와 만났을 때 주고받거나 공유되는 것이 바로 이 전자들이기 때문에, <b>원자가 전자 수가 화학적 성질을 결정한다<\/b>.", "이제 주기성의 비밀이 풀린다. 리튬(2, 1)·나트륨(2, 8, 1)·칼륨(2, 8, 8, 1)은 전자껍질 수도, 전체 전자 수도 다르지만 <b>원자가 전자가 모두 1개<\/b>다. 그래서 같은 1족이고, 그래서 행동이 닮았다. <b>같은 족 = 원자가 전자 수가 {{㉡}} = 성질이 비슷하다.<\/b> 한편 같은 주기 원소들은 {{㉢}} 수가 같다. 원자가 전자가 가장 안쪽 껍질의 전자라고 바꾼 선지, 나트륨과 칼륨의 원자가 전자 수가 다르다고 한 선지가 함정이다 — 둘 다 1개다."], "terms": [{"k": "전자껍질", "v": "원자핵 주위에서 전자가 도는 층. 안쪽부터 최대 2, 8, 8…개가 채워진다."}, {"k": "원자가 전자", "v": "가장 바깥 껍질의 전자. 화학 결합에 참여하는 주인공이며, 그 수가 화학적 성질을 결정한다."}, {"k": "족과 주기의 뜻", "v": "같은 족 = 원자가 전자 수가 같다(성질 비슷). 같은 주기 = 전자껍질 수가 같다."}], "myths": [{"x": "원자가 전자는 가장 안쪽 껍질에 있는 전자다.", "o": "<b>가장 바깥 껍질<\/b>의 전자다. 바깥 전자가 반응을 결정한다."}, {"x": "나트륨(2, 8, 1)과 칼륨(2, 8, 8, 1)은 전자 수가 다르니 성질도 다르다.", "o": "원자가 전자가 <b>둘 다 1개<\/b>라 같은 1족이고 성질이 닮았다."}], "point": "전자껍질은 안쪽부터 2, 8, 8…. 가장 바깥 전자 = 원자가 전자 → 성질 결정. 같은 족 = 원자가 전자 수 같음, 같은 주기 = 전자껍질 수 같음.", "answers": "정답 ㉠ 원자가 전자 ㉡ 같다 ㉢ 전자껍질 — '원자가 전자 = 안쪽 껍질', 'Na와 K는 원자가 전자 수가 다르다'가 단골 오답이다.", "blanks": {"㉠": "원자가 전자", "㉡": "같다", "㉢": "전자껍질"}, "warning": "'원자가 전자 = 안쪽 껍질', 'Na와 K는 원자가 전자 수가 다르다'가 단골 오답이다.", "figure": {"caption": "1족 원소의 전자 배치 — Li(2, 1) · Na(2, 8, 1) · K(2, 8, 8, 1). 같은 족 = 원자가 전자 수가 같다 = 성질이 비슷하다", "file": "figures/1203-02.svg"}}, {"id": "1203-03", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1203", "lessonName": "원소의 주기성과 화학 결합", "no": "03", "title": "결합의 이유", "subtitle": "모든 원자는 비활성 기체를 닮으려 한다", "steps": [{"n": "①", "t": "비활성 기체", "d": "18족 He(2) · Ne(2, 8) · Ar(2, 8, 8)은 다른 원소와 거의 반응하지 않는다. 비결은 <b>가장 바깥 껍질이 가득 차 있다<\/b>는 것."}, {"n": "②", "t": "원리", "d": "다른 원자들도 비활성 기체처럼 <b>바깥 껍질이 가득 찬 배치<\/b>를 이루려 한다. 그래서 전자를 잃거나, 얻거나, {{㉠}}한다 — 이것이 <b>화학 결합<\/b>."}, {"n": "③", "t": "누가 잃고 누가 얻나", "d": "Na(2, 8, 1)는 1개를 잃어 Ne형(2, 8), Cl(2, 8, 7)는 1개를 얻어 Ar형(2, 8, 8). 원자가 전자가 적은 <b>금속은 잃는 쪽<\/b>, 많은 <b>비금속은 얻는 쪽<\/b>."}], "howto": [], "body": ["주기율표의 맨 오른쪽, <b>18족<\/b>에는 헬륨(He)·네온(Ne)·아르곤(Ar)이 있다. 이들은 <b>비활성 기체<\/b> — 다른 원소와 거의 반응하지 않고 원자 홀로 안정하게 존재한다. 비결은 전자 배치에 있다. He(2), Ne(2, 8), Ar(2, 8, 8) — 모두 <b>가장 바깥 전자껍질이 가득 차 있다<\/b>. 반응하지 않는 성질 그대로 헬륨 풍선, 네온사인, 아르곤 용접·전구 충전재에 쓰인다.", "여기서 화학 전체를 관통하는 원리가 나온다. <b>다른 원자들도 비활성 기체처럼 바깥 껍질이 가득 찬 전자 배치를 이루려 한다<\/b>는 것. 그래서 다른 원자와 만나 전자를 <b>잃거나, 얻거나, 공유<\/b>한다 — 이것이 <b>화학 결합<\/b>이다. 원자가 바깥 껍질에 전자 8개를 채워 안정해지려는 경향을 {{㉡}} 규칙이라 한다.", "예를 들어 나트륨(2, 8, 1)은 전자 1개를 <b>잃으면<\/b> 네온형 배치(2, 8)가, 염소(2, 8, 7)는 전자 1개를 <b>얻으면<\/b> 아르곤형 배치(2, 8, 8)가 된다. 원자가 전자가 적은 <b>금속은 잃는 쪽<\/b>, 많은 <b>{{㉢}}은 얻는 쪽<\/b>이 쉽다. 시험의 단골은 '잃다/얻다' 바꿔치기 — Na는 잃어서 Ne형(2, 8), Cl는 얻어서 Ar형(2, 8, 8). \"몇 개를, 어느 쪽으로\"까지 세트로 판정하는 습관을 들인다."], "terms": [{"k": "비활성 기체", "v": "18족 He(2)·Ne(2, 8)·Ar(2, 8, 8). 바깥 껍질이 가득 차 거의 반응하지 않는다. 헬륨 풍선·네온사인·아르곤 용접에 쓰인다."}, {"k": "화학 결합의 이유", "v": "비활성 기체형(바깥 껍질이 가득 찬) 전자 배치를 이루려고 전자를 잃거나·얻거나·공유한다."}, {"k": "옥텟 규칙", "v": "원자가 바깥 껍질에 전자 8개를 채워 안정해지려는 경향. '여덟(octet)'에서 온 이름이다."}], "myths": [{"x": "나트륨은 전자 1개를 얻어 비활성 기체형 배치가 된다.", "o": "전자 1개를 <b>잃어<\/b> 네온형(2, 8)이 된다. 금속은 잃는 쪽이 쉽다."}, {"x": "비활성 기체는 바깥 껍질이 비어 있어 안정하다.", "o": "바깥 껍질이 <b>가득 차<\/b> 있어 안정하다."}], "point": "결합의 이유 = 비활성 기체형(가득 찬 바깥 껍질) 배치를 이루려고 전자를 잃거나·얻거나·공유한다. 금속 = 잃기 쉽다(Na → Ne형), 비금속 = 얻기 쉽다(Cl → Ar형).", "answers": "정답 ㉠ 공유 ㉡ 옥텟 ㉢ 비금속 — 'Na는 전자를 얻는다'처럼 잃다/얻다를 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "공유", "㉡": "옥텟", "㉢": "비금속"}, "warning": "'Na는 전자를 얻는다'처럼 잃다/얻다를 바꾼 선지가 단골 오답이다.", "figure": {"caption": "비활성 기체의 전자 배치와 결합의 이유 — 모든 화학 결합은 이 '가득 찬 바깥 껍질'을 향한다", "file": "figures/1203-03.svg"}}, {"id": "1203-04", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1203", "lessonName": "원소의 주기성과 화학 결합", "no": "04", "title": "이온 결합", "subtitle": "소금이 만들어지는 방식, 주고받기", "steps": [{"n": "①", "t": "전자가 이동", "d": "잃기 쉬운 금속과 얻기 쉬운 비금속이 만난다. Na(2, 8, 1)가 원자가 전자 1개를 Cl(2, 8, 7)에게 <b>넘겨준다<\/b>."}, {"n": "②", "t": "이온", "d": "나트륨은 (+)의 <b>양이온<\/b> Na<sup>+<\/sup>(네온형), 염소는 (−)의 <b>음이온<\/b> Cl<sup>−<\/sup>(아르곤형). 둘 다 원하던 안정한 배치를 얻었다."}, {"n": "③", "t": "인력", "d": "(+)와 (−)는 끌어당긴다. 양이온과 음이온이 {{㉠}}으로 단단히 결합 — <b>이온 결합<\/b>. 대표가 염화 나트륨(NaCl), 소금."}], "howto": [], "body": ["전자를 잃기 쉬운 금속과 얻기 쉬운 비금속이 만나면 어떻게 될까? 나트륨(2, 8, 1)은 원자가 전자 1개를 염소(2, 8, 7)에게 <b>넘겨준다<\/b>. 그 결과 나트륨은 (+)전하를 띤 <b>양이온<\/b>(Na<sup>+<\/sup>, 네온형 배치)이 되고, 염소는 (−)전하를 띤 <b>음이온<\/b>(Cl<sup>−<\/sup>, 아르곤형 배치)이 된다. 둘 다 원하던 안정한 배치를 얻은 것이다. 이온의 표기는 잃으면 +, 얻으면 −를 원소 기호 오른쪽 위에 쓴다.", "(+)와 (−)는 서로 끌어당긴다. 양이온과 음이온이 <b>정전기적 인력<\/b>으로 단단히 결합하는 것 — 이것이 <b>이온 결합<\/b>이다. 이렇게 만들어진 대표 물질이 <b>염화 나트륨(NaCl)<\/b>, 우리가 매일 먹는 소금이다. 이온 결합은 이처럼 주로 <b>{{㉡}} 원소와 비금속 원소 사이<\/b>에서 형성된다. 소금 결정이 정육면체인 것은 Na<sup>+<\/sup>과 Cl<sup>−<\/sup>이 번갈아 규칙적으로 쌓여 격자를 이루기 때문이다.", "소금은 인류 생존의 필수품이다. 몸속에서 Na<sup>+<\/sup> 이온은 체액의 균형과 {{㉢}} 전달에 쓰인다 — 우리가 소금 없이 살 수 없는 이유도, 결국 이 작은 이온들의 일 때문이다. 이온 결합은 '주고받기', 공유 결합(개념 05)은 '같이 쓰기'다. 전자의 소유권이 넘어갔느냐, 공동 소유냐 — 이 한 줄만 잡으면 섞이지 않는다."], "terms": [{"k": "이온 결합", "v": "양이온과 음이온이 정전기적 인력으로 결합하는 것. 주로 금속 + 비금속 사이. 예: 염화 나트륨(NaCl)."}, {"k": "이온의 표기", "v": "잃으면 +, 얻으면 −를 원소 기호 오른쪽 위에 쓴다. Na⁺(전자 1개 잃음), Cl⁻(전자 1개 얻음)."}, {"k": "정전기적 인력", "v": "(+)전하와 (−)전하 사이에 작용하는 끌어당기는 힘. 이온 결합의 정체다."}], "myths": [{"x": "이온 결합은 전자쌍을 공유하여 형성되는 결합이다.", "o": "전자쌍 공유는 <b>공유 결합<\/b>. 이온 결합은 전자가 <b>이동<\/b>해 생긴 이온 사이의 인력이다."}, {"x": "염소 원자는 전자를 잃어 양이온이 된다.", "o": "전자를 <b>얻어 음이온<\/b>(Cl<sup>−<\/sup>)이 된다. 잃어 양이온이 되는 쪽은 금속 나트륨."}], "point": "이온 결합 = 금속 + 비금속. 전자가 이동 → 양이온·음이온 → 정전기적 인력으로 결합(예: NaCl). 주고받기 — 전자의 소유권이 넘어간다.", "answers": "정답 ㉠ 정전기적 인력 ㉡ 금속 ㉢ 신경 신호 — '이온 결합 = 전자쌍 공유'로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "정전기적 인력", "㉡": "금속", "㉢": "신경 신호"}, "warning": "'이온 결합 = 전자쌍 공유'로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "이온 결합의 형성 — 전자가 이동하고, 반대 전하의 이온이 서로 끌어당겨 소금 결정으로 쌓인다", "file": "figures/1203-04.svg"}}, {"id": "1203-05", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1203", "lessonName": "원소의 주기성과 화학 결합", "no": "05", "title": "공유 결합과 전기 전도성", "subtitle": "같이 쓰기, 그리고 결합이 성질을 정한다", "steps": [{"n": "①", "t": "공유 결합", "d": "비금속끼리는 둘 다 얻으려 해서 내주지 않는다. 해결책은 전자를 내놓아 <b>쌍으로 함께 쓰기<\/b> — 전자쌍을 {{㉠}}하는 결합. 물 H<sub>2<\/sub>O, 산소 O<sub>2<\/sub>."}, {"n": "②", "t": "분자", "d": "공유 결합으로 만들어진 입자. 물·산소·이산화 탄소·설탕 — 생명 활동을 떠받치는 물질 대부분이 공유 결합의 산물이다."}, {"n": "③", "t": "전기 전도성", "d": "판정 기준은 하나 — <b>움직일 수 있는 전하 운반 입자<\/b>가 있는가. 소금은 고체 X · 수용액 O, 설탕은 고체 X · 수용액 X."}], "howto": [], "body": ["비금속끼리 만나면 문제가 생긴다. 둘 다 전자를 얻으려는 쪽이라, 어느 쪽도 순순히 내주지 않는다. 해결책은 의외로 간단하다 — <b>전자를 서로 내놓아 쌍으로 함께 쓰는 것<\/b>. 이렇게 <b>전자쌍을 공유<\/b>하여 형성되는 결합이 <b>공유 결합<\/b>이다. 물(H<sub>2<\/sub>O)이 대표 사례다. 산소는 원자가 전자가 6개라 2개가 아쉽고, 수소는 1개뿐이라 1개가 아쉽다. 그래서 산소 1개가 수소 2개와 각각 전자쌍 1개씩을 공유하면 — 산소는 네온형, 수소 둘은 헬륨형 배치를 이루며 모두가 안정해진다.", "우리가 숨 쉬는 산소 기체(O<sub>2<\/sub>)도 산소 원자 둘이 전자쌍 2개를 공유한 공유 결합 물질이다. 공유 결합으로 만들어진 입자를 <b>{{㉡}}<\/b>라고 한다. 물·산소·이산화 탄소·설탕 — 생명 활동을 떠받치는 물질 대부분이 공유 결합의 산물이며, 탄소 원자들이 사방으로 공유 결합한 다이아몬드는 그 단단함의 끝판왕이다.", "결합 방식이 다르면 물질의 성질도 달라진다. 가장 뚜렷한 차이가 <b>전기 전도성<\/b>이다. 전기가 통하려면 <b>움직일 수 있는 전하 운반 입자<\/b>가 필요하다 — 이 한 문장이 판정 기준의 전부다. 이온 결합 물질인 염화 나트륨은 <b>고체<\/b>일 때 이온들이 인력으로 제자리에 붙들려 전기가 통하지 {{㉢}}. 그러나 물에 녹거나 액체가 되면 이온들이 자유롭게 움직이며 전하를 운반하므로 잘 통한다. 반면 공유 결합 물질인 설탕은 물에 녹아도 이온이 생기지 않아 고체든 수용액이든 통하지 않는다. \"고체 소금에는 이온이 없다\"는 선지는 틀렸다 — 이온은 있으나 움직이지 못할 뿐이다. 구리 같은 금속은 자유롭게 움직이는 전자가 전하를 운반해 고체인데도 통한다(05에서 자세히)."], "terms": [{"k": "공유 결합 · 분자", "v": "비금속끼리 전자쌍을 공유하는 결합(물 H₂O, 산소 O₂). 그렇게 묶인 입자가 분자 — 물질의 성질을 갖는 가장 작은 입자."}, {"k": "전기 전도성 판정", "v": "움직일 수 있는 전하 운반 입자(이온 또는 전자)가 그 상태에 있는가. 이온 결합 물질: 고체 X / 액체 O / 수용액 O."}, {"k": "전해질", "v": "물에 녹아 이온을 내놓아 전류를 흐르게 하는 물질. 이온 음료의 '전해질'이 바로 이 뜻이다."}], "myths": [{"x": "산소 기체(O<sub>2<\/sub>)는 이온 결합 물질이다.", "o": "산소 원자끼리 전자쌍 2개를 공유한 <b>공유 결합<\/b> 물질이다."}, {"x": "고체 염화 나트륨에는 이온이 존재하지 않는다.", "o": "이온은 <b>있지만 움직이지 못할<\/b> 뿐이다. 물이 풀어 주면 통한다."}], "point": "공유 결합 = 비금속 + 비금속, 전자쌍을 같이 쓴다(H<sub>2<\/sub>O, O<sub>2<\/sub>) → 분자. 전도성은 '움직일 수 있는 전하 운반 입자'가 기준 — 소금은 고체 X·수용액 O, 설탕은 둘 다 X.", "answers": "정답 ㉠ 공유 ㉡ 분자 ㉢ 않는다 — 'O₂ = 이온 결합', '고체 소금엔 이온이 없다', '설탕물은 전기가 통한다'가 단골 오답이다.", "blanks": {"㉠": "공유", "㉡": "분자", "㉢": "않는다"}, "warning": "'O₂ = 이온 결합', '고체 소금엔 이온이 없다', '설탕물은 전기가 통한다'가 단골 오답이다.", "figure": {"caption": "공유 결합(물 분자)과 전기 전도성 비교 — 고체 소금에도 이온은 있다, 다만 움직이지 못할 뿐이다", "file": "figures/1203-05.svg"}}, {"id": "1204-01", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1204", "lessonName": "지각과 생명체를 이루는 물질의 규칙성", "no": "01", "title": "단위체의 반복 결합", "subtitle": "재료는 달라도 원리는 하나", "steps": [{"n": "①", "t": "두 갈래", "d": "별이 만든 원소는 지구에서 발밑의 <b>지각<\/b>과 그 위의 <b>생명체<\/b>가 되었다. 지각은 산소·규소, 생명체는 탄소·수소·산소·질소 — 주재료부터 다르다."}, {"n": "②", "t": "같은 전략", "d": "작고 간단한 <b>기본 {{㉠}}<\/b>를 만들고 그것을 <b>반복해서 결합<\/b>시킨다. 레고 블록 몇 종류로 집도 성도 우주선도 만들듯이."}, {"n": "③", "t": "세 주인공", "d": "규산염 광물 ← 규산염 사면체 · 단백질 ← 아미노산 · 핵산 ← 뉴클레오타이드. 단위체는 다르다, 원리는 같다."}], "howto": [], "body": ["별이 만든 원소들은 지구에서 두 갈래의 물질이 되었다. 발밑의 <b>지각<\/b>과, 그 위에 사는 <b>생명체<\/b>다. 지각에는 산소와 규소가, 생명체에는 탄소·수소·산소·질소가 많다 — 주재료부터 다르다. 그런데 <b>물질이 만들어지는 방식<\/b>을 들여다보면, 놀랍게도 둘은 같은 전략을 쓴다.", "그 전략은 <b>작고 간단한 단위체를 만들고, 그것을 반복해서 결합시키는 것<\/b>이다. 이때 반복되는 기본 재료를 <b>기본 단위체<\/b>라고 한다. 레고를 떠올리면 된다 — 블록 몇 종류만 있으면, 쌓는 방법에 따라 집도 성도 우주선도 만들 수 있다.", "이 소단원에서 만날 세 주인공이 바로 그 사례다. 지각의 <b>규산염 광물<\/b>은 규산염 {{㉡}}가, 생명체의 <b>단백질<\/b>은 아미노산이, 유전 정보를 담은 <b>핵산<\/b>은 {{㉢}}가 반복 결합하여 만들어진다. 재료는 셋 다 다르지만 원리는 하나 — 이것이 이 소단원의 제목이 말하는 '규칙성'이다. 표어 하나로 정리한다 — '단위체는 다르다, 원리는 같다'. 사면체·아미노산·뉴클레오타이드, 이름 셋만 짝지어 두면 절반은 끝이다. 암석은 광물로 이루어져 있고, 이 소단원에서는 그 광물이 '무엇으로' 되어 있는지를 배운다."], "terms": [{"k": "기본 단위체", "v": "큰 물질을 만들 때 반복해서 사용되는 기본 재료. 레고의 블록 한 개에 해당한다."}, {"k": "지각 vs 생명체의 원소", "v": "지각: 산소 > 규소. 생명체: 산소·탄소·수소·질소. (소단원 02에서 본 '별이 만든 원소'들이다.)"}, {"k": "세 쌍", "v": "규산염 사면체 → 규산염 광물 / 아미노산 → 단백질 / 뉴클레오타이드 → 핵산(DNA·RNA)."}], "myths": [{"x": "지각과 생명체는 재료가 다르니 만들어지는 원리도 전혀 다르다.", "o": "재료는 달라도 <b>단위체의 반복 결합<\/b>이라는 같은 원리로 만들어진다."}, {"x": "물질이 다양하려면 단위체의 종류가 많아야 한다.", "o": "단위체는 <b>적은 종류<\/b>로 충분하다. 다양성은 결합 방식과 배열에서 나온다(개념 05)."}], "point": "지각과 생명체의 물질은 모두 적은 종류의 기본 단위체가 반복 결합해 만들어진다. 사면체 → 광물, 아미노산 → 단백질, 뉴클레오타이드 → 핵산 — 단위체는 다르고 원리는 같다.", "answers": "정답 ㉠ 단위체 ㉡ 사면체 ㉢ 뉴클레오타이드 — 세 쌍(단위체 ↔ 물질)을 바꿔 짝지은 선지가 단골 오답이다.", "blanks": {"㉠": "단위체", "㉡": "사면체", "㉢": "뉴클레오타이드"}, "warning": "세 쌍(단위체 ↔ 물질)을 바꿔 짝지은 선지가 단골 오답이다.", "figure": {"caption": "재료는 달라도 원리는 하나 — 단위체가 반복 결합하여 지각(규산염 광물)과 생명(단백질·핵산)의 물질이 된다", "file": "figures/1204-01.svg"}}, {"id": "1204-02", "book": "1", "bookName": "통합과학 1", "unit": "II", "unitName": "물질과 규칙성", "lessonId": "1204", "lessonName": "지각과 생명체를 이루는 물질의 규칙성", "no": "02", "title": "규산염 광물", "subtitle": "사면체 하나가 어떻게 이어지느냐", "steps": [{"n": "①", "t": "지각의 원소", "d": "<b>산소(약 47 %)<\/b>와 규소(약 28 %)가 압도적. 그래서 지각 광물 대부분은 이 둘을 기본으로 하는 <b>규산염 광물<\/b>이다."}, {"n": "②", "t": "단위체", "d": "규소 <b>1<\/b>개를 중심으로 산소 {{㉠}}개가 결합한 <b>규산염 사면체<\/b>. 이웃 사면체와 산소를 공유하며 연결된다."}, {"n": "③", "t": "결합 방식이 광물을 가른다", "d": "독립 → 감람석, 한 줄 사슬 → 휘석, 판 → 흑운모(잘 벗겨짐), 사방 그물(망상) → 석영(단단함)."}], "howto": [], "body": ["지각의 원소는 <b>산소(약 47 %)<\/b>와 <b>규소(약 28 %)<\/b>가 압도적이다 — 나머지(알루미늄·철·칼슘 등)를 다 합쳐도 4분의 1이 안 된다. 그래서 지각의 광물 대부분은 이 둘을 기본으로 하는 <b>규산염 광물<\/b>이다. 감람석, 휘석, 각섬석, 흑운모, 석영, 장석 — 모두 규산염 가족이다. 규소는 산소와 안정한 결합을 잘 만들고 지각에 풍부하다 — 탄소가 생명의 골격이 된 것과 닮은 이유다.", "규산염 광물의 기본 단위체는 규소 1개를 중심으로 산소 4개가 결합한 <b>규산염 사면체<\/b>다. 사면체들은 이웃 사면체와 {{㉡}}를 공유하며 연결되고, 어떻게 연결되느냐에 따라 전혀 다른 광물이 된다.", "사면체가 하나씩 <b>독립<\/b>해 있으면 감람석, <b>한 줄 사슬<\/b>이면 휘석, 사슬 두 줄이 나란히 붙은 복사슬이면 각섬석, <b>얇은 판<\/b>이면 잘 벗겨지는 흑운모, <b>사방으로 이어진 그물(망상) 구조<\/b>면 단단한 {{㉢}}이 된다. 단위체는 하나인데, 결합 방식이 광물의 다양성을 만드는 것이다. 흑운모가 얇게 벗겨지는 것도, 석영이 단단한 것도 사면체의 결합 방식 때문 — 구조가 성질을 만든다. 숫자 바꿔치기 단골 두 가지 — ① 사면체 = 규소 1 + 산소 4(반대로 내면 틀림) ② 지각 최다 원소 = 산소(규소가 아니다)."], "terms": [{"k": "규산염 광물", "v": "규소와 산소를 기본 골격으로 하는 광물의 총칭. 지각 광물의 대부분을 차지한다(감람석·휘석·각섬석·흑운모·석영·장석)."}, {"k": "규산염 사면체", "v": "규소 1개를 중심으로 산소 4개가 결합한 단위체. 이웃과 산소를 공유하며 독립·사슬·복사슬·판·망상으로 연결된다."}, {"k": "구조와 성질", "v": "흑운모가 얇게 벗겨지는 것도, 석영이 단단한 것도 결합 방식 때문 — 구조가 성질을 만든다."}], "myths": [{"x": "규산염 사면체는 규소 4개와 산소 1개로 이루어진다.", "o": "<b>규소 1개 + 산소 4개<\/b>다. 숫자를 뒤집은 선지가 단골이다."}, {"x": "지각에 가장 많은 원소는 규소다.", "o": "<b>산소(약 47 %)<\/b>다. 규소는 약 28 %로 2위."}], "point": "지각: 산소 > 규소 → 규산염 광물. 단위체 = 규산염 사면체(Si 1 + O 4), 산소를 공유하며 독립·사슬·판·망상으로 결합 → 감람석·휘석·흑운모·석영.", "answers": "정답 ㉠ 4 ㉡ 산소 ㉢ 석영 — '규소 4 + 산소 1', '지각 최다 원소 = 규소'가 단골 오답이다.", "blanks": {"㉠": "4", "㉡": "산소", "㉢": "석영"}, "warning": "'규소 4 + 산소 1', '지각 최다 원소 = 규소'가 단골 오답이다.", "f
