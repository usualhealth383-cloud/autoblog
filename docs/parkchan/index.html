<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박찬 과학 · 하루 한 개념</title>
<meta name="description" content="통합과학 개념 하나를 매일 배달합니다. 학원 강의 교재를 그대로 옮겼습니다.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#147D6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="박찬 과학">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<!-- 웹폰트는 첫 화면을 막지 않는다. 망이 느리면(지하철·학교 와이파이) 기기 한글 고딕으로 먼저 읽히고,
     폰트가 도착하면 자연스럽게 바뀐다. media 를 print 로 두었다가 onload 에서 all 로 올리는 방법. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" crossorigin="anonymous" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;700&display=swap"></noscript>
<style>
:root{
  --paper:#FAF8F4; --ground:#EFECE6; --card:#FFFFFF;
  --ink:#1E2A2E; --body:#3A484D; --muted:#566268; --faint:#5E6B70;
  --line:#E2DED6; --hair:#EDE9E2;
  --u:#147D6F; --u-soft:#E7F5F1; --u-line:#C9E7DF; --u-dark:#0F6357;
  /* 브랜드 색 — 앱 껍데기(탭·기본 버튼·시작 화면)는 단원과 무관하게 늘 이 색이다 */
  --brand:#147D6F; --brand-soft:#E7F5F1; --brand-line:#C9E7DF; --brand-dark:#0F6357;
  /* 색이 깔린 자리에 얹는 글자 — 밝은 모드는 흰색, 어두운 모드는 브랜드 색이 밝아지므로 짙은 색 */
  --on-color:#FFFFFF; color-scheme:light;
  --no:#C0392B; --no-soft:#FBECEA; --warn:#8A6408; --warn-soft:#FFF7E0;
  --shadow:0 4px 20px rgba(30,42,46,.07);
  /* 웹폰트가 늦거나 막혀도 한글이 바탕체로 떨어지지 않도록 기기 고딕을 명시한다 */
  /* 화면 가장자리 안전 영역 — Android 15·16(API 35·36)은 앱을 상태바·제스처 막대 밑까지 그린다(끌 수 없음).
     Capacitor 가 넣어 주는 --safe-area-inset-*(옛 WebView 에서도 정확)을 먼저, 없으면 env() */
  --sat:var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); --sab:var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --sal:var(--safe-area-inset-left, env(safe-area-inset-left, 0px)); --sar:var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Noto Serif KR','Apple SD Gothic Neo',Georgia,'Nanum Myeongjo',serif;
}
:root[data-theme="light"]{ color-scheme:light; }
:root[data-unit="I"]{ --u:#AE4A1B; --u-soft:#FBEFE7; --u-line:#F0D9C7; --u-dark:#A64516; }
:root[data-unit="II"]{ --u:#147D6F; --u-soft:#E7F5F1; --u-line:#C9E7DF; --u-dark:#0F6357; }
:root[data-unit="III"]{ --u:#4053B8; --u-soft:#ECEFFA; --u-line:#D9DFF5; --u-dark:#2E3E96; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14191B; --ground:#0B0F10; --card:#1B2224;
    --ink:#EDEAE4; --body:#C3CCCE; --muted:#9AA6A9; --faint:#8B9699;
    --line:#2C3538; --hair:#242C2E;
    --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6;
    --brand:#4FBFAC; --brand-soft:#122724; --brand-line:#1D3D38; --brand-dark:#7FD6C6;
    --on-color:#0B1614; color-scheme:dark;
    --no:#E4776A; --no-soft:#2C1A18; --warn:#D9A73C; --warn-soft:#2A2314;
    --shadow:0 4px 20px rgba(0,0,0,.45);
  }
  :root:not([data-theme="light"])[data-unit="I"]{ --u:#E4885A; --u-soft:#2A1D16; --u-line:#412A1E; --u-dark:#F0A275; }
  :root:not([data-theme="light"])[data-unit="II"]{ --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6; }
  :root:not([data-theme="light"])[data-unit="III"]{ --u:#8B99E4; --u-soft:#191D2E; --u-line:#2A3054; --u-dark:#A9B4EE; }
}
:root[data-theme="dark"]{
  --paper:#14191B; --ground:#0B0F10; --card:#1B2224;
  --ink:#EDEAE4; --body:#C3CCCE; --muted:#9AA6A9; --faint:#8B9699;
  --line:#2C3538; --hair:#242C2E;
  --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6;
  --brand:#4FBFAC; --brand-soft:#122724; --brand-line:#1D3D38; --brand-dark:#7FD6C6;
  --on-color:#0B1614; color-scheme:dark;
  --no:#E4776A; --no-soft:#2C1A18; --warn:#D9A73C; --warn-soft:#2A2314;
  --shadow:0 4px 20px rgba(0,0,0,.45);
}
:root[data-theme="dark"][data-unit="I"]{ --u:#E4885A; --u-soft:#2A1D16; --u-line:#412A1E; --u-dark:#F0A275; }
:root[data-theme="dark"][data-unit="II"]{ --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6; }
:root[data-theme="dark"][data-unit="III"]{ --u:#8B99E4; --u-soft:#191D2E; --u-line:#2A3054; --u-dark:#A9B4EE; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font-family:var(--sans);
  word-break:keep-all;line-height:1.6;display:flex;justify-content:center;
  min-height:100vh;font-size:var(--fs,15px)}
.app{width:100%;max-width:440px;background:var(--paper);min-height:100vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative;padding:var(--sat) var(--sar) 0 var(--sal)}
.stripe{height:4px;background:var(--brand);flex:0 0 auto}
main{flex:1;padding:16px 18px calc(96px + var(--sab));overflow-x:hidden;overflow-x:clip}   /* clip: 가로 넘침만 자르고, 가입 화면 아래 고정 버튼(sticky)은 살린다 */
.hide{display:none!important}
button{font-family:inherit;color:inherit}

/* 상단 바 */
/* 이번 주 리듬 — 월–일 점 7개. 이어진 날(연속)은 세지 않는다 */
.rhythm{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:10px 14px;margin:2px 0 13px}
.rhythm .k{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--muted);line-height:1.3}
.rhythm .dots{flex:1;display:flex;justify-content:space-between;gap:4px;max-width:236px;margin-left:auto}
.rhythm .dt{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--faint);min-width:18px}
.rhythm .dt i{display:block;width:10px;height:10px;border-radius:50%;background:var(--hair);border:1.5px solid var(--line)}
.rhythm .dt.on i{background:var(--u);border-color:var(--u)}
.rhythm .dt.today{color:var(--u)}
.rhythm .dt.today i{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--u)}
.rhythm .dt.later i{background:transparent;border-style:dashed}
.rhythm .n{flex:0 0 auto;font-size:15px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.rhythm .n small{font-size:11px;color:var(--muted);font-weight:700}
.rhythm.tile{flex-direction:column;gap:6px;background:none;border:none;padding:0;margin:0}
.rhythm.tile .dots{max-width:none;width:100%;margin:0;gap:2px}
.rhythm.tile .dt{min-width:0;font-size:0;gap:0}
.rhythm.tile .dt i{width:8px;height:8px}
.rhythm.tile .k{order:3;font-size:11px;font-weight:400;color:var(--muted)}
.rhythm.tile .n{order:1;font-size:21px;line-height:1.2}
.rhythm.tile .n small{font-size:12px;font-weight:600}
.rhythm.tile .dots{order:2}
.tile.rtile{padding:12px 8px}
.week .d.later i{background:transparent;border:1.5px dashed var(--line)}
/* 오늘의 복습 카드 — 차분하게, 숫자 하나 */
.revcard{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;text-align:left;background:var(--card);border:1px solid var(--u-line);border-radius:16px;padding:12px 14px;margin:-2px 0 13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.revcard .ic{flex:0 0 38px;height:38px;border-radius:12px;background:var(--u-soft);display:grid;place-items:center}
.revcard .ic svg{width:20px;height:20px;stroke:var(--u);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.revcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.revcard .tx b{font-size:14.5px;font-weight:800}
.revcard .tx b em{font-style:normal;color:var(--u);font-variant-numeric:tabular-nums;margin-left:2px}
.revcard .tx span{font-size:12.5px;color:var(--muted);line-height:1.5}
.revcard .chev{flex:0 0 18px;width:18px;height:18px;stroke:var(--faint);stroke-width:2.2;fill:none;stroke-linecap:round}
.revcard.done{cursor:default;border-color:var(--hair)}
.qhead .rk{display:inline-block;font-size:11px;font-weight:800;color:var(--u);background:var(--u-soft);border-radius:999px;padding:1px 8px;margin-right:6px}
.revnext{justify-content:center;font-size:13.5px;margin:0 0 14px}
/* 여러 번 갈린 문제 — 다시 묻지 않고 개념 카드로 */
.leechcard{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:16px;margin:4px 0 13px}
.leechcard .h{font-size:15px;font-weight:900;color:var(--ink);margin-bottom:6px}
.leechcard p{font-size:13.5px;color:var(--body);line-height:1.7;margin-bottom:8px}
.leechcard p.c{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:12px}
.leechcard .btn{margin-bottom:8px}
p.leech{font-size:12.5px;color:var(--muted);line-height:1.6;margin:-4px 0 8px}
.pausenote{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:8px 8px 8px 14px;margin:0 0 13px;font-size:12.5px;line-height:1.6;color:var(--body)}
.pausenote .linkbtn{flex:0 0 auto;min-height:44px;padding:0 10px;font-weight:800;color:var(--brand-dark)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .date{font-size:13px;color:var(--muted)}
.top .hello{font-size:15px;font-weight:900;letter-spacing:-.01em}
.top .hello small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;
  color:var(--u-dark);background:var(--u-soft);padding:5px 11px;border-radius:999px}
.pill svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.pill.grey{background:var(--hair);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* 공지 */
.notice{display:flex;gap:10px;background:#FBEFE7;border:1px solid #F0D9C7;
  border-radius:13px;padding:11px 13px;margin-bottom:13px;align-items:flex-start}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .notice{background:#2A1D16;border-color:#412A1E} } :root[data-theme="dark"] .notice{background:#2A1D16;border-color:#412A1E}   /* 어두운 화면에서만(밝은 화면에 새던 것 — 2026-10-01) */
.notice .ic{width:21px;height:21px;border-radius:50%;background:#C1521E;flex:0 0 auto;
  display:grid;place-items:center;margin-top:1px;color:var(--on-color);font-size:12px;font-weight:900}
.notice .b{flex:1;min-width:0}
.notice .t{font-size:12.5px;font-weight:800;color:#C1521E;line-height:1.45}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .notice .t{color:#E4885A} } :root[data-theme="dark"] .notice .t{color:#E4885A}   /* 어두운 화면에서만(밝은 화면에 새던 것 — 2026-10-01) */
.notice .d{font-size:11.5px;color:var(--body);line-height:1.5;margin-top:2px}
.notice button{font-size:11px;font-weight:800;color:#C1521E;border:1px solid #F0D9C7;
  background:var(--card);border-radius:8px;padding:6px 11px;flex:0 0 auto;align-self:center;cursor:pointer}

/* 개념 카드 */
.card{background:var(--card);border:1px solid var(--u-line);border-radius:17px;
  padding:18px;position:relative;overflow:hidden;margin-bottom:13px}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--u)}
.loc{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--u);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.loc .acts{display:flex;gap:4px}
.loc .acts button{background:none;border:1px solid var(--hair);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.loc .acts button svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.loc .acts button.on{color:var(--warn);border-color:var(--warn)}
.loc .acts button.on svg{fill:var(--warn)}
h1{font-size:23px;font-weight:900;letter-spacing:-.025em;line-height:1.3;margin-bottom:3px}
.sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.steps{margin:2px 0 16px}
.step{display:grid;grid-template-columns:26px 1fr;column-gap:9px;align-items:baseline;
  border-top:1px solid var(--hair);padding:11px 0 12px}
.step:first-child{border-top:2.5px solid var(--u);padding-top:10px}
.step .n{grid-column:1;font-size:14px;font-weight:900;color:var(--u);font-family:var(--serif)}
.step .t{grid-column:2;font-size:14.5px;font-weight:800;margin:0;line-height:1.4;letter-spacing:-.01em}
.step .d{grid-column:2;font-size:13.5px;color:var(--body);line-height:1.75;margin-top:4px}
figure{background:var(--u-soft);border-radius:11px;padding:12px 8px 8px;text-align:center;margin-bottom:15px}
figure svg{max-width:100%;height:auto}
figcaption{font-size:11.5px;color:var(--u-dark);font-weight:700;margin-top:7px;padding:0 6px;line-height:1.5}
.howto{background:#FFFDF6;border:1px solid #EBDDB8;border-radius:11px;padding:11px 14px;margin-bottom:15px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .howto{background:#221E12;border-color:#3B3320} } :root[data-theme="dark"] .howto{background:#221E12;border-color:#3B3320}   /* 어두운 화면에서만(밝은 화면에 새던 것 — 2026-10-01) */
.howto .k{font-size:11px;font-weight:900;color:#B4830A;letter-spacing:.1em;display:block;margin-bottom:7px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .howto .k{color:#D9A73C} } :root[data-theme="dark"] .howto .k{color:#D9A73C}   /* 어두운 화면에서만(밝은 화면에 새던 것 — 2026-10-01) */
.howto li{font-size:12.5px;line-height:1.7;color:var(--body);margin-bottom:5px;list-style:none;padding-left:15px;text-indent:-15px}
.howto li b.n{color:#B4830A;font-weight:900;margin-right:6px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .howto li b.n{color:#D9A73C} } :root[data-theme="dark"] .howto li b.n{color:#D9A73C}   /* 어두운 화면에서만(밝은 화면에 새던 것 — 2026-10-01) */
.prose p{font-family:var(--serif);font-size:15px;line-height:2;color:var(--body);margin-bottom:15px}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--ink);font-weight:700}
button.blank{display:inline-block;min-width:52px;text-align:center;border:none;
  border-bottom:2px solid var(--u);background:var(--u-soft);color:var(--u);
  font-weight:800;font-family:var(--sans);font-size:13px;
  padding:3px 8px;border-radius:5px 5px 0 0;cursor:pointer;font-feature-settings:normal}
button.blank.open{background:transparent;color:var(--u-dark)}

/* 부속 카드 */
.sec{background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:15px 17px;margin-bottom:13px}
.sec h2{font-size:12px;font-weight:900;letter-spacing:.11em;color:var(--u);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
.sec h2 .more{font-size:11px;font-weight:800;color:var(--muted);background:none;border:none;cursor:pointer;letter-spacing:0;min-height:36px;min-width:36px;padding:0 8px}
.terms dt{font-size:13px;font-weight:800;color:var(--u-dark);margin-bottom:3px}
.terms dd{font-size:13px;color:var(--body);line-height:1.72;padding-bottom:11px;margin-bottom:11px;border-bottom:1px solid var(--hair)}
.terms dd:last-child{border:none;padding-bottom:0;margin-bottom:0}
.myth{background:var(--u-soft);border-radius:11px;padding:11px 13px;margin-bottom:8px;font-size:12.5px;line-height:1.7}
.myth:last-child{margin-bottom:0}
.myth .x{color:var(--no);font-weight:900}
.myth .o{color:var(--u-dark);font-weight:900}
.point{background:var(--u-soft);border-left:4px solid var(--u);border-radius:0 13px 13px 0;padding:14px 17px;margin-bottom:13px}
.point .k{font-size:11.5px;font-weight:900;color:var(--u-dark);letter-spacing:.13em;display:block;margin-bottom:6px}
.point p{font-size:14.5px;font-weight:700;line-height:1.78}

/* 버튼 */
.btn{display:block;width:100%;text-align:center;font-size:15px;font-weight:800;padding:15px;border-radius:14px;border:none;
  background:var(--brand);color:var(--on-color);cursor:pointer;letter-spacing:-.01em;margin-bottom:13px}
.btn:disabled{background:var(--line);color:var(--faint);cursor:default}
/* 앱처럼: 누르면 살짝 눌리고, 파란 반짝임·300ms 터치 지연은 없다. 단추 글자는 길게 눌러도 선택되지 않는다 */
button,a,label,.tab,.pcard,.stu,.setrow{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,.tab,.btn,.chip,.chipbar button,.seg button{-webkit-user-select:none;user-select:none}
.btn,.pcard,.setrow.go,.stu,.roles button,.ages label,.tab,.chip,.more,.mini,.opt{transition:transform .08s ease,background-color .15s ease}
.btn:not(:disabled):active,.pcard:active,.setrow.go:active,.stu:active,.roles button:active,.ages label:active,.chip:active,.opt:not(:disabled):active{transform:scale(.985)}
.tab:active svg{transform:scale(.9)}
.vin{animation:vin .18s ease-out}
@keyframes vin{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.figslot{display:block;margin:0 auto 6px;border-radius:9px;background:linear-gradient(90deg,var(--hair) 0%,var(--ground) 45%,var(--hair) 90%);background-size:220% 100%;animation:shim 1.2s linear infinite}
.skel{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.skel i{display:block;border-radius:14px;background:linear-gradient(90deg,var(--hair) 0%,var(--ground) 45%,var(--hair) 90%);background-size:220% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-120% 0}}
#ptr{position:fixed;left:50%;top:calc(6px + var(--sat));z-index:60;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.14);display:grid;place-items:center;opacity:0;transform:translateY(-50px);pointer-events:none}
#ptr svg{width:20px;height:20px;stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linecap:round}
#ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.vin,.skel i,.figslot,#ptr.spin svg{animation:none}.btn,.pcard,.setrow.go,.stu{transition:none}}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-dark)}
.btn.danger{background:var(--no);color:var(--on-color)}
/* 확인 묻기 — 기기 기본 대화상자(주소가 찍히는 회색 창) 대신 앱 안의 작은 시트. 열린 시트 위에도 뜬다 */
.sheet-bg.yn-bg{z-index:45}
.sheet.yn{padding-top:22px}
.sheet.yn p{font-size:15px;color:var(--ink);line-height:1.65;margin-bottom:18px;word-break:keep-all}
.sheet.yn .ynb{display:flex;gap:8px}
.sheet.yn .ynb .btn{margin:0;flex:1}
.btn.sm{font-size:13px;padding:11px;margin-bottom:8px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:14px 2px}
.linkbtn.danger{color:var(--no)}

/* 문제 */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.qhead .l{font-size:14px;font-weight:900}
.tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--u-soft);color:var(--u-dark)}   /* --u 는 연한 바탕 위에서 4.47:1 — AA 미달(2026-10 점검) */
.stem{font-family:var(--serif);font-size:15px;line-height:1.85;margin-bottom:13px}
.bogi{border:1px solid var(--u-line);background:var(--u-soft);border-radius:11px;padding:12px 14px;margin-bottom:13px;font-size:13.5px;line-height:1.8}
.ask{font-size:14px;line-height:1.75;margin-bottom:12px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt{display:flex;gap:9px;font-size:13.5px;line-height:1.62;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--body);cursor:pointer;text-align:left;width:100%}
.opt .m{font-weight:800;color:var(--faint);flex:0 0 auto}
.opt .tx{flex:1}
.opt .mk{margin-left:auto;font-size:11px;font-weight:800;align-self:center;flex:0 0 auto}
.opt.ok{border-color:var(--u);background:var(--u-soft);color:var(--ink)}
.opt.ok .m,.opt.ok .mk{color:var(--u)}
.opt.bad{border-color:var(--no);background:var(--no-soft);color:var(--ink)}
.opt.bad .m,.opt.bad .mk{color:var(--no)}
.verdict{background:var(--u-soft);border-left:4px solid var(--u);border-radius:0 12px 12px 0;padding:13px 16px;margin-bottom:11px}
.verdict .h{font-size:13px;font-weight:900;color:var(--u-dark);margin-bottom:5px}
.verdict p{font-size:13.5px;line-height:1.75;color:var(--body)}
.again{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:13px;line-height:1.5}
.again b{color:var(--u);font-weight:700}
.essay{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-family:inherit;font-size:14px;line-height:1.8;color:var(--ink);background:var(--card);
  resize:vertical;min-height:96px;margin-bottom:12px}
.essay:focus{outline:2px solid var(--u);outline-offset:-2px}

/* 목록 · 검색 */
.h-page{font-size:21px;font-weight:900;letter-spacing:-.02em;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search svg{width:16px;height:16px;stroke:var(--faint);stroke-width:2.2;fill:none;stroke-linecap:round;flex:0 0 auto}
.search input{flex:1;border:none;background:none;padding:11px 0;font-size:14px;font-family:inherit;color:var(--ink);min-width:0}
.search input:focus{outline:none}
.chipbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;padding-bottom:2px}
.chipbar button{flex:0 0 auto;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.chipbar button.on{background:var(--u);border-color:var(--u);color:var(--on-color)}
.book-h{font-family:var(--serif);font-size:20px;font-weight:900;letter-spacing:-.01em;margin:26px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.book-h:first-of-type{margin-top:4px}
.unit-h{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
.unit-h:first-of-type{margin-top:4px}
.unit-h .no{font-family:var(--serif);font-size:17px;font-weight:900;color:var(--u)}
.unit-h .nm{font-size:14px;font-weight:900}
.unit-h .ln{flex:1;height:2px;background:var(--u-line)}
.row{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--hair);cursor:pointer;width:100%;background:none;
  border-left:none;border-right:none;border-top:none;text-align:left}
.row .n{font-size:11px;font-weight:900;color:var(--u-dark);background:var(--u-soft);border-radius:7px;padding:4px 7px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.row .b{flex:1;min-width:0}
.row .t{display:block;font-size:14px;font-weight:700;line-height:1.4}
.row .s{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.row .st{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.row .st svg{width:16px;height:16px;stroke:var(--u);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row .st svg.bm{stroke:var(--warn);fill:var(--warn)}
.row.locked{opacity:.45;cursor:default}
.row.locked .st svg{stroke:var(--faint);stroke-width:1.8}

/* 빈 상태 */
.empty{text-align:center;padding:56px 24px;color:var(--faint)}
.empty svg{width:44px;height:44px;stroke:var(--line);stroke-width:1.5;fill:none;margin-bottom:14px;stroke-linecap:round;stroke-linejoin:round}
.empty p{font-size:13.5px;line-height:1.8}

/* 진도 · 통계 */
.prog{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:15px 17px;margin-bottom:13px;cursor:pointer;width:100%;text-align:left}
.prog svg.ring{width:52px;height:52px;flex:0 0 auto}
.prog .lab{font-size:12px;color:var(--muted)}
.prog .val{font-size:19px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.prog .val small{font-size:13px;color:var(--muted);font-weight:600}
.prog .r{margin-left:auto;text-align:right}
.week{display:flex;gap:6px;justify-content:space-between;margin:2px 0 13px}
.week .d{flex:1;text-align:center;font-size:10.5px;color:var(--faint);font-weight:700}
.week .d i{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:10px;background:var(--hair);
  margin-bottom:4px;border:1.5px solid transparent;font-style:normal;font-size:12.5px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.week .d.on i{background:var(--u);border-color:var(--u);color:var(--on-color)}
.week .d.today i{border-color:var(--u);color:var(--u)}
.week .d.today{color:var(--u)}
.week .d.on.today i{color:var(--on-color);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--u)}   /* 오늘 공부했으면: 채운 칸 + 바깥 고리(숫자가 배경색에 묻히지 않게) */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.tile{background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:12px 10px;text-align:center}
.tile .v{font-size:21px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--ink)}
.tile .v small{font-size:12px;color:var(--muted);font-weight:600}
.tile .l{font-size:11px;color:var(--muted);margin-top:3px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:7px 0}
.bar-row .k{flex:0 0 118px;color:var(--body);font-weight:700;line-height:1.3}
.bar-row .k small{display:block;color:var(--faint);font-weight:500;font-size:10.5px}
.bar-row .bar{flex:1;height:8px;background:var(--hair);border-radius:4px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:var(--u);border-radius:4px}
.bar-row .v{flex:0 0 46px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.cal .h{font-size:10px;color:var(--faint);text-align:center;font-weight:700;padding-bottom:2px}
.cal .c{aspect-ratio:1;min-width:0;border-radius:7px;background:var(--hair);display:grid;place-items:center;font-size:10.5px;color:var(--faint)}
.cal .c.on{background:var(--u);color:var(--on-color);font-weight:800}
.cal .c.att{box-shadow:inset 0 0 0 2px var(--warn)}
.cal .c.blank{background:transparent}
.cal .c.today{box-shadow:inset 0 0 0 1.5px var(--brand)}
.cal .c.on.today{box-shadow:inset 0 0 0 1.5px var(--paper)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px;background:var(--u)}
.legend i.att{background:transparent;box-shadow:inset 0 0 0 2px var(--warn)}
/* ═ 보호자 — 이번 주 한눈에 ═ */
.pweek .week{margin-bottom:10px}
.pweek .week .d{position:relative}
.pweek .week .d b.att{display:block;width:5px;height:5px;border-radius:50%;background:var(--warn);margin:3px auto 0}
.pstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstat>div{background:var(--paper);border:1px solid var(--hair);border-radius:12px;padding:10px 8px;text-align:center}
.pstat b{display:block;font-size:22px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.pstat b small{font-size:12px;font-weight:700;color:var(--muted);margin-left:1px}
.pstat span{font-size:11.5px;color:var(--muted);font-weight:700}
.pnext{margin-top:10px;border-top:1px solid var(--hair);padding-top:6px}
/* ═ 교재 화면 워터마크 — 계정 이름·연락처 끝 4자리를 아주 옅게(읽기를 방해하지 않게). 탭(20)·시트(30) 아래 ═ */
#wm{position:fixed;inset:0;pointer-events:none;z-index:15;background-repeat:repeat;background-position:0 0}
/* ═ 마음이 힘들 때 · 상담 창구 ═ */
.help{display:flex;flex-direction:column;gap:8px;margin:4px 0 6px}
.help .hc{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:14px;background:var(--brand-soft);color:var(--ink);text-decoration:none;border:1px solid var(--brand-line)}
.help .hc b{font-size:24px;font-weight:900;color:var(--brand-dark);font-variant-numeric:tabular-nums;min-width:62px;letter-spacing:-.01em}
.help .hc span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.help .hc i{font-style:normal;font-size:14px;font-weight:800}
.help .hc small{font-size:12px;color:var(--body);word-break:keep-all}
.help .hc em{font-style:normal;font-size:12px;font-weight:800;color:var(--on-color);background:var(--brand);border-radius:999px;padding:6px 12px}
.help .now{font-size:12.5px;color:var(--muted);margin:2px 2px 0;line-height:1.6}
.sheet.care h3{font-size:18px}
.sheet.care p{color:var(--body)}
.carenote{font-size:12.5px;color:var(--body);background:var(--brand-soft);border-radius:12px;padding:10px 13px;margin:10px 0 0;line-height:1.7;word-break:keep-all}
.carenote b{color:var(--brand-dark)}
.carenote .linkbtn{padding:2px 0;font-size:12.5px;font-weight:800;color:var(--brand-dark);min-height:24px}
.carerow{border-left:3px solid var(--warn)}
.setrow>button.more{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--brand-dark);background:var(--brand-soft);border:none;border-radius:999px;padding:0 13px;min-height:34px;cursor:pointer;font-family:inherit;white-space:nowrap}
.setrow>button[data-admpdel],.setrow>button[data-admcdel]{color:var(--no);background:var(--no-soft)}
/* ═ 공부 노트 · 달력 ═ */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow .h-page{flex:1;min-width:0}
.hrow .more{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--brand-dark);background:var(--brand-soft);border:none;border-radius:999px;padding:0 14px;min-height:36px;cursor:pointer;font-family:inherit;margin-bottom:14px}
.ncal{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:12px 12px 12px;margin-bottom:14px}
.ncal .mh{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}
.ncal .mh b{font-size:16px;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ncal .mh button{width:44px;height:44px;border-radius:12px;border:none;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.ncal .mh svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ncal .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.ncal .h{font-size:11px;color:var(--faint);text-align:center;font-weight:700;padding:2px 0 4px}
.ncal .h.sun{color:var(--no)}
.ncal .c{position:relative;aspect-ratio:1;min-width:0;border:none;background:none;border-radius:12px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;padding:0}
.ncal .c.out{visibility:hidden}
.ncal .c.study{background:var(--brand-soft)}
.ncal .c.today{box-shadow:inset 0 0 0 1.5px var(--brand);color:var(--brand-dark);font-weight:900}
.ncal .c.sel{background:var(--brand);color:var(--on-color);box-shadow:none}
.ncal .c .dots{display:flex;gap:3px;height:5px}
.ncal .c .dots i{width:5px;height:5px;border-radius:50%;background:var(--brand)}
.ncal .c .dots i.ev{background:var(--warn)}
.ncal .c.sel .dots i{background:var(--on-color)}
.ncal .lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);margin-top:8px;padding:0 4px}
.ncal .lg i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-right:5px;vertical-align:0}
.ncal .lg i.st{width:10px;height:10px;border-radius:3px;background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line);vertical-align:-1px}
.ncal .lg i.ev{background:var(--warn)}
.nday{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 10px}
.nday b{font-size:17px;font-weight:900;letter-spacing:-.01em}
.nday small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;word-break:keep-all}
.nday .more{font-size:12px;font-weight:800;color:var(--muted);background:none;border:none;cursor:pointer;min-height:40px;padding:0 6px}
.ncard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-family:inherit;color:var(--ink)}
.ncard .t{display:block;font-size:15px;font-weight:800;margin-bottom:4px;word-break:keep-all;overflow-wrap:anywhere}
.ncard .b{font-size:13.5px;color:var(--body);line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ncard .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.ncard .when{font-size:11.5px;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.ccp{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;border-radius:999px;background:var(--brand-soft);color:var(--brand-dark);max-width:100%}
.ccp>span,.ccp>button{padding:5px 10px;border:none;background:none;color:inherit;font:inherit;cursor:pointer;min-width:0;overflow-wrap:anywhere;text-align:left}
.ccp>button.x{padding:5px 10px 5px 2px;font-size:14px;line-height:1}
.nempty{background:var(--card);border:1px dashed var(--line);border-radius:15px;padding:18px 16px;margin-bottom:10px;text-align:center;font-size:13.5px;color:var(--muted);line-height:1.75;word-break:keep-all}
.nsched{font-size:12.5px;color:var(--body);background:var(--warn-soft);border-radius:11px;padding:9px 12px;margin-bottom:10px;line-height:1.6;word-break:keep-all}
.nsched b{color:var(--warn);font-weight:800;margin-right:4px}
.ned .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ned .top .back{margin:0}
.ned .saved{font-size:12px;color:var(--faint);font-weight:600}
.ned .paper{background:var(--card);border:1.5px solid var(--hair);border-radius:18px;padding:14px 18px 10px;transition:border-color .15s}
.ned .paper:focus-within{border-color:var(--brand-line)}
.ned .date{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:700}
.ned .date input{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:13px;background:var(--paper);color:var(--ink);min-height:36px}
.ned input.ti{display:block;width:100%;border:none;background:none;font-size:21px;font-weight:900;color:var(--ink);font-family:inherit;padding:10px 0 6px;letter-spacing:-.01em;border-bottom:1px solid var(--hair)}
.ned textarea.bd{display:block;width:100%;min-height:42vh;border:none;background:none;font-size:15.5px;line-height:1.85;color:var(--ink);font-family:inherit;resize:none;padding:10px 0 4px;word-break:keep-all;overflow-wrap:anywhere}
.ned input.ti:focus,.ned textarea.bd:focus{outline:none}
.ned input.ti::placeholder,.ned textarea.bd::placeholder{color:var(--faint);font-weight:500}
.ned .cnt{font-size:11px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.ned .tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.ned .tools button{font-size:12.5px;font-weight:800;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--body);cursor:pointer;font-family:inherit;min-height:40px}
.ned .cs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ned .sug{font-size:12.5px;color:var(--muted);margin:-2px 0 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ned .sug button{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px dashed var(--brand-line);background:none;color:var(--brand-dark);cursor:pointer;font-family:inherit}
.ned .priv{font-size:12px;color:var(--faint);text-align:center;margin:10px 0 4px;line-height:1.7;word-break:keep-all}
.cpick{max-height:48vh;overflow-y:auto;margin:6px 0 12px;display:flex;flex-direction:column;gap:2px}
.cpick button{display:block;width:100%;text-align:left;border:none;background:none;border-radius:11px;padding:10px 10px;font-family:inherit;cursor:pointer;color:var(--ink)}
.cpick button:hover{background:var(--hair)}
.cpick b{display:block;font-size:14px;font-weight:800;word-break:keep-all}
.cpick small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;word-break:keep-all}
.cpick .on b::after{content:' ✓';color:var(--brand)}
/* 오늘 화면 — 일력(한 장씩 넘기는 달력) + 공부 노트 */
.tnote{display:flex;align-items:stretch;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:12px;margin-bottom:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.tnote .pg{flex:0 0 64px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding-bottom:6px}
.tnote .pg small{display:block;width:100%;text-align:center;background:var(--brand);color:var(--on-color);font-size:11px;font-weight:800;padding:3px 0;margin-bottom:2px;letter-spacing:.04em}
.tnote .pg b{font-size:26px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.tnote .pg i{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:700}
.tnote .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.tnote .tx b{font-size:14.5px;font-weight:800}
.tnote .tx span{font-size:13px;color:var(--body);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tnote .tx em{font-style:normal;font-size:11.5px;color:var(--faint);font-weight:600}
.tnote>svg{flex:0 0 18px;align-self:center;width:18px;height:18px;stroke:var(--faint);stroke-width:2.2;fill:none;stroke-linecap:round}

/* 내 정보 · 계정 */
.pass{background:var(--card);border:1.5px solid var(--u);border-radius:16px;padding:16px;position:relative;overflow:hidden;margin-bottom:14px}
.pass::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--u)}
.pass .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--u-dark);background:var(--u-soft);padding:4px 10px;border-radius:999px;margin-bottom:11px}
.pass .badge.grey{color:var(--muted);background:var(--hair)}
.pass .badge.warn{color:var(--warn);background:var(--warn-soft)}
.pass .who{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-bottom:2px}
.pass .where{font-size:12.5px;color:var(--muted);margin-bottom:13px}
.pass .row{display:flex;gap:9px;font-size:12px;line-height:1.55;padding:6px 0;border-top:1px solid var(--hair);cursor:default}
.pass .row dt{color:var(--muted);flex:0 0 44px}
.pass .row dd{color:var(--body);flex:1}
.pass .row dd b{color:var(--ink);font-weight:700}
.codebox{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}
.codebox h3{font-size:15px;font-weight:900;margin-bottom:6px}
.codebox p{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:13px}
.codebox .f{display:flex;gap:7px;margin-bottom:8px}
.codebox input{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink);min-width:0}
.codebox input.code{letter-spacing:.16em;text-transform:uppercase}
.codebox input:focus{outline:2px solid var(--u);outline-offset:-2px}
.codebox button{background:var(--u);color:var(--on-color);border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:800;cursor:pointer;flex:0 0 auto}
.codebox .demo{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.7}
.codebox .demo code{background:var(--u-soft);color:var(--u-dark);padding:2px 7px;border-radius:6px;font-weight:800;letter-spacing:.05em}
.codebox .err{font-size:12.5px;color:var(--no);margin-top:4px;font-weight:600}
.setrow{display:flex;align-items:center;gap:11px;padding:14px 2px;border-bottom:1px solid var(--hair);font-size:14px;cursor:default;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.setrow .l{flex:1;color:var(--body)}
.setrow .l small{display:block;font-size:11.5px;color:var(--faint)}
.setrow .v{color:var(--faint);font-size:13px}
.setrow .ctl{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.setrow{flex-wrap:wrap}
.setrow .ctl button{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.setrow .ctl button.on{background:var(--u);border-color:var(--u);color:var(--on-color)}
.setrow.go{cursor:pointer}
.setrow.go .v::after{content:" ›";font-weight:900}
select.sel{font-family:inherit;font-size:14px;font-weight:700;color:var(--u);background:var(--u-soft);border:none;border-radius:9px;padding:8px 10px;cursor:pointer}

/* 시작 · 로그인 */
.auth{min-height:calc(100vh - 4px);display:flex;flex-direction:column;padding:clamp(16px,4vh,34px) 6px 30px}
.auth.start{padding-top:clamp(10px,2.5vh,22px)}
.auth .mark{width:52px;height:52px;border-radius:16px;background:var(--brand);display:grid;place-items:center;margin-bottom:14px;box-shadow:0 6px 18px rgba(20,125,111,.22)}
.auth .mark svg{width:32px;height:32px}
.auth h1{font-size:27px;line-height:1.3;margin-bottom:8px}
.auth .lead{font-size:14.5px;color:var(--body);line-height:1.8;margin-bottom:22px}
.auth .lead b{color:var(--ink)}
.auth .f{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.auth input,.auth select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;background:var(--card);color:var(--ink)}
.auth input:focus,.auth select:focus{outline:2px solid var(--brand);outline-offset:-2px}
.auth .err{font-size:12.5px;color:var(--no);font-weight:600;margin:-4px 0 10px}
.stuedit{margin:12px 0 4px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--paper)}
.stuedit summary{cursor:pointer;font-weight:800;font-size:13.5px;color:var(--brand-dark);list-style:none;padding:2px 0}
.stuedit summary::-webkit-details-marker{display:none}
.stuedit summary::after{content:' ▾';color:var(--faint)}
.stuedit[open] summary{margin-bottom:10px}
.stuedit .g{display:flex;gap:8px;margin-bottom:8px}
.stuedit .g>*{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14.5px;font-family:inherit;background:var(--card);color:var(--ink)}
.stuedit .linkbtn small{font-weight:600;color:var(--faint)}
.auth .info{font-size:13px;line-height:1.6;color:var(--brand-dark);background:var(--brand-soft);border-radius:12px;padding:11px 13px;margin:0 0 12px;font-weight:600;word-break:keep-all}
.auth .links{display:flex;justify-content:center;gap:10px;font-size:13px;color:var(--muted);margin-top:0}
.auth .links button{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;min-height:44px;padding:0 6px}
.auth .roles{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.auth .roles button{display:flex;align-items:center;gap:11px;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px;font-size:14.5px;font-weight:800;color:var(--ink);cursor:pointer;text-align:left;line-height:1.4;min-height:56px}
.auth .roles button .ri{flex:0 0 34px;height:34px;border-radius:11px;background:var(--ground);display:grid;place-items:center;color:var(--muted)}
.auth .roles button .ri svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.auth .roles button .rt{flex:1;min-width:0}
.auth .roles button small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
.auth .roles button.on{border-color:var(--brand);background:var(--brand-soft)}
.auth .roles button.on .ri{background:var(--brand);color:var(--on-color)}
.auth .roles button.on small{color:var(--brand-dark)}
.auth label.agree{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--body);line-height:1.6;margin-bottom:14px;min-height:44px;cursor:pointer}
.auth label.agree input{width:24px;height:24px;flex:0 0 auto;margin:0;accent-color:var(--brand);cursor:pointer}
.auth label.agree u{cursor:pointer;color:var(--brand)}
.auth .fine{padding-top:10px}
.auth .hero{width:100%;height:auto;display:block;margin:0 0 18px;border-radius:20px}
.auth .facts{display:flex;gap:7px;margin:0 0 18px}
.auth .facts div{flex:1;background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:10px 6px;text-align:center}
.auth .facts b{display:block;font-size:17px;font-weight:900;color:var(--brand);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.auth .facts span{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}
.auth .lab{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 5px 2px}
.auth .lab.grp{margin:2px 0 7px 2px;color:var(--faint);font-weight:700}
.auth .fld{margin-bottom:11px}
.auth .fld input{margin:0}
/* 가입 단계 · 첫 실행 소개 */
.stepbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;min-height:44px}
.stepbar .back{margin:0;padding:0 6px 0 0}
.stepbar .track{flex:1;height:5px;border-radius:99px;background:var(--hair);overflow:hidden}
.stepbar .track i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s ease}
.stepbar .n{font-size:12px;font-weight:800;color:var(--faint);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.auth .grow{flex:1}
.auth .cta{position:sticky;bottom:0;padding:12px 0 calc(8px + var(--sab));background:linear-gradient(to top,var(--paper) 80%,transparent);margin-top:10px}
.auth .cta .btn{margin:0}
.auth .cta .btn + .btn{margin-top:8px}
.auth .btn.dim{opacity:.5}
.auth h1.q{font-size:24px;line-height:1.35;margin-bottom:6px}
.agrees{border:1.5px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;margin-bottom:12px}
.agrees .all{display:flex;align-items:center;gap:12px;padding:15px 15px;font-size:15.5px;font-weight:900;color:var(--ink);cursor:pointer;min-height:56px;border-bottom:1px solid var(--hair)}
.agrees .one{display:flex;align-items:center;gap:12px;padding:11px 15px;font-size:14px;color:var(--body);min-height:48px;cursor:pointer}
.agrees .one + .one{border-top:1px solid var(--hair)}
.agrees input{width:24px;height:24px;flex:0 0 24px;margin:0;accent-color:var(--brand);cursor:pointer}
.agrees .req{font-size:11.5px;font-weight:900;color:var(--brand-dark);margin-right:2px}
.agrees .opt{font-size:11.5px;font-weight:800;color:var(--faint);margin-right:2px}
.agrees .t{flex:1;min-width:0;word-break:keep-all}
.auth .see{background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:700;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 2px}
.pv{margin:0 15px 12px;border:1px solid var(--hair);border-radius:12px;overflow:hidden;font-size:12.5px;line-height:1.6;color:var(--body)}
.pv table{width:100%;border-collapse:collapse}
.pv th,.pv td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--hair);word-break:keep-all}
.pv th{width:74px;color:var(--muted);font-weight:800;background:var(--ground)}
.pv p{margin:0;padding:9px 10px;background:var(--ground)}
.ages{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ages label{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--card);cursor:pointer;font-size:14.5px;font-weight:800;color:var(--ink);min-height:54px}
.ages label small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ages label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.ages input{width:24px;height:24px;flex:0 0 24px;margin:0;accent-color:var(--brand)}
.pwrow{position:relative}
.pwrow input{padding-right:64px}
.pwrow button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:800;min-height:40px;min-width:48px;cursor:pointer}
.rules{display:flex;gap:12px;font-size:12px;color:var(--faint);margin:-2px 0 10px 2px;font-weight:700}
.rules .ok{color:var(--brand-dark)}
.intro{min-height:calc(100vh - 4px);display:flex;flex-direction:column;padding:12px 6px calc(20px + var(--sab))}
.intro .skip{align-self:flex-end;background:none;border:0;color:var(--muted);font-size:13.5px;font-weight:700;min-height:44px;padding:0 6px;cursor:pointer}
.intro .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:220px}
.intro .art svg{width:100%;max-width:340px;height:auto}
.intro h1{font-size:26px;line-height:1.35;margin:10px 0 8px}
.intro p{font-size:15px;line-height:1.8;color:var(--body);margin:0 0 22px;word-break:keep-all}
.intro .dots{display:flex;gap:7px;justify-content:center;margin:0 0 16px}
.intro .dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:all .25s}
.intro .dots i.on{width:22px;background:var(--brand)}
.welcome .big{width:72px;height:72px;border-radius:24px;background:var(--brand-soft);display:grid;place-items:center;margin:26px 0 16px}
.welcome .next{display:flex;flex-direction:column;gap:9px;margin:4px 0 16px}
.welcome .next div{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--body);line-height:1.6;word-break:keep-all}
.welcome .next .no{font-style:normal;flex:0 0 24px;height:24px;border-radius:8px;background:var(--brand);color:var(--on-color);display:grid;place-items:center;font-size:12px;font-weight:900}
.permcard{border:1.5px solid var(--brand-line);background:var(--brand-soft);border-radius:16px;padding:14px 15px;margin:0 0 6px}
.permcard .t{font-size:14.5px;font-weight:900;color:var(--brand-dark)}
.permcard .d{font-size:12.5px;color:var(--body);line-height:1.6;margin:3px 0 10px}
.auth .demo{border-top:1px solid var(--hair);margin-top:auto;padding-top:14px}
.auth .demo p{font-size:11.5px;color:var(--faint);text-align:center;margin-bottom:8px}
.auth .demo .row{display:flex;gap:6px}
.auth .demo button{flex:1;font-size:12px;font-weight:700;color:var(--body);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 4px;cursor:pointer}
.auth .demo button:active{background:var(--brand-soft)}
.auth .code-in{letter-spacing:normal}
.auth .code-in:not(:placeholder-shown){letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.auth .or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:11.5px;margin:6px 0 12px}
.auth .or::before,.auth .or::after{content:"";flex:1;height:1px;background:var(--hair)}

/* 이용권 */
.plan{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;position:relative}
.plan.best{border-color:var(--brand)}
.plan .tag{position:absolute;top:-10px;right:14px;background:var(--brand);color:var(--on-color)}
.plan h3{font-size:16px;font-weight:900;margin-bottom:2px}
.plan .price{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.plan .price small{font-size:12px;color:var(--muted);font-weight:600}
.plan ul{list-style:none;font-size:12.5px;color:var(--body);line-height:1.8;margin-bottom:10px}
.plan ul li::before{content:"✓ ";color:var(--brand);font-weight:900}
.plan .btn{margin:0}

/* 문제 은행 */
.bank-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pick{background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:13px 15px;margin-bottom:10px}
.pick .k{font-size:11.5px;font-weight:900;letter-spacing:.1em;color:var(--u);margin-bottom:8px;display:block}
.pick .chipbar{margin-bottom:0}
.pick select{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;background:var(--paper);color:var(--ink)}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.qbar .bar{flex:1;height:6px;background:var(--hair);border-radius:3px;overflow:hidden}
.qbar .bar i{display:block;height:100%;background:var(--u)}
.oxrow{display:flex;gap:10px;margin-bottom:14px}
.oxrow button{flex:1;font-size:26px;font-weight:900;padding:18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--body);cursor:pointer}
.oxrow button.ok{border-color:var(--u);background:var(--u-soft);color:var(--u-dark)}
.oxrow button.bad{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.oxrow button:disabled{cursor:default}
.blankin{display:flex;gap:8px;margin-bottom:14px}
.blankin input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;background:var(--card);color:var(--ink);min-width:0}
.blankin button{background:var(--u);color:var(--on-color);border:none;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:800;cursor:pointer}
/* 확신도 한 탭 · 해설 없는 문항의 개념 카드 링크 */
.conf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.conf .k{font-size:12px;font-weight:700;color:var(--faint);margin-right:2px}
.conf button{min-height:44px;min-width:84px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
.conf button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}
.confnote{font-size:13px;font-weight:700;color:var(--u-dark);margin:0 0 6px;line-height:1.6;word-break:keep-all}
.verdict .cgo{background:var(--card);border:1px solid var(--u-line);color:var(--u-dark);margin-top:6px;padding:12px;font-size:14px}
/* 원장 '처리할 것' — 학생 탭 맨 위 */
.todo summary{display:flex;align-items:center;gap:8px;min-height:44px;flex-wrap:wrap}
.todo summary .none{font-weight:600;font-size:13px;color:var(--muted)}
.todo-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.todo-row .b{flex:1;min-width:0}
.todo-row .nm{display:block;font-weight:800;font-size:14px;color:var(--ink)}
.todo-row .nm small{font-weight:600;font-size:12px;color:var(--faint);margin-left:4px}
.todo-row .why{display:block;font-size:12.5px;line-height:1.65;color:var(--body);margin-top:2px;word-break:keep-all}
.todo-act{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--brand-line);background:var(--card);color:var(--brand-dark);font-family:inherit;font-size:13px;font-weight:800;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer;white-space:nowrap}
.wrongbox{background:var(--no-soft);border-left:4px solid var(--no);border-radius:0 12px 12px 0;padding:11px 14px;margin-bottom:11px;font-size:13px;line-height:1.7;color:var(--body)}
.wrongbox .h{font-size:12px;font-weight:900;color:var(--no);margin-bottom:3px}
.result{background:var(--card);border:1.5px solid var(--u);border-radius:16px;padding:18px;text-align:center;margin-bottom:13px}
.result .big{font-size:38px;font-weight:900;letter-spacing:-.03em;color:var(--u);line-height:1.1}
.result .sub{margin:4px 0 0;font-size:13px}
.lab-list .row .n{background:var(--warn-soft);color:var(--warn)}
.labcard h3{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-bottom:4px}
.labcard .k{font-size:11.5px;font-weight:900;letter-spacing:.1em;color:var(--u);display:block;margin:14px 0 6px}
.labcard p,.labcard li{font-size:14px;line-height:1.8;color:var(--body)}
.labcard ol{padding-left:18px}
.labcard figure{margin:10px 0}
.qfig{background:var(--u-soft);border-radius:11px;padding:10px 6px;margin-bottom:12px;text-align:center;cursor:zoom-in}
.qfig svg{max-width:100%;height:auto}
figure.zoomable{cursor:zoom-in}
/* 그림 확대 보기 */
.fv{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;flex-direction:column;padding:var(--sat) var(--sar) 0 var(--sal)}
.fv .bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--hair);font-size:13px;font-weight:800}
.fv .bar button{background:var(--hair);border:none;border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer;color:var(--ink);font-family:inherit;margin-left:6px}
.fv .stage{flex:1;overflow:hidden;touch-action:none;position:relative;display:grid;place-items:center;background:var(--card)}
.fv .stage svg{max-width:100%;height:auto;transform-origin:0 0;user-select:none}
.fv .cap{padding:10px 16px max(14px,var(--sab));font-size:12.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--hair)}

/* 탭바 */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;border-top:1px solid var(--hair);background:var(--card);
  padding:9px 0 max(11px,var(--sab));z-index:20}
.tab{flex:1;text-align:center;font-size:10.5px;color:var(--faint);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:2px 0}
.tab.on{color:var(--brand)}
.tab svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fine{font-size:11.5px;color:var(--faint);text-align:center;line-height:1.7;padding:8px 10px 0}
.nextup{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 0 13px}
.nextup.one{grid-template-columns:1fr}
.nextup button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:72px;justify-content:center}
.nextup .t{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.35}
.nextup .d{font-size:11.5px;color:var(--muted);line-height:1.4}
.donebar{background:var(--brand-soft);color:var(--brand-dark);border-radius:14px;padding:14px;text-align:center;font-size:14px;font-weight:800;margin-bottom:13px}
/* 오늘의 한 마디 */
.qsay{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:19px 17px 14px 20px;margin:0 0 11px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.qsay::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.qsay .k{display:block;font-size:11px;font-weight:900;letter-spacing:.13em;color:var(--brand);margin-bottom:13px}
.qsay blockquote{font-family:var(--serif);font-size:16.5px;line-height:1.9;color:var(--ink);letter-spacing:-.01em;font-weight:500;margin:0 0 13px}
.qsay .orig{font-size:11.5px;color:var(--faint);line-height:1.65;margin:-7px 0 12px}
.qsay .by{display:flex;flex-direction:column;gap:1px;margin-bottom:2px}
.qsay .by .who{font-size:13.5px;font-weight:800;color:var(--body)}
.qsay .by .role{font-size:11.5px;color:var(--muted)}
.qsay .src{font-size:11px;color:var(--faint);line-height:1.65;margin-top:6px}
.qsay .src a{color:var(--faint)}
.qsay .note{background:var(--brand-soft);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.75;color:var(--brand-dark);margin-top:13px}
.qsay .acts{display:flex;gap:8px;margin-top:14px;border-top:1px solid var(--hair);padding-top:11px}
.qsay .acts button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;font-size:12.5px;font-weight:800;
  color:var(--muted);background:none;border:1px solid var(--line);border-radius:11px;cursor:pointer}
.qsay .acts button.on{color:var(--brand);border-color:var(--brand-line);background:var(--brand-soft)}
.qsay .acts svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.qsay .acts button.on svg{fill:currentColor;stroke:none}
.staff{display:inline-block;margin-left:5px;font-size:10px;font-weight:900;color:var(--on-color);background:var(--brand);border-radius:5px;padding:1px 6px;vertical-align:1px}
.cm.staffc{border-left:3px solid var(--brand);padding-left:10px}
.newc{display:inline-block;font-size:11px;font-weight:900;color:var(--brand-dark);background:var(--brand-soft);border-radius:999px;padding:2px 9px;margin:6px 0 2px}
.tab{position:relative}
.tdot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#C2410C;box-shadow:0 0 0 2px var(--card)}
.consent{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:16px;padding:14px 16px;margin:0 0 14px;word-break:keep-all}
.consent .t{font-size:14px;font-weight:900;color:var(--brand-dark);margin-bottom:3px}
.consent .d{font-size:12.5px;line-height:1.65;color:var(--body);margin-bottom:10px}
.consent .r{display:flex;gap:8px;flex-wrap:wrap}
.consent .r .btn{flex:1;min-width:140px;margin:0;padding:11px 12px;font-size:13.5px}
.cst{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.cst.wait{color:var(--warn);background:var(--warn-soft,rgba(138,100,8,.1))}
.cst.ok{color:var(--brand-dark);background:var(--brand-soft)}
.todaysched{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--hair);border-radius:14px;
  padding:12px 14px;margin-bottom:12px;cursor:pointer;text-align:left}
.todaysched .l{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--body);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.todaysched .l i{font-style:normal;color:var(--faint);font-weight:600}
.todaysched .dd{flex:0 0 auto;font-size:12px;font-weight:900;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:5px 10px;font-variant-numeric:tabular-nums}
.qbridge{background:var(--u-soft);border-radius:14px;padding:13px 15px;margin:0 0 13px;font-size:13px;line-height:1.75;color:var(--body)}
.qbridge b{display:block;font-size:10.5px;font-weight:900;letter-spacing:.12em;color:var(--u);margin-bottom:5px}
.qlist blockquote{font-family:var(--serif);font-size:14.5px;line-height:1.8;color:var(--ink);margin:0 0 6px}
.qlist .row{border-bottom:1px solid var(--hair);padding:14px 0}
.qlist .row:last-child{border-bottom:none}
.qlist .m{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.qlist .m button{background:none;border:none;color:var(--faint);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:4px}
/* 이야기 (커뮤니티) */
.netbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--sab));width:calc(100% - 36px);max-width:404px;
  display:flex;align-items:center;gap:9px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:13px;padding:11px 13px;z-index:30}
.netbar svg{width:17px;height:17px;flex:0 0 auto;stroke:var(--warn);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.netbar span{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--warn);line-height:1.5}
.netbar button{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--warn);background:none;border:1px solid var(--warn);border-radius:9px;padding:7px 11px;cursor:pointer;min-height:34px}
.loadfail{background:var(--card);border:1px dashed var(--line);border-radius:15px;padding:22px 16px;text-align:center;margin-bottom:12px}
.loadfail p{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:12px}
.tsafe{background:var(--brand-soft);border-radius:13px;padding:11px 13px;margin-bottom:12px;font-size:11.5px;line-height:1.7;color:var(--brand-dark)}
.tsafe b{font-weight:900}
.pcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:14px 15px;margin-bottom:9px;cursor:pointer}
.pcard .h{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.pcard .bd{font-size:10.5px;font-weight:900;letter-spacing:.06em;color:var(--on-color);background:var(--u);border-radius:5px;padding:2px 7px}
.pcard .bd.qna{background:#4053B8}.pcard .bd.share{background:#C1521E}.pcard .bd.talk{background:var(--brand)}
.pcard .ok{font-size:10.5px;font-weight:900;color:var(--brand-dark);background:var(--brand-soft);border-radius:5px;padding:2px 7px}
.pcard .t{font-size:15px;font-weight:800;color:var(--ink);line-height:1.45;letter-spacing:-.01em;margin-bottom:4px}
.pcard .x{font-size:12.5px;color:var(--muted);line-height:1.6;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .m{display:flex;gap:12px;font-size:11.5px;color:var(--faint);margin-top:9px;align-items:center}
.pcard .m span{display:inline-flex;align-items:center;gap:4px}
.pcard .m svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pcard.hidden{opacity:.55}
.pfull{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:17px 16px;margin-bottom:12px}
.pfull h2{font-size:19px;font-weight:900;line-height:1.4;letter-spacing:-.02em;margin:8px 0 8px}
.pfull .body{font-size:15px;line-height:1.9;color:var(--body);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.pfull .meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.attachcard{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--ground);border:1px solid var(--hair);border-radius:13px;padding:12px 13px;margin-top:13px;cursor:pointer}
.attachcard .k{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--u)}
.attachcard b{display:block;font-size:13.5px;font-weight:800;color:var(--ink);margin-top:2px;line-height:1.4}
.attachcard small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.prow{display:flex;gap:8px;margin-bottom:14px}
.prow button{flex:1;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:800;
  color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:11px;cursor:pointer}
.prow button.on{color:var(--brand);border-color:var(--brand-line);background:var(--brand-soft)}
.prow svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.prow button.on svg{fill:currentColor;stroke:none}
.cm{border-top:1px solid var(--hair);padding:14px 0}
.cm:first-child{border-top:none}
.cm .h{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-bottom:5px;flex-wrap:wrap}
.cm .h b{font-size:12.5px;font-weight:800;color:var(--body)}
.cm .picked{font-size:10.5px;font-weight:900;color:var(--on-color);background:var(--brand);border-radius:5px;padding:2px 7px}
.cm .body{font-size:14px;line-height:1.8;color:var(--body);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.cm .a{display:flex;gap:12px;margin-top:7px;font-size:11.5px}
.cm .a button{background:none;border:none;color:var(--faint);font-size:11.5px;cursor:pointer;padding:5px 0;min-height:32px}
.cm .a button.on{color:var(--brand);font-weight:800}
.cwrite{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.cwrite textarea{flex:1;min-height:46px;max-height:140px;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-family:inherit;font-size:14px;line-height:1.7;background:var(--card);color:var(--ink);resize:vertical}
.cwrite button{flex:0 0 auto;min-height:46px;padding:0 16px;font-size:14px;font-weight:800;background:var(--brand);color:var(--on-color);border:none;border-radius:12px;cursor:pointer}
.fbref{font-size:12.5px;line-height:1.6;background:var(--paper,var(--bg));border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:10px;color:var(--ink);word-break:keep-all}
.fbref span{display:block;font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.02em}
.fbcount{text-align:right;font-size:11.5px;color:var(--faint);margin:-4px 2px 10px;font-variant-numeric:tabular-nums}
.flag{display:block;margin:4px auto 14px;background:none;border:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--faint);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 10px;min-height:36px}
.fbrow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.fbrow:first-of-type{border-top:none}
.fbrow .b{flex:1;min-width:0;font-size:13.5px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.fbrow .m{display:block;font-size:11.5px;color:var(--faint);margin-top:3px}
.fbrow.done .b{color:var(--faint)}
.fbrow .kd{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-right:6px;background:var(--brand-soft);color:var(--brand-dark)}
.fbrow .kd.care{background:var(--warn-soft,rgba(138,100,8,.1));color:var(--warn)}
sup,sub{font-size:.72em;line-height:0;position:relative;vertical-align:baseline}sup{top:-.5em}sub{bottom:-.2em}
figure svg,.qfig svg,.fv .stage svg{font-family:var(--sans,'Noto Sans KR',sans-serif)}   /* 그림 속 글자 — 정의 안 된 'PC Sans' 대신 앱 글꼴(바탕체로 떨어지던 것) */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) figure svg, :root:not([data-theme="light"]) .qfig svg{filter:brightness(.86) saturate(.95)} }
:root[data-theme="dark"] figure svg,:root[data-theme="dark"] .qfig svg{filter:brightness(.86) saturate(.95)}
figure.zoomable{position:relative}
figure.zoomable .zbtn{position:absolute;right:8px;top:8px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:7px 11px;min-height:34px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);pointer-events:none}
/* 누르는 자리 넓히기 — 보이는 크기는 그대로, 손가락이 닿는 범위만 44px 가까이(2026-10-01 점검: 출석 체크 29px · 빈칸 27px 등) */
button.pill,.notice button,.mini,.chipbar button,button.blank{position:relative}
button.pill::before,.notice button::before,.mini::before,.chipbar button::before,button.blank::before{content:"";position:absolute;left:-4px;right:-4px;top:-8px;bottom:-8px}
#pLike,.cm .acts button{white-space:nowrap}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.piiwarn{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:12px 13px;margin-bottom:10px;font-size:12.5px;line-height:1.7;color:var(--warn)}
.needlogin{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:26px 18px;text-align:center;margin-bottom:12px}
.needlogin p{font-size:13.5px;color:var(--muted);line-height:1.8;margin-bottom:14px}
/* 일정 */
.dday{background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:20px 18px;margin-bottom:12px;box-shadow:var(--shadow);text-align:center}
.dday .k{font-size:12px;font-weight:800;color:var(--muted)}
.dday .v{font-size:46px;font-weight:900;letter-spacing:-.03em;color:var(--brand);line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.dday .v.past{color:var(--muted)}
.dday .d{font-size:12.5px;color:var(--muted)}
.dday .others{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px;border-top:1px solid var(--hair);padding-top:12px}
.dday .others button{font-size:11.5px;font-weight:700;color:var(--body);background:var(--ground);border:none;border-radius:999px;padding:7px 12px;cursor:pointer;min-height:34px}
.dday .others button.on{background:var(--brand);color:var(--on-color)}
.wdbar{display:flex;gap:5px;margin-bottom:11px}
.wdbar button{flex:1;min-height:52px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0}
.wdbar button i{font-style:normal;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.wdbar button.on{background:var(--brand);border-color:var(--brand);color:var(--on-color)}
.wdbar button.on i{color:var(--on-color);opacity:.8}
.wdbar button.has::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--brand);display:block}
.wdbar button.on.has::after{background:var(--on-color)}
.slot{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--hair);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;cursor:pointer}
.slot:last-child{border-bottom:none}
.slot .t{flex:0 0 62px;font-size:11.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5;padding-top:1px}
.slot .bar{flex:0 0 3px;align-self:stretch;border-radius:2px;background:var(--brand);min-height:34px}
.slot .b{flex:1;min-width:0}
.slot .b b{display:block;font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.4}
.slot .b small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.slot .dd{flex:0 0 auto;font-size:11.5px;font-weight:900;color:var(--brand);font-variant-numeric:tabular-nums;align-self:center}
.slot .dd.soon{color:var(--no)}
.tagdot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
.planempty{font-size:13px;color:var(--muted);line-height:1.8;padding:16px 2px;text-align:center}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fgrid.one{grid-template-columns:1fr}
.sheet .fld label,.codebox .fld label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 5px 2px}
.sheet input,.sheet select,.sheet textarea,.codebox .fld input,.codebox .fld select{min-height:44px;width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;font-size:15px;font-family:inherit;background:var(--card);color:var(--ink)}
.sheet textarea{min-height:70px;resize:vertical;font-size:14px;line-height:1.7}
.daypick{display:flex;gap:5px;margin-bottom:10px}
.daypick button{flex:1;min-height:42px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer}
.daypick button.on{background:var(--brand);border-color:var(--brand);color:var(--on-color)}
.scopebox{background:var(--brand-soft);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.scopebox .h{font-size:11.5px;font-weight:900;letter-spacing:.1em;color:var(--brand-dark);margin-bottom:7px}
.scopebox p{font-size:12px;color:var(--brand-dark);line-height:1.6;margin-bottom:8px}
.fromacademy{display:inline-block;font-size:10.5px;font-weight:800;color:var(--brand-dark);background:var(--brand-soft);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.qhint{font-size:12.5px;color:var(--faint);text-align:center;line-height:1.85;margin-top:18px;padding:14px 12px;border-top:1px solid var(--hair)}
.qhint b{color:var(--muted)}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;font-size:12.5px;font-weight:700;padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;min-height:44px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:var(--on-color)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;padding:10px 8px 14px 0;margin-left:-2px;min-height:44px}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(20,30,34,.42);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:22px 22px 0 0;padding:18px 20px max(22px,var(--sab));max-height:88vh;overflow-y:auto}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:17px;font-weight:900;margin-bottom:6px}
.sheet p{font-size:13.5px;color:var(--body);line-height:1.7;margin-bottom:14px}
.sheet .f{display:flex;gap:8px;margin-bottom:12px}
.sheet input.big{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:22px;font-weight:900;letter-spacing:.3em;text-align:center;font-family:inherit;background:var(--paper);color:var(--ink);min-width:0}
.sheet input:focus{outline:2px solid var(--u);outline-offset:-2px}
.sheet .btn{margin-bottom:8px}
.sheet .legal{font-size:12.5px;line-height:1.8;color:var(--body);max-height:52vh;overflow-y:auto;border:1px solid var(--hair);border-radius:10px;padding:12px;margin-bottom:12px}
.sheet .legal h4{font-size:13px;margin:10px 0 4px}
.sheet .legal h4:first-child{margin-top:0}
.sheet .legal .meta{color:var(--faint);font-size:11.5px;margin-bottom:6px}
.sheet .legal table{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0}
.sheet .legal th,.sheet .legal td{border:1px solid var(--hair);padding:5px 6px;text-align:left;vertical-align:top}
.att-pill{cursor:pointer;border:none}
.att-pill.todo{background:var(--card);border:1.5px dashed var(--u)}

/* 원장 · 보호자 */
.adm-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.adm-h .h-page{margin:0}
.adm-h .who{font-size:12px;color:var(--muted)}
.code-big{background:var(--card);border:1.5px solid var(--u);border-radius:18px;padding:18px;text-align:center;margin-bottom:13px;position:relative;overflow:hidden}
.code-big::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--u)}
.code-big .k{font-size:11.5px;font-weight:900;letter-spacing:.12em;color:var(--u);margin-bottom:6px}
.code-big .v{font-size:46px;font-weight:900;letter-spacing:.18em;font-variant-numeric:tabular-nums;line-height:1.1}
.code-big .t{font-size:12px;color:var(--muted);margin-top:6px}
.code-big .bar{height:4px;background:var(--hair);border-radius:2px;margin-top:12px;overflow:hidden}
.code-big .bar i{display:block;height:100%;background:var(--u);transition:width 1s linear}
.stu{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--hair);font-size:13.5px;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.stu .nm{font-weight:800;flex:0 0 58px}
.stu .cd{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.08em;color:var(--body);flex:1}
.stu .cd.t{font-family:inherit;letter-spacing:0;font-size:12.5px}   /* 코드가 아닌 글(반·출석 수)은 고정폭 글꼴로 쓰지 않는다 */
.stu .un{font-size:11px;color:var(--faint);flex:0 0 auto}
.stu .st{font-size:12px;font-weight:800;flex:0 0 auto}
.stu .st.ok{color:var(--u)}
.stu .st.late{color:var(--warn)}
.stu .st.no{color:var(--faint)}
.mini{font-size:11px;font-weight:800;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;flex:0 0 auto}
.mini{font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:30px;line-height:1.2}
.mini.pri{background:var(--brand);border-color:var(--brand);color:var(--on-color)}
.form{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px}
.form h3{font-size:14px;font-weight:900;margin-bottom:10px}
.form .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form input,.form select,.form textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;background:var(--paper);color:var(--ink);min-width:0}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--u);outline-offset:-2px}
.form textarea{resize:vertical;min-height:64px;line-height:1.6}
.form .btn{margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;border:1px solid var(--u-line);background:var(--u-soft);color:var(--u-dark);cursor:pointer}
.sent{background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:12px 14px;margin-bottom:9px}
.sent .t{font-size:13.5px;font-weight:800;line-height:1.45}
.sent .d{font-size:12px;color:var(--muted);margin-top:2px}
.sent .r{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px}
.sent .r b{color:var(--u)}
.sent .r a{color:#C1521E;font-weight:800;text-decoration:none}
.issued{background:var(--u-soft);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:13px;line-height:1.7}
.issued code{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:900;letter-spacing:.14em;color:var(--u-dark)}
.issued a{display:inline-block;margin-top:6px;color:var(--u);font-weight:800}
.tip{font-size:12px;color:var(--muted);line-height:1.7;margin:4px 2px 12px}
