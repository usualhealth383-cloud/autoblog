의 종류와 개체 수, 물질과 에너지의 흐름이 <b>크게 변하지 않고 유지되는 상태<\/b>를 말한다. 이는 모든 것이 멈추어 있다는 뜻이 아니다. 어떤 원인으로 개체 수가 흔들리더라도 다시 원래 상태로 되돌아오는 능력이 평형의 본질이며, 이 복원력은 먹이 관계 속에 들어 있다.", "그림 3처럼 1차 소비자인 메뚜기가 갑자기 늘어났다고 하자. 먼저 메뚜기의 먹이인 벼(생산자)는 <b>줄어들고<\/b>, 메뚜기를 먹는 개구리(2차 소비자)는 먹이가 많아져 <b>늘어난다<\/b>. 그러면 메뚜기는 먹이가 부족해지고 {{㉡}}은 많아졌으므로 다시 줄어든다. 메뚜기가 줄면 벼는 회복되고 개구리도 원래 수준으로 돌아와 평형이 회복된다.", "이처럼 어느 한 영양 단계가 흔들려도 위아래 단계가 함께 반응하여 되돌려 놓는 작용이 생태계에 내장된 <b>자동 조절 장치<\/b>이다. 생태계 평형은 정지 상태가 아니라, 흔들려도 되돌아오는 {{㉢}}을 갖춘 상태이다. 다만 이 조절 작용에는 한계가 있으며, 이는 개념 04에서 다룬다."], "terms": [{"k": "생태계 평형", "v": "생물의 종류와 개체 수, 물질과 에너지의 흐름이 크게 변하지 않고 안정적으로 유지되는 상태."}, {"k": "천적", "v": "어떤 생물을 잡아먹는 상위 포식자. 급증한 생물을 다시 줄이는 평형 조절의 제동 장치 역할을 한다."}, {"k": "복원력", "v": "개체 수가 흔들려도 먹이 관계를 통해 원래 상태로 되돌아오는 능력. 생태계 평형의 본질이다."}], "myths": [{"x": "1차 소비자가 급증하면 2차 소비자는 감소한다.", "o": "먹이가 많아져 <b>일시적으로 증가<\/b>한다. 감소하는 것은 생산자다."}, {"x": "생태계 평형은 개체 수가 변하지 않는 정지 상태다.", "o": "흔들려도 <b>되돌아오는 상태<\/b>다. 개체 수는 일시적으로 변한다."}], "point": "1차 소비자 증가 → 생산자 감소·2차 소비자 증가 → 1차 소비자 감소 → 회복. 각 단계에서 누가 늘고 누가 주는지를 순서대로 서술한다.", "answers": "정답 ㉠ 증가 ㉡ 천적 ㉢ 복원력 — '생산자 증가·2차 소비자 감소'처럼 방향을 뒤집은 선지가 최다 오답이다.", "blanks": {"㉠": "증가", "㉡": "천적", "㉢": "복원력"}, "warning": "'생산자 증가·2차 소비자 감소'처럼 방향을 뒤집은 선지가 최다 오답이다.", "figure": {"caption": "같은 논을 시간 순서로 본 세 장면 — 급증한 메뚜기를 먹이 부족과 천적 증가가 함께 되돌린다", "file": "figures/2202-03.svg"}}, {"id": "2202-04", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2202", "lessonName": "생태계 평형", "no": "04", "title": "평형의 파괴", "subtitle": "복원력의 한계를 넘는 충격", "steps": [{"n": "①", "t": "복원력의 한계", "d": "자동 조절 작용은 만능이 아니다. <b>한계를 넘는 충격<\/b>이 오면 평형이 깨진다."}, {"n": "②", "t": "자연적 원인", "d": "홍수·가뭄·산불·화산 폭발과 같은 자연재해."}, {"n": "③", "t": "인위적 원인", "d": "서식지 파괴, {{㉠}}, 외래종 유입, 환경 오염 — 오늘날 가장 큰 충격은 인간 활동이다."}], "howto": [], "body": ["생태계의 자동 조절 작용은 만능이 아니다. <b>복원력의 한계<\/b>를 넘는 충격이 가해지면 평형은 깨진다. 홍수·가뭄·산불·화산 폭발과 같은 <b>자연재해<\/b>도 원인이 되지만, 오늘날 가장 큰 충격은 <b>인간 활동<\/b>이다.", "그림 4는 그 네 가지를 한 장면에 담았다. 왼쪽에서는 도로가 숲을 둘로 갈라 사슴이 건너지 못한다 — <b>서식지의 파괴·단절<\/b>이다. 공장의 매연과 폐수는 <b>환경 오염<\/b>으로 생물이 사는 환경 자체를 바꾸고, 그물로 물고기를 한꺼번에 잡는 <b>남획<\/b>은 먹이 그물을 이루는 한 종을 통째로 없앤다. 오른쪽의 큰 물고기처럼 새로 들어온 <b>외래종<\/b>은 기존의 먹이 그물을 교란한다. 여기에 기후변화(소단원 03)가 더해진다.", "특히 위험한 것이 {{㉡}}의 제거이다. 20세기 초 미국 옐로스톤 국립공원에서 늑대를 모두 없애자, 천적이 사라진 사슴 무리(엘크)가 {{㉢}}하여 어린 나무를 먹어 치웠고, 숲과 강기슭이 무너지면서 다른 생물들까지 연쇄적으로 피해를 입었다. 먹이 그물 꼭대기의 한 종이 그물 전체를 지탱하고 있었던 것이다.", "1995년 늑대를 다시 방사하자 엘크가 줄고 강가에 머물지 못하게 되면서 버드나무와 사시나무가 회복되었고, 비버와 새가 늘어 물길까지 안정되었다. 그물 꼭대기의 한 종이 바뀌면 그 영향은 <b>여러 영양 단계를 타고 연쇄적으로<\/b> 전달되며, 나무가 돌아오자 비버가 둑을 지어 물길을 바꾼 것은 <b>생물이 환경에 영향을 주는<\/b> 예이다. 복원은 가능했지만 약 70년이 걸렸다."], "terms": [{"k": "외래종", "v": "원래 살지 않던 곳에 들어온 종. 천적이 없으면 급증하여 기존의 먹이 그물을 교란한다."}, {"k": "최상위 포식자", "v": "먹이 그물 꼭대기의 종. 수는 적어도 아래 단계 전체의 개체 수를 조절하며 그물을 지탱한다."}, {"k": "남획", "v": "특정 생물을 지나치게 많이 잡아 한 종을 급감시키는 것. 먹이 그물의 한 매듭을 통째로 없앤다."}], "myths": [{"x": "생태계는 어떤 충격에도 스스로 회복한다.", "o": "복원력에는 <b>한계<\/b>가 있다. 한계를 넘는 충격이 오면 평형이 깨진다."}, {"x": "늑대가 늘어나면 강가의 식물이 줄어든다.", "o": "늑대 ▲ → 엘크 ▼ → 식물 <b>▲<\/b>. 한 칸 건너뛴 방향 착오에 주의한다."}], "point": "평형을 깨뜨리는 인위적 원인은 서식지 파괴·남획·외래종·환경 오염의 네 가지다. 최상위 포식자가 사라지면 초식 동물 급증 → 식물 황폐화 → 연쇄 붕괴의 순서로 위에서 아래로 무너진다.", "answers": "정답 ㉠ 남획 ㉡ 최상위 포식자 ㉢ 급증 — 옐로스톤 연쇄는 늑대 ▲ → 엘크 ▼ → 식물 ▲ → 비버 ▲, 한 칸 건너뛴 방향 착오가 대표 함정이다.", "blanks": {"㉠": "남획", "㉡": "최상위 포식자", "㉢": "급증"}, "warning": "옐로스톤 연쇄는 늑대 ▲ → 엘크 ▼ → 식물 ▲ → 비버 ▲, 한 칸 건너뛴 방향 착오가 대표 함정이다.", "figure": {"caption": "한 지역에서 동시에 일어나는 네 가지 인간 활동 — 서식지 파괴 · 환경 오염 · 남획 · 외래종 유입", "file": "figures/2202-04.svg"}}, {"id": "2202-05", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2202", "lessonName": "생태계 평형", "no": "05", "title": "생태계 보전", "subtitle": "잇고, 지키고, 되살리고, 함께 결정한다", "steps": [{"n": "①", "t": "잇는다", "d": "도로 등으로 끊긴 서식지를 {{㉠}}로 이어 야생동물이 오가게 한다."}, {"n": "②", "t": "지키고 되살린다", "d": "<b>보호 구역·국립공원<\/b> 지정, 사라진 종의 <b>복원 사업<\/b>, 생태 하천 복원."}, {"n": "③", "t": "함께 결정한다", "d": "개발·보전·생계가 얽힌 문제이므로 자료에 근거해 토론하고 협력적으로 소통한다."}], "howto": [], "body": ["생태계 평형의 보전은 기술이자 약속이다. 그림 5의 왼쪽처럼 도로로 끊긴 서식지는 <b>생태 통로<\/b>로 잇는다. 생태 통로는 도로 위를 가로지르는 야생동물의 다리로, 우리나라 고속도로에도 설치되어 있다. 훼손이 심한 곳은 <b>보호 구역·국립공원<\/b>으로 지정하여 생태계가 회복할 시간을 확보하고, 사라지거나 줄어든 종을 되살리는 <b>복원 사업<\/b>(반달가슴곰·여우 복원 등)과 훼손된 하천을 되살리는 <b>생태 하천 복원<\/b>이 이어진다.", "생태계 보전의 마지막 열쇳말은 {{㉡}}이다. 생태계 문제는 한 사람의 정답으로 해결되는 것이 아니라 개발·보전·생계 등 <b>여러 이해가 얽힌 사회적 결정<\/b>이기 때문이다. 그림 5의 오른쪽처럼 자료에 근거하여 토론하고 함께 결정하는 것까지가 과학의 일이다. 개인의 실천(소비·분리배출)과 제도(보호 구역·규제)가 만나야 먹이 그물은 지켜진다.", "이 소단원을 한 줄로 정리하면 다음과 같다. 먹이 그물이 복잡할수록 생태계는 안정되고, 생태 피라미드는 에너지 손실 때문에 위로 갈수록 좁아진다. 평형은 흔들려도 되돌아오는 복원력을 갖지만 그 {{㉢}}를 넘는 충격이 오면 깨지며, 서식지 파괴·남획·외래종·환경 오염이라는 네 원인에 맞서 잇고 지키고 되살리는 보전 기술이 있다."], "terms": [{"k": "생태 통로", "v": "도로 등으로 끊긴 서식지를 이어 야생동물이 오갈 수 있게 만든 길. 우리나라 고속도로에도 설치되어 있다."}, {"k": "복원 사업", "v": "사라지거나 줄어든 종과 서식지를 되살리는 일. 지리산 반달가슴곰 복원이 대표적이다."}, {"k": "협력적 소통", "v": "개발·보전·생계가 얽힌 생태계 문제를 자료에 근거해 토론하고 함께 결정하는 과정."}], "myths": [{"x": "보호 구역 지정은 생태계 회복에 도움이 되지 않는다.", "o": "훼손된 곳이 <b>회복할 시간<\/b>을 벌어 주는 보전 기술이다."}, {"x": "생태계 보전은 과학자만의 문제다.", "o": "과학 자료와 <b>사회적 소통<\/b>이 함께 필요한 문제다."}], "point": "잇고(생태 통로), 지키고(보호 구역·국립공원), 되살린다(복원 사업·생태 하천). 여기에 자료에 근거한 협력적 소통이 더해져야 생태계 평형이 지켜진다.", "answers": "정답 ㉠ 생태 통로 ㉡ 협력적 소통 ㉢ 한계 — 생태 통로가 '끊긴 서식지를 잇는' 시설이라는 점과 복원력에 한계가 있다는 점이 함께 출제된다.", "blanks": {"㉠": "생태 통로", "㉡": "협력적 소통", "㉢": "한계"}, "warning": "생태 통로가 '끊긴 서식지를 잇는' 시설이라는 점과 복원력에 한계가 있다는 점이 함께 출제된다.", "figure": {"caption": "생태계 평형을 지키는 기술 — 생태 통로 · 보호 구역 · 복원 사업 · 협력적 소통을 한 장면에 담았다", "file": "figures/2202-05.svg"}}, {"id": "2203-01", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2203", "lessonName": "지구온난화와 기후변화", "no": "01", "title": "온실효과", "subtitle": "대기의 보온 작용", "steps": [{"n": "①", "t": "태양 복사의 흡수", "d": "태양 에너지는 주로 <b>가시광선<\/b>의 형태로 들어와 지표를 데운다."}, {"n": "②", "t": "지구 복사의 방출", "d": "데워진 지표는 {{㉠}} 형태로 열을 내보낸다."}, {"n": "③", "t": "온실 기체의 재방출", "d": "온실 기체가 ㉠을 흡수했다가 사방으로 재방출한다."}], "howto": [], "body": ["지구의 평균 기온은 약 <b>15 ℃<\/b>로 유지된다. 지구와 거의 같은 거리에서 태양 빛을 받는 달의 표면이 밤에는 영하 100 ℃ 아래로 떨어지는 것과 비교하면, 이 차이를 만드는 원인이 지구의 <b>대기<\/b>에 있음을 알 수 있다.", "태양 복사 에너지는 주로 <b>가시광선<\/b>의 형태로 대기를 통과해 지표를 데운다(①). 데워진 지표는 파장이 긴 <b>적외선<\/b>의 형태로 에너지를 내보내는데, 이를 <b>지구 복사<\/b>라 한다(②). 이때 대기 중의 <b>온실 기체<\/b> — 수증기, 이산화 탄소, 메테인 — 는 나가려는 적외선을 흡수했다가 사방으로 재방출하여, 에너지의 일부를 지표 근처에 머무르게 한다(③).", "이처럼 대기가 지구 복사 에너지의 일부를 붙잡아 지표의 온도를 높게 유지하는 작용이 {{㉡}}다. 온실 기체가 흡수하는 것은 태양의 가시광선이 아니라 지표가 내보내는 <b>적외선<\/b>이라는 점에 주의한다. 온실효과 덕분에 지구의 평균 기온은 15 ℃로 유지되며, 온실효과가 전혀 없다면 약 {{㉢}} ℃까지 낮아져 바다가 얼어붙었을 것이다."], "terms": [{"k": "온실효과", "v": "대기가 지구 복사 에너지의 일부를 흡수·재방출하여 지표의 온도를 높게 유지하는 작용."}, {"k": "온실 기체", "v": "적외선을 흡수·재방출하는 기체. 수증기(바다의 증발), 이산화 탄소(화석 연료의 연소), 메테인(농축산·폐기물) 등."}, {"k": "지구 복사", "v": "데워진 지표가 내보내는 적외선. 태양 복사(가시광선 중심)와 파장이 다르다."}], "myths": [{"x": "온실효과가 곧 지구온난화다.", "o": "온실효과는 정상적인 대기의 작용이며, 온난화는 그것의 <b>'강화'<\/b>다."}, {"x": "온실 기체는 가시광선을 흡수한다.", "o": "흡수하는 것은 지표가 내보내는 <b>적외선<\/b>이다."}], "point": "온실효과는 지구 평균 기온을 15 ℃로 유지하는 정상적인 대기의 작용이다. 문제는 온실효과 자체가 아니라, 온실 기체 증가로 이 작용이 강해지는 것이다.", "answers": "정답 ㉠ 적외선(지구 복사) ㉡ 온실효과 ㉢ −18 — ㉠을 '가시광선'으로 바꾼 선지가 최다 오답이다.", "blanks": {"㉠": "적외선(지구 복사)", "㉡": "온실효과", "㉢": "−18"}, "warning": "㉠을 '가시광선'으로 바꾼 선지가 최다 오답이다.", "figure": {"caption": "온실효과의 구조 — 들어오는 ①, 나가는 ②, 재방출되는 ③. 오른쪽은 온실효과가 만드는 33 ℃의 차이", "file": "figures/2203-01.svg"}}, {"id": "2203-02", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2203", "lessonName": "지구온난화와 기후변화", "no": "02", "title": "지구온난화", "subtitle": "온실효과의 강화", "steps": [{"n": "①", "t": "온실 기체의 증가", "d": "화석 연료의 {{㉠}}로 대기 중 이산화 탄소가 늘어난다."}, {"n": "②", "t": "온실효과의 강화", "d": "나가려는 적외선이 더 많이 흡수·재방출된다."}, {"n": "③", "t": "새로운 복사 평형", "d": "기온이 오른 뒤 <b>더 높은 온도에서 새로운 평형<\/b>을 이룬다."}], "howto": ["'킬링'은 사람 이름이다 — 1958년부터 하와이의 산꼭대기 관측소에서 공기 속 이산화 탄소의 양을 재기 시작한 과학자 찰스 킬링. 그 기록이 이 곡선이다.", "가로축은 연도, 세로축은 공기 속 이산화 탄소의 양이다. <b>ppm은 '100만 개 중 몇 개'<\/b>라는 단위 — 430 ppm이면 공기 입자 100만 개 중 430개가 이산화 탄소라는 뜻이다.", "선의 잔물결(톱니)은 1년마다 반복된다 — <b>여름에는 나무와 풀이 광합성으로 이산화 탄소를 흡수<\/b>해 조금 내려가고, 겨울에는 다시 올라간다.", "잔물결을 무시하고 멀리서 보면 선은 꾸준히 오른쪽 위로 오른다 — 이 큰 흐름이 <b>화석 연료 사용이 남긴 인간 활동의 신호<\/b>다."], "body": ["산업혁명 이후 화석 연료의 사용이 늘면서 대기 중 온실 기체의 양이 빠르게 증가하고 있다. 석탄·석유·천연가스를 태우는 연소는 I단원에서 배운 <b>산화 반응<\/b>이며, 그 생성물인 이산화 탄소가 대기에 쌓인다. 산업화 이전 약 <b>280 ppm<\/b>이던 이산화 탄소 농도는 현재 약 <b>430 ppm<\/b>(2026년)에 이른다.", "그 결과 지구의 평균 기온은 산업화 이전보다 이미 <b>1 ℃ 남짓<\/b> 상승하였다. 온난화는 복사 평형이 깨져 기온이 무한히 오르는 현상이 아니라, {{㉡}} 온도에서 <b>새로운 평형<\/b>을 이루는 현상이다. 다만 지구 <b>평균<\/b> 기온의 1 ℃ 변화는 결코 작지 않다.", "기온 상승으로 빙하가 줄고 {{㉢}}이 상승하며, 폭염·가뭄·집중호우와 같은 이상 기상이 잦아진다. 대처는 원인의 사슬을 거꾸로 읽는 데서 출발한다 — 화석 연료의 연소를 줄이고(신재생 에너지, 에너지 효율 개선), 배출된 탄소를 숲이 흡수하도록 산림을 보전하는 것이다. 이 내용은 II-05(발전과 에너지의 효율적 이용)로 이어진다."], "terms": [{"k": "지구온난화", "v": "온실 기체 증가로 온실효과가 강해져 지구의 평균 기온이 상승하는 현상."}, {"k": "복사 평형", "v": "흡수하는 에너지와 방출하는 에너지가 같아 평균 온도가 일정하게 유지되는 상태."}, {"k": "킬링 곡선", "v": "1958년부터 하와이 마우나로아 관측소에서 측정해 온 대기 중 이산화 탄소 농도 기록."}], "myths": [{"x": "곡선의 톱니는 측정 오차다.", "o": "<b>여름철 광합성<\/b>이 만드는 규칙적인 계절 변화다."}, {"x": "온난화는 평형이 깨진 폭주다.", "o": "<b>더 높은 온도의 새 평형<\/b>이다 — 그래서 되돌리기 어렵다."}], "point": "화석 연료의 연소(산화)가 온실 기체를 늘리고, 강해진 온실효과가 지구를 더 높은 온도의 평형으로 옮긴다 — I단원의 화학과 II단원의 환경은 한 사슬로 이어져 있다.", "answers": "정답 ㉠ 연소 ㉡ 더 높은 ㉢ 해수면 — '무한 상승'과 '새로운 평형'의 구분이 최고난도 선지로 출제된다.", "blanks": {"㉠": "연소", "㉡": "더 높은", "㉢": "해수면"}, "warning": "'무한 상승'과 '새로운 평형'의 구분이 최고난도 선지로 출제된다.", "figure": {"caption": "오르내리는 톱니(계절 변화)와 장기적인 상승(인간 활동) — 두 신호를 한 그래프에서 읽는다", "file": "figures/2203-02.svg"}}, {"id": "2203-03", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2203", "lessonName": "지구온난화와 기후변화", "no": "03", "title": "지구온난화의 영향", "subtitle": "평균 1 ℃의 무게", "steps": [{"n": "①", "t": "해수면 상승", "d": "빙하가 녹고, 데워진 바닷물의 부피가 커지는 {{㉠}}으로 해수면이 오른다."}, {"n": "②", "t": "극한 기상과 생태계 변화", "d": "폭염·집중호우·가뭄이 잦아지고, 생물의 서식지와 개화 시기가 달라진다."}, {"n": "③", "t": "해양 산성화", "d": "바다가 이산화 탄소를 흡수하여 산성 쪽으로 기운다."}], "howto": [], "body": ["지구 평균 기온의 1 ℃ 상승은 작은 변화가 아니다. 첫째, <b>해수면이 상승<\/b>한다. 빙하가 녹아 바다로 흘러드는 것과 함께, 온도가 오른 바닷물 자체의 부피가 커지는 <b>열팽창<\/b>이 일어나기 때문이다. 해발 고도가 낮은 섬나라와 해안 도시가 먼저 영향을 받는다.", "둘째, <b>극한 기상<\/b>이 잦아진다. 대기가 가진 에너지가 많아지면서 폭염·집중호우·가뭄·강한 태풍의 빈도와 강도가 커진다. 셋째, <b>생태계가 이동<\/b>한다. 개화 시기가 달라져 곤충과 식물의 관계가 어긋나고, 생물의 서식지가 고위도로 옮겨 간다.", "우리나라에서도 변화는 관찰된다. 사과 재배지가 {{㉡}}쪽으로 이동하고 있으며, 남해와 동해에서는 아열대 어종이 늘고 있다. 넷째, <b>해양 산성화<\/b>가 진행된다. 바다는 대기 중 이산화 탄소의 일부를 흡수하는데, 이 과정에서 바닷물이 {{㉢}} 쪽으로 기울어 산호와 조개처럼 탄산 칼슘 껍데기를 만드는 생물이 피해를 입는다 — I단원에서 배운 산과 염기가 바다에서 다시 등장하는 것이다."], "terms": [{"k": "열팽창", "v": "온도가 오르면 물질의 부피가 커지는 현상. 바닷물의 열팽창은 빙하 융해와 함께 해수면 상승의 두 원인 중 하나다."}, {"k": "극한 기상", "v": "폭염·집중호우·가뭄·강한 태풍처럼 평년의 범위를 크게 벗어나는 기상 현상."}, {"k": "해양 산성화", "v": "바다가 이산화 탄소를 흡수하여 바닷물이 산성 쪽으로 기우는 현상. 껍데기를 만드는 해양 생물에 영향을 준다."}], "myths": [{"x": "해수면 상승은 빙하가 녹기 때문만이다.", "o": "빙하 융해 <b>그리고<\/b> 바닷물의 <b>열팽창<\/b> — 원인은 두 가지다."}, {"x": "온난화로 사과 재배지는 남쪽으로 내려간다.", "o": "서식지·재배지는 <b>고위도(북쪽)<\/b>로 이동한다."}], "point": "온난화의 영향은 해수면 상승(융해 + 열팽창), 극한 기상, 생태계의 이동, 해양 산성화의 네 갈래로 정리한다. 평균 기온 1 ℃의 변화가 바다·대기·생태계를 동시에 움직인다.", "answers": "정답 ㉠ 열팽창 ㉡ 북 ㉢ 산성 — 해수면 상승의 원인에서 '열팽창'을 빠뜨리면 반쪽 답이다.", "blanks": {"㉠": "열팽창", "㉡": "북", "㉢": "산성"}, "warning": "해수면 상승의 원인에서 '열팽창'을 빠뜨리면 반쪽 답이다.", "figure": {"caption": "온난화의 네 가지 영향 — 해수면 · 극한 기상 · 생태계 · 바다의 화학", "file": "figures/2203-03.svg"}}, {"id": "2203-04", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2203", "lessonName": "지구온난화와 기후변화", "no": "04", "title": "엘니뇨", "subtitle": "대기와 해양의 상호 작용", "steps": [{"n": "①", "t": "평상시", "d": "적도 태평양에서 동에서 서로 부는 {{㉠}}이 따뜻한 표층수를 서쪽으로 밀어 놓는다."}, {"n": "②", "t": "무역풍의 약화", "d": "몇 년에 한 번 이 바람이 약해지면, 따뜻한 물이 동쪽으로 되밀려 온다."}, {"n": "③", "t": "동태평양 수온 상승", "d": "동태평양의 표층 수온이 평소보다 높아지는 현상 — 이것이 엘니뇨다."}], "howto": ["두 상자는 적도 태평양을 옆에서 자른 단면이다. 왼쪽이 서쪽(인도네시아), 오른쪽이 동쪽(페루) — 지도와 같은 방향이다.", "주황색은 따뜻한 물, 파란색은 찬물이다. 위쪽 화살표는 바다 위를 부는 바람(무역풍)의 방향과 세기를 나타낸다.", "평상시(왼쪽)에는 바람이 따뜻한 물을 서쪽으로 밀어 동쪽에는 아래에서 찬물이 올라온다. 엘니뇨(오른쪽)에는 바람이 약해져 따뜻한 물이 동쪽까지 퍼지고, 찬물은 올라오지 못한다."], "body": ["기후는 대기와 해양이 함께 만드는 시스템이다. 평상시 적도 태평양에서는 <b>무역풍<\/b>이 동에서 서로 불어 따뜻한 표층수를 서쪽으로 밀어 놓는다. 동쪽의 페루 연안에서는 그 빈자리를 채우려 깊은 곳의 <b>찬물이 올라오며<\/b>(용승), 이 찬물이 실어 온 영양분이 세계적인 어장을 만든다.", "몇 년에 한 번 무역풍이 약해지면 따뜻한 물이 동쪽으로 되밀려 와 동태평양의 표층 수온이 평소보다 {{㉡}}진다. 이 현상이 <b>엘니뇨<\/b>다. 페루 연안에서는 찬물이 올라오지 못해 어획량이 줄고 건조하던 지역에 폭우가 내리며, 서태평양의 인도네시아·오스트레일리아에는 가뭄과 산불이 잦아진다.", "반대로 무역풍이 평소보다 강해져 동태평양이 더 차가워지는 현상을 {{㉢}}라 한다. 태평양 한쪽의 수온 변화가 지구 반대편의 강수와 기온까지 바꾸는 것은, 기후가 <b>전 지구적으로 연결된 하나의 시스템<\/b>임을 보여 준다."], "terms": [{"k": "무역풍", "v": "적도 부근에서 동쪽에서 서쪽으로 부는 바람. 평상시 따뜻한 표층수를 서태평양 쪽으로 밀어 놓는다."}, {"k": "용승", "v": "표층의 물이 밀려 나간 자리를 채우려 깊은 곳의 찬물이 올라오는 현상. 영양분을 실어 와 좋은 어장을 만든다."}, {"k": "엘니뇨 / 라니냐", "v": "무역풍이 약해져 동태평양 수온이 높아지는 현상 / 무역풍이 강해져 동태평양 수온이 낮아지는 반대 현상."}], "myths": [{"x": "엘니뇨는 무역풍이 강해질 때 일어난다.", "o": "무역풍이 <b>약해질 때<\/b>다. 강해지는 것은 라니냐."}, {"x": "엘니뇨 때 동태평양 수온은 낮아진다.", "o": "따뜻한 물이 동쪽까지 퍼져 <b>높아진다<\/b>."}], "point": "엘니뇨 = 무역풍 약화 + 동태평양 수온 상승 + 페루 폭우·서태평양 가뭄. 바람(대기)과 수온(해양)은 한 팀으로 움직이며, 그 변화는 전 지구의 기상에 영향을 준다.", "answers": "정답 ㉠ 무역풍 ㉡ 높아 ㉢ 라니냐 — \"무역풍이 강해질 때\"로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "무역풍", "㉡": "높아", "㉢": "라니냐"}, "warning": "\"무역풍이 강해질 때\"로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "평상시와 엘니뇨 시기의 적도 태평양 단면 — 무역풍 약화가 따뜻한 물을 동쪽으로 되돌린다", "file": "figures/2203-04.svg"}}, {"id": "2203-05", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2203", "lessonName": "지구온난화와 기후변화", "no": "05", "title": "사막화와 기후변화에 대한 대처", "subtitle": "", "steps": [{"n": "①", "t": "사막화의 원인", "d": "오랜 가뭄이라는 자연적 원인 위에, 과도한 {{㉠}}·경작과 삼림 벌채가 더해진다."}, {"n": "②", "t": "완화", "d": "원인 자체를 줄인다 — 화석 연료 감축, 신재생 에너지, 산림 보전."}, {"n": "③", "t": "적응", "d": "이미 시작된 변화에 대비한다 — 방재 시설, 가뭄에 강한 작물, 조기 경보."}], "howto": [], "body": ["<b>사막화<\/b>는 건조한 땅이 생산력을 잃고 사막처럼 변해 가는 현상이다. 원인은 두 겹이다. 오랜 <b>가뭄<\/b>과 같은 자연적 원인 위에, 과도한 방목과 경작, 삼림 벌채와 같은 <b>인위적 원인<\/b>이 더해진다. 풀과 나무가 사라지면 땅이 물을 붙잡지 못해 더 건조해지는 악순환이 이어진다.", "사하라 사막 남쪽의 사헬 지대가 대표적인 사례이며, 동아시아의 사막화는 우리나라에 날아오는 <b>황사<\/b>를 심하게 만든다. 기후변화와 사막화는 먼 나라의 문제가 아니다.", "기후변화에 대한 대처는 두 갈래로 나뉜다. {{㉡}}는 원인 자체를 줄이는 것으로, 화석 연료 사용을 줄이고 신재생 에너지로 전환하며 숲을 보전·복원하는 일이다. <b>적응<\/b>은 이미 시작된 변화에 대비하는 것으로, 방파제와 배수 시설, 가뭄에 강한 작물, 조기 경보 체계가 여기에 속한다. 여기에 국제 협력이 더해진다. 2015년 채택된 <b>파리 협정<\/b>은 지구 평균 기온 상승을 산업화 이전 대비 2 ℃보다 훨씬 낮은 수준, 나아가 {{㉢}} ℃ 이내로 억제하자는 국제 사회의 약속이다."], "terms": [{"k": "사막화", "v": "건조한 지역의 땅이 생산력을 잃고 사막처럼 변해 가는 현상. 자연적 원인(가뭄)과 인위적 원인(과도한 방목·경작·벌채)이 함께 작용한다."}, {"k": "완화 / 적응", "v": "완화는 온실 기체 배출을 줄여 원인을 없애는 대처, 적응은 이미 나타난 기후변화의 피해에 대비하는 대처."}, {"k": "파리 협정", "v": "2015년 채택된 국제 협약. 지구 평균 기온 상승을 산업화 이전 대비 1.5 ℃ 이내로 억제하는 것을 목표로 한다."}], "myths": [{"x": "사막화는 가뭄이라는 자연 현상일 뿐이다.", "o": "가뭄 위에 <b>인간의 과도한 방목·경작·벌채<\/b>가 더해진 결과다."}, {"x": "방파제를 쌓는 것은 온난화의 '완화'다.", "o": "피해에 대비하는 <b>적응<\/b>이다. 완화는 원인(배출)을 줄이는 것."}], "point": "원인을 정확히 짚어야 대처가 나온다 — 연소 → 온실 기체 → 온실효과 강화 → 기온 상승의 사슬을 거꾸로 끊는 것이 완화, 이미 온 변화에 대비하는 것이 적응이다.", "answers": "정답 ㉠ 방목 ㉡ 완화 ㉢ 1.5 — 완화(원인 감축)와 적응(피해 대비)의 구분이 서술형 단골이다.", "blanks": {"㉠": "방목", "㉡": "완화", "㉢": "1.5"}, "warning": "완화(원인 감축)와 적응(피해 대비)의 구분이 서술형 단골이다.", "figure": {"caption": "사막화의 악순환과 기후변화 대처의 두 갈래 — 원인을 줄이는 완화, 변화에 대비하는 적응", "file": "figures/2203-05.svg"}}, {"id": "2204-01", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2204", "lessonName": "태양 에너지와 에너지 전환", "no": "01", "title": "수소 핵융합", "subtitle": "태양 에너지의 근원", "steps": [{"n": "①", "t": "반응의 조건", "d": "태양 <b>중심부<\/b>의 초고온·초고압 환경에서 반응이 일어난다."}, {"n": "②", "t": "수소에서 헬륨으로", "d": "수소 원자핵 4개가 합쳐져 {{㉠}} 원자핵 1개가 된다."}, {"n": "③", "t": "질량이 에너지로", "d": "반응 후 질량이 조금 줄어들고, 줄어든 만큼이 빛과 열로 방출된다."}], "howto": [], "body": ["태양은 연료를 태워서 빛을 내는 것이 아니다. 태양 <b>중심부<\/b>의 초고온·초고압 환경에서는 <b>수소 핵융합<\/b>이 일어난다. 이는 <b>수소 원자핵 4개가 합쳐져 헬륨 원자핵 1개<\/b>가 되는 반응으로, 통합과학 1에서 배운 '별에서 만들어지는 원소'의 첫 단계에 해당한다.", "이 반응에서 중요한 것은 질량의 변화이다. 융합으로 생긴 헬륨 원자핵의 질량은 재료였던 수소 원자핵 4개의 질량 합보다 <b>조금 작다<\/b>. 이 <b>줄어든 질량만큼이 막대한 에너지로 전환<\/b>되어 빛과 열로 방출된다. 태양이 약 46억 년 동안 빛을 내고도 앞으로 수십억 년을 더 빛날 수 있는 까닭이 여기에 있다.", "핵융합은 연소와 구별해야 한다. 연소는 물질이 산소와 결합하는 산화 반응이지만, 핵융합은 가벼운 원자핵들이 합쳐져 무거운 원자핵이 되는 반응이며 산소가 필요 없다. 핵융합 뒤에 생성물의 {{㉡}}은 반응 전보다 조금 줄어들며, 그만큼이 에너지로 방출된다. 이 반응은 표면(약 6000 ℃)이 아니라 초고온·초고압인 태양의 {{㉢}}(약 1500만 ℃)에서 일어난다."], "terms": [{"k": "핵융합", "v": "가벼운 원자핵들이 합쳐져 무거운 원자핵이 되는 반응. 초고온·초고압이 조건이며, 태양에서는 수소 원자핵 4개가 헬륨 원자핵 1개가 된다."}, {"k": "질량의 감소", "v": "핵융합 뒤 생성물의 질량이 반응 전 재료의 질량 합보다 조금 작아지는 것. 줄어든 질량만큼이 에너지로 전환된다."}, {"k": "태양 중심부", "v": "핵융합이 일어나는 곳. 표면(약 6000 ℃)이 아니라 중심부(약 1500만 ℃)에서 반응이 일어난다."}], "myths": [{"x": "태양은 연료를 태우는 연소 반응으로 빛을 낸다.", "o": "산소가 필요한 연소가 아니라, 수소 원자핵이 합쳐지는 <b>핵융합<\/b>이다."}, {"x": "핵융합 뒤에는 질량이 늘어난다.", "o": "질량은 <b>조금 줄어들고<\/b>, 줄어든 만큼이 에너지로 방출된다."}], "point": "태양 에너지의 근원은 중심부의 수소 핵융합이다. 수소 원자핵 4개 → 헬륨 원자핵 1개, 줄어든 질량만큼이 빛과 열로 방출된다.", "answers": "정답 ㉠ 헬륨 ㉡ 질량 ㉢ 중심부 — '연소', '질량 증가', '표면'으로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "헬륨", "㉡": "질량", "㉢": "중심부"}, "warning": "'연소', '질량 증가', '표면'으로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "태양 중심부의 수소 핵융합 — 수소 원자핵 4개가 헬륨 원자핵 1개로 합쳐지며, 줄어든 질량만큼이 빛과 열이 된다", "file": "figures/2204-01.svg"}}, {"id": "2204-02", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2204", "lessonName": "태양 에너지와 에너지 전환", "no": "02", "title": "지구에 도달하는 태양 에너지", "subtitle": "반사·흡수와 순환", "steps": [{"n": "①", "t": "도달", "d": "태양이 사방으로 내보내는 에너지 중 약 <b>20억분의 1<\/b>이 지구에 도달한다."}, {"n": "②", "t": "반사와 흡수", "d": "약 30 %는 반사되고, 약 {{㉠}} %는 대기와 지표에 흡수된다."}, {"n": "③", "t": "불균등한 도달과 순환", "d": "저위도가 고위도보다 많이 받으며, 그 차이가 <b>대기·해수의 순환<\/b>을 일으킨다."}], "howto": ["왼쪽의 노란 광선이 태양 에너지이다. 가운데 세 줄기는 적도(저위도)에 똑바로 닿고, 맨 위 한 줄기는 극(고위도)에 비스듬히 닿아 넓게 퍼지므로 한 곳이 받는 에너지가 적다.", "구름에 부딪혀 되돌아가는 광선이 반사(약 30 %)이고, 지구에 닿아 남은 것이 흡수(약 70 %)이다. 분홍 물결 화살표는 지구가 데워진 뒤 적외선으로 내보내는 에너지이다.", "지구 오른쪽의 굵은 화살표는 열의 이동이다. 남는 저위도에서 모자란 고위도로 바람(빨강)과 해류(파랑)가 열을 나른다."], "body": ["태양이 사방으로 내보내는 에너지 중 지구에 도달하는 것은 약 <b>20억분의 1<\/b>에 지나지 않지만, 이 에너지가 지구에서 일어나는 거의 모든 현상을 일으킨다. 도달한 태양 에너지의 약 <b>30 %<\/b>는 구름·대기·지표에 <b>반사<\/b>되어 우주로 되돌아가고, 나머지 약 <b>70 %<\/b>가 대기와 지표에 <b>흡수<\/b>되어 지구를 데운다.", "흡수된 에너지는 결국 {{㉡}}의 형태로 다시 우주로 방출된다. 들어온 만큼 나가는 이 <b>수지 균형<\/b> 덕분에 지구의 평균 온도는 일정하게 유지되며, 03에서 배운 온실효과는 이 균형이 이루어지는 온도를 높이는 작용이다.", "태양 에너지는 지구 표면에 <b>고르게 도달하지 않는다<\/b>. 지구는 둥글기 때문에 <b>저위도<\/b>(적도 쪽)가 <b>고위도<\/b>(극 쪽)보다 많은 에너지를 받는다. 에너지가 남는 곳과 모자란 곳의 차이를 메우기 위해 <b>대기와 해수<\/b>가 {{㉢}}하며 열을 실어 나른다. 바람과 해류는 태양 에너지를 저위도에서 고위도로 옮기는 흐름이다."], "terms": [{"k": "반사와 흡수", "v": "지구에 도달한 태양 에너지의 약 30 %는 반사되어 우주로 돌아가고, 약 70 %는 대기와 지표에 흡수된다."}, {"k": "수지 균형", "v": "흡수한 에너지만큼을 적외선으로 다시 내보내는 균형. 이 균형 덕분에 지구의 평균 온도가 일정하게 유지된다."}, {"k": "대기·해수의 순환", "v": "위도에 따른 태양 에너지의 차이를 메우기 위해 바람과 해류가 저위도의 열을 고위도로 옮기는 흐름."}], "myths": [{"x": "지구에 도달한 태양 에너지는 모두 지표에 흡수된다.", "o": "약 30 %는 <b>반사<\/b>되어 되돌아가고, 약 70 %가 흡수된다."}, {"x": "대기와 해수의 순환은 지구 내부의 열 때문이다.", "o": "<b>위도에 따른 태양 에너지의 불균등한 도달<\/b>이 원인이다."}], "point": "반사 약 30 %, 흡수 약 70 %. 저위도는 많이, 고위도는 적게 받으며, 이 차이가 대기와 해수의 순환을 일으킨다.", "answers": "정답 ㉠ 70 ㉡ 적외선 ㉢ 순환 — 순환의 원인을 '지구 내부의 열'로 바꾼 선지에 주의한다.", "blanks": {"㉠": "70", "㉡": "적외선", "㉢": "순환"}, "warning": "순환의 원인을 '지구 내부의 열'로 바꾼 선지에 주의한다.", "figure": {"caption": "태양 에너지의 흐름 — 약 30 %는 반사, 약 70 %는 흡수되며, 저위도에 많이 닿은 열을 대기와 해수의 순환이 고위도로 나른다", "file": "figures/2204-02.svg"}}, {"id": "2204-03", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2204", "lessonName": "태양 에너지와 에너지 전환", "no": "03", "title": "생명의 에너지 전환", "subtitle": "광합성에서 화석 연료까지", "steps": [{"n": "①", "t": "광합성", "d": "식물이 빛에너지를 포도당 속 {{㉠}} 에너지로 전환하여 저장한다."}, {"n": "②", "t": "먹이 사슬과 호흡", "d": "저장된 에너지는 먹이 사슬을 따라 이동하고, 호흡을 거쳐 <b>열·운동 에너지<\/b>가 된다."}, {"n": "③", "t": "화석 연료", "d": "옛 생물이 저장한 화학 에너지가 땅속에서 석탄·석유·천연가스가 되었다."}], "howto": [], "body": ["지표에 도달한 태양 에너지의 일부는 식물의 <b>광합성<\/b>에 이용된다. 광합성은 <b>빛에너지를 포도당 속 화학 에너지로 전환<\/b>하여 저장하는 과정이다. 이렇게 저장된 에너지는 <b>먹이 사슬<\/b>을 따라 이동한다. 벼가 저장한 화학 에너지는 밥이 되어 우리 몸에 들어오고, <b>호흡<\/b>을 거쳐 체온(열에너지)과 움직임(운동 에너지)으로 전환된다.", "따라서 광합성은 빛 → 화학, 호흡은 화학 → 열·운동으로 전환의 방향이 서로 반대이다. 이 방향을 정확히 구별해야 한다.", "<b>화석 연료<\/b>는 수억 년 전의 생물이 광합성과 먹이 사슬로 모아 둔 화학 에너지가 땅속의 열과 압력을 받아 오랜 시간에 걸쳐 석탄·석유·천연가스로 변한 것이다. 따라서 화석 연료를 태우는 것은 <b>오래전에 저장된 태양 에너지<\/b>를 꺼내 쓰는 일이며, 화석 연료 에너지의 근원을 거슬러 올라가면 {{㉢}} 에너지에 닿는다.", "우리 몸이 쓰는 에너지도 마찬가지이다. 밥의 화학 에너지는 {{㉡}}을 거쳐 열에너지와 운동 에너지로 전환되며, 그 근원은 벼의 광합성이 저장한 태양 에너지이다. 오랜 시간에 걸쳐 저장된 화석 연료를 짧은 시간에 태우면 03에서 배운 이산화 탄소가 대기에 쌓인다. 이 때문에 현재의 태양 에너지를 직접 이용하려는 신재생 에너지가 05에서 다루어진다."], "terms": [{"k": "화학 에너지", "v": "물질 속에 저장된 에너지. 포도당, 연료, 배터리가 담고 있는 에너지의 형태이다."}, {"k": "광합성 / 호흡", "v": "광합성은 빛에너지를 화학 에너지로 저장하는 과정, 호흡은 화학 에너지를 열·운동 에너지로 꺼내 쓰는 과정이다."}, {"k": "화석 연료의 형성", "v": "옛 생물의 유해가 땅속의 열과 압력으로 오랜 시간에 걸쳐 변한 것. 석탄·석유·천연가스가 있다."}], "myths": [{"x": "광합성은 화학 에너지를 빛에너지로 바꾼다.", "o": "방향이 반대이다. 광합성은 <b>빛 → 화학<\/b>, 호흡은 <b>화학 → 열·운동<\/b>이다."}, {"x": "화석 연료는 지구 내부의 에너지가 저장된 것이다.", "o": "옛 생물의 광합성이 저장한 <b>태양 에너지<\/b>이다."}], "point": "광합성(빛 → 화학) → 먹이 사슬 → 호흡(화학 → 열·운동). 화석 연료는 수억 년 전에 저장된 태양 에너지이므로, 밥과 전기의 에너지 모두 근원은 태양이다.", "answers": "정답 ㉠ 화학 ㉡ 호흡 ㉢ 태양 — 광합성의 전환 방향을 거꾸로 쓴 선지가 최다 오답이다.", "blanks": {"㉠": "화학", "㉡": "호흡", "㉢": "태양"}, "warning": "광합성의 전환 방향을 거꾸로 쓴 선지가 최다 오답이다.", "figure": {"caption": "태양에서 생물과 연료까지 — 광합성이 태양 에너지를 저장하고, 화석 연료는 수억 년 전에 저장된 태양 에너지이다", "file": "figures/2204-03.svg"}}, {"id": "2204-04", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2204", "lessonName": "태양 에너지와 에너지 전환", "no": "04", "title": "물의 순환과 바람", "subtitle": "태양이 일으키는 날씨", "steps": [{"n": "①", "t": "증발과 구름", "d": "태양의 열이 바다와 땅의 물을 <b>증발<\/b>시키고, 수증기는 올라가 구름이 된다."}, {"n": "②", "t": "강수와 흐름", "d": "높은 곳에 내린 물은 {{㉠}} 에너지를 가지며, 흘러내리며 운동 에너지가 된다."}, {"n": "③", "t": "바람", "d": "지역마다 데워지는 정도가 달라 온도·기압 차가 생기고, 공기가 이동한다."}], "howto": [], "body": ["비와 바람도 태양 에너지가 일으키는 현상이다. 태양의 열은 바다와 땅의 물을 <b>증발<\/b>시키고(열에너지 → 수증기의 에너지), 수증기는 하늘로 올라가 <b>구름<\/b>이 되었다가 비와 눈으로 내린다. 이것이 <b>물의 순환<\/b>이다. 높은 곳에 내린 물은 <b>위치 에너지<\/b>를 가지며, 흘러내리면서 <b>운동 에너지<\/b>로 전환된다. 이 운동 에너지를 전기 에너지로 바꾸는 것이 <b>수력 발전<\/b>이다.", "<b>바람<\/b>도 마찬가지이다. 지역마다 데워지는 정도가 달라 <b>온도와 기압의 차이<\/b>가 생기고, 공기가 그 차이를 메우기 위해 이동하는 것이 바람이다. 이 바람이 <b>풍력 발전<\/b>의 날개를 돌린다.", "02에서 배운 해류도 위도에 따른 태양 에너지의 차이가 만드는 흐름이다. 정리하면, 물의 순환·바람·해류, 그리고 이를 이용하는 수력·풍력·해양 에너지까지 <b>지구 위 대부분의 에너지 흐름은 태양 에너지<\/b>에서 비롯된다. 바람의 직접적인 원인은 지역별 가열 차이로 생기는 온도와 {{㉡}}의 차이이다.", "다만 예외가 있다. 지구 내부의 열을 이용하는 {{㉢}} 에너지와, 달·태양의 인력으로 생기는 조력 에너지는 태양 에너지가 아니라 각각 지구 내부와 천체의 인력에 근원을 둔다. '거의 모두'와 '모두'를 구별해야 한다."], "terms": [{"k": "물의 순환", "v": "증발 → 구름 → 강수 → 흐름으로 이어지는 물의 이동. 태양의 열에너지가 일으킨다."}, {"k": "바람의 원인", "v": "지역별 가열 차이 → 온도·기압의 차이 → 공기의 이동. 풍력 발전은 이 바람의 운동 에너지를 이용한다."}, {"k": "지열 / 조력", "v": "태양 에너지에 근원을 두지 않는 예외. 지열은 지구 내부의 열, 조력은 달·태양의 인력에서 비롯된다."}], "myths": [{"x": "수력 발전은 태양 에너지와 무관하다.", "o": "물을 높은 곳으로 올려 준 것이 태양의 열에 의한 <b>증발<\/b>이다."}, {"x": "지열 에너지의 근원도 태양 에너지이다.", "o": "지열은 <b>지구 내부의 열<\/b>, 조력은 <b>달·태양의 인력<\/b>에서 비롯된다."}], "point": "증발 → 구름 → 강수 → 흐름(수력), 가열 차 → 온도·기압 차 → 바람(풍력). 비·바람·해류는 모두 태양 에너지가 일으키며, 예외는 지열과 조력뿐이다.", "answers": "정답 ㉠ 위치 ㉡ 기압 ㉢ 지열 — 예외(지열·조력)를 태양 에너지에 포함시킨 선지에 주의한다.", "blanks": {"㉠": "위치", "㉡": "기압", "㉢": "지열"}, "warning": "예외(지열·조력)를 태양 에너지에 포함시킨 선지에 주의한다.", "figure": {"caption": "물의 순환과 바람 — 증발·구름·비·흐름과 바람은 모두 태양 에너지가 일으키며, 수력·풍력 발전의 근원도 태양이다", "file": "figures/2204-04.svg"}}, {"id": "2204-05", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2204", "lessonName": "태양 에너지와 에너지 전환", "no": "05", "title": "에너지 전환과 보존", "subtitle": "형태는 바뀌어도 총량은 일정", "steps": [{"n": "①", "t": "에너지 전환", "d": "에너지는 빛 → 화학 → 열·운동 → 위치 → 전기 등으로 끊임없이 형태를 바꾼다."}, {"n": "②", "t": "에너지 보존", "d": "전환 전후 에너지의 총량은 {{㉠}}된다. 새로 생기거나 사라지지 않는다."}, {"n": "③", "t": "흩어지는 열", "d": "전환될 때마다 일부는 쓰기 어려운 열로 흩어진다. 여기서 '효율' 개념이 나온다."}], "howto": ["지붕의 태양광 전지가 햇빛을 받아 전기를 만들고, 초록 전선이 그 전기를 전등·선풍기·전기밥솥으로 나른다. 전선의 작은 삼각형이 전기가 흐르는 방향이다.", "기구마다 나오는 것이 다르다. 전등에서는 노란 광선(빛)과 붉은 물결(열), 선풍기에서는 회색 선(움직이는 공기), 전기밥솥에서는 붉은 물결(열)이 나온다.", "오른쪽 막대는 높이가 에너지의 양이다. 전환 뒤 막대는 두 칸으로 나뉘지만 전체 높이는 전환 전과 같다. 회색 칸이 쓰기 어려운 열로 흩어진 부분이다."], "body": ["지금까지 살펴본 에너지의 흐름을 정리하면, 에너지는 <b>빛 → 화학 → 열·운동 → 위치 → 전기<\/b> 등으로 끊임없이 형태를 바꾼다. 이를 <b>에너지 전환<\/b>이라 한다. 그런데 형태가 바뀌어도 에너지의 총량은 <b>새로 생기지도, 사라지지도 않는다<\/b>. 이것이 <b>에너지 보존<\/b>이다.", "일상의 기구는 모두 에너지 전환 장치이다. <b>태양광 전지<\/b>는 빛에너지를 {{㉡}} 에너지로, <b>전등<\/b>은 전기 에너지를 빛에너지(와 열에너지)로, <b>선풍기<\/b>는 전기 에너지를 운동 에너지로, <b>전기밥솥<\/b>은 전기 에너지를 열에너지로 전환한다. 우리 몸은 화학 에너지를 운동 에너지와 열에너지로 전환한다. 어떤 기구를 보든 \"무엇이 무엇으로 바뀌는가\"를 묻는 것이 이 단원의 핵심이다.", "다만 에너지가 전환될 때마다 일부는 쓰기 어려운 {{㉢}}로 흩어진다. 총량은 보존되지만 이용할 수 있는 에너지는 줄어드는 것이다. 그래서 에너지를 얼마나 유용하게 쓰는가를 나타내는 '효율'이 중요해지며, 이는 다음 소단원(05 발전과 에너지의 효율적 이용)의 주제이다."], "terms": [{"k": "에너지 전환", "v": "에너지가 한 형태에서 다른 형태로 바뀌는 것. 광합성(빛 → 화학), 호흡(화학 → 열·운동), 발전(운동 → 전기) 등."}, {"k": "에너지 보존", "v": "전환 전후 에너지의 총량은 일정하다는 원리. 에너지는 새로 생기거나 사라지지 않는다."}, {"k": "흩어지는 열", "v": "전환 때마다 쓰기 어려운 열로 빠져나가는 에너지. 총량은 보존되지만 이용 가능한 에너지는 줄어든다. '효율' 개념의 출발점."}], "myths": [{"x": "에너지는 전환을 거듭하면 총량이 점점 줄어든다.", "o": "총량은 <b>보존<\/b>된다. 다만 일부가 쓰기 어려운 열로 흩어질 뿐이다."}, {"x": "태양광 전지는 열에너지를 전기 에너지로 바꾼다.", "o": "<b>빛에너지<\/b>를 전기 에너지로 전환한다."}], "point": "에너지는 전환될 뿐 보존된다. 태양의 핵융합에서 시작한 에너지가 순환·광합성·화석 연료·날씨를 거쳐 우리 생활의 기구까지 이어지며, 근원을 거슬러 오르면 대부분 태양에 닿는다.", "answers": "정답 ㉠ 보존 ㉡ 전기 ㉢ 열 — '총량이 줄어든다'와 '일부가 열로 흩어진다'를 구별하는 것이 핵심이다.", "blanks": {"㉠": "보존", "㉡": "전기", "㉢": "열"}, "warning": "'총량이 줄어든다'와 '일부가 열로 흩어진다'를 구별하는 것이 핵심이다.", "figure": {"caption": "생활 속 에너지 전환과 보존 — 태양광 전지의 전기가 전등·선풍기·전기밥솥에서 빛·운동·열로 바뀌며, 총량은 같고 일부는 열로 흩어진다", "file": "figures/2204-05.svg"}}, {"id": "2205-01", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2205", "lessonName": "발전과 에너지의 효율적 이용", "no": "01", "title": "전자기 유도", "subtitle": "자석과 코일이 만드는 전류", "steps": [{"n": "①", "t": "자석과 코일", "d": "도선을 여러 번 감은 <b>코일<\/b>과 자석을 준비한다."}, {"n": "②", "t": "상대적인 움직임", "d": "자석을 코일에 넣거나 빼거나, 코일 쪽이 움직여도 된다. 둘 다 정지해 있으면 아무 일도 일어나지 않는다."}, {"n": "③", "t": "전류의 발생", "d": "코일에 {{㉠}}가 흐른다. 이 현상이 전자기 유도다."}], "howto": [], "body": ["1831년 패러데이는 <b>코일<\/b>(도선을 여러 번 감은 것) 근처에서 자석을 움직이면 코일에 <b>전류가 흐른다<\/b>는 사실을 발견하였다. 자석을 코일에 넣거나 빼도 되고, 자석은 그대로 두고 코일이 움직여도 된다. 이처럼 자석과 코일의 상대적인 움직임에 의해 코일에 전류가 흐르는 현상을 <b>전자기 유도<\/b>라 한다.", "핵심 조건은 자석과 코일 사이의 <b>'상대적인 움직임'<\/b>이다. 그림 1의 왼쪽처럼 자석이 코일에 대해 움직일 때만 전류가 흘러 전구가 켜지며, 오른쪽처럼 둘 다 정지해 있으면 자석이 아무리 강해도 전류는 흐르지 않는다.", "<b>발전기<\/b>는 {{㉡}}를 이용하여 <b>운동 에너지를 전기 에너지로<\/b> 바꾸는 장치다. 흔들면 켜지는 손전등, 페달을 밟으면 켜지는 자전거 전조등은 모두 작은 발전기다. 자석을 빠르게 움직일수록, 코일을 많이 감을수록 유도되는 전류는 커진다. 강한 자석을 멈춰 두는 것보다 약한 자석을 움직이는 쪽이 전류를 만든다.", "반대로 전기 에너지를 운동 에너지로 바꾸는 장치를 {{㉢}}라 한다. 선풍기와 세탁기 속의 이 장치는 전기로 회전을 만들어 내며, 발전기와 정확히 반대 방향으로 에너지를 전환한다."], "terms": [{"k": "전자기 유도", "v": "자석과 코일의 상대적인 움직임에 의해 코일에 전류가 흐르는 현상. 1831년 패러데이가 발견하였다."}, {"k": "발전기", "v": "전자기 유도를 이용하여 운동 에너지를 전기 에너지로 바꾸는 장치. 흔들어 켜는 손전등, 자전거 전조등, 발전소의 발전기."}, {"k": "전동기", "v": "전기 에너지를 운동 에너지로 바꾸는 장치. 선풍기·세탁기에 쓰이며, 발전기와 에너지 전환 방향이 반대다."}], "myths": [{"x": "자석이 충분히 강하면 정지해 있어도 전류가 흐른다.", "o": "자석과 코일의 <b>상대적인 움직임<\/b>이 있어야만 전류가 흐른다."}, {"x": "발전기는 전기 에너지를 운동 에너지로 바꾼다.", "o": "발전기는 <b>운동 → 전기<\/b>. 전기 → 운동은 전동기다."}], "point": "전자기 유도의 조건은 자석과 코일의 상대적인 움직임이다. 이 원리로 운동 에너지를 전기 에너지로 바꾸는 장치가 발전기이며, 모든 발전소의 마지막 단계에는 발전기가 있다.", "answers": "정답 ㉠ 전류 ㉡ 전자기 유도 ㉢ 전동기 — 발전기와 전동기의 에너지 전환 방향을 서로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "전류", "㉡": "전자기 유도", "㉢": "전동기"}, "warning": "발전기와 전동기의 에너지 전환 방향을 서로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "전자기 유도 — 자석과 코일의 상대적인 움직임이 있을 때만 코일에 전류가 흐른다", "file": "figures/2205-01.svg"}}, {"id": "2205-02", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2205", "lessonName": "발전과 에너지의 효율적 이용", "no": "02", "title": "발전소의 공통 구조", "subtitle": "터빈과 발전기", "steps": [{"n": "①", "t": "에너지원", "d": "떨어지는 물, 연료를 태운 열, 핵분열의 열 — 발전소마다 다르다."}, {"n": "②", "t": "터빈의 회전", "d": "물 또는 증기가 날개바퀴인 {{㉠}}을 돌린다."}, {"n": "③", "t": "발전기", "d": "터빈에 연결된 발전기에서 <b>전자기 유도<\/b>가 일어나 전기가 나온다."}], "howto": [], "body": ["거대한 발전소도 원리는 흔들면 켜지는 손전등과 같다. 발전소의 공통 구조는 두 부품, 즉 날개바퀴인 <b>터빈<\/b>과 터빈에 연결된 <b>발전기<\/b>다. 무언가로 터빈을 돌리면 발전기 속에서 전자기 유도가 일어나 전기가 만들어진다. 발전 방식의 차이는 <b>터빈을 무엇으로 돌리느냐<\/b> 하나뿐이다.", "그림 2의 위쪽 세 상자는 터빈을 돌리는 에너지원이고, 아래쪽 띠는 모든 발전소가 공통으로 거치는 마지막 두 단계다. 다만 <b>태양광 전지<\/b>는 터빈 없이 빛을 바로 전기로 바꾸는 예외다.", "<b>수력 발전<\/b>은 높은 곳에서 떨어지는 물로 터빈을 직접 돌린다(위치 에너지 → 운동 에너지 → 전기 에너지). <b>화력 발전<\/b>은 화석 연료를 태운 열로 물을 끓여 {{㉡}}로 터빈을 돌린다(화학 에너지 → 열에너지 → 운동 에너지 → 전기 에너지). <b>핵발전<\/b>은 우라늄 원자핵이 쪼개지는 {{㉢}}에서 나오는 열로 역시 증기를 만들어 터빈을 돌린다.", "열원만 다를 뿐 화력 발전과 핵발전은 모두 증기의 힘으로 터빈을 돌리는 같은 구조다. 마지막 단계인 발전기의 원리는 세 방식 모두 <b>전자기 유도<\/b>로 같다. 각 방식의 장점과 문제점은 개념 03에서 비교한다."], "terms": [{"k": "터빈", "v": "물이나 증기의 흐름을 회전으로 바꾸는 날개바퀴. 발전기에 연결되어 발전기를 돌린다."}, {"k": "핵분열", "v": "무거운 우라늄 원자핵이 쪼개지며 열을 내는 반응. 핵발전의 열원이며, 태양의 핵융합과는 반대 방향의 반응이다."}, {"k": "에너지 전환 사슬", "v": "화력 발전: 화학 → 열 → 운동 → 전기. 수력 발전: 위치 → 운동 → 전기. 순서대로 쓸 수 있어야 한다."}], "myths": [{"x": "발전 방식마다 전기를 만드는 원리가 다르다.", "o": "원리는 <b>전자기 유도<\/b>로 같다. 다른 것은 터빈을 돌리는 에너지원이다."}, {"x": "핵발전의 열원은 화석 연료의 연소다.", "o": "우라늄의 <b>핵분열<\/b>에서 나오는 열이다."}], "point": "수력은 물, 화력·핵발전은 증기로 터빈을 돌린다. 터빈 → 발전기(전자기 유도) → 전기의 마지막 두 단계는 모든 발전소가 같다.", "answers": "정답 ㉠ 터빈 ㉡ 증기 ㉢ 핵분열 — 화력의 전환 사슬 '화학 → 열 → 운동 → 전기'의 순서를 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "터빈", "㉡": "증기", "㉢": "핵분열"}, "warning": "화력의 전환 사슬 '화학 → 열 → 운동 → 전기'의 순서를 바꾼 선지가 단골 오답이다.", "figure": {"caption": "발전소의 공통 구조 — 물·증기가 터빈을 돌리고, 발전기가 전자기 유도로 전기를 만든다", "file": "figures/2205-02.svg"}}, {"id": "2205-03", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2205", "lessonName": "발전과 에너지의 효율적 이용", "no": "03", "title": "화력 발전과 핵발전", "subtitle": "장점과 문제점의 비교", "steps": [{"n": "①", "t": "화력 발전", "d": "안정적으로 대량의 전기를 만들지만, {{㉠}}와 미세먼지 등 대기 오염 물질을 배출한다."}, {"n": "②", "t": "핵발전", "d": "적은 연료로 막대한 전기를 만들고 이산화 탄소 배출이 거의 없지만, <b>방사성 폐기물<\/b>을 오래 관리해야 한다."}, {"n": "③", "t": "사회적 선택", "d": "안전·환경·비용·안정성을 함께 저울질하여 에너지 구성을 결정한다."}], "howto": ["두 상자는 각각 화력 발전(왼쪽)과 핵발전(오른쪽)의 장단점을 정리한 것이다. 초록색 <b>'+'<\/b>는 장점, 붉은색 <b>'−'<\/b>는 문제점이다.", "화력의 '−'에는 이산화 탄소·미세먼지 배출과 연료 고갈이 있다. 개념 03(지구온난화)의 원인과 이어진다.", "핵발전의 '−'에는 방사성 폐기물, 사고 위험, 큰 비용이 있다. 이산화 탄소는 핵발전에서 <b>'+'<\/b> 쪽에 있음에 주의한다.", "문제를 풀 때는 두 상자의 '−'를 서로 바꿔 놓은 선지를 골라낸다."], "body": ["우리 문명의 전기 대부분을 담당해 온 두 방식을 나란히 비교한다. <b>화력 발전<\/b>은 연료만 있으면 언제든 안정적으로 대량의 전기를 만들 수 있고, 건설 기술이 성숙해 있다. 그러나 <b>이산화 탄소<\/b>와 미세먼지 등 대기 오염 물질을 배출하며, 연료인 화석 연료는 언젠가 고갈된다.", "<b>핵발전<\/b>은 적은 연료로 막대한 전기를 만들며, 발전 과정에서 이산화 탄소를 거의 배출하지 않는다. 그러나 {{㉡}}을 수만 년 단위로 관리해야 하고, 사고가 나면 피해가 크고 오래가며, 건설과 폐로에 큰 비용이 든다.", "어느 방식도 문제점이 없지 않다. 그래서 사회는 <b>안전·환경·비용·안정성<\/b>을 함께 저울질하며 여러 발전 방식을 섞어 쓰는 에너지 구성을 결정한다. 정리하면 화력 발전의 문제점은 온실 기체와 대기 오염, 연료의 {{㉢}}이고, 핵발전의 문제점은 방사성 폐기물과 사고 위험이다. 두 방식의 문제점을 서로 바꾸어 서술한 진술은 옳지 않다."], "terms": [{"k": "방사성 폐기물", "v": "핵발전 후 남는, 방사선을 내는 물질. 아주 오랜 시간 격리하여 보관해야 한다."}, {"k": "대기 오염 물질", "v": "화력 발전이 배출하는 이산화 탄소·미세먼지 등. 이산화 탄소는 지구온난화의 주요 원인이다."}, {"k": "에너지 믹스", "v": "한 나라가 여러 발전 방식을 섞어 쓰는 구성. 안전·환경·비용·안정성을 저울질한 사회적 합의의 결과다."}], "myths": [{"x": "핵발전은 이산화 탄소를 대량 배출한다.", "o": "거의 배출하지 않는다. 핵발전의 문제점은 <b>방사성 폐기물<\/b>과 사고 위험이다."}, {"x": "화력 발전의 핵심 문제는 폐기물이다.", "o": "화력의 핵심 문제는 <b>온실 기체·대기 오염 물질<\/b>의 배출이다."}], "point": "화력의 문제점은 이산화 탄소·미세먼지·연료 고갈, 핵발전의 문제점은 방사성 폐기물·사고 위험·비용이다. 어느 쪽도 공짜가 아니므로 안전·환경·비용·안정성을 함께 저울질한다.", "answers": "정답 ㉠ 이산화 탄소 ㉡ 방사성 폐기물 ㉢ 고갈 — 두 방식의 문제점을 서로 바꿔 놓은 '교차 함정' 선지에 주의한다.", "blanks": {"㉠": "이산화 탄소", "㉡": "방사성 폐기물", "㉢": "고갈"}, "warning": "두 방식의 문제점을 서로 바꿔 놓은 '교차 함정' 선지에 주의한다.", "figure": {"caption": "화력 발전소와 핵발전소 — 굴뚝에서 나오는 것과 건물 안에 남는 것이 두 방식의 차이다", "file": "figures/2205-03.svg"}}, {"id": "2205-04", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2205", "lessonName": "발전과 에너지의 효율적 이용", "no": "04", "title": "에너지 효율", "subtitle": "유용하게 쓰인 에너지의 비율", "steps": [{"n": "①", "t": "전환과 손실", "d": "에너지는 보존되지만, 전환될 때마다 일부는 쓰기 어려운 {{㉠}}로 흩어진다."}, {"n": "②", "t": "효율의 정의", "d": "효율(%) = <b>유용하게 사용된 에너지 ÷ 공급한 에너지 × 100<\/b>"}, {"n": "③", "t": "효율 개선의 효과", "d": "같은 일을 더 적은 에너지로 → 연료 절약 → 온실 기체 감축."}], "howto": ["두 막대는 전구에 공급한 전기 에너지 100을 나타낸다. <b>노란 부분<\/b>이 빛으로 바뀐 몫, 나머지가 열로 흩어진 몫이다.", "백열등(왼쪽)은 노란 부분이 약 5, 열이 약 95다 — 효율 = 5 ÷ 100 × 100 = <b>5 %<\/b>.", "LED(오른쪽)는 노란 부분이 훨씬 넓다. 같은 밝기의 빛을 훨씬 적은 전기로 얻는다는 뜻이다.", "아래 상자의 식에서 분모는 <b>'공급한 에너지'<\/b>다. 분모와 분자를 바꾸지 않도록 주의한다."], "body": ["에너지는 보존되지만(개념 04) 전환될 때마다 일부는 쓰기 어려운 <b>열로 흩어진다<\/b>. 그래서 공급한 에너지 중 목적에 맞게 쓰인 비율이 중요한데, 이를 <b>에너지 효율<\/b>이라 한다. 백열등에 전기 100을 공급하면 빛이 되는 것은 약 5뿐이고 나머지 약 95는 열이 된다. 백열등을 만지면 뜨거운 이유다. LED는 훨씬 많은 몫을 빛으로 바꾼다.", "효율(%)은 유용하게 사용된 에너지를 {{㉡}} 에너지로 나누어 100을 곱한 값이다. 예를 들어 공급 100 J 중 빛 5 J이면 효율은 <b>5 %<\/b>다. 이때 빛이 되지 못한 95 J은 사라진 것이 아니라 열로 흩어진 것이며, 전체 에너지의 총량은 {{㉢}}된다.", "효율이 중요한 이유는 <b>같은 일을 더 적은 에너지로<\/b> 할 수 있기 때문이다. 발전소를 덜 가동해도 되므로 연료가 절약되고, 개념 03에서 다룬 온실 기체의 배출도 줄어든다. 냉장고·에어컨에 붙은 <b>에너지 소비 효율 등급<\/b>(1~5등급, 1등급이 가장 효율적), LED 교체, 고효율 가전은 모두 손실을 줄이는 기술이다. 에너지를 만드는 것 못지않게 손실을 줄여 쓰는 것이 중요하다."], "terms": [{"k": "에너지 효율", "v": "공급한 에너지 중 유용하게 사용된 에너지의 비율. 효율(%) = 유용하게 사용된 에너지 ÷ 공급한 에너지 × 100."}, {"k": "에너지 소비 효율 등급", "v": "가전제품의 효율을 1~5등급으로 표시한 것. 1등급이 가장 효율적이다."}, {"k": "흩어진 열", "v": "전환 과정에서 유용하게 쓰이지 못한 에너지. 사라진 것이 아니라 다시 모아 쓰기 어려울 뿐이며, 에너지 보존 법칙은 깨지지 않는다."}], "myths": [{"x": "손실된 에너지는 소멸하여 전체 총량이 줄어든다.", "o": "<b>열로 흩어질 뿐<\/b> 총량은 보존된다."}, {"x": "효율 계산의 분모는 유용하게 사용된 에너지다.", "o": "분모는 <b>공급한 에너지<\/b>, 분자가 유용하게 사용된 에너지다."}], "point": "효율 = 유용하게 사용된 에너지 ÷ 공급한 에너지 × 100. 백열등은 약 5 %(열 95). 효율 ↑ → 연료 ↓ → 이산화 탄소 ↓의 3연쇄가 서술형의 핵심이다.", "answers": "정답 ㉠ 열 ㉡ 공급한 ㉢ 보존 — \"나머지 95 J은 사라졌다\"고 쓰면 보존 법칙 위반으로 감점된다.", "blanks": {"㉠": "열", "㉡": "공급한", "㉢": "보존"}, "warning": "\"나머지 95 J은 사라졌다\"고 쓰면 보존 법칙 위반으로 감점된다.", "figure": {"caption": "에너지 효율 — 같은 100의 전기에서 얼마나 많은 몫이 목적(빛)에 쓰이는가", "file": "figures/2205-04.svg"}}, {"id": "2205-05", "unit": "II", "unitName": "환경과 에너지", "lessonId": "2205", "lessonName": "발전과 에너지의 효율적 이용", "no": "05", "title": "신재생 에너지와 지속가능한 발전", "subtitle": "", "steps": [{"n": "①", "t": "신재생 에너지", "d": "화석 연료 대신 <b>지금의 태양과 자연의 흐름<\/b>을 이용하는 에너지 — 태양광·태양열·풍력·수력·지열·조력·바이오·연료 전지."}, {"n": "②", "t": "장점", "d": "고갈 걱정이 적고, {{㉠}} 배출이 적다."}, {"n": "③", "t": "한계와 방향", "d": "날씨·시간·입지에 따라 출력이 변하고 비용·저장의 과제가 있다 → 신재생 확대 + 효율 개선 + 저장 기술."}], "howto": [], "body": ["화석 연료가 먼 과거의 태양 에너지라면, <b>지금의 태양과 자연의 흐름<\/b>을 이용하는 것이 <b>신재생 에너지<\/b>다. <b>태양광<\/b>(빛 → 전기, 태양 전지)과 <b>태양열<\/b>(빛 → 열), <b>풍력<\/b>(바람), <b>수력<\/b>(물), <b>지열<\/b>(지구 내부의 열), <b>조력<\/b>(밀물과 썰물), <b>바이오 에너지<\/b>(생물 자원), 그리고 수소를 연료로 쓰는 <b>연료 전지<\/b>가 여기에 속한다. 개념 04에서 본 것처럼 이들 대부분은 태양이 실시간으로 보내는 에너지에서 비롯된다.", "신재생 에너지의 장점은 뚜렷하다. <b>고갈 걱정이 적고, 온실 기체 배출이 적다<\/b>. 한계도 있다. 날씨·시간·입지의 영향을 받아 출력이 변하고(해가 지면 태양광 발전은 멈춘다), 아직 비용과 전기를 모아 두는 {{㉡}} 기술의 과제가 남아 있다.", "따라서 방향은 한 가지 방식에 의존하는 것이 아니라 조합이다. 신재생 에너지의 확대, 에너지 효율의 개선, 저장 기술의 발전을 함께 추진하여 <b>미래 세대의 몫을 당겨쓰지 않으면서 오늘의 필요를 채우는 것<\/b> — 이것이 {{㉢}}이다."], "terms": [{"k": "신재생 에너지", "v": "화석 연료 대신 지금의 태양과 자연의 흐름을 이용하는 에너지. 태양광·태양열·풍력·수력·지열·조력·바이오 에너지·연료 전지 등."}, {"k": "연료 전지", "v": "수소와 산소의 반응으로 전기를 얻는 장치. 배출물이 물이다."}, {"k": "지속가능한 발전", "v": "미래 세대의 필요를 해치지 않으면서 현재의 필요를 채우는 발전. 신재생 확대 + 효율 개선 + 저장 기술의 조합으로 나아간다."}], "myths": [{"x": "신재생 에너지는 날씨와 입지의 영향을 받지 않는다.", "o": "날씨·시간·입지에 따라 <b>출력이 변한다<\/b>. 그래서 저장 기술이 과제다."}, {"x": "신재생 에너지는 한계가 없는 만능 해결책이다.", "o": "장점과 한계를 함께 본다. <b>효율 개선·저장 기술과의 조합<\/b>이 답이다."}], "point": "신재생 에너지 = 지금의 태양과 자연의 흐름. 장점은 고갈·배출이 적은 것, 한계는 날씨·저장·비용이다. 신재생 확대 + 효율 개선 + 저장 기술의 조합이 지속가능한 발전으로 가는 길이다.", "answers": "정답 ㉠ 온실 기체 ㉡ 저장 ㉢ 지속가능한 발전 — 장점만 또는 한계만 강조한 극단적 선지는 모두 오답이다.", "blanks": {"㉠": "온실 기체", "㉡": "저장", "㉢": "지속가능한 발전"}, "warning": "장점만 또는 한계만 강조한 극단적 선지는 모두 오답이다.", "figure": {"caption": "신재생 에너지의 종류와 특징 — 윗줄은 종류와 이용하는 자연의 흐름, 아랫줄은 공통의 장점과 한계", "file": "figures/2205-05.svg"}}, {"id": "2301-01", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2301", "lessonName": "감염병과 과학의 유용성", "no": "01", "title": "병원체", "subtitle": "세균과 바이러스", "steps": [{"n": "①", "t": "감염병과 병원체", "d": "감염병은 <b>병원체<\/b>가 몸에 들어와 일으키는 병이다."}, {"n": "②", "t": "두 병원체의 차이", "d": "세균은 스스로 증식하고, 바이러스는 숙주 세포 안에서만 증식한다."}, {"n": "③", "t": "치료의 차이", "d": "항생제는 {{㉠}}에만 효과가 있고 바이러스에는 듣지 않는다."}], "howto": [], "body": ["<b>감염병<\/b>은 <b>병원체<\/b>가 몸에 들어와 일으키는 병이다. 주요 병원체는 세균과 바이러스 두 가지이다. 그림 1의 왼쪽처럼 <b>세균<\/b>은 스스로 분열하여 1개가 2개, 4개로 늘어나는 생물이며, 결핵·콜레라·식중독을 일으킨다. 오른쪽의 <b>바이러스<\/b>는 세균의 수십분의 1 정도로 훨씬 작고, 숙주 세포 안에 들어가 그 세포를 이용해 복제된 뒤 밖으로 나와 퍼진다. 감기·독감·코로나19가 바이러스에 의한 감염병이다.", "그림의 아랫줄은 두 병원체에 항생제를 썼을 때의 결과이다. 스스로 증식하는 세균은 <b>항생제<\/b>로 죽일 수 있지만, 숙주 세포를 빌려 증식하는 바이러스에는 항생제가 듣지 않는다. 병원체의 종류가 다르면 치료 방법도 달라지는 것이다.", "항생제는 세균에 의한 감염병에만 쓰이는 약이다. 감기의 병원체는 바이러스이므로 감기에 항생제를 함부로 사용해서는 안 된다. 바이러스는 {{㉡}} 안에 들어가야만 증식할 수 있다는 점이 세균과 구별되는 가장 중요한 특징이다.", "병원체는 여러 경로로 퍼진다. 기침이나 재채기 때 튀는 작은 침방울인 {{㉢}}, 오염된 손과 물건을 통한 <b>접촉<\/b>, 음식과 물, 모기와 같은 매개 동물이 대표적인 전파 경로이다. 감염병에 대응하려면 병원체의 정체(무엇이)와 전파 경로(어떻게)를 먼저 알아야 하며, 이를 알아내는 방법이 개념 02의 <b>진단<\/b>과 개념 03의 <b>추적<\/b>이다."], "terms": [{"k": "병원체", "v": "감염병을 일으키는 미생물. 세균·바이러스 외에 곰팡이·기생충도 있다."}, {"k": "세균 / 바이러스", "v": "세균은 스스로 증식하는 생물(크기 μm 수준). 바이러스는 세균의 수십분의 1 크기로, 숙주 세포 안에서만 증식한다."}, {"k": "비말", "v": "기침·재채기 때 튀는 작은 침방울. 호흡기 감염병의 주요 전파 경로이다."}], "myths": [{"x": "감기와 독감의 병원체는 세균이다.", "o": "감기·독감·코로나19의 병원체는 <b>바이러스<\/b>이다."}, {"x": "항생제는 모든 감염병에 효과가 있다.", "o": "항생제는 <b>세균<\/b>에만 듣고 바이러스에는 듣지 않는다."}], "point": "세균은 스스로 증식하고, 바이러스는 숙주 세포 안에서만 증식한다. 이 차이 때문에 항생제는 세균에 의한 감염병에만 쓰인다.", "answers": "정답 ㉠ 세균 ㉡ 숙주 세포 ㉢ 비말 — \"바이러스는 스스로 증식한다\"로 바꾼 선지가 단골 오답이다.", "blanks": {"㉠": "세균", "㉡": "숙주 세포", "㉢": "비말"}, "warning": "\"바이러스는 스스로 증식한다\"로 바꾼 선지가 단골 오답이다.", "figure": {"caption": "세균은 스스로 분열하여 늘어나고, 바이러스는 숙주 세포 안에서만 복제된다 — 항생제는 세균에만 듣는다", "file": "figures/2301-01.svg"}}, {"id": "2301-02", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2301", "lessonName": "감염병과 과학의 유용성", "no": "02", "title": "진단", "subtitle": "항원 검사와 유전자 증폭 검사", "steps": [{"n": "①", "t": "항원과 항체", "d": "키트에는 특정 병원체의 항원에만 결합하는 {{㉠}}가 발라져 있다."}, {"n": "②", "t": "특이적 결합", "d": "검체 속에 항원이 있으면 항체와 결합하여 T선에 색 줄이 나타난다."}, {"n": "③", "t": "유전자 증폭 검사", "d": "극미량의 유전 물질을 수백만 배로 복사하여 검출한다."}], "howto": ["스포이트로 <b>검체<\/b>(코나 목에서 채취한 시료)를 왼쪽 동그라미에 떨어뜨리면, 액체가 종이 띠를 따라 오른쪽으로 흘러간다(굵은 화살표).", "띠 위의 <b>T선<\/b>에는 Y자 모양의 항체가 발라져 있다(확대경). 검체 속에 항원이 있으면 항체에 결합하여 색 줄이 나타난다 — 이것이 양성이다.", "<b>C선<\/b>은 액체가 끝까지 제대로 흘렀는지 알려 주는 대조선이다. 아랫줄처럼 C선만 있으면 음성, C선조차 없으면 검사가 무효이므로 다시 검사한다."], "body": ["<b>신속 항원 검사 키트<\/b>는 항원과 항체의 <b>특이적 결합<\/b>을 이용한다. <b>항원<\/b>은 병원체 표면의 단백질이고, <b>항체<\/b>는 특정 항원에만 결합하는 단백질이다. 키트에 검체를 떨어뜨리면 액체가 종이 띠를 따라 이동하며, 검체 속에 항원이 있으면 띠에 발라진 항체와 결합하여 <b>T선(시험선)<\/b>에 색 줄이 나타난다. <b>C선(대조선)<\/b>은 액체가 끝까지 제대로 흘렀는지를 알려 주는 선이다.", "T선은 검체 속 항원이 검출되었다는 신호이고, C선은 검사가 제대로 이루어졌다는 확인 신호이다. 따라서 C선만 나타나고 {{㉡}}이 나타나지 않으면 음성이며, C선 자체가 나타나지 않으면 검사가 무효이므로 다시 검사해야 한다.", "더 정밀한 진단 방법은 <b>유전자 증폭 검사<\/b>(PCR)이다. 검체에 든 병원체의 {{㉢}}을 수백만 배로 복사하여, 극미량이라도 있는지 없는지를 가려낸다. 민감도가 높아 확진에 쓰인다. 빠르고 간편한 항원 검사와 정밀한 유전자 증폭 검사를 함께 사용하여 '누가 감염되었는가'를 과학적으로 판정할 수 있다."], "terms": [{"k": "항원 / 항체", "v": "항원은 병원체 표면의 표지 물질(단백질), 항체는 그 항원에만 결합하는 단백질."}, {"k": "T선 / C선", "v": "T선(시험선)은 항원-항체 결합으로 색 줄이 생기는 검출선, C선(대조선)은 액체가 끝까지 흘렀는지 알려 주는 확인선."}, {"k": "유전자 증폭 검사", "v": "병원체의 유전 물질을 수백만 배로 복사해 극미량도 검출하는 검사. 민감도가 높아 확진에 쓰인다."}], "myths": [{"x": "C선은 검체 속 항원의 존재를 알려 준다.", "o": "C선은 검사가 <b>유효<\/b>한지 알려 주는 선이다. 항원 검출은 <b>T선<\/b>이다."}, {"x": "신속 항원 검사는 유전 물질을 증폭한다.", "o": "항원 검사는 <b>항원-항체 결합<\/b>, 유전 물질 증폭은 <b>유전자 증폭 검사<\/b>이다."}], "point": "신속 항원 검사는 항원-항체의 특이적 결합(T선 = 검출, C선 = 확인), 유전자 증폭 검사는 유전 물질을 불려서 검출한다. 두 검사의 원리를 서로 바꾸지 않는다.", "answers": "정답 ㉠ 항체 ㉡ T선 ㉢ 유전 물질 — 두 검사의 원리를 서로 바꾼 선지와 'C선 = 항원 검출'이 최다 오답이다.", "blanks": {"㉠": "항체", "㉡": "T선", "㉢": "유전 물질"}, "warning": "두 검사의 원리를 서로 바꾼 선지와 'C선 = 항원 검출'이 최다 오답이다.", "figure": {"caption": "신속 항원 검사 키트 — 검체가 띠를 따라 흐르다 T선의 항체에 항원이 결합하면 색 줄이 생기고, C선은 검사가 유효한지 알려 준다", "file": "figures/2301-02.svg"}}, {"id": "2301-03", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2301", "lessonName": "감염병과 과학의 유용성", "no": "03", "title": "추적", "subtitle": "역학 조사와 전파 경로", "steps": [{"n": "①", "t": "확인", "d": "감염자를 진단하고, 증상이 시작된 발병일을 파악한다."}, {"n": "②", "t": "동선과 접촉자", "d": "{{㉠}} 동안 어디를 다녔고 누구를 만났는지 데이터로 재구성한다."}, {"n": "③", "t": "차단", "d": "접촉자를 미리 검사·관리하여 다음 전파를 끊는다."}], "howto": [], "body": ["감염자를 찾아냈다면 다음 과제는 '어디서, 누구에게로' 퍼졌는지를 밝히는 일이다. <b>역학 조사<\/b>는 감염자의 동선과 접촉자를 데이터로 추적하여 전파 경로를 밝히는 조사이다. 그림 3과 같이 병원에서 감염자를 확인하고(①), 잠복기 동안 다닌 곳을 되짚으며(②), 그곳에서 만난 사람을 파악하여 검사·관리하고(③), 다음 전파의 고리를 끊는(④) 순서로 진행된다.", "언제 증상이 시작되었는지(발병일), 그 전 <b>잠복기<\/b> 동안 어디를 다녔는지, 누구와 만났는지를 재구성하면 전파 경로가 드러난다. 잠복기에도 병원체가 전파될 수 있으므로 증상이 나타나기 전의 동선까지 조사한다. 역학 조사의 목적은 치료법 개발이 아니라 <b>전파 경로 파악과 확산 차단<\/b>이다.", "이 방법의 원형은 1854년 런던의 콜레라 유행에서 찾을 수 있다. 당시 사람들은 '나쁜 공기'가 원인이라고 믿었지만, 의사 <b>존 스노우<\/b>는 사망자가 나온 집마다 지도에 점을 찍었다. 점들은 브로드 스트리트의 <b>공용 펌프<\/b> 하나를 중심으로 몰려 있었고, 펌프에서 멀리 떨어진 사망자도 그 펌프의 물을 길어 마신 것으로 확인되었다. 원인은 공기가 아니라 {{㉡}}이었으며, 펌프 손잡이를 제거하자 유행이 잦아들었다.", "스노우는 콜레라균을 본 적이 없었다. 병원체를 몰라도 발생 위치라는 {{㉢}}만으로 전파 경로를 찾아낸 것이며, 이것이 역학 조사의 시작이다. 오늘날에는 카드 사용 내역·기지국·CCTV와 같은 디지털 데이터로 같은 일을 훨씬 빠르게 해낸다. 데이터 → 패턴 → 원인 → 차단이라는 순서는 그대로이다."], "terms": [{"k": "역학 조사", "v": "감염자의 동선과 접촉자를 데이터로 추적하여 전파 경로를 밝히고 확산을 차단하는 조사. 역학(疫學)은 질병이 언제·어디서·누구에게 생기는지를 집단 수준에서 연구하는 학문이다."}, {"k": "잠복기", "v": "병원체가 몸에 들어온 뒤 증상이 나타나기까지의 기간. 이 기간에도 전파될 수 있어 조사 대상이 된다."}, {"k": "존 스노우의 지도", "v": "1854년 런던 콜레라 유행 때 사망자의 분포를 지도에 표시해 오염된 물(공용 펌프)을 원인으로 지목한 조사. 역학 조사의 원형이다."}], "myths": [{"x": "역학 조사의 목적은 치료제 개발이다.", "o": "목적은 <b>전파 경로 파악과 확산 차단<\/b>이다."}, {"x": "스노우는 현미경으로 콜레라균을 찾아 원인을 밝혔다.", "o": "균을 보지 못한 채 <b>사망자 분포 데이터<\/b>로 오염된 물을 지목했다."}], "point": "역학 조사는 확인 → 동선 → 접촉자 → 차단의 순서로 진행되며, 잠복기의 동선까지 조사한다. 치료가 한 사람을 구한다면, 역학 조사는 다음 전파를 막는다.", "answers": "정답 ㉠ 잠복기 ㉡ 물 ㉢ 데이터 — '치료제 개발'과 '현미경으로 균 발견'이 대표 오답 선지이다.", "blanks": {"㉠": "잠복기", "㉡": "물", "㉢": "데이터"}, "warning": "'치료제 개발'과 '현미경으로 균 발견'이 대표 오답 선지이다.", "figure": {"caption": "역학 조사의 흐름 — 병원에서 감염자를 확인(①)하고 잠복기의 동선을 되짚어(②) 접촉자를 찾아(③) 검사·관리로 전파를 끊는다(④)", "file": "figures/2301-03.svg"}}, {"id": "2301-04", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2301", "lessonName": "감염병과 과학의 유용성", "no": "04", "title": "방어", "subtitle": "백신과 전파 경로의 차단", "steps": [{"n": "①", "t": "예방 접종", "d": "병원체의 일부(항원)나 약화된 형태를 미리 몸에 넣는다."}, {"n": "②", "t": "연습과 기억", "d": "면역계가 {{㉠}} 만드는 법을 연습하고 그 기억을 저장한다."}, {"n": "③", "t": "실전 방어", "d": "진짜 병원체가 들어와도 훈련된 면역계가 빠르게 맞선다."}], "howto": [], "body": ["<b>백신<\/b>은 병원체의 일부(항원)나 약화된 형태를 미리 몸에 넣어 면역을 준비시키는 방법이다. 그림 4의 ①과 같이 예방 접종으로 항원이 들어오면, ②에서 면역계는 항체를 만드는 법을 연습하고 그 기억을 <b>기억 세포<\/b>에 저장한다. ③처럼 진짜 병원체가 들어왔을 때 몸은 이미 훈련된 상태로 맞서게 된다.", "이러한 <b>면역 기억<\/b> 덕분에 백신은 병에 걸리기 전에 미리 대비하는 <b>예방<\/b> 수단이 된다. 이미 걸린 병을 고치는 치료제와는 구별해야 한다. 백신의 원리로 천연두는 지구에서 사라졌으며, 1980년 WHO가 천연두 박멸을 공식 선언하였다.", "일상의 방어 수단도 병원체의 전파 경로(개념 01)를 알기에 설계할 수 있다. <b>손 씻기<\/b>는 접촉을 통한 전파를, <b>마스크<\/b>는 {{㉡}}을 통한 전파를 길목에서 차단한다.", "<b>항생제의 올바른 사용<\/b>도 중요한 방어이다. 세균 집단에는 항생제에 견디는 내성 변이를 가진 개체가 섞여 있는데, 복용을 중간에 멈추면 내성이 약한 세균만 죽고 {{㉢}}만 살아남아 번식하는 자연선택이 일어난다(I-02). 따라서 항생제는 의사의 처방대로 끝까지 복용해야 한다."], "terms": [{"k": "백신", "v": "병원체의 일부(항원)나 약화된 형태를 미리 몸에 넣어 면역을 준비시키는 예방 수단. 치료제와 구별한다."}, {"k": "면역 기억", "v": "한 번 만난 항원을 기억했다가 재침입 때 빠르게 항체를 만드는 능력. 백신의 과학적 기반이다."}, {"k": "천연두 박멸", "v": "1980년 WHO가 공식 선언. 백신으로 지구에서 사라진 첫 감염병."}], "myths": [{"x": "백신은 이미 걸린 병을 치료하는 약이다.", "o": "백신은 미리 면역을 준비시키는 <b>예방<\/b> 수단이다."}, {"x": "증상이 나아지면 항생제 복용을 멈춰도 된다.", "o": "중간에 멈추면 <b>내성균<\/b>만 살아남는 자연선택이 일어난다. 처방대로 끝까지 복용한다."}], "point": "백신은 면역계가 항체 생산을 미리 연습하고 기억하게 하는 예방 수단이다. 손 씻기·마스크는 전파 경로 차단, 항생제는 처방대로 끝까지 복용한다.", "answers": "정답 ㉠ 항체 ㉡ 비말 ㉢ 내성균 — \"백신은 치료제\"로 바꾼 선지가 기본 함정이다.", "blanks": {"㉠": "항체", "㉡": "비말", "㉢": "내성균"}, "warning": "\"백신은 치료제\"로 바꾼 선지가 기본 함정이다.", "figure": {"caption": "백신의 원리 — 예방 접종(①)으로 항체 생산을 연습하고 기억 세포에 저장(②)해 두면, 진짜 병원체가 들어와도 빠르게 방어한다(③)", "file": "figures/2301-04.svg"}}, {"id": "2301-05", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2301", "lessonName": "감염병과 과학의 유용성", "no": "05", "title": "과학의 유용성", "subtitle": "감염병 대응의 사례", "steps": [{"n": "①", "t": "코로나19의 대응", "d": "병원체의 유전 정보 해독, {{㉠}} 키트 개발, 역학 조사, 백신 개발이 실제로 이루어졌다."}, {"n": "②", "t": "과학의 유용성", "d": "과학이 없었다면 병원체의 정체도 모른 채 대응해야 했다."}, {"n": "③", "t": "남은 과제", "d": "새로운 감염병에 대비한 감시망·국제 협력·데이터 활용 능력."}], "howto": [], "body": ["코로나19 유행 기간에는 이 소단원의 내용이 실제 상황으로 전개되었다. 그림 5의 실험대 위를 왼쪽부터 보면, 병원체의 <b>유전 정보<\/b>를 해독하여 정체를 밝히고(①), <b>진단 키트<\/b>를 몇 주 만에 만들었으며(②), <b>역학 조사<\/b>로 전파를 추적하고(③), 유례없는 속도로 <b>백신<\/b>을 개발하였다(④).", "과학이 없었다면 병원체가 무엇인지도 모른 채 감염병에 맞서야 했을 것이다. 과학의 유용성은 교과서의 표어가 아니라 우리 사회가 실제로 경험한 역사이다.", "과제도 남아 있다. 기후변화와 도시화로 <b>새로운 감염병<\/b>은 앞으로도 나타날 것이고, 병원체는 국경을 가리지 않는다. 그래서 새 병원체의 출현을 조기에 탐지하는 {{㉡}}, 병원체 정보와 백신을 나누는 {{㉢}}, 그리고 데이터를 다루는 능력이 필요하다.", "감염병 대응은 진단·추적·방어의 과학이 함께 쓰이는 일이며, 어느 한 나라의 노력만으로 완결되지 않는다. 역학 조사를 움직인 데이터의 힘은 다음 소단원의 주제인 빅데이터와 인공지능으로 이어진다."], "terms": [{"k": "감시망", "v": "병원·검역소·연구소가 새 병원체의 출현을 조기에 탐지하는 체계."}, {"k": "국제 협력", "v": "병원체 정보와 백신을 나누는 일. 병원체는 국경을 가리지 않기 때문에 필요하다."}, {"k": "과학의 유용성", "v": "병원체 규명 → 진단 → 추적 → 방어의 모든 단계가 과학 원리에 바탕을 둔다는 것. 코로나19 대응이 그 사례이다."}], "myths": [{"x": "감염병 문제는 한 나라의 노력만으로 해결된다.", "o": "병원체는 국경을 가리지 않으므로 <b>국제 협력<\/b>이 필요하다."}, {"x": "감염병 진단은 과학 원리와 무관한 기술이다.", "o": "항원-항체 결합, 유전 물질 증폭 등 <b>과학 원리<\/b>에 바탕을 둔다."}], "point": "병원체(세균·바이러스) → 진단(항원 검사·유전자 증폭 검사) → 추적(역학 조사) → 방어(백신·전파 경로 차단). 감염병 대응의 모든 단계가 과학의 유용성을 보여 준다.", "answers": "정답 ㉠ 진단 ㉡ 감시망 ㉢ 국제 협력 — \"한 나라만으로 완결\"과 \"진단은 과학과 무관\"이 함정 선지이다.", "blanks": {"㉠": "진단", "㉡": "감시망", "㉢": "국제 협력"}, "warning": "\"한 나라만으로 완결\"과 \"진단은 과학과 무관\"이 함정 선지이다.", "figure": {"caption": "코로나19 대응에서 과학이 한 네 가지 일(실험대 위)과 새로운 감염병에 대비한 과제(아래)", "file": "figures/2301-05.svg"}}, {"id": "2302-01", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2302", "lessonName": "로봇", "no": "01", "title": "빅데이터", "subtitle": "방대하고, 빠르고, 다양한 데이터", "steps": [{"n": "①", "t": "데이터의 발생", "d": "검색 기록, 카드 결제, 승하차, 위치 정보, 센서의 관측값처럼 일상의 활동이 데이터로 남는다."}, {"n": "②", "t": "빅데이터", "d": "방대하고(양), 실시간으로 쌓이며(속도), 형태가 다양한(글·사진·위치·영상) 데이터."}, {"n": "③", "t": "패턴의 발견", "d": "데이터 속에 숨은 규칙적인 경향인 {{㉠}}을 읽어 내는 것이 분석의 목표다."}], "howto": [], "body": ["통합과학 1에서 측정 결과가 정보가 된다는 것을 배웠다. 오늘날 이 정보는 검색 기록, 카드 결제, 버스 승하차, 스마트폰의 위치, SNS의 글과 사진, 곳곳의 센서 관측값처럼 매우 큰 규모로 쌓인다(그림 1). 이렇게 <b>방대하고<\/b>(양), <b>실시간으로 쌓이며<\/b>(속도), <b>형태가 다양한<\/b>(글·사진·위치·영상) 데이터를 <b>빅데이터<\/b>라 한다.", "빅데이터에서 중요한 것은 크기 자체가 아니라 <b>패턴<\/b>이다. 한 사람의 승하차 기록만으로는 알 수 있는 것이 적지만, 천만 명의 기록이 모이면 그림 1의 오른쪽 그래프처럼 도시의 출퇴근 흐름이 드러나고, 버스 노선을 어디에 두어야 하는지가 데이터에서 나온다.", "01에서 다룬 존 스노우가 지도 위의 점들에서 감염원인 펌프를 찾아냈듯이, {{㉡}} 분석은 수많은 점 속에서 의미 있는 규칙을 읽어 내는 과학이다. 데이터가 아무리 많아도 패턴을 읽지 못하면 그것은 자료 더미에 지나지 않는다.", "빅데이터의 특징은 양·속도·다양성의 세 가지로 정리한다. 규모가 방대하고, {{㉢}}으로 쌓이며, 글·사진·위치·영상처럼 형태가 다양하다. 이러한 데이터의 축적은 통합과학 1(I-04)에서 배운 <b>디지털 정보<\/b>, 곧 0과 1로 표현되어 모으고 옮기기 쉬운 정보 위에서 가능해진 것이다."], "terms": [{"k": "빅데이터", "v": "기존의 방법으로 다루기 어려울 만큼 방대하고, 다양하며, 실시간으로 쌓이는 데이터."}, {"k": "패턴", "v": "데이터 속에 숨은 규칙적인 경향. 빅데이터 분석의 목표물이다."}, {"k": "디지털 정보", "v": "0과 1로 표현된 정보(통합과학 1, I-04). 디지털로 표현되었기에 대량으로 모으고 옮길 수 있다."}], "myths": [{"x": "빅데이터는 한 가지 형태의 데이터만을 말한다.", "o": "글·사진·위치·영상 등 <b>형태가 다양한<\/b> 데이터다."}, {"x": "빅데이터의 힘은 데이터의 크기에서 나온다.", "o": "크기가 아니라 데이터 속 <b>패턴을 읽어 내는 분석<\/b>에 있다."}], "point": "빅데이터의 세 특징은 방대·실시간·다양이다. 분석의 목표는 데이터의 크기가 아니라 그 속의 패턴을 읽어 내는 것이다.", "answers": "정답 ㉠ 패턴 ㉡ 빅데이터 ㉢ 실시간 — \"한 가지 형태의 데이터\"로 정의한 선지가 단골 오답이다.", "blanks": {"㉠": "패턴", "㉡": "빅데이터", "㉢": "실시간"}, "warning": "\"한 가지 형태의 데이터\"로 정의한 선지가 단골 오답이다.", "figure": {"caption": "하루 동안 남는 데이터의 원천 — 검색·결제·승하차·위치·관측이 데이터 센터에 모이고, 그 속에서 패턴을 읽는다", "file": "figures/2302-01.svg"}}, {"id": "2302-02", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2302", "lessonName": "로봇", "no": "02", "title": "빅데이터의 활용", "subtitle": "수집·분석·예측의 세 단계", "steps": [{"n": "①", "t": "수집", "d": "수많은 차량의 위치·속도, 위성과 관측소의 관측값처럼 데이터를 실시간으로 모은다."}, {"n": "②", "t": "분석", "d": "모인 데이터에서 패턴을 읽는다. 구간별 평균 속도로 정체 지도를 그리는 것이 그 예다."}, {"n": "③", "t": "예측", "d": "과거의 패턴과 현재의 흐름을 합쳐 앞일을 {{㉠}}한다 — 더 빠른 길, 내일의 날씨."}], "howto": ["회색 띠는 도로, 왼쪽 파란 점이 출발, 오른쪽 깃발이 도착이다. 위 도로의 붉은 구간에는 차가 몰려 있고(정체), 아래 도로는 비어 있다.", "정체 구간의 차들이 보내는 위치·속도가 점선 화살표를 따라 서버로 올라간다(① 수집). 서버는 구간별 평균 속도로 정체를 읽고(② 분석), 과거 패턴과 합쳐 10분 뒤 도로를 내다본다(③ 예측).", "초록 화살표가 스마트폰으로 내려와 아래 도로를 \"15분 빠른 경로\"로 안내한다(④ 안내). 안내를 받은 차의 움직임은 다시 ①의 데이터가 된다."], "body": ["빅데이터는 이미 생활 곳곳에서 활용되고 있다. <b>교통<\/b> 분야에서 내비게이션은 수많은 차량의 실시간 위치·속도 데이터로 정체를 예측하여 더 빠른 길을 안내한다(그림 2). <b>기상<\/b> 분야에서는 위성·관측소·선박이 보내는 방대한 관측 데이터가 일기 예보의 재료가 된다. <b>감염병<\/b> 분야에서는 01에서 배운 역학 조사와 확산 예측이 빅데이터를 바탕으로 이루어진다.", "<b>의료<\/b> 분야에서는 수많은 환자의 데이터에서 질병의 위험 요인을 찾아내고, 인공지능이 의료 영상의 의심 부위를 표시하여 의사의 판독을 돕는다. 생활 속에서는 시청 기록이 다음에 볼 영상을 추천하며, 서울시의 <b>심야버스 노선<\/b>은 심야의 통화·이동 데이터를 분석하여 수요가 많은 길을 따라 설계되었다.", "이처럼 소재는 달라도 빅데이터 활용의 절차는 같다. 데이터를 모으고(<b>수집<\/b>), 그 속의 패턴을 읽고(<b>분석<\/b>), 앞일을 내다보는(<b>예측<\/b>) 세 단계다. 데이터가 아무리 많아도 {{㉡}}이 없으면 그것은 의미 없는 자료 더미에 지나지 않는다. 내비게이션에서 안내를 받은 차량의 움직임이 다시 수집 단계의 데이터가 되듯, 수집 → 분석 → 예측 → 안내가 되풀이되는 구조를 데이터의 {{㉢}}이라 하며, 이용자는 데이터를 받는 사람인 동시에 데이터를 제공하는 참여자이기도 하다."], "terms": [{"k": "수집·분석·예측", "v": "빅데이터 활용의 공통 절차. 데이터를 모으고, 패턴을 읽고, 앞일을 내다본다."}, {"k": "심야버스 노선", "v": "서울시가 심야의 통화·이동 데이터를 분석하여 수요가 많은 길로 노선을 설계한 실제 사례."}, {"k": "판독 보조", "v": "인공지능이 의료 영상에서 의심 부위를 표시하여 의사의 판독을 돕는 것. 최종 판단은 의사가 내린다."}], "myths": [{"x": "데이터가 충분히 많으면 분석 과정은 필요 없다.", "o": "패턴을 읽어 내는 <b>분석<\/b>이 활용의 핵심이다."}, {"x": "내비게이션 이용자는 데이터를 받기만 한다.", "o": "이용자의 이동 기록도 <b>다시 수집되는 데이터<\/b>가 된다."}], "point": "어떤 사례가 나와도 수집 → 분석 → 예측의 세 단계로 서술한다. 교통·기상·감염병·의료가 대표 분야이며, 분석이 없으면 데이터는 더미일 뿐이다.", "answers": "정답 ㉠ 예측 ㉡ 분석 ㉢ 순환 — 순서 배열형에서는 수집 → 분석 → 예측 → 안내(활용)의 차례를 묻는다.", "blanks": {"㉠": "예측", "㉡": "분석", "㉢": "순환"}, "warning": "순서 배열형에서는 수집 → 분석 → 예측 → 안내(활용)의 차례를 묻는다.", "figure": {"caption": "내비게이션의 경로 안내 — 차량의 위치·속도가 수집되고, 서버가 정체를 분석·예측하여 더 빠른 길을 안내한다", "file": "figures/2302-02.svg"}}, {"id": "2302-03", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2302", "lessonName": "로봇", "no": "03", "title": "빅데이터의 문제점", "subtitle": "장점과 함께 추론한다", "steps": [{"n": "①", "t": "사생활의 노출", "d": "위치·소비·검색 기록 같은 {{㉠}}가 모이면 한 사람의 하루와 취향까지 재구성될 수 있다."}, {"n": "②", "t": "감시의 우려", "d": "공익을 위한 추적도 선을 넘으면 사생활 침해가 된다. 공익과 사생활의 균형이 필요하다."}, {"n": "③", "t": "편향과 격차", "d": "치우친 데이터는 치우친 결과를 낳고, 기술에 접근하지 못하는 사람은 뒤처진다."}], "howto": ["왼쪽: 걷는 사람의 스마트폰에서 위치·결제·검색 기록이 점선을 따라 흘러 나가 화면 속에서 그 사람의 하루·취향·건강 상태로 재구성된다. 이것이 <b>개인 정보 침해<\/b>다. 위의 카메라는 <b>감시 우려<\/b>를 나타낸다.", "오른쪽 위: 파란 사람들의 데이터만 배운 인공지능이 주황 사람에게 ✗ 판단을 내린다 — <b>데이터 편향<\/b>.", "오른쪽 아래: 인터넷에 연결된 사람과 그렇지 못한 사람 사이의 골 — <b>디지털 격차<\/b>."], "body": ["빅데이터의 활용에는 문제점도 따른다. 첫째, <b>개인 정보의 침해<\/b>다. 위치·소비·검색 기록이 모이면 한 사람의 하루, 취향, 건강 상태까지 재구성될 수 있으므로, 누가 내 데이터를 모으고 어디에 쓰는지가 중요한 문제가 된다. 둘째, <b>감시의 우려<\/b>다. 01의 역학 조사처럼 공익을 위한 추적도 선을 넘으면 사생활 침해가 되므로, 공익과 사생활 사이의 균형이 필요하다.", "셋째, <b>데이터<\/b> {{㉡}}이다. 데이터 자체가 치우쳐 있으면 분석 결과도 치우친다. 특정 집단의 데이터만으로 학습한 시스템은 다른 집단에게 불공정한 판단을 내릴 수 있다. 넷째, {{㉢}}다. 데이터와 기술에 접근할 수 있는 사람과 그렇지 못한 사람 사이의 간격이 새로운 불평등이 된다.", "그러므로 빅데이터 시대의 시민에게는 예측·맞춤 서비스·안전·효율 같은 혜택을 누리는 능력과 문제를 알아채는 눈이 함께 필요하다. 성취기준은 이를 '장점과 문제점의 추론'이라 표현한다. 서술형에서는 장점 한 가지와 문제점 한 가지를 쌍으로 요구하므로, 문제점 네 가지 가운데 두 가지는 반드시 쓸 수 있어야 한다."], "terms": [{"k": "개인 정보 침해", "v": "위치·소비·검색 기록이 모여 개인의 사생활이 드러나는 문제. 데이터 활용에는 본인의 동의가 기본 원칙이다."}, {"k": "데이터 편향", "v": "치우친 데이터로 학습·분석하면 결과도 치우치는 현상. 데이터도 틀릴 수 있다."}, {"k": "디지털 격차", "v": "정보 기술에 대한 접근·활용 능력의 차이가 만드는 불평등."}], "myths": [{"x": "빅데이터 활용에는 아무런 문제점이 없다.", "o": "<b>개인 정보·감시·편향·격차<\/b>의 네 가지 문제점이 있다."}, {"x": "데이터가 많으면 분석 결과는 항상 공정하다.", "o": "치우친 데이터는 <b>치우친 결과<\/b>를 낳는다."}], "point": "빅데이터의 문제점은 개인 정보 침해·감시 우려·데이터 편향·디지털 격차의 네 가지로 정리한다. 장점과 문제점을 쌍으로 추론하는 것이 이 개념의 성취기준이다.", "answers": "정답 ㉠ 개인 정보 ㉡ 편향 ㉢ 디지털 격차 — 장점만 쓰거나 문제점만 쓴 서술형 답안은 절반 점수다.", "blanks": {"㉠": "개인 정보", "㉡": "편향", "㉢": "디지털 격차"}, "warning": "장점만 쓰거나 문제점만 쓴 서술형 답안은 절반 점수다.", "figure": {"caption": "빅데이터의 네 가지 문제점 — 데이터 흔적이 모여 사생활이 재구성되고(개인 정보 침해), 카메라가 지켜보며(감시), 치우친 데이터가 불공정한 판단을 낳고(편향), 기술에 접근하지 못하는 사람이 생긴다(격차)", "file": "figures/2302-03.svg"}}, {"id": "2302-04", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2302", "lessonName": "로봇", "no": "04", "title": "인공지능과 로봇", "subtitle": "데이터에서 규칙을 학습하는 기계", "steps": [{"n": "①", "t": "수많은 데이터", "d": "수만 장의 사진과 각 사진의 정답을 기계에 보여 준다. 빅데이터가 학습 자료가 된다."}, {"n": "②", "t": "규칙의 발견", "d": "기계가 사진 속 특징(패턴)을 스스로 찾아 판단 규칙을 {{㉠}}한다."}, {"n": "③", "t": "새 문제에 적용", "d": "처음 보는 사진도 '고양이'로 판단한다. 번역·판독 보조·자율주행에 쓰인다."}], "howto": [], "body": ["<b>인공지능(AI)<\/b>은 데이터에서 스스로 규칙(패턴)을 학습하는 기술이다. 사람이 규칙을 일일이 코드로 적어 주는 대신, 수만 장의 사진과 그 정답을 보여 주면 기계가 '고양이의 특징'을 스스로 찾아낸다(그림 4). 개념 1~2에서 배운 <b>빅데이터<\/b>가 인공지능의 학습 자료가 되는 것이다.", "그래서 인공지능은 번역, 음성 비서, 의료 영상 판독 보조, 자율주행처럼 <b>규칙을 말로 적기 어려운 일<\/b>에서 힘을 발휘한다. 학습이란 데이터와 정답을 보며 기계가 판단 규칙을 스스로 조정해 가는 과정이며, 학습에 쓰인 데이터가 치우치면(개념 3) 판단도 치우칠 수 있다.", "<b>로봇<\/b>은 인공지능의 판단에 {{㉡}}을 붙인 것이다. 로봇은 재난 현장·심해·우주처럼 사람이 가기 힘든 곳의 위험한 작업을 대신하고, 공장에서 정밀 조립을 하며, 물류 창고에서 물건을 나른다. 수술실에서는 의사의 손 움직임을 더 정밀하게 옮기는 <b>수술 로봇<\/b>이 쓰이지만, 집도의는 여전히 사람이다.", "의료 영상 판독에서도 인공지능은 의심 부위를 표시하여 판독을 보조할 뿐, 최종 판단은 {{㉢}}의 몫이다. 인공지능의 판단과 로봇의 몸이 만나면서 기계는 '시키는 일'을 넘어 '상황을 보고 판단하는 일'로 영역을 넓히고 있다. 그 한계는 개념 5에서 다룬다."], "terms": [{"k": "인공지능(AI)", "v": "데이터에서 스스로 규칙(패턴)을 학습하는 기술. 번역·음성 비서·판독 보조·자율주행에 쓰인다."}, {"k": "학습", "v": "데이터와 정답을 보며 기계가 판단 규칙을 스스로 조정해 가는 과정."}, {"k": "로봇", "v": "인공지능의 판단에 몸을 붙인 것. 위험 작업 대체, 정밀 조립, 수술 보조, 물류 운반에 쓰인다."}], "myths": [{"x": "인공지능은 사람이 모든 규칙을 입력해 둔 것이다.", "o": "데이터에서 <b>스스로 규칙을 학습<\/b>한다."}, {"x": "판독 인공지능이 있으면 의사의 최종 판단은 필요 없다.", "o": "인공지능은 <b>보조<\/b>이며, 최종 판단은 사람이 내린다."}], "point": "인공지능은 데이터에서 스스로 학습하고, 로봇은 그 판단에 몸을 붙인 것이다. 로봇의 사례는 위험 작업 대체·수술 보조·재난 구조로 답한다.", "answers": "정답 ㉠ 학습 ㉡ 몸 ㉢ 의사(사람) — \"사람이 모든 규칙을 입력해 둔 것\"으로 정의한 선지가 단골 오답이다.", "blanks": {"㉠": "학습", "㉡": "몸", "㉢": "의사(사람)"}, "warning": "\"사람이 모든 규칙을 입력해 둔 것\"으로 정의한 선지가 단골 오답이다.", "figure": {"caption": "인공지능의 학습 — 정답이 붙은 사진 더미에서 기계가 특징을 스스로 찾아내고, 처음 보는 사진을 \"고양이\"로 판단한다", "file": "figures/2302-04.svg"}}, {"id": "2302-05", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2302", "lessonName": "로봇", "no": "05", "title": "사물인터넷", "subtitle": "연결된 사물과 기술의 한계", "steps": [{"n": "①", "t": "측정", "d": "사물에 달린 {{㉠}}가 온도·습도·심박 같은 값을 잰다."}, {"n": "②", "t": "판단", "d": "측정값이 인터넷을 통해 데이터로 모이고, 인공지능이 상황을 판단한다."}, {"n": "③", "t": "실행", "d": "판단에 따라 사물이 스스로 작동한다 — 조명을 끄고, 환기하고, 이상을 알린다."}], "howto": [], "body": ["<b>사물인터넷(IoT)<\/b>은 사물들이 인터넷으로 연결되어 스스로 정보를 주고받는 기술이다. 집을 나서면 조명이 꺼지고(<b>스마트홈<\/b>), 비닐하우스가 온도·습도를 스스로 조절하며(<b>스마트팜<\/b>), 손목의 워치가 심박을 재어 이상을 알린다(<b>원격 건강 관리<\/b>). 그림 5처럼 센서가 측정한 값이 데이터로 모이고, 인공지능이 판단하며, 사물이 실행한다. 이 소단원에서 배운 빅데이터·인공지능·로봇의 기술이 한 사슬로 이어진 것이 사물인터넷이다.", "스마트팜은 II단원에서 배운 비생물 요인인 온도·습도·빛을 센서로 재고 자동으로 조절하는 농장이다. 측정의 과학이 농사에 쓰이는 것이다. 그러나 기술의 유용성과 함께 <b>한계와 과제<\/b>를 살펴야 성취기준이 완성된다. 첫째, 연결이 많아질수록 {{㉡}}과 오작동의 통로도 늘어난다. 둘째, 자동화는 일자리의 지형을 바꾼다. 셋째, 인공지능의 판단이 틀렸을 때 {{㉢}}이 개발자·사용자·기계 가운데 누구에게 있는지는 아직 사회가 답을 만들어 가는 문제다.", "기술의 유용성을 누리되 그 한계를 예측하는 태도가 필요하다. 인공지능 판독 보조는 이미 진료 현장에 쓰이고 있지만, 최종 서명은 여전히 의사가 한다. 기술과 책임의 관계를 묻는 이 질문은 다음 소단원인 과학기술과 윤리로 이어진다."], "terms": [{"k": "사물인터넷(IoT)", "v": "센서를 단 사물들이 인터넷으로 연결되어 정보를 주고받고 스스로 작동하는 기술."}, {"k": "스마트팜", "v": "온도·습도·빛을 센서로 재고 자동으로 조절하는 농장. 스마트홈·원격 건강 관리와 함께 사물인터넷의 대표 사례."}, {"k": "책임 소재", "v": "인공지능의 판단이 틀렸을 때 그 책임이 누구에게 있는가의 문제. 사회적 논의가 필요한 열린 과제."}], "myths": [{"x": "기술의 연결이 늘어나도 해킹 위험은 변하지 않는다.", "o": "연결이 많아질수록 해킹·오작동의 <b>통로가 늘어난다<\/b>."}, {"x": "인공지능이 발전했으므로 인간의 판단과 윤리는 필요 없다.", "o": "기술이 커질수록 인간의 판단과 윤리는 <b>더 중요해진다<\/b>."}], "point": "빅데이터 → 인공지능 → 로봇 → 사물인터넷은 한 사슬로 이어진다. 유용성과 함께 해킹·오작동·일자리·책임 소재의 한계까지 예측해야 성취기준이 완성된다.", "answers": "정답 ㉠ 센서 ㉡ 해킹 ㉢ 책임(책임 소재) — \"기술이 발전했으니 인간의 판단은 필요 없다\"는 선지는 항상 오답이다.", "blanks": {"㉠": "센서", "㉡": "해킹", "㉢": "책임(책임 소재)"}, "warning": "\"기술이 발전했으니 인간의 판단은 필요 없다\"는 선지는 항상 오답이다.", "figure": {"caption": "사물인터넷 — 집·비닐하우스·손목시계의 센서가 잰 값이 인터넷으로 모이고, 인공지능의 판단에 따라 사물이 스스로 작동한다", "file": "figures/2302-05.svg"}}, {"id": "2303-01", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2303", "lessonName": "과학기술과 윤리", "no": "01", "title": "과학기술의 양면성", "subtitle": "같은 지식, 다른 쓰임", "steps": [{"n": "①", "t": "하나의 과학 지식", "d": "화학자 하버는 공기 중의 질소로 <b>암모니아<\/b>를 합성하는 방법을 찾아냈다."}, {"n": "②", "t": "두 갈래의 쓰임", "d": "같은 기술이 <b>질소 비료<\/b>가 되어 식량을 늘렸고, 전쟁의 <b>독가스<\/b> 개발에도 쓰였다."}, {"n": "③", "t": "과학기술의 ㉠", "d": "과학기술 자체에는 방향이 없고, 쓰임이 방향을 만든다."}], "howto": [], "body": ["화학자 <b>프리츠 하버<\/b>는 공기 중의 질소로 <b>암모니아<\/b>를 합성하는 방법을 찾아냈고, 이 업적으로 1918년 노벨 화학상을 받았다. 이 기술로 만든 <b>질소 비료<\/b>는 식량 생산을 크게 늘려 수십억 인구를 먹여 살렸다. 그러나 같은 화학 지식은 제1차 세계대전에서 <b>독가스<\/b>를 개발하는 데에도 쓰였다(그림 1).", "다이너마이트를 발명한 노벨이 유산으로 노벨상을 남긴 일도 과학기술의 양면성을 보여 주는 사례다. 이처럼 하나의 과학기술은 이로운 결과와 해로운 결과를 함께 낳을 수 있다. <b>과학기술 자체에는 방향이 없으며, 그것을 어떻게 쓰느냐가 방향을 결정한다.<\/b>", "이 책에서 배운 내용도 마찬가지다. 원자핵의 과학은 전기(II-05)와 무기를 함께 낳았고, 데이터의 과학(III-02)은 감염병 추적과 {{㉡}} 사회의 가능성을 함께 지닌다. 이처럼 같은 지식이 쓰임에 따라 이로움도 해로움도 낳을 수 있는 성질을 과학기술의 <b>양면성<\/b>이라 한다.", "그러므로 과학기술을 배우는 일은 \"할 수 있는가\"를 묻는 데서 끝나지 않는다. 그 기술을 \"{{㉢}}, 어떻게 써야 하는가\"를 함께 묻는 것이 과학의 마지막 과제이며, 이것이 과학기술과 윤리를 함께 다루는 까닭이다."], "terms": [{"k": "과학기술의 양면성", "v": "하나의 과학기술이 쓰임에 따라 이로운 결과와 해로운 결과를 함께 낳을 수 있는 성질. 기술의 방향은 사람의 선택이 정한다."}, {"k": "하버의 암모니아 합성", "v": "공기 중의 질소를 화합물로 바꾼 기술(1918년 노벨 화학상). 질소 비료의 식량 혁명과 독가스 개발이 같은 뿌리에서 나왔다."}, {"k": "노벨상의 기원", "v": "다이너마이트로 부를 쌓은 노벨이 유산으로 만든 상. 과학기술의 양면성에 대한 성찰의 상징이다."}], "myths": [{"x": "암모니아 합성 기술은 비료 생산에만 쓰였다.", "o": "<b>독가스 개발<\/b>에도 쓰였다 — 양면성의 대표 사례다."}, {"x": "해로운 결과를 낳은 기술은 처음부터 나쁜 기술이다.", "o": "기술 자체에는 방향이 없다. 결과는 <b>사람의 선택<\/b>이 가른다."}], "point": "과학기술 자체에는 방향이 없고, 쓰임이 방향을 만든다. 따라서 \"할 수 있는가\"와 함께 \"해도 되는가, 어떻게 써야 하는가\"를 묻는 것이 과학기술 윤리의 출발점이다.", "answers": "정답 ㉠ 양면성 ㉡ 감시 ㉢ 해도 되는가 — \"과학기술은 언제나 이로운 결과만 낳는다\"는 선지가 대표 오답이다.", "blanks": {"㉠": "양면성", "㉡": "감시", "㉢": "해도 되는가"}, "warning": "\"과학기술은 언제나 이로운 결과만 낳는다\"는 선지가 대표 오답이다.", "figure": {"caption": "과학기술의 양면성 — 하버의 암모니아 합성법이 비료와 독가스라는 두 갈래로 쓰였다", "file": "figures/2303-01.svg"}}, {"id": "2303-02", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2303", "lessonName": "과학기술과 윤리", "no": "02", "title": "과학 관련 사회적 쟁점(SSI)", "subtitle": "과학과 가치의 겹침", "steps": [{"n": "①", "t": "과학기술과 관련", "d": "핵발전의 비중, 유전자 편집, 안면 인식처럼 <b>과학기술<\/b>이 얽힌 문제다."}, {"n": "②", "t": "사회적 대립", "d": "사회 구성원 사이에 {{㉠}}이 갈린다. 안전·공정·생명과 이해관계가 얽혀 있기 때문이다."}, {"n": "③", "t": "둘 다 필요", "d": "과학 지식만으로도, 가치 판단만으로도 풀리지 않는다 — <b>함께 논의<\/b>한다."}], "howto": [], "body": ["<b>과학 관련 사회적 쟁점(SSI)<\/b>은 과학기술과 얽혀 있으면서 사회 구성원 사이에 <b>의견이 갈리는 문제<\/b>다. 과학 지식만으로는 답이 나오지 않는다. 가치와 이해관계가 얽혀 있기 때문이다. 그렇다고 가치 판단만으로도 풀리지 않는다. 과학적 사실을 무시하면 근거 없는 논쟁이 되기 때문이다. 과학적 사실과 가치 판단이 <b>모두 필요한 문제<\/b>, 그것이 SSI다(그림 2).", "우리 주변의 SSI로는 에너지 믹스에서 <b>핵발전의 비중<\/b>(II-05), <b>유전자 편집 기술<\/b>의 허용 범위, 인공지능 <b>안면 인식<\/b>과 사생활(III-02), 신약 개발과 <b>동물 실험<\/b>, 개발과 <b>생태계 보전<\/b>(II-02) 등이 있다. 이 책의 거의 모든 단원이 SSI를 하나씩 품고 있다.", "그림 2의 왼쪽 원은 측정과 데이터, 검증된 지식으로 이루어진 <b>과학적 사실<\/b>이고, 오른쪽 원은 안전·공정·생명에 대한 {{㉡}}과 이해관계다. SSI는 두 원이 겹치는 자리에 놓인다. 과학 지식만으로 풀리지 않는 까닭은 ㉡이 얽혀 있기 때문이고, 가치만으로 풀리지 않는 까닭은 {{㉢}}을 무시하면 근거 없는 논쟁이 되기 때문이다.", "그 결정에 영향을 받는 주민·환자·기업·미래 세대까지의 모든 사람을 <b>이해관계자<\/b>라 한다. 과학을 배운 시민은 SSI 논의의 당사자다. 이 논의의 목표는 정해진 정답을 고르는 것이 아니라, 근거를 들고 <b>사회적 합의<\/b>를 만들어 가는 것이다."], "terms": [{"k": "SSI", "v": "Socio-Scientific Issues, 과학 관련 사회적 쟁점. 과학기술과 관련되어 있으면서 사회 구성원 사이에 의견이 갈리는 열린 문제."}, {"k": "이해관계자", "v": "그 결정에 영향을 받는 모든 사람. 주민·환자·기업은 물론 미래 세대까지 포함한다."}, {"k": "가치 판단", "v": "안전·공정·생명 등에 대한 판단과 선호. 측정·데이터로 검증되는 과학적 사실과 구별된다."}], "myths": [{"x": "SSI는 과학 지식만 충분하면 저절로 해결된다.", "o": "<b>가치와 이해관계<\/b>가 얽혀 있어 과학 지식만으로는 풀리지 않는다."}, {"x": "SSI에는 정해진 하나의 정답이 있다.", "o": "정답이 아니라 <b>사회적 합의<\/b>를 만들어 가는 문제다."}], "point": "SSI의 판별 기준은 ① 과학기술과 관련 + ② 사회적 의견 대립이다. 과학 지식만으로도, 가치 판단만으로도 풀리지 않으므로 둘을 함께 놓고 논의한다.", "answers": "정답 ㉠ 의견 ㉡ 가치 판단 ㉢ 과학적 사실 — \"과학 지식만 있으면 SSI는 저절로 해결된다\"가 대표 함정이다.", "blanks": {"㉠": "의견", "㉡": "가치 판단", "㉢": "과학적 사실"}, "warning": "\"과학 지식만 있으면 SSI는 저절로 해결된다\"가 대표 함정이다.", "figure": {"caption": "SSI의 위치 — 과학적 사실과 가치 판단이 겹치는 자리에 놓인 문제들", "file": "figures/2303-02.svg"}}, {"id": "2303-03", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2303", "lessonName": "과학기술과 윤리", "no": "03", "title": "연구 윤리", "subtitle": "정직·존중·보호", "steps": [{"n": "①", "t": "정직", "d": "데이터를 지어내거나(위조) 고치지(변조) 않고 <b>있는 그대로<\/b> 기록·보고한다."}, {"n": "②", "t": "존중", "d": "남의 아이디어와 문장을 출처 없이 가져오는 {{㉠}}을 하지 않고, 기여자의 이름을 기재한다."}, {"n": "③", "t": "보호", "d": "연구 참여자의 <b>자발적 동의<\/b>를 얻고, 동물 실험은 꼭 필요한 경우로 제한한다."}], "howto": [], "body": ["과학은 <b>서로의 연구 결과를 믿을 수 있다<\/b>는 약속 위에 서 있다. 이 약속을 지키기 위한 규범이 <b>연구 윤리<\/b>다. 첫째 기둥은 <b>정직<\/b>이다. 데이터를 지어내거나(위조) 고치는(변조) 것은 아무리 작아도 과학 전체를 흔든다. 잘못된 결과 위에 다른 연구들이 쌓이기 때문이다(그림 3).", "둘째 기둥은 <b>존중<\/b>이다. 남의 아이디어와 문장을 출처 없이 가져오는 <b>표절<\/b>은 연구 윤리 위반이며, 연구에 기여한 사람의 이름을 빼는 것도 위반이다. 셋째 기둥은 <b>보호<\/b>다. 사람을 대상으로 하는 연구는 충분한 설명과 자발적 동의가 원칙이고, 동물 실험은 고통을 최소화하며 꼭 필요한 경우로 제한한다.", "연구 부정행위의 용어를 구별해 둔다. <b>위조<\/b>는 없는 데이터를 지어내는 것, {{㉡}}는 있는 데이터를 고치는 것, <b>표절<\/b>은 남의 것을 출처 없이 가져오는 것이다. 결론에 맞지 않는 데이터를 골라 빼는 것도 ㉡의 일종이다.", "사람을 대상으로 하는 연구에서는 참여자가 연구 내용과 위험을 충분히 설명받고 자발적으로 참여를 결정하는 {{㉢}}가 대원칙이다. 동물 실험은 다른 방법으로 대체하고, 수를 줄이고, 고통을 덜어 주는 방향으로 시행한다. 이 세 기둥은 규칙이기 이전에 과학이 성립하기 위한 조건이다. <b>신뢰가 무너진 과학은 아무것도 예측하지 못한다.<\/b>"], "terms": [{"k": "위조 · 변조 · 표절", "v": "위조는 없는 데이터를 지어내는 것, 변조는 있는 데이터를 고치는 것, 표절은 남의 것을 출처 없이 가져오는 것. 모두 연구 윤리 위반이다."}, {"k": "연구 참여자의 동의", "v": "연구 내용과 위험을 충분히 설명받고 자발적으로 참여를 결정하는 것. 사람을 대상으로 하는 연구의 대원칙이다."}, {"k": "동물 실험의 원칙", "v": "다른 방법으로 대체하고, 실험 동물의 수를 줄이고, 고통을 덜어 주는 방향으로 시행한다."}], "myths": [{"x": "결론에 맞지 않는 데이터는 빼도 된다.", "o": "데이터를 골라 빼는 것도 <b>변조<\/b>에 해당하는 위반이다."}, {"x": "연구 윤리는 연구 결과의 신뢰와는 무관하다.", "o": "연구 윤리가 곧 <b>과학에 대한 신뢰<\/b>의 기초다."}], "point": "연구 윤리의 세 기둥은 정직(위조·변조 금지), 존중(표절 금지, 기여자 기재), 보호(참여자의 동의, 동물 실험 최소화)다. 세 기둥이 과학에 대한 신뢰를 받친다.", "answers": "정답 ㉠ 표절 ㉡ 변조 ㉢ 동의 — 위조(지어냄)와 변조(고침)를 바꿔 놓은 선지에 주의한다.", "blanks": {"㉠": "표절", "㉡": "변조", "㉢": "동의"}, "warning": "위조(지어냄)와 변조(고침)를 바꿔 놓은 선지에 주의한다.", "figure": {"caption": "연구 윤리의 세 기둥 — 정직·존중·보호가 과학에 대한 신뢰를 받친다", "file": "figures/2303-03.svg"}}, {"id": "2303-04", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2303", "lessonName": "과학기술과 윤리", "no": "04", "title": "과학기술 이용의 윤리", "subtitle": "개발자와 사용자의 책임", "steps": [{"n": "①", "t": "개발자의 책임", "d": "기술의 오용 가능성을 미리 내다보고 {{㉠}}를 설계에 넣는다."}, {"n": "②", "t": "사용자의 책임", "d": "기술의 한계를 알고 바르게 쓴다. 딥페이크·개인 정보 무단 수집은 <b>오용<\/b>이다."}, {"n": "③", "t": "힘과 책임", "d": "기술의 힘이 커질수록 <b>만든 자와 쓰는 자의 책임<\/b>도 함께 커진다."}], "howto": [], "body": ["윤리는 연구실 안에서 끝나지 않는다. <b>개발자의 책임<\/b>은 기술이 어떻게 오용될 수 있는지 미리 내다보고 <b>안전장치<\/b>를 설계하는 것이다. 인공지능의 편향을 점검하고(III-02), 해킹에 대비하며, 위험이 큰 기술은 충분히 검증될 때까지 신중하게 접근한다(그림 4).", "<b>사용자의 책임<\/b>도 마찬가지다. 얼굴을 바꿔치기한 <b>딥페이크<\/b>로 가짜 영상을 만들어 퍼뜨리는 것, 남의 개인 정보를 몰래 수집하는 것, 자율주행의 한계를 무시한 운전은 모두 기술 오용에 해당한다. 기술은 같아도 쓰는 사람에 따라 결과가 달라진다. 개념 01의 양면성이 일상의 크기로 나타난 것이다.", "돌이키기 어려운 피해가 예상될 때에는 확실한 증거가 모이기 전이라도 신중하게 접근하는 태도를 {{㉡}}의 자세라 하며, 이것이 개발자 책임의 핵심이다. 사용자 쪽의 대표적인 위반 사례는 인공지능으로 얼굴과 목소리를 합성한 가짜 영상인 {{㉢}}와 개인 정보의 무단 수집이다.", "과학기술의 윤리는 연구자만의 문제가 아니라 <b>개발자와 사용자 모두의 책임<\/b>이다. 기술의 힘이 커질수록, 만든 자와 쓰는 자의 책임도 함께 커진다. 이것이 이용 윤리의 요약이다."], "terms": [{"k": "개발자의 책임", "v": "기술의 오용 가능성을 미리 내다보고 안전장치와 검증을 설계에 넣는 것. AI 편향 점검, 해킹 대비가 그 예다."}, {"k": "사전 예방의 자세", "v": "돌이키기 어려운 위험이 예상되면, 증거가 완전하기 전에도 신중하게 접근하는 태도."}, {"k": "딥페이크", "v": "인공지능으로 얼굴·목소리를 합성한 가짜 영상. 사용자 쪽 기술 오용의 대표 사례다."}], "myths": [{"x": "과학기술의 윤리는 연구자에게만 해당한다.", "o": "<b>개발자와 사용자 모두<\/b>의 책임이다."}, {"x": "위험이 확실히 증명될 때까지는 조치가 필요 없다.", "o": "돌이키기 어려운 위험이면 증거가 완전하기 전에도 신중하게 — <b>사전 예방<\/b>의 자세다."}], "point": "개발자는 오용을 내다보고 안전장치를 설계하며, 사용자는 기술의 한계를 알고 바르게 쓴다. 기술의 힘이 커질수록 만든 자와 쓰는 자의 책임도 함께 커진다.", "answers": "정답 ㉠ 안전장치 ㉡ 사전 예방 ㉢ 딥페이크 — 딥페이크·개인 정보 무단 수집은 '사용자 쪽' 위반 사례로 분류한다.", "blanks": {"㉠": "안전장치", "㉡": "사전 예방", "㉢": "딥페이크"}, "warning": "딥페이크·개인 정보 무단 수집은 '사용자 쪽' 위반 사례로 분류한다.", "figure": {"caption": "이용 윤리의 두 축 — 개발자의 책임과 사용자의 책임", "file": "figures/2303-04.svg"}}, {"id": "2303-05", "unit": "III", "unitName": "과학과 미래 사회", "lessonId": "2303", "lessonName": "과학기술과 윤리", "no": "05", "title": "논증", "subtitle": "주장·근거·반론 고려", "steps": [{"n": "①", "t": "주장", "d": "나는 무엇을 지지하는가를 분명히 밝힌다."}, {"n": "②", "t": "근거", "d": "어떤 <b>과학적 사실·데이터<\/b>가 주장을 받치는가. 사실과 가치 판단을 구별한다."}, {"n": "③", "t": "반대편에 답하기", "d": "반대편의 가장 강한 논리는 무엇이고 나는 어떻게 답하는가 — {{㉠}} 고려."}], "howto": [], "body": ["SSI 앞에서 필요한 마지막 기술은 <b>논증<\/b>이다. 논증은 <b>주장을 근거로 받치고, 반론까지 살펴 답하는 말하기<\/b>다. 논증은 세 칸으로 이루어진다(그림 5). ① <b>주장<\/b>: 나는 무엇을 지지하는가. ② <b>근거<\/b>: 어떤 과학적 사실·데이터가 이를 받치는가. ③ <b>반론 고려<\/b>: 반대편의 가장 강한 논리는 무엇이고, 나는 어떻게 답하는가.", "근거를 들 때의 핵심은 <b>사실과 가치 판단을 구별<\/b>하는 것이다. \"발전 비용이 얼마다\"는 검증할 수 있는 사실이고, \"안전이 비용보다 중요하다\"는 가치 판단이다. 둘을 구별하면 논쟁의 정체가 드러나 싸움이 아니라 논의가 된다.", "유전자 편집 기술을 예로 들면, \"특정 유전자를 자를 수 있다\"는 검증된 {{㉡}}이고, \"치료 목적이라면 허용해야 한다\"와 \"안전이 확실해질 때까지 미뤄야 한다\"는 {{㉢}}이다. 찬성 쪽의 핵심 근거는 환자의 고통 감소이고, 신중론의 핵심 근거는 되돌릴 수 없는 위험이다. 상대의 강한 논리를 요약할 수 있어야 논증이 완성되며, 약한 반론만 상대하는 것은 올바른 논증이 아니다.", "SSI 논의에서 설득력을 갖는 쪽은 목소리가 큰 쪽이 아니라 <b>근거가 튼튼한 쪽<\/b>이다. 측정에서 시작한 통합과학의 여정은 물질·시스템·변화·환경을 지나 <b>질문하고 논증하는 시민<\/b>에 이르러 완성된다. 정확하게 알고, 근거를 들어 묻는 자세가 이 단원의 결론이다."], "terms": [{"k": "논증", "v": "주장을 근거로 받치고, 반론까지 살펴 답하는 말하기. 주장 + 근거 + 반론 고려의 세 칸으로 이루어진다."}, {"k": "사실과 가치", "v": "사실은 검증 가능한 진술(\"~이다\"), 가치는 판단·선호(\"~해야 한다\"). 논증에서 가장 먼저 구별해야 할 것이다."}, {"k": "반론 고려", "v": "반대편의 가장 강한 논리를 살피고 그에 답하는 것. 약한 반론만 상대하는 것은 올바른 논증이 아니다."}], "myths": [{"x": "\"안전이 비용보다 중요하다\"는 과학적 사실이다.", "o": "<b>가치 판단<\/b>이다. 사실은 \"~이다\", 가치는 \"~해야 한다\"로 표현된다."}, {"x": "SSI는 목소리가 크거나 다수인 쪽이 정한다.", "o": "<b>근거가 튼튼한 쪽<\/b>이 설득한다. 기준은 언제나 근거다."}], "point": "논증 = 주장 + 근거 + 반론 고려. 근거를 들 때 사실(\"~이다\")과 가치 판단(\"~해야 한다\")을 구별하고, 반대편의 가장 강한 논리에 답할 때 논증이 완성된다.", "answers": "정답 ㉠ 반론 ㉡ 사실 ㉢ 가치 판단 — 가치 판단 문장을 '과학적 사실'로 바꿔 놓은 선지가 단골 오답이다.", "blanks": {"㉠": "반론", "㉡": "사실", "㉢": "가치 판단"}, "warning": "가치 판단 문장을 '과학적 사실'로 바꿔 놓은 선지가 단골 오답이다.", "figure": {"caption": "논증의 세 칸 — 주장을 근거로 받치고, 반론까지 살펴 답한다. 근거는 사실과 가치 판단을 구별하여 든다", "file": "figures/2303-05.svg"}}]</script>

산소를 얻은 물질이 있으면 잃은 물질이 반드시 있다"}, {"lessonId": "2103", "no": 2, "type": "자료 해석", "stem": "다음은 금속과 금속 이온의 반응에 대한 실험이다.", "source": "무색인 질산 은 수용액에 <b>구리줄<\/b>을 넣었더니, 구리줄 표면에 은백색 물질이 붙고 용액이 점점 <b>푸르게<\/b> 변하였다.", "ask": "이 반응에 대한 설명으로 옳은 것은?", "choices": ["구리는 전자를 얻어 환원된다.", "은 이온은 전자를 잃어 산화된다.", "용액이 푸르게 변한 것은 은 이온 때문이다.", "구리는 산화되고, 은 이온은 환원된다.", "산소가 이동하지 않으므로 산화·환원 반응이 아니다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ② (산소를 얻은 물질이 있으면 잃은 물질이 반드시 있다) 2 ④ 3 산화 철은 산소를 잃으므로 환원되고, 코크스는 그 산소를 얻으므로 산화된다 — 산소가 한쪽에서 다른 쪽으로 옮겨 간 것이다.", "answer": 4, "explain": ""}, {"lessonId": "2103", "no": 3, "type": "서술형", "stem": "철의 제련(산화 철 + 코크스)에서 <b>산화되는 물질<\/b>과 <b>환원되는 물질<\/b>을 각각 밝히고, 그렇게 판단한 까닭을 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 물질 이름만 쓰면 절반이다. <b>산화 철은 산소를 잃어 환원, 코크스(탄소)는 산소를 얻어 산화<\/b>라고 산소의 이동까지 밝혀야 한다.", "answerLine": "정답 1 ② (산소를 얻은 물질이 있으면 잃은 물질이 반드시 있다) 2 ④ 3 산화 철은 산소를 잃으므로 환원되고, 코크스는 그 산소를 얻으므로 산화된다 — 산소가 한쪽에서 다른 쪽으로 옮겨 간 것이다.", "answer": null, "explain": "산화 철은 산소를 잃으므로 환원되고, 코크스는 그 산소를 얻으므로 산화된다 — 산소가 한쪽에서 다른 쪽으로 옮겨 간 것이다."}, {"lessonId": "2104", "no": 1, "type": "오개념", "stem": "산과 염기에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["산의 공통 성질은 수용액 속 H+ 때문이다.", "염기 수용액은 쓴맛이 나고 만지면 미끈거린다.", "산 수용액과 염기 수용액에는 모두 전류가 흐른다.", "BTB 용액은 산성에서 노란색, 염기성에서 파란색을 띤다.", "염기는 금속과 반응하여 수소 기체를 발생시킨다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ⑤ (금속·대리석과 반응하는 것은 산만의 성질) 2 ① (완전 중화점에서 온도 최고, 전체 이온 수는 일정) 3 위산은 산성이므로 염기성인 제산제를 넣으면 H + 과 OH − 가 만나 물이 되는 중화 반응이 일어나 산성이 약해진다.", "answer": 5, "explain": "금속·대리석과 반응하는 것은 산만의 성질"}, {"lessonId": "2104", "no": 2, "type": "자료 해석", "stem": "다음은 중화 반응 실험이다.", "source": "묽은 염산 20 mL에 같은 농도의 수산화 나트륨 수용액을 조금씩 넣었다. 온도는 올라가다가 어느 지점에서 <b>가장 높았고<\/b> 그 뒤로 내려갔으며, 그 지점에서 BTB 용액은 <b>초록색<\/b>이었다.", "ask": "온도가 가장 높았던 지점에 대한 설명으로 옳은 것은?", "choices": ["완전 중화점이며, H+과 OH−가 모두 반응하여 물이 되었다.", "산이 남아 있어 이 지점의 용액은 산성이다.", "염기가 남아 있어 이 지점의 용액은 염기성이다.", "이 지점을 지난 뒤에도 온도는 계속 올라간다.", "이 지점까 "발열 반응과 흡열 반응을 <b>주위의 온도 변화<\/b>를 기준으로 구분하고, 각각을 이용한 생활 속 도구를 하나씩 들어 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 판정 기준을 <b>주위<\/b>의 온도로 쓰는 것이 핵심이다. 반응 자신의 온도라고 쓰면 기준이 틀린 답이다. 사례는 발열 = 손난로·발열 도시락, 흡열 = 순간 냉각 팩.", "answerLine": "정답 1 ① (세포 호흡은 체온을 만드는 발열 반응) 2 ③ (나무판이 언 것은 B가 열을 흡수했기 때문) 3 주위의 온도가 올라가면 발열 반응(손난로), 내려가면 흡열 반응(순간 냉각 팩)이다.", "answer": null, "explain": "주위의 온도가 올라가면 발열 반응(손난로), 내려가면 흡열 반응(순간 냉각 팩)이다."}, {"lessonId": "2201", "no": 1, "type": "오개념", "stem": "생태계의 구성에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["개체군은 한 지역에 사는 <b>같은 종<\/b>의 무리다.", "군집은 여러 종의 개체군이 모인 것이며, 생물만 포함한다.", "생태계는 군집과 비생물적 요인을 합친 것이다.", "버섯은 광합성으로 스스로 양분을 만드는 생산자다.", "세균은 크기가 작아도 살아 있으므로 생물적 요인이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (버섯은 광합성을 못 하는 분해자) 2 ② (양엽은 두껍고, 음엽은 넓고 얇다) 3 환경 → 생물: 물이 부족한 사막에서 선인장의 잎이 가시로 변했다. 생물 → 환경: 남세균의 광합성이 대기에 산소를 늘렸다.", "answer": 4, "explain": "버섯은 광합성을 못 하는 분해자"}, {"lessonId": "2201", "no": 2, "type": "자료 해석", "stem": "다음은 한 그루의 나무에서 딴 잎을 비교한 자료다.", "source": "햇빛을 많이 받는 <b>위쪽 잎 A<\/b>는 좁고 두꺼웠고, 그늘진 <b>아래쪽 잎 B<\/b>는 넓고 얇았다.", "ask": "이 자료에 대한 설명으로 옳은 것은?", "choices": ["A는 음엽, B는 양엽이다.", "빛이라는 비생물적 요인에 적응한 결과이다.", "온도 차이에 적응한 결과이다.", "잎이 환경을 바꾼 '생물 → 환경'의 사례이다.", "자라면서 생긴 차이이므로 적응이라 할 수 없다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (버섯은 광합성을 못 하는 분해자) 2 ② (양엽은 두껍고, 음엽은 넓고 얇다) 3 환경 → 생물: 물이 부족한 사막에서 선인장의 잎이 가시로 변했다. 생물 → 환경: 남세균의 광합성이 대기에 산소를 늘렸다.", "answer": 2, "explain": "양엽은 두껍고, 음엽은 넓고 얇다"}, {"lessonId": "2201", "no": 3, "type": "서술형", "stem": "생물과 환경이 서로 영향을 주고받는다는 것을, <b>환경 → 생물<\/b>과 <b>생물 → 환경<\/b>의 사례를 하나씩 들어 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>화살표의 방향<\/b>이 채점의 전부다. 환경 → 생물은 적응(선인장의 가시, 여우의 귀), 생물 → 환경은 개조(광합성이 만든 산소 대기, 지렁이와 토양)로 방향이 서로 반대여야 한다.", "answerLine": "정답 1 ④ (버섯은 광합성을 못 하는 분해자) 2 ② (양엽은 두껍고, 음엽은 넓고 얇다) 3 환경 → 생물: 물이 부족한 사막에서 선인장의 잎이 가시로 변했다. 생물 → 환경: 남세균의 광합성이 대기에 산소를 늘렸다.", "answer": null, "explain": "환경 → 생물: 물이 부족한 사막에서 선인장의 잎이 가시로 변했다. 생물 → 환경: 남세균의 광합성이 대기에 산소를 늘렸다."}, {"lessonId": "2202", "no": 1, "type": "오개념", "stem": "먹이 관계와 생태 피라미드에 대한 설명으로 <b>옳은<\/b> 것은?", "source": "", "ask": "", "choices": ["먹이 사슬의 화살표는 먹는 생물에서 먹히는 생물로 향한다.", "먹이 그물이 단순할수록 생태계는 안정적이다.", "생태 피라미드가 위로 갈수록 좁아지는 것은 에너지가 손실되기 때문이다.", "각 영양 단계는 받은 에너지를 모두 위 단계로 전달한다.", "생태계 평형은 개체 수가 전혀 변하지 않는 정지 상태다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ 2 ⑤ (한 칸 건너뛴 방향 착오에 주의) 3 1차 소비자가 늘면 먹이인 생산자는 줄고 2차 소비자는 늘어난다. 그러면 1차 소비자가 줄어들고, 생산자가 회복되면서 개체 수가 원래 수준으로 되돌아온다.", "answer": 3, "explain": ""}, {"lessonId": "2202", "no": 2, "type": "자료 해석", "stem": "다음은 어느 국립공원에서 일어난 변화다.", "source": "늑대가 사라진 뒤 <b>엘크<\/b>(초식 동물)가 크게 늘었고, 강가의 버드나무가 거의 사라졌다. 늑대를 다시 들여오자 엘크가 줄고 <b>강가의 식물이 회복<\/b>되었다.", "ask": "이 사례에 대한 설명으로 옳은 것은?", "choices": ["늑대가 늘어나면 강가의 식물은 줄어든다.", "늑대와 강가의 식물은 서로 먹고 먹히는 관계다.", "엘크가 늘어난 것이 늑대가 사라진 원인이다.", "최상위 포식자는 생태계 평형과 관계가 없다.", "늑대 증가 → 엘크 감소 → 강가 식물 회복의 순서로 이어졌다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ 2 ⑤ (한 칸 건너뛴 방향 착오에 주의) 3 1차 소비자가 늘면 먹이인 생산자는 줄고 2차 소비자는 늘어난다. 그러면 1차 소비자가 줄어들고, 생산자가 회복되면서 개체 수가 원래 수준으로 되돌아온다.", "answer": 5, "explain": "한 칸 건너뛴 방향 착오에 주의"}, {"lessonId": "2202", "no": 3, "type": "서술형", "stem": "1차 소비자가 일시적으로 늘어난 뒤 생태계가 평형을 되찾는 과정을, <b>생산자<\/b>와 <b>2차 소비자<\/b>의 변화를 포함하여 순서대로 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>생산자 감소 · 2차 소비자 증가 → 1차 소비자 감소 → 회복<\/b>의 순서가 핵심이다. 1차 소비자가 늘 때 2차 소비자가 <b>줄어든다<\/b>고 쓰면 방향이 뒤집힌 답이다.", "answerLine": "정답 1 ③ 2 ⑤ (한 칸 건너뛴 방향 착오에 주의) 3 1차 소비자가 늘면 먹이인 생산자는 줄고 2차 소비자는 늘어난다. 그러면 1차 소비자가 줄어들고, 생산자가 회복되면서 개체 수가 원래 수준으로 되돌아온다.", "answer": null, "explain": "1차 소비자가 늘면 먹이인 생산자는 줄고 2차 소비자는 늘어난다. 그러면 1차 소비자가 줄어들고, 생산자가 회복되면서 개체 수가 원래 수준으로 되돌아온다."}, {"lessonId": "2203", "no": 1, "type": "오개념", "stem": "온실효과에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["대기가 지구 복사 에너지의 일부를 흡수한다.", "온실 기체는 지표가 내보내는 적외선을 흡수·재방출한다.", "온실효과가 없다면 지구의 평균 기온은 약 −18 ℃가 된다.", "
