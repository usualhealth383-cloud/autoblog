  const prof = p => p ? { id:p.id, email:p.email||'', role:p.role, name:p.name, phone:p.phone||'', studentCode:p.student_code||'', childCodes:(p._children||[]).slice(), childPending:(p._pending||[]).slice(), childCode:(p._children||[])[0]||'', passUntil:p.pass_until||'', nick:p.nick||'', under14:!!p.under14, guardian:p.guardian||'', guardianOk:!!p.guardian_ok, guardianHow:p.guardian_how||'', guardianAt:p.guardian_at||'', created:p.created_at } : null;
  let attCache = null, meCache = null;
  const myProfile = async () => { if (!SESSION) return null; const r = await api(`/rest/v1/profiles?id=eq.${SESSION.user.id}&select=*`);
    if (!r.length){ meCache = null; return null; }
    const links = r[0].role === 'parent' ? await api('/rest/v1/guardian_links?select=code,approved&order=at.asc') : [];
    const kids = links.filter(x => x.approved).map(x => x.code), pend = links.filter(x => !x.approved).map(x => x.code);
    meCache = prof({ ...r[0], email:SESSION.user.email, _children:kids, _pending:pend }); return meCache; };
  return {
    mode: 'server',
    /* 망이 안 될 때(지하철·지하): 이 기기에 남긴 마지막 프로필로 — 학원 학생이 '둘러보는 중'으로 보이던 것(2026-10-01). 로그인이 만료(401)면 쓰지 않는다 */
    me: async () => { if (!SESSION) return null;
      try { const p = await myProfile(); try { p ? localStorage.setItem('pcs.me', JSON.stringify(p)) : localStorage.removeItem('pcs.me'); } catch {} return p; }
      catch (e){ if (meCache) return meCache; if (e && e.status && e.status < 500) return null;
        try { const c = JSON.parse(localStorage.getItem('pcs.me')); if (c && SESSION.user && c.id === SESSION.user.id){ meCache = c; return c; } } catch {} return null; } },
    /* 프로필은 서버 트리거가 가입 정보(data)로 만든다 — 메일 인증을 켜 두어도 역할·보호자 정보가 빠지지 않는다 */
    signUp: async ({ email, password, name, role, phone, under14, guardian }) => {
      const j = await authPost('/auth/v1/signup?redirect_to=' + encodeURIComponent(authRedirect()), { email, password, data:{ name, role, phone:phone||'', under14:!!under14, guardian:guardian||'', terms_ver:TERMS_VER } });
      if (!j.access_token) throw Object.assign(new Error(isNative ? `${email} 로 가입 확인 메일을 보냈습니다. 메일의 링크를 누르면 인증이 끝납니다 — 그다음 이 앱으로 돌아와 로그인해 주세요.` : `${email} 로 가입 확인 메일을 보냈습니다. 메일의 링크를 누르면 바로 로그인됩니다.`), { mailSent:true });
      SESSION = { access_token:j.access_token, refresh_token:j.refresh_token, user:{ id:j.user.id, email:j.user.email } }; saveSession();
      return myProfile();
    },
    signIn: async (email, password) => {
      const j = await authPost('/auth/v1/token?grant_type=password', { email, password });
      SESSION = { access_token:j.access_token, refresh_token:j.refresh_token, user:{ id:j.user.id, email:j.user.email } }; saveSession();
      let p = await myProfile();
      if (!p){ const m = j.user.user_metadata || {};   // 트리거 이전에 만든 옛 계정만 여기로 온다
        await api('/rest/v1/profiles', { method:'POST', prefer:'return=minimal', body:{ id:j.user.id, role: m.role==='parent'?'parent':'student', name:m.name||'' } }); p = await myProfile(); }
      return p;
    },
    signOut: async () => { try { if (SESSION) await authPost('/auth/v1/logout', {}); } catch {} SESSION = null; saveSession(); meCache = null; try { localStorage.removeItem('pcs.me'); } catch {} },
    resetPassword: async email => { await authPost('/auth/v1/recover?redirect_to=' + encodeURIComponent(authRedirect()), { email }); return { ok:true, note: isNative ? '비밀번호 재설정 메일을 보냈습니다. 메일의 링크(웹 페이지)에서 새 비밀번호를 정한 뒤, 이 앱에서 새 비밀번호로 로그인해 주세요.' : '비밀번호 재설정 메일을 보냈습니다. 메일의 링크를 눌러 주세요.' }; },
    setPassword: async pw => { const r = await fetchT(SRV.url + '/auth/v1/user', { method:'PUT', headers:{ apikey:SRV.key, 'Content-Type':'application/json', Authorization:'Bearer '+SESSION.access_token }, body: JSON.stringify({ password: pw }) });
      if (!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.msg || j.message || '비밀번호를 바꾸지 못했습니다.'); } return { ok:true }; },
    /* 메일 링크로 돌아왔을 때(#access_token=…) 세션을 받는다 */
    linkUser: async at => { const r = await fetchT(SRV.url + '/auth/v1/user', { headers:{ apikey:SRV.key, Authorization:'Bearer '+at } }); if (!r.ok) throw new Error('링크가 만료되었습니다. 다시 요청해 주세요.'); return r.json(); },
    adoptSession: async (at, rt, u) => { u = u || await DBX.linkUser(at); SESSION = { access_token:at, refresh_token:rt, user:{ id:u.id, email:u.email } }; saveSession(); meCache = null; return myProfile(); },
    updateMe: async patch => { const b = {}; if ('name' in patch) b.name = patch.name; if ('phone' in patch) b.phone = patch.phone; if ('nick' in patch) b.nick = patch.nick;
      await api(`/rest/v1/profiles?id=eq.${SESSION.user.id}`, { method:'PATCH', prefer:'return=minimal', body:b }); return myProfile(); },
    /* 학원 코드·자녀 연결은 서버 함수 한 곳에서만(틀린 코드 제한 · 한 코드 한 학생 계정) */
    unlinkChild: async code => { await api('/rest/v1/rpc/unlink_child', { method:'POST', body:{ p_code: code } }); meCache = null; },

    deleteAccount: async () => { await api('/rest/v1/rpc/delete_my_account', { method:'POST', body:{} }); SESSION = null; saveSession(); meCache = null; },
    verifyCode: async code => { const rows = await api(`/rest/v1/students?code=eq.${encodeURIComponent(code)}&select=code,name,cls,until`);

      throw new Error('코드 발급에 실패했습니다. 다시 시도해 주세요.');
    },
    removeStudent: async code => { await api(`/rest/v1/students?code=eq.${encodeURIComponent(code)}`, { method:'DELETE' }); },

    guardiansOf: async code => { const r = await api('/rest/v1/rpc/linked_of', { method:'POST', body:{ p_code: code } }); return (r && r.guardians) || []; },
    linkedOf: async code => (await api('/rest/v1/rpc/linked_of', { method:'POST', body:{ p_code: code } })) || { student:0, guardians:[] },
    guardianRequests: async () => (await api('/rest/v1/rpc/guardian_requests', { method:'POST', body:{} })) || [],
    clearReports: async (kind, id) => { await api('/rest/v1/rpc/clear_reports', { method:'POST', body:{ p_kind:kind, p_id:id } }); },
    deleteUser: async email => (await api('/rest/v1/rpc/delete_user', { method:'POST', body:{ p_email:email } })) || { ok:false, why:'지우지 못했습니다.' },
    guardianDecide: async (uid, code, ok) => { await api('/rest/v1/rpc/guardian_decide', { method:'POST', body:{ p_uid:uid, p_code:code, p_ok:!!ok } }); },

    myAttendance: async (code, date) => { const r = await api(`/rest/v1/attendance?code=eq.${encodeURIComponent(code)}&date=eq.${date}&select=*`); return r.length ? att(r[0]) : null; },
    cancelAttend: async (code, date) => { await api(`/rest/v1/attendance?code=eq.${encodeURIComponent(code)}&date=eq.${date}`, { method:'DELETE' }); },

    attendNow: async () => { const w = attWindow(); if (!attCache || attCache.win !== w){ const r = await api('/rest/v1/rpc/current_attend_code', { method:'POST', body:{} }); attCache = { code:r.code, win:w }; } return attCache; },
    notices: async cls => { const [ns, reads] = await Promise.all([api(`/rest/v1/notices?or=(cls.eq.전체,cls.eq.${encodeURIComponent(cls)})&select=*&order=at.desc`), api('/rest/v1/notice_reads?select=notice_id,code')]); return ns.map(n => notice(n, reads)); },
    allNotices: async () => (await api('/rest/v1/notices?select=*&order=at.desc')).map(n => notice(n)),

      if (!rs.length) return null; return { ...rs[0], uid: rs[0].author, likes: rs[0].likes||[],

    progressBrief: async () => (await api('/rest/v1/progress?select=code,days:state->days,wrong:state->wrong,dq:state->dq&code=not.like.u:*')).map(r => ({ code:r.code, days:r.days||[], wrong:r.wrong||[], dq:r.dq||{} })),

    ownerEmail: () => (SESSION && SESSION.user.email) || '',

const POST_COLS = 'id,author,nick,board,title,body,attach,likes,report_n,comment_n,staff,solved,deleted,at,edited,care';

/* ═══ 계정 · 내 진도 ═══ */

function interleave(list){ const g = new Map(); list.forEach(e => { if (!g.has(e.lesson)) g.set(e.lesson, []); g.get(e.lesson).push(e); });

/* ═══ 보호자 동의(만 14세 미만) — 벽이 아니라 조용한 카드. 교재·문제는 그대로 쓰고, 이야기와 서버 저장만 동의 뒤에 열린다 ═══ */
const CONSENT_BASE = () => (isNative || !/^https?:/.test(location.href)) ? WEB_URL : location.origin + location.pathname.replace(/[^/]*$/, '');
function consentCard(where){ if (!consentPending()) return '';
  const reset = ACC.guardianHow === 'reset' && ACC.guardianAt;
  const left = Math.max(0, 7 - Math.max(0, daysBetween(String((reset ? ACC.guardianAt : ACC.created)||todayISO()).slice(0,10), todayISO())));
  if (reset) return `<div class="consent" role="note"><div class="t">보호자 번호를 다시 확인해 주세요</div>
    <div class="d">학원에서 확인해 보니, 적어 둔 번호가 학원에 등록된 보호자 번호와 달랐어요. 보호자 휴대전화 번호를 다시 적고 요청을 보내 주세요.${where==='me'?` ${left}일 안에 동의가 없으면 계정이 지워집니다.`:''}</div>
    <input id="consentPhone" type="tel" inputmode="numeric" autocomplete="off" aria-label="보호자 휴대전화" placeholder="보호자 휴대전화 (010-0000-0000)" value="${esc(tel(String(ACC.guardian||'').replace(/^\S+\s*/, ''))||'')}" style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;background:var(--card);color:var(--ink);margin:8px 0 2px">
    <div class="r"><button class="btn" id="consentSend">고친 번호로 다시 요청 보내기</button>${where!=='today'?`<button class="btn ghost" id="consentPaper">학원에서 서면으로</button>`:''}</div></div>`;
  if (ACC.guardianHow === 'web' && ACC.guardianAt) return `<div class="consent" role="note"><div class="t">보호자가 동의했어요</div>
    <div class="d">학원에서 보호자께 <b>확인 문자</b>를 보내면 이야기와 진도 저장이 열립니다. 교재와 문제는 지금도 그대로 쓸 수 있어요.</div></div>`;
  return `<div class="consent" role="note"><div class="t">보호자 동의를 기다리고 있어요</div>
    <div class="d">만 14세 미만은 보호자가 동의해야 <b>이야기</b>와 <b>진도 저장</b>이 열립니다. 교재와 문제는 지금도 그대로 쓸 수 있어요.${where==='me'?` ${left}일 안에 동의가 없으면 계정이 지워집니다(개인정보 보호법 제22조의2).`:''}</div>
    <div class="r"><button class="btn" id="consentSend">보호자에게 동의 요청 보내기</button>${where!=='today'?`<button class="btn ghost" id="consentPaper">학원에서 서면으로</button>`:''}</div></div>`; }
async function sendConsent(){
  const pin = document.querySelector('.consent #consentPhone');
  let r; try { r = await DBX.consentRequest(pin ? pin.value : undefined); } catch (e){ toast(e.message); return; }
  if (pin && r.ok) ACC = await DBX.me();
  if (!r.ok){ toast(r.why); return; }
  if (r.done){ ACC = await DBX.me(); show(view); toast('이미 동의가 확인되었습니다'); return; }
  if (r.given){ ACC = await DBX.me(); show(view); toast('보호자가 이미 동의했습니다. 학원 확인 문자를 기다려 주세요'); return; }
  const link = `${CONSENT_BASE()}consent.html?t=${r.token}`, ph = tel(String(r.guardian||'').replace(/^\S+\s*/, ''));
  const body = `[${CFG.academy}] ${ACC.name} 학생이 '하루 한 개념' 앱 가입에 보호자 동의를 요청했습니다. 아래 링크에서 내용을 보고 동의해 주세요(7일).\n${link}`;
  openSheet(`<h3>보호자에게 보내기</h3><p>가입할 때 적은 보호자 연락처${ph?` <b>${esc(ph)}</b>`:''}로 문자를 보냅니다. 보호자가 링크에서 동의하고 학원이 보호자께 확인 문자를 보내면 열립니다.</p>
    ${ph ? `<a class="btn" href="sms:${ph}${/iphone|ipad/i.test(navigator.userAgent)?'&':'?'}body=${encodeURIComponent(body)}" style="text-decoration:none">문자 앱으로 보내기</a>` : ''}
    <button class="btn soft" id="consentCopy" data-t="${esc(body)}">링크 복사 · 카카오톡으로 보내기</button><button class="btn ghost" id="sheetClose">닫기</button>`); }

/* 가입 단계: 지금 화면의 입력을 SU 에 담고, 넘어가기 전에 확인한다 */
function suKeep(){ const g = id => document.getElementById(id);
  [['suEmail','email'],['suPw','pw'],['suName','name'],['suPhone','phone'],['suGName','gName'],['suGPhone','gPhone'],['suCode','code'],['suChild','child']].forEach(([id,k]) => { if (g(id)) SU[k] = g(id).value; });
  const age = document.querySelector('input[name=suAge]:checked'); if (age) SU.age = age.value;
  if (g('agTerms')) SU.terms = g('agTerms').checked; if (g('agPrivacy')) SU.privacy = g('agPrivacy').checked; }
function suCheck(final){ const st = SU.step, phoneOk = t => String(t||'').replace(/[^0-9]/g,'').length >= 9;
  if (st >= 2 || final){ if (SU.role==='student' && !SU.age && (st===2 || final)) return '나이를 골라 주세요.'; if ((st===2 || final) && !(SU.terms && SU.privacy)) return '필수 약관에 동의해 주세요.'; }
  if (st === 3 || final){ if (!validEmail(SU.email.trim())) return '이메일 형식을 확인해 주세요.'; if (pwProblem(SU.pw)) return pwProblem(SU.pw); }
  if (st === 4 || final){ if (!SU.name.trim()) return SU.role==='parent' ? '보호자 성함을 적어 주세요.' : '이름을 적어 주세요.';
    if (SU.phone.trim() && !phoneOk(SU.phone)) return '연락처를 확인해 주세요.';
    if (SU.role==='student' && SU.age==='u14' && (!SU.gName.trim() || !phoneOk(SU.gPhone))) return '만 14세 미만은 보호자 성함과 휴대전화가 필요합니다.'; }
  return ''; }

/* ═══ 오늘(학생·게스트 홈) ═══ */
let unreadNotice = null, myAtt = null;
/* 날마다 다른 한 마디 — 기준일(2026-01-01)부터 센 날 수를 글귀 수로 나눈 나머지로 고른다(한국 날짜).
   글귀가 365개보다 많으므로 어느 1년을 잘라 봐도 같은 말이 두 번 나오지 않고, 해마다 조금씩 다른 글귀가 섞인다.
   '다른 한 마디'를 누르면 그날만 하나씩 넘어간다(다음 날이면 다시 그날의 글귀) */
const dayNo = iso => { const [y, m, d] = iso.split('-').map(Number); return Math.round((Date.UTC(y, m-1, d) - Date.UTC(2026, 0, 1)) / 864e5); };
function quoteToday(){
  const t = todayISO(); if (S.qskipDay !== t){ S.qskipDay = t; S.qskip = 0; }
  const n = QUOTES.length; return QUOTES[(((dayNo(t) + (S.qskip||0)) % n) + n) % n];
}
function quoteCard(q, c){
  const kept = (S.qkeep||[]).includes(q.id);
  const br = c ? BRIDGE[`${c.book}-${c.unit}`] : '';
  return `<div class="qsay">
      <span class="k">오늘의 한 마디${q.kindName ? ` · ${esc(q.kindName)}` : ''}</span>
      <blockquote>“${esc(q.ko)}”</blockquote>
      ${q.orig ? `<p class="orig">${/^[a-z]/.test(q.orig) ? '…' : ''}${esc(q.orig)}</p>` : ''}
      <div class="by"><span class="who">${esc(q.who||'')}</span>${q.role?`<span class="role">${esc(q.role)}</span>`:''}</div>
      ${q.src ? `<div class="src">출처 · ${esc(q.src)}</div>` : ''}
      ${q.note ? `<div class="note">${esc(q.note)}</div>` : ''}
      <div class="acts">
        <button id="qNext"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>다른 한 마디</button>
        <button id="qKeep" class="${kept?'on':''}"><svg viewBox="0 0 24 24"><path d="M12 20.5 4.5 13a4.6 4.6 0 0 1 6.5-6.5l1 1 1-1A4.6 4.6 0 0 1 19.5 13z"/></svg>${kept?'보관함에 있음':'보관하기'}</button>
      </div>
    </div>
    ${br ? `<div class="qbridge"><b>과학으로 잇기</b>${esc(br)}</div>` : ''}`;
}
function openQuoteKeep(){
  const keep = QUOTES.filter(q => (S.qkeep||[]).includes(q.id));
  openSheet(`<h3>보관한 한 마디 <span style="font-size:12px;color:var(--muted);font-weight:600">${keep.length}개</span></h3>
    ${keep.length ? `<div class="qlist">${keep.map(q=>`<div class="row"><blockquote>“${esc(q.ko)}”</blockquote>
        <div class="m"><span>${esc(q.who||'')}${q.src?` · ${esc(q.src)}`:''}</span><button data-qdel="${q.id}">빼기</button></div></div>`).join('')}</div>`
      : `<p class="fine" style="text-align:left;padding:6px 0 14px">아직 보관한 글귀가 없습니다. 오늘 화면 아래 <b>오늘의 한 마디</b>에서 마음에 드는 글을 보관해 두세요.</p>`}
    <button class="btn ghost" id="sheetClose">닫기</button>`);
}

/* 오늘 화면 '오늘의 복습' — 기한 된 것도, 배운 소단원도 없으면 숨긴다. 오늘 세트를 마쳤으면 한 줄만 */
function reviewCard(){
  const cur = revCur();
  if (cur) return `<button class="revcard" id="revStart" aria-label="오늘의 복습 이어서 풀기, ${cur.items.length}문제 가운데 ${cur.i}문제 풀었습니다">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></span>
      <span class="tx"><b>오늘의 복습 <em>${cur.items.length}</em></b><span>이어서 풀기 · ${cur.i} / ${cur.items.length}</span></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>`;
  const plan = reviewPlan(false), n = plan.items.length;
  if (!n){ const rv = rvToday(); return rv.s ? `<div class="revcard done" role="status"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span><span class="tx"><b>오늘의 복습을 마쳤습니다</b><span>${esc(nextDueText())}</span></span></div>` : ''; }
  const dn = plan.items.filter(e => e.w).length, xn = n - dn;
  return `<button class="revcard" id="revStart" aria-label="오늘의 복습 ${n}문제 시작${dn ? ` — 다시 볼 문제 ${dn}` : ''}${xn ? ` · 지난 소단원 ${xn}` : ''}">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></span>
      <span class="tx"><b>오늘의 복습 <em>${n}</em></b><span>${[dn ? `다시 볼 문제 ${dn}` : '', xn ? `지난 소단원 ${xn}` : ''].filter(Boolean).join(' · ')}</span></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>`; }
async function renderToday(){
  const c = todayConcept(); setUnit(c.unit);
  const d = new Date(todayISO()+'T00:00:00'), wd = ['일','월','화','수','목','금','토'][d.getDay()];   // 한국 날짜 기준(주간 띠와 같게)
  unreadNotice = null; myAtt = null;
  if (S.auth){ try { const ns = await DBX.notices(S.auth.cls); unreadNotice = ns.find(n => !n.read.includes(S.auth.code)) || null; myAtt = await DBX.myAttendance(S.auth.code, todayISO()); } catch {}
    try { acadEvents = (await DBX.schedule(S.auth.cls)).map(e => ({ ...e, acad:true })); } catch {} }
  const trialLeft = fullAccess() ? null : Math.max(0, FREE_DAYS - Math.min(FREE_DAYS, daysBetween(S.start, todayISO())));
  document.getElementById('v-today').innerHTML = `
    <div class="top">
      <span class="hello">${ACC ? `${esc(ACC.name)}${ACC.role==='student'?' 학생':''}, 안녕하세요` : '안녕하세요'}<small>${d.getMonth()+1}월 ${d.getDate()}일 ${wd}요일</small></span>
      ${S.auth
        ? (myAtt ? `<span class="pill"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg> ${myAtt.time} 출석${myAtt.late?' · 지각':''}</span>`
                 : `<button class="pill att-pill todo" id="attOpen"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12h8M12 8v8"/></svg> 출석 체크</button>`)
        : (hasPass() ? `<span class="pill">이용권 ~${kdate(ACC.passUntil)}</span>` : trialLeft === null ? '' : `<button class="pill warn" id="goPlansPill">체험 ${trialLeft}일 남음</button>`)}
    </div>
    ${consentCard('today')}
    ${unreadNotice ? `<div class="notice"><div class="ic">!</div><div class="b"><div class="t">${esc(unreadNotice.t)}</div><div class="d">${esc(unreadNotice.d)} · ${esc(unreadNotice.cls)}</div></div><button id="okNotice" data-id="${unreadNotice.id}">확인</button></div>` : ''}
    ${rhythm(S.days, 'home')}
    ${(() => { const iso = todayISO();
        const todayList = [...fixedOn(iso), ...myEvents().filter(e => e.date === iso)];
        const nextDday = (S.sched.ddays||[]).filter(d => dLeft(d.date) >= 0).sort((a,b)=>a.date<b.date?-1:1)[0];
        if (!todayList.length && !nextDday) return '';
        return `<button class="todaysched" id="goPlan">
          <span class="l">${todayList.length ? todayList.map(x => esc(x.title) + (x.from ? ` <i>${esc(x.from)}</i>` : '')).join(' · ') : '오늘 등록된 일정 없음'}</span>
          ${nextDday ? `<span class="dd">${esc(nextDday.title)} ${ddayText(dLeft(nextDday.date))}</span>` : ''}</button>`; })()}
    ${conceptCard(c)}
    <button class="btn" id="goQuiz">오늘의 문제 풀기</button>
    ${reviewCard()}
    <button class="prog" id="goStatsRing">
      <svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="21" fill="none" stroke="var(--line)" stroke-width="5"/>
        <circle cx="26" cy="26" r="21" fill="none" stroke="var(--u)" stroke-width="5" stroke-linecap="round" stroke-dasharray="131.9" stroke-dashoffset="${(131.9*(1-Math.min(1,S.done.length/CONCEPTS.length))).toFixed(1)}" transform="rotate(-90 26 26)"/></svg>
      <div><div class="lab">전체 진도</div><div class="val">${S.done.length}<small> / ${CONCEPTS.length}개념</small></div></div>
      <div class="r"><div class="lab">정답률</div><div class="val">${S.stats.a?Math.round(S.stats.c/S.stats.a*100):0}<small>%</small></div></div>
    </button>
    ${noteCard()}
    ${quoteCard(quoteToday(), c)}
    <p class="fine">빈칸을 누르면 답이 보입니다 · ${esc(c.bookName||'')} · ${dayIndex()+1} / ${CONCEPTS.length}번째 개념</p>`;
}

/* ═══ 문제 (오늘 · 다시 보기 · 복습) ═══ */
let qState = null;
function renderQuiz(){
  const c = todayConcept();
  if (!qState) qState = { q: quizFor(c), pick:null, retry:null, mode:'today' };   // 기한 된 복습은 오늘 화면의 '오늘의 복습'에서 푼다
  const {q, pick, retry, mode} = qState; const graded = pick !== null;
  const label = mode==='review' ? '복습 문제' : (retry ? '다시 볼 문제' : '오늘의 문제');
  document.getElementById('v-quiz').innerHTML = `
    <button class="back" id="backToday"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>${mode==='review'?'통계':'오늘 개념'}</button>
    <h1 class="sr">${mode==='review'?'복습 문제':'오늘의 문제'}</h1>
    <div class="qhead"><span class="l">${label}${mode==='review'?` · ${esc(qState.lessonName||'')}`:''}</span>
      <span class="tag">${retry ? `${kdate(retry.iso)}에 틀림` : (graded && pick!==q.answer ? '다시 볼 문제' : (q.type||'확인'))}</span></div>
    ${retry ? `<p class="again">↻ 전에 갈렸던 문제입니다. 이번엔 어디서 갈리는지 보세요.</p>` : ''}
    <p class="stem">${rich(q.stem)}</p>
    ${q.source ? `<div class="bogi">${rich(q.source)}</div>`:''}
    ${q.ask ? `<p class="ask">${rich(q.ask)}</p>`:''}
    ${q.essay ? `
      <textarea class="essay" placeholder="문장으로 답을 써 보세요"></textarea>
      ${graded ? `<div class="verdict"><div class="h">이렇게 쓰면 됩니다</div><p>${rich(q.gradeNote || q.answerLine)}</p></div>` : ''}
      <button class="btn" id="grade">${graded ? (mode==='review'?'다음 복습 문제':'오늘 개념으로 돌아가기') : '답 확인하기'}</button>
    ` : `
      ${graded ? '' : confRow(qState.conf)}
      <div class="opts">${q.choices.map((t,i)=>{ const n=i+1; let cls='', mk=''; if (graded){ if (n===q.answer){cls='ok';mk='정답';} else if (n===pick){cls='bad';mk='내 답';} }
        return `<button class="opt ${cls}" data-p="${n}" ${graded?'disabled':''}><span class="m">${MARKS[i]}</span><span class="tx">${rich(t)}</span>${mk?`<span class="mk">${mk}</span>`:''}</button>`; }).join('')}</div>
      ${graded ? `
        <div class="verdict" tabindex="-1" role="status"><div class="h">${pick===q.answer ? '맞혔습니다' : `아쉬워요 · 정답은 ${MARKS[q.answer-1]}`}</div>
          ${confNote(qState.conf, pick===q.answer)}${q.explain ? `<p>${rich(q.explain)}</p>` : conceptGo(q)}</div>
        ${srsLine(qState.srs) ? `<div class="again">${srsLine(qState.srs)}</div>` : ''}
        <button class="btn" id="grade">${mode==='review' ? '다음 복습 문제' : (retry ? '오늘의 문제로' : '오늘 개념으로 돌아가기')}</button>
        <button class="flag" data-report="quiz:${esc(q.lessonId)}#${q.no}">문제·해설에 틀린 곳이 있나요?</button>
      ` : `<p class="qhint">고르면 바로 채점하고, 왜 갈렸는지 알려 드립니다.<br>틀려도 괜찮습니다 — 오답은 <b>내일</b> 다시 나오고, 맞힐수록 간격이 늘어납니다.</p>`}
    `}`;
}
function startReview(){
  const pool = QUIZZES.filter(q => !q.essay && CONCEPTS.some((c,i) => c.lessonId===q.lessonId && isOpen(i)));
  if (!pool.length){ toast('풀 수 있는 문제가 아직 없습니다'); return; }
  const q = pool[Math.floor(Math.random()*pool.length)]; const c = CONCEPTS.find(x=>x.lessonId===q.lessonId);
  qState = { q, pick:null, retry:null, mode:'review', lessonName:c?c.lessonName:'' }; show('quiz');
}
function gradePick(pick){
  const {q, retry, mode} = qState; qState.pick = pick; touchDay();
  S.stats.a++; if (pick===q.answer) S.stats.c++; statDay(pick===q.answer);
  if (mode==='today'){ const c = todayConcept(); if (!S.done.includes(c.id)) S.done.push(c.id); }
  qState.srs = srsMark({ l:q.lessonId, n:q.no }, pick===q.answer, pick, qState.conf);   // 오늘의 문제·다시 풀기·복습 모두 같은 상자 규칙
  save(S); renderQuiz(); document.querySelector('#v-quiz .verdict')?.focus({ preventScroll:true });   // 채점 결과를 화면낭독기가 읽게
}

/* ═══ 교재 목록 (검색 · 필터 · 북마크) ═══ */
let listQ = '', listF = '전체';
function renderList(){
  const idx = dayIndex(), q = listQ.trim().toLowerCase();
  const hit = c => !q || [c.title, c.subtitle, c.lessonName, c.unitName, ...c.terms.map(t=>t.k)].some(t => (t||'').toLowerCase().includes(q));
  const pass = (c,i) => listF==='전체' ? true : listF==='공부함' ? S.done.includes(c.id) : listF==='북마크' ? S.bm.includes(c.id) : listF==='안 함' ? !S.done.includes(c.id) && isOpen(i) : true;
  let html = `<h1 class="h-page">교재</h1>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="listQ" aria-label="개념·용어 검색" placeholder="개념·용어 검색 (예: 효소, 운동량)" value="${esc(listQ)}"></div>
    <div class="chipbar">${['전체','안 함','공부함','북마크'].map(f=>`<button data-lf="${f}" class="${listF===f?'on':''}">${f}</button>`).join('')}</div>
    <p class="fine" style="text-align:left;padding:0 0 8px">${fullAccess() ? '전 범위가 열려 있습니다.' : `최근 ${FREE_DAYS}일치가 열려 있습니다. 학원 코드를 등록하거나 이용권을 등록하면 전 범위가 열립니다.`}</p>`;
  let unit='', book='', n=0;
  CONCEPTS.forEach((c,i)=>{
    if (!hit(c) || !pass(c,i)) return; n++;
    if (c.book!==book){ book=c.book; unit=''; html += `<div class="book-h">${esc(c.bookName||'')}</div>`; }
    if (c.unit!==unit){ unit=c.unit; html += `<div class="unit-h" data-u="${c.unit}"><span class="no">${c.unit}</span><span class="nm">${esc(c.unitName)}</span><span class="ln"></span></div>`; }
    const open = isOpen(i), done = S.done.includes(c.id), bm = S.bm.includes(c.id);
    html += `<button class="row ${open?'':'locked'}" data-i="${i}">
      <span class="n">${c.lessonId.slice(2)}-${c.no}</span>
      <span class="b"><span class="t">${esc(c.title)}</span><span class="s">${esc(c.lessonName)}${i===idx?' · 오늘':''}</span></span>
      <span class="st">${bm?`<svg class="bm" viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg>`:''}${open
        ? (done ? `<svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg>` : `<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>`)
        : `<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>`}</span></button>`;
  });
  if (!n) html += `<div class="empty"><p>맞는 개념이 없습니다.</p></div>`;
  document.getElementById('v-list').innerHTML = html;
}

/* 빈칸 채점 — 칸마다 정확히 맞아야 한다(예전엔 '16'이 정답 '6'을 품어 맞다고 했다). 괄호는 있어도 없어도: '(태양계) 성운'·'s(초)'.
   한 글자 답은 온전한 말도 인정(고 → 고생대). 빈칸이 여럿이면 쉼표로 순서대로(순서가 뜻을 가르는 문제가 있다: 이온, 공유) */
const bnorm = t => String(t||'').replace(/\s+/g,'').replace(/[。．]$|\.$/,'').toLowerCase();
function bvariants(a){ const v = new Set([bnorm(a), bnorm(a).replace(/[()]/g,'')]);
  const pre = String(a).match(/^\((.+?)\)\s*(.+)$/); if (pre){ v.add(bnorm(pre[2])); v.add(bnorm(pre[1] + pre[2])); }
  const post = String(a).match(/^(.+?)\s*\((.+?)\)$/); if (post){ v.add(bnorm(post[1])); v.add(bnorm(post[2])); v.add(bnorm(post[1] + post[2])); }
  return v; }
const bpart = (a, p) => !!p && (bvariants(a).has(p) || (bnorm(a).length === 1 && p.startsWith(bnorm(a)) && p.length <= 4));
function blankCorrect(answer, pick){
  const parts = String(answer||'').split(/\s*,\s*/).filter(Boolean); if (!parts.length) return false;
  if (parts.length === 1) return bpart(parts[0], bnorm(pick));
  let ins = String(pick||'').split(/[,/、]/).map(x => x.trim()).filter(Boolean);
  if (ins.length !== parts.length){ const sp = String(pick||'').trim().split(/\s+/); if (sp.length === parts.length) ins = sp; else return false; }
  return parts.every((a, i) => bpart(a, bnorm(ins[i]))); }
function bankCorrect(q, pick){
  if (q.type==='ox') return pick===q.answer;
  if (q.type==='mc' || q.type==='multi') return +pick===q.answer;
  if (q.type==='blank') return blankCorrect(q.answer, pick);
  return pick==='맞음';
}

  let sc=1, tx=0, ty=0; const apply = () => { sv.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };

    else if (p.length>=2){ const d = Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]); if (st._d){ sc = Math.min(6, Math.max(1, sc * d / st._d)); } st._d = d; }

    const f = (l.includes('\t') ? l.split('\t') : l.split(/\s*,\s*/)).map(x => x.trim());

    else if (/^(이름|성명|학생)$/.test(name)){ r.err = '제목 줄 — 뺍니다'; r.skip = true; }

    const a = att.filter(x => x.code === s.code).length;

    : `<button class="todo-act" data-stu="${esc(r.s.code)}">학생 보기</button>`;

/* 월 출석부 — 학생 × 날짜 표를 CSV(엑셀에서 한글이 깨지지 않게 BOM) 로. 앱에서는 공유 시트로 넘긴다 */
/* 파일 내려받기 — 웹은 바로 저장, 안드로이드 앱은 '공유' 창으로(드라이브·파일·메일에 저장).
   앱(WebView)에는 Web Share 도, <a download> 도 없어서 예전엔 눌러도 아무 일이 없었다(2026-10-02) → 앱 캐시에 써서 공유 창에 넘긴다. */
async function saveFile(name, text, type){
  if (isNative){
    const FS = plug('Filesystem'), SH = plug('Share');
    if (!FS || !SH){ toast('이 판의 앱에서는 파일을 저장할 수 없습니다. 앱을 업데이트하거나 웹(브라우저)에서 내려받아 주세요'); return false; }
    try {
      const safe = name.replace(/[\\/:*?"<>|]/g, '_');
      const w = await FS.writeFile({ path:safe, data:text, directory:'CACHE', encoding:'utf8' });
      await SH.share({ title:safe, files:[w.uri], dialogTitle:'저장하거나 보낼 곳을 고르세요' });
      return true;
    } catch (e){ if (!/cancel/i.test(String(e && (e.message || e)))) toast('파일을 만들지 못했습니다: ' + (e.message || e)); return false; }
  }
  const file = new File([text], name, { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  return true;
}
async function downloadAttendance(ym){
  const [y, m] = ym.split('-').map(Number), n = new Date(y, m, 0).getDate();
  let st = [], att = []; try { st = await DBX.students(); att = await DBX.attendanceRange(`${ym}-01`, monthEnd(ym)); } catch (err){ toast(err.message); return; }
  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : String(v);
  const head = ['반','이름','코드', ...Array.from({length:n}, (_,i)=>`${m}/${i+1}`), '출석','지각'];
  const rows = st.slice().sort((a,b)=>(a.cls+a.name).localeCompare(b.cls+b.name)).map(s => { const mine = att.filter(a=>a.code===s.code);
    return [s.cls, s.name, s.code, ...Array.from({length:n}, (_,i) => { const a = mine.find(x=>x.date===`${ym}-${pad(i+1)}`); return a ? (a.late ? `지각 ${a.time}` : `출석 ${a.time}`) : ''; }), mine.length, mine.filter(a=>a.late).length]; });
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n');
  const name = `${CFG.academy}_출석부_${y}-${pad(m)}.csv`;
  if (await saveFile(name, csv, 'text/csv') && !isNative) toast(`${name} 을(를) 내려받았습니다`);
}

<h4>2. 처리하는 개인정보의 항목</h4>
<p>① 회원가입 시(필수): 이메일, 비밀번호(암호화 저장), 이름, 역할(학생/보호자/교사) / (선택): 연락처<br>② 만 14세 미만 아동: 법정대리인의 성명·연락처(동의 확인용)<br>③ 학원 수강생: 학원 코드, 반, 수강 기간, 출석 일시, 공지 확인 여부<br>④ 보호자: 연결한 자녀의 학원 코드<br>⑤ 커뮤니티('이야기') 이용 시: 닉네임, 작성한 글·댓글의 내용과 작성 일시, 도움됨·채택 기록, 신고한 내역과 신고받은 내역, 차단한 이용자 목록. 글·댓글에 자해·자살 신호로 보이는 말이 있는지 자동으로 확인한 결과(학원이 먼저 살펴보고 필요하면 연락하기 위한 목적)<br>⑥ 일정 기능 이용 시: 이용자가 직접 넣은 시간표(수업 이름·장소·요일·시각), 일정, D-day. 학원이 반에 보낸 일정<br>⑦ 공부 노트 기능 이용 시: 이용자가 직접 쓴 노트(날짜, 제목, 내용, 노트에 붙인 개념). 노트는 작성자 본인만 볼 수 있으며 학원(원장)과 보호자에게도 제공하지 않습니다<br>⑧ 서비스 이용 중 자동 생성: 학습 기록(공부한 개념, 문제 풀이 결과와 최근 28일의 날짜별 푼 수·맞힌 수, 답하기 전에 고른 확신 정도(선택), 오답, 북마크, 학습 일자), 이용권 만료일, 알림 설정<br>⑨ 이용권을 앱 마켓에서 구매한 경우: 상품, 주문번호, 결제 확인 토큰, 결제·반영 일시(카드번호 등 결제 수단 정보는 마켓이 처리하며 회사는 받지 않습니다)<br>⑩ 푸시 알림을 켠 경우: 알림을 받을 기기의 알림 토큰<br>⑪ 앱 오류가 났을 때 자동으로: 오류 내용, 앱 버전, 화면 이름, 기기·브라우저 종류(오류 진단용)<br>⑪의2 학원 코드·출석 코드·이용권 코드를 틀리게 입력한 경우 자동으로: 입력 시각과 접속 IP 주소(남의 코드를 추측해 넣는 부정 이용을 막기 위한 목적 · 위치 파악에는 쓰지 않음)<br>⑪의3 ‘의견 보내기·오류 신고’를 이용한 경우: 보낸 내용과 종류, 관련 개념·문제, 앱 버전과 보낸 화면, 보낸 시각(학원만 읽으며, 교재·앱을 고치고 답하는 데만 씀)<br>⑫ 회사는 주민등록번호, 위치 정보, 사진, 연락처 목록을 수집하지 않습니다.</p>
<h4>3. 개인정보의 처리 및 보유 기간</h4>
<p>① 회원 정보와 학습 기록(진도·오답·보관한 글귀·일정·시간표·공부 노트 포함): 회원 탈퇴 시 즉시 파기. 공부 노트는 이용자가 지우면 그때 바로 파기<br>② 커뮤니티 게시물·댓글: 회원 탈퇴 시 삭제하거나 작성자를 알 수 없도록 처리. 다만 다른 이용자의 답변이 달린 질문은 학습 자료로서의 맥락을 위해 작성자 정보를 지운 뒤 남길 수 있습니다<br>③ 신고 접수·처리 기록과 원장이 지운 글·댓글: 반복 위반 확인과 분쟁 대응을 위해 지운 뒤 <b>6개월</b>간 보관 후 파기(신고된 글이 지워지지 않으면 그 글이 남아 있는 동안 신고 수만 보관)<br>④ 출석 기록·수강생 정보: 학원 운영과 수강료 정산의 근거로 수강 종료 후 1년까지 보관 후 파기(학원의 설립·운영 및 과외교습에 관한 법률에 따른 장부 관리)<br>⑤ 이용권 구매·개통 기록(마켓 결제 기록 포함): 「전자상거래 등에서의 소비자보호에 관한 법률」에 따라 5년<br>⑥ 소비자 불만·분쟁 처리 기록: 같은 법에 따라 3년<br>⑦ 서비스 접속 기록(서버 로그): 「통신비밀보호법」에 따라 3개월<br>⑧ 앱 오류 기록: 수집 후 90일이 지나면 파기<br>⑨ 푸시 알림 토큰: 로그아웃·회원 탈퇴 시 즉시 삭제, 앱을 지운 기기의 토큰은 알림 전송이 실패하는 즉시 삭제<br>⑩ 코드 입력 기록(입력 시각·접속 IP 주소): 수집 후 하루가 지나면 매일 새벽 자동 파기<br>⑪ 의견·오류 신고: 보낸 날부터 1년이 지나면 자동 파기(회원 탈퇴 시 즉시 파기)</p>
<h4>3의2. 커뮤니티에서 다른 이용자에게 보이는 정보</h4>
<p>커뮤니티에 글이나 댓글을 올리면 <b>닉네임과 작성한 내용, 작성 시각</b>이 서비스에 가입한 다른 이용자에게 보입니다. 이메일·이름·연락처·학원 코드·출석·진도·성적은 <b>보이지 않습니다</b>. 글에 개인정보를 직접 적지 않도록 앱이 자동으로 확인하여 알려 드리며, 주민등록번호로 보이는 내용은 올릴 수 없습니다. 신고한 사람이 누구인지는 신고받은 사람에게 알리지 않으며, 차단 사실도 상대에게 알리지 않습니다.</p>

<h4>6의2. 만 14세 미만 아동의 개인정보</h4>

async function afterLogin(acc){

  let pl = null; try { pl = JSON.parse(localStorage.getItem('pcs.pendingLink')); localStorage.removeItem('pcs.pendingLink'); } catch {}
  if (pl && pl.code && ((pl.kind==='student' && acc.role==='student' && !acc.studentCode) || (pl.kind==='child' && acc.role==='parent' && !(acc.childCodes||[]).includes(String(pl.code).toUpperCase())))){
    try { const r = await DBX.linkCode(pl.kind, pl.code); if (r.ok){ acc = ACC = await DBX.me(); } else toast(r.why); } catch {} }
  if (acc.role==='student' && acc.studentCode){ try { const r = await DBX.verifyCode(acc.studentCode); if (r.ok) S.auth = { code:acc.studentCode, name:r.student.name, cls:r.student.cls, until:r.student.until }; } catch {} }
  else S.auth = null;
  try { mergeProgress(await DBX.loadProgress(progressKey())); } catch {}
  adoptGuestNotes(); syncNotes().then(refreshNoteCard).catch(()=>{});
  if (isNative) setTimeout(() => restorePurchases(true).catch(()=>{}), 1500);

}
async function linkStudentCode(code){
  const r = await DBX.linkCode('student', code); if (!r.ok) return r;
  const c = r.student.code; S.auth = { code:c, name:r.student.name, cls:r.student.cls, until:r.student.until };
  ACC = await DBX.me();
  try { mergeProgress(await DBX.loadProgress(c)); } catch {}
  save(S); return r;
}

function a11yPass(root){
  root.querySelectorAll('input:not([type=hidden]),select,textarea').forEach(el => { if (el.hasAttribute('aria-label') || (el.labels && el.labels.length)) return;
    const t = el.placeholder || el.title || (el.type === 'date' ? '날짜' : el.type === 'time' ? '시각' : ''); if (t) el.setAttribute('aria-label', t); });
  root.querySelectorAll('.seg button, .chipbar button:not([role]), .chips button:not([role])').forEach(b => b.setAttribute('aria-pressed', b.classList.contains('on') ? 'true' : 'false'));
}
new MutationObserver(ms => { for (const m of ms) m.addedNodes.forEach(n => { if (n.nodeType === 1) a11yPass(n.parentElement || n); }); }).observe(document.body, { childList:true, subtree:true });

/* 처리하지 않은 실패(버튼을 눌렀는데 서버가 거절·끊김)는 조용히 넘어가지 않고 한 줄로 알린다 */
window.addEventListener('unhandledrejection', e => { const r = e.reason || {};
  if (r && r.message && (r.net || r.status || /[가-힣]/.test(r.message))){ toast(r.message); e.preventDefault(); }
  if (r.net || (r.status && r.status < 500) || /Failed to fetch|NetworkError|Load failed/i.test(r.message||'')) return;
  reportError('Promise: ' + (r.message || r), r.stack); });
/* ═══ 시작 ═══ */
(async () => {
  loadMore();   // 문제 은행·탐구·그림 — 첫 화면과 함께 받기 시작
  setTimeout(() => { const Sp = plug('SplashScreen'); Sp && Sp.hide(); }, 1500);   // 망이 느려도 첫 화면을 21초씩 가리지 않게
  if (storeWarn) setTimeout(() => toast(storeWarn), 900);
  /* 가입 확인·비밀번호 재설정 메일의 링크로 들어왔으면 그 세션을 받는다 */
  const hp = new URLSearchParams(location.hash.slice(1)); let linkErr = '';
  if (SRV && (hp.get('access_token') || hp.get('error_description'))){
    history.replaceState(null, '', location.pathname + location.search);
    if (hp.get('error_description')) linkErr = AUTH_KO(hp.get('error_description'));
    else try {
      /* 링크에 든 계정을 먼저 보여 주고 확인받는다 — 남이 보낸 링크로 조용히 다른 계정에 로그인되는 일(로그인 바꿔치기) 방지 */
      const lu = await DBX.linkUser(hp.get('access_token')); const cur = SESSION && SESSION.user && SESSION.user.email;
      const msg = hp.get('type')==='recovery' ? `${lu.email} 계정의 비밀번호를 새로 정합니다. 내 계정이 맞나요?`
        : `${lu.email} 계정으로 로그인합니다. 내 계정이 맞나요?${cur && cur !== lu.email ? ` (지금 로그인한 ${cur} 에서는 로그아웃됩니다)` : ''}`;
      if (!await ask(msg, '내 계정 맞아요', false)) throw new Error('링크의 계정으로 로그인하지 않았습니다.');
      ACC = await DBX.adoptSession(hp.get('access_token'), hp.get('refresh_token'), lu);
      if (hp.get('type')==='recovery'){ authMode='newpw'; show('auth'); nativeInit(); return; }
      toast('메일 인증이 끝났습니다. 반갑습니다'); S.onboarded=true; await afterLogin(ACC); nativeInit(); return;
    } catch (e){ linkErr = e.message; }
  }
  try { ACC = await DBX.me(); } catch { ACC = null; }
  /* 이미 쓴 링크·만료된 링크: 로그인해 있으면 알림만, 아니면 로그인 화면에 이유를 적는다 */
  if (linkErr){ if (ACC) setTimeout(() => toast(linkErr), 600); else { authMode='login'; authErr=linkErr; S.onboarded=true; show('auth'); nativeInit(); return; } }
  if (ACC){
    /* 켤 때마다 학원 코드를 다시 확인한다 — 수강이 끝났거나 원장님이 해제했으면 닫는다. 연결이 안 되면 저장된 만료일로 판단 */
    if (ACC.role==='student' && ACC.studentCode){ try { const r = await DBX.verifyCode(ACC.studentCode);
        if (r.ok) S.auth = { code:ACC.studentCode, name:r.student.name, cls:r.student.cls, until:r.student.until };
        else { if (S.auth) toast(r.why || '학원 코드가 닫혔습니다'); S.auth = null; } } catch {} }
    else if (S.auth && ACC.role==='student') S.auth = null;
    if (S.auth && ACC.role!=='student') S.auth = null;
    show(home());
    DBX.loadProgress(progressKey()).then(p => { if (p){ mergeProgress(p); save(S); if (view==='today') renderToday(); } }).catch(()=>{});
  } else {
    if (S.auth) S.auth = null;      // 로그아웃 상태에서는 학원 연결도 닫는다
    if (!S.onboarded && !S.introSeen) authMode = 'intro';
    show(S.onboarded ? 'today' : 'auth');
  }
  nativeInit(); initPush(); setTimeout(checkTalkNew, 1200); checkAppMeta();
})();
if (!isNative && 'serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
