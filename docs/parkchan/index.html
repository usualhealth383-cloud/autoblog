하지 않는 자연의 값이므로, 언제 어디서 재어도 같은 1 m를 얻을 수 있어 길이의 기준을 빛으로 바꾸었다.", "answer": null, "explain": "미터원기는 물체이므로 닳거나 온도에 따라 변형되어 기준이 흔들릴 수 있다. 반면 빛의 속력은 진공에서 변하지 않는 자연의 값이므로, 언제 어디서 재어도 같은 1 m를 얻을 수 있어 길이의 기준을 빛으로 바꾸었다."}, {"lessonId": "1102", "no": 1, "type": "오개념", "stem": "국제단위계(SI)의 기본량과 단위에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["SI의 기본량은 7가지이다.", "질량의 SI 기본단위는 kg이다.", "속도의 단위 m/s는 길이와 시간의 단위에서 유도된 것이다.", "힘의 단위 N은 기본단위의 조합으로 나타낼 수 있다.", "밀도는 SI 기본량 중 하나이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ⑤ (밀도는 질량 ÷ 부피로 만든 유도량) 2 ② (계산은 정확했고 단위의 약속이 어긋났다 — 티가 잘 나지 않아 더 위험하다) 3 1 nm = 10⁻⁹ m, 2 μm = 2 × 10⁻⁶ m. 2 × 10⁻⁶ ÷ 10⁻⁹ = 2 × 10³이므로 2 μm가 2000배 크다.", "answer": 5, "explain": "밀도는 질량 ÷ 부피로 만든 유도량"}, {"lessonId": "1102", "no": 2, "type": "자료 해석", "stem": "다음은 1999년 화성 기후 궤도선 사고에 대한 자료다.", "source": "탐사선의 추진력 데이터를 한 팀은 <b>파운드힘<\/b> 기준으로 산출했고, 다른 팀은 이를 <b>뉴턴<\/b> 기준으로 받아 계산했다(1파운드힘 ≈ 4.45뉴턴). 탐사선은 계획보다 훨씬 낮은 고도로 화성 대기에 진입해 파괴된 것으로 추정된다.", "ask": "이 자료에 대한 해석으로 가장 적절한 것은?", "choices": ["추진력의 수치 계산이 틀린 것이 사고의 원인이다.", "두 단위의 비율이 4.45배로 그럴듯한 크기라 혼동이 드러나지 않았다.", "미터법 대신 야드파운드법을 썼다면 사고를 막을 수 있었다.", "단위는 형식이므로 수치만 정확하면 결과는 같다.", "접두어(k, m)를 잘못 붙인 것이 원인이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ⑤ (밀도는 질량 ÷ 부피로 만든 유도량) 2 ② (계산은 정확했고 단위의 약속이 어긋났다 — 티가 잘 나지 않아 더 위험하다) 3 1 nm = 10⁻⁹ m, 2 μm = 2 × 10⁻⁶ m. 2 × 10⁻⁶ ÷ 10⁻⁹ = 2 × 10³이므로 2 μm가 2000배 크다.", "answer": 2, "explain": "계산은 정확했고 단위의 약속이 어긋났다 — 티가 잘 나지 않아 더 위험하다"}, {"lessonId": "1102", "no": 3, "type": "서술형", "stem": "1 nm와 2 μm를 각각 m 단위의 10의 거듭제곱으로 나타내고, 둘 중 어느 쪽이 몇 배 큰지 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 1 nm = 10<sup>−9<\/sup> m ② 2 μm = 2 × 10<sup>−6<\/sup> m ③ 2 μm가 2000배 크다<\/b>의 세 요소가 들어가야 한다. 지수의 부호를 양수로 쓰거나(10<sup>9<\/sup>), 배수를 지수의 뺄셈 없이 '3배'로 쓰면 감점이다.", "answerLine": "정답 1 ⑤ (밀도는 질량 ÷ 부피로 만든 유도량) 2 ② (계산은 정확했고 단위의 약속이 어긋났다 — 티가 잘 나지 않아 더 위험하다) 3 1 nm = 10⁻⁹ m, 2 μm = 2 × 10⁻⁶ m. 2 × 10⁻⁶ ÷ 10⁻⁹ = 2 × 10³이므로 2 μm가 2000배 크다.", "answer": null, "explain": "1 nm = 10<sup>−9<\/sup> m, 2 μm = 2 × 10<sup>−6<\/sup> m. 2 × 10<sup>−6<\/sup> ÷ 10<sup>−9<\/sup> = 2 × 10<sup>3<\/sup>이므로 2 μm가 2000배 크다."}, {"lessonId": "1103", "no": 1, "type": "오개념", "stem": "측정과 어림에 대한 설명으로 <b>옳은<\/b> 것은?", "source": "", "ask": "", "choices": ["정밀한 도구를 사용하면 오차를 0으로 만들 수 있다.", "어림은 규모를 판단하고 측정 결과를 검산하는 데 쓰인다.", "어림은 부정확하므로 과학 탐구에서는 쓰이지 않는다.", "반복 측정과 평균은 오차를 줄이는 데 도움이 되지 않는다.", "경험과 지식으로 양을 대략 헤아리는 것을 측정이라 한다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ② (①·④ 오차는 0이 안 되며 반복·평균으로 줄인다, ③ 검산에 필수, ⑤ 그것은 어림) 2 ④ (어림의 목표는 자릿수 — 참값이 80만이든 130만이든 판단은 같다) 3 원기는 물체이므로 시간이 지나면서 복제본과 수십 μg씩 값이 어긋나는 등 기준 자체가 변한다. 플랑크 상수는 자연의 기본 상수라 변하지 않으므로, 이에 붙들어 정의하면 언제 어디서나 같은 1 kg을 구현할 수 있다.", "answer": 2, "explain": "①·④ 오차는 0이 안 되며 반복·평균으로 줄인다, ③ 검산에 필수, ⑤ 그것은 어림"}, {"lessonId": "1103", "no": 2, "type": "자료 해석", "stem": "다음은 어림의 과정을 나타낸 자료다.", "source": "25 m 수영장(폭 ≈ 15 m, 깊이 ≈ 1.5 m)의 물을 500 mL 생수병에 나눠 담는다. 부피 ≈ 25 × 15 × 1.5 ≈ <b>560 m<sup>3<\/sup><\/b>, 병 하나 = <b>0.0005 m<sup>3<\/sup><\/b> → 560 ÷ 0.0005 ≈ 1.1 × 10<sup>6<\/sup>병.", "ask": "이 어림에 대한 설명으로 가장 적절한 것은?", "choices": ["참값이 80만 병이면 이 어림은 틀린 것이다.", "폭과 깊이를 정확히 재지 않았으므로 과학적이지 않다.", "어림의 결과는 반드시 정수로 보고해야 한다.", "문제를 곱셈 구조로 쪼개고 상식적인 값을 넣어 '백만 병 규모'라는 자릿수를 얻었다.", "도구로 눈금을 읽어 수치화했으므로 측정에 해당한다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ② (①·④ 오차는 0이 안 되며 반복·평균으로 줄인다, ③ 검산에 필수, ⑤ 그것은 어림) 2 ④ (어림의 목표는 자릿수 — 참값이 80만이든 130만이든 판단은 같다) 3 원기는 물체이므로 시간이 지나면서 복제본과 수십 μg씩 값이 어긋나는 등 기준 자체가 변한다. 플랑크 상수는 자연의 기본 상수라 변하지 않으므로, 이에 붙들어 정의하면 언제 어디서나 같은 1 kg을 구현할 수 있다.", "answer": 4, "explain": "어림의 목표는 자릿수 — 참값이 80만이든 130만이든 판단은 같다"}, {"lessonId": "1103", "no": 3, "type": "서술형", "stem": "2019년에 1 kg의 정의를 백금-이리듐 원기에서 플랑크 상수로 바꾼 까닭을 <b>'변한다'<\/b>와 <b>'변하지 않는다'<\/b>를 모두 사용하여 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 원기는 물체라 복제본과 비교할 때 수십 μg씩 어긋났다(변한다) → ② 플랑크 상수는 자연 상수라 변하지 않는다 → ③ 그래서 어디서나 같은 1 kg을 구현할 수 있다<\/b>의 세 요소가 들어가야 한다. '더 정확해서'라고만 쓰면 절반의 답이다.", "answerLine": "정답 1 ② (①·④ 오차는 0이 안 되며 반복·평균으로 줄인다, ③ 검산에 필수, ⑤ 그것은 어림) 2 ④ (어림의 목표는 자릿수 — 참값이 80만이든 130만이든 판단은 같다) 3 원기는 물체이므로 시간이 지나면서 복제본과 수십 μg씩 값이 어긋나는 등 기준 자체가 변한다. 플랑크 상수는 자연의 기본 상수라 변하지 않으므로, 이에 붙들어 정의하면 언제 어디서나 같은 1 kg을 구현할 수 있다.", "answer": null, "explain": "원기는 물체이므로 시간이 지나면서 복제본과 수십 μg씩 값이 어긋나는 등 기준 자체가 변한다. 플랑크 상수는 자연의 기본 상수라 변하지 않으므로, 이에 붙들어 정의하면 언제 어디서나 같은 1 kg을 구현할 수 있다."}, {"lessonId": "1104", "no": 1, "type": "오개념", "stem": "아날로그 신호와 디지털 신호에 대한 설명으로 <b>옳은<\/b> 것은?", "source": "", "ask": "", "choices": ["디지털 정보는 여러 번 복사해도 내용이 변하지 않는다.", "수은 온도계의 눈금은 불연속적인 값을 나타내는 디지털 신호이다.", "자연의 신호는 원래 0과 1로 이루어진 디지털 신호이다.", "디지털 신호는 아날로그 신호보다 잡음의 영향을 크게 받는다.", "표본을 촘촘히 뽑을수록 데이터의 용량은 작아진다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ① (② 연속 — 아날로그, ③ 자연은 아날로그, ④ 잡음에 강하다, ⑤ 용량이 커진다) 2 ③ (① 더 촘촘히 뽑아 살릴 수 있다, ② 두 배가 된다, ④ 그것은 수치화, ⑤ 더 가까워진다) 3 아날로그 신호는 연속적인 값이라 복사·전송 중 조금만 흐트러져도 다른 값이 되어 잡음이 쌓인다. 디지털 신호는 0과 1의 '있다/없다'만 구별하면 되므로, 잡음이 조금 끼어도 원래 값을 되살릴 수 있어 아무리 복사해도 변하지 않는다.", "answer": 1, "explain": "② 연속 — 아날로그, ③ 자연은 아날로그, ④ 잡음에 강하다, ⑤ 용량이 커진다"}, {"lessonId": "1104", "no": 2, "type": "자료 해석", "stem": "다음은 어떤 소리를 디지털로 변환한 자료다.", "source": "아날로그 신호를 <b>0.001초 간격<\/b>으로 표본화하고 <b>0~7의 8단계<\/b>로 수치화했더니, 뽑힌 값은 차례로 <b>3, 5, 7, 6, 4, 2, 1, 3<\/b>이었다.", "ask": "이 자료에 대한 설명으로 가장 적절한 것은?", "choices": ["표본 사이의 정보는 영원히 사라져 복원할 방법이 없다.", "표본 간격을 0.0005초로 줄이면 데이터의 용량은 절반이 된다.", "8단계는 이진수 세 자리로 적을 수 있으므로 3, 5, 7은 011, 101, 111로 저장된다.", "값을 반올림해 기록하는 과정을 표본화라 한다.", "단계를 16단계로 늘리면 원본과의 차이가 더 커진다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ① (② 연속 — 아날로그, ③ 자연은 아날로그, ④ 잡음에 강하다, ⑤ 용량이 커진다) 2 ③ (① 더 촘촘히 뽑아 살릴 수 있다, ② 두 배가 된다, ④ 그것은 수치화, ⑤ 더 가까워진다) 3 아날로그 신호는 연속적인 값이라 복사·전송 중 조금만 흐트러져도 다른 값이 되어 잡음이 쌓인다. 디지털 신호는 0과 1의 '있다/없다'만 구별하면 되므로, 잡음이 조금 끼어도 원래 값을 되살릴 수 있어 아무리 복사해도 변하지 않는다.", "answer": 3, "explain": "① 더 촘촘히 뽑아 살릴 수 있다, ② 두 배가 된다, ④ 그것은 수치화, ⑤ 더 가까워진다"}, {"lessonId": "1104", "no": 3, "type": "서술형", "stem": "카세트테이프는 복사할수록 잡음이 쌓이지만 디지털 음원은 복사해도 변하지 않는 까닭을 <b>'0과 1'<\/b>과 <b>'잡음'<\/b>을 포함하여 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 아날로그는 연속값이라 조금만 흐트러져도 다른 값이 된다 → ② 디지털은 0과 1의 '있다/없다'만 구별하면 된다 → ③ 그래서 잡음이 조금 끼어도 원래 값을 되살린다<\/b>의 세 요소가 들어가야 한다. \"디지털이 더 정확해서\"라고만 쓰면 답이 아니다.", "answerLine": "정답 1 ① (② 연속 — 아날로그, ③ 자연은 아날로그, ④ 잡음에 강하다, ⑤ 용량이 커진다) 2 ③ (① 더 촘촘히 뽑아 살릴 수 있다, ② 두 배가 된다, ④ 그것은 수치화, ⑤ 더 가까워진다) 3 아날로그 신호는 연속적인 값이라 복사·전송 중 조금만 흐트러져도 다른 값이 되어 잡음이 쌓인다. 디지털 신호는 0과 1의 '있다/없다'만 구별하면 되므로, 잡음이 조금 끼어도 원래 값을 되살릴 수 있어 아무리 복사해도 변하지 않는다.", "answer": null, "explain": "아날로그 신호는 연속적인 값이라 복사·전송 중 조금만 흐트러져도 다른 값이 되어 잡음이 쌓인다. 디지털 신호는 0과 1의 '있다/없다'만 구별하면 되므로, 잡음이 조금 끼어도 원래 값을 되살릴 수 있어 아무리 복사해도 변하지 않는다."}, {"lessonId": "1201", "no": 1, "type": "오개념", "stem": "스펙트럼에 대한 설명으로 <b>옳은<\/b> 것은?", "source": "", "ask": "", "choices": ["고온의 별 표면에서 나온 빛만 프리즘에 통과시키면 밝은 선 몇 개만 나타난다.", "고온·저밀도 기체가 내는 빛에서는 연속 스펙트럼이 나타난다.", "연속 스펙트럼의 빛이 저온의 기체를 통과하면 특정 파장이 흡수되어 검은 선이 나타난다.", "같은 원소라도 방출선과 흡수선의 파장(위치)은 서로 다르다.", "흡수 스펙트럼으로는 기체의 종류를 알 수 없다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (① 연속 스펙트럼, ② 밝은 선의 방출 스펙트럼, ④ 같은 위치, ⑤ 지문처럼 알 수 있다) 2 ⑤ (검은 선 = 대기가 흡수한 자리, A의 선과 일치 → A 있음, B 자리에 없음 → B 검출 안 됨) 3 ① 우주 배경 복사: 원자가 생겨 우주가 투명해질 때 퍼진 빛이 식어 모든 방향에서 전파로 관측되며, 빅뱅 우주론의 예측이 관측으로 확인되었다. ② 수소 : 헬륨 질량비 약 3 : 1: 초기 우주의 양성자·중성자 개수비로 계산한 예측값과 스펙트럼 관측값이 일치한다.", "answer": 3, "explain": "① 연속 스펙트럼, ② 밝은 선의 방출 스펙트럼, ④ 같은 위치, ⑤ 지문처럼 알 수 있다"}, {"lessonId": "1201", "no": 2, "type": "자료 해석", "stem": "다음은 원소 A, B의 방출 스펙트럼과 별 S의 흡수 스펙트럼을 비교한 자료다.", "source": "별 S의 스펙트럼은 연속 스펙트럼 위에 <b>검은 선<\/b>이 있다. S의 검은 선 위치는 <b>원소 A의 밝은 선 위치와 일치<\/b>하고, 원소 B의 밝은 선 위치에는 S의 검은 선이 <b>없다<\/b>.", "ask": "이 자료에 대한 해석으로 가장 적절한 것은?", "choices": ["별 S는 원소 A의 파장을 방출하고 있다.", "별 S의 스펙트럼은 방출 스펙트럼이다.", "별 S의 대기에는 원소 B가 풍부하다.", "원소 A와 B는 같은 위치에 선이 나타나는 같은 원소다.", "별 S의 대기에는 원소 A가 있고, 원소 B는 검출되지 않는다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (① 연속 스펙트럼, ② 밝은 선의 방출 스펙트럼, ④ 같은 위치, ⑤ 지문처럼 알 수 있다) 2 ⑤ (검은 선 = 대기가 흡수한 자리, A의 선과 일치 → A 있음, B 자리에 없음 → B 검출 안 됨) 3 ① 우주 배경 복사: 원자가 생겨 우주가 투명해질 때 퍼진 빛이 식어 모든 방향에서 전파로 관측되며, 빅뱅 우주론의 예측이 관측으로 확인되었다. ② 수소 : 헬륨 질량비 약 3 : 1: 초기 우주의 양성자·중성자 개수비로 계산한 예측값과 스펙트럼 관측값이 일치한다.", "answer": 5, "explain": "검은 선 = 대기가 흡수한 자리, A의 선과 일치 → A 있음, B 자리에 없음 → B 검출 안 됨"}, {"lessonId": "1201", "no": 3, "type": "서술형", "stem": "빅뱅 우주론을 뒷받침하는 두 가지 증거를 쓰고, 각각이 왜 증거가 되는지 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 우주 배경 복사 — 원자 생성 무렵 퍼진 빛이 식어 모든 방향의 전파로 관측된다는 예측이 실제로 확인됨 ② 수소 : 헬륨 질량비 3 : 1 — 이론이 계산으로 예측한 값과 관측이 일치함<\/b>의 두 증거와 각각의 '예측 = 관측' 논리가 들어가야 한다. 증거 이름만 쓰면 절반의 답이다.", "answerLine": "정답 1 ③ (① 연속 스펙트럼, ② 밝은 선의 방출 스펙트럼, ④ 같은 위치, ⑤ 지문처럼 알 수 있다) 2 ⑤ (검은 선 = 대기가 흡수한 자리, A의 선과 일치 → A 있음, B 자리에 없음 → B 검출 안 됨) 3 ① 우주 배경 복사: 원자가 생겨 우주가 투명해질 때 퍼진 빛이 식어 모든 방향에서 전파로 관측되며, 빅뱅 우주론의 예측이 관측으로 확인되었다. ② 수소 : 헬륨 질량비 약 3 : 1: 초기 우주의 양성자·중성자 개수비로 계산한 예측값과 스펙트럼 관측값이 일치한다.", "answer": null, "explain": "① 우주 배경 복사: 원자가 생겨 우주가 투명해질 때 퍼진 빛이 식어 모든 방향에서 전파로 관측되며, 빅뱅 우주론의 예측이 관측으로 확인되었다. ② 수소 : 헬륨 질량비 약 3 : 1: 초기 우주의 양성자·중성자 개수비로 계산한 예측값과 스펙트럼 관측값이 일치한다."}, {"lessonId": "1202", "no": 1, "type": "오개념", "stem": "별에서 만들어지는 원소에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["별은 중심 온도가 약 1000만 K에 이르러 수소 핵융합이 시작될 때 탄생한다.", "탄소는 적색 거성 단계의 헬륨 핵융합으로 만들어진다.", "별 내부의 핵융합으로 만들어질 수 있는 가장 무거운 원소는 철이다.", "금과 우라늄은 무거운 별의 중심부에서 핵융합으로 만들어진다.", "태양 정도 질량의 별은 행성상 성운과 백색 왜성으로 최후를 맞는다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (핵융합은 철까지 — 금·우라늄은 초신성 폭발 때) 2 ① (② 반대, ③ 우라늄은 폭발 때, ④ 질량이 가른다, ⑤ 둘 다 내보낸다) 3 철 원자핵은 가장 안정한 원자핵이어서 철을 더 융합해도 에너지가 나오지 않으므로 핵융합이 철에서 멈춘다. 연료가 끊긴 중심부가 순식간에 무너지면서 별 전체가 초신성 폭발을 일으키고, 그 막대한 에너지 속에서 금·은·우라늄 같은 철보다 무거운 원소가 만들어져 우주로 흩뿌려진다.", "answer": 4, "explain": "핵융합은 철까지 — 금·우라늄은 초신성 폭발 때"}, {"lessonId": "1202", "no": 2, "type": "자료 해석", "stem": "다음은 질량이 다른 두 별의 진화 경로를 비교한 자료다.", "source": "별 A는 질량이 <b>태양 정도<\/b>이고, 별 B는 <b>태양의 10배 이상<\/b>이다. A는 적색 거성을 거쳐 바깥층을 서서히 내보내고, B는 초거성을 거쳐 격렬하게 폭발한다.", "ask": "이 자료에 대한 설명으로 가장 적절한 것은?", "choices": ["A의 중심부는 탄소까지, B의 중심부는 철까지 만들며, 금은 어느 쪽도 핵융합으로 만들지 못한다.", "A는 초신성 폭발로, B는 행성상 성운으로 원소를 내보낸다.", "B의 중심부에서는 핵융합으로 우라늄이 만들어진다.", "진화 경로를 가르는 것은 별의 질량이 아니라 나이다.", "A와 B 모두 만든 원소를 우주로 내보내지 않고 중심핵에 가둔다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (핵융합은 철까지 — 금·우라늄은 초신성 폭발 때) 2 ① (② 반대, ③ 우라늄은 폭발 때, ④ 질량이 가른다, ⑤ 둘 다 내보낸다) 3 철 원자핵은 가장 안정한 원자핵이어서 철을 더 융합해도 에너지가 나오지 않으므로 핵융합이 철에서 멈춘다. 연료가 끊긴 중심부가 순식간에 무너지면서 별 전체가 초신성 폭발을 일으키고, 그 막대한 에너지 속에서 금·은·우라늄 같은 철보다 무거운 원소가 만들어져 우주로 흩뿌려진다.", "answer": 1, "explain": "② 반대, ③ 우라늄은 폭발 때, ④ 질량이 가른다, ⑤ 둘 다 내보낸다"}, {"lessonId": "1202", "no": 3, "type": "서술형", "stem": "무거운 별의 내부 핵융합이 철에서 멈추는 까닭과, 철보다 무거운 원소가 만들어지는 과정을 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 철 원자핵은 가장 안정해 더 융합해도 에너지가 나오지 않는다 → ② 에너지를 못 내는 중심부가 무너져 초신성 폭발이 일어난다 → ③ 그 폭발의 에너지 속에서 금·은·우라늄이 만들어진다<\/b>의 세 요소가 들어가야 한다. '철이 무거워서'라고만 쓰면 답이 아니다.", "answerLine": "정답 1 ④ (핵융합은 철까지 — 금·우라늄은 초신성 폭발 때) 2 ① (② 반대, ③ 우라늄은 폭발 때, ④ 질량이 가른다, ⑤ 둘 다 내보낸다) 3 철 원자핵은 가장 안정한 원자핵이어서 철을 더 융합해도 에너지가 나오지 않으므로 핵융합이 철에서 멈춘다. 연료가 끊긴 중심부가 순식간에 무너지면서 별 전체가 초신성 폭발을 일으키고, 그 막대한 에너지 속에서 금·은·우라늄 같은 철보다 무거운 원소가 만들어져 우주로 흩뿌려진다.", "answer": null, "explain": "철 원자핵은 가장 안정한 원자핵이어서 철을 더 융합해도 에너지가 나오지 않으므로 핵융합이 철에서 멈춘다. 연료가 끊긴 중심부가 순식간에 무너지면서 별 전체가 초신성 폭발을 일으키고, 그 막대한 에너지 속에서 금·은·우라늄 같은 철보다 무거운 원소가 만들어져 우주로 흩뿌려진다."}, {"lessonId": "1203", "no": 1, "type": "오개념", "stem": "원소의 주기성과 화학 결합에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["같은 족 원소는 원자가 전자 수가 같아 화학적 성질이 비슷하다.", "수소는 1족이지만 알칼리 금속이 아니다.", "나트륨은 전자 1개를 얻어 비활성 기체형 전자 배치가 된다.", "원자들은 비활성 기체와 같은 전자 배치를 이루려고 결합한다.", "물 분자에서 수소와 산소는 전자쌍을 공유하고 있다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (나트륨은 전자 1개를 잃어 네온형이 된다) 2 ② (① 이온은 원래 있었고 물이 풀어 줬을 뿐, ③ 설탕은 이온이 안 생긴다, ④ 금속은 자유 전자가 운반, ⑤ (가)는 이온 결합) 3 나트륨 원자가 원자가 전자 1개를 염소 원자에게 넘겨주어 나트륨은 양이온(Na⁺), 염소는 음이온(Cl⁻)이 되고, 둘 다 비활성 기체형 전자 배치를 이룬다. 반대 전하의 두 이온이 정전기적 인력으로 결합하여 염화 나트륨이 된다.", "answer": 3, "explain": "나트륨은 전자 1개를 잃어 네온형이 된다"}, {"lessonId": "1203", "no": 2, "type": "자료 해석", "stem": "다음은 세 고체 물질의 전기 전도성을 조사한 자료다.", "source": "(가) 고체 <b>X<\/b> · 수용액 <b>O<\/b> · 금속 + 비금속 (나) 고체 <b>X<\/b> · 수용액 <b>X<\/b> · 비금속끼리 (다) 고체 <b>O<\/b> · 금속 단독(가)~(다)는 염화 나트륨, 설탕, 구리 중 하나이다.", "ask": "이 자료에 대한 해석으로 가장 적절한 것은?", "choices": ["(가)는 고체 상태에서 이온이 없다가 물에 녹으면 이온이 새로 생긴다.", "(가)는 이온 결합 물질인 염화 나트륨, (나)는 공유 결합 물질인 설탕이다.", "(나)는 물에 녹으면 이온이 생기므로 전기가 통해야 한다.", "(다)는 고체에서 이온이 움직여 전기가 통한다.", "(가)와 (나)는 모두 공유 결합 물질이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (나트륨은 전자 1개를 잃어 네온형이 된다) 2 ② (① 이온은 원래 있었고 물이 풀어 줬을 뿐, ③ 설탕은 이온이 안 생긴다, ④ 금속은 자유 전자가 운반, ⑤ (가)는 이온 결합) 3 나트륨 원자가 원자가 전자 1개를 염소 원자에게 넘겨주어 나트륨은 양이온(Na⁺), 염소는 음이온(Cl⁻)이 되고, 둘 다 비활성 기체형 전자 배치를 이룬다. 반대 전하의 두 이온이 정전기적 인력으로 결합하여 염화 나트륨이 된다.", "answer": 2, "explain": "① 이온은 원래 있었고 물이 풀어 줬을 뿐, ③ 설탕은 이온이 안 생긴다, ④ 금속은 자유 전자가 운반, ⑤ (가)는 이온 결합"}, {"lessonId": "1203", "no": 3, "type": "서술형", "stem": "염화 나트륨이 만들어지는 과정을 <b>'전자'<\/b>, <b>'양이온'<\/b>, <b>'음이온'<\/b>, <b>'정전기적 인력'<\/b>을 모두 사용하여 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 나트륨이 원자가 전자 1개를 염소에게 넘긴다 → ② 나트륨은 양이온 Na<sup>+<\/sup>, 염소는 음이온 Cl<sup>−<\/sup>이 된다(둘 다 비활성 기체형) → ③ 두 이온이 정전기적 인력으로 결합한다<\/b>의 세 요소가 순서대로 들어가야 한다. '전자쌍을 공유한다'고 쓰면 공유 결합과 혼동한 오답이다.", "answerLine": "정답 1 ③ (나트륨은 전자 1개를 잃어 네온형이 된다) 2 ② (① 이온은 원래 있었고 물이 풀어 줬을 뿐, ③ 설탕은 이온이 안 생긴다, ④ 금속은 자유 전자가 운반, ⑤ (가)는 이온 결합) 3 나트륨 원자가 원자가 전자 1개를 염소 원자에게 넘겨주어 나트륨은 양이온(Na⁺), 염소는 음이온(Cl⁻)이 되고, 둘 다 비활성 기체형 전자 배치를 이룬다. 반대 전하의 두 이온이 정전기적 인력으로 결합하여 염화 나트륨이 된다.", "answer": null, "explain": "나트륨 원자가 원자가 전자 1개를 염소 원자에게 넘겨주어 나트륨은 양이온(Na<sup>+<\/sup>), 염소는 음이온(Cl<sup>−<\/sup>)이 되고, 둘 다 비활성 기체형 전자 배치를 이룬다. 반대 전하의 두 이온이 정전기적 인력으로 결합하여 염화 나트륨이 된다."}, {"lessonId": "1204", "no": 1, "type": "오개념", "stem": "지각과 생명체를 이루는 물질에 대한 설명으로 <b>옳은<\/b> 것은?", "source": "", "ask": "", "choices": ["지각에 가장 많은 원소는 규소이다.", "규산염 사면체는 규소 4개와 산소 1개로 이루어진다.", "DNA의 염기는 약 20종류이다.", "아미노산의 배열 순서가 달라져도 단백질의 기능은 같다.", "적은 종류의 단위체로도 배열에 따라 다양한 물질이 만들어진다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ⑤ (① 산소, ② 규소 1 + 산소 4, ③ 4종, ④ 순서가 구조·기능을 결정) 2 ④ (① 반대, ② 사슬 길이에 따라 다르다, ③ A–T·G–C, ⑤ 산소를 공유) 3 단백질의 단위체는 아미노산으로 약 20종, 핵산의 단위체는 뉴클레오타이드로 염기가 4종뿐이다. 이 단위체들이 반복 결합해 긴 사슬을 이루며, 배열 순서(염기 서열)가 달라지면 다른 물질이 되므로 경우의 수가 사실상 무한이 되어 다양한 단백질과 유전 정보가 만들어진다.", "answer": 5, "explain": "① 산소, ② 규소 1 + 산소 4, ③ 4종, ④ 순서가 구조·기능을 결정"}, {"lessonId": "1204", "no": 2, "type": "자료 해석", "stem": "다음은 지각과 생명체를 구성하는 대표 물질을 비교한 자료다.", "source": "(가) 기본 단위체 <b>규산염 사면체<\/b> — 다양성의 비결 <b>결합 방식<\/b> (나) 기본 단위체 <b>아미노산(약 20종)<\/b> — 다양성의 비결 <b>배열 순서<\/b> (다) 기본 단위체 <b>뉴클레오타이드(염기 4종)<\/b> — 다양성의 비결 <b>염기 서열<\/b>", "ask": "이 자료에 대한 설명으로 가장 적절한 것은?", "choices": ["(가)는 생명체의 물질이고 (나)·(다)는 지각의 물질이다.", "(나)는 단위체가 20종이므로 (다)보다 만들 수 있는 물질의 수가 반드시 많다.", "(다)의 염기는 A–G, C–T로 짝을 이룬다.", "(가)~(다)는 모두 적은 종류의 단위체가 반복 결합하고 배열을 달리하여 만들어진다.", "(가)의 단위체는 이웃과 규소를 공유하며 결합한다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ⑤ (① 산소, ② 규소 1 + 산소 4, ③ 4종, ④ 순서가 구조·기능을 결정) 2 ④ (① 반대, ② 사슬 길이에 따라 다르다, ③ A–T·G–C, ⑤ 산소를 공유) 3 단백질의 단위체는 아미노산으로 약 20종, 핵산의 단위체는 뉴클레오타이드로 염기가 4종뿐이다. 이 단위체들이 반복 결합해 긴 사슬을 이루며, 배열 순서(염기 서열)가 달라지면 다른 물질이 되므로 경우의 수가 사실상 무한이 되어 다양한 단백질과 유전 정보가 만들어진다.", "answer": 4, "explain": "① 반대, ② 사슬 길이에 따라 다르다, ③ A–T·G–C, ⑤ 산소를 공유"}, {"lessonId": "1204", "no": 3, "type": "서술형", "stem": "단백질과 핵산이 적은 종류의 단위체로도 다양한 물질이 될 수 있는 까닭을 <b>단위체의 이름과 종류 수<\/b>를 들어 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 단백질은 아미노산 약 20종, 핵산은 뉴클레오타이드(염기 4종)가 단위체다 → ② 단위체가 반복 결합해 긴 사슬을 이룬다 → ③ 배열 순서(염기 서열)에 따라 경우의 수가 사실상 무한이라 다양한 단백질·유전 정보가 된다<\/b>의 세 요소가 들어가야 한다. 종류 수(20·4)를 바꿔 쓰면 감점이다.", "answerLine": "정답 1 ⑤ (① 산소, ② 규소 1 + 산소 4, ③ 4종, ④ 순서가 구조·기능을 결정) 2 ④ (① 반대, ② 사슬 길이에 따라 다르다, ③ A–T·G–C, ⑤ 산소를 공유) 3 단백질의 단위체는 아미노산으로 약 20종, 핵산의 단위체는 뉴클레오타이드로 염기가 4종뿐이다. 이 단위체들이 반복 결합해 긴 사슬을 이루며, 배열 순서(염기 서열)가 달라지면 다른 물질이 되므로 경우의 수가 사실상 무한이 되어 다양한 단백질과 유전 정보가 만들어진다.", "answer": null, "explain": "단백질의 단위체는 아미노산으로 약 20종, 핵산의 단위체는 뉴클레오타이드로 염기가 4종뿐이다. 이 단위체들이 반복 결합해 긴 사슬을 이루며, 배열 순서(염기 서열)가 달라지면 다른 물질이 되므로 경우의 수가 사실상 무한이 되어 다양한 단백질과 유전 정보가 만들어진다."}, {"lessonId": "1205", "no": 1, "type": "오개념", "stem": "물질의 전기적 성질과 신소재에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["도체인 금속에는 자유롭게 움직이는 자유 전자가 많다.", "순수한 규소에 불순물을 소량 첨가하면 전기 전도성이 커진다.", "태양 전지는 빛에너지를 전기 에너지로 바꾼다.", "그래핀은 탄소 원자가 벌집 모양으로 한 층 배열된 물질이다.", "초전도체는 온도에 관계없이 전기 저항이 항상 0이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ⑤ (임계 온도 이하에서만 저항이 0이다) 2 ③ (① 반대 — 빛에 반응하고 전도성이 중간인 B가 첨가한 규소, ② 부도체는 자유 전자가 거의 없다, ④ 커진다, ⑤ 불순물 유무로 달라진다) 3 반도체는 불순물을 첨가하거나 온도가 높아지거나 빛을 받으면 전기 전도성이 커지는 등 조건에 따라 전도성을 바꿀 수 있다. 불순물로 전류를 흐르게 할지 말지를 정해 스위치를 만들면 컴퓨터가 되고, 온도·빛에 따른 전도성 변화를 읽으면 온도 센서·광센서가 된다.", "answer": 5, "explain": "임계 온도 이하에서만 저항이 0이다"}, {"lessonId": "1205", "no": 2, "type": "자료 해석", "stem": "다음은 물질 A~D의 전기적 특징을 조사한 자료다.", "source": "A: 전도성 <b>매우 큼<\/b>, 온도가 높아지면 조금 작아짐 B: <b>중간<\/b>, 빛을 비추면 커짐 C: <b>작음<\/b>, B와 같은 원소이나 첨가물 없음 D: <b>매우 작음<\/b>, 변화 없음A~D는 구리, 유리, 순수한 규소, 불순물을 첨가한 규소 중 하나이다.", "ask": "이 자료에 대한 해석으로 가장 적절한 것은?", "choices": ["B는 순수한 규소, C는 불순물을 첨가한 규소다.", "D는 자유 전자가 많아서 전기가 통하지 않는 유리다.", "A는 도체인 구리, B는 불순물을 첨가한 규소이며 B의 성질은 광센서·태양 전지의 원리가 된다.", "C에 빛을 비추면 전도성이 작아질 것이다.", "B와 C는 같은 원소이므로 전도성도 같아야 한다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ⑤ (임계 온도 이하에서만 저항이 0이다) 2 ③ (① 반대 — 빛에 반응하고 전도성이 중간인 B가 첨가한 규소, ② 부도체는 자유 전자가 거의 없다, ④ 커진다, ⑤ 불순물 유무로 달라진다) 3 반도체는 불순물을 첨가하거나 온도가 높아지거나 빛을 받으면 전기 전도성이 커지는 등 조건에 따라 전도성을 바꿀 수 있다. 불순물로 전류를 흐르게 할지 말지를 정해 스위치를 만들면 컴퓨터가 되고, 온도·빛에 따른 전도성 변화를 읽으면 온도 센서·광센서가 된다.", "answer": 3, "explain": "① 반대 — 빛에 반응하고 전도성이 중간인 B가 첨가한 규소, ② 부도체는 자유 전자가 거의 없다, ④ 커진다, ⑤ 불순물 유무로 달라진다"}, {"lessonId": "1205", "no": 3, "type": "서술형", "stem": "반도체가 '반쯤 통하는 물질'이 아니라 '조절되는 물질'이라 불리는 까닭을, 전도성을 바꾸는 <b>세 가지 조건<\/b>과 그 <b>활용 예<\/b>를 들어 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 불순물 첨가·온도 상승·빛 — 세 조건에서 모두 전도성이 커진다 → ② 불순물로 전류를 켜고 끄는 스위치를 만들어 컴퓨터가 된다 → ③ 온도·빛의 변화를 읽어 센서(온도 센서·광센서)로 쓴다<\/b>의 세 요소가 들어가야 한다. 방향을 '작아진다'로 쓰면 감점이다.", "answerLine": "정답 1 ⑤ (임계 온도 이하에서만 저항이 0이다) 2 ③ (① 반대 — 빛에 반응하고 전도성이 중간인 B가 첨가한 규소, ② 부도체는 자유 전자가 거의 없다, ④ 커진다, ⑤ 불순물 유무로 달라진다) 3 반도체는 불순물을 첨가하거나 온도가 높아지거나 빛을 받으면 전기 전도성이 커지는 등 조건에 따라 전도성을 바꿀 수 있다. 불순물로 전류를 흐르게 할지 말지를 정해 스위치를 만들면 컴퓨터가 되고, 온도·빛에 따른 전도성 변화를 읽으면 온도 센서·광센서가 된다.", "answer": null, "explain": "반도체는 불순물을 첨가하거나 온도가 높아지거나 빛을 받으면 전기 전도성이 커지는 등 조건에 따라 전도성을 바꿀 수 있다. 불순물로 전류를 흐르게 할지 말지를 정해 스위치를 만들면 컴퓨터가 되고, 온도·빛에 따른 전도성 변화를 읽으면 온도 센서·광센서가 된다."}, {"lessonId": "1301", "no": 1, "type": "오개념", "stem": "지구시스템에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["기권의 네 층은 높이에 따른 기온 변화로 구분한다.", "지권에서 부피가 가장 큰 층은 맨틀이며, 액체 상태인 층은 외핵이다.", "지진과 화산 활동의 에너지원은 태양 에너지이다.", "수권에서 가장 많은 것은 해수이고, 담수의 대부분은 빙하이다.", "물의 순환을 일으키는 근본 에너지원은 태양 에너지이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (지진·화산은 지구 내부 에너지) 2 ④ (① 태양, ② 수권→기권, ③ 해소를 돕는다, ⑤ 지권·생물권) 3 물은 태양 에너지로 증발해 구름이 되고 비·눈으로 내려 강과 지하수를 거쳐 바다로 돌아가며, 권역을 옮겨 다닐 뿐 지구 전체의 양은 거의 일정하다 — 물질은 순환한다. 반면 태양 에너지는 저위도에 남고 고위도에 모자라며, 대기와 해수의 순환이 이 남는 열을 저위도에서 고위도로 실어 나른다 — 에너지는 순환하지 않고 흐른다.", "answer": 3, "explain": "지진·화산은 지구 내부 에너지"}, {"lessonId": "1301", "no": 2, "type": "자료 해석", "stem": "다음은 태풍의 일생을 지구시스템의 눈으로 정리한 자료다.", "source": "발생: 따뜻한 바다에서 <b>수증기가 대량 증발<\/b>하며 에너지를 공급한다. 발달: 강한 바람과 <b>폭우<\/b>가 만들어진다. 상륙: 산사태와 침식이 일어난다. 소멸 후: 바닷물이 뒤섞이고, 강수가 물 부족을 해소하기도 한다.", "ask": "이 자료에 대한 해석으로 가장 적절한 것은?", "choices": ["태풍의 근본 에너지원은 지구 내부 에너지다.", "발생 단계는 기권에서 수권으로 물이 이동하는 상호작용이다.", "태풍은 지구의 에너지 불균형을 심화시킨다.", "근본 에너지원은 바닷물을 데운 태양이며, 태풍은 저위도의 남는 열을 고위도로 나르는 수송 방법이기도 하다.", "상륙 단계의 산사태는 기권과 외권의 상호작용이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (지진·화산은 지구 내부 에너지) 2 ④ (① 태양, ② 수권→기권, ③ 해소를 돕는다, ⑤ 지권·생물권) 3 물은 태양 에너지로 증발해 구름이 되고 비·눈으로 내려 강과 지하수를 거쳐 바다로 돌아가며, 권역을 옮겨 다닐 뿐 지구 전체의 양은 거의 일정하다 — 물질은 순환한다. 반면 태양 에너지는 저위도에 남고 고위도에 모자라며, 대기와 해수의 순환이 이 남는 열을 저위도에서 고위도로 실어 나른다 — 에너지는 순환하지 않고 흐른다.", "answer": 4, "explain": "① 태양, ② 수권→기권, ③ 해소를 돕는다, ⑤ 지권·생물권"}, {"lessonId": "1301", "no": 3, "type": "서술형", "stem": "\"물질은 순환하고 에너지는 흐른다\"는 말의 뜻을 <b>물의 순환<\/b>과 <b>대기·해수의 순환<\/b>을 예로 들어 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 물은 증발·강수·유출로 권역을 옮겨 다닐 뿐 지구 전체의 양은 거의 일정하다(순환) → ② 태양 에너지는 저위도에 남고 고위도에 모자란다 → ③ 대기와 해수의 순환이 그 열을 저위도에서 고위도로 실어 나른다(흐름)<\/b>의 세 요소가 들어가야 한다. 열의 방향을 반대로 쓰면 감점이다.", "answerLine": "정답 1 ③ (지진·화산은 지구 내부 에너지) 2 ④ (① 태양, ② 수권→기권, ③ 해소를 돕는다, ⑤ 지권·생물권) 3 물은 태양 에너지로 증발해 구름이 되고 비·눈으로 내려 강과 지하수를 거쳐 바다로 돌아가며, 권역을 옮겨 다닐 뿐 지구 전체의 양은 거의 일정하다 — 물질은 순환한다. 반면 태양 에너지는 저위도에 남고 고위도에 모자라며, 대기와 해수의 순환이 이 남는 열을 저위도에서 고위도로 실어 나른다 — 에너지는 순환하지 않고 흐른다.", "answer": null, "explain": "물은 태양 에너지로 증발해 구름이 되고 비·눈으로 내려 강과 지하수를 거쳐 바다로 돌아가며, 권역을 옮겨 다닐 뿐 지구 전체의 양은 거의 일정하다 — 물질은 순환한다. 반면 태양 에너지는 저위도에 남고 고위도에 모자라며, 대기와 해수의 순환이 이 남는 열을 저위도에서 고위도로 실어 나른다 — 에너지는 순환하지 않고 흐른다."}, {"lessonId": "1302", "no": 1, "type": "오개념", "stem": "판구조론에 대한 설명으로 <b>옳은<\/b> 것은?", "source": "", "ask": "", "choices": ["해령은 두 판이 모여드는 곳에 만들어지며, 여기서 판이 소멸한다.", "대륙판끼리 충돌하면 깊은 해구가 만들어진다.", "보존형 경계에서는 화산 활동이 활발하고 지진은 드물다.", "수렴형 경계에서는 밀도가 큰 해양판이 대륙판 아래로 섭입한다.", "우리나라는 판 내부에 있으므로 지진이 전혀 일어나지 않는다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (① 해령은 멀어지는 곳·생성, ② 습곡 산맥, ③ 화산 없이 지진만, ⑤ 드물지만 일어난다) 2 ② (① 반대, ③ 생성은 A, ④ 강한 지진은 B의 섭입대, ⑤ 지구 내부 에너지) 3 지권(해저)에서 지진이 일어나면 바닷물 전체가 밀려 지진 해일이 생기고, 이것이 수권을 거쳐 해안의 생물권으로 번져 건물과 마을, 생태계가 피해를 입는다 — 지권 → 수권 → 생물권의 연쇄다.", "answer": 4, "explain": "① 해령은 멀어지는 곳·생성, ② 습곡 산맥, ③ 화산 없이 지진만, ⑤ 드물지만 일어난다"}, {"lessonId": "1302", "no": 2, "type": "자료 해석", "stem": "다음은 어떤 지역의 판 경계 단면을 설명한 자료다.", "source": "A에서는 판이 <b>양쪽으로 멀어지며<\/b> 바다 밑 산맥이 있고, B에서는 <b>해양판이 대륙판 쪽으로 다가가 아래로 파고들며<\/b> 깊은 골짜기가 있다. 두 곳 모두 지진이 나고, 화산도 두 곳 부근에 있다.", "ask": "이 자료에 대한 해석으로 가장 적절한 것은?", "choices": ["A는 해구, B는 해령이다.", "A에서 판이 생성되고 B에서 소멸하므로 지구의 크기는 거의 일정하다.", "B에서 새로운 해양 지각이 만들어진다.", "깊은 곳까지 이어지는 강한 지진은 A 쪽에서 일어난다.", "A와 B의 판 이동을 일으키는 에너지원은 태양 에너지다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (① 해령은 멀어지는 곳·생성, ② 습곡 산맥, ③ 화산 없이 지진만, ⑤ 드물지만 일어난다) 2 ② (① 반대, ③ 생성은 A, ④ 강한 지진은 B의 섭입대, ⑤ 지구 내부 에너지) 3 지권(해저)에서 지진이 일어나면 바닷물 전체가 밀려 지진 해일이 생기고, 이것이 수권을 거쳐 해안의 생물권으로 번져 건물과 마을, 생태계가 피해를 입는다 — 지권 → 수권 → 생물권의 연쇄다.", "answer": 2, "explain": "① 반대, ③ 생성은 A, ④ 강한 지진은 B의 섭입대, ⑤ 지구 내부 에너지"}, {"lessonId": "1302", "no": 3, "type": "서술형", "stem": "해저에서 큰 지진이 일어났을 때 그 영향이 지구시스템의 다른 권역으로 번지는 과정을 <b>'어느 권역에서 → 무엇이 → 어느 권역으로 → 그 결과'<\/b>의 순서로 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 지권(해저)에서 지진이 일어나 → ② 바닷물 전체가 밀려 지진 해일이 → ③ 수권을 거쳐 해안(생물권)으로 → ④ 건물·사람·생태계가 피해를 입는다<\/b>의 네 칸이 순서대로 채워져야 한다. 권역 이름 없이 '쓰나미가 온다'고만 쓰면 절반의 답이다.", "answerLine": "정답 1 ④ (① 해령은 멀어지는 곳·생성, ② 습곡 산맥, ③ 화산 없이 지진만, ⑤ 드물지만 일어난다) 2 ② (① 반대, ③ 생성은 A, ④ 강한 지진은 B의 섭입대, ⑤ 지구 내부 에너지) 3 지권(해저)에서 지진이 일어나면 바닷물 전체가 밀려 지진 해일이 생기고, 이것이 수권을 거쳐 해안의 생물권으로 번져 건물과 마을, 생태계가 피해를 입는다 — 지권 → 수권 → 생물권의 연쇄다.", "answer": null, "explain": "지권(해저)에서 지진이 일어나면 바닷물 전체가 밀려 지진 해일이 생기고, 이것이 수권을 거쳐 해안의 생물권으로 번져 건물과 마을, 생태계가 피해를 입는다 — 지권 → 수권 → 생물권의 연쇄다."}, {"lessonId": "1303", "no": 1, "type": "오개념", "stem": "중력과 운동에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["달에서는 물체의 무게가 지구의 약 1/6이 되지만 질량은 같다.", "자유 낙하 하는 물체의 속력은 1초에 약 9.8 m/s씩 증가한다.", "궤도를 도는 인공위성에는 중력이 작용하지 않는다.", "공기 저항이 없으면 깃털과 쇠구슬은 동시에 바닥에 닿는다.", "수평으로 던진 공은 수평 방향으로 등속 운동을 한다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (중력이 작용해서 돈다 — 없으면 직선으로 날아간다) 2 ④ (① 동시, ② 중력을 받아 낙하, ③ 시간은 높이가 정한다, ⑤ 점점 빨라지기 때문) 3 인공위성은 중력을 받아 끊임없이 지구 쪽으로 낙하하는 중이다. 그러나 수평 속력이 충분히 커서, 떨어지는 정도와 둥근 지구 표면이 휘어져 멀어지는 정도가 같으므로 계속 떨어지면서도 지면에 닿지 않고 지구 주위를 돈다.", "answer": 3, "explain": "중력이 작용해서 돈다 — 없으면 직선으로 날아간다"}, {"lessonId": "1303", "no": 2, "type": "자료 해석", "stem": "다음은 같은 높이에서 공 A는 가만히 놓고 공 B는 수평으로 던져 일정한 시간 간격으로 찍은 사진을 설명한 자료다.", "source": "같은 시각의 A와 B는 언제나 <b>같은 높이<\/b>에 있다. B의 <b>수평 간격은 일정<\/b>하고, 두 공 모두 <b>연직 간격은 점점 벌어진다<\/b>.", "ask": "이 자료에 대한 해석으로 가장 적절한 것은?", "choices": ["B는 A보다 늦게 바닥에 닿는다.", "B는 연직 방향으로 힘을 받지 않는다.", "B를 더 세게 던지면 낙하 시간이 길어진다.", "B의 연직 운동은 A와 같은 자유 낙하이고, 수평 운동은 등속이므로 두 공은 동시에 닿는다.", "연직 간격이 벌어지는 것은 낙하 속력이 일정하기 때문이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (중력이 작용해서 돈다 — 없으면 직선으로 날아간다) 2 ④ (① 동시, ② 중력을 받아 낙하, ③ 시간은 높이가 정한다, ⑤ 점점 빨라지기 때문) 3 인공위성은 중력을 받아 끊임없이 지구 쪽으로 낙하하는 중이다. 그러나 수평 속력이 충분히 커서, 떨어지는 정도와 둥근 지구 표면이 휘어져 멀어지는 정도가 같으므로 계속 떨어지면서도 지면에 닿지 않고 지구 주위를 돈다.", "answer": 4, "explain": "① 동시, ② 중력을 받아 낙하, ③ 시간은 높이가 정한다, ⑤ 점점 빨라지기 때문"}, {"lessonId": "1303", "no": 3, "type": "서술형", "stem": "인공위성이 지면에 떨어지지 않고 지구 주위를 도는 까닭을 <b>'낙하'<\/b>와 <b>'수평 속력'<\/b>을 사용하여 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 위성은 중력을 받아 끊임없이 낙하하는 중이다 → ② 수평 속력이 충분히 커서 떨어지는 정도와 둥근 지구 표면이 휘어져 멀어지는 정도가 같다 → ③ 그래서 계속 떨어지면서도 지면에 닿지 않고 돈다<\/b>의 세 요소가 들어가야 한다. '무중력이라 떠 있다'고 쓰면 오답이다.", "answerLine": "정답 1 ③ (중력이 작용해서 돈다 — 없으면 직선으로 날아간다) 2 ④ (① 동시, ② 중력을 받아 낙하, ③ 시간은 높이가 정한다, ⑤ 점점 빨라지기 때문) 3 인공위성은 중력을 받아 끊임없이 지구 쪽으로 낙하하는 중이다. 그러나 수평 속력이 충분히 커서, 떨어지는 정도와 둥근 지구 표면이 휘어져 멀어지는 정도가 같으므로 계속 떨어지면서도 지면에 닿지 않고 지구 주위를 돈다.", "answer": null, "explain": "인공위성은 중력을 받아 끊임없이 지구 쪽으로 낙하하는 중이다. 그러나 수평 속력이 충분히 커서, 떨어지는 정도와 둥근 지구 표면이 휘어져 멀어지는 정도가 같으므로 계속 떨어지면서도 지면에 닿지 않고 지구 주위를 돈다."}, {"lessonId": "1304", "no": 1, "type": "오개념", "stem": "관성·운동량·충격량에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["달리던 버스가 급정거하면 승객의 몸은 앞으로 쏠린다.", "질량 2 kg인 공이 3 m/s로 구를 때 운동량의 크기는 6 kg·m/s이다.", "물체가 받은 충격량은 그 물체의 운동량 변화량과 같다.", "속력이 같다면 질량과 관계없이 운동량은 같다.", "충격량이 같을 때 충돌 시간이 길수록 물체가 받는 평균 힘은 작다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (같은 속력이면 질량이 클수록 운동량이 크다) 2 ③ (① 넓이가 같으므로 충격량 같음, ② 변화량도 같음, ④ (나)가 길다, ⑤ 넓이는 충격량) 3 착지할 때 몸의 운동량 변화량, 즉 충격량은 정해져 있다. 무릎을 굽히면 몸이 멈추는 데 걸리는 충돌 시간이 길어지므로, 같은 충격량이 긴 시간에 나뉘어 몸이 받는 힘이 작아진다.", "answer": 4, "explain": "같은 속력이면 질량이 클수록 운동량이 크다"}, {"lessonId": "1304", "no": 2, "type": "자료 해석", "stem": "다음은 같은 높이에서 떨어진 같은 공이 (가) 딱딱한 바닥, (나) 푹신한 매트에 충돌할 때 받는 힘을 시간에 따라 나타낸 그래프를 설명한 자료다.", "source": "두 그래프 아래의 <b>넓이는 같다<\/b>. (가)의 봉우리는 <b>높고 좁으며<\/b>, (나)의 봉우리는 <b>낮고 넓다<\/b>.", "ask": "이 자료에 대한 해석으로 가장 적절한 것은?", "choices": ["공이 받은 충격량은 (가)가 (나)보다 크다.", "공의 운동량 변화량은 (나)가 (가)보다 크다.", "충격량은 같고, 충돌 시간이 긴 (나)에서 공이 받는 최대 힘이 작다.", "충돌 시간은 (가)가 (나)보다 길다.", "그래프 아래의 넓이는 충돌 시간을 나타낸다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (같은 속력이면 질량이 클수록 운동량이 크다) 2 ③ (① 넓이가 같으므로 충격량 같음, ② 변화량도 같음, ④ (나)가 길다, ⑤ 넓이는 충격량) 3 착지할 때 몸의 운동량 변화량, 즉 충격량은 정해져 있다. 무릎을 굽히면 몸이 멈추는 데 걸리는 충돌 시간이 길어지므로, 같은 충격량이 긴 시간에 나뉘어 몸이 받는 힘이 작아진다.", "answer": 3, "explain": "① 넓이가 같으므로 충격량 같음, ② 변화량도 같음, ④ (나)가 길다, ⑤ 넓이는 충격량"}, {"lessonId": "1304", "no": 3, "type": "서술형", "stem": "높은 곳에서 뛰어내려 착지할 때 무릎을 굽히면 덜 다치는 까닭을 <b>'충돌 시간'<\/b>과 <b>'힘'<\/b>을 사용하여 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 착지할 때 몸의 운동량 변화량(충격량)은 정해져 있다 → ② 무릎을 굽히면 멈추는 데 걸리는 충돌 시간이 길어진다 → ③ 같은 충격량이 긴 시간에 나뉘므로 몸이 받는 힘이 작아진다<\/b>의 세 요소가 들어가야 한다. '충격량이 줄어든다'고 쓰면 오답이다.", "answerLine": "정답 1 ④ (같은 속력이면 질량이 클수록 운동량이 크다) 2 ③ (① 넓이가 같으므로 충격량 같음, ② 변화량도 같음, ④ (나)가 길다, ⑤ 넓이는 충격량) 3 착지할 때 몸의 운동량 변화량, 즉 충격량은 정해져 있다. 무릎을 굽히면 몸이 멈추는 데 걸리는 충돌 시간이 길어지므로, 같은 충격량이 긴 시간에 나뉘어 몸이 받는 힘이 작아진다.", "answer": null, "explain": "착지할 때 몸의 운동량 변화량, 즉 충격량은 정해져 있다. 무릎을 굽히면 몸이 멈추는 데 걸리는 충돌 시간이 길어지므로, 같은 충격량이 긴 시간에 나뉘어 몸이 받는 힘이 작아진다."}, {"lessonId": "1305", "no": 1, "type": "오개념", "stem": "생명 시스템과 화학 반응에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["생명 시스템의 기본 단위는 세포이며, 세포 → 조직 → 기관 → 개체로 구성된다.", "세포 호흡은 포도당을 분해해 에너지를 방출하는 이화 작용이다.", "효소는 활성화 에너지를 낮추어 반응을 빠르게 하며, 반응 후 소모되지 않는다.", "세포막은 물질의 종류와 관계없이 모든 물질을 통과시킨다.", "물질대사는 연소와 달리 체온 정도의 온도에서 여러 단계로 진행된다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (선택적 투과성 — 물질을 가려 통과시킨다) 2 ③ (① 거품은 과산화수소가 분해되어 생긴 산소, ② 있지만 변성됨, ④ 느리게 분해된다, ⑤ 대조군으로 필요) 3 선택적 투과성. 산소처럼 작은 분자는 인지질 2중층 사이를 직접 빠져나가지만, 포도당처럼 크기가 큰 분자는 인지질 사이를 지나지 못해 막단백질이 만든 통로로만 드나들기 때문이다.", "answer": 4, "explain": "선택적 투과성 — 물질을 가려 통과시킨다"}, {"lessonId": "1305", "no": 2, "type": "자료 해석", "stem": "다음은 묽은 과산화수소수를 담은 세 시험관에 (가) 생감자, (나) 삶은 감자를 넣고 (다)에는 아무것도 넣지 않은 실험 결과를 설명한 자료다.", "source": "(가)에서만 거품이 <b>활발하게<\/b> 발생했고, (나)와 (다)에서는 거품이 <b>거의 없었다<\/b>. 감자에는 과산화수소를 물과 산소로 분해하는 효소 카탈레이스가 들어 있다.", "ask": "이 자료에 대한 해석으로 가장 적절한 것은?", "choices": ["(가)의 거품은 카탈레이스가 분해되어 생긴 기체다.", "(나)의 감자에는 카탈레이스가 들어 있지 않다.", "삶은 감자의 카탈레이스는 열로 구조가 변해 촉매 기능을 잃었다.", "(다)를 보면 과산화수소는 효소 없이는 전혀 분해되지 않는다.", "(다)는 실험에 필요 없는 시험관이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (선택적 투과성 — 물질을 가려 통과시킨다) 2 ③ (① 거품은 과산화수소가 분해되어 생긴 산소, ② 있지만 변성됨, ④ 느리게 분해된다, ⑤ 대조군으로 필요) 3 선택적 투과성. 산소처럼 작은 분자는 인지질 2중층 사이를 직접 빠져나가지만, 포도당처럼 크기가 큰 분자는 인지질 사이를 지나지 못해 막단백질이 만든 통로로만 드나들기 때문이다.", "answer": 3, "explain": "① 거품은 과산화수소가 분해되어 생긴 산소, ② 있지만 변성됨, ④ 느리게 분해된다, ⑤ 대조군으로 필요"}, {"lessonId": "1305", "no": 3, "type": "서술형", "stem": "산소는 세포막을 직접 통과하지만 포도당은 막단백질 통로를 통해서만 드나든다. 이런 세포막의 성질을 무엇이라 하는지 쓰고, 그 까닭을 <b>'인지질 2중층'<\/b>과 <b>'크기'<\/b>를 사용하여 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 선택적 투과성 → ② 산소처럼 작은 분자는 인지질 2중층 사이를 직접 빠져나간다 → ③ 포도당처럼 큰 분자는 인지질 사이를 지나지 못해 막단백질 통로로만 드나든다<\/b>의 세 요소가 들어가야 한다. '세포막이 모든 물질을 통과시킨다'고 쓰면 오답이다.", "answerLine": "정답 1 ④ (선택적 투과성 — 물질을 가려 통과시킨다) 2 ③ (① 거품은 과산화수소가 분해되어 생긴 산소, ② 있지만 변성됨, ④ 느리게 분해된다, ⑤ 대조군으로 필요) 3 선택적 투과성. 산소처럼 작은 분자는 인지질 2중층 사이를 직접 빠져나가지만, 포도당처럼 크기가 큰 분자는 인지질 사이를 지나지 못해 막단백질이 만든 통로로만 드나들기 때문이다.", "answer": null, "explain": "선택적 투과성. 산소처럼 작은 분자는 인지질 2중층 사이를 직접 빠져나가지만, 포도당처럼 크기가 큰 분자는 인지질 사이를 지나지 못해 막단백질이 만든 통로로만 드나들기 때문이다."}, {"lessonId": "1306", "no": 1, "type": "오개념", "stem": "유전자에서 단백질까지의 과정에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["크기 순서는 염색체 ⊃ DNA ⊃ 유전자이다.", "유전 정보의 실체는 DNA 염기의 순서(서열)이다.", "전사는 라이보솜에서, 번역은 핵 안에서 일어난다.", "RNA에는 타이민(T) 대신 유라실(U)이 들어간다.", "형질을 실제로 나타내는 일꾼은 단백질이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (전사는 핵 안, 번역은 라이보솜) 2 ① (TAC → AUG, CAC → GUG, GTA → CAU. 염기 9개 ÷ 3 = 아미노산 3개) 3 염기는 4종류이므로 두 개씩 묶으면 4 × 4 = 16가지뿐이라 아미노산 20종류를 지정하기에 부족하다. 세 개씩 묶으면 4 × 4 × 4 = 64가지가 되어 20종류를 모두 지정하고도 남기 때문이다.", "answer": 3, "explain": "전사는 핵 안, 번역은 라이보솜"}, {"lessonId": "1306", "no": 2, "type": "자료 해석", "stem": "다음은 어떤 유전자의 DNA 주형 가닥 일부와 코돈표 일부를 설명한 자료다.", "source": "DNA 주형 가닥: <b>T A C – C A C – G T A<\/b> · 코돈표(RNA 기준): AUG = 메싸이오닌, GUG = 발린, CAU = 히스티딘", "ask": "이 유전자로부터 만들어지는 아미노산 서열로 옳은 것은?", "choices": ["메싸이오닌 – 발린 – 히스티딘", "히스티딘 – 발린 – 메싸이오닌", "메싸이오닌 – 히스티딘 – 발린", "발린 – 메싸이오닌 – 히스티딘", "아미노산 9개가 만들어진다"], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (전사는 핵 안, 번역은 라이보솜) 2 ① (TAC → AUG, CAC → GUG, GTA → CAU. 염기 9개 ÷ 3 = 아미노산 3개) 3 염기는 4종류이므로 두 개씩 묶으면 4 × 4 = 16가지뿐이라 아미노산 20종류를 지정하기에 부족하다. 세 개씩 묶으면 4 × 4 × 4 = 64가지가 되어 20종류를 모두 지정하고도 남기 때문이다.", "answer": 1, "explain": "TAC → AUG, CAC → GUG, GTA → CAU. 염기 9개 ÷ 3 = 아미노산 3개"}, {"lessonId": "1306", "no": 3, "type": "서술형", "stem": "생명이 염기를 두 개가 아니라 <b>세 개씩<\/b> 묶어 아미노산을 지정하는 까닭을 '염기 4종류'와 '아미노산 20종류'를 사용하여 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>① 염기는 4종류이므로 두 개씩 묶으면 4 × 4 = 16가지뿐이다 → ② 아미노산 20종류를 지정하기에 부족하다 → ③ 세 개씩 묶으면 4 × 4 × 4 = 64가지로 20종류를 지정하고도 남는다<\/b>의 세 요소가 들어가야 한다. 2번은 전사 먼저(A의 짝은 U), 그다음 표 — 순서를 지키면 틀릴 수 없다.", "answerLine": "정답 1 ③ (전사는 핵 안, 번역은 라이보솜) 2 ① (TAC → AUG, CAC → GUG, GTA → CAU. 염기 9개 ÷ 3 = 아미노산 3개) 3 염기는 4종류이므로 두 개씩 묶으면 4 × 4 = 16가지뿐이라 아미노산 20종류를 지정하기에 부족하다. 세 개씩 묶으면 4 × 4 × 4 = 64가지가 되어 20종류를 모두 지정하고도 남기 때문이다.", "answer": null, "explain": "염기는 4종류이므로 두 개씩 묶으면 4 × 4 = 16가지뿐이라 아미노산 20종류를 지정하기에 부족하다. 세 개씩 묶으면 4 × 4 × 4 = 64가지가 되어 20종류를 모두 지정하고도 남기 때문이다."}, {"lessonId": "2101", "no": 1, "type": "오개념", "stem": "지질시대와 화석에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["지질시대는 지층 속 화석의 급격한 변화를 기준으로 나눈다.", "지구의 역사에서 선캄브리아 시대가 약 88 %를 차지한다.", "표준 화석은 생존 기간이 짧고 분포가 넓은 생물의 화석이다.", "시상 화석은 지층이 쌓인 <b>시대<\/b>를 알려 준다.", "규모가 가장 컸던 대멸종은 고생대 말에 일어났다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (시상 화석은 시대가 아니라 환경을 알려 준다) 2 ② (삼엽충 = 고생대, 산호 = 따뜻하고 얕은 바다) 3 남세균의 광합성으로 산소가 늘고, 그 일부가 상공에서 오존층을 이루어 자외선을 막아 주면서 생물이 육지로 진출하였다.", "answer": 4, "explain": "시상 화석은 시대가 아니라 환경을 알려 준다"}, {"lessonId": "2101", "no": 2, "type": "자료 해석", "stem": "다음은 어느 지층에서 발견된 화석에 대한 자료다.", "source": "한 지층에서 <b>삼엽충<\/b> 화석과 <b>산호<\/b> 화석이 함께 발견되었다.", "ask": "이 지층에 대한 추론으로 가장 적절한 것은?", "choices": ["중생대에 쌓였으며, 당시 환경은 깊고 차가운 바다였다.", "고생대에 쌓였으며, 당시 환경은 따뜻하고 얕은 바다였다.", "신생대에 쌓였으며, 당시 환경은 따뜻하고 습한 육지였다.", "쌓인 시대는 알 수 있으나 당시 환경은 알 수 없다.", "당시 환경은 알 수 있으나 쌓인 시대는 알 수 없다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (시상 화석은 시대가 아니라 환경을 알려 준다) 2 ② (삼엽충 = 고생대, 산호 = 따뜻하고 얕은 바다) 3 남세균의 광합성으로 산소가 늘고, 그 일부가 상공에서 오존층을 이루어 자외선을 막아 주면서 생물이 육지로 진출하였다.", "answer": 2, "explain": "삼엽충 = 고생대, 산호 = 따뜻하고 얕은 바다"}, {"lessonId": "2101", "no": 3, "type": "서술형", "stem": "생물이 육지로 진출할 수 있게 된 과정을 <b>광합성 · 산소 · 오존층 · 자외선<\/b>을 모두 사용하여 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>광합성 → 산소 증가 → 오존층 형성 → 자외선 차단 → 육상 진출<\/b>의 사슬이 순서대로 들어가야 한다. 오존층만 쓰고 산소의 출처(광합성)를 빠뜨리면 절반의 답이다.", "answerLine": "정답 1 ④ (시상 화석은 시대가 아니라 환경을 알려 준다) 2 ② (삼엽충 = 고생대, 산호 = 따뜻하고 얕은 바다) 3 남세균의 광합성으로 산소가 늘고, 그 일부가 상공에서 오존층을 이루어 자외선을 막아 주면서 생물이 육지로 진출하였다.", "answer": null, "explain": "남세균의 광합성으로 산소가 늘고, 그 일부가 상공에서 오존층을 이루어 자외선을 막아 주면서 생물이 육지로 진출하였다."}, {"lessonId": "2102", "no": 1, "type": "오개념", "stem": "항생제 내성 세균이 늘어나는 과정에 대한 설명으로 <b>옳은<\/b> 것은?", "source": "", "ask": "", "choices": ["내성 세균은 항생제를 투여한 뒤에 처음 생겨난다.", "항생제가 세균에게 내성이라는 새로운 변이를 만들어 준다.", "내성 변이는 항생제를 쓰기 전부터 집단 안에 있었다.", "내성은 약을 먹은 사람의 몸이 얻게 되는 성질이다.", "한 마리의 세균이 일생 동안 몸을 바꾸어 내성을 얻는다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (변이가 먼저, 선택은 나중) 2 ⑤ (개체 수와 유전적 다양성은 다르다) 3 과잉 생산된 자손 사이에 변이가 있고, 생존 경쟁에서 환경에 유리한 변이를 가진 개체가 살아남아 자손을 남기며, 세대가 쌓이면서 집단의 형질 구성이 바뀐다.", "answer": 3, "explain": "변이가 먼저, 선택은 나중"}, {"lessonId": "2102", "no": 2, "type": "자료 해석", "stem": "다음은 바나나 재배에 대한 자료다.", "source": "세계에서 수출되는 바나나의 대부분을 차지하는 캐번디시 품종은 씨가 아니라 <b>꺾꽂이<\/b>로 늘린다. 개체 수는 매우 많지만, 한 곰팡이병이 번지자 농장 전체가 한꺼번에 시들었다.", "ask": "이 사례를 설명한 것으로 가장 적절한 것은?", "choices": ["개체 수가 매우 많으므로 유전적 다양성도 높다.", "종 다양성이 지나치게 높아서 생긴 문제다.", "생태계 다양성이 높을수록 이런 피해가 커진다.", "곰팡이병이 퍼지는 동안 새로운 변이가 생겨났기 때문이다.", "유전적으로 거의 같은 집단이어서 한 질병에 함께 무너졌다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (변이가 먼저, 선택은 나중) 2 ⑤ (개체 수와 유전적 다양성은 다르다) 3 과잉 생산된 자손 사이에 변이가 있고, 생존 경쟁에서 환경에 유리한 변이를 가진 개체가 살아남아 자손을 남기며, 세대가 쌓이면서 집단의 형질 구성이 바뀐다.", "answer": 5, "explain": "개체 수와 유전적 다양성은 다르다"}, {"lessonId": "2102", "no": 3, "type": "서술형", "stem": "자연선택으로 집단이 변해 가는 과정을 <b>과잉 생산 · 변이 · 생존 경쟁<\/b>을 사용하여 서술하고, 이때 변하는 것이 <b>개체<\/b>인지 <b>집단<\/b>인지 밝히시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 ① 필요보다 많은 자손이 태어나고 ② 그 안에 변이가 있으며 ③ 환경에 유리한 변이가 살아남아 자손을 남긴다 — 세 단계를 순서대로 쓰고, 변하는 것은 <b>세대를 거친 집단<\/b>이라고 밝혀야 한다.", "answerLine": "정답 1 ③ (변이가 먼저, 선택은 나중) 2 ⑤ (개체 수와 유전적 다양성은 다르다) 3 과잉 생산된 자손 사이에 변이가 있고, 생존 경쟁에서 환경에 유리한 변이를 가진 개체가 살아남아 자손을 남기며, 세대가 쌓이면서 집단의 형질 구성이 바뀐다.", "answer": null, "explain": "과잉 생산된 자손 사이에 변이가 있고, 생존 경쟁에서 환경에 유리한 변이를 가진 개체가 살아남아 자손을 남기며, 세대가 쌓이면서 집단의 형질 구성이 바뀐다."}, {"lessonId": "2103", "no": 1, "type": "오개념", "stem": "산화·환원 반응에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["물질이 산소를 얻으면 산화, 잃으면 환원이다.", "한 반응에서 산화만 단독으로 일어나는 경우가 있다.", "철이 녹슬어 산화 철이 되는 것은 산화이다.", "광합성에서 이산화 탄소는 산소를 잃고 환원된다.", "전자를 잃으면 산화, 얻으면 환원이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ② (산소를 얻은 물질이 있으면 잃은 물질이 반드시 있다) 2 ④ (구리는 전자를 잃어 산화, 은 이온은 전자를 얻어 환원 — 산소 없이 전자만 옮겨도 산화·환원이다. 푸른색은 구리 이온) 3 산화 철은 산소를 잃으므로 환원되고, 코크스는 그 산소를 얻으므로 산화된다 — 산소가 한쪽에서 다른 쪽으로 옮겨 간 것이다.", "answer": 2, "explain": "산소를 얻은 물질이 있으면 잃은 물질이 반드시 있다"}, {"lessonId": "2103", "no": 2, "type": "자료 해석", "stem": "다음은 금속과 금속 이온의 반응에 대한 실험이다.", "source": "무색인 질산 은 수용액에 <b>구리줄<\/b>을 넣었더니, 구리줄 표면에 은백색 물질이 붙고 용액이 점점 <b>푸르게<\/b> 변하였다.", "ask": "이 반응에 대한 설명으로 옳은 것은?", "choices": ["구리는 전자를 얻어 환원된다.", "은 이온은 전자를 잃어 산화된다.", "용액이 푸르게 변한 것은 은 이온 때문이다.", "구리는 산화되고, 은 이온은 환원된다.", "산소가 이동하지 않으므로 산화·환원 반응이 아니다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ② (산소를 얻은 물질이 있으면 잃은 물질이 반드시 있다) 2 ④ (구리는 전자를 잃어 산화, 은 이온은 전자를 얻어 환원 — 산소 없이 nId": "2104", "no": 3, "type": "서술형", "stem": "속이 쓰릴 때 제산제를 먹으면 증상이 가라앉는 까닭을, <b>위산의 성질<\/b>과 <b>중화 반응<\/b>을 사용하여 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 위산이 <b>산성<\/b>, 제산제가 <b>염기성<\/b>이라는 점과 H<sup>+<\/sup>·OH<sup>−<\/sup>가 만나 물이 된다는 점이 모두 있어야 한다.", "answerLine": "정답 1 ⑤ (금속·대리석과 반응하는 것은 산만의 성질) 2 ① (완전 중화점에서 온도 최고, 전체 이온 수는 일정) 3 위산은 산성이므로 염기성인 제산제를 넣으면 H⁺과 OH⁻가 만나 물이 되는 중화 반응이 일어나 산성이 약해진다.", "answer": null, "explain": "위산은 산성이므로 염기성인 제산제를 넣으면 H<sup>+<\/sup>과 OH<sup>−<\/sup>가 만나 물이 되는 중화 반응이 일어나 산성이 약해진다."}, {"lessonId": "2105", "no": 1, "type": "오개념", "stem": "화학 반응의 에너지 출입에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["세포 호흡은 주위의 열을 흡수하는 흡열 반응이다.", "광합성은 빛에너지를 흡수하여 저장하는 흡열 반응이다.", "손난로는 철이 산소와 결합할 때 나오는 열을 이용한다.", "순간 냉각 팩은 질산 암모늄이 물에 녹을 때의 흡열을 이용한다.", "발열인지 흡열인지는 주위의 온도 변화로 판정한다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ① (세포 호흡은 체온을 만드는 발열 반응) 2 ③ (나무판이 언 것은 B가 열을 흡수했기 때문) 3 주위의 온도가 올라가면 발열 반응(손난로), 내려가면 흡열 반응(순간 냉각 팩)이다.", "answer": 1, "explain": "세포 호흡은 체온을 만드는 발열 반응"}, {"lessonId": "2105", "no": 2, "type": "자료 해석", "stem": "다음은 두 가지 물질을 물에 녹인 실험이다.", "source": "비커 A와 B에 각각 다른 물질을 물에 녹이고 주위의 온도를 측정하였다. <b>A<\/b>의 온도 곡선은 처음 온도(기준선)보다 <b>위로<\/b> 올라갔고, <b>B<\/b>는 <b>아래로<\/b> 내려갔다. B를 올려 둔 젖은 나무판에는 얼음이 얼어붙었다.", "ask": "A와 B에 대한 설명으로 옳은 것은?", "choices": ["A는 흡열 반응, B는 발열 반응이다.", "A와 B는 모두 주위의 열을 흡수한다.", "A는 발열 반응, B는 흡열 반응이다.", "B는 주위로 열을 내놓았기 때문에 나무판이 얼어붙었다.", "발열·흡열의 판정 기준은 반응 자신의 온도 변화이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ① (세포 호흡은 체온을 만드는 발열 반응) 2 ③ (나무판이 언 것은 B가 열을 흡수했기 때문) 3 주위의 온도가 올라가면 발열 반응(손난로), 내려가면 흡열 반응(순간 냉각 팩)이다.", "answer": 3, "explain": "나무판이 언 것은 B가 열을 흡수했기 때문"}, {"lessonId": "2105", "no": 3, "type": "서술형", "stem": "발열 반응과 흡열 반응을 <b>주위의 온도 변화<\/b>를 기준으로 구분하고, 각각을 이용한 생활 속 도구를 하나씩 들어 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 판정 기준을 <b>주위<\/b>의 온도로 쓰는 것이 핵심이다. 반응 자신의 온도라고 쓰면 기준이 틀린 답이다. 사례는 발열 = 손난로·발열 도시락, 흡열 = 순간 냉각 팩.", "answerLine": "정답 1 ① (세포 호흡은 체온을 만드는 발열 반응) 2 ③ (나무판이 언 것은 B가 열을 흡수했기 때문) 3 주위의 온도가 올라가면 발열 반응(손난로), 내려가면 흡열 반응(순간 냉각 팩)이다.", "answer": null, "explain": "주위의 온도가 올라가면 발열 반응(손난로), 내려가면 흡열 반응(순간 냉각 팩)이다."}, {"lessonId": "2201", "no": 1, "type": "오개념", "stem": "생태계의 구성에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["개체군은 한 지역에 사는 <b>같은 종<\/b>의 무리다.", "군집은 여러 종의 개체군이 모인 것이며, 생물만 포함한다.", "생태계는 군집과 비생물적 요인을 합친 것이다.", "버섯은 광합성으로 스스로 양분을 만드는 생산자다.", "세균은 크기가 작아도 살아 있으므로 생물적 요인이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (버섯은 광합성을 못 하는 분해자) 2 ② (양엽은 두껍고, 음엽은 넓고 얇다) 3 환경 → 생물: 물이 부족한 사막에서 선인장의 잎이 가시로 변했다. 생물 → 환경: 남세균의 광합성이 대기에 산소를 늘렸다.", "answer": 4, "explain": "버섯은 광합성을 못 하는 분해자"}, {"lessonId": "2201", "no": 2, "type": "자료 해석", "stem": "다음은 한 그루의 나무에서 딴 잎을 비교한 자료다.", "source": "햇빛을 많이 받는 <b>위쪽 잎 A<\/b>는 좁고 두꺼웠고, 그늘진 <b>아래쪽 잎 B<\/b>는 넓고 얇았다.", "ask": "이 자료에 대한 설명으로 옳은 것은?", "choices": ["A는 음엽, B는 양엽이다.", "빛이라는 비생물적 요인에 적응한 결과이다.", "온도 차이에 적응한 결과이다.", "잎이 환경을 바꾼 '생물 → 환경'의 사례이다.", "자라면서 생긴 차이이므로 적응이라 할 수 없다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (버섯은 광합성을 못 하는 분해자) 2 ② (양엽은 두껍고, 음엽은 넓고 얇다) 3 환경 → 생물: 물이 부족한 사막에서 선인장의 잎이 가시로 변했다. 생물 → 환경: 남세균의 광합성이 대기에 산소를 늘렸다.", "answer": 2, "explain": "양엽은 두껍고, 음엽은 넓고 얇다"}, {"lessonId": "2201", "no": 3, "type": "서술형", "stem": "생물과 환경이 서로 영향을 주고받는다는 것을, <b>환경 → 생물<\/b>과 <b>생물 → 환경<\/b>의 사례를 하나씩 들어 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>화살표의 방향<\/b>이 채점의 전부다. 환경 → 생물은 적응(선인장의 가시, 여우의 귀), 생물 → 환경은 개조(광합성이 만든 산소 대기, 지렁이와 토양)로 방향이 서로 반대여야 한다.", "answerLine": "정답 1 ④ (버섯은 광합성을 못 하는 분해자) 2 ② (양엽은 두껍고, 음엽은 넓고 얇다) 3 환경 → 생물: 물이 부족한 사막에서 선인장의 잎이 가시로 변했다. 생물 → 환경: 남세균의 광합성이 대기에 산소를 늘렸다.", "answer": null, "explain": "환경 → 생물: 물이 부족한 사막에서 선인장의 잎이 가시로 변했다. 생물 → 환경: 남세균의 광합성이 대기에 산소를 늘렸다."}, {"lessonId": "2202", "no": 1, "type": "오개념", "stem": "먹이 관계와 생태 피라미드에 대한 설명으로 <b>옳은<\/b> 것은?", "source": "", "ask": "", "choices": ["먹이 사슬의 화살표는 먹는 생물에서 먹히는 생물로 향한다.", "먹이 그물이 단순할수록 생태계는 안정적이다.", "생태 피라미드가 위로 갈수록 좁아지는 것은 에너지가 손실되기 때문이다.", "각 영양 단계는 받은 에너지를 모두 위 단계로 전달한다.", "생태계 평형은 개체 수가 전혀 변하지 않는 정지 상태다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (화살표는 먹히는 쪽에서 먹는 쪽으로, 그물이 복잡할수록 안정, 에너지는 단계마다 일부만 전달, 평형은 변동 속의 회복) 2 ⑤ (한 칸 건너뛴 방향 착오에 주의) 3 1차 소비자가 늘면 먹이인 생산자는 줄고 2차 소비자는 늘어난다. 그러면 1차 소비자가 줄어들고, 생산자가 회복되면서 개체 수가 원래 수준으로 되돌아온다.", "answer": 3, "explain": "화살표는 먹히는 쪽에서 먹는 쪽으로, 그물이 복잡할수록 안정, 에너지는 단계마다 일부만 전달, 평형은 변동 속의 회복"}, {"lessonId": "2202", "no": 2, "type": "자료 해석", "stem": "다음은 어느 국립공원에서 일어난 변화다.", "source": "늑대가 사라진 뒤 <b>엘크<\/b>(초식 동물)가 크게 늘었고, 강가의 버드나무가 거의 사라졌다. 늑대를 다시 들여오자 엘크가 줄고 <b>강가의 식물이 회복<\/b>되었다.", "ask": "이 사례에 대한 설명으로 옳은 것은?", "choices": ["늑대가 늘어나면 강가의 식물은 줄어든다.", "늑대와 강가의 식물은 서로 먹고 먹히는 관계다.", "엘크가 늘어난 것이 늑대가 사라진 원인이다.", "최상위 포식자는 생태계 평형과 관계가 없다.", "늑대 증가 → 엘크 감소 → 강가 식물 회복의 순서로 이어졌다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (화살표는 먹히는 쪽에서 먹는 쪽으로, 그물이 복잡할수록 안정, 에너지는 단계마다 일부만 전달, 평형은 변동 속의 회복) 2 ⑤ (한 칸 건너뛴 방향 착오에 주의) 3 1차 소비자가 늘면 먹이인 생산자는 줄고 2차 소비자는 늘어난다. 그러면 1차 소비자가 줄어들고, 생산자가 회복되면서 개체 수가 원래 수준으로 되돌아온다.", "answer": 5, "explain": "한 칸 건너뛴 방향 착오에 주의"}, {"lessonId": "2202", "no": 3, "type": "서술형", "stem": "1차 소비자가 일시적으로 늘어난 뒤 생태계가 평형을 되찾는 과정을, <b>생산자<\/b>와 <b>2차 소비자<\/b>의 변화를 포함하여 순서대로 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>생산자 감소 · 2차 소비자 증가 → 1차 소비자 감소 → 회복<\/b>의 순서가 핵심이다. 1차 소비자가 늘 때 2차 소비자가 <b>줄어든다<\/b>고 쓰면 방향이 뒤집힌 답이다.", "answerLine": "정답 1 ③ (화살표는 먹히는 쪽에서 먹는 쪽으로, 그물이 복잡할수록 안정, 에너지는 단계마다 일부만 전달, 평형은 변동 속의 회복) 2 ⑤ (한 칸 건너뛴 방향 착오에 주의) 3 1차 소비자가 늘면 먹이인 생산자는 줄고 2차 소비자는 늘어난다. 그러면 1차 소비자가 줄어들고, 생산자가 회복되면서 개체 수가 원래 수준으로 되돌아온다.", "answer": null, "explain": "1차 소비자가 늘면 먹이인 생산자는 줄고 2차 소비자는 늘어난다. 그러면 1차 소비자가 줄어들고, 생산자가 회복되면서 개체 수가 원래 수준으로 되돌아온다."}, {"lessonId": "2203", "no": 1, "type": "오개념", "stem": "온실효과에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["대기가 지구 복사 에너지의 일부를 흡수한다.", "온실 기체는 지표가 내보내는 적외선을 흡수·재방출한다.", "온실효과가 없다면 지구의 평균 기온은 약 −18 ℃가 된다.", "온실 기체는 태양에서 오는 가시광선을 대부분 흡수한다.", "지구의 평균 기온 15 ℃는 온실효과가 작동한 결과다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (가시광선은 대부분 통과한다) 2 ② (봄·여름 광합성이 농도를 내리고 겨울에 다시 오르는 것이 톱니, 곡선 전체를 밀어 올리는 것은 화석 연료 연소) 3 무역풍이 약해져 따뜻한 표층수가 동쪽으로 밀려오고, 찬물의 용승이 약해져 페루 연안의 수온이 평소보다 높아진다.", "answer": 4, "explain": "가시광선은 대부분 통과한다"}, {"lessonId": "2203", "no": 2, "type": "자료 해석", "stem": "다음은 하와이 마우나로아 관측소에서 측정한 대기 중 이산화 탄소 농도에 대한 자료다.", "source": "· 1958년 관측을 시작할 때의 농도는 약 <b>315 ppm<\/b>이었고, 현재는 <b>430 ppm<\/b>을 넘었다.· 곡선은 해마다 <b>봄에 내려갔다가 겨울에 올라가는<\/b> 작은 톱니 모양을 반복한다.· 그러면서도 곡선 전체는 <b>꾸준히 오른쪽 위로<\/b> 올라간다.", "ask": "이 자료에서 <b>톱니 모양<\/b>과 <b>전체 상승<\/b>의 원인을 알맞게 짝지은 것은?", "choices": ["톱니 — 화석 연료의 연소 / 상승 — 식물의 광합성", "톱니 — 식물의 광합성 / 상승 — 화석 연료의 연소", "톱니 — 측정 오차 / 상승 — 화산 활동", "톱니 — 엘니뇨 / 상승 — 태양 활동의 변화", "톱니 — 화산 활동 / 상승 — 측정 방식의 변화"], "essay": false, "gradeNote": "", "answerLine": "정답 1 ④ (가시광선은 대부분 통과한다) 2 ② (봄·여름 광합성이 농도를 내리고 겨울에 다시 오르는 것이 톱니, 곡선 전체를 밀어 올리는 것은 화석 연료 연소) 3 무역풍이 약해져 따뜻한 표층수가 동쪽으로 밀려오고, 찬물의 용승이 약해져 페루 연안의 수온이 평소보다 높아진다.", "answer": 2, "explain": "봄·여름 광합성이 농도를 내리고 겨울에 다시 오르는 것이 톱니, 곡선 전체를 밀어 올리는 것은 화석 연료 연소"}, {"lessonId": "2203", "no": 3, "type": "서술형", "stem": "엘니뇨가 발생했을 때 <b>페루 연안<\/b>에서 일어나는 변화를, <b>무역풍<\/b>과 <b>용승<\/b>을 모두 사용하여 두 문장으로 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 ① 무역풍이 약해진다 ② 따뜻한 물이 동쪽으로 밀려와 용승이 약해지고 수온이 올라간다 — 두 단계가 모두 있어야 한다. '비가 많이 온다'만 쓰면 원인이 빠진 답이다.", "answerLine": "정답 1 ④ (가시광선은 대부분 통과한다) 2 ② (봄·여름 광합성이 농도를 내리고 겨울에 다시 오르는 것이 톱니, 곡선 전체를 밀어 올리는 것은 화석 연료 연소) 3 무역풍이 약해져 따뜻한 표층수가 동쪽으로 밀려오고, 찬물의 용승이 약해져 페루 연안의 수온이 평소보다 높아진다.", "answer": null, "explain": "무역풍이 약해져 따뜻한 표층수가 동쪽으로 밀려오고, 찬물의 용승이 약해져 페루 연안의 수온이 평소보다 높아진다."}, {"lessonId": "2204", "no": 1, "type": "오개념", "stem": "태양 에너지와 에너지 전환에 대한 설명으로 <b>옳지 않은<\/b> 것은?", "source": "", "ask": "", "choices": ["태양 에너지의 근원은 중심부의 수소 핵융합이다.", "핵융합에서 줄어든 질량만큼이 에너지로 방출된다.", "지구에 도달한 태양 에너지의 약 30 %는 반사되어 되돌아간다.", "화석 연료는 옛 생물의 광합성이 저장해 둔 태양 에너지 단에 크게 치우쳐 있었는데, 완성된 인공지능도 그 집단을 계속 높게 평가했다.", "ask": "이 사례에 대한 설명으로 가장 적절한 것은?", "choices": ["학습에 쓴 데이터가 많으므로 판단은 공정하다.", "인공지능이 스스로 새로운 편견을 만들어 낸 것이다.", "디지털 격차 때문에 생긴 문제이다.", "개인 정보 침해에 해당하는 문제이다.", "치우친 데이터로 학습했기 때문에 판단도 치우친 것이다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ③ (양이 많아도 치우친 데이터는 치우친 결과를 낳는다) 2 ⑤ (치우친 데이터는 치우친 결과를 낳는다) 3 인공지능은 학습한 데이터의 범위에서만 판단하므로 편향과 오류가 있을 수 있고, 환자의 상태를 함께 살펴 책임 있게 결정하는 일은 사람의 몫이기 때문이다.", "answer": 5, "explain": "치우친 데이터는 치우친 결과를 낳는다"}, {"lessonId": "2302", "no": 3, "type": "서술형", "stem": "의료 영상을 판독하는 인공지능을 쓰더라도 <b>최종 판단은 의사가 해야 하는<\/b> 까닭을 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 인공지능이 <b>학습한 데이터의 범위 안에서만<\/b> 판단하며 편향과 오류가 있을 수 있다는 점, 그래서 <b>보조 수단<\/b>이고 책임은 사람에게 있다는 점이 들어가야 한다.", "answerLine": "정답 1 ③ (양이 많아도 치우친 데이터는 치우친 결과를 낳는다) 2 ⑤ (치우친 데이터는 치우친 결과를 낳는다) 3 인공지능은 학습한 데이터의 범위에서만 판단하므로 편향과 오류가 있을 수 있고, 환자의 상태를 함께 살펴 책임 있게 결정하는 일은 사람의 몫이기 때문이다.", "answer": null, "explain": "인공지능은 학습한 데이터의 범위에서만 판단하므로 편향과 오류가 있을 수 있고, 환자의 상태를 함께 살펴 책임 있게 결정하는 일은 사람의 몫이기 때문이다."}, {"lessonId": "2303", "no": 1, "type": "오개념", "stem": "과학기술의 양면성과 윤리에 대한 설명으로 <b>옳은<\/b> 것은?", "source": "", "ask": "", "choices": ["암모니아 합성 기술은 비료 생산과 독가스 개발에 모두 쓰였다.", "SSI는 과학 지식이 충분히 쌓이면 저절로 해결된다.", "결론에 맞지 않는 데이터는 빼고 발표해도 된다.", "과학기술의 윤리는 연구자에게만 해당하는 문제다.", "SSI는 의견이 많은 쪽을 따르면 해결된다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ① (하버의 암모니아 합성 — SSI는 지식만으로도 다수결로도 풀리지 않고, 데이터를 골라 빼는 것은 조작이다) 2 ② (사실은 \"~이다\", 가치는 \"~해야 한다\") 3 논증은 주장·근거·반론 고려로 이루어진다. 반대편의 가장 강한 논리에 미리 답해야 근거의 빈틈이 메워지고 주장이 설득력을 얻기 때문이다.", "answer": 1, "explain": "하버의 암모니아 합성 — SSI는 지식만으로도 다수결로도 풀리지 않고, 데이터를 골라 빼는 것은 조작이다"}, {"lessonId": "2303", "no": 2, "type": "자료 해석", "stem": "다음은 어느 토론에서 나온 두 문장이다.", "source": "(가) \"이 발전소는 해마다 이산화 탄소 배출을 100만 톤 줄인다.\"(나) \"비용이 더 들더라도 안전을 먼저 생각해야 한다.\"", "ask": "(가)와 (나)를 바르게 구분한 것은?", "choices": ["(가)와 (나)는 모두 사실을 말한 문장이다.", "(가)는 사실이고, (나)는 가치 판단이다.", "(가)는 가치 판단이고, (나)는 사실이다.", "(가)와 (나)는 모두 가치 판단이다.", "사실과 가치 판단은 구별할 수 없다."], "essay": false, "gradeNote": "", "answerLine": "정답 1 ① (하버의 암모니아 합성 — SSI는 지식만으로도 다수결로도 풀리지 않고, 데이터를 골라 빼는 것은 조작이다) 2 ② (사실은 \"~이다\", 가치는 \"~해야 한다\") 3 논증은 주장·근거·반론 고려로 이루어진다. 반대편의 가장 강한 논리에 미리 답해야 근거의 빈틈이 메워지고 주장이 설득력을 얻기 때문이다.", "answer": 2, "explain": "사실은 \"~이다\", 가치는 \"~해야 한다\""}, {"lessonId": "2303", "no": 3, "type": "서술형", "stem": "논증을 이루는 세 가지 요소를 쓰고, 그중 <b>반론 고려<\/b>가 왜 필요한지 서술하시오.", "source": "", "ask": "", "choices": [], "essay": true, "gradeNote": "3번은 <b>주장 · 근거 · 반론 고려<\/b> 세 가지를 모두 쓰고, 반대편의 가장 강한 논리에 답할 때 주장이 설득력을 얻는다는 점을 밝혀야 한다.", "answerLine": "정답 1 ① (하버의 암모니아 합성 — SSI는 지식만으로도 다수결로도 풀리지 않고, 데이터를 골라 빼는 것은 조작이다) 2 ② (사실은 \"~이다\", 가치는 \"~해야 한다\") 3 논증은 주장·근거·반론 고려로 이루어진다. 반대편의 가장 강한 논리에 미리 답해야 근거의 빈틈이 메워지고 주장이 설득력을 얻기 때문이다.", "answer": null, "explain": "논증은 주장·근거·반론 고려로 이루어진다. 반대편의 가장 강한 논리에 미리 답해야 근거의 빈틈이 메워지고 주장이 설득력을 얻기 때문이다."}]</script>
