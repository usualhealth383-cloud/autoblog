note":"PMID 16495392"},"eriksen2014":{"label":"Eriksen 2014 (글루코사민 효과는 브랜드에 따라 갈림)","url":"https://doi.org/10.1002/acr.22376","type":"메타분석","note":"PMID 24905534"},"ginseng_fatigue2023":{"label":"인삼과 피로 메타분석 2023 (효과 크기 작고 유의하지 않음)","url":"https://doi.org/10.1089/jicm.2022.0532","type":"메타분석","note":"PMID 36730693"},"yuan2004":{"label":"Yuan 2004, Ann Intern Med (미국삼이 와파린 효과 감소)","url":"https://doi.org/10.7326/0003-4819-141-1-200407060-00011","type":"RCT","note":"PMID 15238367"},"rambaldi2007":{"label":"Cochrane Rambaldi 2007 (밀크씨슬과 간질환)","url":"https://doi.org/10.1002/14651858.CD003620.pub3","type":"코크란","note":"PMID 17943794"},"rothman1995":{"label":"Rothman 1995, NEJM (임신 초기 고용량 비타민 A와 기형)","url":"https://doi.org/10.1056/NEJM199511233332101","type":"코호트","note":"PMID 7477116"},"nicolussi2020":{"label":"Nicolussi 2020 (세인트존스워트 약물상호작용)","url":"https://doi.org/10.1111/bph.14936","type":"리뷰","note":"PMID 31742659"},"bailey2013gf":{"label":"Bailey 2013, CMAJ (자몽과 약물 상호작용)","url":"https://doi.org/10.1503/cmaj.120951","type":"리뷰","note":"PMID 23184849"},"mfds_hff":{"label":"식약처 건강기능식품 표시기준·기능성 원료 안내","url":"https://www.mfds.go.kr/brd/m_207/view.do?seq=14689","type":"규제기관"},"nsf_cert":{"label":"NSF — 보충제 제3자 인증(USP·NSF·Informed Choice) 설명","url":"https://www.nsf.org/consumer-resources/articles/supplement-vitamin-certification","type":"인증기관"}},"suppRules":{"label":["**‘1일 섭취량’ 기준인지 ‘1회 분량’ 기준인지** — 함량과 % 표시가 어느 쪽인지 먼저 확인.","**기능성분 mg으로 비교** — ‘피쉬오일 1,000 mg’이 아니라 EPA+DHA mg, ‘마그네슘 화합물’이 아니라 원소 마그네슘 mg, ‘홍삼 g’이 아니라 진세노사이드 mg.","**제형** — rTG vs EE(오메가3), 산화 vs 구연산(마그네슘), 탄산 vs 구연산(칼슘), D3 vs D2. 흡수가 1.5~25배 달라요.","**상한(UL)과 중복** — 종합비타민 + 단일제 + 루테인·면역제품에 같은 성분(비타민 D·아연·B6)이 겹쳐 상한을 넘기기 쉬워요.","**인증** — 국내 ‘건강기능식품’ 마크는 식약처가 기능성·안전성을 인정했다는 뜻(HACCP과 다름). 해외는 USP Verified(함량·오염)·NSF Certified for Sport(금지약물)·Informed Choice."],"stack":["비타민 A(레티놀) + 경구 레티노이드(이소트레티노인) — 비타민 A 독성 가중. 임신 초기 레티놀 >10,000 IU 기형 위험.","철 + 칼슘 같은 시간 — 칼슘이 철 흡수 저해 → 2시간 이상 간격.","비타민 D·아연·B6 중복(종합비타민 + 단일제 + 루테인/면역 제품) — 상한 초과.","오메가3 고용량(>1 g) + 항응고·항혈소판제 — 출혈, 심방세동 위험.","세인트존스워트 + 거의 모든 약(경구피임약·와파린·면역억제제·스타틴) — 약효 감소.","비타민 K(K2 포함, 청국장·낫토·녹즙) + 와파린 — INR 하락. 섭취량을 일정하게.","자몽주스 + 심바스타틴·아토르바스타틴 등 — 혈중 농도 상승(효과 3~7일 지속).","홍삼·인삼 + 와파린 — INR 감소 보고, 모니터링.","고용량 아연 장기(구리 없이) — 구리 결핍 빈혈·신경 손상.","칼슘·마그네슘·철·아연 + 퀴놀론·테트라사이클린·갑상선약·골다공증약 — 2~4시간 간격.","비타민 C ≥1 g + 결석 병력 — 결석 위험 2배.","베타카로틴 + 흡연자 — 폐암 위험 증가."],"overlaps":[{"ids":["vitd","calcium"],"text":"칼슘제에 비타민 D가 함께 든 경우가 많아요. 두 제품의 비타민 D를 합산해 4,000 IU를 넘지 않게."},{"ids":["vitd","multi"],"text":"종합비타민에 이미 비타민 D가 들어 있어요. 단일제와 합산하세요."},{"ids":["zinc","multi"],"text":"종합비타민 속 아연과 합산 — 상한 40 mg."},{"ids":["zinc","lutein"],"text":"AREDS 처방 루테인 제품엔 아연 25~80 mg이 들어 있어요. 아연 단일제와 겹치면 구리 결핍 위험."},{"ids":["vitb","multi"],"text":"종합비타민 + B군 고함량 → B6가 EFSA 상한 12 mg을 넘기 쉬워요."},{"ids":["iron","calcium"],"text":"같은 시간에 먹지 마세요 — 칼슘이 철 흡수를 막아요. 2시간 이상 간격."},{"ids":["iron","mg"],"text":"철·마그네슘 고용량 동시 복용은 흡수 경쟁 — 시간을 나누세요."},{"ids":["mg","calcium"],"text":"칼슘·마그네슘 고용량 동시 복용은 흡수 경쟁. ‘칼마디’ 복합제는 함량이 낮게 설계돼 있으니 단일제 추가 시 합산."},{"ids":["omega3","vitd"],"text":"오메가3 제품에 비타민 D가 든 경우가 있어요. 합산 확인."},{"ids":["ginseng","omega3"],"text":"둘 다 항응고제(와파린)와 상호작용 보고가 있어요. 항응고제 복용 중이면 의사와."}],"sources":["mfds_hff","nsf_cert","rothman1995","nicolussi2020","bailey2013gf","yuan2004","kumar2006","thomas2013","areds2","gencer2021"]},"supplements":[{"id":"vitd","name":"비타민 D","en":"Vitamin D3 / D2","tags":["비타민D","뼈","칼슘"],"evidence":"강함","for":"뼈 건강(칼슘 흡수). 암·심혈관 예방은 근거 없음","lead":"뼈 건강에는 근거가 확실하지만, 2,000 IU를 5년 먹인 VITAL 시험에서 **암·심혈관 예방 효과는 없었어요**. 2024년 미국내분비학회는 건강한 75세 미만 성인의 일상적 혈액검사와 고용량 보충에 반대했어요. D3가 D2보다 혈중 농도를 잘 올리고, 지방 있는 식사와 먹으면 흡수가 32% 늘어요.","evidenceNote":"뼈·칼슘 흡수: 강함(IOM 2011). 암·심혈관·당뇨 예방: **효과 없음**(VITAL 2019, n=25,871). D3 > D2: 메타분석 P=0.001(Tripkovic 2012). 결핍 위험군(1~18세·75세↑·임신·당뇨전단계)에는 경험적 보충 제안(ES 2024).","forms":[{"name":"D3 (콜레칼시페롤)","bio":"높음","note":"1순위. 매일 소량이 주 1회 고용량보다 권장(ES 2024)"},{"name":"D2 (에르고칼시페롤)","bio":"낮은 편","note":"결핍 치료에 쓸 수는 있으나 D3보다 혈중 상승이 적음"}],"dose":{"typical":"1,000~2,000 IU/일","ul":"4,000 IU(100 µg)/일","kr":"한국 성인 충분섭취량 400 IU(10 µg), 상한 4,000 IU. 1 µg = 40 IU. 식약처 건기식 일일섭취량 범위 [확인 필요]"},"calc":{"unit":"IU","typical":1000,"ulRatio":4,"note":"1일 1,000 IU 기준","caveat":"4,000 IU(400%)를 넘는 함량은 매일 먹을 용량이 아니에요. 종합비타민·칼슘제 속 비타민 D를 합산하세요."},"bestForm":"D3","label":["IU와 µg 중 어느 단위인지 — 25 µg = 1,000 IU.","D2인지 D3인지.","종합비타민·칼슘제·오메가3 제품에 이미 들어 있는지 합산."],"timing":"하루 1회, 지방이 있는 식사(아침·점심)와 함께. 매일 소량이 주 1회 고용량보다 좋아요.","timingShort":"식사(지방)와, 매일","cautions":["장기간 4,000 IU 초과 → 고칼슘혈증 위험","사르코이드증·부갑상선 질환은 의사와","피검사 없이 ‘결핍일 것 같아서’ 고용량은 비권장(ES 2024)"],"priceTip":"1,000 IU당 가격으로 비교. 400 IU 저용량은 알약 수가 늘어 단가가 불리하고, D3 단일제가 대개 가장 싸요.","sources":["iom2011","vital_d","tripkovic2012","es2024d","dawson2015"]},{"id":"omega3","name":"오메가-3 (EPA+DHA)","en":"Omega-3","tags":["오메가3","EPA","DHA","피쉬오일","중성지방"],"evidence":"중간","for":"중성지방 저하(고용량). 일반인 심혈관 예방은 효과 없음","lead":"**‘피쉬오일 1,000 mg’이 아니라 EPA+DHA 합계 mg**을 보세요. 처방 수준(2~4 g/일)에서 중성지방을 낮추는 근거는 강하지만, 보충제 용량 1 g으로 심혈관 예방을 기대할 근거는 없어요(VITAL·코크란 2020). 제형은 rTG > EE(에틸에스테르)로 흡수가 1.7배 차이 나고, 1 g 넘는 고용량은 심방세동 위험이 올라가요.","evidenceNote":"중성지방 저하(2~4 g EPA+DHA): 강함(AHA 2019). 심혈관 예방(보충제 1 g): **효과 없음**(VITAL HR 0.92 NS; 코크란 86시험 사망 RR 0.97). 고용량 처방약 EPA(REDUCE-IT)는 효과, EPA+DHA(STRENGTH)는 무효 — 상충. 심방세동 HR 1.25(>1 g/일 1.49).","forms":[{"name":"rTG (재에스테르화 중성지방)","bio":"124%","note":"흡수 최고. 가격 프리미엄 정당"},{"name":"천연 TG","bio":"100%","note":"기준"},{"name":"EE (에틸에스테르)","bio":"73%","note":"저가형. 같은 효과엔 1.4배 양 필요"},{"name":"크릴오일(인지질)","bio":"어유와 유사","note":"임상 우월성 근거 없음, EPA+DHA 함량 낮아 mg당 비쌈"}],"dose":{"typical":"EPA+DHA 1,000 mg/일 (TG 저하는 2~4 g, 의사 관리)","ul":"FDA 3 g/일(GRAS) [확인 필요]","kr":"식약처 기능성(혈중 중성지질·혈행 개선) EPA+DHA 합 500~2,000 mg (공전 원문 [확인 필요])"},"calc":{"unit":"mg (EPA+DHA 합)","typical":1000,"ulRatio":3,"note":"EPA+DHA 합 1,000 mg 기준","caveat":"캡슐 무게가 아니라 EPA+DHA 합계로 넣으세요. EE형은 계산값에 0.6을 곱해 보정."},"bestForm":"rTG","label":["EPA mg + DHA mg 합계(캡슐 1,000 mg ≠ EPA+DHA 1,000 mg).","제형: rTG / TG / EE 표기.","산화 지표(GOED: TOTOX ≤26) 표기 여부, 유통기한.","항응고제 복용 중이면 고용량 주의."],"timing":"지방이 있는 식사 중에. 비린내·역류가 있으면 냉장 보관 후 식사 중간에.","timingShort":"식사 중(지방과)","cautions":["항응고제·항혈소판제 병용 시 출혈 주의(고용량)","심방세동 병력자는 1 g 초과 피함","어류 알레르기","위장 불편(트림·설사)"],"priceTip":"EPA+DHA 1 g당 가격 × 제형 보정(EE는 ×1.4). 크릴오일은 mg당 가격이 높고 우월성 근거가 없어요.","sources":["dyerberg2010","aha2019tg","vital_omega","reduceit","cochrane_omega2020","gencer2021","goed"]},{"id":"mg","name":"마그네슘","en":"Magnesium","tags":["마그네슘","눈떨림","경련","수면"],"evidence":"약함","for":"결핍 보충. 다리 경련·눈 떨림 효과는 근거 없음","lead":"**산화마그네슘은 흡수율이 약 4%**라 원소량이 높아 보여도 실제 흡수는 적고 설사를 일으켜요. 구연산·글리신산·젖산염 형태가 흡수가 낫습니다. 널리 알려진 ‘다리 쥐·눈 떨림에 마그네슘’은 코크란(2020)에서 특발성 경련에 효과가 없었고, 눈 떨림은 RCT 근거가 없어요. 신장이 나쁘면 쌓여서 위험.","evidenceNote":"다리 경련: **효과 없음**(코크란 2020, 11 RCT, 고확실성). 수면: 고령 불면 입면 −17분, 낮은 확실성. 눈꺼풀 떨림: RCT 근거 없음. 결핍(이뇨제·PPI·음주·당뇨) 보충: 타당.","forms":[{"name":"산화마그네슘","bio":"약 4%","note":"가장 싸고 원소 비율 60%지만 흡수 낮고 설사. 변비약(마그밀)으로는 그 성질이 장점"},{"name":"구연산마그네슘","bio":"높음","note":"흡수 좋음, 고용량은 설사"},{"name":"글리신산(비스글리시네이트)","bio":"높음 [직접 비교 확인 필요]","note":"위장 부담 적다고 알려짐, 원소 비율 ~14%"},{"name":"젖산·염화마그네슘","bio":"높음","note":"산화물보다 유의하게 높음(Firoz 2001)"},{"name":"L-트레온산","bio":"[확인 필요]","note":"뇌 관련 마케팅, 원소 비율 ~8%로 낮음"}],"dose":{"typical":"원소 마그네슘 200~400 mg/일 [지침 원문 확인 필요]","ul":"보충제 유래 350 mg/일(미국 IOM) [확인 필요]","kr":"KDRIs 2020 식품 외 급원 상한 설정(수치 [확인 필요]); 식약처 건기식 일일섭취량 범위 [확인 필요]"},"calc":{"unit":"mg (원소 마그네슘)","typical":300,"ulRatio":1.2,"note":"원소 Mg 300 mg 기준","caveat":"‘글리신산마그네슘 1,000 mg’은 원소 마그네슘 약 140 mg이에요. 라벨의 ‘마그네슘(as …)’ 원소량으로 넣으세요."},"bestForm":"구연산·글리신산","label":["화합물 무게가 아니라 **원소 마그네슘 mg**.","형태 미표기(‘마그네슘’만)는 대개 산화마그네슘.","종합비타민·칼마디 제품과 합산."],"timing":"식사와 함께, 설사하면 나눠서. 철·아연·칼슘 고용량과 동시 복용은 피하기.","timingShort":"식사와, 분할","cautions":["**신장 질환은 금지**(고마그네슘혈증)","설사(산화·구연산)","퀴놀론·테트라사이클린 항생제, 비스포스포네이트와 2시간 간격"],"priceTip":"원소 Mg 100 mg당 가격 ÷ 상대 흡수율. 산화물은 mg당 가장 싸지만 4% 흡수를 반영하면 실질 단가가 불리해요.","sources":["firoz2001","garrison2020","mg_sleep2021"]},{"id":"probiotic","name":"프로바이오틱스(유산균)","en":"Probiotics","tags":["유산균","프로바이오틱스","장","CFU"],"evidence":"중간","for":"항생제 관련 설사 예방(강). 과민성장·면역·피부는 낮음","lead":"효과는 ‘유산균’이 아니라 **균주(strain) 단위**예요. 항생제 설사 예방은 *L. rhamnosus* GG·*S. boulardii* 하루 50억 CFU 이상에서 근거가 확실(코크란 NNTB 6~9)하고, 과민성장·면역·피부는 대부분 낮은 확실성이에요. 라벨에서 볼 것은 총 CFU 숫자 경쟁이 아니라 **균주명 + 유통기한까지 보장 CFU**.","evidenceNote":"항생제 관련 설사: 소아 33 RCT 8% vs 19%, RR 0.45(고용량 ≥50억 NNTB 6). *S. boulardii* NNT 10. IBS: 82 RCT — 대부분 GRADE 낮음~매우 낮음(Ford 2023). 면역·체중·피부: 본 앱 미검토.","forms":[{"name":"L. rhamnosus GG","bio":"—","note":"항생제 설사 예방 근거 강(ESPGHAN 강한 권고)"},{"name":"S. boulardii (효모)","bio":"—","note":"항생제와 동시 복용 가능(효모라 죽지 않음). 항진균제와는 무력화"},{"name":"복합 균주 제품","bio":"—","note":"종명만 나열된 제품은 특정 근거 적용 불가"}],"dose":{"typical":"10억~100억 CFU/일 (항생제 설사 예방 ≥50억)","ul":"미설정","kr":"식약처 기능성(유익균 증식·유해균 억제·배변) 일일섭취량 1억~100억 CFU (공전 원문 [확인 필요])"},"calc":{"unit":"억 CFU","typical":50,"ulRatio":99,"note":"항생제 설사 예방 기준 50억 CFU","caveat":"‘제조 시’ CFU가 아니라 ‘유통기한까지 보장’ CFU로 넣으세요. 100억↑ 숫자 경쟁보다 균주가 중요."},"bestForm":"균주명 명시 제품","label":["균주명이 종(species)까지가 아니라 **균주 코드**(예: GG, CNCM I-745)까지 있는지.","CFU가 ‘제조 시’인지 ‘유통기한까지 보장’인지.","냉장 필요 여부."],"timing":"항생제와는 2~3시간 간격(효모 균주는 무관). 식전/식후 우열은 근거 없음.","timingShort":"항생제와 2~3시간 간격","cautions":["중심정맥관·중증 면역저하·중환자는 균혈증 보고 — 의사와","S. boulardii + 항진균제는 무력화"],"priceTip":"‘유통기한 보장 CFU 10억당 가격’. 목적(항생제 설사)에 근거 있는 균주를 고르는 게 100억 숫자보다 중요해요.","sources":["guo2019","szajewska2015","ford2023","mfds_hff"]},{"id":"iron","name":"철분","en":"Iron","tags":["철분","빈혈","철결핍"],"evidence":"강함","for":"철결핍(빈혈) 치료. 결핍 확인 없이 복용 금지","lead":"철결핍이 **확인된 경우**에만 먹는 성분이에요 — 혈색소증 등 철 과잉은 위험해요. 최근 RCT는 **격일 복용이 매일보다 흡수가 좋다**고 보여줬어요(헵시딘 상승 회피). 원소철 60~120 mg, 칼슘·커피·차와 2시간 이상 띄우고, 검은 변·변비는 흔한 부작용이에요.","evidenceNote":"철결핍 치료: 표준치료. 격일 복용 흡수↑: Stoffel 2017(분획 흡수 21.8% vs 16.3%), 2019(연속일 흡수 40~50% 감소). 비스글리시네이트 vs 황산철 우열: 소규모 자료, 대규모 메타 [확인 필요].","forms":[{"name":"황산제일철","bio":"기준","note":"원소철 ~20%, 가장 저렴, 위장 부작용"},{"name":"푸마르산제일철","bio":"유사","note":"원소철 ~33%"},{"name":"비스글리시네이트철","bio":"유사~높음 [확인 필요]","note":"원소철 ~27%, 위장 부담 적다고 알려짐"},{"name":"다당류철·헴철","bio":"제품별","note":"원소철 표기 확인"}],"dose":{"typical":"원소철 60~120 mg/일 또는 격일(치료)","ul":"45 mg/일(IOM, 예방 목적) [확인 필요]","kr":"KDRIs 상한 [확인 필요]; 식약처 건기식 일일섭취량 [확인 필요]"},"calc":{"unit":"mg (원소철)","typical":60,"ulRatio":2,"note":"치료 용량 60 mg 기준","caveat":"‘황산철 300 mg’ ≈ 원소철 60 mg. 결핍이 확인되지 않았다면 이 계산은 무의미해요."},"bestForm":"황산철(저렴) / 비스글리시네이트(위장 약하면)","label":["**원소철(elemental iron) mg**.","비타민 C 병용 흡수↑는 고전적 권고(임상 결과 근거 [확인 필요])."],"timing":"아침 공복 또는 식사 1시간 전, **격일** 가능. 칼슘·유제품·커피·차와 2시간 이상 간격.","timingShort":"공복·격일, 칼슘과 분리","cautions":["결핍 확인 없이 복용 금지(혈색소증)","어린이 과량 섭취 급성 중독 — 손 닿지 않게","레보티록신·퀴놀론·테트라사이클린과 간격","검은 변·변비·오심 흔함"],"priceTip":"원소철 60 mg당 가격. 황산철 단일제가 가장 저렴하고 격일 복용으로 소비량도 절반.","sources":["stoffel2017","stoffel2019"]},{"id":"calcium","name":"칼슘","en":"Calcium","tags":["칼슘","뼈","골다공증"],"evidence":"강함","for":"뼈 건강(식이로 부족할 때). 보충제 심혈관 논쟁 있음","lead":"식이(유제품·멸치·두부)로 하루 1,000~1,200 mg이 되면 보충제는 필요 없어요. 보충한다면 **1회 원소 칼슘 500 mg 이하**로 나눠서. 탄산칼슘은 싸지만 위산이 필요해 식사와 함께, 구연산칼슘은 PPI·위산 저하자도 아무 때나. 비타민 D 없이 칼슘만 고용량 보충은 심근경색 논쟁이 있어요(Bolland 2010 vs Chung 2016).","evidenceNote":"뼈: 강함(IOM 2011). 심혈관: Bolland 2010 MI HR 1.31(비타민 D 미병용) ↔ Chung 2016 상한 이내 무관 — 상충. 신결석: 대부분 연구에서 보충 칼슘과 연관 없음.","forms":[{"name":"탄산칼슘","bio":"식사와 함께 좋음","note":"원소 칼슘 40%, 가장 저렴, 위산 필요, 가스·변비"},{"name":"구연산칼슘","bio":"식사 무관","note":"원소 칼슘 ~21%, PPI·H2차단제 복용자·무산증에 선택"},{"name":"젖산·글루콘산칼슘","bio":"—","note":"농도 낮아 비실용적"}],"dose":{"typical":"식이 + 보충 합계 1,000~1,200 mg/일(성인), 1회 ≤500 mg","ul":"2,000~2,500 mg/일","kr":"식약처 건기식 일일섭취량 [확인 필요]"},"calc":{"unit":"mg (원소 칼슘)","typical":500,"ulRatio":2,"note":"1회 최대 흡수 500 mg 기준","caveat":"‘탄산칼슘 1,250 mg’ = 원소 칼슘 500 mg. 500 mg(100%)을 넘는 1회량은 흡수가 떨어져요."},"bestForm":"탄산(식사와) / 구연산(PPI 복용자)","label":["**원소 칼슘 mg**(화합물 무게 아님).","비타민 D 병합 여부·용량.","1회 분량이 500 mg 이하로 나뉘는지."],"timing":"탄산칼슘은 식사 직후, 구연산은 아무 때나. 500 mg씩 나눠서. 철분제·갑상선약과 다른 시간.","timingShort":"탄산=식후 · 구연산=무관, 500 mg씩","cautions":["철·아연·마그네슘, 레보티록신, 퀴놀론·테트라사이클린, 비스포스포네이트와 2~4시간 간격","고칼슘혈증·신질환은 의사와","식이로 충분하면 보충 불필요(심혈관 논쟁)"],"priceTip":"원소 칼슘 500 mg당 가격. 탄산칼슘이 가장 저렴하고, PPI 복용자·공복 복용자만 구연산 프리미엄이 정당해요.","sources":["straub2007","bolland2010","chung2016","iom2011"]},{"id":"vitc","name":"비타민 C","en":"Vitamin C","tags":["비타민C","감기","면역","항산화"],"evidence":"중간","for":"감기 기간 소폭 단축(정기 복용 시). 예방 효과 없음","lead":"**200 mg에서 흡수가 거의 포화**되고 1,000 mg 이상은 대부분 배설돼요(Levine 1996). 코크란: 일반인에서 감기 **예방 효과는 없고**, 정기 복용 시 감기 기간이 성인 8%·소아 14% 단축. 남성에서 1,000 mg 정제 상습 복용 시 신결석 위험이 약 2배였어요.","evidenceNote":"감기 예방(일반인): 효과 없음(RR 0.97). 기간 단축: 성인 8%, 소아 14%(정기 복용). 증상 후 치료 복용: 일관된 효과 없음. 흡수: 200 mg 포화 곡선 이탈, 1,000 mg 완전 포화.","forms":[{"name":"아스코르브산","bio":"200 mg까지 완전","note":"기본형, 저렴"},{"name":"완충형(칼슘·나트륨 아스코르베이트)","bio":"유사","note":"위 자극 적음"},{"name":"리포조멀·서방형","bio":"[확인 필요]","note":"임상 결과 우위 근거 없음"}],"dose":{"typical":"100~200 mg/일","ul":"2,000 mg/일(IOM) [확인 필요]","kr":"KDRIs 상한·식약처 건기식 일일섭취량 [확인 필요]"},"calc":{"unit":"mg","typical":200,"ulRatio":10,"note":"조직 포화 200 mg 기준","caveat":"1,000 mg(500%)은 흡수 포화로 ‘유효 mg’이 늘지 않고 결석 위험만 올라가요."},"bestForm":"아스코르브산 200 mg 분할","label":["고함량(1,000~3,000 mg)은 mg당 싸도 유효량은 같음.","철분제와 함께 복용 가능."],"timing":"200 mg씩 하루 1~2회 나눠서. 식사와 무관.","timingShort":"200 mg씩 분할","cautions":["신결석 병력·남성 고용량(≥1 g) 주의","고용량 삼투성 설사","혈색소증(철 흡수↑)"],"priceTip":"200 mg 단위로 가격 산정. ‘1,000 mg 고함량’은 유효용량 관점에서 이득이 없어요.","sources":["levine1996","hemila2013","thomas2013"]},{"id":"vitb","name":"비타민 B군 / B12 / B6","en":"B-complex","tags":["비타민B","B12","B6","피로","임팩타민","아로나민"],"evidence":"약함","for":"B12 결핍 교정(강). 비결핍자 피로 개선(약함)","lead":"B12 결핍 위험군(채식·고령·위절제·메트포르민·PPI 2년↑ OR 1.65)에는 근거가 확실하지만, **결핍 없는 성인의 피로에 B군이 듣는다는 대규모 근거는 없어요**. ‘활성형 메틸코발라민’ 프리미엄도 근거가 약해요(세포 내 처리 경로 동일). 주의할 것은 **B6 — EFSA 2023 상한 12 mg/일**, 국내 고함량 제품(50~100 mg)을 오래 먹으면 말초신경병증.","evidenceNote":"B12 결핍 교정: 강함. PPI 장기 사용과 B12 결핍 OR 1.65(Lam 2013). 메틸 vs 시아노코발라민: 우열 근거 없음(Obeid 2015). 피로: 소규모 교차 RCT 1편(32명). B1 유도체(벤포티아민·푸르설티아민) 비결핍 피로 RCT 없음.","forms":[{"name":"시아노코발라민","bio":"충분","note":"저렴, 안정. 대부분에게 충분"},{"name":"메틸코발라민(‘활성형’)","bio":"동등","note":"프리미엄 근거 약함"},{"name":"벤포티아민·푸르설티아민(B1 유도체)","bio":"친유성, 흡수↑","note":"임팩타민·아로나민 — 국내 일반의약품. 둘 간 우열 근거 부족"}],"dose":{"typical":"B12 2.4 µg/일(RDA), 결핍 치료는 500~1,000 µg; B6 ≤12 mg/일(EFSA UL)","ul":"B6 12 mg(EFSA 2023) · 미국 100 mg [확인 필요]; B12 상한 없음","kr":"KDRIs B6 상한 [확인 필요]"},"calc":{"unit":"mg (비타민 B6)","typical":1.5,"ulRatio":8,"note":"B6 RDA ~1.5 mg 기준 · 12 mg(800%)이 EFSA 상한","caveat":"B6 함량이 12 mg을 넘는 고함량 제품은 장기 복용 시 감각신경병증 위험. 800%를 넘으면 빨간색이 뜨는 이유예요."},"bestForm":"B6 ≤12 mg · 엽산 400 µg · B12 ≥2.4 µg","label":["B6 함량이 12 mg 이하인지(장기 복용 시).","B12 단위 µg(mcg).","‘활성형’ 표기는 가격 프리미엄 근거 약함."],"timing":"수용성, 식사와 무관. 아침 복용(일부 각성 보고).","timingShort":"아침, 무관","cautions":["고용량 B6 장기 → 말초신경병증(EFSA ‘잘 확립됨’)","엽산 고용량이 B12 결핍 신경증상을 가림","소변 황변(리보플라빈)은 무해"],"priceTip":"B12는 시아노코발라민 저가 제품으로 충분. B군은 ‘B6 ≤12 mg·엽산 400 µg·B12 ≥2.4 µg’ 실제 필요 기준으로.","sources":["lam2013","obeid2015","efsa_b6"]},{"id":"lutein","name":"루테인·지아잔틴","en":"Lutein / Zeaxanthin","tags":["루테인","눈","황반","지아잔틴"],"evidence":"중간","for":"중등도 황반변성 진행 억제. 건강한 눈 예방·피로 근거 없음","lead":"AREDS2(n=4,203)는 **이미 중등도 황반변성이 있는 사람**에서 루테인 10 mg + 지아잔틴 2 mg이 진행을 약간 늦췄어요(10년 HR 0.91). **건강한 눈의 예방이나 눈 피로·건조엔 근거가 없어요.** 흡연자는 베타카로틴 든 제품을 피하세요(폐암 OR 1.82).","evidenceNote":"중등도 AMD 진행: 1차 분석 HR 0.90(P=0.12, NS) → 10년 추적 HR 0.91(0.84–0.99). 건강인 예방: RCT 없음. 눈 피로·건조: 근거 없음.","forms":[{"name":"마리골드꽃추출물(유리형 루테인)","bio":"지방과 흡수↑","note":"식약처 원료명. 10 mg이 근거 용량"},{"name":"루테인 에스테르","bio":"유사","note":"표기 함량 확인(에스테르 무게 ≠ 루테인)"}],"dose":{"typical":"루테인 10 mg + 지아잔틴 2 mg/일","ul":"미설정","kr":"식약처 기능성(황반색소밀도 유지) 루테인 10~20 mg (공전 원문 [확인 필요])"},"calc":{"unit":"mg (루테인)","typical":10,"ulRatio":2,"note":"AREDS2 10 mg 기준","caveat":"20 mg 고함량의 추가 이득 근거는 없어요."},"bestForm":"루테인 10 mg + 지아잔틴 2 mg","label":["루테인 mg(추출물 무게 아님) + 지아잔틴 mg.","흡연자·과거 흡연자는 베타카로틴 포함 제품 회피.","고용량 아연(80 mg) 포함 제품은 구리 동반 여부."],"timing":"지방이 있는 식사와 함께.","timingShort":"식사(지방)와","cautions":["흡연자 베타카로틴 폐암 위험","고용량 아연 장기 → 구리 결핍"],"priceTip":"루테인 10 mg당 가격. ‘20 mg 고함량’ 프리미엄은 근거 없음.","sources":["areds2","areds2_10y"]},{"id":"coq10","name":"코엔자임 Q10","en":"Coenzyme Q10","tags":["코큐텐","CoQ10","스타틴","심장"],"evidence":"중간","for":"심부전 보조(단일 시험), 스타틴 근육통(상충)","lead":"심부전 환자 Q-SYMBIO(300 mg/일, 2년)에서 주요 심혈관 사건이 절반(HR 0.50)이었지만 단일 시험이라 재현이 필요해요. 스타틴 근육통은 메타분석 결과가 엇갈려요. **유비퀴놀이 유비퀴논보다 흡수가 좋다는 차이는 유의하지 않았고(1.7배, P=0.13)**, 오히려 결정을 잘 분산시킨 제형(오일·수용성)이 흡수를 좌우해요.","evidenceNote":"심부전: Q-SYMBIO n=420 HR 0.50 — 단일. 스타틴 근육증상: Qu 2018 12 RCT 개선 vs 이전 메타 무효 — 혼재. 흡수: 유비퀴놀 1.7배 NS, 수용성 유비퀴논 2.4배 유의(Pravst 2020).","forms":[{"name":"유비퀴논(오일 서스펜션)","bio":"기준","note":"가용화 제형이면 충분"},{"name":"유비퀴놀","bio":"1.7배(유의하지 않음)","note":"2배 이상 비쌈, 프리미엄 근거 약함"},{"name":"수용성 유비퀴논","bio":"2.4배(유의)","note":"제형이 형태보다 중요"}],"dose":{"typical":"100~200 mg/일(시험 100~300 mg)","ul":"미설정","kr":"식약처 기능성(항산화·혈압) 90~100 mg (공전 원문 [확인 필요])"},"calc":{"unit":"mg","typical":100,"ulRatio":3,"note":"100 mg 기준"},"bestForm":"가용화 유비퀴논","label":["CoQ10 mg, 형태(유비퀴논/유비퀴놀), 가용화(오일·수용성) 여부."],"timing":"지방이 있는 식사와 함께, 분할 복용.","timingShort":"식사(지방)와, 분할","cautions":["와파린 효과 감소 보고(비타민 K 유사 구조) [확인 필요]","혈압약 병용 시 저혈압 가능"],"priceTip":"100 mg당 가격. 유비퀴놀은 통상 2배 이상 비싸지만 흡수 우위가 유의하지 않아요.","sources":["qsymbio","qu2018","pravst2020"]},{"id":"zinc","name":"아연","en":"Zinc","tags":["아연","감기","면역","트로키"],"evidence":"약함","for":"감기 기간 단축(트로키, 낮은 확실성). 결핍 보충","lead":"감기 시작 24시간 안에 고용량 아연 트로키(≥75 mg/일)를 빨면 기간이 33% 줄었다는 메타분석과, 2024 코크란의 ‘낮은 확실성·부작용 증가’ 결론이 엇갈려요. **예방 효과는 없어요.** 장기 고용량(상한 40 mg)은 구리 결핍으로 빈혈·신경 손상을 부르고, **코에 뿌리는 아연은 후각을 영구히 잃을 수 있어** 금지예요.","evidenceNote":"감기 기간: Hemilä 2017 −33% vs 코크란 2024 MD −2.4일(낮은 확실성, I²=97%). 예방: 효과 없음(RR 0.93). 구리 결핍 척수병증(Kumar 2006). 비강 아연 무후각증 17례(2006)·FDA 2009 경고.","forms":[{"name":"아세트산아연(트로키)","bio":"—","note":"감기 연구 대부분, 원소 ~30%"},{"name":"글루콘산아연","bio":"—","note":"원소 ~14%, 저렴"},{"name":"피콜린산·구연산","bio":"[확인 필요]","note":"흡수 우열 RCT 미조회"}],"dose":{"typical":"유지 8~11 mg/일; 감기 트로키 ≥75 mg/일 수일","ul":"40 mg/일(IOM) [확인 필요]","kr":"KDRIs 상한·식약처 건기식 일일섭취량 [확인 필요]"},"calc":{"unit":"mg (원소 아연)","typical":10,"ulRatio":4,"note":"유지 10 mg 기준 · 40 mg(400%)이 상한","caveat":"종합비타민·면역제품·루테인(AREDS 80 mg) 등 여러 제품에 겹쳐 상한을 넘기 쉬워요."},"bestForm":"글루콘산(유지) / 아세트산(트로키)","label":["**원소 아연 mg**.","다른 제품과 합산.","구리 2 mg 동반 여부(장기 고용량 시)."],"timing":"공복 시 오심 → 식사와 함께. 철·칼슘과 시간 분리.","timingShort":"식사와, 철·칼슘 분리","cautions":["장기 고용량 → 구리 결핍(빈혈·척수병증)","**비강 아연 제품 금지**(후각 상실)","퀴놀론·테트라사이클린 흡수 저해"],"priceTip":"원소 아연 10 mg당 가격. 15 mg 이하 유지량은 저렴한 글루콘산으로 충분.","sources":["hemila2017zn","cochrane_zn2024","kumar2006","zn_nasal2006"]},{"id":"collagen","name":"콜라겐 펩타이드","en":"Collagen peptide","tags":["콜라겐","피부","관절"],"evidence":"중간","for":"피부 수분·탄력(소규모 RCT 메타). 관절은 근거 제한","lead":"가수분해 콜라겐 2.5~10 g을 8~12주 먹으면 피부 수분·탄력이 개선됐다는 메타분석이 여럿 있지만, 시험이 작고 산업 후원이 많아요. 콜라겐은 **단백질**이라 소화되면 아미노산이 되고, 특정 부위로 ‘가는’ 것이 아니에요. 1 g짜리 앰플은 시험 용량에 못 미쳐요.","evidenceNote":"피부: 19 RCT/1,125명(de Miranda 2021), 26 RCT/1,721명(Pu 2023) 수분·탄력 개선 — 편향 지적. 급원(어류/돼지/소)별 차이 없음. 관절: [확인 필요]. 저분자 마케팅의 임상 우위: [확인 필요].","forms":[{"name":"가수분해 콜라겐 펩타이드","bio":"—","note":"시험 대부분. 급원별 차이 없음"},{"name":"저분자(분자량 표기)","bio":"[확인 필요]","note":"임상 우위 근거 없음"}],"dose":{"typical":"2.5~10 g/일(시험별)","ul":"미설정","kr":"식약처 기능성(개별인정형 피부 보습 등) [확인 필요]"},"calc":{"unit":"g","typical":5,"ulRatio":4,"note":"5 g 기준","caveat":"1,000 mg(1 g) 제품은 20%예요."},"bestForm":"가수분해 펩타이드 ≥2.5 g","label":["콜라겐 펩타이드 g/일(1일 섭취량 기준).","1,000 mg 소포장은 시험 용량 미달."],"timing":"시간 무관.","timingShort":"무관","cautions":["어류·갑각류 알레르기","신장 질환자 단백질 부하 [확인 필요]"],"priceTip":"콜라겐 g당 가격 × 2.5~10 g. 소포장 앰플은 g당 단가가 매우 높아요.","sources":["collagen2021","collagen2023"]},{"id":"multi","name":"종합비타민","en":"Multivitamin","tags":["종합비타민","멀티비타민"],"evidence":"약함","for":"제한식·고령·임신(엽산) 보충. 질병 예방 근거 불충분","lead":"USPSTF 2022: 건강한 성인의 암·심혈관 예방 목적 종합비타민은 **근거 불충분**, 베타카로틴·비타민 E는 **반대**. 고령 인지기능에서 작은 신호(COSMOS-Mind)가 있었어요. 제한식·고령·위장수술·임신(엽산 400 µg)처럼 필요가 분명한 경우에 의미가 있고, 라벨에서 B6·비타민 A·철 함량을 봐야 해요.","evidenceNote":"암·심혈관 예방: orms":[{"name":"결정형 황산글루코사민 1,500 mg 1일 1회","bio":"—","note":"근거가 집중된 유일한 형태"},{"name":"글루코사민 염산염(HCl)","bio":"—","note":"근거 미비"},{"name":"콘드로이틴","bio":"—","note":"순도 문제 [확인 필요]"}],"dose":{"typical":"황산글루코사민 1,500 mg/일","ul":"미설정","kr":"식약처 기능성(관절·연골) 일일섭취량 [확인 필요]"},"calc":{"unit":"mg (글루코사민)","typical":1500,"ulRatio":2,"note":"1,500 mg 기준"},"bestForm":"결정형 황산글루코사민 1,500 mg","label":["염 형태(황산/염산)와 순수 글루코사민 함량.","하루 1,500 mg 도달 여부."],"timing":"식사와 함께.","timingShort":"식사와","cautions":["갑각류 알레르기(원료)","와파린 INR 상승 보고 [확인 필요]","효과가 작으니 3개월 후 무효면 중단이 합리적"],"priceTip":"결정형 황산글루코사민 1,500 mg/일 기준. 3개월 시험 후 판단.","sources":["gait2006","eriksen2014"]},{"id":"ginseng","name":"홍삼","en":"Red ginseng","tags":["홍삼","인삼","피로","면역","진세노사이드"],"evidence":"약함","for":"피로(효과 크기 작고 유의하지 않음)·면역(미검토)","lead":"19개 RCT 메타분석에서 인삼의 피로 개선은 SMD −0.36으로 **유의하지 않았고** 효과 크기가 작아요. 비교 기준은 홍삼 농축액 g이 아니라 **진세노사이드 Rg1+Rb1+Rg3 합계 mg**이에요. 와파린 복용자는 INR이 떨어질 수 있어 모니터링이 필요해요.","evidenceNote":"피로: SMD −0.36(−0.82~0.11, NS). 암 관련 피로: SMD −0.21. 면역: 메타분석 미조회 [확인 필요]. 와파린: 미국삼 INR −0.19(Yuan 2004) vs 무영향 RCT — 상충.","forms":[{"name":"홍삼 농축액·분말","bio":"—","note":"진세노사이드 합계 표기 확인"},{"name":"홍삼 정·캡슐","bio":"—","note":"동일"}],"dose":{"typical":"진세노사이드 Rg1+Rb1+Rg3 합 3~80 mg/일(식약처 기능성 범위, 비공식 요약)","ul":"미설정","kr":"공전 원문 [확인 필요]"},"calc":{"unit":"mg (진세노사이드 Rg1+Rb1+Rg3)","typical":10,"ulRatio":8,"note":"10 mg 기준(기능성 범위 3~80 mg)"},"bestForm":"진세노사이드 합계 명시 제품","label":["**진세노사이드 Rg1+Rb1+Rg3 합계 mg/일**.","농축액 g·‘6년근’은 비교 기준이 아님."],"timing":"시간 무관. 불면·두근거림 시 아침.","timingShort":"아침, 무관","cautions":["와파린 — INR 모니터링","항당뇨제(저혈당)·MAO억제제·에스트로겐 민감 질환 [확인 필요]"],"priceTip":"진세노사이드 합 10 mg당 가격. 프리미엄과 저가의 mg당 차이가 수 배예요.","sources":["ginseng_fatigue2023","yuan2004"]},{"id":"milkthistle","name":"밀크씨슬(실리마린)","en":"Milk thistle","tags":["밀크씨슬","간","실리마린","숙취"],"evidence":"약함","for":"간 질환 — 사망·합병증 감소 근거 없음. 지방간 지표 개선(중간)","lead":"코크란(18 RCT, 1,088명): 알코올성·바이러스성 간질환에서 사망·합병증·조직학 개선 모두 유의하지 않았어요. 비알코올 지방간에서는 ALT·AST 등 **혈액 지표**가 좋아졌다는 메타분석이 있지만 시험 품질이 제한적이에요. ‘숙취·간 해독’ 마케팅은 근거가 없어요.","evidenceNote":"간질환 사망 RR 0.78(NS), 합병증 RR 0.95(NS). NAFLD: 26 RCT ALT·AST 개선(대리지표).","forms":[{"name":"실리마린 표준화 추출물","bio":"낮음(수용성 낮음)","note":"식약처 일일섭취량 실리마린 130 mg 통용 [확인 필요]"}],"dose":{"typical":"실리마린 130 mg/일(국내 통용)","ul":"미설정","kr":"[확인 필요]"},"calc":{"unit":"mg (실리마린)","typical":130,"ulRatio":4,"note":"130 mg 기준"},"bestForm":"실리마린 함량 명시","label":["밀크씨슬 추출물 무게가 아니라 **실리마린 mg**."],"timing":"식사와 함께.","timingShort":"식사와","cautions":["간 질환이 있으면 보충제보다 원인 치료·금주가 먼저","국화과 알레르기"],"priceTip":"실리마린 130 mg당 가격.","sources":["rambaldi2007"]}],"symptoms":[{"id":"msk","group":"통증","icon":"bone","name":"근육·관절·허리 통증","short":"담 결림, 삐끗, 허리·어깨·무릎","tags":["허리","어깨","무릎","담","삐끗","염좌","근육통","관절","목","디스크","요통"],"lead":"진료실에서 근골격 통증 처방은 거의 항상 같은 뼈대예요 — **진통(아세트아미노펜) + 소염(NSAID) + 근이완제 + 위보호제**. 각 칸이 왜 필요한지 알면 약국에서도 같은 원리로 고를 수 있어요. 급성 요통은 대부분 몇 주 안에 저절로 좋아지니(ACP 2017), 약은 그동안 움직일 수 있게 돕는 도구예요.","planTitle":"진료실 처방의 4칸 — 약국 버전","planLabel":"필요한 칸만 골라도 돼요. 소염제는 한 가지만.","plan":[{"slot":"진통","title":"바탕 진통 — 아세트아미노펜","why":"위장·심장 부담 없이 통증의 바닥을 깔아요. 요통 단독으로는 효과가 없지만(PACE 시험), 소염제와 **함께** 쓰면 각각 단독보다 잘 들어요(코크란 NNT 1.5).","options":["acetaminophen"],"pick":"acetaminophen"},{"slot":"소염","title":"염증 잡기 — 소염진통제 한 가지","why":"급성 요통·염좌에 근거가 가장 강한 약(ACP 강한 권고). 위가 약하면 저용량 이부프로펜, 심장·혈압이 걱정이면 나프록센. 무릎·손목처럼 한 부위면 먹는 약 대신 **바르는 디클로페낙 겔**이 같은 효과에 부작용이 없어요.","options":["ibuprofen","naproxen","dexibuprofen","diclofenac-topical"],"pick":"ibuprofen","alt":"처방 소염제(아세클로페낙·셀레콕시브 등)를 이미 받았다면 약국 소염제를 더 사지 마세요."},{"slot":"근이완","title":"뭉침 풀기 — 근이완제","why":"담 결림·근육 경직이 뚜렷할 때 소염제에 붙여요. 효과는 작지만 있고(BMJ 2021), 처방은 에페리손이 표준. 약국에서는 클로르족사존 3제 복합제가 유일해요. 졸음이 있으니 저녁에.","options":["relax-combo","eperisone"],"pick":"relax-combo","optional":true,"alt":"뭉침보다 ‘찌릿한 저림’이 주 증상이면 근이완제가 아니라 진료(신경 압박 감별)."},{"slot":"위보호","title":"위 지키기 — 파모티딘","why":"소염제를 3일 이상 먹거나, 위가 약하거나, 65세 이상·항응고제·SSRI·스테로이드 복용 중이면 붙여요. 진료실에선 PPI(처방)를 쓰고, 약국 대안은 파모티딘 10 mg. 제산제(겔포스)는 궤양 예방 근거가 없어요.","options":["famotidine"],"pick":"famotidine","optional":true}],"how":["첫날: 아세트아미노펜 500~1,000 mg + 이부프로펜 400 mg을 식후에 함께. 6시간 뒤 반복.","저녁: 근이완제 복합제 1회분(졸음이 있어 밤이 좋아요) + 소염제를 계속 쓴다면 파모티딘 10 mg.","2~3일차: 통증이 잡히면 소염제부터 줄이고 아세트아미노펜만 남겨요. 소염제는 최단기간·최소량이 원칙.","국소 통증이면 먹는 소염제 대신 디클로페낙 겔 하루 3~4회 또는 NSAID 파스 하루 1~2회로 시작.","5일 넘게 소염제가 계속 필요하거나 1~2주 지나도 나아지는 흐름이 없으면 진료."],"pharmacy":["“허리(어깨) 근육통이고, 위는 괜찮아요(또는 속이 약해요). 아세트아미노펜과 이부프로펜, 근이완제 복합제, 파모티딘 주세요.”","먹고 있는 약(혈압약·항응고제·다른 진통제)과 임신 여부, 위궤양 병력을 먼저 말해 주세요.","처방 소염제가 있으면 보여 주고 “겹치지 않는 것만” 부탁하세요."],"selfcare":["**계속 움직이기** — 침대에 누워 쉬는 것보다 평소 활동을 유지하는 쪽이 회복이 빨라요(ACP 2017).","**온찜질** — 급성·아급성 요통에 5일간 통증 감소 근거(코크란). 삐끗 직후 48시간은 냉찜질.","허리는 앉아 있는 시간을 30분마다 끊기, 어깨·목은 모니터 높이 맞추기.","마사지·스트레칭은 아프지 않은 범위에서."],"avoid":["소염제 두 가지 동시 복용(이부프로펜 + 나프록센, 탁센 + 게보린 등) — 효과는 그대로, 위장·신장 위험만 두 배.","빈속 소염제, 소염제 + 술.","‘약이 약하다’며 용량을 임의로 두 배 — 대신 계열이 다른 약을 더하세요.","파스 위에 핫팩·전기장판(화상)."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["복용법 점검: 소염제를 식후에 정량으로, 아세트아미노펜과 **함께** 먹고 있나요? 따로따로 조금씩보다 첫 이틀은 규칙적으로.","약 바꾸기보다 더하기: 소염제 종류를 바꾸는 것은 효과 차이가 거의 없어요. 근이완제·파스·온찜질을 더하세요.","1~2주가 지났는데 나아지는 흐름이 없거나, 다리·팔로 저림이 내려가면 진료(영상 검사·처방 근이완제·물리치료).","4주 이상 지속되는 요통은 ‘아급성’ — 재평가와 운동치료가 필요해요."]},"care":{"pharmacy":["움직이면 아프고 쉬면 나아지는 근육·관절 통증","삐끗·담 결림·무리한 운동 뒤 통증","저림·마비·열이 없고, 대소변이 정상"],"clinic":["1~2주 약을 써도 나아지는 흐름이 없음","팔·다리로 내려가는 저림·찌릿함, 힘 빠짐","밤에 더 아프고 누워도 안 나아지는 통증","50세 이후 처음 생긴 요통, 20세 이전 요통","암 병력, 이유 없는 체중 감소, 스테로이드 장기 복용 중","열이 함께 나는 허리 통증"],"er":["대소변 조절이 안 되거나 사타구니·엉덩이 감각이 없음(마미증후군)","양쪽 다리에 힘이 빠짐","큰 사고·낙상 후 심한 통증(골절 의심)"]},"faq":[{"q":"타이레놀과 이부프로펜을 같이 먹어도 되나요?","a":"네. 계열이 달라 함께 먹을 수 있고, 급성 통증에서 각각 단독보다 효과가 좋아요(코크란 2013: 병용 NNT 1.5, 이부프로펜 단독 대비 NNT 5.4). 응급실 연구에서는 이 조합이 마약성 진통제와 같은 효과였어요."},{"q":"근이완제는 꼭 필요한가요?","a":"필수는 아니에요. 급성 요통에서 효과는 ‘작지만 있음’ 수준이고 졸음이 있어요. 뭉침·경직이 뚜렷할 때 며칠만."},{"q":"위보호제는 언제 붙이나요?","a":"소염제를 3일 이상 쓰거나, 위궤양 병력·65세 이상·항응고제·SSRI·스테로이드 복용 중일 때. 약국에선 파모티딘, 진료실에선 PPI."}],"sources":["acp2017","pace2014","derry2013combo","chang2017","cashin2021","rostom2002","derry2015topical","french2006","verhagen2016","castellsague2012","cnt2013"]},{"id":"dysmenorrhea","group":"통증","icon":"flower","name":"생리통","short":"무엇이 듣고, 언제 먹어야 하나","tags":["생리","월경","경련","자궁","생리통"],"lead":"생리통의 1차 약은 타이레놀이 아니라 **소염진통제(NSAID)**예요 — 통증을 만드는 프로스타글란딘 자체를 줄이기 때문에, 코크란 80개 시험에서 NSAID가 위약 대비 OR 4.4, 아세트아미노펜보다도 유의하게 나았어요. 그리고 **타이밍**이 절반이에요: 아프기 시작할 때(또는 시작 전날) 바로, 첫 2~3일은 시계 맞춰 규칙적으로.","planTitle":"생리통 처방의 뼈대","planLabel":"소염제 하나를 ‘미리·규칙적으로’가 핵심","plan":[{"slot":"소염","title":"1차 — 소염진통제 한 가지","why":"나프록센은 부하용량(첫 회 500 mg) 허가가 있어 시작이 확실하고 8~12시간 가요. 이부프로펜·덱시부프로펜도 동등해요(어느 NSAID가 우월하다는 근거 없음). 위가 약하면 이부프로펜, 붓기가 있으면 이지엔6 이브.","options":["naproxen","ibuprofen","dexibuprofen","easy6-eve"],"pick":"naproxen","alt":"게보린·펜잘·그날엔은 소염 성분이 적거나 진정 성분이 붙어 있어 2순위예요."},{"slot":"진통","title":"더하기 — 아세트아미노펜","why":"소염제로 부족할 때 계열이 다른 아세트아미노펜을 **함께** 더해요. 소염제를 두 가지로 늘리지는 않아요.","options":["acetaminophen"],"pick":"acetaminophen","optional":true},{"slot":"위보호","title":"속이 약하면 — 파모티딘","why":"2~3일 규칙 복용이라 속쓰림이 잦은 분은 파모티딘 10 mg을 아침·저녁으로.","options":["famotidine"],"pick":"famotidine","optional":true},{"slot":"예방","title":"매달 심하면 — 호르몬 치료(처방)","why":"NSAID로 3~6개월 안에 나아지지 않으면 2차로 경구피임약 등 호르몬 치료를 고려하고, 자궁내막증 같은 원인을 찾아요(ACOG 760).","options":[],"otc":false}],"how":["생리 시작 조짐(허리 묵직·하복부 뻐근)이 오면 **바로** 첫 회: 탁센 2캡슐(나프록센 500 mg) 또는 이부프로펜 400 mg. 규칙적으로 아픈 분은 예정일 전날부터.","이후 6~8시간마다(나프록센 250 mg) 또는 4~6시간마다(이부프로펜 200~400 mg), 아프든 안 아프든 **첫 2~3일은 시계 맞춰**.","부족하면 아세트아미노펜 500 mg을 사이에 더해요.","하루 상한: 나프록센 1,250 mg, 이부프로펜 1,200 mg(자가치료), 아세트아미노펜 4 g.","온찜질(배·허리)을 같이 — 이부프로펜과 비슷한 효과가 보고됐어요."],"pharmacy":["“생리통이에요. 나프록센(탁센)이나 이부프로펜 주세요. 속이 약하면 파모티딘도요.”","위궤양·천식·임신 가능성·항응고제 복용을 말해 주세요."],"selfcare":["**온찜질** — 메타분석에서 진통제와 동등한 효과(SMD −0.72 vs 진통제 비교 시 온열 우세).","**규칙적 운동** — 코크란: 운동군에서 통증 약 25 mm(VAS) 감소.","TENS(저주파 마사지기) — 고주파 TENS가 위약보다 통증 감소(낮은 확실성).","생강 — 소규모·편향 위험 높은 연구에서 효과 시사. 보조로만."],"avoid":["‘아플 때까지 참았다가’ 먹기 — 프로스타글란딘이 이미 만들어진 뒤라 효과가 떨어져요.","소염제 두 가지 겹치기(탁센 + 게보린, 이지엔6 + 그날엔).","빈속 소염제, 술과 함께.","매달 카페인 든 복합진통제를 여러 날 — 약물과용두통."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["타이밍과 용량 점검: 시작 즉시·부하용량·규칙 복용을 지켰나요? 이걸 지키면 대부분 달라져요.","아세트아미노펜을 더하고 온찜질을 같이.","3~6개월 이렇게 해도 매달 일상이 무너지면 산부인과 — 호르몬 치료(경구피임약 등)와 자궁내막증·선근증 검사.","생리 아닌 날에도 아프거나, 성관계 통증, 생리량 급증, 25세 이후 새로 생긴 심한 생리통은 ‘2차성’ 신호 — 진료."]},"care":{"pharmacy":["생리 첫 1~2일에 집중되는 아랫배·허리 통증","약과 온찜질로 일상이 가능한 정도"],"clinic":["NSAID를 제대로 써도 3~6개월 이상 매달 결석·결근할 정도","생리 아닌 날의 골반 통증, 성관계 통증","생리량이 갑자기 늘거나 덩어리혈","25세 이후 새로 시작된 심한 생리통","발열·냄새 나는 분비물 동반"],"er":["갑작스럽고 참을 수 없는 한쪽 아랫배 통증 + 실신·식은땀(난소 낭종 파열·자궁외임신 의심)","임신 가능성이 있는데 심한 통증·출혈"]},"faq":[{"q":"타이레놀은 생리통에 안 듣나요?","a":"듣긴 하지만 소염제보다 약해요(코크란: NSAID vs 파라세타몰 OR 1.89). 소염제를 못 드시는 분(임신 20주 이후·위궤양·천식 과민)에게 1차예요."},{"q":"탁센과 이지엔6 중 뭐가 나은가요?","a":"효과는 동등해요. 탁센(나프록센)은 부하용량 허가와 긴 지속시간이 장점, 이지엔6(이부프로펜·덱시부프로펜)는 위장 부담이 더 낮아요."},{"q":"피임약이 생리통에 도움이 되나요?","a":"네, NSAID 다음 2차 치료로 지침에 있어요(ACOG). 처방이 필요하고, 배란을 억제해 통증을 줄여요."}],"sources":["marjoribanks2015","acog760","jo2018heat","armour2019","tens2024","ginger2024","mfds_taksen","adidac2008"]},{"id":"headache","group":"통증","icon":"head","name":"두통","short":"긴장성·편두통·숙취 두통","tags":["머리","편두통","긴장성","두통"],"lead":"대부분의 두통은 긴장성이거나 편두통이고, 일반 진통제로 잡혀요. 원칙은 **초반에 충분한 용량 한 번**, 그리고 **한 달에 10~15일을 넘기지 않기** — 진통제를 자주 먹는 것 자체가 두통을 만드는 ‘약물과용두통’이 되거든요(ICHD-3). 갑자기 벼락 치듯 오는 두통은 약이 아니라 응급실이에요.","planTitle":"두통 진통제 고르기","planLabel":"단일제 두 가지 조합이 복합진통제보다 낫습니다","plan":[{"slot":"1차","title":"아세트아미노펜 또는 이부프로펜","why":"긴장성 두통엔 둘 다 1차. 편두통은 이부프로펜 400 mg·나프록센 500 mg 같은 소염제가 아세트아미노펜보다 잘 들어요(코크란 종합). 초반에 충분한 용량으로.","options":["ibuprofen","acetaminophen","naproxen"],"pick":"ibuprofen"},{"slot":"더하기","title":"부족하면 — 두 계열 함께","why":"아세트아미노펜 + 이부프로펜을 함께 먹으면 각각보다 효과가 커요. 카페인이 든 복합제(게보린·펜잘)는 효과를 조금 높이지만 월 10일 이상이면 약물과용두통 기준에 들어가요.","options":["acetaminophen","geworin","penzal"],"pick":"acetaminophen","optional":true},{"slot":"처방","title":"편두통이 잦으면 — 트립탄·예방약(처방)","why":"한 달에 두통이 4일 이상이거나 진통제로 안 잡히는 편두통은 트립탄(급성)과 예방약이 있어요. 진료가 답이에요.","options":[],"otc":false}],"how":["두통이 시작될 때 이부프로펜 400 mg(또는 아세트아미노펜 1,000 mg)을 물과 함께. 참다가 먹으면 효과가 떨어져요.","1시간 후에도 그대로면 계열이 다른 약을 더해요(이부프로펜 → 아세트아미노펜 추가).","물 두 컵, 어두운 곳에서 20분 — 탈수·수면 부족·카페인 금단이 흔한 원인이에요.","월 10일 이상 진통제를 먹고 있다면 약을 늘리지 말고 진료."],"pharmacy":["“긴장성(또는 편두통 같은) 두통이에요. 이부프로펜과 아세트아미노펜 주세요.”","한 달에 며칠이나 진통제를 먹는지 말해 주면 약사가 약물과용두통을 걸러 줘요."],"selfcare":["규칙적인 수면·식사·카페인 양(갑자기 끊으면 두통).","목·어깨 스트레칭, 화면 눈높이.","편두통은 유발 요인 일기(수면·생리·특정 음식·스트레스)."],"avoid":["복합진통제(카페인 함유)를 습관처럼 매일.","숙취 두통에 아세트아미노펜 고용량(간 부담) — 물과 휴식, 필요하면 이부프로펜 소량 식후.","‘한 알로 안 들어서’ 같은 약을 두 배로."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["초반 충분 용량 + 두 계열 조합을 해 봤나요? 카페인 음료 한 잔이 효과를 높이기도 해요(단, 습관 금지).","구역·빛 공포·한쪽 박동성이면 편두통 — 트립탄 처방으로 바뀌면 삶이 달라지는 경우가 많아요.","한 달에 15일 이상 두통 + 진통제 10~15일 이상 → 약물과용두통. 약을 끊어야 낫고, 이 과정은 진료와 함께.","아래 레드플래그 중 하나라도 있으면 약 대신 진료·응급실."]},"care":{"pharmacy":["평소와 비슷한 양상의 긴장성 두통·편두통","수면 부족·스트레스·과음 뒤 두통, 진통제에 반응"],"clinic":["한 달에 두통 4일 이상 또는 진통제 10일 이상","50세 이후 처음 생긴 두통","두통 양상이 평소와 달라지고 점점 심해짐","기침·힘주기·운동으로 유발되는 두통","임신 중 새로 생긴 두통","암·HIV·면역저하 병력"],"er":["몇 초~1분 안에 최고조에 이르는 벼락 두통","열·목 뻣뻣함·의식 저하·혼란 동반","팔다리 마비·말 어눌함·시야 장애·경련","머리 부딪힌 뒤 심해지는 두통·구토","눈 통증 + 충혈 + 시력 저하(급성 녹내장)"]},"faq":[{"q":"게보린이 두통에 제일 잘 듣지 않나요?","a":"빠르긴 하지만 근거상 아세트아미노펜 + 이부프로펜 조합이 더 강하고, 게보린은 15세 미만 금지·장기 복용 금지가 붙어 있어요. 가끔은 괜찮지만 상비약으론 단일제 두 가지가 낫습니다."}],"sources":["snnoop10","ichd3","moore2015otc","derry2013combo","mfds_geworin"]},{"id":"toothache","group":"통증","icon":"cross","name":"치통·발치 후 통증","short":"치과 가기 전까지 버티기","tags":["이","잇몸","치과","사랑니","치통","발치"],"lead":"치통의 진짜 치료는 치과지만, 예약까지 버티는 데는 **이부프로펜 400 mg + 아세트아미노펜 1,000 mg 조합**이 가장 근거가 강해요 — 사랑니 발치 통증 코크란에서 이 조합이 각각 단독보다 낫고, 응급실 연구에선 마약성 진통제와 같은 효과였어요.","planTitle":"치과 통증 처방 뼈대","planLabel":"치과에서도 이렇게 처방해요","plan":[{"slot":"소염","title":"이부프로펜 400 mg","why":"치통·발치 후 통증은 염증 통증이라 소염제가 핵심. 이부프로펜 400 mg이 아세트아미노펜 1,000 mg보다 우월(코크란 RR 1.47).","options":["ibuprofen","dexibuprofen","naproxen"],"pick":"ibuprofen"},{"slot":"진통","title":"+ 아세트아미노펜 1,000 mg","why":"함께 먹으면 6시간 진통 성공률 73%(단독 52%). 치과 처방의 표준 조합.","options":["acetaminophen"],"pick":"acetaminophen"},{"slot":"처방","title":"감염이면 — 항생제(처방)","why":"잇몸이 붓고 고름·열이 있으면 진통제로는 안 되고 치과에서 항생제·배농이 필요해요.","options":[],"otc":false}],"how":["이부프로펜 400 mg + 아세트아미노펜 1,000 mg을 식후 함께, 6시간마다.","발치 후엔 마취가 풀리기 **전에** 첫 회를 먹어 두면 통증 고비를 넘기기 쉬워요.","찬물 머금기(신경 통증 완화), 얼굴 바깥 냉찜질 20분."],"pharmacy":["“치통이에요. 이부프로펜과 아세트아미노펜 주세요.”","발치 후 출혈이 있으면 항응고제 복용 여부를 꼭."],"selfcare":["따뜻한 소금물 가글(발치 24시간 뒤부터).","딱딱하고 뜨거운 음식 피하기.","발치 부위 빨대 사용 금지(드라이소켓)."],"avoid":["아스피린을 잇몸에 직접 대기(화학 화상).","소염제 두 가지 겹치기.","발치 후 24시간 내 흡연·음주·빨대."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["조합(소염 + 진통)으로 먹고 있나요? 한 가지로는 부족한 통증이에요.","붓기·열·입 벌리기 어려움이 생기면 감염 — 당일 치과.","발치 3~4일 뒤 통증이 오히려 심해지면 드라이소켓 — 치과 재방문."]},"care":{"pharmacy":["치과 예약까지 1~3일 버티기","발치 후 예상 범위의 통증"],"clinic":["볼·잇몸 부종, 고름, 열","3일 이상 진통제로 조절 안 됨","발치 후 통증이 3~4일째 더 심해짐"],"er":["부종이 눈·목으로 번지고 삼키기·숨쉬기 어려움","고열 + 입을 못 벌림"]},"faq":[],"sources":["bailey2013","derry2013combo","chang2017"]},{"id":"sorethroat","group":"통증","icon":"cough","name":"목 아픔·인후통","short":"침 삼킬 때 아플 때","tags":["목","편도","인후","삼킴","인후통"],"lead":"인후통 대부분은 바이러스라 항생제가 필요 없고, **통증 조절**이 치료예요. 녹여 먹는 소염제 트로키(플루르비프로펜)는 11분 만에 첫 완화가 보고됐고, 먹는 아세트아미노펜·이부프로펜도 잘 들어요. 3일 넘게 심하거나 열·편도 고름이 있으면 진료.","planTitle":"인후통 조합","planLabel":"국소 + 전신, 둘 중 하나로 충분한 경우가 많아요","plan":[{"slot":"국소","title":"플루르비프로펜 트로키(스트렙실)","why":"목에 직접 닿는 소염제. 삼킴 통증·부종을 7일간 유의하게 줄였어요. 하루 5개, 3일 이내.","options":["flurbiprofen"],"pick":"flurbiprofen"},{"slot":"전신","title":"아세트아미노펜 또는 이부프로펜","why":"열·몸살이 함께 있으면 먹는 약으로. 트로키도 소염제라 이부프로펜과 겹치면 NSAID 총량을 생각해요 — 그럴 땐 아세트아미노펜.","options":["acetaminophen","ibuprofen"],"pick":"acetaminophen","optional":true},{"slot":"처방","title":"세균 편도염이면 — 항생제(처방)","why":"고열 + 편도 흰 고름 + 기침 없음 + 턱밑 림프절이면 세균성(연쇄상구균) 가능 — 검사·항생제는 진료에서.","options":[],"otc":false}],"how":["트로키 1개를 3~6시간마다 천천히 녹여요(씹지 않기). 하루 5개까지, 3일 이내.","열·몸살이 있으면 아세트아미노펜 500~1,000 mg 6시간마다.","따뜻한 물·꿀차, 가습, 소금물 가글."],"pharmacy":["“목이 아프고 삼킬 때 아파요. 소염제 트로키 주세요.”","천식·위궤양·임신 여부를 말해 주세요(소염제 성분)."],"selfcare":["꿀(1세 이상) — 기침·인후 자극 완화.","목소리 아끼기, 담배 연기 피하기.","물 자주 마시기."],"avoid":["트로키 + 이부프로펜 + 게보린 겹치기(NSAID·복합).","항생제 남은 것 임의 복용."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["3일 지나도 삼키기 힘들 정도면 진료(편도염·인두염 검사).","한쪽만 심하게 붓고 입이 안 벌어지면 편도주위농양 — 당일 진료."]},"care":{"pharmacy":["콧물·기침과 함께 오는 목 아픔(감기)","3일 이내, 열이 없거나 미열"],"clinic":["38.5도 이상 고열 + 편도 흰 고름","3일 넘게 심한 통증","귀 통증·턱밑 림프절 부종","발진 동반"],"er":["침을 삼킬 수 없어 흘림, 숨쉬기 힘듦, 목소리가 먹먹함(후두개염·농양)","입을 못 벌림 + 한쪽 심한 부종"]},"faq":[],"sources":["flurbi2018","mfds_strepsils"]},{"id":"cold","group":"감기·호흡기","icon":"temp","name":"감기 (콧물·기침·몸살)","short":"종합감기약이 답이 아닌 이유","tags":["감기","몸살","오한","코감기","독감","콧물","기침"],"lead":"감기는 약이 낫게 하는 게 아니라 7~10일 지나며 저절로 낫고, 약은 그동안 덜 힘들게 하는 도구예요. 진료실에서 감기약을 처방할 때는 **주 증상에 맞는 성분만** 골라요 — 콧물엔 항히스타민, 코막힘엔 충혈완화제, 몸살엔 해열진통제. 종합감기약은 편하지만 필요 없는 성분까지 먹게 되고, 타이레놀과 아세트아미노펜이 겹치기 쉬워요.","planTitle":"증상별로 고르는 감기약","planLabel":"해당하는 칸만 — 셋 다면 종합감기약도 괜찮아요","plan":[{"slot":"몸살","title":"열·몸살 — 아세트아미노펜 / 이부프로펜","why":"감기 몸살·발열의 기본. 편의점 타이레놀로 충분해요.","options":["acetaminophen","ibuprofen"],"pick":"acetaminophen"},{"slot":"콧물","title":"콧물·재채기 — 항히스타민","why":"밤엔 졸린 1세대(감기약 속 클로르페니라민)도 괜찮고, 낮엔 로라타딘·펙소페나딘.","options":["loratadine","fexofenadine","cetirizine","chlorpheniramine"],"pick":"loratadine","optional":true},{"slot":"코막힘","title":"코막힘 — 슈도에페드린 / 비강 분무","why":"막힘엔 항히스타민이 아니라 충혈완화제. 고혈압이면 먹는 약 대신 오트리빈 3일.","options":["pseudoephedrine","xylometazoline","coldaewon"],"pick":"xylometazoline","optional":true},{"slot":"기침","title":"기침·가래 — 필요할 때만","why":"마른기침이 잠을 방해하면 덱스트로메토르판, 가래는 구아이페네신 + 물. 일반 기침약 근거는 약해요(코크란).","options":["dextromethorphan","guaifenesin","coldaewon"],"pick":"guaifenesin","optional":true},{"slot":"종합","title":"다 있으면 — 종합감기약 하나","why":"판콜·판피린·테라플루·콜대원 등. 단, 타이레놀을 따로 더하지 말 것(아세트아미노펜 300~650 mg 포함).","options":["pancol-a","panpyrin-t","theraflu","coldaewon","tylenol-cold"],"pick":"pancol-a","optional":true}],"how":["낮: 아세트아미노펜 + (필요 시) 로라타딘 / 코막힘엔 오트리빈 1회.","밤: 종합감기약 1회분(졸린 성분이 잠에 도움) — 이때 타이레놀은 빼요.","물 2 L, 가습, 수면. 3일 넘는 38.5도 열은 진료."],"pharmacy":["“콧물만 나요 / 코가 막혀요 / 몸살만 있어요” — 주 증상을 말하면 성분을 골라 줘요.","고혈압·전립선·녹내장·임신·65세 이상을 말해 주세요(코막힘약·항히스타민 주의)."],"selfcare":["따뜻한 수분·꿀차(1세 이상), 가습.","식염수 코 세척(코막힘·콧물에 근거 있음).","휴식 — 감기는 면역이 낫게 해요."],"avoid":["종합감기약 + 타이레놀 + 게보린 — 아세트아미노펜 3중 중복.","종합감기약 + 수면유도제 + 멀미약 — 항히스타민 중복.","감기에 항생제(바이러스엔 무효).","2세 미만 감기약(근거 없음·위험)."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["감기는 7~10일이 정상 경로예요. 약은 증상 완화용.","3일 이상 38.5도, 10일 넘는 증상, 나아지다 다시 심해짐(2차 감염) → 진료.","숨이 차거나 가슴 통증, 누런 가래 + 고열은 폐렴·독감 감별."]},"care":{"pharmacy":["콧물·재채기·미열·몸살, 3일 이내","식욕·활동이 유지됨"],"clinic":["38.5도 이상 열이 3일 이상","10일 넘게 지속되거나 좋아지다 다시 악화","귀 통증, 얼굴 통증(부비동염), 누런 가래 + 열","독감 유행기 고열·근육통(48시간 내 항바이러스제)","천식·COPD·당뇨·임신·65세 이상·영유아의 감기"],"er":["숨이 차고 입술이 파래짐","의식 혼미, 경련","가슴 통증, 피 섞인 가래"]},"faq":[{"q":"판콜과 타이레놀을 같이 먹어도 되나요?","a":"판콜에이 1병에 아세트아미노펜 300 mg이 이미 들어 있어요. 같이 먹으면 총량이 늘어 하루 4 g을 넘길 수 있으니, 같은 시간대엔 하나만."}],"sources":["desutter2022","cough2014","salerno2005","galen2010","mfds_pancol","fda_apap"]},{"id":"fever","group":"감기·호흡기","icon":"temp","name":"열이 날 때","short":"성인·소아 해열제 고르기","tags":["열","발열","해열","오한","아이","해열제"],"lead":"열 자체는 병이 아니라 몸의 반응이라, 해열제는 **힘들 때 편하게 해 주는 용도**예요. 성인은 아세트아미노펜 또는 이부프로펜 한 가지로 충분하고, 아이는 체중 기준 용량이 전부예요. 3일 넘는 열, 생후 3개월 미만의 열은 약이 아니라 진료.","planTitle":"해열제 고르기","planLabel":"한 가지로 시작, 교차는 필요할 때만","plan":[{"slot":"성인","title":"아세트아미노펜 500~1,000 mg","why":"위장·심장 부담 없이 1차. 몸살 통증이 심하면 이부프로펜 400 mg도 좋아요.","options":["acetaminophen","ibuprofen"],"pick":"acetaminophen"},{"slot":"소아","title":"체중 기준 — 아세트아미노펜 10~15 mg/kg / 이부프로펜 5~10 mg/kg","why":"나이보다 **체중**으로 계산해요. 아세트아미노펜은 4~6시간 간격 하루 5회 이하(생후 4개월↑), 이부프로펜은 6~8시간 간격(생후 6개월↑, 탈수 시 피함).","options":["acetaminophen","ibuprofen","dexibuprofen"],"pick":"acetaminophen"},{"slot":"교차","title":"한 가지로 안 떨어지면 — 교차 복용","why":"아세트아미노펜 먹고 2~3시간 뒤에도 힘들어하면 이부프로펜을 사이에. 각각의 간격은 지키고, 기록해 두세요.","options":[],"optional":true}],"how":["성인: 아세트아미노펜 500~1,000 mg 4~6시간마다(하루 4 g 이내).","아이(예: 10 kg): 어린이 타이레놀 현탁액(160 mg/5 mL) 1회 3~4.5 mL, 4~6시간마다.","얇게 입히고 미지근한 물수건. 찬물·알코올 마사지 금지.","물·이온음료 자주."],"pharmacy":["아이 몸무게를 말하면 mL 단위로 용량을 계산해 줘요.","이미 먹인 약(감기약 속 아세트아미노펜 포함)을 말해 주세요."],"selfcare":["수분, 휴식, 얇은 옷.","열 그래프 기록(시간·온도·약)."],"avoid":["15세 미만 아스피린·게보린·펜잘(라이증후군·IPA).","감기 시럽 + 해열제 이중 아세트아미노펜.","생후 6개월 미만 이부프로펜, 탈수(구토·설사) 중 이부프로펜.","찬물 목욕·알코올 마사지."],"notWorking":{"title":"약을 먹어도 열이 안 떨어질 때","steps":["해열제는 1~1.5도 정도만 내려요. 아이가 놀고 마시면 숫자보다 상태를 보세요.","체중 기준 용량이 맞는지 다시 계산.","3일 넘는 열, 또는 열 + 아래 레드플래그면 진료."]},"care":{"pharmacy":["감기 동반 38~39도, 3일 이내, 물 잘 마시고 활동함"],"clinic":["3일 이상 지속되는 열","생후 3~6개월 영아의 38도 이상","귀·목·소변 통증 동반","발진 동반","만성질환자·65세 이상·임신 중"],"er":["생후 3개월 미만의 38도 이상","경련, 의식 저하, 축 처짐","목 뻣뻣함·심한 두통·눌러도 안 없어지는 자반","숨 가쁨·입술 청색","40도 이상 + 해열제 무반응"]},"faq":[{"q":"교차 복용은 꼭 해야 하나요?","a":"필수는 아니에요. 한 가지로 편해지면 그걸로. 교차는 헷갈려서 과량 사고가 나기 쉬우니 시간·약을 꼭 적어 두세요."}],"sources":["aap_fever","mfds_tylenol","glasgow2006","fda_apap"]},{"id":"cough","group":"감기·호흡기","icon":"cough","name":"기침·가래","short":"마른기침과 가래기침은 약이 다르다","tags":["기침","가래","진해","거담"],"lead":"기침은 기도를 청소하는 반사라 **가래가 있으면 막지 말고 묽게**, **마른기침이 잠을 방해할 때만 눌러요**. 코크란 종합에서 일반 기침약의 효과 근거는 약했고, 꿀·수분·가습이 비슷한 역할을 해요. 3주 넘는 기침은 감기가 아닐 수 있어요.","planTitle":"기침 유형별","planLabel":"가래 유무가 갈림길","plan":[{"slot":"가래","title":"가래 기침 — 거담제 + 물","why":"구아이페네신(감기약 속) 또는 아세틸시스테인. 물 2 L가 약만큼 중요해요.","options":["guaifenesin","coldaewon"],"pick":"guaifenesin"},{"slot":"마른","title":"마른기침 — 밤에만 진해제","why":"덱스트로메토르판. 가래 기침엔 쓰지 않아요(배출 방해).","options":["dextromethorphan","tylenol-cold"],"pick":"dextromethorphan","optional":true},{"slot":"처방","title":"3주 이상·쌕쌕 — 진료","why":"후비루·역류·천식·감염후기침 감별과 흡입제·처방 진해제.","options":[],"otc":false}],"how":["가래: 물 자주, 가습, 구아이페네신 든 감기약 하루 3회.","마른기침: 취침 전 덱스트로메토르판 1회분 + 꿀 한 숟갈(1세 이상).","코가 뒤로 넘어가는 후비루면 항히스타민·식염수 세척이 더 맞아요."],"pharmacy":["“가래가 있어요 / 마른기침이에요” 구분해서 말하세요.","SSRI 항우울제 복용 중이면 덱스트로메토르판 주의를 말해 주세요."],"selfcare":["꿀(1세 이상), 따뜻한 물, 가습.","금연·간접흡연 피하기.","취침 시 머리 높이기(후비루·역류)."],"avoid":["가래 기침에 진해제.","1세 미만 꿀.","4세 미만 일반 기침약."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["감기 후 기침은 3주까지 갈 수 있어요.","3주 넘거나, 밤에 쌕쌕·숨참, 피 섞인 가래, 체중 감소·식은땀이 있으면 진료(천식·역류·결핵·폐렴 감별)."]},"care":{"pharmacy":["감기와 함께 온 3주 이내 기침","열 없음 또는 미열, 숨참 없음"],"clinic":["3주 이상 기침","누런 가래 + 열, 가슴 통증","쌕쌕거림·밤 기침(천식 의심)","체중 감소·식은땀·피 섞인 가래","혈압약(ACE억제제) 복용 후 시작된 마른기침"],"er":["숨이 차서 말이 끊김, 입술 청색","다량 객혈","갑작스런 가슴 통증 + 호흡곤란"]},"faq":[],"sources":["cough2014","desutter2022"]},{"id":"rhinitis","group":"감기·호흡기","icon":"nose","name":"코막힘·콧물·재채기","short":"감기인지 알레르기인지","tags":["코","비염","알레르기","재채기","코막힘","콧물"],"lead":"맑은 콧물·재채기·눈 가려움이 매년 같은 계절에 반복되면 알레르기 비염, 열·몸살과 함께 며칠이면 감기예요. 알레르기 비염의 1차 치료는 항히스타민제가 아니라 **스테로이드 비강분무제(처방)**이고, 약국 항히스타민제는 콧물·재채기엔 좋지만 **코막힘엔 약해요**.","planTitle":"코 증상별","planLabel":"콧물엔 항히스타민, 막힘엔 충혈완화제","plan":[{"slot":"콧물","title":"콧물·재채기 — 2세대 항히스타민","why":"낮엔 로라타딘·펙소페나딘(졸음 거의 없음), 효과 우선이면 세티리진(취침 전).","options":["loratadine","fexofenadine","cetirizine"],"pick":"loratadine"},{"slot":"막힘","title":"코막힘 — 비강 분무 3일 / 슈도에페드린","why":"오트리빈은 5분 안에 뚫리지만 3일 이상 쓰면 반동성 비염. 먹는 슈도에페드린은 고혈압·전립선·불면 주의.","options":["xylometazoline","pseudoephedrine","coldaewon"],"pick":"xylometazoline","optional":true},{"slot":"처방","title":"지속 비염 — 스테로이드 비강분무(처방)","why":"코막힘·콧물·재채기를 모두 줄이는 1차 치료(2020 지침). 매일 써야 효과가 나요.","options":["mometasone"],"otc":false}],"how":["알레르기 시즌: 로라타딘 10 mg 아침 1회(또는 세티리진 취침 전). 시작 전부터 미리 먹으면 더 잘 들어요.","코막힘이 심한 밤: 오트리빈 각 콧구멍 1회, 3일만.","식염수 코 세척 하루 1~2회."],"pharmacy":["“콧물·재채기가 주예요 / 코막힘이 주예요.”","고혈압·전립선·녹내장·임신·운전 여부."],"selfcare":["식염수 세척, 침구 세탁·진드기 커버, 창문 닫고 공기청정기(꽃가루철).","실내 습도 40~50%."],"avoid":["오트리빈 3일 초과(약물성 비염).","감기약 + 항히스타민제 이중 복용.","고혈압에 슈도에페드린 장기."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["항히스타민제로 코막힘이 안 잡히는 건 정상 — 스테로이드 비강분무제 처방이 답이에요.","한쪽만 막히고 피·냄새, 얼굴 통증·누런 콧물 10일 이상은 부비동염·다른 원인 감별."]},"care":{"pharmacy":["맑은 콧물·재채기·가려움, 계절성","감기 동반 코 증상 1주 이내"],"clinic":["매년 반복되는 비염(처방 분무제·검사)","10일 넘는 누런 콧물 + 얼굴 통증·열(부비동염)","한쪽만 막힘·코피·냄새","소아의 코골이·입 벌리고 자기"],"er":["얼굴·눈 주위 심한 부종 + 고열(안와 봉와직염)","심한 두통 + 목 뻣뻣함"]},"faq":[],"sources":["dykewicz2020","mann2000","mfds_otrivin","salerno2005"]},{"id":"heartburn","group":"소화기","icon":"stomach","name":"속쓰림·신물 역류","short":"제산제·위산억제제 차이","tags":["속쓰림","역류","위산","가슴쓰림","신물","식도염"],"lead":"**지금 당장** 끄려면 제산제(몇 분, 1~2시간), **밤에 미리 막으려면** 파모티딘(1시간, 10~12시간). 신물이 올라오는 역류엔 알긴산(개비스콘)이 물리적으로 막아 줘요. 국내에서 PPI는 처방약이라, 2주 넘게 약이 필요하면 진료가 정답이에요.","planTitle":"속쓰림 약 고르기","planLabel":"지금 vs 예방 vs 역류","plan":[{"slot":"지금","title":"당장 — 제산제","why":"알마겔·겔포스: 5~15분 안에 중화. 다른 약과 2시간 띄우기.","options":["almagate","aluminium-phosphate"],"pick":"almagate"},{"slot":"역류","title":"신물 역류 — 알긴산","why":"위 위에 젤 층을 만들어 식후·누웠을 때 역류를 막아요.","options":["alginate"],"pick":"alginate","optional":true},{"slot":"예방","title":"예방·유지 — 파모티딘","why":"밤 속쓰림, 소염제 복용 중 위보호. 14일 이내.","options":["famotidine"],"pick":"famotidine","optional":true},{"slot":"처방","title":"2주 넘으면 — PPI(처방)","why":"역류성 식도염·궤양은 PPI 4~8주 요법. 내시경 검사도.","options":["omeprazole"],"otc":false}],"how":["식후 속쓰림: 제산제 1포. 신물 역류: 개비스콘 10~20 mL 식후·취침 전.","밤마다 쓰리면: 파모티딘 10 mg 저녁 식후.","취침 3시간 전 식사 끝, 머리 쪽 10~15 cm 높이기."],"pharmacy":["“식후에 쓰려요 / 밤에 신물이 올라와요” 구분.","복용 중인 약(소염제·항생제·갑상선약 — 제산제와 간격 필요)."],"selfcare":["야식·과식·기름진 음식·술·커피·탄산 줄이기.","복부 압박 옷 피하기, 체중 감량.","금연."],"avoid":["소염제·아스피린을 빈속에.","제산제 장기 매일(신장·전해질).","2주 이상 약으로 버티기."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["2주 넘게 필요하면 진료 — PPI와 내시경.","삼킴 곤란·체중 감소·검은 변·토혈·빈혈은 경고 신호 — 즉시 진료."]},"care":{"pharmacy":["식후·야식 뒤 속쓰림, 2주 이내","약에 반응함"],"clinic":["2주 이상 지속·재발","55세 이후 새로 생긴 증상","삼킬 때 걸림·통증, 체중 감소, 빈혈","소염제·아스피린 장기 복용 중 속쓰림"],"er":["검은 변, 피 토함","가슴 통증이 조이듯·식은땀·왼팔 저림(심장 감별)","심한 복통 + 배가 딱딱함"]},"faq":[{"q":"가슴이 쓰린데 심장 문제일 수도 있나요?","a":"역류 통증은 눕거나 식후에 심하고 제산제에 반응해요. 운동할 때 조이는 통증·식은땀·숨참이면 심장 문제일 수 있으니 응급실."}],"sources":["rostom2002","mfds_famotidine","mfds_gaviscon","fda_ppi","ppi_otc"]},{"id":"dyspepsia","group":"소화기","icon":"stomach","name":"체함·더부룩·소화불량","short":"소화제가 듣는 경우와 아닌 경우","tags":["체함","더부룩","소화","명치","가스","소화불량"],"lead":"과식·기름진 음식 뒤 더부룩함엔 소화효소제(훼스탈·베아제)가 맞고, 명치가 쓰리거나 아프면 위산 쪽(제산제·파모티딘)이에요. 편의점 소화제로 며칠 버텨도 안 낫는 명치 통증은 위염·궤양·담낭·심장까지 감별이 필요해요.","planTitle":"소화불량 약 고르기","planLabel":"더부룩 vs 쓰림","plan":[{"slot":"효소","title":"과식 후 더부룩 — 소화효소제","why":"편의점 훼스탈·베아제. 식후 1~2정.","options":["digestive-enzyme"],"pick":"digestive-enzyme"},{"slot":"가스","title":"가스·트림 — 시메티콘","why":"거품을 터뜨려 배출. 흡수 안 돼 안전.","options":["simethicone"],"pick":"simethicone","optional":true},{"slot":"쓰림","title":"명치 쓰림 — 제산제·파모티딘","why":"위산 증상이면 소화제로는 안 돼요.","options":["almagate","famotidine"],"pick":"almagate","optional":true},{"slot":"처방","title":"반복되면 — 위장운동촉진제·검사(처방)","why":"기능성 소화불량은 처방약과 헬리코박터 검사로.","options":[],"otc":false}],"how":["식후 소화제 1~2정, 따뜻한 물, 가벼운 걷기 10분.","명치가 쓰리면 제산제로 바꿔 보고, 반복되면 파모티딘."],"pharmacy":["“더부룩해요 / 명치가 쓰려요” 구분해서."],"selfcare":["천천히 먹기, 소식, 식후 바로 눕지 않기.","탄산·기름진 음식·술 줄이기."],"avoid":["‘체했다’에 손 따기·구토 유도.","명치 통증에 진통제(소염제)로 버티기 — 위를 더 상하게."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["1~2주 반복되면 진료(위염·궤양·헬리코박터·담낭).","체중 감소·검은 변·삼킴 곤란·55세 이후 첫 발생은 경고."]},"care":{"pharmacy":["과식 뒤 더부룩함, 하루이틀"],"clinic":["2주 이상 반복","체중 감소·빈혈·검은 변","오른쪽 윗배 통증 + 기름진 음식 후 악화(담낭)","55세 이후 새로 생김"],"er":["명치 통증 + 식은땀·숨참·왼팔 저림(심근경색)","배가 딱딱하고 눌렀다 뗄 때 더 아픔","피 토함·검은 변"]},"faq":[],"sources":["mohw_safestad"]},{"id":"diarrhea","group":"소화기","icon":"drop","name":"설사","short":"지사제를 쓰면 안 되는 설사","tags":["설사","배탈","장염","물변"],"lead":"급성 설사의 치료는 약이 아니라 **물 + 전해질**이에요. 지사제(로페라마이드)는 열·혈변이 없는 물설사에서 ‘꼭 멈춰야 할 때’만 2일 이내로, **열·혈변·점액이 있으면 금기**예요(세균을 가둬요). 6세 미만 소아에게는 쓰지 않아요.","planTitle":"설사 대처","planLabel":"수분 보충이 1순위, 약은 조건부","plan":[{"slot":"수분","title":"경구수액(ORS) — 진짜 치료","why":"약국 경구수액제 또는 물 + 소금·설탕. 이온음료는 물로 반 희석.","options":[],"pick":""},{"slot":"지사","title":"조건부 — 로페라마이드","why":"열·혈변 없는 물설사, 이동·업무 때문에 멈춰야 할 때. 첫 회 4 mg, 이후 2 mg. 2일 이내.","options":["loperamide"],"pick":"loperamide","optional":true},{"slot":"흡착","title":"보조 — 스멕타이트","why":"독소·수분 흡착. 2세 미만·임신 금지, 다른 약과 2시간 간격.","options":["smectite"],"pick":"smectite","optional":true},{"slot":"처방","title":"열·혈변·여행자 설사 — 진료(항생제)","why":"세균성·기생충 감별과 항생제는 진료에서.","options":[],"otc":false}],"how":["설사할 때마다 물 한 컵 + 경구수액. 소변 색이 옅어질 때까지.","죽·바나나·흰쌀·토스트 등 부드러운 음식, 유제품·기름진 것 잠시 피하기.","로페라마이드는 조건이 맞을 때만 2일."],"pharmacy":["“열이나 혈변은 없어요/있어요”를 먼저 말하세요 — 지사제 가능 여부가 갈려요.","항생제 복용 중이면 꼭 말하기(항생제 설사)."],"selfcare":["손 씻기(가족 전파 예방).","프로바이오틱스(LGG·S. boulardii)는 항생제 설사 예방에 근거."],"avoid":["열·혈변 있는 설사에 지사제.","영유아 지사제.","탈수 상태에서 소염제(신장)."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["2일 넘는 설사, 하루 6회 이상, 탈수 징후(소변 감소·어지러움)면 진료.","혈변·고열·심한 복통은 즉시."]},"care":{"pharmacy":["열·혈변 없는 물설사, 2일 이내, 물을 마실 수 있음"],"clinic":["2일 이상 지속 또는 하루 6회 이상","38도 이상 열, 혈변·점액변","여행 후 설사, 항생제 복용 중 설사","영유아·노인·임신·만성질환자의 설사"],"er":["소변이 거의 안 나옴·어지러워 서지 못함(심한 탈수)","심한 복통 + 혈변 + 고열","영유아가 축 처지고 눈물·소변이 없음"]},"faq":[],"sources":["li2007lop","mfds_loperamide","mfds_smecta","guo2019"]},{"id":"constipation","group":"소화기","icon":"stomach","name":"변비","short":"순한 것부터 단계별로","tags":["변비","배변","대변"],"lead":"지침(AGA-ACG 2023)의 순서는 식이섬유·수분 → **삼투성 완하제(PEG·마그네슘)** → 자극성(비사코딜)은 급할 때. 마그밀은 매일 써도 습관성이 적고, 자극성 변비약은 1주 이상 매일 쓰면 장이 약에 기대요. 심한 복통·구토를 동반한 변비는 약을 먹으면 안 돼요(장폐색).","planTitle":"변비약 단계","planLabel":"순한 것부터, 급할 때만 자극성","plan":[{"slot":"1단계","title":"삼투성 — 산화마그네슘(마그밀)","why":"장에 물을 끌어들여 부드럽게. 매일 가능. 신장 나쁘면 금지.","options":["magnesium-oxide"],"pick":"magnesium-oxide"},{"slot":"급할때","title":"자극성 — 비사코딜(둘코락스)","why":"밤에 먹고 아침에. 1주 이내.","options":["bisacodyl"],"pick":"bisacodyl","optional":true},{"slot":"처방","title":"만성이면 — PEG·처방약","why":"PEG(폴리에틸렌글리콜)는 강한 권고 등급. 프루칼로프라이드 등은 처방.","options":[],"otc":false}],"how":["마그밀 하루 2정(1 g)부터, 물 충분히. 변이 무르면 줄이고 딱딱하면 늘려요.","급할 때: 둘코락스 2정 취침 전 1회.","아침 식후 화장실 앉는 습관, 발판으로 무릎 높이기."],"pharmacy":["신장 질환 여부(마그네슘 금지), 복용약(철분제·진통제·항우울제가 변비 원인)."],"selfcare":["식이섬유(채소·과일·통곡물) + 물 1.5~2 L — 섬유만 늘리고 물이 부족하면 더 막혀요.","걷기 30분.","변의를 참지 않기."],"avoid":["자극성 변비약 매일 장기.","복통·구토·배 팽만 동반 변비에 변비약.","관장 남용."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["2주 이상 지속·재발이면 진료(PEG·처방약·원인 약물 조정).","50세 이후 새로 생긴 변비가 6주 이상, 혈변·체중 감소는 대장 검사."]},"care":{"pharmacy":["일시적 변비(여행·식습관 변화)","복통·구토 없음"],"clinic":["2주 이상 지속","50세 이후 새로 생김, 6주 이상","혈변·체중 감소·빈혈","가늘어진 변, 변비·설사 교대"],"er":["심한 복통 + 구토 + 배 팽만 + 방귀·변이 전혀 안 나옴(장폐색)"]},"faq":[],"sources":["aga2023cic","peg2010","mfds_magmil","mfds_dulcolax"]},{"id":"motion","group":"소화기","icon":"car","name":"멀미","short":"타기 전에 미리","tags":["멀미","배","차","비행기","구토"],"lead":"멀미약은 **증상이 생긴 뒤엔 늦고**, 출발 전에 먹어야 해요. 짧은 이동은 30분~1시간 전 먹는 디멘히드리네이트, 배·장거리는 4시간 전 붙이는 키미테. 둘 다 졸리고, 운전자·7세 이하·임신·녹내장·전립선비대는 피해요.","planTitle":"멀미약 고르기","planLabel":"이동 시간으로 고르기","plan":[{"slot":"짧게","title":"1~4시간 이동 — 디멘히드리네이트","why":"출발 30~60분 전 1~2정. 코크란: 예방 효과 확인, 졸음 동반.","options":["dimenhydrinate"],"pick":"dimenhydrinate"},{"slot":"길게","title":"배·장거리 — 스코폴라민 패치","why":"출발 4시간 전 귀 뒤, 3일 지속. 붙인 뒤 손 씻기.","options":["scopolamine"],"pick":"scopolamine","optional":true}],"how":["출발 전 미리, 물과 함께.","앞자리·창밖 먼 곳 보기, 책·폰 보지 않기, 환기."],"pharmacy":["아이 나이(8~15세 키미테는 처방), 임신, 녹내장·전립선, 운전 여부."],"selfcare":["출발 전 가벼운 식사(빈속·과식 모두 악화).","생강차, 손목 지압(근거 약함)."],"avoid":["멀미약 + 감기약 + 수면유도제(항히스타민 중복).","키미테 붙인 손으로 눈 만지기."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["이미 증상이 시작됐다면 약보다 환기·눕기·눈 감기.","이동과 무관하게 어지럼·구토가 반복되면 진료(전정기관)."]},"care":{"pharmacy":["이동 중에만 생기는 메스꺼움"],"clinic":["이동과 무관한 반복 어지럼·구토","귀울림·청력 저하 동반"],"er":["갑작스런 심한 어지럼 + 말 어눌함·복시·한쪽 힘 빠짐(뇌졸중 감별)"]},"faq":[],"sources":["karrim2022","mfds_kimite","mfds_bonaring"]},{"id":"allergy","group":"알레르기·피부","icon":"leaf","name":"알레르기·두드러기·가려움","short":"졸리지 않은 항히스타민제 고르기","tags":["두드러기","가려움","알레르기","항히스타민","벌레","발진"],"lead":"두드러기·가려움·알레르기 콧물엔 2세대 항히스타민제 하루 한 알이 기본이에요. **낮엔 로라타딘·펙소페나딘, 효과 우선이면 세티리진(취침 전)**. 입술·눈이 붓거나 숨이 차면 약이 아니라 응급실이에요.","planTitle":"항히스타민제 고르기","planLabel":"졸음과 효과 사이","plan":[{"slot":"낮","title":"졸림 없이 — 로라타딘 / 펙소페나딘","why":"운전·업무 중. 펙소페나딘은 주스·제산제와 함께 먹지 않기.","options":["loratadine","fexofenadine"],"pick":"loratadine"},{"slot":"밤","title":"효과 우선 — 세티리진","why":"2세대 중 가장 강한 편, 취침 전.","options":["cetirizine"],"pick":"cetirizine","optional":true},{"slot":"국소","title":"벌레 물림·국소 가려움 — 바르는 약","why":"국소 스테로이드·항히스타민 연고(약국). 긁지 않기.","options":[],"optional":true},{"slot":"처방","title":"6주 이상·심하면 — 진료","why":"만성 두드러기는 항히스타민 증량(의사)·검사. 원인 알레르기 검사.","options":[],"otc":false}],"how":["로라타딘 10 mg 아침 1회 또는 세티리진 10 mg 취침 전 1회. 증상이 반복되는 기간엔 매일.","냉찜질이 가려움을 줄여요."],"pharmacy":["운전·업무 여부, 신장·간 질환, 임신, 복용 중 감기약."],"selfcare":["미지근한 샤워·보습, 꽉 끼는 옷 피하기.","새로 먹은 음식·약·접촉 물질 기록."],"avoid":["감기약(클로르페니라민) + 항히스타민제 중복.","뜨거운 물·긁기."],"notWorking":{"title":"약을 먹어도 낫지 않을 때","steps":["세티리진으로 바꾸거나 저녁 복용.","6주 넘게 반복되면 만성 두드러기 — 진료에서 용량 조정·검사.","붓기·호흡 증상은 응급."]},"care":{"pharmacy":["국소 두드러기·가려움, 벌레 물림","약에 반응, 호흡 증상 없음"],"clinic":["6주 이상 반복","약 먹어도 전신 두드러기 지속","발열·관절통 동반 발진","특정 음식·약 뒤 반복"],"er":["입술·혀·눈 부종, 목 조임, 쉰 목소리","숨참·쌕쌕거림, 어지럼·실신(아나필락시스)","두드러기 + 복통·구토가 급격히"]},"faq":[],"sources":["mann2000","dykewicz2020","galen2010"]},{"id":"wound","group":"알레르기·피부","icon":"band","name":"상처·긁힘·화상","short":"연고보다 먼저 할 것","tags":["상처","긁힘","화상","베임","소독","흉터","데임"],"lead":"작은 상처의 원칙은 **흐르는 물로 씻기 → 습윤 밴드**예요. 항생제 연고(후시딘·마데카솔케어)는 고름·붉게 번짐 같은 감염 징후가 있을 때만 — 그냥 바르면 내성만 늘어요. 화상은 흐르는 찬물 10~20분이 전부이고, 얼음·치약·소주는 금지.","planTitle":"상처 처치 순서","planLabel":"약보다 세척과 보호가 먼저","plan":[{"slot":"세척","title":"흐르는 수돗물로 씻기","why":"이물·세균 제거. 과산화수소·알코올은 조직을 상하게 해 요즘은 권하지 않아요.","options":[],"pick":""},{"slot":"보호","title":"습윤 밴드 / 바세린","why":"촉촉하게 유지하면 딱지 없이 빨리·흉 적게 아물어요.","options":[],"pick":""},{"slot":"감염","title":"감염 징후 있을 때만 — 항생제 연고","why":"고름·붉게 번짐·열감·통증 증가. 후시딘과 무피로신은 동등(코크란).","options":["fusidic-acid","mupirocin"],"pick":"fusidic-acid","optional":true},{"slot":"통증","title":"아프면 — 아세트아미노펜 / 이부프로펜","why":"화상 통증엔 이부프로펜이 소염까지.","options":["acetaminophen","ibuprofen"],"pick":"ibuprofen","optional":true}],"how":["씻기 → 물기 닦기 → 습윤 밴드(1~2일마다 교체).","화상: 흐르는 찬물 10~20분 → 물집 터뜨리지 않기 → 화상 드레싱.","감염 징후가 생기면 항생제 연고 하루 1~2회, 1주 이내."],"pharmacy":["“감염 징후는 없어요, 습윤 밴드 주세요.” / “고름이 나요.”","당뇨·면역저하·항응고제 복용 여부."],"selfcare":["파상풍 예방접종 10년 이내인지 확인(더러운 상처·동물 교상).","햇빛 차단(색소침착)."],"avoid":["과산화수소·알코올·빨간약 반복 소독.","화상에 얼음·치약·소주·감자.", function dupCheck(optionIds){
  const taking = (ME.taking || []).map(drug).filter(Boolean); if (!taking.length) return [];
  const out = [];
  optionIds.forEach(oid => { const o = drug(oid); if (!o) return; taking.forEach(t => {

    if (t.id === oid) out.push(`**${t.name}**은(는) 이미 드시고 있어요. 같은 성분을 다시 사거나 겹쳐 드시지 마세요.`);
    else if (ingr.includes(oid)) out.push(`지금 드시는 **${t.name}**에 이미 ${o.name} 성분이 들어 있어요. 따로 더 드시면 중복돼요.`);
    else if (o.class === 'nsaid' && (t.class === 'nsaid' || (t.contains || []).some(x => drug(x)?.class === 'nsaid'))) out.push(`지금 드시는 **${t.name}**도 소염진통제(NSAID) 계열이에요. ${o.name}과 겹쳐 먹지 마세요 — 소염제는 한 번에 한 가지.`);

function search(q){
  q = q.toLowerCase(); const out = [];
  const m = (s) => (s || '').toLowerCase().includes(q);
  (D.symptoms || []).forEach(s => { if (m(s.name) || (s.tags || []).some(m)) out.push({ k:'증상', c:'s', t:s.name, d:s.short || '', h:'/symptom/' + s.id, w:3 }); });

  });
  (D.supplements || []).forEach(s => { if (m(s.name) || (s.tags || []).some(m)) out.push({ k:'영양제', c:'', t:s.name, d:s.for || '', h:'/supp/' + s.id, w:1 }); });

  return out.sort((a, b) => b.w - a.w);
}

  return `${topBar({ back:'뒤로' })}<h1>‘${esc(q.q || '')}’ 검색</h1><div class="card results" style="margin-top:16px">${hitsHtml(hits) || `<div class="empty"><b>검색 결과가 없어요</b>증상 이름(허리·두통·생리통)이나 성분 이름으로 찾아보세요.</div>`}</div>`;

/* ───────── 증상 상세: 처방 스타일 조합 ───────── */
function fitChips(){
  const opts = [['pregnant', '임신·수유'], ['ulcer', '위가 약함·궤양'], ['heart', '고혈압·심장'], ['anticoag', '항응고제'], ['kidney', '신장'], ['asthma', '천식']];
  const age = [['senior', '65세 이상'], ['child', '소아·청소년']];
  return `<div class="fitme"><div class="small muted" style="margin-bottom:6px;font-weight:600">나에게 맞추기 — 해당하면 눌러 주세요</div><div class="chips">${opts.map(([k, n]) => `<button class="chip ${ME[k] ? 'on' : ''}" onclick="ME['${k}']=!ME['${k}'];saveMe();route()">${ME[k] ? I.check : ''}${esc(n)}</button>`).join('')}${age.map(([k, n]) => `<button class="chip ${ME.age === k ? 'on' : ''}" onclick="ME.age=ME.age==='${k}'?'adult':'${k}';saveMe();route()">${ME.age === k ? I.check : ''}${esc(n)}</button>`).join('')}</div></div>`;
}
function basket(s){
  const f = activeFlags();
  return (s.plan || []).filter(p => p.otc !== false && p.options?.length).map(p => {
    let pick = p.pick || p.options[0]; let d = drug(pick);
    const bad = x => drug(x)?.avoid?.some(a => a.flags?.some(fl => f.includes(fl)));
    let swapped = false;
    if (d && bad(pick)) { const alt = p.options.find(o => !bad(o) && drug(o)?.rx !== '전문'); if (alt) { pick = alt; d = drug(alt); swapped = true; } }
    return { slot: p.slot, d, optional: !!p.optional, swapped, blocked: d ? bad(pick) : false, product: d?.products?.[0]?.name };
  }).filter(x => x.d);
}
function memoText(s){
  const items = basket(s).map(x => x.blocked ? `${x.slot}: ${x.d.name}은(는) 내 상태(${activeFlags().map(k => FLAG_LABEL[k] || k).join('·')})에 주의 — 약사와 상의` : `${x.optional ? '(필요 시) ' : ''}${x.d.name}${x.product ? ' — 예: ' + x.product : ''}`);
  return `[약손] ${s.name}\n${items.map(t => '· ' + t).join('\n')}\n${s.pharmacy?.[0] ? '\n' + s.pharmacy[0].replace(/\*\*/g, '') : ''}\n\n소염제는 한 가지만 · 아세트아미노펜 하루 4 g 이내`;
}
async function shareMemo(id){ const s = byId(D.symptoms, id); const t = memoText(s); try { if (navigator.share) { await navigator.share({ title: '약국 메모 · ' + s.name, text: t }); return; } } catch (e) { return; } try { await navigator.clipboard.writeText(t); toast('약국 메모를 복사했어요'); } catch (e) { prompt('복사해서 쓰세요', t); } }
const acc = (title, body, sub, open) => body ? `<details class="acc" ${open ? 'open' : ''}><summary>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}${I.chev}</summary><div class="bd">${body}</div></details>` : '';
function vSymptom(id){
  const s = byId(D.symptoms, id); if (!s) return vHome();
  const f = activeFlags();
  const bk = basket(s);
  const dups = dupCheck((s.plan || []).flatMap(p => p.options || []));
  const slotHtml = (p, i) => {
    const kind = p.otc === false ? 'rx' : (p.optional ? 'opt' : '');
    return `<div class="slot"><div class="n ${kind}">${esc(p.slot)}</div><div>
      <h3>${esc(p.title || p.slot)} ${p.otc === false ? '<span class="badge rx">처방 필요</span>' : p.optional ? '<span class="badge warn">필요할 때만</span>' : '<span class="badge otc">약국 구입</span>'}</h3>
      <p class="why">${fmt(p.why)}</p>
      <div class="opts">${(p.options || []).map(oid => { const d = drug(oid); if (!d) return ''; const warn = d.avoid?.some(a => a.flags?.some(x => f.includes(x))); return `<a class="opt-pill ${p.pick === oid ? 'pick' : ''}" href="#/drug/${oid}">${p.pick === oid ? '<span class="dot"></span>' : ''}${esc(d.name)}${warn ? ' <span class="badge stop">내 정보 주의</span>' : ''}</a>`; }).join('')}</div>
      ${p.alt ? `<p class="alt">${fmt(p.alt)}</p>` : ''}
    </div></div>`;
  };
  const clinic = (s.care?.clinic || []).slice(0, 2), er = (s.care?.er || []).slice(0, 1);
  return `${topBar({ back:'증상' })}
  <div class="eyebrow">${esc(s.group)}</div>
  <h1>${esc(s.name)}</h1>
  ${fitChips()}
  <section class="sec answer" aria-label="바로 답">
    <div class="eyebrow">바로 답 — 이렇게 사세요</div>
    <div class="buy">${bk.map(x => `<a class="buy-item ${x.optional ? 'opt' : ''} ${pimg(x.product) ? 'has-img' : ''}" href="#/drug/${x.d.id}" style="text-decoration:none;color:inherit"><span class="k">${esc(x.slot)}</span>${imgTag(pimg(x.product), 'pimg', x.product)}<span><b>${esc(x.d.name)}${x.blocked ? ' <span class="badge stop">내 정보 주의</span>' : x.swapped ? ' <span class="badge warn">내 정보에 맞춰 바꿈</span>' : ''}</b><small>${esc((x.product || '').split('·')[0].replace(/ 등$/, ''))}${x.optional ? ' · 필요할 때만' : ''}</small></span><span class="badge ${x.d.rx === '안전상비' ? 'cvs' : 'otc'} rx">${x.d.rx === '안전상비' ? '편의점' : '약국'}</span></a>`).join('')}</div>
    ${s.plan?.some(p => p.otc === false) ? `<p class="small muted" style="margin-top:8px">${esc(s.plan.filter(p => p.otc === false).map(p => p.title || p.slot).join(', '))} — 처방이 필요해요(아래 자세히).</p>` : ''}
    <div class="line"><span>이렇게</span><span>${fmt(s.how?.[0] || '')}</span></div>
    ${clinic.length ? `<div class="line stop"><span>병원은</span><span>${esc(clinic.join(' · '))}${er.length ? ` · <b>응급실:</b> ${esc(er[0])}` : ''}</span></div>` : ''}
    <div class="memo-actions"><button class="btn" onclick="shareMemo('${s.id}')">${I.cart} 약국 메모 보내기·복사</button></div>
    ${dups.length ? dups.map(t => `<div class="dup">${I.alert}<span>${fmt(t)}</span></div>`).join('') : ''}
  </section>
  <p style="margin-top:16px">${fmt(s.lead)}</p>
  <section class="sec">
    <div class="rx-card">
      <div class="rx-head"><div><h2>${esc(s.planTitle || '진료실에서 처방하는 방식')}</h2><div class="lbl">${esc(s.planLabel || '같은 원리로 약국에서 고르면 돼요')}</div></div><span class="rx-stamp">${esc(D.meta?.stamp || '전문의 검수')}</span></div>
      ${(s.plan || []).map(slotHtml).join('')}
    </div>
  </section>
  ${acc('이렇게 드세요', list(s.how, 'steps'), '순서·간격·상한', true)}
  ${acc('약국에서 이렇게 말하세요', list(s.pharmacy), '한 문장으로')}
  ${acc('약 없이도 도움이 되는 것', list(s.selfcare))}
  ${acc('피해야 할 것', list(s.avoid, 'plain x'))}
  ${s.notWorking ? acc(s.notWorking.title || '약을 먹어도 낫지 않을 때', list(s.notWorking.steps, 'steps')) : ''}
  <section class="sec"><h2>어디까지 약국, 어디부터 병원인가요</h2>${careCards(s.care)}${!s.care ? flagBox('이럴 땐 약을 사지 말고 진료를 받으세요', s.redflags, s.redflagLead) : ''}</section>
  ${s.faq?.length ? acc('자주 묻는 질문', s.faq.map(f => `<h3 style="margin-top:12px">${esc(f.q)}</h3><p style="margin-top:4px;font-size:.9375rem">${fmt(f.a)}</p>`).join('')) : ''}
  ${srcChips(s.sources)}
  ${disclaimer()}`;
}

/* ───────── 3단계 안내(처음 오신 분 진입로) ───────── */

/* ───────── 약 사전 ───────── */
function vDrugs(_, q){
  const cat = q.cat || 'all';
  const cats = [['all', '전체'], ['cvs', '편의점'], ...(D.classes || []).map(c => [c.id, c.short || c.name])];
  let items = (D.drugs || []);
  if (cat === 'cvs') items = items.filter(d => d.rx === '안전상비' || d.products?.some(p => p.rx === '안전상비'));
  else if (cat !== 'all') items = items.filter(d => d.class === cat);
  return `${topBar()}
  <h1>약 사전</h1><p style="margin-top:6px">성분 기준으로 정리했어요. 제품 이름이 달라도 성분이 같으면 같은 약이에요.</p>
  <div class="search" role="search">${I.search}<input id="q" placeholder="약 이름·성분 검색" autocomplete="off" enterkeyhint="search"></div>
  <button class="tile wide" style="margin-top:12px" onclick="go('/pill')"><div class="ic">${I.eye}</div><div><b>이 알약이 무슨 약인지 찾기</b><span>모양·색·각인으로 식약처 낱알 ${(D.public?.pills_count || 0).toLocaleString()}건 검색</span></div>${I.chev}</button>

  ${disclaimer()}`;
}
document.addEventListener('input', e => { if (e.target.id === 'q' && !e.target.closest('.hero')) { let r = document.getElementById('live'); const v = e.target.value.trim(); if (v.length < 2) { r?.remove(); return; } if (!r) { r = document.createElement('div'); r.id = 'live'; r.className = 'card results'; e.target.closest('.search').insertAdjacentElement('afterend', r); } r.innerHTML = hitsHtml(search(v).slice(0, 8)) || '<div class="empty"><b>검색 결과가 없어요</b>성분 이름으로도 찾아보세요.</div>'; } });

/* ───────── 계열 비교(차트는 코드로) ───────── */
function scatter(c){
  const pts = (c.members || []).map(id => drug(id)).filter(d => d?.risk?.gi && d?.risk?.cv);
  if (!pts.length) return '';
  const W = 400, H = 320, P = { l:28, r:20, t:44, b:40 };
  const x = v => P.l + (v - 0.5) / 5 * (W - P.l - P.r), y = v => H - P.b - (v - 0.5) / 5 * (H - P.t - P.b);
  const grid = [1, 2, 3, 4, 5].map(v => `<line x1="${x(v)}" y1="${P.t}" x2="${x(v)}" y2="${H - P.b}" stroke="var(--hairline)" stroke-dasharray="2 4"/><line x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}" stroke="var(--hairline)" stroke-dasharray="2 4"/>`).join('');
  const groups = {};
  pts.forEach(d => { const k = d.risk.gi + ',' + d.risk.cv; (groups[k] = groups[k] || []).push(d); });
  const dots = Object.entries(groups).map(([k, arr], i) => {
    const [gi, cv] = k.split(',').map(Number); const cx = x(gi), cy = y(cv);
    const anchor = cx > W - 90 ? 'end' : cx < P.l + 70 ? 'start' : 'middle'; const tx = anchor === 'end' ? cx + 10 : anchor === 'start' ? cx - 10 : cx;
    const above = cv >= 3; // 위쪽 점은 라벨을 아래로, 아래쪽 점은 위로
    const lines = arr.map((d, j) => { const dy = above ? 22 + j * 15 : -(14 + (arr.length - 1 - j) * 15); return `<text x="${tx}" y="${cy + dy}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="${d.rx === '전문' ? 'var(--rx)' : 'var(--text)'}">${esc(d.name.replace(/ \(.*?\)/, ''))}</text>`; }).join('');
    const rx = arr.every(d => d.rx === '전문');
    return `<circle cx="${cx}" cy="${cy}" r="${arr.length > 1 ? 8 : 7}" fill="${rx ? 'var(--rx)' : 'var(--primary)'}" opacity=".9"/>${arr.length > 1 && !rx && arr.some(d => d.rx === '전문') ? `<circle cx="${cx}" cy="${cy}" r="3" fill="var(--rx)"/>` : ''}${lines}`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.name)} 위장 부담과 심혈관 부담 비교 산점도">
    ${grid}
    <text x="${P.l}" y="${P.t - 22}" font-size="11" font-weight="700" fill="var(--muted)">↑ 심혈관 부담 (위로 갈수록 큼)</text>
    <text x="${W - P.r}" y="${H - 12}" text-anchor="end" font-size="11" font-weight="700" fill="var(--muted)">위장 부담 (오른쪽으로 갈수록 큼) →</text>
    <text x="${P.l + 4}" y="${H - P.b - 8}" font-size="10" fill="var(--normal)" font-weight="700">둘 다 낮음</text>
    ${dots}</svg>
    <div class="legend"><span><i style="background:var(--primary)"></i>약국·편의점 구입</span><span><i style="background:var(--rx)"></i>처방 필요</span><span>같은 자리의 성분은 한 점에 묶었어요</span></div>
    <p class="small muted" style="margin-top:6px">${esc(c.chartNote || '위치는 대규모 관찰연구·메타분석의 상대위험을 5단계로 옮긴 것으로, 개인 용량·기간·기저질환에 따라 달라져요.')}</p></div>`;
}

  ${s.forms?.length ? `<section class="sec card"><h2>제형별 차이 <small>흡수·부작용</small></h2><div class="scroll-x"><table class="cmp"><thead><tr><th>제형</th><th>흡수</th><th>특징</th></tr></thead><tbody>${s.forms.map(f => `<tr><td>${esc(f.name)}</td><td>${esc(f.bio || '—')}</td><td>${fmt(f.note || '')}</td></tr>`).join('')}</tbody></table></div></section>` : ''}

  ${s.calc ? `<section class="sec card"><h2>내 제품 계산해 보기 <small>유효용량 대비 %</small></h2><p class="small muted" style="margin-top:4px">라벨의 1회 함량과 가격을 넣으면 임상 유효용량 대비 몇 %인지, 유효용량 1회분당 가격이 얼마인지 보여드려요.</p>
    <div class="calc"><label>1회 함량 (${esc(s.calc.unit)})<input type="number" inputmode="decimal" id="c-amt" placeholder="예: ${esc(String(s.calc.typical))}"></label><label>1회 분량 (정·포)<input type="number" inputmode="numeric" id="c-per" value="1"></label><label>제품 가격 (원)<input type="number" inputmode="numeric" id="c-price" placeholder="예: 25000"></label><label>총 개수 (정·포)<input type="number" inputmode="numeric" id="c-n" placeholder="예: 90"></label></div>
    <div class="calc-out"><div><small>유효용량 대비</small><b id="c-pct">—</b><span class="small muted">기준 ${esc(String(s.calc.typical))} ${esc(s.calc.unit)}${s.calc.note ? ' · ' + esc(s.calc.note) : ''}</span></div><div><small>유효용량 1회분 가격</small><b id="c-won">—</b><span class="small muted">낮을수록 경제적</span></div></div>
    <p class="small muted" style="margin-top:8px">${esc(s.calc.caveat || '상한(UL)을 넘는 함량은 “많을수록 좋다”가 아니에요. 100%를 넘으면 과량 여부를 확인하세요.')}</p></section>` : ''}
  ${s.label?.length ? `<section class="sec card"><h2>라벨에서 볼 것</h2>${list(s.label, 'steps')}</section>` : ''}
  ${s.timing ? `<section class="sec card"><h2>언제, 어떻게</h2><p>${fmt(s.timing)}</p></section>` : ''}
  ${s.cautions?.length ? `<section class="sec card"><h2>주의</h2>${list(s.cautions, 'plain x')}</section>` : ''}
  ${s.priceTip ? `<section class="sec card"><h2>가격 비교는 이렇게</h2><p>${fmt(s.priceTip)}</p></section>` : ''}
  ${srcChips(s.sources)}
  <div class="actions"><button class="btn ghost" onclick="toggleCmp('${s.id}',true);go('/supp')">${I.scale} 비교 목록에 담기</button></div>
  ${disclaimer(D.meta?.suppDisclaimer)}`;
}
function vCompare(_, q){
  const ids = (q.ids || '').split(',').filter(Boolean); const items = ids.map(supp).filter(Boolean);
  if (!items.length) return vSupp();
  const rows = [['근거', s => evTag(s.evidence)], ['용도', s => esc(s.for || '')], ['유효 용량', s => esc(s.dose?.typical || '—')], ['상한(UL)', s => esc(s.dose?.ul || '—')], ['좋은 제형', s => esc(s.bestForm || s.forms?.[0]?.name || '—')], ['복용 시점', s => fmt(s.timingShort || s.timing || '—')], ['주의', s => fmt((s.cautions || []).slice(0, 2).join(' / '))]];
  const overlap = (D.suppRules?.overlaps || []).filter(o => o.ids.every(i => ids.includes(i)));
  return `${topBar({ back:'영양제' })}<h1>성분 비교</h1><p style="margin-top:6px">${items.map(s => esc(s.name)).join(' · ')}</p>
  ${overlap.length ? `<section class="sec">${overlap.map(o => `<div class="note">${I.alert}<span>${fmt(o.text)}</span></div>`).join('')}</section>` : ''}
  <section class="sec card"><div class="scroll-x"><table class="cmp"><thead><tr><th></th>${items.map(s => `<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(([lab, fn]) => `<tr><td>${lab}</td>${items.map(s => `<td>${fn(s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
  ${disclaimer(D.meta?.suppDisclaimer)}`;
}

/* ───────── 내 정보 ───────── */
function vMe(){
  const T = (k, t, sub) => `<div class="toggle"><div class="t"><b>${esc(t)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div><button class="sw ${ME[k] ? 'on' : ''}" role="switch" aria-checked="${!!ME[k]}" aria-label="${esc(t)}" onclick="ME['${k}']=!ME['${k}'];saveMe();route()"></button></div>`;
  return `${topBar()}
  <h1>내 정보</h1><p style="margin-top:6px">여기 표시한 상태에 따라 약 추천에 <b>주의 표시</b>가 붙어요. 진료실에서 의사가 처방 전에 꼭 묻는 것들이에요.</p>
  <section class="sec card"><h2>글자 크기</h2><div class="seg" style="margin-top:12px">${[['16px', '보통'], ['18px', '크게'], ['20px', '더 크게']].map(([k, n]) => `<button class="${(localStorage.getItem('yakson.fs') || '16px') === k ? 'on' : ''}" onclick="setFs('${k}')">${n}</button>`).join('')}</div></section>
  <section class="sec card"><h2>나이</h2><div class="seg" style="margin-top:12px">${[['adult', '성인'], ['senior', '65세 이상'], ['child', '소아·청소년']].map(([k, n]) => `<button class="${ME.age === k ? 'on' : ''}" onclick="ME.age='${k}';saveMe();route()">${n}</button>`).join('')}</div></section>
  <section class="sec card"><h2>해당하는 것을 켜 주세요</h2>
    ${T('pregnant', '임신 중이거나 수유 중', '소염진통제는 임신 20주 이후 피해요')}
    ${T('ulcer', '위궤양·위장출혈 병력', '소염진통제를 고를 때 가장 중요해요')}
    ${T('kidney', '신장 질환', '소염진통제·마그네슘 등에 주의')}
    ${T('liver', '간 질환', '아세트아미노펜 용량에 주의')}
    ${T('alcohol', '술을 자주 마심', '주 3회 이상이면 켜 주세요')}
    ${T('heart', '심장·혈관 질환, 고혈압', '일부 소염진통제·코감기약에 주의')}
    ${T('asthma', '천식', '아스피린·소염진통제로 악화될 수 있어요')}
    ${T('anticoag', '항응고제·항혈소판제 복용', '와파린·아스피린·클로피도그렐 등')}
    ${T('gout', '통풍', '아스피린 저용량은 요산을 올려요')}
    ${T('glaucoma', '녹내장', '일부 감기약·멀미약 성분에 주의')}
    ${T('bph', '전립선비대', '코감기약·항히스타민제로 소변이 막힐 수 있어요')}
    <p class="privacy">${I.lock}입력한 내용은 이 기기에만 저장되고 어디로도 전송되지 않아요.</p>
  </section>
  <section class="sec card"><h2>지금 먹는 약 <small class="muted" style="font-weight:500;font-size:.8125rem">중복 성분을 잡아드려요</small></h2>
    <p class="small" style="margin-top:6px">감기약·진통제·처방약을 등록해 두면, 증상별 추천에서 <b>같은 성분이 겹치는지</b> 알려드려요.</p>
    <div class="taking">${(ME.taking || []).map(id => { const d = drug(id); return d ? `<span class="chip">${esc(d.name)}<button aria-label="${esc(d.name)} 빼기" onclick="toggleTaking('${id}')">${I.x}</button></span>` : ''; }).join('') || '<span class="small muted">아직 등록한 약이 없어요.</span>'}</div>
    <div class="search" style="margin-top:12px">${I.search}<input id="q" placeholder="약 이름으로 찾아 등록" autocomplete="off"></div>
  </section>
  <section class="sec card"><h2>이 앱에 대해</h2><p class="small" style="margin-top:6px">${esc(D.meta?.about || '')}</p><div class="actions"><button class="btn line" onclick="go('/about')">근거·검수 기준 보기</button></div></section>
  <p class="small muted" style="margin-top:16px;text-align:center">약손 v${esc(D.meta?.version || '')} · 빌드 ${BUILD}</p>`;
}
function vAbout(){
  const S = D.sources || {};
  return `${topBar({ back:'내 정보' })}<h1>근거와 검수 기준</h1>
  <section class="sec card"><h2>이렇게 만들었어요</h2>${list(D.meta?.method || [])}</section>
  <section class="sec card"><h2>참고 문헌·지침 <small>${Object.keys(S).length}건</small></h2><div class="rows">${Object.entries(S).map(([k, s]) => `<a class="row" href="${esc(s.url)}" target="_blank" rel="noopener" style="text-decoration:none"><div class="body"><b>${esc(s.label)}</b><span>${esc(s.type || '')}${s.note ? ' · ' + esc(s.note) : ''}</span></div>${I.link}</a>`).join('')}</div></section>
  ${disclaimer()}`;
}

document.addEventListener('input', e => { if (!e.target.closest('.calc')) return; const id = location.hash.split('/')[2]?.split('?')[0]; const s = supp(id); if (!s?.calc) return; const amt = +document.getElementById('c-amt').value, per = +document.getElementById('c-per').value || 1, price = +document.getElementById('c-price').value, n = +document.getElementById('c-n').value; const pct = document.getElementById('c-pct'), won = document.getElementById('c-won'); if (amt > 0) { const perServing = amt * per; const r = perServing / s.calc.typical; pct.textContent = Math.round(r * 100) + '%'; pct.style.color = r > (s.calc.ulRatio || 99) ? 'var(--alert)' : r < 0.5 ? 'var(--caution)' : 'var(--primary-deep)'; if (price > 0 && n > 0) { const unitPrice = price / n; const effDoses = perServing / s.calc.typical; won.textContent = Math.round(unitPrice * per / effDoses).toLocaleString('ko-KR') + '원'; } else won.textContent = '—'; } else { pct.textContent = '—'; won.textContent = '—'; } });
function setFs(v){ try { localStorage.setItem('yakson.fs', v); } catch (e) {} document.documentElement.style.setProperty('--fs', v); route(); }
try { const fs = localStorage.getItem('yakson.fs'); if (fs) document.documentElement.style.setProperty('--fs', fs); } catch (e) {}
/* ───────── 시작 ───────── */
try { if (!localStorage.getItem('yakson.seen') && !location.hash) { localStorage.setItem('yakson.seen', '1'); location.hash = '#/guide/1'; } } catch (e) {}
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
