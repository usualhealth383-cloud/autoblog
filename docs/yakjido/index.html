    const qs = { txt: R.pill.imprint_front || R.pill.imprint_back || '', sh: Object.keys(SHAPES_SVG).includes(R.pill.shape) ? R.pill.shape : '', c: COLORS[R.pill.color] ? R.pill.color : '', ln: R.pill.score_line ? 'y' : '' };
    let res = pillSearch(qs, true); if (!res.length && qs.txt) res = pillSearch({ ...qs, sh:'', c:'' }, true); if (!res.length && R.pill.imprint_back) res = pillSearch({ ...qs, txt: R.pill.imprint_back, sh:'', c:'' }, true);
    parts.push(`<section class="sec"><h2>사진과 비교해 골라 주세요 <small>읽은 글자 ‘${esc(R.pill.imprint_front || '')}${R.pill.imprint_back ? ' / ' + esc(R.pill.imprint_back) : ''}’ · ${esc(R.pill.shape || '')} · ${esc(R.pill.color || '')}</small></h2>${res.length ? `<div class="pill-grid">${res.slice(0, 6).map(([sc, p]) => pillCard(p, sc)).join('')}</div>` : '<div class="empty"><b>비슷한 약을 못 찾았어요</b>글자·모양·색으로 직접 찾아보세요.</div>'}<div class="actions"><button class="btn ghost" onclick="Object.assign(PILLQ,{txt:'${esc(qs.txt)}',sh:'${qs.sh}',c:'${qs.c}',rx:true});go('/pill')">${I.search} 조건 바꿔서 더 찾기</button></div></section>`);
  }
  // 약봉투·상자·직접 입력: 항목별 매칭
  const items = (R.items || []).filter(x => x.name);
  if (items.length) {
    const seen = {}; const dupWarn = [];
    const cards = items.map(it => {
      const { d, pub, supp, via } = matchName(it.name, it.ingredients);
      const ingrTxt = (it.ingredients || []).join(', ');
      if (d) { const k = d.class === 'nsaid' ? 'nsaid' : d.id; const contains = [d.id, ...(d.contains || [])]; for (const c of contains) { if (seen[c]) dupWarn.push(`${seen[c]}${josa(seen[c])} ${it.name}에 ${drug(c)?.name || c} 성분이 겹쳐요.`); seen[c] = it.name; } if (d.class === 'nsaid' || (d.contains || []).some(x => drug(x)?.class === 'nsaid')) { if (seen.__nsaid && seen.__nsaid !== it.name) dupWarn.push(`${seen.__nsaid}${josa(seen.__nsaid)} ${it.name} — 소염진통제가 두 가지예요. 겹쳐 드시지 마세요.`); seen.__nsaid = it.name; } }
      const pid = pub ? 'pub:' + (pub.seq || pub.id) : '';
      return `<div class="found"><b>${esc(it.name)}</b>${it.strength ? ` <span class="badge otc">${esc(it.strength)}</span>` : ''}${it.confidence != null && it.confidence < .6 ? ' <span class="badge warn">읽기 불확실</span>' : ''}
        <div class="m">${ingrTxt ? '성분: ' + esc(ingrTxt) : ''}${d && via !== 'pub' ? ` → <a class="link" href="#/drug/${d.id}">${esc(d.name)}</a>` : pub ? ` → <a class="link" href="#/pub/${pub.id}">${esc(pub.n.replace(/\(.*?\)/g, ''))}</a>${d ? ` <span class="muted">(성분 해설: <a class="link" href="#/drug/${d.id}">${esc(d.name.split(' ')[0])}</a>)</span>` : ''}` : supp ? ` → <a class="link" href="#/supp/${supp.id}">${esc(supp.name)}</a>` : ' — 약지도 사전에 없어요. 약사에게 확인하세요.'}</div>
        ${d ? `<div class="simple">${esc(R.kind === 'bag' && R.directions ? '봉투 용법대로: ' + R.directions : d.simple || '')}</div>${d.pict?.length ? picts(d.pict) : ''}${meWarnings(d)}` : supp ? `<div class="simple">${esc(supp.timing || '')}</div><p class="small muted" style="margin-top:4px">근거 ${esc(supp.evidence || '')} · 상한 ${esc(supp.dose?.ul || '—')}</p>` : ''}
        ${d ? `<div class="actions" style="margin-top:10px"><button class="btn ghost" style="min-height:44px" onclick="if(!(ME.taking||[]).includes('${d.id}'))toggleTaking('${d.id}')">${(ME.taking || []).includes(d.id) ? I.check + ' 내 약통에 있어요' : I.pill + ' 내 약통에 등록'}</button></div>` : ''}</div>`;
    }).join('');
    parts.push(`<section class="sec"><h2>${esc(kindLabel)}에서 읽은 약 ${items.length}개</h2>${[...new Set(dupWarn)].map(t => `<div class="dup" style="margin-top:0;margin-bottom:8px">${I.alert}<span>${esc(t)}</span></div>`).join('')}${cards}</section>`);
  }
  // 영양제 라벨
  if (R.supplement?.ingredients?.length) {
    const rows = R.supplement.ingredients.map(x => { const sp = (D.supplements || []).find(sp => [sp.name, ...(sp.tags || [])].some(t => (x.name || '').replace(/\s+/g, '').includes(t.replace(/\s+/g, '').slice(0, 3)))); let note = ''; if (sp?.calc && x.amount) { const unitOk = (sp.calc.unit || '').split(' ')[0].toLowerCase() === (x.unit || '').toLowerCase(); if (unitOk) { const r = x.amount / sp.calc.typical; note = `유효용량의 ${Math.round(r * 100)}%${r > (sp.calc.ulRatio || 99) ? ' — 상한 초과 가능, 확인' : ''}`; } } return `<tr><td>${esc(x.name || '')}</td><td>${x.amount != null ? esc(String(x.amount)) + ' ' + esc(x.unit || '') : '—'}</td><td>${sp ? `<a class="link" href="#/supp/${sp.id}">${esc(sp.name)}</a>${note ? '<br><small class="muted">' + esc(note) + '</small>' : ''}` : '—'}</td></tr>`; }).join('');
    parts.push(`<section class="sec card"><h2>영양제 성분표 <small>${esc(R.supplement.basis || '')}</small></h2><div class="scroll-x"><table class="cmp"><thead><tr><th>성분</th><th>함량</th><th>약지도 해설</th></tr></thead><tbody>${rows}</tbody></table></div></section>`);
  }
  if (R.warnings?.length) parts.push(`<section class="sec">${flagBox('라벨에 적힌 경고', R.warnings)}</section>`);
  if (!parts.length) parts.push(`<div class="empty"><b>약을 읽지 못했어요</b>글자가 보이게 다시 찍거나 이름을 직접 적어 주세요.</div><div class="actions"><button class="btn ghost" onclick="photoManual()">약 이름 직접 적기</button></div>`);
  return `${PH.img ? `<img src="${PH.img}" alt="" style="width:100%;max-height:200px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--hairline)">` : ''}${parts.join('')}`;
}

/* ───────── 내 약 목록 한 장 — 진료실·약국 카운터에서 보여 드리는 화면 ─────────
   어르신이 "무슨 약 드세요?" 에 답하지 못해 생기는 사고가 가장 흔하다. 목록 + 앱이 미리 본 판정을
   큰 글씨로. 판정은 참고이고, 마지막 줄에서 약사 판단이 우선임을 밝힌다. */
const ACH_LV_WORD = { ok: '낮음', warn: '주의', stop: '높음' };
function vBag(){
  const items = takingItems(); const res = ixRun([]); const f = activeFlags();
  const al = achList([]); const sc = achScore(al); const lv = achLevel(sc);
  const stops = res.hits.filter(h => h.r.lv === 'stop').length + (res.dupe.length ? 1 : 0);
  const warns = res.hits.filter(h => h.r.lv === 'warn').length;
  const tone = stops ? 'stop' : warns || lv !== 'ok' ? 'warn' : 'ok';
  return `${topBar({ back:'이전' })}
  <div class="eyebrow">진료실·약국에서</div>
  <h1 style="font-size:1.375rem">제가 먹는 약이에요</h1>

  : `<div class="show-card">

    <ol class="show-list">${items.map((x, i) => `<li><span class="n">${i + 1}</span><div><b>${esc(x.name)}</b><small>${esc(x.approx ? '종류만 알아요 — 이름은 약봉투에' : x.pub?.ingr ? '성분: ' + x.pub.ingr : x.simple || '')}</small>${x.short ? '<span class="badge warn" style="margin-top:4px">며칠만</span>' : ''}</div></li>`).join('')}</ol>
    <p class="show-ask">새로 주시는 약과 같이 먹어도 되는지 봐 주세요.</p>
  </div>
  <div class="show-card tone-${tone}">
    <div class="show-head">앱이 미리 본 것</div>
    ${!res.hits.length && !res.dupe.length && lv === 'ok' ? `<p class="show-big ok">${I.check}<span>걸리는 조합은 나오지 않았어요<small>모든 조합을 담지는 못해요 — 약사님 판단이 우선입니다</small></span></p>` : ''}
    ${res.dupe.map(d => `<p class="show-big stop">${I.alert}<span>같은 성분이 두 번<small>${esc(d.e?.n || '')} — ${d.items.map(i => esc(i.name)).join(' · ')}</small></span></p>`).join('')}
    ${res.hits.map(h => `<p class="show-big ${h.r.lv}">${h.r.organ ? icon(h.r.organ.ico) : h.r.lv === 'info' ? I.clock : I.alert}<span>${h.r.organ ? `<em class="org">${esc(h.r.organ.n)}</em> ` : ''}${esc(h.r.t)}<small>${h.items.map(i => esc(i.name)).join(' + ')} · ${esc(IX_LV[h.r.lv][0])}</small></span></p>`).join('')}
    ${sc ? `<p class="show-big ${lv}">${lv === 'ok' ? I.info : I.alert}<span>항콜린 부담 ${sc}점 · ${ACH_LV_WORD[lv]}<small>${al.filter(x => x.e.ach).map(x => esc(x.e.n)).slice(0, 6).join(' · ')}${lv === 'ok' ? '' : ' — 입마름·변비·어지럼·기억 흐림이 있으면 말씀하세요'}</small></span></p>` : ''}
    ${res.unknown.length ? `<p class="small muted" style="margin-top:8px">성분을 확인하지 못한 약 ${res.unknown.length}가지는 판정에서 빠져 있어요.</p>` : ''}
  </div>
  ${aeCard()}
  <div class="actions"><button class="btn ghost" onclick="shareBag()">${I.cart} 메모로 복사·전송</button><button class="btn ghost" onclick="window.print()">${I.book} 종이로 뽑기</button><button class="btn ghost" onclick="go('/together')">${I.shield} 자세한 판정 보기</button></div>`}
  ${disclaimer('이 한 장은 참고용이에요. 약을 스스로 끊거나 바꾸지 마시고, 약사·의사의 판단을 따르세요.')}`;

/* ── 약 먹고 불편했던 일 ──
   해외 복약 앱은 「오늘 몸이 어땠나」를 묻고, 국내 앱에는 그 자리가 없다.
   진료실에서 「그 약 먹고 어땠어요?」에 「좀 안 좋았던 것 같은데…」로 끝나는 그 자리다.
   적어 두면 다음 진료 때 약을 바꿀 근거가 된다. 기록은 이 휴대폰에만 둔다. */
/* 2026-09-18 → 「9월 18일」. 해가 다르면 해까지 적는다 */
function dateWord(k){ const m = String(k).match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return k;
  const y = +m[1], mo = +m[2], d = +m[3]; const now = new Date().getFullYear();
  return (y === now ? '' : y + '년 ') + mo + '월 ' + d + '일'; }
function aeList(){ ME.ae = ME.ae || []; return ME.ae; }
function aeAdd(){
  const who = document.getElementById('ae-who')?.value || '';
  const what = (document.getElementById('ae-what')?.value || '').trim();
  const when = document.getElementById('ae-when')?.value || todayKey();
  if (!what) { toast('어떤 일이 있었는지 한 줄만 적어 주세요'); document.getElementById('ae-what')?.focus(); return; }
  const it = takingItems().find(x => x.id === who);
  aeList().unshift({ id: who, n: it ? it.name : '어느 약인지 모르겠어요', at: when, t: what.slice(0, 200) });
  ME.ae = aeList().slice(0, 50);
  saveMe(); route(); toast('적어 두었어요 — 진료 때 보여 주세요');
}
function aeDel(i){ aeList().splice(i, 1); saveMe(); route(); }
function aeCard(){
  const items = takingItems(); const list = aeList();
  return `<section class="sec card"><h2>약 먹고 불편했던 일</h2>
  <p class="small" style="margin-top:6px">진료실에서 <b>「그 약 드시고 어떠셨어요?」</b>라고 여쭤보면 막상 떠오르지 않으시죠. 그때그때 한 줄로 적어 두시면 됩니다. <b>이 휴대폰에만 남아요.</b></p>
  ${list.length ? `<ul class="ae-list">${list.map((x, i) => `<li><div><b>${esc(x.n)}</b><span>${esc(dateWord(x.at))}</span><p>${esc(x.t)}</p></div><button class="ae-x" onclick="aeDel(${i})" aria-label="${esc(x.t.slice(0, 20))} 지우기">${I.x}</button></li>`).join('')}</ul>` : ''}
  <div class="ae-form">
    <label class="ae-lbl" for="ae-who">어느 약이었나요</label>
    <select id="ae-who" class="ae-inp">${items.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}<option value="">어느 약인지 모르겠어요</option></select>
    <label class="ae-lbl" for="ae-what">어떤 일이 있었나요</label>
    <input id="ae-what" class="ae-inp" placeholder="예) 속이 메스껍고 어지러웠어요" maxlength="200" autocomplete="off">
    <label class="ae-lbl" for="ae-when">언제였나요</label>
    <input id="ae-when" class="ae-inp" type="date" value="${todayKey()}" max="${todayKey()}">

  </div>
  <div class="note" style="margin-top:12px">${I.info}<span><b>숨이 차거나 얼굴·입술이 붓거나 온몸에 두드러기가 번지면 적지 마시고 바로 119입니다.</b> 그 약은 다시 드시지 마시고, 약 이름을 꼭 기억해 두세요.</span></div>
  <details class="why-more ae-why" style="margin-top:10px"><summary>크게 다치셨다면 — 나라가 보상해 주는 제도가 있어요</summary>
    <div class="why" style="margin-top:8px">
    <p>약을 정해진 대로 드셨는데 <b>사망·장애·입원</b> 같은 중대한 피해를 입으셨다면, <b>의약품 부작용 피해구제</b>를 신청하실 수 있어요. 식약처가 주관하고 한국의약품안전관리원이 조사합니다. 사망일시보상금·장애일시보상금·진료비·장례비가 있고, <b>사망·장애는 그날부터 5년 안에</b> 신청하셔야 해요.</p>
    <p style="margin-top:8px">가벼운 부작용도 신고해 두시면 다른 분들이 같은 일을 겪지 않게 됩니다. 신고는 <b>의무가 아니고</b>, 진료를 대신하지도 않아요.</p>
    <p style="margin-top:8px"><b>한국의약품안전관리원</b><br><a class="call-in" href="tel:1644-6223">1644-6223</a> <span class="muted small">(또는 14-3330)</span></p>
    </div></details>
  </section>`;
}
function bagText(){
  const items = takingItems(); const res = ixRun([]); const sc = achScore(achList([])); const f = activeFlags();
  const L = ['[약지도] 제가 먹는 약 ' + items.length + '가지' + (f.length ? ' · ' + f.map(k => FLAG_LABEL[k]).join(', ') : '')];
  items.forEach((x, i) => L.push(`${i + 1}. ${x.name}${x.approx ? ' (종류만)' : x.pub?.ingr ? ' — ' + x.pub.ingr : ''}${x.short ? ' (며칠만)' : ''}`));
  if (res.dupe.length) L.push('· 같은 성분 두 번: ' + res.dupe.map(d => d.e?.n || '').join(', '));
  res.hits.forEach(h => L.push(`· ${h.r.t} (${h.items.map(i => i.name).join(' + ')}) — ${IX_LV[h.r.lv][0]}`));
  if (sc) L.push(`· 항콜린 부담 ${sc}점 · ${ACH_LV_WORD[achLevel(sc)]}`);
  const a = adherence(30);
  if (a.days) { L.push('', '[어제까지 30일 복용]', `· 드시기로 한 ${a.days}일 중 ${a.full}일은 빠짐없이 (전체 ${a.doses}번 중 ${a.took}번)`);
    const sm = slotMiss().filter(r => r.miss);
    if (sm.length) L.push('· 시간대별로 못 드신 횟수: ' + sm.map(r => `${SLOT_WORD[r.t] || r.t} ${r.want}번 중 ${r.miss}번`).join(', ')); }
  const ae = aeList(); if (ae.length) { L.push('', '[약 먹고 불편했던 일]'); ae.slice(0, 10).forEach(x => L.push(`· ${dateWord(x.at)} ${x.n} — ${x.t}`)); }
  L.push('앱이 미리 본 것이라 참고용이에요. 약사·의사 판단이 우선입니다.');

}

const CHK = { q:'', sid:'' };
function verdictOf(mine, theirs){
  const f = activeFlags();
  if (!theirs) return { lv:'unknown', t:'무슨 성분인지 확인이 안 돼요', w:'약사님께 <b>“성분 이름이 뭔가요?”</b>라고 여쭤보세요. 상자 뒷면에도 적혀 있어요.' };
  const blocked = (theirs.avoid || []).some(a => (a.flags || []).some(x => f.includes(x)));
  const careful = (theirs.caution || []).some(c => (c.flags || []).some(x => f.includes(x)));
  let v;
  if (theirs.id === mine.id) v = { lv:'ok', t:'같은 약이에요', w:'이름만 다르고 <b>성분이 같아요</b>. 그대로 사셔도 괜찮습니다.' };
  else if ((theirs.contains || []).includes(mine.id)) v = { lv:'warn', t:'찾던 성분이 들어 있지만, 다른 성분도 함께예요', w:`<b>${esc(theirs.name)}</b>에는 찾으시던 성분 말고도 여러 성분이 같이 들어 있어요. 필요 없는 성분까지 드시게 될 수 있으니 <b>“한 가지 성분만 있는 걸로 주세요”</b>라고 하셔도 됩니다.` };
  else if (theirs.class === mine.class) v = { lv:'ok2', t:'같은 계열이에요', w:'같은 목적의 약이라 <b>대개 괜찮아요</b>. 다만 성분마다 위장·심장 부담이 조금씩 달라요.' };
  else v = { lv:'no', t:'목적이 다른 약이에요', w:`찾으시던 <b>${esc(mine.name)}</b>과(와) 계열이 달라요. <b>“이건 어디에 쓰는 약인가요?”</b>라고 꼭 여쭤보세요.` };
  if (blocked) return { lv:'stop', t:'제 상태에는 주의가 필요한 약이에요', w:`<b>${f.map(k => esc(FLAG_LABEL[k])).join(', ')}</b> — 이 조건에서는 조심해야 하는 약이에요. <b>“저는 ${f.map(k => esc(FLAG_LABEL[k])).join(', ')}이 있는데 괜찮을까요?”</b>라고 꼭 여쭤보세요.`, sub: v.t };
  if (careful) return { lv:'warn', t:'괜찮지만 한 번 여쭤보세요', w:v.w + `<br>제 상태(<b>${f.map(k => esc(FLAG_LABEL[k])).join(', ')}</b>)에서 주의가 붙는 약이에요.`, sub: v.t };
  return v;
}
function vCheck(sid){

/* ───────── 계열 비교(차트는 코드로) ───────── */
function scatter(c){
  const pts = (c.members || []).map(id => drug(id)).filter(d => d?.risk?.gi && d?.risk?.cv);
  /* 점이 둘뿐이거나 전부 같은 자리면 그림이 아무것도 말해 주지 않는다 — 그런 그림은 그리지 않는다 */
  if (pts.length < 3) return '';
  if (new Set(pts.map(d => d.risk.gi + ',' + d.risk.cv)).size < 2) return '';
  const W = 400, H = 340, P = { l:28, r:20, t:46, b:42 };
  const x = v => P.l + (v - 0.5) / 5 * (W - P.l - P.r), y = v => H - P.b - (v - 0.5) / 5 * (H - P.t - P.b);
  const grid = [1, 2, 3, 4, 5].map(v => `<line x1="${x(v)}" y1="${P.t}" x2="${x(v)}" y2="${H - P.b}" stroke="var(--hairline)" stroke-dasharray="2 4"/><line x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}" stroke="var(--hairline)" stroke-dasharray="2 4"/>`).join('');
  const groups = {};
  pts.forEach(d => { const k = d.risk.gi + ',' + d.risk.cv; (groups[k] = groups[k] || []).push(d); });
  /* 점은 그 자리에 두고, 이름표만 서로 비켜 세운다 — 한글은 글자 하나가 글씨 크기만큼 넓어서 그냥 두면 겹친다 */
  const FS = 11, CH = FS * 0.98, LH = 14;          /* 한글 한 글자 ≈ 글씨 크기, 줄 간격 14 */
  const labels = [], dots = [];
  Object.entries(groups).forEach(([k, arr]) => {
    const [gi, cv] = k.split(',').map(Number), cx = x(gi), cy = y(cv);
    const rx = arr.every(d => d.rx === '전문');
    dots.push(`<circle cx="${cx}" cy="${cy}" r="${arr.length > 1 ? 8 : 7}" fill="${rx ? 'var(--rx)' : 'var(--primary)'}" opacity=".9"/>${arr.length > 1 && !rx && arr.some(d => d.rx === '전문') ? `<circle cx="${cx}" cy="${cy}" r="3" fill="var(--rx)"/>` : ''}`);
    const anchor = cx > W - 90 ? 'end' : cx < P.l + 70 ? 'start' : 'middle';
    const tx = anchor === 'end' ? cx + 10 : anchor === 'start' ? cx - 10 : cx;
    const down = cv >= 3;                           /* 위쪽 점은 이름표를 아래로 */
    arr.forEach((d, j) => {
      const t = d.name.replace(/ \(.*?\)/, '');
      const wHalf = t.length * CH / 2;
      labels.push({ t, cx, cy, tx, anchor, fill: d.rx === '전문' ? 'var(--rx)' : 'var(--text)',
        want: cy + (down ? 21 + j * LH : -(13 + (arr.length - 1 - j) * LH)),
        x0: anchor === 'end' ? tx - t.length * CH : anchor === 'start' ? tx : tx - wHalf,
        x1: anchor === 'end' ? tx : anchor === 'start' ? tx + t.length * CH : tx + wHalf });
    });
  });
  labels.sort((a, b) => a.want - b.want);
  const placed = [];
  for (const L of labels) {
    L.y = Math.max(P.t - 8, Math.min(H - 6, L.want));
    let guard = 0;
    while (guard++ < 40 && placed.some(q => Math.abs(q.y - L.y) < LH - 1 && q.x1 > L.x0 - 7 && L.x1 > q.x0 - 7)) L.y += LH;
    if (L.y > H - 6) { L.y = L.want; while (guard++ < 80 && placed.some(q => Math.abs(q.y - L.y) < LH - 1 && q.x1 > L.x0 - 7 && L.x1 > q.x0 - 7)) L.y -= LH; }
    placed.push(L);
  }
  const lead = placed.map(L => Math.abs(L.y - L.want) > 9 ? `<line x1="${L.cx}" y1="${L.cy + (L.y > L.cy ? 8 : -8)}" x2="${L.anchor === 'middle' ? L.tx : (L.x0 + L.x1) / 2}" y2="${L.y + (L.y > L.cy ? -9 : 3)}" stroke="var(--hairline)" stroke-width="1"/>` : '').join('');
  const text = placed.map(L => `<text x="${L.tx}" y="${L.y}" text-anchor="${L.anchor}" font-size="${FS}" font-weight="700" fill="${L.fill}" stroke="var(--card)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${esc(L.t)}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.name)} 위장 부담과 심혈관 부담 비교 산점도">
    ${grid}
    <text x="${P.l}" y="${P.t - 24}" font-size="11" font-weight="700" fill="var(--muted)">↑ 심혈관 부담 (위로 갈수록 큼)</text>
    <text x="${W - P.r}" y="${H - 12}" text-anchor="end" font-size="11" font-weight="700" fill="var(--muted)">위장 부담 (오른쪽으로 갈수록 큼) →</text>
    <text x="${P.l + 4}" y="${H - P.b - 8}" font-size="10" fill="var(--normal)" font-weight="700" stroke="var(--card)" stroke-width="3" paint-order="stroke">둘 다 낮음</text>
    ${lead}${dots.join('')}${text}</svg>
    <div class="legend"><span><i style="background:var(--primary)"></i>약국·편의점 구입</span><span><i style="background:var(--rx)"></i>처방 필요</span><span>같은 자리의 성분은 한 점에 묶었어요</span></div>
    <p class="small muted" style="margin-top:6px">${esc(c.chartNote || '위치는 대규모 관찰연구·메타분석의 상대위험을 5단계로 옮긴 것으로, 개인 용량·기간·기저질환에 따라 달라져요.')}</p></div>`;
}

  ${srcChips(c.sources)}
  ${disclaimer()}`;

async function exportMe(){

}
async function importMe(file){
  if (!file) return;
  let j; try { j = JSON.parse(await file.text()); } catch (e) { toast('읽을 수 없는 파일이에요'); return; }
  const me = j && (j.me || (j.app === 'yakjido' ? null : j));
  if (!me || typeof me !== 'object' || Array.isArray(me)) { toast('약지도에서 받은 파일이 아니에요'); return; }
  const n = (me.taking || []).length, d = Object.keys(me.taken || {}).length, ae = (me.ae || []).length;

  ME = { ...ME_DEF, ...me };   /* 옛 파일에 없는 칸은 기본값으로 채운다 */
  saveMe();
  try { rollDay(); } catch (e) {}
  armNotifications(); go('/me'); route();
  toast('가져왔어요');
}

  <section class="sec card"><h2>사진 서버 <small class="muted" style="font-weight:500;font-size:.8125rem">관리자용</small></h2><p class="small" style="margin-top:6px">사진 읽기(Gemini) 서버 주소예요. yakjido/server 를 배포한 뒤 붙여 넣으세요. 비워 두면 기본값(${esc(D.meta?.photoEndpoint || '없음')}).</p><div class="search" style="margin-top:10px">${I.link}<input id="ep" aria-label="사진 서버 주소" placeholder="https://<워커이름>.workers.dev" value="${esc((() => { try { return localStorage.getItem('yakjido.photo') || ''; } catch (e) { return ''; } })())}" onchange="try{localStorage.setItem('yakjido.photo',this.value.trim())}catch(e){};toast('저장했어요')"></div></section>
  <section class="sec card"><h2>휴대폰을 바꾸실 때</h2>
    <p class="small" style="margin-top:6px">이 앱은 기록을 <b>서버에 두지 않아요.</b> 그래서 휴대폰을 바꾸시면 담아 둔 약·복용 기록·불편했던 일이 함께 사라집니다. <b>파일 하나로 받아 두셨다가</b> 새 휴대폰에서 넣으시면 그대로 이어져요. 그 파일은 온전히 본인 것이고, 어디로도 올라가지 않아요.</p>
    <div class="actions two"><button class="btn ghost" onclick="exportMe()">${I.book} 파일로 받기</button>
      <button class="btn ghost" onclick="document.getElementById('mefile').click()">${I.user} 파일에서 가져오기</button></div>
    <input id="mefile" type="file" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" aria-label="약지도 기록 파일 고르기" onchange="importMe(this.files[0]);this.value=''">
    <p class="small muted" style="margin-top:8px">가져오면 <b>지금 기록을 덮어씁니다.</b> 넣기 전에 한 번 더 여쭤볼게요.</p>
  </section>
  <section class="sec card"><h2>이 앱에 대해</h2><p class="small" style="margin-top:6px">${esc(D.meta?.about || '')}</p><div class="actions"><button class="btn line" onclick="go('/about')">근거·검수 기준 보기</button></div></section>
  <p class="small muted" style="margin-top:16px;text-align:center">약지도 v${esc(D.meta?.version || '')} · 빌드 ${BUILD}<br>식약처 공공데이터 — e약은요 ${esc(String(D.public?.easy_source || '').match(/\d{8}/)?.[0] || '')} · 낱알식별 ${esc(String(D.public?.pills_source || '').match(/\d{8}/)?.[0] || '')} 기준</p>`;
}
function vAbout(){
  const S = D.sources || {};
  return `${topBar({ back:'내 정보' })}<h1>근거와 검수 기준</h1>
  <section class="sec card"><h2>이렇게 만들었어요</h2>${list(D.meta?.method || [])}</section>
  ${(() => {
    /* 출처 242건을 한 줄로 늘어놓으면 화면이 25,000픽셀(폰 30장)이 된다 —
       종류별로 묶고 접어 둔다. 코크란·메타분석처럼 「근거가 센 것」을 맨 위로. */
    const ORDER = ['코크란 리뷰', '메타분석', '우산 리뷰', '체계적 고찰', '무작위 비교 시험', '진료 지침', '종설', '후향 연구', '관찰 연구', '허가사항', '기타'];
    const g = new Map();
    for (const [k, v] of Object.entries(S)) {
      let t = String(v.type || '기타').trim();
      if (/허가|식약처|e약은요/.test(t)) t = '허가사항';
      if (!ORDER.includes(t)) t = ORDER.includes(t) ? t : (/지침|가이드/.test(t) ? '진료 지침' : /코크란/.test(t) ? '코크란 리뷰' : t);
      if (!g.has(t)) g.set(t, []);
      g.get(t).push([k, v]);
    }
    const keys = [...g.keys()].sort((a, b) => {
      const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    const row = ([k, v]) => `<a class="row" href="${esc(v.url)}" target="_blank" rel="noopener" style="text-decoration:none"><div class="body"><b>${fmt(v.label)}</b><span>${esc(v.type || '')}${v.note ? ' · ' + esc(v.note) : ''}</span></div>${I.link}</a>`;
    return `<section class="sec"><h2>참고 문헌·지침 <small>${Object.keys(S).length}건</small></h2>
      <p class="small muted" style="margin-bottom:8px">근거가 센 것부터 묶어 두었어요. 갈래를 누르면 펼쳐집니다.</p>
      ${keys.map(t => `<details class="acc"><summary>${esc(t)}<small>${g.get(t).length}건</small>${I.chev}</summary><div class="bd"><div class="rows">${g.get(t).map(row).join('')}</div></div></details>`).join('')}
    </section>`;
  })()}
  ${disclaimer()}`;
}

document.addEventListener('input', e => { if (!e.target.closest('.calc')) return; const id = location.hash.split('/')[2]?.split('?')[0]; const s = supp(id); if (!s?.calc) return; const amt = +document.getElementById('c-amt').value, per = +document.getElementById('c-per').value || 1, price = +document.getElementById('c-price').value, n = +document.getElementById('c-n').value; const pct = document.getElementById('c-pct'), won = document.getElementById('c-won'); if (amt > 0) { const perServing = amt * per; const r = perServing / s.calc.typical; pct.textContent = Math.round(r * 100) + '%'; pct.style.color = r > (s.calc.ulRatio || 99) ? 'var(--alert)' : r < 0.5 ? 'var(--caution)' : 'var(--primary-deep)'; if (price > 0 && n > 0) { const unitPrice = price / n; const effDoses = perServing / s.calc.typical; won.textContent = Math.round(unitPrice * per / effDoses).toLocaleString('ko-KR') + '원'; } else won.textContent = '—'; } else { pct.textContent = '—'; won.textContent = '—'; } });
function setFs(v){ try { localStorage.setItem('yakjido.fs', v); } catch (e) {} document.documentElement.style.setProperty('--fs', v); route(); }
/* 자동 = 휴대폰 설정을 따름 */
function setTheme(v){
  try { if (v === 'auto') localStorage.removeItem('yakjido.theme'); else localStorage.setItem('yakjido.theme', v); } catch (e) {}
  if (v === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = (v === 'dark' || (v === 'auto' && matchMedia('(prefers-color-scheme:dark)').matches)) ? '#161A1C' : '#0B6E8F';
  route();
}
const themeNow = () => { try { return localStorage.getItem('yakjido.theme') || 'auto'; } catch (e) { return 'auto'; } };
try { const fs = localStorage.getItem('yakjido.fs'); if (fs) document.documentElement.style.setProperty('--fs', fs); } catch (e) {}
/* 화면 밝기는 휴대폰 설정만 따라가고 있었다. 눈이 부시거나(백내장) 어두운 화면이
   안 보이는 분이 스스로 고를 칸이 없었다 — 앱 안에서 고르게 한다(2026-09-22). */
try { const th = localStorage.getItem('yakjido.theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
/* 제품·성분 사전(약 700 KB)은 첫 화면이 자리 잡은 뒤 조용히 미리 받는다 — "인사돌" 을 쳤을 때 제품이 증상보다 위에 오게(감사 #38). 데이터 절약 모드면 안 받는다 */
setTimeout(() => { try { if (navigator.connection && navigator.connection.saveData) return; } catch (e) {} lexLoad(true); pubIndexSoon(); }, 3500);
/* ───────── 시작 ───────── */
try { if (!helloDone() && !location.hash) { location.hash = '#/hello/1'; } } catch (e) {}
try { rollDay(); } catch (e) {}   /* 앱을 열 때 오늘 계획을 기록에 적고, 60일 지난 것을 치운다 */
armNotifications();

/* 종이에는 앱 이름도 날짜도 없었다. 약국·진료실에 내미는 종이이니 그 둘과
   「이것은 처방이 아니다」 한 줄을 맨 위에 둔다. 화면에서는 보이지 않는다. */
window.addEventListener('beforeprint', () => {
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  const el = document.getElementById('printhead'); if (!el) return;
  el.innerHTML = '<b>약지도</b>'
    + `<span>${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${p2(d.getHours())}:${p2(d.getMinutes())} · 환자가 앱으로 정리한 내용입니다 — 처방이 아닙니다.</span>`;
});
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  /* 설치된 앱이 비행기 모드에서도 쓸 수 있게, 한가할 때 핵심 자료를 미리 받아 캐시에 넣는다.
     서비스워커의 fetch 처리가 응답을 캐시하므로 여기서는 「부르기만」 하면 된다. */
  const warm = () => { ['lexicon.json', 'brands.json', 'qa.json', 'mixes.json', 'nutrients.json', 'easy-index.json', 'pills.json']
    .forEach((f, i) => setTimeout(() => fetch('data/' + f, { cache:'force-cache' }).catch(() => {}), i * 1200)); };
  if ('requestIdleCallback' in window) requestIdleCallback(warm, { timeout:8000 }); else setTimeout(warm, 4000);
}
</script>
