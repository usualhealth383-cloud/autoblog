<script id="data" type="application/json">{"classes":[{"id":"nsaid","name":"소염진통제(NSAID)","short":"소염진통제","icon":"bone","lead":"염증을 가라앉혀 통증을 줄이는 약들이에요. 효과는 서로 비슷하지만 **위장 부담과 심혈관 부담이 성분마다 달라서**, 진료실에서는 환자의 위·심장·신장 상태를 보고 골라요. 약국에서 살 수 있는 것은 이부프로펜·덱시부프로펜·나프록센·아스피린(진통용량)이고, 나머지는 처방약이에요.","chartTitle":"위장 부담 × 심혈관 부담 — 한눈에","chartNote":"가로축은 SOS 프로젝트(Castellsague 2012)의 상부위장관 합병증 상대위험, 세로축은 CNT 2013·PRECISION의 심혈관 사건 위험을 5단계로 옮긴 값이에요. 낮은 용량·짧은 기간에서는 모두 위험이 줄고, 개인 조건(위궤양 병력·심장병·신장)에 따라 순위가 바뀌어요.","chartSources":["castellsague2012","cnt2013","precision2016"],"members":["ibuprofen","dexibuprofen","naproxen","aspirin","celecoxib","aceclofenac","diclofenac","meloxicam","loxoprofen"],"columns":[{"key":"otc","label":"구입"},{"key":"gi","label":"위장"},{"key":"cv","label":"심혈관"},{"key":"dur","label":"지속"},{"key":"pick","label":"이런 분께"}],"table":[{"drug":"ibuprofen","otc":"약국","gi":"낮은 편 (RR 1.84)","cv":"저용량 낮음","dur":"4~6시간","pick":"대부분의 급성 통증 첫 선택. 위가 약한 분(단, 저용량)"},{"drug":"dexibuprofen","otc":"약국","gi":"이부프로펜 급 [확인 필요]","cv":"이부프로펜 급","dur":"6~8시간","pick":"이부프로펜과 같되 알약 수를 줄이고 싶을 때"},{"drug":"naproxen","otc":"약국","gi":"높은 편 (RR 4.10)","cv":"**가장 낮음** (RR 0.93)","dur":"8~12시간","pick":"고혈압·심장병이 있는 분, 생리통(부하용량), 밤새 가야 할 때"},{"drug":"aspirin","otc":"약국","gi":"높음","cv":"항혈소판(출혈↑)","dur":"4~6시간","pick":"진통 목적으로는 권하지 않음. 15세 미만 금지"},{"drug":"celecoxib","otc":"처방","gi":"**가장 낮음** (RR 1.45)","cv":"200 mg에서 나프록센과 비열등","dur":"12~24시간","pick":"위궤양 병력·장기 복용 필요 → 진료 후 처방"},{"drug":"aceclofenac","otc":"처방","gi":"낮음 추정 (RR 1.43, CI 넓음)","cv":"자료 부족","dur":"12시간","pick":"국내 처방 1순위급. 처방받았다면 약국 소염제 금지"},{"drug":"diclofenac","otc":"처방(겔은 약국)","gi":"중간 (RR 3.34)","cv":"**가장 높음** (RR 1.41)","dur":"8시간","pick":"국소 통증은 겔로 — 먹는 약은 심장병에 비권장"},{"drug":"meloxicam","otc":"처방","gi":"중간 (RR 3.47)","cv":"자료 부족","dur":"24시간","pick":"하루 한 번이 편한 만성 관절염"},{"drug":"loxoprofen","otc":"처방(패치는 약국)","gi":"중간 [확인 필요]","cv":"자료 부족","dur":"6~8시간","pick":"국소 통증은 패치가 먹는 약과 동등"}],"verdict":["**위가 약하다(속쓰림·궤양 병력)** → 저용량 이부프로펜(하루 1,200 mg 이하) + 파모티딘. 궤양 병력이 뚜렷하면 약국 소염제 대신 진료(셀레콕시브 + PPI).","**고혈압·심장병·뇌졸중 병력** → 나프록센이 심혈관 면에서 가장 안전. 디클로페낙·고용량 이부프로펜은 피하기. 어떤 소염제든 ‘첫 주부터’ 위험이 시작되니 짧게.","**신장이 나쁘다·이뇨제·혈압약(ACEi/ARB)** → 소염제 자체를 피하고 아세트아미노펜 + 파스. 꼭 필요하면 의사와.","**임신 20주 이후** → 모든 NSAID 금기, 아세트아미노펜만.","**천식(특히 비용종·아스피린 과민)** → NSAID 회피, 아세트아미노펜.","**65세 이상** → 어떤 소염제든 위보호제와 함께, 최단기간. 파스·겔을 먼저.","**어느 것도 해당 없음** → 이부프로펜 200~400 mg으로 시작. 오래 가야 하면 나프록센."],"notes":["소염제는 **한 번에 한 가지**만. 두 가지를 겹치면 효과는 안 늘고 위장·신장 부담만 더해져요.","아세트아미노펜은 계열이 달라 소염제와 **함께** 먹을 수 있고, 함께 먹으면 각각 단독보다 잘 들어요(코크란 NNT 1.5).","저용량 아스피린(심장)을 드시는 분은 이부프로펜을 아스피린 2시간 뒤에 — 먼저 먹으면 아스피린 효과가 막혀요.","국소 통증(무릎·손목·어깨)은 붙이는·바르는 소염제가 먹는 약과 비슷한 효과에 전신 부작용이 거의 없어요(코크란 NNT 1.8~3.9)."],"sources":["castellsague2012","cnt2013","precision2016","bally2017","masclee2014","catella2001","fda2020nsaid","rajan2015","derry2015topical","derry2013combo"]},{"id":"analgesic","name":"해열진통제(아세트아미노펜·복합)","short":"해열진통","icon":"temp","lead":"염증 작용 없이 통증·열을 잡는 아세트아미노펜과, 여기에 카페인·IPA·에텐자미드를 더한 복합진통제(게보린·펜잘)예요. 핵심은 **아세트아미노펜 하루 총량 4 g**과 **복합진통제 월 10일 이내**예요.","chartTitle":"위장 부담 × 심혈관 부담","members":["acetaminophen","ipa","ethenzamide","caffeine","pamabrom"],"columns":[{"key":"otc","label":"구입"},{"key":"who","label":"특징"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"acetaminophen","otc":"편의점","who":"위장·심장·신장 부담 최소. 간은 총량 관리","pick":"모든 통증의 바탕. 임신·위약·노인 1순위"},{"drug":"ipa","otc":"약국(게보린)","who":"피린계. 15세 미만 금지, 장기 복용 금지","pick":"가끔 심한 두통 한두 번"},{"drug":"ethenzamide","otc":"약국(펜잘)","who":"살리실산계. 15세 미만·아스피린 알레르기 금지","pick":"게보린 대체"},{"drug":"caffeine","otc":"복합제","who":"진통 보조. 월 10일↑ 약물과용두통","pick":"저녁엔 카페인 없는 단일제로"},{"drug":"pamabrom","otc":"복합제","who":"약한 이뇨. 생리 전 붓기","pick":"붓기 없으면 불필요"}],"verdict":["두통이 한 달에 10일 이상이면 진통제를 바꿀 게 아니라 진료(약물과용두통·편두통 예방치료).","복합진통제보다 ‘아세트아미노펜 + 이부프로펜’ 두 단일제 조합이 근거상 더 강하고 조절이 쉬워요."],"notes":["감기약 대부분에 아세트아미노펜 300~650 mg이 들어 있어요. 타이레놀과 겹치지 않게 ‘내 약통’에 등록해 두세요."],"sources":["mfds_tylenol","fda_apap","mfds_geworin","ichd3","derry2013combo"]},{"id":"relaxant","name":"근이완제","short":"근이완제","icon":"bone","lead":"근육의 긴장·경직을 풀어 통증을 줄여요. 급성 요통에서 효과는 ‘작지만 있음’(BMJ 2021)이고, 진료실에서는 소염제와 짝지어 3~5일 짧게 처방해요. **약국 일반약은 클로르족사존 3제 복합제뿐**이고, 에페리손·사이클로벤자프린·티자니딘·바클로펜은 처방약이에요.","chartTitle":"위장 부담 × 심혈관 부담","members":["chlorzoxazone","eperisone","cyclobenzaprine"],"columns":[{"key":"otc","label":"구입"},{"key":"sed","label":"졸음"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"chlorzoxazone","otc":"약국(복합제)","sed":"있음","pick":"담 결림에 소염제와 함께 며칠"},{"drug":"eperisone","otc":"처방","sed":"적은 편","pick":"낮에도 써야 하는 근골격 통증 — 국내 처방 표준"},{"drug":"cyclobenzaprine","otc":"처방","sed":"강함","pick":"밤에 경련으로 못 잘 때, 2~3주 이내"}],"verdict":["담이 3일 넘게 안 풀리거나 팔다리로 저림이 내려가면 약국 조합을 늘리지 말고 진료.","65세 이상은 근이완제 졸음으로 낙상 위험 — 파스·온찜질을 먼저."],"notes":["근이완제는 ‘통증 자체’보다 ‘뭉침·경직’을 푸는 약이라 소염제 없이 단독으로는 효과가 약해요."],"sources":["cashin2021","cashin2023","acp2017","kpa_relaxant"]},{"id":"gi-acid","name":"위산·속쓰림약","short":"속쓰림","icon":"stomach","lead":"**지금 당장** 끄는 제산제(겔포스·알마겔·개비스콘)와 **분비 자체를 줄이는** 파모티딘, 그리고 처방약 PPI로 나뉘어요. 소염제 위보호에는 제산제가 아니라 파모티딘(약국)·PPI(처방)가 근거 있는 선택이에요.","chartTitle":"위장 부담 × 심혈관 부담","members":["famotidine","omeprazole","almagate","aluminium-phosphate","alginate","antacid-mg"],"columns":[{"key":"otc","label":"구입"},{"key":"onset","label":"효과 시작"},{"key":"dur","label":"지속"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"almagate","otc":"약국","onset":"5~15분","dur":"1~2시간","pick":"지금 속쓰림"},{"drug":"aluminium-phosphate","otc":"약국","onset":"5~15분","dur":"1~2시간","pick":"빈속 통증·취침 전"},{"drug":"alginate","otc":"약국","onset":"몇 분","dur":"~4시간","pick":"신물 역류·식후 가슴쓰림"},{"drug":"famotidine","otc":"약국","onset":"30~60분","dur":"10~12시간","pick":"소염제 위보호, 밤 속쓰림 예방 (14일 이내)"},{"drug":"omeprazole","otc":"처방","onset":"1~4일","dur":"24시간","pick":"역류성 식도염·궤양·장기 소염제"}],"verdict":["소염제를 3일 이상 먹는다 → 파모티딘 10 mg 하루 1~2회를 함께.","2주 넘게 속쓰림약이 필요하다 → 진료(내시경·PPI).","삼킴 곤란·체중 감소·검은 변·토혈 → 약을 사지 말고 바로 진료."],"notes":["제산제는 다른 약의 흡수를 방해해요. 다른 약과 2시간 띄우세요.","PPI는 국내에서 아직 처방 전용이에요(미국·영국·일본은 약국 판매)."],"sources":["rostom2002","hawkey2007","mfds_famotidine","ppi_otc"]},{"id":"gi-digest","name":"소화제","short":"소화제","icon":"stomach","lead":"과식·기름진 음식 뒤 더부룩함에 쓰는 소화효소제와 가스 제거제예요. 속쓰림·명치 통증에는 효과가 없어요 — 그건 위산약 몫이에요.","chartTitle":"위장 부담 × 심혈관 부담","members":["digestive-enzyme","simethicone"],"columns":[{"key":"otc","label":"구입"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"digestive-enzyme","otc":"편의점","pick":"과식 후 더부룩함"},{"drug":"simethicone","otc":"약국(복합제)","pick":"가스·트림"}],"verdict":["‘체했다’에 명치 통증·구토·식은땀이 같이 오면 소화제로 버티지 말고 진료(심장·담낭 감별)."],"notes":[],"sources":["mohw_safestad"]},{"id":"bowel","name":"설사·변비약","short":"설사·변비","icon":"drop","lead":"설사는 대부분 저절로 낫고, 약은 ‘꼭 멈춰야 할 때’만. 변비는 순한 삼투성(마그네슘·PEG)부터, 자극성(비사코딜)은 급할 때만이 지침의 순서예요.","chartTitle":"위장 부담 × 심혈관 부담","members":["loperamide","smectite","magnesium-oxide","bisacodyl"],"columns":[{"key":"otc","label":"구입"},{"key":"onset","label":"효과"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"loperamide","otc":"약국","onset":"1시간","pick":"열·혈변 없는 물설사, 2일 이내"},{"drug":"smectite","otc":"약국","onset":"수 시간","pick":"감염성 설사 보조 (2세 미만·임신 금지)"},{"drug":"magnesium-oxide","otc":"약국","onset":"6~24시간","pick":"만성 변비 기본약 (신장 나쁘면 금지)"},{"drug":"bisacodyl","otc":"약국","onset":"6~12시간","pick":"급할 때 밤에 1회, 1주 이내"}],"verdict":["설사 + 열·혈변 → 지사제 금지, 진료.","변비 + 심한 복통·구토·배 팽만 → 변비약 금지, 진료(장폐색).","새로 생긴 변비가 50세 이후 6주 이상 → 대장 검사."],"notes":["설사의 진짜 치료는 물 + 전해질이에요."],"sources":["li2007lop","aga2023cic","peg2010","mfds_smecta"]},{"id":"cold","name":"감기약 성분","short":"감기","icon":"temp","lead":"종합감기약은 해열진통 + 콧물(항히스타민) + 코막힘(충혈완화) + 기침·가래 성분의 묶음이에요. 코크란 종합: 성인에게는 증상 완화 효과가 있지만 부작용(졸음·두근거림)이 2배, 어린 소아에는 근거 없음. **내 주 증상에 맞는 성분만** 고르는 게 진료실 원칙이에요.","chartTitle":"위장 부담 × 심혈관 부담","members":["pseudoephedrine","phenylephrine","methylephedrine","dextromethorphan","guaifenesin"],"columns":[{"key":"role","label":"역할"},{"key":"warn","label":"조심"}],"table":[{"drug":"pseudoephedrine","role":"코막힘(가장 확실)","warn":"고혈압·심장·전립선·녹내장·불면"},{"drug":"phenylephrine","role":"코막힘(먹는 형태는 약함)","warn":"고혈압·심장"},{"drug":"methylephedrine","role":"기관지 확장·코막힘","warn":"고혈압·심장·갑상선·당뇨"},{"drug":"dextromethorphan","role":"마른기침","warn":"SSRI·MAOI, 가래 기침엔 금지"},{"drug":"guaifenesin","role":"가래 묽게","warn":"물을 많이"}],"verdict":["콧물·재채기만 → 항히스타민제 단일(낮엔 2세대).","코막힘만 → 슈도에페드린 또는 비강 분무제 3일.","몸살·열만 → 아세트아미노펜 또는 이부프로펜 단일.","다 있다 → 종합감기약, 단 타이레놀 중복 금지·밤에는 졸린 성분 OK."],"notes":["감기는 약이 낫게 하는 게 아니라 7~10일 지나며 저절로 나아요. 약은 그동안 덜 힘들게 하는 도구예요."],"sources":["desutter2022","cough2014","salerno2005","galen2010"]},{"id":"antihistamine","name":"항히스타민제·비염약","short":"알레르기","icon":"leaf","lead":"콧물·재채기·두드러기·가려움을 줄이는 약이에요. 1세대(클로르페니라민·디펜히드라민)는 졸리고, 2세대(세티리진·로라타딘·펙소페나딘)는 졸음이 적어요. 지속되는 알레르기 비염의 1차 치료는 항히스타민제가 아니라 **스테로이드 비강분무제(처방)**예요.","chartTitle":"위장 부담 × 심혈관 부담","members":["cetirizine","loratadine","fexofenadine","chlorpheniramine","xylometazoline","mometasone"],"columns":[{"key":"otc","label":"구입"},{"key":"sed","label":"졸음"},{"key":"onset","label":"효과"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"cetirizine","otc":"약국","sed":"2세대 중 큼 (OR 3.5)","onset":"1시간, 24시간 지속","pick":"효과 우선, 취침 전 복용"},{"drug":"loratadine","otc":"약국","sed":"거의 없음","onset":"1~3시간, 24시간","pick":"낮 활동·운전"},{"drug":"fexofenadine","otc":"약국","sed":"가장 적음","onset":"1~2시간, 24시간","pick":"절대 졸리면 안 되는 날 (주스 X)"},{"drug":"chlorpheniramine","otc":"편의점(감기약)","sed":"강함","onset":"30분, 4~6시간","pick":"밤 감기 콧물. 노인 회피"},{"drug":"xylometazoline","otc":"약국","sed":"없음","onset":"5~10분, 8~10시간","pick":"코막힘 응급, 3일만"},{"drug":"mometasone","otc":"처방","sed":"없음","onset":"며칠~2주","pick":"지속 비염 1차 치료"}],"verdict":["매년 같은 계절 비염 → 항히스타민제로 버티지 말고 스테로이드 비강분무제 처방.","두드러기가 6주 넘게 → 만성 두드러기 진료(항히스타민 증량은 의사와)."],"notes":["감기약 + 수면유도제 + 멀미약을 함께 먹으면 항히스타민이 3중으로 겹쳐요."],"sources":["mann2000","dykewicz2020","galen2010","beers2023"]},{"id":"sleep","name":"수면유도제·멀미약","short":"수면·멀미","icon":"moon","lead":"약국 수면유도제는 1세대 항히스타민의 졸음을 이용하는 약이라 며칠용이고, 근거는 제한적이에요. 멀미약은 출발 전 미리 먹는 게 핵심이에요. 둘 다 65세 이상은 피하는 약(Beers).","chartTitle":"위장 부담 × 심혈관 부담","members":["diphenhydramine","doxylamine","scopolamine","dimenhydrinate"],"columns":[{"key":"otc","label":"구입"},{"key":"when","label":"타이밍"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"diphenhydramine","otc":"약국","when":"취침 30분 전","pick":"하루이틀 불면, 2주 이내"},{"drug":"doxylamine","otc":"약국","when":"취침 전","pick":"디펜히드라민 대체(다음날 더 멍함)"},{"drug":"scopolamine","otc":"약국(성인)","when":"출발 4시간 전 귀 뒤","pick":"배·장거리 3일"},{"drug":"dimenhydrinate","otc":"약국","when":"출발 30~60분 전","pick":"짧은 이동"}],"verdict":["잠이 안 오는 게 3주 넘으면 수면유도제 대신 진료 — 인지행동치료(CBT-I)가 1차 치료."],"notes":["멜라토닌은 국내에서 처방약(서카딘)이고 해외 직구도 금지 성분이에요."],"sources":["culpepper2015","karrim2022","beers2023","melatonin_kr"]},{"id":"topical","name":"파스·바르는 약","short":"파스·외용","icon":"band","lead":"국소 통증에는 붙이고 바르는 약이 먹는 약보다 먼저예요. NSAID 파스·겔(케토프로펜·피록시캄·디클로페낙·록소프로펜)은 코크란에서 먹는 약 수준 효과에 전신 부작용은 위약 수준. 냉·온파스(살리실산메틸·멘톨)는 근거는 낮지만 편의점에서 살 수 있어요.","chartTitle":"위장 부담 × 심혈관 부담","members":["diclofenac-topical","ketoprofen","piroxicam","flurbiprofen","methyl-salicylate","menthol"],"columns":[{"key":"otc","label":"구입"},{"key":"ev","label":"근거(NNT)"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"diclofenac-topical","otc":"약국","ev":"겔 1.8 (최고)","pick":"삐끗·타박·무릎"},{"drug":"ketoprofen","otc":"약국","ev":"겔 2.5","pick":"근육통·염좌 (햇빛 2주 주의, 15세↑)"},{"drug":"piroxicam","otc":"약국","ev":"겔 4.4","pick":"이틀에 한 장, 관절"},{"drug":"flurbiprofen","otc":"약국","ev":"트로키 RCT","pick":"인후통(트로키)"},{"drug":"methyl-salicylate","otc":"편의점","ev":"낮음","pick":"냉파프(초기 48h) / 온파스(뻐근함)"},{"drug":"menthol","otc":"편의점","ev":"느낌 위주","pick":"시원한 느낌"}],"verdict":["삐끗 직후 48시간: 냉찜질 + 냉파프 or 디클로페낙 겔.","그 이후 뻐근함: 온찜질 + 온파스 or NSAID 파스.","먹는 소염제와 파스를 같이 쓸 땐 넓은 부위·장기 사용을 피해요."],"notes":["파스 위에 핫팩·전기장판은 화상 위험."],"sources":["derry2015topical","derry2017topical","derry2016chronic","mfds_ketoprofen2010"]},{"id":"skin","name":"피부·구강·눈","short":"피부·눈","icon":"band","lead":"상처 항생제(후시딘·무피로신), 무좀약(테르비나핀), 구내염(오라메디·알보칠), 인공눈물이에요. 공통 원칙: 감염 징후 없는 상처엔 항생제 연고가 필요 없고, 2주 써도 안 나으면 진료.","chartTitle":"위장 부담 × 심혈관 부담","members":["fusidic-acid","mupirocin","terbinafine","triamcinolone","policresulen","artificial-tears"],"columns":[{"key":"otc","label":"구입"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"fusidic-acid","otc":"약국","pick":"고름·붉게 번지는 상처"},{"drug":"mupirocin","otc":"약국","pick":"후시딘 대체"},{"drug":"terbinafine","otc":"약국","pick":"발 무좀 1~2주"},{"drug":"triamcinolone","otc":"약국","pick":"구내염(비감염성), 순함"},{"drug":"policresulen","otc":"약국","pick":"구내염, 아프지만 빠름"},{"drug":"artificial-tears","otc":"약국","pick":"눈 건조, 무방부제 일회용"}],"verdict":[],"notes":[],"sources":["koning2012"]},{"id":"combo","name":"복합제(감기약·복합진통제)","short":"복합제","icon":"pill","lead":"여러 성분을 한 알·한 병에 묶은 제품이에요. 편하지만 **안 필요한 성분까지 먹게 되고, 아세트아미노펜·항히스타민이 다른 약과 겹치기 쉬워요.** 여기 등록해 두면 ‘내 약통’ 중복 검사가 성분 단위로 잡아 줘요.","chartTitle":"위장 부담 × 심혈관 부담","members":["pancol-a","panpyrin-t","theraflu","coldaewon","tylenol-cold","geworin","penzal","gnalen","easy6-eve","relax-combo"],"columns":[{"key":"apap","label":"아세트아미노펜"},{"key":"sed","label":"졸음 성분"},{"key":"pick","label":"특징"}],"table":[{"drug":"pancol-a","apap":"300 mg/병","sed":"클로르페니라민","pick":"편의점 종합감기"},{"drug":"panpyrin-t","apap":"300 mg","sed":"클로르페니라민","pick":"정제(편의점)·액상(약국) 성분 다름"},{"drug":"theraflu","apap":"**650 mg/포**","sed":"나이트만","pick":"타이레놀 중복 최다 사고"},{"drug":"coldaewon","apap":"325 mg/포","sed":"콜드·노즈","pick":"증상별 3종"},{"drug":"tylenol-cold","apap":"325 mg","sed":"클로르페니라민","pick":"이름 때문에 타이레놀과 중복 주의"},{"drug":"geworin","apap":"300 mg","sed":"—(카페인)","pick":"15세↓ 금지, 단기"},{"drug":"penzal","apap":"300 mg","sed":"—(카페인)","pick":"살리실산계"},{"drug":"gnalen","apap":"—(이부프로펜 75)","sed":"진정 성분","pick":"졸음"},{"drug":"easy6-eve","apap":"—(이부프로펜 200)","sed":"—","pick":"붓기 동반 생리통"},{"drug":"relax-combo","apap":"—(에텐자미드)","sed":"클로르족사존","pick":"일반약 근이완 세트"}],"verdict":["복합제 두 가지를 같이 먹지 마세요. 거의 항상 무언가 겹쳐요."],"notes":[],"sources":["desutter2022","fda_apap"]},{"id":"antifungal","name":"무좀약(항진균제)","short":"무좀","icon":"band","lead":"곰팡이를 죽이는 약이에요. 바르는 약은 **알릴아민(테르비나핀)**과 **아졸(클로트리마졸)** 두 갈래인데, 코크란 분석에서 알릴아민이 아졸보다 실패가 적었어요(RR 0.63). 발톱 무좀은 성격이 달라요 — 바르는 약이 발톱을 잘 못 뚫어서 오래 걸리고, 여러 발톱이 상했다면 먹는 약(처방)이 확실해요.","chartTitle":"위장 부담 × 심혈관 부담","members":["terbinafine","clotrimazole","amorolfine"],"columns":[{"key":"otc","label":"구입"},{"key":"where","label":"쓰는 곳"},{"key":"dur","label":"기간"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"terbinafine","otc":"약국","where":"발·사타구니·몸통 피부","dur":"1~2주","pick":"발 무좀 1순위. 기간이 가장 짧아요"},{"drug":"clotrimazole","otc":"약국","where":"피부 + 칸디다","dur":"2~4주","pick":"접히는 부위·칸디다가 섞인 경우"},{"drug":"amorolfine","otc":"약국","where":"손발톱","dur":"6~12개월","pick":"발톱 한두 개만 가볍게 상했을 때"}],"verdict":["**발가락 사이가 짓무르고 가렵다** → 테르비나핀 크림 1~2주. 증상이 사라져도 며칠 더.","**사타구니·엉덩이가 번들거리며 번진다** → 클로트리마졸 2~4주(칸디다 가능성).","**발톱이 두껍고 누렇다** → 크림은 소용없어요. 네일라카 6~12개월, 여러 개면 진료로 먹는 약.","**4주 발라도 그대로다** → 무좀이 아닐 수 있어요(습진·건선·접촉피부염). 진료로 확인하세요."],"notes":["스테로이드가 섞인 복합 연고를 무좀에 쓰면 당장은 덜 가렵지만 곰팡이가 더 번져요.","가족이 함께 걸리기 쉬워요. 발수건·슬리퍼·발톱깎이를 따로 쓰세요.","당뇨가 있으면 무좀으로 생긴 갈라짐이 세균 감염(봉와직염)의 통로가 돼요. 일찍 치료하세요."],"sources":["crawford2007topical","bellsyer2012oral"]},{"id":"gout","name":"통풍약","short":"통풍","icon":"bone","lead":"통풍약은 **발작을 끄는 약**과 **요산을 낮추는 약**, 완전히 역할이 다른 두 종류예요. 발작 때 요산강하제를 새로 시작하지 않고, 반대로 먹던 요산강하제는 발작 중에도 끊지 않아요. 미국류마티스학회 2020 지침은 급성 발작에 콜히친·NSAID·스테로이드 셋 중 하나를 강하게 권고하고, 요산은 **6 mg/dL 미만**을 목표로 해요.","chartTitle":"위장 부담 × 심혈관 부담","members":["colchicine","allopurinol","naproxen"],"columns":[{"key":"role","label":"역할"},{"key":"otc","label":"구입"},{"key":"when","label":"쓰는 때"},{"key":"pick","label":"주의"}],"table":[{"drug":"naproxen","otc":"약국","role":"발작 끄기","when":"발작 시작 즉시","pick":"위·콩팥·심장이 나쁘면 신중히"},{"drug":"colchicine","otc":"처방","role":"발작 끄기","when":"발작 24시간 이내","pick":"설사가 흔해요. 신장 나쁘면 감량"},{"drug":"allopurinol","otc":"처방","role":"요산 낮추기","when":"발작이 가라앉은 뒤 꾸준히","pick":"시작 3~6개월은 발작 예방약 병용"}],"verdict":["**지금 발가락이 벌겋게 붓고 아프다** → 소염제(나프록센 등)를 바로. 얼음찜질과 안정.","**진통 목적의 아스피린은 피하세요** — 요산 배설을 방해해 발작을 키울 수 있어요.","**1년에 두 번 이상 발작하거나 결절이 만져진다** → 진료로 요산강하제를 시작할 때예요.","**콩팥이 나쁘다** → 소염제·콜히친 모두 조절이 필요해요. 자가 판단하지 말고 진료를."],"notes":["맥주·소주 같은 술, 내장류·등푸른 생선 과다, 과당 음료가 발작을 부르는 대표 방아쇠예요.","발작 중에 요산 수치가 정상으로 나오기도 해요. 수치가 낮다고 통풍이 아닌 건 아니에요.","심장 때문에 저용량 아스피린을 드시는 분은 임의로 끊지 마세요. 의사와 상의하세요."],"sources":["acr2020gout"]},{"id":"hemorrhoid","name":"치질약","short":"치질","icon":"drop","lead":"치질약은 증상을 눅여 주는 약이에요. 코크란 분석에서 먹는 플라보노이드(디오스민 등)는 **출혈과 가려움을 뚜렷하게 줄였지만 통증에는 유의한 효과가 없었어요.** 그래서 아플 때는 국소약과 좌욕을 같이 쓰고, 근본은 **변을 부드럽게 만드는 것**이에요.","chartTitle":"위장 부담 × 심혈관 부담","members":["hemorrhoid-topical","diosmin","magnesium-oxide"],"columns":[{"key":"role","label":"역할"},{"key":"ev","label":"근거"},{"key":"pick","label":"고를 때"}],"table":[{"drug":"hemorrhoid-topical","role":"통증·가려움 즉시 완화","ev":"국소 대증","pick":"아프고 가려울 때. 1주 이내"},{"drug":"diosmin","role":"출혈·가려움 감소","ev":"코크란: 출혈 OR 0.12","pick":"피가 비칠 때"},{"drug":"magnesium-oxide","role":"변을 부드럽게","ev":"만성 변비 기본약","pick":"딱딱한 변이 원인일 때. 신장 나쁘면 금지"}],"verdict":["**피가 비치고 가렵다** → 먹는 디오스민 + 국소약 + 좌욕.","**아프기만 하다** → 국소약과 좌욕이 먼저. 먹는 약은 통증에 근거가 약해요.","**딱딱하고 굵은 변이 원인** → 변을 무르게 하는 것이 치료의 절반이에요.","**덩어리가 딱딱하게 튀어나오고 몹시 아프다** → 혈전성 치핵일 수 있어요. 며칠 안에 처치하면 훨씬 편해져요."],"notes":["항문 출혈을 모두 치질로 넘기지 마세요. 50세 이후 새로 생긴 출혈, 변이 가늘어짐, 체중 감소는 대장 검사가 필요해요.","변기에 오래 앉아 스마트폰을 보는 습관이 치질을 키워요. 3분 안에 나오세요.","따뜻한 물 좌욕은 치핵 수술 후 통증도 줄여 준 방법이에요."],"sources":["perera2012phlebo","liao2024sitz"]},{"id":"antiviral","name":"항바이러스제","short":"항바이러스","icon":"shield","lead":"바이러스의 증식을 직접 막는 처방약이에요. 감기 바이러스에는 쓰지 않고, **대상포진·단순포진·독감**처럼 특정 바이러스에만 써요. 공통점은 **시간 싸움** — 대상포진은 발진 후 72시간, 독감은 증상 후 48시간 안에 시작해야 효과가 커요.","chartTitle":"위장 부담 × 심혈관 부담","members":["acyclovir"],"columns":[{"key":"when","label":"시작 시점"},{"key":"otc","label":"구입"},{"key":"pick","label":"핵심"}],"table":[{"drug":"acyclovir","otc":"처방","when":"발진 후 72시간 이내","pick":"낫는 기간과 통증을 줄여요. 신장 나쁘면 감량"}],"verdict":["**한쪽에만 띠 모양으로 물집이 돋는다** → 대상포진. 약국이 아니라 그날 병원으로.","**눈 주위·코끝·귀에 물집** → 시력·청력 합병증 위험. 응급으로 진료.","**면역이 약한 분(항암·이식·스테로이드 장기 복용)** → 시간과 관계없이 바로 진료."],"notes":["대상포진 뒤 통증이 3개월 넘게 남는 대상포진후신경통이 약 5명 중 1명에게 생겨요. 초기 항바이러스제가 이 위험을 줄여요.","50세 이상은 백신으로 예방할 수 있어요. 이미 앓았던 분도 접종 대상이에요."],"sources":["saguil2017zoster"]}],"drugs":[{"id":"acetaminophen","name":"아세트아미노펜","en":"Acetaminophen (Paracetamol)","class":"analgesic","rx":"안전상비","tagline":"위장 부담이 가장 적은 기본 진통·해열제","lead":"통증과 열을 내리는 가장 기본 약이에요. 염증을 가라앉히는 힘은 없지만 위장·신장·심혈관 부담이 거의 없어서, 진료실에서도 통증 처방의 **바탕**으로 먼저 깔아요. 문제는 딱 하나, **하루 총량**이에요. 감기약·복합진통제에 숨어 있는 아세트아미노펜까지 더해 하루 4 g을 넘기면 간이 다쳐요.","for":["두통","치통","생리통","근육통","발열","감기 몸살"],"dose":{"adult":"500~1,000 mg (500 mg 1~2정)","interval":"4~6시간","max":"4,000 mg(500 mg 8정) · 술을 자주 마시거나 체중이 적으면 3,000 mg 이하로","child":"체중 1 kg당 10~15 mg, 4~6시간 간격, 하루 5회 이하 (어린이 현탁액 160 mg/5 mL)"},"onset":"30분","duration":"4~6시간(서방정 8시간)","risk":{"gi":1,"cv":1,"renal":1,"liver":3},"riskNote":{"liver":"하루 4 g을 넘기거나, 매일 술 3잔 이상 마시면서 복용하면 간손상 위험이 커져요. 정량이면 안전해요."},"pict":["물많이","음주금지"],"avoid":[{"text":"심한 간질환이 있는 경우","flags":["liver"]},{"text":"같은 시간대에 아세트아미노펜이 든 다른 약(감기약·게보린·펜잘·테라플루 등)을 이미 먹은 경우 — 총량이 넘쳐요"}],"caution":[{"text":"매일 술을 3잔 이상 마시는 분은 하루 3 g 이하로, 되도록 짧게","flags":["alcohol","liver"]},{"text":"체중 50 kg 미만·고령·영양 상태가 나쁜 분도 하루 3 g 이하가 안전해요","flags":["senior"]},{"text":"와파린 복용 중 매일 고용량으로 오래 먹으면 INR이 오를 수 있어요","flags":["anticoag"]}],"sideEffects":["정량에서는 부작용이 드물어요","드물게 발진·두드러기"],"stop":["구역·구토와 함께 오른쪽 윗배 통증, 눈·피부가 노래짐(간손상 신호)","피부 발진이 번지거나 물집이 생김"],"interactions":[{"with":"종합감기약·복합진통제(판콜·판피린·테라플루·게보린·펜잘)","level":"주의","note":"대부분 아세트아미노펜 300~650 mg이 들어 있어요. 합쳐서 하루 4 g을 넘기지 마세요."},{"with":"술","level":"주의","note":"만성 음주 시 간독성이 커져요. 숙취 두통에는 아세트아미노펜보다 물·휴식이 먼저예요."},{"with":"와파린","level":"주의","note":"하루 2 g 이상을 며칠 이상 계속 먹으면 INR 상승 보고. 단기 소량은 괜찮아요."},{"with":"이부프로펜·나프록센","level":"병용 가능","note":"계열이 달라 같이 먹어도 되고, 각각 단독보다 진통 효과가 커요(코크란)."}],"pregnancy":"임신 전 기간 통증·발열에 1차 선택. 필요한 최소량을 짧게.","children":"생후 4개월 이상 체중 기준으로. 2세 미만은 의사와 상의.","products":[{"name":"타이레놀정 500mg","maker":"한국존슨앤드존슨","amount":"500 mg/정","rx":"안전상비"},{"name":"타이레놀 8시간 이알서방정","maker":"한국존슨앤드존슨","amount":"650 mg/정 · 8시간 간격, 하루 6정까지","rx":"일반"},{"name":"어린이 타이레놀 현탁액","maker":"한국존슨앤드존슨","amount":"160 mg/5 mL","rx":"안전상비"},{"name":"세토펜정·현탁액","maker":"삼아제약","amount":"80·160·325·650 mg / 32 mg/mL","rx":"일반"}],"tips":["빈속에 먹어도 되는 몇 안 되는 진통제예요. 물 한 컵과 함께.","‘효과가 약하다’고 두 배로 먹지 마세요. 대신 이부프로펜을 **더하는** 게 정답이에요(계열이 달라요).","서방정(8시간 이알)은 쪼개거나 씹지 마세요.","3일 넘게 열이 나거나 10일 넘게 아프면 약을 늘리지 말고 진료를 받으세요."],"sources":["mfds_tylenol","tylenol_kr","fda_apap","aap_fever","derry2013combo","moore2015ejp"],"simple":"500 mg 1~2정, 하루 3번 식후 30분 (4시간 이상 간격). 하루 8정을 넘기지 않기","faq":[{"q":"타이레놀이 성분 이름인가요?","a":"아니요, 타이레놀은 상품명이고 성분은 **아세트아미노펜**이에요. 세토펜·써스펜도 같은 성분이고, 판피린·판콜·테라플루·게보린·펜잘 같은 감기약·복합진통제에도 300~650 mg씩 들어 있어요. 약 상자 뒷면 ‘성분명’을 보면 겹치는지 바로 알 수 있어요."},{"q":"열이 내리면 다 나은 건가요?","a":"아니요. 해열제는 열을 잠시 내리는 ‘증상 조절’이지 원인 치료가 아니에요. 3일 넘게 열이 나거나, 내렸다가 다시 오르거나, 처지면 병원에서 원인을 확인하세요."},{"q":"하루 3번 먹으면 되나요?","a":"네. 500 mg 1~2정을 아침·점심·저녁 식후 30분에, 4시간 이상 간격이면 돼요. 아플 때만 추가로 먹더라도 하루 8정(4 g)은 넘기지 마세요."}]},{"id":"ibuprofen","name":"이부프로펜","en":"Ibuprofen","class":"nsaid","rx":"일반","tagline":"일반약 소염진통제 중 위장 부담이 가장 낮은 편","lead":"염증을 가라앉혀 통증을 줄이는 소염진통제(NSAID)예요. 약국에서 살 수 있는 소염제 가운데 **낮은 용량(하루 1,200 mg 이하)에서 위장 부담이 가장 낮은 편**이고, 효과가 빨라요. 근육·관절 통증, 생리통, 치통에 아세트아미노펜보다 잘 들어요.","for":["근육·관절통","생리통","치통","두통","발열","염좌"],"dose":{"adult":"200~400 mg","interval":"4~6시간(하루 3~4회)","max":"약국 자가치료 기준 1,200 mg · 허가 최대 3,200 mg은 의사 관리 하에","child":"생후 6개월 이상, 1 kg당 5~10 mg, 6~8시간 간격 (어린이 부루펜 시럽)"},"onset":"30~60분(액상 캡슐이 더 빠름)","duration":"4~6시간","risk":{"gi":2,"cv":2,"renal":3,"liver":1},"riskNote":{"gi":"SOS 연구에서 상부위장관 합병증 상대위험 1.84 — 전통 NSAID 중 가장 낮음. 고용량은 2~3배로 올라가요.","cv":"하루 1,200 mg 이하에서는 혈전 위험 증가가 입증되지 않았어요(허가사항). 2,400 mg 고용량은 심근경색 위험 상승(CNT).","renal":"탈수 상태·이뇨제·혈압약(ACEi/ARB)과 겹치면 급성신손상 위험."},"pict":["식후","음주금지"],"avoid":[{"text":"위궤양·십이지장궤양·위장출혈이 있거나 있었던 경우","flags":["ulcer"]},{"text":"임신 20주 이후(양수 감소·태아 신장 문제)","flags":["pregnant"]},{"text":"아스피린·소염진통제로 천식 발작·두드러기가 있었던 경우","flags":["asthma"]},{"text":"심한 심부전·신부전","flags":["heart","kidney"]},{"text":"다른 소염진통제(나프록센·아스피린 진통용량·디클로페낙 등)를 이미 먹고 있는 경우"}],"caution":[{"text":"항응고제·항혈소판제 복용 중 — 출혈 위험이 겹쳐요. 필요하면 아세트아미노펜으로","flags":["anticoag"]},{"text":"저용량 아스피린을 심장 보호 목적으로 먹는 분 — 이부프로펜을 먼저 먹으면 아스피린 효과가 막혀요. 아스피린 복용 2시간 뒤에","flags":["anticoag","heart"]},{"text":"고혈압·심장병 — 짧게, 최소량으로. 나프록센이 심혈관 면에선 더 안전해요","flags":["heart"]},{"text":"신장 기능 저하·탈수·이뇨제 복용","flags":["kidney","senior"]},{"text":"65세 이상은 위장출혈·신장 위험이 커요. 위보호제와 함께, 가능한 한 짧게","flags":["senior"]},{"text":"천식이 있으면(과민 병력 없어도) 약사·의사와 상의","flags":["asthma"]},{"text":"SSRI 항우울제·스테로이드 복용 중이면 위장출혈 위험이 더 커져요"}],"sideEffects":["속쓰림·소화불량(가장 흔함)","부종·혈압 상승(고용량·장기)","드물게 두드러기·어지러움"],"stop":["검은 변·피 섞인 토(위장출혈)","숨이 차거나 쌕쌕거림·얼굴 부종(과민반응)","소변량이 확 줄거나 발목이 붓는 경우"],"interactions":[{"with":"아세트아미노펜","level":"병용 가능","note":"계열이 달라 함께 먹어도 되며 단독보다 효과적(NNT 1.5~1.6)."},{"with":"나프록센·아스피린(진통용량)·디클로페낙 등 다른 NSAID","level":"금기","note":"위장·신장 부담만 더해지고 효과는 늘지 않아요. 소염제는 한 번에 한 가지."},{"with":"저용량 아스피린(심장)","level":"주의","note":"이부프로펜이 아스피린의 혈소판 억제를 막아요. 아스피린 먹고 2시간 뒤에 이부프로펜을."},{"with":"와파린·DOAC·클로피도그렐","level":"주의","note":"위장출혈 위험 증가(Masclee 2014). 아세트아미노펜 우선."},{"with":"SSRI(에스시탈로프람 등)·스테로이드","level":"주의","note":"위장출혈 위험 상승. 위보호제 고려."},{"with":"혈압약(ACEi/ARB)·이뇨제","level":"주의","note":"‘삼중 타격’으로 급성신손상 위험. 물 충분히, 짧게."},{"with":"메토트렉세이트·리튬","level":"주의","note":"혈중 농도 상승. 처방의와 상의."}],"pregnancy":"임신 20주 이후 금기(FDA 2020). 임신 초기도 되도록 아세트아미노펜으로. 수유 중에는 사용 가능한 편.","children":"생후 6개월 이상. 탈수(구토·설사) 중에는 신장 부담이 커서 피해요.","products":[{"name":"부루펜정 400mg","maker":"삼일제약","amount":"400 mg/정","rx":"일반"},{"name":"이지엔6 애니 연질캡슐","maker":"대웅제약","amount":"200 mg/캡슐(액상)","rx":"일반"},{"name":"캐롤에프정","maker":"일동제약","amount":"이부프로펜 200 mg(아르기닌염, 흡수 빠름)","rx":"일반"},{"name":"어린이 부루펜 시럽","maker":"삼일제약","amount":"20 mg/mL","rx":"안전상비"}],"tips":["식사 직후나 우유·간식과 함께. 빈속은 속쓰림이 늘어요.","통증 초반에 400 mg으로 확실히 잡고, 이후 200~400 mg씩 이어가는 편이 찔끔찔끔 먹는 것보다 나아요.","3일 넘게 계속 먹어야 한다면 위보호제(파모티딘)를 같이 두는 게 진료실 방식이에요.","물 한 컵과 함께. 탈수 상태에선 신장이 힘들어요."],"sources":["mfds_brufen","castellsague2012","cnt2013","bally2017","catella2001","masclee2014","fda2020nsaid","derry2013combo","ungprasert2015"],"simple":"400 mg 1정, 하루 3번 식후 30분. 빈속 금지, 하루 1,200 mg(3정)까지","faq":[{"q":"부루펜과 이지엔6는 다른 약인가요?","a":"둘 다 성분은 이부프로펜이에요(이지엔6 프로는 덱시부프로펜). 상품명이 달라도 성분이 같으면 같은 약이라 함께 먹으면 중복이에요."},{"q":"타이레놀과 같이 먹어도 되나요?","a":"네. 계열이 달라 함께 먹을 수 있고, 각각 단독보다 잘 들어요. 대신 이부프로펜 + 나프록센처럼 소염제 두 가지는 겹치지 마세요."}]},{"id":"dexibuprofen","name":"덱시부프로펜","en":"Dexibuprofen","class":"nsaid","rx":"일반","tagline":"이부프로펜의 ‘활성형 절반’ — 더 적은 양으로 같은 효과","lead":"이부프로펜은 두 거울상 분자가 반반 섞인 약인데, 실제로 진통 효과를 내는 쪽만 골라낸 것이 덱시부프로펜이에요. 그래서 **300 mg이 이부프로펜 400 mg과 비슷한 효과**를 내고, 교차시험에서는 효과 시작이 조금 더 빨랐어요. 위장 부작용이 ‘더 적다’는 광고는 총량이 절반이라는 데서 오는 추정이지, 독립적인 비교 근거는 아직 부족해요.","for":["근육·관절통","생리통","치통","두통","발열"],"dose":{"adult":"300 mg (1캡슐)","interval":"6~8시간(하루 2~4회)","max":"1,200 mg(4캡슐)","child":"생후 6개월 이상, 1 kg당 5~7 mg, 4~6시간 간격, 하루 4회 이하 (맥시부펜 시럽)"},"onset":"30분 안팎","duration":"6~8시간","risk":{"gi":2,"cv":2,"renal":3,"liver":1},"riskNote":{"gi":"대규모 위장관 위험 순위 연구(SOS)에 포함되지 않아 이부프로펜과 같은 급으로 보되 [확인 필요]로 둡니다."},"pict":["식후","음주금지"],"avoid":[{"text":"위궤양·위장출혈 병력","flags":["ulcer"]},{"text":"임신 20주 이후(허가사항: 임신 말기 금기)","flags":["pregnant"]},{"text":"아스피린·NSAID 과민(천식·두드러기)","flags":["asthma"]},{"text":"다른 소염진통제와 동시 복용"}],"caution":[{"text":"항응고제·항혈소판제 복용","flags":["anticoag"]},{"text":"고혈압·심장병·신장병·65세 이상 — 짧게, 최소량","flags":["heart","kidney","senior"]},{"text":"매일 3잔 이상 음주","flags":["alcohol"]}],"sideEffects":["속쓰림·소화불량","부종","드물게 발진"],"stop":["검은 변·토혈","호흡곤란·얼굴 부종","소변량 감소"],"interactions":[{"with":"이부프로펜·나프록센 등 다른 NSAID","level":"금기","note":"같은 계열 중복."},{"with":"아세트아미노펜","level":"병용 가능","note":"이부프로펜과 같은 원리로 병용 가능."},{"with":"저용량 아스피린·항응고제·SSRI","level":"주의","note":"이부프로펜 항목과 동일."}],"pregnancy":"임신 20주 이후 금기.","children":"생후 6개월 이상(시럽).","products":[{"name":"이지엔6 프로 연질캡슐","maker":"대웅제약","amount":"300 mg/캡슐","rx":"일반"},{"name":"맥시부펜 시럽","maker":"한미약품","amount":"12 mg/mL (소아용)","rx":"일반"}],"tips":["식사와 함께.","‘프로’라는 이름 때문에 더 센 약으로 오해하기 쉽지만, 이부프로펜 400 mg과 같은 급이에요."],"sources":["mfds_easy6pro","adidac2008","castellsague2012"],"simple":"300 mg 1캡슐, 하루 3번 식후. 하루 4캡슐까지"},{"id":"naproxen","name":"나프록센","en":"Naproxen","class":"nsaid","rx":"일반","tagline":"오래 가고 심혈관에 가장 안전한 소염제, 대신 위장엔 덜 친절","lead":"한 번 먹으면 8~12시간 가는 긴 소염진통제예요. 대규모 분석(CNT 2013)에서 **심장·혈관 사건을 늘리지 않은 유일한 NSAID**라서, 고혈압·심장병이 있는 분의 통증엔 진료실에서 이 약을 고르는 경우가 많아요. 대신 **위장 부담은 이부프로펜의 약 2배**예요. 생리통에는 ‘첫 회 2캡슐’ 부하용량이 허가돼 있어요.","for":["생리통","근육·관절통","치통","두통","염좌"],"dose":{"adult":"첫 회 500 mg(2캡슐), 이후 250 mg","interval":"6~8시간","max":"1,250 mg(탁센 5캡슐)","child":"소아 용법은 제품별로 다름 — 12세 미만은 약사 확인"},"onset":"1시간 안팎","duration":"8~12시간","risk":{"gi":4,"cv":1,"renal":3,"liver":1},"riskNote":{"gi":"SOS 연구 상대위험 4.10(이부프로펜 1.84). 위가 약하면 위보호제를 함께 두거나 이부프로펜으로.","cv":"CNT 2013: 주요 혈관 사건 RR 0.93 — 증가 없음. PRECISION에서도 셀레콕시브와 비열등."},"pict":["식후","음주금지"],"avoid":[{"text":"위궤양·위장출혈 병력 — 위장 위험이 가장 큰 일반약 소염제예요","flags":["ulcer"]},{"text":"임신 20주 이후","flags":["pregnant"]},{"text":"아스피린·NSAID 과민(천식·두드러기)","flags":["asthma"]},{"text":"다른 소염진통제와 동시 복용"}],"caution":[{"text":"항응고제·항혈소판제·SSRI·스테로이드 복용 — 위장출혈 위험 상승","flags":["anticoag"]},{"text":"65세 이상 — 위장출혈·신장 위험. 위보호제와 함께 짧게","flags":["senior"]},{"text":"신장 기능 저하·탈수","flags":["kidney"]},{"text":"매일 3잔 이상 음주","flags":["alcohol"]}],"sideEffects":["속쓰림·소화불량(이부프로펜보다 흔함)","부종","졸음·어지러움(드묾)"],"stop":["검은 변·토혈","호흡곤란·얼굴 부종","소변량 감소·발목 부종"],"interactions":[{"with":"아세트아미노펜","level":"병용 가능","note":"계열이 달라 병용 가능."},{"with":"이부프로펜·아스피린(진통용량) 등 다른 NSAID","level":"금기","note":"중복 금지."},{"with":"와파린·DOAC·클로피도그렐","level":"주의","note":"위장출혈 위험. 아세트아미노펜 우선."},{"with":"혈압약(ACEi/ARB)·이뇨제","level":"주의","note":"급성신손상 위험."},{"with":"리튬·메토트렉세이트","level":"주의","note":"혈중 농도 상승."}],"pregnancy":"임신 20주 이후 금기.","children":"제품별 연령 기준 확인. 생리통 청소년(12세 이상)은 사용 가능한 제품이 있어요.","products":[{"name":"탁센 연질캡슐","maker":"GC녹십자","amount":"나프록센 250 mg/캡슐","rx":"일반"},{"name":"낙센에프정","maker":"종근당","amount":"나프록센 500 mg/정 (분류 재확인 권장)","rx":"일반"}],"tips":["생리통은 시작하자마자(혹은 시작 전날) 첫 회 2캡슐로 확실히 잡고, 6~8시간마다 1캡슐씩 2~3일 규칙적으로.","반드시 식후에. 3일 이상 먹는다면 파모티딘을 곁들이는 게 진료실 방식.","하루 1,250 mg(5캡슐)을 넘기지 마세요."],"sources":["mfds_taksen","cnt2013","precision2016","castellsague2012","marjoribanks2015","masclee2014"],"simple":"첫 회 2캡슐(500 mg), 이후 1캡슐씩 하루 2~3번 식후. 하루 5캡슐까지"},{"id":"aspirin","name":"아스피린","en":"Aspirin","class":"nsaid","rx":"일반","tagline":"진통제로는 이제 1순위가 아닌 약 — 저용량은 ‘심장약’","lead":"가장 오래된 소염진통제지만, 요즘 약국에서 아스피린을 **진통 목적**으로 권하는 일은 드물어요. 같은 효과를 내려면 위장출혈 위험이 더 크고, 15세 미만에게는 라이증후군 때문에 금지예요. 흔히 보는 **아스피린 프로텍트 100 mg은 혈전 예방용 ‘심장약’**이라 통증에 쓰는 약이 아니에요.","for":["두통·근육통(2순위)","혈전 예방(저용량 100 mg, 의사 지시)"],"dose":{"adult":"500~1,000 mg (진통)","interval":"4시간 이상","max":"4,000 mg","child":"15세 미만 금지(라이증후군)"},"onset":"30분~1시간","duration":"4~6시간","risk":{"gi":4,"cv":1,"renal":3,"liver":1},"riskNote":{"gi":"저용량 100 mg도 위장출혈 위험이 있어요(Masclee 2014 IRR 3.1). 진통용량은 더 커요.","cv":"항혈소판 작용 — 심혈관 사건을 늘리지 않지만 출혈이 늘어요."},"pict":["식후","음주금지","소아주의"],"avoid":[{"text":"15세 미만 소아·청소년(특히 수두·독감 중) — 라이증후군","flags":["child"]},{"text":"위궤양·위장출혈 병력","flags":["ulcer"]},{"text":"아스피린 천식·비용종","flags":["asthma"]},{"text":"임신 20주 이후(진통용량)","flags":["pregnant"]},{"text":"통풍 — 진통용량 아스피린은 요산 배설을 방해해요","flags":["gout"]}],"caution":[{"text":"항응고제·다른 항혈소판제 복용 — 출혈","flags":["anticoag"]},{"text":"수술·발치 예정 — 중단 여부를 의사와 상의"}],"sideEffects":["속쓰림·위통","멍·잇몸 출혈","이명(고용량)"],"stop":["검은 변·토혈","쌕쌕거림·호흡곤란","이명·청력 저하"],"interactions":[{"with":"이부프로펜","level":"주의","note":"저용량 아스피린의 심장 보호 효과를 이부프로펜이 막아요. 이부프로펜은 아스피린 2시간 뒤에."},{"with":"와파린·DOAC","level":"주의","note":"출혈 위험 상승."},{"with":"다른 NSAID","level":"금기","note":"진통용량 중복 금지."}],"pregnancy":"진통용량은 20주 이후 금기. 저용량 81~100 mg은 의사 지시로 사용하는 경우가 있어요.","children":"15세 미만 금지.","products":[{"name":"바이엘아스피린정 500mg","maker":"바이엘코리아","amount":"500 mg/정","rx":"일반"},{"name":"아스피린프로텍트정 100mg","maker":"바이엘코리아","amount":"100 mg/장용정 · 혈전 예방용, 진통 아님","rx":"일반"}],"tips":["통증엔 이부프로펜·나프록센이 같은 효과에 위장 위험이 더 낮아요.","심장 보호용 저용량을 자의로 시작하지 마세요 — 출혈 위험이 이득보다 클 수 있어요(의사 판단)."],"sources":["mfds_aspirin100","moore2015ae","masclee2014","glasgow2006","catella2001"],"simple":"진통 목적이면 500 mg 1~2정, 4시간 이상 간격 (15세 미만 금지)"},{"id":"diclofenac","name":"디클로페낙 (먹는약)","en":"Diclofenac (oral)","class":"nsaid","rx":"전문","tagline":"효과는 강하지만 심혈관 부담이 가장 큰 편 — 처방약","lead":"진통·소염 효과가 강해 정형외과·치과 처방에 자주 쓰이지만, 대규모 분석에서 **심혈관 사건 위험이 셀레콕시브급으로 높은(RR 1.41)** 약이에요. 먹는 약은 처방이 필요하고, 바르는 겔·패치(볼타렌 에멀겔)는 약국에서 살 수 있어요.","for":["관절염","근골격 통증(처방)"],"dose":{"adult":"의사 처방(보통 1회 25~50 mg, 하루 75~150 mg)","interval":"8~12시간","max":"처방에 따름"},"onset":"30분~1시간","duration":"8시간","risk":{"gi":3,"cv":4,"renal":3,"liver":2},"riskNote":{"gi":"SOS 상대위험 3.34.","cv":"CNT 2013 주요 혈관 사건 RR 1.41 — 전통 NSAID 중 가장 높음.","liver":"드물지만 간수치 상승이 다른 NSAID보다 잦아요."},"avoid":[{"text":"심근경색·뇌졸중 병력, 심부전","flags":["heart"]},{"text":"위궤양·위장출혈 병력","flags":["ulcer"]},{"text":"임신 20주 이후","flags":["pregnant"]}],"caution":[{"text":"고혈압·신장병·항응고제","flags":["heart","kidney","anticoag"]}],"interactions":[{"with":"다른 NSAID","level":"금기","note":"중복 금지."}],"pregnancy":"임신 20주 이후 금기.","children":"소아는 처방에 따름.","products":[{"name":"볼타렌 에멀겔 (바르는 형태)","maker":"헤일리온","amount":"디클로페낙 1% 겔 — 약국 구입","rx":"일반"}],"tips":["무릎·손목처럼 국소 부위라면 먹는 약 대신 **바르는 디클로페낙**이 위장·심장 부담 없이 비슷한 효과를 내요(코크란 NNT 1.8)."],"sources":["cnt2013","castellsague2012","derry2015topical","mfds_voltaren"],"simple":"처방대로"},{"id":"aceclofenac","name":"아세클로페낙","en":"Aceclofenac","class":"nsaid","rx":"전문","tagline":"디클로페낙의 순한 사촌 — 국내 처방 1순위급","lead":"국내 정형외과·내과에서 가장 흔히 처방되는 소염진통제 중 하나예요(에어탈 등). 디클로페낙과 구조가 비슷하지만 관찰연구에서 위장 부담 추정치가 가장 낮은 축(SOS RR 1.43, 신뢰구간 넓음)이었어요. 심혈관 자료는 부족해 디클로페낙에 준해 조심해요.","for":["관절염","근골격 통증(처방)"],"dose":{"adult":"의사 처방(보통 100 mg 하루 2회)","interval":"12시간","max":"처방에 따름"},"onset":"1시간","duration":"12시간","risk":{"gi":1,"cv":3,"renal":3,"liver":2},"riskNote":{"gi":"SOS RR 1.43 — 가장 낮은 추정치이나 신뢰구간이 넓어요.","cv":"대규모 자료 없음 — 디클로페낙 유사체로 보아 [확인 필요]."},"avoid":[{"text":"위궤양·위장출혈 병력","flags":["ulcer"]},{"text":"임신 20주 이후","flags":["pregnant"]},{"text":"심근경색·심부전","flags":["heart"]}],"caution":[{"text":"항응고제·신장병·고령","flags":["anticoag","kidney","senior"]}],"interactions":[{"with":"다른 NSAID","level":"금기","note":"중복 금지 — 처방받은 소염제가 있으면 약국 소염제를 더 사지 마세요."}],"pregnancy":"임신 20주 이후 금기.","children":"처방에 따름.","products":[{"name":"에어탈정 등","maker":"대웅제약 외 다수","amount":"100 mg/정","rx":"전문"}],"tips":["병원에서 이 약을 처방받았다면, 약국 소염제(이부프로펜·나프록센·게보린)를 겹쳐 먹지 마세요. 진통을 더하고 싶으면 아세트아미노펜만."],"sources":["castellsague2012"],"simple":"처방대로 (보통 100 mg 하루 2번 식후)"},{"id":"celecoxib","name":"셀레콕시브","en":"Celecoxib","class":"nsaid","rx":"전문","tagline":"위장을 아끼도록 설계된 COX-2 선택제 — 처방약","lead":"위 점막을 지키는 효소(COX-1)는 건드리지 않고 염증 효소(COX-2)만 막도록 만든 약이에요. 24,081명 PRECISION 시험에서 **위장 사건이 나프록센·이부프로펜보다 적고 심혈관은 비열등**했어요. 위궤양 병력이 있거나 오래 소염제를 써야 하는 분께 진료실에서 고르는 약이지만 처방이 필요해요.","for":["관절염","만성 통증(처방)"],"dose":{"adult":"의사 처방(보통 200 mg 하루 1~2회)","interval":"12~24시간","max":"처방에 따름"},"onset":"1시간","duration":"12~24시간","risk":{"gi":1,"cv":3,"renal":2,"liver":1},"riskNote":{"gi":"SOS RR 1.45. PRECISION에서 위장 사건 최저.","cv":"코xib 계열 RR 1.37(CNT, 고용량)이나 200 mg에서는 나프록센과 비열등(PRECISION)."},"avoid":[{"text":"설폰아미드 과민","flags":[]},{"text":"심근경색·뇌졸중 병력·관상동맥우회술 직후","flags":["heart"]},{"text":"임신 20주 이후","flags":["pregnant"]}],"caution":[{"text":"고혈압·신장병·항응고제","flags":["heart","kidney","anticoag"]}],"interactions":[{"with":"다른 NSAID","level":"금기","note":"중복 금지."},{"with":"와파린","level":"주의","note":"출혈 위험."}],"pregnancy":"임신 20주 이후 금기.","children":"처방에 따름.","products":[{"name":"쎄레브렉스 캡슐 등","maker":"비아트리스 외","amount":"200 mg/캡슐","rx":"전문"}],"tips":["위가 약해서 약국 소염제를 못 먹는 분은 진료를 받아 이 계열을 처방받는 게 답이에요."],"sources":["precision2016","cnt2013","castellsague2012"],"simple":"처방대로 (200 mg 하루 1~2번)"},{"id":"meloxicam","name":"멜록시캄","en":"Meloxicam","class":"nsaid","rx":"전문","tagline":"하루 한 번 처방 소염제 — ‘부분 선택’이라 위장 이득은 크지 않음","lead":"하루 한 번 먹는 처방 소염제예요. 낮은 용량(7.5 mg)에서는 COX-2를 우선 막아 위장에 유리하다고 알려졌지만, 관찰연구 종합에서는 위장 부담이 디클로페낙과 비슷했어요(SOS RR 3.47).","for":["관절염(처방)"],"dose":{"adult":"의사 처방(7.5~15 mg 하루 1회)","interval":"24시간","max":"처방에 따름"},"onset":"1~2시간","duration":"24시간","risk":{"gi":3,"cv":3,"renal":3,"liver":1},"riskNote":{"gi":"SOS RR 3.47.","cv":"CNT에 개별 보고 없음 [확인 필요]."},"avoid":[{"text":"위궤양·위장출혈 병력","flags":["ulcer"]},{"text":"임신 20주 이후","flags":["pregnant"]}],"caution":[{"text":"심혈관·신장 질환·항응고제","flags":["heart","kidney","anticoag"]}],"interactions":[{"with":"다른 NSAID","level":"금기","note":"중복 금지."}],"pregnancy":"임신 20주 이후 금기.","children":"처방에 따름.","products":[{"name":"모빅 캡슐 등","maker":"베링거인겔하임 외","amount":"7.5·15 mg","rx":"전문"}],"tips":["처방받은 멜록시캄 위에 약국 소염제를 얹지 마세요."],"sources":["castellsague2012"],"simple":"처방대로 (하루 1번)"},{"id":"loxoprofen","name":"록소프로펜","en":"Loxoprofen","class":"nsaid","rx":"전문","tagline":"빠른 처방 소염제 — 먹는 약은 처방, 붙이는 패치는 약국","lead":"국내 처방에 흔한 소염진통제예요. 몸 안에서 활성형으로 바뀌는 프로드러그라 흡수 시 위 자극이 덜하다고 설명되지만, 대규모 위장·심혈관 비교 자료에는 포함되지 않았어요. **먹는 정제는 처방약, 붙이는 패치·카타플라스마는 약국**에서 살 수 있고, 팔다리 손상 연구에서 패치가 먹는 약과 효과는 같고 부작용은 절반이었어요.","for":["근골격 통증","관절염","발치 후 통증(처방)"],"dose":{"adult":"의사 처방(60 mg 하루 3회)","interval":"8시간","max":"처방에 따름"},"onset":"30분","duration":"6~8시간","risk":{"gi":3,"cv":3,"renal":3,"liver":1},"riskNote":{"gi":"SOS·CNT에 없음 — 중간값으로 두고 [확인 필요].","cv":"[확인 필요]"},"avoid":[{"text":"위궤양·위장출혈 병력","flags":["ulcer"]},{"text":"임신 20주 이후","flags":["pregnant"]},{"text":"아스피린 천식","flags":["asthma"]}],"caution":[{"text":"심혈관·신장 질환·항응고제·고령","flags":["heart","kidney","anticoag","senior"]}],"interactions":[{"with":"다른 NSAID(약국 소염제 포함)","level":"금기","note":"처방 소염제 위에 약국 소염제를 얹지 마세요."}],"pregnancy":"임신 20주 이후 금기.","children":"처방에 따름.","products":[{"name":"록소닌정 등(경구)","maker":"다수","amount":"60 mg/정 · 처방","rx":"전문"},{"name":"록소나·록펜텍 패치(외용)","maker":"다수","amount":"붙이는 형태 — 약국 구입","rx":"일반"}],"tips":["국소 통증이면 패치가 먹는 약과 효과는 같고 부작용은 절반(RCT)."],"sources":["loxo2019","castellsague2012"],"simple":"처방대로 (60 mg 하루 3번 식후)"},{"id":"ipa","name":"이소프로필안티피린 (게보린 성분)","en":"Isopropylantipyrine (IPA)","class":"analgesic","rx":"일반","tagline":"게보린의 진통 성분 — 15세 미만 금지, 단기만","lead":"게보린에 아세트아미노펜·카페인과 함께 든 피린계 진통 성분이에요. 효과는 좋지만 드문 혈액 이상(무과립구증) 우려로 식약처가 2010년 재평가해 **15세 미만 복용 금지, 장기 복용 금지, ‘5~6회 먹어도 낫지 않으면 중단’**을 허가사항에 넣었어요. 매일 먹는 두통약으로는 부적합해요.","for":["두통","치통","생리통(단기)"],"dose":{"adult":"게보린 1정(IPA 150 mg + 아세트아미노펜 300 mg + 카페인 50 mg)","interval":"4시간 이상","max":"하루 3회 이하 · 5~6회 복용 후 호전 없으면 중단","child":"15세 미만 금지"},"onset":"30분","duration":"4~6시간","risk":{"gi":2,"cv":1,"renal":1,"liver":2},"pict":["식후","소아주의","단기만"],"avoid":[{"text":"15세 미만","flags":["child"]},{"text":"피린계 알레르기 병력"},{"text":"혈액 질환 병력"}],"caution":[{"text":"카페인이 들어 있어 커피·에너지음료와 겹치면 두근거림·불면","flags":[]},{"text":"매일 술 3잔 이상(아세트아미노펜 간독성)","flags":["alcohol","liver"]},{"text":"월 10일 이상 복합진통제 복용은 약물과용두통의 기준이에요"}],"sideEffects":["속쓰림","발진(피린계)","드물게 혈액 이상"],"stop":["열·인후통·입안 궤양이 갑자기 생김(혈액 이상 신호)","피부 발진"],"interactions":[{"with":"타이레놀·감기약","level":"주의","note":"아세트아미노펜 총량 합산(게보린 1정에 300 mg)."},{"with":"다른 소염진통제","level":"주의","note":"중복 피하기."}],"pregnancy":"임신 중 사용 피함.","children":"15세 미만 금지.","products":[{"name":"게보린정","maker":"삼진제약","amount":"IPA 150 mg + 아세트아미노펜 300 mg + 카페인 50 mg","rx":"일반"}],"tips":["가끔 심한 두통 한두 번에는 괜찮지만, 반복되는 두통의 ‘상비약’으로 삼지 마세요.","같은 상황에서 아세트아미노펜 500 mg + 이부프로펜 200 mg 조합이 근거상 더 나아요."],"sources":["mfds_geworin","ichd3"],"simple":"게보린 1정, 4시간 이상 간격, 하루 3번까지"},{"id":"ethenzamide","name":"에텐자미드 (펜잘 성분)","en":"Ethenzamide","class":"analgesic","rx":"일반","tagline":"펜잘큐의 살리실산계 진통 성분 — 15세 미만 금지","lead":"펜잘큐에 아세트아미노펜·카페인과 함께 든 살리실산 계열(아스피린 친척) 진통 성분이에요. 아스피린처럼 **15세 미만은 라이증후군 우려로 금지**, 아스피린 알레르기·위궤양이 있으면 피해요.","for":["두통","치통","생리통"],"dose":{"adult":"펜잘큐 1정(에텐자미드 200 mg + 아세트아미노펜 300 mg + 카페인 50 mg)","interval":"4시간 이상","max":"하루 3회","child":"15세 미만 금지"},"onset":"30분","duration":"4~6시간","risk":{"gi":2,"cv":1,"renal":2,"liver":2},"pict":["식후","소아주의"],"avoid":[{"text":"15세 미만(라이증후군)","flags":["child"]},{"text":"아스피린 알레르기·천식","flags":["asthma"]},{"text":"위궤양 병력","flags":["ulcer"]}],"caution":[{"text":"카페인 함유 — 커피와 겹치면 두근거림","flags":[]},{"text":"매일 음주 3잔 이상","flags":["alcohol","liver"]},{"text":"항응고제 복용","flags":["anticoag"]}],"interactions":[{"with":"타이레놀·감기약","level":"주의","note":"아세트아미노펜 총량 합산(펜잘큐 1정에 300 mg)."},{"with":"NSAID","level":"주의","note":"살리실산계이므로 소염제와 겹치면 위장 부담 증가."}],"pregnancy":"임신 중 피함.","children":"15세 미만 금지.","products":[{"name":"펜잘큐정","maker":"종근당","amount":"에텐자미드 200 mg + 아세트아미노펜 300 mg + 카페인 50 mg","rx":"일반"}],"tips":["빈속을 피하고, 하루 3회를 넘기지 마세요."],"sources":["mfds_penzal","glasgow2006"],"simple":"펜잘큐 1정, 4시간 이상 간격, 하루 3번까지"},{"id":"caffeine","name":"카페인 (진통 보조)","en":"Caffeine (analgesic adjuvant)","class":"analgesic","rx":"일반","tagline":"진통제 효과를 조금 높이지만, 매일 먹으면 두통을 만들어요","lead":"게보린·펜잘·그날엔·판피린 같은 복합제에 30~50 mg씩 들어 있어요. 진통제와 함께 먹으면 효과가 조금 커지는 근거(코크란: 이부프로펜 200 mg + 카페인 100 mg NNT≈2)가 있지만, 카페인 든 진통제를 **한 달에 10일 이상** 먹으면 약물과용두통으로 두통이 오히려 잦아져요.","for":["진통 보조"],"dose":{"adult":"복합제에 포함된 30~50 mg","max":"커피 등 하루 총 400 mg 이내"},"onset":"15~30분","duration":"3~5시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"caution":[{"text":"커피·에너지음료와 합산 — 두근거림·불면","flags":[]},{"text":"불면·공황·부정맥이 있으면 카페인 없는 진통제로","flags":["heart"]}],"interactions":[{"with":"커피·녹차·에너지음료","level":"주의","note":"총 카페인 합산."}],"pregnancy":"임신 중 하루 200 mg 이내로.","children":"소아용 아님.","products":[{"name":"게보린·펜잘큐·그날엔·판피린 등 복합제","maker":"여러 제조사","amount":"30~50 mg/정(병)","rx":"일반"}],"tips":["저녁에 먹는 진통제는 카페인 없는 단일제(아세트아미노펜·이부프로펜)가 잠에 낫습니다."],"sources":["moore2015otc","ichd3"],"simple":"복합제 기준. 저녁엔 카페인 없는 진통제로"},{"id":"pamabrom","name":"파마브롬 (이지엔6 이브 성분)","en":"Pamabrom","class":"analgesic","rx":"일반","tagline":"생리 전 붓기를 빼는 약한 이뇨 성분","lead":"이지엔6 이브에 이부프로펜과 함께 든 약한 이뇨제예요. 생리 전후 붓기·더부룩함을 줄이려는 목적이고, 통증 자체에 대한 효과는 이부프로펜이 내요. 붓기가 없다면 굳이 이 조합을 고를 이유는 없어요.","for":["생리 전 부종"],"dose":{"adult":"복합제 1캡슐당 25 mg","max":"제품 용법에 따름"},"onset":"1~2시간","duration":"6시간","risk":{"gi":1,"cv":1,"renal":2,"liver":1},"caution":[{"text":"신장 질환·이뇨제 복용 중","flags":["kidney"]}],"interactions":[],"pregnancy":"복합제(이부프로펜) 기준으로 20주 이후 금기.","children":"소아용 아님.","products":[{"name":"이지엔6 이브 연질캡슐","maker":"대웅제약","amount":"이부프로펜 200 mg + 파마브롬 25 mg","rx":"일반"}],"tips":["붓기 없는 생리통은 이지엔6 애니(이부프로펜 단일)나 탁센(나프록센)이면 충분해요."],"sources":["mfds_easy6pro"],"simple":"이지엔6 이브 1~2캡슐, 4~6시간 간격"},{"id":"chlorzoxazone","name":"클로르족사존 (일반약 근이완 성분)","en":"Chlorzoxazone","class":"relaxant","rx":"일반","tagline":"약국에서 살 수 있는 유일한 근이완 성분 — 3제 복합제로만","lead":"근육 긴장을 풀어주는 중추성 근이완제 중 유일하게 일반의약품 성분이에요. 아세트아미노펜과 묶인 옛 복합제(리렉스펜 등)는 2023년 유효성 재평가로 사라졌고, 지금은 **클로르족사존 + 에텐자미드 + 카페인 3제 복합제**(신신플렉스·클리담·리렉스담 등)로만 남아 있어요. 담 결림·근육 뭉침에 소염제와 함께 짧게 쓰는 용도예요. 급성 요통 근이완제 효과는 ‘작지만 있음’(BMJ 2021·ACP 지침).","for":["담 결림","근육 뭉침·경직","급성 요통(보조)"],"dose":{"adult":"제품 라벨대로(보통 1회 1~2정 하루 3회) — 함량 [확인 필요]","max":"제품 라벨 기준 · 2주 이내"},"onset":"1시간","duration":"3~4시간","risk":{"gi":2,"cv":1,"renal":1,"liver":2},"riskNote":{"liver":"드물게 간독성 보고. 음주와 함께 피하세요."},"pict":["졸음","운전주의","음주금지"],"avoid":[{"text":"간질환","flags":["liver"]},{"text":"15세 미만(에텐자미드 복합)","flags":["child"]},{"text":"아스피린 알레르기·위궤양(에텐자미드)","flags":["asthma","ulcer"]}],"caution":[{"text":"졸음 — 운전·기계 조작 주의","flags":[]},{"text":"65세 이상은 낙상 위험","flags":["senior"]},{"text":"음주","flags":["alcohol"]}],"sideEffects":["졸음·어지러움","소변이 주황·붉게 변함(무해)"],"stop":["황달·짙은 소변·심한 피로(간독성)","발진"],"interactions":[{"with":"술·수면제·항히스타민제","level":"주의","note":"진정 작용이 겹쳐요."},{"with":"NSAID","level":"주의","note":"에텐자미드가 살리실산계라 위장 부담이 더해질 수 있어요 — 소염제와 함께 쓸 때는 위보호제 고려."}],"pregnancy":"임신 중 피함.","children":"15세 미만 금지.","products":[{"name":"신신플렉스정·클리담정·리렉스담정 등","maker":"신신제약·한미약품 외","amount":"클로르족사존 + 에텐자미드 + 카페인 (함량 제품별 확인)","rx":"일반"}],"tips":["진료실에서 근이완제는 ‘소염제 + 근이완제’ 세트로 3~5일 짧게 처방해요. 혼자서도 같은 원칙으로.","처방 근이완제(에페리손·사이클로벤자프린 등)가 필요하면 진료를 받으세요."],"sources":["kpa_relaxant","relaxant2023","cashin2021","acp2017"],"simple":"복합제 1정, 하루 3번 식후. 졸림·음주 주의"},{"id":"eperisone","name":"에페리손 (처방 근이완제)","en":"Eperisone","class":"relaxant","rx":"전문","tagline":"국내 처방 1순위 근이완제 — 졸음이 덜한 편","lead":"정형외과·내과에서 근골격 통증 처방에 가장 자주 붙는 근이완제예요(뮤렉스·에페리손정). 다른 중추성 근이완제보다 졸음이 덜해 낮에도 쓰기 좋아요. 처방이 필요하며, 진료실 조합은 보통 **소염제 + 에페리손 + 위보호제(+아세트아미노펜)**이에요.","for":["근골격 통증 동반 근육 경직","급성 요통·경부통(처방)"],"dose":{"adult":"의사 처방(보통 50 mg 하루 3회 식후)","interval":"8시간","max":"처방에 따름"},"onset":"1시간","duration":"6시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"pict":["졸음","운전주의"],"avoid":[],"caution":[{"text":"졸음·힘 빠짐 — 운전 주의","flags":[]},{"text":"65세 이상 낙상 주의","flags":["senior"]}],"sideEffects":["졸음·어지러움","드물게 발진"],"interactions":[{"with":"술·진정제","level":"주의","note":"진정 작용 상승."}],"pregnancy":"처방에 따름.","children":"처방에 따름.","products":[{"name":"뮤렉스정·에페리손염산염정","maker":"다수","amount":"50 mg/정","rx":"전문"}],"tips":["약국에서는 살 수 없어요. 담이 3일 넘게 안 풀리면 진료를 받아 이 조합을 처방받는 게 빠릅니다."],"sources":["cashin2021","acp2017"],"simple":"처방대로 (보통 50 mg 하루 3번 식후)"},{"id":"cyclobenzaprine","name":"사이클로벤자프린 (처방 근이완제)","en":"Cyclobenzaprine","class":"relaxant","rx":"전문","tagline":"밤에 쓰는 근이완제 — 졸음이 강함","lead":"삼환계 항우울제와 구조가 비슷한 근이완제로, 졸음이 강해 취침 전 처방이 많아요. 급성 요통·근육 경련에 짧게(2~3주 이내) 씁니다.","for":["급성 근육 경련(처방)"],"dose":{"adult":"의사 처방(5~10 mg 취침 전)","interval":"8~24시간","max":"처방에 따름"},"onset":"1시간","duration":"12~24시간","risk":{"gi":1,"cv":2,"renal":1,"liver":1},"pict":["졸음","운전주의","음주금지"],"avoid":[{"text":"부정맥·최근 심근경색","flags":["heart"]},{"text":"녹내장·전립선비대(항콜린 작용)","flags":["glaucoma","bph"]}],"caution":[{"text":"65세 이상 — Beers 기준 회피 약물","flags":["senior"]}],"interactions":[{"with":"술·수면제·항히스타민제","level":"주의","note":"진정 작용 상승."},{"with":"SSRI·트라마돌","level":"주의","note":"세로토닌 증후군 가능."}],"pregnancy":"처방에 따름.","children":"처방에 따름.","products":[{"name":"실다렉스정 등","maker":"다수","amount":"5·10 mg","rx":"전문"}],"tips":["낮 활동이 중요하면 에페리손이 더 맞아요."],"sources":["cashin2021","beers2023"],"simple":"처방대로 (보통 취침 전)"},{"id":"famotidine","name":"파모티딘","en":"Famotidine","class":"gi-acid","rx":"일반","tagline":"약국에서 살 수 있는 가장 강한 위산 억제제 — 소염제 ‘위보호’ 짝","lead":"위산 분비를 줄이는 H2차단제예요. 국내에서 PPI(오메프라졸 등)는 처방약이라, **약국에서 살 수 있는 위산 억제제 중 가장 강한 것이 파모티딘 10 mg**이에요. 진료실에서 소염제 처방에 위보호제를 붙이는 원리를 약국에서 재현할 때 이 약이 그 자리예요. 제산제보다 늦게(30분~1시간) 듣지만 10~12시간 가요.","for":["속쓰림·신물","소염제 복용 중 위보호","위산과다"],"dose":{"adult":"10 mg 1정","interval":"12시간","max":"20 mg(2정) · 연속 14일 이내","child":"16세 미만은 의사 상담"},"onset":"30분~1시간","duration":"10~12시간","risk":{"gi":1,"cv":1,"renal":2,"liver":1},"pict":["단기만"],"avoid":[{"text":"16세 미만(일반약 기준)","flags":["child"]}],"caution":[{"text":"신장 기능 저하 — 용량 조절 필요","flags":["kidney"]},{"text":"2주 넘게 계속 필요하면 진료(위궤양·역류 질환 감별)"},{"text":"삼킴 곤란·체중 감소·토혈이 있으면 약을 사지 말고 진료"}],"sideEffects":["두통·어지러움(드묾)","변비·설사(드묾)"],"stop":["검은 변·토혈","삼키기 어려움"],"interactions":[{"with":"이부프로펜·나프록센","level":"병용 권장","note":"소염제를 3일 이상 쓸 때 위점막 보호 목적으로 함께(코크란: 2배 용량 H2차단제가 위궤양 예방)."},{"with":"케토코나졸·이트라코나졸(항진균)","level":"주의","note":"위산이 줄면 흡수가 떨어져요."}],"pregnancy":"필요 시 사용 가능한 편(의사 상담).","children":"16세 미만은 의사 상담.","products":[{"name":"파미딘정·팜시드정·파모윈정·파탁정 등","maker":"여러 제네릭","amount":"10 mg/정 (20 mg은 처방약)","rx":"일반"}],"tips":["소염제와 같이 살 때 “파모티딘 10 mg 주세요”라고 하면 돼요.","속쓰림이 지금 당장 심하면 제산제(겔포스·개비스콘)를 먼저, 파모티딘은 예방·유지로.","14일 넘게 필요하면 약을 늘리지 말고 진료를 받으세요."],"sources":["mfds_famotidine","rostom2002","ppi_otc"],"simple":"10 mg 1정, 하루 2번 아침·저녁 식후. 14일 이내","faq":[{"q":"왜 소염제와 같이 사나요?","a":"소염제는 위 점막을 지키는 물질까지 줄여서 속쓰림·궤양을 만들 수 있어요. 진료실에서 소염제에 위보호제를 붙이는 이유이고, 약국에서 살 수 있는 가장 강한 위산 억제제가 파모티딘이에요. 3일 이상 소염제를 먹거나 위가 약하면 함께 드세요."}]},{"id":"omeprazole","name":"오메프라졸·에소메프라졸 (PPI)","en":"Omeprazole / Esomeprazole (PPI)","class":"gi-acid","rx":"전문","tagline":"가장 강한 위산 억제제 — 국내에선 처방약","lead":"위산 펌프 자체를 막는 약이라 위산 억제력이 가장 강해요. 소염제 위궤양 예방에서 가장 근거가 강한 계열이고(코크란: 위궤양 RR 0.40), 진료실 소염제 처방에 붙는 위보호제가 보통 이 약이에요. 미국·영국·일본은 저용량을 약국에서 팔지만 **한국은 아직 처방 전용**이라, 약국 대안은 파모티딘이에요. 8주 이상 장기 복용은 의사 판단으로.","for":["역류성 식도염","위궤양","소염제 위보호(처방)"],"dose":{"adult":"의사 처방(보통 20~40 mg 아침 식전 1회)","interval":"24시간","max":"처방에 따름"},"onset":"1~4일에 걸쳐 최대 효과","duration":"24시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[],"caution":[{"text":"장기 복용 시 B12·마그네슘 저하, 골절·장염 위험 — 65세 이상은 8주 넘기면 재평가(Beers)","flags":["senior"]}],"interactions":[{"with":"클로피도그렐","level":"주의","note":"오메프라졸이 활성화를 방해할 수 있어 판토프라졸 등으로 바꾸기도 해요(처방의 판단)."}],"pregnancy":"처방에 따름.","children":"처방에 따름.","products":[{"name":"로섹·넥시움·에소메졸 등","maker":"다수","amount":"20·40 mg","rx":"전문"}],"tips":["소염제를 오래 써야 하는 위궤양 병력자는 약국 조합 대신 진료를 받아 ‘셀레콕시브 + PPI’ 처방을 받는 게 안전해요."],"sources":["rostom2002","hawkey2007","ppi_otc","beers2023","fda_ppi"],"simple":"처방대로 (보통 아침 식전 1번)"},{"id":"almagate","name":"알마게이트 (알마겔)","en":"Almagate","class":"gi-acid","rx":"일반","tagline":"지금 당장 속쓰림을 끄는 제산제","lead":"위산을 바로 중화하는 제산제예요. 몇 분 안에 듣지만 1~2시간이면 효과가 끝나요. 위산 ‘분비’를 막는 게 아니라 이미 나온 산을 ‘중화’하는 것이라, 소염제 위궤양 예방 근거는 없어요 — 그 역할은 파모티딘 몫이에요.","for":["속쓰림·신물","위통(일시적)"],"dose":{"adult":"1포(1.5 g)","interval":"식후 30분~1시간, 하루 3회 + 필요 시 취침 전","max":"하루 4회","child":"12세 이상"},"onset":"5~15분","duration":"1~2시간","risk":{"gi":1,"cv":1,"renal":2,"liver":1},"avoid":[],"caution":[{"text":"신장 질환 — 알루미늄·마그네슘 축적","flags":["kidney"]},{"text":"다른 약과 2시간 간격(흡수 방해)"}],"sideEffects":["변비 또는 설사"],"interactions":[{"with":"항생제(퀴놀론·테트라사이클린)·갑상선약·철분제","level":"주의","note":"흡수를 방해해요. 2시간 띄우세요."},{"with":"펙소페나딘(알레그라)","level":"주의","note":"흡수 저하."}],"pregnancy":"단기 사용 가능한 편.","children":"12세 이상.","products":[{"name":"알마겔에프 현탁액","maker":"유한양행","amount":"알마게이트 1.5 g/포","rx":"일반"}],"tips":["급할 때 1포, 반복되면 파모티딘으로 바꾸거나 진료."],"sources":["mfds_almagel"],"simple":"1포, 하루 3번 식후 30분~1시간. 다른 약과 2시간 띄우기"},{"id":"aluminium-phosphate","name":"인산알루미늄 (겔포스)","en":"Aluminium phosphate gel","class":"gi-acid","rx":"일반","tagline":"점막을 덮어 주는 제산제 — 빈속 통증에","lead":"위산을 중화하면서 점막에 얇은 막을 입혀 자극을 줄이는 제산제예요. 식사 사이(식간)와 취침 전에 먹고, 4시간 이상 간격을 둬요. 즉효성이지만 근본 치료는 아니에요.","for":["속쓰림","위통","위염 증상"],"dose":{"adult":"1포(20 g)","interval":"식간 및 취침 시, 하루 3회 · 4시간 이상 간격","max":"하루 3~4회"},"onset":"5~15분","duration":"1~2시간","risk":{"gi":1,"cv":1,"renal":2,"liver":1},"avoid":[],"caution":[{"text":"신장 질환 — 알루미늄 축적","flags":["kidney"]},{"text":"장기 복용 금지"}],"sideEffects":["변비"],"interactions":[{"with":"다른 약 전반","level":"주의","note":"2시간 간격을 두세요(흡수 저해)."}],"pregnancy":"단기 사용 가능한 편.","children":"제품 라벨 확인.","products":[{"name":"겔포스엠 현탁액","maker":"보령","amount":"인산알루미늄겔 + 수산화마그네슘 + 시메티콘","rx":"일반"}],"tips":["잠들기 전 신물이 올라오면 취침 전 1포가 도움."],"sources":["mfds_gelfos"],"simple":"1포, 하루 3번 식사 사이·취침 전. 4시간 이상 간격"},{"id":"alginate","name":"알긴산 (개비스콘)","en":"Sodium alginate","class":"gi-acid","rx":"일반","tagline":"위 위에 ‘뗏목’을 띄워 역류를 막는 약","lead":"위산과 만나 젤 층을 만들어 위 내용물 위에 뜨고, 신물이 식도로 올라오는 것을 물리적으로 막아요. 식후·눕기 전 역류 증상에 특히 맞고, 제산 성분도 함께 들어 있어요.","for":["역류(신물·가슴쓰림)","식후 속쓰림"],"dose":{"adult":"10~20 mL(1~2포)","interval":"식후 및 취침 전, 하루 4회까지","max":"80 mL/일","child":"12세 이상"},"onset":"몇 분","duration":"최대 4시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[],"caution":[{"text":"나트륨 함유 — 심부전·저염식·신장질환은 주의","flags":["heart","kidney"]}],"sideEffects":["드묾(더부룩함)"],"interactions":[{"with":"다른 약","level":"주의","note":"2시간 간격."}],"pregnancy":"임신 중 역류에 비교적 안전하게 쓰이는 편.","children":"12세 이상.","products":[{"name":"개비스콘 더블액션 현탁액","maker":"옥시레킷벤키저","amount":"알긴산나트륨 500 mg + 탄산수소나트륨 213 mg + 탄산칼슘 325 mg /10 mL","rx":"일반"}],"tips":["역류가 주 증상이면 제산제보다 알긴산이, 빈속 통증이면 제산제가 맞아요.","먹고 바로 눕지 않기, 취침 3시간 전 식사 끝내기가 약보다 중요해요."],"sources":["mfds_gaviscon"],"simple":"1~2포(10~20 mL), 식후·취침 전 하루 4번까지"},{"id":"antacid-mg","name":"수산화마그네슘 (제산 성분)","en":"Magnesium hydroxide","class":"gi-acid","rx":"일반","tagline":"제산제 속 마그네슘 — 변을 무르게 하는 쪽","lead":"겔포스엠 등 복합 제산제에 들어 있는 성분이에요. 알루미늄 제산제가 변비를 일으키는 것을 상쇄해요. 단독 고용량은 설사를 유발하고, 신장 질환자는 마그네슘이 쌓일 수 있어요.","for":["제산(복합제 성분)"],"dose":{"adult":"복합제 용법에 따름","max":"라벨 기준"},"onset":"몇 분","duration":"1~2시간","risk":{"gi":1,"cv":1,"renal":3,"liver":1},"avoid":[],"caution":[{"text":"신장 질환 — 고마그네슘혈증","flags":["kidney"]}],"interactions":[{"with":"항생제·갑상선약·철분제","level":"주의","note":"2시간 간격."}],"pregnancy":"단기 사용 가능.","children":"라벨 확인.","products":[{"name":"겔포스엠 등 복합 제산제","maker":"보령 외","amount":"복합제 성분","rx":"일반"}],"tips":[],"sources":["mfds_gelfos"],"simple":"복합 제산제 라벨대로"},{"id":"digestive-enzyme","name":"소화효소제 (훼스탈·베아제)","en":"Digestive enzymes (pancreatin etc.)","class":"gi-digest","rx":"안전상비","tagline":"과식 후 더부룩함에 — 위산·통증에는 아님","lead":"판크레아틴 등 소화효소와 가스 제거 성분(시메티콘)을 모은 약이에요. 과식·기름진 음식 뒤 더부룩함·가스에 맞고, 속쓰림·명치 통증·위산 증상에는 효과가 없어요(그건 제산제·파모티딘 몫). 편의점(안전상비)에서도 살 수 있어요.","for":["과식 후 더부룩함","가스·트림"],"dose":{"adult":"1~2정(제품별)","interval":"식후 하루 3회","max":"라벨 기준","child":"8세 미만 금지(대부분 제품)"},"onset":"30분~1시간","duration":"식사 1회분","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[{"text":"8세 미만(제품별 확인)","flags":["child"]},{"text":"돼지 유래 단백 알레르기"}],"caution":[{"text":"명치 통증·체중 감소·검은 변이 있으면 소화제로 버티지 말고 진료"}],"interactions":[],"pregnancy":"단기 사용 가능한 편.","children":"8세 이상(제품 라벨).","products":[{"name":"훼스탈 골드정·플러스정","maker":"한독","amount":"판크레아틴 + 우르소데옥시콜산 + 시메티콘 등","rx":"안전상비"},{"name":"베아제정·닥터베아제정","maker":"대웅제약","amount":"소화효소 복합 + 시메티콘","rx":"안전상비"}],"tips":["씹지 말고 식후에 통째로.","‘체했다’가 명치 통증·구토·식은땀을 동반하면 소화제가 아니라 진료(심장·담낭 문제 감별)."],"sources":["mohw_safestad"],"simple":"1~2정, 하루 3번 식후. 씹지 않고"},{"id":"simethicone","name":"시메티콘","en":"Simethicone","class":"gi-digest","rx":"일반","tagline":"가스 거품을 터뜨리는 성분 — 흡수되지 않아 안전","lead":"장 속 가스 거품의 표면장력을 낮춰 방귀·트림으로 빠지게 해요. 몸에 흡수되지 않아 임신 중·소아에도 비교적 안전하고, 소화제·제산제 복합제에 두루 들어 있어요.","for":["가스 참","더부룩함"],"dose":{"adult":"복합제 용법에 따름(40~80 mg/회)","max":"라벨 기준"},"onset":"30분","duration":"수 시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[],"caution":[],"interactions":[],"pregnancy":"흡수되지 않아 사용 가능한 편.","children":"소아용 제품 있음.","products":[{"name":"훼스탈·베아제·겔포스엠 등 복합제 성분","maker":"다수","amount":"40~80 mg","rx":"일반"}],"tips":[],"sources":["mfds_gelfos"],"simple":"복합제 라벨대로 식후"},{"id":"loperamide","name":"로페라마이드","en":"Loperamide","class":"bowel","rx":"일반","tagline":"설사를 멈추는 약 — 열·혈변이 있으면 절대 금지","lead":"장 운동을 늦춰 설사를 멈추는 약이에요. 여행·중요한 일정 앞의 물설사에 유용하지만, **열이 나거나 변에 피·점액이 섞인 세균성 장염에는 균을 가두는 셈이라 금기**예요. 이틀 넘게 쓰지 말고, 물·전해질 보충이 먼저예요.","for":["급성 물설사(열·혈변 없는)"],"dose":{"adult":"첫 회 4 mg(2캡슐), 이후 묽은 변 때마다 2 mg","interval":"필요 시","max":"16 mg(국내 허가) · 자가치료는 8 mg 이내, 2일 이내","child":"6세 미만 금지 [확인 필요] · 소아는 의사 상담"},"onset":"1시간","duration":"수 시간","risk":{"gi":2,"cv":2,"renal":1,"liver":1},"riskNote":{"cv":"과량·남용 시 심각한 부정맥 보고(FDA 경고)."},"pict":["물많이","단기만","소아주의"],"avoid":[{"text":"열이 나거나 변에 피·점액이 섞인 경우(세균성 장염)"},{"text":"항생제 복용 중 생긴 심한 설사"},{"text":"6세 미만·영유아(장마비·치명적 부작용 보고)","flags":["child"]},{"text":"복부 팽만·변비 교대(장폐색 의심)"}],"caution":[{"text":"탈수 상태 — 약보다 수분 보충","flags":["senior"]},{"text":"간질환","flags":["liver"]}],"sideEffects":["변비·복부 팽만","어지러움"],"stop":["열·혈변이 새로 생김","배가 빵빵하게 부풀고 방귀가 안 나옴"],"interactions":[{"with":"퀴니딘·리토나비르 등","level":"주의","note":"혈중 농도 상승."}],"pregnancy":"임신 중 되도록 피함(의사 상담).","children":"6세 미만 금지, 소아는 의사 상담.","products":[{"name":"로프민캡슐·로페린 등","maker":"영일제약 외","amount":"2 mg/캡슐","rx":"일반"}],"tips":["설사는 대부분 2~3일 안에 저절로 좋아져요. 약은 ‘꼭 멈춰야 하는 상황’에만.","물 + 전해질(이온음료를 물로 반 희석, 또는 경구수액제)이 진짜 치료예요."],"sources":["mfds_loperamide","li2007lop"],"simple":"처음 2캡슐, 이후 설사할 때마다 1캡슐. 하루 8 mg(4캡슐) 이내, 2일 이내"},{"id":"smectite","name":"스멕타이트 (지사 흡착제)","en":"Dioctahedral smectite","class":"bowel","rx":"일반","tagline":"독소·수분을 흡착하는 지사제 — 2세 미만·임신 금지","lead":"점토 성분이 장 속 독소와 수분을 흡착해 설사를 줄여요. 로페라마이드와 달리 장 운동을 멈추지 않아 감염성 설사에도 쓸 수 있지만, 2019년 식약처가 납 노출 우려로 **2세 미만·임신·수유 중 금지, 소아는 7일 이내**로 제한했어요.","for":["급성 설사(보조)"],"dose":{"adult":"1포(3 g)","interval":"하루 3회","max":"하루 3포","child":"2세 이상, 7일 이내"},"onset":"수 시간","duration":"—","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[{"text":"2세 미만","flags":["child"]},{"text":"임신·수유 중","flags":["pregnant"]}],"caution":[{"text":"다른 약과 2시간 간격(흡착으로 흡수 방해)"}],"sideEffects":["변비"],"interactions":[{"with":"모든 경구약","level":"주의","note":"함께 먹으면 약을 흡착해요. 2시간 띄우세요."}],"pregnancy":"금지.","children":"2세 이상, 7일 이내.","products":[{"name":"스타빅·다이톱 등(스멕타는 허가 취하)","maker":"다수","amount":"3 g/포","rx":"일반"}],"tips":["물에 잘 개어서. 수분 보충은 별도로 꼭."],"sources":["mfds_smecta"],"simple":"1포(3 g), 하루 3번. 다른 약과 2시간 띄우기"},{"id":"bisacodyl","name":"비사코딜 (자극성 변비약)","en":"Bisacodyl","class":"bowel","rx":"일반","tagline":"밤에 먹고 아침에 — 급할 때 쓰는 자극성 완하제","lead":"장을 직접 자극해 6~12시간 뒤 배변을 유도해요. 효과가 확실하지만 배가 아플 수 있고, 매일 오래 쓰면 장이 약에 기대게 돼요. 진료 지침(AGA-ACG 2023)은 삼투성 완하제(PEG·마그네슘)를 먼저, 자극성은 필요 시로 둡니다.","for":["급성 변비","여행 변비"],"dose":{"adult":"5 mg 정 1~2정(둘코락스에스 2정)","interval":"취침 전 하루 1회","max":"하루 1회 · 1주 이내","child":"7세 이상 1정(제품 라벨)"},"onset":"6~12시간","duration":"1회 배변","risk":{"gi":2,"cv":1,"renal":1,"liver":1},"pict":["단기만"],"avoid":[{"text":"장폐색·심한 복통·구토가 있는 변비"},{"text":"7세 미만","flags":["child"]}],"caution":[{"text":"우유·제산제와 1시간 이내 함께 먹지 말 것(장용 코팅이 풀려 위에서 녹음)"},{"text":"1주 넘게 매일 쓰지 말 것"}],"sideEffects":["복통·경련","설사"],"stop":["심한 복통","1주 써도 변화 없음"],"interactions":[{"with":"우유·제산제·파모티딘","level":"주의","note":"1시간 간격."}],"pregnancy":"단기 사용 가능한 편(의사 상담).","children":"7세 이상.","products":[{"name":"둘코락스에스 장용정","maker":"오펠라","amount":"비사코딜 5 mg + 도큐세이트 16.75 mg","rx":"일반"},{"name":"메이킨큐 장용정","maker":"명인제약","amount":"비사코딜 5 mg + 생약","rx":"일반"}],"tips":["씹거나 부수지 말고 통째로.","매일 필요한 변비라면 마그네슘(마그밀)이나 PEG로 바꾸고 식이섬유·물·운동을 먼저."],"sources":["mfds_dulcolax","aga2023cic"],"simple":"2정, 취침 전 하루 1번. 씹지 않고, 1주 이내"},{"id":"magnesium-oxide","name":"산화마그네슘 (마그밀)","en":"Magnesium oxide (laxative)","class":"bowel","rx":"일반","tagline":"매일 써도 되는 순한 삼투성 변비약 — 신장이 나쁘면 금지","lead":"장 안으로 물을 끌어들여 변을 부드럽게 해요. 습관성이 적어 만성 변비의 기본약이고(지침: 조건부 권고), 위산을 중화하는 제산 작용도 있어요. 신장이 나쁘면 마그네슘이 쌓여 위험하니 피하세요.","for":["만성·습관성 변비","제산(보조)"],"dose":{"adult":"하루 1~2 g(500 mg 2~4정)을 1~2회 나눠서","interval":"12~24시간","max":"하루 2 g(변비)"},"onset":"6~24시간","duration":"매일 복용 시 유지","risk":{"gi":1,"cv":1,"renal":4,"liver":1},"riskNote":{"renal":"신장 기능이 떨어지면 고마그네슘혈증 — 신장 질환자는 금지."},"avoid":[{"text":"신장 질환","flags":["kidney"]},{"text":"장폐색 의심"}],"caution":[{"text":"65세 이상은 신장 기능을 확인하고 저용량부터","flags":["senior"]},{"text":"다른 약과 2시간 간격"}],"sideEffects":["설사(용량 줄이면 됨)"],"stop":["근력 저하·구역·느린 맥(고마그네슘혈증 신호)"],"interactions":[{"with":"항생제(퀴놀론·테트라사이클린)·갑상선약·철분·골다공증약","level":"주의","note":"2시간 간격."}],"pregnancy":"사용 가능한 편(의사 상담).","children":"소아 용량은 약사 확인.","products":[{"name":"마그밀정","maker":"삼남제약","amount":"산화마그네슘 500 mg/정","rx":"일반"}],"tips":["물을 충분히 마셔야 효과가 나요.","변이 너무 무르면 정수를 줄이고, 딱딱하면 늘리는 식으로 조절."],"sources":["mfds_magmil","aga2023cic"],"simple":"500 mg 2~4정, 하루 1~2번 나눠서. 물 충분히"},{"id":"ketoprofen","name":"케토프로펜 파스 (케토톱)","en":"Ketoprofen (topical)","class":"topical","rx":"일반","tagline":"붙이는 소염제 — 효과 좋지만 ‘햇빛 2주 주의’","lead":"피부를 통해 소염제를 국소로 전달해요. 급성 근골격 통증에서 케토프로펜 겔은 코크란 NNT 2.5로 근거가 탄탄해요. 다만 **광과민증** 때문에 식약처가 2010년 ‘15세 미만 금지, 떼어낸 뒤에도 2주간 붙였던 자리 햇빛 차단’을 의무화했어요.","for":["근육통","염좌·타박","관절통(국소)"],"dose":{"adult":"1매","interval":"하루 2회","max":"라벨 기준","child":"15세 미만 금지"},"onset":"1~2시간","duration":"12시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"pict":["햇빛주의","소아주의"],"avoid":[{"text":"15세 미만","flags":["child"]},{"text":"아스피린·NSAID 천식","flags":["asthma"]},{"text":"임신 후기","flags":["pregnant"]},{"text":"상처·습진 부위, 점막"}],"caution":[{"text":"부착 중·제거 후 2주간 해당 부위 자외선 차단(옷·차단제)"},{"text":"먹는 소염제와 겹치면 전신 흡수가 더해질 수 있어요(넓은 부위 장기 사용 시)"}],"sideEffects":["붙인 자리 가려움·발적","광과민 발진"],"stop":["붙인 부위에 물집·심한 발진"],"interactions":[{"with":"먹는 NSAID","level":"주의","note":"국소 흡수는 적지만 넓은 부위·장기 사용 시 합산."}],"pregnancy":"임신 후기 금기.","children":"15세 미만 금지.","products":[{"name":"케토톱 플라스타","maker":"한독","amount":"케토프로펜 30 mg/매","rx":"일반"}],"tips":["무릎·어깨처럼 한 부위 통증엔 먹는 소염제보다 파스가 위장·심장 부담 없이 좋은 첫 선택이에요.","여름엔 케토프로펜 대신 피록시캄·디클로페낙·록소프로펜 패치가 광과민 걱정이 덜해요."],"sources":["handok_ketotop","mfds_ketoprofen2010","derry2015topical"],"simple":"1매, 하루 2번 부착. 떼고 2주간 햇빛 차단"},{"id":"piroxicam","name":"피록시캄 패치 (트라스트)","en":"Piroxicam (topical)","class":"topical","rx":"일반","tagline":"2일에 한 장 — 오래 가는 붙이는 소염제","lead":"48시간 지속되는 소염제 패치예요. 먹는 피록시캄은 위장 위험이 가장 높은 축(SOS RR 7.43)이라 처방도 드물지만, 붙이는 형태는 전신 흡수가 적어 국소 관절통에 널리 써요.","for":["관절통","근육통(국소)"],"dose":{"adult":"1매","interval":"2일마다(48시간)","max":"라벨 기준"},"onset":"수 시간","duration":"48시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[{"text":"NSAID 알레르기","flags":["asthma"]},{"text":"임신 후기","flags":["pregnant"]}],"caution":[{"text":"드물게 광과민 — 햇빛 노출 부위 주의"}],"sideEffects":["국소 발진·가려움"],"interactions":[],"pregnancy":"임신 후기 금기.","children":"라벨 확인.","products":[{"name":"트라스트 패취","maker":"SK케미칼","amount":"피록시캄 48 mg/매","rx":"일반"}],"tips":["이틀에 한 장이라 붙였다 떼는 번거로움이 적어요."],"sources":["mfds_trast","derry2017topical","castellsague2012"],"simple":"1매, 2일마다 부착"},{"id":"diclofenac-topical","name":"디클로페낙 겔 (볼타렌 에멀겔)","en":"Diclofenac (topical gel)","class":"topical","rx":"일반","tagline":"바르는 소염제 중 근거 1위 — NNT 1.8","lead":"급성 염좌·타박에서 코크란 종합 결과 **디클로페낙 겔이 NNT 1.8로 국소 진통제 중 가장 효과적**이었고, 부작용은 위약과 같았어요. 무릎 관절염 6~12주에도 효과가 확인됐어요. 먹는 디클로페낙과 달리 심장·위장 걱정이 거의 없어요.","for":["염좌·타박","무릎·손 관절염","근육통(국소)"],"dose":{"adult":"2~4 g(체리 1~2알 크기)을 환부에","interval":"하루 3~4회","max":"라벨 기준"},"onset":"1시간","duration":"6~8시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[{"text":"NSAID 알레르기","flags":["asthma"]},{"text":"임신 후기","flags":["pregnant"]},{"text":"상처·점막"}],"caution":[{"text":"넓은 부위에 장기간 바르면 전신 흡수 — 항응고제 복용자는 주의","flags":["anticoag"]}],"sideEffects":["바른 자리 가려움·건조"],"interactions":[{"with":"먹는 NSAID","level":"주의","note":"넓은 부위 장기 사용 시 합산."}],"pregnancy":"임신 후기 금기.","children":"라벨 확인.","products":[{"name":"볼타렌 에멀겔","maker":"헤일리온","amount":"디클로페낙 1% 겔","rx":"일반"}],"tips":["문질러 흡수시키고 손을 씻으세요.","발목 삐끗·손목 통증엔 먹는 약 전에 이 겔 + 냉찜질이 진료실 1순위예요."],"sources":["mfds_voltaren","derry2015topical","derry2016chronic"],"simple":"체리 1~2알 크기를 하루 3~4번 문질러 바르기"},{"id":"flurbiprofen","name":"플루르비프로펜 (스트렙실 트로키·패치)","en":"Flurbiprofen","class":"topical","rx":"일반","tagline":"목 아플 때 녹여 먹는 소염제 — 11분 만에 첫 완화","lead":"인후통용 트로키(스트렙실)와 붙이는 패치로 나와요. 트로키는 RCT에서 첫 완화까지 중앙값 11분, 의미 있는 완화 43분, 7일간 통증·삼킴 어려움·부종을 유의하게 줄였어요. 소염제라 위궤양·천식·임신 후기엔 피하고, 하루 5개·3일 이내로.","for":["인후통","국소 통증(패치)"],"dose":{"adult":"트로키 1개(8.75 mg)를 천천히 녹임","interval":"3~6시간","max":"하루 5개 · 3일 이내","child":"12세 미만 금지"},"onset":"11분(첫 완화)","duration":"3~4시간","risk":{"gi":2,"cv":1,"renal":1,"liver":1},"pict":["단기만","소아주의"],"avoid":[{"text":"12세 미만","flags":["child"]},{"text":"아스피린·NSAID 천식","flags":["asthma"]},{"text":"위궤양","flags":["ulcer"]},{"text":"임신 후기","flags":["pregnant"]}],"caution":[{"text":"다른 소염제와 함께 쓰면 NSAID 중복"}],"sideEffects":["입안 얼얼함","속쓰림(드묾)"],"interactions":[{"with":"이부프로펜·나프록센","level":"주의","note":"같은 NSAID 계열 — 함께 쓸 때 총량 고려."}],"pregnancy":"임신 후기 금기.","children":"12세 이상.","products":[{"name":"스트렙실 트로키(허니앤레몬·오렌지)","maker":"옥시레킷벤키저","amount":"플루르비프로펜 8.75 mg/개","rx":"일반"}],"tips":["씹지 말고 천천히 녹이세요.","3일 넘게 목이 아프거나 열·침 삼키기 어려움이 심하면 편도염·인두염 진료."],"sources":["mfds_strepsils","flurbi2018"],"simple":"트로키 1개를 3~6시간마다 천천히 녹여서. 하루 5개, 3일 이내"},{"id":"methyl-salicylate","name":"살리실산메틸 파스 (신신파스·제일쿨파프)","en":"Methyl salicylate (rubefacient)","class":"topical","rx":"안전상비","tagline":"편의점 파스 — 온파스(뻐근함) vs 냉파프(삐끗 초기)","lead":"피부를 자극해 혈류를 늘리고 통증 감각을 흐리는 전통 파스 성분이에요. 근거 수준은 NSAID 파스보다 낮지만(코크란: 살리실산 도포제 근거 낮음) 편의점에서 살 수 있어요. **삐끗한 직후 48시간은 수분이 든 냉파프(제일쿨파프), 며칠 지난 뻐근함·만성 근육통은 온파스(신신파스 아렉스)**가 맞아요.","for":["근육통·뻐근함","삐끗 초기(냉파프)"],"dose":{"adult":"1매","interval":"하루 1~2회","max":"라벨 기준","child":"30개월 미만 유아 금지(캄파 함유 제품)"},"onset":"30분","duration":"8~12시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[{"text":"아스피린 알레르기(살리실산계)","flags":["asthma"]},{"text":"상처·습진 부위"}],"caution":[{"text":"와파린 복용 중 넓은 부위 장기 사용 시 INR 상승 보고","flags":["anticoag"]},{"text":"핫팩·전기장판과 함께 쓰면 화상"}],"sideEffects":["붙인 자리 발적·가려움"],"interactions":[{"with":"와파린","level":"주의","note":"살리실산 흡수로 INR 상승 가능."}],"pregnancy":"소량 단기 사용은 가능한 편.","children":"영유아 금지.","products":[{"name":"신신파스 아렉스 (온파스)","maker":"신신제약","amount":"살리실산메틸 + 멘톨 + 노닐산바닐릴아미드(온감)","rx":"안전상비"},{"name":"제일쿨파프 (냉파프)","maker":"제일헬스사이언스","amount":"살리실산메틸 + 멘톨 + 캄파 + 박하유","rx":"안전상비"},{"name":"안티푸라민 연고","maker":"유한양행","amount":"멘톨 + 캄파 + 살리실산메틸","rx":"일반"}],"tips":["삐끗 직후엔 냉파프 + 얼음찜질, 48시간 뒤엔 온파스 + 온찜질이 진료실 원칙과 같아요.","통증이 심하면 NSAID 파스(케토톱·트라스트·디클로페낙 겔)가 근거상 더 강해요."],"sources":["mohw_safestad","derry2017topical"],"simple":"1매, 하루 1~2번 부착. 핫팩 금지"},{"id":"menthol","name":"멘톨 (냉감 성분)","en":"Menthol","class":"topical","rx":"일반","tagline":"시원한 느낌으로 통증을 가리는 성분","lead":"피부 냉감 수용체를 자극해 시원한 느낌으로 통증 감각을 흐려요. 파스·연고·목 사탕에 두루 들어 있고 약효 자체보다 ‘느낌’이 큰 성분이에요.","for":["국소 통증(보조)","가려움"],"dose":{"adult":"제품 라벨","max":"라벨 기준"},"onset":"몇 분","duration":"1~2시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[{"text":"영유아 얼굴·코 주변(호흡 억제 우려)","flags":["child"]}],"caution":[],"interactions":[],"pregnancy":"국소 사용 가능.","children":"영유아 주의.","products":[{"name":"파스·안티푸라민·목 사탕 등","maker":"다수","amount":"복합 성분","rx":"일반"}],"tips":[],"sources":["derry2017topical"],"simple":"제품 라벨대로"},{"id":"chlorpheniramine","name":"클로르페니라민 (1세대 항히스타민)","en":"Chlorpheniramine","class":"antihistamine","rx":"안전상비","tagline":"감기약 속 콧물 성분 — 졸리고, 노인에겐 위험","lead":"거의 모든 종합감기약에 들어 있는 1세대 항히스타민제예요. 콧물·재채기를 줄이지만 뇌로 들어가 **졸음·집중력 저하**를 일으키고, 운전·업무 사고와 연관돼요(GA²LEN 입장문). 65세 이상은 섬망·낙상·소변 막힘 위험으로 Beers 기준 회피 약물이에요.","for":["콧물·재채기(감기)","두드러기(단기)"],"dose":{"adult":"복합제 기준 2~4 mg/회","interval":"4~6시간","max":"라벨 기준"},"onset":"30분","duration":"4~6시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"pict":["졸음","운전주의","음주금지"],"avoid":[{"text":"녹내장","flags":["glaucoma"]},{"text":"전립선비대(소변 막힘)","flags":["bph"]},{"text":"2세 미만(감기약 자체 비권장)","flags":["child"]}],"caution":[{"text":"65세 이상 — 섬망·낙상·요폐(Beers)","flags":["senior"]},{"text":"운전·수험·정밀 작업 전","flags":[]},{"text":"술·수면제와 겹치면 진정 상승","flags":["alcohol"]},{"text":"천식 — 가래가 진해질 수 있음","flags":["asthma"]}],"sideEffects":["졸음·나른함","입마름","소변 보기 어려움(남성 고령)"],"interactions":[{"with":"수면유도제(디펜히드라민)·멀미약","level":"주의","note":"같은 항히스타민 계열 중복 — 감기약 + 수면유도제 함께 금지."},{"with":"술","level":"주의","note":"진정 상승."}],"pregnancy":"필요 시 단기 사용하는 편(의사 상담).","children":"소아용 제품 라벨 확인.","products":[{"name":"판콜에이·판피린·콜대원·타이레놀콜드에스 등","maker":"다수","amount":"2~2.5 mg/회","rx":"안전상비"}],"tips":["낮에 활동해야 하면 졸리지 않는 2세대(세티리진·로라타딘·펙소페나딘)를 따로 고르는 게 낫습니다."],"sources":["galen2010","beers2023","desutter2022"],"simple":"감기약 1회분, 하루 3번 식후. 졸림 — 운전 금지"},{"id":"pseudoephedrine","name":"슈도에페드린 (코막힘)","en":"Pseudoephedrine","class":"cold","rx":"일반","tagline":"코막힘엔 가장 확실한 성분 — 혈압·전립선·불면 주의","lead":"코 점막 혈관을 수축시켜 코막힘을 뚫어요. 코감기약(콜대원 노즈에스·타이레놀 콜드에스 등)에 들어 있어요. 메타분석에서 혈압을 평균 1 mmHg 정도만 올리지만 **조절 안 되는 고혈압·심장병·갑상선기능항진·전립선비대·녹내장**은 피하고, 저녁엔 잠이 안 올 수 있어요.","for":["코막힘","코감기"],"dose":{"adult":"복합제 기준 30~60 mg/회","interval":"4~6시간","max":"240 mg/일"},"onset":"30분","duration":"4~6시간","risk":{"gi":1,"cv":2,"renal":1,"liver":1},"avoid":[{"text":"조절되지 않는 고혈압·관상동맥질환","flags":["heart"]},{"text":"MAO억제제 복용 중"},{"text":"녹내장","flags":["glaucoma"]},{"text":"전립선비대(소변 막힘)","flags":["bph"]}],"caution":[{"text":"조절되는 고혈압은 소폭 상승 — 짧게","flags":["heart"]},{"text":"불면·두근거림"},{"text":"임신 초기엔 피함","flags":["pregnant"]}],"sideEffects":["두근거림","불면","입마름"],"interactions":[{"with":"카페인·에너지음료","level":"주의","note":"두근거림 증가."},{"with":"MAO억제제","level":"금기","note":"고혈압 위기."}],"pregnancy":"임신 초기 회피(구조 기형 연관 보고).","children":"소아용 제품 라벨 확인.","products":[{"name":"콜대원 노즈에스·코프에스, 타이레놀 콜드에스, 화이투벤 큐플러스","maker":"대원제약·존슨앤드존슨·동화약품","amount":"15~30 mg/회","rx":"일반"}],"tips":["콧물·재채기가 아니라 ‘막힘’이 주 증상이면 이 성분이 든 제품을 고르세요.","고혈압이 있으면 오트리빈 같은 뿌리는 약을 3일 이내로 쓰는 편이 낫습니다."],"sources":["salerno2005","desutter2022"],"simple":"복합제 1회분, 하루 3번 식후. 저녁엔 불면 주의"},{"id":"phenylephrine","name":"페닐레프린 (코막힘)","en":"Phenylephrine","class":"cold","rx":"안전상비","tagline":"먹는 형태는 효과가 약하다는 평가 — 슈도에페드린의 대체","lead":"판콜에이·테라플루 등에 든 코막힘 성분이에요. 먹었을 때 간에서 대부분 분해돼 효과가 약하다는 평가가 있어요(FDA 자문위 2023, 경구 제제). 그래도 고혈압·전립선 주의사항은 슈도에페드린과 같아요.","for":["코막힘(감기 복합제)"],"dose":{"adult":"복합제 기준 10 mg/회","interval":"4~6시간","max":"라벨 기준"},"onset":"30분","duration":"4시간","risk":{"gi":1,"cv":2,"renal":1,"liver":1},"avoid":[{"text":"조절 안 되는 고혈압·심장병","flags":["heart"]},{"text":"MAO억제제"}],"caution":[{"text":"녹내장·전립선비대","flags":["glaucoma","bph"]}],"sideEffects":["두근거림(드묾)"],"interactions":[{"with":"MAO억제제","level":"금기","note":"혈압 급상승."}],"pregnancy":"임신 초기 회피.","children":"라벨 확인.","products":[{"name":"판콜에이·테라플루 데이/나이트·판피린큐","maker":"동화약품·헤일리온·동아제약","amount":"10 mg/회","rx":"안전상비"}],"tips":["코막힘이 심하면 슈도에페드린 제품이나 비강 분무제가 더 확실해요."],"sources":["desutter2022","salerno2005"],"simple":"복합제 1회분, 하루 3번 식후"},{"id":"methylephedrine","name":"메틸에페드린 (기침·코막힘)","en":"dl-Methylephedrine","class":"cold","rx":"일반","tagline":"국내 감기약 특유의 기관지 확장·코막힘 성분","lead":"판피린큐·판콜에스·콜대원 등 국내 감기약에 흔한 성분으로, 기관지를 넓히고 코막힘을 줄여요. 에페드린 계열이라 고혈압·심장병·갑상선·당뇨·전립선비대·녹내장에 주의하고, 두근거림·불면이 생길 수 있어요.","for":["기침·코막힘(감기 복합제)"],"dose":{"adult":"복합제 기준 12.5~20 mg/회","interval":"라벨","max":"라벨 기준"},"onset":"30분","duration":"4시간","risk":{"gi":1,"cv":2,"renal":1,"liver":1},"avoid":[{"text":"조절 안 되는 고혈압·심장병","flags":["heart"]},{"text":"MAO억제제"}],"caution":[{"text":"갑상선기능항진·당뇨·녹내장·전립선비대","flags":["glaucoma","bph"]}],"sideEffects":["두근거림","불면"],"interactions":[{"with":"카페인","level":"주의","note":"두근거림 증가."}],"pregnancy":"임신 중 회피.","children":"라벨 확인.","products":[{"name":"판피린큐·판콜에스·콜대원·화이투벤","maker":"동아제약·동화약품·대원제약","amount":"12.5~20 mg/회","rx":"일반"}],"tips":[],"sources":["desutter2022"],"simple":"복합제 1회분, 하루 3번 식후"},{"id":"dextromethorphan","name":"덱스트로메토르판 (마른기침)","en":"Dextromethorphan","class":"cold","rx":"일반","tagline":"기침 중추를 눌러 마른기침을 줄이는 성분","lead":"가래 없는 마른기침을 줄이는 진해제예요. 코크란 종합에서는 일반 기침약 전반의 효과 근거가 약했지만, 밤에 잠을 못 잘 정도의 마른기침에는 흔히 써요. 가래 기침엔 오히려 배출을 막으니 쓰지 않아요.","for":["마른기침"],"dose":{"adult":"복합제 기준 15~30 mg/회","interval":"4~6시간","max":"120 mg/일"},"onset":"30분","duration":"4~6시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[{"text":"MAO억제제·일부 항우울제(SSRI) 복용 중 — 세로토닌 증후군"},{"text":"가래 많은 기침"}],"caution":[{"text":"천식·COPD로 가래가 많으면 피함","flags":["asthma"]}],"sideEffects":["졸음·어지러움","구역"],"interactions":[{"with":"SSRI·MAO억제제·트라마돌","level":"주의","note":"세로토닌 증후군 위험."}],"pregnancy":"필요 시 단기(의사 상담).","children":"소아 제품 라벨 확인.","products":[{"name":"타이레놀 콜드에스·화이투벤·씨콜드 등","maker":"다수","amount":"8~15 mg/회","rx":"일반"}],"tips":["가래가 있으면 진해제 대신 거담제(구아이페네신)와 물을 많이 드세요."],"sources":["cough2014"],"simple":"복합제 1회분, 하루 3번 (마른기침, 취침 전 우선)"},{"id":"guaifenesin","name":"구아이페네신 (가래)","en":"Guaifenesin","class":"cold","rx":"일반","tagline":"가래를 묽게 해 뱉기 쉽게 — 물을 많이 마셔야 효과","lead":"기관지 분비를 묽게 해 가래 배출을 돕는 거담제예요. 근거는 약한 편이라(코크란) 충분한 수분 섭취가 사실상 같은 역할을 해요. 판콜·판피린 등 대부분 감기약에 들어 있어요.","for":["가래 기침"],"dose":{"adult":"복합제 기준 40~200 mg/회","interval":"4시간","max":"라벨 기준"},"onset":"30분","duration":"4시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[],"caution":[],"sideEffects":["구역(드묾)"],"interactions":[],"pregnancy":"사용 가능한 편.","children":"라벨 확인.","products":[{"name":"판콜에이·판피린큐·콜대원·화이투벤","maker":"다수","amount":"27~83 mg/회","rx":"안전상비"}],"tips":["물 1.5~2 L, 가습, 따뜻한 음료가 약만큼 중요해요."],"sources":["cough2014"],"simple":"복합제 1회분, 하루 3번 + 물 많이"},{"id":"cetirizine","name":"세티리진 (지르텍)","en":"Cetirizine","class":"antihistamine","rx":"일반","tagline":"2세대 중 가장 강하고 빠른 편 — 대신 3명 중 1명은 졸림","lead":"알레르기 비염·두드러기·가려움에 하루 한 알로 24시간 듣는 2세대 항히스타민제예요. 효과가 빠르고 강한 편이지만, 2세대 중에서는 졸음이 가장 큰 편(BMJ 코호트에서 로라타딘 대비 진정 OR 3.5)이라 취침 전 복용이 기본이에요.","for":["알레르기 비염","두드러기","가려움"],"dose":{"adult":"10 mg 1정","interval":"24시간(취침 전)","max":"10 mg/일","child":"6세 이상 10 mg, 2~6세는 소아 제형(약사 확인)"},"onset":"1시간","duration":"24시간","risk":{"gi":1,"cv":1,"renal":2,"liver":1},"pict":["졸음","운전주의"],"avoid":[],"caution":[{"text":"신장 기능 저하 — 용량 조절","flags":["kidney"]},{"text":"운전·정밀 작업 전엔 로라타딘·펙소페나딘이 안전","flags":[]},{"text":"술과 함께 진정 상승","flags":["alcohol"]}],"sideEffects":["졸음(10~14%)","입마름·피로"],"interactions":[{"with":"술·수면제","level":"주의","note":"진정 상승."},{"with":"감기약 속 클로르페니라민","level":"주의","note":"항히스타민 중복 — 함께 먹지 마세요."}],"pregnancy":"임신 중 비교적 안전하게 쓰이는 항히스타민제 중 하나(의사 상담).","children":"6세 이상 정제, 소아는 시럽.","products":[{"name":"지르텍정","maker":"한국UCB","amount":"세티리진 10 mg/정","rx":"일반"},{"name":"세티리진 제네릭 다수","maker":"다수","amount":"10 mg","rx":"일반"}],"tips":["저녁에 먹고 자면 낮 졸음이 줄어요.","비염이 ‘코막힘’ 위주면 항히스타민제만으론 부족 — 스테로이드 비강분무제(처방)가 1차 치료예요."],"sources":["mfds_zyrtec","mann2000","dykewicz2020"],"simple":"10 mg 1정, 하루 1번 취침 전"},{"id":"loratadine","name":"로라타딘 (클라리틴)","en":"Loratadine","class":"antihistamine","rx":"일반","tagline":"졸음 거의 없는 하루 한 알 — 낮 활동용","lead":"졸음이 거의 없는 2세대 항히스타민제예요(BMJ 코호트 기준 진정 위험 기준선). 효과 발현은 세티리진보다 조금 느리지만 하루 한 알로 24시간 가고, 운전·업무 중에도 쓸 수 있어요.","for":["알레르기 비염","두드러기","가려움"],"dose":{"adult":"10 mg 1정","interval":"24시간","max":"10 mg/일","child":"2세 이상 시럽, 6~12세 체중 30 kg 기준 5~10 mg"},"onset":"1~3시간","duration":"24시간","risk":{"gi":1,"cv":1,"renal":1,"liver":2},"avoid":[],"caution":[{"text":"간 기능 저하 — 격일 복용","flags":["liver"]}],"sideEffects":["두통·입마름(드묾)"],"interactions":[{"with":"감기약 속 클로르페니라민","level":"주의","note":"항히스타민 중복."}],"pregnancy":"임신 중 비교적 안전하게 쓰이는 편(의사 상담).","children":"2세 이상.","products":[{"name":"클라리틴정","maker":"바이엘코리아","amount":"로라타딘 10 mg/정","rx":"일반"}],"tips":["아침에 먹어도 되는 항히스타민제예요.","효과가 약하게 느껴지면 세티리진(취침 전)으로."],"sources":["mfds_claritin","mann2000"],"simple":"10 mg 1정, 하루 1번 아침"},{"id":"fexofenadine","name":"펙소페나딘 (알레그라)","en":"Fexofenadine","class":"antihistamine","rx":"일반","tagline":"졸음이 가장 적은 항히스타민제 — 과일주스와 먹지 말 것","lead":"뇌로 거의 들어가지 않아 2세대 중에서도 졸음이 가장 적어요(로라타딘과 동급 이하). 120 mg은 국내에서도 처방 없이 살 수 있어요. 오렌지·자몽·사과 주스, 알루미늄·마그네슘 제산제와 함께 먹으면 흡수가 크게 떨어지니 물과 함께.","for":["알레르기 비염","두드러기"],"dose":{"adult":"120 mg 1정","interval":"24시간(식전)","max":"120 mg/일(일반약 기준)","child":"12세 이상"},"onset":"1~2시간","duration":"24시간","risk":{"gi":1,"cv":1,"renal":2,"liver":1},"avoid":[],"caution":[{"text":"신부전 — 60 mg부터","flags":["kidney"]}],"sideEffects":["두통(드묾)"],"interactions":[{"with":"과일주스(오렌지·자몽·사과)","level":"주의","note":"흡수 30~40% 감소 — 물과 함께."},{"with":"알루미늄·마그네슘 제산제(겔포스·알마겔)","level":"주의","note":"2시간 간격."}],"pregnancy":"자료 제한 — 의사 상담.","children":"12세 이상(120 mg).","products":[{"name":"알레그라정 120mg","maker":"한독","amount":"펙소페나딘 120 mg/정","rx":"일반"}],"tips":["운전·시험처럼 절대 졸리면 안 되는 날엔 이 약."],"sources":["handok_allegra","mann2000"],"simple":"120 mg 1정, 하루 1번 식전 물과 함께 (주스 X)"},{"id":"xylometazoline","name":"자일로메타졸린 (오트리빈 스프레이)","en":"Xylometazoline (nasal)","class":"antihistamine","rx":"일반","tagline":"뿌리면 몇 분 안에 코가 뚫림 — 단, 3일 규칙","lead":"코 점막 혈관을 직접 수축시켜 몇 분 만에 코를 뚫어요. 먹는 코막힘약과 달리 혈압에 영향이 적어 고혈압 환자도 짧게 쓸 수 있어요. 문제는 **3일 넘게 계속 쓰면 약을 끊을 때 코가 더 막히는 반동성 비염**이에요. 허가사항: 하루 3회 이내, 연속 7일 금지, 3일 써서 좋아지지 않으면 중단.","for":["코막힘(감기·비염)"],"dose":{"adult":"각 콧구멍 1회 분무","interval":"8~10시간(하루 3회 이내)","max":"연속 3일 권장, 7일 초과 금지","child":"12세 이상(소아용 0.0
