대 변수는 브랜드; 편향 낮은 3건 SMD −0.27(작음).","forms":[{"name":"결정형 황산글루코사민 1,500 mg 1일 1회","bio":"—","note":"근거가 집중된 유일한 형태"},{"name":"글루코사민 염산염(HCl)","bio":"—","note":"근거 미비"},{"name":"콘드로이틴","bio":"—","note":"순도 문제 [확인 필요]"}],"dose":{"typical":"황산글루코사민 1,500 mg/일","ul":"미설정","kr":"식약처 기능성(관절·연골) 일일섭취량 [확인 필요]"},"calc":{"unit":"mg (글루코사민)","typical":1500,"ulRatio":2,"note":"1,500 mg 기준"},"bestForm":"결정형 황산글루코사민 1,500 mg","label":["염 형태(황산/염산)와 순수 글루코사민 함량.","하루 1,500 mg 도달 여부."],"timing":"식사와 함께.","timingShort":"식사와","cautions":["갑각류 알레르기(원료)","와파린 INR 상승 보고 [확인 필요]","효과가 작으니 3개월 후 무효면 중단이 합리적"],"priceTip":"결정형 황산글루코사민 1,500 mg/일 기준. 3개월 시험 후 판단.","sources":["gait2006","eriksen2014"],"brands":["글루코사민","조인트","관절영양제","콘드로이친"]},{"id":"ginseng","name":"홍삼","en":"Red ginseng","tags":["홍삼","인삼","피로","면역","진세노사이드","정관장 홍삼정","에브리타임","홍삼 스틱","홍삼진"],"evidence":"약함","for":"피로(효과 크기 작고 유의하지 않음)·면역(미검토)","lead":"19개 RCT 메타분석에서 인삼의 피로 개선은 SMD −0.36으로 **유의하지 않았고** 효과 크기가 작아요. 비교 기준은 홍삼 농축액 g이 아니라 **진세노사이드 Rg1+Rb1+Rg3 합계 mg**이에요. 와파린 복용자는 INR이 떨어질 수 있어 모니터링이 필요해요.","evidenceNote":"피로: SMD −0.36(−0.82~0.11, NS). 암 관련 피로: SMD −0.21. 면역: 메타분석 미조회 [확인 필요]. 와파린: 미국삼 INR −0.19(Yuan 2004) vs 무영향 RCT — 상충.","forms":[{"name":"홍삼 농축액·분말","bio":"—","note":"진세노사이드 합계 표기 확인"},{"name":"홍삼 정·캡슐","bio":"—","note":"동일"}],"dose":{"typical":"진세노사이드 Rg1+Rb1+Rg3 합 3~80 mg/일(식약처 기능성 범위, 비공식 요약)","ul":"미설정","kr":"공전 원문 [확인 필요]"},"calc":{"unit":"mg (진세노사이드 Rg1+Rb1+Rg3)","typical":10,"ulRatio":8,"note":"10 mg 기준(기능성 범위 3~80 mg)"},"bestForm":"진세노사이드 합계 명시 제품","label":["**진세노사이드 Rg1+Rb1+Rg3 합계 mg/일**.","농축액 g·‘6년근’은 비교 기준이 아님."],"timing":"시간 무관. 불면·두근거림 시 아침.","timingShort":"아침, 무관","cautions":["와파린 — INR 모니터링","항당뇨제(저혈당)·MAO억제제·에스트로겐 민감 질환 [확인 필요]"],"priceTip":"진세노사이드 합 10 mg당 가격. 프리미엄과 저가의 mg당 차이가 수 배예요.","sources":["ginseng_fatigue2023","yuan2004"],"brands":["정관장 홍삼정","에브리타임","홍삼 스틱","홍삼진"]},{"id":"milkthistle","name":"밀크씨슬(실리마린)","en":"Milk thistle","tags":["밀크씨슬","간","실리마린","숙취","헬씨오리진 밀크씨슬","간 영양제"],"evidence":"약함","for":"간 질환 — 사망·합병증 감소 근거 없음. 지방간 지표 개선(중간)","lead":"코크란(18 RCT, 1,088명): 알코올성·바이러스성 간질환에서 사망·합병증·조직학 개선 모두 유의하지 않았어요. 비알코올 지방간에서는 ALT·AST 등 **혈액 지표**가 좋아졌다는 메타분석이 있지만 시험 품질이 제한적이에요. ‘숙취·간 해독’ 마케팅은 근거가 없어요.","evidenceNote":"간질환 사망 RR 0.78(NS), 합병증 RR 0.95(NS). NAFLD: 26 RCT ALT·AST 개선(대리지표).","forms":[{"name":"실리마린 표준화 추출물","bio":"낮음(수용성 낮음)","note":"식약처 일일섭취량 실리마린 130 mg 통용 [확인 필요]"}],"dose":{"typical":"실리마린 130 mg/일(국내 통용)","ul":"미설정","kr":"[확인 필요]"},"calc":{"unit":"mg (실리마린)","typical":130,"ulRatio":4,"note":"130 mg 기준"},"bestForm":"실리마린 함량 명시","label":["밀크씨슬 추출물 무게가 아니라 **실리마린 mg**."],"timing":"식사와 함께.","timingShort":"식사와","cautions":["간 질환이 있으면 보충제보다 원인 치료·금주가 먼저","국화과 알레르기"],"priceTip":"실리마린 130 mg당 가격.","sources":["rambaldi2007"],"brands":["밀크씨슬","헬씨오리진 밀크씨슬","간 영양제","실리마린"]}],"symptoms":[{"id":"msk","group":"통증","icon":"bone","name":"근육·관절·허리 통증","short":"담 결림, 삐끗, 허리·어깨·무릎","tags":["허리","어깨","무릎","담","삐끗","염좌","근육통","관절","목","디스크","요통"],"lead":"진료실에서 근골격 통증 처방은 거의 항상 같은 뼈대예요 — **진통(아세트아미노펜) + 소염(NSAID) + 근이완제 + 위보호제**. 각 칸이 왜 필요한지 알면 약국에서도 같은 원리로 고를 수 있어요. 급성 요통은 대부분 몇 주 안에 저절로 좋아지니(ACP 2017), 약은 그동안 움직일 수 있게 돕는 도구예요.","planTitle":"진료실 처방의 4칸 — 약국 버전","planLabel":"필요한 칸만 골라도 돼요. 소염제는 한 가지만.","plan":[{"slot":"진통","title":"바탕 진통 — 아세트아미노펜","why":"위장·심장 부담 없이 통증의 바닥을 깔아요. 요통 단독으로는 효과가 없지만(PACE 시험), 소염제와 **함께** 쓰면 각각 단독보다 잘 들어요(코크란 NNT 1.5).","options":["acetaminophen"],"pick":"acetaminophen"},{"slot":"소염","title":"염증 잡기 — 소염진통제 한 가지","why":"급성 요통·염좌에 근거가 가장 강한 약(ACP 강한 권고). 위가 약하면 저용량 이부프로펜 + 파모티딘, 심장·혈압이 걱정이면 나프록센. 어느 것이든 **한 가지만**, 식후에.","options":["ibuprofen","naproxen","dexibuprofen"],"pick":"ibuprofen","alt":"처방 소염제(아세클로페낙·셀레콕시브 등)를 이미 받았다면 약국 소염제를 더 사지 마세요. 무릎·손목 한 곳이면 바르는 디클로페낙 겔도 선택지예요."},{"slot":"근이완","title":"뭉침 풀기 — 근이완제","why":"담 결림·근육 경직이 뚜렷할 때 소염제에 붙여요. 효과는 작지만 있고(BMJ 2021), 처방은 에페리손이 표준. 약국에서는 클로르족사존 3제 복합제가 유일해요. 졸음이 있으니 저녁에.","options":["relax-combo","eperisone"],"pick":"relax-combo","optional":true,"alt":"뭉침보다 ‘찌릿한 저림’이 주 증상이면 근이완제가 아니라 진료(신경 압박 감별)."},{"slot":"위보호","title":"위 지키기 — 파모티딘","why":"소염제를 3일 이상 먹거나, 위가 약하거나, 65세 이상·항응고제·SSRI·스테로이드 복용 중이면 붙여요. 진료실에선 PPI(처방)를 쓰고, 약국 대안은 파모티딘 10 mg. 제산제(겔포스)는 궤양 예방 근거가 없어요.","options":["famotidine"],"pick":"famotidine","optional":true}],"how":["**첫날**에는 식사 후에 타이레놀(아세트아미노펜) 1~2알과 이부프로펜 400 mg 한 알을 **같이** 드세요. 6시간쯤 지나면 한 번 더 드셔도 돼요.","**저녁**에는 근이완제 복합제를 한 번 드세요. 졸릴 수 있어서 밤이 좋아요. 소염제를 계속 드신다면 위를 지키는 파모티딘 10 mg도 함께요.","**2~3일째** 통증이 잡히면 소염제부터 줄이고 타이레놀만 남기세요. 소염제는 되도록 짧게, 적게 드시는 것이 원칙이에요.","무릎이나 손목처럼 한 곳만 아프시면 먹는 소염제 대신 바르는 겔(하루 3~4번)이나 소염 파스(하루 1~2장)로 시작하셔도 돼요.","소염제가 5일 넘게 계속 필요하거나, 1~2주가 지나도 나아지는 느낌이 없으면 병원에 가 보세요."],"pharmacy":["약사님께 이렇게 말씀하세요. “허리(어깨) 근육통이에요. 위는 괜찮아요(또는 속이 약해요). 아세트아미노펜하고 이부프로펜, 근이완제 복합제, 파모티딘 주세요.”","드시고 있는 약(혈압약·피 묽게 하는 약·다른 진통제), 임신 여부, 위궤양을 앓은 적이 있는지 먼저 말씀해 주세요.","병원에서 처방받은 소염제가 있으면 보여 드리고 “겹치지 않는 것만 주세요”라고 부탁하세요."],"selfcare":["**아파도 조금씩 움직이세요.** 누워만 계시는 것보다 평소처럼 걷고 집안일을 하시는 편이 더 빨리 낫는다고 확인돼 있어요(ACP 2017 지침).","**따뜻하게 찜질해 주세요.** 허리 통증에는 온찜질이 닷새 정도 통증을 덜어 준다는 연구가 있어요. 다만 막 삐끗한 뒤 이틀은 붓기를 가라앉히는 냉찜질이 먼저예요.","오래 앉아 계셨다면 30분마다 한 번씩 일어나 허리를 펴 주세요. 어깨·목이 아프시면 TV나 화면을 눈높이에 맞춰 주세요.","마사지와 스트레칭은 좋지만 아픈 데까지 억지로 늘리진 마세요. 시원한 정도면 충분해요."],"avoid":["소염제를 두 가지 같이 드시지 마세요(예: 이부프로펜과 나프록센, 탁센과 게보린). 효과는 그대로인데 위장과 콩팥 부담만 두 배가 돼요.","소염제는 빈속에 드시거나 술과 함께 드시면 위가 상해요. 꼭 식사 후에 드세요.","‘약이 약하다’고 느껴져도 한 번에 두 배로 드시지 마세요. 그 대신 계열이 다른 약(아세트아미노펜)을 더하는 편이 안전하고 효과도 좋아요.","파스 위에 핫팩이나 전기장판을 올리면 화상을 입을 수 있어요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["먼저 드시는 방법을 한 번 살펴봐 주세요. 소염제는 식후에 정해진 양으로, 아세트아미노펜과 **함께** 드시고 계신가요? 조금씩 띄엄띄엄보다 처음 이틀은 시간 맞춰 규칙적으로 드시는 편이 훨씬 잘 들어요.","약을 바꾸기보다 더해 보세요. 소염제 종류를 바꿔도 효과 차이는 거의 없어요. 근이완제·파스·온찜질을 더하는 편이 나아요.","1~2주가 지났는데도 나아지는 느낌이 없거나, 다리나 팔로 저림이 내려가면 병원에 가 보세요. 사진 검사, 처방 근이완제, 물리치료로 도와드릴 수 있어요.","4주 넘게 이어지는 허리 통증은 다시 살펴봐야 해요. 운동 치료가 필요한 단계예요."]},"care":{"pharmacy":["움직이면 아프고 쉬면 나아지는 근육·관절 통증","삐끗·담 결림·무리한 운동 뒤 통증","저림·마비·열이 없고, 대소변이 정상"],"clinic":["1~2주 약을 써도 나아지는 흐름이 없음","팔·다리로 내려가는 저림·찌릿함, 힘 빠짐","밤에 더 아프고 누워도 안 나아지는 통증","50세 이후 처음 생긴 요통, 20세 이전 요통","암 병력, 이유 없는 체중 감소, 스테로이드 장기 복용 중","열이 함께 나는 허리 통증"],"er":["대소변 조절이 안 되거나 사타구니·엉덩이 감각이 없음(마미증후군)","양쪽 다리에 힘이 빠짐","큰 사고·낙상 후 심한 통증(골절 의심)"]},"faq":[{"q":"타이레놀과 이부프로펜을 같이 먹어도 되나요?","a":"네. 계열이 달라 함께 먹을 수 있고, 급성 통증에서 각각 단독보다 효과가 좋아요(코크란 2013: 병용 NNT 1.5, 이부프로펜 단독 대비 NNT 5.4). 응급실 연구에서는 이 조합이 마약성 진통제와 같은 효과였어요."},{"q":"근이완제는 꼭 필요한가요?","a":"필수는 아니에요. 급성 요통에서 효과는 ‘작지만 있음’ 수준이고 졸음이 있어요. 뭉침·경직이 뚜렷할 때 며칠만."},{"q":"위보호제는 언제 붙이나요?","a":"소염제를 3일 이상 쓰거나, 위궤양 병력·65세 이상·항응고제·SSRI·스테로이드 복용 중일 때. 약국에선 파모티딘, 진료실에선 PPI."}],"sources":["acp2017","pace2014","derry2013combo","chang2017","cashin2021","rostom2002","derry2015topical","french2006","verhagen2016","castellsague2012","cnt2013"]},{"id":"dysmenorrhea","group":"통증","icon":"flower","name":"생리통","short":"무엇이 듣고, 언제 먹어야 하나","tags":["생리","월경","경련","자궁","생리통"],"lead":"생리통의 1차 약은 타이레놀이 아니라 **소염진통제(NSAID)**예요 — 통증을 만드는 프로스타글란딘 자체를 줄이기 때문에, 코크란 80개 시험에서 NSAID가 위약 대비 OR 4.4, 아세트아미노펜보다도 유의하게 나았어요. 그리고 **타이밍**이 절반이에요: 아프기 시작할 때(또는 시작 전날) 바로, 첫 2~3일은 시계 맞춰 규칙적으로.","planTitle":"생리통 처방의 뼈대","planLabel":"소염제 하나를 ‘미리·규칙적으로’가 핵심","plan":[{"slot":"소염","title":"1차 — 소염진통제 한 가지","why":"나프록센은 부하용량(첫 회 500 mg) 허가가 있어 시작이 확실하고 8~12시간 가요. 이부프로펜·덱시부프로펜도 동등해요(어느 NSAID가 우월하다는 근거 없음). 위가 약하면 이부프로펜, 붓기가 있으면 이지엔6 이브.","options":["naproxen","ibuprofen","dexibuprofen","easy6-eve"],"pick":"naproxen","alt":"게보린·펜잘·그날엔은 소염 성분이 적거나 진정 성분이 붙어 있어 2순위예요."},{"slot":"진통","title":"더하기 — 아세트아미노펜","why":"소염제로 부족할 때 계열이 다른 아세트아미노펜을 **함께** 더해요. 소염제를 두 가지로 늘리지는 않아요.","options":["acetaminophen"],"pick":"acetaminophen","optional":true},{"slot":"위보호","title":"속이 약하면 — 파모티딘","why":"2~3일 규칙 복용이라 속쓰림이 잦은 분은 파모티딘 10 mg을 아침·저녁으로.","options":["famotidine"],"pick":"famotidine","optional":true},{"slot":"예방","title":"매달 심하면 — 호르몬 치료(처방)","why":"NSAID로 3~6개월 안에 나아지지 않으면 2차로 경구피임약 등 호르몬 치료를 고려하고, 자궁내막증 같은 원인을 찾아요(ACOG 760).","options":[],"otc":false}],"how":["생리가 시작될 조짐(허리 묵직, 아랫배 뻐근)이 오면 **바로** 첫 회를 드세요. 탁센(나프록센) 2캡슐 또는 이부프로펜 400 mg이에요. 매달 규칙적으로 아프시면 예정일 전날부터 드셔도 돼요.","그 뒤로는 나프록센은 6~8시간마다 1캡슐, 이부프로펜은 4~6시간마다 1~2알씩, 아프든 안 아프든 **첫 2~3일은 시간을 맞춰** 드세요.","그래도 부족하면 사이에 타이레놀(아세트아미노펜) 1알을 더하셔도 돼요.","하루 상한은 나프록센 1,250 mg, 이부프로펜 1,200 mg(약국약 기준), 아세트아미노펜 4 g이에요.","배와 허리를 따뜻하게 하는 온찜질을 같이 하시면 약과 맞먹는 효과가 있어요."],"pharmacy":["약사님께 이렇게 말씀하세요. “생리통이에요. 나프록센(탁센)이나 이부프로펜 주세요. 속이 약하면 파모티딘도요.”","위궤양, 천식, 임신 가능성, 피 묽게 하는 약 복용 여부를 말씀해 주세요."],"selfcare":["**아랫배를 따뜻하게 해 주세요.** 온찜질은 여러 연구를 모아 봤을 때 진통제와 맞먹는 효과가 있었어요.","**평소에 꾸준히 운동해 두세요.** 규칙적으로 운동한 분들은 생리통이 눈에 띄게 줄었어요(코크란 연구).","저주파 마사지기(TENS)도 도움이 될 수 있어요. 근거는 아직 확실하지 않지만 해로울 건 없어요.","생강차는 작은 연구에서 효과가 있었어요. 보조로만 생각해 주세요."],"avoid":["‘참을 만큼 참았다가’ 드시지 마세요. 통증 물질(프로스타글란딘)이 이미 만들어진 뒤라 효과가 떨어져요. 시작 조짐이 보이면 바로 드세요.","소염제를 두 가지 겹쳐 드시지 마세요(탁센과 게보린, 이지엔6와 그날엔).","빈속에, 또는 술과 함께 드시는 소염제는 위를 상하게 해요.","카페인이 든 복합진통제를 매달 여러 날 드시면 오히려 약 때문에 생기는 두통이 올 수 있어요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["드시는 때와 양을 먼저 살펴 주세요. 시작하자마자, 첫 회는 조금 넉넉히, 그 뒤로는 시간 맞춰 규칙적으로 — 이 세 가지만 지켜도 대부분 달라져요.","아세트아미노펜을 더하고 온찜질을 같이 해 보세요.","3~6개월 이렇게 해도 매달 일상이 힘들면 산부인과에 가 보세요. 호르몬 치료(경구피임약 등)와 자궁내막증·선근증 검사가 큰 도움이 돼요.","생리 아닌 날에도 아프거나, 관계할 때 아프거나, 생리량이 갑자기 늘거나, 25세 넘어 처음 심한 생리통이 생겼다면 다른 원인이 있을 수 있어요. 진료를 받아 보세요."]},"care":{"pharmacy":["생리 첫 1~2일에 집중되는 아랫배·허리 통증","약과 온찜질로 일상이 가능한 정도"],"clinic":["NSAID를 제대로 써도 3~6개월 이상 매달 결석·결근할 정도","생리 아닌 날의 골반 통증, 성관계 통증","생리량이 갑자기 늘거나 덩어리혈","25세 이후 새로 시작된 심한 생리통","발열·냄새 나는 분비물 동반"],"er":["갑작스럽고 참을 수 없는 한쪽 아랫배 통증 + 실신·식은땀(난소 낭종 파열·자궁외임신 의심)","임신 가능성이 있는데 심한 통증·출혈"]},"faq":[{"q":"타이레놀은 생리통에 안 듣나요?","a":"듣긴 하지만 소염제보다 약해요(코크란: NSAID vs 파라세타몰 OR 1.89). 소염제를 못 드시는 분(임신 20주 이후·위궤양·천식 과민)에게 1차예요."},{"q":"탁센과 이지엔6 중 뭐가 나은가요?","a":"효과는 동등해요. 탁센(나프록센)은 부하용량 허가와 긴 지속시간이 장점, 이지엔6(이부프로펜·덱시부프로펜)는 위장 부담이 더 낮아요."},{"q":"피임약이 생리통에 도움이 되나요?","a":"네, NSAID 다음 2차 치료로 지침에 있어요(ACOG). 처방이 필요하고, 배란을 억제해 통증을 줄여요."}],"sources":["marjoribanks2015","acog760","jo2018heat","armour2019","tens2024","ginger2024","mfds_taksen","adidac2008"]},{"id":"headache","group":"통증","icon":"head","name":"두통","short":"긴장성·편두통·숙취 두통","tags":["머리","편두통","긴장성","두통"],"lead":"대부분의 두통은 긴장성이거나 편두통이고, 일반 진통제로 잡혀요. 원칙은 **초반에 충분한 용량 한 번**, 그리고 **한 달에 10~15일을 넘기지 않기** — 진통제를 자주 먹는 것 자체가 두통을 만드는 ‘약물과용두통’이 되거든요(ICHD-3). 갑자기 벼락 치듯 오는 두통은 약이 아니라 응급실이에요.","planTitle":"두통 진통제 고르기","planLabel":"단일제 두 가지 조합이 복합진통제보다 낫습니다","plan":[{"slot":"1차","title":"아세트아미노펜 또는 이부프로펜","why":"긴장성 두통엔 둘 다 1차. 편두통은 이부프로펜 400 mg·나프록센 500 mg 같은 소염제가 아세트아미노펜보다 잘 들어요(코크란 종합). 초반에 충분한 용량으로.","options":["ibuprofen","acetaminophen","naproxen"],"pick":"ibuprofen"},{"slot":"더하기","title":"부족하면 — 두 계열 함께","why":"아세트아미노펜 + 이부프로펜을 함께 먹으면 각각보다 효과가 커요. 카페인이 든 복합제(게보린·펜잘)는 효과를 조금 높이지만 월 10일 이상이면 약물과용두통 기준에 들어가요.","options":["acetaminophen","geworin","penzal"],"pick":"acetaminophen","optional":true},{"slot":"처방","title":"편두통이 잦으면 — 트립탄·예방약(처방)","why":"한 달에 두통이 4일 이상이거나 진통제로 안 잡히는 편두통은 트립탄(급성)과 예방약이 있어요. 진료가 답이에요.","options":[],"otc":false}],"how":["두통이 시작될 때 이부프로펜 400 mg(또는 타이레놀 2알)을 물과 함께 드세요. 참다가 드시면 효과가 떨어져요.","1시간이 지나도 그대로면 계열이 다른 약을 더하세요. 이부프로펜을 드셨다면 타이레놀을 더하는 식이에요.","물을 두 컵 드시고 어두운 곳에서 20분만 쉬어 보세요. 물 부족, 잠 부족, 커피를 거른 것이 흔한 원인이에요.","한 달에 10일 넘게 진통제를 드시고 계시다면 약을 늘리지 말고 병원에 가 보세요."],"pharmacy":["약사님께 이렇게 말씀하세요. “긴장성 두통(또는 편두통 같은 두통)이에요. 이부프로펜하고 아세트아미노펜 주세요.”","한 달에 며칠이나 진통제를 드시는지 말씀하시면 약사님이 약 때문에 생기는 두통을 걸러 드려요."],"selfcare":["잠자는 시간, 식사 시간, 커피 양을 매일 비슷하게 유지해 주세요. 커피를 갑자기 끊어도 두통이 와요.","목과 어깨를 자주 풀어 주시고, TV·휴대폰 화면은 눈높이에 두세요.","편두통이 있으시면 언제 아팠는지, 잠·생리·특정 음식·스트레스와 관계가 있는지 간단히 적어 두세요. 진료 때 큰 도움이 돼요."],"avoid":["카페인이 든 복합진통제(게보린·펜잘 등)를 습관처럼 매일 드시지 마세요.","술 마신 다음 날 두통에 아세트아미노펜(타이레놀)을 많이 드시면 간에 부담이 돼요. 물과 휴식이 먼저이고, 필요하면 식사 후 이부프로펜을 조금만.","‘한 알로 안 들어서’ 같은 약을 두 배로 드시지 마세요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["처음부터 충분한 양으로, 두 계열(아세트아미노펜 + 소염제)을 함께 드셔 보셨나요? 커피 한 잔이 효과를 높여 주기도 해요(습관이 되면 안 돼요).","속이 울렁거리고, 빛이 싫고, 한쪽이 욱신거리면 편두통일 가능성이 커요. 트립탄이라는 처방약으로 바꾸면 삶이 달라지는 분이 많아요.","한 달에 15일 넘게 두통이 있고 진통제를 10~15일 넘게 드신다면 ‘약물과용두통’이에요. 약을 줄여야 낫고, 이 과정은 의사와 함께하셔야 해요.","아래 ‘병원·응급실’ 신호 중 하나라도 있으면 약 대신 바로 진료를 받으세요."]},"care":{"pharmacy":["평소와 비슷한 양상의 긴장성 두통·편두통","수면 부족·스트레스·과음 뒤 두통, 진통제에 반응"],"clinic":["한 달에 두통 4일 이상 또는 진통제 10일 이상","50세 이후 처음 생긴 두통","두통 양상이 평소와 달라지고 점점 심해짐","기침·힘주기·운동으로 유발되는 두통","임신 중 새로 생긴 두통","암·HIV·면역저하 병력"],"er":["몇 초~1분 안에 최고조에 이르는 벼락 두통","열·목 뻣뻣함·의식 저하·혼란 동반","팔다리 마비·말 어눌함·시야 장애·경련","머리 부딪힌 뒤 심해지는 두통·구토","눈 통증 + 충혈 + 시력 저하(급성 녹내장)"]},"faq":[{"q":"게보린이 두통에 제일 잘 듣지 않나요?","a":"빠르긴 하지만 근거상 아세트아미노펜 + 이부프로펜 조합이 더 강하고, 게보린은 15세 미만 금지·장기 복용 금지가 붙어 있어요. 가끔은 괜찮지만 상비약으론 단일제 두 가지가 낫습니다."}],"sources":["snnoop10","ichd3","moore2015otc","derry2013combo","mfds_geworin"]},{"id":"toothache","group":"통증","icon":"cross","name":"치통·발치 후 통증","short":"치과 가기 전까지 버티기","tags":["이","잇몸","치과","사랑니","치통","발치"],"lead":"치통의 진짜 치료는 치과지만, 예약까지 버티는 데는 **이부프로펜 400 mg + 아세트아미노펜 1,000 mg 조합**이 가장 근거가 강해요 — 사랑니 발치 통증 코크란에서 이 조합이 각각 단독보다 낫고, 응급실 연구에선 마약성 진통제와 같은 효과였어요.","planTitle":"치과 통증 처방 뼈대","planLabel":"치과에서도 이렇게 처방해요","plan":[{"slot":"소염","title":"이부프로펜 400 mg","why":"치통·발치 후 통증은 염증 통증이라 소염제가 핵심. 이부프로펜 400 mg이 아세트아미노펜 1,000 mg보다 우월(코크란 RR 1.47).","options":["ibuprofen","dexibuprofen","naproxen"],"pick":"ibuprofen"},{"slot":"진통","title":"+ 아세트아미노펜 1,000 mg","why":"함께 먹으면 6시간 진통 성공률 73%(단독 52%). 치과 처방의 표준 조합.","options":["acetaminophen"],"pick":"acetaminophen"},{"slot":"처방","title":"감염이면 — 항생제(처방)","why":"잇몸이 붓고 고름·열이 있으면 진통제로는 안 되고 치과에서 항생제·배농이 필요해요.","options":[],"otc":false}],"how":["식사 후에 이부프로펜 400 mg과 타이레놀 2알을 **같이** 드세요. 6시간마다 반복하셔도 돼요.","이를 뺀 뒤에는 마취가 풀리기 **전에** 첫 회를 드셔 두면 통증 고비를 넘기기 쉬워요.","찬물을 입에 머금으면 신경 통증이 가라앉고, 얼굴 바깥쪽에 20분 냉찜질도 도움이 돼요."],"pharmacy":["약사님께 이렇게 말씀하세요. “치통이에요. 이부프로펜하고 아세트아미노펜 주세요.”","이를 뺀 뒤 피가 나면 피 묽게 하는 약을 드시는지 꼭 말씀해 주세요."],"selfcare":["따뜻한 소금물로 살살 헹궈 주세요(이를 뺐다면 24시간 지난 뒤부터).","딱딱하거나 뜨거운 음식은 며칠 피해 주세요.","이를 뺀 자리는 빨대를 쓰지 마세요. 피딱지가 떨어져 더 아파져요(드라이소켓)."],"avoid":["아스피린을 잇몸에 직접 대지 마세요. 잇몸이 화학 화상을 입어요.","소염제를 두 가지 겹쳐 드시지 마세요.","이를 뺀 뒤 24시간은 담배·술·빨대를 피해 주세요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["소염제와 아세트아미노펜을 **함께** 드시고 계신가요? 치통은 한 가지 약으로는 부족한 통증이에요.","붓거나, 열이 나거나, 입이 잘 안 벌어지면 염증이 퍼지는 신호예요. 그날 바로 치과에 가세요.","이를 뺀 지 3~4일 뒤에 오히려 더 아파지면 드라이소켓이에요. 치과에 다시 가시면 금방 편해져요."]},"care":{"pharmacy":["치과 예약까지 1~3일 버티기","발치 후 예상 범위의 통증"],"clinic":["볼·잇몸 부종, 고름, 열","3일 이상 진통제로 조절 안 됨","발치 후 통증이 3~4일째 더 심해짐"],"er":["부종이 눈·목으로 번지고 삼키기·숨쉬기 어려움","고열 + 입을 못 벌림"]},"faq":[],"sources":["bailey2013","derry2013combo","chang2017"]},{"id":"sorethroat","group":"통증","icon":"cough","name":"목 아픔·인후통","short":"침 삼킬 때 아플 때","tags":["목","편도","인후","삼킴","인후통"],"lead":"인후통 대부분은 바이러스라 항생제가 필요 없고, **통증 조절**이 치료예요. 녹여 먹는 소염제 트로키(플루르비프로펜)는 11분 만에 첫 완화가 보고됐고, 먹는 아세트아미노펜·이부프로펜도 잘 들어요. 3일 넘게 심하거나 열·편도 고름이 있으면 진료.","planTitle":"인후통 조합","planLabel":"국소 + 전신, 둘 중 하나로 충분한 경우가 많아요","plan":[{"slot":"국소","title":"플루르비프로펜 트로키(스트렙실)","why":"목에 직접 닿는 소염제. 삼킴 통증·부종을 7일간 유의하게 줄였어요. 하루 5개, 3일 이내.","options":["flurbiprofen"],"pick":"flurbiprofen"},{"slot":"전신","title":"아세트아미노펜 또는 이부프로펜","why":"열·몸살이 함께 있으면 먹는 약으로. 트로키도 소염제라 이부프로펜과 겹치면 NSAID 총량을 생각해요 — 그럴 땐 아세트아미노펜.","options":["acetaminophen","ibuprofen"],"pick":"acetaminophen","optional":true},{"slot":"처방","title":"세균 편도염이면 — 항생제(처방)","why":"고열 + 편도 흰 고름 + 기침 없음 + 턱밑 림프절이면 세균성(연쇄상구균) 가능 — 검사·항생제는 진료에서.","options":[],"otc":false}],"how":["트로키(목 사탕) 1개를 3~6시간마다 천천히 녹여 드세요. 씹지 마시고요. 하루 5개까지, 3일 안으로만요.","열이나 몸살이 있으면 타이레놀 1~2알을 6시간마다 드세요.","따뜻한 물과 꿀차, 가습, 소금물 가글이 도움이 돼요."],"pharmacy":["약사님께 이렇게 말씀하세요. “목이 아프고 삼킬 때 아파요. 소염제 트로키 주세요.”","천식, 위궤양, 임신 여부를 말씀해 주세요. 트로키에도 소염제 성분이 들어 있어요."],"selfcare":["꿀 한 숟갈이 목 자극과 기침을 달래 줘요(돌 지난 아이부터).","목소리를 아끼시고, 담배 연기는 피해 주세요.","물을 조금씩 자주 드세요. 따뜻한 차도 좋아요."],"avoid":["목 사탕(트로키)에 이부프로펜, 게보린까지 겹쳐 드시지 마세요. 소염제가 중복돼요.","집에 남은 항생제를 임의로 드시지 마세요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["3일이 지나도 삼키기 힘들 정도라면 병원에서 편도염·인두염 검사를 받아 보세요.","한쪽만 심하게 붓고 입이 잘 안 벌어지면 편도 옆에 고름이 찬 것일 수 있어요. 그날 바로 진료를 받으세요."]},"care":{"pharmacy":["콧물·기침과 함께 오는 목 아픔(감기)","3일 이내, 열이 없거나 미열"],"clinic":["38.5도 이상 고열 + 편도 흰 고름","3일 넘게 심한 통증","귀 통증·턱밑 림프절 부종","발진 동반"],"er":["침을 삼킬 수 없어 흘림, 숨쉬기 힘듦, 목소리가 먹먹함(후두개염·농양)","입을 못 벌림 + 한쪽 심한 부종"]},"faq":[],"sources":["flurbi2018","mfds_strepsils"]},{"id":"cold","group":"감기·호흡기","icon":"temp","name":"감기 (콧물·기침·몸살)","short":"종합감기약이 답이 아닌 이유","tags":["감기","몸살","오한","코감기","독감","콧물","기침"],"lead":"감기는 약이 낫게 하는 게 아니라 7~10일 지나며 저절로 낫고, 약은 그동안 덜 힘들게 하는 도구예요. 진료실에서 감기약을 처방할 때는 **주 증상에 맞는 성분만** 골라요 — 콧물엔 항히스타민, 코막힘엔 충혈완화제, 몸살엔 해열진통제. 종합감기약은 편하지만 필요 없는 성분까지 먹게 되고, 타이레놀과 아세트아미노펜이 겹치기 쉬워요.","planTitle":"증상별로 고르는 감기약","planLabel":"해당하는 칸만 — 셋 다면 종합감기약도 괜찮아요","plan":[{"slot":"몸살","title":"열·몸살 — 아세트아미노펜 / 이부프로펜","why":"감기 몸살·발열의 기본. 편의점 타이레놀로 충분해요.","options":["acetaminophen","ibuprofen"],"pick":"acetaminophen"},{"slot":"콧물","title":"콧물·재채기 — 항히스타민","why":"밤엔 졸린 1세대(감기약 속 클로르페니라민)도 괜찮고, 낮엔 로라타딘·펙소페나딘.","options":["loratadine","fexofenadine","cetirizine","chlorpheniramine"],"pick":"loratadine","optional":true},{"slot":"코막힘","title":"코막힘 — 슈도에페드린 / 비강 분무","why":"막힘엔 항히스타민이 아니라 충혈완화제. 고혈압이면 먹는 약 대신 오트리빈 3일.","options":["pseudoephedrine","xylometazoline","coldaewon"],"pick":"xylometazoline","optional":true},{"slot":"기침","title":"기침·가래 — 필요할 때만","why":"마른기침이 잠을 방해하면 덱스트로메토르판, 가래는 구아이페네신 + 물. 일반 기침약 근거는 약해요(코크란).","options":["dextromethorphan","guaifenesin","coldaewon"],"pick":"guaifenesin","optional":true},{"slot":"종합","title":"다 있으면 — 종합감기약 하나","why":"판콜·판피린·테라플루·콜대원 등. 단, 타이레놀을 따로 더하지 말 것(아세트아미노펜 300~650 mg 포함).","options":["pancol-a","panpyrin-t","theraflu","coldaewon","tylenol-cold"],"pick":"pancol-a","optional":true}],"how":["**낮**에는 타이레놀만, 콧물이 있으면 로라타딘(졸리지 않는 알레르기약)을 더하세요. 코가 막히면 코에 뿌리는 약을 한 번만요.","**밤**에는 종합감기약 1회분을 드세요. 졸린 성분이 잠에 도움이 돼요. 이때는 타이레놀을 빼셔야 겹치지 않아요.","물을 하루 2 L 드시고, 방을 촉촉하게, 잠을 푹 주무세요. 38.5도 넘는 열이 3일 넘게 가면 병원에 가세요."],"pharmacy":["약사님께 주 증상을 말씀하세요. “콧물만 나요 / 코가 막혀요 / 몸살만 있어요” 하시면 거기에 맞는 성분만 골라 드려요.","혈압이 높거나, 전립선·녹내장이 있거나, 임신 중이거나, 65세가 넘으셨다면 꼭 말씀해 주세요. 코막힘약과 항히스타민이 조심해야 할 약이에요."],"selfcare":["따뜻한 물과 꿀차(돌 지난 아이부터)를 자주 드시고, 방 안을 촉촉하게 해 주세요.","코가 막히고 콧물이 나면 식염수로 코를 씻어 주세요. 효과가 확인된 방법이에요.","푹 쉬세요. 감기는 결국 내 몸의 면역이 낫게 해요."],"avoid":["종합감기약에 타이레놀, 게보린까지 드시면 아세트아미노펜이 세 번 겹쳐요. 하나만 고르세요.","종합감기약에 수면유도제나 멀미약을 겹치면 졸리는 성분(항히스타민)이 중복돼요.","감기에 항생제는 듣지 않아요. 감기는 바이러스예요.","두 돌 미만 아기에게는 감기약을 쓰지 마세요. 효과는 없고 위험만 있어요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["감기는 보통 7~10일은 가요. 약은 그동안 덜 힘들게 해 주는 것이지 감기를 끝내 주는 건 아니에요.","38.5도 넘는 열이 3일 넘게 가거나, 증상이 열흘을 넘기거나, 나아지다가 다시 심해지면 병원에 가 보세요.","숨이 차거나 가슴이 아프거나, 누런 가래에 높은 열이 함께 있으면 폐렴이나 독감일 수 있어요. 미루지 마세요."]},"care":{"pharmacy":["콧물·재채기·미열·몸살, 3일 이내","식욕·활동이 유지됨"],"clinic":["38.5도 이상 열이 3일 이상","10일 넘게 지속되거나 좋아지다 다시 악화","귀 통증, 얼굴 통증(부비동염), 누런 가래 + 열","독감 유행기 고열·근육통(48시간 내 항바이러스제)","천식·COPD·당뇨·임신·65세 이상·영유아의 감기"],"er":["숨이 차고 입술이 파래짐","의식 혼미, 경련","가슴 통증, 피 섞인 가래"]},"faq":[{"q":"판콜과 타이레놀을 같이 먹어도 되나요?","a":"판콜에이 1병에 아세트아미노펜 300 mg이 이미 들어 있어요. 같이 먹으면 총량이 늘어 하루 4 g을 넘길 수 있으니, 같은 시간대엔 하나만."}],"sources":["desutter2022","cough2014","salerno2005","galen2010","mfds_pancol","fda_apap"]},{"id":"fever","group":"감기·호흡기","icon":"temp","name":"열이 날 때","short":"성인·소아 해열제 고르기","tags":["열","발열","해열","오한","아이","해열제"],"lead":"열 자체는 병이 아니라 몸의 반응이라, 해열제는 **힘들 때 편하게 해 주는 ‘증상 조절’**이지 원인 치료가 아니에요. 열이 내렸다고 나은 게 아니니, **3일 넘게 계속되거나 내렸다 다시 오르면** 약을 더 사지 말고 원인을 확인하러 가세요. 성인은 아세트아미노펜 또는 이부프로펜 한 가지, 아이는 체중 기준 용량이 전부예요.","planTitle":"해열제 고르기","planLabel":"한 가지로 시작, 교차는 필요할 때만","plan":[{"slot":"성인","title":"아세트아미노펜 500~1,000 mg","why":"위장·심장 부담 없이 1차. 몸살 통증이 심하면 이부프로펜 400 mg도 좋아요.","options":["acetaminophen","ibuprofen"],"pick":"acetaminophen"},{"slot":"소아","title":"체중 기준 — 아세트아미노펜 10~15 mg/kg / 이부프로펜 5~10 mg/kg","why":"나이보다 **체중**으로 계산해요. 아세트아미노펜은 4~6시간 간격 하루 5회 이하(생후 4개월↑), 이부프로펜은 6~8시간 간격(생후 6개월↑, 탈수 시 피함).","options":["acetaminophen","ibuprofen","dexibuprofen"],"pick":"acetaminophen"},{"slot":"교차","title":"한 가지로 안 떨어지면 — 교차 복용","why":"아세트아미노펜 먹고 2~3시간 뒤에도 힘들어하면 이부프로펜을 사이에. 각각의 간격은 지키고, 기록해 두세요.","options":[],"optional":true}],"how":["어른은 타이레놀 1~2알을 4~6시간마다 드세요. 하루 8알(4 g)을 넘기지 마세요.","아이(예: 10 kg)는 어린이 타이레놀 시럽(160 mg/5 mL)을 한 번에 3~4.5 mL, 4~6시간마다 먹여요. 아이 몸무게로 계산하는 소아 용량 계산기를 써 보세요.","옷은 얇게 입히고 미지근한 물수건으로 닦아 주세요. 찬물이나 알코올로 닦으면 안 돼요.","물이나 이온음료를 자주 드세요."],"pharmacy":["아이 몸무게를 말씀하시면 약사님이 mL 단위로 양을 계산해 드려요.","이미 먹인 약이 있으면 말씀해 주세요. 감기약 속에도 해열제 성분이 들어 있어요."],"selfcare":["물을 자주 드시고, 푹 쉬고, 옷은 얇게 입혀 주세요.","몇 시에 몇 도였는지, 약을 언제 먹였는지 적어 두세요. 진료 때 가장 큰 도움이 돼요."],"avoid":["15세 미만 아이에게 아스피린·게보린·펜잘은 안 돼요(라이증후군 위험).","감기 시럽에 해열제를 따로 더 먹이면 아세트아미노펜이 겹쳐요.","생후 6개월 미만 아기, 그리고 토하거나 설사해서 탈수된 상태에서는 이부프로펜을 쓰지 마세요.","찬물 목욕이나 알코올 마사지는 하지 마세요. 오히려 떨게 만들어요."],"notWorking":{"title":"약을 먹어도 열이 잘 안 내리면","steps":["해열제는 1~1.5도 정도만 내려 줘요. 숫자가 다 내려가지 않아도, 아이가 놀고 물을 마시면 괜찮은 거예요.","몸무게에 맞는 양인지 다시 한 번 계산해 보세요(소아 용량 계산기).","열이 3일을 넘거나, 열과 함께 아래 ‘병원·응급실’ 신호가 있으면 진료를 받으세요."]},"care":{"pharmacy":["감기 동반 38~39도, 3일 이내, 물 잘 마시고 활동함"],"clinic":["3일 이상 지속되는 열","생후 3~6개월 영아의 38도 이상","귀·목·소변 통증 동반","발진 동반","만성질환자·65세 이상·임신 중"],"er":["생후 3개월 미만의 38도 이상","경련, 의식 저하, 축 처짐","목 뻣뻣함·심한 두통·눌러도 안 없어지는 자반","숨 가쁨·입술 청색","40도 이상 + 해열제 무반응"]},"faq":[{"q":"교차 복용은 꼭 해야 하나요?","a":"필수는 아니에요. 한 가지로 편해지면 그걸로. 교차는 헷갈려서 과량 사고가 나기 쉬우니 시간·약을 꼭 적어 두세요."}],"sources":["aap_fever","mfds_tylenol","glasgow2006","fda_apap"]},{"id":"cough","group":"감기·호흡기","icon":"cough","name":"기침·가래","short":"마른기침과 가래기침은 약이 다르다","tags":["기침","가래","진해","거담"],"lead":"기침은 기도를 청소하는 반사라 **가래가 있으면 막지 말고 묽게**, **마른기침이 잠을 방해할 때만 눌러요**. 코크란 종합에서 일반 기침약의 효과 근거는 약했고, 꿀·수분·가습이 비슷한 역할을 해요. 3주 넘는 기침은 감기가 아닐 수 있어요.","planTitle":"기침 유형별","planLabel":"가래 유무가 갈림길","plan":[{"slot":"가래","title":"가래 기침 — 거담제 + 물","why":"구아이페네신(감기약 속) 또는 아세틸시스테인. 물 2 L가 약만큼 중요해요.","options":["guaifenesin","coldaewon"],"pick":"guaifenesin"},{"slot":"마른","title":"마른기침 — 밤에만 진해제","why":"덱스트로메토르판. 가래 기침엔 쓰지 않아요(배출 방해).","options":["dextromethorphan","tylenol-cold"],"pick":"dextromethorphan","optional":true},{"slot":"처방","title":"3주 이상·쌕쌕 — 진료","why":"후비루·역류·천식·감염후기침 감별과 흡입제·처방 진해제.","options":[],"otc":false}],"how":["**가래 기침**이면 물을 자주 드시고, 방을 촉촉하게, 구아이페네신이 든 감기약을 하루 3번 드세요.","**마른기침**이면 주무시기 전에 덱스트로메토르판 1회분과 꿀 한 숟갈(돌 지난 아이부터)을 드세요.","콧물이 목 뒤로 넘어가서 나는 기침이면 알레르기약과 식염수 코 세척이 더 맞아요."],"pharmacy":["약사님께 “가래가 있어요” 또는 “마른기침이에요”라고 구분해서 말씀하세요.","우울증약(SSRI)을 드시고 계시면 덱스트로메토르판과 겹칠 수 있으니 꼭 말씀해 주세요."],"selfcare":["꿀(돌 지난 아이부터), 따뜻한 물, 가습이 기침을 달래 줘요.","담배는 끊으시고, 담배 연기 곁에도 가지 마세요.","잘 때 베개를 조금 높이면 콧물이 넘어가거나 위산이 올라와 생기는 기침이 줄어요."],"avoid":["가래 기침에 기침을 멈추는 약(진해제)은 쓰지 마세요. 가래는 뱉어내야 해요.","돌 안 된 아기에게 꿀은 안 돼요.","네 돌 미만 아이에게 일반 기침약은 권하지 않아요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["감기 뒤 기침은 3주까지 갈 수 있어요. 너무 걱정하지 마세요.","3주가 넘거나, 밤에 쌕쌕거리고 숨이 차거나, 피 섞인 가래, 체중 감소·식은땀이 있으면 병원에 가세요. 천식·역류·결핵·폐렴을 확인해야 해요."]},"care":{"pharmacy":["감기와 함께 온 3주 이내 기침","열 없음 또는 미열, 숨참 없음"],"clinic":["3주 이상 기침","누런 가래 + 열, 가슴 통증","쌕쌕거림·밤 기침(천식 의심)","체중 감소·식은땀·피 섞인 가래","혈압약(ACE억제제) 복용 후 시작된 마른기침"],"er":["숨이 차서 말이 끊김, 입술 청색","다량 객혈","갑작스런 가슴 통증 + 호흡곤란"]},"faq":[],"sources":["cough2014","desutter2022"]},{"id":"rhinitis","group":"감기·호흡기","icon":"nose","name":"코막힘·콧물·재채기","short":"감기인지 알레르기인지","tags":["코","비염","알레르기","재채기","코막힘","콧물"],"lead":"맑은 콧물·재채기·눈 가려움이 매년 같은 계절에 반복되면 알레르기 비염, 열·몸살과 함께 며칠이면 감기예요. 알레르기 비염의 1차 치료는 항히스타민제가 아니라 **스테로이드 비강분무제(처방)**이고, 약국 항히스타민제는 콧물·재채기엔 좋지만 **코막힘엔 약해요**.","planTitle":"코 증상별","planLabel":"콧물엔 항히스타민, 막힘엔 충혈완화제","plan":[{"slot":"콧물","title":"콧물·재채기 — 2세대 항히스타민","why":"낮엔 로라타딘·펙소페나딘(졸음 거의 없음), 효과 우선이면 세티리진(취침 전).","options":["loratadine","fexofenadine","cetirizine"],"pick":"loratadine"},{"slot":"막힘","title":"코막힘 — 비강 분무 3일 / 슈도에페드린","why":"오트리빈은 5분 안에 뚫리지만 3일 이상 쓰면 반동성 비염. 먹는 슈도에페드린은 고혈압·전립선·불면 주의.","options":["xylometazoline","pseudoephedrine","coldaewon"],"pick":"xylometazoline","optional":true},{"slot":"처방","title":"지속 비염 — 스테로이드 비강분무(처방)","why":"코막힘·콧물·재채기를 모두 줄이는 1차 치료(2020 지침). 매일 써야 효과가 나요.","options":["mometasone"],"otc":false}],"how":["알레르기 철에는 로라타딘 10 mg을 아침에 한 번(또는 세티리진을 주무시기 전에) 드세요. 철이 시작되기 전부터 미리 드시면 더 잘 들어요.","코막힘이 심한 밤에는 코에 뿌리는 약을 양쪽 한 번씩, 3일만 쓰세요.","식염수로 코를 하루 1~2번 씻어 주세요."],"pharmacy":["약사님께 “콧물·재채기가 주예요” 또는 “코막힘이 주예요”라고 말씀하세요.","혈압, 전립선, 녹내장, 임신, 운전 여부를 말씀해 주세요."],"selfcare":["식염수로 코를 씻고, 이불은 자주 빨아 주세요. 꽃가루 철에는 창문을 닫고 공기청정기를 켜 두세요.","방 안 습도는 40~50%가 좋아요."],"avoid":["코에 뿌리는 약(오트리빈 등)을 3일 넘게 쓰면 약 때문에 코가 더 막혀요.","감기약과 알레르기약을 같이 드시면 항히스타민이 겹쳐요.","혈압이 높으시면 슈도에페드린(코막힘약)을 오래 드시지 마세요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["알레르기약(항히스타민제)으로 코막힘이 안 풀리는 건 자연스러운 일이에요. 코에 뿌리는 스테로이드 처방약이 답이에요.","한쪽만 막히면서 피나 냄새가 나거나, 얼굴이 아프고 누런 콧물이 열흘 넘게 가면 부비동염 등 다른 원인을 확인해야 해요."]},"care":{"pharmacy":["맑은 콧물·재채기·가려움, 계절성","감기 동반 코 증상 1주 이내"],"clinic":["매년 반복되는 비염(처방 분무제·검사)","10일 넘는 누런 콧물 + 얼굴 통증·열(부비동염)","한쪽만 막힘·코피·냄새","소아의 코골이·입 벌리고 자기"],"er":["얼굴·눈 주위 심한 부종 + 고열(안와 봉와직염)","심한 두통 + 목 뻣뻣함"]},"faq":[],"sources":["dykewicz2020","mann2000","mfds_otrivin","salerno2005"]},{"id":"heartburn","group":"소화기","icon":"stomach","name":"속쓰림·신물 역류","short":"제산제·위산억제제 차이","tags":["속쓰림","역류","위산","가슴쓰림","신물","식도염"],"lead":"**지금 당장** 끄려면 제산제(몇 분, 1~2시간), **밤에 미리 막으려면** 파모티딘(1시간, 10~12시간). 신물이 올라오는 역류엔 알긴산(개비스콘)이 물리적으로 막아 줘요. 국내에서 PPI는 처방약이라, 2주 넘게 약이 필요하면 진료가 정답이에요.","planTitle":"속쓰림 약 고르기","planLabel":"지금 vs 예방 vs 역류","plan":[{"slot":"지금","title":"당장 — 제산제","why":"알마겔·겔포스: 5~15분 안에 중화. 다른 약과 2시간 띄우기.","options":["almagate","aluminium-phosphate"],"pick":"almagate"},{"slot":"역류","title":"신물 역류 — 알긴산","why":"위 위에 젤 층을 만들어 식후·누웠을 때 역류를 막아요.","options":["alginate"],"pick":"alginate","optional":true},{"slot":"예방","title":"예방·유지 — 파모티딘","why":"밤 속쓰림, 소염제 복용 중 위보호. 14일 이내.","options":["famotidine"],"pick":"famotidine","optional":true},{"slot":"처방","title":"2주 넘으면 — PPI(처방)","why":"역류성 식도염·궤양은 PPI 4~8주 요법. 내시경 검사도.","options":["omeprazole"],"otc":false}],"how":["식후에 속이 쓰리면 제산제 1포를, 신물이 올라오면 개비스콘 10~20 mL를 식후와 주무시기 전에 드세요.","밤마다 쓰리면 파모티딘 10 mg을 저녁 식후에 드세요.","주무시기 3시간 전에는 식사를 끝내시고, 머리 쪽을 10~15 cm 높여 주무세요."],"pharmacy":["약사님께 “식후에 쓰려요” 또는 “밤에 신물이 올라와요”라고 구분해서 말씀하세요.","드시고 있는 약(소염제·항생제·갑상선약)을 말씀해 주세요. 제산제와 시간을 띄워야 하는 약이 있어요."],"selfcare":["야식·과식·기름진 음식·술·커피·탄산을 줄여 주세요. 이것만으로도 절반은 좋아져요.","배를 조이는 옷은 피하시고, 체중을 조금 줄이면 큰 도움이 돼요.","담배는 끊으세요."],"avoid":["소염제나 아스피린을 빈속에 드시지 마세요.","제산제(겔포스 등)를 매일 오래 드시면 콩팥과 전해질에 부담이 돼요.","2주 넘게 약으로만 버티지 마세요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["2주 넘게 약이 필요하면 병원에 가세요. 위산 억제제(PPI) 처방과 내시경으로 원인을 확인해요.","삼키기 힘들거나, 체중이 줄거나, 변이 검거나, 피를 토하거나, 빈혈이 있으면 미루지 말고 바로 진료를 받으세요."]},"care":{"pharmacy":["식후·야식 뒤 속쓰림, 2주 이내","약에 반응함"],"clinic":["2주 이상 지속·재발","55세 이후 새로 생긴 증상","삼킬 때 걸림·통증, 체중 감소, 빈혈","소염제·아스피린 장기 복용 중 속쓰림"],"er":["검은 변, 피 토함","가슴 통증이 조이듯·식은땀·왼팔 저림(심장 감별)","심한 복통 + 배가 딱딱함"]},"faq":[{"q":"가슴이 쓰린데 심장 문제일 수도 있나요?","a":"역류 통증은 눕거나 식후에 심하고 제산제에 반응해요. 운동할 때 조이는 통증·식은땀·숨참이면 심장 문제일 수 있으니 응급실."}],"sources":["rostom2002","mfds_famotidine","mfds_gaviscon","fda_ppi","ppi_otc"]},{"id":"dyspepsia","group":"소화기","icon":"stomach","name":"체함·더부룩·소화불량","short":"소화제가 듣는 경우와 아닌 경우","tags":["체함","더부룩","소화","명치","가스","소화불량"],"lead":"과식·기름진 음식 뒤 더부룩함엔 소화효소제(훼스탈·베아제)가 맞고, 명치가 쓰리거나 아프면 위산 쪽(제산제·파모티딘)이에요. 편의점 소화제로 며칠 버텨도 안 낫는 명치 통증은 위염·궤양·담낭·심장까지 감별이 필요해요.","planTitle":"소화불량 약 고르기","planLabel":"더부룩 vs 쓰림","plan":[{"slot":"효소","title":"과식 후 더부룩 — 소화효소제","why":"편의점 훼스탈·베아제. 식후 1~2정.","options":["digestive-enzyme"],"pick":"digestive-enzyme"},{"slot":"가스","title":"가스·트림 — 시메티콘","why":"거품을 터뜨려 배출. 흡수 안 돼 안전.","options":["simethicone"],"pick":"simethicone","optional":true},{"slot":"쓰림","title":"명치 쓰림 — 제산제·파모티딘","why":"위산 증상이면 소화제로는 안 돼요.","options":["almagate","famotidine"],"pick":"almagate","optional":true},{"slot":"처방","title":"반복되면 — 위장운동촉진제·검사(처방)","why":"기능성 소화불량은 처방약과 헬리코박터 검사로.","options":[],"otc":false}],"how":["식사 후 소화제 1~2알을 따뜻한 물과 드시고, 10분만 가볍게 걸어 보세요.","명치가 쓰리면 제산제로 바꿔 보시고, 자꾸 반복되면 파모티딘을 드세요."],"pharmacy":["약사님께 “더부룩해요” 또는 “명치가 쓰려요”라고 구분해서 말씀하세요."],"selfcare":["천천히, 조금씩 드시고, 식사 후 바로 눕지 마세요.","탄산·기름진 음식·술을 줄여 주세요."],"avoid":["‘체했다’고 손을 따거나 억지로 토하지 마세요. 도움이 안 되고 다칠 수 있어요.","명치가 아프다고 진통제(소염제)로 버티지 마세요. 위를 더 상하게 해요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["1~2주 넘게 반복되면 병원에서 위염·궤양·헬리코박터·담낭을 확인해 보세요.","체중이 줄거나, 변이 검거나, 삼키기 힘들거나, 55세 넘어 처음 생긴 소화불량이면 꼭 진료를 받으세요."]},"care":{"pharmacy":["과식 뒤 더부룩함, 하루이틀"],"clinic":["2주 이상 반복","체중 감소·빈혈·검은 변","오른쪽 윗배 통증 + 기름진 음식 후 악화(담낭)","55세 이후 새로 생김"],"er":["명치 통증 + 식은땀·숨참·왼팔 저림(심근경색)","배가 딱딱하고 눌렀다 뗄 때 더 아픔","피 토함·검은 변"]},"faq":[],"sources":["mohw_safestad"]},{"id":"diarrhea","group":"소화기","icon":"drop","name":"설사","short":"지사제를 쓰면 안 되는 설사","tags":["설사","배탈","장염","물변"],"lead":"급성 설사의 치료는 약이 아니라 **물 + 전해질**이에요. 지사제(로페라마이드)는 열·혈변이 없는 물설사에서 ‘꼭 멈춰야 할 때’만 2일 이내로, **열·혈변·점액이 있으면 금기**예요(세균을 가둬요). 6세 미만 소아에게는 쓰지 않아요.","planTitle":"설사 대처","planLabel":"수분 보충이 1순위, 약은 조건부","plan":[{"slot":"수분","title":"경구수액(ORS) — 진짜 치료","why":"약국 경구수액제 또는 물 + 소금·설탕. 이온음료는 물로 반 희석.","options":[],"pick":""},{"slot":"지사","title":"조건부 — 로페라마이드","why":"열·혈변 없는 물설사, 이동·업무 때문에 멈춰야 할 때. 첫 회 4 mg, 이후 2 mg. 2일 이내.","options":["loperamide"],"pick":"loperamide","optional":true},{"slot":"흡착","title":"보조 — 스멕타이트","why":"독소·수분 흡착. 2세 미만·임신 금지, 다른 약과 2시간 간격.","options":["smectite"],"pick":"smectite","optional":true},{"slot":"처방","title":"열·혈변·여행자 설사 — 진료(항생제)","why":"세균성·기생충 감별과 항생제는 진료에서.","options":[],"otc":false}],"how":["설사할 때마다 물 한 컵과 경구수액을 드세요. 소변 색이 옅어질 때까지요.","죽, 바나나, 흰쌀밥, 토스트처럼 부드러운 음식을 드시고, 우유·기름진 음식은 잠시 피하세요.","설사 멈추는 약(로페라마이드)은 열·혈변이 없을 때만, 2일 안으로만 드세요."],"pharmacy":["약사님께 “열이나 혈변은 없어요(있어요)”를 먼저 말씀하세요. 지사제를 드려도 되는지가 여기서 갈려요.","항생제를 드시고 계시면 꼭 말씀해 주세요. 항생제 때문에 생기는 설사일 수 있어요."],"selfcare":["물을 조금씩 자주 드세요. 약국에서 파는 경구수액(전해질 보충액)이 가장 좋아요.","손을 자주 씻어 주세요. 가족에게 옮기는 것을 막아요.","유산균(LGG·S. boulardii)은 항생제 때문에 생기는 설사 예방에 근거가 있어요."],"avoid":["열이 나거나 피가 섞인 설사에 지사제는 안 돼요. 균을 몸에 가두게 돼요.","영유아에게 지사제는 쓰지 마세요.","탈수 상태에서 소염제를 드시면 콩팥이 상해요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["이틀 넘게 계속되거나, 하루 6번 넘게 가거나, 소변이 줄고 어지러우면(탈수) 병원에 가세요.","피 섞인 변, 높은 열, 심한 배 통증은 바로 진료를 받으세요."]},"care":{"pharmacy":["열·혈변 없는 물설사, 2일 이내, 물을 마실 수 있음"],"clinic":["2일 이상 지속 또는 하루 6회 이상","38도 이상 열, 혈변·점액변","여행 후 설사, 항생제 복용 중 설사","영유아·노인·임신·만성질환자의 설사"],"er":["소변이 거의 안 나옴·어지러워 서지 못함(심한 탈수)","심한 복통 + 혈변 + 고열","영유아가 축 처지고 눈물·소변이 없음"]},"faq":[],"sources":["li2007lop","mfds_loperamide","mfds_smecta","guo2019"]},{"id":"constipation","group":"소화기","icon":"stomach","name":"변비","short":"순한 것부터 단계별로","tags":["변비","배변","대변"],"lead":"지침(AGA-ACG 2023)의 순서는 식이섬유·수분 → **삼투성 완하제(PEG·마그네슘)** → 자극성(비사코딜)은 급할 때. 마그밀은 매일 써도 습관성이 적고, 자극성 변비약은 1주 이상 매일 쓰면 장이 약에 기대요. 심한 복통·구토를 동반한 변비는 약을 먹으면 안 돼요(장폐색).","planTitle":"변비약 단계","planLabel":"순한 것부터, 급할 때만 자극성","plan":[{"slot":"1단계","title":"삼투성 — 산화마그네슘(마그밀)","why":"장에 물을 끌어들여 부드럽게. 매일 가능. 신장 나쁘면 금지.","options":["magnesium-oxide"],"pick":"magnesium-oxide"},{"slot":"급할때","title":"자극성 — 비사코딜(둘코락스)","why":"밤에 먹고 아침에. 1주 이내.","options":["bisacodyl"],"pick":"bisacodyl","optional":true},{"slot":"처방","title":"만성이면 — PEG·처방약","why":"PEG(폴리에틸렌글리콜)는 강한 권고 등급. 프루칼로프라이드 등은 처방.","options":[],"otc":false}],"how":["마그밀을 하루 2알(1 g)부터 물을 충분히 곁들여 드세요. 변이 무르면 줄이고 딱딱하면 늘리시면 돼요.","급할 때는 둘코락스 2알을 주무시기 전에 한 번만 드세요.","아침 식사 후에 화장실에 앉는 습관을 들이시고, 발판으로 무릎을 조금 높이면 훨씬 수월해요."],"pharmacy":["콩팥이 안 좋으신지(마그네슘은 안 돼요), 드시는 약(철분제·진통제·우울증약이 변비를 일으켜요)을 말씀해 주세요."],"selfcare":["채소·과일·통곡물로 섬유질을 늘리시고, 물은 하루 1.5~2 L 드세요. 섬유질만 늘리고 물이 부족하면 오히려 더 막혀요.","하루 30분 걷기가 장을 움직여 줘요.","변의가 오면 참지 말고 바로 가세요. 아침 식사 후가 가장 좋은 때예요."],"avoid":["자극성 변비약(센나·비사코딜 등)을 매일 오래 드시지 마세요. 장이 게을러져요.","배가 아프고 토하고 배가 빵빵한 변비에는 변비약을 드시지 말고 진료를 받으세요.","관장을 자주 하지 마세요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["2주 넘게 계속되거나 자꾸 재발하면 병원에 가세요. 안전한 처방약(PEG 등)을 쓰고, 변비를 일으키는 다른 약이 있는지 살펴 드려요.","50세 넘어 새로 생긴 변비가 6주 넘게 가거나, 피가 섞이거나, 체중이 줄면 대장 검사가 필요해요."]},"care":{"pharmacy":["일시적 변비(여행·식습관 변화)","복통·구토 없음"],"clinic":["2주 이상 지속","50세 이후 새로 생김, 6주 이상","혈변·체중 감소·빈혈","가늘어진 변, 변비·설사 교대"],"er":["심한 복통 + 구토 + 배 팽만 + 방귀·변이 전혀 안 나옴(장폐색)"]},"faq":[],"sources":["aga2023cic","peg2010","mfds_magmil","mfds_dulcolax"]},{"id":"motion","group":"소화기","icon":"car","name":"멀미","short":"타기 전에 미리","tags":["멀미","배","차","비행기","구토"],"lead":"멀미약은 **증상이 생긴 뒤엔 늦고**, 출발 전에 먹어야 해요. 짧은 이동은 30분~1시간 전 먹는 디멘히드리네이트, 배·장거리는 4시간 전 붙이는 키미테. 둘 다 졸리고, 운전자·7세 이하·임신·녹내장·전립선비대는 피해요.","planTitle":"멀미약 고르기","planLabel":"이동 시간으로 고르기","plan":[{"slot":"짧게","title":"1~4시간 이동 — 디멘히드리네이트","why":"출발 30~60분 전 1~2정. 코크란: 예방 효과 확인, 졸음 동반.","options":["dimenhydrinate"],"pick":"dimenhydrinate"},{"slot":"길게","title":"배·장거리 — 스코폴라민 패치","why":"출발 4시간 전 귀 뒤, 3일 지속. 붙인 뒤 손 씻기.","options":["scopolamine"],"pick":"scopolamine","optional":true}],"how":["출발하기 30~60분 전에 미리 물과 함께 드세요.","앞자리에 앉아 창밖 먼 곳을 보시고, 책이나 휴대폰은 보지 마세요. 환기도 자주요."],"pharmacy":["아이 나이(8~15세 키미테는 처방이 필요해요), 임신, 녹내장·전립선, 운전 여부를 말씀해 주세요."],"selfcare":["출발 전에 가볍게 드세요. 빈속도, 과식도 멀미를 키워요.","앞자리에 앉아 창밖 먼 곳을 보세요. 책이나 휴대폰은 보지 마세요.","생강차나 손목 지압도 해 보실 만해요(근거는 약해요)."],"avoid":["멀미약에 감기약, 수면유도제를 겹치면 졸리는 성분(항히스타민)이 중복돼요.","키미테(붙이는 멀미약)를 만진 손으로 눈을 비비지 마세요. 눈이 침침해져요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["이미 멀미가 시작됐다면 약보다 창문 열기, 눕기, 눈 감기가 나아요.","차를 타지 않았는데도 어지럽고 토하는 일이 반복되면 귀(전정기관) 검사를 받아 보세요."]},"care":{"pharmacy":["이동 중에만 생기는 메스꺼움"],"clinic":["이동과 무관한 반복 어지럼·구토","귀울림·청력 저하 동반"],"er":["갑작스런 심한 어지럼 + 말 어눌함·복시·한쪽 힘 빠짐(뇌졸중 감별)"]},"faq":[],"sources":["karrim2022","mfds_kimite","mfds_bonaring"]},{"id":"allergy","group":"알레르기·피부","icon":"leaf","name":"알레르기·두드러기·가려움","short":"졸리지 않은 항히스타민제 고르기","tags":["두드러기","가려움","알레르기","항히스타민","벌레","발진"],"lead":"두드러기·가려움·알레르기 콧물엔 2세대 항히스타민제 하루 한 알이 기본이에요. **낮엔 로라타딘·펙소페나딘, 효과 우선이면 세티리진(취침 전)**. 입술·눈이 붓거나 숨이 차면 약이 아니라 응급실이에요.","planTitle":"항히스타민제 고르기","planLabel":"졸음과 효과 사이","plan":[{"slot":"낮","title":"졸림 없이 — 로라타딘 / 펙소페나딘","why":"운전·업무 중. 펙소페나딘은 주스·제산제와 함께 먹지 않기.","options":["loratadine","fexofenadine"],"pick":"loratadine"},{"slot":"밤","title":"효과 우선 — 세티리진","why":"2세대 중 가장 강한 편, 취침 전.","options":["cetirizine"],"pick":"cetirizine","optional":true},{"slot":"국소","title":"벌레 물림·국소 가려움 — 바르는 약","why":"국소 스테로이드·항히스타민 연고(약국). 긁지 않기.","options":[],"optional":true},{"slot":"처방","title":"6주 이상·심하면 — 진료","why":"만성 두드러기는 항히스타민 증량(의사)·검사. 원인 알레르기 검사.","options":[],"otc":false}],"how":["로라타딘 10 mg을 아침에 한 번, 또는 세티리진 10 mg을 주무시기 전에 한 번 드세요. 증상이 반복되는 동안은 매일 드셔도 돼요.","가려운 곳은 냉찜질을 해 주세요."],"pharmacy":["운전이나 일을 하셔야 하는지, 콩팥·간 질환, 임신, 드시는 감기약을 말씀해 주세요."],"selfcare":["미지근한 물로 씻고 보습제를 듬뿍 바르세요. 꽉 끼는 옷은 피해 주세요.","새로 먹은 음식·약, 새로 닿은 물건을 적어 두세요. 원인을 찾는 열쇠가 돼요."],"avoid":["감기약(클로르페니라민)과 알레르기약을 같이 드시면 항히스타민이 겹쳐요.","뜨거운 물로 씻거나 긁으면 더 가려워져요."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["세티리진으로 바꾸거나 저녁에 드셔 보세요.","6주 넘게 반복되면 만성 두드러기예요. 병원에서 용량을 조절하고 검사를 받아 보세요.","입술·눈이 붓거나 숨이 답답하면 응급이에요. 바로 119에 전화하세요."]},"care":{"pharmacy":["국소 두드러기·가려움, 벌레 물림","약에 반응, 호흡 증상 없음"],"clinic":["6주 이상 반복","약 먹어도 전신 두드러기 지속","발열·관절통 동반 발진","특정 음식·약 뒤 반복"],"er":["입술·혀·눈 부종, 목 조임, 쉰 목소리","숨참·쌕쌕거림, 어지럼·실신(아나필락시스)","두드러기 + 복통·구토가 급격히"]},"faq":[],"sources":["mann2000","dykewicz2020","galen2010"]},{"id":"wound","group":"알레르기·피부","icon":"band","name":"상처·긁힘·화상","short":"연고보다 먼저 할 것","tags":["상처","긁힘","화상","베임","소독","흉터","데임"],"lead":"작은 상처의 원칙은 **흐르는 물로 씻기 → 습윤 밴드**예요. 항생제 연고(후시딘·마데카솔케어)는 고름·붉게 번짐 같은 감염 징후가 있을 때만 — 그냥 바르면 내성만 늘어요. 화상은 흐르는 찬물 10~20분이 전부이고, 얼음·치약·소주는 금지.","planTitle":"상처 처치 순서","planLabel":"약보다 세척과 보호가 먼저","plan":[{"slot":"세척","title":"흐르는 수돗물로 씻기","why":"이물·세균 제거. 과산화수소·알코올은 조직을 상하게 해 요즘은 권하지 않아요.","options":[],"pick":""},{"slot":"보호","title":"습윤 밴드 / 바세린","why":"촉촉하게 유지하면 딱지 없이 빨리·흉 적게 아물어요.","options":[],"pick":""},{"slot":"감염","title":"감염 징후 있을 때만 — 항생제 연고","why":"고름·붉게 번짐·열감·통증 증가. 후시딘과 무피로신은 동등(코크란).","options":["fusidic-acid","mupirocin"],"pick":"fusidic-acid","optional":true},{"slot":"통증","title":"아프면 — 아세트아미노펜 / 이부프로펜","why":"화상 통증엔 이부프로펜이 소염까지.","options":["acetaminophen","ibuprofen"],"pick":"ibuprofen","optional":true}],"how":["흐르는 물로 씻고, 물기를 닦고, 습윤 밴드를 붙이세요. 1~2일마다 갈아 주세요.","화상은 흐르는 찬물에 10~20분 식히고, 물집은 터뜨리지 말고, 화상 전용 드레싱을 붙이세요.","빨갛게 번지거나 고름이 나면 항생제 연고를 하루 1~2번, 1주 안으로만 바르세요."],"pharmacy":["약사님께 “감염 징후는 없어요, 습윤 밴드 주세요” 또는 “고름이 나요”라고 말씀하세요.","당뇨, 면역이 약한 병, 피 묽게 하는 약 복용 여부를 말씀해 주세요."],"selfcare":["흐르는 수돗물로 씻어내는 것이 가장 좋은 소독이에요.","파상풍 예방접종을 10년 안에 맞으셨는지 확인해 주세요. 더러운 상처나 동물에게 물렸다면 꼭이요.","아물고 나서도 햇빛을 가려 주세요. 흉터가 검게 남는 걸 막아요."],"avoid":["과산화수소·알코올·빨간약으로 매번 소독하지 마세요. 새살이 잘 안 나요.","화상에 얼음·치약·소주·감자를 대지 마세요. 흐르는 미지근한 물로 20분 식히는 것이 맞아요.","물집은 터뜨리지 마세요.","감염 없는 상처에 항생제 연고를 습관적으로 바르지 마세요."],"notWorking":{"title":"잘 낫지 않으면","steps":["2~3일 지나도 빨갛게 번지고 고름이 나거나 열이 나면 병원에 가세요. 먹는 항생제가 필요해요.","당뇨가 있거나 면역이 약하신 분은 작은 상처도 일찍 진료를 받으세요."]},"care":{"pharmacy":["얕은 긁힘·베임, 동전 크기 이하 1도 화상","출혈이 압박으로 멎음"],"clinic":["벌어진 상처(봉합 필요, 6~8시간 내)","동물·사람 교상, 녹슨 못","고름·붉게 번짐·열","손바닥 크기 이상 2도 화상, 얼굴·손·관절·생식기 화상","당뇨·면역저하자의 상처"],"er":["압박 10분에도 안 멎는 출혈","깊은 화상(하얗거나 검은 피부, 통증 없음), 전기·화학 화상, 기도 화상 의심","얼굴 큰 열상, 이물이 깊이 박힘"]},"faq":[],"sources":["koning2012","mfds_fucidin"]},{"id":"mouth","group":"알레르기·피부","icon":"cross","name":"구내염·입안 헐음","short":"바르는 약 두 종류","tags":["구내염","입안","혓바늘","헐음"],"lead":"아프타성 구내염은 1~2주면 저절로 낫고, 바르는 약은 그동안 통증을 줄여요. 순한 스테로이드 연고(오라메디)와 ‘지지는’ 알보칠 중 고르면 돼요. 입술 물집(헤르페스)·하얀 막(칸디다)엔 스테로이드가 금지라 구분이 중요해요.","planTitle":"구내염 약","planLabel":"순한 것 vs 빠른 것","plan":[{"slot":"순함","title":"오라메디(스테로이드 연고)","why":"염증 완화, 통증 덜함. 감염성엔 금지.","options":["triamcinolone"],"pick":"triamcinolone"},{"slot":"빠름","title":"알보칠(폴리크레줄렌)","why":"아프지만 빠름. 희석해 좁게.","options":["policresulen"],"pick":"policresulen","optional":true},{"slot":"통증","title":"심하면 — 이부프로펜","why":"먹기 힘들 정도면 소염제.","options":["ibuprofen","acetaminophen"],"pick":"ibuprofen","optional":true}],"how":["물기를 닦고 약을 소량 얹듯이 바르세요. 식사 후와 주무시기 전이 좋아요.","자극적인 음식과 뜨거운 것은 피하시고, 자꾸 반복되면 비타민 B군·철분이 부족하지 않은지 살펴보세요."],"pharmacy":["약사님께 “입술에 물집이에요” 또는 “입안이 헐었어요”라고 구분해서 말씀하세요. 물집(헤르페스)은 다른 약을 써요."],"selfcare":["부드러운 칫솔을 쓰시고, 자극 없는 치약(SLS 무첨가)으로 바꿔 보세요.","잠을 충분히 주무시고 스트레스를 줄이면 재발이 줄어요."],"avoid":["물집(헤르페스)이나 하얀 막(칸디다)에 스테로이드 연고를 바르지 마세요. 더 번져요.","알보칠 원액을 넓게 바르지 마세요. 아픈 곳에만 살짝."],"notWorking":{"title":"잘 낫지 않으면","steps":["2주 넘게 안 낫거나, 한 달에 한 번 넘게 재발하거나, 눈이나 생식기에도 헐면 병원에 가세요. 베체트병·영양 결핍·자가면역 질환을 확인해요."]},"care":{"pharmacy":["1~2개의 작은 궤양, 2주 이내"],"clinic":["2주 이상 지속, 자주 재발","크고 여러 개, 열·림프절 동반","눈·생식기 궤양 동반","흰 막(칸디다)·입술 물집 반복"],"er":["먹고 마시지 못해 탈수","입안 부종으로 호흡 곤란"]},"faq":[],"sources":["mfds_oramedy","mfds_albothyl"]},{"id":"insomnia","group":"수면·기타","icon":"moon","name":"잠이 안 올 때","short":"수면유도제는 며칠까지","tags":["불면","수면","잠","수면제","불면증"],"lead":"약국 수면유도제(디펜히드라민·독시라민)는 항히스타민의 졸음을 빌리는 약이라 **하루이틀용**이에요 — 며칠 지나면 내성, 다음날 멍함, 65세 이상은 섬망·낙상 위험(Beers). 3주 넘는 불면의 1차 치료는 약이 아니라 **불면증 인지행동치료(CBT-I)**이고, 멜라토닌은 국내에서 처방약이에요.","planTitle":"불면 대처","planLabel":"약은 마지막, 짧게","plan":[{"slot":"습관","title":"수면 위생 — 먼저","why":"기상 시각 고정, 카페인 오후 2시 이후 금지, 침대에선 잠만, 안 오면 나오기.","options":[],"pick":""},{"slot":"단기","title":"하루이틀 — 디펜히드라민 50 mg","why":"시차·큰 일 전날. 2주 이내, 65세 이상 회피.","options":["diphenhydramine","doxylamine"],"pick":"diphenhydramine","optional":true},{"slot":"처방","title":"3주 이상 — 진료(CBT-I·처방)","why":"만성 불면은 원인(우울·통증·수면무호흡) 감별과 CBT-I. 필요 시 처방 수면제.","options":[],"otc":false}],"how":["주무시기 30분 전에 1회분만 드세요. 다음날 운전하실 계획이 있으면 드시지 마세요.","술과 함께 드시면 절대 안 돼요."],"pharmacy":["나이(65세 이상), 녹내장·전립선, 드시는 감기약·멀미약, 임신 여부를 말씀해 주세요."],"selfcare":["아침에 햇빛을 15분 쬐시고, 낮잠은 20분 안으로.","주무시기 1시간 전에는 TV·휴대폰을 끄고, 방은 어둡고 서늘하게 해 주세요.","잠이 안 오면 누워서 애쓰지 말고 일어나 조용한 일을 하시다가 졸릴 때 다시 누우세요."],"avoid":["수면유도제와 감기약을 같이 드시면 항히스타민이 겹쳐요.","술을 수면제 삼지 마세요. 잠들긴 해도 새벽에 깨요.","수면유도제를 2주 넘게 매일 드시지 마세요."],"notWorking":{"title":"약을 먹어도 잠이 안 오면","steps":["약을 늘리지 말고 병원에 가세요. 인지행동치료(CBT-I)가 수면제보다 오래 가는 효과예요.","코를 심하게 골거나 낮에 많이 졸리면 수면무호흡 검사를 받아 보세요."]},"care":{"pharmacy":["일시적 불면(시차·스트레스), 며칠"],"clinic":["주 3일 이상, 3주 이상 지속","낮 졸림·집중 저하가 심함","코골이·숨 멈춤","우울·불안 동반"],"er":["자해 생각이 들 때 — 자살예방상담 109(24시간)"]},"faq":[{"q":"멜라토닌은 약국에서 못 사나요?","a":"국내에선 처방약(서카딘)이고 해외 직구도 금지 성분이에요. 시차엔 근거가 강하니(코크란) 필요하면 진료에서."}],"sources":["culpepper2015","beers2023","galen2010","melatonin_kr","herxheimer2002"]},{"id":"dryeye","group":"수면·기타","icon":"eye","name":"눈 건조·피로","short":"인공눈물 고르기","tags":["눈","건조","인공눈물","충혈","안구건조"],"lead":"인공눈물은 눈물층을 보충하는 ‘보습제’예요. 방부제 든 병 제품은 하루 4회 이내, 자주 넣어야 하면 무방부제 일회용으로. ‘빨간 눈 빼는 약’(혈관수축제)은 3일 넘게 쓰면 반동 충혈이 생겨요.","planTitle":"눈 건조 대처","planLabel":"횟수로 제품 고르기","plan":[{"slot":"기본","title":"인공눈물(CMC 계열)","why":"하루 4회 이내면 병 제품, 그 이상이면 무방부제 일회용.","options":["artificial-tears"],"pick":"artificial-tears"},{"slot":"처방","title":"심하면 — 히알루론산·처방 점안(진료)","why":"안구건조증 검사, 마이봄샘 치료, 처방 점안제.","options":[],"otc":false}],"how":["한 방울씩 넣고, 눈을 감고 1분 기다리세요.","일회용은 뜯은 뒤 바로 쓰고 버리세요.","화면을 20분 보셨으면 20초는 먼 곳을 보시고, 눈을 자주 깜빡여 주세요."],"pharmacy":["콘택트렌즈를 끼시는지 말씀해 주세요. 렌즈용이 따로 있어요.","충혈, 통증, 시력 저하가 있으면 인공눈물 대신 안과에 가세요."],"selfcare":["따뜻한 수건으로 눈을 5~10분 덮어 주시고, 눈꺼풀을 깨끗이 닦아 주세요.","방을 촉촉하게 하고, 선풍기·에어컨 바람이 눈에 직접 닿지 않게 해 주세요."],"avoid":["충혈 없애는 안약을 자주 쓰지 마세요. 나중엔 더 빨개져요.","일회용 인공눈물은 한 번 쓰고 버리세요."],"notWorking":{"title":"잘 낫지 않으면","steps":["2주 써도 그대로거나, 아프거나 시력이 떨어지면 안과에 가세요."]},"care":{"pharmacy":["뻑뻑함·피로, 화면 사용 후"],"clinic":["2주 이상 지속","통증·시력 저하·빛 번짐","고름 같은 분비물, 눈꺼풀 부종"],"er":["갑작스런 시력 저하·시야 결손","눈 통증 + 두통 + 구토(급성 녹내장)","화학물질 튐(흐르는 물 15분 후 응급실)"]},"faq":[],"sources":[]},{"id":"hangover","group":"수면·기타","icon":"drop","name":"숙취","short":"먹으면 안 되는 진통제","tags":["숙취","술","음주","두통","해장"],"lead":"숙취의 치료는 **물·전해질·시간**이고, 검증된 ‘숙취 해소제’는 없어요. 두통약을 고른다면 **아세트아미노펜은 술과 겹쳐 간에 부담**, 소염제는 위에 부담이라 둘 다 조심 — 필요하면 이부프로펜 소량을 식후에, 그것도 속쓰림이 없을 때만.","planTitle":"숙취 대처","planLabel":"약보다 물","plan":[{"slot":"수분","title":"물 + 전해질, 가벼운 식사","why":"탈수·저혈당이 두통·피로의 주범.","options":[],"pick":""},{"slot":"두통","title":"필요 시 — 이부프로펜 소량 식후","why":"아세트아미노펜은 알코올과 간독성 상승 우려로 피함. 소염제는 위 자극 — 속쓰림이 있으면 둘 다 금지.","options":["ibuprofen"],"pick":"ibuprofen","optional":true},{"slot":"속","title":"속쓰림 — 제산제·알긴산","why":"위 점막 보호. 진통제는 이때 금지.","options":["almagate","alginate"],"pick":"alginate","optional":true}],"how":["물 500 mL와 이온음료(물에 반쯤 희석)를 드시고, 죽이나 꿀물을 드세요.","두통이 심하면 식사 후 이부프로펜 200 mg 한 알만 드세요. 타이레놀은 술과 겹치면 간에 부담이 돼요.","주무시기 전 물 두 컵이 다음 날 아침을 바꿔요."],"pharmacy":["약사님께 “어제 술을 많이 마셨어요”라고 말씀하시면 아세트아미노펜 대신 다른 약을 권해 드려요."],"selfcare":["잠이 최고의 약이에요. 가벼운 산책도 좋아요.","물과 전해질을 자주 드세요. 꿀물·이온음료·따뜻한 국물이 좋아요.","해장술은 안 돼요. 다음 숙취를 더 키울 뿐이에요."],"avoid":["타이레놀·게보린·감기약(아세트아미노펜)을 술과 함께 드시면 간이 상해요.","빈속에 소염제는 위를 상하게 해요.","커피를 많이 드시면 탈수가 심해져요."],"notWorking":{"title":"이럴 땐 병원으로","steps":["24시간 넘게 토하거나, 물도 못 마시거나, 변이 검거나 피를 토하거나, 명치가 심하게 아프면(췌장염) 병원에 가세요."]},"care":{"pharmacy":["두통·메스꺼움, 하루 이내 호전"],"clinic":["24시간 넘는 구토·탈수","심한 상복부 통증(췌장염·위염)","잦은 폭음(알코올 사용 문제 상담)"],"er":["피 토함·검은 변","의식 혼미·경련","가슴 통증·부정맥"]},"faq":[],"sources":["fda_apap"]},{"id":"arthritis","group":"통증","icon":"bone","name":"무릎·손 관절염","short":"오래된 관절 통증","tags":["관절염","무릎","퇴행성","연골","손가락","골관절염","시큰"],"lead":"오래된 관절 통증에서 가장 확실한 치료는 약이 아니라 **운동과 체중 조절**이에요. 국제 지침(OARSI·ESCEO)이 공통으로 첫 줄에 두는 것이 교육·운동·체중감량이고, 약은 **바르는 소염제가 1차**예요. 먹는 소염제는 잘 듣지만 위·콩팥·심장 부담이 있어 짧게 씁니다. 65세가 넘으면 이 차이가 특히 커요.","planTitle":"관절염, 순서가 있어요","planLabel":"1번이 약이 아니라는 게 핵심이에요","plan":[{"slot":"1단계","title":"운동·체중 — 가장 확실한 치료","why":"허벅지 근력 운동과 걷기는 진통제만큼의 효과가 있고 부작용이 없어요. 체중 1 kg을 줄이면 무릎에 걸리는 힘은 그 서너 배가 줄어요.","options":[],"pick":""},{"slot":"바르기","title":"바르는 소염제 — 약물 1순위","why":"지침이 먹는 약보다 먼저 권하는 약이에요. 무릎·손처럼 피부에 가까운 관절에 잘 들고, 위장·심장 부담이 거의 없어요.","options":["diclofenac-topical","ketoprofen","piroxicam"],"pick":"diclofenac-topical"},{"slot":"진통","title":"아세트아미노펜 — 가벼운 통증에","why":"부담이 가장 적어 먼저 써 볼 만해요. 다만 관절염에서 효과는 크지 않아 짧게, 필요할 때만 쓰는 것이 지침 권고예요.","options":["acetaminophen"],"pick":"acetaminophen","optional":true},{"slot":"소염","title":"먹는 소염제 — 아플 때 짧게","why":"통증이 심한 며칠에만. 65세 이상·위장·심장·콩팥 문제가 있으면 반드시 위보호제와 함께, 최단기간으로.","options":["ibuprofen","naproxen"],"pick":"ibuprofen","optional":true},{"slot":"위보호","title":"파모티딘 — 소염제를 3일 넘게 쓸 때","why":"65세 이상에서 소염제 위장 출혈 위험이 확 올라가요. 며칠 이상 쓸 계획이면 함께 드세요.","options":["famotidine"],"pick":"famotidine","optional":true}],"how":["**바르는 약**을 하루 3~4번, 아픈 관절 위에 얇게 펴 바르세요. 문지르지 말고 스며들게 두세요.","많이 아픈 날에만 식사 후 이부프로펜을 더하세요. 3일 넘게 필요하면 파모티딘도 같이요.","아침에 뻣뻣한 시간이 30분을 넘지 않는지 봐 주세요. 넘으면 다른 관절염(류마티스)일 수 있어요.","**하루 30분 걷기와 허벅지 근력 운동**을 약과 같은 무게로 생각해 주세요. 이게 진짜 치료예요.","무릎이 붓고 열이 나면 며칠 쉬면서 얼음찜질, 가라앉으면 다시 움직이세요."],"pharmacy":["약사님께 이렇게 말씀하세요. “무릎 관절염이에요. 바르는 소염제 주세요. 많이 아픈 날 먹을 것도 하나요.”","드시는 혈압약·피 묽게 하는 약, 콩팥·위장 문제를 꼭 말씀해 주세요. 먹는 소염제를 드려도 되는지가 여기서 갈려요."],"selfcare":["**허벅지 앞 근육 운동**을 하루 10분만 해 보세요. 의자에 앉아 무릎을 쭉 펴 5초 버티기를 20번, 아침저녁으로요. 무릎을 잡아 주는 힘이 생겨요.","체중을 조금만 줄여도 무릎이 확실히 편해져요. 걷기와 물속 운동이 관절에 부담이 적어요.","따뜻한 찜질로 뻣뻣함을 풀고, 부어오른 날엔 얼음찜질을 해 주세요.","계단은 오를 때보다 내려올 때 무릎에 몇 배로 부담이 가요. 손잡이를 꼭 잡으세요.","쪼그려 앉기, 양반다리, 무릎 꿇기는 되도록 피해 주세요."],"avoid":["아프다고 아예 움직이지 않으면 근육이 빠져 더 아파져요. 통증이 심한 며칠만 쉬고 다시 움직이세요.","먹는 소염제를 매일 몇 달씩 드시지 마세요. 특히 65세 이상은 위장 출혈과 콩팥 부담이 커요.","소염제를 두 가지 겹쳐 드시지 마세요.","관절에 좋다는 주사·시술을 광고만 보고 결정하지 마세요. 근거가 갈리는 것이 많아요."],"notWorking":{"title":"약을 써도 잘 낫지 않으면","steps":["바르는 약을 충분한 양으로, 하루 3~4번 규칙적으로 쓰고 계신지 먼저 봐 주세요. 조금씩 띄엄띄엄은 효과가 안 나요.","운동을 같이 하고 계신가요? 약만으로는 한계가 뚜렷해요. 물리치료실에서 운동을 배우는 것이 큰 도움이 됩니다.","밤에 아파 잠을 못 자거나 걷는 거리가 눈에 띄게 줄면 병원에 가 보세요. 주사 치료나 수술을 상의할 때예요.","무릎이 갑자기 붓고 뜨겁고 열이 나면 감염이나 통풍일 수 있어요. 그날 바로 진료를 받으세요."]},"care":{"pharmacy":["움직이면 아프고 쉬면 나아지는 오래된 관절 통증","아침 뻣뻣함이 30분 이내","붓기·열감이 없음"],"clinic":["아침 뻣뻣함이 1시간 이상, 여러 관절이 대칭으로 아픔(류마티스 감별)","밤에 아파 잠을 깸","걷는 거리가 눈에 띄게 줄어듦","무릎에 물이 자주 참","약을 2~4주 써도 그대로"],"er":["관절 하나가 갑자기 벌겋게 붓고 뜨겁고 열이 남(화농성 관절염·통풍)","다친 뒤 관절이 어긋난 느낌이고 체중을 실을 수 없음"]},"faq":[{"q":"글루코사민은 먹을 만한가요?","a":"지침마다 의견이 갈려요. OARSI는 권하지 않고 ESCEO는 특정 제형을 권해요. 2024년 네트워크 메타분석에서는 **단독으로는 임상적으로 의미 있는 통증 감소에 못 미쳤고**, 오메가3나 이부프로펜과 병용했을 때 의미 있는 차이를 보였어요. 드시고 3개월 뒤에도 차이를 못 느끼면 굳이 이어갈 이유가 없어요."},{"q":"연골 주사를 맞으면 연골이 재생되나요?","a":"아니요. 흔히 말하는 연골 주사(히알루론산)는 **윤활 역할을 도와 통증을 줄이는 것**이지 닳은 연골을 되살리진 못해요. 효과도 사람마다 차이가 커요."}],"sources":["arden2020oa","sumsuzzman2024glu","derry2016chronic","beers2023"]},{"id":"gout","group":"통증","icon":"bone","name":"통풍 (엄지발가락 발작)","short":"밤새 벌겋게 붓고 아플 때","tags":["통풍","요산","엄지발가락","발작","관절","痛風"],"lead":"새벽에 엄지발가락이 벌겋게 붓고 이불만 닿아도 아프면 통풍 발작일 가능성이 커요. 요산 결정이 관절에 쌓여 생기는 염증이에요. **발작은 소염제로 끄고, 재발은 요산을 낮춰서 막습니다.** 이 두 가지를 섞으면 안 돼요 — 발작 중에 요산강하제를 새로 시작하지 않고, 이미 드시던 분은 발작 중에도 끊지 않아요.","planTitle":"발작을 끄는 순서","planLabel":"빠를수록 잘 들어요 — 24시간 안에","plan":[{"slot":"소염","title":"소염제를 충분한 양으로 즉시","why":"지침이 급성 발작에 강하게 권고하는 약이에요. 참다가 먹으면 훨씬 오래가요. 아프기 시작하면 바로, 넉넉한 용량으로 시작해 가라앉으면 줄여요.","options":["naproxen","ibuprofen"],"pick":"naproxen"},{"slot":"위보호","title":"파모티딘 — 소염제를 며칠 쓸 때","why":"통풍 발작은 며칠 소염제를 써야 해서 위 부담이 쌓여요.","options":["famotidine"],"pick":"famotidine","optional":true},{"slot":"처방","title":"콜히친 — 발작 24시간 이내","why":"소염제를 쓰기 어려운 분(콩팥·위장 문제)이나 소염제로 부족할 때 씁니다. 저용량이 원칙이고 설사가 흔해요.","options":["colchicine"],"pick":"colchicine","otc":false},{"slot":"예방","title":"알로퓨리놀 — 발작이 가라앉은 뒤","why":"요산을 6 mg/dL 미만으로 낮추는 것이 진짜 치료예요. 1년에 두 번 이상 발작하거나 결절이 있으면 시작합니다.","options":["allopurinol"],"pick":"allopurinol","otc":false}],"how":["아프기 시작하면 **바로** 소염제를 넉넉한 용량으로 드세요. 식사 후에요. 하루 이틀 지나 가라앉으면 용량을 줄여요.","아픈 관절을 높이 올리고 얼음주머니를 수건에 싸서 15~20분씩 대세요.","물을 평소보다 많이 드세요. 요산이 소변으로 빠져나가는 데 도움이 돼요.","이미 알로퓨리놀 같은 요산약을 드시고 계셨다면 **발작 중에도 그대로 계속** 드세요.","발작이 완전히 가라앉은 뒤에 병원에서 요산 검사를 받고 예방약을 상의하세요."],"pharmacy":["약사님께 이렇게 말씀하세요. “통풍 발작인 것 같아요. 소염제를 넉넉히 주세요. 위도 지켜 주는 것으로요.”","콩팥이 안 좋거나 위궤양을 앓은 적이 있거나 피 묽게 하는 약을 드신다면 꼭 말씀해 주세요. 소염제를 드리기 어려울 수 있어요."],"selfcare":["발작 중에는 아픈 발을 심장보다 높이 올리고 쉬세요. 양말·이불이 닿지 않게 해 주세요.","물을 하루 2 L 정도 넉넉히 드세요.","맥주와 소주, 내장류, 등푸른 생선, 과당이 많은 음료가 대표적인 방아쇠예요. 발작 뒤 며칠은 특히 피해 주세요.","체중을 서서히 줄이면 발작 빈도가 줄어요. 단, 굶는 다이어트는 오히려 발작을 일으켜요.","저지방 우유·요구르트는 요산을 낮추는 쪽으로 알려져 있어요."],"avoid":["진통 목적으로 아스피린을 드시지 마세요. 요산이 빠져나가는 것을 방해해 발작을 키울 수 있어요.","발작 중에 요산강하제를 **새로** 시작하지 마세요. 오히려 발작이 심해질 수 있어요.","반대로, 원래 드시던 요산강하제는 발작 중에 끊지 마세요.","아픈 관절을 주무르거나 뜨겁게 찜질하지 마세요. 염증이 더 심해져요.","굶거나 갑자기 심하게 운동하지 마세요. 요산이 급히 움직이면 발작이 옵니다."],"notWorking":{"title":"약을 먹어도 잘 낫지 않으면","steps":["충분한 양으로 제때 시작하셨는지 봐 주세요. 통풍은 조금씩 참다가 드시면 효과가 크게 떨어져요.","2~3일이 지나도 붓기와 통증이 그대로면 병원에 가세요. 스테로이드 주사나 콜히친으로 바꾸면 훨씬 빨리 잡혀요.","1년에 두 번 이상 발작이 오거나, 발가락·귓바퀴에 몽우리가 만져지면 요산을 낮추는 치료를 시작할 때예요.","관절이 벌겋고 뜨거우면서 **열이 나면** 통풍이 아니라 세균 감염일 수 있어요. 그날 바로 진료를 받으세요."]},"care":{"pharmacy":["예전에 통풍 진단을 받았고 늘 같은 양상의 발작","관절 하나가 아프고 열은 없음","하루이틀 안에 좋아지는 흐름"],"clinic":["처음 생긴 발작(진단을 받아야 해요)","3일이 지나도 그대로","1년에 두 번 이상 반복","콩팥이 나빠 소염제를 쓰기 어려움","몽우리(결절)가 만져짐"],"er":["관절이 붓고 아프면서 38도 이상 열이 남(화농성 관절염 감별)","여러 관절이 동시에 갑자기 붓고 못 움직임"]},"faq":[{"q":"요산 수치가 정상인데 통풍이라고요?","a":"발작 중에는 요산이 관절로 몰려가 **혈액 수치가 오히려 정상으로 나오기도** 해요. 그래서 통풍 진단은 수치만으로 하지 않고, 가라앉은 뒤 다시 재는 것이 정확해요."},{"q":"고기를 아예 끊어야 하나요?","a":"아니요. 식사 조절만으로 낮출 수 있는 요산은 제한적이에요(대개 1 mg/dL 안팎). **술·내장류·과당 음료를 줄이는 것**이 핵심이고, 나머지는 약으로 조절하는 편이 현실적이에요."}],"sources":["acr2020gout","castellsague2012","cnt2013"]},{"id":"cramp","group":"통증","icon":"moon","name":"다리에 쥐가 날 때","short":"밤에 종아리가 뭉칠 때","tags":["쥐","종아리","경련","다리","야간","근육경련","쥐가남"],"lead":"자다가 종아리가 뭉쳐 깨는 야간 다리 경련은 60세가 넘으면 흔해요. 솔직하게 말씀드리면 **여기에 잘 듣는 약은 없어요.** 마그네슘은 코크란 분석에서 노인의 야간 경련에 의미 있는 효과가 없었어요. 대신 **자기 전 종아리 스트레칭**은 RCT에서 경련 횟수를 하루 1.2회 줄였어요. 약보다 이게 낫습니다.","planTitle":"쥐가 날 때, 순서","planLabel":"약보다 확실한 것이 있어요","plan":[{"slot":"지금","title":"발끝을 몸쪽으로 당기기","why":"쥐가 난 순간 종아리를 늘려 주는 것이 가장 빠른 해결이에요. 무릎을 펴고 발끝을 손으로 잡아 몸쪽으로 당겨 30초 버티세요.","options":[],"pick":""},{"slot":"예방","title":"자기 전 종아리·햄스트링 스트레칭","why":"55세 이상 80명 RCT에서 6주 뒤 경련이 하루 1.2회 줄고 통증도 줄었어요. 매일 자기 직전에 하는 것이 핵심이에요.","options":[],"pick":""},{"slot":"보조","title":"마그네슘 — 기대는 낮추세요","why":"코크란 분석에서 노인 야간 경련에 임상적으로 의미 있는 효과가 없었어요(주당 경련 차이 −0.18). 다만 부작용이 크지 않아 한 달쯤 시험 삼아 써 보는 분들이 있어요. 설사가 흔해요.","options":["magnesium-oxide"],"pick":"magnesium-oxide","optional":true}],"how":["쥐가 난 순간에는 **무릎을 펴고 발끝을 몸쪽으로 당겨** 30초 버티세요. 일어서서 벽을 밀듯 종아리를 늘려도 좋아요.","가라앉은 뒤 따뜻하게 찜질하고 가볍게 주물러 주세요.","예방은 매일 **자기 직전** 스트레칭이에요. 벽에서 한 걸음 떨어져 손으로 벽을 짚고, 뒷다리를 곧게 편 채 30초씩 양쪽 세 번.","낮에 물을 충분히 드시고, 이뇨제를 드신다면 의사와 시간대를 상의해 보세요."],"pharmacy":["약사님께 “밤에 종아리에 쥐가 자주 나요”라고 말씀하시고, 드시는 약(특히 이뇨제·콜레스테롤약)을 알려 주세요. 약 때문에 생기는 경우가 있어요."],"selfcare":["**자기 직전 종아리 스트레칭 30초씩 세 번.** 이것 하나가 지금까지 확인된 가장 확실한 방법이에요.","이불을 발끝이 눌리지 않게 느슨하게 덮으세요. 발끝이 아래로 굽은 자세가 경련을 부릅니다.","낮에 물을 충분히 드시고, 땀을 많이 흘린 날에는 더 챙겨 드세요.","잠들기 전 따뜻한 물로 종아리를 데워 주면 도움이 돼요.","너무 오래 서 있거나 갑자기 무리한 운동을 한 날 밤에 잘 생겨요. 그런 날은 스트레칭을 꼭 하세요."],"avoid":["퀴닌(키니네)은 절대 드시지 마세요. 예전에 쓰던 약이지만 혈액 부작용 때문에 지금은 권하지 않아요.","마그네슘을 많이 드신다고 더 좋아지지 않아요. 설사만 심해집니다.","쥐가 난 근육을 억지로 세게 주무르거나 때리지 마세요. 근육이 상할 수 있어요.","술을 마신 날 밤에 더 잘 생겨요. 늦은 음주를 줄여 보세요."],"notWorking":{"title":"계속 반복되면","steps":["스트레칭을 **매일 자기 직전에** 6주는 해 보세요. 효과가 나오는 데 몇 주가 걸려요.","드시는 약을 점검해 주세요. 이뇨제, 일부 혈압약, 콜레스테롤약(스타틴), 천식약이 경련을 일으킬 수 있어요.","종아리가 걸을 때 아프고 쉬면 낫는 식이면 다리 혈관 문제일 수 있어요. 진료가 필요해요.","한쪽 종아리만 붓고 아프고 뜨거우면 **혈전**일 수 있어요. 그날 바로 병원에 가세요.","손발이 저리고 감각이 둔해지는 증상이 같이 있으면 신경·당뇨·갑상선 검사가 필요해요."]},"care":{"pharmacy":["밤에 가끔 종아리가 뭉치고 몇 분 안에 풀림","양쪽 다리에 번갈아 생김","붓기·색 변화 없음"],"clinic":["매일 밤 반복되어 잠을 못 잠","낮에 걸을 때 종아리가 아프고 쉬면 나아짐","손발 저림·감각 저하 동반","새로 시작한 약과 시기가 겹침"],"er":["한쪽 종아리만 붓고 뜨겁고 아픔(심부정맥혈전증 의심)","갑자기 다리에 힘이 빠지고 감각이 없음"]},"faq":[{"q":"마그네슘 광고를 많이 보는데 효과가 없나요?","a":"임신부의 다리 경련에는 결과가 엇갈리지만, **노인의 야간 경련에서는 코크란 분석 결과 위약과 의미 있는 차이가 없었어요.** 광고와 실제 근거의 차이가 큰 대표적인 예예요. 굳이 드신다면 한 달 써 보고 차이가 없으면 그만두세요."},{"q":"쥐가 나는 게 큰 병 신호일 수도 있나요?","a":"대부분은 아니에요. 다만 **한쪽 다리만 붓고 아프거나**, 걸을 때 아프고 쉬면 낫거나, 저림·근력 저하가 같이 오면 혈관·신경 문제를 확인해야 해요."}],"sources":["garrison2020mg","hallegraeff2012stretch"]},{"id":"hemorrhoid","group":"소화기","icon":"drop","name":"치질 (치핵)","short":"피가 비치고 아플 때","tags":["치질","치핵","항문","출혈","가려움","좌욕","변비"],"lead":"변기에 피가 비치고 항문이 아프고 가려우면 치핵일 가능성이 높아요. 약은 세 갈래로 씁니다 — **국소약으로 지금 아픈 걸 눅이고, 먹는 플라보노이드로 출혈을 줄이고, 변을 부드럽게 해서 원인을 없애요.** 코크란 분석에서 먹는 약은 출혈과 가려움을 뚜렷하게 줄였지만 통증에는 효과가 확실하지 않았어요. 그래서 아플 때는 좌욕과 국소약이 답입니다.","planTitle":"치질, 세 갈래로","planLabel":"지금 아픈 것 · 출혈 · 원인(변)","plan":[{"slot":"국소","title":"치질 연고·좌약 — 지금 아픈 것","why":"국소마취 성분이 통증과 가려움을 바로 눅여 줘요. 스테로이드가 든 제품은 1주를 넘기지 마세요.","options":["hemorrhoid-topical"],"pick":"hemorrhoid-topical"},{"slot":"출혈","title":"먹는 치질약(디오스민) — 피가 비칠 때","why":"코크란 분석에서 출혈(OR 0.12)과 가려움(OR 0.23)을 뚜렷하게 줄였어요. 통증에는 유의한 효과가 없었어요.","options":["diosmin"],"pick":"diosmin"},{"slot":"변","title":"변을 부드럽게 — 이게 진짜 치료","why":"딱딱한 변이 치핵을 계속 밀어내요. 마그네슘 완하제로 무르게 하면 재발이 확 줄어요. 신장이 나쁘면 마그네슘은 금지예요.","options":["magnesium-oxide"],"pick":"magnesium-oxide"},{"slot":"좌욕","title":"따뜻한 물 좌욕 — 약만큼 중요","why":"따뜻한 물에 5~10분 앉아 있으면 항문 근육이 풀려 통증이 줄어요. 치핵 수술 후 통증도 줄여 준 방법이에요.","options":[],"pick":""}],"how":["**좌욕**을 하루 2~3번, 특히 배변 후와 자기 전에 하세요. 40도 정도 따뜻한 물에 5~10분 앉아 있으면 됩니다. 비누나 소독약은 넣지 마세요.","좌욕 뒤 물기를 부드럽게 닦고 **연고나 좌약**을 넣으세요. 1주일 이내로만요.","**먹는 치질약**은 라벨대로 식사 후에 드세요. 급성기에는 며칠 넉넉히 쓰고 줄이는 제품이 많아요.","**변을 무르게** 만드세요. 마그밀 같은 완하제를 변이 무를 정도로 조절하고, 물과 채소를 늘리세요.","많이 아프면 식사 후 아세트아미노펜을 쓰세요. 소염제는 위 부담이 있으니 짧게요."],"pharmacy":["약사님께 이렇게 말씀하세요. “치질인데 피가 비쳐요(또는 아파요). 바르는 것과 먹는 것 같이 주세요. 변도 무르게 하고 싶어요.”","임신 중이신지, 콩팥이 안 좋은지, 피 묽게 하는 약을 드시는지 말씀해 주세요."],"selfcare":["**변기에 3분 넘게 앉아 있지 마세요.** 스마트폰을 들고 가시면 자기도 모르게 10분이 넘어갑니다. 이 습관이 치질을 키워요.","채소·과일·통곡물로 섬유질을 늘리고 물을 하루 1.5~2 L 드세요.","변의가 오면 참지 말고 바로 가세요. 참으면 변이 더 딱딱해져요.","휴지로 세게 문지르지 마시고, 물로 씻고 부드럽게 눌러 닦으세요.","오래 앉아 계신다면 30분마다 일어나 잠깐 걸으세요."],"avoid":["힘을 세게 주며 오래 밀어내지 마세요. 그 순간에 치핵이 밀려 나와요.","스테로이드가 든 치질 연고를 1주 넘게 쓰지 마세요. 항문 피부가 얇아집니다.","물티슈로 자주 문지르지 마세요. 알코올·향료가 항문 피부를 상하게 해요.","출혈을 무조건 치질로 넘기지 마세요. 특히 50세 이후 새로 생긴 출혈은 확인이 필요해요.","뜨거운 물에 오래 앉아 있지 마세요. 미지근하게 5~10분이면 충분해요."],"notWorking":{"title":"약을 써도 잘 낫지 않으면","steps":["좌욕과 변 조절을 같이 하고 계신지 봐 주세요. 약만으로는 잘 안 낫는 병이에요.","1~2주 해도 출혈이 계속되면 병원에 가세요. 고무밴드 결찰 같은 간단한 시술로 크게 좋아지는 경우가 많아요.","덩어리가 딱딱하게 튀어나와 몹시 아프면 혈전성 치핵일 수 있어요. **며칠 안에** 처치하면 훨씬 편해집니다.","50세가 넘어 새로 생긴 출혈, 변이 가늘어짐, 체중 감소, 빈혈이 있으면 반드시 대장 검사를 받으세요."]},"care":{"pharmacy":["배변 시 선홍색 피가 휴지에 묻는 정도","항문이 아프고 가렵지만 걸을 수 있음","덩어리가 저절로 들어감"],"clinic":["1~2주 약을 써도 출혈이 계속됨","덩어리가 손으로 밀어야 들어가거나 들어가지 않음","50세 이후 새로 생긴 출혈, 변이 가늘어짐, 체중 감소","임신 중 치질"],"er":["피가 뚝뚝 떨어질 정도로 많이 남, 어지럽고 창백함","항문이 심하게 붓고 열이 나며 앉지도 못함(농양 의심)"]},"faq":[{"q":"좌욕에 소금이나 소독약을 넣으면 좋은가요?","a":"아니요. **맹물이면 충분해요.** 소금물이 더 낫다는 근거는 없고, 소독약이나 비누는 오히려 항문 피부를 자극해요."},{"q":"수술을 꼭 해야 하나요?","a":"대부분은 아니에요. 1~2단계는 생활 습관과 약으로 조절되고, 3~4단계나 반복 출혈은 시술·수술이 확실해요. 요즘은 고무밴드 결찰처럼 입원 없이 하는 방법도 많아요."}],"sources":["perera2012phlebo","liao2024sitz","aga2023cic"]},{"id":"athletes-foot","group":"알레르기·피부","icon":"band","name":"무좀 · 발톱 무좀","short":"가렵고 벗겨질 때","tags":["무좀","발톱무좀","곰팡이","백선","발가락","완선","습진"],"lead":"발가락 사이가 짓무르고 가렵거나 발바닥이 하얗게 벗겨지면 무좀(발백선)이에요. 바르는 약으로 잘 낫습니다 — 코크란 분석에서 **테르비나핀 같은 알릴아민계가 아졸계보다 실패가 적었어요**(RR 0.63). 다만 **발톱이 두껍고 누렇게 변한 발톱 무좀은 크림으로 안 나아요.** 발톱은 네일라카를 6~12개월 쓰거나, 여러 개면 먹는 약(처방)이 확실합니다.","planTitle":"무좀, 부위에 따라 달라요","planLabel":"피부인지 발톱인지가 갈림길","plan":[{"slot":"피부","title":"테르비나핀 크림 — 발 무좀 1순위","why":"1~2주면 되고 실패가 가장 적어요. 증상이 사라져도 며칠 더 발라야 재발이 적어요.","options":["terbinafine","clotrimazole"],"pick":"terbinafine"},{"slot":"접힌곳","title":"클로트리마졸 — 사타구니·접히는 부위","why":"칸디다까지 폭넓게 들어서 사타구니 완선이나 접히는 부위에 유리해요. 대신 2~4주로 조금 더 길어요.","options":["clotrimazole"],"pick":"clotrimazole","optional":true},{"slot":"발톱","title":"아모롤핀 네일라카 — 발톱 무좀","why":"크림은 발톱을 못 뚫어요. 일주일 1~2번, 손톱 6개월·발톱 9~12개월. 여러 개가 심하면 먹는 약이 훨씬 확실해요.","options":["amorolfine"],"pick":"amorolfine","optional":true},{"slot":"관리","title":"말리기 — 약만큼 중요해요","why":"곰팡이는 축축한 곳에서 자라요. 씻고 잘 말리고 양말을 매일 갈면 재발이 확 줄어요.","options":[],"pick":""}],"how":["발을 씻고 **완전히 말린 뒤** 크림을 환부와 그 주변 2 cm까지 얇게 바르세요.","테르비나핀은 하루 1~2번 1~2주, 클로트리마졸은 하루 2~3번 2~4주예요.","**증상이 없어져도 며칠에서 1~2주 더** 바르세요. 여기서 그만두면 거의 재발해요.","발톱 무좀은 줄로 표면을 갈아낸 뒤 네일라카를 주 1~2회 바르고, 몇 달을 꾸준히 하셔야 해요.","양말은 매일 갈고, 신발은 두 켤레를 번갈아 신어 하루씩 말리세요."],"pharmacy":["약사님께 이렇게 말씀하세요. “발가락 사이 무좀이에요. 테르비나핀 크림 주세요.” 발톱이면 “발톱 무좀인데 네일라카 있나요?”라고요.","당뇨가 있으시면 꼭 말씀해 주세요. 발 관리 기준이 달라져요."],"selfcare":["씻은 뒤 발가락 사이까지 **완전히 말려 주세요.** 수건으로 닦고 잠시 바람에 두시면 좋아요.","면양말을 매일 갈아 신고, 땀이 많으면 하루 두 번 갈아도 좋아요.","공중목욕탕·수영장에서는 슬리퍼를 신으세요. 발수건은 가족과 따로 쓰세요.","발톱깎이도 따로 쓰세요. 온 가족이 옮겨 다니는 흔한 통로예요.","신발은 이틀에 한 번씩 번갈아 신어 안쪽을 말리세요."],"avoid":["스테로이드가 섞인 연고를 무좀에 바르지 마세요. 가려움은 잠깐 덜하지만 곰팡이가 더 넓게 번져요.","식초·마늘·락스에 발을 담그지 마세요. 화상과 피부염만 생겨요.","증상이 사라졌다고 바로 그만두지 마세요. 재발의 가장 큰 원인이에요.","발톱 무좀에 크림만 오래 바르지 마세요. 시간만 버려요.","당뇨가 있으시면 발톱을 직접 깎아 갈지 마세요. 상처가 큰 문제로 번질 수 있어요."],"notWorking":{"title":"약을 발라도 잘 낫지 않으면","steps":["정해진 기간을 다 채우셨는지 봐 주세요. 테르비나핀 1~2주, 클로트리마졸 2~4주가 기준이에요.","환부보다 **2 cm 넓게** 바르고 계신가요? 가장자리에 곰팡이가 남아 재발하는 경우가 많아요.","4주를 발라도 그대로면 무좀이 아닐 수 있어요. 습진·건선·접촉피부염이 무좀처럼 보이는 일이 흔합니다. 피부과에서 긁어서 현미경으로 보면 바로 확인돼요.","발톱이 여러 개 상했거나 두껍게 부스러지면 먹는 약(처방)을 상의하세요. 간 수치 확인이 필요해 병원에서 시작합니다.","발이 벌겋게 붓고 아프고 열이 나면 세균 감염(봉와직염)이에요. 그날 바로 진료를 받으세요."]},"care":{"pharmacy":["발가락 사이가 짓무르고 가려움","발바닥이 하얗게 벗겨짐","붓기·열감·통증이 없음"],"clinic":["4주를 발라도 그대로","발톱이 여러 개 두껍고 변색","당뇨·면역저하가 있음","손톱까지 번짐"],"er":["발이 벌겋게 붓고 뜨겁고 열이 남(봉와직염)","당뇨가 있으면서 발에 상처가 생기고 냄새가 남"]},"faq":[{"q":"무좀약을 바르면 왜 더 가렵나요?","a":"약 자체의 자극일 수도 있고, 곰팡이가 죽으며 일시적으로 자극이 생기기도 해요. 며칠 안에 나아지면 계속 쓰시고, **붉게 번지고 물집이 생기면** 접촉피부염일 수 있으니 중단하고 약사와 상의하세요."},{"q":"가족에게 옮기지 않으려면요?","a":"발수건·슬리퍼·발톱깎이를 따로 쓰고, 바닥을 자주 청소하세요. 무좀은 **각질 부스러기**로 옮겨 다녀요."}],"sources":["crawford2007topical","bellsyer2012oral"]},{"id":"shingles","group":"알레르기·피부","icon":"shield","name":"대상포진 의심","short":"한쪽에 띠처럼 물집이 돋을 때","tags":["대상포진","포진","물집","띠","신경통","수두"],"lead":"몸 한쪽에만 띠 모양으로 물집이 돋고 그 자리가 쓰라리게 아프면 대상포진이에요. **이 병은 약국에서 버틸 병이 아닙니다.** 항바이러스제를 **발진이 생기고 72시간 안에** 시작해야 낫는 기간과 통증이 줄어요. 대상포진 뒤 통증이 몇 달 남는 대상포진후신경통이 약 5명 중 1명에게 생기는데, 초기 치료가 그 위험을 줄여 줍니다.","planTitle":"지금 바로 해야 할 일","planLabel":"72시간이 갈림길이에요","plan":[{"slot":"1순위","title":"오늘 병원 가기","why":"발진 후 72시간 안에 항바이러스제를 시작하는 것이 핵심이에요. 주말이라도 미루지 마세요.","options":[],"pick":""},{"slot":"처방","title":"항바이러스제","why":"바이러스 증식을 막아 발진이 낫는 기간과 통증을 줄여요. 보통 7일간 먹습니다.","options":["acyclovir"],"pick":"acyclovir","otc":false},{"slot":"진통","title":"아세트아미노펜 — 병원 가기 전까지","why":"통증을 눅이는 데 도움이 돼요. 대상포진 통증은 강한 편이라 처방 진통제가 필요한 경우가 많아요.","options":["acetaminophen"],"pick":"acetaminophen"},{"slot":"관리","title":"물집은 그대로 두고 덮어 두기","why":"터뜨리면 흉이 지고 세균 감염이 붙어요. 딱지가 앉을 때까지 전염력이 있어 느슨하게 덮어 두세요.","options":[],"pick":""}],"how":["**오늘 병원에 가세요.** 이것이 첫 번째이자 가장 중요한 일이에요.","병원 가기 전까지 아프면 아세트아미노펜을 4~6시간 간격으로 드세요.","물집은 터뜨리지 마시고 깨끗한 거즈로 느슨하게 덮어 두세요.","미지근한 물로 씻고 문지르지 마세요. 시원한 찜질이 화끈거림을 눅여 줘요.","처방받은 항바이러스제는 **하루 횟수가 많아요.** 시간을 맞춰 끝까지 다 드셔야 해요."],"pharmacy":["약사님께 “대상포진 같아요”라고 말씀하시면 바로 병원으로 안내해 주실 거예요. 약국에서 해결할 병이 아니에요.","이미 처방을 받으셨다면 콩팥이 안 좋은지 꼭 말씀해 주세요. 용량이 달라집니다."],"selfcare":["물집이 딱지가 앉을 때까지는 **수두를 앓지 않은 아기, 임신부, 항암 치료 중인 분과 접촉을 피해 주세요.** 그분들에게는 수두로 옮을 수 있어요.","잘 쉬고 잘 드세요. 몸이 지치면 회복이 늦어져요.","옷은 헐렁하고 부드러운 것으로 입어 쓸리지 않게 해 주세요.","통증이 심하면 참지 마시고 진료 때 꼭 말씀하세요. 초기 통증 조절이 나중의 신경통을 줄여요.","50세가 넘으면 백신으로 예방할 수 있어요. 이미 앓았던 분도 접종 대상이에요."],"avoid":["물집을 터뜨리거나 짜지 마세요.","민간요법으로 뜸을 뜨거나 소주·식초를 바르지 마세요. 화상과 감염이 겹칩니다.","'좀 지켜보자'며 며칠 미루지 마세요. 72시간이 지나면 약의 이득이 크게 줄어요.","스테로이드 연고를 임의로 바르지 마세요."],"notWorking":{"title":"치료를 시작했는데도 아프면","steps":["발진이 나은 뒤에도 통증이 남는 것은 드문 일이 아니에요. 약 5명 중 1명에게 생기는 대상포진후신경통이에요.","**참지 마시고 진료를 받으세요.** 일반 진통제가 아니라 신경통에 쓰는 약(가바펜틴·프레가발린 등)이나 국소 리도카인이 필요해요.","눈 주위·코끝·귀에 물집이 있으면 시력·청력 합병증 위험이 있어요. 안과·이비인후과 진료가 필요합니다.","물집 자리가 노랗게 곪고 열이 나면 세균 감염이 겹친 거예요. 다시 진료를 받으세요."]},"care":{"pharmacy":["여기에 해당하는 경우는 없어요 — 대상포진이 의심되면 바로 병원입니다"],"clinic":["몸 한쪽에 띠 모양 물집이 돋음","물집이 나기 전 그 자리가 쓰라리거나 저림","발진 후 72시간 이내(빠를수록 좋아요)","발진이 나은 뒤에도 통증이 남음"],"er":["눈 주위·코끝에 물집(시력 위협)","귀 주변 물집과 함께 얼굴이 마비되거나 어지러움(람세이 헌트 증후군)","면역이 약한 분(항암·이식·스테로이드 장기 복용)에게 발진이 넓게 퍼짐","심한 두통·목 뻣뻣함·의식 변화"]},"faq":[{"q":"다른 사람에게 옮나요?","a":"대상포진 자체가 옮지는 않지만, **수두를 앓은 적 없는 사람에게는 수두로 옮을 수 있어요.** 물집에 직접 닿을 때 전염되니 딱지가 앉을 때까지 덮어 두시면 됩니다."},{"q":"한 번 앓으면 다시는 안 걸리나요?","a":"아니요, 다시 걸릴 수 있어요. 그래서 **앓았던 분도 백신 접종 대상**이에요. 보통 회복 후 6개월~1년 뒤에 맞습니다."}],"sources":["saguil2017zoster"]},{"id":"bite","group":"알레르기·피부","icon":"flower","name":"벌레·모기 물림","short":"물린 자리가 가려울 때","tags":["모기","벌레","물림","가려움","벌","진드기","쏘임"],"lead":"모기나 벌레에 물린 자리는 대부분 며칠이면 저절로 가라앉아요. 가장 중요한 건 **긁지 않는 것** — 긁어서 생긴 상처로 세균이 들어가는 것이 진짜 문제입니다. 냉찜질과 바르는 가려움약으로 충분하고, 여러 군데 물려 온몸이 가려우면 먹는 항히스타민제를 더해요. 다만 **벌에 쏘인 뒤 숨이 차거나 얼굴이 붓는 것은 응급**이에요.","planTitle":"물렸을 때 순서","planLabel":"긁지 않게 하는 것이 목표예요","plan":[{"slot":"먼저","title":"냉찜질 10분","why":"얼음을 수건에 싸서 대면 가려움과 붓기가 눈에 띄게 줄어요. 약보다 빠를 때도 많아요.","options":[],"pick":""},{"slot":"바르기","title":"바르는 가려움약","why":"항히스타민·국소마취·멘톨 성분이 가려움을 바로 눅여 줘요. 물린 자리에만 며칠 쓰세요.","options":["antihistamine-topical"],"pick":"antihistamine-topical"},{"slot":"먹기","title":"먹는 항히스타민제 — 여러 곳 물렸을 때","why":"온몸이 가렵거나 밤에 잠을 못 잘 때 도움이 돼요. 낮에는 졸리지 않는 것으로, 밤에는 상관없어요.","options":["cetirizine","loratadine","fexofenadine"],"pick":"cetirizine","optional":true},{"slot":"감염","title":"항생제 연고 — 긁어서 곪았을 때만","why":"고름이 나고 붉게 번질 때만 쓰세요. 그냥 예방으로 바르면 내성만 늘어요.","options":["fusidic-acid","mupirocin"],"pick":"fusidic-acid","optional":true}],"how":["물린 자리를 **비누와 물로 씻고**, 얼음을 수건에 싸서 10분 대세요.","바르는 가려움약을 물린 자리에만 하루 3~4번, 3~4일 쓰세요.","여러 곳을 물려 온몸이 가려우면 먹는 항히스타민제를 하루 한 번 더하세요.","**벌침이 남아 있으면** 손톱이나 카드로 옆으로 밀어 빼세요. 핀셋으로 집어 짜면 독이 더 들어가요.","긁어서 진물이 나고 노랗게 곪으면 항생제 연고를 하루 1~2번, 1주 이내로 쓰세요."],"pharmacy":["약사님께 “모기 물린 데 바르는 약 주세요”라고 하시면 됩니다. 여러 군데 물렸으면 “먹는 것도 하나요”라고 덧붙이세요.","아이가 쓸 거면 나이를 말씀해 주세요. 제품마다 연령 제한이 달라요."],"selfcare":["**긁지 마세요.** 손톱을 짧게 깎고, 참기 힘들면 얼음찜질을 반복하세요.","밤에 가려워 잠을 못 자면 자기 전에 항히스타민제를 드시면 도움이 돼요.","야외에 나갈 때는 긴팔·긴바지와 기피제를 쓰세요. 향수는 벌을 부릅니다.","풀숲에 다녀온 뒤에는 몸에 진드기가 붙지 않았는지 살펴보세요.","물린 자리가 검게 딱지 지고 열이 나면 진드기 매개 감염을 확인해야 해요."],"avoid":["침을 바르거나 손톱으로 십자를 그어 누르지 마세요. 세균이 들어갑니다.","벌침을 핀셋으로 집어 짜지 마세요. 독주머니가 눌려 독이 더 들어가요.","스테로이드 연고를 넓은 부위에 오래 바르지 마세요.","감기약과 먹는 항히스타민제를 같이 드시지 마세요. 졸리는 성분이 겹쳐요.","물집을 터뜨리지 마세요."],"notWorking":{"title":"잘 낫지 않으면","steps":["물린 자리가 하루가 지나도 계속 커지고 붉게 번지면 세균 감염일 수 있어요. 진료를 받으세요.","가려움이 일주일 넘게 가면 진드기(옴)나 다른 피부병을 확인해야 해요.","야외 활동 뒤 물린 자리에 **검은 딱지**가 생기고 열이 나면 쯔쯔가무시 등 진드기 매개 감염일 수 있어요. 바로 진료를 받으세요.","벌에 쏘인 뒤 두드러기가 온몸에 퍼지거나 숨이 차면 다음에도 위험해요. 진료로 대비법을 상의하세요."]},"care":{"pharmacy":["물린 자리만 붉고 가려움","붓기가 손바닥보다 작음","열이 없고 컨디션이 좋음"],"clinic":["붉은 기가 하루가 지나도 계속 번짐","고름·열감·통증이 심해짐","검은 딱지와 발열(진드기 매개 감염)","물린 자리가 일주일 넘게 낫지 않음"],"er":["숨이 차거나 목이 조이는 느낌, 쉰 목소리","얼굴·입술·혀가 부음","온몸에 두드러기가 번지고 어지럽거나 쓰러질 것 같음","여러 마리 벌에 쏘임"]},"faq":[{"q":"물린 자리가 손바닥만큼 부었어요. 괜찮나요?","a":"모기에 물린 뒤 크게 붓는 국소 반응은 아이나 예민한 분에게 드물지 않아요. **열이 없고 숨이 편하면** 냉찜질과 약으로 며칠 지켜보시면 됩니다. 다만 붉은 기가 계속 번지고 아프면 감염이니 진료를 받으세요."}],"sources":["mann2000","koning2012"]},{"id":"dizziness","group":"수면·기타","icon":"head","name":"어지럼증","short":"빙빙 돌거나 아찔할 때","tags":["어지럼","어지럼증","이석증","빙빙","현훈","메니에르","아찔"],"lead":"어지럼은 원인에 따라 대처가 완전히 달라요. **고개를 돌리거나 누울 때 몇 초에서 1분쯤 빙빙 도는 것**은 이석증일 가능성이 높은데, 이건 약이 아니라 **자세 교정 수기(에플리)로 그 자리에서 좋아집니다.** 반대로 **어지럼과 함께 말이 어눌하거나 한쪽에 힘이 빠지면 뇌졸중** — 바로 119예요. 멀미약은 급성기 며칠만 쓰세요. 오래 쓰면 회복이 늦어져요.","planTitle":"어지럼, 먼저 나눠 보세요","planLabel":"약보다 원인을 가리는 것이 먼저예요","plan":[{"slot":"확인","title":"위험 신호부터 — 하나라도 있으면 119","why":"말이 어눌함, 한쪽 팔다리 힘 빠짐, 물체가 둘로 보임, 심한 두통, 걷지 못함. 하나라도 있으면 뇌졸중일 수 있어요.","options":[],"pick":""},{"slot":"이석증","title":"누울 때·돌아누울 때만 몇 초 빙빙 → 이석증","why":"가장 흔한 어지럼이에요. 약이 아니라 자세 교정 수기(에플리)로 대개 한두 번에 좋아져요. 이비인후과나 신경과에서 바로 해 줍니다.","options":[],"pick":""},{"slot":"급성기","title":"멀미약 — 토할 것 같을 때 며칠만","why":"구역·구토가 심할 때 도움이 돼요. 다만 3일 이상 쓰면 뇌가 균형을 다시 배우는 것을 방해해 회복이 늦어져요.","options":["dimenhydrinate","scopolamine"],"pick":"dimenhydrinate","optional":true},{"slot":"처방","title":"베타히스틴 — 메니에르병 등","why":"귀가 먹먹하고 이명과 함께 반복되는 어지럼(메니에르병)에 씁니다. 진단이 먼저예요.","options":["betahistine"],"pick":"betahistine","otc":false}],"how":["먼저 **위험 신호**를 확인하세요. 말이 어눌하거나 한쪽에 힘이 빠지거나 물체가 둘로 보이면 바로 119예요.","빙빙 도는 동안에는 안전한 곳에 **가만히 누워** 눈을 뜨고 한 점을 보세요. 눈을 감으면 더 심해지는 분도 있어요.","토할 것 같으면 멀미약을 한 번 드시고, **3일을 넘기지 마세요.**","일어날 때는 침대에 걸터앉아 1분 쉬었다가 천천히 서세요. 특히 혈압약을 드시는 분은요.","가라앉으면 누워만 있지 말고 **조금씩 움직이세요.** 뇌가 균형을 다시 배우는 데 움직임이 필요해요."],"pharmacy":["약사님께 “어지러워서 토할 것 같아요”라고 말씀하시고, 드시는 혈압약·수면제·전립선약을 알려 주세요. 어지럼의 원인이 약인 경우가 많아요.","65세 이상이면 꼭 말씀해 주세요. 멀미약이 낙상 위험을 높입니다."],"selfcare":["일어날 때 **천천히**. 앉았다가 1분 쉬고 서는 습관이 어지럼으로 인한 낙상을 줄여요.","집 안의 문턱과 전선을 정리하고 밤에는 작은 불을 켜 두세요. 어지러울 때 넘어지면 그게 더 큰 문제예요.","물을 충분히 드세요. 탈수는 흔한 원인이에요.","귀가 먹먹하고 이명이 같이 오면 그 내용을 적어 두세요. 진단에 큰 도움이 됩니다.","가라앉은 뒤에는 걷기를 조금씩 늘리세요. 안 움직이면 회복이 더 늦어요."],"avoid":["멀미약을 일주일 넘게 드시지 마세요. 회복을 방해하고, 어르신께는 낙상·변비·소변 막힘을 일으켜요.","어지럽다고 며칠씩 누워만 계시지 마세요.","혈압약이나 다른 약을 임의로 끊지 마세요. 의사와 상의해서 조정하세요.","어지러울 때 운전하거나 사다리·계단을 오르지 마세요.","술은 어지럼을 확실히 악화시켜요."],"notWorking":{"title":"계속 어지러우면","steps":["**누울 때·돌아누울 때만** 몇 초 빙빙 돈다면 이석증일 가능성이 높아요. 이비인후과·신경과에서 진찰하고 그 자리에서 자세 교정을 받으면 대개 한두 번에 좋아집니다. 약으로 버틸 일이 아니에요.","귀가 먹먹하고 이명이 있으면서 몇십 분에서 몇 시간씩 반복되면 메니에르병일 수 있어요. 진료가 필요해요.","드시는 약을 점검해 주세요. 혈압약, 수면제, 전립선약, 이뇨제가 흔한 원인이에요.","어지럼과 함께 걷기가 눈에 띄게 불안정하거나 얼굴이 저리면 뇌 쪽을 확인해야 해요.","빈혈·갑상선·부정맥으로 어지러운 경우도 흔해요. 피검사와 심전도로 확인할 수 있어요."]},"care":{"pharmacy":["멀미처럼 잠깐 어지럽고 금방 가라앉음","자세를 바꿀 때만 몇 초","다른 신경 증상이 없음"],"clinic":["반복되는 회전성 어지럼(이석증·메니에르 감별)","귀 먹먹함·이명·청력 저하 동반","새로 시작한 약과 시기가 겹침","일어설 때마다 아찔함(기립성 저혈압)","어지럼으로 넘어진 적이 있음"],"er":["말이 어눌하거나 한쪽 팔다리에 힘이 빠짐","물체가 둘로 보이거나 시야가 반쯤 안 보임","난생처음 겪는 심한 두통과 함께","혼자 서거나 걷지 못함","가슴 통증·실신"]},"faq":[{"q":"이석증은 왜 약을 안 쓰나요?","a":"귀 안의 작은 돌(이석)이 제자리를 벗어나 굴러다니는 것이 원인이라, **돌을 제자리로 돌려놓는 자세 교정(에플리 수기)**이 치료예요. 연구에서도 1주 시점에 재활치료보다 효과가 좋았어요. 약은 구역을 줄일 뿐 원인을 못 고쳐요."},{"q":"빈혈 때문에 어지러운 걸까요?","a":"빈혈은 **빙빙 도는 어지럼보다 아찔하고 기운 없는 느낌**으로 오는 편이에요. 계단을 오를 때 숨이 차고 창백하다면 피검사를 받아 보세요."}],"sources":["wegner2014epley","beers2023"]},{"id":"stye","group":"수면·기타","icon":"eye","name":"다래끼 · 눈꺼풀 부음","short":"눈두덩이 붓고 아플 때","tags":["다래끼","눈","눈꺼풀","맥립종","산립종","눈다래끼","결막염"],"lead":"눈꺼풀 가장자리가 붓고 아프면 다래끼예요. 1차 치료는 약이 아니라 **하루 3~4번 온찜질**이고, 대부분 1~2주면 저절로 좋아집니다. 안연고는 고름이 잡히거나 눈꺼풀 가장자리가 붉게 부었을 때 보조로 써요. **짜면 안 돼요** — 염증이 눈꺼풀 속으로 퍼집니다.","planTitle":"다래끼, 순서","planLabel":"온찜질이 약보다 먼저예요","plan":[{"slot":"1순위","title":"온찜질 하루 3~4번","why":"따뜻한 수건으로 5~10분씩. 막힌 기름샘이 뚫려 저절로 배출돼요. 지침이 1차 치료로 두는 방법이에요.","options":[],"pick":""},{"slot":"세정","title":"눈꺼풀 닦기","why":"속눈썹 뿌리를 부드럽게 닦아 기름샘 입구를 열어 줍니다. 온찜질 뒤에 하면 효과적이에요.","options":[],"pick":""},{"slot":"약","title":"항생제 안연고 — 보조로","why":"고름이 잡히거나 눈꺼풀 가장자리가 붉게 부었을 때. 1주 이내로 쓰세요.","options":["oxytetracycline-eye"],"pick":"oxytetracycline-eye","optional":true},{"slot":"통증","title":"아프면 아세트아미노펜","why":"붓고 욱신거릴 때 도움이 돼요.","options":["acetaminophen"],"pick":"acetaminophen","optional":true}],"how":["**따뜻한 수건(40도 정도)으로 5~10분, 하루 3~4번** 눈을 덮으세요. 수건이 식으면 다시 데워서요.","온찜질 뒤 깨끗한 면봉이나 손가락으로 속눈썹 뿌리를 부드럽게 닦아 주세요.","안연고는 아래 눈꺼풀을 살짝 당겨 안쪽에 쌀알 크기로 넣고 눈을 감아 굴려 주세요. 하루 2~4번, 1주 이내로요.","치료 중에는 콘택트렌즈와 눈 화장을 쉬세요.","안연고를 넣으면 잠깐 흐려요. 바로 운전하지 마세요."],"pharmacy":["약사님께 “다래끼가 났어요. 안연고 주세요”라고 말씀하세요.","콘택트렌즈를 끼시는지, 눈이 아프거나 시력이 떨어졌는지 말씀해 주세요. 시력 변화가 있으면 약이 아니라 안과예요."],"selfcare":["**손을 자주 씻고 눈을 만지지 마세요.** 반대쪽 눈이나 가족에게 옮길 수 있어요.","수건과 베갯잇을 따로 쓰고 자주 갈아 주세요.","눈 화장품은 치료가 끝날 때까지 쉬시고, 오래된 것은 버리세요.","다래끼가 자주 나면 눈꺼풀 청결 습관(하루 한 번 온찜질과 세정)을 들이면 재발이 줄어요.","잠이 부족하고 피곤할 때 잘 생겨요. 쉬는 것도 치료예요."],"avoid":["**짜지 마세요.** 염증이 눈꺼풀 속과 눈 주위로 퍼질 수 있어요.","바늘로 터뜨리지 마세요.","스테로이드 안약을 임의로 쓰지 마세요. 안압이 오를 수 있어요.","치료 중 콘택트렌즈를 끼지 마세요.","다른 사람이 쓰던 안약을 쓰지 마세요."],"notWorking":{"title":"잘 낫지 않으면","steps":["온찜질을 **하루 3~4번, 5~10분씩** 제대로 하고 계신지 봐 주세요. 잠깐 대는 정도로는 부족해요.","1~2주가 지나도 아프지 않은 덩어리가 남으면 산립종이에요. 안과에서 간단히 제거하거나 주사로 녹입니다.","붓기가 눈꺼풀을 넘어 얼굴로 번지거나 열이 나면 안와 주위 감염이에요. **그날 바로 진료**를 받으세요.","눈알 자체가 아프거나 시력이 떨어지거나 물체가 둘로 보이면 응급이에요.","같은 자리에 자꾸 재발하면 드물게 다른 병일 수 있어 안과 확인이 필요해요."]},"care":{"pharmacy":["눈꺼풀 가장자리만 붓고 아픔","시력이 정상이고 눈알은 안 아픔","열이 없음"],"clinic":["1~2주가 지나도 덩어리가 남음","자주 재발함","눈곱이 많고 양쪽이 붉음(결막염 감별)","당뇨·면역저하가 있음"],"er":["붓기가 얼굴로 번지고 열이 남(안와 봉와직염)","눈알을 움직일 때 아프거나 눈이 튀어나온 느낌","시력 저하, 물체가 둘로 보임"]},"faq":[{"q":"다래끼는 옮나요?","a":"다래끼 자체가 쉽게 옮지는 않지만, **손으로 만진 뒤 다른 눈을 비비면 반대쪽에 생길 수 있어요.** 수건을 따로 쓰고 손을 자주 씻으세요."},{"q":"안 아픈 몽우리가 남았어요.","a":"산립종(콩다래끼)이에요. 염증은 가라앉고 기름 덩어리만 남은 상태라 항생제로는 잘 안 없어져요. 온찜질을 몇 주 더 해 보고, 그대로면 **안과에서 5분이면 제거**됩니다."}],"sources":["mcginley2022eye"]}],"tips":[{"id":"brand-vs-ingredient","title":"타이레놀은 ‘상품 이름’이에요","icon":"pill","body":"타이레놀은 회사가 붙인 상품명이고, 약효를 내는 **성분**은 아세트아미노펜이에요. 같은 성분이 세토펜·써스펜에도 들어 있고, **판피린·판콜·테라플루 같은 감기약에도 300~650 mg씩** 들어 있어요. 그래서 ‘타이레놀은 안 먹었는데’ 하면서 감기약과 겹쳐 먹는 일이 가장 흔한 과량 사고예요. 약 상자 뒷면의 **성분명**을 보는 습관이 안전의 절반이에요.","link":"/drug/acetaminophen","linkText":"아세트아미노펜 성분 보기"},{"id":"fever-not-cure","title":"해열제는 ‘치료’가 아니라 ‘증상 조절’이에요","icon":"temp","body":"해열제는 열을 잠시 내려 몸을 편하게 해 줄 뿐, 열의 **원인(감염 등)을 없애지는 않아요**. 그래서 열이 내렸다고 다 나은 게 아니고, 해열제로 버티는 동안 원인이 자라기도 해요. **3일 넘게 열이 계속되거나, 내렸다가 다시 오르거나, 아이가 처지면** 약을 더 사지 말고 병원에서 원인을 확인하세요.","link":"/symptom/fever","linkText":"열이 날 때 병원 기준 보기"},{"id":"one-nsaid","title":"소염제는 한 번에 한 가지만","icon":"scale","body":"이부프로펜·나프록센·아스피린·게보린(IPA)·펜잘(에텐자미드)·처방 소염제(아세클로페낙 등)는 모두 **같은 계열**이라, 겹쳐 먹으면 효과는 그대로고 **위장·신장 부담만 두 배**예요. 진통을 더하고 싶으면 계열이 다른 아세트아미노펜을 **함께** 드세요 — 이 조합은 각각 단독보다 잘 듣는다는 근거가 있어요.","link":"/class/nsaid","linkText":"소염제 비교 보기"},{"id":"tid","title":"‘하루 3번 식후’의 뜻","icon":"clock","body":"처방전의 ‘1일 3회 식후 30분’은 **아침·점심·저녁 밥 먹고 30분 뒤**, 대략 **8시간 간격**이라는 뜻이에요. 끼니를 걸렀다고 약을 거르지 말고, 우유나 간식과 함께 드세요(소염제는 빈속을 피해야 해요). 한 번 잊었으면 생각난 즉시 드시되, 다음 시간이 가까우면 건너뛰고 **두 배로 먹지 마세요**.","link":"/schedule","linkText":"복용 시간 알림 만들기"},{"id":"apap-total","title":"아세트아미노펜은 하루 4 g이 끝","icon":"alert","body":"500 mg 정제로 8정이에요. 감기약·복합진통제·수면유도제 속 아세트아미노펜까지 **모두 합쳐서** 4 g이고, 술을 자주 드시거나 체중이 적으면 3 g 이하가 안전해요. 이 선을 넘기면 간이 다치는데, 초기엔 증상이 없어서 더 위험해요.","link":"/drug/acetaminophen","linkText":"총량 계산 기준 보기"},{"id":"elderly","title":"어르신 약, 세 가지만 기억하세요","icon":"user","body":"① 소염제는 **위보호제와 함께, 짧게** — 65세 이상은 위장출혈·신장 부담이 커요. ② **감기약·수면유도제·멀미약**(1세대 항히스타민)은 어지럼·낙상·소변 막힘을 일으켜 되도록 피해요. ③ 드시는 약을 **한 장에 적어** 약국·병원에 보여 주세요 — 이 앱의 ‘내 약통’이 그 한 장이에요.","link":"/me","linkText":"내 약통 정리하기"},{"id":"two-names","title":"약 이름이 두 개인 이유","icon":"pill","body":"약에는 이름이 둘이에요. **성분명**은 세계 어디서나 같은 진짜 이름이고, **상품명**은 회사가 붙인 별명이에요. 아세트아미노펜이라는 한 성분에 타이레놀·세토펜·써스펜 같은 별명이 여럿 붙는 거예요. 병원에서 받은 약과 약국에서 산 약이 겹치는지 보려면 **상자 뒷면의 성분명**을 보셔야 해요. 이름이 달라도 성분이 같으면 두 배로 드시는 셈이에요.","link":"/pill","linkText":"내 약 성분 확인하기"},{"id":"expiry","title":"약에도 유통기한이 있어요","icon":"clock","body":"상자에 적힌 날짜는 **뜯지 않은 상태**의 기한이에요. 뜯은 뒤에는 훨씬 짧아져요. 가루약·물약은 대개 **한 달**, 안약은 뜯고 **한 달**, 일회용 인공눈물은 **그날** 버리세요. 조제받은 약은 그 병에 대해 처방된 것이라 다음에 비슷한 증상이라고 남은 걸 드시면 안 돼요. 색이 변하거나 냄새가 나거나 알약이 부스러지면 기한과 상관없이 버리세요.","link":"","linkText":""},{"id":"storage","title":"약은 어디에 두어야 할까요","icon":"info","body":"대부분의 약은 **서늘하고 건조하고 빛이 안 드는 곳**이 좋아요. 흔한 실수가 두 가지예요. 첫째, **화장실 선반** — 습기와 온도 변화가 커서 약이 가장 빨리 상하는 곳이에요. 둘째, **원래 상자를 버리는 것** — 상자에 유효기간과 성분이 적혀 있어요. 시럽은 냉장이 필요한 것과 아닌 것이 나뉘니 라벨을 확인하세요. 남은 약은 쓰레기통이 아니라 **약국의 폐의약품 수거함**에 넣어 주세요.","link":"","linkText":""},{"id":"with-water","title":"약은 물로 드셔야 하는 이유","icon":"drop","body":"물 말고 다른 음료로 드시면 약이 달라져요. **자몽주스**는 여러 약의 분해를 막아 농도를 위험하게 올려요. **우유·제산제**는 일부 항생제와 골다공증약이 흡수되는 것을 막아요. **녹차·홍차**는 철분제 흡수를 떨어뜨려요. **술**은 거의 모든 약과 나쁘게 만나고, 특히 아세트아미노펜과는 간에, 소염제와는 위에 부담을 줍니다. 물 한 컵을 가득, 그리고 삼킨 뒤 바로 눕지 마세요.","link":"","linkText":""},{"id":"cut-pill","title":"알약을 반으로 잘라도 될까요","icon":"pill","body":"**가운데 홈이 있으면** 자르라고 만든 약이니 잘라도 돼요. 홈이 없으면 자르지 마세요. 특히 이름에 **‘서방정·이알(ER)·CR·XR’**이 붙은 약은 하루 종일 조금씩 녹아 나오게 만든 약이라, 자르거나 씹으면 하루치가 한꺼번에 쏟아져 위험할 수 있어요. 캡슐을 열어 가루만 드시는 것도 같은 이유로 함부로 하면 안 돼요. 삼키기 힘드시면 **같은 성분의 시럽이나 잘라도 되는 제품**이 있는지 약사에게 물어보세요.","link":"","linkText":""},{"id":"missed-dose","title":"약을 깜빡했을 때","icon":"clock","body":"원칙은 하나예요. **생각났을 때 바로 드시되, 다음 먹을 시간이 가까우면 건너뛰세요.** 절대 두 배로 드시면 안 돼요. 하루 세 번 약을 저녁에 깜빡했다면 그냥 넘기고 다음 날 아침부터 이어 가시면 됩니다. 다만 **항생제**는 다르게 봐요 — 자꾸 거르면 균이 약에 버티는 힘을 길러요. 정해진 날짜만큼 끝까지 드셔야 해요. 자주 깜빡하신다면 알림을 맞춰 두세요.","link":"/schedule","linkText":"복용 시간 알림 만들기"},{"id":"before-after-meal","title":"식전·식후가 정해진 이유","icon":"stomach","body":"**식후**는 대개 위를 보호하려는 뜻이에요. 소염제처럼 위에 부담이 큰 약이 여기 들어가요. **식전 30분**은 음식이 흡수를 방해하거나, 밥 먹기 전에 미리 작용해야 하는 약이에요 — 위산 억제제나 일부 당뇨약이 그렇습니다. **공복(식전 1시간·식후 2시간)**은 음식이 있으면 아예 흡수가 안 되는 약이에요. 갑상선약과 골다공증약이 대표적이에요. 헷갈리면 봉투에 적힌 대로가 정답이고, 그게 없으면 약사에게 물어보세요.","link":"","linkText":""},{"id":"antibiotics","title":"항생제는 끝까지, 감기엔 안 써요","icon":"shield","body":"항생제는 **세균**을 죽이는 약이에요. 감기와 독감은 **바이러스**라 항생제가 듣지 않아요. 그런데도 쓰면 몸속 좋은 균만 죽어 설사가 나고, 다음에 진짜 필요할 때 약이 안 듣게 돼요. 처방받은 항생제는 **증상이 좋아져도 정해진 날짜까지** 드셔야 해요. 중간에 끊으면 살아남은 균이 더 강해집니다. 그리고 **남은 항생제를 보관했다가 다음에 드시는 것**은 가장 흔하고 위험한 습관이에요.","link":"","linkText":""},{"id":"steroid-fear","title":"스테로이드, 무서워만 할 일은 아니에요","icon":"info","body":"스테로이드는 염증을 끄는 힘이 아주 센 약이에요. 어르신들이 ‘뼈 녹는 약’이라며 겁내시는데, **문제가 되는 건 오래 먹거나 넓게 오래 바를 때**예요. 피부에 며칠 바르거나 관절에 가끔 주사 맞는 것은 대개 안전합니다. 반대로 **함부로 오래 쓰면** 정말 문제가 돼요 — 무좀에 스테로이드를 바르면 곰팡이가 번지고, 얼굴에 오래 바르면 피부가 얇아져요. **의사가 정해 준 기간을 지키는 것**, 그리고 **먹는 스테로이드를 갑자기 끊지 않는 것**이 핵심이에요.","link":"","linkText":""},{"id":"polypharmacy","title":"먹는 약이 다섯 가지가 넘는다면","icon":"user","body":"여러 병원에서 약을 받다 보면 같은 성분이 겹치거나 서로 부딪히는 일이 생겨요. 특히 어르신은 **졸림·어지럼·변비·소변 막힘**이 겹쳐 낙상으로 이어지기 쉬워요. 일 년에 한 번은 **드시는 약을 전부 한 봉투에 담아** 의사나 약사에게 보여 주세요. 이걸 약 정리(복약 점검)라고 하는데, 빼도 되는 약이 생각보다 많이 나옵니다. 이 앱의 ‘내 약통’에 등록해 두시면 성분이 겹치는지 자동으로 알려 드려요.","link":"/me","linkText":"내 약통에 등록하기"},{"id":"generic","title":"복제약은 효과가 떨어지나요","icon":"scale","body":"아니요. 복제약(제네릭)은 **오리지널 약과 성분·함량이 같고, 몸에 흡수되는 양도 같다는 시험(생물학적동등성)을 통과해야만** 허가가 나요. 값이 싼 이유는 개발비가 들지 않았기 때문이지 약이 부실해서가 아니에요. 다만 색·모양·크기는 다를 수 있어서, 병원이나 약국을 옮기면 같은 약인데 모양이 달라 놀라시는 경우가 많아요. 그럴 때는 **성분명이 같은지** 확인하시면 됩니다.","link":"/pill","linkText":"낱알 모양으로 찾아보기"},{"id":"supplement-not-drug","title":"영양제는 약이 아니에요","icon":"leaf","body":"건강기능식품은 **부족한 것을 채우는 것**이지 병을 고치는 약이 아니에요. 그런데 약처럼 작용하는 것들이 있어 조심해야 해요. **오메가3와 은행잎은** 피 묽게 하는 약과 만나면 출혈 위험을 올리고, **칼슘·철분·마그네슘은** 갑상선약과 일부 항생제의 흡수를 막아요. 수술 예정이면 **일주일 전에는 알리셔야** 합니다. 그리고 종합비타민과 개별 영양제를 같이 드시면 상한을 넘기기 쉬워요.","link":"/supp","linkText":"내 영양제 겹치는지 보기"},{"id":"elderly-caution","title":"어르신이 특히 조심할 약","icon":"user","body":"나이가 들면 콩팥과 간이 약을 처리하는 속도가 느려져 **같은 양이라도 더 세게 작용**해요. 특히 조심할 것들이에요. **졸리는 감기약·수면유도제·멀미약**(항히스타민)은 어지럼과 소변 막힘, 낙상을 부릅니다. **소염제**는 위장 출혈과 콩팥 부담이 젊을 때보다 훨씬 커요. **근이완제**는 졸음으로 넘어지기 쉬워요. 그래서 어르신께는 아세트아미노펜과 바르는 약을 먼저 권해요. 새 약을 드시고 어지럽거나 멍하면 참지 마시고 알리세요.","link":"/me","linkText":"내 정보에 65세 이상 표시하기"},{"id":"when-er","title":"이럴 땐 약 대신 119","icon":"alert","body":"약으로 버티면 안 되는 신호가 있어요. **가슴이 짓눌리듯 아프고 식은땀이 남**(심근경색), **말이 어눌하거나 한쪽 팔다리에 힘이 빠짐**(뇌졸중), **난생처음 겪는 심한 두통**, **숨이 차고 입술이 파래짐**, **피를 토하거나 검은 변**, **의식이 흐려짐**. 특히 뇌졸중과 심근경색은 **시간이 곧 후유증**이에요. 애매하면 기다리지 마시고 119에 전화하세요. 아니어도 괜찮습니다 — 늦는 것보다 낫습니다.","link":"","linkText":""}],"public":{"easy_count":4766,"pills_count":24694,"pills_otc":5660,"easy_source":"OpenData_EasyExcelListC20250802_mod.csv","pills_source":"OpenData_PotOpenTabletIdntfcC20221021.csv","mapped":2222,"with_image":2371,"license":"식품의약품안전처 공공데이터(공공데이터포털) — 이용허락범위 제한 없음, 출처 표시. 낱알 이미지 제작: 약학정보원","chunk":200},"art":["hero-home","guide-2-pharmacy","guide-3-take","pill-search","schedule","supp-label","kids-dose","easy-mode"]}</script>
<script>
/* ───────── 데이터·유틸 ───────── */
const D = JSON.parse(document.getElementById('data').textContent || '{}');
const BUILD = '2026-09-08';
const byId = (arr, id) => (arr || []).find(x => x.id === id);
const drug = id => byId(D.drugs, id);

const FLAG_Q = {

  heart:'고혈압·심장병이 있어요', anticoag:'피를 묽게 하는 약(항응고제·아스피린)을 먹어요',

  gout:'통풍이 있어요', senior:'65세 이상이에요', child:'소아·청소년(15세 미만)이에요'

const isAgeFlag = k => k === 'senior' || k === 'child';
const flagOn = k => isAgeFlag(k) ? ME.age === k : !!ME[k];
function flagScore(s){
  const sc = {};
  for (const p of (s?.plan || [])) for (const id of (p.options || [])) {
    const d = drug(id); if (!d) continue;
    for (const a of (d.avoid || [])) for (const f of (a.flags || [])) sc[f] = (sc[f] || 0) + 3;
    for (const c of (d.caution || [])) for (const f of (c.flags || [])) sc[f] = (sc[f] || 0) + 1;
  }

}
/* 상위 n개는 바로 보여 주고 나머지는 접어 둔다. 이미 켜 둔 조건은 접힌 곳에 숨기지 않는다. */
function askFlags(s, n = 3){
  const sc = flagScore(s); const keys = Object.keys(FLAG_Q);

/* ───────── 아이 해열제 용량 (우리집 소아과와 같은 기준) ───────── */
function monthsFrom(birth){ if (!birth) return null; const b = new Date(birth); if (isNaN(b)) return null; const n = new Date(); let m = (n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth()); if (n.getDate() < b.getDate()) m--; return m >= 0 ? m : null; }
function kidAgeText(m){ if (m == null) return ''; return m < 24 ? `생후 ${m}개월` : `만 ${Math.floor(m / 12)}세 ${m % 12 ? (m % 12) + '개월' : ''}`.trim(); }
function kidDose(k, w, m){
  const D = (D_KIDS().drugs || []).find(x => x.id === k); if (!D || !(w > 0)) return null;
  const rawLo = w * D.perKg[0], rawHi = w * D.perKg[1];

}
const D_KIDS = () => D.kids || {};

    if (k && (k.weight || k.birth)) { ME.child = { name: k.name || '', birth: k.birth || '', weight: parseFloat(k.weight) || '' }; ME.age = 'child'; saveMe(); toast(`${k.name || '아이'} 정보를 가져왔어요`); route(); return; }

  try { const j = JSON.parse(t); const k = j.kid || j; if (k.weight || k.birth) { ME.child = { name: k.name || '', birth: k.birth || '', weight: parseFloat(k.weight) || '' }; ME.age = 'child'; saveMe(); route(); return; } } catch (e) {}
  const parts = t.split(/[,\s]+/).filter(Boolean); const birth = parts.find(x => /^\d{4}-\d{2}-\d{2}$/.test(x)) || ''; const weight = parseFloat(parts.find(x => /^\d+(\.\d+)?$/.test(x) && +x < 120 && +x > 1)) || ''; const name = parts.find(x => /^[가-힣]{1,6}$/.test(x)) || '';
  if (birth || weight) { ME.child = { name, birth, weight }; ME.age = 'child'; saveMe(); route(); } else toast('형식을 읽지 못했어요');

/* ───────── 복용 시간 알림 ───────── */
const SLOTS = [['아침', '08:00'], ['점심', '13:00'], ['저녁', '19:00'], ['취침 전', '22:00']];

function takenSet(){ ME.taken = ME.taken || {}; const k = todayKey(); for (const d in ME.taken) if (d !== k) delete ME.taken[d]; ME.taken[k] = ME.taken[k] || []; return ME.taken[k]; }

    NOTI_TIMERS.push(setTimeout(() => { try { new Notification('약지도 · 약 드실 시간', { body: `${d.name} — ${d.simple || ''}`.slice(0, 120), tag: id + t }); } catch (e) {} }, at - now));
  }
}

  const pad = n => String(n).padStart(2, '0'); const d0 = new Date(); const ds = `${d0.getFullYear()}${pad(d0.getMonth() + 1)}${pad(d0.getDate())}`;
