,"en":"Scopolamine (transdermal)","class":"sleep","rx":"일반","tagline":"출발 4시간 전 귀 뒤에 — 어린이용은 처방약","lead":"귀 뒤에 붙이면 3일간 멀미를 막아요. 출발 **최소 4시간 전**에 붙여야 효과가 나고, 붙인 뒤 손을 씻지 않고 눈을 만지면 동공이 커져 시야가 흐려져요. 어린이 키미테(8~15세)는 처방약이고, 7세 이하·임신·녹내장·전립선비대는 금지예요.","for":["멀미 예방(장거리)"],"dose":{"adult":"1매","interval":"72시간(3일)","max":"한 번에 1매","child":"7세 이하 금지 · 8~15세는 처방(어린이 키미테)"},"onset":"4시간","duration":"72시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"pict":["졸음","운전주의","음주금지"],"avoid":[{"text":"7세 이하","flags":["child"]},{"text":"임신·수유","flags":["pregnant"]},{"text":"녹내장","flags":["glaucoma"]},{"text":"전립선비대","flags":["bph"]}],"caution":[{"text":"65세 이상 — 혼란·환각 위험","flags":["senior"]},{"text":"붙인 뒤 손 씻기, 눈 만지지 않기"}],"sideEffects":["입마름","졸음","시야 흐림","드물게 환각(고령)"],"stop":["혼란·환각","시야가 심하게 흐림"],"interactions":[{"with":"항히스타민제·수면유도제","level":"주의","note":"항콜린·진정 상승."},{"with":"술","level":"주의","note":"진정 상승."}],"pregnancy":"금지.","children":"7세 이하 금지, 8~15세 처방.","products":[{"name":"키미테 패취(성인용)","maker":"명문제약","amount":"스코폴라민 1.5 mg/매","rx":"일반"},{"name":"어린이 키미테 패취","maker":"명문제약","amount":"0.75 mg/매 · 처방 필요","rx":"전문"}],"tips":["짧은 이동엔 먹는 멀미약(보나링에이)이 간편해요."],"sources":["mfds_kimite","karrim2022"],"simple":"출발 4시간 전 귀 뒤에 1매. 3일 지속"},{"id":"dimenhydrinate","name":"디멘히드리네이트 (보나링에이)","en":"Dimenhydrinate","class":"sleep","rx":"일반","tagline":"타기 30분~1시간 전 먹는 멀미약 — 졸음은 각오","lead":"코크란 2022: 1세대 항히스타민제(디멘히드리네이트·신나리진)는 실제 이동 상황에서 멀미를 예방했지만(40% vs 25%) 졸음이 더 많았어요. 출발 30분~1시간 전에 먹고, 운전자는 먹지 마세요.","for":["멀미 예방"],"dose":{"adult":"50~100 mg(1~2정)","interval":"4~6시간(필요 시)","max":"라벨 기준 [확인 필요]","child":"소아 용량 라벨 확인"},"onset":"30분~1시간","duration":"4~6시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"pict":["졸음","운전주의","음주금지"],"avoid":[{"text":"녹내장·전립선비대","flags":["glaucoma","bph"]}],"caution":[{"text":"65세 이상 — 항콜린 부담","flags":["senior"]},{"text":"운전자"}],"sideEffects":["졸음","입마름"],"interactions":[{"with":"감기약·수면유도제","level":"주의","note":"항히스타민 중복."}],"pregnancy":"의사 상담.","children":"라벨 확인.","products":[{"name":"보나링에이정","maker":"일양약품","amount":"디멘히드리네이트 50 mg/정","rx":"일반"}],"tips":["뱃멀미·장거리는 키미테, 짧은 차 이동은 이 약."],"sources":["mfds_bonaring","karrim2022"],"simple":"1~2정, 출발 30분~1시간 전"},{"id":"fusidic-acid","name":"퓨시드산 (후시딘)","en":"Fusidic acid (topical)","class":"skin","rx":"일반","tagline":"바르는 항생제 — 감염된 상처에만, 단순 긁힘엔 불필요","lead":"세균(특히 황색포도상구균) 감염된 상처·농가진에 바르는 항생제예요. 코크란에서 무피로신과 동등한 효과. 그러나 **감염 징후(고름·붉게 번짐·열감)가 없는 단순 상처에는 필요 없고**, 습관적으로 쓰면 내성만 키워요. 상처는 흐르는 물로 씻고 습윤 드레싱이 먼저예요.","for":["감염된 상처","농가진","모낭염"],"dose":{"adult":"얇게","interval":"하루 1~2회","max":"1주 이내(호전 없으면 진료)"},"onset":"1~2일","duration":"—","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[],"caution":[{"text":"넓은 부위·장기 사용 → 내성"},{"text":"눈 주위 금지"}],"sideEffects":["국소 자극(드묾)"],"interactions":[],"pregnancy":"국소 사용 가능한 편.","children":"사용 가능.","products":[{"name":"후시딘 연고","maker":"동화약품","amount":"퓨시드산나트륨 20 mg/g","rx":"일반"},{"name":"마데카솔 케어 연고","maker":"동국제약","amount":"네오마이신 + 센텔라 추출물 (다른 항생제)","rx":"일반"}],"tips":["감염 징후가 없으면 바세린·습윤밴드가 흉터 면에서도 더 낫습니다."],"sources":["koning2012","mfds_fucidin"],"simple":"얇게, 하루 1~2번. 1주 이내"},{"id":"mupirocin","name":"무피로신 (박트로반 등)","en":"Mupirocin (topical)","class":"skin","rx":"일반","tagline":"후시딘과 동급의 바르는 항생제 — 분류는 제품별 확인","lead":"농가진·감염 상처에 퓨시드산과 동등한 효과(코크란)를 내는 바르는 항생제예요. 국내 일반의약품 여부는 제품별로 다를 수 있어 [확인 필요]. 코 안 MRSA 제균에도 처방돼요.","for":["감염된 상처","농가진"],"dose":{"adult":"얇게","interval":"하루 2~3회","max":"10일 이내"},"onset":"1~2일","duration":"—","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[],"caution":[{"text":"장기 사용 → 내성"}],"sideEffects":["국소 자극"],"interactions":[],"pregnancy":"국소 사용 가능한 편.","children":"사용 가능.","products":[{"name":"박트로반·베아로반·에스로반 연고","maker":"다수","amount":"무피로신 2%","rx":"일반"}],"tips":[],"sources":["koning2012"],"simple":"얇게, 하루 2~3번. 10일 이내"},{"id":"terbinafine","name":"테르비나핀 크림 (라미실)","en":"Terbinafine (topical)","class":"skin","rx":"일반","tagline":"발 무좀엔 1~2주 바르기 — 발톱 무좀은 먹는 약(처방)","lead":"발가락 사이·발바닥 무좀(백선)에 하루 1~2회 1~2주 바르는 항진균제예요. 증상이 사라져도 며칠 더 발라야 재발이 적어요. **발톱이 두꺼워지고 색이 변한 손발톱 무좀은 크림으로 안 낫고** 먹는 약(처방)이 필요해요.","for":["발 무좀","완선·체부백선"],"dose":{"adult":"환부와 주변에 얇게","interval":"하루 1~2회","max":"1~2주(증상 소실 후 며칠 더)"},"onset":"며칠","duration":"—","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[{"text":"수유 중(허가사항)","flags":["pregnant"]}],"caution":[{"text":"눈 접촉 금지"},{"text":"2주 발라도 안 나으면 진료(다른 피부병 감별)"}],"sideEffects":["국소 자극·벗겨짐"],"interactions":[],"pregnancy":"임신 중 자료 제한, 수유 중 금지.","children":"라벨 확인.","products":[{"name":"라미실 크림 1%","maker":"헤일리온","amount":"테르비나핀 10 mg/g","rx":"일반"}],"tips":["발을 잘 말리고 양말을 매일 갈아 신는 게 약만큼 중요해요."],"sources":["mfds_lamisil"],"simple":"하루 1~2번, 1~2주 (나은 뒤 며칠 더)"},{"id":"triamcinolone","name":"트리암시놀론 연고 (오라메디)","en":"Triamcinolone (oral paste)","class":"skin","rx":"일반","tagline":"구내염에 바르는 스테로이드 — 헤르페스·곰팡이엔 금지","lead":"입안 헐음(아프타성 구내염)에 바르는 약한 스테로이드 연고예요. 염증을 가라앉혀 통증을 줄여요. 하지만 **입술 물집(헤르페스)·하얀 막(칸디다) 같은 감염성 병변에는 오히려 악화**시키니 구분이 중요해요.","for":["아프타성 구내염"],"dose":{"adult":"환부에 소량","interval":"하루 1~수회(식후·취침 전)","max":"1~2주"},"onset":"1~2일","duration":"—","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[{"text":"헤르페스·칸디다 등 감염성 구내염"}],"caution":[{"text":"2주 넘게 안 낫거나 자꾸 재발하면 진료(베체트·영양 결핍 등 감별)"}],"sideEffects":["국소 자극(드묾)"],"interactions":[],"pregnancy":"소량 국소 사용 가능한 편.","children":"라벨 확인.","products":[{"name":"오라메디 연고","maker":"동국제약","amount":"트리암시놀론아세토니드 0.1%","rx":"일반"}],"tips":["물기를 닦고 소량을 얹듯이 바르면 오래 붙어 있어요."],"sources":["mfds_oramedy"],"simple":"물기 닦고 소량을 얹듯이, 하루 1~수회 식후·취침 전"},{"id":"policresulen","name":"폴리크레줄렌 (알보칠)","en":"Policresulen","class":"skin","rx":"일반","tagline":"구내염에 ‘지지는’ 약 — 아프지만 빠름, 희석해서","lead":"강산성 용액으로 헐은 조직을 응고시켜 낫게 해요. 바르는 순간 매우 아프지만 효과는 빠른 편이에요. 원액은 조직 손상·치아 에나멜 손상이 있어 **면봉에 소량, 물로 희석해서, 좁게** 바르는 게 요령이에요.","for":["구내염"],"dose":{"adult":"면봉에 적셔 환부에 여러 번","interval":"하루 1~2회","max":"라벨 기준"},"onset":"즉시(통증), 1~2일(치유)","duration":"—","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[],"caution":[{"text":"치아에 닿지 않게(에나멜 손상)"},{"text":"넓게 바르지 않기"}],"sideEffects":["심한 일시적 통증","조직 하얗게 변함"],"interactions":[],"pregnancy":"국소 소량 가능한 편.","children":"소아는 오라메디가 순해요.","products":[{"name":"알보칠 콘센트레이트액","maker":"다케다","amount":"폴리크레줄렌 36%","rx":"일반"}],"tips":["통증이 두려우면 오라메디(스테로이드)가 순한 대안이에요."],"sources":["mfds_albothyl"],"simple":"면봉에 소량, 물로 희석해서 좁게, 하루 1~2번"},{"id":"artificial-tears","name":"인공눈물 (CMC·히알루론산)","en":"Artificial tears","class":"skin","rx":"일반","tagline":"일회용은 뜯고 바로, 방부제 있는 것은 하루 4회 이내","lead":"눈물층을 보충해 건조·이물감을 줄여요. 카르복시메틸셀룰로오스(CMC) 계열은 약국에서, 히알루론산 계열은 대부분 처방(급여)이에요. 일회용은 개봉 후 재사용 금지, 방부제 든 병 제품은 하루 4회 이내가 원칙이에요.","for":["안구건조","눈 피로·이물감"],"dose":{"adult":"1~2방울","interval":"필요 시(방부제 함유는 하루 4회 이내)","max":"라벨 기준"},"onset":"즉시","duration":"30분~2시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"avoid":[],"caution":[{"text":"충혈 제거제(혈관수축제) 든 제품은 3일 이상 쓰면 반동 충혈"},{"text":"콘택트렌즈는 렌즈용 표시 확인"}],"sideEffects":["일시적 흐림"],"interactions":[],"pregnancy":"사용 가능.","children":"사용 가능.","products":[{"name":"리프레시 플러스·프렌즈 아이드롭 등(CMC)","maker":"앨러간·JW중외","amount":"CMC 0.5% 등","rx":"일반"}],"tips":["하루 4번 넘게 필요하면 일회용 무방부제로.","충혈이 주 증상이면 ‘빨간 눈 빼는 약’ 대신 원인 진료."],"sources":[],"simple":"1~2방울 필요할 때. 방부제 든 병은 하루 4번 이내"},{"id":"pancol-a","name":"판콜에이 내복액","en":"Pancol-A (cold combination)","class":"combo","rx":"안전상비","contains":["acetaminophen","chlorpheniramine","guaifenesin","phenylephrine","caffeine"],"tagline":"편의점 종합감기약 — 1병에 아세트아미노펜 300 mg","lead":"해열진통(아세트아미노펜 300 mg) + 콧물(클로르페니라민 2.5 mg) + 가래(구아이페네신) + 기침(펜톡시베린) + 코막힘(페닐레프린 10 mg) + 카페인이 한 병에 든 종합감기약이에요. 증상이 골고루 있을 때 편하지만, **콧물만 있는데 코막힘약·진통제까지 먹는 셈**이 되기도 해요. 타이레놀과 함께 먹으면 아세트아미노펜이 중복돼요.","for":["감기 종합(콧물·기침·몸살)"],"dose":{"adult":"1병(30 mL)","interval":"식후 30분, 하루 3회","max":"하루 3병","child":"라벨 연령 확인 [확인 필요]"},"onset":"30분","duration":"4~6시간","risk":{"gi":1,"cv":2,"renal":1,"liver":2},"pict":["식후","졸음","운전주의","음주금지"],"avoid":[{"text":"고혈압·심장병(페닐레프린)","flags":["heart"]},{"text":"녹내장·전립선비대","flags":["glaucoma","bph"]},{"text":"MAO억제제"}],"caution":[{"text":"타이레놀 등 아세트아미노펜 제품과 중복","flags":[]},{"text":"65세 이상 — 클로르페니라민","flags":["senior"]},{"text":"매일 음주 3잔 이상","flags":["alcohol","liver"]}],"sideEffects":["졸음","입마름","두근거림"],"interactions":[{"with":"타이레놀·게보린·펜잘·테라플루","level":"주의","note":"아세트아미노펜 총량 하루 4 g 이내로 합산."},{"with":"수면유도제·멀미약","level":"주의","note":"항히스타민 중복."}],"pregnancy":"임신 중 피하고 아세트아미노펜 단일제로.","children":"라벨 확인.","products":[{"name":"판콜에이 내복액","maker":"동화약품","amount":"30 mL/병","rx":"안전상비"},{"name":"판콜에스 내복액(약국용)","maker":"동화약품","amount":"메틸에페드린 함유","rx":"일반"}],"tips":["증상이 한 가지(콧물만·기침만)면 종합감기약 대신 그 성분만 고르는 게 부작용이 적어요."],"sources":["mfds_pancol","desutter2022"],"simple":"1병, 하루 3번 식후 30분. 타이레놀과 같은 시간대 금지"},{"id":"panpyrin-t","name":"판피린티정 / 판피린큐액","en":"Panpyrin (cold combination)","class":"combo","rx":"안전상비","contains":["acetaminophen","chlorpheniramine","caffeine","guaifenesin","methylephedrine"],"tagline":"정제(편의점)와 액상(약국) 성분이 달라요","lead":"판피린티정(편의점)은 아세트아미노펜 300 mg + 클로르페니라민 2 mg + 카페인 30 mg의 단순 조합이고, 판피린큐액(약국)은 여기에 기침(티페피딘)·가래(구아이페네신)·기관지(메틸에페드린 18 mg)가 더해져요. 액상은 고혈압·심장병에 더 조심해야 해요.","for":["감기 종합"],"dose":{"adult":"1정 또는 1병","interval":"하루 3회","max":"하루 3회","child":"라벨 확인"},"onset":"30분","duration":"4~6시간","risk":{"gi":1,"cv":2,"renal":1,"liver":2},"pict":["식후","졸음","운전주의","음주금지"],"avoid":[{"text":"고혈압·심장병(큐액의 메틸에페드린)","flags":["heart"]},{"text":"녹내장·전립선비대","flags":["glaucoma","bph"]}],"caution":[{"text":"아세트아미노펜 제품 중복"},{"text":"65세 이상","flags":["senior"]},{"text":"음주","flags":["alcohol"]}],"sideEffects":["졸음","두근거림(큐액)"],"interactions":[{"with":"타이레놀·테라플루","level":"주의","note":"아세트아미노펜 합산."}],"pregnancy":"피함.","children":"라벨 확인.","products":[{"name":"판피린티정","maker":"동아제약","amount":"AAP 300 + 클로르페니라민 2 + 카페인 30 mg","rx":"안전상비"},{"name":"판피린큐액","maker":"동아제약","amount":"20 mL/병 · 메틸에페드린 18 mg 포함","rx":"일반"}],"tips":[],"sources":["mfds_panpyrin"],"simple":"1정(또는 1병), 하루 3번 식후"},{"id":"theraflu","name":"테라플루 (데이·나이트)","en":"Theraflu","class":"combo","rx":"일반","contains":["acetaminophen","phenylephrine","chlorpheniramine"],"tagline":"1포에 아세트아미노펜 650 mg — 타이레놀과 절대 침","급성 요통(보조)"],"dose":{"adult":"제품 라벨(보통 1회 1~2정 하루 3회) — 함량 [확인 필요]","interval":"6~8시간","max":"라벨 기준 · 2주 이내","child":"15세 미만 금지"},"onset":"1시간","duration":"4시간","risk":{"gi":2,"cv":1,"renal":1,"liver":2},"pict":["졸음","운전주의","음주금지","소아주의"],"avoid":[{"text":"15세 미만","flags":["child"]},{"text":"간질환","flags":["liver"]},{"text":"아스피린 알레르기·위궤양(에텐자미드)","flags":["asthma","ulcer"]}],"caution":[{"text":"65세 이상 낙상","flags":["senior"]},{"text":"음주","flags":["alcohol"]}],"sideEffects":["졸음","소변 색 변화(무해)"],"interactions":[{"with":"소염진통제","level":"주의","note":"에텐자미드가 살리실산계라 위장 부담 합산 — 위보호제 고려."},{"with":"술·수면제","level":"주의","note":"진정 상승."}],"pregnancy":"피함.","children":"15세 미만 금지.","products":[{"name":"신신플렉스정·클리담정·마이펜엑스정·리렉스담정 등","maker":"신신제약·한미약품 외","amount":"클로르족사존 + 에텐자미드 + 카페인","rx":"일반"}],"tips":["“근이완제 들어간 일반약 주세요”라고 하면 이 계열을 줘요."],"sources":["kpa_relaxant","relaxant2023"],"simple":"1정, 하루 3번 식후 (라벨 확인). 졸리면 저녁 위주로, 2주 이내","faq":[{"q":"근이완제는 꼭 필요한가요?","a":"담 결림·뭉침이 뚜렷할 때 소염제에 붙이면 도움이 되지만 효과는 작은 편이고 졸려요. 뭉침이 없으면 빼도 돼요. 처방 근이완제(에페리손)가 필요하면 진료를."}]},{"id":"clotrimazole","name":"클로트리마졸 크림 (아졸계 무좀약)","en":"Clotrimazole (topical)","class":"antifungal","rx":"일반","tagline":"무좀·완선·칸디다에 두루 쓰는 기본 항진균 크림","lead":"곰팡이(진균)의 세포막을 만들지 못하게 막는 아졸계 약이에요. 발 무좀뿐 아니라 사타구니 완선, 몸의 어루러기, 칸디다 피부염까지 두루 써요. 코크란 분석에서 위약보다 확실히 잘 낫지만(실패 RR 0.30), **테르비나핀 같은 알릴아민계보다는 조금 덜 효과적이고 더 오래(2~4주) 발라야** 해요.","for":["발 무좀","완선(사타구니)","어루러기","피부 칸디다"],"dose":{"adult":"환부와 그 주변 2 cm까지 얇게","interval":"하루 2~3회","max":"2~4주 (증상이 사라진 뒤에도 1~2주 더)"},"onset":"1~2주","duration":"—","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"pict":["단기만"],"avoid":[],"caution":[{"text":"눈·점막에 닿지 않게 하세요"},{"text":"4주를 발라도 낫지 않으면 무좀이 아닐 수 있어요(습진·건선). 진료로 확인하세요"},{"text":"스테로이드가 섞인 복합 연고를 무좀에 오래 쓰면 곰팡이가 더 번져요"}],"sideEffects":["바른 자리의 따가움·붉어짐","드물게 접촉피부염"],"stop":["바른 부위가 심하게 붓거나 물집이 생기면 중단하고 약사·의사와 상의하세요"],"interactions":[],"pregnancy":"국소 사용은 흡수가 매우 적어 비교적 안전하다고 봐요. 그래도 임신 중이면 약사와 상의하세요.","children":"소아도 쓸 수 있어요. 기저귀 부위는 의사 지시에 따라요.","products":[{"name":"카네스텐 크림 1%","maker":"바이엘","amount":"클로트리마졸 10 mg/g","rx":"일반"},{"name":"카네스텐 질정·크림","maker":"바이엘","amount":"질칸디다용 별도 제품","rx":"일반"}],"tips":["발가락 사이가 짓무르는 형태면 크림보다 파우더·용액이 편할 수 있어요.","양말은 매일 갈고, 신발은 이틀에 한 번씩 번갈아 신어 말리세요."],"sources":["crawford2007topical","nedrug_search"],"simple":"하루 2~3번, 2~4주 (나은 뒤에도 1~2주 더)","faq":[{"q":"테르비나핀과 무엇이 다른가요?","a":"둘 다 곰팡이를 잡지만 **테르비나핀(알릴아민)이 조금 더 잘 듣고 기간도 짧아요**(코크란: 실패 위험 RR 0.63). 대신 클로트리마졸은 칸디다까지 폭넓게 들어서 사타구니·접히는 부위에 자주 써요."}]},{"id":"amorolfine","name":"아모롤핀 네일라카 (발톱 무좀)","en":"Amorolfine nail lacquer","class":"antifungal","rx":"일반","tagline":"발톱 무좀에 일주일 1~2번 바르는 매니큐어형 — 6~12개월","lead":"발톱이 두꺼워지고 누렇게 변하는 손발톱 무좀에 쓰는 매니큐어형 약이에요. 일반 크림은 발톱을 못 뚫어서 소용이 없어요. 다만 **국소 치료만으로는 완치율이 낮고 아주 오래 걸려요** — 손톱 6개월, 발톱 9~12개월. 발톱 여러 개가 심하게 상했다면 먹는 약(처방)이 훨씬 확실해요.","for":["손발톱 무좀(조갑백선)"],"dose":{"adult":"줄로 표면을 갈아낸 뒤 얇게","interval":"일주일에 1~2회","max":"손톱 6개월 · 발톱 9~12개월"},"onset":"수개월","duration":"—","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"pict":[],"avoid":[],"caution":[{"text":"바르기 전 동봉된 줄로 병든 발톱 표면을 갈아 내야 약이 들어가요"},{"text":"3개월 이상 써도 새로 자라는 부분이 깨끗하지 않으면 진료로 먹는 약을 상의하세요"},{"text":"당뇨가 있으면 발톱을 직접 갈지 마시고 병원에서 처치받으세요","flags":[]}],"sideEffects":["발톱 주변 자극·변색"],"stop":["발가락이 붉게 붓고 아프면(봉와직염 의심) 중단하고 진료를 받으세요"],"interactions":[],"pregnancy":"임신·수유 중 자료가 제한적이에요. 의사와 상의하세요.","children":"소아 사용 자료가 부족해요.","products":[{"name":"로세릴 네일라카 5%","maker":"갈더마","amount":"아모롤핀 50 mg/g","rx":"일반"}],"tips":["치료 중에는 매니큐어를 바르지 마세요.","가족이 같이 걸리는 일이 많아요. 발수건·슬리퍼를 따로 쓰세요."],"sources":["crawford2007topical","bellsyer2012oral","nedrug_search"],"simple":"주 1~2번, 손톱 6개월 · 발톱 9~12개월","faq":[{"q":"먹는 약이 더 낫다던데요?","a":"네. 발톱 무좀은 먹는 테르비나핀이 훨씬 완치율이 높아요(코크란: 그리세오풀빈 대비 RR 2.26). 다만 **간 수치 확인이 필요한 처방약**이라 병원에서 시작해요. 발톱 한두 개만 가볍게 상했다면 네일라카부터 해 볼 만해요."}]},{"id":"hemorrhoid-topical","name":"치질 연고·좌약","en":"Topical haemorrhoid preparations","class":"hemorrhoid","rx":"일반","tagline":"아픔·가려움을 바로 눅여 주는 국소약 — 1주 이내로","lead":"치질(치핵) 부위에 직접 바르거나 넣는 약이에요. 제품마다 성분이 다른데 대개 **국소마취제(리도카인 등)로 통증·가려움을 줄이고, 수렴·소염 성분으로 붓기를 눅이는** 조합이에요. 증상을 눌러 주는 약이지 치핵을 없애는 약은 아니에요. 근본 해결은 변을 부드럽게 만드는 것이에요.","for":["치핵 통증","항문 가려움","배변 시 출혈"],"dose":{"adult":"배변 후·취침 전 환부에","interval":"하루 1~2회","max":"1주일 이내 (길어지면 진료)"},"onset":"바르고 수십 분","duration":"—","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"pict":["단기만"],"avoid":[],"caution":[{"text":"스테로이드가 든 제품은 1주를 넘기지 마세요. 오래 쓰면 항문 피부가 얇아져요"},{"text":"출혈이 반복되면 치질이라 단정하지 마세요. 대장 질환 감별이 필요해요"},{"text":"제품마다 성분이 달라요. 사시기 전에 성분을 약사에게 확인하세요"}],"sideEffects":["국소 자극·따가움","드물게 접촉피부염"],"stop":["피가 멎지 않거나 덩어리가 딱딱하게 튀어나와 심하게 아프면(혈전성 치핵) 바로 진료를 받으세요"],"interactions":[],"pregnancy":"임신·수유 중에는 성분에 따라 다르니 반드시 약사와 상의하세요.","children":"소아는 의사 지시에 따라요.","products":[{"name":"약국 치질 연고·좌약","maker":"여러 제조사","amount":"제품마다 성분·함량이 달라요 [확인 필요]","rx":"일반"}],"tips":["좌약은 냉장 보관하면 넣기 쉬워요.","약보다 좌욕과 섬유질이 오래가는 효과를 내요."],"sources":["perera2012phlebo","nedrug_search"],"simple":"배변 후·자기 전 하루 1~2번, 1주 이내","faq":[{"q":"연고와 좌약 중 뭐가 나은가요?","a":"항문 **밖이 아프고 가려우면 연고**, **안쪽에서 피가 나고 뻐근하면 좌약**이 편해요. 둘 다 쓰는 제품도 많아요."}]},{"id":"diosmin","name":"디오스민 (먹는 치질약)","en":"Diosmin / flavonoid phlebotonics","class":"hemorrhoid","rx":"일반","tagline":"출혈·가려움을 줄이는 먹는 치질약 — 통증에는 근거가 약해요","lead":"감귤류에서 얻은 플라보노이드 계열로, 정맥의 탄력을 높이고 모세혈관이 새는 것을 줄여 줘요. 코크란 분석에서 **출혈(OR 0.12)과 가려움(OR 0.23), 전반적인 증상 개선에서 뚜렷한 효과**가 확인됐어요. 다만 **통증 자체는 통계적으로 유의한 개선이 없었어요.** 아플 때는 국소약·좌욕을 같이 쓰세요.","for":["치핵 출혈","항문 가려움·불편감","하지정맥 부종"],"dose":{"adult":"제품 라벨 기준 (급성기엔 며칠간 증량 후 유지)","interval":"하루 1~2회","max":"제품 라벨을 따르세요 [확인 필요]"},"onset":"며칠","duration":"—","risk":{"gi":2,"cv":1,"renal":1,"liver":1},"pict":["식후"],"avoid":[],"caution":[{"text":"임신·수유 중에는 의사와 상의하세요","flags":["pregnant"]},{"text":"2주 이상 먹어도 출혈이 계속되면 진료를 받으세요"}],"sideEffects":["속 불편감·설사","드물게 두통"],"stop":["검은 변, 어지러움, 빈혈 증상이 있으면 바로 진료를 받으세요"],"interactions":[],"pregnancy":"임신 중 사용 자료가 제한적이에요. 의사와 상의하세요.","children":"소아 사용은 권하지 않아요.","products":[{"name":"약국 디오스민 제제","maker":"여러 제조사","amount":"제품마다 함량이 달라요 [확인 필요]","rx":"일반"}],"tips":["먹는 약만으로는 부족해요. 섬유질·물·좌욕과 같이 하세요."],"sources":["perera2012phlebo","nedrug_search"],"simple":"라벨대로 하루 1~2번, 식후","faq":[{"q":"먹으면 치질이 없어지나요?","a":"아니요. **출혈과 가려움을 줄여 주는 약**이지 늘어난 혈관을 되돌리진 못해요. 3~4단계 치핵이나 반복 출혈은 수술·시술이 답인 경우가 많아요."}]},{"id":"antihistamine-topical","name":"바르는 가려움약 (물린 데·두드러기)","en":"Topical antihistamine / anaesthetic","class":"skin","rx":"일반","tagline":"모기·벌레 물린 자리에 시원하게 — 넓게 오래는 금지","lead":"디펜히드라민 같은 항히스타민과 리도카인, 멘톨·캄파를 섞어 **가려움과 화끈거림을 바로 눅여 주는** 약이에요. 물린 자리처럼 좁은 부위에 며칠 쓰기에 알맞아요. 넓은 부위에 오래 바르면 오히려 접촉피부염이 생길 수 있어요.","for":["모기·벌레 물림","가벼운 두드러기","땀띠"],"dose":{"adult":"물린 자리에 소량","interval":"하루 3~4회","max":"3~4일"},"onset":"수 분","duration":"2~4시간","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"pict":["단기만","햇빛주의"],"avoid":[],"caution":[{"text":"눈 주위·점막·상처 난 피부에는 바르지 마세요"},{"text":"먹는 항히스타민제와 같이 쓸 때는 넓게 바르지 마세요(흡수 증가)"},{"text":"2세 미만은 의사와 상의하세요","flags":["child"]}],"sideEffects":["따가움","드물게 광과민·접촉피부염"],"stop":["바른 자리가 더 붉고 넓게 번지면 중단하세요(접촉피부염 가능)"],"interactions":[],"pregnancy":"좁은 부위 단기 사용은 대체로 괜찮아요. 넓게 쓰기 전엔 상의하세요.","children":"제품마다 연령 제한이 달라요. 라벨을 확인하세요.","products":[{"name":"약국 벌레 물린 데 바르는 약","maker":"여러 제조사","amount":"디펜히드라민·리도카인·멘톨 등 복합 [확인 필요]","rx":"일반"}],"tips":["긁는 대신 얼음을 수건에 싸서 10분 대면 가려움이 훨씬 빨리 가라앉아요."],"sources":["nedrug_search"],"simple":"물린 자리에만 하루 3~4번, 3~4일","faq":[]},{"id":"oxytetracycline-eye","name":"안연고 (항생제)","en":"Ophthalmic antibiotic ointment","class":"skin","rx":"일반","tagline":"다래끼·눈꺼풀 염증에 짧게 — 온찜질이 먼저예요","lead":"눈꺼풀에 생긴 다래끼나 가벼운 세균성 눈꺼풀염에 쓰는 항생제 안연고예요. 다만 **다래끼의 1차 치료는 약이 아니라 하루 3~4번 온찜질**이고, 대부분 1~2주에 저절로 좋아져요(FP Essentials 2022). 안연고는 고름이 잡히거나 눈꺼풀 가장자리가 붉게 부었을 때 보조로 써요.","for":["다래끼(맥립종)","가벼운 눈꺼풀염"],"dose":{"adult":"아래 눈꺼풀 안쪽에 쌀알 크기","interval":"하루 2~4회","max":"1주일 이내"},"onset":"1~3일","duration":"—","risk":{"gi":1,"cv":1,"renal":1,"liver":1},"pict":["단기만"],"avoid":[],"caution":[{"text":"바른 뒤 잠깐 흐릿해요. 바로 운전하지 마세요"},{"text":"콘택트렌즈는 치료 동안 빼 두세요"},{"text":"눈이 아프거나 시력이 떨어지면 안연고로 버티지 말고 안과에 가세요"}],"sideEffects":["일시적 시야 흐림","따가움"],"stop":["눈 통증, 시력 저하, 눈알이 붉고 아프면 즉시 안과 진료"],"interactions":[],"pregnancy":"테트라사이클린 계열은 임신 중 전신 투여를 피해요. 눈에 쓰는 소량이라도 임신 중이면 상의하세요.","children":"소아는 제품 라벨과 의사 지시를 따르세요.","products":[{"name":"약국 안연고","maker":"여러 제조사","amount":"제품마다 성분이 달라요 [확인 필요]","rx":"일반"}],"tips":["온찜질은 40도 정도의 따뜻한 수건으로 5~10분, 하루 3~4번이 기준이에요."],"sources":["mcginley2022eye","nedrug_search"],"simple":"하루 2~4번 눈꺼풀 안쪽에, 1주 이내","faq":[{"q":"다래끼는 짜면 안 되나요?","a":"네, 짜지 마세요. 염증이 눈꺼풀 속으로 퍼질 수 있어요. **온찜질로 저절로 터지게** 두고, 2주가 지나도 덩어리가 남으면 안과에서 간단히 제거해요."}]},{"id":"colchicine","name":"콜히친 (통풍 발작)","en":"Colchicine","class":"gout","rx":"전문","tagline":"통풍 발작 초기 24시간 안에 — 저용량이 원칙","lead":"통풍 발작 때 관절에 몰려드는 백혈구의 움직임을 막아 염증을 가라앉히는 처방약이에요. 미국류마티스학회 2020 지침은 급성 발작에 **콜히친·NSAID·스테로이드 셋 중 하나를 강하게 권고**해요. 핵심은 **증상이 시작된 24시간 안에, 저용량으로** 쓰는 것 — 예전처럼 설사가 날 때까지 먹는 방식은 이제 쓰지 않아요.","for":["급성 통풍 발작","요산강하제 시작 초기의 발작 예방"],"dose":{"adult":"의사 처방대로 (저용량 요법)","interval":"처방대로","max":"신장·간 기능과 병용약에 따라 크게 달라져요 — 반드시 처방을 따르세요"},"onset":"12~24시간","duration":"—","risk":{"gi":4,"cv":1,"renal":3,"liver":2},"riskNote":{"gi":"설사·복통이 가장 흔한 부작용이에요. 용량이 많을수록 급격히 늘어요."},"pict":["식후","단기만"],"avoid":[{"text":"중증 신장·간 질환","flags":["kidney","liver"]},{"text":"클라리스로마이신 등 특정 항생제, 일부 항진균제와 함께 (독성이 크게 올라가요)"}],"caution":[{"text":"신장이 나쁘면 용량을 크게 줄여야 해요","flags":["kidney"]},{"text":"자몽주스는 피하세요"},{"text":"설사가 나면 임의로 더 먹지 말고 의사에게 알리세요"}],"sideEffects":["설사·복통·구역","드물게 근육통·저림(근병증)","장기 복용 시 혈구 감소"],"stop":["심한 설사·구토, 온몸 근육통과 힘 빠짐, 발열·멍이 잘 듦 — 즉시 진료"],"interactions":[{"with":"클라리스로마이신·에리스로마이신, 이트라코나졸, 사이클로스포린","what":"콜히친 농도가 위험하게 올라가요. 반드시 의사에게 복용 약을 알리세요."},{"with":"스타틴(고지혈증약)","what":"근육 손상 위험이 함께 올라갈 수 있어요."}],"pregnancy":"임신·수유 중에는 의사와 반드시 상의하세요.","children":"소아 사용은 전문의 판단에 따라요.","products":[{"name":"콜히친 정제","maker":"여러 제조사","amount":"0.6 mg 제제가 흔해요","rx":"전문"}],"tips":["발작이 오려는 느낌(발가락이 뻐근·화끈)이 들 때 바로 쓰는 것이 가장 효과적이에요. 미리 처방받아 두는 분도 많아요."],"sources":["acr2020gout","nedrug_search"],"simple":"처방대로 (봉투 용법이 우선)","faq":[{"q":"약국에서 살 수 있나요?","a":"아니요, **처방이 필요한 전문의약품**이에요. 통풍이 al":3,"liver":1},"riskNote":{"renal":"신장으로 배설돼서 신장이 나쁘면 용량을 줄여야 해요. 물을 충분히 드세요."},"pict":["물많이"],"avoid":[],"caution":[{"text":"물을 충분히 드세요. 탈수 상태에서 쓰면 신장에 부담이 돼요"},{"text":"신장이 나쁘면 용량 조절이 필요해요","flags":["kidney"]},{"text":"눈 주위나 귀에 발진이 생기면 시력·청력 합병증 위험이 있어 응급이에요"}],"sideEffects":["구역·두통","어지러움"],"stop":["소변량이 줄거나 심하게 어지러우면 진료를 받으세요"],"interactions":[{"with":"신장에 부담되는 약(소염제 등)","what":"함께 쓰면 신장 부담이 커져요."}],"pregnancy":"임신 중에도 필요하면 쓸 수 있어요. 의사가 판단해요.","children":"소아 용량은 체중으로 계산해요.","products":[{"name":"아시클로버·발라시클로버·팜시클로버 제제","maker":"여러 제조사","amount":"성분마다 용법이 달라요","rx":"전문"}],"tips":["50세가 넘으면 대상포진 백신으로 예방할 수 있어요. 이미 앓았던 분도 맞아요.","물집은 딱지가 앉을 때까지 전염력이 있어요. 수두를 앓지 않은 아기·임신부와 접촉을 피하세요."],"sources":["saguil2017zoster","nedrug_search"],"simple":"처방대로 (72시간 안에 시작이 중요)","faq":[{"q":"72시간이 지났으면 소용없나요?","a":"72시간이 넘어도 **새 물집이 계속 올라오거나, 눈·귀 주변이거나, 면역이 약한 분**이라면 여전히 쓸 이유가 있어요. 늦었다고 포기하지 마시고 진료를 받으세요."}]},{"id":"betahistine","name":"베타히스틴 (어지럼)","en":"Betahistine","class":"antihistamine","rx":"전문","tagline":"메니에르병 등 속귀 어지럼에 쓰는 처방약","lead":"속귀의 혈류를 늘려 어지럼을 줄인다고 알려진 처방약이에요. 주로 **메니에르병**처럼 반복되는 속귀 어지럼에 써요. 다만 **이석증(귀 안 돌이 굴러다니는 병)에는 약보다 자세 교정 수기(에플리)가 훨씬 확실**해요 — 1주 시점 효과가 재활치료보다 우수했어요.","for":["메니에르병","속귀성 어지럼"],"dose":{"adult":"처방대로","interval":"하루 2~3회","max":"처방에 따라요"},"onset":"수일~수주","duration":"—","risk":{"gi":2,"cv":1,"renal":1,"liver":1},"pict":["식후"],"avoid":[{"text":"갈색세포종(부신 종양)"}],"caution":[{"text":"위궤양 병력이 있으면 알리세요","flags":["ulcer"]},{"text":"천식이 있으면 주의해요","flags":["asthma"]}],"sideEffects":["속 불편감","두통"],"stop":["어지럼과 함께 말이 어눌하거나 한쪽 팔다리에 힘이 빠지면 즉시 119"],"interactions":[],"pregnancy":"임신·수유 중에는 의사와 상의하세요.","children":"소아 사용은 권하지 않아요.","products":[{"name":"베타히스틴 제제","maker":"여러 제조사","amount":"제품마다 함량이 달라요","rx":"전문"}],"tips":["멀미약(디멘히드리네이트)은 급성기 며칠만. 오래 쓰면 뇌가 균형을 다시 배우는 것을 방해해 회복이 늦어져요."],"sources":["wegner2014epley","nedrug_search"],"simple":"처방대로 (봉투 용법이 우선)","faq":[]}],"kids":{"lead":"아이 약은 나이가 아니라 **몸무게**로 정해요. 같은 세 살이라도 12 kg과 17 kg은 먹는 양이 달라요. 몸무게와 개월 수만 넣으면 시럽 중)를 그대로 가져와요. 같은 사이트에 설치돼 있으면 버튼 한 번, 아니면 그 앱의 ‘내보내기’ 내용을 붙여 넣으세요."},"sources":["mfds_tylenol_kids","mfds_brufen_kids","mfds_maxibufen","aap_fever","nelson"]},"meta":{"version":"0.1","reviewed":"2026-09","reviewLabel":"전문의 검수","reviewer":"내과 전문의 박현욱","stamp":"전문의 검수 · 2026.09","disclaimer":"이 정보는 참고용이에요. 진단과 처방은 의사만 할 수 있고, 약 선택이 어렵거나 증상이 계속되면 약사·의사와 상의하세요.","suppDisclaimer":"영양제 정보는 참고용이에요. 질환이 있거나 약을 드시는 분은 시작 전에 의사·약사와 상의하세요. 근거 표시는 2026년 9월 기준 문헌이에요.","about":"약지도은 ‘증상에 맞는 약을 의사가 고르듯’ 고를 수 있게 만든 앱이에요. 임상에서 처방하는 조합(진통·소염·근이완·위보호)을 약국·편의점에서 살 수 있는 성분으로 풀어 주고, 같은 계열 안에서 무엇이 위장·심장에 덜 부담인지, 영양제는 어떤 제형·함량이 의미 있는지 근거와 함께 보여드려요. 식약처 공공데이터(e약은요·낱알식별)를 함께 실었어요.","method":["모든 임상 수치·권고는 PubMed 문헌(코크란·대규모 RCT·메타분석), 진료 지침(ACP·ACOG·AGA 등), 식약처 허가사항을 직접 확인해 등록했어요. 확인하지 못한 값은 [확인 필요]로 표시했어요.","성분별 ‘부담 정도’는 SOS 프로젝트(Castellsague 2012)의 위장관 상대위험과 CNT 2013·PRECISION의 심혈관 자료를 5단계로 옮긴 상대 비교예요.","제품 정보는 식약처 의약품안전나라·약학정보원 허가사항과 제조사 자료를 기준으로 했고, 식약처 공공데이터(e약은요 4,766건·낱알식별 일반의약품 5,660건)를 그대로 실었어요.","내과 전문의가 내용을 검수했어요. 다만 이 앱은 진료를 대신하지 않아요 — 개인의 상태는 의사·약사와 확인하세요.","내 정보·내 약통은 이 기기에만 저장되고 어디로도 전송되지 않아요."],"photoEndpoint":"","photoNote":"사진은 서버에 저장하지 않고 읽은 뒤 바로 버려요. 읽은 결과도 이 기기에만 남아요."},"productImages":{"타이레놀정 500mg":{"img":"https://nedrug.mfds.go.kr/pbp/cmn/itemImageDownload/1N-M7iZWRP9","match":"타이레놀정500밀리그람(아세트아미노펜)","seq":"202106092"},"타이레놀 8시간 이알서방정":{"img":"https://nedrug.mfds.go.kr/pbp/cmn/itemImageDownload/1O597tTU02f","match":"타이레놀8시간이알서방정(아세트아미노펜)","seq":"202200407"},"세토펜정·현탁액":{"img":"https://nedrug.mfds.go.kr/pbp/cmn/itemImageDownload/147427743488900099","match":"세토펜정(아세트아미노펜)","seq":"199300891"},"부루펜정 400mg":{"img":"https://nedrug.mfds.go.kr/pbp/cmn/itemImageDownload/1Mxwka5v465","match":"부루펜정400밀리그램(이부프로펜)","seq":"198300343"},"이지엔6 애니 연질캡슐":{"img":"https://nedrug.mfds.go.kr/pbp/cmn/itemImageDownload/1NVEnjhkQ3O","match":"이지엔6애니연질캡슐(이부프로펜)","seq":"200400463"},"캐롤에프정":{"img":"https://nedrug.mfds.go.kr/pbp/cmn/itemImageDownload/1NOwp2F6HaN","match":"캐롤에프정(이부프로펜아르기닌)","seq":"200 rl":"https://pubmed.ncbi.nlm.nih.gov/35947131/","type":"임상 리뷰","note":"PMID 35947131"},"nedrug_search":{"label":"식품의약품안전처 의약품안전나라 — 제품별 허가사항 검색","url":"https://nedrug.mfds.go.kr/searchDrug","type":"허가사항"}},"suppRules":{"label":["**‘1일 섭취량’ 기준인지 ‘1회 분량’ 기준인지** — 함량과 % 표시가 어느 쪽인지 먼저 확인.","**기능성분 mg으로 비교** — ‘피쉬오일 1,000 mg’이 아니라 EPA+DHA mg, ‘마그네슘 화합물’이 아니라 원소 마그네슘 mg, ‘홍삼 g’이 아니라 진세노사이드 mg.","**제형** — rTG vs EE(오메가3), 산화 vs 구연산(마그네슘), 탄산 vs 구연산(칼슘), D3 vs D2. 흡수가 1.5~25배 달라요.","**상한(UL)과 중복** — 종합비타민 + 단일제 + 루테인·면역제품에 같은 성분(비타민 D·아연·B6)이 겹쳐 상한을 넘기기 쉬워요.","**인증** — 국내 ‘건강기능식품’ 마크는 식약처가 기능성·안전성을 인정했다는 뜻(HACCP과 다름). 해외는 USP Verified(함량·오염)·NSF Certified for Sport(금지약물)·Informed Choice."],"stack":["비타민 A(레티놀) + 경구 레티노이드(이소트레티노인) — 비타민 A 독성 가중. 임신 초기 레티놀 >10,000 IU 기형 위험.","철 + 칼슘 같은 시간 — 칼슘이 철 흡수 저해 → 2시간 이상 간격.","비타민 D·아연·B6 중복(종합비타민 + 단일제 + 루테인/면역 제품) — 상한 초과.","오메가3 고용량(>1 g) + 항응고·항혈소판제 — 출혈, 심방세동 위험.","세인트존스워트 + 거의 모든 약(경구피임약·와파린·면역억제제·스타틴) — 약효 감소.","비타민 K(K2 포함, 청국장·낫토·녹즙) + 와파린 — INR 하락. 섭취량을 일정하게.","자몽주스 + 심바스타틴·아토르바스타틴 등 — 혈중 농도 상승(효과 3~7일 지속).","홍삼·인삼 + 와파린 — INR 감소 보고, 모니터링.","고용량 아연 장기(구리 없이) — 구리 결핍 빈혈·신경 손상.","칼슘·마그네슘·철·아연 + 퀴놀론·테트라사이클린·갑상선약·골다공증약 — 2~4시간 간격.","비타민 C ≥1 g + 결석 병력 — 결석 위험 2배.","베타카로틴 + 흡연자 — 폐암 위험 증가."],"overlaps":[{"ids":["vitd","calcium"],"text":"칼슘제에 비타민 D가 함께 든 경우가 많아요. 두 제품의 비타민 D를 합산해 4,000 IU를 넘지 않게."},{"ids":["vitd","multi"],"text":"종합비타민에 이미 비타민 D가 들어 있어요. 단일제와 합산하세요."},{"ids":["zinc","multi"],"text":"종합비타민 속 아연과 합산 — 상한 40 mg."},{"ids":["zinc","lutein"],"text":"AREDS 처방 루테인 제품엔 아연 25~80 mg이 들어 있어요. 아연 단일제와 겹치면 구리 결핍 위험."},{"ids":["vitb","multi"],"text":"종합비타민 + B군 고함량 → B6가 EFSA 상한 12 mg을 넘기 쉬워요."},{"ids":["iron","calcium"],"text":"같은 시간에 먹지 마세요 — 칼슘이 철 흡수를 막아요. 2시간 이상 간격."},{"ids":["iron","mg"],"text":"철·마그네슘 고용량 동시 복용은 흡수 경쟁 — 시간을 나누세요."},{"ids":["mg","calcium"],"text":"칼슘·마그네슘 고용량 동시 복용은 흡수 경쟁. ‘칼마디’ 복합제는 함량이 낮게 설계돼 있으니 단일제 추가 시 합산."},{"ids":["omega3","vitd"],"text":"오메가3 제품에 비타민 D가 든 경우가 있어요. 합산 확인."},{"ids":["ginseng","omega3"],"text":"둘 다 항응고제(와파린)와 상호작용 보고가 있어요. 항응고제 복용 중이면 의사와."}],"sources":["mfds_hff","nsf_cert","rothman1995","nicolussi2020","bailey2013gf","yuan2004","kumar2006","thomas2013","areds2","gencer2021"]},"supplements":[{"id":"vitd","name":"비타민 D","en":"Vitamin D3 / D2","tags":["비타민D","뼈","칼슘","고려은단 비타민D","종근당 비타민D3","뉴트리코어 비타민D","센트룸(포함)"],"evidence":"강함","for":"뼈 건강(칼슘 흡수). 암·심혈관 예방은 근거 없음","lead":"뼈 건강에는 근거가 확실하지만, 2,000 IU를 5년 먹인 VITAL 시험에서 **암·심혈관 예방 효과는 없었어요**. 2024년 미국내분비학회는 건강한 75세 미만 성인의 일상적 혈액검사와 고용량 보충에 반대했어요. D3가 D2보다 혈중 농도를 잘 올리고, 지방 있는 식사와 먹으면 흡수가 32% 늘어요.","evidenceNote":"뼈·칼슘 흡수: 강함(IOM 2011). 암·심혈관·당뇨 예방: **효과 없음**(VITAL 2019, n=25,871). D3 > D2: 메타분석 P=0.001(Tripkovic 2012). 결핍 위험군(1~18세·75세↑·임신·당뇨전단계)에는 경험적 보충 제안(ES 2024).","forms":[{"name":"D3 (콜레칼시페롤)","bio":"높음","note":"1순위. 매일 소량이 주 1회 고용량보다 권장(ES 2024)"},{"name":"D2 (에르고칼시페롤)","bio":"낮은 편","note":"결핍 치료에 쓸 수는 있으나 D3보다 혈중 상승이 적음"}],"dose":{"typical":"1,000~2,000 IU/일","ul":"4,000 IU(100 µg)/일","kr":"한국 성인 충분섭취량 400 IU(10 µg), 상한 4,000 IU. 1 µg = 40 IU. 식약처 건기식 일일섭취량 범위 [확인 필요]"},"calc":{"unit":"IU","typical":1000,"ulRatio":4,"note":"1일 1,000 IU 기준","caveat":"4,000 IU(400%)를 넘는 함량은 매일 먹을 용량이 아니에요. 종합비타민·칼슘제 속 비타민 D를 합산하세요."},"bestForm":"D3","label":["IU와 µg 중 어느 단위인지 — 25 µg = 1,000 IU.","D2인지 D3인지.","종합비타민·칼슘제·오메가3 제품에 이미 들어 있는지 합산."],"timing":"하루 1회, 지방이 있는 식사(아침·점심)와 함께. 매일 소량이 주 1회 고용량보다 좋아요.","timingShort":"식사(지방)와, 매일","cautions":["장기간 4,000 IU 초과 → 고칼슘혈증 위험","사르코이드증·부갑상선 질환은 의사와","피검사 없이 ‘결핍일 것 같아서’ 고용량은 비권장(ES 2024)"],"priceTip":"1,000 IU당 가격으로 비교. 400 IU 저용량은 알약 수가 늘어 단가가 불리하고, D3 단일제가 대개 가장 싸요.","sources":["iom2011","vital_d","tripkovic2012","es2024d","dawson2015"],"brands":["고려은단 비타민D","종근당 비타민D3","뉴트리코어 비타민D","센트룸(포함)"]},{"id":"omega3","name":"오메가-3 (EPA+DHA)","en":"Omega-3","tags":["오메가3","EPA","DHA","피쉬오일","중성지방","종근당 오메가3","뉴트리코어 rTG 오메가3","안국 알티지 오메가3","대웅 rTG 오메가3"],"evidence":"중간","for":"중성지방 저하(고용량). 일반인 심혈관 예방은 효과 없음","lead":"**‘피쉬오일 1,000 mg’이 아니라 EPA+DHA 합계 mg**을 보세요. 처방 수준(2~4 g/일)에서 중성지방을 낮추는 근거는 강하지만, 보충제 용량 1 g으로 심혈관 예방을 기대할 근거는 없어요(VITAL·코크란 2020). 제형은 rTG > EE(에틸에스테르)로 흡수가 1.7배 차이 나고, 1 g 넘는 고용량은 심방세동 위험이 올라가요.","evidenceNote":"중성지방 저하(2~4 g EPA+DHA): 강함(AHA 2019). 심혈관 예방(보충제 1 g): **효과 없음**(VITAL HR 0.92 NS; 코크란 86시험 사망 RR 0.97). 고용량 처방약 EPA(REDUCE-IT)는 효과, EPA+DHA(STRENGTH)는 무효 — 상충. 심방세동 HR 1.25(>1 g/일 1.49).","forms":[{"name":"rTG (재에스테르화 중성지방)","bio":"124%","note":"흡수 최고. 가격 프리미엄 정당"},{"name":"천연 TG","bio":"100%","note":"기준"},{"name":"EE (에틸에스테르)","bio":"73%","note":"저가형. 같은 효과엔 1.4배 양 필요"},{"name":"크릴오일(인지질)","bio":"어유와 유사","note":"임상 우월성 근거 없음, EPA+DHA 함량 낮아 mg당 비쌈"}],"dose":{"typical":"EPA+DHA 1,000 mg/일 (TG 저하는 2~4 g, 의사 관리)","ul":"FDA 3 g/일(GRAS) [확인 필요]","kr":"식약처 기능성(혈중 중성지질·혈행 개선) EPA+DHA 합 500~2,000 mg (공전 원문 [확인 필요])"},"calc":{"unit":"mg (EPA+DHA 합)","typical":1000,"ulRatio":3,"note":"EPA+DHA 합 1,000 mg 기준","caveat":"캡슐 무게가 아니라 EPA+DHA 합계로 넣으세요. EE형은 계산값에 0.6을 곱해 보정."},"bestForm":"rTG","label":["EPA mg + DHA mg 합계(캡슐 1,000 mg ≠ EPA+DHA 1,000 mg).","제형: rTG / TG / EE 표기.","산화 지표(GOED: TOTOX ≤26) 표기 여부, 유통기한.","항응고제 복용 중이면 고용량 주의."],"timing":"지방이 있는 식사 중에. 비린내·역류가 있으면 냉장 보관 후 식사 중간에.","timingShort":"식사 중(지방과)","cautions":["항응고제·항혈소판제 병용 시 출혈 주의(고용량)","심방세동 병력자는 1 g 초과 피함","어류 알레르기","위장 불편(트림·설사)"],"priceTip":"EPA+DHA 1 g당 가격 × 제형 보정(EE는 ×1.4). 크릴오일은 mg당 가격이 높고 우월성 근거가 없어요.","sources":["dyerberg2010","aha2019tg","vital_omega","reduceit","cochrane_omega2020","gencer2021","goed"],"brands":["종근당 오메가3","뉴트리코어 rTG 오메가3","안국 알티지 오메가3","대웅 rTG 오메가3","피쉬오일"]},{"id":"mg","name":"마그네슘","en":"Magnesium","tags":["마그네슘","눈떨림","경련","수면","닥터스베스트 마그네슘","종근당 마그네슘","뉴트리코어 마그네슘","마그밀(변비약)"],"evidence":"약함","for":"결핍 보충. 다리 경련·눈 떨림 효과는 근거 없음","lead":"**산화마그네슘은 흡수율이 약 4%**라 원소량이 높아 보여도 실제 흡수는 적고 설사를 일으켜요. 구연산·글리신산·젖산염 형태가 흡수가 낫습니다. 널리 알려진 ‘다리 쥐·눈 떨림에 마그네슘’은 코크란(2020)에서 특발성 경련에 효과가 없었고, 눈 떨림은 RCT 근거가 없어요. 신장이 나쁘면 쌓여서 위험.","evidenceNote":"다리 경련: **효과 없음**(코크란 2020, 11 RCT, 고확실성). 수면: 고령 불면 입면 −17분, 낮은 확실성. 눈꺼풀 떨림: RCT 근거 없음. 결핍(이뇨제·PPI·음주·당뇨) 보충: 타당.","forms":[{"name":"산화마그네슘","bio":"약 4%","note":"가장 싸고 원소 비율 60%지만 흡수 낮고 설사. 변비약(마그밀)으로는 그 성질이 장점"},{"name":"구연산마그네슘","bio":"높음","note":"흡수 좋음, 고용량은 설사"},{"name":"글리신산(비스글리시네이트)","bio":"높음 [직접 비교 확인 필요]","note":"위장 부담 적다고 알려짐, 원소 비율 ~14%"},{"name":"젖산·염화마그네슘","bio":"높음","note":"산화물보다 유의하게 높음(Firoz 2001)"},{"name":"L-트레온산","bio":"[확인 필요]","note":"뇌 관련 마케팅, 원소 비율 ~8%로 낮음"}],"dose":{"typical":"원소 마그네슘 200~400 mg/일 [지침 원문 확인 필요]","ul":"보충제 유래 350 mg/일(미국 IOM) [확인 필요]","kr":"KDRIs 2020 식품 외 급원 상한 설정(수치 [확인 필요]); 식약처 건기식 일일섭취량 범위 [확인 필요]"},"calc":{"unit":"mg (원소 마그네슘)","typical":300,"ulRatio":1.2,"note":"원소 Mg 300 mg 기준","caveat":"‘글리신산마그네슘 1,000 mg’은 원소 마그네슘 약 140 mg이에요. 라벨의 ‘마그네슘(as …)’ 원소량으로 넣으세요."},"bestForm":"구연산·글리신산","label":["화합물 무게가 아니라 **원소 마그네슘 mg**.","형태 미표기(‘마그네슘’만)는 대개 산화마그네슘.","종합비타민·칼마디 제품과 합산."],"timing":"식사와 함께, 설사하면 나눠서. 철·아연·칼슘 고용량과 동시 복용은 피하기.","timingShort":"식사와, 분할","cautions":["**신장 질환은 금지**(고마그네슘혈증)","설사(산화·구연산)","퀴놀론·테트라사이클린 항생제, 비스포스포네이트와 2시간 간격"],"priceTip":"원소 Mg 100 mg당 가격 ÷ 상대 흡수율. 산화물은 mg당 가장 싸지만 4% 흡수를 반영하면 실질 단가가 불리해요.","sources":["firoz2001","garrison2020","mg_sleep2021"],"brands":["닥터스베스트 마그네슘","종근당 마그네슘","뉴트리코어 마그네슘","마그밀(변비약)"]},{"id":"probiotic","name":"프로바이오틱스(유산균)","en":"Probiotics","tags":["유산균","프로바이오틱스","장","CFU","락토핏","듀오락","지큐랩","비오비타","메디락","종근당 락토핏"],"evidence":"중간","for":"항생제 관련 설사 예방(강). 과민성장·면역·피부는 낮음","lead":"효과는 ‘유산균’이 아니라 **균주(strain) 단위**예요. 항생제 설사 예방은 *L. rhamnosus* GG·*S. boulardii* 하루 50억 CFU 이상에서 근거가 확실(코크란 NNTB 6~9)하고, 과민성장·면역·피부는 대부분 낮은 확실성이에요. 라벨에서 볼 것은 총 CFU 숫자 경쟁이 아니라 **균주명 + 유통기한까지 보장 CFU**.","evidenceNote":"항생제 관련 설사: 소아 33 RCT 8% vs 19%, RR 0.45(고용량 ≥50억 NNTB 6). *S. boulardii* NNT 10. IBS: 82 RCT — 대부분 GRADE 낮음~매우 낮음(Ford 2023). 면역·체중·피부: 본 앱 미검토.","forms":[{"name":"L. rhamnosus GG","bio":"—","note":"항생제 설사 예방 근거 강(ESPGHAN 강한 권고)"},{"name":"S. boulardii (효모)","bio":"—","note":"항생제와 동시 복용 가능(효모라 죽지 않음). 항진균제와는 무력화"},{"name":"복합 균주 제품","bio":"—","note":"종명만 나열된 제품은 특정 근거 적용 불가"}],"dose":{"typical":"10억~1
