.prod b{font-weight:700;overflow-wrap:anywhere}
.prod span{display:block;color:var(--muted);font-size:.75rem}
.tabs{display:flex;gap:6px;margin:var(--s4) 0 var(--s3);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 15px;border-radius:var(--r-pill);font-size:.9375rem;font-weight:600;color:var(--muted);background:var(--tint2);min-height:44px}
.tab.on{background:var(--text);color:var(--card)}
.pane{display:none}.pane.on{display:block}

/* 비교 차트 (코드로 그린 진짜 데이터) */
.chart{margin-top:var(--s3);background:var(--tint2);border-radius:14px;padding:var(--s3)}
.chart svg{width:100%;height:auto;display:block;font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s2);font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
table.cmp{width:100%;border-collapse:collapse;font-size:.8125rem;margin-top:var(--s3)}
table.cmp th{text-align:left;font-weight:700;color:var(--muted);font-size:.6875rem;letter-spacing:.05em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--hairline)}
table.cmp td{padding:10px 6px;border-bottom:1px solid var(--hairline);vertical-align:top;line-height:1.45}
table.cmp td:first-child{font-weight:700;white-space:nowrap}
.scroll-x{overflow-x:auto;margin:0 calc(-1 * var(--s4));padding:0 var(--s4)}

/* 영양제 비교 */
.supp-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.ev{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:6px}
.ev.strong{background:var(--normal-tint);color:var(--normal)} .ev.mid{background:var(--caution-tint);color:var(--caution)} .ev.weak{background:var(--tint);color:var(--muted)}
.cmp-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;width:min(460px,100%);padding:0 var(--s4);z-index:5;pointer-events:none}
.cmp-bar>div{pointer-events:auto;background:var(--text);color:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.875rem}
.cmp-bar button{background:var(--card);color:var(--text);border-radius:9px;padding:8px 14px;font-weight:700;font-size:.8125rem;min-height:36px}
.checkrow{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);min-height:52px}
.checkrow:last-child{border-bottom:0}
.checkrow input{width:20px;height:20px;accent-color:var(--primary);flex:none}
.checkrow label{flex:1;font-size:.9375rem;font-weight:600}
.checkrow small{color:var(--muted);font-weight:500;display:block;font-size:.8125rem}

/* 내 정보 */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);min-height:56px}
.toggle:last-child{border-bottom:0}
.toggle .t b{display:block;font-size:.9375rem;font-weight:600}
.toggle .t span{display:block;font-size:.8125rem;color:var(--muted)}
/* 스위치 — 누르는 자리는 48×46(44px 이상), 보이는 막대는 가운데 28px.
   껐을 때 막대가 안 보이던 것(대비 1.29:1)을 테두리 3.4:1 로 고쳤다. */
.sw{position:relative;width:48px;height:46px;border-radius:999px;background:none;flex:none}
.sw::before{content:"";position:absolute;left:0;top:9px;width:48px;height:28px;border-radius:999px;background:var(--tint2);box-shadow:inset 0 0 0 2px var(--ui-line);transition:background .2s,box-shadow .2s}
.sw::after{content:"";position:absolute;z-index:1;top:12px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.14);transition:transform .2s}
.sw.on::before{background:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)} .sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--tint2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:9px;font-size:.9375rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--primary-deep);font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.10),inset 0 0 0 2px var(--primary)}
.privacy{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.8125rem;margin-top:var(--s3)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 var(--s5);border-radius:12px;font-weight:700;font-size:.9375rem;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-raised);width:100%}
.btn.ghost{background:var(--tint);color:var(--primary-deep);box-shadow:none}
.btn.line{background:var(--card);color:var(--text);border:1.5px solid var(--ui-line);box-shadow:none}
.btn+.btn{margin-top:var(--s2)}
.actions{margin-top:var(--s4)}
.link{color:var(--primary);font-weight:600;text-decoration:none;display:inline-block;padding:2px 0;min-height:24px}
.link:hover{text-decoration:underline}

/* 탭바 */
nav.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hairline);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 0;font-size:.6875rem;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabbar button.on{color:var(--primary)}
nav.tabbar button svg.i{width:22px;height:22px}
nav.tabbar button.on svg.i{stroke-width:2.2}

/* 검색 결과 */
.results{margin-top:var(--s3)}
.hit{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);text-align:left;width:100%;min-height:56px}
.hit:last-child{border-bottom:0}
.hit .k{font-size:.6875rem;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--tint);color:var(--primary-deep);flex:none;min-width:44px;text-align:center}
.hit .k.s{background:var(--accent-tint);color:var(--accent)} .hit .k.p{background:var(--tint2);color:var(--muted)}
.hit b{display:block;font-size:.9375rem;overflow-wrap:anywhere}
.hit span{display:block;font-size:.8125rem;color:var(--muted)}
.hit mark{background:none;color:var(--primary);font-weight:800}
.empty{padding:var(--s6) var(--s4);text-align:center;color:var(--muted);font-size:.9375rem}
.empty b{display:block;color:var(--text);margin-bottom:6px}

/* 낱알 찾기·식약처 제품 */
.pillimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--tint2);border:1px solid var(--hairline);flex:none}
.pillimg.big{width:100%;height:auto;max-height:220px;object-fit:contain;background:#fff;margin-top:var(--s3)}
.pub-hero{display:flex;gap:var(--s3);align-items:center}.pub-hero h1{overflow-wrap:anywhere}
.qa h3{margin-top:var(--s4);font-size:.9375rem;color:var(--primary-deep)}
.qa p{white-space:pre-line;font-size:.9375rem;line-height:1.7;margin-top:4px;overflow-wrap:anywhere;word-break:normal}
.shape-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.swatch{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--card);font-size:.8125rem;font-weight:600;min-height:36px}
.swatch i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:inline-block}
.swatch.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.loading{padding:var(--s5);text-align:center;color:var(--muted);font-size:.875rem}
/* 약 알아보기(사진·식별) */
.big-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:18px;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-raised);min-height:76px}
.big-btn .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.big-btn .ic svg.i{width:26px;height:26px;stroke:var(--on-primary)}
.big-btn b{display:block;font-size:1.125rem;line-height:1.3}
.big-btn span{display:block;font-size:.8125rem;opacity:.9;margin-top:2px}
.big-btn.soft{background:var(--card);color:var(--text);border:1px solid var(--hairline);box-shadow:var(--shadow-card)}
.big-btn.soft .ic{background:var(--tint)} .big-btn.soft .ic svg.i{stroke:var(--primary)}
.big-btn+.big-btn{margin-top:10px}
.shape-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.shape-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--card);border:1px solid var(--hairline);font-size:.75rem;font-weight:700;min-height:64px}
.shape-btn svg{width:28px;height:28px;stroke:var(--text);stroke-width:1.8;fill:var(--tint2)}
.shape-btn.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.color-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;background:var(--card);border:1px solid var(--hairline);font-size:.7rem;font-weight:700;min-height:64px}
.color-btn i{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.color-btn.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.pill-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--s3)}
.pill-card{background:var(--card);border:1px solid var(--hairline);border-radius:14px;overflow:hidden;text-align:left;box-shadow:var(--shadow-card);display:flex;flex-direction:column}
.pill-card .ph{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;border-bottom:1px solid var(--hairline);position:relative}
.pill-card .ph img{width:100%;height:100%;object-fit:contain}
.pill-card .ph .pglyph,.pglyph{width:100%;height:100%;display:block;padding:6px}
.pill-card .ph .ph-empty{color:var(--faint);font-size:.75rem}
.pill-card .ph .sc{position:absolute;top:6px;left:6px;font-size:.6875rem;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--primary);color:var(--on-primary)}
.pill-card .bd{padding:10px 12px 12px}
.pill-card b{display:block;font-size:.875rem;line-height:1.3;overflow-wrap:anywhere}

.wx-empty .t span{display:block;font-size:.8125rem;color:var(--muted);line-height:1.45;margin-top:2px}
.wx-retry{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;margin-top:10px;padding:0 16px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--hairline);color:var(--primary);font-size:.875rem;font-weight:700;box-shadow:var(--shadow-card)}
.wx-skel{height:12px;border-radius:999px;background:var(--hairline);opacity:.6}
@keyframes wxpulse{0%,100%{opacity:.35}50%{opacity:.7}}
@media (prefers-reduced-motion:no-preference){.wx-skel{animation:wxpulse 1.5s ease-in-out infinite}}
.wx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.wx-stats div{background:var(--tint2);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.wx-stats small{display:block;font-size:.6875rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.wx-stats b{display:block;font-size:1.0625rem;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.3}
.wx-stats .hi b{color:var(--caution)} .wx-stats .bad b{color:var(--alert)} .wx-stats .ok b{color:var(--normal)}
.wx-tip{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--tint);color:var(--text);font-size:.9375rem;line-height:1.5;width:100%;text-align:left;min-height:46px}
.wx-tip svg.i{flex:none;margin-top:3px;color:var(--gfg,var(--primary))} .wx-tip span{flex:1;min-width:0} .wx-tip svg.i:last-child{color:var(--faint)}
.wx-foot{font-size:.6875rem;color:var(--muted);margin-top:8px;line-height:1.4}
.hint-line{display:flex;align-items:flex-start;gap:9px;padding:12px 14px;border-radius:14px;background:var(--tint);color:var(--primary-deep);font-size:.9375rem;font-weight:600;line-height:1.55;margin-top:var(--s4)}
.hint-line svg.i{flex:none;margin-top:2px}
.hint-line .x{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.hint-line .x svg.i{width:14px;height:14px;margin:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--card);padding:10px 16px;border-radius:12px;font-size:.875rem;font-weight:600;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:rise .25s ease}
</style>

<script id="data" type="application/json">{"askdoc":[{"id":"cold-buy","icon":"sneeze","q":"감기약, 약국에서 뭘 사면 돼요?","a":"**증상 이름이 아니라 역할로 고르세요.** 몸살·열에는 타이레놀, 목이 붓고 아프면 소염제(이부프로펜), 소염제를 사흘 넘게 드시면 위보호제(파모티딘), 가래가 끓으면 가래를 묽게 하는 약(아세틸시스테인), 한 병으로 해결하고 싶으면 종합감기 시럽 — 이 정도면 됩니다. 시럽이 싫으시면 먹는 콧물약으로 바꾸셔도 돼요.","go":"/symptom/cold","goText":"감기 화면"},{"id":"apap-ibu","icon":"temp","q":"타이레놀이랑 이부프로펜, 같이 먹어도 돼요?","a":"**네, 같이 드셔도 됩니다.** 두 약은 계열이 달라서 진료실에서도 함께 씁니다. 대신 **각 약의 간격과 하루 총량은 따로따로** 지키세요. 아이에게 먹일 때는 먹인 시각과 약 이름을 적어 두시면 헷갈리지 않아요.","go":"/kids","goText":"아이 해열제 계산"},{"id":"relax","icon":"spine","q":"신신플렉스 같은 근육약이랑 소염제를 같이 먹어도 돼요?","a":"**같이 드셔도 됩니다.** 근육약 속 에텐자미드는 소염 효과가 거의 없어서, 소염제를 두 가지 먹는 것과는 다릅니다. 다만 **위가 약하시면 위보호제**를 함께 두세요.","go":"/symptom/msk","goText":"근육·관절·허리 화면"},{"id":"asthma","icon":"lung","q":"천식이 있는데 소염진통제 먹어도 돼요?","a":"**완전히 금지는 아니지만, 피하시는 편이 좋습니다.** 소염제는 기도를 더 예민하게 만들어요. 천식이 안정돼 있을 때 며칠만 쓰는 것은 의사와 상의해 볼 수 있습니다. 아스피린이나 소염제를 먹고 숨이 찼던 적이 있으면 그때는 쓰지 마세요.","go":"/drug/ibuprofen","goText":"이부프로펜 화면"},{"id":"gout","icon":"swell","q":"통풍은 엄지발가락만 붓는 거 아니에요?","a":"**아닙니다.** 발목이나 무릎이 갑자기 벌겋게 붓는 분도 많아요 — 삐었다고 생각하고 오시기도 합니다. 병원에서는 소염제와 함께 **스테로이드**를 짧게 쓰는데 생각보다 잘 듣습니다. 연세가 많으시면 위궤양 걱정 때문에 약을 바꿔 드리기도 해요.","go":"/symptom/gout","goText":"통풍 화면"},{"id":"shoulder","icon":"shoulder","q":"오십견에 파스 붙여도 돼요?","a":"**네, 소염제 파스를 권할 수 있습니다.** 다만 어깨가 안 올라가는 것이 오십견인지 **회전근개(어깨 힘줄) 손상**인지는 가려야 해요. 팔을 남이 들어 주면 올라가는데 내 힘으로는 안 올라가면 힘줄 쪽일 수 있으니 진료를 받으세요.","go":"/symptom/frozen-shoulder","goText":"어깨 화면"},{"id":"antibiotic","icon":"pill","q":"감기에 항생제를 먹어야 빨리 낫지 않나요?","a":"**필요할 수 있는 경우가 있다, 정도입니다.** 감기는 대부분 바이러스라 항생제가 듣지 않고, 괜히 쓰면 **내성**이 생겨 정작 필요할 때 약이 안 듣습니다. 열흘이 지나도 안 낫거나, 좋아지다 다시 나빠지면 진료를 받으세요.","go":"/symptom/cold","goText":"감기 화면"},{"id":"ppi","icon":"stomach","q":"속쓰림약은 얼마나 먹어야 해요?","a":"**적어도 2주는 드세요.** 며칠 먹고 괜찮다고 끊으면 다시 올라옵니다. 위산을 줄이는 약은 종류가 여럿인데 어느 것이든 괜찮고, 위점막 보호제는 필요할 때만 더합니다.","go":"/symptom/heartburn","goText":"속쓰림 화면"},{"id":"smoke-bp","icon":"nosmoke","q":"고혈압이 있는데 금연 패치 붙여도 돼요?","a":"**쓰지 말아야 할 정도는 아닙니다 — 조심해서 쓰는 약이에요.** 담배를 계속 피우는 것보다 패치가 안전합니다. 쓰는 동안 혈압과 맥박을 살피시고, 최근 몇 달 안에 심근경색이나 뇌졸중이 있었다면 먼저 의사와 상의하세요.","go":"/symptom/smoking","goText":"금연 화면"},{"id":"senior","icon":"user","q":"나이 드신 부모님 감기약, 뭘 조심해야 해요?","a":"세 가지만 기억하세요. **콧물약(페니라민)·코막힘약(슈도에페드린)**은 전립선이 크신 분 소변을 막을 수 있고, **카페인이 든 진통제**는 잠을 설치게 하고, **마그밀(변비약)**을 많이·오래 드시면 콩팥에 부담이 됩니다.","go":"/senior","goText":"나이 들면 달라지는 약"},{"id":"headache-gi","icon":"head","q":"두통약 먹으면 속이 안 좋아요.","a":"두통에는 부루펜이나 타이레놀이 잘 맞고, **속이 불편하면 파모티딘이나 트리부틴**을 같이 드시면 도움이 됩니다. 감기와 함께 온 두통이면 코를 뚫어 주는 쪽이 먼저일 수 있어요.","go":"/symptom/headache","goText":"두통 화면"},{"id":"kid-dose","icon":"family","q":"아이 해열제, 몇 mL 먹여요?","a":"**나이가 아니라 몸무게로 정합니다.** 몸무게를 넣으시면 한 번에 몇 mL, 하루 최대 몇 mL까지인지 바로 계산해 드려요. 생후 3개월 전에 열이 나면 해열제보다 **진료가 먼저**입니다.","go":"/kids","goText":"아이 해열제 계산"}],"classes":[{"id":"nsaid","name":"소염진통제","short":"소염진통제","icon":"joint"},{"id":"analgesic","name":"해열진통제(아세트아미노펜·복합)","short":"해열진통","icon":"temp"},{"id":"relaxant","name":"근이완제","short":"근이완제","icon":"back"},{"id":"gi-acid","name":"위산·속쓰림약","short":"속쓰림","icon":"heartburn"},{"id":"gi-digest","name":"소화제","short":"소화제","icon":"stomach"},{"id":"bowel","name":"설사·변비약","short":"설사·변비","icon":"gut"},{"id":"cold","name":"감기약 성분","short":"감기","icon":"sneeze"},{"id":"antihistamine","name":"항히스타민제·비염약","short":"알레르기","icon":"nose"},{"id":"sleep","name":"수면유도제·멀미약","short":"수면·멀미","icon":"moon"},{"id":"topical","name":"파스·바르는 약","short":"파스·외용","icon":"f_patch"},{"id":"skin","name":"피부·구강·눈","short":"피부·눈","icon":"rash"},{"id":"combo","name":"복합제(감기약·복합진통제)","short":"복합제","icon":"pill"},{"id":"antifungal","name":"무좀약(항진균제)","short":"무좀","icon":"foot"},{"id":"gout","name":"통풍약","short":"통풍","icon":"swell"},{"id":"hemorrhoid","name":"치질약","short":"치질","icon":"seat"},{"id":"antiviral","name":"항바이러스제","short":"항바이러스","icon":"shingles"},{"id":"antibiotic","name":"항생제","short":"항생제","icon":"shield"},{"id":"urology","name":"방광·전립선약","short":"방광·전립선","icon":"bladder"},{"id":"bone","name":"뼈·골다공증약","short":"뼈·골다공증","icon":"bone"},{"id":"spasm","name":"진경제 (경련을 푸는 약)","short":"진경제","icon":"bolt"},{"id":"women","name":"여성 호르몬약","short":"여성 호르몬","icon":"womb"},{"id":"oral","name":"입·잇몸","short":"입·잇몸","icon":"tooth"},{"id":"gi-spasm2","name":"장 경련","short":"장 경련","icon":"gutpain"},{"id":"anxiety","name":"불안·긴장에 쓰는 약","short":"불안약","icon":"anxiety"},{"id":"quit","name":"금연 보조제","short":"금연","icon":"nosmoke"}],"drugs":[{"id":"acetaminophen","name":"아세트아미노펜","en":"Acetaminophen (Paracetamol)","class":"analgesic","rx":"안전상비","tagline":"위장 부담이 가장 적은 기본 진통·해열제","simple":"500 mg 1~2정, 하루 3번이 기본. 모자라면 4시간 이상 띄워 더 드셔도 되고, 하루 8정을 넘기지 않기","for":["두통","치통","생리통","근육통","발열","감기 몸살"]},{"id":"ibuprofen","name":"이부프로펜","en":"Ibuprofen","class":"nsaid","rx":"일반","tagline":"일반약 소염진통제 중 위장 부담이 가장 낮은 편","simple":"400 mg 1정, 하루 3번 식후 30분. 빈속 금지, 하루 1,200 mg(3정)까지","for":["근육·관절통","생리통","치통","두통","발열","염좌"]},{"id":"dexibuprofen","name":"덱시부프로펜","en":"Dexibuprofen","class":"nsaid","rx":"일반","tagline":"이부프로펜의 ‘활성형 절반’ — 더 적은 양으로 같은 효과","simple":"300 mg 1캡슐, 하루 3번 식후. 하루 4캡슐까지","for":["근육·관절통","생리통","치통","두통","발열"]},{"id":"naproxen","name":"나프록센","en":"Naproxen","class":"nsaid","rx":"일반","tagline":"오래 가고 심혈관에 가장 안전한 소염제, 대신 위장엔 덜 친절","simple":"첫 회 2캡슐(500 mg), 이후 1캡슐씩 하루 2~3번 식후. 하루 5캡슐까지","for":["생리통","근육·관절통","치통","두통","염좌"]},{"id":"aspirin","name":"아스피린","en":"Aspirin","class":"nsaid","rx":"일반","tagline":"진통제로는 이제 1순위가 아닌 약 — 저용량은 ‘심장약’","simple":"진통 목적이면 500 mg 1~2정, 4시간 이상 간격 (15세 미만 금지)","for":["두통·근육통(2순위)","혈전 예방(저용량 100 mg, 의사 지시)"]},{"id":"diclofenac","name":"디클로페낙 (먹는약)","en":"Diclofenac (oral)","class":"nsaid","rx":"전문","tagline":"효과는 강하지만 심혈관 부담이 가장 큰 편 — 처방약","simple":"처방대로","for":["관절염","근골격 통증(처방)"]},{"id":"aceclofenac","name":"아세클로페낙","en":"Aceclofenac","class":"nsaid","rx":"전문","tagline":"디클로페낙의 순한 사촌 — 국내 처방 1순위급","simple":"처방대로 (보통 100 mg 하루 2번 식후)","for":["관절염","근골격 통증(처방)"]},{"id":"celecoxib","name":"셀레콕시브","en":"Celecoxib","class":"nsaid","rx":"전문","tagline":"위장을 아끼도록 설계된 염증 효소만 골라 막는 약 — 처방약","simple":"처방대로 (200 mg 하루 1~2번)","for":["관절염","오래된 통증(처방)"]},{"id":"meloxicam","name":"멜록시캄","en":"Meloxicam","class":"nsaid","rx":"전문","tagline":"하루 한 번 처방 소염제 — ‘부분 선택’이라 위장 이득은 크지 않음","simple":"처방대로 (하루 1번)","for":["관절염(처방)"]},{"id":"loxoprofen","name":"록소프로펜","en":"Loxoprofen","class":"nsaid","rx":"제품별","tagline":"붙이는 것은 약국, 먹는 것은 처방 — 같은 성분 다른 분류","simple":"먹는 약은 처방대로, 패치는 하루 한 장","for":["근골격 통증","관절염","발치 후 통증(처방)"]},{"id":"ipa","name":"이소프로필안티피린 (게보린 성분)","en":"Isopropylantipyrine","class":"analgesic","rx":"일반","tagline":"게보린의 진통 성분 — 15세 미만 금지, 단기만","simple":"게보린 1정, 4시간 이상 간격, 하루 3번까지","for":["두통","치통","생리통(단기)"]},{"id":"ethenzamide","name":"에텐자미드 (펜잘 성분)","en":"Ethenzamide","class":"analgesic","rx":"일반","tagline":"펜잘큐의 살리실산계 진통 성분 — 15세 미만 금지","simple":"펜잘큐 1정, 4시간 이상 간격, 하루 3번까지","for":["두통","치통","생리통"]},{"id":"caffeine","name":"카페인 (진통 보조)","en":"Caffeine (analgesic adjuvant)","class":"analgesic","rx":"일반","tagline":"진통제 효과를 조금 높이지만, 매일 먹으면 두통을 만들어요","simple":"복합제 기준. 저녁엔 카페인 없는 진통제로","for":["진통 보조"]},{"id":"pamabrom","name":"파마브롬 (이지엔6 이브 성분)","en":"Pamabrom","class":"analgesic","rx":"일반","tagline":"생리 전 붓기를 빼는 약한 이뇨 성분","simple":"이지엔6 이브 1~2캡슐, 4~6시간 간격","for":["생리 전 붓기"]},{"id":"chlorzoxazone","name":"클로르족사존 (일반약 근이완 성분)","en":"Chlorzoxazone","class":"relaxant","rx":"일반","tagline":"약국에서 살 수 있는 유일한 근이완 성분 — 3제 복합제로만","simple":"복합제를 아플 때 1~2정, **하루 2번까지**. 졸림·음주 주의","for":["담 결림","근육 뭉침·경직","갑자기 온 허리 통증(보조)"]},{"id":"eperisone","name":"에페리손 (처방 근이완제)","en":"Eperisone","class":"relaxant","rx":"전문","tagline":"국내 처방 1순위 근이완제 — 졸음이 덜한 편","simple":"처방대로 (보통 50 mg 하루 3번 식후)","for":["근골격 통증 동반 근육 경직","갑자기 온 허리 통증·경부통(처방)"]},{"id":"cyclobenzaprine","name":"사이클로벤자프린 (처방 근이완제)","en":"Cyclobenzaprine","class":"relaxant","rx":"전문","tagline":"밤에 쓰는 근이완제 — 졸음이 강함","simple":"처방대로 (보통 취침 전)","for":["갑자기 온 근육 경련(처방)"]},{"id":"famotidine","name":"파모티딘 10 mg (약국)","en":"Famotidine","class":"gi-acid","rx":"일반","tagline":"약국에서 살 수 있는 가장 강한 위산 억제제 — 10 mg만 일반의약품","simple":"10 mg 1정, 하루 2번 아침·저녁 식후. 14일 이내","for":["속쓰림·신물","소염제 복용 중 위보호","위산과다"]},{"id":"omeprazole","name":"오메프라졸·에스오메프라졸 (강한 위산 억제제)","en":"Omeprazole / Esomeprazole","class":"gi-acid","rx":"전문","tagline":"가장 강한 위산 억제제 — 국내에선 처방약","simple":"처방대로 (보통 아침 식전 1번)","for":["역류성 식도염","위궤양","소염제 위보호(처방)"]},{"id":"almagate","name":"알마게이트 (알마겔)","en":"Almagate","class":"gi-acid","rx":"일반","tagline":"지금 당장 속쓰림을 끄는 제산제","simple":"한 포씩 하루 3번, 식후 30분~1시간. 다른 약과는 2시간 띄우기","for":["속쓰림·신물","위통(일시적)"]},{"id":"aluminium-phosphate","name":"인산알루미늄 (겔포스)","en":"Aluminium phosphate gel","class":"gi-acid","rx":"일반","tagline":"점막을 덮어 주는 제산제 — 빈속 통증에","simple":"1포, 하루 3번 식사 사이·취침 전. 4시간 이상 간격","for":["속쓰림","위통","위염 증상"]},{"id":"alginate","name":"알긴산 (개비스콘)","en":"Sodium alginate","class":"gi-acid","rx":"일반","tagline":"위 위에 ‘뗏목’을 띄워 역류를 막는 약","simple":"1~2포(10~20 mL), 식후·취침 전 하루 4번까지","for":["역류(신물·가슴쓰림)","식후 속쓰림"]},{"id":"antacid-mg","name":"수산화마그네슘 (제산 성분)","en":"Magnesium hydroxide","class":"gi-acid","rx":"일반","tagline":"제산제 속 마그네슘 — 변을 무르게 하는 쪽","simple":"복합 제산제 라벨대로","for":["제산(복합제 성분)"]},{"id":"digestive-enzyme","name":"소화효소제 (훼스탈·베아제)","en":"Digestive enzymes (pancreatin etc.)","class":"gi-digest","rx":"안전상비","tagline":"과식 후 더부룩함에 — 위산·통증에는 아님","simple":"1~2정, 하루 3번 식후. 씹지 않고","for":["과식 후 더부룩함","가스·트림"]},{"id":"simethicone","name":"시메티콘","en":"Simethicone","class":"gi-digest","rx":"일반","tagline":"가스 거품을 터뜨리는 성분 — 흡수되지 않아 안전","simple":"복합제 라벨대로 식후","for":["가스 참","더부룩함"]},{"id":"loperamide","name":"로페라마이드","en":"Loperamide","class":"bowel","rx":"일반","tagline":"설사를 멈추는 약 — 열·혈변이 있으면 절대 금지","simple":"처음 2캡슐, 이후 설사할 때마다 1캡슐. 하루 8 mg(4캡슐) 이내, 2일 이내","for":["갑자기 생긴 물설사(열·혈변 없는)"]},{"id":"smectite","name":"스멕타이트 (지사 흡착제)","en":"Dioctahedral smectite","class":"bowel","rx":"일반","tagline":"독소·수분을 흡착하는 지사제 — 2세 미만·임신 금지","simple":"1포(3 g), 하루 3번. 다른 약과 2시간 띄우기","for":["갑자기 시작된 설사(보조)"]},{"id":"bisacodyl","name":"비사코딜 (자극성 변비약)","en":"Bisacodyl","class":"bowel","rx":"일반","tagline":"밤에 먹고 아침에 — 급할 때 쓰는 자극성 완하제","simple":"2정, 취침 전 하루 1번. 씹지 않고, 1주 이내","for":["갑자기 생긴 변비","여행 변비"]},{"id":"magnesium-oxide","name":"마그네슘 변비약 (마그밀·마그밀에스)","en":"Magnesium hydroxide / magnesium oxide (laxative)","class":"bowel","rx":"일반","tagline":"매일 써도 되는 순한 삼투성 변비약 — 신장이 나쁘면 금지","simple":"500 mg 2~4정, 하루 1~2번 나눠서. 물 충분히","for":["오래된·습관성 변비","제산(보조)"]},{"id":"corn-unsap","name":"옥수수불검화정량추출물 (인사돌 등)","class":"oral","rx":"일반","tagline":"잇몸약 — 치과 치료를 받은 뒤 '보조'로만","simple":"성인 1회 1정, 하루 3회 식후. **1개월 써서 그대로면 멈추고 치과로 가세요.**"},{"id":"gum-combo","name":"잇몸 복합제 (이가탄 등)","class":"oral","rx":"일반","tagline":"카르바조크롬·아스코르브산·토코페롤·리소짐 — 역시 '보조'","simple":"성인 1회 1캡슐, 하루 3회 식후. **1개월 써서 그대로면 멈추고 치과로 가세요.**"},{"id":"chx-gel","name":"클로르헥시딘 잇몸 겔·가글","class":"oral","rx":"일반","tagline":"잇몸 염증에 실제로 듣는 소독 성분 — 단, 2주까지만","simple":"겔은 아침저녁 잇몸에 얇게, 가글은 하루 2번. **2주 넘게 이어 쓰지 않습니다**(이가 갈색으로 착색돼요)."},{"id":"saliva-sub","name":"인공타액·구강 보습 겔","class":"oral","rx":"일반","tagline":"입마름에 덧발라 주는 것 — 침을 만들어 주지는 않아요","simple":"마르다고 느낄 때마다, 특히 **자기 전**에 입안과 혀에 얇게. 횟수 제한은 없어요."},{"id":"xylitol-gum","name":"무설탕 자일리톨 껌·캔디","class":"oral","rx":"일반","tagline":"씹어서 침을 돌게 하는 것 — 입마름의 1순위","simple":"입이 마를 때마다 5~10분 씹으세요. 하루 여러 번 괜찮아요."},{"id":"peppermint-oil","name":"페퍼민트 오일 (장용 캡슐)","class":"gi-spasm2","rx":"건기식","tagline":"배 아픈 과민성대장에 — 4명 중 1명이 덕을 봅니다(국내는 건강기능식품)","simple":"식전 30분, 하루 2~3회. **장에서 녹는 캡슐(장용)**로 드셔야 속이 안 쓰려요."},{"id":"acetylcysteine","name":"아세틸시스테인 (뮤테란)","en":"Acetylcysteine","class":"cold","rx":"일반","tagline":"끈적한 가래를 묽게 — 진료실 감기 처방의 단골","simple":"캡슐을 물과 함께, 하루 2~3회. 물을 많이 드셔야 가래가 잘 나와요","for":["끈적한 가래","기관지염·감기 뒤 가래"]},{"id":"mosapride","name":"모사프리드 (가스모틴)","en":"Mosapride","class":"gi-digest","rx":"전문","tagline":"위를 움직이게 하는 처방약 — 소염제 먹는 동안 더부룩할 때","simple":"처방대로 (보통 식전 하루 3회)","for":["소화불량·더부룩함","약 먹는 동안 메스꺼움"]},{"id":"cefixime","name":"세픽심 (슈프락스)","en":"Cefixime","class":"antibiotic","rx":"전문","tagline":"3세대 세팔로스포린 — 부비동염·편도염·중이염에, 끝까지","simple":"처방대로 하루 1~2회, 끝까 :["칸디다 질염(곰팡이 질염)"]},{"id":"felbinac","name":"펠비낙 파스 (뉴비낙·노펜펠비낙 등)","en":"Felbinac (topical)","class":"topical","rx":"일반","tagline":"케토톱만 있는 게 아니에요 — 약국 소염 파스의 또 한 갈래","simple":"아픈 자리에 1매, 하루 2번","for":["관절염","어깨 통증","건초염·테니스엘보","근육통","삔 뒤의 붓기"]},{"id":"ibuprofen-patch","name":"이부프로펜 파스 (이부스타·이부쿨 등)","en":"Ibuprofen (topical patch)","class":"topical","rx":"일반","tagline":"하루 한 번만 붙이면 되는 소염 파스","simple":"아픈 자리에 1매, 하루 1번 (24시간마다)","for":["관절염","어깨 통증","건초염·테니스엘보","근육통","삔 뒤의 붓기"]},{"id":"erdosteine","name":"에르도스테인 (엘도스)","en":"Erdosteine","class":"cold","rx":"일반","tagline":"가래를 묽게 — 뮤테란보다 오래가고 하루 두세 번","simple":"1회 1캡슐(300 mg), 하루 2~3번 + 물 많이","for":["가래 기침","가래가 끈적해 안 떨어질 때"]},{"id":"ambroxol","name":"암브록솔 (뮤코펙트 계열)","en":"Ambroxol","class":"cold","rx":"일반","tagline":"가래를 묽게 — 하루 세 번, 좋아지면 두 번","simple":"1회 1정(30 mg), 하루 3번 — 좋아지면 2번","for":["가래 기침","기관지염"]},{"id":"povidone-iodine","name":"포비돈요오드 (포비딘·베타딘)","en":"Povidone-iodine","class":"skin","rx":"일반","tagline":"상처 소독의 기본 — 다만 「깨끗한 생채기」에는 물이 낫습니다","simple":"아픈 자리에 얇게, 하루 여러 번. 깨끗한 생채기엔 물로 씻기","for":["상처 소독","화상 부위 소독","목 살균(스프레이)"]},{"id":"albendazole","name":"알벤다졸 (구충제)","en":"Albendazole","class":"antibiotic","rx":"일반","tagline":"요충은 「7일 뒤 한 번 더」 — 그리고 온 가족이 같이","simple":"1정(400 mg). 요충이면 7일 뒤 1정 더 — 온 가족이 같이","for":["구충","항문이 가려울 때(요충)"]},{"id":"genta-steroid-cream","name":"겐타마이신 복합 연고 (나이베라·노바손 등)","en":"Betamethasone + gentamicin cream","class":"skin","rx":"일반","tagline":"긁어서 곪은 습진에 — 스테로이드와 항생제가 함께","simple":"얇게, 하루 1~3번. 일주일 넘기지 않기","for":["긁어서 곪은 습진","진물이 나는 피부염","1도 화상"]},{"id":"probiotic-otc","name":"정장제 (비오플·메디락 등)","en":"Bacillus / Lactobacillus (OTC)","class":"bowel","rx":"일반","tagline":"약국에서 파는 유산균 — 항생제 설사에 쓸 만합니다","simple":"제품에 적힌 대로, 하루 3번. 항생제와는 2~3시간 띄우기","for":["묽은 변·설사","항생제 드시는 동안"]},{"id":"ginkgo","name":"은행잎 추출물 (기넥신·타나민)","en":"Ginkgo biloba extract EGb 761","class":"antihistamine","rx":"일반","tagline":"진료실에서 어지럼에 자주 내는 약 — 베타히스틴만큼은 하지만, 그 베타히스틴이 문제예요","simple":"1회 40~80 mg, 하루 2~3회 (제품 라벨 확인). 효과를 보려면 **몇 주**는 드셔야 해요","for":["어지럼(원인을 확인한 뒤 보조)","손발 저림·말초 순환","기억력 저하(보조)"]},{"id":"nicotine-patch","name":"니코틴패치 (금연 보조제)","en":"Nicotine transdermal patch","class":"quit","rx":"일반","tagline":"담배 대신 니코틴을 피부로 천천히 — 끊을 때 오는 금단을 줄여요","simple":"하루 한 장, 매일 다른 자리에","for":["담배를 끊을 때 금단 증상 줄이기"]},{"id":"nicotine-gum","name":"니코틴껌 (금연 보조제)","en":"Nicotine polacrilex gum","class":"quit","rx":"일반","tagline":"피우고 싶은 순간에 바로 — 씹다가 물고 있는 약","simple":"피우고 싶을 때 1개 — 씹다가 물고 있기","for":["담배를 끊을 때 갑자기 몰려오는 흡연 충동"]},{"id":"minoxidil","name":"미녹시딜 (바르는 탈모약)","en":"Minoxidil topical","class":"skin","rx":"일반","tagline":"서서히 옅어지는 유전형 탈모에 — 넉 달은 꾸준히","simple":"하루 두 번, 마른 두피에, 넉 달","for":["남성형 탈모(정수리·이마가 서서히)","여성형 탈모(정수리 쪽이 넓게 옅어짐) — 2~3% 제품만"]},{"id":"salicylic-corn","name":"티눈약 (살리실산 반창고·물약)","en":"Salicylic acid corn plaster / solution","class":"skin","rx":"일반","tagline":"딱딱한 살을 무르게 해서 벗겨 내요 — 티눈 자리에만","simple":"티눈 자리에만, 2~5일마다 갈기","for":["티눈","굳은살(못)","사마귀 (반창고 제품 — 헷갈리면 피부과에서 먼저 확인)"]},{"id":"domperidone","name":"돔페리돈 (메스꺼움·구토 약)","en":"Domperidone","class":"gi-digest","rx":"일반","tagline":"메스껍고 토할 때 짧게 — 일주일을 넘기지 않아요","simple":"식사 전 1병, 하루 3번까지, 일주일 이내","for":["메스꺼움","구토"]},{"id":"ketoconazole-shampoo","name":"케토코나졸 샴푸 (비듬·지루피부염)","en":"Ketoconazole 2% shampoo","class":"skin","rx":"일반","tagline":"비듬 원인 곰팡이를 줄이는 약용 샴푸 — 3~5분 두었다 헹궈요","simple":"주 2번, 3~5분 두었다 헹굼","for":["비듬","지루피부염(두피·얼굴)","어루러기"]},{"id":"ciclopirox-shampoo","name":"시클로피록스 샴푸 (지루피부염)","en":"Ciclopirox olamine shampoo","class":"skin","rx":"일반","tagline":"케토코나졸과 효과가 비슷한 다른 계열의 항진균 샴푸","simple":"주 2~3번, 3~5분 두었다 헹굼","for":["지루피부염(두피)"]},{"id":"ketoprofen","name":"케토프로펜 파스 (케토톱)","en":"Ketoprofen (topical)","class":"topical","rx":"일반","tagline":"붙이는 소염제 — 효과 좋지만 ‘햇빛 2주 주의’","simple":"1매, 하루 2번 부착. 떼고 2주간 햇빛 차단","for":["근육통","염좌·타박","관절통(한 부위)"]},{"id":"piroxicam","name":"피록시캄 패치 (트라스트)","en":"Piroxicam (topical)","class":"topical","rx":"일반","tagline":"2일에 한 장 — 오래 가는 붙이는 소염제","simple":"1매, 2일마다 부착","for":["관절통","근육통(한 부위)"]},{"id":"diclofenac-topical","name":"디클로페낙 겔 (볼타렌 에멀겔)","en":"Diclofenac (topical gel)","class":"topical","rx":"일반","tagline":"바르는 소염제 중 근거 1위 — 5명이 바르면 3명이 덕을 봐요","simple":"체리 1~2알 크기를 하루 3~4번 문질러 바르기","for":["염좌·타박","무릎·손 관절염","근육통(한 부위)"]},{"id":"flurbiprofen","name":"플루르비프로펜 (스트렙실 트로키·패치)","en":"Flurbiprofen","class":"topical","rx":"일반","tagline":"목 아플 때 녹여 먹는 소염제 — 11분 만에 첫 완화","simple":"트로키 1개를 3~6시간마다 천천히 녹여서. 하루 5개, 3일 이내","for":["인후통","한 자리 통증(패치)"]},{"id":"methyl-salicylate","name":"살리실산메틸 파스 (신신파스·제일쿨파프)","en":"Methyl salicylate (rubefacient)","class":"topical","rx":"안전상비","tagline":"편의점 파스 — 온파스(뻐근함) vs 냉파프(삐끗 초기)","simple":"1매, 하루 1~2번 부착. 핫팩 금지","for":["근육통·뻐근함","삐끗 초기(냉파프)"]},{"id":"menthol","name":"멘톨 (냉감 성분)","en":"Menthol","class":"topical","rx":"일반","tagline":"시원한 느낌으로 통증을 가리는 성분","simple":"제품 라벨대로","for":["한 자리 통증(보조)","가려움"]},{"id":"chlorpheniramine","name":"클로르페니라민 (1세대 항히스타민)","en":"Chlorpheniramine","class":"antihistamine","rx":"안전상비","tagline":"감기약 속 콧물 성분 — 졸리고, 노인에겐 위험","simple":"감기약 1회분, 하루 3번 식후. 졸림 — 운전 금지","for":["콧물·재채기(감기)","두드러기(단기)"]},{"id":"pseudoephedrine","name":"슈도에페드린 (코막힘)","en":"Pseudoephedrine","class":"cold","rx":"제품별","tagline":"코막힘에 가장 확실 — 단일제는 처방, 종합감기약 속에는 약국","simple":"단일제는 처방대로 · 종합감기약은 라벨대로 (저녁 늦게는 피하기)","for":["코막힘","코감기"]},{"id":"phenylephrine","name":"페닐레프린 (코막힘)","en":"Phenylephrine","class":"cold","rx":"안전상비","tagline":"먹는 형태는 효과가 약하다는 평가 — 슈도에페드린의 대체","simple":"복합제 1회분, 하루 3번 식후","for":["코막힘(감기 복합제)"]},{"id":"methylephedrine","name":"메틸에페드린 (기침·코막힘)","en":"dl-Methylephedrine","class":"cold","rx":"일반","tagline":"국내 감기약 특유의 기관지 확장·코막힘 성분","simple":"복합제 1회분, 하루 3번 식후","for":["기침·코막힘(감기 복합제)"]},{"id":"dextromethorphan","name":"덱스트로메토르판 (마른기침)","en":"Dextromethorphan","class":"cold","rx":"일반","tagline":"기침 중추를 눌러 마른기침을 줄이는 성분","simple":"복합제 1회분, 하루 3번 (마른기침, 취침 전 우선)","for":["마른기침"]},{"id":"guaifenesin","name":"구아이페네신 (가래)","en":"Guaifenesin","class":"cold","rx":"일반","tagline":"가래를 묽게 해 뱉기 쉽게 — 물을 많이 마셔야 효과","simple":"복합제 1회분, 하루 3번 + 물 많이","for":["가래 기침"]},{"id":"cetirizine","name":"세티리진 (지르텍)","en":"Cetirizine","class":"antihistamine","rx":"일반","tagline":"2세대 중 가장 강하고 빠른 편 — 대신 3명 중 1명은 졸림","simple":"10 mg 1정, 하루 1번 취침 전","for":["알레르기 비염","두드러기","가려움"]},{"id":"loratadine","name":"로라타딘 (클라리틴)","en":"Loratadine","class":"antihistamine","rx":"일반","tagline":"졸음 거의 없는 하루 한 알 — 낮 활동용","simple":"10 mg 1정, 하루 1번 아침","for":["알레르기 비염","두드러기","가려움"]},{"id":"fexofenadine","name":"펙소페나딘 (알레그라)","en":"Fexofenadine","class":"antihistamine","rx":"일반","tagline":"졸음이 가장 적은 항히스타민제 — 과일주스와 먹지 말 것","simple":"120 mg 1정, 하루 1번 식전 물과 함께 (주스 X)","for":["알레르기 비염","두드러기"]},{"id":"xylometazoline","name":"자일로메타졸린 (오트리빈 스프레이)","en":"Xylometazoline (nasal)","class":"antihistamine","rx":"일반","tagline":"뿌리면 몇 분 안에 코가 뚫림 — 단, 3일 규칙","simple":"각 콧구멍 1회 분무, 하루 3번 이내. 3일만","for":["코막힘(감기·비염)"]},{"id":"mometasone","name":"스테로이드 비강분무제 (나조넥스 등)","en":"Intranasal corticosteroid","class":"antihistamine","rx":"전문","tagline":"알레르기 비염 1차 치료 — 국내에선 처방약","simple":"처방대로 (각 비강 1~2회, 하루 1번, 매일)","for":["알레르기 비염(지속형)","코막힘"]},{"id":"diphenhydramine","name":"디펜히드라민 (수면유도제)","en":"Diphenhydramine","class":"sleep","rx":"일반","tagline":"약국 수면유도제 — 며칠만, 65세 이상은 피하기","simple":"50 mg, 취침 30분 전 1번. 2주 이내","for":["일시적 불면(며칠)"]},{"id":"doxylamine","name":"독시라민 (수면유도제)","en":"Doxylamine","class":"sleep","rx":"일반","tagline":"디펜히드라민보다 길게 가는 수면유도제 — 다음날 더 멍함","simple":"25 mg, 취침 전 1번. 2주 이내","for":["일시적 불면"]},{"id":"scopolamine","name":"스코폴라민 패치 (키미테)","en":"Scopolamine (transdermal)","class":"sleep","rx":"일반","tagline":"출발 4시간 전 귀 뒤에 — 어린이용은 처방약","simple":"출발 4시간 전 귀 뒤에 1매. 3일 지속","for":["멀미 예방(장거리)"]},{"id":"dimenhydrinate","name":"디멘히드리네이트 (보나링에이)","en":"Dimenhydrinate","class":"sleep","rx":"일반","tagline":"타기 30분~1시간 전 먹는 멀미약 — 졸음은 각오","simple":"1~2정, 출발 30분~1시간 전","for":["멀미 예방"]},{"id":"fusidic-acid","name":"퓨시드산 (후시딘)","en":"Fusidic acid (topical)","class":"skin","rx":"일반","tagline":"바르는 항생제 — 감염된 상처에만, 단순 긁힘엔 불필요","simple": 야간뇨"]},{"id":"tamsulosin","name":"탐스로신 (하루날디)","en":"Tamsulosin","class":"urology","rx":"전문","tagline":"전립선비대 — 소변 길을 넓혀 주는 약","simple":"하루 1번, 저녁 식사 후 1정","for":["전립선비대증","소변 줄기 약함·잔뇨감","야간뇨"]},{"id":"bisphosphonate","name":"비스포스포네이트 (포사맥스·악토넬)","en":"Bisphosphonates (alendronate, risedronate)","class":"bone","rx":"전문","tagline":"골다공증 1차 치료제 — 먹는 법을 지켜야 효과가 납니다","simple":"주 1회, 아침 빈속에 맹물 한 컵과 — 먹고 30분은 눕지 않기","for":["골다공증","골절 예방","스테로이드 오래 드셔서 생기는 뼈 손실"]},{"id":"vitamin-d-rx","name":"비타민D (콜레칼시페롤)","en":"Cholecalciferol (vitamin D3)","class":"bone","rx":"일반","tagline":"골다공증 치료의 짝 — 다만 '먹으면 골절이 준다'는 아니에요","simple":"하루 1번 800~1,000 IU, 식사와 함께","for":["비타민D 결핍","골다공증 치료 보조","햇빛을 거의 못 보는 경우"]},{"id":"trimebutine","name":"트리메부틴 (포리부틴)","en":"Trimebutine maleate","class":"spasm","rx":"일반","tagline":"쥐어짜는 아픔을 푸는 약 — 어르신께 부담이 적은 쪽","simple":"하루 3번, 식전에 1정","for":["배가 꼬이는 복통","과민성 장 증상","방광이 쥐어짜듯 아플 때","소화불량"]},{"id":"tiropramide","name":"티로프라미드 (티로파)","en":"Tiropramide","class":"spasm","rx":"전문","tagline":"경련성 통증에 병원에서 쓰는 진경제","simple":"처방대로 (보통 하루 3번 1정)","for":["방광염의 경련성 통증","요로결석 산통","담도·장 경련"]},{"id":"butylscopolamine","name":"부틸스코폴라민 (부스코판)","en":"Hyoscine butylbromide","class":"spasm","rx":"일반","tagline":"배가 꼬일 때 약국에서 — 어르신은 조건을 먼저 확인","simple":"1회 1~2정, 하루 3~5번까지","for":["배가 꼬이는 복통","생리통","장 경련"]},{"id":"mht","name":"폐경호르몬요법 (에스트로겐·티볼론)","en":"Menopausal hormone therapy","class":"women","rx":"전문","tagline":"갱년기 증상에 가장 잘 듣는 치료 — 시작 시기가 이득을 가릅니다","simple":"처방대로 (대개 하루 1정)","for":["갱년기 열감·식은땀","폐경 뒤 불면·기분 변화","질 건조·성교통","조기 폐경"]}],"meta":{"version":"2.0","reviewed":"2026-09","reviewLabel":"전문의 검수","reviewer":"내과 전문의 박현욱","stamp":"전문의 검수 · 2026.09","disclaimer":"이 정보는 참고용이에요. 진단과 처방은 의사만 할 수 있고, 약 선택이 어렵거나 증상이 계속되면 약사·의사와 상의하세요.","suppDisclaimer":"영양제 정보는 참고용이에요. 질환이 있거나 약을 드시는 분은 시작 전에 의사·약사와 상의하세요. 근거 표시는 2026년 9월 기준 문헌이에요.","about":"약지도는 ‘증상에 맞는 약을 의사가 고르듯’ 고를 수 있게 만든 앱이에요. 임상에서 처방하는 조합(진통·소염·근이완·위보호)을 약국·편의점에서 살 수 있는 성분으로 풀어 주고, 같은 계열 안에서 무엇이 위장·심장에 덜 부담인지, 영양제는 어떤 제형·함량이 의미 있는지 근거와 함께 보여드려요. 식약처 공공데이터(e약은요·낱알식별)를 함께 실었어요.","method":["모든 임상 수치·권고는 PubMed 문헌(코크란·대규모 무작위 비교 시험·메타분석), 진료 지침(ACP·ACOG·AGA 등), 식약처 허가사항을 직접 확인해 등록했어요. 확인하지 못한 값은 [확인 필요]로 표시했어요.","성분별 ‘부담 정도’는 SOS 프로젝트(Castellsague 2012)의 위장관 상대위험과 CNT 2013·PRECISION의 심혈관 자료를 5단계로 옮긴 상대 비교예요.","‘항콜린 부담’ 점수는 국제 항콜린 부담 척도(ACB·Kiesel 2018 등)의 없음/약함/중간/강함 등급을 참고해, 근거가 분명한 성분에만 매겼어요. 척도마다 판정이 갈리므로(Naples 2015) 진단이 아니라 약사·의사와 상의할 거리로 쓰시라고 안내해요. 등급을 매기지 못한 성분은 0으로 두었어요.","‘단일제가 없고 복합제 안에만 있는 성분’은 제품 이름을 앞세우지 않아요. 종합감기약을 두 번 사서 같은 성분을 겹쳐 드시는 일을 막기 위해서예요.","제품 정보는 식약처 의약품안전나라·약학정보원 허가사항과 제조사 자료를 기준으로 했고, 식약처 공공데이터(e약은요 4,766건·낱알식별 일반의약품 5,660건)를 그대로 실었어요.","내과 전문의가 내용을 검수했어요. 다만 이 앱은 진료를 대신하지 않아요 — 개인의 상태는 의사·약사와 확인하세요.","내 정보·내 약통은 이 기기에만 저장되고 어디로도 전송되지 않아요."],"photoEndpoint":"","photoNote":"사진은 서버에 저장하지 않고 읽은 뒤 바로 버려요. 읽은 결과도 이 기기에만 남아요."},"supplements":[{"id":"vitd","name":"비타민 D","en":"Vitamin D3 / D2","tags":["비타민D","뼈","칼슘","고려은단 비타민D","종근당 비타민D3","뉴트리코어 비타민D","센트룸(포함)"],"brands":["고려은단 비타민D","종근당 비타민D3","뉴트리코어 비타민D","센트룸(포함)"],"evidence":"강함"},{"id":"omega3","name":"오메가-3 (EPA+DHA)","en":"Omega-3","tags":["오메가3","EPA","DHA","피쉬오일","중성지방","종근당 오메가3","뉴트리코어 rTG 오메가3","안국 알티지 오메가3","대웅 rTG 오메가3"],"brands":["종근당 오메가3","뉴트리코어 rTG 오메가3","안국 알티지 오메가3","대웅 rTG 오메가3","피쉬오일"],"evidence":"중간"},{"id":"mg","name":"마그네슘","en":"Magnesium","tags":["마그네슘","눈떨림","경련","수면","닥터스베스트 마그네슘","종근당 마그네슘","뉴트리코어 마그네슘","마그밀(변비약)"],"brands":["닥터스베스트 마그네슘","종근당 마그네슘","뉴트리코어 마그네슘","마그밀(변비약)"],"evidence":"약함"},{"id":"probiotic","name":"프로바이오틱스(유산균)","en":"Probiotics","tags":["유산균","프로바이오틱스","장","CFU","락토핏","듀오락","지큐랩","비오비타","메디락","종근당 락토핏"],"brands":["락토핏","듀오락","지큐랩","비오비타","메디락","종근당 락토핏"],"evidence":"중간"},{"id":"iron","name":"철분","en":"Iron","tags":["철분","빈혈","철결핍","훼로바","헤모큐","볼그레","페리트","철분제"],"brands":["훼로바","헤모큐","볼그레","페리트","철분제"],"evidence":"강함"},{"id":"calcium","name":"칼슘","en":"Calcium","tags":["칼슘","뼈","골다공증","칼마디","센트룸 칼슘","종근당 칼슘","디카맥스"],"brands":["칼마디","센트룸 칼슘","종근당 칼슘","디카맥스"],"evid ":"약 이름과 고르기","src":["fda_apap","nedrug_search"]},{"id":"fever-not-cure","title":"해열제는 ‘치료’가 아니라 ‘증상 조절’이에요","icon":"temp","body":"해열제는 열을 잠시 내려 몸을 편하게 해 줄 뿐, 열의 **원인(감염 등)을 없애지는 않아요**. 그래서 열이 내렸다고 다 나은 게 아니고, 해열제로 버티는 동안 원인이 자라기도 해요. **3일 넘게 열이 계속되거나, 내렸다가 다시 오르거나, 아이가 처지면** 약을 더 사지 말고 병원에서 원인을 확인하세요.","link":"/symptom/fever","linkText":"열이 날 때 병원 기준 보기","group":"열·감기·배탈일 때","src":["mfds_tylenol_kids"]},{"id":"one-nsaid","title":"소염제는 한 번에 한 가지만","icon":"scale","body":"이부프로펜·나프록센·아스피린·게보린(이소프로필안티피린)·펜잘(에텐자미드)·처방 소염제(아세클로페낙 등)는 모두 **같은 계열**이에요. 같은 효소를 막는 약이라 겹쳐 먹어도 진통 효과는 거의 늘지 않는데, **몸에 들어가는 양만 두 배**가 됩니다. 위장과 콩팥 부담은 **양이 많아질수록 커져요.**\n\n진통을 더하고 싶으면 계열이 다른 아세트아미노펜을 **함께** 드세요 — 이 조합은 각각 단독보다 잘 듣는다는 근거가 있어요.","link":"/class/nsaid","linkText":"소염제 비교 보기","group":"제대로 드시는 법","src":["castellsague2012","cnt2013"]},{"id":"tid","title":"‘하루 3번 식후’의 뜻","icon":"clock","body":"처방전의 ‘1일 3회 식후 30분’은 **아침·점심·저녁 밥 먹고 30분 뒤**, 대략 **8시간 간격**이라는 뜻이에요. 끼니를 걸렀다고 약을 거르지 말고, 우유나 간식과 함께 드세요(소염제는 빈속을 피해야 해요). 한 번 잊었으면 생각난 즉시 드시되, 다음 시간이 가까우면 건너뛰고 **두 배로 먹지 마세요**.","link":"/schedule","linkText":"복용 시간 알림 만들기","group":"제대로 드시는 법","src":["nedrug_search"]},{"id":"apap-total","title":"아세트아미노펜은 하루 4 g이 끝","icon":"alert","body":"500 mg 정제로 8정이에요. 감기약·복합진통제·수면유도제 속 아세트아미노펜까지 **모두 합쳐서** 4 g이고, 술을 자주 드시거나 체중이 적으면 3 g 이하가 안전해요. 이 선을 넘기면 간이 다치는데, 초기엔 증상이 없어서 더 위험해요.","link":"/drug/acetaminophen","linkText":"총량 계산 기준 보기","group":"제대로 드시는 법","src":["fda_apap"]},{"id":"elderly","title":"어르신 약, 세 가지만 기억하세요","icon":"user","body":"① 소염제는 **위보호제와 함께, 짧게** — 65세가 넘으면 위장출혈과 콩팥 부담이 커요. ② **감기약·수면유도제·멀미약**(1세대 항히스타민)은 어지럼·넘어짐·소변 막힘을 일으켜 되도록 피해요. ③ 드시는 약을 **한 장에 적어** 약국·병원에 보여 주세요 — 이 앱의 ‘내 약통’이 그 한 장이에요.","link":"/senior","linkText":"어르신이 한 번 더 볼 약 보기","group":"조심할 것","src":["beers2023"]},{"id":"two-names","title":"약 이름이 두 개인 이유","icon":"pill","body":"약에는 이름이 둘이에요. **성분명**은 세계 어디서나 같은 진짜 이름이고, **상품명**은 회사가 붙인 별명이에요. 아세트아미노펜이라는 한 성분에 타이레놀·세토펜·써스펜 같은 별명이 여럿 붙는 거예요. 병원에서 받은 약과 약국에서 산 약이 겹치는지 보려면 **상자 뒷면의 성분명**을 보셔야 해요. 이름이 달라도 성분이 같으면 두 배로 드시는 셈이에요.","link":"/pill","linkText":"내 약 성분 확인하기","group":"약 이름과 고르기","src":["kesselheim2008generic","nedrug_search"]},{"id":"expiry","title":"약에도 유통기한이 있어요","icon":"clock","body":"상자에 적힌 날짜는 **뜯지 않은 상태**의 기한이에요. 뜯은 뒤에는 훨씬 짧아져요. 가루약·물약은 대개 **한 달**, 안약은 뜯고 **한 달**, 일회용 인공눈물은 **그날** 버리세요. 조제받은 약은 그 병에 대해 처방된 것이라 다음에 비슷한 증상이라고 남은 걸 드시면 안 돼요. 색이 변하거나 냄새가 나거나 알약이 부스러지면 기한과 상관없이 버리세요.","link":"/pill","linkText":"약 이름·알약으로 확인","group":"보관하고 버리기","src":["nedrug_search"]},{"id":"storage","title":"약은 어디에 두어야 할까요","icon":"info","body":"대부분의 약은 **서늘하고 건조하고 빛이 안 드는 곳**이 좋아요. 흔한 실수가 두 가지예요. 첫째, **화장실 선반** — 습기와 온도 변화가 커서 약이 가장 빨리 상하는 곳이에요. 둘째, **원래 상자를 버리는 것** — 상자에 유효기간과 성분이 적혀 있어요. 시럽은 냉장이 필요한 것과 아닌 것이 나뉘니 라벨을 확인하세요. 남은 약은 쓰레기통이 아니라 **약국의 폐의약품 수거함**에 넣어 주세요.","link":"/schedule","linkText":"오늘 약 체크","group":"보관하고 버리기","src":["nedrug_search"]},{"id":"with-water","title":"약은 물로 드셔야 하는 이유","icon":"drop","body":"물 말고 다른 음료로 드시면 약이 달라져요. **자몽주스**는 여러 약의 분해를 막아 농도를 위험하게 올려요. **우유·제산제**는 일부 항생제와 골다공증약이 흡수되는 것을 막아요. **녹차·홍차**는 철분제 흡수를 떨어뜨려요. **술**은 거의 모든 약과 나쁘게 만나고, 특히 아세트아미노펜과는 간에, 소염제와는 위에 부담을 줍니다. 물 한 컵을 가득, 그리고 삼킨 뒤 바로 눕지 마세요.","link":"/drug/bisacodyl","linkText":"알약 삼키는 법 예","group":"제대로 드시는 법","src":["an2015beverage","skelin2017levo","gugler1990antacid"]},{"id":"cut-pill","title":"알약을 반으로 잘라도 될까요","icon":"pill","body":"**가운데 홈이 있으면** 자르라고 만든 약이니 잘라도 돼요. 홈이 없으면 자르지 마세요. 특히 이름에 **‘서방정·이알(ER)·CR·XR’**이 붙은 약은 하루 종일 조금씩 녹아 나오게 만든 약이라, 자르거나 씹으면 하루치가 한꺼번에 쏟아져 위험할 수 있어요. 캡슐을 열어 가루만 드시는 것도 같은 이유로 함부로 하면 안 돼요. 삼키기 힘드시면 **같은 성분의 시럽이나 잘라도 되는 제품**이 있는지 약사에게 물어보세요.","link":"/pill","linkText":"내 알약 찾아보기","group":"제대로 드시는 법","src":["pereira2018split"]},{"id":"missed-dose","title":"약을 깜빡했을 때","icon":"clock","body":"원칙은 하나예요. **생각났을 때 바로 드시되, 다음 먹을 시간이 가까우면 건너뛰세요.** 절대 두 배로 드시면 안 돼요. 하루 세 번 약을 저녁에 깜빡했다면 그냥 넘기고 다음 날 아침부터 이어 가시면 됩니다.\n\n다만 **항생제는 띄엄띄엄 드시는 것이 가장 나쁩니다** — 약이 균을 죽일 만큼 쌓이지 못한 채 균만 약에 익숙해져요. 정해진 날짜와 간격을 지키시고, 일찍 끝내고 싶으면 스스로 끊지 마시고 처방한 곳에 여쭤 보세요.\n\n자주 깜빡하신다면 알림을 맞춰 두세요.","link":"/schedule","linkText":"복용 시간 알림 만들기","group":"제대로 드시는 법","src":["nedrug_search","llewelyn2017course"]},{"id":"before-after-meal","title":"식전·식후가 정해진 이유","icon":"stomach","body":"**식후**는 대개 위를 보호하려는 뜻이에요. 소염제처럼 위에 부담이 큰 약이 여기 들어가요. **식전 30분**은 음식이 흡수를 방해하거나, 밥 먹기 전에 미리 작용해야 하는 약이에요 — 위산 억제제나 일부 당뇨약이 그렇습니다. **빈속(식전 1시간·식후 2시간)**은 음식이 있으면 아예 흡수가 안 되는 약이에요. 갑상선약과 골다공증약이 대표적이에요. 헷갈리면 봉투에 적힌 대로가 정답이고, 그게 없으면 약사에게 물어보세요.","link":"/schedule","linkText":"복용 시간 정하기","group":"제대로 드시는 법","src":["gertz1995alendronate","skelin2017levo","nedrug_search"]},{"id":"antibiotics","title":"항생제는 끝까지, 감기엔 안 써요","icon":"shield","body":"항생제는 **세균**을 죽이는 약이에요. 감기와 독감은 **바이러스**라 항생제가 듣지 않아요. 그런데도 쓰면 몸속 좋은 균만 죽어 설사가 나고, 다음에 진짜 필요할 때 약이 안 듣게 돼요.\n\n**처방받은 날짜를 지키세요.** 다만 「중간에 끊으면 균이 더 강해진다」는 오래된 설명은 근거가 뚜렷하지 않습니다 — 요즘은 오히려 **처음부터 짧게 쓰는 쪽**이 내성을 줄인다고 봐요. 그래서 「며칠 남았는데 다 나았어요」 싶으면 **스스로 끊지 마시고 처방한 곳에 여쭤 보세요.** 짧게 끝내도 되는 병이 있고, 결핵처럼 반드시 길게 써야 하는 병도 있습니다.\n\n그리고 **남은 항생제를 보관했다가 다음에 드시는 것**은 가장 흔하고 위험한 습관이에요 — 그때의 균과 지금의 균이 다르고, 양이 모자라 오히려 내성만 키웁니다.","link":"/class/antibiotic","linkText":"항생제 계열 보기","group":"열·감기·배탈일 때","src":["llewelyn2017course","acp2021short"]},{"id":"steroid-fear","title":"스테로이드, 무서워만 할 일은 아니에요","icon":"info","body":"스테로이드는 염증을 끄는 힘이 아주 센 약이에요. 어르신들이 ‘뼈 녹는 약’이라며 겁내시는데, **문제가 되는 건 오래 먹거나 넓게 오래 바를 때**예요. 피부에 며칠 바르거나 관절에 가끔 주사 맞는 것은 대개 안전합니다. 반대로 **함부로 오래 쓰면** 정말 문제가 돼요 — 무좀에 스테로이드를 바르면 곰팡이가 번지고, 얼굴에 오래 바르면 피부가 얇아져요. **의사가 정해 준 기간을 지키는 것**, 그리고 **먹는 스테로이드를 갑자기 끊지 않는 것**이 핵심이에요.","link":"/symptom/eczema","linkText":"습진 화면에서 바르는 법","group":"조심할 것","src":["mfds_genta_topical"]},{"id":"polypharmacy","title":"먹는 약이 다섯 가지가 넘는다면","icon":"user","body":"여러 병원에서 약을 받다 보면 같은 성분이 겹치거나 서로 부딪히는 일이 생겨요. 특히 어르신은 **졸림·어지럼·변비·소변 막힘**이 겹쳐 넘어지는 일로 이어지기 쉬워요. 일 년에 한 번은 **드시는 약을 전부 한 봉투에 담아** 의사나 약사에게 보여 주세요. 이걸 약 정리(복약 점검)라고 하는데, 빼도 되는 약이 생각보다 많이 나옵니다. 이 앱의 ‘내 약통’에 등록해 두시면 성분이 겹치는지 자동으로 알려 드려요.","link":"/me","linkText":"내 약통에 등록하기","group":"조심할 것","src":["beers2023"]},{"id":"generic","title":"복제약은 효과가 떨어지나요","icon":"scale","body":"아니요. 복제약(제네릭)은 **오리지널 약과 성분·함량이 같고, 몸에 흡수되는 양도 같다는 시험(생물학적동등성)을 통과해야만** 허가가 나요. 값이 싼 이유는 개발비가 들지 않았기 때문이지 약이 부실해서가 아니에요. 다만 색·모양·크기는 다를 수 있어서, 병원이나 약국을 옮기면 같은 약인데 모양이 달라 놀라시는 경우가 많아요. 그럴 때는 **성분명이 같은지** 확인하시면 됩니다.","link":"/pill","linkText":"낱알 모양으로 찾아보기","group":"약 이름과 고르기","src":["kesselheim2008generic"]},{"id":"supplement-not-drug","title":"영양제는 약이 아니에요","icon":"leaf","body":"건강기능식품은 **부족한 것을 채우는 것**이지 병을 고치는 약이 아니에요. 그런데 약처럼 작용하는 것들이 있어 조심해야 해요. **오메가3와 은행잎은** 피 묽게 하는 약과 만나면 출혈 위험을 올리고, **칼슘·철분·마그네슘은** 갑상선약과 일부 항생제의 흡수를 막아요. 수술 예정이면 **일주일 전에는 알리셔야** 합니다. 그리고 종합비타민과 개별 영양제를 같이 드시면 상한을 넘기기 쉬워요.","link":"/supp","linkText":"내 영양제 겹치는지 보기","group":"약 이름과 고르기","src":["skelin2017levo","gugler1990antacid","mfds_hff"]},{"id":"elderly-caution","title":"어르신이 특히 조심할 약","icon":"user","body":"나이가 들면 콩팥과 간이 약을 처리하는 속도가 느려져 **같은 양이라도 더 세게 작용**해요. 특히 조심할 것들이에요. **졸리는 감기약·수면유도제·멀미약**(항히스타민)은 어지럼·소변 막힘, 그리고 넘어지는 일을 부릅니다. **소염제**는 위장 출혈과 콩팥 부담이 젊을 때보다 훨씬 커요. **근이완제**는 졸음으로 넘어지기 쉬워요. 그래서 어르신께는 아세트아미노펜과 바르는 약을 먼저 권해요. 새 약을 드시고 어지럽거나 멍하면 참지 마시고 알리세요.","link":"/senior","linkText":"나이가 들면 달라지는 약 — 40가지 보기","group":"조심할 것","src":["beers2023"]},{"id":"when-er","title":"이럴 땐 약 대신 119","icon":"alert","body":"약으로 버티면 안 되는 신호가 있어요. **가슴이 짓눌리듯 아프고 식은땀이 남**(심근경색), **말이 어눌하거나 한쪽 팔다리에 힘이 빠짐**(뇌졸중), **난생처음 겪는 심한 두통**, **숨이 차고 입술이 파래짐**, **피를 토하거나 검은 변**, **의식이 흐려짐**. 특히 뇌졸중과 심근경색은 **시간이 곧 후유증**이에요. 애매하면 기다리지 마시고 119에 전화하세요. 아니어도 괜찮습니다 — 늦는 것보다 낫습니다.","link":"/symptom/fever","linkText":"열 화면의 신호등","group":"조심할 것","src":["mohw_safestad"]},{"id":"antibiotic-when","title":"항생제가 필요한 때와 아닌 때","icon":"shield","body":"**필요 없는 경우**가 훨씬 많아요. 감기, 대부분의 목감기와 기침, 콧물, 바이러스성 장염과 눈병에는 듣지 않습니다. **필요할 수 있는 경우**는 편도에 하얀 것이 끼고 열이 나는 인두염, 열흘 넘는 누런 콧물과 얼굴 통증(부비동염), 고름이 나오는 중이염, 붉게 번지는 피부 감염, 소변이 아프고 자주 마려운 방광염이에요. 진료 때 **“항생제가 꼭 필요한가요?”**라고 물어보시는 건 무례한 게 아니라 좋은 질문이에요.","link":"/class/antibiotic","linkText":"항생제 종류와 주의점 보기","group":"열·감기·배탈일 때","src":["acp2021short","llewelyn2017course"]},{"id":"diarrhea-water","title":"설사엔 지사제보다 물이 먼저","icon":"drop","body":"장염에서 사람을 위험하게 만드는 것은 설사 자체가 아니라 **탈수**예요. 그래서 치료의 중심은 지사제가 아니라 **경구수액**입니다. 맹물만으로는 전해질이 묽어지고, 이온음료는 당이 많아 설사를 늘릴 수 있어요. 약국 경구수액을 **차게 해서 조금씩 자주** 드세요. 그리고 **열이 나거나 피가 섞인 설사에는 지사제를 쓰면 안 됩니다** — 균을 장에 가두게 되니까요. 설사 횟수보다 **소변이 잘 나오는지**를 보세요.","link":"/symptom/gastroenteritis","linkText":"장염 대처법 보기","group":"열·감기·배탈일 때","src":["zubairi2024lors","hahn2002ors","buccigrossi2020sglt1","li2007lop"]},{"id":"hand-wash","title":"손 씻기가 약보다 나을 때","icon":"check","body":"장염과 눈병에서는 손 씻기가 어떤 약보다 확실한 예방법이에요. 중요한 건 방식입니다. **노로바이러스는 알코올 손 소독제로 잘 죽지 않아요.** 비누로 흐르는 물에 30초, 손가락 사이와 손톱 밑까지 씻으셔야 합니다. 유행성 눈병도 손을 통해 옮아요. 수건과 베갯잇을 따로 쓰고 자주 갈아 주세요. 아프신 동안에는 **가족 음식을 만들지 않는 것**만으로도 집안 전체가 앓는 일을 막을 수 있어요.","link":"/symptom/cold","linkText":"감기 화면","group":"열·감기·배탈일 때","src":["tuladhar2015norovirus"]},{"id":"fever-vs-infection","title":"열이 난다고 다 세균은 아니에요","icon":"temp","body":"열은 몸이 싸우고 있다는 신호이지, 세균 감염이라는 증거가 아니에요. 감기·독감·장염 같은 바이러스도 열을 냅니다. 그래서 **열이 난다 = 항생제**가 아니에요. 대신 열과 **함께 오는 것**을 보세요. 편도의 하얀 것, 누런 가래와 숨참, 소변 볼 때 통증과 옆구리 아픔, 붉게 번지는 피부, 목이 뻣뻣함 — 이런 것이 겹치면 진료가 필요합니다. 그리고 **3일 넘는 열**은 원인과 관계없이 확인이 필요해요.","link":"/symptom/fever","linkText":"열이 날 때 보기","group":"열·감기·배탈일 때","src":["acp2021short"]},{"id":"probiotic-timing","title":"유산균은 항생제와 2시간 띄우세요","icon":"leaf","body":"항생제를 드시면 나쁜 균만 골라 죽이지 못해서 장 속 좋은 균도 함께 줄어듭니다. 그래서 설사가 흔해요. 유산균(특히 락토바실루스 람노서스 지지·사카로미세스 보울라디)이 이 설사를 줄이는 데 근거가 있는데, **같이 삼키면 항생제가 유산균을 죽여** 소용이 없어요. **항생제와 2시간 이상 띄워서** 드시고, 항생제를 끝낸 뒤에도 1~2주 더 드시면 장이 빨리 제자리를 찾습니다.","link":"/supp/probiotic","linkText":"유산균 근거 보기","group":"제대로 드시는 법","src":["collinson2020probio"]},{"id":"read-label","title":"약 봉투에서 꼭 볼 세 가지","icon":"info","body":"병원에서 받은 약 봉투에는 세 가지가 적혀 있어요. **하나, 성분명** — 약국에서 산 약과 겹치는지 여기서 확인합니다. **둘, 언제 몇 번** — 식전인지 식후인지, 하루 몇 번인지. **셋, 며칠분** — 항생제는 이 날짜를 끝까지 지키셔야 해요. 봉투를 버리지 마시고, 다 드실 때까지 두세요. 사진을 찍어 두시면 다른 병원에 갈 때 그대로 보여 드릴 수 있어 훨씬 안전합니다.","link":"/photo","linkText":"약봉투 사진으로 확인하기","group":"약 이름과 고르기","src":["nedrug_search"]},{"id":"pharmacist-swap","title":"약사님이 “이게 더 나아요”라고 하시면","icon":"shield","body":"약사님은 재고와 손님 상태를 보고 **더 나은 것을 권하실 수 있어요.** 대부분 좋은 뜻입니다. 다만 성분 이름을 모르면 그대로 받아 오게 되지요. 이럴 때 확인하실 것은 딱 하나예요 — **“제가 찾던 것과 성분이 같은가요?”** 같으면 어떤 제품이든 괜찮고, 다르면 **“어디에 쓰는 약인가요?”**라고 한 번 더 여쭤보세요. 값이 많이 차이 나면 그 이유도 물어보실 수 있어요. 약지도에서는 권하신 약 이름만 넣으면 **같은 약인지 바로 확인**해 드려요.","link":"/symptom/msk","linkText":"약국에서 보여드리기 화면 보기","group":"약 이름과 고르기","src":["kpa_price"]},{"id":"grapefruit","title":"자몽은 약을 세게 만들어요","icon":"drop","body":"자몽(과 자몽 주스)은 간에서 약을 분해하는 효소를 막아, 어떤 약은 **먹은 양보다 훨씬 세게** 작용해요. 잘 알려진 것은 **일부 콜레스테롤약(심바스타틴·아토르바스타틴·로바스타틴)**, **일부 혈압약(니페디핀·펠로디핀 같은 칼슘차단제)**, 일부 수면제·부정맥약이에요. 로수바스타틴·프라바스타틴처럼 괜찮은 약도 있으니, 약봉투에 이 성분이 있으면 자몽은 피하고 오렌지·귤은 드셔도 돼요. 효과는 한 잔으로도 하루 넘게 가서 **시간을 띄우는 것으로는 해결이 안 됩니다.**","link":"/kinds/chol","linkText":"내 콜레스테롤약 종류 담기","group":"조심할 것","src":["an2015beverage"]},{"id":"warfarin-food","title":"와파린을 드시면 녹색 채소는 ‘꾸준히’","icon":"leaf","body":"와파린은 비타민 K와 반대로 일해요. 시금치·케일·브로콜리·**낫토·청국장**처럼 비타민 K가 많은 음식을 갑자기 많이 드시면 약효가 떨어지고, 갑자기 끊으면 세져요. 답은 **끊는 것이 아니라 매주 비슷한 양**을 드시는 거예요. 반대로 **은행잎·오메가3 고용량·홍삼·크랜베리 주스**는 피 묽기 수치를 흔들 수 있으니 시작 전에 의사와 상의하세요. 잇몸·코피가 잦거나 멍이 커지면 수치를 재 볼 때예요.","link":"/kinds/blood","linkText":"피 묽게 하는 약 담기","group":"조심할 것","src":["kim2015warfvitk","baillargeon2012warfabx"]},{"id":"coffee-meds","title":"커피와 약, 겹치면 생기는 일 세 가지","icon":"clock","body":"① **철분제**는 커피·차와 같이 먹으면 흡수가 절반 넘게 줄어요 — 2시간 띄우세요. ② **감기약·진통제 속 카페인**(펜잘·게보린 계열)에 커피까지 더하면 두근거림·불면이 와요. ③ **천식약(테오필린)·일부 항생제(퀴놀론)**는 카페인 분해를 막아 커피 한 잔이 두세 잔처럼 작용해요. 약 드시는 동안 커피가 유난히 세게 느껴지면 그 조합을 의심하세요.","link":"/supp/iron","linkText":"철분제 드시는 법","group":"조심할 것","src":["an2015beverage","yew2002tbdrug","gugler1990antacid"]},{"id":"blood-donate","icon":"drop","title":"헌혈 전에 — 먹던 약 때문에 못 하는 경우가 있어요","body":"헌혈은 몸이 건강해도 **먹고 있는 약 때문에** 일정 기간 못 하는 경우가 있습니다. 받는 사람에게 약 성분이 넘어갈 수 있어서예요. 기준은 **혈액관리법 시행규칙 「채혈금지대상자」**에 정해져 있습니다.\n\n자주 걸리는 것 세 가지\n· **아스피린** — 먹고 3일이 지나지 않으면 **혈소판 헌혈**을 못 합니다\n· **여드름 약(이소트레티노인)·탈모 약(피나스테리드)** — 마지막으로 먹은 뒤 **1개월**\n· **전립선·탈모 약(두타스테리드)** — 마지막으로 먹은 뒤 **6개월**\n\n성장호르몬·소에서 얻은 인슐린을 맞으신 적이 있거나 면역억제제를 쓰신 분은 기간이 훨씬 길거나 아예 안 되는 경우도 있어요.\n\n**가장 확실한 방법은 헌혈의집에서 약 이름을 그대로 말씀하시는 것**입니다. 약봉투나 이 앱의 「내 약통」을 보여 주셔도 됩니다. 숨기고 하시면 그 피를 받는 사람이 위험해집니다.\n\n※ 기준 출처: 혈액관리법 시행규칙 「채혈금지대상자」 · 대한적십자사 혈액관리본부. 여기 적지 않은 약도 많으니 **문진 때 약 이름을 그대로 말씀하시는 것**이 원칙이에요.","link":"/together","linkText":"내 약통 — 드시는 약 정리하기","group":"병원·헌혈 가실 때","src":["blood_rule"]},{"id":"blood-ask","icon":"cross","title":"병원에 가실 땐 「먹는 약」을 먼저 말씀하세요","body":"수술·시술·내시경·발치, 그리고 임신을 준비하실 때 의료진이 가장 먼저 묻는 것이 **지금 드시는 약**이에요. 특히 이런 것들은 꼭 말씀하셔야 합니다.\n\n· **피를 묽게 하는 약**(아스피린·항응고제) — 시술 며칠 전에 멈춰야 할 수 있어요\n· **소염진통제** — 피가 더 날 수 있습니다\n· **혈당약·혈압약** — 금식하는 날 어떻게 할지 따로 정합니다\n· **영양제와 한약** — 약이 아니라고 생각해 빠뜨리기 쉬운데, 피와 간에 영향을 주는 것이 있어요\n\n**임의로 끊지는 마세요.** 끊는 것도 의료진이 정합니다. 「이 약을 계속 먹어도 되나요」라고 물으시면 됩니다.","link":"/bag","linkText":"약 목록 만들어 두기","group":"병원·헌혈 가실 때","src":["blood_rule"]},{"id":"stop-danger","icon":"alert","title":"스스로 끊으면 오히려 위험한 약이 있어요","body":"몸이 좋아진 것 같아서, 또는 약이 많아 보여서 스스로 끊으시는 분이 많습니다. 대부분의 약은 끊어도 괜찮지만, **갑자기 끊으면 끊기 전보다 나빠지는 약**이 몇 가지 있어요.\n\n· **혈압약** — 혈압이 원래보다 더 튀어 오를 수 있어요. 혈압이 잘 잡힌 것은 약이 듣고 있다는 뜻이지 나았다는 뜻이 아니에요\n· **스테로이드(먹는 약)** — 2주 넘게 드셨다면 몸이 스스로 만드는 기능이 쉬고 있습니다. 갑자기 끊으면 기운이 빠지고 혈압이 떨어져요. 반드시 줄여 가며 끊습니다\n· **피를 묽게 하는 약(아스피린·클로피도그렐·와파린 등)** — 스텐트나 뇌경색 뒤에 드시는 것이라면 끊는 순간 막힐 위험이 올라갑니다\n· **갑상선 호르몬약·당뇨약** — 수치가 조용히 나빠지고, 한참 뒤에야 증상이 나타나요\n· **우울·불안약, 수면제** — 갑자기 끊으면 어지럼·불면·저림이 옵니다. 줄이는 일정이 따로 있어요\n· **뇌전증(간질)약·파킨슨약** — 발작이나 몸 굳음이 올 수 있어요\n\n**약을 줄이고 싶으시면 그 생각 자체는 좋습니다.** 다만 혼자 끊지 마시고, 다음 진료 때 **「이 약 줄일 수 있을까요」** 한마디를 꺼내 주세요. 실제로 나이가 들면 줄여야 하는 약도 많습니다.\n\n부작용이 의심돼 당장 멈추고 싶으실 때는, 멈춘 뒤 **그날 안에** 처방한 곳에 전화로 알리시는 것이 안전합니다.","link":"/together","linkText":"내 약통 — 드시는 약 정리하기","group":"조심할 것","src":["beers2023"]},{"id":"patch-howto","icon":"leaf","title":"파스, 이렇게 붙여야 덜 가렵습니다","body":"파스는 아픈 자리에 소염제를 직접 넣는 약이라 **위·심장 부담이 거의 없는 것**이 가장 큰 장점이에요. 대신 피부 문제가 생기기 쉽습니다.\n\n**붙이는 요령**\n· 붙이기 전에 그 자리를 **씻고 물기를 닦으세요**. 로션이 남아 있으면 잘 안 붙고 자극이 늘어요\n· **같은 자리에 계속 붙이지 마세요.** 조금씩 옮겨 붙이면 가려움이 크게 줍니다\n· 하루 종일 붙이지 않아도 됩니다. **8~12시간 붙이고 쉬어 주기**\n· 상처·습진·햇볕에 탄 피부에는 붙이지 않습니다\n\n**케토프로펜(케토톱 등)은 한 가지가 더 있어요**\n이 성분은 햇빛과 만나 피부가 붉어지고 물집이 잡히는 일이 있습니다. 그래서 식약처가 **15세 미만 금지**와 **뗀 뒤에도 2주 동안 그 자리를 햇빛에서 가릴 것**을 허가사항에 넣었어요. 발진이 파스를 뗀 뒤에 나타나서 원인을 모르고 지나치기 쉽습니다.\n\n**자외선차단제를 바르고 발진이 난 적이 있는 분**은 특히 조심하세요. 차단제 성분(옥시벤존·옥토크릴렌)과 케토프로펜은 서로 교차 반응을 일으킵니다. 고지혈증약 ‘피브레이트’ 계열도 마찬가지예요.\n\n**가려우면 성분을 바꾸면 됩니다.** 펠비낙·디클로페낙·피록시캄·플루르비프로펜 파스가 약국에 있고, 햇빛 제약도 없습니다. 파스가 다 같은 약이 아니에요.\n\n※ 출처: 식약처 케토프로펜 외용제 허가사항 변경(2010) · 광과민 접촉알레르기 기전(Karlsson 2014) · 자외선차단제 옥토크릴렌 교차반응(Avenel-Audran 2010)","link":"/drug/ketoprofen","linkText":"케토프로펜 파스 자세히 보기","group":"제대로 드시는 법","src":["mfds_ketoprofen2010"]},{"id":"dispose","icon":"shield","title":"남은 약은 쓰레기통이 아니라 약국으로","body":"안 드시고 남은 약, 유통기한이 지난 약을 **쓰레기통이나 변기에 버리면 안 됩니다.** 약 성분이 땅과 물로 흘러 들어가고, 집에 있는 아이나 반려동물이 삼키는 사고도 생겨요.\n\n**어디에 버리나요**\n· **약국·보건소·행정복지센터·구청**에 있는 **폐의약품 수거함**\n· 서울 등 일부 지역은 **우체통**에도 넣을 수 있어요 — 봉투에 **‘폐의약품’이라고 적고 밀봉**해서 넣습니다\n\n**어떻게 담나요**\n· 알약·캡슐: 포장된 그대로\n· 가루약: 봉투를 뜯지 말고 그대로\n· 물약·시럽: **마개를 꼭 닫아서** (새면 우편물이 젖으니 **우체통에는 넣지 말고** 수거함으로)\n· 연고·안약: 뚜껑을 닫아 통째로\n\n**여기에 넣으면 안 되는 것**: 홍삼·비타민 같은 건강기능식품은 폐의약품이 아니라 **일반 쓰레기**예요.\n\n집 안의 약을 1년에 한 번만 정리하셔도 좋습니다. 이름이 지워진 약, 무슨 약인지 모르는 약이 가장 위험해요.\n\n※ 출처: 서울특별시 폐의약품 배출 안내 · 각 지자체 생활폐기물 분리배출 기준. 지역마다 우체통 수거 여부가 다르니 **주민센터나 약국에 한 번 물어보시는 것**이 확실해요.","link":"/bag","linkText":"우리 집 약 상자 정리하기","group":"보관하고 버리기","src":["nedrug_search"]},{"id":"patch-heat","title":"파스 붙인 자리에 전기장판을 켜지 마세요","icon":"alert","body":"겨울에 어르신께 가장 흔한 약 사고입니다. **파스를 붙이고 그 자리에 전기장판·찜질기·핫팩을 대면** 피부 혈관이 열려 약이 한꺼번에 흡수돼요. 화끈거리다 못해 **물집이 잡히고 화상처럼 되는 일**이 생깁니다.\n\n허가사항에도 그대로 적혀 있어요 — **덥히지 말 것, 목욕은 떼고 30분에서 한 시간 뒤에, 목욕 직후에는 붙이지 말 것.** 붙인 채로 뜨거운 물에 들어가시면 자극이 아주 세집니다.\n\n그리고 **닷새에서 엿새를 붙여도 그대로면** 멈추고 상의하세요. 같은 자리에 계속 붙이지 마시고 조금씩 옮겨 붙이시는 것도 잊지 마시고요. 케토프로펜 파스는 **뗀 자리가 2주까지 햇빛에 약해져서** 그 부위를 가리셔야 합니다.","link":"/drug/ketoprofen","linkText":"소염 파스 자세히 보기","group":"조심할 것","src":["mfds_trast","mfds_ketoprofen2010"]}],"public":{"easy_count":4766,"pills_count":24694,"pills_otc":5660,"easy_source":"OpenData_EasyExcelListC20250802_mod.csv","pills_source":"OpenData_PotOpenTabletIdntfcC20221021.csv","mapped":2222,"with_image":2371,"license":"식품의약품안전처 공공데이터(공공데이터포털) — 이용허락범위 제한 없음, 출처 표시. 낱알 이미지 제작: 약학정보원","chunk":200,"lexicon_count":336,"brands_count":357,"qa_count":322,"lexicon_source":"약손 성분·제품 사전(2026-09-08판) — 식약처 허가사항·DUR 기준, 분류는 식약처 e약은요·낱알식별과 대조해 정정","nutrients_count":60,"mixes_count":37},"art":["guide-2-pharmacy","guide-3-take","pill-search","schedule","supp-label","kids-dose","easy-mode"]}</script>
<script>
/* ───────── 데이터·유틸 ───────── */
const D = JSON.parse(document.getElementById('data').textContent || '{}');
const BUILD = '2026-09-23';
/* 상단 마크는 현욱님 아이콘 파일 그대로 쓴다 — 옮겨 그리면 또 틀어진다(2026-09-21 사고) */
const BRANDMARK = (typeof window !== 'undefined' && window.__BRANDMARK__) || 'icon-192.png';
/* ── 본문 자료는 첫 화면이 뜬 뒤에 받는다 ──────────────────────────────
   첫 화면에 필요한 것은 증상·약의 「이름·갈래·아이콘·한 줄」뿐이라 그것만 심어 두고,
   계획·복용법·주의·출처 같은 본문은 data/core.json 으로 뺐다. 받아 오면
   「같은 객체에 덧씌우기」(Object.assign)라서 화면 함수는 그대로 쓴다.
   아티팩트(파일 하나로 여는 판)는 서버가 없어 window.__CORE__ 에 심어 둔다. */
let CORE = 0, CORE_P = null;          /* 0 아직 · 1 받는 중 · 2 준비됨 · 3 실패 */
function mergeCore(c){
  for (const k of ['symptoms', 'drugs', 'supplements', 'classes']) {
    const by = new Map((D[k] || []).map(x => [x.id, x]));
    (c[k] || []).forEach(o => { const t = by.get(o.id); if (t) Object.assign(t, o); else (D[k] = D[k] || []).push(o); });
  }
  /* 나머지 칸은 통째로 받는다 — 새 자료를 core 로 빼도 여기를 또 고칠 필요가 없게 */

const achScore = items => Math.round(items.reduce((n, x) => n + x.e.ach * (x.prn ? 0.5 : 1), 0));
/* KABS 기준: 3점 이상이 '높음'. 6점 이상은 따로 더 강하게 알린다 */
function achLevel(n){ return n >= 6 ? 'stop' : n >= 3 ? 'warn' : 'ok'; }

  if (!items.length) return `<div class="ach ok"><div class="ach-h">${I.check}<b>항콜린 부담 없음</b><span class="ach-n">0점</span></div>
    <p class="ach-w">확인한 성분 중에는 입마름·변비·기억력에 부담을 주는 것이 없어요.</p>${unkBox}</div>`;
  const head = lv === 'stop' ? '항콜린 성분이 많이 겹쳤어요' : lv === 'warn' ? '항콜린 성분이 겹쳐 있어요' : '항콜린 부담 낮음';
  const why = opts.compact
    ? `입마름·변비·어지럼을 만드는 성분이 <b>${items.length}가지</b> 겹쳐 있어요.`

    ? '지금은 부담이 크지 않아요. 여기에 감기약·수면유도제·멀미약을 더하면 금세 올라갑니다.'
    : `이런 성분은 <b>입마름·변비·어지럼·소변이 잘 안 나오는 것</b>을 만들고, 여러 해 겹쳐 쓰면 <b>기억력에도 부담</b>이 쌓입니다. ${ME.age === 'senior' ? '65세 이상이시라 특히 살펴볼 일이에요.' : ''}`;
  return `<div class="ach ${lv}">

         「자세히」 하나로 접는다 — 카드 안에 문단이 셋이면 아무도 읽지 않는다(현욱님 지적 2026-09-21) */
      const alts = items.filter(x => x.e.achAlt);
      const detail = [
        ...(x => x)(alts).map(x => `<p><b>${esc(x.e.n)}</b> — ${fmt(x.e.achAlt)}</p>`),
        `<p class="ach-ask">${I.cart}<span>약국에서 이렇게 물어보세요 — <b>“이 약들에 항콜린 성분이 겹치나요?”</b></span></p>`,

        (() => { const ck = items.filter(x => x.e.achSrc === '확인 필요'); return ck.length

    ${opts.compact ? '' : achRisk(n)}
    ${opts.compact ? '' : srcChips(['kabs2021ed', 'kabs2024mort', 'kabs2019dev', 'kiesel2018acb', 'naples2015acb'])}
    ${opts.compact ? '' : '<p class="small muted" style="margin-top:8px">한국 어르신에게 가장 잘 맞는 것은 <b>한국형 항콜린 부담 척도</b>입니다. 이 척도의 성분별 점수표 원문은 공개돼 있지 않아, 개별 점수는 국제 척도 두 가지의 합의를 따르고, 한국형 척도가 따로 넣은 한국 성분(트리메부틴·옥틸로늄)은 그에 맞췄어요. <b>판정이 아니라 상의할 거리</b>입니다 — 약을 스스로 끊지 마세요.</p>'}

}

/* 항콜린 게이지 — 0~12 눈금. 0~2 낮음 · 3~5 살펴볼 것 · 6+ 높음 (KABS 기준 3점 이상이 높음) */
function achGauge(n){
  const cap = Math.min(n, 12);
  const cells = Array.from({ length: 12 }, (_, i) => { const v = i + 1; const band = v <= 2 ? 'lo' : v <= 5 ? 'mid' : 'hi'; return `<i class="${band} ${v <= cap ? 'on' : ''}"></i>`; }).join('');
  return `<div class="gauge" role="img" aria-label="항콜린 부담 ${n}점, 12점 만점 눈금"><div class="num"><b>${n > 12 ? '12+' : n}</b><small>점</small></div><div class="bar">${cells}<span class="mk" style="left:calc(${(cap / 12) * 100}% - 1px)"></span></div><div class="lbl"><span>낮음</span><span>살펴볼 것</span><span>높음</span></div></div>`;
}
/* 점수가 실제로 무엇을 뜻하는지 — 자연빈도로 */
function achRisk(n){
  if (n < 3) return '';
  return `<div class="ach-risk"><b>3점 이상이면 무슨 뜻인가요</b>
    <p>한국 노인 46만 명을 본 연구에서, 항콜린 부담 3점 이상인 분들은 0점인 분들보다 <b>헛것이 보이고 정신이 흐려져(섬망) 응급실에 가는 일이 약 3배</b>, <b>소변이 막혀 가는 일이 약 2배</b>, 넘어져 다치는 일이 1.5배였어요.</p>
    <p>4만 2천 명을 5.7년 따라간 연구에서는 1년에 <b>1,000명 중 약 10명(0점) → 약 18명(3점 이상)</b>이 돌아가셨어요. 나이·병·다른 약을 감안한 뒤의 수치입니다.</p>
    <p class="small">약을 끊으라는 뜻이 아니라, <b>꼭 필요한 약인지 한 번 여쭤볼 만하다</b>는 뜻이에요. 필요해서 드시는 약이 대부분입니다.</p></div>`;
}
/* 증상 화면용 한 줄 — 이번에 사려는 약이 처방약과 부딪히는지 그 자리에서 알린다 */
function ixLine(extra){
  if (!takingItems().length) return '';
  const res = ixRun(extra);
  /* 추천 약이 한쪽 자리에 들어간 것만 — 내 약통끼리의 문제는 병용 화면에서 따로 본다 */
  /* 내 약통 「과」 지금 보는 약 사이에 걸친 것만. 추천끼리의 겹침은 위쪽 planDup 이 더 정확히 말한다
     — 여기에 같이 태우면 「이 중 하나만」인 두 자리가 서로를 고발한다 */
  const now = res.hits.filter(h => h.r.lv !== 'info' && h.items.some(i => i.from === '지금 보는 약') && h.items.some(i => i.from === '내 약통'));
  /* 추천 안에서 성분이 겹치는 것은 위쪽 '사시기 전에 확인할 것'이 이미 말한다.
     여기서는 내 약통과 이번 추천 사이에 걸친 것만 — 모르고 두 배로 드시게 되는 자리다 */
  const dup = res.dupe.filter(d => d.items.some(i => i.from === '지금 보는 약') && d.items.some(i => i.from === '내 약통'));
  if (!now.length && !dup.length) return '';
  const spans = h => h.items.some(i => i.from === '내 약통') && h.items.some(i => i.from === '지금 보는 약');
  /* 「내 약통 × 지금 보는 약」이 먼저다.
     화면 안 선택지끼리의 겹침은 「하나만 고르면」 풀리지만, 내가 이미 드시는 약과의 충돌은 고를 수가 없다.
     경고가 많아지면 요약 한 줄로 접히는데, 그때 개인 경고가 묻히던 문제를 막는다. */
  const worst = now.find(h => h.r.lv === 'stop' && spans(h)) || now.find(spans)
             || now.find(h => h.r.lv === 'stop') || now[0];
  const lv = dup.length || (worst && worst.r.lv === 'stop') ? 'stop' : 'warn';
  const t = dup.length ? `${dup[0].e?.n || ''} — 지금 드시는 약에 이미 들어 있어요` : worst.r.t;
  const more = now.length + dup.length - 1;
  return `<button class="ixline ${lv}" onclick="go('/together')">${I.alert}<span>${lv === 'stop' ? '사시기 전에 꼭 보세요' : '지금 드시는 약과' } — <b>${esc(t)}</b>${more > 0 ? ` 외 ${more}가지` : ''}</span>${I.chev}</button>`;
}

/* 읽어 주기 — 기기에 내장된 음성(Web Speech). 어디로도 보내지 않는다. 핵심 세 줄만 */
let SPEAKING = null;
/* 읽어 주기 한 군데로 — 실패했을 때 단추가 켜진 채 굳어 버리던 것을 막는다.
   기기에 한국어 음성이 없으면 읽지 않고 그렇다고 말씀드린다(엉뚱한 발음으로 읽느니 낫다). */
function speakNow(text, btn){
  const t = String(text || '').trim(); if (!t) return;
  const done = () => { SPEAKING = null; document.querySelectorAll('.speak.on').forEach(b => b.classList.remove('on')); };
  let voices = []; try { voices = speechSynthesis.getVoices() || []; } catch (e) {}
  if (voices.length && !voices.some(v => (v.lang || '').toLowerCase().startsWith('ko'))) {
    toast('이 기기에 한국어 음성이 없어요 — 기기 설정에서 한국어 음성을 받으시면 읽어 드릴 수 있어요');
    return;
  }
  const u = new SpeechSynthesisUtterance(t.slice(0, 1200)); u.lang = 'ko-KR'; u.rate = 0.92;
  u.onend = done;
  u.onerror = () => { done(); toast('읽어 주기가 안 됐어요. 기기 소리와 한국어 음성을 확인해 주세요'); };
  SPEAKING = u; btn?.classList.add('on');
  try { speechSynthesis.speak(u); } catch (e) { done(); toast('읽어 주기가 안 됐어요'); }
}
function speakAnswer(sid, btn){
  const s = byId(D.symptoms, sid); if (!s || !('speechSynthesis' in window)) { toast('이 기기는 읽어 주기를 지원하지 않아요'); return; }
  if (SPEAKING) { speechSynthesis.cancel(); SPEAKING = null; document.querySelectorAll('.speak.on').forEach(b => b.classList.remove('on')); return; }
  const bk = basket(s);
  const buy = bk.map(x => `${x.slot}, ${prodName(x.product) || ingrName(x.d)}${x.optional ? ', 도움이 될 수 있어요' : ''}`).join('. ');
  const how = (s.how || []).slice(0, 2).map(t => String(t).replace(/\*\*/g, '')).join(' ');
  const care = (s.care?.clinic || []).slice(0, 1).map(t => String(t).replace(/\*\*/g, '')).join('');
  const t3 = s.triage || {};
  const plain = t => String(t || '').replace(/\*\*/g, '');
  /* 살 약이 없는 증상은 「이렇게 사시면 돼요」 라고 읽으면 안 된다 */
  const text = buy
    ? `${s.name}. 이렇게 사시면 돼요. ${buy}. ${how} ${care ? '병원은, ' + care : ''}`
    : `${s.name}. 약국에서 사실 약은 없어요. ${plain(t3.clinic)} ${plain(t3.escalate)}`;
  speakNow(text, btn);
}
/* ── 어디서든 읽어 주기 ──
   읽어 주기가 증상 화면에만 있었다. 어르신 앱인데 「가장 긴 글」인 약 설명과 약 상식에는 없었다.
   화면마다 「무엇을 읽을지」만 넘겨 주면 같은 방식으로 읽는다. */
function speakText(text, btn){
  if (!('speechSynthesis' in window)) { toast('이 기기는 읽어 주기를 지원하지 않아요'); return; }
  if (SPEAKING) { speechSynthesis.cancel(); SPEAKING = null; document.querySelectorAll('.speak.on').forEach(b => b.classList.remove('on')); return; }
  const t = String(text || '').replace(/\*\*/g, '').replace(/「|」|「|」/g, '').replace(/\[\[[^\]|]*\|([^\]]*)\]\]/g, '$1').replace(/\s+/g, ' ').trim();
  speakNow(t, btn);
}
const speakBtn = (expr, label) => `<button class="speak" onclick="speakText(${expr}, this)" aria-label="${esc(label || '읽어 주기')}">${I.info}읽어 주기</button>`;
/* 약 하나를 읽어 주는 문장 — 이름·무엇에 쓰는지·어떻게 드시는지·조심할 것 */
function drugSpeech(d){
  const car = (d.caution || []).map(c => c.text || c).slice(0, 2).join('. ');

const FORMPAT = [

  [/비강|코에|나잘|스프레이|분무/, 'f_spray', '뿌리는 약'],

function formOf(name){ const n = String(name || '').replace(/\(.*?\)/g, ''); for (const [re, ic, lb] of FORMPAT) if (re.test(n)) return [ic, lb]; return ['pill', '먹는 약']; }

function search(q){
  q = (q || '').toLowerCase().trim();
  /* 띄어쓰기를 틀려도 찾아진다 — 「타이 레놀」·「이부 프로펜」 */
  const qs = q.replace(/\s+/g, '');
  const syn = SEARCH_SYN[qs];
  if (syn) q = syn;
  const out = [];
  /* 「어깨 아파」·「무릎 통증」·「벌레 물림」처럼 두 마디로 치시는 분이 많다. 전에는 전부 0건이었다.
     ① 이름과 태그를 한 줄로 이어 붙여 놓고 찾는다 — 「벌레」는 이름에, 「물림」은 태그에 있을 수 있다.
     ② 「아파·통증·약」 같은 곁말은 빼고 본다 — 「어깨 아파」에서 알맹이는 「어깨」다.
     ③ 낱말마다 구어 사전을 한 번 더 태운다 — 「녹내장 안약」의 「안약」은 「눈」이다. */
  /* 한국어 말끝은 종류가 너무 많아 「빼야 할 말」을 일일이 적는 방식은 늘 새는 곳이 생긴다.
     그래서 반대로 한다 — 우리 자료 어디에도 없는 낱말은 「곁말」로 보고 버린다.
     「잠이 안 와요」에서 자료에 있는 말은 「잠」 하나뿐이고, 그것이 정확히 알맹이다. */
  const norm = t => String(t || '').toLowerCase().replace(/[\s·・‧]+/g, '');
  const stem = w => {
    let x = w.replace(/(요|예요|입니다|습니다)$/, '');          /* 「말라요」→「말라」 */
    const m2 = x.match(/^(.+?)(이|가|은|는|을|를|에|의|도|만|에서|으로|로)$/);
    if (m2 && m2[1].length >= 1) x = m2[1];
    return x || w;
  };
  /* 낱말 하나하나를 따로 담고 「|」로 나눈다. 한 줄로 이어 붙이면 「변비」와 「가스」가 만나
     「변비가」라는 없는 말이 생겨, 「변비가 있어요」가 엉뚱한 화면으로 갔다. */
  if (!SEARCH_CORPUS) SEARCH_CORPUS = '|' + [
    ...(D.symptoms || []).flatMap(x => [x.name, ...(x.tags || [])]),
    ...(D.drugs || []).flatMap(x => [x.name, x.en, ...(x.for || [])]),
    ...(D.supplements || []).flatMap(x => [x.name, ...(x.tags || [])]),
    /* 처방약을 드시는 분이 「와파린」·「혈압약」·「갑상선약」을 치면 0건이었다.
       종류로 담는 «빠른 묶음»과 성분표가 말뭉치에 빠져 있었다(2026-09-23). */
    ...(D.ingredients?.quick || []).flatMap(g => [g.n, ...(g.subs || []).flatMap(x => [x.n, ...(x.aka || [])])]),
    ...(D.ingredients?.ing || []).flatMap(e => [e.n, ...(e.aka || [])]),
  ].filter(Boolean).map(norm).join('|') + '|';
  /* 원래 친 말도 함께 남긴다 — 구어 사전이 「해열제」를 「열」로 바꿔 버리면
     한 글자라 버려지고, 남은 「아이」가 「구아이페네신」에 붙어 엉뚱한 답이 먼저 나왔다. */
  /* 붙여 쓰신 말은 앞에서부터 잘라 가며 «자료에 있는 가장 긴 말»을 찾는다.
     「허리아파요」→「허리」, 「열나요」→「열」. 말끝을 일일이 적는 방식으로는 늘 새는 곳이 생긴다.
     한 글자까지 내려가되, 그때는 자료에 «낱말 그대로» 있는 것만 인정한다(2026-09-23). */
  const cutFit = w => {
    const t = norm(w);
    /* «낱말 그대로» 있는 것만 인정한다. 아무 데나 걸치는 조각을 받아 주면
       「어깨 아파」의 「아파」가 낱말이 되어(태그 「허리아파」 안에 있다) 오십견이 밀려났다. */
    for (let n = t.length; n >= 1; n--) if (SEARCH_CORPUS.includes('|' + t.slice(0, n) + '|')) return t.slice(0, n);
    return '';
  };
  const cand = q.split(/\s+/).flatMap(w => {
    const base = [w, SEARCH_SYN[w] || w, SEARCH_SYN[stem(w)] || stem(w)];
    const cut = cutFit(w); if (cut) base.push(cut, SEARCH_SYN[cut] || cut);
    return base;
  }).filter(w => w.length > 0);
  /* 한 글자 낱말(「잘」·「안」·「나」)은 어딘가에는 반드시 들어 있어서, 요구 조건으로 삼으면 다 막힌다.
     두 글자 이상만 쓰고, 그것이 하나도 없을 때만 한 글자를 본다. */
  const inCorpus = w => SEARCH_CORPUS.includes(norm(w));
  /* 자료에 «낱말 그대로» 있는 것을 먼저 쓴다. 아무 데나 걸치는 조각(「아파」는 태그
     「허리아파」 안에 있다)까지 요구 조건으로 삼으면 엉뚱한 것만 남는다(2026-09-23). */
  const isWord = w => SEARCH_CORPUS.includes('|' + norm(w) + '|');
  let words = [...new Set(cand.filter(w => w.length >= 2 && isWord(w)))];
  if (!words.length) words = [...new Set(cand.filter(w => w.length >= 2 && inCorpus(w)))];
  if (!words.length) words = [...new Set(cand.filter(inCorpus))];
  /* 낱말 맞추기를 «띄어쓰기가 있을 때만» 하고 있었다. 그래서 「허리아파요」처럼 붙여 치시면
     알맹이(「허리」)를 뽑아 놓고도 쓰지 못해 0건이 됐다. 잘라낸 말이 원래 친 말과 다르면,
     띄어쓰기가 없어도 낱말로 본다(2026-09-23). */
  const many = words.length > 0 && (q.split(/\s+/).length > 1 || words.some(w => norm(w) !== qs));
  const m = (s) => {

     1회 = 몸무게 × mg/kg 범위(어른 1회 상한까지), 하루 = 몸무게 × 하루 mg/kg(어른 하루 상한까지).

/* ───────── 병원에서 내는 묶음 ─────────
   현욱님: 「성분 역할로 하고 클릭하면 제품명을 볼 수 있게 하자」(2026-09-21).
   성분과 역할을 앞에 두고, 실제 제품 이름은 누를 때 식약처 자료에서 찾아 보여 준다.
   제품 목록을 글로 박아 두면 낡는다 — 낱알 자료에서 그때그때 찾는다. */
const RXP = {};                       /* 성분 → 제품 이름 몇 개 (한 번 찾으면 담아 둔다) */
async function rxProducts(ing){
  if (RXP[ing]) return RXP[ing];
  const pool = [];
  try { (await pubPillsRx()).forEach(r => pool.push(r)); } catch (e) {}
  try { (await pubIndex()).forEach(r => pool.push({ n: r.n, m: r.m, ingr: (r.i || []).join(' '), seq: r.seq, rx: 0 })); } catch (e) {}
  const hit = pool.filter(r => (r.ingr || '').includes(ing));
  hit.sort((a, b) => a.n.length - b.n.length);
  const seen = new Set(), out = [];
  for (const r of hit) {
    const base = r.n.split('(')[0].replace(/정.*$|캡슐.*$|서방.*$/, '');
    if (seen.has(base)) continue;
    seen.add(base); out.push(r);
    if (out.length >= 6) break;
  }
  RXP[ing] = { list: out, total: hit.length };
  return RXP[ing];
}
function rxOpen(i, ing){
  const box = document.getElementById('rxp' + i); if (!box) return;
  const row = box.closest('.rxc-row'); const on = row.classList.toggle('open');
  if (!on) return;
  if (box.dataset.done) return;
  box.innerHTML = '<p class="loading">제품 이름을 찾는 중…</p>';
  rxProducts(ing).then(r => {
    box.dataset.done = '1';
    box.innerHTML = r.list.length
      ? `<div class="rxc-names">${r.list.map(x => `<button class="rxc-name" onclick="event.stopPropagation();go('/pillinfo/${esc(x.seq)}')"><b>${esc(x.n.split('(')[0])}</b><small>${esc(x.m || '')}</small></button>`).join('')}</div>

  });
}

/* ───────── 복용 시간 알림 ───────── */
const SLOTS = [['아침', '08:00'], ['점심', '13:00'], ['저녁', '19:00'], ['취침 전', '22:00']];
/* 날짜는 «그 사람의 시계»로 세야 한다. toISOString() 은 세계 표준시라서,
   한국에서 아침 9시 전에 드신 약이 «어제»로 적히고 있었다. */
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayKey = () => dayKey(new Date());
/* 약의 용법에서 「하루 몇 번」을 읽어 기본 시간을 미리 골라 둔다.
   전에는 네 칸이 모두 비어 있어서, 약 네 개면 어르신이 칩을 열두 번 눌러야 알림이 잡혔다.
   화면은 「하루 3번 식후가 기본」이라고 적어 놓고 실제로는 하나도 안 골라 둔 상태였다.
   고르신 적이 있으면(ME.sched 에 값이 있으면) 그것을 그대로 쓴다 — 사람이 고른 것이 우선이다. */
function defaultSlots(item){
  const t = String((item?.d?.dose?.interval || '') + ' ' + (item?.simple || '') + ' ' + (item?.d?.simple || '')).replace(/\s+/g, '');
  const NUM = { '한': 1, '두': 2, '세': 3, '네': 4 };
  let n = 0;
  let m = t.match(/(?:하루|1일)([0-9])~?([0-9])?[회번]/);
  if (m) n = +m[1];
  else { m = t.match(/(?:하루|1일)(한|두|세|네)[회번]/); if (m) n = NUM[m[1]]; }
  if (!n) return [];
  if (/취침|자기전|잘때|자기直/.test(t) && n === 1) return ['22:00'];
  if (n >= 4) return SLOTS.map(x => x[1]);
  if (n === 3) return ['08:00', '13:00', '19:00'];
  if (n === 2) return ['08:00', '19:00'];
  return ['08:00'];
}
function schedOf(id, item){ ME.sched = ME.sched || {}; return ME.sched[id] || (item ? defaultSlots(item) : []); }
function toggleSlot(id, t){ ME.sched = ME.sched || {};

/* ── 보호자에게 오늘 상황 보내기 ──

/* ── 약이 며칠 남았나 ──

function stockOf(id){ return (ME.stock || {})[id]; }
function setStock(id, n){ ME.stock = ME.stock || {}; const v = parseFloat(n); if (!(v > 0)) delete ME.stock[id]; else ME.stock[id] = { left: v, at: todayKey() }; saveMe(); route(); }

  const st = stockOf(id); if (!st) return null;

   더 드실 수 있다(현욱님 2026-09-22). 그래서 «간격으로 계산한 횟수»와 «글에 적힌 횟수»
   가운데 큰 쪽을 상한으로 본다. 간격 「4~6시간」이면 24÷6 = 하루 4번까지. */

/* 지금 고른 약·내 약통과 겹치는 조합을 찾아 준다 */
function mixFor(extra){
  if (!LEX.mix) { lexLoad(); return []; }
  const ids = new Set();
  for (const x of takingItems()) if (x.d) ids.add(x.d.id);
  for (const d of (extra || [])) if (d) ids.add(d.id);
  if (!ids.size) return [];
  const f = activeFlags();
  /* who_* 는 「사람 조건」 묶음이라 성분이 겹친다고 띄우면 안 된다 — 내 정보에 해당할 때만 */
  const WHO = { who_elder:'senior', who_kidney:'kidney', who_liver:'liver', who_preg:'pregnant' };
  return (LEX.mix || []).map(m => {
    if (m.id in WHO) return { m, n: f.includes(WHO[m.id]) ? 3 : 0 };
    if (m.id.startsWith('who_')) return { m, n: 0 };
    return { m, n: m.items.filter(i => ids.has(i.id)).length };
  }).filter(x => x.n >= 2).sort((a, b) => b.n - a.n).map(x => x.m);
}

/* ───────── 같이 먹어도 되나요 ─────────
   증상이 아니라 「조합」을 묻는 자리. 약끼리·지병 약·영양제·음식술·사람에 따라. */
const MIX_KINDS = ['약끼리', '지병 약', '영양제', '음식·술', '사람에 따라'];
/* ───────── 병용 판정 ─────────
   "병원에서 받아 온 약이랑 같이 먹어도 되나요" 에 답하는 자리.
   내 약통(처방약 포함)과 지금 사려는 약을 성분으로 바꾼 뒤, 규칙표에 걸리는 것을 모은다.
   여기서 아무것도 안 나와도 '안전하다'는 뜻이 아니다 — 그 말을 화면에 반드시 적는다. */

/* 판정에 들어갈 약들: {name, ings:[성분], link, src:'내 약통'|'지금 보는 약'} */
function ixItems(extra){
  const out = [];
  for (const x of takingItems()) {
    const r = ingOf(x);
    out.push({ name: x.name, ings: r.ings, known: r.known, approx: !!r.approx, from: '내 약통',
               link: x.d ? '#/drug/' + x.d.id : (x.pub ? '#/pillinfo/' + x.pub.seq : '') });
  }
  for (const d of (extra || [])) {
    const ings = drugIngs(d).slice();
    if (!ings.length) ingFind(d.name).forEach(e => { if (!ings.includes(e)) ings.push(e); });
    out.push({ name: ingrName(d), ings, known: ings.length > 0, from: '지금 보는 약', link: '#/drug/' + d.id });
  }
  return out;
}
/* 한 약이 어떤 묶음(계열 또는 k:성분)에 해당하는가 */
function ixMatch(item, group){
  for (const e of item.ings) {
    for (const g of group) {
      if (g.startsWith('k:')) { if (e.k === g.slice(2)) return e; }
      else if ((e.cls || []).includes(g)) return e;
    }
  }
  return null;
}
function ixRun(extra){
  const items = ixItems(extra);
  const rules = D.interactions?.rules || [];
  const flags = activeFlags();
  const hits = [];
  for (const r of rules) {
    if (r.flags && !r.flags.some(f => flags.includes(f))) continue;
    let why = null;
    if (r.count) {
      const got = items.filter(it => it.ings.some(e => (e.cls || []).includes(r.count.tag)));
      /* 한 제품이 「자기 자신과」 겹쳤다고 세지 않도록 — 제품 안의 성분은 묶어서 한 가지로 본다.
         복합제는 약 이름과 그 안의 성분이 둘 다 잡히므로 그대로 세면 한 통이 두 가지가 된다.
         또 같은 성분이 두 제품에 들어 있으면(성분표가 똑같으면) 그것도 한 가지로 본다. */
      /* 같은 약을 두 번 담으신 경우만 하나로 본다 — 성분표 «전체»가 같을 때다.
         예전에는 «그 태그를 가진 성분»만 비교해서, 타이레놀과 판콜에이(아세트아미노펜이 든
         감기약)가 둘 다 「apap」 하나로 보여 «두 군데 겹쳤다»는 경고가 아예 안 떴다. */
      const sigs = new Set();
      got.forEach(it => sigs.add(it.ings.map(e => e.k).sort().join('|')));
      if (sigs.size >= r.count.n) why = got;
    } else {
      const used = []; const picked = [];
      let ok = true;
      for (const g of r.need) {
        const it = items.find(x => !used.includes(x) && ixMatch(x, g));
        if (!it) { ok = false; break; }
        used.push(it); picked.push(it);
      }
      if (ok) why = picked;
    }
    if (why) hits.push({ r, items: why });
  }
  /* 더 센 규칙이 걸리면 약한 쪽은 감춘다 */
  const killed = new Set();
  hits.forEach(h => (h.r.over || []).forEach(o => killed.add(o)));
  const keep = hits.filter(h => !killed.has(h.r.id));
  const ord = { stop: 0, warn: 1, info: 2 };
  keep.sort((a, b) => ord[a.r.lv] - ord[b.r.lv]);
  /* 같은 성분이 두 제품에 — 규칙표가 아니라 그 자리에서 찾는다 */
  const dupe = [];
  const byIng = new Map();
  for (const it of items) for (const e of it.ings) {
    if (!byIng.has(e.k)) byIng.set(e.k, []);
    if (!byIng.get(e.k).includes(it)) byIng.get(e.k).push(it);
  }
  for (const [k, list] of byIng) if (list.length > 1) dupe.push({ e: ingIndex().byKey[k], items: list });
  return { items, hits: keep, dupe, unknown: items.filter(x => !x.known) };
}

/* ───────── 성분 사전(넓게) · 제품 이름 사전 ─────────

const RISK_LBL = { gi:'위장', kd:'신장', lv:'간', sd:'졸음' };
function lexRisk(r){
  const ks = Object.keys(RISK_LBL).filter(k => (r || {})[k] > 0);
  if (!ks.length) return '';
  return `<div class="risk-bars">${ks.map(k => { const v = Math.min(3, r[k]); const w = ['', '낮음', '보통', '높은 편'][v];
    return `<div class="rb"><span>${RISK_LBL[k]}</span><div class="track"><div class="fill l${v === 3 ? 4 : v + 1}" style="width:${v * 33}%"></div></div><span class="v">${w}</span></div>`; }).join('')}</div>`;
}
const lexMark = t => fmt(String(t || '').replace(/「(.+?)」/g, '**$1**'));

  if (!x) return `${topBar({ back:'뒤로' })}<div class="empty"><b>찾는 성분이 없어요</b>위 검색창에 다른 이름으로 찾아보세요.</div>`;
  if (x.drug && drug(x.drug)) { go('/drug/' + x.drug); return ''; }

const SENIOR_WHY = [

const SENIOR_OF = (() => { const m = {}; for (const w of SENIOR_WHY) for (const id of w[3]) m[id] = w[0]; return m; })();

  const out = [];
  for (const d of (D.drugs || [])) {

}

async function photoPick(file){
  if (!file) return; PH.err = ''; PH.result = null; PH.ocr = null; PH.step = ''; PH.busy = true; route();

    const bmp = await createImageBitmap(file); const max = 1024; const r = Math.min(1, max / Math.max(bmp.width, bmp.height));

/* 이름 → 약지도 성분: 제형·함량 꼬리(정·500mg·시럽…)를 떼고 기본 이름으로 비교. "타이레놀"은 아세트아미노펜(기본 제품)으로, "판피린큐"는 복합제로 */
const NAME_TAIL = /(\d+(\.\d+)?(mg|ml|g|밀리그람|밀리그램|밀리리터)?|이알서방정|서방정|현탁액|연질캡슐|캡슐|캅셀|시럽|내복액|내복|정|액|겔|크림|과립|산)$/;

/* 조사 고르기 — 괄호로 끝나는 이름(「카페인(진통 보조)」)은 괄호를 떼고 본다 */
const josa = (w, a = '과', b = '와') => {
  const t = String(w || '').trim().replace(/\s*[(（][^)）]*[)）]\s*$/, '').trim();
  const c = (t || String(w || '').trim()).slice(-1).charCodeAt(0);

function matchName(name, ingredients){

/* ───────── 기기 안에서 사진 읽기 ─────────

   사진이 기기 밖으로 나가지 않아 오히려 약속에 맞고, 돈도 들지 않는다.
   완벽한 글자 인식은 필요 없다 — 읽어 낸 글자를 우리가 가진 제품·성분 이름

function ocrLoad(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  if (window.__ocrP) return window.__ocrP;
  window.__ocrP = new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js';
    sc.onload = () => ok(window.Tesseract); sc.onerror = () => no(new Error('글자 읽기 도구를 받지 못했어요'));

/* 읽어 낸 글자를 우리가 아는 이름에 맞춰 본다 — 두 글자 이상 이어서 겹치면 후보 */
function ocrMatch(text){
  const t = String(text || '').replace(/[^0-9A-Za-z가-힣]/g, '');
  if (t.length < 2) return [];
  const cand = [];
  const push = (name, kind, href, extra) => {
    const n = String(name).replace(/[^0-9A-Za-z가-힣]/g, '');
    if (n.length < 2) return;
    let best = 0;
    for (let i = 0; i < n.length - 1; i++) {
      for (let L = n.length - i; L >= 2; L--) {
        if (t.includes(n.slice(i, i + L))) { best = Math.max(best, L); break; }
      }
    }
    if (best >= 2) cand.push({ name, kind, href, extra, score: best + (best === n.length ? 3 : 0) });
  };
  (LEX.brand || []).forEach(b => push(b.n, '제품', '/brand/' + encodeURIComponent(b.n), b.comp));
  (D.drugs || []).forEach(d => { push(ingrName(d), '성분', '/drug/' + d.id, d.tagline);
    (d.products || []).forEach(pr => String(pr.name).split('·').forEach(one => push(prodName(one), '제품', '/drug/' + d.id, ingrName(d)))); });

  if (R.directions) parts.push(`<div class="note" style="background:var(--tint);color:var(--primary-deep)">${I.clock}<span>봉투에 적힌 용법: <b>${esc(R.directions)}</b>${R.patient?.name ? ` · ${esc(R.patient.name)}` : ''}${R.patient?.date ? ` · ${esc(R.patient.date)}` : ''}</span></div>`);
  // 알약: 각인·모양·색으로 후보
