const TOP_CLS = { nsaid:'nsaid-top', steroid:'steroid-top', anti1:'anti1-top', sed:null, decongest:null, 'gi-spasm':null, abx:'abx-top', azole:'antifungal-top', oab:null, tca:null, h2:null };
function isTopicalProduct(name){ const n = String(name || '').replace(/\(수출명.*$/, ''); return TOPICAL_FORM.test(n) && !/(내복|시럽|정$|정\(|캡슐|트로키|과립|산$)/.test(n); }
function topicalize(e){
if (TRANSDERMAL.has(e.k)) return e;
const cls = [...new Set((e.cls || []).map(c => c in TOP_CLS ? TOP_CLS[c] : c).filter(Boolean))];
return { ...e, cls, ach: 0, topical: true };
}
function ingOf(x){

if (x.supp) return { ings: suppIngs(x.supp), known: true };
const out = [];
const topical = !!(x.pub && isTopicalProduct(x.pub.full || x.pub.name));
const push = e => { if (!e) return; const f = topical ? topicalize(e) : e; if (!out.some(o => o.k === f.k)) out.push(f); };
if (x.d) {
drugIngs(x.d).forEach(push);
if (!out.length) ingFind(x.d.name).forEach(push);
}
if (x.pub) { ingFind(x.pub.ingr).forEach(push); if (!out.length) ingFind(x.pub.full || x.pub.name).forEach(push); }
if (x.quick) {
const q = x.quick.x;
return { ings: [{ k: q.k || ('q:' + q.id), n: x.name, cls: q.cls, ach: q.ach || 0, approx: true }], known: true, approx: true };
}
if (!out.length && x.name) ingFind(x.name).forEach(push);
return { ings: out, known: out.length > 0 || !!(x.d && x.d.ach != null) };
}

let SPEAKING = null;
