<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="axP-1302-03" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <defs>
        <linearGradient id="x3mantle-1302-03" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0603A"/><stop offset="1" stop-color="#8A3E14"/></linearGradient>
        <linearGradient id="x3sea-1302-03" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC5E6"/><stop offset="1" stop-color="#2E6690"/></linearGradient>
      </defs>
      <rect width="600" height="256" rx="10" fill="#D6ECF8"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#2E3E96">밀도가 큰 쪽이 가라앉고(수렴형), 스치는 곳은 흔들리기만 한다(보존형)</text>
      <!-- 왼쪽: 섭입 단면 -->
      <g transform="translate(0,32)">
        <rect x="16" y="0" width="360" height="200" rx="6" fill="#FDFBF7" stroke="#D9DFF5"/>
        <text x="26" y="17" text-anchor="start" font-size="13.5" font-weight="900" fill="#2E3E96">수렴형 — 섭입 (해양판 + 대륙판)</text>
        <rect x="20" y="24" width="352" height="172" fill="url(#x3mantle-1302-03)"/>
        <!-- 바다 왼쪽 -->
        <rect x="20" y="24" width="190" height="40" fill="url(#x3sea-1302-03)"/>
        <!-- 해양판: 오른쪽으로 가다가 아래로 파고듦 -->
        <path d="M20,64 L200,64 C240,66 270,90 300,140 C320,172 330,190 340,196 L320,196 C310,180 300,160 280,130 C255,95 230,80 200,78 L20,78 Z" fill="#5B6B77" stroke="#3A3A3A" stroke-width="1"/>
        <!-- 해구 -->
        <path d="M196,64 L214,84 L232,68" fill="#1D2A4A"/>
        <text x="214" y="58" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF6D6">해구</text>
        <!-- 대륙판 -->
        <path d="M232,68 L372,68 L372,24 L340,24 L300,48 L232,50 Z" fill="#B98A5E" stroke="#5A4A42" stroke-width="1"/>
        <path d="M232,50 L300,48 L340,24" fill="none"/>
        <!-- 화산 -->
        <path d="M282,50 L296,20 L310,50 Z" fill="#5A4A42"/><path d="M292,20 q-2,12 -6,20 l6,0 q4,-10 6,-20 z" fill="#E85D3A"/><g fill="#8A8288"><circle cx="296" cy="12" r="6"/><circle cx="306" cy="8" r="5"/></g>
        <text x="368" y="38" text-anchor="end" font-size="13" font-weight="900" fill="#FFF6D6">화산<tspan x="368" dy="16">줄지음</tspan></text>
        <!-- 마그마 생성 -->
        <g fill="#FFB56B" opacity="0.8"><circle cx="270" cy="110" r="5"/><circle cx="284" cy="126" r="4"/><circle cx="262" cy="96" r="3.5"/></g>
        <text x="236" y="126" text-anchor="end" font-size="13" font-weight="800" fill="#FFF6D6">마그마 생성</text>
        <!-- 지진 표시 깊은 곳까지 -->
        <g fill="#F6D27A"><circle cx="250" cy="100" r="2.5"/><circle cx="275" cy="135" r="2.5"/><circle cx="298" cy="160" r="2.5"/><circle cx="316" cy="182" r="2.5"/></g>
        <text x="372" y="150" text-anchor="end" font-size="13" font-weight="900" fill="#F6D27A" stroke="#9A4518" stroke-width="3" paint-order="stroke">깊은 곳까지</text><text x="372" y="168" text-anchor="end" font-size="13" font-weight="900" fill="#F6D27A" stroke="#9A4518" stroke-width="3" paint-order="stroke">강한 지진</text>
        <!-- 화살 -->
        <g stroke="#FFF6D6" stroke-width="2.6" fill="none"><path d="M60,71 h60" marker-end="url(#axP-1302-03)"/><path d="M360,63 h-30" marker-end="url(#axP-1302-03)"/></g>
        <text x="24" y="97" text-anchor="start" font-size="13" font-weight="900" fill="#FFF6D6">해양판 — 무거워 파고든다(섭입)</text>
        <text x="60" y="150" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF6D6">판 소멸</text>
        <text x="150" y="172" text-anchor="middle" font-size="13" font-weight="800" fill="#F3E4D0">일본 열도가 바로 이런 자리<tspan x="150" dy="18">대륙판끼리 충돌하면 습곡 산맥(히말라야)</tspan></text>
      </g>
      <!-- 오른쪽: 보존형 (평면도) -->
      <g transform="translate(392,32)">
        <rect width="192" height="200" rx="6" fill="#FDFBF7" stroke="#D9DFF5"/>
        <text x="96" y="16" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">보존형 — 스침</text>
        <g transform="translate(8,26)">
          <rect x="0" y="0" width="176" height="150" fill="#B98A5E"/>
          <rect x="0" y="0" width="80" height="150" fill="#9CC27E"/>
          <!-- 단층선 -->
          <line x1="86" y1="0" x2="76" y2="150" stroke="#D6455D" stroke-width="3"/>
          <!-- 도로 어긋남 -->
          <path d="M0,70 h82 M76,86 h100" stroke="#5B6B77" stroke-width="6"/>
          <path d="M0,70 h82 M76,86 h100" stroke="#FFF6D6" stroke-width="1" stroke-dasharray="6 5"/>
          <!-- 이동 화살 -->
          <g stroke="#2E3E96" stroke-width="2.6" fill="none"><path d="M40,30 v-20" marker-end="url(#axP-1302-03)"/><path d="M130,120 v20" marker-end="url(#axP-1302-03)"/></g>
          <text x="40" y="128" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">수평으로</text><text x="132" y="44" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">어긋난다</text>
          <g transform="translate(88,48)" stroke="#F6D27A" stroke-width="1.8" fill="none"><path d="M-10,0 l4,-5 l4,5 l4,-5 l4,5"/></g>
        </g>
        <text x="96" y="190" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">변환 단층 · 생성도 소멸도 없음</text>
        <text x="96" y="200" text-anchor="middle" font-size="13"> </text>
      </g>
      <text x="300" y="250" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">멀어지면 낳고(해령) · 모이면 삼키고(해구) · 스치면 흔든다(단층) — 보존형은 화산 없이 지진만</text>
    </svg>