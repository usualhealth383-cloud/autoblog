<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans">
      <defs>
        <linearGradient id="q3bg-1104-03" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBEFE7"/><stop offset="1" stop-color="#E7F0F8"/></linearGradient>
      </defs>
      <rect width="600" height="256" rx="10" fill="url(#q3bg-1104-03)"/>
      <text x="20" y="20" font-size="12.5" font-weight="900" fill="#B4560E">소리 곡선이 숫자가 되기까지 — 0.001초마다 점을 찍고, 0~7 단계로 반올림한다</text>
      <!-- 그래프 영역 -->
      <g transform="translate(40,36)">
        <rect width="340" height="176" rx="6" fill="#FFFFFF" stroke="#EBC4AB" stroke-width="1"/>
        <!-- 단계 가로선 0~7 -->
        <g stroke="#E2DED6" stroke-width="1">
          <line x1="30" y1="160" x2="330" y2="160"/><line x1="30" y1="140" x2="330" y2="140"/><line x1="30" y1="120" x2="330" y2="120"/><line x1="30" y1="100" x2="330" y2="100"/><line x1="30" y1="80" x2="330" y2="80"/><line x1="30" y1="60" x2="330" y2="60"/><line x1="30" y1="40" x2="330" y2="40"/><line x1="30" y1="20" x2="330" y2="20"/>
        </g>
        <g font-size="8.5" font-weight="800" fill="#5B6B77" text-anchor="end"><text x="24" y="163">0</text><text x="24" y="143">1</text><text x="24" y="123">2</text><text x="24" y="103">3</text><text x="24" y="83">4</text><text x="24" y="63">5</text><text x="24" y="43">6</text><text x="24" y="23">7</text></g>
        <text x="8" y="12" font-size="8.5" font-weight="900" fill="#2E6690">단계</text>
        <!-- 표본 세로선 (8개, 간격 36) -->
        <g stroke="#C9D3DC" stroke-width="1" stroke-dasharray="3 2"><line x1="46" y1="20" x2="46" y2="160"/><line x1="82" y1="20" x2="82" y2="160"/><line x1="118" y1="20" x2="118" y2="160"/><line x1="154" y1="20" x2="154" y2="160"/><line x1="190" y1="20" x2="190" y2="160"/><line x1="226" y1="20" x2="226" y2="160"/><line x1="262" y1="20" x2="262" y2="160"/><line x1="298" y1="20" x2="298" y2="160"/></g>
        <!-- 원 곡선 (3,5,7,6,4,2,1,3 근처를 지나되 살짝 벗어남) -->
        <path d="M30,108 C40,104 56,66 82,58 S110,22 118,22 S146,36 154,42 S182,76 190,82 S218,116 226,118 S256,140 262,138 S292,108 298,98 S322,70 330,66" fill="none" stroke="#C1521E" stroke-width="2.4"/>
        <!-- 표본점 (반올림된 단계) -->
        <g fill="#2E6690" stroke="#FFFFFF" stroke-width="1.5"><circle cx="46" cy="100" r="5"/><circle cx="82" cy="60" r="5"/><circle cx="118" cy="20" r="5"/><circle cx="154" cy="40" r="5"/><circle cx="190" cy="80" r="5"/><circle cx="226" cy="120" r="5"/><circle cx="262" cy="140" r="5"/><circle cx="298" cy="100" r="5"/></g>
        <!-- 계단 -->
        <path d="M46,100 h36 v-40 h36 v-40 h36 v20 h36 v40 h36 v40 h36 v20 h36 v-40 h24" fill="none" stroke="#2E6690" stroke-width="1.4" stroke-dasharray="4 2"/>
        <g font-size="8.5" font-weight="800" fill="#5B6B77" text-anchor="middle"><text x="46" y="173">0</text><text x="118" y="173">0.002</text><text x="190" y="173">0.004</text><text x="262" y="173">0.006</text><text x="330" y="173">초</text></g>
        <text x="200" y="12" text-anchor="middle" font-size="9" font-weight="800" fill="#C1521E">붉은 선 = 원래 소리(아날로그) · 점 = 0.001초마다 뽑은 표본</text>
      </g>
      <!-- 오른쪽: 숫자열 → 이진수 -->
      <g transform="translate(396,36)">
        <rect width="188" height="176" rx="6" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="1"/>
        <text x="94" y="18" text-anchor="middle" font-size="10.5" font-weight="900" fill="#2E6690">뽑힌 값 → 이진수(3자리)</text>
        <g font-size="10" font-weight="800" font-family="ui-monospace,Menlo,monospace">
          <g fill="#3A3A3A"><text x="28" y="42">3</text><text x="28" y="58">5</text><text x="28" y="74">7</text><text x="28" y="90">6</text><text x="28" y="106">4</text><text x="28" y="122">2</text><text x="28" y="138">1</text><text x="28" y="154">3</text></g>
          <g fill="#8A949E"><text x="52" y="42">→</text><text x="52" y="58">→</text><text x="52" y="74">→</text><text x="52" y="90">→</text><text x="52" y="106">→</text><text x="52" y="122">→</text><text x="52" y="138">→</text><text x="52" y="154">→</text></g>
          <g fill="#2E6690"><text x="80" y="42">011</text><text x="80" y="58">101</text><text x="80" y="74">111</text><text x="80" y="90">110</text><text x="80" y="106">100</text><text x="80" y="122">010</text><text x="80" y="138">001</text><text x="80" y="154">011</text></g>
        </g>
        <text x="150" y="98" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5B6B77">8단계 =</text>
        <text x="150" y="110" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5B6B77">000~111</text>
        <text x="94" y="170" text-anchor="middle" font-size="9" font-weight="900" fill="#C1521E">이것이 파일의 정체다</text>
      </g>
      <text x="300" y="234" text-anchor="middle" font-size="11" font-weight="900" fill="#B4560E">① 표본화 = 언제 뽑나(점찍기) · ② 양자화 = 어느 단계로 적나(반올림)</text>
      <text x="300" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#3A3A3A">더 촘촘히 뽑고 단계를 잘게 나누면 원본에 가까워진다 — 대신 숫자가 많아져 용량이 커진다</text>
    </svg>