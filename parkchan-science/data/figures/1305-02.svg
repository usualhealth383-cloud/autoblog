<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrBr-1305-02" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D6455D"/></marker><marker id="arrG-1305-02" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#147D6F"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#EAF3FB"/>
      <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#2E3E96">만들 때는 에너지를 넣고(동화), 부술 때는 에너지가 나온다(이화) — 그리고 세포는 타지 않고 조금씩 꺼낸다</text>
      <!-- 동화: 광합성 -->
      <g transform="translate(10,32)">
        <rect width="285" height="120" rx="8" fill="#F3F7F1" stroke="#CFE0C8"/>
        <text x="142" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#147D6F">동화 작용 — 광합성(엽록체)</text>
        <circle cx="34" cy="46" r="14" fill="#F6D27A"/>
        <g stroke="#D9930D" stroke-width="2" stroke-linecap="round"><path d="M52,40 l10,-4 M54,50 l10,2 M50,32 l8,-8"/></g>
        <text x="34" y="76" text-anchor="middle" font-size="7.5" font-weight="800" fill="#8A4B00">빛에너지 흡수</text>
        <text x="118" y="50" text-anchor="middle" font-size="9" font-weight="800" fill="#3A3A3A">이산화 탄소 + 물</text>
        <text x="118" y="64" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5B6B77">작고 간단한 물질</text>
        <path d="M162,54 H196" stroke="#147D6F" stroke-width="3" fill="none" marker-end="url(#arrG-1305-02)"/>
        <path d="M40,92 q40,-14 90,0 q40,10 82,-4" stroke="#7FA86B" stroke-width="3" fill="none"/>
        <path d="M212,40 q20,-14 44,0 q-20,26 -44,0 z" fill="#7FA86B" stroke="#147D6F" stroke-width="1.4"/>
        <text x="236" y="70" text-anchor="middle" font-size="9" font-weight="900" fill="#147D6F">포도당</text>
        <text x="236" y="82" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5B6B77">크고 복잡한 물질</text>
        <text x="142" y="110" text-anchor="middle" font-size="8.5" font-weight="900" fill="#147D6F">합성 = 에너지 흡수</text>
      </g>
      <!-- 이화: 세포 호흡 -->
      <g transform="translate(305,32)">
        <rect width="285" height="120" rx="8" fill="#FDF0EC" stroke="#F0C8BC"/>
        <text x="142" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#D6455D">이화 작용 — 세포 호흡(미토콘드리아)</text>
        <path d="M22,40 q20,-14 44,0 q-20,26 -44,0 z" fill="#7FA86B" stroke="#147D6F" stroke-width="1.4"/>
        <text x="44" y="64" text-anchor="middle" font-size="9" font-weight="900" fill="#147D6F">포도당 + 산소</text>
        <path d="M84,52 H118" stroke="#D6455D" stroke-width="3" fill="none" marker-end="url(#arrBr-1305-02)"/>
        <g transform="translate(150,52) rotate(-15)"><ellipse rx="30" ry="14" fill="#F0A275" stroke="#D6455D" stroke-width="1.6"/><path d="M-20,-4 q6,8 12,0 q6,-8 12,0 q6,8 12,0" stroke="#D6455D" stroke-width="1.4" fill="none"/></g>
        <path d="M184,52 H216" stroke="#D6455D" stroke-width="3" fill="none" marker-end="url(#arrBr-1305-02)"/>
        <text x="250" y="48" text-anchor="middle" font-size="9" font-weight="800" fill="#3A3A3A">이산화 탄소</text>
        <text x="250" y="62" text-anchor="middle" font-size="9" font-weight="800" fill="#3A3A3A">+ 물</text>
        <g stroke="#D9930D" stroke-width="2.2" stroke-linecap="round"><path d="M150,26 l0,-8 M138,30 l-6,-6 M162,30 l6,-6"/></g>
        <text x="150" y="88" text-anchor="middle" font-size="8.5" font-weight="900" fill="#D9930D">에너지 방출 → 세포가 쓴다</text>
        <text x="142" y="110" text-anchor="middle" font-size="8.5" font-weight="900" fill="#D6455D">분해 = 에너지 방출</text>
      </g>
      <!-- 연소 vs 세포호흡 -->
      <g transform="translate(10,160)">
        <rect width="580" height="88" rx="8" fill="#FDFBF7" stroke="#D9DFF5"/>
        <text x="290" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">같은 반응식, 다른 방식 — 연소는 한꺼번에 고온으로, 세포 호흡은 체온에서 여러 단계로</text>
        <!-- 연소 불꽃 -->
        <path d="M60,74 q-20,-16 -4,-40 q2,14 10,10 q-2,-16 12,-24 q-2,18 10,26 q10,10 -4,28 z" fill="#F0A275" stroke="#D6455D" stroke-width="1.4"/>
        <path d="M60,74 q-8,-8 -2,-20 q6,6 10,0 q4,10 -2,20 z" fill="#F6D27A"/>
        <text x="130" y="44" font-size="8.5" font-weight="900" fill="#D6455D">연소 — 한꺼번에, 높은 온도</text>
        <text x="130" y="58" font-size="7.5" font-weight="700" fill="#5B6B77">에너지가 열과 빛으로 한 번에 빠져나간다</text>
        <!-- 계단식 -->
        <g transform="translate(330,30)">
          <path d="M0,42 h30 v-10 h30 v-10 h30 v-10 h30 v-10 h30" stroke="#2E3E96" stroke-width="2.4" fill="none"/>
          <g fill="#D9930D"><circle cx="30" cy="36" r="3"/><circle cx="60" cy="26" r="3"/><circle cx="90" cy="16" r="3"/><circle cx="120" cy="6" r="3"/></g>
        </g>
        <text x="470" y="44" font-size="8.5" font-weight="900" fill="#2E3E96">세포 호흡</text>
        <text x="470" y="56" font-size="7.5" font-weight="700" fill="#5B6B77">37 ℃, 단계마다</text>
        <text x="470" y="67" font-size="7.5" font-weight="700" fill="#5B6B77">조금씩 꺼내 쓴다</text>
        <text x="400" y="82" text-anchor="middle" font-size="7.5" font-weight="800" fill="#D9930D">● = 단계마다 꺼내 쓰는 에너지</text>
      </g>
    </svg>