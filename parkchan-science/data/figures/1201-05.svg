        <text x="200" y="86" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0F6357">헬륨 1개 = 질량 4</text>
        <text x="262" y="50" text-anchor="middle" font-size="10" font-weight="900" fill="#C1521E">12 : 4</text>
        <text x="262" y="66" text-anchor="middle" font-size="10" font-weight="900" fill="#C1521E">= 3 : 1</text>
      </g>
      <text x="530" y="126" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0F6357">이론의 예측 = 관측</text>
      <text x="530" y="140" text-anchor="middle" font-size="9.5" font-weight="900" fill="#0F6357">→ 빅뱅의 증거 ②</text>
