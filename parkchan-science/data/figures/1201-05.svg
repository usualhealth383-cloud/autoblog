<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrB-1201-05" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#147D6F"/></marker></defs>
      <defs>
        <radialGradient id="u5g-1201-05" cx="0.4" cy="0.4" r="0.7"><stop offset="0" stop-color="#3B5C8A"/><stop offset="1" stop-color="#0B1430"/></radialGradient>
      </defs>
      <rect width="600" height="256" rx="10" fill="#FDFBF7"/>
      <text x="20" y="20" font-size="12.5" font-weight="900" fill="#0F6357">우주 어디를 보아도 — 수소 74 %, 헬륨 24 %, 나머지 2 %</text>
      <!-- 왼쪽: 세 관측 대상 -->
      <g transform="translate(70,80)"><circle r="26" fill="url(#u5g-1201-05)"/><circle r="6" fill="#F6D27A"/><text y="46" text-anchor="middle" font-size="10" font-weight="800" fill="#3A3A3A">가까운 별</text></g>
      <g transform="translate(70,160)"><ellipse rx="30" ry="11" fill="#C9D3DC" opacity="0.5"/><path d="M-24,0 q10,-14 24,-4 M24,0 q-10,14 -24,4" stroke="#5B6B77" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle r="5" fill="#F6D27A"/><text y="34" text-anchor="middle" font-size="10" font-weight="800" fill="#3A3A3A">먼 은하</text></g>
      <g transform="translate(70,230)"><rect x="-30" y="-12" width="60" height="22" rx="4" fill="#1D2A4A"/><g stroke-width="2"><line x1="-16" y1="-12" x2="-16" y2="10" stroke="#3B6FE0"/><line x1="0" y1="-12" x2="0" y2="10" stroke="#3CC27A"/><line x1="18" y1="-12" x2="18" y2="10" stroke="#D9342B"/></g><text y="24" text-anchor="middle" font-size="9" font-weight="800" fill="#3A3A3A">스펙트럼으로 잰다</text></g>
      <g stroke="#147D6F" stroke-width="2" fill="none"><path d="M104,80 C140,80 150,120 176,120" marker-end="url(#arrB-1201-05)"/><path d="M104,160 C140,160 150,120 176,120" marker-end="url(#arrB-1201-05)"/></g>
      <!-- 가운데: 질량 막대 -->
      <g transform="translate(190,60)">
        <text x="150" y="-6" text-anchor="middle" font-size="11" font-weight="900" fill="#0F6357">질량비 (막대 길이 = 실제 비율)</text>
        <rect x="0" y="4" width="300" height="36" fill="#E2DED6"/>
        <rect x="0" y="4" width="222" height="36" fill="#147D6F"/>
        <rect x="222" y="4" width="72" height="36" fill="#4BA394"/>
        <rect x="294" y="4" width="6" height="36" fill="#C1521E"/>
        <text x="111" y="28" text-anchor="middle" font-size="12" font-weight="900" fill="#FFFFFF">수소 74 %</text>
        <text x="258" y="28" text-anchor="middle" font-size="11" font-weight="900" fill="#FFFFFF">헬륨 24 %</text>
        <text x="297" y="54" text-anchor="end" font-size="9" font-weight="800" fill="#C1521E">그 외 2 %</text>
        <text x="150" y="70" text-anchor="middle" font-size="13" font-weight="900" fill="#0F6357">수소 : 헬륨 ≈ 3 : 1</text>
      </g>
      <!-- 아래: 개수비 vs 질량비 -->
      <g transform="translate(190,150)">
        <rect width="300" height="96" rx="7" fill="#E7F5F1" stroke="#C9E7DF" stroke-width="1"/>
        <text x="150" y="18" text-anchor="middle" font-size="10.5" font-weight="900" fill="#0F6357">개수로 세면 12 : 1, 무게로 재면 3 : 1 — 헬륨 하나가 수소 넷만큼 무겁다</text>
