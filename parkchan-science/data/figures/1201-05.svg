        <g fill="#147D6F"><circle cx="24" cy="44" r="6"/><circle cx="40" cy="44" r="6"/><circle cx="56" cy="44" r="6"/><circle cx="72" cy="44" r="6"/><circle cx="88" cy="44" r="6"/><circle cx="104" cy="44" r="6"/><circle cx="24" cy="62" r="6"/><circle cx="40" cy="62" r="6"/><circle cx="56" cy="62" r="6"/><circle cx="72" cy="62" r="6"/><circle cx="88" cy="62" r="6"/><circle cx="104" cy="62" r="6"/></g>
        <text x="64" y="86" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0F6357">수소 12개 = 질량 12</text>
        <text x="140" y="58" text-anchor="middle" font-size="14" font-weight="900" fill="#5B6B77">:</text>
