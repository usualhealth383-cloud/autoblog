<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrBr-1304-05" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D6455D"/></marker><marker id="arrY-1304-05" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D9930D"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#EAF3FB"/>
      <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#2E3E96">보낼 때는 충격량을 키운다 — 오래 밀거나(팔로스루), 순간에 힘을 모으거나(격파)</text>
      <!-- 골프 팔로스루 -->
      <g transform="translate(10,32)">
        <rect width="330" height="184" rx="8" fill="#FDFBF7" stroke="#D9DFF5"/>
        <text x="165" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">골프·야구의 팔로스루 — 친 뒤에도 끝까지 휘두른다</text>
        <rect x="8" y="150" width="314" height="26" rx="4" fill="#7FA86B"/>
        <!-- 골퍼 -->
        <g stroke="#2B2B2B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="70" cy="52" r="7" fill="#2B2B2B" stroke="none"/><path d="M70,59 v36 M70,95 l-12,32 M70,95 l14,30 M70,68 l-8,20"/></g>
        <!-- 채 궤적 3단계 -->
        <path d="M62,88 L28,132" stroke="#C9D3DC" stroke-width="3"/>
        <path d="M62,88 L82,142" stroke="#8A949E" stroke-width="3"/>
        <path d="M62,88 L128,104" stroke="#2B2B2B" stroke-width="3"/>
        <path d="M30,134 q20,26 58,16 q30,-8 44,-42" stroke="#D9930D" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrY-1304-05)"/>
        <!-- 공 -->
        <circle cx="86" cy="146" r="5" fill="#FDFBF7" stroke="#5B6B77" stroke-width="1.4"/>
        <path d="M96,142 q60,-70 190,-40" stroke="#D6455D" stroke-width="2.6" fill="none" marker-end="url(#arrBr-1304-05)"/>
        <circle cx="160" cy="98" r="5" fill="#FDFBF7" stroke="#5B6B77" stroke-width="1.4"/><circle cx="230" cy="86" r="5" fill="#FDFBF7" stroke="#5B6B77" stroke-width="1.4"/>
        <text x="200" y="128" text-anchor="middle" font-size="8.5" font-weight="900" fill="#8A4B00">접촉 시간 ↑ → 충격량 ↑</text>
        <text x="200" y="141" text-anchor="middle" font-size="8.5" font-weight="900" fill="#D6455D">운동량 변화 ↑ → 더 빠르게, 더 멀리</text>
        <text x="220" y="50" text-anchor="middle" font-size="8" font-weight="700" fill="#5B6B77">힘을 빼는 동작이 아니다</text>
      </g>
      <!-- 격파 -->
      <g transform="translate(350,32)">
        <rect width="240" height="184" rx="8" fill="#FDFBF7" stroke="#D9DFF5"/>
        <text x="120" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">태권도 격파 — 순간에 힘을 모은다</text>
        <!-- 받침 -->
        <rect x="40" y="120" width="12" height="50" fill="#8A4B00"/><rect x="188" y="120" width="12" height="50" fill="#8A4B00"/>
        <!-- 송판(부러짐) -->
        <path d="M40,120 L114,120 L120,132 L126,120 L200,120 L200,128 L126,128 L120,140 L114,128 L40,128 z" fill="#E0B878" stroke="#8A4B00" stroke-width="1.2"/>
        <!-- 주먹/손날 -->
        <g stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" fill="none"><path d="M120,40 V96"/></g>
        <rect x="108" y="92" width="24" height="18" rx="5" fill="#2B2B2B"/>
        <path d="M120,60 V112" stroke="#D6455D" stroke-width="4" fill="none" marker-end="url(#arrBr-1304-05)"/>
        <g stroke="#D9930D" stroke-width="2" stroke-linecap="round"><path d="M96,112 l-10,-8 M144,112 l10,-8 M100,134 l-10,10 M140,134 l10,10"/></g>
        <text x="120" y="160" text-anchor="middle" font-size="8.5" font-weight="900" fill="#D6455D">아주 짧은 시간 × 큰 힘</text>
        <text x="120" y="174" text-anchor="middle" font-size="8.5" font-weight="900" fill="#3A3A3A">순간의 힘을 키워 부순다</text>
      </g>
      <rect x="10" y="224" width="580" height="24" rx="6" fill="#2E3E96"/>
      <text x="300" y="240" text-anchor="middle" font-size="9.5" font-weight="900" fill="#FFF">지킬 때: 시간 ↑ 힘 ↓ (안전) · 보낼 때: 힘·시간 ↑ 충격량 ↑ (스포츠) — 같은 등식의 앞뒤 면</text>
    </svg>