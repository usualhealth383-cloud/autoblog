<svg width="600" height="232" viewBox="0 0 620 240" font-family="PC Sans">
      <text x="310" y="15" text-anchor="middle" font-size="11" font-weight="900" fill="#0F6357">신재생 에너지의 종류 — 무엇을 이용하는가</text>
      <g transform="translate(8,24)" text-anchor="middle">
        <!-- 태양광 -->
        <g transform="translate(0,0)">
          <rect width="72" height="86" rx="6" fill="#E7F5F1"/>
          <g transform="translate(36,32)">
            <g transform="translate(-8,-10)">
              <circle r="6" fill="#F3C24E"/>
              <g stroke="#F3C24E" stroke-width="1.6" stroke-linecap="round">
                <line y1="-9" y2="-12"/><line y1="9" y2="12"/><line x1="-9" x2="-12"/><line x1="9" x2="12"/>
                <line x1="-6.5" y1="-6.5" x2="-8.5" y2="-8.5"/><line x1="6.5" y1="-6.5" x2="8.5" y2="-8.5"/><line x1="6.5" y1="6.5" x2="8.5" y2="8.5"/>
              </g>
            </g>
            <rect x="-6" y="2" width="24" height="14" rx="1.5" fill="#2E6690"/>
            <g stroke="#fff" stroke-width="0.8"><line x1="2" y1="2" x2="2" y2="16"/><line x1="10" y1="2" x2="10" y2="16"/><line x1="-6" y1="9" x2="18" y2="9"/></g>
          </g>
          <text x="36" y="66" font-size="9" font-weight="900" fill="#0F6357">태양광</text>
          <text x="36" y="78" font-size="8" fill="#5B6B77">빛 → 전기(태양 전지)</text>
        </g>
        <!-- 태양열 -->
        <g transform="translate(76,0)">
          <rect width="72" height="86" rx="6" fill="#E7F5F1"/>
          <g transform="translate(36,32)">
            <g transform="translate(0,-10)">
              <circle r="6" fill="#F3C24E"/>
              <g stroke="#F3C24E" stroke-width="1.6" stroke-linecap="round">
                <line y1="-9" y2="-12"/><line x1="-9" x2="-12"/><line x1="9" x2="12"/>
                <line x1="-6.5" y1="-6.5" x2="-8.5" y2="-8.5"/><line x1="6.5" y1="-6.5" x2="8.5" y2="-8.5"/>
              </g>
            </g>
            <g stroke="#D6455D" stroke-width="1.6" fill="none" stroke-linecap="round">
              <path d="M-11,15 q2,-4 0,-8 q-2,-4 0,-7"/><path d="M0,15 q2,-4 0,-8 q-2,-4 0,-7"/><path d="M11,15 q2,-4 0,-8 q-2,-4 0,-7"/>
            </g>
          </g>
          <text x="36" y="66" font-size="9" font-weight="900" fill="#0F6357">태양열</text>
          <text x="36" y="78" font-size="8" fill="#5B6B77">빛 → 열</text>
        </g>
        <!-- 풍력 -->
        <g transform="translate(152,0)">
          <rect width="72" height="86" rx="6" fill="#E7F5F1"/>
          <g transform="translate(36,34)">
            <line x1="0" y1="0" x2="0" y2="18" stroke="#8A949E" stroke-width="2.4" stroke-linecap="round"/>
            <g fill="#5B6B77">
              <ellipse cx="0" cy="-9" rx="2.4" ry="9.5"/>
              <ellipse cx="0" cy="-9" rx="2.4" ry="9.5" transform="rotate(120)"/>
              <ellipse cx="0" cy="-9" rx="2.4" ry="9.5" transform="rotate(240)"/>
            </g>
            <circle r="2.4" fill="#2B2B2B"/>
          </g>
          <text x="36" y="66" font-size="9" font-weight="900" fill="#0F6357">풍력</text>
          <text x="36" y="78" font-size="8" fill="#5B6B77">바람</text>
        </g>
        <!-- 수력 -->
        <g transform="translate(228,0)">
          <rect width="72" height="86" rx="6" fill="#E7F5F1"/>
          <g transform="translate(36,32)">
            <path d="M0,-16 C-7,-5 -9,0 -9,4 a9,9 0 0 0 18,0 C9,0 7,-5 0,-16 z" fill="#4C86B0"/>
            <path d="M-16,18 q4,-3 8,0 t8,0 t8,0 t8,0" fill="none" stroke="#4C86B0" stroke-width="1.6" stroke-linecap="round"/>
          </g>
          <text x="36" y="66" font-size="9" font-weight="900" fill="#0F6357">수력</text>
          <text x="36" y="78" font-size="8" fill="#5B6B77">떨어지는 물</text>
        </g>
        <!-- 지열 -->
        <g transform="translate(304,0)">
          <rect width="72" height="86" rx="6" fill="#E7F5F1"/>
          <g transform="translate(36,32)">
            <rect x="-17" y="6" width="34" height="12" rx="2" fill="#B8946F"/>
            <path d="M-17,10 h34" stroke="#D6455D" stroke-width="2" opacity="0.7"/>
            <g stroke="#D6455D" stroke-width="1.6" fill="none" stroke-linecap="round">
              <path d="M-10,4 q2,-4 0,-8 q-2,-4 0,-7"/><path d="M0,4 q2,-4 0,-8 q-2,-4 0,-7"/><path d="M10,4 q2,-4 0,-8 q-2,-4 0,-7"/>
            </g>
          </g>
          <text x="36" y="66" font-size="9" font-weight="900" fill="#0F6357">지열</text>
          <text x="36" y="78" font-size="8" fill="#5B6B77">지구 내부의 열</text>
        </g>
        <!-- 조력 -->
        <g transform="translate(380,0)">
          <rect width="72" height="86" rx="6" fill="#E7F5F1"/>
          <g transform="translate(36,32)">
            <path d="M-6,-16 a7,7 0 1 0 6,10 a5.5,5.5 0 0 1 -6,-10 z" fill="#F3C24E"/>
            <path d="M-17,8 q4,-4 8,0 t8,0 t8,0 t8,0" fill="none" stroke="#4C86B0" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M-17,15 q4,-4 8,0 t8,0 t8,0 t8,0" fill="none" stroke="#7FB8DE" stroke-width="1.8" stroke-linecap="round"/>
          </g>
          <text x="36" y="66" font-size="9" font-weight="900" fill="#0F6357">조력</text>
          <text x="36" y="78" font-size="8" fill="#5B6B77">밀물과 썰물</text>
        </g>
        <!-- 바이오 -->
        <g transform="translate(456,0)">
          <rect width="72" height="86" rx="6" fill="#E7F5F1"/>
          <g transform="translate(36,32)">
            <path d="M-13,12 C-13,-6 3,-14 15,-15 C15,2 5,14 -13,12 z" fill="#5E9E4A"/>
            <path d="M-11,11 C-4,2 4,-6 13,-13" fill="none" stroke="#DDEFD5" stroke-width="1.2"/>
          </g>
          <text x="36" y="66" font-size="9" font-weight="900" fill="#0F6357">바이오</text>
          <text x="36" y="78" font-size="8" fill="#5B6B77">생물 자원</text>
        </g>
        <!-- 연료 전지 -->
        <g transform="translate(532,0)">
          <rect width="72" height="86" rx="6" fill="#E7F5F1"/>
          <g transform="translate(36,32)">
            <rect x="-17" y="-12" width="34" height="22" rx="3" fill="#2E6690"/>
            <text y="4" fill="#fff" font-size="10" font-weight="900">H<tspan dy="0.14em" font-size="68%">2</tspan></text>
            <path d="M0,20 C-3,15 -4,13 -4,12 a4,4 0 0 0 8,0 c0,-1 -1,-3 -4,-8 z" fill="#4C86B0" transform="translate(0,-5)"/>
          </g>
          <text x="36" y="66" font-size="9" font-weight="900" fill="#0F6357">연료 전지</text>
          <text x="36" y="78" font-size="8" fill="#5B6B77">수소 + 산소 → 전기</text>
        </g>
      </g>
      <!-- 장점 / 한계 -->
      <g transform="translate(8,120)">
        <rect width="296" height="74" rx="8" fill="#E7F5F1"/>
        <text x="16" y="20" font-size="10.5" font-weight="900" fill="#0F6357">장점</text>
        <g font-size="8.8" fill="#3A3A3A" font-weight="700">
          <text x="16" y="38">· 고갈 걱정이 적다</text>
          <text x="16" y="52">· 온실 기체 배출이 적다</text>
          <text x="16" y="66">· 대부분 지금의 태양이 보내는 에너지에서 비롯된다</text>
        </g>
      </g>
      <g transform="translate(316,120)">
        <rect width="296" height="74" rx="8" fill="#EAF3F8"/>
        <text x="16" y="20" font-size="10.5" font-weight="900" fill="#2E6690">한계</text>
        <g font-size="8.8" fill="#3A3A3A" font-weight="700">
          <text x="16" y="38">· 날씨·시간·입지에 따라 출력이 변한다</text>
          <text x="16" y="52">· 해가 지면 태양광 발전은 멈춘다</text>
          <text x="16" y="66">· 비용과 저장(배터리) 기술의 과제가 남아 있다</text>
        </g>
      </g>
      <rect x="8" y="204" width="604" height="30" rx="6" fill="#0F6357"/>
      <text x="310" y="217" text-anchor="middle" font-size="9.4" font-weight="800" fill="#fff">지속가능한 발전 = 신재생 에너지 확대 + 에너지 효율 개선 + 저장 기술</text>
      <text x="310" y="229" text-anchor="middle" font-size="7.6" fill="#C9E7DF">미래 세대의 몫을 당겨쓰지 않으면서 오늘의 필요를 채운다</text>
    </svg>