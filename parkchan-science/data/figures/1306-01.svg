<svg width="600" height="270" viewBox="0 0 600 270" font-family="PC Sans"><defs><marker id="axP-1306-01" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="270" rx="10" fill="#F3F7F1"/>
      <text x="300" y="20" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">핵은 도서관, 염색체는 책장, DNA는 책, 유전자는 그 책의 한 단원 — 확대해 들어간다</text>
      <!-- 핵 -->
      <g transform="translate(70,130)">
        <ellipse rx="56" ry="50" fill="#C9D3EC" stroke="#4053B8" stroke-width="2.2"/>
        <g fill="#4053B8"><path d="M-24,-18 l6,-14 l6,14 l6,-14 l6,14" stroke="#4053B8" stroke-width="2.4" fill="none"/><path d="M-6,14 l6,-14 l6,14 l6,-14 l6,14" stroke="#4053B8" stroke-width="2.4" fill="none"/></g>
        <text x="0" y="70" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">핵 — 도서관</text>
      </g>
      <path d="M134,130 H164" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1306-01)"/>
      <!-- 염색체 -->
      <g transform="translate(212,130)">
        <path d="M-14,-52 q-12,52 0,104 M14,-52 q12,52 0,104" stroke="#4053B8" stroke-width="12" stroke-linecap="round" fill="none"/>
        <circle r="8" fill="#2E3E96"/>
        <text x="0" y="74" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">염색체 — 책장</text>
        <text x="0" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">DNA가 단백질과 감겨 뭉친 것</text>
      </g>
      <path d="M248,130 H278" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1306-01)"/>
      <!-- DNA 이중나선 + 유전자 강조 -->
      <g transform="translate(290,0)">
        <path d="M0,70 q40,-30 80,0 t80,0 t80,0 t60,0" stroke="#4053B8" stroke-width="3" fill="none"/>
        <path d="M0,130 q40,30 80,0 t80,0 t80,0 t60,0" stroke="#4053B8" stroke-width="3" fill="none"/>
                <!-- 염기쌍 가로대 -->
        <g stroke-width="3" stroke-linecap="round">
          <path d="M20,86 V114" stroke="#D6455D"/><path d="M44,82 V118" stroke="#147D6F"/><path d="M68,78 V122" stroke="#D9930D"/>
          <path d="M100,78 V122" stroke="#D9930D"/><path d="M124,82 V118" stroke="#D6455D"/><path d="M148,86 V114" stroke="#147D6F"/>
          <path d="M180,78 V122" stroke="#D6455D"/><path d="M204,82 V118" stroke="#D9930D"/><path d="M228,86 V114" stroke="#147D6F"/><path d="M260,80 V120" stroke="#D6455D"/>
        </g>
        <text x="20" y="164" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">A</text><text x="44" y="164" text-anchor="middle" font-size="13" font-weight="900" fill="#147D6F">G</text><text x="68" y="164" text-anchor="middle" font-size="13" font-weight="900" fill="#D9930D">C</text><text x="100" y="164" text-anchor="middle" font-size="13" font-weight="900" fill="#D9930D">C</text><text x="124" y="164" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">T</text><text x="148" y="164" text-anchor="middle" font-size="13" font-weight="900" fill="#147D6F">G</text>
        <text x="150" y="52" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">DNA — 책 (두 가닥이 꼬인 이중나선)</text>
        <!-- 유전자 구간 강조 -->
        <rect x="88" y="62" width="76" height="76" rx="6" fill="none" stroke="#D6455D" stroke-width="2" stroke-dasharray="5 3"/>
        <text x="140" y="186" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">유전자 — 한 단원(단백질 하나의 정보)</text>
        <text x="150" y="206" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">정보 = 염기(A·G·C·T)가 늘어선 순서</text>
      </g>
      <rect x="14" y="234" width="572" height="26" rx="6" fill="#2E3E96"/>
      <text x="300" y="251.5" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF">크기 순서: 염색체 ⊃ DNA ⊃ 유전자 · 사람 DNA에는 유전자 약 2만 개 — 단원이 2만 개인 설계도 책</text>
    </svg>