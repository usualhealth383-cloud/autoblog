      <text x="145" y="208" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF6D6">빛(노랑)이 자유 전자(청록)에</text><text x="145" y="224" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF6D6">부딪힐 때마다 꺾인다</text>
      <text x="145" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#C9D3DC">멀리 나아가지 못한다 — 불투명</text>
