      <g><g transform="translate(360,80)"><circle r="12" fill="none" stroke="#7FD6C6" stroke-width="1"/><circle r="4" fill="#D6455D"/><circle cx="11" cy="-4" r="2.5" fill="#7FD6C6"/></g>
         <g transform="translate(430,150)"><circle r="12" fill="none" stroke="#7FD6C6" stroke-width="1"/><circle r="4" fill="#D6455D"/><circle cx="-10" cy="6" r="2.5" fill="#7FD6C6"/></g>
         <g transform="translate(520,70)"><circle r="12" fill="none" stroke="#7FD6C6" stroke-width="1"/><circle r="4" fill="#D6455D"/><circle cx="9" cy="8" r="2.5" fill="#7FD6C6"/></g>
         <g transform="translate(560,170)"><circle r="12" fill="none" stroke="#7FD6C6" stroke-width="1"/><circle r="4" fill="#D6455D"/><circle cx="-8" cy="-8" r="2.5" fill="#7FD6C6"/></g></g>
