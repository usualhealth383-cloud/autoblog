      <text x="540" y="96" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF6D6">오늘 · 전파로 관측</text>
      <text x="455" y="208" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF6D6">가로막던 전자가 사라져 빛이 곧게 나아간다</text>
      <text x="455" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#C9D3DC">그때 퍼진 빛의 흔적 =</text><text x="455" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#C9D3DC">우주 배경 복사(현재 약 2.7 K)</text>
