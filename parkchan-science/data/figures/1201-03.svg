      <g fill="#F6D27A"><path d="M470,104 l12,6 l-12,6 z"/><path d="M470,120 l12,6 l-12,6 z"/><path d="M470,136 l12,6 l-12,6 z"/></g>
      <!-- 안테나 (오늘) -->
