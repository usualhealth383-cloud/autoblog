      <g fill="#D6455D"><circle cx="100" cy="88" r="5"/><circle cx="170" cy="120" r="5"/><circle cx="210" cy="90" r="5"/><circle cx="80" cy="160" r="5"/></g>
      <!-- 튕기는 빛 -->
      <path d="M20,120 L60,72 L118,56 L128,98 L92,128 L150,148 L182,90 L222,128 L200,182" fill="none" stroke="#F6D27A" stroke-width="2" stroke-linecap="round"/>
