<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="axP-1306-05" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#FDF0EC"/>
      <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#2E3E96">염기 한 글자 → 아미노산 하나 → 단백질의 모양 → 적혈구의 모양 → 몸 전체의 형질로 증폭된다</text>
      <!-- 위: 정상 / 아래: 변이 -->
      <text x="34" y="66" font-size="9.5" font-weight="900" fill="#147D6F">정상</text>
      <text x="34" y="170" font-size="9.5" font-weight="900" fill="#D6455D">변이</text>
      <!-- 1 염기 -->
      <g transform="translate(110,0)">
        <text x="0" y="40" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">① 염기 서열</text>
        <g font-size="10" font-weight="900" text-anchor="middle">
          <rect x="-44" y="52" width="88" height="24" rx="4" fill="#E3F2EE" stroke="#147D6F"/><text x="0" y="69" fill="#147D6F">… ■ ■ ■ …</text>
          <rect x="-44" y="156" width="88" height="24" rx="4" fill="#FDE3E8" stroke="#D6455D"/><text x="-16" y="173" fill="#D6455D">… ■</text><text x="2" y="173" fill="#FFF" stroke="#D6455D" stroke-width="0.4">▲</text><text x="22" y="173" fill="#D6455D">■ …</text>
          <circle cx="2" cy="169" r="10" fill="none" stroke="#D6455D" stroke-width="1.8"/>
        </g>
        <text x="0" y="196" text-anchor="middle" font-size="8" font-weight="900" fill="#D6455D">염기 단 하나가 바뀜</text>
      </g>
      <path d="M164,116 H190" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1306-05)"/>
      <!-- 2 아미노산 -->
      <g transform="translate(240,0)">
        <text x="0" y="40" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">② 아미노산</text>
        <g fill="#147D6F"><circle cx="-24" cy="64" r="8"/><circle cx="0" cy="64" r="8"/><circle cx="24" cy="64" r="8"/></g>
        <text x="0" y="90" text-anchor="middle" font-size="8" font-weight="900" fill="#147D6F">… 글루탐산 …</text>
        <g fill="#D6455D"><circle cx="-24" cy="168" r="8"/><circle cx="24" cy="168" r="8"/></g><rect x="-8" y="160" width="16" height="16" fill="#D6455D"/>
        <text x="0" y="194" text-anchor="middle" font-size="8" font-weight="900" fill="#D6455D">… 발린 … (하나 바뀜)</text>
      </g>
      <path d="M294,116 H320" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1306-05)"/>
      <!-- 3 단백질 접힘 -->
      <g transform="translate(370,0)">
        <text x="0" y="40" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">③ 헤모글로빈</text>
        <path d="M-26,64 q10,-18 20,0 q10,18 20,0 q6,-10 12,-2" stroke="#147D6F" stroke-width="4" fill="none" stroke-linecap="round"/>
        <text x="0" y="90" text-anchor="middle" font-size="8" font-weight="900" fill="#147D6F">제 모양으로 접힘</text>
        <g stroke="#D6455D" stroke-width="4" stroke-linecap="round"><path d="M-30,164 h60 M-30,172 h60"/></g>
        <text x="0" y="194" text-anchor="middle" font-size="8" font-weight="900" fill="#D6455D">다르게 접혀 엉겨 붙음(막대)</text>
      </g>
      <path d="M424,116 H450" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1306-05)"/>
      <!-- 4 적혈구 -->
      <g transform="translate(520,0)">
        <text x="0" y="40" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">④ 적혈구 · 형질</text>
        <ellipse cx="0" cy="66" rx="24" ry="14" fill="#E0603A" stroke="#B0432A" stroke-width="1.4"/><ellipse cx="0" cy="66" rx="10" ry="5" fill="#F0A275"/>
        <text x="0" y="94" text-anchor="middle" font-size="8" font-weight="900" fill="#147D6F">둥글넓적 — 산소 운반</text>
        <path d="M-26,160 q14,-16 40,-2 q-10,4 -14,14 q-6,-14 -26,-12 z" fill="#E0603A" stroke="#B0432A" stroke-width="1.4"/>
        <text x="0" y="196" text-anchor="middle" font-size="8" font-weight="900" fill="#D6455D">낫 모양 — 혈관 막힘</text>
      </g>
      <!-- 모세혈관 막힘 -->
      <rect x="20" y="212" width="560" height="32" rx="6" fill="#FDFBF7" stroke="#F0C8BC"/>
      <g transform="translate(60,228)"><rect x="-30" y="-7" width="120" height="14" rx="7" fill="#F5D6CE" stroke="#D6455D" stroke-width="1"/><path d="M4,-6 q10,-8 22,0 q-6,3 -8,8 q-4,-8 -14,-2 z M34,-6 q10,-8 22,0 q-6,3 -8,8 q-4,-8 -14,-2 z" fill="#E0603A"/><text x="110" y="4" font-size="8.5" font-weight="900" fill="#D6455D">좁은 모세혈관을 막는다 → 빈혈·통증</text></g>
      <text x="470" y="232" text-anchor="middle" font-size="8.5" font-weight="900" fill="#2E3E96">유전자는 단백질을 통해 형질을 결정한다</text>
    </svg>