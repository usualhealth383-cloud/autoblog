        <rect x="-60" y="-26" width="120" height="52" rx="26" fill="url(#hex-1205-04)" stroke="#5B6B77" stroke-width="1.2"/>
        <ellipse cx="60" cy="0" rx="10" ry="26" fill="#FDFBF7" stroke="#5B6B77" stroke-width="1.2"/>
        <text x="-8" y="66" text-anchor="middle" font-size="14" font-weight="900" fill="#3A3A3A">탄소 나노 튜브</text>
        <text x="-8" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">지름 수 nm — 머리카락의 수만분의 1</text>
        <text x="-8" y="102" text-anchor="middle" font-size="13" font-weight="900" fill="#0F6357">가볍고 강함</text>
