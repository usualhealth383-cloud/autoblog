        <g transform="translate(40,20)"><g fill="#8A949E" stroke="#5B6B77" stroke-width="0.8"><rect x="-20" y="-16" width="40" height="6"/><rect x="-20" y="-8" width="40" height="6"/><rect x="-20" y="0" width="40" height="6"/><rect x="-20" y="8" width="40" height="6"/></g></g>
        <text y="66" text-anchor="middle" font-size="14" font-weight="900" fill="#3A3A3A">흑연 (연필심)</text>
        <text y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">탄소 층이 겹겹이</text>
