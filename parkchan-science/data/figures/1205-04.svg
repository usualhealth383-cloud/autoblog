          <path d="M12,0 L24,6.9 L24,20.8 L12,27.7 L0,20.8 L0,6.9 Z M12,27.7 L12,41.6 M24,20.8 L36,27.7 M0,20.8 L-12,27.7" fill="none" stroke="#3A3A3A" stroke-width="1.2"/>
