      <rect x="8" y="230" width="584" height="26" rx="6" fill="#E7F5F1" stroke="#C9E7DF" stroke-width="1"/>
      <text x="300" y="248" text-anchor="middle" font-size="13.5" font-weight="900" fill="#0F6357">흑연도, 그래핀도, 나노 튜브도, 다이아몬드도 모두 같은 탄소 — 재료가 아니라 배열이 성질을 만든다</text>
