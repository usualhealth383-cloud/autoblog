      <rect width="600" height="266" rx="10" fill="#FDFBF7"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#0F6357">흑연에서 한 층을 벗기면 그래핀, 그래핀을 말면 나노 튜브 — 전부 같은 탄소</text>
