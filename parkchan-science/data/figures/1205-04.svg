      <path d="M160,100 h30" stroke="#147D6F" stroke-width="2.4" marker-end="url(#arrB-1205-04)"/>
      <text x="175" y="88" text-anchor="middle" font-size="13" font-weight="900" fill="#147D6F">한 층</text>
      <!-- 그래핀 -->
      <g transform="translate(290,94)">
        <g transform="skewX(-14)"><rect x="-60" y="-40" width="120" height="80" fill="url(#hex-1205-04)" stroke="#5B6B77" stroke-width="1"/></g>
        <text x="-10" y="66" text-anchor="middle" font-size="14" font-weight="900" fill="#3A3A3A">그래핀</text>
        <text x="-10" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">벌집 육각형 · 원자 한 층</text>
        <text x="-10" y="102" text-anchor="middle" font-size="13" font-weight="900" fill="#0F6357">전기가 잘 통함 · 투명 · 강하고 유연</text>
      </g>
      <path d="M368,100 h30" stroke="#147D6F" stroke-width="2.4" marker-end="url(#arrB-1205-04)"/>
