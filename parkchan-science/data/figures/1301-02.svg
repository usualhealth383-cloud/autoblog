<svg width="600" height="274" viewBox="0 0 600 274" font-family="PC Sans">
      <defs>
        <linearGradient id="w2sky-1301-02" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1430"/><stop offset="0.35" stop-color="#3B5C8A"/><stop offset="1" stop-color="#CFE3F2"/></linearGradient>
        <linearGradient id="w2sea-1301-02" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC5E6"/><stop offset="1" stop-color="#2E6690"/></linearGradient>
      </defs>
      <rect width="600" height="274" rx="10" fill="#FDFBF7"/>
      <!-- 기권: 세로 단면 + 기온 곡선 -->
      <g transform="translate(8,8)">
        <rect width="364" height="240" rx="6" fill="url(#w2sky-1301-02)"/>
        <text x="182" y="18" text-anchor="middle" font-size="14" font-weight="900" fill="#FFF6D6">기권 — 높이에 따른 기온의 지그재그가 네 층을 가른다</text>
        <!-- 층 경계 -->
        <g stroke="#FFF6D6" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"><line x1="86" y1="70" x2="354" y2="70"/><line x1="86" y1="120" x2="354" y2="120"/><line x1="86" y1="175" x2="354" y2="175"/></g>
        <!-- 기온 곡선(아래→위): 대류권 ↓, 성층권 ↑, 중간권 ↓, 열권 ↑ (왼쪽=낮음) -->
        <path transform="translate(-20,0)" d="M205,222 L160,175 L194,120 L140,70 L224,26" fill="none" stroke="#F6D27A" stroke-width="3" stroke-linejoin="round"/>
        <text x="112" y="236" font-size="13" font-weight="800" fill="#16325A">낮음 ← 기온 → 높음</text>
        <!-- 층 이름·간판 -->
        <g font-size="13.5" font-weight="900" fill="#FFF6D6">
          <text x="206" y="44">열권 — 오로라</text>
          <text x="206" y="94">중간권 — 유성</text>
          <text x="206" y="147">성층권 — 오존층</text>
          <text x="206" y="199" fill="#16325A">대류권 — 기상 현상</text>
        </g>
        <g font-size="13" font-weight="700" fill="#C9D3DC">
          <text x="206" y="61">위로 갈수록 뜨거움</text><text x="206" y="111">다시 추워짐</text><text x="206" y="164">자외선 흡수로 따뜻</text><text x="206" y="216" fill="#16325A">위로 갈수록 추움 · 대류</text>
        </g>
        <!-- 오로라·유성·오존·구름 -->
        <g stroke="#7FD6C6" stroke-width="2" stroke-linecap="round" opacity="0.8"><path d="M20,40 q6,-8 12,0 t12,0 t12,0"/></g>
        <path d="M40,88 l18,12" stroke="#FFF6D6" stroke-width="2" stroke-linecap="round"/><circle cx="58" cy="100" r="2" fill="#FFF6D6"/>
        <rect x="16" y="140" width="66" height="8" rx="3" fill="#C9B8EA" opacity="0.8"/><text x="49" y="136" text-anchor="middle" font-size="13" font-weight="800" fill="#C9B8EA">O<tspan dy="0.3em" font-size="78%">3</tspan></text>
        <path d="M22,196 q8,-12 20,-4 q12,-6 16,6 q10,0 8,8 h-46 q-6,-2 2,-10 z" fill="#FFFFFF"/><g stroke="#8FC5E6" stroke-width="1.6" stroke-linecap="round"><line x1="30" y1="212" x2="28" y2="220"/><line x1="42" y1="212" x2="40" y2="220"/><line x1="54" y1="212" x2="52" y2="220"/></g>
        <text x="72" y="12" font-size="13"> </text>
      </g>
      <!-- 수권 -->
      <g transform="translate(380,8)">
        <rect width="212" height="240" rx="6" fill="#FFFFFF" stroke="#D9DFF5"/>
        <text x="106" y="18" text-anchor="middle" font-size="14" font-weight="900" fill="#2E3E96">수권 — 물은 어디에 있나</text>
        <!-- 큰 물통: 해수 97% -->
        <rect x="18" y="30" width="60" height="180" fill="#E9F2FB" stroke="#5B6B77" stroke-width="1"/>
        <rect x="18" y="35" width="60" height="175" fill="url(#w2sea-1301-02)"/>
        <rect x="18" y="30" width="60" height="5" fill="#CFE3F2"/>
        <text x="48" y="126" text-anchor="middle" font-size="14" font-weight="900" fill="#FFFFFF">해수</text>
        <text x="48" y="145" text-anchor="middle" font-size="13.5" font-weight="900" fill="#FFFFFF">약 97 %</text>
        <path d="M78,32 L110,60" stroke="#5B6B77" stroke-width="1" stroke-dasharray="3 2"/>
        <!-- 담수 확대 -->
        <rect x="110" y="60" width="88" height="150" fill="#FFFFFF" stroke="#5B6B77" stroke-width="1"/>
        <rect x="110" y="60" width="88" height="104" fill="#E9F2FB"/><text x="154" y="104" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E6690">빙하</text><text x="154" y="123" text-anchor="middle" font-size="13" font-weight="800" fill="#2E6690">담수의 대부분</text>
        <rect x="110" y="164" width="88" height="42" fill="#B98A5E"/><text x="154" y="190" text-anchor="middle" font-size="13" font-weight="900" fill="#FFFFFF">지하수</text>
        <rect x="110" y="206" width="88" height="4" fill="#4053B8"/><text x="206" y="228" text-anchor="end" font-size="13" font-weight="900" fill="#4053B8">강 · 호수 — 아주 조금</text>
        <text x="154" y="38" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">담수 약 3 %를<tspan x="154" dy="16">늘리면</tspan></text>
      </g>
      <text x="300" y="266" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">구분 기준은 기압이 아니라 기온 변화 · 날씨는 맨 아래층에서만 · 쓸 수 있는 물은 생각보다 훨씬 귀하다</text>
    </svg>