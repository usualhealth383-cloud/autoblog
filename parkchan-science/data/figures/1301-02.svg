<svg width="600" height="262" viewBox="0 0 600 262" font-family="PC Sans">
      <defs>
        <linearGradient id="w2sky-1301-02" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1430"/><stop offset="0.35" stop-color="#3B5C8A"/><stop offset="1" stop-color="#CFE3F2"/></linearGradient>
        <linearGradient id="w2sea-1301-02" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC5E6"/><stop offset="1" stop-color="#2E6690"/></linearGradient>
      </defs>
      <rect width="600" height="262" rx="10" fill="#FDFBF7"/>
      <!-- 기권: 세로 단면 + 기온 곡선 -->
      <g transform="translate(20,16)">
        <rect width="340" height="230" rx="6" fill="url(#w2sky-1301-02)"/>
        <text x="170" y="16" text-anchor="middle" font-size="10.5" font-weight="900" fill="#FFF6D6">기권 — 높이에 따른 기온의 지그재그가 네 층을 가른다</text>
        <!-- 층 경계 -->
        <g stroke="#FFF6D6" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"><line x1="90" y1="70" x2="330" y2="70"/><line x1="90" y1="120" x2="330" y2="120"/><line x1="90" y1="175" x2="330" y2="175"/></g>
        <!-- 기온 곡선: 열권 ↑, 중간권 ↓, 성층권 ↑, 대류권 ↓ (왼쪽=낮음) -->
        <path d="M150,222 L200,175 L150,120 L215,70 L150,26" fill="none" stroke="#F6D27A" stroke-width="3" stroke-linejoin="round"/>
        <text x="132" y="228" font-size="8.5" font-weight="800" fill="#FFF6D6">낮음 ← 기온 → 높음</text>
        <!-- 층 이름·간판 -->
        <g font-size="9.5" font-weight="900" fill="#FFF6D6">
          <text x="236" y="48">열권 — 오로라</text>
          <text x="236" y="100">중간권 — 유성</text>
          <text x="236" y="152">성층권 — 오존층</text>
          <text x="236" y="205">대류권 — 기상 현상</text>
        </g>
        <g font-size="8" font-weight="700" fill="#C9D3DC">
          <text x="236" y="60">위로 갈수록 뜨거움</text><text x="236" y="112">다시 추워짐</text><text x="236" y="164">자외선 흡수로 따뜻</text><text x="236" y="217">위로 갈수록 추움 · 대류</text>
        </g>
        <!-- 오로라·유성·오존·구름 -->
        <g stroke="#7FD6C6" stroke-width="2" stroke-linecap="round" opacity="0.8"><path d="M20,40 q6,-8 12,0 t12,0 t12,0"/></g>
        <path d="M40,88 l18,12" stroke="#FFF6D6" stroke-width="2" stroke-linecap="round"/><circle cx="58" cy="100" r="2" fill="#FFF6D6"/>
        <rect x="16" y="140" width="66" height="8" rx="3" fill="#C9B8EA" opacity="0.8"/><text x="49" y="136" text-anchor="middle" font-size="7.5" font-weight="800" fill="#C9B8EA">O<tspan dy="0.3em" font-size="70%">3</tspan></text>
        <path d="M22,196 q8,-12 20,-4 q12,-6 16,6 q10,0 8,8 h-46 q-6,-2 2,-10 z" fill="#FFFFFF"/><g stroke="#8FC5E6" stroke-width="1.6" stroke-linecap="round"><line x1="30" y1="212" x2="28" y2="220"/><line x1="42" y1="212" x2="40" y2="220"/><line x1="54" y1="212" x2="52" y2="220"/></g>
        <text x="72" y="12" font-size="0"> </text>
      </g>
      <!-- 수권 -->
      <g transform="translate(376,16)">
        <rect width="208" height="230" rx="6" fill="#FFFFFF" stroke="#D9DFF5"/>
        <text x="104" y="16" text-anchor="middle" font-size="10.5" font-weight="900" fill="#2E3E96">수권 — 물은 어디에 있나</text>
        <!-- 큰 물통: 해수 97% -->
        <rect x="24" y="30" width="60" height="180" fill="#E9F2FB" stroke="#5B6B77" stroke-width="1"/>
        <rect x="24" y="35" width="60" height="175" fill="url(#w2sea-1301-02)"/>
        <rect x="24" y="30" width="60" height="5" fill="#CFE3F2"/>
        <text x="54" y="128" text-anchor="middle" font-size="11" font-weight="900" fill="#FFFFFF">해수</text>
        <text x="54" y="144" text-anchor="middle" font-size="10" font-weight="900" fill="#FFFFFF">약 97 %</text>
        <path d="M84,32 L110,60" stroke="#5B6B77" stroke-width="1" stroke-dasharray="3 2"/>
        <!-- 담수 확대 -->
        <rect x="110" y="60" width="70" height="150" fill="#FFFFFF" stroke="#5B6B77" stroke-width="1"/>
        <rect x="110" y="60" width="70" height="104" fill="#E9F2FB"/><text x="145" y="112" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E6690">빙하</text><text x="145" y="126" text-anchor="middle" font-size="8" font-weight="800" fill="#2E6690">담수의 대부분</text>
        <rect x="110" y="164" width="70" height="42" fill="#B98A5E"/><text x="145" y="189" text-anchor="middle" font-size="9" font-weight="900" fill="#FFFFFF">지하수</text>
        <rect x="110" y="206" width="70" height="4" fill="#4053B8"/><text x="145" y="220" text-anchor="middle" font-size="8" font-weight="900" fill="#4053B8">강 · 호수 — 아주 조금</text>
        <text x="145" y="52" text-anchor="middle" font-size="8.5" font-weight="900" fill="#3A3A3A">담수 약 3 %를 늘리면</text>
      </g>
      <text x="300" y="258" text-anchor="middle" font-size="9" font-weight="900" fill="#2E3E96">구분 기준은 기압이 아니라 기온 변화 · 날씨는 맨 아래층에서만 · 쓸 수 있는 물은 생각보다 훨씬 귀하다</text>
    </svg>