<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrY-1305-05" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D9930D"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#FDFBF7" stroke="#D9DFF5"/>
      <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#2E3E96">수천 년 된 발효와 오늘의 실험이 같은 원리 — 효소가 분해한다, 그리고 효소는 열에 약하다</text>
      <!-- 왼쪽: 식탁 -->
      <g transform="translate(10,32)">
        <rect width="300" height="216" rx="8" fill="#F3F7F1" stroke="#CFE0C8"/>
        <text x="150" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#147D6F">식탁 — 미생물과 과일의 효소를 빌린다</text>
        <rect x="10" y="176" width="280" height="10" rx="3" fill="#C98A10"/>
        <!-- 김치 항아리 -->
        <path d="M30,176 q-14,-60 20,-90 h30 q34,30 20,90 z" fill="#8A4B00" stroke="#5B3A10" stroke-width="1.4"/>
        <rect x="42" y="80" width="46" height="8" rx="2" fill="#5B3A10"/>
        <text x="65" y="136" text-anchor="middle" font-size="8.5" font-weight="900" fill="#FFF3D6">김치</text>
        <text x="65" y="200" text-anchor="middle" font-size="8" font-weight="900" fill="#3A3A3A">젖산균 발효 → 신맛</text>
        <!-- 빵 반죽 -->
        <rect x="120" y="150" width="70" height="26" rx="4" fill="#C9D3DC"/>
        <path d="M124,150 q31,-44 62,0 z" fill="#F6D27A" stroke="#D9930D" stroke-width="1.4"/>
        <g fill="none" stroke="#D9930D" stroke-width="1.2"><circle cx="145" cy="134" r="4"/><circle cx="160" cy="126" r="4"/><circle cx="170" cy="140" r="4"/></g>
        <path d="M155,110 V96" stroke="#D9930D" stroke-width="2.4" fill="none" marker-end="url(#arrY-1305-05)"/>
        <text x="155" y="90" text-anchor="middle" font-size="8" font-weight="900" fill="#8A4B00">부푼다</text>
        <text x="155" y="200" text-anchor="middle" font-size="8" font-weight="900" fill="#3A3A3A">효모 → 이산화 탄소</text>
        <!-- 파인애플 + 고기 -->
        <rect x="216" y="146" width="64" height="30" rx="4" fill="#E0603A" stroke="#B0432A" stroke-width="1.2"/>
        <ellipse cx="236" cy="124" rx="16" ry="20" fill="#F6D27A" stroke="#D9930D" stroke-width="1.4"/>
        <path d="M228,106 l8,-14 l8,14" stroke="#7FA86B" stroke-width="2.4" fill="none"/>
        <text x="266" y="130" text-anchor="middle" font-size="8" font-weight="900" fill="#3A3A3A">고기</text>
        <text x="248" y="200" text-anchor="middle" font-size="8" font-weight="900" fill="#3A3A3A">단백질 분해 → 연해짐</text>
        <text x="150" y="212" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5B6B77">소화제·효소 세제·혈당 측정기도 같은 원리</text>
      </g>
      <!-- 오른쪽: 카탈레이스 실험 -->
      <g transform="translate(320,32)">
        <rect width="270" height="216" rx="8" fill="#EEF2FB" stroke="#D9DFF5"/>
        <text x="135" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">감자 실험 — 묽은 과산화수소수 세 시험관</text>
        <rect x="10" y="176" width="250" height="10" rx="3" fill="#5B6B77"/>
        <!-- (가) 생감자 -->
        <g transform="translate(50,0)">
          <path d="M-18,44 v120 q0,12 18,12 q18,0 18,-12 v-120" fill="#DDEBF7" stroke="#5B6B77" stroke-width="1.4"/>
          <rect x="-18" y="100" width="36" height="66" fill="#BFD8EE"/>
          <ellipse cx="0" cy="150" rx="12" ry="8" fill="#C98A10"/>
          <g fill="none" stroke="#2E3E96" stroke-width="1.2"><circle cx="-8" cy="120" r="4"/><circle cx="6" cy="108" r="4"/><circle cx="8" cy="130" r="4"/><circle cx="-6" cy="90" r="4"/><circle cx="4" cy="76" r="4"/><circle cx="-8" cy="62" r="3"/><circle cx="6" cy="52" r="3"/></g>
          <text x="0" y="36" text-anchor="middle" font-size="8.5" font-weight="900" fill="#2E3E96">(가) 생감자</text>
          <text x="0" y="200" text-anchor="middle" font-size="8" font-weight="900" fill="#2E3E96">거품 활발</text>
        </g>
        <g transform="translate(135,0)">
          <path d="M-18,44 v120 q0,12 18,12 q18,0 18,-12 v-120" fill="#DDEBF7" stroke="#5B6B77" stroke-width="1.4"/>
          <rect x="-18" y="100" width="36" height="66" fill="#BFD8EE"/>
          <ellipse cx="0" cy="150" rx="12" ry="8" fill="#E0B878"/>
          <text x="0" y="36" text-anchor="middle" font-size="8.5" font-weight="900" fill="#D6455D">(나) 삶은 감자</text>
          <text x="0" y="200" text-anchor="middle" font-size="8" font-weight="900" fill="#D6455D">거품 거의 없음</text>
        </g>
        <g transform="translate(220,0)">
          <path d="M-18,44 v120 q0,12 18,12 q18,0 18,-12 v-120" fill="#DDEBF7" stroke="#5B6B77" stroke-width="1.4"/>
          <rect x="-18" y="100" width="36" height="66" fill="#BFD8EE"/>
          <text x="0" y="36" text-anchor="middle" font-size="8.5" font-weight="900" fill="#5B6B77">(다) 없음</text>
          <text x="0" y="200" text-anchor="middle" font-size="8" font-weight="900" fill="#5B6B77">거의 없음(대조군)</text>
        </g>
        <text x="135" y="212" text-anchor="middle" font-size="7.5" font-weight="800" fill="#3A3A3A">거품 = 산소. 삶으면 효소(단백질)가 변성돼 기능을 잃는다</text>
      </g>
    </svg>