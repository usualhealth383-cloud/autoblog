<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrB-1302-01" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#4053B8"/></marker><marker id="axP-1302-01" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <defs>
        <linearGradient id="x1mantle-1302-01" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0603A"/><stop offset="1" stop-color="#8A3E14"/></linearGradient>
        <linearGradient id="x1sea-1302-01" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC5E6"/><stop offset="1" stop-color="#2E6690"/></linearGradient>
      </defs>
      <rect width="600" height="256" rx="10" fill="#D6ECF8"/>
      <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#2E3E96">뗏목(판)과 물살(맨틀 대류) — 지구 내부 에너지가 맨틀을 돌리고, 맨틀이 판을 나른다</text>
      <!-- 바다 -->
      <rect x="0" y="60" width="600" height="40" fill="url(#x1sea-1302-01)"/>
      <!-- 맨틀 (연약권) -->
      <rect x="0" y="120" width="600" height="136" fill="url(#x1mantle-1302-01)"/>
      <!-- 대류 화살 (두 셀) -->
      <g fill="none" stroke="#FFF6D6" stroke-width="2.6" stroke-linecap="round">
        <path d="M150,236 C110,220 90,180 120,150" marker-end="url(#axP-1302-01)"/><path d="M130,146 C170,136 220,136 260,148" marker-end="url(#axP-1302-01)"/><path d="M270,156 C300,190 280,220 250,236"/>
        <path d="M450,236 C490,220 510,180 480,150" marker-end="url(#axP-1302-01)"/><path d="M470,146 C430,136 380,136 340,148" marker-end="url(#axP-1302-01)"/><path d="M330,156 C300,190 320,220 350,236"/>
      </g>
      <text x="300" y="232" text-anchor="middle" font-size="9.5" font-weight="900" fill="#FFF6D6">맨틀 대류 — 1년에 수 cm · 손톱 자라는 속도</text>
      <text x="300" y="248" text-anchor="middle" font-size="9" font-weight="800" fill="#F3E4D0">동력 = 지구 내부 에너지(방사성 원소의 붕괴열 + 지구 탄생 때 남은 열)</text>
      <!-- 연약권 라벨 -->
      <text x="20" y="140" font-size="9.5" font-weight="900" fill="#FFF6D6">연약권 — 물렁해 흐른다</text>
      <!-- 판 (뗏목) — 대륙판 두껍고 가벼움, 해양판 얇고 무거움 -->
      <g>
        <path d="M0,100 L0,72 L60,56 L200,52 L260,100 Z" fill="#B98A5E" stroke="#5A4A42" stroke-width="1.6"/>
        <path d="M40,56 q40,-10 80,0 q40,10 60,-2" fill="#7FA86B"/>
        <text x="110" y="86" text-anchor="middle" font-size="9.5" font-weight="900" fill="#FFF6D6">대륙판 — 두껍고 가볍다</text>
        <path d="M300,100 L300,90 L600,90 L600,100 Z" fill="#5B6B77" stroke="#3A3A3A" stroke-width="1.4"/>
        <path d="M300,120 L300,100 L600,100 L600,120 Z" fill="#8A949E" stroke="#3A3A3A" stroke-width="1"/>
        <text x="450" y="114" text-anchor="middle" font-size="9.5" font-weight="900" fill="#FFF6D6">해양판 — 얇고 무겁다</text>
      </g>
      <!-- 암석권 표시 -->
      <path d="M260,100 L300,100" stroke="#3A3A3A" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="280" y="132" text-anchor="middle" font-size="8.5" font-weight="800" fill="#FFF6D6">판 = 암석권 = 지각 + 맨틀 최상부</text>
      <!-- 판 이동 화살 -->
      <g stroke="#2E3E96" stroke-width="2.4" fill="none"><path d="M110,44 h-40" marker-end="url(#arrB-1302-01)"/><path d="M460,82 h40" marker-end="url(#arrB-1302-01)"/></g>
      <text x="130" y="40" font-size="8.5" font-weight="900" fill="#2E3E96">판이 실려 간다</text>
      <text x="420" y="76" text-anchor="end" font-size="8.5" font-weight="900" fill="#2E3E96">판이 실려 간다</text>
    </svg>