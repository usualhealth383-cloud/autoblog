<svg width="600" height="250" viewBox="0 0 600 250" font-family="PC Sans">
      <defs>
        <linearGradient id="k1wall-1103-01" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F1EA"/><stop offset="1" stop-color="#E6E2D6"/></linearGradient>
      </defs>
      <rect width="600" height="250" rx="10" fill="url(#k1wall-1103-01)"/>
      <text x="20" y="20" font-size="12.5" font-weight="900" fill="#B4560E">같은 막대, 같은 자, 세 사람 — 값이 조금씩 다르다</text>
