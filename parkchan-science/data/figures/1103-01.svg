        <!-- 막대 -->
        <rect x="0" y="-16" width="150" height="12" rx="2" fill="#5B6B77"/>
        <text x="75" y="-20" text-anchor="middle" font-size="10" font-weight="800" fill="#3A3A3A">참값 25.0 cm 언저리 — 끝이 눈금 사이에 걸린다</text>
        <circle cx="150" cy="-10" r="14" fill="none" stroke="#D6455D" stroke-width="1.6" stroke-dasharray="3 2"/>
