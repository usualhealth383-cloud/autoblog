      <rect x="0" y="176" width="600" height="14" fill="#B98A5E"/><rect x="0" y="190" width="600" height="60" fill="#D9CBB6"/>
      <!-- 자 -->
      <g transform="translate(60,150)">
        <rect width="300" height="22" fill="#F3C24E" stroke="#8A5F38" stroke-width="1"/>
        <g stroke="#8A5F38" stroke-width="1">
          <line x1="0" y1="0" x2="0" y2="10"/><line x1="30" y1="0" x2="30" y2="6"/><line x1="60" y1="0" x2="60" y2="10"/><line x1="90" y1="0" x2="90" y2="6"/><line x1="120" y1="0" x2="120" y2="10"/><line x1="150" y1="0" x2="150" y2="6"/><line x1="180" y1="0" x2="180" y2="10"/><line x1="210" y1="0" x2="210" y2="6"/><line x1="240" y1="0" x2="240" y2="10"/><line x1="270" y1="0" x2="270" y2="6"/><line x1="300" y1="0" x2="300" y2="10"/>
