        <g transform="translate(440,70)" stroke="#C1521E"><circle cy="-22" r="5" fill="#C1521E" stroke="none"/><path d="M0,-17 v14 M0,-3 l-5,10 M0,-3 l5,10 M0,-14 l-7,5 M0,-14 l7,5"/></g>
      </g>
      <g stroke-width="1.2" stroke-dasharray="4 3" fill="none">
        <line x1="152" y1="56" x2="208" y2="136" stroke="#2E6690"/>
