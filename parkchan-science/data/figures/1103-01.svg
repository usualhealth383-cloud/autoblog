      <text x="150" y="118" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5B6B77">비스듬히 읽음</text>
      <text x="440" y="118" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5B6B77">눈금 사이를 어림</text>
