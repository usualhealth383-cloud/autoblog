      <rect x="400" y="196" width="184" height="46" rx="6" fill="#FDFBF7" stroke="#EBC4AB" stroke-width="1"/>
      <text x="492" y="214" text-anchor="middle" font-size="11" font-weight="900" fill="#C1521E">세 번 재서 평균 → 25.0 cm</text>
      <text x="492" y="232" text-anchor="middle" font-size="10" font-weight="700" fill="#3A3A3A">오차는 0이 안 되지만 반복·평균으로 줄인다</text>
      <rect x="16" y="196" width="220" height="46" rx="6" fill="#FDFBF7" stroke="#EBC4AB" stroke-width="1"/>
      <text x="126" y="214" text-anchor="middle" font-size="11" font-weight="900" fill="#C1521E">오차 = 참값 − 측정값</text>
      <text x="126" y="232" text-anchor="middle" font-size="10" font-weight="700" fill="#3A3A3A">읽는 각도 · 눈금의 한계 · 온도 변화</text>
    </svg>