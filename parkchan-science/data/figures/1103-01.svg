        <rect x="112" y="84" width="76" height="20" rx="5" fill="#FFFFFF" stroke="#2E6690"/><text x="150" y="98" fill="#2E6690">24.8 cm</text>
        <rect x="262" y="72" width="76" height="20" rx="5" fill="#FFFFFF" stroke="#5E7D57"/><text x="300" y="86" fill="#5E7D57">25.0 cm</text>
        <rect x="402" y="84" width="76" height="20" rx="5" fill="#FFFFFF" stroke="#C1521E"/><text x="440" y="98" fill="#C1521E">25.1 cm</text>
