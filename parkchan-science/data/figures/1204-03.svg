        <path d="M20,60 C40,30 70,30 80,60 C90,90 60,100 50,80 C40,60 20,90 30,110 C40,130 80,120 88,100" fill="none" stroke="#147D6F" stroke-width="4" stroke-linecap="round"/>
        <g fill="#F6D27A"><circle cx="20" cy="60" r="4"/><circle cx="80" cy="60" r="4"/><circle cx="50" cy="80" r="4"/><circle cx="30" cy="110" r="4"/><circle cx="88" cy="100" r="4"/></g>
        <text x="54" y="136" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3A3A3A">고유한 입체 구조</text>
