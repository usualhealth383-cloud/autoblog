        <g transform="translate(44,108)"><circle r="14" fill="#D6455D"/><circle r="5" fill="#FFFFFF" opacity="0.6"/></g>
        <text x="44" y="136" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3A3A3A">헤모글로빈 — 산소 운반</text>
      </g>
      <rect x="20" y="204" width="570" height="40" rx="6" fill="#E7F5F1" stroke="#C9E7DF" stroke-width="1"/>
      <text x="305" y="221" text-anchor="middle" font-size="10.5" font-weight="900" fill="#0F6357">CAT과 ACT가 다른 단어이듯, 순서가 바뀌면 다른 모양으로 접히고 다른 일을 하는 단백질이 된다</text>
      <text x="305" y="237" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3A3A3A">달걀을 익히면 굳는다 — 열로 입체 구조가 풀리면 성질도 변한다</text>
    </svg>