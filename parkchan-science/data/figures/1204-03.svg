        <text x="48" y="76" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">효소<tspan x="48" dy="17" font-weight="700">반응 돕기</tspan></text>
        <g transform="translate(48,120)"><circle r="14" fill="#D6455D"/><circle r="5" fill="#FFFFFF" opacity="0.6"/></g>
        <text x="48" y="149" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">헤모글로빈<tspan x="48" dy="17" font-weight="700">산소 운반</tspan></text>
      </g>
      <rect x="8" y="205" width="584" height="48" rx="6" fill="#E7F5F1" stroke="#C9E7DF" stroke-width="1"/>
      <text x="300" y="223" text-anchor="middle" font-size="13.5" font-weight="900" fill="#0F6357">CAT과 ACT가 다른 단어이듯, 순서가 바뀌면 다른 모양으로 접히고 다른 일을 하는 단백질이 된다</text>
      <text x="300" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">달걀을 익히면 굳는다 — 열로 입체 구조가 풀리면 성질도 변한다</text>
    </svg>