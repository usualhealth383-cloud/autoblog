<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrB-1204-03" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#147D6F"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#FDFBF7"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#0F6357">아미노산 20종 → 순서대로 잇기 → 접히기 → 일하기 — 순서가 바뀌면 다른 단백질</text>
