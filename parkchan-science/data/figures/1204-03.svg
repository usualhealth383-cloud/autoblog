        <g stroke="#5B6B77" stroke-width="2"><line x1="20" y1="60" x2="130" y2="60"/><line x1="20" y1="110" x2="130" y2="110"/></g>
        <g font-size="7.5" font-weight="900" fill="#3A3A3A" text-anchor="middle">
          <circle cx="24" cy="60" r="9" fill="#F6D27A"/><text x="24" y="63">A</text><circle cx="48" cy="60" r="9" fill="#7FD6C6"/><text x="48" y="63">B</text><circle cx="72" cy="60" r="9" fill="#E9A0AC"/><text x="72" y="63">C</text><circle cx="96" cy="60" r="9" fill="#9CC27E"/><text x="96" y="63">E</text><circle cx="120" cy="60" r="9" fill="#C9B8EA"/><text x="120" y="63">D</text>
          <circle cx="24" cy="110" r="9" fill="#7FD6C6"/><text x="24" y="113">B</text><circle cx="48" cy="110" r="9" fill="#F6D27A"/><text x="48" y="113">A</text><circle cx="72" cy="110" r="9" fill="#E9A0AC"/><text x="72" y="113">C</text><circle cx="96" cy="110" r="9" fill="#9CC27E"/><text x="96" y="113">E</text><circle cx="120" cy="110" r="9" fill="#C9B8EA"/><text x="120" y="113">D</text>
        </g>
        <text x="75" y="84" text-anchor="middle" font-size="8.5" font-weight="800" fill="#0F6357">A-B-C-E-D …</text>
        <text x="75" y="134" text-anchor="middle" font-size="8.5" font-weight="800" fill="#D6455D">B-A-C-E-D … 다른 단백질</text>
        <text x="75" y="146" text-anchor="middle" font-size="8" font-weight="700" fill="#5B6B77">펩타이드 결합으로 사슬</text>
