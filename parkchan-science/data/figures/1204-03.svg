        <text x="44" y="16" text-anchor="middle" font-size="10" font-weight="900" fill="#0F6357">④ 일한다</text>
        <g transform="translate(44,54)"><path d="M-18,-6 q18,-16 36,0 q-18,16 -36,0 z" fill="#7FD6C6" stroke="#0F6357" stroke-width="1"/><rect x="-8" y="-4" width="16" height="8" fill="#F6D27A" stroke="#B4830A" stroke-width="0.8"/></g>
