          <circle cx="21" cy="72" r="11" fill="#9CC27E"/><text x="21" y="76.6">E</text><circle cx="47" cy="72" r="11" fill="#8FC5E6"/><text x="47" y="76.6">F</text><circle cx="73" cy="72" r="11" fill="#F0A275"/><text x="73" y="76.6">G</text><circle cx="99" cy="72" r="11" fill="#D9CBB6"/><text x="99" y="76.6">H</text>
          <circle cx="21" cy="98" r="11" fill="#C9D3DC"/><text x="21" y="102.6">I</text><circle cx="47" cy="98" r="11" fill="#F6D27A"/><text x="47" y="102.6">K</text><circle cx="73" cy="98" r="11" fill="#7FD6C6"/><text x="73" y="102.6">L</text><circle cx="99" cy="98" r="11" fill="#E9A0AC"/><text x="99" y="102.6">M</text>
        </g>
        <text x="60" y="134" text-anchor="middle" font-size="13" font-weight="800" fill="#5B6B77">… 20자 알파벳</text>
        <text x="60" y="154" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">재료는 이것뿐</text>
