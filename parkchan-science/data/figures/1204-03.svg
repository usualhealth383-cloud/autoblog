        <g font-size="13" font-weight="900" fill="#3A3A3A" text-anchor="middle">
          <circle cx="26" cy="50" r="11" fill="#F6D27A"/><text x="26" y="54.6">A</text><circle cx="52" cy="50" r="11" fill="#7FD6C6"/><text x="52" y="54.6">B</text><circle cx="78" cy="50" r="11" fill="#E9A0AC"/><text x="78" y="54.6">C</text><circle cx="104" cy="50" r="11" fill="#9CC27E"/><text x="104" y="54.6">E</text><circle cx="130" cy="50" r="11" fill="#C9B8EA"/><text x="130" y="54.6">D</text>
          <circle cx="26" cy="104" r="11" fill="#7FD6C6"/><text x="26" y="108.6">B</text><circle cx="52" cy="104" r="11" fill="#F6D27A"/><text x="52" y="108.6">A</text><circle cx="78" cy="104" r="11" fill="#E9A0AC"/><text x="78" y="108.6">C</text><circle cx="104" cy="104" r="11" fill="#9CC27E"/><text x="104" y="108.6">E</text><circle cx="130" cy="104" r="11" fill="#C9B8EA"/><text x="130" y="108.6">D</text>
        </g>
        <text x="78" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#0F6357">A-B-C-E-D …</text>
