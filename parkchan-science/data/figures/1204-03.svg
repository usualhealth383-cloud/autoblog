          <circle cx="24" cy="70" r="9" fill="#9CC27E"/><text x="24" y="73">E</text><circle cx="48" cy="70" r="9" fill="#8FC5E6"/><text x="48" y="73">F</text><circle cx="72" cy="70" r="9" fill="#F0A275"/><text x="72" y="73">G</text><circle cx="96" cy="70" r="9" fill="#D9CBB6"/><text x="96" y="73">H</text>
          <circle cx="24" cy="96" r="9" fill="#C9D3DC"/><text x="24" y="99">I</text><circle cx="48" cy="96" r="9" fill="#F6D27A"/><text x="48" y="99">K</text><circle cx="72" cy="96" r="9" fill="#7FD6C6"/><text x="72" y="99">L</text><circle cx="96" cy="96" r="9" fill="#E9A0AC"/><text x="96" y="99">M</text>
        </g>
        <text x="64" y="126" text-anchor="middle" font-size="9" font-weight="800" fill="#5B6B77">… 20자 알파벳</text>
        <text x="64" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5B6B77">재료는 이것뿐</text>
      </g>
      <path d="M154,114 h20" stroke="#147D6F" stroke-width="2.4" marker-end="url(#arrB-1204-03)"/>
