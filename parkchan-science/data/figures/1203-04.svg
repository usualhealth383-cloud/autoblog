<svg width="600" height="250" viewBox="0 0 600 250" font-family="PC Sans"><defs><marker id="arrB-1203-04" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#147D6F"/></marker><marker id="axP-1203-04" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="250" rx="10" fill="#FDFBF7"/>
