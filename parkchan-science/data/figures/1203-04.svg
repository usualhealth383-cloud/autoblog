      <text x="300" y="224" text-anchor="middle" font-size="13" font-weight="900" fill="#0F6357">이온 결합 = 금속 + 비금속 · 전자의 소유권이 넘어간다("주고받기")</text>
      <text x="300" y="241" text-anchor="middle" font-size="13" font-weight="900" fill="#0F6357">몸속 Na<tspan dy="-0.45em" font-size="78%">+</tspan><tspan dy="0.45em">은 체액 균형과 신경 신호에 쓰인다</tspan></text>
