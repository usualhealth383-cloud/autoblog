<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans">
      <defs>
        <linearGradient id="h5sky-1102-05" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6ECF8"/><stop offset="1" stop-color="#F3F8FB"/></linearGradient>
      </defs>
      <rect width="600" height="256" rx="10" fill="url(#h5sky-1102-05)"/>
      <rect x="0" y="196" width="600" height="60" fill="#8A949E"/><path d="M0,226 h600" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 10"/>
      <text x="300" y="20" text-anchor="middle" font-size="12.5" font-weight="900" fill="#B4560E">하루 동안 만나는 단위들 — 뿌리는 전부 SI다</text>
      <!-- 표지판 km/h -->
      <g transform="translate(60,150)"><rect x="-3" y="0" width="6" height="46" fill="#5B6B77"/><circle r="26" fill="#FFFFFF" stroke="#D6455D" stroke-width="5"/><text y="-1" text-anchor="middle" font-size="15" font-weight="900" fill="#2B2B2B">50</text><text y="13" text-anchor="middle" font-size="8.5" font-weight="800" fill="#2B2B2B">km/h</text></g>
      <text x="60" y="246" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">속도위반의 기준</text>
      <!-- 처방전 mg -->
      <g transform="translate(160,140)"><rect x="-26" y="-34" width="52" height="66" rx="3" fill="#FFFFFF" stroke="#5B6B77" stroke-width="1.2"/><rect x="-26" y="-34" width="52" height="12" fill="#C1521E"/><text y="-25" text-anchor="middle" font-size="8" font-weight="900" fill="#FFFFFF">처방전</text><g stroke="#8A949E" stroke-width="1"><path d="M-18,-10 h36 M-18,0 h36 M-18,10 h22"/></g><text y="26" text-anchor="middle" font-size="11" font-weight="900" fill="#C1521E">250 mg</text></g>
      <text x="160" y="246" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">약효와 부작용의 경계</text>
      <!-- 과자 봉지 kcal -->
      <g transform="translate(258,146)"><path d="M-24,-36 h48 l4,8 v56 l-4,8 h-48 l-4,-8 v-56 z" fill="#F3C24E" stroke="#B4830A" stroke-width="1.2"/><rect x="-18" y="-6" width="36" height="26" rx="3" fill="#FFFFFF"/><text y="6" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">30 g</text><text y="17" text-anchor="middle" font-size="9" font-weight="900" fill="#C1521E">150 kcal</text></g>
      <text x="258" y="246" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">영양 관리의 잣대</text>
      <!-- 혈압계 mmHg -->
      <g transform="translate(356,146)"><rect x="-30" y="-30" width="60" height="50" rx="6" fill="#FFFFFF" stroke="#5B6B77" stroke-width="1.4"/><rect x="-24" y="-24" width="48" height="26" rx="3" fill="#1D2A4A"/><text y="-9" text-anchor="middle" font-size="11" font-weight="900" fill="#7FD6C6">120 / 80</text><text y="14" text-anchor="middle" font-size="9" font-weight="800" fill="#3A3A3A">mmHg</text><path d="M30,-6 q18,0 18,14 q0,14 -14,14" stroke="#5B6B77" stroke-width="2" fill="none"/></g>
      <text x="356" y="246" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">병원의 판정 기준</text>
      <!-- 일기예보 ℃·mm -->
      <g transform="translate(454,140)"><circle cx="-14" cy="-20" r="11" fill="#F3C24E"/><path d="M-6,-6 q10,-14 24,-4 q14,-4 16,10 q-2,10 -14,10 h-30 q-12,0 -12,-10 q0,-8 10,-8 z" fill="#FFFFFF" stroke="#8A949E" stroke-width="1.2"/><g stroke="#2E6690" stroke-width="2" stroke-linecap="round"><line x1="-6" y1="16" x2="-9" y2="24"/><line x1="4" y1="16" x2="1" y2="24"/><line x1="14" y1="16" x2="11" y2="24"/></g><text x="4" y="40" text-anchor="middle" font-size="10.5" font-weight="900" fill="#3A3A3A">24 ℃ · 30 mm</text></g>
      <text x="454" y="246" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">기온과 강수량</text>
      <!-- 전기 고지서 kWh -->
      <g transform="translate(548,140)"><rect x="-26" y="-34" width="52" height="66" rx="3" fill="#FFFFFF" stroke="#5B6B77" stroke-width="1.2"/><text y="-20" text-anchor="middle" font-size="8" font-weight="900" fill="#3A3A3A">전기 요금</text><path d="M-4,-12 l-8,14 h8 l-4,14 l12,-18 h-8 z" fill="#F3C24E" stroke="#B4830A" stroke-width="0.8"/><text y="26" text-anchor="middle" font-size="10.5" font-weight="900" fill="#C1521E">320 kWh</text></g>
      <text x="548" y="246" text-anchor="middle" font-size="10" font-weight="800" fill="#FFFFFF">쓴 에너지의 양</text>
      <!-- SI 뿌리 화살 -->
      <g font-size="10" font-weight="800">
        <rect x="16" y="36" width="568" height="52" rx="6" fill="#FDFBF7" stroke="#EBC4AB" stroke-width="1"/>
        <text x="300" y="54" text-anchor="middle" font-size="11" font-weight="900" fill="#C1521E">생활 단위도 SI로 통한다 — 편리해서 남아 있지만 최종 기준은 언제나 SI다</text>
        <text x="122" y="76" text-anchor="middle" fill="#3A3A3A">℃ = SI 유도단위(T = t + 273.15)</text>
        <text x="284" y="76" text-anchor="middle" fill="#3A3A3A">kcal(비SI) → J</text>
        <text x="412" y="76" text-anchor="middle" fill="#3A3A3A">kWh = kW × h → J</text>
        <text x="530" y="76" text-anchor="middle" fill="#3A3A3A">km/h → m/s</text>
      </g>
    </svg>