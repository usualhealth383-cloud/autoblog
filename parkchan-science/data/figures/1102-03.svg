<svg width="600" height="266" viewBox="0 0 600 266" font-family="PC Sans"><defs><marker id="arrB-1102-03" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#C1521E"/></marker><marker id="arrP-1102-03" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#C1521E"/></marker></defs>
      <defs>
        <linearGradient id="h3bg-1102-03" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBEFE7"/><stop offset="1" stop-color="#FDFBF7"/></linearGradient>
        <linearGradient id="h3water-1102-03" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9D6EE"/><stop offset="1" stop-color="#5FA3CF"/></linearGradient>
      </defs>
      <rect width="600" height="266" rx="10" fill="url(#h3bg-1102-03)"/>
      <text x="20" y="20" font-size="14" font-weight="900" fill="#B4560E">기본량 세 조각을 곱하고 나누면 — 새 물리량이 태어난다</text>
      <!-- 왼쪽: 기본량 조각 -->
      <g font-size="14" font-weight="900" text-anchor="middle">
        <rect x="20" y="44" width="64" height="40" rx="7" fill="#C1521E"/><text x="52" y="70" fill="#FFFFFF">m</text>
        <rect x="20" y="104" width="64" height="40" rx="7" fill="#2E6690"/><text x="52" y="130" fill="#FFFFFF">kg</text>
        <rect x="20" y="164" width="64" height="40" rx="7" fill="#5E7D57"/><text x="52" y="190" fill="#FFFFFF">s</text>
      </g>
      <g font-size="13" font-weight="800" fill="#3A3A3A" text-anchor="middle"><text x="52" y="38">길이</text><text x="52" y="98">질량</text><text x="52" y="158">시간</text></g>
      <text x="52" y="236" text-anchor="middle" font-size="13" font-weight="900" fill="#7A3E14">기본량</text>
      <!-- 흐름 화살 -->
      <path d="M96,124 C130,124 130,124 160,124" stroke="#C1521E" stroke-width="3" fill="none" marker-end="url(#arrB-1102-03)"/>
      <text x="128" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#C1521E">× ÷</text>
      <!-- 장면 1: 달리는 자동차 — 속도 -->
      <g transform="translate(176,34)">
        <rect width="196" height="100" rx="7" fill="#FFFFFF" stroke="#EBC4AB" stroke-width="1"/>
        <rect x="8" y="64" width="180" height="10" fill="#8A949E"/><path d="M8,69 h180" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8 6"/>
        <g transform="translate(60,54)"><rect x="-24" y="-12" width="48" height="18" rx="5" fill="#C1521E"/><rect x="-14" y="-20" width="26" height="10" rx="3" fill="#E9F2FB"/><circle cx="-14" cy="8" r="5" fill="#2B2B2B"/><circle cx="14" cy="8" r="5" fill="#2B2B2B"/></g>
        <path d="M92,48 h40" stroke="#C1521E" stroke-width="2" marker-end="url(#arrP-1102-03)"/>
        <text x="100" y="20" text-anchor="middle" font-size="13.5" font-weight="900" fill="#C1521E">속도 = 길이 ÷ 시간</text>
        <text x="100" y="36" text-anchor="middle" font-size="14" font-weight="900" fill="#3A3A3A">m/s</text>
        <text x="100" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">1초 동안 몇 m 갔나</text>
      </g>
      <!-- 장면 2: 수조 — 부피 -->
      <g transform="translate(384,34)">
        <rect width="196" height="100" rx="7" fill="#FFFFFF" stroke="#EBC4AB" stroke-width="1"/>
        <g transform="translate(30,50)"><path d="M0,0 l14,-10 h56 l-14,10 z" fill="#CFE3F2" stroke="#5B6B77" stroke-width="1"/><rect y="0" width="56" height="40" fill="url(#h3water-1102-03)" stroke="#5B6B77" stroke-width="1"/><path d="M56,0 l14,-10 v40 l-14,10 z" fill="#7FB3D6" stroke="#5B6B77" stroke-width="1"/></g>
        <g font-size="13" font-weight="800" fill="#C1521E"><text x="16" y="75">m</text><text x="104" y="80">m</text><text x="104" y="52">m</text></g>
        <text x="100" y="20" text-anchor="middle" font-size="13.5" font-weight="900" fill="#C1521E">부피 = 길이 × 길이 × 길이</text>
        <text x="100" y="36" text-anchor="middle" font-size="14" font-weight="900" fill="#3A3A3A">m<tspan dy="-0.45em" font-size="78%">3</tspan></text>
        <text x="188" y="94" text-anchor="end" font-size="13" font-weight="700" fill="#5B6B77">세 변을 곱한다</text>
      </g>
      <!-- 장면 3: 저울 위 벽돌과 수조 — 밀도 -->
      <g transform="translate(176,146)">
        <rect width="196" height="100" rx="7" fill="#FFFFFF" stroke="#EBC4AB" stroke-width="1"/>
        <g transform="translate(52,56)"><rect x="-20" y="-16" width="40" height="22" fill="#B98A5E" stroke="#8A5F38" stroke-width="1"/><path d="M-26,8 h52 v6 h-52 z" fill="#5B6B77"/><rect x="-14" y="14" width="28" height="8" fill="#8A949E"/><text y="-3" text-anchor="middle" font-size="13" font-weight="900" fill="#FFFFFF">kg</text></g>
        <text x="86" y="60" font-size="14" font-weight="900" fill="#C1521E">÷</text>
        <g transform="translate(120,46)"><rect y="0" width="40" height="30" fill="url(#h3water-1102-03)" stroke="#5B6B77" stroke-width="1"/><text x="20" y="20" text-anchor="middle" font-size="13" font-weight="900" fill="#FFFFFF">m<tspan dy="-0.4em" font-size="78%">3</tspan></text></g>
        <text x="100" y="20" text-anchor="middle" font-size="13.5" font-weight="900" fill="#C1521E">밀도 = 질량 ÷ 부피</text>
        <text x="100" y="36" text-anchor="middle" font-size="14" font-weight="900" fill="#3A3A3A">kg/m<tspan dy="-0.45em" font-size="78%">3</tspan></text>
        <text x="100" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">같은 부피에 얼마나 무거운가</text>
      </g>
      <!-- 장면 4: 공을 밀기 — 힘 -->
      <g transform="translate(384,146)">
        <rect width="196" height="100" rx="7" fill="#FFFFFF" stroke="#EBC4AB" stroke-width="1"/>
        <g transform="translate(40,66)" stroke="#2B2B2B" stroke-width="2.4" stroke-linecap="round" fill="none"><circle cy="-26" r="4.5" fill="#2B2B2B" stroke="none"/><path d="M0,-21 v14 M0,-7 l-5,11 M0,-7 l6,10 M0,-18 l12,-2 M0,-18 l10,4"/></g>
        <circle cx="86" cy="66" r="12" fill="#F3C24E" stroke="#8A5F38" stroke-width="1"/>
        <path d="M104,66 h34" stroke="#C1521E" stroke-width="2.4" marker-end="url(#arrP-1102-03)"/>
        <text x="150" y="60" font-size="13" font-weight="800" fill="#C1521E">가속</text>
        <text x="100" y="20" text-anchor="middle" font-size="13.5" font-weight="900" fill="#C1521E">힘 = 질량 × 가속도</text>
        <text x="100" y="36" text-anchor="middle" font-size="14" font-weight="900" fill="#3A3A3A">N = kg·m/s<tspan dy="-0.45em" font-size="78%">2</tspan></text>
        <text x="100" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">별명 N, 정체는 기본단위의 조합</text>
      </g>
      <text x="386" y="261" text-anchor="middle" font-size="13" font-weight="900" fill="#B4560E">양변의 단위가 다르면 그 식은 무조건 틀렸다 — 단위 검산법</text>
    </svg>