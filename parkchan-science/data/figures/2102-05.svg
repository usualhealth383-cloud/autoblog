      <text x="300" y="246" text-anchor="middle" font-size="13" fill="#3A3A3A">그로 미셸(과거의 주력 품종) → 파나마병으로 몰락 → 캐번디시로 교체 → 지금은 신종 파나마병의 위협</text>
