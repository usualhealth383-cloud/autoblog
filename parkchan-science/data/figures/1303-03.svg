<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrB-1303-03" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#4053B8"/></marker><marker id="arrBr-1303-03" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D6455D"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#FDFBF7"/>
