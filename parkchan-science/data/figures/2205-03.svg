      <rect x="6" y="196" width="608" height="30" rx="6" fill="#E7F5F1"/>
      <text x="310" y="215" text-anchor="middle" font-size="11" font-weight="900" fill="#0F6357">어느 쪽도 완전하지 않다 — 안전·환경·비용·안정성을 함께 저울질하여 사회가 선택한다</text>
