        <text x="324" y="164" fill="#2E7A54">＋ 적은 연료로 막대한 전기, 발전 중 CO<tspan dy="0.14em" font-size="68%">2</tspan><tspan dy="-0.14em"> 거의 없음</tspan></text>
        <text x="324" y="182" fill="#B0483A">－ 방사성 폐기물 장기 관리, 사고 위험과 큰 비용</text>
