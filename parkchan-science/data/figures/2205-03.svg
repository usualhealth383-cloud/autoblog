        <text x="196" y="40" font-size="10.5" font-weight="900" fill="#5B6B77">CO<tspan dy="0.14em" font-size="68%">2</tspan><tspan dy="-0.14em"> · 미세먼지</tspan></text>
        <text x="196" y="54" font-size="9.5" fill="#8A949E">대기로 배출된다</text>
