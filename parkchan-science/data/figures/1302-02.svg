<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="axP-1302-02" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <defs>
        <linearGradient id="x2mantle-1302-02" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0603A"/><stop offset="1" stop-color="#8A3E14"/></linearGradient>
        <linearGradient id="x2sea-1302-02" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FC5E6"/><stop offset="1" stop-color="#2E6690"/></linearGradient>
        <linearGradient id="x2magma-1302-02" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB56B"/><stop offset="1" stop-color="#E0603A"/></linearGradient>
      </defs>
      <rect width="600" height="256" rx="10" fill="#D6ECF8"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#2E3E96">대서양 한가운데를 자르면 — 갈라진 틈으로 맨틀 물질이 올라와 새 판이 되고, 바다가 넓어진다</text>
      <!-- 바다 -->
      <rect x="0" y="40" width="600" height="80" fill="url(#x2sea-1302-02)"/>
      <!-- 맨틀 -->
      <rect x="0" y="120" width="600" height="136" fill="url(#x2mantle-1302-02)"/>
      <!-- 해양 지각 양쪽 (해령 쪽으로 올라감) -->
      <path d="M0,120 L0,110 L200,110 L270,84 L300,96 L330,84 L400,110 L600,110 L600,120 L600,132 L330,132 L300,120 L270,132 L0,132 Z" fill="#5B6B77" stroke="#3A3A3A" stroke-width="1.2"/>
      <!-- 열곡 -->
      <path d="M284,90 L300,104 L316,90" fill="#2E6690" stroke="#3A3A3A" stroke-width="1"/>
      <text x="300" y="62" text-anchor="middle" font-size="13.5" font-weight="900" fill="#FFF6D6">해령 — 바다 밑 긴 산맥 · 꼭대기에 열곡</text>
      <!-- 마그마 상승 -->
      <path d="M270,240 C280,180 290,150 300,120 C310,150 320,180 330,240 Z" fill="url(#x2magma-1302-02)"/>
      <g fill="none" stroke="#FFF6D6" stroke-width="2.2" stroke-linecap="round"><path d="M300,200 v-70" marker-end="url(#axP-1302-02)"/></g>
      <text x="300" y="246" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF6D6" stroke="#B4501F" stroke-width="3" paint-order="stroke">맨틀 물질 상승 · 마그마</text>
      <!-- 새 지각 색 강조 -->
      <path d="M270,84 L300,96 L330,84 L330,132 L300,120 L270,132 Z" fill="#8A949E" opacity="0.9"/>
      <text x="300" y="150" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF6D6" stroke="#C9502E" stroke-width="3" paint-order="stroke">새 해양 지각</text>
      <!-- 양쪽으로 멀어지는 화살 -->
      <g stroke="#FFF6D6" stroke-width="3" fill="none"><path d="M240,100 h-60" marker-end="url(#axP-1302-02)"/><path d="M360,100 h60" marker-end="url(#axP-1302-02)"/></g>
      <text x="120,100" y="0" font-size="13"> </text>
      <text x="110" y="96" text-anchor="middle" font-size="13.5" font-weight="900" fill="#FFF6D6">밀려난다 ←</text>
      <text x="490" y="96" text-anchor="middle" font-size="13.5" font-weight="900" fill="#FFF6D6">→ 밀려난다</text>
      <!-- 대류 -->
      <g fill="none" stroke="#F3E4D0" stroke-width="1.6" stroke-dasharray="4 3"><path d="M240,150 C200,160 160,190 150,230"/><path d="M360,150 C400,160 440,190 450,230"/></g>
      <!-- 화산·지진 표시 -->
      <g transform="translate(300,80)"><path d="M-3,-4 l3,-8 l3,8" fill="#E85D3A"/></g>
      <g transform="translate(250,112)" stroke="#F6D27A" stroke-width="1.6" fill="none"><path d="M-8,0 l3,-4 l3,4 l3,-4 l3,4"/></g><g transform="translate(350,112)" stroke="#F6D27A" stroke-width="1.6" fill="none"><path d="M-8,0 l3,-4 l3,4 l3,-4 l3,4"/></g>
      <rect x="8" y="156" width="244" height="72" rx="6" fill="#FDFBF7" stroke="#D9DFF5"/>
      <text x="130" y="174" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">발산형 = 판 생성</text>
      <text x="130" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">화산 활동 + 얕은 지진</text>
      <text x="130" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">대서양은 지금도 1년에 수 cm씩 넓어진다</text>
      <rect x="348" y="156" width="244" height="72" rx="6" fill="#FDFBF7" stroke="#D9DFF5"/>
      <text x="470" y="174" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">대륙에서 갈라지면</text>
      <text x="470" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">동아프리카 열곡대 — 긴 골짜기</text>
      <text x="470" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">먼 훗날 이곳이 새 바다가 된다</text>
    </svg>