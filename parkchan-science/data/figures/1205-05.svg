<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrB-1205-05" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#147D6F"/></marker><marker id="axP-1205-05" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#FDFBF7"/>
      <text x="300" y="20" text-anchor="middle" font-size="12.5" font-weight="900" fill="#0F6357">저항 0의 그래프, 떠오르는 자석, 전압으로 줄 세운 분자</text>
