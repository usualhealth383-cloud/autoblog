          <g stroke="#7B6AAE" stroke-width="3" stroke-linecap="round"><line x1="-20" y1="-22" x2="-20" y2="-6"/><line x1="-8" y1="-22" x2="-8" y2="-6"/><line x1="4" y1="-22" x2="4" y2="-6"/><line x1="16" y1="-22" x2="16" y2="-6"/><line x1="-20" y1="4" x2="-20" y2="20"/><line x1="-8" y1="4" x2="-8" y2="20"/><line x1="4" y1="4" x2="4" y2="20"/><line x1="16" y1="4" x2="16" y2="20"/></g>
