        <text x="160" y="138" text-anchor="end" font-size="8" font-weight="800" fill="#5B6B77">온도 →</text><text x="20" y="34" text-anchor="end" font-size="8" font-weight="800" fill="#5B6B77">저항</text>
        <path d="M26,124 h44 L70,60 C110,60 140,50 160,42" fill="none" stroke="#D6455D" stroke-width="2.8"/>
