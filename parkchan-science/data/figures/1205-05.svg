        <line x1="26" y1="138" x2="166" y2="138" stroke="#5B6B77" stroke-width="1.4" marker-end="url(#axP-1205-05)"/><line x1="26" y1="138" x2="26" y2="36" stroke="#5B6B77" stroke-width="1.4" marker-end="url(#axP-1205-05)"/>
        <text x="166" y="156" text-anchor="end" font-size="13" font-weight="800" fill="#5B6B77">온도 →</text><text x="34" y="46" font-size="13" font-weight="800" fill="#5B6B77">저항</text>
        <path d="M26,138 h44 L70,76 C110,76 140,66 160,58" fill="none" stroke="#D6455D" stroke-width="2.8"/>
        <line x1="70" y1="138" x2="70" y2="76" stroke="#8A949E" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="70" y="160" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">임계 온도</text>
        <text x="47" y="127" text-anchor="middle" font-size="13" font-weight="900" fill="#0F6357">저항 0</text>
        <text x="120" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">이하에서만</text>
      </g>
      <!-- 자기 부상 / MRI -->
      <g transform="translate(194,32)">
