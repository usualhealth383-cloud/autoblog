        <text x="95" y="18" text-anchor="middle" font-size="13.5" font-weight="900" fill="#0F6357">초전도 전자석의 쓰임</text>
        <!-- 열차 -->
        <g transform="translate(95,62)"><rect x="-50" y="14" width="100" height="10" fill="#8A949E"/><rect x="-40" y="-16" width="80" height="22" rx="8" fill="#147D6F"/><rect x="-32" y="-10" width="16" height="9" rx="2" fill="#E9F2FB"/><rect x="-8" y="-10" width="16" height="9" rx="2" fill="#E9F2FB"/><rect x="16" y="-10" width="16" height="9" rx="2" fill="#E9F2FB"/><g stroke="#7FD6C6" stroke-width="1.4" stroke-dasharray="2 2"><line x1="-30" y1="8" x2="-30" y2="14"/><line x1="0" y1="8" x2="0" y2="14"/><line x1="30" y1="8" x2="30" y2="14"/></g></g>
        <text x="95" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">일본의 초전도 방식<tspan x="95" dy="17">자기 부상 열차</tspan></text>
        <g transform="translate(95,144)"><rect x="-30" y="-10" width="60" height="20" rx="10" fill="#E9F2FB" stroke="#5B6B77" stroke-width="1.2"/><circle r="6" fill="#FFFFFF" stroke="#5B6B77"/><text x="0" y="26" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">병원 MRI — 극저온 냉각</text></g>
