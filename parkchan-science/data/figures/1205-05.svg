      <rect x="24" y="198" width="552" height="46" rx="6" fill="#E7F5F1" stroke="#C9E7DF" stroke-width="1"/>
      <text x="300" y="216" text-anchor="middle" font-size="10.5" font-weight="900" fill="#0F6357">도체도 부도체도 아닌 어중간함(반도체), 고체도 액체도 아닌 어중간함(액정)</text>
      <text x="300" y="234" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3A3A3A">'중간'의 성질을 읽어 낸 것이 곧 기술이 되었다. 상온 초전도체는 아직 물리학의 큰 꿈이다</text>
