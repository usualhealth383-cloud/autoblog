<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrBr-1304-04" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D6455D"/></marker><marker id="arrY-1304-04" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D9930D"/></marker><marker id="axP-1304-04" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#EAF3FB"/>
      <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#2E3E96">안전장치의 네 얼굴 — 하는 일은 하나, '멈추는 시간을 벌어' 매 순간의 힘을 줄인다</text>
      <!-- 1 에어백 -->
      <g transform="translate(8,34)">
        <rect width="140" height="184" rx="8" fill="#FDFBF7" stroke="#D9DFF5"/>
        <text x="70" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">에어백</text>
        <rect x="10" y="130" width="120" height="30" rx="6" fill="#5B6B77"/>
        <rect x="14" y="96" width="44" height="40" rx="6" fill="#4053B8"/>
        <text x="36" y="120" text-anchor="middle" font-size="7.5" font-weight="800" fill="#FFF">차 앞부분</text>
        <circle cx="86" cy="86" r="24" fill="#FDFBF7" stroke="#D9930D" stroke-width="2.4"/>
        <text x="86" y="90" text-anchor="middle" font-size="8" font-weight="900" fill="#8A4B00">푹</text>
        <g stroke="#2B2B2B" stroke-width="2.6" stroke-linecap="round" fill="none"><circle cx="112" cy="62" r="6" fill="#2B2B2B" stroke="none"/><path d="M112,68 v22 M112,90 l-6,18 M112,90 l8,16 M112,74 l-10,8"/></g>
        <path d="M112,44 H80" stroke="#D9930D" stroke-width="3" fill="none" marker-end="url(#arrY-1304-04)"/>
        <text x="70" y="176" text-anchor="middle" font-size="8.5" font-weight="900" fill="#3A3A3A">몸이 푹 꺼지며 멈춤</text>
      </g>
      <!-- 2 글러브 -->
      <g transform="translate(156,34)">
        <rect width="140" height="184" rx="8" fill="#FDFBF7" stroke="#D9DFF5"/>
        <text x="70" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">야구 글러브</text>
        <circle cx="30" cy="96" r="9" fill="#FDFBF7" stroke="#D6455D" stroke-width="2"/>
        <path d="M44,96 H62" stroke="#D6455D" stroke-width="3" fill="none" marker-end="url(#arrBr-1304-04)"/>
        <path d="M80,72 q26,-8 34,18 q6,26 -10,40 q-22,10 -34,-10 q-8,-30 10,-48 z" fill="#C98A10" stroke="#8A4B00" stroke-width="1.6"/>
        <path d="M86,84 q10,4 12,18" stroke="#8A4B00" stroke-width="1.4" fill="none"/>
        <path d="M96,138 H128" stroke="#D9930D" stroke-width="3" fill="none" marker-end="url(#arrY-1304-04)"/>
        <text x="70" y="160" text-anchor="middle" font-size="8.5" font-weight="900" fill="#3A3A3A">글러브를 뒤로 빼며 받기</text>
        <text x="70" y="176" text-anchor="middle" font-size="8.5" font-weight="900" fill="#8A4B00">공이 멈추는 시간이 길어진다</text>
      </g>
      <!-- 3 무릎 굽히기 -->
      <g transform="translate(304,34)">
        <rect width="140" height="184" rx="8" fill="#FDFBF7" stroke="#D9DFF5"/>
        <text x="70" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">무릎 굽혀 착지</text>
        <rect x="10" y="150" width="120" height="8" fill="#8A949E"/>
        <path d="M70,30 V70" stroke="#5B6B77" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#axP-1304-04)"/>
        <g stroke="#2B2B2B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="70" cy="90" r="7" fill="#2B2B2B" stroke="none"/><path d="M70,97 v22 M70,119 l-16,14 l6,17 M70,119 l16,14 l-6,17 M70,104 l-14,10 M70,104 l14,10"/></g>
        <text x="70" y="176" text-anchor="middle" font-size="8.5" font-weight="900" fill="#3A3A3A">천천히 멈춘다 → 덜 다친다</text>
      </g>
      <!-- 4 번지점프 -->
      <g transform="translate(452,34)">
        <rect width="140" height="184" rx="8" fill="#FDFBF7" stroke="#D9DFF5"/>
