        <g stroke="#2B2B2B" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M70,136 v18 M70,154 l-8,-14 M70,154 l8,-14 M70,142 l-10,-8 M70,142 l10,-8"/><circle cx="70" cy="160" r="6" fill="#2B2B2B" stroke="none"/></g>
        <text x="70" y="176" text-anchor="middle" font-size="8.5" font-weight="900" fill="#3A3A3A">잘 늘어나는 줄이 시간을 번다</text>
      </g>
      <rect x="8" y="226" width="584" height="22" rx="6" fill="#2E3E96"/>
      <text x="300" y="241" text-anchor="middle" font-size="9.5" font-weight="900" fill="#FFF">운동량 변화량(충격량)은 그대로 · 충돌 시간 ↑ → 매 순간 받는 힘 ↓ — 이 한 줄이 모든 안전 설계의 원리</text>
    </svg>