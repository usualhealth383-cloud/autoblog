<svg width="600" height="270" viewBox="0 0 600 270" font-family="PC Sans"><defs><marker id="axP-1103-02" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <defs>
        <linearGradient id="k2sky-1103-02" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6ECF8"/><stop offset="1" stop-color="#F3F8FB"/></linearGradient>
        <linearGradient id="k2water-1103-02" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9D6EE"/><stop offset="1" stop-color="#4C86B0"/></linearGradient>
      </defs>
      <rect width="600" height="270" rx="10" fill="url(#k2sky-1103-02)"/>
      <text x="20" y="20" font-size="14" font-weight="900" fill="#B4560E">수영장의 물은 생수병 몇 개일까 — 자도 계산기도 없이 세 걸음</text>
      <!-- 수영장 (입체) -->
      <g transform="translate(30,60)">
        <path d="M0,60 L60,20 H260 L200,60 Z" fill="#CFE3F2" stroke="#5B6B77" stroke-width="1"/>
        <rect x="0" y="60" width="200" height="60" fill="url(#k2water-1103-02)" stroke="#5B6B77" stroke-width="1"/>
        <path d="M200,60 L260,20 V80 L200,120 Z" fill="#3E6A8A" stroke="#5B6B77" stroke-width="1"/>
        <path d="M0,72 q25,-6 50,0 t50,0 t50,0 t50,0" stroke="#E9F2FB" stroke-width="1.5" fill="none" opacity="0.8"/>
        <g stroke="#5B6B77" stroke-width="1"><path d="M40,60 v60 M80,60 v60 M120,60 v60 M160,60 v60" opacity="0.5"/></g>
        <!-- 치수 -->
        <line x1="0" y1="132" x2="200" y2="132" stroke="#C1521E" stroke-width="1.6" marker-start="url(#axP-1103-02)" marker-end="url(#axP-1103-02)"/>
        <text x="100" y="148" text-anchor="middle" font-size="13.5" font-weight="900" fill="#C1521E">길이 25 m · 깊이 ≈ 1.5 m</text>
        <line x1="212" y1="122" x2="272" y2="82" stroke="#C1521E" stroke-width="1.6" marker-start="url(#axP-1103-02)" marker-end="url(#axP-1103-02)"/>
        <text x="262" y="118" font-size="13.5" font-weight="900" fill="#C1521E">폭 ≈ 15 m</text>
        <line x1="-12" y1="60" x2="-12" y2="120" stroke="#C1521E" stroke-width="1.6" marker-start="url(#axP-1103-02)" marker-end="url(#axP-1103-02)"/>
        
      </g>
      <!-- 생수병 -->
      <g transform="translate(360,86)"><path d="M-9,-30 h18 v6 q17,4 17,14 v46 q0,8 -8,8 h-36 q-8,0 -8,-8 v-46 q0,-10 17,-14 z" fill="#CFE3F2" stroke="#5B6B77" stroke-width="1.2"/><rect x="-9" y="-36" width="18" height="7" rx="2" fill="#2E6690"/><rect x="-25" y="0" width="50" height="20" fill="#FFFFFF" opacity="0.9"/><text y="14" text-anchor="middle" font-size="13" font-weight="900" fill="#2E6690">500 mL</text></g>
      <text x="358" y="142" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">= 0.0005 m<tspan dy="-0.45em" font-size="78%">3</tspan></text>
      <!-- 세 걸음 -->
      <g font-size="13" font-weight="800">
        <rect x="398" y="40" width="194" height="46" rx="6" fill="#FDFBF7" stroke="#EBC4AB"/>
        <text x="408" y="57" fill="#C1521E" font-weight="900">① 쪼갠다</text><text x="408" y="75" fill="#3A3A3A">병 수 = 수영장 부피 ÷ 병 부피</text>
        <rect x="398" y="94" width="194" height="46" rx="6" fill="#FDFBF7" stroke="#EBC4AB"/>
        <text x="408" y="111" fill="#C1521E" font-weight="900">② 아는 값을 넣는다</text><text x="408" y="129" fill="#3A3A3A">25 × 15 × 1.5 ≈ 560 m<tspan dy="-0.45em" font-size="78%">3</tspan></text>
        <rect x="398" y="148" width="194" height="46" rx="6" fill="#FDFBF7" stroke="#EBC4AB"/>
        <text x="408" y="165" fill="#C1521E" font-weight="900">③ 나눈다</text><text x="408" y="183" fill="#3A3A3A">560 ÷ 0.0005 ≈ 1.1 × 10<tspan dy="-0.45em" font-size="78%">6</tspan></text>
      </g>
      <!-- 결론 띠 -->
      <rect x="12" y="218" width="576" height="44" rx="6" fill="#1D2A4A"/>
      <text x="300" y="236" text-anchor="middle" font-size="13.5" font-weight="900" fill="#FFF6D6">약 백만 병 — 참값이 80만이든 130만이든 '10<tspan dy="-0.45em" font-size="78%">6</tspan><tspan dy="0.45em"> 규모'라는 판단은 흔들리지 않는다</tspan></text>
      <text x="300" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#C9D3DC">어림의 목표는 숫자의 일치가 아니라 자릿수 — 10의 거듭제곱으로 보고한다</text>
    </svg>