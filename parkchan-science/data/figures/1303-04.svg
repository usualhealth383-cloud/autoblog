<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="axP-1303-04" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <defs>
        <radialGradient id="y4earth-1303-04" cx="0.35" cy="0.35" r="0.7"><stop offset="0" stop-color="#8FC5E6"/><stop offset="1" stop-color="#2E6690"/></radialGradient>
        <radialGradient id="y4moon-1303-04" cx="0.4" cy="0.4" r="0.7"><stop offset="0" stop-color="#F1EEE6"/><stop offset="1" stop-color="#B7B2A6"/></radialGradient>
      </defs>
      <rect width="600" height="256" rx="10" fill="#0B1430"/>
      <g fill="#FFF6D6"><circle cx="40" cy="30" r="1.2"/><circle cx="560" cy="40" r="1"/><circle cx="500" cy="230" r="1.3"/><circle cx="90" cy="220" r="1"/></g>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#FFF6D6">산꼭대기의 대포 — 세게 쏠수록 멀리 떨어지다가, 충분히 빠르면 떨어지는 것이 곧 도는 것이 된다</text>
      <!-- 지구 -->
      <g transform="translate(260,180)">
        <circle r="110" fill="url(#y4earth-1303-04)"/>
        <path d="M-70,-40 q24,-20 54,-8 q16,24 -8,40 q-36,10 -46,-32 z M20,30 q26,-6 34,20 q-20,18 -34,-20 z" fill="#7FA86B"/>
        <!-- 산과 대포 -->
        <path d="M-14,-110 L0,-140 L14,-110 Z" fill="#5A4A42"/>
        <rect x="-2" y="-146" width="16" height="6" fill="#3A3A3A"/>
        <!-- 궤적들: 점점 멀리 -->
        <g fill="none" stroke-width="1.8" stroke-linecap="round">
          <path d="M14,-143 C40,-140 60,-120 70,-86" stroke="#F6D27A"/>
          <path d="M14,-143 C60,-142 100,-110 106,-30" stroke="#F0A275"/>
          <path d="M14,-143 C90,-146 140,-80 116,20" stroke="#E0603A"/>
        </g>
        <!-- 궤도 -->
        <ellipse rx="128" ry="128" fill="none" stroke="#7FD6C6" stroke-width="2.4" stroke-dasharray="6 4"/>
        <g transform="translate(-92,-90)"><rect x="-6" y="-4" width="12" height="8" rx="1" fill="#E9F2FB"/><rect x="-18" y="-2" width="10" height="4" fill="#2E6690"/><rect x="8" y="-2" width="10" height="4" fill="#2E6690"/></g>
        <g font-size="13" font-weight="900" paint-order="stroke" stroke="#0B1430" stroke-width="3"><text x="34" y="-96" fill="#F6D27A">느리게</text><text x="80" y="-52" fill="#F0A275">더 세게</text><text x="132" y="-6" fill="#E0603A">더 세게</text></g>
        <text x="-250" y="-128" text-anchor="start" font-size="13" font-weight="900" fill="#7FD6C6">충분히 빠르면 — 궤도</text>
        <text x="-250" y="-110" text-anchor="start" font-size="13" font-weight="700" fill="#C9D3DC">계속 떨어지되 지면이 비껴간다</text>
        <!-- 중력 화살 (위성 → 중심) -->
        <path d="M-84,-82 L-40,-40" stroke="#F6D27A" stroke-width="1.6" fill="none" marker-end="url(#axP-1303-04)"/>
        <text x="-40" y="-56" font-size="13" font-weight="800" fill="#F6D27A">중력</text>
      </g>
      <!-- 달 -->
      <g transform="translate(530,100)">
        <circle r="26" fill="url(#y4moon-1303-04)"/><circle cx="-8" cy="-6" r="5" fill="#A9A397" opacity="0.6"/><circle cx="8" cy="8" r="6" fill="#A9A397" opacity="0.5"/>
        <path d="M-30,10 L-110,70" stroke="#F6D27A" stroke-width="1.6" fill="none" marker-end="url(#axP-1303-04)"/>
