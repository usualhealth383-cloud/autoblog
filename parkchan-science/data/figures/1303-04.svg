        <text x="62" y="50" text-anchor="end" font-size="13" font-weight="800" fill="#F6D27A" stroke="#0B1430" stroke-width="3" paint-order="stroke">매 순간 지구로 떨어지는 중</text>
        <text x="62" y="68" text-anchor="end" font-size="13" font-weight="800" fill="#C9D3DC" stroke="#0B1430" stroke-width="3" paint-order="stroke">사과와 같은 법칙</text>
      </g>
      <rect x="8" y="196" width="232" height="54" rx="6" fill="#FDFBF7" stroke="#D9DFF5"/>
      <text x="124" y="216" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">중력이 없다면 → 직선으로 날아간다</text>
      <text x="124" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">도는 것 자체가 중력이 일한다는 증거</text>
    </svg>