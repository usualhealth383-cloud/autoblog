<svg width="600" height="300" viewBox="0 0 600 300" font-family="PC Sans"><defs><marker id="arrBr-1305-04" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D6455D"/></marker><marker id="arrG-1305-04" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#147D6F"/></marker></defs>
      <defs>
