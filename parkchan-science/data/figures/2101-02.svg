<svg width="600" height="250" viewBox="0 0 600 250" font-family="PC Sans"><defs><marker id="arrB-2101-02" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#C1521E"/></marker></defs>
