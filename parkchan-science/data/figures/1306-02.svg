<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrBr-1306-02" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D6455D"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#FFF3D6"/>
      <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#2E3E96">원본(DNA)은 핵에 남고, 복사본(RNA)이 핵공으로 나가 공장(라이보솜)에서 단백질이 된다</text>
      <!-- 세포막 -->
      <rect x="10" y="32" width="580" height="214" rx="40" fill="#FFF8E6" stroke="#D9930D" stroke-width="2.4"/>
      <text x="60" y="236" font-size="8.5" font-weight="800" fill="#8A4B00">세포질</text>
      <!-- 핵 -->
      <g transform="translate(170,138)">
        <ellipse rx="130" ry="86" fill="#C9D3EC" stroke="#4053B8" stroke-width="2.4"/>
        <text x="0" y="-66" text-anchor="middle" font-size="10" font-weight="900" fill="#2E3E96">핵 — 원본 보관실</text>
        <!-- DNA 이중나선 -->
        <path d="M-100,-20 q25,-24 50,0 t50,0 t50,0 t40,0" stroke="#4053B8" stroke-width="3" fill="none"/>
        <path d="M-100,20 q25,24 50,0 t50,0 t50,0 t40,0" stroke="#4053B8" stroke-width="3" fill="none"/>
        <g stroke-width="2.4" stroke-linecap="round"><path d="M-84,-8 V8" stroke="#D6455D"/><path d="M-64,-12 V12" stroke="#147D6F"/><path d="M-36,-12 V12" stroke="#D9930D"/><path d="M-14,-8 V8" stroke="#D6455D"/><path d="M14,-12 V12" stroke="#147D6F"/><path d="M36,-12 V12" stroke="#D9930D"/><path d="M64,-8 V8" stroke="#D6455D"/></g>
        <text x="-70" y="40" text-anchor="middle" font-size="9" font-weight="900" fill="#2E3E96">DNA (원본)</text>
        <!-- RNA 한 가닥 복사본 -->
        <path d="M-20,40 q30,-10 60,0 t60,0" stroke="#D6455D" stroke-width="3" fill="none"/>
        <g stroke="#D6455D" stroke-width="2" stroke-linecap="round"><path d="M-6,38 v10 M14,36 v10 M34,38 v10 M54,36 v10 M74,38 v10"/></g>
        <text x="30" y="66" text-anchor="middle" font-size="9" font-weight="900" fill="#D6455D">① 전사 — RNA 복사본 만들기</text>
        <!-- 핵공 -->
        <rect x="120" y="-14" width="20" height="28" rx="4" fill="#FFF8E6" stroke="#4053B8" stroke-width="2"/>
        <text x="148" y="-24" text-anchor="start" font-size="7.5" font-weight="800" fill="#2E3E96">핵공</text>
      </g>
      <!-- RNA 이동 -->
      <path d="M302,138 H352" stroke="#D6455D" stroke-width="3" fill="none" marker-end="url(#arrBr-1306-02)"/>
      <text x="326" y="160" text-anchor="middle" font-size="8" font-weight="800" fill="#D6455D">RNA만 나간다</text>
      <!-- 라이보솜 -->
      <g transform="translate(430,138)">
        <ellipse cx="0" cy="8" rx="46" ry="26" fill="#7FA86B" stroke="#147D6F" stroke-width="2"/>
        <ellipse cx="0" cy="-22" rx="30" ry="16" fill="#9BC08A" stroke="#147D6F" stroke-width="2"/>
        <text x="0" y="12" text-anchor="middle" font-size="9.5" font-weight="900" fill="#FFF">라이보솜</text>
        <path d="M-70,0 H-46" stroke="#D6455D" stroke-width="3" fill="none"/>
        <path d="M46,0 H70" stroke="#D6455D" stroke-width="3" fill="none"/>
        <text x="0" y="-48" text-anchor="middle" font-size="9.5" font-weight="900" fill="#147D6F">공장 — 세포질</text>
        <!-- 아미노산 사슬 -->
        <g transform="translate(0,-4)">
          <g fill="#D9930D" stroke="#8A4B00" stroke-width="1.2"><circle cx="-4" cy="-60" r="7"/><circle cx="10" cy="-70" r="7"/><circle cx="24" cy="-60" r="7"/><circle cx="38" cy="-70" r="7"/><circle cx="52" cy="-60" r="7"/><circle cx="66" cy="-70" r="7"/><circle cx="80" cy="-60" r="7"/></g>
          <path d="M-4,-60 L10,-70 L24,-60 L38,-70 L52,-60 L66,-70 L80,-60" stroke="#8A4B00" stroke-width="1.4" fill="none"/>
        </g>
        <text x="40" y="-86" text-anchor="middle" font-size="9" font-weight="900" fill="#8A4B00">② 번역 — 아미노산을 이어 단백질</text>
        <text x="0" y="58" text-anchor="middle" font-size="9" font-weight="900" fill="#147D6F">단백질 → 형질</text>
        <text x="0" y="72" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5B6B77">효소·케라틴·헤모글로빈</text>
      </g>
      <text x="300" y="238" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">DNA → (전사, 핵 안) → RNA → (번역, 라이보솜) → 단백질 → 형질 — 한 방향으로 흐른다</text>
    </svg>