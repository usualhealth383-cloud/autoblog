<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrB-1304-01" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#4053B8"/></marker><marker id="arrY-1304-01" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D9930D"/></marker><marker id="axP-1304-01" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#EAF3FB"/>
      <rect x="0" y="192" width="600" height="64" fill="#8A949E"/>
      <rect x="0" y="252" width="600" height="4" fill="#5B6B77"/>
      <g stroke="#FDFBF7" stroke-width="3" stroke-dasharray="18 14"><path d="M10,222 H590"/></g>
      <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#2E3E96">버스는 멈추거나 출발하지만, 몸은 '하던 대로' — 쏠리는 방향은 몸이 하던 운동이 정한다</text>
      <!-- 왼쪽: 급정거 -->
      <g transform="translate(150,0)">
        <text x="0" y="44" text-anchor="middle" font-size="10.5" font-weight="900" fill="#D6455D">급정거 — 달리던 버스가 갑자기 멈춘다</text>
        <rect x="-118" y="92" width="236" height="100" rx="10" fill="#F2B84B" stroke="#C98A10" stroke-width="1.5"/>
        <rect x="-108" y="104" width="52" height="40" rx="4" fill="#DDEBF7"/><rect x="-24" y="104" width="52" height="40" rx="4" fill="#DDEBF7"/><rect x="60" y="104" width="52" height="40" rx="4" fill="#DDEBF7"/>
        <circle cx="-72" cy="192" r="14" fill="#2B2B2B"/><circle cx="72" cy="192" r="14" fill="#2B2B2B"/>
        <circle cx="-72" cy="192" r="5" fill="#C9D3DC"/><circle cx="72" cy="192" r="5" fill="#C9D3DC"/>
        <!-- 승객: 앞(오른쪽)으로 쏠림 -->
        <g transform="translate(62,184) rotate(22)" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" fill="none">
          <circle cy="-60" r="8" fill="#2B2B2B" stroke="none"/><path d="M0,-50 v30 M0,-20 l-8,20 M0,-20 l8,20 M0,-44 l-10,14 M0,-44 l12,10"/>
        </g>
        <!-- 버스 속도: 달리다 멈춤 -->
        <path d="M-60,72 H60" stroke="#5B6B77" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#axP-1304-01)"/>
        <rect x="80" y="60" width="26" height="26" rx="4" fill="#D6455D"/><text x="93" y="78" text-anchor="middle" font-size="12" font-weight="900" fill="#FFF">■</text>
        <text x="-60" y="62" font-size="8.5" font-weight="800" fill="#5B6B77">버스: 달리다 → 멈춤</text>
        <!-- 몸의 관성 화살 -->
        <path d="M78,118 H110" stroke="#D9930D" stroke-width="3.5" fill="none" marker-end="url(#arrY-1304-01)"/>
        <text x="-40" y="168" text-anchor="middle" font-size="8.5" font-weight="900" fill="#8A4B00">몸은 계속 앞으로 → 앞으로 쏠림</text>
      </g>
      <!-- 오른쪽: 급출발 -->
      <g transform="translate(450,0)">
        <text x="0" y="44" text-anchor="middle" font-size="10.5" font-weight="900" fill="#2E3E96">급출발 — 서 있던 버스가 갑자기 출발한다</text>
        <rect x="-118" y="92" width="236" height="100" rx="10" fill="#F2B84B" stroke="#C98A10" stroke-width="1.5"/>
        <rect x="-108" y="104" width="52" height="40" rx="4" fill="#DDEBF7"/><rect x="-24" y="104" width="52" height="40" rx="4" fill="#DDEBF7"/><rect x="60" y="104" width="52" height="40" rx="4" fill="#DDEBF7"/>
        <circle cx="-72" cy="192" r="14" fill="#2B2B2B"/><circle cx="72" cy="192" r="14" fill="#2B2B2B"/>
        <circle cx="-72" cy="192" r="5" fill="#C9D3DC"/><circle cx="72" cy="192" r="5" fill="#C9D3DC"/>
        <!-- 승객: 뒤(왼쪽)로 쏠림 -->
        <g transform="translate(-62,184) rotate(-22)" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" fill="none">
          <circle cy="-60" r="8" fill="#2B2B2B" stroke="none"/><path d="M0,-50 v30 M0,-20 l-8,20 M0,-20 l8,20 M0,-44 l-12,10 M0,-44 l10,14"/>
        </g>
        <path d="M-20,72 H80" stroke="#2E3E96" stroke-width="4" fill="none" marker-end="url(#arrB-1304-01)"/>
        <text x="-96" y="76" font-size="8.5" font-weight="800" fill="#2E3E96">버스: 출발!</text>
        <path d="M-78,118 H-110" stroke="#D9930D" stroke-width="3.5" fill="none" marker-end="url(#arrY-1304-01)"/>
        <text x="36" y="168" text-anchor="middle" font-size="8.5" font-weight="900" fill="#8A4B00">몸은 그 자리에 있으려 함 → 뒤로 쏠림</text>
      </g>
      <text x="300" y="242" text-anchor="middle" font-size="9" font-weight="900" fill="#FDFBF7">노란 화살 = 몸이 하던 운동 그대로. 버스가 한 일의 '반대'가 아니라 '내 몸이 하던 일'을 보면 된다</text>
    </svg>