      <text x="153" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">속도·부피·밀도·힘은 기본량이 아니다 — 유도량</text>
      <rect x="306" y="36" width="282" height="48" rx="6" fill="#FDFBF7" stroke="#EBC4AB" stroke-width="1"/>
