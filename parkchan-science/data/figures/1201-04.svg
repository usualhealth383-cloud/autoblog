<svg width="600" height="262" viewBox="0 0 600 262" font-family="PC Sans">
      <defs>
        <linearGradient id="rain-1201-04" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7B4FD6"/><stop offset="0.2" stop-color="#3B6FE0"/><stop offset="0.4" stop-color="#3CC27A"/><stop offset="0.6" stop-color="#F0D23C"/><stop offset="0.8" stop-color="#F08A2E"/><stop offset="1" stop-color="#D9342B"/></linearGradient>
      </defs>
      <rect width="600" height="262" rx="10" fill="#1D2A4A"/>
      <text x="20" y="20" font-size="14" font-weight="900" fill="#FFF6D6">같은 빛을 프리즘에 통과시키면 — 무엇이 앞에 있느냐에 따라 세 가지 띠</text>
      <!-- 공통: 프리즘 기호 -->
      <defs><g id="prism-1201-04"><path d="M0,-14 L14,12 L-14,12 Z" fill="#CFE3F2" stroke="#8FC5E6" stroke-width="1.2" opacity="0.9"/></g>
            <g id="star-1201-04"><circle r="12" fill="#F6D27A"/><g stroke="#F6D27A" stroke-width="2" stroke-linecap="round"><line y1="-17" y2="-21"/><line y1="17" y2="21"/><line x1="-17" x2="-21"/><line x1="17" x2="21"/></g></g>
            <g id="gas-1201-04"><rect x="-18" y="-12" width="36" height="24" rx="6" fill="#7FD6C6" opacity="0.35" stroke="#7FD6C6" stroke-width="1.2"/><g fill="#7FD6C6"><circle cx="-8" cy="-3" r="2"/><circle cx="4" cy="4" r="2"/><circle cx="9" cy="-5" r="2"/></g></g></defs>
      <!-- 행 1: 연속 -->
      <g transform="translate(0,58)">
        <use href="#star-1201-04" x="50" y="0"/>
        <line x1="68" y1="0" x2="176" y2="0" stroke="#F6D27A" stroke-width="2"/>
        <use href="#prism-1201-04" x="190" y="0"/>
        <rect x="216" y="-16" width="230" height="32" rx="3" fill="url(#rain-1201-04)"/>
        <text x="60" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF6D6">고온의 광원(별 표면)</text>
        <text x="520" y="-4" text-anchor="middle" font-size="13.5" font-weight="900" fill="#FFF6D6">연속 스펙트럼</text>
        <text x="520" y="12" text-anchor="middle" font-size="13" font-weight="700" fill="#C9D3DC">모든 색이 이어진다</text>
      </g>
      <!-- 행 2: 방출 -->
      <g transform="translate(0,130)">
        <use href="#gas-1201-04" x="50" y="0"/>
        <line x1="68" y1="0" x2="176" y2="0" stroke="#7FD6C6" stroke-width="2"/>
        <use href="#prism-1201-04" x="190" y="0"/>
        <rect x="216" y="-16" width="230" height="32" rx="3" fill="#0B1430" stroke="#5B6B77" stroke-width="1"/>
        <g stroke-width="3"><line x1="262" y1="-16" x2="262" y2="16" stroke="#3B6FE0"/><line x1="318" y1="-16" x2="318" y2="16" stroke="#3CC27A"/><line x1="402" y1="-16" x2="402" y2="16" stroke="#D9342B"/></g>
        <text x="50" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF6D6">고온·저밀도 기체</text>
        <text x="520" y="-4" text-anchor="middle" font-size="13.5" font-weight="900" fill="#FFF6D6">방출 스펙트럼</text>
        <text x="520" y="12" text-anchor="middle" font-size="13" font-weight="700" fill="#C9D3DC">어두운 바탕 + 밝은 선</text>
      </g>
      <!-- 행 3: 흡수 -->
      <g transform="translate(0,202)">
        <use href="#star-1201-04" x="50" y="0"/>
        <line x1="68" y1="0" x2="100" y2="0" stroke="#F6D27A" stroke-width="2"/>
        <use href="#gas-1201-04" x="122" y="0"/>
        <line x1="142" y1="0" x2="176" y2="0" stroke="#F6D27A" stroke-width="2"/>
        <use href="#prism-1201-04" x="190" y="0"/>
        <rect x="216" y="-16" width="230" height="32" rx="3" fill="url(#rain-1201-04)"/>
        <g stroke="#0B1430" stroke-width="3"><line x1="262" y1="-16" x2="262" y2="16"/><line x1="318" y1="-16" x2="318" y2="16"/><line x1="402" y1="-16" x2="402" y2="16"/></g>
        <text x="50" y="31" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF6D6">광원</text>
        <text x="122" y="31" text-anchor="middle" font-size="13" font-weight="800" fill="#7FD6C6">+ 저온 기체</text>
        <text x="520" y="-4" text-anchor="middle" font-size="13.5" font-weight="900" fill="#FFF6D6">흡수 스펙트럼</text>
        <text x="520" y="12" text-anchor="middle" font-size="13" font-weight="700" fill="#C9D3DC">무지개 바탕 + 검은 선</text>
      </g>
      <!-- 같은 위치 강조 -->
      <g stroke="#F6D27A" stroke-width="1" stroke-dasharray="3 3"><line x1="262" y1="146" x2="262" y2="186"/><line x1="318" y1="146" x2="318" y2="186"/><line x1="402" y1="146" x2="402" y2="186"/></g>
      <rect x="206" y="157" width="252" height="18" rx="4" fill="#1D2A4A"/>
      <text x="332" y="170" text-anchor="middle" font-size="13" font-weight="900" fill="#F6D27A">같은 기체 → 밝은 선과 검은 선이 같은 자리</text>
      <text x="300" y="250" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF6D6">선의 위치 = 원소의 지문. 별빛의 검은 선을 실험실 스펙트럼과 대조하면 별의 성분이 나온다</text>
    </svg>