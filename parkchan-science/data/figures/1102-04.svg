      <text x="470" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">지구</text><text x="470" y="125" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">13 Mm</text>
      <g transform="translate(550,76)"><rect x="-20" y="-14" width="40" height="28" rx="3" fill="#2B2B2B"/><rect x="-16" y="-10" width="32" height="20" fill="#5B6B77"/><g stroke="#7FD6C6" stroke-width="1.4"><path d="M-12,-4 h10 M-12,0 h18 M-12,4 h6"/></g></g>
      <text x="550" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">저장 용량</text><text x="550" y="125" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">GB</text>
      <!-- 하단 경고 -->
      <rect x="12" y="203" width="576" height="48" rx="6" fill="#FDFBF7" stroke="#EBC4AB" stroke-width="1"/>
      <text x="300" y="222" text-anchor="middle" font-size="13.5" font-weight="900" fill="#C1521E">환산의 급소는 지수의 부호 — 1 nm = 10<tspan dy="-0.45em" font-size="78%">−9</tspan><tspan dy="0.45em"> m (10</tspan><tspan dy="-0.45em" font-size="78%">9</tspan><tspan dy="0.45em"> m가 아니다) · 2 μm = 2 × 10</tspan><tspan dy="-0.45em" font-size="78%">−6</tspan><tspan dy="0.45em"> m</tspan></text>
      <text x="300" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">처방전의 mg과 μg은 접두어 한 칸 — 1000배 차이. 접두어는 암기 과목이 아니라 안전 수칙이다</text>
    </svg>