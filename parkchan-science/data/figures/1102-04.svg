      <g transform="translate(310,92)" stroke="#2B2B2B" stroke-width="2.6" stroke-linecap="round" fill="none"><circle cy="-32" r="5" fill="#2B2B2B" stroke="none"/><path d="M0,-26 v16 M0,-10 l-6,12 M0,-10 l6,12 M0,-22 l-8,8 M0,-22 l8,8"/></g>
