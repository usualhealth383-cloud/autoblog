<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="axP-1102-04" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <defs>
