      <g transform="translate(390,76)"><path d="M-30,20 L-6,-22 L6,-4 L14,-14 L32,20 Z" fill="#7FA86B" stroke="#4E7A4A" stroke-width="1"/><path d="M-6,-22 L-1,-13 L4,-16 L6,-4" fill="#FFFFFF"/></g>
