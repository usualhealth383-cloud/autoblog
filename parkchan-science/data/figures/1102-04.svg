      <g transform="translate(230,78)" fill="#5A4A42"><ellipse cx="-12" rx="7" ry="5"/><ellipse cx="0" rx="5" ry="4"/><ellipse cx="12" cy="1" rx="9" ry="6"/><g stroke="#5A4A42" stroke-width="1.3" fill="none"><path d="M-4,-2 l-6,-9 M0,-3 l0,-10 M4,-2 l6,-9 M-2,3 l-8,8 M2,3 l0,10 M6,3 l7,8"/></g></g>
