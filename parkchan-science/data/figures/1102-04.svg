        <radialGradient id="h4earth-1102-04" cx="0.35" cy="0.35" r="0.7"><stop offset="0" stop-color="#8FC5E6"/><stop offset="1" stop-color="#2E6690"/></radialGradient>
      </defs>
      <rect width="600" height="256" rx="10" fill="url(#h4bg-1102-04)"/>
      <text x="20" y="20" font-size="14" font-weight="900" fill="#B4560E">접두어의 사다리 — 한 칸이 1000배, 규모에 맞는 옷을 골라 입는다</text>
      <!-- 축 -->
      <line x1="40" y1="154" x2="572" y2="154" stroke="#5B6B77" stroke-width="2" marker-end="url(#axP-1102-04)"/>
      <g stroke="#5B6B77" stroke-width="1.2"><line x1="70" y1="148" x2="70" y2="166"/><line x1="150" y1="148" x2="150" y2="160"/><line x1="230" y1="148" x2="230" y2="160"/><line x1="310" y1="148" x2="310" y2="160"/><line x1="390" y1="148" x2="390" y2="160"/><line x1="470" y1="148" x2="470" y2="160"/><line x1="550" y1="148" x2="550" y2="160"/></g>
      <g font-size="13" font-weight="900" fill="#C1521E" text-anchor="middle">
        <text x="70" y="176">n</text><text x="150" y="176">μ</text><text x="230" y="176">m</text><text x="310" y="176">(기준)</text><text x="390" y="176">k</text><text x="470" y="176">M</text><text x="550" y="176">G</text>
      </g>
      <g font-size="13" font-weight="800" fill="#3A3A3A" text-anchor="middle">
        <text x="70" y="193">나노 10<tspan dy="-0.45em" font-size="78%">−9</tspan></text><text x="150" y="193">마이크로 10<tspan dy="-0.45em" font-size="78%">−6</tspan></text><text x="230" y="193">밀리 10<tspan dy="-0.45em" font-size="78%">−3</tspan></text><text x="310" y="193">1</text><text x="390" y="193">킬로 10<tspan dy="-0.45em" font-size="78%">3</tspan></text><text x="470" y="193">메가 10<tspan dy="-0.45em" font-size="78%">6</tspan></text><text x="550" y="193">기가 10<tspan dy="-0.45em" font-size="78%">9</tspan></text>
      </g>
      <!-- ×1000 표시 -->
      <g font-size="13" font-weight="800" fill="#7A3E14" text-anchor="middle"><text x="110" y="142">×1000</text><text x="190" y="142">×1000</text><text x="270" y="142">×1000</text><text x="350" y="142">×1000</text><text x="430" y="142">×1000</text><text x="510" y="142">×1000</text></g>
