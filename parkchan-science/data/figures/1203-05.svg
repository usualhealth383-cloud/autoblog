<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans">
      <rect width="600" height="256" rx="10" fill="#FDFBF7"/>
      <text x="300" y="20" text-anchor="middle" font-size="12.5" font-weight="900" fill="#0F6357">겹친 자리의 전자쌍을 두 원자가 함께 쓴다 — 그리고 같은 '녹은 물'이어도 이온이 있어야 전구가 켜진다</text>
      <!-- 왼쪽: 물 분자 공유 결합 -->
      <g transform="translate(24,36)">
        <rect width="270" height="130" rx="6" fill="#E7F5F1" stroke="#7FD6C6" stroke-width="1.2"/>
        <text x="135" y="18" text-anchor="middle" font-size="10.5" font-weight="900" fill="#0F6357">물 H<tspan dy="0.3em" font-size="72%">2</tspan><tspan dy="-0.3em">O — 산소 1개가 수소 2개와 전자쌍 1개씩 공유</tspan></text>
        <g transform="translate(135,82)">
          <circle r="34" fill="#8FC5E6" opacity="0.5" stroke="#2E6690" stroke-width="1.2"/>
          <circle cx="-44" cy="-18" r="20" fill="#E9F2FB" opacity="0.8" stroke="#5B6B77" stroke-width="1.2"/>
          <circle cx="44" cy="-18" r="20" fill="#E9F2FB" opacity="0.8" stroke="#5B6B77" stroke-width="1.2"/>
          <circle r="7" fill="#D6455D"/><text y="3" text-anchor="middle" font-size="8" font-weight="900" fill="#FFFFFF">O</text>
          <circle cx="-44" cy="-18" r="5" fill="#5B6B77"/><text x="-44" y="-15" text-anchor="middle" font-size="8" font-weight="900" fill="#FFFFFF">H</text>
          <circle cx="44" cy="-18" r="5" fill="#5B6B77"/><text x="44" y="-15" text-anchor="middle" font-size="8" font-weight="900" fill="#FFFFFF">H</text>
          <!-- 공유 전자쌍 (겹친 자리) -->
          <g fill="#E8940A" stroke="#B4830A" stroke-width="1"><circle cx="-26" cy="-14" r="3"/><circle cx="-22" cy="-6" r="3"/><circle cx="26" cy="-14" r="3"/><circle cx="22" cy="-6" r="3"/></g>
          <!-- 산소의 나머지 전자 -->
          <g fill="#5B6B77"><circle cx="-6" cy="24" r="2.6"/><circle cx="6" cy="24" r="2.6"/><circle cx="-26" cy="14" r="2.6"/><circle cx="26" cy="14" r="2.6"/></g>
          <path d="M-70,-40 L-30,-16" stroke="#B4830A" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
          <text x="-90" y="-44" text-anchor="middle" font-size="8.5" font-weight="900" fill="#B4830A">공유 전자쌍</text>
        </g>
        <text x="135" y="124" text-anchor="middle" font-size="9" font-weight="800" fill="#3A3A3A">산소는 네온형, 수소 둘은 헬륨형 — 모두 안정 · 비금속 + 비금속</text>
      </g>
      <!-- 오른쪽: 전도성 실험 -->
      <g transform="translate(306,36)">
        <rect width="278" height="130" rx="6" fill="#FFF6D6" stroke="#F6D27A" stroke-width="1.2"/>
        <text x="139" y="18" text-anchor="middle" font-size="10.5" font-weight="900" fill="#B4830A">전기 전도성 — 움직이는 이온이 있어야 켜진다</text>
        <!-- 소금물 -->
        <g transform="translate(70,84)">
          <path d="M-30,-30 v50 q0,8 8,8 h44 q8,0 8,-8 v-50" fill="none" stroke="#5B6B77" stroke-width="1.4"/><rect x="-29" y="-12" width="58" height="39" fill="#8FC5E6" opacity="0.6"/>
          <g stroke="#3A3A3A" stroke-width="2.4"><line x1="-14" y1="-44" x2="-14" y2="18"/><line x1="14" y1="-44" x2="14" y2="18"/></g>
          <g font-size="8" font-weight="900" text-anchor="middle"><circle cx="-6" cy="4" r="5" fill="#F6D27A"/><text x="-6" y="7" fill="#3A3A3A">+</text><circle cx="6" cy="14" r="5" fill="#7FD6C6"/><text x="6" y="17" fill="#3A3A3A">−</text><circle cx="20" cy="2" r="5" fill="#F6D27A"/><text x="20" y="5" fill="#3A3A3A">+</text><circle cx="-20" cy="16" r="5" fill="#7FD6C6"/><text x="-20" y="19" fill="#3A3A3A">−</text></g>
          <path d="M-14,-44 h-10 v-14 h48 v14 h-10" fill="none" stroke="#3A3A3A" stroke-width="1.6"/>
          <circle cx="0" cy="-58" r="9" fill="#F6D27A" stroke="#E8940A" stroke-width="2"/><g stroke="#F6D27A" stroke-width="1.6" stroke-linecap="round"><line x1="-13" y1="-64" x2="-17" y2="-67"/><line x1="13" y1="-64" x2="17" y2="-67"/><line x1="0" y1="-71" x2="0" y2="-75"/></g>
          <text y="44" text-anchor="middle" font-size="9" font-weight="900" fill="#0F6357">소금물 — 켜진다</text>
        </g>
        <!-- 설탕물 -->
        <g transform="translate(200,84)">
          <path d="M-30,-30 v50 q0,8 8,8 h44 q8,0 8,-8 v-50" fill="none" stroke="#5B6B77" stroke-width="1.4"/><rect x="-29" y="-12" width="58" height="39" fill="#8FC5E6" opacity="0.6"/>
          <g stroke="#3A3A3A" stroke-width="2.4"><line x1="-14" y1="-44" x2="-14" y2="18"/><line x1="14" y1="-44" x2="14" y2="18"/></g>
          <g fill="#FFFFFF" stroke="#8A949E" stroke-width="0.8"><rect x="-10" y="0" width="8" height="8" rx="2"/><rect x="4" y="10" width="8" height="8" rx="2"/><rect x="16" y="-2" width="8" height="8" rx="2"/><rect x="-22" y="12" width="8" height="8" rx="2"/></g>
          <path d="M-14,-44 h-10 v-14 h48 v14 h-10" fill="none" stroke="#3A3A3A" stroke-width="1.6"/>
          <circle cx="0" cy="-58" r="9" fill="#E2DED6" stroke="#8A949E" stroke-width="2"/>
          <text y="44" text-anchor="middle" font-size="9" font-weight="900" fill="#D6455D">설탕물 — 안 켜진다</text>
        </g>
              </g>
      <!-- 아래 표 -->
      <g transform="translate(24,176)" font-size="9.5" font-weight="800">
        <rect width="560" height="70" rx="6" fill="#FFFFFF" stroke="#C9E7DF" stroke-width="1"/>
        <g fill="#0F6357" font-weight="900"><text x="14" y="18">물질</text><text x="150" y="18">결합</text><text x="270" y="18">고체</text><text x="360" y="18">수용액 · 녹인 상태</text><text x="480" y="18">까닭</text></g>
        <line x1="8" y1="24" x2="552" y2="24" stroke="#C9E7DF"/>
        <g fill="#3A3A3A"><text x="14" y="42">염화 나트륨(소금)</text><text x="150" y="42">이온 결합</text><text x="270" y="42" fill="#D6455D">X</text><text x="360" y="42" fill="#0F6357">O</text><text x="480" y="42" font-size="8.5">이온이 풀려나 움직임</text></g>
        <g fill="#3A3A3A"><text x="14" y="60">설탕</text><text x="150" y="60">공유 결합</text><text x="270" y="60" fill="#D6455D">X</text><text x="360" y="60" fill="#D6455D">X</text><text x="480" y="60" font-size="8.5">이온이 생기지 않음</text></g>
      </g>
    </svg>