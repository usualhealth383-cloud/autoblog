      <rect width="600" height="292" rx="10" fill="url(#s5bg-1202-05)"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#0F6357">몸 질량의 약 90 %는 별이 만든 원소다 — 원소마다 출생지가 다르다</text>
      <!-- 사람 실루엣 -->
