          <text x="0" y="106">질소 N</text><rect x="56" y="94" width="7.5" height="16" rx="2" fill="#7FA86B"/><text x="70" y="106" fill="#5E7D57">3 %</text>
          <text x="0" y="136">칼슘 · 철 · 그 외</text><rect x="106" y="124" width="10" height="16" rx="2" fill="#B4830A"/><text x="122" y="136" fill="#B4830A">약 4 %</text>
