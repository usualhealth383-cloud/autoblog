      <!-- 연결선 -->
            <text x="330" y="266" text-anchor="middle" font-size="13" font-weight="900" fill="#0F6357">족보 세 줄 — 수소는 빅뱅, 철까지는 별, 철 너머는 초신성</text>
      <text x="330" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">몸속 산소 원자는 태양보다 나이가 많다 — "우리는 별의 먼지"는 과학적 사실이다</text>
