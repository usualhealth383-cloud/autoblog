      <text x="70" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">O 39 · C 11</text><text x="70" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">H 6 · N 2 kg</text>
