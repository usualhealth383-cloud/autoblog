<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans">
      <rect width="600" height="256" rx="10" fill="#FDFBF7"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#0F6357">3 × 3 표 하나면 끝 — 단위체 셋, 만들어지는 것 셋, 다양성의 비결 셋</text>
      <!-- 표 -->
      <g transform="translate(8,31)" font-size="13.5" font-weight="800">
        <rect width="584" height="134" rx="6" fill="#FFFFFF" stroke="#C9E7DF"/>
        <g fill="#0F6357" font-weight="900"><text x="12" y="20">구분</text><text x="118" y="20">지각 — 규산염 광물</text><text x="262" y="20">생명 — 단백질</text><text x="424" y="20">생명 — 핵산(DNA)</text></g>
        <line x1="8" y1="28" x2="576" y2="28" stroke="#C9E7DF"/>
        <g fill="#3A3A3A"><text x="12" y="48">기본 단위체</text><text x="118" y="48">규산염 사면체</text><text x="262" y="48">아미노산</text><text x="424" y="48">뉴클레오타이드</text></g>
        <g fill="#D6455D" font-weight="900"><text x="12" y="67" font-size="13" fill="#5B6B77">종류 수</text><text x="118" y="67">1종 (Si 1 + O 4)</text><text x="262" y="67">약 20종</text><text x="424" y="67">염기 4종 (A·G·C·T)</text></g>
        <line x1="8" y1="76" x2="576" y2="76" stroke="#C9E7DF"/>
        <g fill="#3A3A3A"><text x="12" y="96">다양성의 비결</text><text x="118" y="96" fill="#0F6357" font-weight="900">사면체의 결합 방식</text><text x="262" y="96" fill="#0F6357" font-weight="900">아미노산의 배열 순서</text><text x="424" y="96" fill="#0F6357" font-weight="900">염기 서열</text></g>
        <line x1="8" y1="105" x2="576" y2="105" stroke="#C9E7DF"/>
        <g fill="#3A3A3A"><text x="12" y="124">만들어지는 것</text><text x="118" y="124">감람석·흑운모·석영 …</text><text x="262" y="124">효소·항체·헤모글로빈 …</text><text x="424" y="124">유전 정보(설계도)</text></g>
      </g>
      <!-- 경우의 수 -->
      <g transform="translate(8,172)">
        <rect width="284" height="78" rx="6" fill="#E7F5F1" stroke="#C9E7DF"/>
        <text x="142" y="19" text-anchor="middle" font-size="13.5" font-weight="900" fill="#0F6357">아미노산 3개를 잇는 경우의 수</text>
        <g font-size="13" font-weight="900" fill="#3A3A3A" text-anchor="middle"><circle cx="48" cy="42" r="12.5" fill="#F6D27A"/><text x="48" y="46.6">20</text><text x="71" y="46.6" font-size="13.5">×</text><circle cx="94" cy="42" r="12.5" fill="#7FD6C6"/><text x="94" y="46.6">20</text><text x="117" y="46.6" font-size="13.5">×</text><circle cx="140" cy="42" r="12.5" fill="#E9A0AC"/><text x="140" y="46.6">20</text></g>
        <text x="222" y="47" text-anchor="middle" font-size="14" font-weight="900" fill="#D6455D">= 8000가지</text>
        <text x="142" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">수백 개짜리 사슬이면 사실상 무한</text>
      </g>
      <g transform="translate(308,172)">
        <rect width="284" height="78" rx="6" fill="#F1ECFA" stroke="#C9B8EA"/>
        <text x="142" y="19" text-anchor="middle" font-size="13.5" font-weight="900" fill="#7B6AAE">염기 10개 서열의 경우의 수</text>
        <g font-size="13" font-weight="900" fill="#3A3A3A" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"><text x="70" y="47">A G C T T A G C A T</text></g>
        <text x="212" y="47" text-anchor="middle" font-size="14" font-weight="900" fill="#D6455D">4<tspan dy="-0.45em" font-size="72%">10</tspan><tspan dy="0.45em"> ≈ 105만</tspan></text>
        <text x="142" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">사람 DNA 약 30억 쌍 — 우주의 원자 수보다 많다</text>
      </g>
    </svg>