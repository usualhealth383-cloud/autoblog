<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrBr-1304-02" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#D6455D"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#EAF3FB"/>
      <rect x="0" y="150" width="600" height="60" fill="#8A949E"/>
      <g stroke="#FDFBF7" stroke-width="3" stroke-dasharray="18 14"><path d="M10,180 H590"/></g>
      <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#2E3E96">'운동의 양'은 무게로도 빠르기로도 못 잰다 — 반드시 질량 × 속도의 곱으로 잰다</text>
      <!-- 트럭: 무겁고 느리다 -->
      <g transform="translate(40,0)">
        <rect x="0" y="70" width="120" height="80" rx="6" fill="#4053B8"/>
        <rect x="120" y="96" width="46" height="54" rx="6" fill="#2E3E96"/><rect x="126" y="104" width="30" height="20" rx="3" fill="#DDEBF7"/>
        <circle cx="30" cy="152" r="13" fill="#2B2B2B"/><circle cx="90" cy="152" r="13" fill="#2B2B2B"/><circle cx="146" cy="152" r="13" fill="#2B2B2B"/>
        <text x="60" y="116" text-anchor="middle" font-size="11" font-weight="900" fill="#FFF">질량 큼</text>
        <path d="M172,124 H206" stroke="#D6455D" stroke-width="4" fill="none" marker-end="url(#arrBr-1304-02)"/>
        <text x="190" y="112" text-anchor="middle" font-size="8.5" font-weight="900" fill="#D6455D">속도 작음</text>
        <text x="86" y="52" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">천천히 구르는 트럭</text>
      </g>
      <!-- 자전거: 가볍고 빠르다 -->
      <g transform="translate(262,0)">
        <circle cx="30" cy="140" r="16" fill="none" stroke="#2B2B2B" stroke-width="3"/><circle cx="84" cy="140" r="16" fill="none" stroke="#2B2B2B" stroke-width="3"/>
        <path d="M30,140 L52,112 L84,140 M52,112 L68,112 L84,140 M30,140 L56,140 M68,112 L64,98 M50,98 L58,100" stroke="#2B2B2B" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <g stroke="#2B2B2B" stroke-width="2.6" stroke-linecap="round" fill="none"><circle cx="58" cy="82" r="6" fill="#2B2B2B" stroke="none"/><path d="M58,88 l-4,14 M54,102 l-2,10 l-10,4 M54,102 l8,-2 M58,88 l-12,10 l4,6"/></g>
        <text x="58" y="66" text-anchor="middle" font-size="11" font-weight="900" fill="#2B2B2B">질량 작음</text>
        <path d="M108,124 H186" stroke="#D6455D" stroke-width="4" fill="none" marker-end="url(#arrBr-1304-02)"/>
        <text x="148" y="112" text-anchor="middle" font-size="8.5" font-weight="900" fill="#D6455D">속도 큼</text>
        <text x="60" y="52" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">쌩쌩 달리는 자전거</text>
      </g>
      <text x="300" y="234" text-anchor="middle" font-size="10" font-weight="900" fill="#2E3E96">어느 쪽을 멈추기 어려울까? → 질량 × 속도가 큰 쪽이다. 한쪽 값만 보면 틀린다</text>
      <!-- 계산 예 -->
      <g transform="translate(524,40)">
        <rect x="-56" y="0" width="112" height="98" rx="8" fill="#FDFBF7" stroke="#D9DFF5"/>
        <text x="0" y="16" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">계산은 곱셈 한 번</text>
        <circle cx="-30" cy="46" r="13" fill="#D6455D"/><text x="-30" y="50" text-anchor="middle" font-size="8.5" font-weight="900" fill="#FFF">2 kg</text>
        <path d="M-12,46 H24" stroke="#D6455D" stroke-width="3" fill="none" marker-end="url(#arrBr-1304-02)"/>
        <text x="8" y="36" text-anchor="middle" font-size="8.5" font-weight="900" fill="#D6455D">3 m/s</text>
        <text x="0" y="76" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2B2B2B">2 × 3 = 6 kg·m/s</text>
        <text x="0" y="90" text-anchor="middle" font-size="8" font-weight="700" fill="#5B6B77">방향은 속도 방향(→)</text>
      </g>
    </svg>