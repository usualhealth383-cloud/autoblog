<svg width="600" height="270" viewBox="0 0 600 270" font-family="PC Sans"><defs><marker id="arrB-1205-02" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#147D6F"/></marker></defs>
      <rect width="600" height="270" rx="10" fill="#FDFBF7"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#0F6357">모래에서 뽑은 규소가 '조절 가능한 도선'이 되기까지 — 불순물 · 온도 · 빛</text>
      <!-- 왼쪽: 순수 규소 vs 불순물 -->
      <g transform="translate(24,32)">
        <rect width="270" height="150" rx="6" fill="#FFFFFF" stroke="#C9E7DF"/>
        <text x="135" y="18" text-anchor="middle" font-size="14" font-weight="900" fill="#0F6357">불순물 첨가(도핑) → 전도성이 크게 커진다</text>
        <g transform="translate(14,36)">
          <rect width="100" height="60" rx="4" fill="#C9B8EA" stroke="#7B6AAE" stroke-width="1"/>
          <g fill="#8A949E"><circle cx="20" cy="18" r="5"/><circle cx="50" cy="18" r="5"/><circle cx="80" cy="18" r="5"/><circle cx="20" cy="42" r="5"/><circle cx="50" cy="42" r="5"/><circle cx="80" cy="42" r="5"/></g>
          <text x="50" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">순수한 규소</text>
          <text x="50" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#D6455D">잘 안 통함</text>
        </g>
        <path d="M124,66 h30" stroke="#147D6F" stroke-width="2.4" marker-end="url(#arrB-1205-02)"/>
        <text x="140" y="56" text-anchor="middle" font-size="13" font-weight="900" fill="#147D6F">+ 소량</text>
        <g transform="translate(166,36)">
          <rect width="100" height="60" rx="4" fill="#C9B8EA" stroke="#7B6AAE" stroke-width="1"/>
          <g fill="#8A949E"><circle cx="20" cy="18" r="5"/><circle cx="80" cy="18" r="5"/><circle cx="20" cy="42" r="5"/><circle cx="50" cy="42" r="5"/><circle cx="80" cy="42" r="5"/></g>
          <circle cx="50" cy="18" r="5" fill="#D6455D"/>
          <g fill="#2E6690"><circle cx="36" cy="30" r="2.6"/><circle cx="64" cy="30" r="2.6"/><circle cx="60" cy="8" r="2.6"/></g>
          <text x="50" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">불순물 첨가</text>
          <text x="50" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#0F6357">전도성 ↑ 조절 가능</text>
        </g>
              </g>
      <!-- 오른쪽: 스위치 / 센서 -->
      <g transform="translate(306,32)">
        <rect width="270" height="150" rx="6" fill="#FFFFFF" stroke="#C9E7DF"/>
        <text x="135" y="18" text-anchor="middle" font-size="14" font-weight="900" fill="#0F6357">조절 가능성이 낳은 것</text>
        <!-- 스위치 0/1 -->
        <g transform="translate(60,72)">
          <rect x="-40" y="-14" width="34" height="28" rx="6" fill="#E2DED6"/><circle cx="-31" cy="0" r="9" fill="#FFFFFF" stroke="#8A949E"/><text x="-23" y="-20" text-anchor="middle" font-size="13" font-weight="900" fill="#5B6B77">0 꺼짐</text>
          <rect x="6" y="-14" width="34" height="28" rx="6" fill="#147D6F"/><circle cx="31" cy="0" r="9" fill="#FFFFFF"/><text x="23" y="-20" text-anchor="middle" font-size="13" font-weight="900" fill="#0F6357">1 켜짐</text>
          <text x="0" y="34" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">스위치 → 컴퓨터</text>
        </g>
        <!-- 광센서 가로등 -->
        <g transform="translate(200,78)">
          <line x1="-10" y1="-26" x2="-10" y2="30" stroke="#5B6B77" stroke-width="3"/><path d="M-10,-26 h20" stroke="#5B6B77" stroke-width="3"/><circle cx="12" cy="-18" r="7" fill="#F6D27A" stroke="#E8940A" stroke-width="1.6"/>
          <rect x="-40" y="-30" width="18" height="12" rx="2" fill="#C9B8EA" stroke="#7B6AAE"/><text x="-31" y="-34" text-anchor="middle" font-size="13" font-weight="900" fill="#7B6AAE">광센서</text>
          <g fill="#0B1430"><circle cx="-42" cy="12" r="1.2"/><circle cx="-30" cy="6" r="1"/></g>
          <text x="-10" y="44" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">어두우면 켜지는 가로등</text>
        </g>
        <text x="135" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">전도성의 변화를 읽는다 = 센서(온도·빛)</text>
      </g>
      <rect x="24" y="190" width="552" height="72" rx="6" fill="#E7F5F1" stroke="#C9E7DF" stroke-width="1"/>
      <text x="300" y="210" text-anchor="middle" font-size="14" font-weight="900" fill="#0F6357">두 방향만 정확히 — ① 불순물 첨가 → 전도성 커진다 ② 온도 상승 · 빛 → 전도성 커진다</text>
      <text x="300" y="231" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3A3A3A">"작아진다"로 뒤집는 선지가 단골. n형·p형 명칭과 접합 원리는 다루지 않는다</text>
      <text x="300" y="251" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3A3A3A">단, 규소의 원자가 전자 4(이웃 4개와 공유 결합)와 불순물 원소의 족(13·15족)은 묻는다</text>
    </svg>