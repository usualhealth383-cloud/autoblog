        <g transform="translate(66,74)"><rect x="-22" y="-16" width="44" height="32" rx="4" fill="#C9B8EA" stroke="#7B6AAE" stroke-width="1.4"/><g stroke="#3A3A3A" stroke-width="2"><line x1="-22" y1="0" x2="-42" y2="0"/><line x1="0" y1="16" x2="0" y2="34"/><line x1="22" y1="0" x2="42" y2="0"/></g></g>
        <path d="M24,120 q6,-4 12,0 t12,0" fill="none" stroke="#5B6B77" stroke-width="1.6"/><text x="30" y="136" font-size="7.5" font-weight="800" fill="#5B6B77">작은 신호</text>
        <path d="M80,124 q6,-14 12,0 t12,0" fill="none" stroke="#147D6F" stroke-width="2.4"/><text x="98" y="136" text-anchor="middle" font-size="7.5" font-weight="800" fill="#147D6F">크게(증폭)</text>
        <text x="66" y="154" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">키우고 · 켜고 끈다</text>
      </g>
