      <g transform="translate(312,40)">
        <rect width="132" height="160" rx="6" fill="#FFFFFF" stroke="#C9E7DF"/>
        <text x="66" y="18" text-anchor="middle" font-size="10.5" font-weight="900" fill="#0F6357">집적 회로(칩)</text>
        <g transform="translate(66,78)"><rect x="-30" y="-30" width="60" height="60" rx="4" fill="#2B3A2B"/><g stroke="#7FD6C6" stroke-width="1" fill="none"><path d="M-22,-18 h14 v10 h12 M-22,0 h8 v12 h20 M-4,-24 v8 M12,-22 h10 v14 M-22,18 h40 M14,6 v16"/></g><g fill="#F6D27A"><rect x="-26" y="-26" width="4" height="4"/><rect x="20" y="16" width="4" height="4"/></g><g stroke="#8A949E" stroke-width="2"><path d="M-30,-20 h-8 M-30,-8 h-8 M-30,4 h-8 M-30,16 h-8 M30,-20 h8 M30,-8 h8 M30,4 h8 M30,16 h8"/></g></g>
        <text x="66" y="130" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3A3A3A">손톱 위에 트랜지스터 수십억 개</text>
        <text x="66" y="154" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">모은다 — 스마트폰의 두뇌</text>
