          <path d="M38,0 h20" stroke="#147D6F" stroke-width="2.4" marker-end="url(#arrB-1205-03)"/><text x="46" y="-8" text-anchor="middle" font-size="7.5" font-weight="900" fill="#147D6F">전기</text>
        </g>
        <text x="60" y="130" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3A3A3A">빛 → 전기 (반대 방향 아님)</text>
        <text x="60" y="154" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">바꾼다 — 지붕 위 패널</text>
      </g>
      <text x="300" y="228" text-anchor="middle" font-size="10.5" font-weight="900" fill="#0F6357">기능 바꿔치기 선지는 이 네 동사로 전부 걸러진다</text>
      <text x="300" y="244" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3A3A3A">LED는 같은 밝기에서 백열등보다 전력을 훨씬 적게 쓰고 수명은 수십 배 길다</text>
    </svg>