<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrB-1205-03" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 Z" fill="#147D6F"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#FDFBF7"/>
      <text x="300" y="20" text-anchor="middle" font-size="12.5" font-weight="900" fill="#0F6357">소자 넷을 동사로 — 다이오드는 거른다, 트랜지스터는 키우고 끈다, 칩은 모은다, 태양 전지는 바꾼다</text>
      <!-- 다이오드/LED -->
      <g transform="translate(24,40)">
        <rect width="132" height="160" rx="6" fill="#FFFFFF" stroke="#C9E7DF"/>
        <text x="66" y="18" text-anchor="middle" font-size="10.5" font-weight="900" fill="#0F6357">다이오드 · LED</text>
        <g transform="translate(66,70)"><path d="M-40,0 h24 M16,0 h24" stroke="#3A3A3A" stroke-width="2"/><path d="M-16,-14 L16,0 L-16,14 Z" fill="#C9B8EA" stroke="#7B6AAE" stroke-width="1.6"/><line x1="16" y1="-14" x2="16" y2="14" stroke="#7B6AAE" stroke-width="2.4"/></g>
        <path d="M30,96 h60" stroke="#147D6F" stroke-width="2" marker-end="url(#arrB-1205-03)"/><text x="66" y="110" text-anchor="middle" font-size="8" font-weight="800" fill="#147D6F">이 방향만 통과</text>
        <path d="M102,120 h-60" stroke="#D6455D" stroke-width="2" stroke-dasharray="3 2"/><text x="66" y="134" text-anchor="middle" font-size="8" font-weight="800" fill="#D6455D">반대는 막힘</text>
        <g transform="translate(66,146)"><circle r="6" fill="#F6D27A" stroke="#E8940A" stroke-width="1.4"/><g stroke="#F6D27A" stroke-width="1.4" stroke-linecap="round"><line x1="-9" y1="-5" x2="-12" y2="-7"/><line x1="9" y1="-5" x2="12" y2="-7"/></g><text x="12" y="3" font-size="8" font-weight="800" fill="#3A3A3A">LED — 빛</text></g>
      </g>
