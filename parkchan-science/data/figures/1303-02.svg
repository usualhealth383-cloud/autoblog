<svg width="600" height="282" viewBox="0 0 600 282" font-family="PC Sans"><defs><marker id="axP-1303-02" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="282" rx="10" fill="#FDFBF7"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#2E3E96">1초마다 찍은 사진 — 간격이 벌어진다. 그리고 진공에서는 깃털과 쇠구슬이 나란히 떨어진다</text>
      <!-- 왼쪽: 스트로보 낙하 -->
      <g transform="translate(8,32)">
        <rect width="284" height="242" rx="6" fill="#FFFFFF" stroke="#D9DFF5"/>
        <text x="142" y="18" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">자유 낙하 — 매초 9.8 m/s씩 빨라진다</text>
        <line x1="96" y1="32" x2="96" y2="178" stroke="#8A949E" stroke-width="1" stroke-dasharray="3 2"/>
        <!-- 공 위치: 0, 4.9, 19.6, 44.1 m 비례 (스케일 3px/m 정도) -->
        <g fill="#D6455D" stroke="#3A3A3A" stroke-width="1"><circle cx="96" cy="36" r="6"/><circle cx="96" cy="51" r="6"/><circle cx="96" cy="95" r="6"/><circle cx="96" cy="168" r="6"/></g>
        <g font-size="13" font-weight="800" fill="#3A3A3A"><text x="112" y="37">0초 · 0 m/s</text><text x="112" y="58">1초 · 9.8 m/s</text><text x="112" y="100">2초 · 19.6 m/s</text><text x="112" y="173">3초 · 29.4 m/s</text></g>
        <g stroke="#2E3E96" stroke-width="1.6" fill="none"><path d="M76,42 v6" marker-end="url(#axP-1303-02)"/><path d="M76,58 v34" marker-end="url(#axP-1303-02)"/><path d="M76,102 v62" marker-end="url(#axP-1303-02)"/></g>
        <g font-size="13" font-weight="800" fill="#2E3E96" text-anchor="end"><text x="70" y="50">4.9 m</text><text x="70" y="80">14.7 m</text><text x="70" y="137">24.5 m</text></g>
        <text x="142" y="198" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">간격이 점점 벌어진다 = 점점 빨라진다</text>
        <text x="142" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">속력 = 9.8 × 시간<tspan x="142" dy="17">일정한 '속력'이 아니라 일정하게 '빨라짐'</tspan></text>
      </g>
      <!-- 오른쪽: 진공관 -->
      <g transform="translate(300,32)">
        <rect width="292" height="242" rx="6" fill="#FFFFFF" stroke="#D9DFF5"/>
        <text x="146" y="18" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">깃털 vs 쇠구슬 — 공기가 있으면 / 없으면</text>
        <!-- 공기 있는 관 -->
        <g transform="translate(76,116)">
          <rect x="-52" y="-84" width="104" height="164" rx="8" fill="#E9F2FB" stroke="#5B6B77" stroke-width="1.2"/>
          <text x="0" y="-66" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">공기 있음</text>
          <circle cx="-16" cy="66" r="7" fill="#5B6B77"/>
          <path d="M14,-30 q10,-8 8,6 q-4,12 -8,10 q-6,-8 0,-16 z" fill="#F3E4D0" stroke="#8A949E" stroke-width="1"/><path d="M16,-24 l-4,10" stroke="#8A949E" stroke-width="1"/>
          <g stroke="#8FC5E6" stroke-width="1" fill="none"><path d="M10,-8 q4,4 8,0 M8,0 q4,4 8,0"/></g>
          <text x="-16" y="52" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">먼저 닿음</text>
          <text x="6" y="18" text-anchor="middle" font-size="13" font-weight="800" fill="#D6455D">공기 저항이</text><text x="6" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="#D6455D">발목을 잡음</text>
        </g>
        <!-- 진공 관 -->
        <g transform="translate(216,116)">
          <rect x="-52" y="-84" width="104" height="164" rx="8" fill="#F1ECFA" stroke="#5B6B77" stroke-width="1.2"/>
          <text x="0" y="-66" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">진공(공기 없음)</text>
          <circle cx="-16" cy="66" r="7" fill="#5B6B77"/>
          <path d="M14,60 q10,-8 8,6 q-4,12 -8,10 q-6,-8 0,-16 z" fill="#F3E4D0" stroke="#8A949E" stroke-width="1"/>
          <line x1="-46" y1="74" x2="46" y2="74" stroke="#4053B8" stroke-width="1.4" stroke-dasharray="3 2"/>
          <text x="0" y="-44" text-anchor="middle" font-size="13" font-weight="900" fill="#4053B8">나란히 · 동시에</text>
          <text x="0" y="-26" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">질량과 무관</text>
        </g>
        <text x="146" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">아폴로 15호 — 진공인 달에서<tspan x="146" dy="17">깃털과 망치가 동시에 닿았다</tspan></text>
      </g>
    </svg>