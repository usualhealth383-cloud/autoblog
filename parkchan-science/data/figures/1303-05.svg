      <text x="300" y="240" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">한 장 요약 — 질량(불변) vs 무게(장소 따라) · 자유 낙하 9.8<tspan x="300" dy="20">수평 투사 = 등속 + 낙하 · 위성 = 계속 낙하 중</tspan></text>
      <text x="300" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#3A3A3A">사과를 떨어뜨리는 힘과 별을 빚는 힘이 같은 힘이라는 것 — 이 소단원의 가장 큰 그림</text>
