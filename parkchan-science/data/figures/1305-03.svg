<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrG-1305-03" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#147D6F"/></marker><marker id="arrP-1305-03" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4053B8"/></marker><marker id="arrR-1305-03" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#D6455D"/></marker><marker id="axP-1305-03" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#FDFBF7" stroke="#D9DFF5"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#2E3E96">효소는 언덕을 깎아 지름길을 낸다 — 그리고 짝이 맞는 기질만 골라, 쓰고 나서도 그대로 남는다</text>
      <!-- 에너지 언덕 그래프 -->
      <g transform="translate(50,0)">
        <line x1="0" y1="210" x2="290" y2="210" stroke="#5B6B77" stroke-width="1.6" marker-end="url(#axP-1305-03)"/>
        <line x1="0" y1="210" x2="0" y2="36" stroke="#5B6B77" stroke-width="1.6" marker-end="url(#axP-1305-03)"/>
        <text x="-4" y="44" text-anchor="end" font-size="13" font-weight="900" fill="#3A3A3A">에너지</text>
        <text x="288" y="226" text-anchor="end" font-size="13" font-weight="900" fill="#3A3A3A">반응의 진행</text>
        <!-- 반응물/생성물 수준 -->
        <path d="M10,120 H60" stroke="#3A3A3A" stroke-width="2.4"/>
        <path d="M220,170 H270" stroke="#3A3A3A" stroke-width="2.4"/>
        <text x="35" y="136" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">반응물</text>
        <text x="245" y="186" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">생성물</text>
        <!-- 효소 없음: 높은 언덕 -->
        <path d="M60,120 C110,120 110,50 140,50 C170,50 180,170 220,170" stroke="#D6455D" stroke-width="2.6" fill="none"/>
        <text x="140" y="42" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">효소 없음 — 높은 언덕</text>
        <!-- 효소 있음: 낮은 언덕 -->
        <path d="M60,120 C110,120 110,92 140,92 C170,92 180,170 220,170" stroke="#4053B8" stroke-width="2.6" fill="none"/>
        <text x="186" y="92" text-anchor="start" font-size="13" font-weight="900" fill="#2E3E96">효소 있음</text>
        <!-- 활성화 에너지 표시 -->
        <path d="M108,118 V54" stroke="#D6455D" stroke-width="1.4" stroke-dasharray="3 2" fill="none" marker-end="url(#arrR-1305-03)"/>
        <text x="100" y="70" text-anchor="end" font-size="13" font-weight="800" fill="#D6455D">활성화 에너지</text>
        <text x="100" y="88" text-anchor="end" font-size="13" font-weight="800" fill="#D6455D">(효소 없을 때)</text>
        <path d="M172,118 V96" stroke="#2E3E96" stroke-width="1.4" stroke-dasharray="3 2" fill="none" marker-end="url(#arrP-1305-03)"/>
        <text x="186" y="111" font-size="13" font-weight="800" fill="#2E3E96">낮아진 언덕</text>
        <text x="142" y="250" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">언덕이 낮다 = 반응이 빠르다 · 반응물·생성물의 에너지는 그대로</text>
      </g>
      <!-- 열쇠-자물쇠 -->
      <g transform="translate(360,36)">
        <rect width="230" height="200" rx="8" fill="#EEF2FB" stroke="#D9DFF5"/>
        <text x="115" y="16" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">기질 특이성 — 열쇠 하나에 자물쇠 하나</text>
        <!-- 효소 (홈 있는 덩어리) -->
        <g transform="translate(60,104)">
          <path d="M-40,-30 h80 v60 h-80 z M-14,-30 v18 h28 v-18 z" fill="#4053B8" fill-rule="evenodd" stroke="#2E3E96" stroke-width="1.4"/>
          <text x="0" y="14" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF">효소</text>
          <!-- 기질: 맞는 모양 -->
          <rect x="-12" y="-62" width="24" height="16" rx="2" fill="#7FA86B" stroke="#147D6F" stroke-width="1.4"/>
          <path d="M0,-42 V-34" stroke="#147D6F" stroke-width="2" fill="none" marker-end="url(#arrG-1305-03)"/>
          <text x="0" y="-70" text-anchor="middle" font-size="13" font-weight="900" fill="#147D6F">맞는 기질 ✓</text>
        </g>
        <g transform="translate(170,104)">
          <path d="M-40,-30 h80 v60 h-80 z M-14,-30 v18 h28 v-18 z" fill="#4053B8" fill-rule="evenodd" stroke="#2E3E96" stroke-width="1.4"/>
          <text x="0" y="14" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF">효소</text>
          <circle cx="0" cy="-54" r="11" fill="#F0A275" stroke="#D6455D" stroke-width="1.4"/>
          <text x="0" y="-70" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">안 맞는 물질 ✗</text>
          <path d="M-8,-40 l16,10 M8,-40 l-16,10" stroke="#D6455D" stroke-width="2"/>
        </g>
        <!-- 재사용 -->
        <path d="M60,136 q0,30 40,30 h60" stroke="#5B6B77" stroke-width="1.8" fill="none" marker-end="url(#axP-1305-03)"/>
        <text x="115" y="178" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">반응 후 효소는 그대로 나와</text>
        <text x="115" y="196" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">다음 기질을 붙잡는다 — 소모 없음</text>
      </g>
    </svg>