<svg width="600" height="168" viewBox="0 0 470 132" font-family="PC Sans">
      <g font-size="8">
        <text x="235" y="13" text-anchor="middle" font-size="8.4" font-weight="800" fill="#147D6F">전기 100을 공급했을 때 — 백열등과 LED의 비교</text>
        <g transform="translate(0,26)">
          <g transform="translate(40,0)">
            <text x="80" y="10" text-anchor="middle" font-weight="800" fill="#B0483A">백열등</text>
            <rect x="0" y="18" width="160" height="20" rx="4" fill="#EDE9E0" stroke="#C9BA9B" stroke-width="0.8"/>
            <rect x="0" y="18" width="8" height="20" rx="2" fill="#F3C24E"/>
            <text x="14" y="32" font-size="8" fill="#B4830A" font-weight="800">빛 ~5</text>
            <rect x="8" y="18" width="152" height="20" fill="#E5B8AC" opacity="0.55"/>
            <text x="88" y="32" text-anchor="middle" font-size="8" fill="#B0483A" font-weight="800">열로 흩어짐 ~95</text>
            <text x="80" y="52" text-anchor="middle" font-size="8" fill="#5B6B77">효율 약 5 % — 열 때문에 만지면 뜨겁다</text>
          </g>
          <g transform="translate(260,0)">
            <text x="80" y="10" text-anchor="middle" font-weight="800" fill="#0F6357">LED 등</text>
            <rect x="0" y="18" width="160" height="20" rx="4" fill="#EDE9E0" stroke="#C9BA9B" stroke-width="0.8"/>
            <rect x="0" y="18" width="56" height="20" rx="2" fill="#F3C24E"/>
            <text x="28" y="32" text-anchor="middle" font-size="8" fill="#7A3E14" font-weight="800">빛 ↑↑</text>
            <rect x="56" y="18" width="104" height="20" fill="#CBE8E1" opacity="0.8"/>
            <text x="108" y="32" text-anchor="middle" font-size="8" fill="#0F6357" font-weight="800">열 손실 크게 감소</text>
            <text x="80" y="52" text-anchor="middle" font-size="8" fill="#5B6B77">같은 밝기를 훨씬 적은 전기로</text>
          </g>
          <g transform="translate(235,86)" text-anchor="middle">
            <rect x="-170" y="-16" width="340" height="34" rx="6" fill="#E7F5F1" stroke="#A9D9CE" stroke-width="1"/>
            <text y="-1" font-size="7.6" font-weight="800" fill="#147D6F">효율(%) = 유용하게 사용된 에너지 ÷ 공급한 에너지 × 100</text>
            <text y="12" font-size="8" fill="#5B6B77">효율 ↑ → 연료 절약 → 온실 기체 감축 — 개념 03과 이어진다</text>
          </g>
        </g>
      </g>
    </svg>