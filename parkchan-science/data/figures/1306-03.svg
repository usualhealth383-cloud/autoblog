<svg width="600" height="266" viewBox="0 0 600 266" font-family="PC Sans"><defs><marker id="axP-1306-03" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="266" rx="10" fill="#EEF2FB"/>
      <text x="300" y="20" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">이중나선이 풀리고, 주형 가닥의 짝을 하나씩 붙여 RNA가 자란다 — A의 짝은 T가 아니라 U</text>
      <!-- 왼쪽: 닫힌 이중나선 -->
      <g transform="translate(20,0)">
        <text x="70" y="48" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">DNA 이중나선(닫힘)</text>
        <path d="M0,90 H140" stroke="#4053B8" stroke-width="4"/>
        <path d="M0,150 H140" stroke="#4053B8" stroke-width="4"/>
        <g stroke-width="3" stroke-linecap="round"><path d="M20,96 V144" stroke="#D6455D"/><path d="M50,96 V144" stroke="#147D6F"/><path d="M80,96 V144" stroke="#D9930D"/><path d="M110,96 V144" stroke="#D6455D"/></g>
        <g font-size="13" font-weight="900" text-anchor="middle"><text x="20" y="80" fill="#D6455D">A</text><text x="50" y="80" fill="#147D6F">G</text><text x="80" y="80" fill="#D9930D">C</text><text x="110" y="80" fill="#D6455D">T</text>
        <text x="20" y="168" fill="#D6455D">T</text><text x="50" y="168" fill="#147D6F">C</text><text x="80" y="168" fill="#D9930D">G</text><text x="110" y="168" fill="#D6455D">A</text></g>
        <text x="70" y="192" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">상보결합 — A↔T, G↔C</text>
        <text x="70" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">정해진 짝으로만 결합한다</text>
      </g>
      <path d="M176,120 H206" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1306-03)"/>
      <!-- 오른쪽: 풀린 부분에서 전사 -->
      <g transform="translate(220,0)">
        <rect width="370" height="200" rx="8" fill="#FDFBF7" stroke="#D9DFF5" y="34"/>
        <text x="185" y="50" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">유전자 부분이 풀림 → 주형 가닥 위에서 전사</text>
        <!-- 위 가닥(풀려 올라감) -->
        <path d="M14,110 q40,-46 100,-46 h150 q60,0 92,46" stroke="#4053B8" stroke-width="4" fill="none"/>
                <text x="185" y="78" text-anchor="middle" font-size="13" font-weight="800" fill="#5B6B77">풀린 반대 가닥</text>
        <!-- 주형 가닥 -->
        <path d="M14,164 H356" stroke="#4053B8" stroke-width="4"/>
        <text x="40" y="184" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">주형 가닥</text>
        <g font-size="13" font-weight="900" text-anchor="middle"><text x="110" y="184" fill="#D6455D">T</text><text x="150" y="184" fill="#D6455D">A</text><text x="190" y="184" fill="#D9930D">C</text><text x="230" y="184" fill="#D9930D">C</text><text x="270" y="184" fill="#D6455D">A</text><text x="310" y="184" fill="#D9930D">C</text></g>
        <!-- RNA 가닥 만들어짐 -->
        <path d="M96,122 H286" stroke="#D6455D" stroke-width="4"/>
        <g stroke-width="3" stroke-linecap="round"><path d="M110,126 V158" stroke="#D6455D"/><path d="M150,126 V158" stroke="#D6455D"/><path d="M190,126 V158" stroke="#D9930D"/><path d="M230,126 V158" stroke="#D9930D"/><path d="M270,126 V158" stroke="#D6455D"/></g>
        <g font-size="13" font-weight="900" text-anchor="middle"><text x="110" y="114" fill="#D6455D">A</text><text x="150" y="114" fill="#D6455D">U</text><text x="190" y="114" fill="#D9930D">G</text><text x="230" y="114" fill="#D9930D">G</text><text x="270" y="114" fill="#D6455D">U</text></g>
        <!-- 다음 염기 붙는 중 -->
        <g transform="translate(310,126)"><rect x="-8" y="-24" width="16" height="16" rx="3" fill="#D9930D"/><text x="0" y="-12" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF">G</text><path d="M0,-6 V22" stroke="#D9930D" stroke-width="2" stroke-dasharray="3 2" fill="none" marker-end="url(#axP-1306-03)"/></g>
        <text x="200" y="98" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">RNA (한 가닥) — 주형 가닥의 짝을 하나씩</text>
        <!-- U 강조 -->
        <circle cx="150" cy="110" r="11" fill="none" stroke="#D6455D" stroke-width="1.8" stroke-dasharray="3 2"/>
        <text x="340" y="152" text-anchor="middle" font-size="13" font-weight="900" fill="#D9930D">붙는 중</text>
        <text x="185" y="218" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">주형 가닥 T A C · C A C → RNA A U G · G U G — A의 짝은 U!</text>
      </g>
      <text x="300" y="255" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">완성된 RNA는 한 가닥짜리 짧은 복사본이 되어 핵공을 통해 세포질로 나간다 — 다음 무대는 라이보솜</text>
    </svg>