<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrP-1304-03" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4053B8"/></marker><marker id="axP-1304-03" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#FDFBF7" stroke="#D9DFF5"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#2E3E96">같은 유리컵, 같은 높이 — 시멘트 바닥은 '높고 좁게', 방석은 '낮고 넓게' 받는다. 넓이는 같다</text>
      <!-- 그래프 -->
      <g transform="translate(60,0)">
        <line x1="0" y1="206" x2="300" y2="206" stroke="#5B6B77" stroke-width="1.6" marker-end="url(#axP-1304-03)"/>
        <line x1="0" y1="206" x2="0" y2="38" stroke="#5B6B77" stroke-width="1.6" marker-end="url(#axP-1304-03)"/>
        <text x="-6" y="46" text-anchor="end" font-size="13" font-weight="900" fill="#3A3A3A">힘 F</text>
        <text x="300" y="222" text-anchor="end" font-size="13" font-weight="900" fill="#3A3A3A">시간 t</text>
        <!-- (가) 높고 좁게 -->
        <path d="M30,206 Q50,42 70,206 Z" fill="#D6455D" fill-opacity="0.25" stroke="#D6455D" stroke-width="2.4"/>
        <text x="80" y="92" text-anchor="start" font-size="13.5" font-weight="900" fill="#D6455D">(가) 시멘트 바닥</text>
        <text x="80" y="110" text-anchor="start" font-size="13" font-weight="800" fill="#D6455D">봉우리 높다 = 최대 힘 크다</text>
        <!-- (나) 낮고 넓게 -->
        <path d="M95,206 Q185,120 275,206 Z" fill="#4053B8" fill-opacity="0.22" stroke="#4053B8" stroke-width="2.4"/>
        <text x="185" y="136" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">(나) 푹신한 방석</text>
        <text x="185" y="155" text-anchor="middle" font-size="13" font-weight="800" fill="#2E3E96">봉우리 낮다 = 최대 힘 작다</text>
        <path d="M100,196 H270" stroke="#2E3E96" stroke-width="1.4" fill="none" marker-start="url(#arrP-1304-03)" marker-end="url(#arrP-1304-03)"/>
        <text x="185" y="191" text-anchor="middle" font-size="13" font-weight="800" fill="#2E3E96">폭 넓다 = 시간 길다</text>
        <text x="150" y="240" text-anchor="middle" font-size="13.5" font-weight="900" fill="#3A3A3A">두 그래프 아래 넓이(= 충격량 = 운동량 변화량)는 같다</text>
      </g>
      <!-- 컵 장면 -->
      <g transform="translate(400,40)">
        <rect x="0" y="0" width="90" height="170" rx="6" fill="#F3EDE4" stroke="#D9DFF5"/>
        <text x="45" y="16" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">(가) 시멘트</text>
        <rect x="6" y="130" width="78" height="30" fill="#8A949E"/>
        <text x="45" y="150" text-anchor="middle" font-size="13" font-weight="800" fill="#FDFBF7">단단한 바닥</text>
        <path d="M45,30 V90" stroke="#5B6B77" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#axP-1304-03)"/>
        <!-- 깨진 컵 조각 -->
        <g fill="#BFD8EE" stroke="#5B6B77" stroke-width="1"><path d="M22,128 l10,-16 l8,16 z"/><path d="M40,128 l6,-20 l10,20 z"/><path d="M60,128 l6,-12 l8,12 z"/><path d="M30,112 l6,-8 l4,8 z"/></g>
        <text x="45" y="99" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">깨졌다</text>
      </g>
      <g transform="translate(500,40)">
        <rect x="0" y="0" width="90" height="170" rx="6" fill="#EEF2FB" stroke="#D9DFF5"/>
        <text x="45" y="16" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">(나) 방석</text>
        <path d="M6,160 V140 q39,-22 78,0 V160 z" fill="#F0A275"/>
        <text x="45" y="154" text-anchor="middle" font-size="13" font-weight="800" fill="#FDFBF7">푹신한 방석</text>
        <path d="M45,30 V80" stroke="#5B6B77" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#axP-1304-03)"/>
        <path d="M30,96 h30 l-4,32 h-22 z" fill="#BFD8EE" stroke="#5B6B77" stroke-width="1.2"/>
        <text x="45" y="90" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">멀쩡하다</text>
      </g>
      <text x="495" y="234" text-anchor="middle" font-size="13" font-weight="900" fill="#3A3A3A">가른 것은 충격량이 아니라 최대 힘</text>
    </svg>