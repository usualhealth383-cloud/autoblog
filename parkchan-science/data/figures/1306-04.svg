<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="arrG-1306-04" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#147D6F"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#FFF8E6"/>
      <text x="300" y="20" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">라이보솜이 RNA를 세 글자씩 읽는다 — AUG·GUG·CAU → 메싸이오닌·발린·히스티딘</text>
      <!-- RNA 가닥 -->
      <g transform="translate(20,0)">
        <path d="M0,170 H350" stroke="#D6455D" stroke-width="4"/>
        <!-- 코돈 칸 -->
        <g font-size="13" font-weight="900" text-anchor="middle">
          <rect x="30" y="176" width="90" height="26" rx="4" fill="#FDE3E8" stroke="#D6455D" stroke-width="1.2"/><text x="75" y="194" fill="#D6455D">A U G</text>
          <rect x="130" y="176" width="90" height="26" rx="4" fill="#E3F2EE" stroke="#147D6F" stroke-width="1.2"/><text x="175" y="194" fill="#147D6F">G U G</text>
          <rect x="230" y="176" width="90" height="26" rx="4" fill="#FFF0D6" stroke="#D9930D" stroke-width="1.2"/><text x="275" y="194" fill="#8A4B00">C A U</text>
        </g>
        <text x="75" y="220" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">코돈 1</text>
        <text x="175" y="220" text-anchor="middle" font-size="13" font-weight="900" fill="#147D6F">코돈 2</text>
        <text x="275" y="220" text-anchor="middle" font-size="13" font-weight="900" fill="#8A4B00">코돈 3</text>
        <text x="175" y="238" text-anchor="middle" font-size="13" font-weight="800" fill="#3A3A3A">염기 9개 ÷ 3 = 코돈 3개 = 아미노산 3개</text>
        <!-- 라이보솜 (코돈 2 위) -->
        <g transform="translate(175,140)">
          <ellipse cx="0" cy="10" rx="106" ry="24" fill="#7FA86B" stroke="#147D6F" stroke-width="2"/>
          <ellipse cx="0" cy="-26" rx="46" ry="18" fill="#9BC08A" stroke="#147D6F" stroke-width="2"/>
          <text x="0" y="15" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF">라이보솜 — 코돈을 한 칸씩 읽는다</text>
          <path d="M112,10 H142" stroke="#147D6F" stroke-width="2.4" fill="none" marker-end="url(#arrG-1306-04)"/>
          <text x="126" y="0" text-anchor="middle" font-size="13" font-weight="800" fill="#147D6F">이동</text>
        </g>
        <!-- 아미노산 사슬 -->
        <g transform="translate(175,74)">
          <ellipse cx="-100" cy="0" rx="42" ry="16" fill="#D6455D"/><text x="-100" y="4.5" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF">메싸이오닌</text>
          <path d="M-58,0 H-26" stroke="#8A4B00" stroke-width="3"/>
          <ellipse cx="0" cy="0" rx="26" ry="16" fill="#147D6F"/><text x="0" y="4.5" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF">발린</text>
          <path d="M26,0 H62" stroke="#8A4B00" stroke-width="3" stroke-dasharray="4 3"/>
          <ellipse cx="100" cy="0" rx="38" ry="16" fill="#D9930D"/><text x="100" y="4.5" text-anchor="middle" font-size="13" font-weight="900" fill="#FFF">히스티딘</text>
          <text x="0" y="-26" text-anchor="middle" font-size="13" font-weight="900" fill="#8A4B00">아미노산이 줄줄이 이어진다 → 접히면 단백질</text>
          <path d="M100,18 V44" stroke="#D9930D" stroke-width="1.6" stroke-dasharray="3 2" fill="none"/>
        </g>
      </g>
      <!-- 코돈표(일부) -->
      <g transform="translate(384,40)">
        <rect width="208" height="170" rx="8" fill="#FDFBF7" stroke="#D9DFF5"/>
        <text x="104" y="19" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">코돈표(일부) — RNA 기준</text>
        <line x1="12" y1="27" x2="196" y2="27" stroke="#D9DFF5"/>
        <g font-size="13" font-weight="800"><text x="40" y="48" fill="#D6455D">AUG</text><text x="100" y="48" fill="#3A3A3A">메싸이오닌</text>
        <text x="40" y="72" fill="#147D6F">GUG</text><text x="100" y="72" fill="#3A3A3A">발린</text>
        <text x="40" y="96" fill="#8A4B00">CAU</text><text x="100" y="96" fill="#3A3A3A">히스티딘</text></g>
        <text x="104" y="124" text-anchor="middle" font-size="13" font-weight="800" fill="#5B6B77">4 × 4 × 4 = 64가지</text>
        <text x="104" y="142" text-anchor="middle" font-size="13" font-weight="800" fill="#5B6B77">아미노산 20종을 지정하고도 남는다</text>
        <text x="104" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#D6455D">표는 DNA가 아니라 RNA로 찾는다</text>
      </g>
    </svg>