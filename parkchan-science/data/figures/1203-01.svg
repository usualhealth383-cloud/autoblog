<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans">
      <rect width="600" height="256" rx="10" fill="#FDFBF7"/>
      <text x="20" y="20" font-size="12.5" font-weight="900" fill="#0F6357">주기율표의 뼈대 — 세로줄이 족, 가로줄이 주기. 세 기둥(1족·17족·18족)을 잡는다</text>
      <!-- 주기율표 축소판: 18열 × 4주기 -->
      <g transform="translate(24,44)">
        <!-- 열 번호 -->
        <g font-size="8" font-weight="800" fill="#5B6B77" text-anchor="middle">
          <text x="10" y="-4">1</text><text x="30" y="-4">2</text><text x="250" y="-4">13</text><text x="270" y="-4">14</text><text x="290" y="-4">15</text><text x="310" y="-4">16</text><text x="330" y="-4">17</text><text x="350" y="-4">18</text>
        </g>
        <!-- 1주기 -->
        <rect x="0" y="0" width="20" height="20" fill="#E7F5F1" stroke="#8A949E" stroke-width="0.8"/><text x="10" y="14" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">H</text>
        <rect x="340" y="0" width="20" height="20" fill="#C9B8EA" stroke="#8A949E" stroke-width="0.8"/><text x="350" y="14" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">He</text>
        <!-- 2주기 -->
        <rect x="0" y="22" width="20" height="20" fill="#F6D27A" stroke="#8A949E" stroke-width="0.8"/><text x="10" y="36" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">Li</text>
        <rect x="20" y="22" width="20" height="20" fill="#F3E4D0" stroke="#8A949E" stroke-width="0.8"/><text x="30" y="36" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">Be</text>
        <g fill="#E9F2FB" stroke="#8A949E" stroke-width="0.8"><rect x="240" y="22" width="20" height="20"/><rect x="260" y="22" width="20" height="20"/><rect x="280" y="22" width="20" height="20"/><rect x="300" y="22" width="20" height="20"/></g>
        <g font-size="9" font-weight="900" fill="#3A3A3A" text-anchor="middle"><text x="250" y="36">B</text><text x="270" y="36">C</text><text x="290" y="36">N</text><text x="310" y="36">O</text></g>
        <rect x="320" y="22" width="20" height="20" fill="#7FD6C6" stroke="#8A949E" stroke-width="0.8"/><text x="330" y="36" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">F</text>
        <rect x="340" y="22" width="20" height="20" fill="#C9B8EA" stroke="#8A949E" stroke-width="0.8"/><text x="350" y="36" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">Ne</text>
        <!-- 3주기 -->
        <rect x="0" y="44" width="20" height="20" fill="#F6D27A" stroke="#8A949E" stroke-width="0.8"/><text x="10" y="58" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">Na</text>
        <rect x="20" y="44" width="20" height="20" fill="#F3E4D0" stroke="#8A949E" stroke-width="0.8"/><text x="30" y="58" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">Mg</text>
        <g fill="#E9F2FB" stroke="#8A949E" stroke-width="0.8"><rect x="240" y="44" width="20" height="20"/><rect x="260" y="44" width="20" height="20"/><rect x="280" y="44" width="20" height="20"/><rect x="300" y="44" width="20" height="20"/></g>
        <g font-size="9" font-weight="900" fill="#3A3A3A" text-anchor="middle"><text x="250" y="58">Al</text><text x="270" y="58">Si</text><text x="290" y="58">P</text><text x="310" y="58">S</text></g>
        <rect x="320" y="44" width="20" height="20" fill="#7FD6C6" stroke="#8A949E" stroke-width="0.8"/><text x="330" y="58" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">Cl</text>
        <rect x="340" y="44" width="20" height="20" fill="#C9B8EA" stroke="#8A949E" stroke-width="0.8"/><text x="350" y="58" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">Ar</text>
        <!-- 4주기 -->
        <rect x="0" y="66" width="20" height="20" fill="#F6D27A" stroke="#8A949E" stroke-width="0.8"/><text x="10" y="80" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">K</text>
        <rect x="20" y="66" width="20" height="20" fill="#F3E4D0" stroke="#8A949E" stroke-width="0.8"/><text x="30" y="80" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">Ca</text>
        <g fill="#F3E4D0" stroke="#8A949E" stroke-width="0.8"><rect x="40" y="66" width="200" height="20"/></g><text x="140" y="80" text-anchor="middle" font-size="8" font-weight="800" fill="#7A6A45">… 전이 금속 …</text>
        <g fill="#E9F2FB" stroke="#8A949E" stroke-width="0.8"><rect x="240" y="66" width="20" height="20"/><rect x="260" y="66" width="20" height="20"/><rect x="280" y="66" width="20" height="20"/><rect x="300" y="66" width="20" height="20"/></g>
        <g font-size="9" font-weight="900" fill="#3A3A3A" text-anchor="middle"><text x="250" y="80">Ga</text><text x="270" y="80">Ge</text><text x="290" y="80">As</text><text x="310" y="80">Se</text></g>
        <rect x="320" y="66" width="20" height="20" fill="#7FD6C6" stroke="#8A949E" stroke-width="0.8"/><text x="330" y="80" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">Br</text>
        <rect x="340" y="66" width="20" height="20" fill="#C9B8EA" stroke="#8A949E" stroke-width="0.8"/><text x="350" y="80" text-anchor="middle" font-size="9" font-weight="900" fill="#3A3A3A">Kr</text>
        <!-- 주기 라벨 -->
        <g font-size="8" font-weight="800" fill="#5B6B77" text-anchor="end"><text x="-2" y="14">1주기</text><text x="-2" y="36">2주기</text><text x="-2" y="58">3주기</text><text x="-2" y="80">4주기</text></g>
        <!-- 금속/비금속 구역 -->
        <text x="130" y="36" text-anchor="middle" font-size="10" font-weight="900" fill="#B4830A">← 금속 (왼쪽 · 가운데)</text>
        <text x="280" y="106" text-anchor="middle" font-size="10" font-weight="900" fill="#2E6690">비금속 (오른쪽 위) →</text>
        <!-- 세 기둥 표시 -->
        <path d="M10,92 v10" stroke="#B4830A" stroke-width="2"/><path d="M330,92 v10" stroke="#147D6F" stroke-width="2"/><path d="M350,92 v10" stroke="#7B6AAE" stroke-width="2"/>
      </g>
      <!-- 아래: 두 가족 장면 -->
      <g transform="translate(24,166)">
        <rect width="260" height="82" rx="6" fill="#FFF6D6" stroke="#F6D27A" stroke-width="1.2"/>
        <text x="10" y="18" font-size="10.5" font-weight="900" fill="#B4830A">1족 알칼리 금속 — Li · Na · K</text>
        <!-- 석유 병 속 금속 / 물과 반응 -->
        <g transform="translate(34,52)"><path d="M-14,-22 h28 v36 q0,6 -6,6 h-16 q-6,0 -6,-6 z" fill="#F3E4D0" stroke="#8A949E" stroke-width="1"/><rect x="-9" y="-28" width="18" height="6" fill="#8A949E"/><rect x="-9" y="0" width="18" height="10" fill="#C9D3DC"/></g>
        <text x="34" y="76" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3A3A3A">석유 속 보관</text>
        <g transform="translate(110,52)"><path d="M-22,4 q11,-6 22,0 t22,0 v12 h-44 z" fill="#8FC5E6"/><circle cx="0" cy="-2" r="5" fill="#C9D3DC"/><g stroke="#E8940A" stroke-width="2" stroke-linecap="round"><line x1="-8" y1="-12" x2="-12" y2="-18"/><line x1="8" y1="-12" x2="12" y2="-18"/><line x1="0" y1="-14" x2="0" y2="-20"/></g></g>
        <text x="110" y="76" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3A3A3A">물과 격렬히 반응</text>
        <g transform="translate(200,50)"><rect x="-22" y="-8" width="44" height="14" rx="3" fill="#C9D3DC" stroke="#8A949E"/><path d="M-30,-16 l16,10" stroke="#5B6B77" stroke-width="3" stroke-linecap="round"/></g>
        <text x="200" y="76" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3A3A3A">칼로 잘릴 만큼 무르다</text>
      </g>
      <g transform="translate(300,166)">
        <rect width="284" height="82" rx="6" fill="#E7F5F1" stroke="#7FD6C6" stroke-width="1.2"/>
        <text x="10" y="18" font-size="10.5" font-weight="900" fill="#0F6357">17족 할로젠 — F · Cl · Br · I</text>
        <g transform="translate(46,50)"><path d="M-10,-20 h20 v8 l6,6 v18 h-32 v-18 l6,-6 z" fill="#8FC5E6" stroke="#5B6B77" stroke-width="1"/><path d="M-14,4 h28" stroke="#FFFFFF" stroke-width="2"/></g>
        <text x="46" y="76" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3A3A3A">염소 — 수돗물 소독</text>
        <g transform="translate(140,50)"><rect x="-16" y="-14" width="32" height="28" rx="4" fill="#FFFFFF" stroke="#5B6B77" stroke-width="1"/><rect x="-10" y="-8" width="20" height="16" fill="#7FD6C6"/><path d="M-4,-2 h8 M0,-6 v8" stroke="#FFFFFF" stroke-width="2"/></g>
        <text x="140" y="76" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3A3A3A">플루오린 — 충치 예방</text>
        <g transform="translate(232,50)"><path d="M-8,-20 h16 v8 q8,4 8,12 v14 q0,6 -6,6 h-20 q-6,0 -6,-6 v-14 q0,-8 8,-12 z" fill="#B4830A" stroke="#7A6A45" stroke-width="1"/></g>
        <text x="232" y="76" text-anchor="middle" font-size="8.5" font-weight="800" fill="#3A3A3A">아이오딘 — 상처 소독</text>
      </g>
    </svg>