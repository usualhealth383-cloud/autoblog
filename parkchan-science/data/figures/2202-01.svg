<svg width="600" height="261" viewBox="0 0 620 270" font-family="PC Sans"><defs><marker id="arrBig-2202-01" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#147D6F"/></marker><marker id="arrThin-2202-01" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5E8F87"/></marker></defs>
      <defs>
        <linearGradient id="sky1-2202-01" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEEF7"/><stop offset="1" stop-color="#EEF6EF"/></linearGradient>
      </defs>
      <rect x="4" y="4" width="612" height="262" rx="10" fill="url(#sky1-2202-01)"/>
      <rect x="4" y="200" width="612" height="66" rx="10" fill="#CFE3A8"/>
      <rect x="4" y="200" width="612" height="20" fill="#CFE3A8"/>
      <rect x="4" y="256" width="612" height="10" rx="6" fill="#B8946A"/>

      <!-- 범례 -->
      <g font-size="11.5" font-weight="800">
        <line x1="14" y1="24" x2="44" y2="24" stroke="#147D6F" stroke-width="3.2" marker-end="url(#arrBig-2202-01)"/>
        <text x="56" y="28" fill="#0F6357">굵은 화살표 한 줄 = 먹이 사슬</text>
        <line x1="14" y1="44" x2="44" y2="44" stroke="#5E8F87" stroke-width="1.8" marker-end="url(#arrThin-2202-01)"/>
        <text x="56" y="48" fill="#0F6357">가는 화살표까지 모두 = 먹이 그물</text>
        <text x="14" y="68" fill="#5B6B77" font-weight="700">화살표 방향 : 먹히는 생물 → 먹는 생물</text>
      </g>

      <!-- 생물 -->
      <use href="#sy-rice" transform="translate(60,212) scale(1.15)"/>
      <use href="#sy-corn" transform="translate(200,210)"/>
      <use href="#sy-grass" transform="translate(330,214) scale(1.2)"/>
      <use href="#sy-hopper" transform="translate(150,160) scale(1.15)"/>
      <use href="#sy-mouse" transform="translate(300,160) scale(1.15)"/>
      <use href="#sy-frog" transform="translate(240,110) scale(1.1)"/>
      <use href="#sy-snake" transform="translate(370,76) scale(1.05)"/>
      <use href="#sy-hawk" transform="translate(520,40)"/>
      <rect x="436" y="150" width="8" height="58" fill="#A08A6A"/>
      <use href="#sy-owl" transform="translate(440,132)"/>

      <!-- 이름표 -->
      <g font-size="12" font-weight="800" fill="#2B2B2B">
        <text x="60" y="252" text-anchor="middle">벼</text>
        <text x="200" y="252" text-anchor="middle">옥수수</text>
        <text x="330" y="252" text-anchor="middle">풀</text>
        <text x="112" y="152" text-anchor="end">메뚜기</text>
        <text x="322" y="168">들쥐</text>
        <text x="240" y="84" text-anchor="middle">개구리</text>
        <text x="370" y="50" text-anchor="middle">뱀</text>
        <text x="520" y="72" text-anchor="middle">매</text>
        <text x="460" y="140">올빼미</text>
      </g>

      <!-- 먹이 사슬 (굵은 화살표) -->
      <g stroke="#147D6F" stroke-width="3.2" fill="none" marker-end="url(#arrBig-2202-01)" stroke-linecap="round">
        <line x1="76" y1="196" x2="128" y2="170"/>
        <line x1="168" y1="150" x2="218" y2="122"/>
        <line x1="262" y1="100" x2="346" y2="80"/>
        <line x1="392" y1="66" x2="494" y2="46"/>
      </g>
      <!-- 나머지 먹이 관계 (가는 화살표) -->
      <g stroke="#5E8F87" stroke-width="1.8" fill="none" marker-end="url(#arrThin-2202-01)">
        <line x1="186" y1="192" x2="166" y2="174"/>
