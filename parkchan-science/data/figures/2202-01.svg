      <!-- 원인→결과 설명 -->
      <g transform="translate(478,160)">
        <rect width="134" height="54" rx="6" fill="#FFF8E6" stroke="#E8C36A" stroke-width="1"/>
        <text x="67" y="17" text-anchor="middle" font-size="11.5" font-weight="800" fill="#3A3A3A">메뚜기가 줄어도</text>
        <text x="67" y="32" text-anchor="middle" font-size="11.5" font-weight="800" fill="#3A3A3A">올빼미는 들쥐를 먹는다</text>
        <text x="67" y="48" text-anchor="middle" font-size="11.5" font-weight="900" fill="#0F6357">→ 충격이 분산된다</text>
