<svg width="600" height="256" viewBox="0 0 600 256" font-family="PC Sans"><defs><marker id="axP-1305-01" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="256" rx="10" fill="#F3F7F1"/>
      <text x="300" y="20" text-anchor="middle" font-size="12" font-weight="900" fill="#2E3E96">세포 하나가 모든 층의 출발점 — 세포 안에는 설계실·발전소·조립 라인·정문이 다 있다</text>
      <!-- 세포 확대 -->
      <g transform="translate(120,138)">
        <ellipse rx="104" ry="86" fill="#FFF3D6" stroke="#D9930D" stroke-width="3"/>
        <text x="-2" y="-70" text-anchor="middle" font-size="8.5" font-weight="900" fill="#8A4B00">세포막 — 정문(물질 출입 관리)</text>
        <!-- 핵 -->
        <circle cx="-30" cy="-6" r="28" fill="#C9D3EC" stroke="#4053B8" stroke-width="2"/>
        <path d="M-44,-14 q8,-10 18,-2 q6,10 -4,14 q-10,2 -14,-12 z" fill="#4053B8" opacity="0.6"/>
        <text x="-30" y="-2" text-anchor="middle" font-size="9" font-weight="900" fill="#2E3E96">핵</text>
        <text x="-30" y="34" text-anchor="middle" font-size="7.5" font-weight="800" fill="#2E3E96">설계실 — 유전 정보</text>
        <!-- 마이토콘드리아 -->
        <g transform="translate(40,-30) rotate(-20)">
          <ellipse rx="26" ry="12" fill="#F0A275" stroke="#D6455D" stroke-width="1.6"/>
          <path d="M-18,-4 q6,8 12,0 q6,-8 12,0 q6,8 12,0" stroke="#D6455D" stroke-width="1.4" fill="none"/>
        </g>
        <text x="46" y="-50" text-anchor="middle" font-size="8" font-weight="900" fill="#D6455D">마이토콘드리아</text>
        <text x="60" y="-4" text-anchor="middle" font-size="7.5" font-weight="800" fill="#D6455D">발전소 — 에너지 생산</text>
        <!-- 라이보솜 -->
        <g fill="#147D6F"><circle cx="20" cy="30" r="4"/><circle cx="34" cy="40" r="4"/><circle cx="48" cy="26" r="4"/><circle cx="60" cy="42" r="4"/><circle cx="30" cy="56" r="4"/></g>
        <text x="46" y="70" text-anchor="middle" font-size="7.5" font-weight="800" fill="#147D6F">라이보솜 — 조립 라인(단백질)</text>
      </g>
      <text x="120" y="244" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">세포 = 생명의 기본 단위</text>
      <!-- 층층 구조 -->
      <g transform="translate(250,0)">
        <path d="M0,138 H30" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1305-01)"/>
        <!-- 조직: 세포 여러 개 -->
        <g transform="translate(76,138)">
          <g fill="#FFF3D6" stroke="#D9930D" stroke-width="1.4">
            <ellipse cx="-20" cy="-18" rx="16" ry="12"/><ellipse cx="14" cy="-18" rx="16" ry="12"/><ellipse cx="-20" cy="6" rx="16" ry="12"/><ellipse cx="14" cy="6" rx="16" ry="12"/><ellipse cx="-3" cy="28" rx="16" ry="12"/>
          </g>
          <g fill="#4053B8"><circle cx="-20" cy="-18" r="3"/><circle cx="14" cy="-18" r="3"/><circle cx="-20" cy="6" r="3"/><circle cx="14" cy="6" r="3"/><circle cx="-3" cy="28" r="3"/></g>
          <text x="-3" y="58" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">조직</text>
          <text x="-3" y="70" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5B6B77">비슷한 세포의 모임</text>
        </g>
        <path d="M118,138 H148" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1305-01)"/>
        <!-- 기관: 위 -->
        <g transform="translate(196,138)">
          <path d="M-14,-40 q30,-10 34,20 q4,30 -20,36 q-28,4 -22,-24 q2,-22 8,-32 z" fill="#F0A275" stroke="#D6455D" stroke-width="1.8"/>
          <path d="M-10,-24 q18,-2 20,16" stroke="#D6455D" stroke-width="1.2" fill="none"/>
          <text x="0" y="58" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">기관(위)</text>
          <text x="0" y="70" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5B6B77">여러 조직의 모임</text>
        </g>
        <path d="M236,138 H266" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1305-01)"/>
        <!-- 개체: 사람 -->
        <g transform="translate(310,138)" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <circle cy="-40" r="9" fill="#2B2B2B" stroke="none"/><path d="M0,-30 v40 M0,10 l-12,32 M0,10 l12,32 M0,-20 l-16,16 M0,-20 l16,16"/>
        </g>
        <text x="310" y="196" text-anchor="middle" font-size="9.5" font-weight="900" fill="#2E3E96">개체</text>
        <text x="310" y="208" text-anchor="middle" font-size="7.5" font-weight="700" fill="#5B6B77">기관들의 모임</text>
      </g>
      <rect x="250" y="226" width="340" height="22" rx="6" fill="#2E3E96"/>
      <text x="420" y="241" text-anchor="middle" font-size="9.5" font-weight="900" fill="#FFF">세포 → 조직 → 기관 → 개체 — 세포가 쉬지 않고 일해야 시스템이 유지된다</text>
    </svg>