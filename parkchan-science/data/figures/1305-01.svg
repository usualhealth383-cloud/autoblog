<svg width="600" height="272" viewBox="0 0 600 272" font-family="PC Sans"><defs><marker id="axP-1305-01" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#5B6B77"/></marker></defs>
      <rect width="600" height="272" rx="10" fill="#F3F7F1"/>
      <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="900" fill="#2E3E96">세포 하나가 모든 층의 출발점 — 세포 안에는 설계실·발전소·조립 라인·정문이 다 있다</text>
      <!-- 세포 확대 -->
      <g transform="translate(120,146)">
        <ellipse rx="112" ry="96" fill="#FFF3D6" stroke="#D9930D" stroke-width="3"/>
        <text x="0" y="-102" text-anchor="middle" font-size="13" font-weight="900" fill="#8A4B00">세포막 — 정문(물질 출입 관리)</text>
        <!-- 핵 -->
        <circle cx="-34" cy="-20" r="28" fill="#C9D3EC" stroke="#4053B8" stroke-width="2"/>
        <path d="M-48,-28 q8,-10 18,-2 q6,10 -4,14 q-10,2 -14,-12 z" fill="#4053B8" opacity="0.6"/>
        <text x="-34" y="-15.4" text-anchor="middle" font-size="13" font-weight="900" fill="#2E3E96">핵</text>
        <text x="-34" y="23" text-anchor="middle" font-size="13" font-weight="800" fill="#2E3E96">설계실<tspan x="-34" dy="17">유전 정보</tspan></text>
        <!-- 마이토콘드리아 -->
        <g transform="translate(36,-44) rotate(-20)">
          <ellipse rx="26" ry="12" fill="#F0A275" stroke="#D6455D" stroke-width="1.6"/>
          <path d="M-18,-4 q6,8 12,0 q6,-8 12,0 q6,8 12,0" stroke="#D6455D" stroke-width="1.4" fill="none"/>
        </g>
        <text x="22" y="-66" text-anchor="middle" font-size="13" font-weight="900" fill="#D6455D">마이토콘드리아</text>
        <text x="62" y="-14" text-anchor="middle" font-size="13" font-weight="800" fill="#D6455D">발전소<tspan x="62" dy="17">에너지 생산</tspan></text>
        <!-- 라이보솜 -->
        <g fill="#147D6F"><circle cx="16" cy="24" r="4"/><circle cx="30" cy="34" r="4"/><circle cx="44" cy="20" r="4"/><circle cx="56" cy="36" r="4"/><circle cx="26" cy="50" r="4"/></g>
        <text x="2" y="70" text-anchor="middle" font-size="13" font-weight="800" fill="#147D6F">라이보솜<tspan x="2" dy="17">조립 라인(단백질)</tspan></text>
      </g>
      <text x="120" y="264" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">세포 = 생명의 기본 단위</text>
      <!-- 층층 구조 -->
      <g transform="translate(244,-16)">
        <path d="M0,138 H22" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1305-01)"/>
        <!-- 조직: 세포 여러 개 -->
        <g transform="translate(62,138)">
          <g fill="#FFF3D6" stroke="#D9930D" stroke-width="1.4">
            <ellipse cx="-17" cy="-18" rx="14" ry="11"/><ellipse cx="13" cy="-18" rx="14" ry="11"/><ellipse cx="-17" cy="4" rx="14" ry="11"/><ellipse cx="13" cy="4" rx="14" ry="11"/><ellipse cx="-2" cy="25" rx="14" ry="11"/>
          </g>
          <g fill="#4053B8"><circle cx="-17" cy="-18" r="3"/><circle cx="13" cy="-18" r="3"/><circle cx="-17" cy="4" r="3"/><circle cx="13" cy="4" r="3"/><circle cx="-2" cy="25" r="3"/></g>
          <text x="0" y="56" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">조직</text>
          <text x="0" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">비슷한<tspan x="0" dy="17">세포의 모임</tspan></text>
        </g>
        <path d="M100,138 H118" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1305-01)"/>
        <!-- 기관: 위 -->
        <g transform="translate(150,138)">
          <path d="M-14,-40 q30,-10 34,20 q4,30 -20,36 q-28,4 -22,-24 q2,-22 8,-32 z" fill="#F0A275" stroke="#D6455D" stroke-width="1.8"/>
          <path d="M-10,-24 q18,-2 20,16" stroke="#D6455D" stroke-width="1.2" fill="none"/>
          <text x="0" y="56" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">기관(위)</text>
          <text x="0" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">여러 조직의<tspan x="0" dy="17">모임</tspan></text>
        </g>
        <path d="M182,138 H200" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1305-01)"/>
        <!-- 기관계: 소화계 -->
        <g transform="translate(236,138)">
          <path d="M-6,-50 v16" stroke="#D6455D" stroke-width="3" stroke-linecap="round"/>
          <path d="M-10,-34 q18,-6 20,10 q2,14 -12,16 q-12,0 -8,-12 z" fill="#F0A275" stroke="#D6455D" stroke-width="1.4"/>
          <path d="M-16,-2 q0,-6 8,-6 h16 q8,0 8,6 q0,6 -8,6 h-16 q-8,0 -8,6 q0,6 8,6 h16 q8,0 8,6 q0,6 -8,6 h-12" fill="none" stroke="#D9930D" stroke-width="3" stroke-linecap="round"/>
          <text x="0" y="56" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">기관계(소화계)</text>
          <text x="0" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">함께 일하는<tspan x="0" dy="17">기관들</tspan></text>
        </g>
        <path d="M272,138 H290" stroke="#5B6B77" stroke-width="2.2" fill="none" marker-end="url(#axP-1305-01)"/>
        <!-- 개체: 사람 -->
        <g transform="translate(320,138)" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <circle cy="-40" r="9" fill="#2B2B2B" stroke="none"/><path d="M0,-30 v40 M0,10 l-12,32 M0,10 l12,32 M0,-20 l-16,16 M0,-20 l16,16"/>
        </g>
        <text x="320" y="194" text-anchor="middle" font-size="13.5" font-weight="900" fill="#2E3E96">개체</text>
        <text x="320" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#5B6B77">기관계들의<tspan x="320" dy="17">모임</tspan></text>
      </g>
      <text x="420" y="238" text-anchor="middle" font-size="13" font-weight="900" fill="#147D6F">식물: 세포 → 조직 → 조직계 → 기관 → 개체 (기관계가 없다)</text>
      <rect x="250" y="246" width="340" height="24" rx="6" fill="#2E3E96"/>
      <text x="420" y="263" text-anchor="middle" font-size="13.5" font-weight="900" fill="#FFF">동물: 세포 → 조직 → 기관 → 기관계 → 개체</text>
    </svg>