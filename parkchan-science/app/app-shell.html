.fv .bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--hair);font-size:var(--t-small);font-weight:700}
.fv .bar button{background:var(--hair);border:none;border-radius:var(--r-s);padding:8px 12px;font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit;margin-left:6px}
.fv .stage{flex:1;overflow:hidden;touch-action:none;position:relative;display:grid;place-items:center;background:var(--card)}
.fv .stage svg{max-width:100%;height:auto;transform-origin:0 0;user-select:none}
.fv .cap{padding:10px 16px max(14px,var(--sab));font-size:var(--t-cap);color:var(--muted);line-height:1.6;border-top:1px solid var(--hair)}

/* 탭바 */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;border-top:1px solid var(--hair);background:var(--card);
  padding:9px 0 max(11px,var(--sab));z-index:20}
.tab{flex:1;text-align:center;font-size:var(--t-tab);color:var(--faint);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:2px 0}
.tab.on{color:var(--brand)}
.tab svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fine{font-size:var(--t-tab);color:var(--faint);text-align:center;line-height:1.7;padding:8px 10px 0}
.nextup{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 0 13px}
.nextup.one{grid-template-columns:1fr}
.nextup button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:72px;justify-content:center}
.nextup .t{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.35}
.nextup .d{font-size:11.5px;color:var(--muted);line-height:1.4}
.donebar{background:var(--brand-soft);color:var(--brand-dark);border-radius:14px;padding:14px;text-align:center;font-size:14px;font-weight:800;margin-bottom:13px}
/* 오늘의 한 마디 */
.qsay{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);padding:18px 18px 12px;margin:0 0 12px;position:relative}
.qsay .k{display:block;font-size:var(--t-cap);font-weight:700;letter-spacing:0;color:var(--muted);margin-bottom:13px}
.qsay blockquote{font-family:var(--serif);font-size:var(--t-stem);line-height:1.9;color:var(--ink);letter-spacing:-.01em;font-weight:400;margin:0 0 13px}
.qsay .orig{font-size:var(--t-tab);color:var(--faint);line-height:1.65;margin:-7px 0 12px}
.qsay .by{display:flex;flex-direction:column;gap:1px;margin-bottom:2px}
.qsay .by .who{font-size:var(--t-small);font-weight:700;color:var(--body)}
.qsay .by .role{font-size:var(--t-tab);color:var(--muted)}
.qsay .src{font-size:var(--t-tab);color:var(--faint);line-height:1.65;margin-top:6px}
.qsay .src a{color:var(--faint)}
.qsay .note{background:var(--brand-soft);border-radius:var(--r-m);padding:11px 13px;font-size:var(--t-small);line-height:1.75;color:var(--brand-dark);margin-top:13px}
.qsay .acts{display:flex;gap:8px;margin-top:14px;border-top:1px solid var(--hair);padding-top:11px}
.qsay .acts button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;font-size:var(--t-cap);font-weight:700;
  color:var(--muted);background:none;border:1px solid var(--line);border-radius:var(--r-s);cursor:pointer}
.qsay .acts button.on{color:var(--brand);border-color:var(--brand-line);background:var(--brand-soft)}
.qsay .acts svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.qsay .acts button.on svg{fill:currentColor;stroke:none}
.staff{display:inline-block;margin-left:5px;font-size:var(--t-tab);font-weight:900;color:var(--on-color);background:var(--brand);border-radius:var(--r-s);padding:1px 6px;vertical-align:1px}
.cm.staffc{border-left:3px solid var(--brand);padding-left:10px}
.newc{display:inline-block;font-size:var(--t-tab);font-weight:900;color:var(--brand-dark);background:var(--brand-soft);border-radius:var(--r-pill);padding:2px 9px;margin:6px 0 2px}
.tab{position:relative}
.tdot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#C2410C;box-shadow:0 0 0 2px var(--card)}
.consent{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:var(--r-l);padding:14px 16px;margin:0 0 14px;word-break:keep-all}
.consent .t{font-size:var(--t-small);font-weight:900;color:var(--brand-dark);margin-bottom:3px}
.consent .d{font-size:var(--t-cap);line-height:1.65;color:var(--body);margin-bottom:10px}
.consent .r{display:flex;gap:8px;flex-wrap:wrap}
.consent .r .btn{flex:1;min-width:140px;margin:0;padding:11px 12px;font-size:var(--t-small)}
.cst{font-size:var(--t-tab);font-weight:700;border-radius:var(--r-pill);padding:3px 9px;white-space:nowrap}
.cst.wait{color:var(--warn);background:var(--warn-soft,rgba(138,100,8,.1))}
.cst.ok{color:var(--brand-dark);background:var(--brand-soft)}
.todaysched{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);
  padding:12px 14px;margin-bottom:12px;cursor:pointer;text-align:left}
.todaysched .l{flex:1;min-width:0;font-size:var(--t-cap);font-weight:700;color:var(--body);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.todaysched .l i{font-style:normal;color:var(--faint);font-weight:700}
.todaysched .dd{flex:0 0 auto;font-size:var(--t-cap);font-weight:900;color:var(--brand);background:var(--brand-soft);border-radius:var(--r-pill);padding:5px 10px;font-variant-numeric:tabular-nums}
.qbridge{background:var(--u-soft);border-radius:var(--r-m);padding:12px 14px;margin:14px 0 0;font-size:var(--t-small);line-height:1.75;color:var(--body)}
.qbridge b{display:block;font-size:var(--t-cap);font-weight:700;letter-spacing:0;color:var(--u-dark);margin-bottom:5px}
.qlist blockquote{font-family:var(--serif);font-size:var(--t-body);line-height:1.8;color:var(--ink);margin:0 0 6px}
.qlist .row{border-bottom:1px solid var(--hair);padding:14px 0}
.qlist .row:last-child{border-bottom:none}
.qlist .m{font-size:var(--t-tab);color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
.qlist .m button{background:none;border:none;color:var(--faint);font-size:var(--t-tab);cursor:pointer;text-decoration:underline;padding:4px}
/* 이야기 (커뮤니티) */
.netbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--sab));width:calc(100% - 36px);max-width:404px;
  display:flex;align-items:center;gap:9px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r-m);padding:11px 13px;z-index:30}
.netbar svg{width:17px;height:17px;flex:0 0 auto;stroke:var(--warn);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.netbar span{flex:1;min-width:0;font-size:var(--t-cap);font-weight:700;color:var(--warn);line-height:1.5}
.netbar button{flex:0 0 auto;font-size:var(--t-cap);font-weight:700;color:var(--warn);background:none;border:1px solid var(--warn);border-radius:var(--r-s);padding:7px 11px;cursor:pointer;min-height:34px}
.loadfail{background:var(--card);border:1px dashed var(--line);border-radius:var(--r-m);padding:22px 16px;text-align:center;margin-bottom:12px}
.loadfail p{font-size:var(--t-small);color:var(--muted);line-height:1.8;margin-bottom:12px}
.tsafe{background:var(--brand-soft);border-radius:var(--r-m);padding:11px 13px;margin-bottom:12px;font-size:var(--t-tab);line-height:1.7;color:var(--brand-dark)}
.tsafe b{font-weight:900}
.pcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);padding:14px 15px;margin-bottom:9px;cursor:pointer}
.pcard .h{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.pcard .bd{font-size:var(--t-tab);font-weight:700;letter-spacing:0;color:var(--on-color);background:var(--u);border-radius:var(--r-s);padding:2px 7px}
.pcard .bd.qna{background:#4053B8}.pcard .bd.share{background:#C1521E}.pcard .bd.talk{background:var(--brand)}
.pcard .ok{font-size:var(--t-tab);font-weight:900;color:var(--brand-dark);background:var(--brand-soft);border-radius:var(--r-s);padding:2px 7px}
.pcard .t{font-size:var(--t-body);font-weight:700;color:var(--ink);line-height:1.45;letter-spacing:-.01em;margin-bottom:4px}
.pcard .x{font-size:var(--t-cap);color:var(--muted);line-height:1.6;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .m{display:flex;gap:12px;font-size:var(--t-tab);color:var(--faint);margin-top:9px;align-items:center}
.pcard .m span{display:inline-flex;align-items:center;gap:4px}
.pcard .m svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pcard.hidden{opacity:.55}
.pfull{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);padding:17px 16px;margin-bottom:12px}
.pfull h2{font-size:var(--t-h2);font-weight:900;line-height:1.4;letter-spacing:-.02em;margin:8px 0 8px}
.pfull .body{font-size:var(--t-body);line-height:1.9;color:var(--body);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.pfull .meta{font-size:var(--t-tab);color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.attachcard{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--ground);border:1px solid var(--hair);border-radius:var(--r-m);padding:12px 13px;margin-top:13px;cursor:pointer}
.attachcard .k{font-size:var(--t-tab);font-weight:700;letter-spacing:0;color:var(--u)}
.attachcard b{display:block;font-size:var(--t-small);font-weight:700;color:var(--ink);margin-top:2px;line-height:1.4}
.attachcard small{display:block;font-size:var(--t-tab);color:var(--muted);margin-top:1px}
.prow{display:flex;gap:8px;margin-bottom:14px}
.prow button{flex:1;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:var(--t-cap);font-weight:700;
  color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);cursor:pointer}
.prow button.on{color:var(--brand);border-color:var(--brand-line);background:var(--brand-soft)}
.prow svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.prow button.on svg{fill:currentColor;stroke:none}
.cm{border-top:1px solid var(--hair);padding:14px 0}
.cm:first-child{border-top:none}

.cm .picked{font-size:var(--t-tab);font-weight:900;color:var(--on-color);background:var(--brand);border-radius:var(--r-s);padding:2px 7px}
.cm .body{font-size:var(--t-small);line-height:1.8;color:var(--body);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.cm .a{display:flex;gap:12px;margin-top:7px;font-size:var(--t-tab)}
.cm .a button{background:none;border:none;color:var(--faint);font-size:var(--t-tab);cursor:pointer;padding:5px 0;min-height:32px}

.cwrite{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.cwrite textarea{flex:1;min-height:46px;max-height:140px;border:1.5px solid var(--line);border-radius:var(--r-m);padding:12px 13px;font-family:inherit;font-size:var(--t-small);line-height:1.7;background:var(--card);color:var(--ink);resize:vertical}
.cwrite button{flex:0 0 auto;min-height:46px;padding:0 16px;font-size:var(--t-small);font-weight:700;background:var(--brand);color:var(--on-color);border:none;border-radius:var(--r-m);cursor:pointer}
.fbref{font-size:var(--t-cap);line-height:1.6;background:var(--paper,var(--bg));border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px;margin-bottom:10px;color:var(--ink);word-break:keep-all}
.fbref span{display:block;font-size:var(--t-tab);font-weight:700;color:var(--faint)}
.fbcount{text-align:right;font-size:var(--t-tab);color:var(--faint);margin:-4px 2px 10px;font-variant-numeric:tabular-nums}
.flag{display:block;margin:4px auto 14px;background:none;border:none;font:inherit;font-size:var(--t-cap);font-weight:700;color:var(--faint);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 10px;min-height:36px}
.fbrow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.fbrow:first-of-type{border-top:none}
.fbrow .b{flex:1;min-width:0;font-size:var(--t-small);line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.fbrow .m{display:block;font-size:var(--t-tab);color:var(--faint);margin-top:3px}
.fbrow.done .b{color:var(--faint)}
.fbrow .kd{display:inline-block;font-size:var(--t-tab);font-weight:700;border-radius:var(--r-pill);padding:2px 8px;margin-right:6px;background:var(--brand-soft);color:var(--brand-dark)}
.fbrow .kd.care{background:var(--warn-soft,rgba(138,100,8,.1));color:var(--warn)}
sup,sub{font-size:.72em;line-height:0;position:relative;vertical-align:baseline}sup{top:-.5em}sub{bottom:-.2em}
figure svg,.qfig svg,.fv .stage svg{font-family:var(--sans,'Noto Sans KR',sans-serif)}   /* 그림 속 글자 — 정의 안 된 'PC Sans' 대신 앱 글꼴(바탕체로 떨어지던 것) */
/* 어두운 화면: 그림 밑에 밝은 종이(--figplate)를 깔았으니, 앱 글자색을 따라가는 그림 글자(currentColor·var(--ink))도 종이 위 진한 색으로 */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) figure svg, :root:not([data-theme="light"]) .qfig svg, :root:not([data-theme="light"]) .fv .stage svg{filter:brightness(.92) saturate(.95);color:#1E2A2E;--ink:#1E2A2E;--body:#3A484D;--muted:#566268;--faint:#5E6B70;--line:#E2DED6} }
:root[data-theme="dark"] figure svg,:root[data-theme="dark"] .qfig svg,:root[data-theme="dark"] .fv .stage svg{filter:brightness(.92) saturate(.95);color:#1E2A2E;--ink:#1E2A2E;--body:#3A484D;--muted:#566268;--faint:#5E6B70;--line:#E2DED6}
figure.zoomable{position:relative}
figure.zoomable .zbtn{position:absolute;right:8px;top:8px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:7px 11px;min-height:34px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);pointer-events:none}
/* 누르는 자리 넓히기 — 보이는 크기는 그대로, 손가락이 닿는 범위만 44px 가까이(2026-10-01 점검: 출석 체크 29px · 빈칸 27px 등) */
button.pill,.notice button,.mini,.chipbar button,button.blank{position:relative}
button.pill::before,.notice button::before,.mini::before,.chipbar button::before,button.blank::before{content:"";position:absolute;left:-4px;right:-4px;top:-8px;bottom:-8px}
#pLike,.cm .acts button{white-space:nowrap}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.piiwarn{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r-m);padding:12px 13px;margin-bottom:10px;font-size:var(--t-cap);line-height:1.7;color:var(--warn)}
.needlogin{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);padding:26px 18px;text-align:center;margin-bottom:12px}
.needlogin p{font-size:var(--t-small);color:var(--muted);line-height:1.8;margin-bottom:14px}
/* 일정 */
.dday{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);padding:20px 18px;margin-bottom:12px;box-shadow:var(--shadow);text-align:center}
.dday .k{font-size:var(--t-cap);font-weight:700;color:var(--muted)}
.dday .v{font-size:var(--t-num);font-weight:900;letter-spacing:-.03em;color:var(--brand);line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.dday .v.past{color:var(--muted)}
.dday .d{font-size:var(--t-cap);color:var(--muted)}
.dday .others{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px;border-top:1px solid var(--hair);padding-top:12px}
.dday .others button{font-size:var(--t-tab);font-weight:700;color:var(--body);background:var(--ground);border:none;border-radius:var(--r-pill);padding:7px 12px;cursor:pointer;min-height:34px}
.dday .others button.on{background:var(--brand);color:var(--on-color)}
.wdbar{display:flex;gap:5px;margin-bottom:11px}
.wdbar button{flex:1;min-height:52px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-m);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--t-cap);font-weight:700;color:var(--muted);padding:6px 0}
.wdbar button i{font-style:normal;font-size:var(--t-tab);color:var(--faint);font-variant-numeric:tabular-nums}
.wdbar button.on{background:var(--brand);border-color:var(--brand);color:var(--on-color)}
.wdbar button.on i{color:var(--on-color);opacity:.8}
.wdbar button.has::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--brand);display:block}
.wdbar button.on.has::after{background:var(--on-color)}
.slot{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--hair);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;cursor:pointer}
.slot:last-child{border-bottom:none}
.slot .t{flex:0 0 62px;font-size:var(--t-tab);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5;padding-top:1px}
.slot .bar{flex:0 0 3px;align-self:stretch;border-radius:var(--r-pill);background:var(--brand);min-height:34px}
.slot .b{flex:1;min-width:0}
.slot .b b{display:block;font-size:var(--t-body);font-weight:700;color:var(--ink);line-height:1.4}
.slot .b small{display:block;font-size:var(--t-cap);color:var(--muted);margin-top:2px;line-height:1.5}
.slot .dd{flex:0 0 auto;font-size:var(--t-tab);font-weight:900;color:var(--brand);font-variant-numeric:tabular-nums;align-self:center}
.slot .dd.soon{color:var(--no)}
.tagdot{display:inline-block;width:7px;height:7px;border-radius:var(--r-pill);margin-right:5px;vertical-align:1px}
.planempty{font-size:var(--t-small);color:var(--muted);line-height:1.8;padding:16px 2px;text-align:center}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fgrid.one{grid-template-columns:1fr}
.sheet .fld label,.codebox .fld label{display:block;font-size:var(--t-cap);font-weight:700;color:var(--muted);margin:0 0 5px 2px}
.sheet input,.sheet select,.sheet textarea,.codebox .fld input,.codebox .fld select{min-height:44px;width:100%;border:1.5px solid var(--line);border-radius:var(--r-s);padding:12px 13px;font-size:var(--t-body);font-family:inherit;background:var(--card);color:var(--ink)}
.sheet textarea{min-height:70px;resize:vertical;font-size:var(--t-small);line-height:1.7}
.daypick{display:flex;gap:5px;margin-bottom:10px}
.daypick button{flex:1;min-height:42px;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-s);font-size:var(--t-small);font-weight:700;color:var(--muted);cursor:pointer}
.daypick button.on{background:var(--brand);border-color:var(--brand);color:var(--on-color)}
.scopebox{background:var(--brand-soft);border-radius:var(--r-m);padding:12px 13px;margin-bottom:10px}
.scopebox .h{font-size:var(--t-cap);font-weight:700;letter-spacing:0;color:var(--brand-dark);margin-bottom:7px}
.scopebox p{font-size:var(--t-cap);color:var(--brand-dark);line-height:1.6;margin-bottom:8px}
.fromacademy{display:inline-block;font-size:var(--t-tab);font-weight:700;color:var(--brand-dark);background:var(--brand-soft);border-radius:var(--r-s);padding:2px 6px;margin-left:6px;vertical-align:1px}
.qhint{font-size:var(--t-cap);color:var(--faint);text-align:center;line-height:1.85;margin-top:18px;padding:14px 12px;border-top:1px solid var(--hair)}
.qhint b{color:var(--muted)}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;font-size:var(--t-cap);font-weight:700;padding:12px 4px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;min-height:44px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:var(--on-color)}
/* 원장 탭 8개 — 한 줄에 다 넣으면 글자가 넘쳐 두 줄(4칸)로 */
.seg.adm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.adm button{padding:10px 2px}
/* 원장 › 과제 내기 */
.afk{margin-bottom:10px}
.afk>.k{display:block;font-size:var(--t-tab);font-weight:700;color:var(--muted);margin-bottom:6px}
.afk .chipbar button{min-height:36px}
.afk select{width:100%}
.afsum{font-size:var(--t-cap);line-height:1.65;color:var(--body);background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-s);padding:9px 11px;margin:2px 0 4px;word-break:keep-all}
.afsum b{color:var(--ink)}
.apick{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:220px;overflow:auto;padding:2px}
.apick label{display:flex;align-items:center;gap:7px;font-size:var(--t-small);font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 9px;min-height:44px;cursor:pointer;background:var(--paper)}
.apick label small{font-size:var(--t-tab);color:var(--muted);font-weight:700;margin-left:auto}
.apick input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--brand)}
.asgsentrow .r em.miss{font-style:normal;color:var(--warn);font-weight:700}
.asgsentrow .r .mini{min-height:36px}
.asgrow{align-items:center;gap:10px}
.asgrow .k small{color:var(--faint)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-size:var(--t-small);font-weight:700;cursor:pointer;padding:10px 8px 14px 0;margin-left:-2px;min-height:44px}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(20,30,34,.42);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:var(--r-l) var(--r-l) 0 0;padding:18px 20px max(22px,var(--sab));max-height:88vh;overflow-y:auto}
.sheet .grab{width:38px;height:4px;border-radius:var(--r-pill);background:var(--line);margin:0 auto 16px}

.sheet .f{display:flex;gap:8px;margin-bottom:12px}
.sheet input.big{flex:1;border:1.5px solid var(--line);border-radius:var(--r-m);padding:13px 14px;font-size:var(--t-h1);font-weight:900;letter-spacing:.3em;text-align:center;font-family:inherit;background:var(--paper);color:var(--ink);min-width:0}
.sheet input:focus{outline:2px solid var(--u);outline-offset:-2px}
.sheet .btn{margin-bottom:8px}
.sheet .legal{font-size:var(--t-cap);line-height:1.8;color:var(--body);max-height:52vh;overflow-y:auto;border:1px solid var(--hair);border-radius:var(--r-s);padding:12px;margin-bottom:12px}
.sheet .legal h4{font-size:var(--t-small);margin:10px 0 4px}
.sheet .legal h4:first-child{margin-top:0}
.sheet .legal .meta{color:var(--faint);font-size:var(--t-tab);margin-bottom:6px}
.sheet .legal table{width:100%;border-collapse:collapse;font-size:var(--t-tab);margin:6px 0}
.sheet .legal th,.sheet .legal td{border:1px solid var(--hair);padding:5px 6px;text-align:left;vertical-align:top}
.att-pill{cursor:pointer;border:none}
.att-pill.todo{background:var(--card);border:1.5px dashed var(--u)}

/* 원장 · 보호자 */
.adm-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.adm-h .h-page{margin:0}
.adm-h .who{font-size:var(--t-cap);color:var(--muted)}
.code-big{background:var(--card);border:1.5px solid var(--u);border-radius:var(--r-l);padding:18px;text-align:center;margin-bottom:13px;position:relative;overflow:hidden}
.code-big::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--u)}
.code-big .k{font-size:var(--t-cap);font-weight:700;letter-spacing:0;color:var(--u);margin-bottom:6px}
.code-big .v{font-size:var(--t-num);font-weight:900;letter-spacing:.18em;font-variant-numeric:tabular-nums;line-height:1.1}
.code-big .t{font-size:var(--t-cap);color:var(--muted);margin-top:6px}
.code-big .bar{height:4px;background:var(--hair);border-radius:var(--r-pill);margin-top:12px;overflow:hidden}
.code-big .bar i{display:block;height:100%;background:var(--u);transition:width 1s linear}
.stu{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--hair);font-size:var(--t-small);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.stu .nm{font-weight:700;flex:0 0 58px}
.stu .cd{font-family:ui-monospace,Menlo,monospace;font-size:var(--t-cap);letter-spacing:.08em;color:var(--body);flex:1}
.stu .cd.t{font-family:inherit;letter-spacing:0;font-size:var(--t-cap)}   /* 코드가 아닌 글(반·출석 수)은 고정폭 글꼴로 쓰지 않는다 */
.stu .un{font-size:var(--t-tab);color:var(--faint);flex:0 0 auto}
.stu .st{font-size:var(--t-cap);font-weight:700;flex:0 0 auto}
.stu .st.ok{color:var(--u)}
.stu .st.late{color:var(--warn)}
.stu .st.no{color:var(--faint)}
.mini{font-size:var(--t-tab);font-weight:700;padding:5px 9px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;flex:0 0 auto}
.mini{font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:30px;line-height:1.2}
.mini.pri{background:var(--brand);border-color:var(--brand);color:var(--on-color)}
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:15px;margin-bottom:13px}
.form h3{font-size:var(--t-small);font-weight:900;margin-bottom:10px}
.form .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form input,.form select,.form textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-family:inherit;font-size:var(--t-small);background:var(--paper);color:var(--ink);min-width:0}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--u);outline-offset:-2px}
.form textarea{resize:vertical;min-height:64px;line-height:1.6}
.form .btn{margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:var(--t-cap);font-weight:700;padding:7px 12px;border-radius:var(--r-pill);border:1px solid var(--u-line);background:var(--u-soft);color:var(--u-dark);cursor:pointer}
.sent{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:12px 14px;margin-bottom:9px}
.sent .t{font-size:var(--t-small);font-weight:700;line-height:1.45}
.sent .d{font-size:var(--t-cap);color:var(--muted);margin-top:2px}
.sent .r{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:var(--t-cap)}
.sent .r b{color:var(--u)}
.sent .r a{color:#C1521E;font-weight:700;text-decoration:none}
.issued{background:var(--u-soft);border-radius:var(--r-m);padding:12px 14px;margin-top:10px;font-size:var(--t-small);line-height:1.7}
.issued code{font-family:ui-monospace,Menlo,monospace;font-size:var(--t-stem);font-weight:900;letter-spacing:.14em;color:var(--u-dark)}
.issued a{display:inline-block;margin-top:6px;color:var(--u);font-weight:700}
.tip{font-size:var(--t-cap);color:var(--muted);line-height:1.7;margin:4px 2px 12px}
.kv{display:flex;justify-content:space-between;font-size:var(--t-small);padding:8px 0;border-bottom:1px solid var(--hair)}
.kv:last-child{border:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:var(--t-small);font-weight:700;padding:10px 16px;border-radius:var(--r-pill);z-index:40;box-shadow:var(--shadow);animation:tst 2.4s forwards;max-width:86%;text-align:center}
@keyframes tst{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
</style>

<script>

const CONSENT_BASE = () => (isNative || !/^https?:/.test(location.href)) ? WEB_URL : location.origin + location.pathname.replace(/[^/]*$/, '');

  if (reset) return `<div class="consent" role="note"><div class="t">보호자 번호를 다시 확인해 주세요</div>
    <div class="d">학원에서 확인해 보니, 적어 둔 번호가 학원에 등록된 보호자 번호와 달랐어요. 보호자 휴대전화 번호를 다시 적고 요청을 보내 주세요.${where==='me'?` ${left}일 안에 동의가 없으면 계정이 지워집니다.`:''}</div>

    <div class="r"><button class="btn" id="consentSend">고친 번호로 다시 요청 보내기</button>${where!=='today'?`<button class="btn ghost" id="consentPaper">학원에서 서면으로</button>`:''}</div></div>`;
  if (ACC.guardianHow === 'web' && ACC.guardianAt) return `<div class="consent" role="note"><div class="t">보호자가 동의했어요</div>
    <div class="d">학원에서 보호자께 <b>확인 문자</b>를 보내면 이야기와 진도 저장이 열립니다. 교재와 문제는 지금도 그대로 쓸 수 있어요.</div></div>`;
  return `<div class="consent" role="note"><div class="t">보호자 동의를 기다리고 있어요</div>
    <div class="d">만 14세 미만은 보호자가 동의해야 <b>이야기</b>와 <b>진도 저장</b>이 열립니다. 교재와 문제는 지금도 그대로 쓸 수 있어요.${where==='me'?` ${left}일 안에 동의가 없으면 계정이 지워집니다(개인정보 보호법 제22조의2).`:''}</div>
    <div class="r"><button class="btn" id="consentSend">보호자에게 동의 요청 보내기</button>${where!=='today'?`<button class="btn ghost" id="consentPaper">학원에서 서면으로</button>`:''}</div></div>`; }
async function sendConsent(){
  const pin = document.querySelector('.consent #consentPhone');
  let r; try { r = await DBX.consentRequest(pin ? pin.value : undefined); } catch (e){ toast(e.message); return; }
  if (pin && r.ok) ACC = await DBX.me();
  if (!r.ok){ toast(r.why); return; }
  if (r.done){ ACC = await DBX.me(); show(view); toast('이미 동의가 확인되었습니다'); return; }
  if (r.given){ ACC = await DBX.me(); show(view); toast('보호자가 이미 동의했습니다. 학원 확인 문자를 기다려 주세요'); return; }
  const link = `${CONSENT_BASE()}consent.html?t=${r.token}`, ph = tel(String(r.guardian||'').replace(/^\S+\s*/, ''));
  const body = `[${CFG.academy}] ${ACC.name} 학생이 '하루 한 개념' 앱 가입에 보호자 동의를 요청했습니다. 아래 링크에서 내용을 보고 동의해 주세요(7일).\n${link}`;
  openSheet(`<h3>보호자에게 보내기</h3><p>가입할 때 적은 보호자 연락처${ph?` <b>${esc(ph)}</b>`:''}로 문자를 보냅니다. 보호자가 링크에서 동의하고 학원이 보호자께 확인 문자를 보내면 열립니다.</p>
    ${ph ? `<a class="btn" href="sms:${ph}${/iphone|ipad/i.test(navigator.userAgent)?'&':'?'}body=${encodeURIComponent(body)}" style="text-decoration:none">문자 앱으로 보내기</a>` : ''}
    <button class="btn soft" id="consentCopy" data-t="${esc(body)}">링크 복사 · 카카오톡으로 보내기</button><button class="btn ghost" id="sheetClose">닫기</button>`); }

/* ═══ 학원 과제(벤치마크 ★4) — 원장이 낸 과제를 오늘 화면 카드로(마감 D-n · 진행 n/N) ═══
   푼 것은 이 기기에 먼저 남기고(S.aq) 서버로 보낸다. 망이 끊겼거나 만 14세 미만 보호자 동의 전이면 기기에 둔 채 다음에 다시 보낸다.

/* 서버(다른 기기)에서 받은 진행·제출을 이 기기 기록에 합친다 — 앞선 쪽이 이긴다 */
function mergeAsg(){ const keep = new Set(ASG.map(a => a.id));
  Object.keys(S.aq || {}).forEach(id => { if (!keep.has(id)) delete S.aq[id]; });
  ASG.forEach(a => { const q = aqOf(a.id);
    if (a.submitted_at){ q.ok = a.submitted_at; q.late = !!a.late; q.sub = true; q.i = Math.max(q.i, a.n); delete q.wait; }
    else if ((a.done || 0) > q.i){ q.i = a.done; q.r = a.right || 0; q.s = Math.max(q.s, a.secs || 0); } }); }

  await flushAsg(); }
/* 다 푼 과제를 서버에 낸다(한 번 낸 것은 서버가 다시 바꾸지 않는다) */
async function flushAsg(){ if (asgBusy || !S.auth) return; asgBusy = true;
  try { for (const a of ASG){ const q = (S.aq || {})[a.id]; if (!q || !q.sub || q.ok) continue;
      const r = await DBX.assignSave(a.id, a.n, q.r, q.s, q.w, true).catch(() => ({ ok:false, net:true }));
      if (r && r.ok && r.submitted_at){ q.ok = r.submitted_at; q.late = !!r.late; delete q.wait; a.submitted_at = r.submitted_at; a.late = !!r.late; }
      else q.wait = r && r.consent ? 'consent' : 'net'; }
    saveLocal(); } finally { asgBusy = false; }

  if (el && cur && S.aq[cur]) el.textContent = asgSentText(S.aq[cur]); }

function asgStep(id, i, r, w){ const a = ASG.find(x => x.id === id); if (!a) return; const q = aqOf(id), now = Date.now();
  q.s = Math.round(q.s + Math.min(ASG_GAP, Math.max(0, (now - (asgT[id] || now)) / 1000))); asgT[id] = now;

/* 빈칸 채점 — 칸마다 정확히 맞아야 한다(예전엔 '16'이 정답 '6'을 품어 맞다고 했다). 괄호는 있어도 없어도: '(태양계) 성운'·'s(초)'.
   한 글자 답은 온전한 말도 인정(고 → 고생대). 빈칸이 여럿이면 쉼표로 순서대로(순서가 뜻을 가르는 문제가 있다: 이온, 공유) */
const SSN = { '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-','ⁿ':'n','₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','₊':'+','₋':'-','−':'-' };
/* 첨자는 보통 글자로(10⁻¹⁰ m = 10^-10 m = 10-10m · H⁺ = H+) — 자판으로 위 첨자를 칠 수 없다 */
const bnorm = t => String(t||'').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻ⁿ₀₁₂₃₄₅₆₇₈₉₊₋−]/g, c => SSN[c]).replace(/\^/g,'').replace(/\s+/g,'').replace(/[。．]$|\.$/,'').toLowerCase();
function bvariants(a){ const v = new Set([bnorm(a), bnorm(a).replace(/[()]/g,'')]);
  const pre = String(a).match(/^\((.+?)\)\s*(.+)$/); if (pre){ v.add(bnorm(pre[2])); v.add(bnorm(pre[1] + pre[2])); }
  const post = String(a).match(/^(.+?)\s*\((.+?)\)$/); if (post){ v.add(bnorm(post[1])); v.add(bnorm(post[2])); v.add(bnorm(post[1] + post[2])); }
  return v; }
const bpart = (a, p) => !!p && (bvariants(a).has(p) || (bnorm(a).length === 1 && p.startsWith(bnorm(a)) && p.length <= 4));
function blankCorrect(answer, pick){
  const parts = String(answer||'').split(/\s*,\s*/).filter(Boolean); if (!parts.length) return false;
  if (parts.length === 1) return bpart(parts[0], bnorm(pick));
  let ins = String(pick||'').split(/[,/、]/).map(x => x.trim()).filter(Boolean);
  if (ins.length !== parts.length){ const sp = String(pick||'').trim().split(/\s+/); if (sp.length === parts.length) ins = sp; else return false; }
  return parts.every((a, i) => bpart(a, bnorm(ins[i]))); }
function bankCorrect(q, pick){
  if (q.type==='ox') return pick===q.answer;
  if (q.type==='mc' || q.type==='multi') return +pick===q.answer;
  if (q.type==='blank') return blankCorrect(q.answer, pick);
  return pick==='맞음';
}

        <button class="btn" data-leech="${esc(rk)}">개념 카드 읽기</button><button class="btn ghost" id="leechSkip">이 문제는 건너뛰기</button></div>`; return; }
  let body = '';

      return `<button class="opt ${cls}" data-bp="${n}" ${graded?'disabled':''}><span class="m">${MARKS[i]}</span><span class="tx">${rich(t)}</span>${mk?`<span class="mk">${mk}</span>`:''}</button>`; }).join('')}</div>`;

      <button class="flag" data-report="bank:${esc(q.id)}">문제·해설에 틀린 곳이 있나요?</button>` : ''}`;

/* 합답형 ㄱㄴㄷ 판정 한 줄 — 해설·바로알기 문장의 'ㄱ (옳음) …' · 'ㄴ (틀림 →) …'을 보기마다 나눈다(데이터는 그대로).
   보기 판정은 정답 선지(예: 'ㄱ, ㄴ')에서 다시 맞춰 보고, 보기마다 이유가 하나씩 있고 판정이 정답과 맞을 때만 나눈다 — 아니면 지금처럼 문단으로 */
const JD_MARK = /<b>\s*([ㄱ-ㄹ])\s*\((옳음|틀림)[^)<]*\)\s*<\/b>|<b>\s*([ㄱ-ㄹ])\s*<\/b>\s*\((옳음|틀림)[^)]*\)/g;
function multiSplit(q){
  if (!q || q.type !== 'multi' || !q.answer || !Array.isArray(q.choices)) return null;
  const keys = [...String(q.source||'').matchAll(/(?:^|\n)\s*([ㄱ-ㄹ])\s*\./g)].map(m => m[1]);
  if (keys.length < 2) return null;
  const right = new Set(String(q.choices[q.answer - 1] || '').match(/[ㄱ-ㄹ]/g) || []);
  const seg = {}, lead = [];
  for (const txt of [q.explain || '', q.wrong || '']){
    const ms = [...txt.matchAll(JD_MARK)];
    lead.push(txt.slice(0, ms.length ? ms[0].index : txt.length).trim());
    ms.forEach((m, i) => { const k = m[1] || m[3], ok = (m[2] || m[4]) === '옳음';
      const why = txt.slice(m.index + m[0].length, i + 1 < ms.length ? ms[i + 1].index : txt.length).trim();
      if (seg[k]) seg[k].dup = true; else seg[k] = { ok, why }; });
  }
  if (!keys.every(k => seg[k] && !seg[k].dup && seg[k].why && seg[k].ok === right.has(k))) return null;
  return { lead: lead.filter(Boolean), rows: keys.map(k => ({ k, ...seg[k] })) };
}
/* 해설 칸 — 나뉘면 보기마다 한 줄, 아니면 지금처럼(해설 문단 + 바로알기 상자) */
const jdHtml = sp => `${sp.lead.map(t => `<p>${rich(t)}</p>`).join('')}<div class="jdl" role="list">${sp.rows.map(r => `<div class="jd" role="listitem"><span class="k">${r.k}</span><span class="v ${r.ok ? 'o' : 'x'}">${r.ok ? '옳음' : '틀림'}</span><span class="t">${rich(r.why)}</span></div>`).join('')}</div>`;
function bankAnswer(pick){
  const q = bs.items[bs.i]; if (bs.pick !== null && bs.pick !== '?') return;
  bs.pick = pick; touchDay(); S.bh ||= {};
  if (pick === '?'){ renderBankSession(); return; }             // 서술형: 모범 답안 먼저 보여 주고 자가 채점
  const ok = bankCorrect(q, pick); S.stats.a++; if (ok) S.stats.c++; statDay(ok); if (!q._qz) S.bh[q.id] = ok ? 'o' : 'x';
  if (bs.timed && bs.qt0) (bs.tm ||= [])[bs.i] = Math.round((Date.now() - bs.qt0) / 1000);   // 시험처럼: 문항별 걸린 초
  const conf = q.type === 'essay' ? '' : (bs.conf || ''); (bs.cf ||= [])[bs.i] = conf;
  if (ok) bs.right++; else bs.wrong.push(q);
  if (bs.kind === 'asg') asgStep(bs.asg, bs.i + 1, bs.right, bs.wrong.map(x => x.id));   // 학원 과제: 한 문항마다 진행을 남기고, 끝이면 낸다
  /* 간격 복습 — 문제 은행 오답도 같은 상자에(예전엔 담기만 하고 다시 나오지 않았다) */
  (bs.res ||= [])[bs.i] = q._qz ? srsMark({ l:q._qz.lessonId, n:q._qz.no }, ok, +pick, conf) : srsMark({ b:q.id }, ok, (q.type==='mc'||q.type==='multi')?MARKS[+pick-1]:String(pick), conf);
  save(S); renderBankSession(); window.scrollTo(0, 0); document.querySelector('#v-bank .verdict')?.focus({ preventScroll:true });
}
function pickBank(n){ const pool = bankPool(); const arr = pool.slice(); for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr.slice(0, n); }

/* ═══ 문항 그리기(공통) — 발문 · 그림 · 자료 줄 · 표 · 발문 뒷부분 · <보기>
   대단원 마무리·모의고사 문항은 그림 밖 자료(data: 탐구 과정 줄, table: 표)와 그림 뒤 발문(ask)이 있다.
   figAfter: 교재에서 자료가 그림보다 앞에 있었다. 모의고사·대단원 문항은 발문 뒷부분(ask)이 <보기> 앞에 온다 ═══ */
const qTable = tbs => (tbs||[]).map(rows => `<div class="qtabw" tabindex="0" role="region" aria-label="표"><table class="qtab">${rows.map(r => `<tr>${r.map(([k, v]) => k === 'h' ? `<th>${rich(v)}</th>` : `<td>${rich(v)}</td>`).join('')}</tr>`).join('')}</table></div>`).join('');
function qBody(q, zoom){
  const fig = q.figure ? `<div class="qfig" ${zoom}>${q.figure}</div>` : '';
  const dat = (q.data ? `<div class="qdata">${rich(q.data).replace(/\n/g, '<br>')}</div>` : '') + qTable(q.table);
  const ask = q.ask ? `<p class="ask">${rich(q.ask)}</p>` : '', src = q.source ? `<div class="bogi">${rich(q.source).replace(/\n/g,'<br>')}</div>` : '';

const lessonLabel = id => { const L = LESSONS.find(x => x.id === id); return L ? `${L.unit}-${L.id.slice(2)} ${L.name}` : id; };
const fmtPt = n => String(+(+n || 0).toFixed(1));
const clockText = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(t / 60)}:${pad(t % 60)}`; };

/* ═══ 다시 볼 소단원(처방) — 틀린 문항이 잇는 소단원별로 몇 문항·몇 점을 놓쳤는지, 많이 놓친 곳부터 ═══ */
function rxList(wrongs, ptsOf){
  const m = new Map();

    const e = m.get(l) || { l, n:[], p:0, main:0 }; e.n.push(n); e.p += ptsOf ? ptsOf(q) : 0; if (!j) e.main++; m.set(l, e); }));

    ${rx.map(e => { const c = CONCEPTS.find(x => x.lessonId === e.l);
      return `<div class="rxrow"><div class="b"><span class="t">${esc(lessonLabel(e.l))}</span><span class="s">${e.n.map(n => n + '번').join(' · ')}${ptsOf ? ` · ${fmtPt(e.p)}점` : ''}</span></div>
        <div class="acts">${c ? `<button class="rxbtn" data-cgo="${esc(c.id)}">개념 카드</button>` : ''}<button class="rxbtn" data-drill="${esc(e.l)}">문제 풀기</button></div></div>`; }).join('')}</div>`;
}

/* ═══ 대단원 마무리 · 실전 모의고사 — 문제 탭의 두 갈래(전 범위 이용권) ═══
   대단원 마무리: 단원을 골라 16문항(마무리 12 + 고난도 4), 문제마다 채점, 틀린 문제는 간격 복습 상자에.
   핵심 정리 빈칸 20(선택): 교재 '빈칸으로 다시 쓰기'를 그대로 꺼내 보기.
   실전 모의고사: 25문항 · 50점 · 40분(타이머는 끄거나 잠시 멈출 수 있음). 제출 전에는 채점하지 않는다.
   진도에 남기는 것: S.mk[권] = [{ d 날짜, s 점수, w 틀린 번호들, t 걸린 초 }](최근 10회) · S.ux['1-I'] = [맞힌 수, 문항 수, 날짜] */
let umPick = null;          // 'unit' | 'mock' — 고르는 화면
let mx = null;              // 진행 중 모의고사
const MOCK_MIN = 40, QSEC = 96;
const unitList = () => { const m = new Map(); LESSONS.forEach(l => { const k = l.book + '-' + l.unit; if (!m.has(k)) m.set(k, { key:k, book:l.book, unit:l.unit, name:l.unitName, bookName:l.bookName }); }); return [...m.values()]; };
const umNo = q => +String(q.id).replace(/^.*-[qb]/, '');
/* 모의고사 세 갈래 — 학평형(권별, 그때까지 배운 범위)과 수능형(두 권 전 범위, 융합·자료 해석이 많다). 기록 S.mk 의 열쇠 = k */
const MOCKS = [{ k:'1', book:'1', t:'통합과학 1', s:'고1 학력평가 대비 · 제1회' }, { k:'2', book:'2', t:'통합과학 2', s:'고1 학력평가 대비 · 제1회' }, { k:'s', book:'1+2', round:1, t:'수능 대비 제1회', s:'통합과학 1 · 2 전 범위', hard:true }, { k:'s2', book:'1+2', round:2, t:'수능 대비 제2회', s:'통합과학 1 · 2 전 범위', hard:true }];
const mockOf = k => MOCKS.find(m => m.k === k) || MOCKS[0];
const umItems = (step, book, unit) => { const m = step === 'mock' ? mockOf(book) : null;   // 모의고사는 권·회차로 가른다(수능형 두 회가 같은 book '1+2')
  return BANK.filter(q => q.step === step && q.book === (m ? m.book : book) && (!m || !m.round || (q.round || 1) === m.round) && (!unit || q.unit === unit)).sort((a, b) => umNo(a) - umNo(b)); };
const umLock = what => openSheet(`<h3>${what}는 전 범위에서 열립니다</h3><p>여러 소단원을 엮어 묻는 문제라 전 범위가 열려 있을 때 풀 수 있습니다. <b>학원 코드</b>나 <b>이용권</b>을 등록하면 바로 열립니다.</p><button class="btn" id="goMe">내 정보로 가기</button><button class="btn ghost" id="sheetClose">닫기</button>`);
function startUnit(key, recap){

async function syncNotes(){

    /* 하나가 계속 실패해도(서버가 거절) 나머지는 올린다. 연결이 끊긴 것 같으면(연속 3번) 그만두고 다음에 */

      try { if (n.del) await DBX.noteDel(n.id); else await DBX.noteSave(n); n.dirty = false; netFails = 0; }   // 올리는 동안 고치거나 지우면 새 사본이 들어오므로 그쪽은 dirty 로 남는다

/* ── 스토어 결제(Google Play · 일회성 이용권) — 결제 → 서버가 Google 에 영수증 확인 → 이용권 연장 ── */
const IAP = () => (isNative && SRV && plug('NativePurchases')) || null;
const STORE_PRICE = {}; let pricesAsked = false, buying = false;
async function loadStorePrices(){ const NP = IAP(); if (!NP || pricesAsked) return; pricesAsked = true;
  try { const { products } = await NP.getProducts({ productIdentifiers: CFG.plans.map(p=>p.sku), productType:'inapp' });
    (products||[]).forEach(x => { if (x.identifier && x.priceString) STORE_PRICE[x.identifier] = x.priceString; });
    if (Object.keys(STORE_PRICE).length && view==='plans') renderPlans(); } catch {} }
async function buyPlan(p){
  const NP = IAP();
  if (!NP){ openSheet(`<h3>${esc(p.name)} · ${p.price.toLocaleString()}원</h3><p>이용권 결제는 <b>안드로이드 앱</b>(Google Play)에서 할 수 있습니다. 학원이나 이벤트로 받은 <b>이용권 코드</b>가 있으면 아래 칸에 넣어 바로 열 수 있습니다.</p><button class="btn ghost" id="sheetClose">닫기</button>`); return; }
  if (consentPending()){ openSheet(`<h3>보호자 동의가 먼저 필요합니다</h3><p>만 14세 미만은 보호자 동의가 끝난 뒤에 이용권을 살 수 있습니다. 동의 안내는 오늘 화면 위에 있습니다.</p><button class="btn ghost" id="sheetClose">닫기</button>`); return; }
  if (buying) return; buying = true;
  try {
    // 확인(소비)은 서버만 한다 — 서버가 반영하지 못한 결제(동의 전·검증 실패)는 확인되지 않은 채 남아 Google Play 가 3일 뒤 자동 환불
    const r = await NP.purchaseProduct({ productIdentifier: p.sku, productType:'inapp', quantity:1, appAccountToken: ACC.id, autoAcknowledgePurchases:false });
    if (!r || !r.purchaseToken) throw new Error('결제 정보를 받지 못했습니다. [구매 복원]을 눌러 주세요.');
    toast('결제를 확인하는 중입니다…');
    const v = await DBX.verifyPurchase({ productId:p.sku, purchaseToken:r.purchaseToken, orderId:r.transactionId||'' });
    ACC = await DBX.me(); passErr=''; toast(`${kdate(v.until)}까지 전 범위가 열렸습니다`); renderPlans();
  } catch (err){ let m = String((err && err.message) || err || '');
    if (/pending/i.test(m)) m = '결제가 아직 처리 중입니다(보류 중인 결제). 결제가 끝나면 앱을 열 때 자동으로 이용권이 열립니다.';
    if (!/cancel|취소/i.test(m)) openSheet(`<h3>결제를 마치지 못했습니다</h3><p>${esc(m)}</p><p class="fine" style="text-align:left;padding:0">돈이 빠져나갔는데 열리지 않았다면 [구매 복원]을 누르세요. 같은 결제가 두 번 반영되지는 않습니다.</p><button class="btn" id="iapRestore">구매 복원</button><button class="btn ghost" id="sheetClose">닫기</button>`);
  } finally { buying = false; }
}
/* 구매 복원 — [구매 복원]을 누를 때, 그리고 앱을 켤 때 조용히(quiet) 한 번.
   보류 중이던 결제가 나중에 끝났거나 결제 뒤 연결이 끊겼던 것을 여기서 받는다(확인하지 않은 결제는 Play 가 3일 뒤 자동 환불).
   이미 확인한 영수증은 기기에 적어 두고 다시 보내지 않는다. 다른 계정(가족 폰)으로 산 결제는 세기만 한다 */
async function restorePurchases(quiet){ const NP = IAP(); if (!NP || !ACC) return; if (!quiet){ closeSheet(); toast('스토어에서 결제 내역을 확인합니다…'); }
  let n = 0, fresh = 0, other = 0, last = ''; const doneKey = 'pcs.iap.done.' + ACC.id; let done = []; try { done = JSON.parse(localStorage.getItem(doneKey)) || []; } catch {}
  try { const { purchases } = await NP.getPurchases({ productType:'inapp' });
    for (const x of (purchases||[])) { if (!x.purchaseToken || (quiet && done.includes(x.purchaseToken))) continue;
      const acct = x.appAccountToken || x.obfuscatedAccountId || x.accountIdentifier || '';
      if (acct && acct !== ACC.id){ other++; continue; }
      try { const j = await DBX.verifyPurchase({ productId:x.productIdentifier, purchaseToken:x.purchaseToken, orderId:x.transactionId||'' }); n++; if (!j.dup) fresh++; if (!done.includes(x.purchaseToken)) done.push(x.purchaseToken); }

/* 파일 내려받기 — 웹은 바로 저장, 안드로이드 앱은 '공유' 창으로(드라이브·파일·메일에 저장).
   앱(WebView)에는 Web Share 도, <a download> 도 없어서 예전엔 눌러도 아무 일이 없었다(2026-10-02) → 앱 캐시에 써서 공유 창에 넘긴다. */
async function saveFile(name, text, type){
  if (isNative){
    const FS = plug('Filesystem'), SH = plug('Share');
    if (!FS || !SH){ toast('이 판의 앱에서는 파일을 저장할 수 없습니다. 앱을 업데이트하거나 웹(브라우저)에서 내려받아 주세요'); return false; }
    try {
      const safe = name.replace(/[\\/:*?"<>|]/g, '_');
      const w = await FS.writeFile({ path:safe, data:text, directory:'CACHE', encoding:'utf8' });
      await SH.share({ title:safe, files:[w.uri], dialogTitle:'저장하거나 보낼 곳을 고르세요' });
      return true;
    } catch (e){ if (!/cancel/i.test(String(e && (e.message || e)))) toast('파일을 만들지 못했습니다: ' + (e.message || e)); return false; }
  }
  const file = new File([text], name, { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  return true;
}

    const t = el.placeholder || el.title || (el.type === 'date' ? '날짜' : el.type === 'time' ? '시각' : ''); if (t) el.setAttribute('aria-label', t); });

}

  if (storeWarn) setTimeout(() => toast(storeWarn), 900);
  /* 가입 확인·비밀번호 재설정 메일의 링크로 들어왔으면 그 세션을 받는다 */
  const hp = new URLSearchParams(location.hash.slice(1)); let linkErr = '';
  if (SRV && (hp.get('access_token') || hp.get('error_description'))){
    history.replaceState(null, '', location.pathname + location.search);
    if (hp.get('error_description')) linkErr = AUTH_KO(hp.get('error_description'));
    else try {
      /* 링크에 든 계정을 먼저 보여 주고 확인받는다 — 남이 보낸 링크로 조용히 다른 계정에 로그인되는 일(로그인 바꿔치기) 방지 */
      const lu = await DBX.linkUser(hp.get('access_token')); const cur = SESSION && SESSION.user && SESSION.user.email;
      const msg = hp.get('type')==='recovery' ? `${lu.email} 계정의 비밀번호를 새로 정합니다. 내 계정이 맞나요?`
        : `${lu.email} 계정으로 로그인합니다. 내 계정이 맞나요?${cur && cur !== lu.email ? ` (지금 로그인한 ${cur} 에서는 로그아웃됩니다)` : ''}`;
      if (!await ask(msg, '내 계정 맞아요', false)) throw new Error('링크의 계정으로 로그인하지 않았습니다.');
      ACC = await DBX.adoptSession(hp.get('access_token'), hp.get('refresh_token'), lu);
      if (hp.get('type')==='recovery'){ authMode='newpw'; show('auth'); nativeInit(); return; }
      toast('메일 인증이 끝났습니다. 반갑습니다'); S.onboarded=true; await afterLogin(ACC); nativeInit(); return;
    } catch (e){ linkErr = e.message; }
  }
  try { ACC = await DBX.me(); } catch { ACC = null; }
  /* 이미 쓴 링크·만료된 링크: 로그인해 있으면 알림만, 아니면 로그인 화면에 이유를 적는다 */
  if (linkErr){ if (ACC) setTimeout(() => toast(linkErr), 600); else { authMode='login'; authErr=linkErr; S.onboarded=true; show('auth'); nativeInit(); return; } }
  if (ACC){
    /* 켤 때마다 학원 코드를 다시 확인한다 — 수강이 끝났거나 원장님이 해제했으면 닫는다. 연결이 안 되면 저장된 만료일로 판단 */
    if (ACC.role==='student' && ACC.studentCode){ try { const r = await DBX.verifyCode(ACC.studentCode);
        if (r.ok) S.auth = { code:ACC.studentCode, name:r.student.name, cls:r.student.cls, until:r.student.until };
        else { if (S.auth) toast(r.why || '학원 코드가 닫혔습니다'); S.auth = null; } } catch {} }
    else if (S.auth && ACC.role==='student') S.auth = null;
    if (S.auth && ACC.role!=='student') S.auth = null;
    show(home());
    DBX.loadProgress(progressKey()).then(p => { if (p){ mergeProgress(p); save(S); if (view==='today') renderToday(); } }).catch(()=>{});
  } else {
    if (S.auth) S.auth = null;      // 로그아웃 상태에서는 학원 연결도 닫는다
    if (!S.onboarded && !S.introSeen) authMode = 'intro';
    show(S.onboarded ? 'today' : 'auth');
  }
  nativeInit(); initPush(); setTimeout(checkTalkNew, 1200); checkAppMeta();
})();
if (!isNative && 'serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
