<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박찬 과학 · 하루 한 개념</title>
<meta name="description" content="통합과학 개념 하나를 매일 배달합니다. 학원 강의 교재를 그대로 옮겼습니다.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#147D6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="박찬 과학">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
:root{
  --paper:#FAF8F4; --ground:#EFECE6; --card:#FFFFFF;
  --ink:#1E2A2E; --body:#3A484D; --muted:#6B7A80; --faint:#96A2A6;
  --line:#E2DED6; --hair:#EDE9E2;
  --u:#147D6F; --u-soft:#E7F5F1; --u-line:#C9E7DF; --u-dark:#0F6357;
  --no:#C0392B; --no-soft:#FBECEA; --warn:#B4830A; --warn-soft:#FFF7E0;
  --shadow:0 4px 20px rgba(30,42,46,.07);
}
:root[data-unit="I"]{ --u:#C1521E; --u-soft:#FBEFE7; --u-line:#F0D9C7; --u-dark:#A64516; }
:root[data-unit="II"]{ --u:#147D6F; --u-soft:#E7F5F1; --u-line:#C9E7DF; --u-dark:#0F6357; }
:root[data-unit="III"]{ --u:#4053B8; --u-soft:#ECEFFA; --u-line:#D9DFF5; --u-dark:#2E3E96; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14191B; --ground:#0B0F10; --card:#1B2224;
    --ink:#EDEAE4; --body:#C3CCCE; --muted:#8E9A9D; --faint:#6A7679;
    --line:#2C3538; --hair:#242C2E;
    --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6;
    --no:#E4776A; --no-soft:#2C1A18; --warn:#D9A73C; --warn-soft:#2A2314;
    --shadow:0 4px 20px rgba(0,0,0,.45);
  }
  :root:not([data-theme="light"])[data-unit="I"]{ --u:#E4885A; --u-soft:#2A1D16; --u-line:#412A1E; --u-dark:#F0A275; }
  :root:not([data-theme="light"])[data-unit="II"]{ --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6; }
  :root:not([data-theme="light"])[data-unit="III"]{ --u:#8B99E4; --u-soft:#191D2E; --u-line:#2A3054; --u-dark:#A9B4EE; }
}
:root[data-theme="dark"]{
  --paper:#14191B; --ground:#0B0F10; --card:#1B2224;
  --ink:#EDEAE4; --body:#C3CCCE; --muted:#8E9A9D; --faint:#6A7679;
  --line:#2C3538; --hair:#242C2E;
  --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6;
  --no:#E4776A; --no-soft:#2C1A18; --warn:#D9A73C; --warn-soft:#2A2314;
  --shadow:0 4px 20px rgba(0,0,0,.45);
}
:root[data-theme="dark"][data-unit="I"]{ --u:#E4885A; --u-soft:#2A1D16; --u-line:#412A1E; --u-dark:#F0A275; }
:root[data-theme="dark"][data-unit="II"]{ --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6; }
:root[data-theme="dark"][data-unit="III"]{ --u:#8B99E4; --u-soft:#191D2E; --u-line:#2A3054; --u-dark:#A9B4EE; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  word-break:keep-all;line-height:1.6;display:flex;justify-content:center;
  min-height:100vh;font-size:var(--fs,15px)}
.app{width:100%;max-width:440px;background:var(--paper);min-height:100vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative}
.stripe{height:4px;background:var(--u);flex:0 0 auto}
main{flex:1;padding:16px 18px 96px;overflow-x:hidden}
.hide{display:none!important}
button{font-family:inherit}

/* 상단 바 */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .date{font-size:13px;color:var(--muted)}
.top .hello{font-size:15px;font-weight:900;letter-spacing:-.01em}
.top .hello small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;
  color:var(--u);background:var(--u-soft);padding:5px 11px;border-radius:999px}
.pill svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.pill.grey{background:var(--hair);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* 공지 */
.notice{display:flex;gap:10px;background:#FBEFE7;border:1px solid #F0D9C7;
  border-radius:13px;padding:11px 13px;margin-bottom:13px;align-items:flex-start}
:root:not([data-theme="light"]) .notice{background:#2A1D16;border-color:#412A1E}
.notice .ic{width:21px;height:21px;border-radius:50%;background:#C1521E;flex:0 0 auto;
  display:grid;place-items:center;margin-top:1px;color:#fff;font-size:12px;font-weight:900}
.notice .b{flex:1;min-width:0}
.notice .t{font-size:12.5px;font-weight:800;color:#C1521E;line-height:1.45}
:root:not([data-theme="light"]) .notice .t{color:#E4885A}
.notice .d{font-size:11.5px;color:var(--body);line-height:1.5;margin-top:2px}
.notice button{font-size:11px;font-weight:800;color:#C1521E;border:1px solid #F0D9C7;
  background:var(--card);border-radius:8px;padding:6px 11px;flex:0 0 auto;align-self:center;cursor:pointer}

/* 개념 카드 */
.card{background:var(--card);border:1px solid var(--u-line);border-radius:17px;
  padding:18px;position:relative;overflow:hidden;margin-bottom:13px}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--u)}
.loc{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--u);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.loc .acts{display:flex;gap:4px}
.loc .acts button{background:none;border:1px solid var(--hair);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.loc .acts button svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.loc .acts button.on{color:var(--warn);border-color:var(--warn)}
.loc .acts button.on svg{fill:var(--warn)}
h1{font-size:23px;font-weight:900;letter-spacing:-.025em;line-height:1.3;margin-bottom:3px}
.sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.steps{display:flex;gap:9px;margin-bottom:16px}
.step{flex:1;border-top:2.5px solid var(--u);padding-top:8px}
.step .n{font-size:13px;font-weight:900;color:var(--u);font-family:'Noto Serif KR',serif}
.step .t{font-size:12px;font-weight:800;margin:2px 0 3px;line-height:1.35}
.step .d{font-size:11px;color:var(--body);line-height:1.55}
figure{background:var(--u-soft);border-radius:11px;padding:12px 8px 8px;text-align:center;margin-bottom:15px}
figure svg{max-width:100%;height:auto}
figcaption{font-size:11.5px;color:var(--u-dark);font-weight:700;margin-top:7px;padding:0 6px;line-height:1.5}
.howto{background:#FFFDF6;border:1px solid #EBDDB8;border-radius:11px;padding:11px 14px;margin-bottom:15px}
:root:not([data-theme="light"]) .howto{background:#221E12;border-color:#3B3320}
.howto .k{font-size:11px;font-weight:900;color:#B4830A;letter-spacing:.1em;display:block;margin-bottom:7px}
:root:not([data-theme="light"]) .howto .k{color:#D9A73C}
.howto li{font-size:12.5px;line-height:1.7;color:var(--body);margin-bottom:5px;list-style:none;padding-left:15px;text-indent:-15px}
.howto li b.n{color:#B4830A;font-weight:900;margin-right:6px}
:root:not([data-theme="light"]) .howto li b.n{color:#D9A73C}
.prose p{font-family:'Noto Serif KR',Georgia,serif;font-size:15px;line-height:2;color:var(--body);margin-bottom:15px}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--ink);font-weight:700}
.blank{display:inline-block;min-width:52px;text-align:center;border:none;
  border-bottom:2px solid var(--u);background:var(--u-soft);color:var(--u);
  font-weight:800;font-family:'Noto Sans KR',sans-serif;font-size:13px;
  padding:1px 7px;border-radius:5px 5px 0 0;cursor:pointer;font-feature-settings:normal}
.blank.open{background:transparent;color:var(--u-dark)}

/* 부속 카드 */
.sec{background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:15px 17px;margin-bottom:13px}
.sec h2{font-size:12px;font-weight:900;letter-spacing:.11em;color:var(--u);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
.sec h2 .more{font-size:11px;font-weight:800;color:var(--muted);background:none;border:none;cursor:pointer;letter-spacing:0}
.terms dt{font-size:13px;font-weight:800;color:var(--u-dark);margin-bottom:3px}
.terms dd{font-size:13px;color:var(--body);line-height:1.72;padding-bottom:11px;margin-bottom:11px;border-bottom:1px solid var(--hair)}
.terms dd:last-child{border:none;padding-bottom:0;margin-bottom:0}
.myth{background:var(--u-soft);border-radius:11px;padding:11px 13px;margin-bottom:8px;font-size:12.5px;line-height:1.7}
.myth:last-child{margin-bottom:0}
.myth .x{color:var(--no);font-weight:900}
.myth .o{color:var(--u-dark);font-weight:900}
.point{background:var(--u-soft);border-left:4px solid var(--u);border-radius:0 13px 13px 0;padding:14px 17px;margin-bottom:13px}
.point .k{font-size:11.5px;font-weight:900;color:var(--u-dark);letter-spacing:.13em;display:block;margin-bottom:6px}
.point p{font-size:14.5px;font-weight:700;line-height:1.78}

/* 버튼 */
.btn{display:block;width:100%;text-align:center;font-size:15px;font-weight:800;padding:15px;border-radius:14px;border:none;
  background:var(--u);color:#fff;cursor:pointer;letter-spacing:-.01em;margin-bottom:13px}
.btn:disabled{background:var(--line);color:var(--faint);cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.soft{background:var(--u-soft);color:var(--u-dark)}
.btn.sm{font-size:13px;padding:11px;margin-bottom:8px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:14px 2px}
.linkbtn.danger{color:var(--no)}

/* 문제 */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.qhead .l{font-size:14px;font-weight:900}
.tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--u-soft);color:var(--u)}
.stem{font-family:'Noto Serif KR',Georgia,serif;font-size:15px;line-height:1.85;margin-bottom:13px}
.bogi{border:1px solid var(--u-line);background:var(--u-soft);border-radius:11px;padding:12px 14px;margin-bottom:13px;font-size:13.5px;line-height:1.8}
.ask{font-size:14px;line-height:1.75;margin-bottom:12px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt{display:flex;gap:9px;font-size:13.5px;line-height:1.62;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--body);cursor:pointer;text-align:left;width:100%}
.opt .m{font-weight:800;color:var(--faint);flex:0 0 auto}
.opt .tx{flex:1}
.opt .mk{margin-left:auto;font-size:11px;font-weight:800;align-self:center;flex:0 0 auto}
.opt.ok{border-color:var(--u);background:var(--u-soft);color:var(--ink)}
.opt.ok .m,.opt.ok .mk{color:var(--u)}
.opt.bad{border-color:var(--no);background:var(--no-soft);color:var(--ink)}
.opt.bad .m,.opt.bad .mk{color:var(--no)}
.verdict{background:var(--u-soft);border-left:4px solid var(--u);border-radius:0 12px 12px 0;padding:13px 16px;margin-bottom:11px}
.verdict .h{font-size:13px;font-weight:900;color:var(--u-dark);margin-bottom:5px}
.verdict p{font-size:13.5px;line-height:1.75;color:var(--body)}
.again{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:13px;line-height:1.5}
.again b{color:var(--u);font-weight:700}
.essay{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-family:inherit;font-size:14px;line-height:1.8;color:var(--ink);background:var(--card);
  resize:vertical;min-height:96px;margin-bottom:12px}
.essay:focus{outline:2px solid var(--u);outline-offset:-2px}

/* 목록 · 검색 */
.h-page{font-size:21px;font-weight:900;letter-spacing:-.02em;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search svg{width:16px;height:16px;stroke:var(--faint);stroke-width:2.2;fill:none;stroke-linecap:round;flex:0 0 auto}
.search input{flex:1;border:none;background:none;padding:11px 0;font-size:14px;font-family:inherit;color:var(--ink);min-width:0}
.search input:focus{outline:none}
.chipbar{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;padding-bottom:4px}
.chipbar button{flex:0 0 auto;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.chipbar button.on{background:var(--u);border-color:var(--u);color:#fff}
.book-h{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:900;letter-spacing:-.01em;margin:26px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.book-h:first-of-type{margin-top:4px}
.unit-h{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
.unit-h:first-of-type{margin-top:4px}
.unit-h .no{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:900;color:var(--u)}
.unit-h .nm{font-size:14px;font-weight:900}
.unit-h .ln{flex:1;height:2px;background:var(--u-line)}
.row{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--hair);cursor:pointer;width:100%;background:none;
  border-left:none;border-right:none;border-top:none;text-align:left}
.row .n{font-size:11px;font-weight:900;color:var(--u);background:var(--u-soft);border-radius:7px;padding:4px 7px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.row .b{flex:1;min-width:0}
.row .t{display:block;font-size:14px;font-weight:700;line-height:1.4}
.row .s{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.row .st{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.row .st svg{width:16px;height:16px;stroke:var(--u);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row .st svg.bm{stroke:var(--warn);fill:var(--warn)}
.row.locked{opacity:.45;cursor:default}
.row.locked .st svg{stroke:var(--faint);stroke-width:1.8}

/* 빈 상태 */
.empty{text-align:center;padding:56px 24px;color:var(--faint)}
.empty svg{width:44px;height:44px;stroke:var(--line);stroke-width:1.5;fill:none;margin-bottom:14px;stroke-linecap:round;stroke-linejoin:round}
.empty p{font-size:13.5px;line-height:1.8}

/* 진도 · 통계 */
.prog{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:15px 17px;margin-bottom:13px;cursor:pointer;width:100%;text-align:left}
.prog svg.ring{width:52px;height:52px;flex:0 0 auto}
.prog .lab{font-size:12px;color:var(--muted)}
.prog .val{font-size:19px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.prog .val small{font-size:13px;color:var(--muted);font-weight:600}
.prog .r{margin-left:auto;text-align:right}
.week{display:flex;gap:6px;justify-content:space-between;margin:2px 0 13px}
.week .d{flex:1;text-align:center;font-size:10.5px;color:var(--faint);font-weight:700}
.week .d i{display:block;width:100%;aspect-ratio:1;border-radius:9px;background:var(--hair);margin-bottom:4px;border:1.5px solid transparent}
.week .d.on i{background:var(--u)}
.week .d.today i{border-color:var(--u)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.tile{background:var(--card);border:1px solid var(--hair);border-radius:13px;padding:12px 10px;text-align:center}
.tile .v{font-size:21px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--ink)}
.tile .v small{font-size:12px;color:var(--muted);font-weight:600}
.tile .l{font-size:11px;color:var(--muted);margin-top:3px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:7px 0}
.bar-row .k{flex:0 0 118px;color:var(--body);font-weight:700;line-height:1.3}
.bar-row .k small{display:block;color:var(--faint);font-weight:500;font-size:10.5px}
.bar-row .bar{flex:1;height:8px;background:var(--hair);border-radius:4px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:var(--u);border-radius:4px}
.bar-row .v{flex:0 0 46px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.cal .h{font-size:10px;color:var(--faint);text-align:center;font-weight:700;padding-bottom:2px}
.cal .c{aspect-ratio:1;min-width:0;border-radius:7px;background:var(--hair);display:grid;place-items:center;font-size:10.5px;color:var(--faint)}
.cal .c.on{background:var(--u);color:#fff;font-weight:800}
.cal .c.att{box-shadow:inset 0 0 0 2px var(--warn)}
.cal .c.blank{background:transparent}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px;background:var(--u)}
.legend i.att{background:transparent;box-shadow:inset 0 0 0 2px var(--warn)}

/* 내 정보 · 계정 */
.pass{background:var(--card);border:1.5px solid var(--u);border-radius:16px;padding:16px;position:relative;overflow:hidden;margin-bottom:14px}
.pass::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--u)}
.pass .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--u);background:var(--u-soft);padding:4px 10px;border-radius:999px;margin-bottom:11px}
.pass .badge.grey{color:var(--muted);background:var(--hair)}
.pass .badge.warn{color:var(--warn);background:var(--warn-soft)}
.pass .who{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-bottom:2px}
.pass .where{font-size:12.5px;color:var(--muted);margin-bottom:13px}
.pass .row{display:flex;gap:9px;font-size:12px;line-height:1.55;padding:6px 0;border-top:1px solid var(--hair);cursor:default}
.pass .row dt{color:var(--muted);flex:0 0 44px}
.pass .row dd{color:var(--body);flex:1}
.pass .row dd b{color:var(--ink);font-weight:700}
.codebox{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}
.codebox h3{font-size:15px;font-weight:900;margin-bottom:6px}
.codebox p{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:13px}
.codebox .f{display:flex;gap:7px;margin-bottom:8px}
.codebox input{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink);min-width:0}
.codebox input.code{letter-spacing:.16em;text-transform:uppercase}
.codebox input:focus{outline:2px solid var(--u);outline-offset:-2px}
.codebox button{background:var(--u);color:#fff;border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:800;cursor:pointer;flex:0 0 auto}
.codebox .demo{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.7}

<script>
/* ═══════════════════════════════════════════════════════════════
   박찬 과학 — 하루 한 개념  (v2 · 계정 · 보호자 · 이용권 · 통계)
   구조: CFG → 데이터 계층(로컬 DB / 서버 DB, 같은 인터페이스) → ACC(계정)·S(내 진도) → 화면 렌더러 → 이벤트
   ═══════════════════════════════════════════════════════════════ */
const CONCEPTS = JSON.parse(document.getElementById('d-concepts').textContent);
const QUIZZES  = JSON.parse(document.getElementById('d-quizzes').textContent);
const MARKS = '①②③④⑤';
const FREE_DAYS = 7;                 // [확인 필요] 무료 체험: 최근 7일치 개념
const RETRY_DAYS = 3;                // 오답 재출제 간격
const CFG = {
  academy: '박찬 과학', version: '1.0.0',
  supabaseUrl: '__SB_URL__', supabaseKey: '__SB_KEY__',   // build.py 가 server/config.json 에서 심는다. 비어 있으면 로컬 모드
  adminPin: '2580',                  // 로컬(시연) 원장 비밀번호
  attendSecret: 'parkchan-2026',     // 로컬 출석 코드 씨앗 — 서버 모드에서는 서버만 안다
  classes: [{cls:'월목반',start:'18:00'},{cls:'화금반',start:'18:00'},{cls:'수토반',start:'14:00'}],   // [확인 필요] 반 편성 기본값
  phone: '', kakao: '', email: '',   // [확인 필요] 학원 연락처 — 비어 있으면 문의 줄이 숨는다
  plans: [ { id:'m1', name:'월 이용권', days:30, price:null }, { id:'m6', name:'6개월 이용권', days:180, price:null } ],   // [확인 필요] 요금 미정
};

/* ── 작은 도우미 ── */
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowHM = () => { const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const kdate = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return (+y!==new Date().getFullYear()?`${y}년 `:'')+`${+m}월 ${+d}일`; };
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);
const addDays = (iso, n) => { const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const esc = t => String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rich = t => esc(t).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>')
  .replace(/\{\{(.+?)\}\}/g, (_,m) => `<button class="blank" data-b="${m}">${m}</button>`);
const plain = t => String(t||'').replace(/<[^>]+>/g,'').replace(/\{\{(.+?)\}\}/g,'$1');
const figOf = id => { const el=document.querySelector(`#figstore [data-id="${id}"]`); return el?el.innerHTML:''; };
const setUnit = u => document.documentElement.dataset.unit = u;
const toast = msg => { const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); };
const Cap = window.Capacitor, isNative = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
const plug = n => (Cap && Cap.Plugins && Cap.Plugins[n]) || null;
const h32 = s => { let h=2166136261; for (const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } return h>>>0; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const genCode = (seed, taken=()=>false) => { const A='ABCDEFGHJKMNPQRSTUVWXYZ';
  for (let i=0;i<50;i++){ const h=h32(seed+Date.now()+i+Math.random()); const c=A[h%23]+A[(h>>>5)%23]+A[(h>>>10)%23]+pad(h%1000).padStart(3,'0'); if(!taken(c)) return c; }
  return 'PCS'+pad(Date.now()%1000).padStart(3,'0'); };

/* ── 출석 코드(로컬): 30초마다 바뀌는 4자리 ── */
const ATT_WIN = 30000;
const attWindow = (t=Date.now()) => Math.floor(t/ATT_WIN);
const attCode = w => pad(h32(CFG.attendSecret+':'+w) % 10000).padStart(4,'0');
const attCodeOK = c => [attWindow(), attWindow()-1].some(w => attCode(w) === c);
const classStart = cls => { const c=(CLASSES_CACHE.find(x=>x.cls===cls)); return c ? c.start : '18:00'; };
let CLASSES_CACHE = CFG.classes.slice();

/* ═══ 서버 연결(Supabase) — 있으면 서버 모드, 없으면 로컬 모드 ═══ */
const SRV = (() => {
  let o = null; try { o = JSON.parse(localStorage.getItem('pcs.server')); } catch {}
  const qp = new URLSearchParams(location.search);
  if (qp.get('server') !== null){ o = qp.get('server') ? { url: qp.get('server'), key: qp.get('key')||'' } : null;
    try { o ? localStorage.setItem('pcs.server', JSON.stringify(o)) : localStorage.removeItem('pcs.server'); } catch {} }
  const url = (o && o.url) || (CFG.supabaseUrl.startsWith('http') ? CFG.supabaseUrl : ''), key = (o && o.key) || (CFG.supabaseKey.startsWith('__') ? '' : CFG.supabaseKey);
  return url ? { url: url.replace(/\/$/, ''), key } : null;
})();
/* 로그인 세션(서버 모드): access_token · refresh_token · user */
let SESSION = null; try { SESSION = JSON.parse(localStorage.getItem('pcs.session')); } catch {}
const saveSession = () => { try { SESSION ? localStorage.setItem('pcs.session', JSON.stringify(SESSION)) : localStorage.removeItem('pcs.session'); } catch {} };
async function authPost(path, body){
  const r = await fetch(SRV.url + path, { method:'POST', headers:{ apikey:SRV.key, 'Content-Type':'application/json', ...(SESSION&&SESSION.access_token?{Authorization:'Bearer '+SESSION.access_token}:{}) }, body: JSON.stringify(body) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ('요청 실패 '+r.status));
  return j;
}
async function api(path, { method='GET', body, prefer, student, _retry } = {}){
  const h = { apikey: SRV.key, 'Content-Type': 'application/json' };
  h.Authorization = 'Bearer ' + ((SESSION && SESSION.access_token) || SRV.key);
  const code = student || (S.auth && S.auth.code); if (code) h['x-student-code'] = code;
  if (prefer) h.Prefer = prefer;
  const r = await fetch(SRV.url + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401 && SESSION && SESSION.refresh_token && !_retry){
    try { const j = await authPost('/auth/v1/token?grant_type=refresh_token', { refresh_token: SESSION.refresh_token });
      SESSION = { ...SESSION, access_token:j.access_token, refresh_token:j.refresh_token||SESSION.refresh_token }; saveSession();
      return api(path, { method, body, prefer, student, _retry:true }); }
    catch { SESSION = null; saveSession(); }
  }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch { j = txt; }
  if (!r.ok) throw Object.assign(new Error((j && (j.message || j.msg || j.error_description)) || ('서버 오류 ' + r.status)), { status: r.status, body: j });
  return j;
}
const hhmm = t => (t || '').slice(0, 5);

/* ═══ 데이터 계층 — 로컬 어댑터 (계정·학생·출석·공지·이용권이 이 기기 안에 산다) ═══ */

    classes: CFG.classes.slice(),
  });
  let d; try { d = JSON.parse(localStorage.getItem(DBKEY)); } catch {}
  if (!d || !d.accounts) d = seed();
  d.classes ||= CFG.classes.slice(); d.passes ||= []; d.progress ||= {};
  CLASSES_CACHE = d.classes.slice();
  const w = () => { try { localStorage.setItem(DBKEY, JSON.stringify(d)); } catch {} };
  let sid = null; try { sid = localStorage.getItem('pcs.local.sid'); } catch {}
  const pub = a => a ? { id:a.id, email:a.email, role:a.role, name:a.name, phone:a.phone||'', studentCode:a.studentCode||'', childCode:a.childCode||'', passUntil:a.passUntil||'', created:a.created } : null;
  const me = () => d.accounts.find(a => a.id === sid) || null;
  const stateOf = code => d.progress[code] || null;
  const attend = (s, manual) => {
    const date = todayISO(); let a = d.attendance.find(x=>x.code===s.code && x.date===date);
    if (a) return { ok:true, rec:a, dup:true };
    const time = nowHM(); a = { code:s.code, date, time, late: time > classStart(s.cls), manual }; d.attendance.push(a); w(); return { ok:true, rec:a };
  };
  return {
    mode: 'local',
    /* 계정 */
    me: async () => pub(me()),
    signUp: async ({ email, password, name, role, phone }) => {
      email = email.trim().toLowerCase();
      if (d.accounts.some(a => a.email === email)) throw new Error('이미 가입된 이메일입니다. 로그인해 주세요.');
      const a = { id: uid(), email, pw: h32(password), role, name, phone: phone||'', created: todayISO() };
      d.accounts.push(a); sid = a.id; try { localStorage.setItem('pcs.local.sid', sid); } catch {} w(); return pub(a);
    },
    signIn: async (email, password) => {
      const a = d.accounts.find(x => x.email === email.trim().toLowerCase());
      if (!a || a.pw !== h32(password)) throw new Error('이메일 또는 비밀번호가 다릅니다.');
      sid = a.id; try { localStorage.setItem('pcs.local.sid', sid); } catch {} return pub(a);
    },
    signOut: async () => { sid = null; try { localStorage.removeItem('pcs.local.sid'); } catch {} },
    resetPassword: async email => { const a = d.accounts.find(x => x.email === email.trim().toLowerCase()); if (!a) throw new Error('가입되지 않은 이메일입니다.'); return { ok:true, note:'로컬 모드에서는 메일이 가지 않습니다. 서버 모드에서는 재설정 메일이 발송됩니다.' }; },
    updateMe: async patch => { const a = me(); if (!a) throw new Error('로그인이 필요합니다.'); Object.assign(a, patch); w(); return pub(a); },
    deleteAccount: async () => { const a = me(); if (!a) return; d.accounts = d.accounts.filter(x => x.id !== a.id); if (a.studentCode) delete d.progress['u:'+a.id]; sid = null; try { localStorage.removeItem('pcs.local.sid'); } catch {} w(); },
    /* 학원 코드 · 자녀 연결 */
    verifyCode: async code => {
      const s = d.students.find(x => x.code === code);
      if (!s) return { ok:false, why:'등록되지 않은 코드입니다. 원장님께 받은 코드를 확인해 주세요.' };
      if (s.until < todayISO()) return { ok:false, why:`수강 기간이 ${kdate(s.until)}에 끝났습니다. 원장님께 문의해 주세요.` };
      return { ok:true, student:{ code:s.code, name:s.name, cls:s.cls, until:s.until } };
    },
    student: async code => { const s = d.students.find(x => x.code === code); return s ? { code:s.code, name:s.name, cls:s.cls, until:s.until } : null; },
    students: async () => d.students.slice(),
    addStudent: async ({name, cls, until, phone}) => { const s = { code:genCode(name, c=>d.students.some(x=>x.code===c)), name, cls, until, phone:phone||'', joined:todayISO() }; d.students.push(s); w(); return s; },
    removeStudent: async code => { d.students = d.students.filter(s=>s.code!==code); w(); },
    guardiansOf: async code => d.accounts.filter(a => a.role==='parent' && a.childCode===code).map(pub),
    /* 출석 */
    attendanceOn: async date => d.attendance.filter(a=>a.date===date),
    attendanceRange: async (from, to, code) => d.attendance.filter(a => a.date>=from && a.date<=to && (!code || a.code===code)).sort((a,b)=>b.date.localeCompare(a.date)),
    myAttendance: async (code, date) => d.attendance.find(a=>a.code===code && a.date===date) || null,
    markAttend: async (code, entered, manual=false) => {
      if (!manual && !attCodeOK(entered)) return { ok:false, why:'코드가 맞지 않습니다. 입구 화면의 지금 숫자를 다시 봐 주세요.' };
      const s = d.students.find(x=>x.code===code); if (!s) return { ok:false, why:'학생을 찾을 수 없습니다.' };
      return attend(s, manual);
    },
    attendNow: async () => ({ code: attCode(attWindow()), win: attWindow() }),
    /* 공지 */
    notices: async cls => d.notices.filter(n => n.cls===cls || n.cls==='전체').sort((a,b)=>b.at.localeCompare(a.at)),
    allNotices: async () => d.notices.slice().sort((a,b)=>b.at.localeCompare(a.at)),
    sendNotice: async (cls, t, dd) => { const n = { id:'n'+Date.now(), cls, t, d:dd, at:new Date().toISOString(), read:[] }; d.notices.unshift(n); w(); return n; },
    markRead: async (id, code) => { const n=d.notices.find(x=>x.id===id); if (n && !n.read.includes(code)){ n.read.push(code); w(); } },
    noticeStats: async id => { const n = d.notices.find(x=>x.id===id); if (!n) return null;
      const target = d.students.filter(s => n.cls==='전체' || s.cls===n.cls); const unread = target.filter(s => !n.read.includes(s.code));
      return { sent: target.length, read: target.length-unread.length, unread }; },
    /* 반 */
    classes: async () => d.classes.slice(),
    addClass: async (cls, start) => { if (!d.classes.some(c=>c.cls===cls)) d.classes.push({cls, start}); CLASSES_CACHE = d.classes.slice(); w(); },
    removeClass: async cls => { d.classes = d.classes.filter(c=>c.cls!==cls); CLASSES_CACHE = d.classes.slice(); w(); },
    /* 진도 (기기 안에서는 계정별로 나눠 둔다) */
    loadProgress: async key => stateOf(key),
    saveProgress: async (key, state) => { d.progress[key] = state; w(); },
    progressAll: async () => Object.entries(d.progress).filter(([k])=>!k.startsWith('u:')).map(([code, state]) => ({ code, state })),
    /* 이용권 */
    redeemPass: async code => {
      const p = d.passes.find(x => x.code === code); if (!p) return { ok:false, why:'없는 이용권 코드입니다.' };
      if (p.usedBy) return { ok:false, why:'이미 사용된 코드입니다.' };
      const a = me(); if (!a) return { ok:false, why:'로그인이 필요합니다.' };
      const base = (a.passUntil && a.passUntil >= todayISO()) ? a.passUntil : todayISO();
      a.passUntil = addDays(base, p.days); p.usedBy = a.id; p.usedAt = todayISO(); w(); return { ok:true, until:a.passUntil };
    },
    issuePass: async days => { const p = { code: genCode('pass', c=>d.passes.some(x=>x.code===c)), days, issued: todayISO() }; d.passes.push(p); w(); return p; },
    passes: async () => d.passes.slice().reverse(),
    ownerEmail: () => (me() && me().email) || '',
    reset: () => { d = seed(); w(); },
  };
})();

/* ═══ 데이터 계층 — 서버 어댑터(Supabase PostgREST + Auth). 이름·반환 형태는 로컬과 같다 ═══ */
const serverDB = () => {
  const notice = (n, reads=[]) => ({ id:n.id, cls:n.cls, t:n.title, d:n.body||'', at:n.at, read: reads.filter(r=>r.notice_id===n.id).map(r=>r.code) });
  const att = a => ({ code:a.code, date:a.date, time:hhmm(a.time), late:!!a.late, manual:!!a.manual });
  const prof = p => p ? { id:p.id, email:p.email||'', role:p.role, name:p.name, phone:p.phone||'', studentCode:p.student_code||'', childCode:p.child_code||'', passUntil:p.pass_until||'', created:p.created_at } : null;
  let attCache = null, meCache = null;
  const myProfile = async () => { if (!SESSION) return null; const r = await api(`/rest/v1/profiles?id=eq.${SESSION.user.id}&select=*`); meCache = r.length ? prof({ ...r[0], email:SESSION.user.email }) : null; return meCache; };
  return {
    mode: 'server',
    me: async () => { if (!SESSION) return null; try { return await myProfile(); } catch { return meCache; } },
    signUp: async ({ email, password, name, role, phone }) => {
      const j = await authPost('/auth/v1/signup', { email, password, data:{ name, role } });
      if (!j.access_token) throw new Error('가입 확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인해 주세요.');
      SESSION = { access_token:j.access_token, refresh_token:j.refresh_token, user:{ id:j.user.id, email:j.user.email } }; saveSession();
      await api('/rest/v1/profiles?on_conflict=id', { method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{ id:j.user.id, role, name, phone:phone||'' } });
      return myProfile();
    },
    signIn: async (email, password) => {
      const j = await authPost('/auth/v1/token?grant_type=password', { email, password });
      SESSION = { access_token:j.access_token, refresh_token:j.refresh_token, user:{ id:j.user.id, email:j.user.email } }; saveSession();
      let p = await myProfile();
      if (!p){ await api('/rest/v1/profiles?on_conflict=id', { method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{ id:j.user.id, role:'student', name:(j.user.user_metadata&&j.user.user_metadata.name)||'' } }); p = await myProfile(); }
      return p;
    },
    signOut: async () => { try { if (SESSION) await authPost('/auth/v1/logout', {}); } catch {} SESSION = null; saveSession(); meCache = null; },
    resetPassword: async email => { await authPost('/auth/v1/recover', { email }); return { ok:true, note:'비밀번호 재설정 메일을 보냈습니다.' }; },
    updateMe: async patch => { const b = {}; if ('name' in patch) b.name = patch.name; if ('phone' in patch) b.phone = patch.phone; if ('studentCode' in patch) b.student_code = patch.studentCode; if ('childCode' in patch) b.child_code = patch.childCode;
      await api(`/rest/v1/profiles?id=eq.${SESSION.user.id}`, { method:'PATCH', prefer:'return=minimal', body:b }); return myProfile(); },
    deleteAccount: async () => { await api('/rest/v1/rpc/delete_my_account', { method:'POST', body:{} }); SESSION = null; saveSession(); meCache = null; },
    verifyCode: async code => { const rows = await api(`/rest/v1/students?code=eq.${encodeURIComponent(code)}&select=code,name,cls,until`, { student: code });
      if (!rows || !rows.length) return { ok:false, why:'등록되지 않았거나 수강 기간이 끝난 코드입니다. 원장님께 확인해 주세요.' }; return { ok:true, student: rows[0] }; },
    student: async code => { const rows = await api(`/rest/v1/students?code=eq.${encodeURIComponent(code)}&select=code,name,cls,until`, { student: code }); return rows.length ? rows[0] : null; },
    students: async () => api('/rest/v1/students?select=code,name,cls,until,phone,joined&order=joined.asc,name.asc'),
    addStudent: async ({name, cls, until, phone}) => {
      for (let i=0;i<5;i++){ try { const r = await api('/rest/v1/students', { method:'POST', prefer:'return=representation', body:{ code:genCode(name), name, cls, until, phone:phone||'' } }); return r[0]; } catch (e){ if (e.status!==409) throw e; } }
      throw new Error('코드 발급에 실패했습니다. 다시 시도해 주세요.');
    },
    removeStudent: async code => { await api(`/rest/v1/students?code=eq.${encodeURIComponent(code)}`, { method:'DELETE' }); },
    guardiansOf: async code => (await api(`/rest/v1/profiles?child_code=eq.${encodeURIComponent(code)}&select=id,name,phone,role`)).map(prof),
    attendanceOn: async date => (await api(`/rest/v1/attendance?date=eq.${date}&select=*`)).map(att),
    attendanceRange: async (from, to, code) => (await api(`/rest/v1/attendance?date=gte.${from}&date=lte.${to}${code?`&code=eq.${encodeURIComponent(code)}`:''}&select=*&order=date.desc`, { student: code })).map(att),
    myAttendance: async (code, date) => { const r = await api(`/rest/v1/attendance?code=eq.${encodeURIComponent(code)}&date=eq.${date}&select=*`, { student: code }); return r.length ? att(r[0]) : null; },
    markAttend: async (code, entered, manual=false) => {
      const r = manual ? await api('/rest/v1/rpc/mark_attend_manual', { method:'POST', body:{ p_code: code } })
                       : await api('/rest/v1/rpc/mark_attend', { method:'POST', body:{ p_code: code, p_entered: entered }, student: code });
      if (!r || !r.ok) return { ok:false, why: (r && r.why) || '출석 처리에 실패했습니다.' };
      return { ok:true, dup: !!r.dup, rec: { code, date: todayISO(), time: hhmm(r.time), late: !!r.late, manual } };
    },
    attendNow: async () => { const w = attWindow(); if (!attCache || attCache.win !== w){ const r = await api('/rest/v1/rpc/current_attend_code', { method:'POST', body:{} }); attCache = { code:r.code, win:w }; } return attCache; },
    notices: async cls => { const [ns, reads] = await Promise.all([api(`/rest/v1/notices?or=(cls.eq.전체,cls.eq.${encodeURIComponent(cls)})&select=*&order=at.desc`), api('/rest/v1/notice_reads?select=notice_id,code')]); return ns.map(n => notice(n, reads)); },
    allNotices: async () => (await api('/rest/v1/notices?select=*&order=at.desc')).map(n => notice(n)),
    sendNotice: async (cls, t, dd) => { const r = await api('/rest/v1/notices', { method:'POST', prefer:'return=representation', body:{ cls, title:t, body:dd } }); return notice(r[0]); },
    markRead: async (id, code) => { await api('/rest/v1/notice_reads?on_conflict=notice_id,code', { method:'POST', prefer:'resolution=ignore-duplicates,return=minimal', body:{ notice_id:id, code }, student: code }); },
    noticeStats: async id => { const [ns, st, reads] = await Promise.all([api(`/rest/v1/notices?id=eq.${id}&select=cls`), api('/rest/v1/students?select=code,cls,phone,name'), api(`/rest/v1/notice_reads?notice_id=eq.${id}&select=code`)]);
      if (!ns.length) return null; const target = st.filter(s => ns[0].cls==='전체' || s.cls===ns[0].cls), done = new Set(reads.map(r=>r.code)); const unread = target.filter(s => !done.has(s.code));
      return { sent: target.length, read: target.length-unread.length, unread }; },
    classes: async () => { const r = await api('/rest/v1/classes?select=cls,start_time&order=cls.asc'); CLASSES_CACHE = r.map(c => ({ cls:c.cls, start:hhmm(c.start_time) })); return CLASSES_CACHE.slice(); },
    addClass: async (cls, start) => { await api('/rest/v1/classes?on_conflict=cls', { method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{ cls, start_time:start } }); },
    removeClass: async cls => { await api(`/rest/v1/classes?cls=eq.${encodeURIComponent(cls)}`, { method:'DELETE' }); },
    loadProgress: async key => { const r = await api(`/rest/v1/progress?code=eq.${encodeURIComponent(key)}&select=state`, { student: key.startsWith('u:')?undefined:key }); return r.length ? r[0].state : null; },
    saveProgress: async (key, state) => { await api('/rest/v1/progress?on_conflict=code', { method:'POST', prefer:'resolution=merge-duplicates,return=minimal', body:{ code:key, state, at:new Date().toISOString() }, student: key.startsWith('u:')?undefined:key }); },
    progressAll: async () => (await api('/rest/v1/progress?select=code,state,at&code=not.like.u:*')).map(r => ({ code:r.code, state:r.state })),
    redeemPass: async code => { const r = await api('/rest/v1/rpc/redeem_pass', { method:'POST', body:{ p_code: code } }); if (r && r.ok){ meCache = null; } return r; },
    issuePass: async days => { const r = await api('/rest/v1/passes', { method:'POST', prefer:'return=representation', body:{ code:genCode('pass'), days } }); return r[0]; },
    passes: async () => (await api('/rest/v1/passes?select=*&order=issued.desc')).map(p => ({ code:p.code, days:p.days, issued:p.issued, usedBy:p.used_by||'', usedAt:p.used_at||'' })),
    ownerEmail: () => (SESSION && SESSION.user.email) || '',
    reset: () => {},
  };
};
const DBX = SRV ? serverDB() : DB;

/* ═══ 계정 · 내 진도 ═══ */
let ACC = null;                                  // 로그인한 계정 { id, email, role, name, studentCode, childCode, passUntil }
const KEY = 'pcs.v2';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
let syncT = null;
const progressKey = () => (S.auth && S.auth.code) || (ACC ? 'u:'+ACC.id : null);
const snapshot = () => ({ start:S.start, done:S.done, wrong:S.wrong, read:S.read, days:S.days, bm:S.bm, stats:S.stats, notifyAt:S.notifyAt, at:new Date().toISOString() });
const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
  const k = progressKey(); if (k){ clearTimeout(syncT); syncT = setTimeout(() => DBX.saveProgress(k, snapshot()).catch(()=>{}), 1000); } };
const mergeProgress = p => { if (!p) return;
  if (p.start) S.start = p.start;
  S.done = [...new Set([...(p.done||[]), ...S.done])];
  const key = w => w.l+':'+w.n; const have = new Set(S.wrong.map(key)); (p.wrong||[]).forEach(w => { if (!have.has(key(w))) S.wrong.push(w); });
  S.read = [...new Set([...(p.read||[]), ...(S.read||[])])];
  S.days = [...new Set([...(p.days||[]), ...(S.days||[])])].sort();
  S.bm = [...new Set([...(p.bm||[]), ...(S.bm||[])])];
  if (p.stats){ S.stats = { a:(S.stats.a||0)+(p.stats.a||0), c:(S.stats.c||0)+(p.stats.c||0) }; }
  if (p.notifyAt && !S.notifyAt) S.notifyAt = p.notifyAt; };
let S = load();
if (!S.start){ S.start = todayISO(); }
S.done ||= []; S.wrong ||= []; S.read ||= []; S.days ||= []; S.bm ||= []; S.stats ||= { a:0, c:0 };
S.fs ||= '보통'; S.theme ||= '시스템'; S.notifyAt ??= '18:00';
const applyPrefs = () => {
  document.documentElement.style.setProperty('--fs', {작게:'14px',보통:'15px',크게:'17px'}[S.fs]||'15px');
  if (S.theme==='시스템') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = S.theme==='어둡게'?'dark':'light';
  if (typeof applyBar === 'function') applyBar();
};
applyPrefs();
const touchDay = () => { const t=todayISO(); if (!S.days.includes(t)){ S.days.push(t); S.days.sort(); } };

const dayIndex = () => Math.max(0, daysBetween(S.start, todayISO())) % CONCEPTS.length;
const todayConcept = () => CONCEPTS[dayIndex()];
/* 이용 권한: 학원 수강생(코드) · 이용권 · 원장 → 전 범위. 그 외는 최근 7일치(무료 체험) */
const hasPass = () => !!(ACC && ACC.passUntil && ACC.passUntil >= todayISO());
const fullAccess = () => !!(S.auth || hasPass() || (ACC && ACC.role==='owner'));
const isOpen = i => fullAccess() || (i <= dayIndex() && i > dayIndex()-FREE_DAYS);
const dueRetry = () => S.wrong.find(w => !w.redone && w.iso && daysBetween(w.iso, todayISO()) >= RETRY_DAYS);
const quizFor = c => { const pool = QUIZZES.filter(q=>q.lessonId===c.lessonId); return pool[(+c.no-1)%pool.length] || pool[0]; };
const streak = () => { let n=0, d=todayISO(); if (!S.days.includes(d)) d = addDays(d,-1); while (S.days.includes(d)){ n++; d = addDays(d,-1); } return n; };

/* ═══ 개념 카드(오늘·상세 공용) ═══ */

      <div class="prose">${c.body.map(p=>`<p>${rich(p)}</p>`).join('')}</div>

  const {q, pick, retry, mode} = qState; const graded = pick !== null;
  const label = mode==='review' ? '복습 문제' : (retry ? '다시 볼 문제' : '오늘의 문제');
  document.getElementById('v-quiz').innerHTML = `
    <button class="back" id="backToday"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>${mode==='review'?'통계':'오늘 개념'}</button>

      <span class="tag">${retry ? `${kdate(retry.iso)}에 틀림` : (graded && pick!==q.answer ? '다시 볼 문제' : (q.type||'확인'))}</span></div>
    ${retry ? `<p class="again">↻ ${RETRY_DAYS}일 전에 갈렸던 문제입니다. 이번엔 어디서 갈리는지 보세요.</p>` : ''}
    <p class="stem">${rich(q.stem)}</p>
    ${q.source ? `<div class="bogi">${rich(q.source)}</div>`:''}
    ${q.ask ? `<p class="ask">${rich(q.ask)}</p>`:''}
    ${q.essay ? `
      <textarea class="essay" placeholder="문장으로 답을 써 보세요"></textarea>
      ${graded ? `<div class="verdict"><div class="h">이렇게 쓰면 됩니다</div><p>${rich(q.gradeNote || q.answerLine)}</p></div>` : ''}
      <button class="btn" id="grade">${graded ? (mode==='review'?'다음 복습 문제':'오늘 개념으로 돌아가기') : '답 확인하기'}</button>
    ` : `
      <div class="opts">${q.choices.map((t,i)=>{ const n=i+1; let cls='', mk=''; if (graded){ if (n===q.answer){cls='ok';mk='정답';} else if (n===pick){cls='bad';mk='내 답';} }
        return `<button class="opt ${cls}" data-p="${n}" ${graded?'disabled':''}><span class="m">${MARKS[i]}</span><span class="tx">${rich(t)}</span>${mk?`<span class="mk">${mk}</span>`:''}</button>`; }).join('')}</div>
      ${graded ? `
        <div class="verdict"><div class="h">${pick===q.answer ? '맞혔습니다' : `${MARKS[pick-1]}는 맞는 설명이에요`}</div>
          <p>${rich(q.explain || (pick===q.answer ? '정답입니다.' : `정답은 ${MARKS[q.answer-1]}입니다. 개념의 포인트를 다시 읽어 보세요.`))}</p></div>
        ${pick!==q.answer && !retry ? `<div class="again">↻ 오답 노트에 담았습니다 · <b>${RETRY_DAYS}일 뒤</b> 한 번 더 물어볼게요</div>`:''}
        ${retry ? `<div class="again">${pick===q.answer ? '✓ 이제 됐습니다 — 오답 노트에서 정리됩니다' : '한 번 더 담아 둘게요 — 3일 뒤 다시'}</div>`:''}
        <button class="btn" id="grade">${mode==='review' ? '다음 복습 문제' : (retry ? '오늘의 문제로' : '오늘 개념으로 돌아가기')}</button>
      ` : ''}
    `}`;
}
function startReview(){
  const pool = QUIZZES.filter(q => !q.essay && CONCEPTS.some((c,i) => c.lessonId===q.lessonId && isOpen(i)));
  if (!pool.length){ toast('풀 수 있는 문제가 아직 없습니다'); return; }
  const q = pool[Math.floor(Math.random()*pool.length)]; const c = CONCEPTS.find(x=>x.lessonId===q.lessonId);
  qState = { q, pick:null, retry:null, mode:'review', lessonName:c?c.lessonName:'' }; show('quiz');
}
function gradePick(pick){
  const {q, retry, mode} = qState; qState.pick = pick; touchDay();
  S.stats.a++; if (pick===q.answer) S.stats.c++;
  if (mode==='today'){ const c = todayConcept(); if (!S.done.includes(c.id)) S.done.push(c.id); }
  if (retry){ retry.redone=true; if (pick===q.answer) retry.cleared=true; else { retry.redone=false; retry.iso=todayISO(); retry.p=pick; } }
  else if (pick!==q.answer && !S.wrong.some(w=>w.l===q.lessonId && w.n===q.no && !w.cleared)) S.wrong.push({l:q.lessonId, n:q.no, p:pick, iso:todayISO(), date:kdate(todayISO())});
  save(S); renderQuiz();
}

  else S.auth = null;
  try { mergeProgress(await DBX.loadProgress(progressKey())); } catch {}
  save(S); scheduleReminder(); show(home());
}
async function linkStudentCode(code){
  const r = await DBX.verifyCode(code); if (!r.ok) return r;
  S.auth = { code, name:r.student.name, cls:r.student.cls, until:r.student.until };
  if (ACC){ ACC = await DBX.updateMe({ studentCode: code }); if (!ACC.name && r.student.name) ACC = await DBX.updateMe({ name:r.student.name }); }
  try { mergeProgress(await DBX.loadProgress(code)); } catch {}
  save(S); return r;
}

      if (signRole==='parent' && child){ const s = await DBX.student(child); if (s) ACC = await DBX.updateMe({ childCode: child }); else toast('자녀 코드를 찾지 못했습니다. 내 정보에서 다시 연결해 주세요.'); }
      toast('가입되었습니다'); await afterLogin(ACC);
    } catch (err){ authErr = err.message; renderAuth(); }
    return;
  }
  if (T('#fgGo')){ const em=(document.getElementById('fgEmail').value||'').trim(); if (!validEmail(em)){ authErr='이메일 형식을 확인해 주세요.'; renderAuth(); return; }
    try { const r = await DBX.resetPassword(em); toast(r.note||'메일을 보냈습니다'); authMode='login'; authErr=''; renderAuth(); } catch (err){ authErr=err.message; renderAuth(); } return; }

  /* 빈칸 · 북마크 · 공유 */

    if (!blank.classList.contains('open') && c.blanks[key]){ blank.textContent=c.blanks[key]; blank.classList.add('open'); } return; }
  const bm = T('[data-bm]'); if (bm){ const id=bm.dataset.bm; const i=S.bm.indexOf(id); if (i<0){ S.bm.push(id); toast('북마크에 담았습니다'); } else { S.bm.splice(i,1); toast('북마크를 뺐습니다'); } save(S); bm.classList.toggle('on', i<0); return; }
  const sh = T('[data-share]'); if (sh){ const c = CONCEPTS.find(x=>x.id===sh.dataset.share); const text = `[${CFG.academy}] ${c.title} — ${plain(c.point)}\n${c.bookName} ${c.unit}-${c.lessonId.slice(2)} 개념 ${c.no}`;
    try { if (navigator.share) await navigator.share({ title:c.title, text }); else { await navigator.clipboard.writeText(text); toast('포인트를 복사했습니다'); } } catch {} return; }

  /* 오늘 */
  if (T('#okNotice')){ await DBX.markRead(T('#okNotice').dataset.id, S.auth.code); renderToday(); return; }
  if (T('#goQuiz')){ qState=null; show('quiz'); return; }
  if (T('#goStats')){ show('stats'); return; }
  if (T('#goReview')){ startReview(); return; }
  if (T('#goPlans') || T('#goPlansPill')){ if (!ACC){ authMode='start'; show('auth'); return; } show('plans'); return; }
  if (T('#backToday')){ const m = qState&&qState.mode; qState=null; show(m==='review'?'stats':home()); return; }
  if (T('#attOpen')){ openSheet(`<h3>출석 체크</h3><p>학원 입구 화면에 뜬 <b>4자리 숫자</b>를 치세요. 30초마다 바뀝니다.</p>
      <div class="f"><input id="attIn" class="big" inputmode="numeric" maxlength="4" placeholder="0000"></div><div class="err" id="attErr" style="font-size:12.5px;color:var(--no);margin:-4px 0 10px;font-weight:600"></div><button class="btn" id="attGo">출석</button>`);
    setTimeout(()=>document.getElementById('attIn')?.focus(), 50); return; }
  if (T('#attGo')){ const r = await DBX.markAttend(S.auth.code, (document.getElementById('attIn').value||'').trim());
    if (!r.ok){ document.getElementById('attErr').textContent = r.why; return; }
    closeSheet(); toast(r.dup ? `오늘은 이미 ${r.rec.time}에 출석했습니다` : `${r.rec.time} 출석${r.rec.late?' (지각)':''}`); touchDay(); save(S); renderToday(); return; }

  /* 문제 */
  const opt = T('.opt'); if (opt && view==='quiz' && !opt.disabled){ gradePick(+opt.dataset.p); return; }
  if (T('#grade')){
    if (qState.pick===null){ qState.pick=0; touchDay(); if (qState.mode==='today'){ const c=todayConcept(); if(!S.done.includes(c.id)) S.done.push(c.id); } save(S); renderQuiz(); }
    else if (qState.mode==='review') startReview();
    else if (qState.retry){ qState=null; renderQuiz(); }
    else { qState=null; show(home()); }
    return;
  }
  const rt = T('[data-retry]'); if (rt){ const [l,n] = rt.dataset.retry.split(':'); const w = S.wrong.find(x=>x.l===l && x.n===+n && !x.cleared); const q = QUIZZES.find(x=>x.lessonId===l && x.no===+n);
    if (w && q){ qState = { q, pick:null, retry:w, mode:'today' }; show('quiz'); } return; }

  /* 교재 · 상세 */
  const lf = T('[data-lf]'); if (lf){ listF = lf.dataset.lf; renderList(); return; }
  const row = T('.row'); if (row && view==='list'){ const i=+row.dataset.i;
    if (isOpen(i)){ detailIdx=i; show('detail'); }
    else openSheet(`<h3>아직 잠긴 개념입니다</h3><p>최근 ${FREE_DAYS}일치만 열려 있습니다. <b>학원 코드</b>나 <b>이용권</b>을 등록하면 전 범위가 열립니다.</p><button class="btn" id="goMe">내 정보로 가기</button><button class="btn ghost" id="sheetClose">닫기</button>`);
    return; }
  if (T('#goMe')){ closeSheet(); show('me'); return; }
  if (T('#backList')){ show('list'); return; }
  if (T('#markDone')){ const c = CONCEPTS[detailIdx]; if (!S.done.includes(c.id)) S.done.push(c.id); touchDay(); save(S); renderDetail(); toast('공부했음으로 표시했습니다'); return; }
  if (T('#prevC')){ detailIdx=Math.max(0,detailIdx-1); renderDetail(); window.scrollTo(0,0); return; }
  if (T('#nextC')){ detailIdx=Math.min(CONCEPTS.length-1,detailIdx+1); renderDetail(); window.scrollTo(0,0); return; }
  const mon = T('[data-mon]'); if (mon){ const [y,m]=statMonth.split('-').map(Number); const d=new Date(y, m-1+(+mon.dataset.mon), 1); statMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`; renderStats(); return; }

  /* 내 정보 */
  if (T('#codeGo')){ const v=(document.getElementById('codeIn').value||'').trim().toUpperCase(); if (!v){ codeErr='코드를 입력해 주세요.'; renderMe(); return; }
    try { const r = await linkStudentCode(v); if (r.ok){ codeErr=''; renderMe(); toast(`${r.student.name} 학생, 반갑습니다`); scheduleReminder(); } else { codeErr=r.why; renderMe(); } } catch (err){ codeErr=err.message; renderMe(); } return; }
  if (T('#childGo')){ const v=(document.getElementById('childIn').value||'').trim().toUpperCase(); if (!v){ childErr='코드를 입력해 주세요.'; (view==='parent'?renderParent:renderMe)(); return; }
    try { const s = await DBX.student(v); if (!s){ childErr='그 코드의 학생을 찾을 수 없습니다. 자녀에게 받은 코드를 다시 확인해 주세요.'; (view==='parent'?renderParent:renderMe)(); return; }
      ACC = await DBX.updateMe({ childCode: v }); childErr=''; toast(`${s.name} 학생과 연결했습니다`); show('parent'); } catch (err){ childErr=err.message; (view==='parent'?renderParent:renderMe)(); } return; }
  if (T('#unlinkChild')){ ACC = await DBX.updateMe({ childCode: '' }); renderParent(); return; }
  if (T('#unauth')){ if (!confirm('학원 코드 연결을 해제할까요? 공지·출석이 닫힙니다.')) return; S.auth=null; if (ACC) ACC = await DBX.updateMe({ studentCode:'' }); save(S); renderMe(); return; }
  if (T('#logout')){ if (!confirm('로그아웃할까요? 진도는 계정에 저장되어 있습니다.')) return; await DBX.signOut(); ACC=null; S.auth=null; save(S); authMode='start'; show('auth'); return; }
  if (T('#delAccount')){ if (!confirm('계정을 삭제하면 진도·오답 노트가 함께 지워지고 되돌릴 수 없습니다. 삭제할까요?')) return;
    try { await DBX.deleteAccount(); ACC=null; S = { start:todayISO(), done:[], wrong:[], read:[], days:[], bm:[], stats:{a:0,c:0}, fs:S.fs, theme:S.theme, notifyAt:S.notifyAt }; localStorage.removeItem(KEY); authMode='start'; toast('계정을 삭제했습니다'); show('auth'); } catch (err){ toast(err.message); } return; }
  if (T('#editProfile')){ openSheet(`<h3>이름 · 연락처</h3><div class="f"><input id="epName" placeholder="이름" value="${esc(ACC.name)}" style="flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink)"></div>
      <div class="f"><input id="epPhone" placeholder="연락처" inputmode="tel" value="${esc(ACC.phone)}" style="flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink)"></div>
      <button class="btn" id="epSave">저장</button><button class="btn ghost" id="sheetClose">취소</button>`); return; }
  if (T('#epSave')){ const name=(document.getElementById('epName').value||'').trim(), phone=(document.getElementById('epPhone').value||'').trim(); if (!name){ toast('이름을 넣어 주세요'); return; }
    ACC = await DBX.updateMe({ name, phone }); closeSheet(); renderMe(); toast('저장했습니다'); return; }
  const st = T('[data-set]'); if (st){ S[st.dataset.set]=st.dataset.val; save(S); applyPrefs(); renderMe(); return; }
  if (T('#backMe') || T('#backMe2')){ show('me'); return; }

    try { const r = await DBX.redeemPass(v); if (r.ok){ ACC = await DBX.me(); passErr=''; toast(`${kdate(r.until)}까지 전 범위가 열렸습니다`); renderPlans(); } else { passErr=r.why; renderPlans(); } } catch (err){ passErr=err.message; renderPlans(); } return; }
  const buy = T('[data-buy]'); if (buy){ toast('스토어 결제는 심사 후 열립니다. 이용권 코드는 지금도 등록됩니다.'); return; }

  /* 원장 */

  if (T('#ntSend')){ const cls=document.getElementById('ntCls').value, t=(document.getElementById('ntT').value||'').trim(), d=(document.getElementById('ntD').value||'').trim(); if (!t){ toast('제목을 적어 주세요'); return; }
    admCls=cls; await DBX.sendNotice(cls, t, d); toast(`${cls}에 보냈습니다`); renderAdmin(); return; }
  const am = T('[data-amon]'); if (am){ const [y,m]=admMonth.split('-').map(Number); const d=new Date(y, m-1+(+am.dataset.amon), 1); admMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`; renderAdmin(); return; }
  if (T('#clsAdd')){ const n=(document.getElementById('clsName').value||'').trim(), s=document.getElementById('clsStart').value||'18:00'; if (!n){ toast('반 이름을 넣어 주세요'); return; } await DBX.addClass(n, s); renderAdmin(); return; }
  const dc = T('[data-delcls]'); if (dc){ if (confirm(`${dc.dataset.delcls} 반을 삭제할까요? 학생은 남고 반만 사라집니다.`)){ await DBX.removeClass(dc.dataset.delcls); renderAdmin(); } return; }
  if (T('#passIssue')){ issuedPass = await DBX.issuePass(+document.getElementById('passDays').value); renderAdmin(); return; }

/* ═══ 시작 ═══ */
(async () => {
  try { ACC = await DBX.me(); } catch { ACC = null; }
  if (ACC){
    if (ACC.role==='student' && ACC.studentCode && !S.auth){ try { const r = await DBX.verifyCode(ACC.studentCode); if (r.ok) S.auth = { code:ACC.studentCode, name:r.student.name, cls:r.student.cls, until:r.student.until }; } catch {} }
    if (S.auth && ACC.role!=='student') S.auth = null;

})();
