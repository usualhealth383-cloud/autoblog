<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박찬 과학 · 하루 한 개념</title>
<meta name="description" content="통합과학 개념 하나를 매일 배달합니다. 학원 강의 교재를 그대로 옮겼습니다.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#147D6F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="박찬 과학">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<!-- 웹폰트는 첫 화면을 막지 않는다. 망이 느리면(지하철·학교 와이파이) 기기 한글 고딕으로 먼저 읽히고,
     폰트가 도착하면 자연스럽게 바뀐다. media 를 print 로 두었다가 onload 에서 all 로 올리는 방법. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" crossorigin="anonymous" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&family=Noto+Serif+KR:wght@400;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&family=Noto+Serif+KR:wght@400;700&display=swap"></noscript>
<style>
:root{
  --paper:#FAF8F4; --ground:#EFECE6; --card:#FFFFFF;
  --ink:#1E2A2E; --body:#3A484D; --muted:#566268; --faint:#5E6B70;
  --line:#E2DED6; --hair:#EDE9E2;
  --u:#147D6F; --u-soft:#E7F5F1; --u-line:#C9E7DF; --u-dark:#0F6357;
  /* 브랜드 색 — 앱 껍데기(탭·기본 버튼·시작 화면)는 단원과 무관하게 늘 이 색이다 */
  --brand:#147D6F; --brand-soft:#E7F5F1; --brand-line:#C9E7DF; --brand-dark:#0F6357;
  /* 색이 깔린 자리에 얹는 글자 — 밝은 모드는 흰색, 어두운 모드는 브랜드 색이 밝아지므로 짙은 색 */
  --on-color:#FFFFFF; color-scheme:light;
  --no:#C0392B; --no-soft:#FBECEA; --warn:#8A6408; --warn-soft:#FFF7E0;
  /* 정답 색 — 단원 색(--u)과 따로. I단원 테라코타가 오답 빨강과 닮아 정답이 오답처럼 보였다(2026-10-06 디자인 감사) */
  --ok:#147D6F; --ok-soft:#E7F5F1; --ok-dark:#0F6357;
  /* 그림 받침 — 그림 SVG 는 진한 글자를 투명 바탕에 얹는다. 어두운 화면에서는 밝은 종이를 깔아 글자가 보이게 */
  --figplate:transparent;
  --shadow:0 4px 20px rgba(30,42,46,.07);
  /* 웹폰트가 늦거나 막혀도 한글이 바탕체로 떨어지지 않도록 기기 고딕을 명시한다 */
  /* 화면 가장자리 안전 영역 — Android 15·16(API 35·36)은 앱을 상태바·제스처 막대 밑까지 그린다(끌 수 없음).
     Capacitor 가 넣어 주는 --safe-area-inset-*(옛 WebView 에서도 정확)을 먼저, 없으면 env() */
  --sat:var(--safe-area-inset-top, env(safe-area-inset-top, 0px)); --sab:var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --sal:var(--safe-area-inset-left, env(safe-area-inset-left, 0px)); --sar:var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
  /* 글자 크기 7단계 + 발문 16 + 큰 숫자 44(2026-10-06 디자인 감사 #3 — 26가지를 모음). 글자 크기 설정(작게·크게)은 화면 배율로 따로 곱한다.
     · hero 화면 머리(시작·소개) · h1 화면 제목·지금 단계 · h2 카드 제목·시트 · stem 문제 발문·선지 · body 본문·버튼
     · small 보조 글·목록 설명 · cap 날짜·메타·칩 · tab 탭 이름·가장 작은 표지(이보다 작게 쓰지 않는다)
     굵기는 400(본문) · 700(라벨·버튼·강조) · 900(제목·큰 숫자) 세 가지만 */
  --t-hero:28px; --t-h1:22px; --t-h2:18px; --t-stem:16px; --t-body:15px; --t-small:13.5px; --t-cap:12.5px; --t-tab:11.5px; --t-num:44px;
  /* 모서리 4가지(감사 #12): 칩·입력 · 버튼·선지·작은 카드 · 카드·시트 · 알약 */
  --r-s:10px; --r-m:14px; --r-l:20px; --r-pill:999px;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Noto Serif KR','Apple SD Gothic Neo',Georgia,'Nanum Myeongjo',serif;
}
:root[data-theme="light"]{ color-scheme:light; }
:root[data-unit="I"]{ --u:#AE4A1B; --u-soft:#FBEFE7; --u-line:#F0D9C7; --u-dark:#A64516; }
:root[data-unit="II"]{ --u:#147D6F; --u-soft:#E7F5F1; --u-line:#C9E7DF; --u-dark:#0F6357; }
:root[data-unit="III"]{ --u:#4053B8; --u-soft:#ECEFFA; --u-line:#D9DFF5; --u-dark:#2E3E96; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14191B; --ground:#0B0F10; --card:#1B2224;
    --ink:#EDEAE4; --body:#C3CCCE; --muted:#9AA6A9; --faint:#8B9699;
    --line:#2C3538; --hair:#242C2E;
    --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6;
    --brand:#4FBFAC; --brand-soft:#122724; --brand-line:#1D3D38; --brand-dark:#7FD6C6;
    --on-color:#0B1614; color-scheme:dark;
    --no:#E4776A; --no-soft:#2C1A18; --warn:#D9A73C; --warn-soft:#2A2314;
    --ok:#4FBFAC; --ok-soft:#122724; --ok-dark:#7FD6C6; --figplate:#E4E0D8;
    --shadow:0 4px 20px rgba(0,0,0,.45);
  }
  :root:not([data-theme="light"])[data-unit="I"]{ --u:#E4885A; --u-soft:#2A1D16; --u-line:#412A1E; --u-dark:#F0A275; }
  :root:not([data-theme="light"])[data-unit="II"]{ --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6; }
  :root:not([data-theme="light"])[data-unit="III"]{ --u:#8B99E4; --u-soft:#191D2E; --u-line:#2A3054; --u-dark:#A9B4EE; }
}
:root[data-theme="dark"]{
  --paper:#14191B; --ground:#0B0F10; --card:#1B2224;
  --ink:#EDEAE4; --body:#C3CCCE; --muted:#9AA6A9; --faint:#8B9699;
  --line:#2C3538; --hair:#242C2E;
  --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6;
  --brand:#4FBFAC; --brand-soft:#122724; --brand-line:#1D3D38; --brand-dark:#7FD6C6;
  --on-color:#0B1614; color-scheme:dark;
  --no:#E4776A; --no-soft:#2C1A18; --warn:#D9A73C; --warn-soft:#2A2314;
  --ok:#4FBFAC; --ok-soft:#122724; --ok-dark:#7FD6C6; --figplate:#E4E0D8;
  --shadow:0 4px 20px rgba(0,0,0,.45);
}
:root[data-theme="dark"][data-unit="I"]{ --u:#E4885A; --u-soft:#2A1D16; --u-line:#412A1E; --u-dark:#F0A275; }
:root[data-theme="dark"][data-unit="II"]{ --u:#4FBFAC; --u-soft:#122724; --u-line:#1D3D38; --u-dark:#7FD6C6; }
:root[data-theme="dark"][data-unit="III"]{ --u:#8B99E4; --u-soft:#191D2E; --u-line:#2A3054; --u-dark:#A9B4EE; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font-family:var(--sans);
  word-break:keep-all;line-height:1.6;display:flex;justify-content:center;
  min-height:100vh;font-size:var(--fs,15px)}
.app{width:100%;max-width:440px;background:var(--paper);min-height:100vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative;padding:var(--sat) var(--sar) 0 var(--sal)}
.stripe{height:4px;background:var(--brand);flex:0 0 auto}
main{flex:1;padding:16px 18px calc(96px + var(--sab));overflow-x:hidden;overflow-x:clip}   /* clip: 가로 넘침만 자르고, 가입 화면 아래 고정 버튼(sticky)은 살린다 */
.hide{display:none!important}
button{font-family:inherit;color:inherit}

/* 상단 바 */
/* 이번 주 리듬 — 월–일 점 7개. 이어진 날(연속)은 세지 않는다 */
.rhythm{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:10px 14px;margin:2px 0 13px}
.rhythm .k{flex:0 0 auto;font-size:var(--t-cap);font-weight:700;color:var(--muted);line-height:1.3}
.rhythm .dots{flex:1;display:flex;justify-content:space-between;gap:4px;max-width:236px;margin-left:auto}
.rhythm .dt{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--t-tab);font-weight:700;color:var(--faint);min-width:18px}
.rhythm .dt i{display:block;width:10px;height:10px;border-radius:50%;background:var(--hair);border:1.5px solid var(--line)}
.rhythm .dt.on i{background:var(--u);border-color:var(--u)}
.rhythm .dt.today{color:var(--u)}
.rhythm .dt.today i{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--u)}
.rhythm .dt.later i{background:transparent;border-style:dashed}
.rhythm .n{flex:0 0 auto;font-size:var(--t-body);font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.rhythm .n small{font-size:var(--t-tab);color:var(--muted);font-weight:700}
.rhythm.tile{flex-direction:column;gap:6px;background:none;border:none;padding:0;margin:0}
.rhythm.tile .dots{max-width:none;width:100%;margin:0;gap:2px}
.rhythm.tile .dt{min-width:0;font-size:0;gap:0}
.rhythm.tile .dt i{width:8px;height:8px}
.rhythm.tile .k{order:3;font-size:var(--t-tab);font-weight:400;color:var(--muted)}
.rhythm.tile .n{order:1;font-size:var(--t-h1);line-height:1.2}
.rhythm.tile .n small{font-size:var(--t-cap);font-weight:700}
.rhythm.tile .dots{order:2}
.tile.rtile{padding:12px 8px}
.week .d.later i{background:transparent;border:1.5px dashed var(--line)}
/* 오늘의 복습 카드 — 차분하게, 숫자 하나 */
.revcard{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;text-align:left;background:var(--card);border:1px solid var(--u-line);border-radius:var(--r-l);padding:12px 14px;margin:-2px 0 13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.revcard .ic{flex:0 0 38px;height:38px;border-radius:var(--r-m);background:var(--u-soft);display:grid;place-items:center}
.revcard .ic svg{width:20px;height:20px;stroke:var(--u);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.revcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.revcard .tx b{font-size:var(--t-body);font-weight:700}
.revcard .tx b em{font-style:normal;color:var(--u);font-variant-numeric:tabular-nums;margin-left:2px}
.revcard .tx span{font-size:var(--t-cap);color:var(--muted);line-height:1.5}
.revcard .chev{flex:0 0 18px;width:18px;height:18px;stroke:var(--faint);stroke-width:2.2;fill:none;stroke-linecap:round}
.revcard.done{cursor:default;border-color:var(--hair)}
/* ═ 오늘 — 하루 경로(홈 시안 C, 원장님 결정 2026-10-06) ═
   개념 읽기 → 빈칸 ㉠㉡㉢ → 오늘의 문제 → 다시 볼 문제. 가는 회색 선 하나에 단계마다 점:
   끝낸 단계 = 단원 색 점(접힘·흐리게) · 지금 단계 = 브랜드 색 고리 + 큰 카드(화면의 히어로는 이것 하나) · 아직 = 빈 점, 작은 카드.
   움직임은 단계를 끝내고 돌아왔을 때 다음 단계 카드가 펼쳐지는 것 하나(240ms, 줄임 설정이면 없음). 별·불꽃·캐릭터 없음
   카드 형태는 세 가지만(감사 #9): ① 히어로(흰 바탕 + 옅은 그림자, 화면당 1개) ② 카드(흰 바탕 + 가는 테두리) ③ 줄(카드 없이) */
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 2px 10px}
.phead h2{font-size:var(--t-cap);font-weight:700;color:var(--muted);margin:0}
.phead .n{font-size:var(--t-cap);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.path{list-style:none;position:relative;margin:0 0 14px;padding:0 0 0 28px}
.path::before{content:"";position:absolute;left:9px;top:26px;bottom:26px;width:1.5px;background:var(--line);border-radius:var(--r-pill)}
.ps{position:relative;margin:0 0 8px}
.ps:last-child{margin-bottom:0}
.ps::before{content:"";position:absolute;left:-23.5px;top:23px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);box-sizing:border-box}
.ps.done::before{background:var(--u);border-color:var(--u)}
.ps.none::before{border-style:dashed}
.ps.now::before{left:-25.5px;top:24px;width:14px;height:14px;border:2.5px solid var(--brand);background:var(--paper);box-shadow:0 0 0 4px var(--brand-soft)}
/* 작은 단계 카드(아직 · 끝냄) — 줄 하나에 이름과 상태 */
.pc{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:9px 14px;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);font-family:inherit;color:var(--ink);cursor:pointer}
.pc .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pc .t{font-size:var(--t-body);font-weight:700;line-height:1.45}
.pc .d{font-size:var(--t-cap);color:var(--muted);line-height:1.5}
.pc svg{flex:0 0 18px;width:18px;height:18px;stroke:var(--faint);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ps.done .pc{background:transparent;border-color:transparent;min-height:48px;padding-block:6px}
.ps.done .pc .t{color:var(--muted)}
.ps.done .pc svg{stroke:var(--faint)}
.ps.none .pc{cursor:default;background:transparent;border:1px dashed var(--line)}
.ps.none .pc .t{color:var(--muted)}
/* 지금 단계 — 제목 · 한 줄 설명 · 버튼 하나 */
.pnow{background:var(--card);border:1px solid var(--brand-line);border-radius:var(--r-l);padding:16px 18px 18px;box-shadow:var(--shadow)}
.pnow .k{display:block;font-size:var(--t-cap);font-weight:700;color:var(--brand-dark);margin:0 0 6px}
.pnow h3{font-size:var(--t-h1);font-weight:900;letter-spacing:-.02em;line-height:1.3;margin:0 0 4px;color:var(--ink)}
.pnow .hb{display:grid;grid-template-rows:1fr}
.pnow .hb>div{min-height:0}
.pnow p{font-size:var(--t-body);color:var(--body);line-height:1.65;margin:0}
.pnow .m{font-size:var(--t-cap);color:var(--muted);margin:4px 0 0;line-height:1.55}
.pnow .btn{margin:14px 0 0}
.ps.unfold .hb>div{overflow:hidden}
.ps.unfold .hb{animation:pfold .24s cubic-bezier(.2,.7,.3,1)}
@keyframes pfold{from{grid-template-rows:0fr;opacity:0}to{grid-template-rows:1fr;opacity:1}}
@media (prefers-reduced-motion: reduce){.ps.unfold .hb{animation:none}}
/* 오늘 다 끝냄 — 차분하게 한 장(축하 효과 없음) */
.pnow.fin{border-color:var(--hair)}
.pnow.fin h3{text-wrap:balance;margin-bottom:6px}
.pnow.fin .linkbtn{padding:12px 2px 0;min-height:44px;font-weight:700;color:var(--brand-dark);text-decoration:none}
/* 손님·무료 범위 — 경로 밑 한 줄 */
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px 0 14px 28px;font-size:var(--t-cap);color:var(--muted);line-height:1.6}
.pfoot .linkbtn{flex:0 0 auto;padding:0 2px;min-height:44px;font-size:var(--t-cap);font-weight:700;color:var(--brand-dark);text-decoration:none}
/* 빈칸 채우기 시트 — 문장 하나에 칸 하나 */
.sheet p.bklead{margin-bottom:12px}
.bkl{list-style:none;display:flex;flex-direction:column;gap:14px;margin:0 0 16px;padding:0}
.bkl li{border-top:1px solid var(--hair);padding-top:12px}
.bkl li:first-child{border-top:none;padding-top:0}
.sheet p.bks{font-size:var(--t-body);line-height:1.75;color:var(--ink);margin:0 0 8px}
.bkx{display:inline-block;min-width:44px;text-align:center;font-weight:700;color:var(--brand-dark);background:var(--brand-soft);border-bottom:2px solid var(--brand);border-radius:var(--r-s) var(--r-s) 0 0;padding:0 8px;margin:0 2px}
.bkin{display:flex;align-items:center;gap:8px}
.bkin .k{flex:0 0 auto;font-size:var(--t-body);font-weight:700;color:var(--brand-dark)}
.sheet .bkin input{flex:1;min-width:0;font-size:var(--t-stem)}
.sheet p.bkr{display:flex;align-items:flex-start;gap:6px;margin:0;font-size:var(--t-small);line-height:1.6;color:var(--body)}
.bkr b{color:var(--ink)}
.bkr.ok{color:var(--ok-dark)}
.bkr svg{flex:0 0 16px;width:16px;height:16px;margin-top:3px;stroke:var(--ok);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* 경로 아래 작은 카드 — '이번 주'(리듬 · 일정 · 공부 노트 · 진도)를 한 장에 줄로 */
.hsum{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);padding:2px 16px;margin:0 0 12px}
.hsum .rhythm{background:none;border:none;border-radius:0;padding:12px 0;margin:0;border-bottom:1px solid var(--hair)}
.hrow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 0;border:none;border-bottom:1px solid var(--hair);background:none;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer;border-radius:0;margin:0}
.hsum>:last-child{border-bottom:none}
.hrow .ic{flex:0 0 40px;height:40px;border-radius:var(--r-s);background:var(--ground);display:grid;place-items:center;color:var(--muted)}
.hrow .ic svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hrow .tx b{font-size:var(--t-small);font-weight:700;line-height:1.45}
.hrow .tx span{font-size:var(--t-cap);color:var(--muted);line-height:1.55}
.hrow .dd{flex:0 0 auto;font-size:var(--t-cap);font-weight:700;color:var(--brand-dark);background:var(--brand-soft);border-radius:var(--r-pill);padding:4px 10px;font-variant-numeric:tabular-nums}
.hrow>svg{flex:0 0 16px;width:16px;height:16px;stroke:var(--faint);stroke-width:2.2;fill:none;stroke-linecap:round}
.hrow svg.ring{flex:0 0 40px;width:40px;height:40px}
.hsum .tnote{border:none;border-bottom:1px solid var(--hair);border-radius:0;padding:10px 0;margin:0;background:none;gap:12px;align-items:center;min-height:58px}
.hsum .tnote .pg{flex:0 0 40px;height:40px;border-radius:var(--r-s);padding:0}
.hsum .tnote .pg small{padding:0;margin:0;line-height:1.45}
.hsum .tnote .pg b{font-size:var(--t-body);line-height:1.2}
.hsum .tnote .pg i,.hsum .tnote .tx em{display:none}
.hsum .tnote .tx{gap:1px}
.hsum .tnote .tx b{font-size:var(--t-small)}
.hsum .tnote .tx span{font-size:var(--t-cap);color:var(--muted);line-height:1.55;display:block;overflow:visible;-webkit-line-clamp:unset}
.hsum .tnote>svg{flex-basis:16px;width:16px;height:16px}
/* 학원 과제 카드(★4) — 복습 카드와 같은 모양, 이름 한 줄 더. 마감이 지나도 색으로 다그치지 않는다(글로만 '마감 지남 · 늦게 내도 받아요') */
.asgcard .tx b .k{font-size:var(--t-tab);font-weight:700;color:var(--u-dark);background:var(--u-soft);border-radius:var(--r-pill);padding:1px 8px;margin-left:4px;vertical-align:1px}
.revcard.asgcard .tx span.t{font-size:var(--t-small);font-weight:700;color:var(--ink);line-height:1.45}
.asgmore{text-align:left;padding:0 4px 12px;margin-top:-6px}
.asgbar{display:flex;align-items:center;gap:8px;background:var(--u-soft);border:1px solid var(--u-line);border-radius:12px;padding:9px 12px;margin:0 0 12px}
.asgbar .k{font-size:11.5px;font-weight:800;color:var(--u-dark);white-space:nowrap}
.asgbar .t{flex:1;min-width:0;font-size:12.5px;color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asgbar .n{font-weight:900;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.asgbar .n small{font-size:11.5px;color:var(--muted);font-weight:700}
.asgsent{color:var(--brand-dark);font-weight:700}
.qhead .rk{display:inline-block;font-size:var(--t-tab);font-weight:700;color:var(--u);background:var(--u-soft);border-radius:var(--r-pill);padding:1px 8px;margin-right:6px}
.revnext{justify-content:center;font-size:var(--t-small);margin:0 0 14px}
/* 여러 번 갈린 문제 — 다시 묻지 않고 개념 카드로 */
.leechcard{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);padding:16px;margin:4px 0 13px}
.leechcard .h{font-size:var(--t-body);font-weight:900;color:var(--ink);margin-bottom:6px}
.leechcard p{font-size:var(--t-small);color:var(--body);line-height:1.7;margin-bottom:8px}
.leechcard p.c{font-size:var(--t-cap);color:var(--muted);font-weight:700;margin-bottom:12px}
.leechcard .btn{margin-bottom:8px}
p.leech{font-size:var(--t-cap);color:var(--muted);line-height:1.6;margin:-4px 0 8px}
.pausenote{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:8px 8px 8px 14px;margin:0 0 13px;font-size:var(--t-cap);line-height:1.6;color:var(--body)}
.pausenote .linkbtn{flex:0 0 auto;min-height:44px;padding:0 10px;font-weight:700;color:var(--brand-dark)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .date{font-size:var(--t-small);color:var(--muted)}
.top .hello{font-size:var(--t-h2);font-weight:900;letter-spacing:-.01em;line-height:1.35;margin:0}
.top .hello small{display:block;font-size:var(--t-cap);color:var(--muted);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-cap);font-weight:700;
  color:var(--u-dark);background:var(--u-soft);padding:5px 11px;border-radius:var(--r-pill)}
.pill svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.pill.grey{background:var(--hair);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* 공지 */
.notice{display:flex;gap:10px;background:#FBEFE7;border:1px solid #F0D9C7;
  border-radius:var(--r-m);padding:11px 13px;margin-bottom:13px;align-items:flex-start}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .notice{background:#2A1D16;border-color:#412A1E} } :root[data-theme="dark"] .notice{background:#2A1D16;border-color:#412A1E}   /* 어두운 화면에서만(밝은 화면에 새던 것 — 2026-10-01) */
.notice .ic{width:21px;height:21px;border-radius:50%;background:#A64516;flex:0 0 auto;
  display:grid;place-items:center;margin-top:1px;color:var(--on-color);font-size:var(--t-cap);font-weight:900}
.notice .b{flex:1;min-width:0}
.notice .t{font-size:var(--t-cap);font-weight:700;color:#A64516;line-height:1.45}   /* 대비 AA(2026-10-06 — #C1521E 는 4.1)*/
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .notice .t{color:#E4885A} } :root[data-theme="dark"] .notice .t{color:#E4885A}   /* 어두운 화면에서만(밝은 화면에 새던 것 — 2026-10-01) */
.notice .d{font-size:var(--t-tab);color:var(--body);line-height:1.5;margin-top:2px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .notice .ic{background:#E4885A} :root:not([data-theme="light"]) .notice button{color:#E4885A;border-color:#412A1E} } :root[data-theme="dark"] .notice .ic{background:#E4885A} :root[data-theme="dark"] .notice button{color:#E4885A;border-color:#412A1E}
.notice button{font-size:var(--t-tab);font-weight:700;color:#A64516;border:1px solid #F0D9C7;
  background:var(--card);border-radius:var(--r-s);padding:6px 11px;flex:0 0 auto;align-self:center;cursor:pointer}

/* 개념 카드 */
.card{background:var(--card);border:1px solid var(--u-line);border-radius:17px;
  padding:18px;position:relative;overflow:hidden;margin-bottom:13px}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--u)}
.loc{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--u);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.loc .acts{display:flex;gap:4px}
.loc .acts button{background:none;border:1px solid var(--hair);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.loc .acts button svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.loc .acts button.on{color:var(--warn);border-color:var(--warn)}
.loc .acts button.on svg{fill:var(--warn)}
h1{font-size:var(--t-h1);font-weight:900;letter-spacing:-.025em;line-height:1.3;margin-bottom:3px}
.sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.steps{margin:2px 0 16px}
.step{display:grid;grid-template-columns:26px 1fr;column-gap:9px;align-items:baseline;
  border-top:1px solid var(--hair);padding:11px 0 12px}
.step:first-child{border-top:2.5px solid var(--u);padding-top:10px}
.step .n{grid-column:1;font-size:14px;font-weight:900;color:var(--u);font-family:var(--serif)}
.step .t{grid-column:2;font-size:14.5px;font-weight:800;margin:0;line-height:1.4;letter-spacing:-.01em}
.step .d{grid-column:2;font-size:13.5px;color:var(--body);line-height:1.75;margin-top:4px}
figure{background:var(--u-soft);border-radius:11px;padding:12px 8px 8px;text-align:center;margin-bottom:15px}
figure svg{max-width:100%;height:auto;background:var(--figplate);border-radius:8px}
figcaption{font-size:11.5px;color:var(--u-dark);font-weight:700;margin-top:7px;padding:0 6px;line-height:1.5}
.howto{background:#FFFDF6;border:1px solid #EBDDB8;border-radius:11px;padding:11px 14px;margin-bottom:15px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .howto{background:#221E12;border-color:#3B3320} } :root[data-theme="dark"] .howto{background:#221E12;border-color:#3B3320}   /* 어두운 화면에서만(밝은 화면에 새던 것 — 2026-10-01) */
.howto .k{font-size:11px;font-weight:900;color:#B4830A;letter-spacing:.1em;display:block;margin-bottom:7px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .howto .k{color:#D9A73C} } :root[data-theme="dark"] .howto .k{color:#D9A73C}   /* 어두운 화면에서만(밝은 화면에 새던 것 — 2026-10-01) */
.howto li{font-size:12.5px;line-height:1.7;color:var(--body);margin-bottom:5px;list-style:none;padding-left:15px;text-indent:-15px}
.howto li b.n{color:#B4830A;font-weight:900;margin-right:6px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .howto li b.n{color:#D9A73C} } :root[data-theme="dark"] .howto li b.n{color:#D9A73C}   /* 어두운 화면에서만(밝은 화면에 새던 것 — 2026-10-01) */
.prose p{font-family:var(--serif);font-size:15px;line-height:2;color:var(--body);margin-bottom:15px}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--ink);font-weight:700}
button.blank{display:inline-block;min-width:52px;text-align:center;border:none;
  border-bottom:2px solid var(--u);background:var(--u-soft);color:var(--u);
  font-weight:800;font-family:var(--sans);font-size:13px;
  padding:3px 8px;border-radius:5px 5px 0 0;cursor:pointer;font-feature-settings:normal}
button.blank.open{background:transparent;color:var(--u-dark)}

/* 부속 카드 */
.sec{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:15px 17px;margin-bottom:13px}
.sec h2{font-size:var(--t-cap);font-weight:700;letter-spacing:0;color:var(--muted);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
.sec h2 .more{font-size:var(--t-tab);font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;letter-spacing:0;min-height:36px;min-width:36px;padding:0 8px}
.terms dt{font-size:13px;font-weight:800;color:var(--u-dark);margin-bottom:3px}
.terms dd{font-size:13px;color:var(--body);line-height:1.72;padding-bottom:11px;margin-bottom:11px;border-bottom:1px solid var(--hair)}
.terms dd:last-child{border:none;padding-bottom:0;margin-bottom:0}
.myth{background:var(--u-soft);border-radius:11px;padding:11px 13px;margin-bottom:8px;font-size:12.5px;line-height:1.7}
.myth:last-child{margin-bottom:0}
.myth .x{color:var(--no);font-weight:900}
.myth .o{color:var(--u-dark);font-weight:900}
.myth .w{color:var(--muted);font-weight:900}
.myth .why{display:block;margin-top:3px;color:var(--body)}
.point{background:var(--u-soft);border-left:4px solid var(--u);border-radius:0 13px 13px 0;padding:14px 17px;margin-bottom:13px}
.point .k{font-size:11.5px;font-weight:900;color:var(--u-dark);letter-spacing:.13em;display:block;margin-bottom:6px}
.point p{font-size:14.5px;font-weight:700;line-height:1.78}

/* 버튼 */
.btn{display:block;width:100%;text-align:center;font-size:var(--t-body);font-weight:700;padding:15px;border-radius:var(--r-m);border:none;
  background:var(--brand);color:var(--on-color);cursor:pointer;letter-spacing:-.01em;margin-bottom:13px}
.btn:disabled{background:var(--line);color:var(--faint);cursor:default}
/* 앱처럼: 누르면 살짝 눌리고, 파란 반짝임·300ms 터치 지연은 없다. 단추 글자는 길게 눌러도 선택되지 않는다 */
button,a,label,.tab,.pcard,.stu,.setrow{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,.tab,.btn,.chip,.chipbar button,.seg button{-webkit-user-select:none;user-select:none}
.btn,.pcard,.setrow.go,.stu,.roles button,.ages label,.tab,.chip,.more,.mini,.opt{transition:transform .08s ease,background-color .15s ease}
.btn:not(:disabled):active,.pcard:active,.setrow.go:active,.stu:active,.roles button:active,.ages label:active,.chip:active,.opt:not(:disabled):active{transform:scale(.985)}
.tab:active svg{transform:scale(.9)}
.vin{animation:vin .18s ease-out}
@keyframes vin{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.figslot{display:block;margin:0 auto 6px;border-radius:var(--r-s);background:linear-gradient(90deg,var(--hair) 0%,var(--ground) 45%,var(--hair) 90%);background-size:220% 100%;animation:shim 1.2s linear infinite}
.skel{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.skel i{display:block;border-radius:var(--r-m);background:linear-gradient(90deg,var(--hair) 0%,var(--ground) 45%,var(--hair) 90%);background-size:220% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-120% 0}}
#ptr{position:fixed;left:50%;top:calc(6px + var(--sat));z-index:60;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.14);display:grid;place-items:center;opacity:0;transform:translateY(-50px);pointer-events:none}
#ptr svg{width:20px;height:20px;stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linecap:round}
#ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.vin,.skel i,.figslot,#ptr.spin svg{animation:none}.btn,.pcard,.setrow.go,.stu{transition:none}}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-dark)}
.btn.danger{background:var(--no);color:var(--on-color)}
/* 확인 묻기 — 기기 기본 대화상자(주소가 찍히는 회색 창) 대신 앱 안의 작은 시트. 열린 시트 위에도 뜬다 */
.sheet-bg.yn-bg{z-index:45}
.sheet.yn{padding-top:22px}
.sheet.yn p{font-size:var(--t-body);color:var(--ink);line-height:1.65;margin-bottom:18px;word-break:keep-all}
.sheet.yn .ynb{display:flex;gap:8px}
.sheet.yn .ynb .btn{margin:0;flex:1}
.btn.sm{font-size:var(--t-small);padding:11px;margin-bottom:8px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:var(--t-small);cursor:pointer;text-decoration:underline;padding:14px 2px}
.linkbtn.danger{color:var(--no)}

/* 문제 */
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.qhead .l{font-size:var(--t-small);font-weight:900;flex:1;min-width:0}
.qhead .tag{flex:0 0 auto;white-space:nowrap;margin-left:8px}
.tag{font-size:var(--t-tab);font-weight:700;padding:4px 10px;border-radius:var(--r-pill);background:var(--u-soft);color:var(--u-dark)}   /* --u 는 연한 바탕 위에서 4.47:1 — AA 미달(2026-10 점검) */
/* 문제 발문 — 고딕 16px(원장님 결정 2026-10-06 ㉠). 명조는 개념 본문·명언 두 곳만 */
.stem{font-size:var(--t-stem);line-height:1.75;margin-bottom:13px;color:var(--ink)}
.bogi{border:1px solid var(--u-line);background:var(--u-soft);border-radius:var(--r-s);padding:12px 14px;margin-bottom:13px;font-size:var(--t-body);line-height:1.8}
.ask{font-size:var(--t-stem);line-height:1.75;margin-bottom:12px;font-weight:400}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt{display:flex;gap:9px;font-size:var(--t-stem);line-height:1.6;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--card);
  color:var(--body);cursor:pointer;text-align:left;width:100%}
.opt .m{font-weight:700;color:var(--faint);flex:0 0 auto}
.opt .tx{flex:1}
.opt .mk{margin-left:auto;font-size:var(--t-tab);font-weight:700;align-self:center;flex:0 0 auto}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.opt.ok .m,.opt.ok .mk{color:var(--ok-dark)}   /* --u 는 연한 바탕 위에서 4.47:1 — AA 미달(2026-10 모의고사 해설 점검) */
.opt.bad{border-color:var(--no);background:var(--no-soft);color:var(--ink)}
.opt.bad .m,.opt.bad .mk{color:var(--no)}
.verdict{background:var(--u-soft);border-left:4px solid var(--u);border-radius:0 var(--r-m) var(--r-m) 0;padding:13px 16px;margin-bottom:11px}
.verdict .h{font-size:var(--t-small);font-weight:900;color:var(--u-dark);margin-bottom:5px}
.verdict p{font-size:var(--t-body);line-height:1.75;color:var(--body)}
.again{display:flex;align-items:center;gap:7px;font-size:var(--t-cap);color:var(--muted);margin-bottom:13px;line-height:1.5}
.again b{color:var(--u);font-weight:700}
.essay{width:100%;border:1.5px solid var(--line);border-radius:var(--r-m);padding:13px;font-family:inherit;font-size:var(--t-body);line-height:1.8;color:var(--ink);background:var(--card);
  resize:vertical;min-height:96px;margin-bottom:12px}
.essay:focus{outline:2px solid var(--u);outline-offset:-2px}

/* 목록 · 검색 */
.h-page{font-size:var(--t-h1);font-weight:900;letter-spacing:-.02em;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-m);padding:0 12px;margin-bottom:10px}
.search svg{width:16px;height:16px;stroke:var(--faint);stroke-width:2.2;fill:none;stroke-linecap:round;flex:0 0 auto}
.search input{flex:1;border:none;background:none;padding:11px 0;font-size:var(--t-body);font-family:inherit;color:var(--ink);min-width:0}
.search input:focus{outline:none}
.chipbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;padding-bottom:2px}
.chipbar button{flex:0 0 auto;font-size:var(--t-cap);font-weight:700;padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.chipbar button.on{background:var(--u);border-color:var(--u);color:var(--on-color)}
.book-h{font-family:var(--serif);font-size:var(--t-h2);font-weight:900;letter-spacing:-.01em;margin:26px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.book-h:first-of-type{margin-top:4px}
.unit-h{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
.unit-h:first-of-type{margin-top:4px}
.unit-h .no{font-size:var(--t-h2);font-weight:900;color:var(--u)}
.unit-h .nm{font-size:var(--t-small);font-weight:900}
.unit-h .ln{flex:1;height:2px;background:var(--u-line)}
.row{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--hair);cursor:pointer;width:100%;background:none;
  border-left:none;border-right:none;border-top:none;text-align:left}
.row .n{font-size:var(--t-tab);font-weight:900;color:var(--u-dark);background:var(--u-soft);border-radius:var(--r-s);padding:4px 7px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.row .b{flex:1;min-width:0}
.row .t{display:block;font-size:var(--t-body);font-weight:700;line-height:1.4}
.row .s{display:block;font-size:var(--t-tab);color:var(--faint);margin-top:1px}
.row .st{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.row .st svg{width:16px;height:16px;stroke:var(--u);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row .st svg.bm{stroke:var(--warn);fill:var(--warn)}
.row.locked{opacity:.45;cursor:default}
.row.locked .st svg{stroke:var(--faint);stroke-width:1.8}

/* 빈 상태 */
.empty{text-align:center;padding:56px 24px;color:var(--faint)}
.empty svg{width:44px;height:44px;stroke:var(--line);stroke-width:1.5;fill:none;margin-bottom:14px;stroke-linecap:round;stroke-linejoin:round}
.empty p{font-size:var(--t-small);line-height:1.8}

/* 진도 · 통계 */
.prog{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:15px 17px;margin-bottom:13px;cursor:pointer;width:100%;text-align:left}
.prog svg.ring{width:52px;height:52px;flex:0 0 auto}
.prog .lab{font-size:var(--t-cap);color:var(--muted)}
.prog .val{font-size:var(--t-h2);font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.prog .val small{font-size:var(--t-small);color:var(--muted);font-weight:700}
.prog .r{margin-left:auto;text-align:right}
.week{display:flex;gap:6px;justify-content:space-between;margin:2px 0 13px}
.week .d{flex:1;text-align:center;font-size:var(--t-tab);color:var(--faint);font-weight:700}
.week .d i{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:var(--r-s);background:var(--hair);
  margin-bottom:4px;border:1.5px solid transparent;font-style:normal;font-size:var(--t-cap);font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.week .d.on i{background:var(--u);border-color:var(--u);color:var(--on-color)}
.week .d.today i{border-color:var(--u);color:var(--u)}
.week .d.today{color:var(--u)}
.week .d.on.today i{color:var(--on-color);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--u)}   /* 오늘 공부했으면: 채운 칸 + 바깥 고리(숫자가 배경색에 묻히지 않게) */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.tile{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:12px 10px;text-align:center}
.tile .v{font-size:var(--t-h1);font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--ink)}
.tile .v small{font-size:var(--t-cap);color:var(--muted);font-weight:700}
.tile .l{font-size:var(--t-tab);color:var(--muted);margin-top:3px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:var(--t-cap);padding:7px 0}
.bar-row .k{flex:0 0 118px;color:var(--body);font-weight:700;line-height:1.3}
.bar-row .k small{display:block;color:var(--faint);font-weight:400;font-size:var(--t-tab)}
.bar-row .bar{flex:1;height:8px;background:var(--hair);border-radius:var(--r-pill);overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:var(--u);border-radius:var(--r-pill)}
.bar-row .v{flex:0 0 46px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.cal .h{font-size:var(--t-tab);color:var(--faint);text-align:center;font-weight:700;padding-bottom:2px}
.cal .c{aspect-ratio:1;min-width:0;border-radius:var(--r-s);background:var(--hair);display:grid;place-items:center;font-size:var(--t-tab);color:var(--faint)}
.cal .c.on{background:var(--u);color:var(--on-color);font-weight:700}
.cal .c.att{box-shadow:inset 0 0 0 2px var(--warn)}
.cal .c.blank{background:transparent}
.cal .c.today{box-shadow:inset 0 0 0 1.5px var(--brand)}
.cal .c.on.today{box-shadow:inset 0 0 0 1.5px var(--paper)}
.legend{display:flex;gap:12px;font-size:var(--t-tab);color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:var(--r-pill);vertical-align:-1px;margin-right:4px;background:var(--u)}
.legend i.att{background:transparent;box-shadow:inset 0 0 0 2px var(--warn)}
/* ═ 보호자 — 이번 주 한눈에 ═ */
.pweek .week{margin-bottom:10px}
.pweek .week .d{position:relative}
.pweek .week .d b.att{display:block;width:5px;height:5px;border-radius:50%;background:var(--warn);margin:3px auto 0}
.pstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstat>div{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-m);padding:10px 8px;text-align:center}
.pstat b{display:block;font-size:var(--t-h1);font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.pstat b small{font-size:var(--t-cap);font-weight:700;color:var(--muted);margin-left:1px}
.pstat span{font-size:var(--t-tab);color:var(--muted);font-weight:700}
.pnext{margin-top:10px;border-top:1px solid var(--hair);padding-top:6px}
.pweek h2 .wsd{font-size:var(--t-tab);font-weight:700;letter-spacing:0;color:var(--muted)}
/* 이번 주 요약(★5) — 줄마다 이름 하나와 값 하나. 막대는 정답률(0~100) — 비교 대상 없이 이 학생의 4주만 */
.wrow{border-top:1px solid var(--hair);padding:11px 0 2px;margin-top:10px}
.wrow .wk{display:block;font-size:var(--t-tab);font-weight:700;color:var(--muted);margin-bottom:6px}
.wrow .wv{font-size:var(--t-small);color:var(--body)}
.wrow .wv b{color:var(--ink)}
.tbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;height:84px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.tb .bt{display:flex;align-items:flex-end;justify-content:center;width:100%;height:46px;border-bottom:1px solid var(--hair)}
.tb i{display:block;width:100%;max-width:38px;background:var(--brand-line);border-radius:var(--r-s) var(--r-s) 0 0}
.tb b{font-size:var(--t-cap);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.tb small{font-size:var(--t-tab);color:var(--muted);font-weight:700}
.tb.now i{background:var(--brand)}
.tb.now small{color:var(--brand-dark)}
.wasg{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.wa{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--t-cap);color:var(--body)}
.wa .t{flex:1;min-width:0;line-height:1.5}
.wagain{display:flex;flex-direction:column;gap:6px}
.wl{display:flex;justify-content:space-between;gap:8px;font-size:var(--t-small);font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-s);padding:9px 11px}
.wl small{font-size:var(--t-tab);font-weight:700;color:var(--muted);white-space:nowrap}
.cst.none{color:var(--muted);background:var(--hair)}
/* ═ 교재 화면 워터마크 — 계정 이름·연락처 끝 4자리를 아주 옅게(읽기를 방해하지 않게). 탭(20)·시트(30) 아래 ═ */
#wm{position:fixed;inset:0;pointer-events:none;z-index:15;background-repeat:repeat;background-position:0 0}
/* ═ 마음이 힘들 때 · 상담 창구 ═ */
.help{display:flex;flex-direction:column;gap:8px;margin:4px 0 6px}
.help .hc{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:var(--r-m);background:var(--brand-soft);color:var(--ink);text-decoration:none;border:1px solid var(--brand-line)}
.help .hc b{font-size:var(--t-h1);font-weight:900;color:var(--brand-dark);font-variant-numeric:tabular-nums;min-width:62px;letter-spacing:-.01em}
.help .hc span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.help .hc i{font-style:normal;font-size:var(--t-small);font-weight:700}
.help .hc small{font-size:var(--t-cap);color:var(--body);word-break:keep-all}
.help .hc em{font-style:normal;font-size:var(--t-cap);font-weight:700;color:var(--on-color);background:var(--brand);border-radius:var(--r-pill);padding:6px 12px}
.help .now{font-size:var(--t-cap);color:var(--muted);margin:2px 2px 0;line-height:1.6}
.sheet.care h3{font-size:var(--t-h2)}
.sheet.care p{color:var(--body)}
.carenote{font-size:var(--t-cap);color:var(--body);background:var(--brand-soft);border-radius:var(--r-m);padding:10px 13px;margin:10px 0 0;line-height:1.7;word-break:keep-all}
.carenote b{color:var(--brand-dark)}
.carenote .linkbtn{padding:2px 0;font-size:var(--t-cap);font-weight:700;color:var(--brand-dark);min-height:24px}
.carerow{border-left:3px solid var(--warn)}
/* 이야기 — 쓰기 제한·읽기 전용 안내(조용히), 신고 결과, 신고 사유 고르기 */
.tgate{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:14px 15px;margin-bottom:12px}
.tgate b{display:block;font-size:var(--t-small);font-weight:700;color:var(--ink);line-height:1.5;margin-bottom:4px;word-break:keep-all}
.tgate p{font-size:var(--t-cap);color:var(--body);line-height:1.7;word-break:keep-all}
.tgate p.s{color:var(--muted);margin-top:6px}
.tgate .btn{margin:10px 0 0}
.repdone{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border-radius:var(--r-m);padding:10px 13px;margin-bottom:12px}
.repdone span{flex:1;min-width:0;font-size:var(--t-cap);line-height:1.6;color:var(--brand-dark);word-break:keep-all}
.repdone button{flex:0 0 auto;font-size:var(--t-cap);font-weight:700;color:var(--brand-dark);background:var(--card);border:none;border-radius:var(--r-pill);padding:0 14px;min-height:36px;cursor:pointer;font-family:inherit}
.carehint{font-size:var(--t-cap);color:var(--muted);line-height:1.6;margin:2px 2px 8px;word-break:keep-all}
.rsn{display:grid;gap:7px;margin:0 0 12px}
.rsn button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 13px;font-family:inherit;font-size:var(--t-small);font-weight:700;color:var(--ink);cursor:pointer;min-height:44px}
.rsn button small{font-size:var(--t-tab);font-weight:700;color:var(--muted);line-height:1.5}
.rsn button[aria-checked="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.rsn button.worry{background:var(--brand-soft);border-color:var(--brand-soft)}
.rsn button.worry[aria-checked="true"]{border-color:var(--brand)}
.rtag{display:inline-block;font-size:var(--t-tab);font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:var(--r-s);padding:1px 6px;margin:4px 4px 0 0}
.rtag.q{color:var(--muted);background:var(--ground)}
/* 첫 글 검토 표시(쓴 사람·원장만 봄) · 선생님 확인 답(초록 체크, 맨 위) — 글 목록·글 화면·댓글 어디서나 같은 모양 */
.rvw{display:inline-block;font-size:var(--t-tab);font-weight:900;color:var(--warn);background:var(--warn-soft);border-radius:var(--r-s);padding:2px 7px}
.rvw.no{color:var(--muted);background:var(--ground)}
.rvnote{font-size:var(--t-cap);color:var(--body);background:var(--warn-soft);border-radius:var(--r-m);padding:10px 13px;margin:10px 0 0;line-height:1.7;word-break:keep-all}
.rvnote.no{background:var(--ground)}
.chk{display:inline-flex;align-items:center;gap:3px;font-size:var(--t-tab);font-weight:900;color:var(--on-color);background:var(--brand);border-radius:var(--r-s);padding:2px 7px 2px 5px}
.chk svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cm.chkc{background:var(--brand-soft);border-radius:var(--r-m);border-top-color:transparent;padding:12px 12px;margin:4px 0}
.cm.chkc + .cm{border-top:none}
.stuedit summary .none{font-weight:700;font-size:var(--t-small);color:var(--muted)}
.stuedit summary .cst{margin-left:4px}
/* 합답형 ㄱㄴㄷ 판정 한 줄(해설 문장에서 'ㄱ (옳음) …' · 'ㄴ (틀림 →) …'을 나눠 그린다) */
.jdl{margin:6px 0 0}
.jd{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--u-line);font-size:var(--t-small);line-height:1.7;color:var(--body)}
.jd:first-child{border-top:none;padding-top:2px}
.jd .k{flex:0 0 auto;font-weight:900;color:var(--ink);min-width:15px}
.jd .v{flex:0 0 auto;font-size:var(--t-tab);font-weight:900;border-radius:var(--r-s);padding:1px 7px;margin-top:3px;white-space:nowrap}
.jd .v.o{color:var(--on-color);background:var(--u)}
.jd .v.x{color:var(--no);background:var(--card);box-shadow:inset 0 0 0 1px var(--no)}
.jd .t{flex:1;min-width:0}
.ckrow{display:flex;align-items:center;gap:8px;font-size:var(--t-small);color:var(--body);margin:2px 0 12px;min-height:40px;cursor:pointer}
.sheet .ckrow input{width:20px;height:20px;min-height:0;flex:0 0 auto;padding:0;margin:0;border:none;accent-color:var(--brand)}
.setrow>span>button.more{font-size:var(--t-cap);font-weight:700;color:var(--brand-dark);background:var(--brand-soft);border:none;border-radius:var(--r-pill);padding:0 13px;min-height:34px;cursor:pointer;font-family:inherit;white-space:nowrap}
.setrow>span>button[data-admpdel],.setrow>span>button[data-admcdel]{color:var(--no);background:var(--no-soft)}
.setrow>button.more{flex:0 0 auto;font-size:var(--t-cap);font-weight:700;color:var(--brand-dark);background:var(--brand-soft);border:none;border-radius:var(--r-pill);padding:0 13px;min-height:34px;cursor:pointer;font-family:inherit;white-space:nowrap}
.setrow>button[data-admpdel],.setrow>button[data-admcdel]{color:var(--no);background:var(--no-soft)}
/* ═ 공부 노트 · 달력 ═ */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hrow .h-page{flex:1;min-width:0}
.hrow .more{flex:0 0 auto;font-size:var(--t-cap);font-weight:700;color:var(--brand-dark);background:var(--brand-soft);border:none;border-radius:var(--r-pill);padding:0 14px;min-height:36px;cursor:pointer;font-family:inherit;margin-bottom:14px}
.ncal{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);padding:12px 12px 12px;margin-bottom:14px}
.ncal .mh{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}
.ncal .mh b{font-size:var(--t-stem);font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ncal .mh button{width:44px;height:44px;border-radius:var(--r-m);border:none;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.ncal .mh svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ncal .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.ncal .h{font-size:var(--t-tab);color:var(--faint);text-align:center;font-weight:700;padding:2px 0 4px}
.ncal .h.sun{color:var(--no)}
.ncal .c{position:relative;aspect-ratio:1;min-width:0;border:none;background:none;border-radius:var(--r-m);font-size:var(--t-small);font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;padding:0}
.ncal .c.out{visibility:hidden}
.ncal .c.study{background:var(--brand-soft)}
.ncal .c.today{box-shadow:inset 0 0 0 1.5px var(--brand);color:var(--brand-dark);font-weight:900}
.ncal .c.sel{background:var(--brand);color:var(--on-color);box-shadow:none}
.ncal .c .dots{display:flex;gap:3px;height:5px}
.ncal .c .dots i{width:5px;height:5px;border-radius:50%;background:var(--brand)}
.ncal .c .dots i.ev{background:var(--warn)}
.ncal .c.sel .dots i{background:var(--on-color)}
.ncal .lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--t-tab);color:var(--muted);margin-top:8px;padding:0 4px}
.ncal .lg i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);margin-right:5px;vertical-align:0}
.ncal .lg i.st{width:10px;height:10px;border-radius:var(--r-pill);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line);vertical-align:-1px}
.ncal .lg i.ev{background:var(--warn)}
.nday{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 10px}
.nday b{font-size:var(--t-h2);font-weight:900;letter-spacing:-.01em}
.nday small{display:block;font-size:var(--t-cap);color:var(--muted);font-weight:700;margin-top:2px;word-break:keep-all}
.nday .more{font-size:var(--t-cap);font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;min-height:40px;padding:0 6px}
.ncard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:14px 16px;margin-bottom:10px;cursor:pointer;font-family:inherit;color:var(--ink)}
.ncard .t{display:block;font-size:var(--t-body);font-weight:700;margin-bottom:4px;word-break:keep-all;overflow-wrap:anywhere}
.ncard .b{font-size:var(--t-small);color:var(--body);line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ncard .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.ncard .when{font-size:var(--t-tab);color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.ccp{display:inline-flex;align-items:center;gap:2px;font-size:var(--t-cap);font-weight:700;border-radius:var(--r-pill);background:var(--brand-soft);color:var(--brand-dark);max-width:100%}
.ccp>span,.ccp>button{padding:5px 10px;border:none;background:none;color:inherit;font:inherit;cursor:pointer;min-width:0;overflow-wrap:anywhere;text-align:left}
.ccp>button.x{padding:5px 10px 5px 2px;font-size:var(--t-small);line-height:1}
.nempty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r-m);padding:18px 16px;margin-bottom:10px;text-align:center;font-size:var(--t-small);color:var(--muted);line-height:1.75;word-break:keep-all}
.nsched{font-size:var(--t-cap);color:var(--body);background:var(--warn-soft);border-radius:var(--r-s);padding:9px 12px;margin-bottom:10px;line-height:1.6;word-break:keep-all}
.nsched b{color:var(--warn);font-weight:700;margin-right:4px}
.ned .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ned .top .back{margin:0}
.ned .saved{font-size:var(--t-cap);color:var(--faint);font-weight:700}
.ned .paper{background:var(--card);border:1.5px solid var(--hair);border-radius:var(--r-l);padding:14px 18px 10px;transition:border-color .15s}
.ned .paper:focus-within{border-color:var(--brand-line)}
.ned .date{display:flex;align-items:center;gap:8px;font-size:var(--t-cap);color:var(--muted);font-weight:700}
.ned .date input{border:1px solid var(--line);border-radius:var(--r-s);padding:7px 10px;font-family:inherit;font-size:var(--t-small);background:var(--paper);color:var(--ink);min-height:36px}
.ned input.ti{display:block;width:100%;border:none;background:none;font-size:var(--t-h1);font-weight:900;color:var(--ink);font-family:inherit;padding:10px 0 6px;letter-spacing:-.01em;border-bottom:1px solid var(--hair)}
.ned textarea.bd{display:block;width:100%;min-height:42vh;border:none;background:none;font-size:var(--t-body);line-height:1.85;color:var(--ink);font-family:inherit;resize:none;padding:10px 0 4px;word-break:keep-all;overflow-wrap:anywhere}
.ned input.ti:focus,.ned textarea.bd:focus{outline:none}
.ned input.ti::placeholder,.ned textarea.bd::placeholder{color:var(--faint);font-weight:400}
.ned .cnt{font-size:var(--t-tab);color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.ned .tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.ned .tools button{font-size:var(--t-cap);font-weight:700;padding:9px 13px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);color:var(--body);cursor:pointer;font-family:inherit;min-height:40px}
.ned .cs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ned .sug{font-size:var(--t-cap);color:var(--muted);margin:-2px 0 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ned .sug button{font-size:var(--t-cap);font-weight:700;padding:6px 11px;border-radius:var(--r-pill);border:1px dashed var(--brand-line);background:none;color:var(--brand-dark);cursor:pointer;font-family:inherit}
.ned .priv{font-size:var(--t-cap);color:var(--faint);text-align:center;margin:10px 0 4px;line-height:1.7;word-break:keep-all}
.cpick{max-height:48vh;overflow-y:auto;margin:6px 0 12px;display:flex;flex-direction:column;gap:2px}
.cpick button{display:block;width:100%;text-align:left;border:none;background:none;border-radius:var(--r-s);padding:10px 10px;font-family:inherit;cursor:pointer;color:var(--ink)}
.cpick button:hover{background:var(--hair)}
.cpick b{display:block;font-size:var(--t-small);font-weight:700;word-break:keep-all}
.cpick small{display:block;font-size:var(--t-tab);color:var(--muted);margin-top:2px;word-break:keep-all}
.cpick .on b::after{content:' ✓';color:var(--brand)}
/* 오늘 화면 — 일력(한 장씩 넘기는 달력) + 공부 노트 */
.tnote{display:flex;align-items:stretch;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);padding:12px;margin-bottom:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.tnote .pg{flex:0 0 64px;border-radius:var(--r-m);background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding-bottom:6px}
.tnote .pg small{display:block;width:100%;text-align:center;background:var(--brand);color:var(--on-color);font-size:var(--t-tab);font-weight:700;padding:3px 0;margin-bottom:2px}
.tnote .pg b{font-size:var(--t-hero);font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.tnote .pg i{font-style:normal;font-size:var(--t-tab);color:var(--muted);font-weight:700}
.tnote .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.tnote .tx b{font-size:var(--t-body);font-weight:700}
.tnote .tx span{font-size:var(--t-small);color:var(--body);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tnote .tx em{font-style:normal;font-size:var(--t-tab);color:var(--faint);font-weight:700}
.tnote>svg{flex:0 0 18px;align-self:center;width:18px;height:18px;stroke:var(--faint);stroke-width:2.2;fill:none;stroke-linecap:round}

/* 내 정보 · 계정 */
.pass{background:var(--card);border:1.5px solid var(--u);border-radius:var(--r-l);padding:16px;position:relative;overflow:hidden;margin-bottom:14px}
.pass::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--u)}
.pass .badge{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-tab);font-weight:700;color:var(--u-dark);background:var(--u-soft);padding:4px 10px;border-radius:var(--r-pill);margin-bottom:11px}
.pass .badge.grey{color:var(--muted);background:var(--hair)}
.pass .badge.warn{color:var(--warn);background:var(--warn-soft)}
.pass .who{font-size:var(--t-h2);font-weight:900;letter-spacing:-.02em;margin-bottom:2px}
.pass .where{font-size:var(--t-cap);color:var(--muted);margin-bottom:13px}
.pass .row{display:flex;gap:9px;font-size:var(--t-cap);line-height:1.55;padding:6px 0;border-top:1px solid var(--hair);cursor:default}
.pass .row dt{color:var(--muted);flex:0 0 44px}
.pass .row dd{color:var(--body);flex:1}
.pass .row dd b{color:var(--ink);font-weight:700}
.codebox{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;margin-bottom:14px}
.codebox h3{font-size:var(--t-body);font-weight:900;margin-bottom:6px}
.codebox p{font-size:var(--t-cap);color:var(--muted);line-height:1.7;margin-bottom:13px}
.codebox .f{display:flex;gap:7px;margin-bottom:8px}
.codebox input{flex:1;border:1.5px solid var(--line);border-radius:var(--r-s);padding:12px 14px;font-size:var(--t-body);font-family:inherit;background:var(--paper);color:var(--ink);min-width:0}
.codebox input.code{letter-spacing:.16em;text-transform:uppercase}
.codebox input:focus{outline:2px solid var(--u);outline-offset:-2px}
.codebox button{background:var(--u);color:var(--on-color);border:none;border-radius:var(--r-s);padding:12px 18px;font-size:var(--t-small);font-weight:700;cursor:pointer;flex:0 0 auto}
.codebox .demo{font-size:var(--t-tab);color:var(--faint);margin-top:6px;line-height:1.7}
.codebox .demo code{background:var(--u-soft);color:var(--u-dark);padding:2px 7px;border-radius:var(--r-s);font-weight:700;letter-spacing:.05em}
.codebox .err{font-size:var(--t-cap);color:var(--no);margin-top:4px;font-weight:700}
.setrow{display:flex;align-items:center;gap:11px;padding:14px 2px;border-bottom:1px solid var(--hair);font-size:var(--t-small);cursor:default;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.setrow .l{flex:1;color:var(--body)}
.setrow .l small{display:block;font-size:var(--t-tab);color:var(--faint)}
.setrow .v{color:var(--faint);font-size:var(--t-small)}
.setrow .ctl{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.setrow{flex-wrap:wrap}
.setrow .ctl button{font-size:var(--t-cap);font-weight:700;padding:6px 10px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.setrow .ctl button.on{background:var(--u);border-color:var(--u);color:var(--on-color)}
.setrow.go{cursor:pointer}
.setrow.go .v::after{content:" ›";font-weight:900}
select.sel{font-family:inherit;font-size:var(--t-small);font-weight:700;color:var(--u);background:var(--u-soft);border:none;border-radius:var(--r-s);padding:8px 10px;cursor:pointer}

/* 시작 · 로그인 */
.auth{min-height:calc(100vh - 4px);display:flex;flex-direction:column;padding:clamp(16px,4vh,34px) 6px 30px}
.auth.start{padding-top:clamp(10px,2.5vh,22px)}
.auth .mark{width:52px;height:52px;border-radius:var(--r-l);background:var(--brand);display:grid;place-items:center;margin-bottom:14px;box-shadow:0 6px 18px rgba(20,125,111,.22)}
.auth .mark svg{width:32px;height:32px}
.auth h1{font-size:var(--t-hero);line-height:1.3;margin-bottom:8px}
.auth .lead{font-size:var(--t-body);color:var(--body);line-height:1.8;margin-bottom:22px}
.auth .lead b{color:var(--ink)}
.auth .f{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.auth input,.auth select{width:100%;border:1.5px solid var(--line);border-radius:var(--r-m);padding:13px 14px;font-size:var(--t-body);font-family:inherit;background:var(--card);color:var(--ink)}
.auth input:focus,.auth select:focus{outline:2px solid var(--brand);outline-offset:-2px}
.auth .err{font-size:var(--t-cap);color:var(--no);font-weight:700;margin:-4px 0 10px}
.stuedit{margin:12px 0 4px;border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;background:var(--paper)}
.stuedit summary{cursor:pointer;font-weight:700;font-size:var(--t-small);color:var(--brand-dark);list-style:none;padding:2px 0}
.stuedit summary::-webkit-details-marker{display:none}
.stuedit summary::after{content:' ▾';color:var(--faint)}
.stuedit[open] summary{margin-bottom:10px}
.stuedit .g{display:flex;gap:8px;margin-bottom:8px}
.stuedit .g>*{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:var(--r-m);padding:11px 12px;font-size:var(--t-body);font-family:inherit;background:var(--card);color:var(--ink)}
.stuedit .linkbtn small{font-weight:700;color:var(--faint)}
.auth .info{font-size:var(--t-small);line-height:1.6;color:var(--brand-dark);background:var(--brand-soft);border-radius:var(--r-m);padding:11px 13px;margin:0 0 12px;font-weight:700;word-break:keep-all}
.auth .links{display:flex;justify-content:center;gap:10px;font-size:var(--t-small);color:var(--muted);margin-top:0}
.auth .links button{background:none;border:none;color:var(--muted);font-size:var(--t-small);cursor:pointer;text-decoration:underline;min-height:44px;padding:0 6px}
.auth .roles{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.auth .roles button{display:flex;align-items:center;gap:11px;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-m);padding:13px 15px;font-size:var(--t-body);font-weight:700;color:var(--ink);cursor:pointer;text-align:left;line-height:1.4;min-height:56px}
.auth .roles button .ri{flex:0 0 34px;height:34px;border-radius:var(--r-s);background:var(--ground);display:grid;place-items:center;color:var(--muted)}
.auth .roles button .ri svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.auth .roles button .rt{flex:1;min-width:0}
.auth .roles button small{display:block;font-size:var(--t-cap);font-weight:400;color:var(--muted);margin-top:1px}
.auth .roles button.on{border-color:var(--brand);background:var(--brand-soft)}
.auth .roles button.on .ri{background:var(--brand);color:var(--on-color)}
.auth .roles button.on small{color:var(--brand-dark)}
.auth label.agree{display:flex;gap:10px;align-items:center;font-size:var(--t-cap);color:var(--body);line-height:1.6;margin-bottom:14px;min-height:44px;cursor:pointer}
.auth label.agree input{width:24px;height:24px;flex:0 0 auto;margin:0;accent-color:var(--brand);cursor:pointer}
.auth label.agree u{cursor:pointer;color:var(--brand)}
.auth .fine{padding-top:10px}
.auth .hero{width:100%;height:auto;display:block;margin:0 0 18px;border-radius:var(--r-l)}
.auth .facts{display:flex;gap:7px;margin:0 0 18px}
.auth .facts div{flex:1;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:10px 6px;text-align:center}
.auth .facts b{display:block;font-size:var(--t-h2);font-weight:900;color:var(--brand);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.auth .facts span{display:block;font-size:var(--t-tab);color:var(--muted);font-weight:700;margin-top:1px}
.auth .lab{display:block;font-size:var(--t-cap);font-weight:700;color:var(--muted);margin:0 0 5px 2px}
.auth .lab.grp{margin:2px 0 7px 2px;color:var(--faint);font-weight:700}
.auth .fld{margin-bottom:11px}
.auth .fld input{margin:0}
/* 가입 단계 · 첫 실행 소개 */
.stepbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;min-height:44px}
.stepbar .back{margin:0;padding:0 6px 0 0}
.stepbar .track{flex:1;height:5px;border-radius:var(--r-pill);background:var(--hair);overflow:hidden}
.stepbar .track i{display:block;height:100%;background:var(--brand);border-radius:var(--r-pill);transition:width .3s ease}
.stepbar .n{font-size:var(--t-cap);font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.auth .grow{flex:1}
.auth .cta{position:sticky;bottom:0;padding:12px 0 calc(8px + var(--sab));background:linear-gradient(to top,var(--paper) 80%,transparent);margin-top:10px}
.auth .cta .btn{margin:0}
.auth .cta .btn + .btn{margin-top:8px}
.auth .btn.dim{opacity:.5}
.auth h1.q{font-size:var(--t-h1);line-height:1.35;margin-bottom:6px}
.agrees{border:1.5px solid var(--line);border-radius:var(--r-l);background:var(--card);overflow:hidden;margin-bottom:12px}
.agrees .all{display:flex;align-items:center;gap:12px;padding:15px 15px;font-size:var(--t-body);font-weight:900;color:var(--ink);cursor:pointer;min-height:56px;border-bottom:1px solid var(--hair)}
.agrees .one{display:flex;align-items:center;gap:12px;padding:11px 15px;font-size:var(--t-small);color:var(--body);min-height:48px;cursor:pointer}
.agrees .one + .one{border-top:1px solid var(--hair)}
.agrees input{width:24px;height:24px;flex:0 0 24px;margin:0;accent-color:var(--brand);cursor:pointer}
.agrees .req{font-size:var(--t-tab);font-weight:900;color:var(--brand-dark);margin-right:2px}
.agrees .opt{font-size:var(--t-tab);font-weight:700;color:var(--faint);margin-right:2px}
.agrees .t{flex:1;min-width:0;word-break:keep-all}
.auth .see{background:none;border:0;color:var(--muted);font-size:var(--t-cap);font-weight:700;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 2px}
.pv{margin:0 15px 12px;border:1px solid var(--hair);border-radius:var(--r-m);overflow:hidden;font-size:var(--t-cap);line-height:1.6;color:var(--body)}
.pv table{width:100%;border-collapse:collapse}
.pv th,.pv td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--hair);word-break:keep-all}
.pv th{width:74px;color:var(--muted);font-weight:700;background:var(--ground)}
.pv p{margin:0;padding:9px 10px;background:var(--ground)}
.ages{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ages label{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:var(--r-m);padding:13px 15px;background:var(--card);cursor:pointer;font-size:var(--t-body);font-weight:700;color:var(--ink);min-height:54px}
.ages label small{display:block;font-size:var(--t-cap);font-weight:400;color:var(--muted)}
.ages label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.ages input{width:24px;height:24px;flex:0 0 24px;margin:0;accent-color:var(--brand)}
.pwrow{position:relative}
.pwrow input{padding-right:64px}
.pwrow button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:var(--t-cap);font-weight:700;min-height:40px;min-width:48px;cursor:pointer}
.rules{display:flex;gap:12px;font-size:var(--t-cap);color:var(--faint);margin:-2px 0 10px 2px;font-weight:700}
.rules .ok{color:var(--brand-dark)}
.intro{min-height:calc(100vh - 4px);display:flex;flex-direction:column;padding:12px 6px calc(20px + var(--sab))}
.intro .skip{align-self:flex-end;background:none;border:0;color:var(--muted);font-size:var(--t-small);font-weight:700;min-height:44px;padding:0 6px;cursor:pointer}
.intro .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:220px}
.intro .art svg{width:100%;max-width:340px;height:auto}
.intro h1{font-size:var(--t-hero);line-height:1.35;margin:10px 0 8px}
.intro p{font-size:var(--t-body);line-height:1.8;color:var(--body);margin:0 0 22px;word-break:keep-all}
.intro .dots{display:flex;gap:7px;justify-content:center;margin:0 0 16px}
.intro .dots i{width:7px;height:7px;border-radius:var(--r-pill);background:var(--line);transition:all .25s}
.intro .dots i.on{width:22px;background:var(--brand)}
.welcome .big{width:72px;height:72px;border-radius:var(--r-l);background:var(--brand-soft);display:grid;place-items:center;margin:26px 0 16px}
.welcome .next{display:flex;flex-direction:column;gap:9px;margin:4px 0 16px}
.welcome .next div{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:12px 14px;font-size:var(--t-small);color:var(--body);line-height:1.6;word-break:keep-all}
.welcome .next .no{font-style:normal;flex:0 0 24px;height:24px;border-radius:var(--r-s);background:var(--brand);color:var(--on-color);display:grid;place-items:center;font-size:var(--t-cap);font-weight:900}
.permcard{border:1.5px solid var(--brand-line);background:var(--brand-soft);border-radius:var(--r-l);padding:14px 15px;margin:0 0 6px}
.permcard .t{font-size:var(--t-body);font-weight:900;color:var(--brand-dark)}
.permcard .d{font-size:var(--t-cap);color:var(--body);line-height:1.6;margin:3px 0 10px}
.auth .demo{border-top:1px solid var(--hair);margin-top:auto;padding-top:14px}
.auth .demo p{font-size:var(--t-tab);color:var(--faint);text-align:center;margin-bottom:8px}
.auth .demo .row{display:flex;gap:6px}
.auth .demo button{flex:1;font-size:var(--t-cap);font-weight:700;color:var(--body);background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 4px;cursor:pointer}
.auth .demo button:active{background:var(--brand-soft)}
.auth .code-in{letter-spacing:normal}
.auth .code-in:not(:placeholder-shown){letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.auth .or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:var(--t-tab);margin:6px 0 12px}
.auth .or::before,.auth .or::after{content:"";flex:1;height:1px;background:var(--hair)}

/* 이용권 */
.plan{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-l);padding:16px;margin-bottom:10px;position:relative}
.plan.best{border-color:var(--brand)}
.plan .tag{position:absolute;top:-10px;right:14px;background:var(--brand);color:var(--on-color)}
.plan h3{font-size:var(--t-stem);font-weight:900;margin-bottom:2px}
.plan .price{font-size:var(--t-h1);font-weight:900;letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.plan .price small{font-size:var(--t-cap);color:var(--muted);font-weight:700}
.plan ul{list-style:none;font-size:var(--t-cap);color:var(--body);line-height:1.8;margin-bottom:10px}
.plan ul li::before{content:"✓ ";color:var(--brand);font-weight:900}
.plan .btn{margin:0}

/* 문제 은행 */
.bank-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pick{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:13px 15px;margin-bottom:10px}
.pick .k{font-size:var(--t-cap);font-weight:700;letter-spacing:0;color:var(--muted);margin-bottom:8px;display:block}
.pick .chipbar{margin-bottom:0}
.pick select{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-family:inherit;font-size:var(--t-small);background:var(--paper);color:var(--ink)}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:var(--t-cap);color:var(--muted)}
.qbar .bar{flex:1;height:6px;background:var(--hair);border-radius:var(--r-pill);overflow:hidden}
.qbar .bar i{display:block;height:100%;background:var(--u)}
.oxrow{display:flex;gap:10px;margin-bottom:14px}
.oxrow button{flex:1;font-size:var(--t-hero);font-weight:900;padding:18px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--card);color:var(--body);cursor:pointer}
.oxrow button.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-dark)}
.oxrow button.bad{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.oxrow button:disabled{cursor:default}
.blankin{display:flex;gap:8px;margin-bottom:14px}
.blankin input{flex:1;border:1.5px solid var(--line);border-radius:var(--r-m);padding:13px 14px;font-size:var(--t-stem);font-family:inherit;background:var(--card);color:var(--ink);min-width:0}
.blankin button{background:var(--u);color:var(--on-color);border:none;border-radius:var(--r-m);padding:12px 18px;font-size:var(--t-small);font-weight:700;cursor:pointer}
/* 확신도 한 탭 · 해설 없는 문항의 개념 카드 링크 */
.conf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.conf .k{font-size:var(--t-cap);font-weight:700;color:var(--faint);margin-right:2px}
.conf button{min-height:44px;min-width:84px;padding:0 16px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-family:inherit;font-size:var(--t-small);font-weight:700;cursor:pointer}
.conf button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark)}
.confnote{font-size:var(--t-small);font-weight:700;color:var(--u-dark);margin:0 0 6px;line-height:1.6;word-break:keep-all}
.verdict .cgo{background:var(--card);border:1px solid var(--u-line);color:var(--u-dark);margin-top:6px;padding:12px;font-size:var(--t-small)}
/* 원장 '처리할 것' — 학생 탭 맨 위 */
.todo summary{display:flex;align-items:center;gap:8px;min-height:44px;flex-wrap:wrap}
.todo summary .none{font-weight:700;font-size:var(--t-small);color:var(--muted)}
.todo-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.todo-row .b{flex:1;min-width:0}
.todo-row .nm{display:block;font-weight:700;font-size:var(--t-small);color:var(--ink)}
.todo-row .nm small{font-weight:700;font-size:var(--t-cap);color:var(--faint);margin-left:4px}
.todo-row .why{display:block;font-size:var(--t-cap);line-height:1.65;color:var(--body);margin-top:2px;word-break:keep-all}
.todo-act{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:var(--r-m);border:1px solid var(--brand-line);background:var(--card);color:var(--brand-dark);font-family:inherit;font-size:var(--t-small);font-weight:700;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer;white-space:nowrap}
.wrongbox{background:var(--no-soft);border-left:4px solid var(--no);border-radius:0 var(--r-m) var(--r-m) 0;padding:11px 14px;margin-bottom:11px;font-size:var(--t-small);line-height:1.7;color:var(--body)}
.wrongbox .h{font-size:var(--t-cap);font-weight:900;color:var(--no);margin-bottom:3px}
.result{background:var(--card);border:1.5px solid var(--u);border-radius:var(--r-l);padding:18px;text-align:center;margin-bottom:13px}
.result .big{font-size:var(--t-num);font-weight:900;letter-spacing:-.03em;color:var(--u);line-height:1.1}
.result .sub{margin:4px 0 0;font-size:var(--t-small)}
.lab-list .row .n{background:var(--warn-soft);color:var(--warn)}
/* 대단원 마무리 · 실전 모의고사 · 시험처럼(2026-10) — 손가락 목표 44px 이상, 조용한 색 */
.tgl{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;margin-top:10px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);color:var(--body);font-family:inherit;font-size:var(--t-small);font-weight:700;cursor:pointer;text-align:left}
.tgl .sw{position:relative;flex:0 0 36px;height:20px;border-radius:var(--r-pill);background:var(--line);transition:background-color .15s ease}
.tgl .sw::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--card);transition:transform .15s ease}
.tgl[aria-pressed="true"]{border-color:var(--brand-line);color:var(--brand-dark)}
.tgl[aria-pressed="true"] .sw{background:var(--brand)}
.tgl[aria-pressed="true"] .sw::after{transform:translateX(16px)}
.umrow{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:11px 2px;border:none;border-bottom:1px solid var(--hair);background:none;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer}
.umrow:last-of-type{border-bottom:none}
.umrow:disabled{cursor:default;opacity:.6}
.umrow .n{flex:0 0 auto;min-width:38px;text-align:center;font-size:var(--t-tab);font-weight:900;color:var(--brand-dark);background:var(--brand-soft);border-radius:var(--r-s);padding:5px 7px}
.umrow .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.umrow .t{font-size:var(--t-body);font-weight:700;line-height:1.4}
.umrow .s{font-size:var(--t-cap);color:var(--muted);line-height:1.5}
.umrow .chev{flex:0 0 18px;width:18px;height:18px;stroke:var(--faint);stroke-width:2.2;fill:none;stroke-linecap:round}
.lockb{flex:0 0 auto;font-size:var(--t-tab);font-weight:700;color:var(--muted);background:var(--hair);border-radius:var(--r-pill);padding:3px 10px}
.fine.lead{text-align:left;padding:0 0 12px;line-height:1.7}
.umbook{font-size:var(--t-cap);font-weight:700;letter-spacing:0;color:var(--muted);margin:18px 0 8px}
.umcard{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-m);padding:2px 14px;margin-bottom:10px}
.umcard .umrow{border-bottom:none}
.umsub{display:block;width:100%;min-height:44px;padding:0 2px 2px 52px;border:none;border-top:1px dashed var(--hair);background:none;text-align:left;font-family:inherit;font-size:var(--t-small);font-weight:700;color:var(--brand-dark);cursor:pointer}
.umcard.mock{padding:14px 15px 2px}
.umcard.mock .mh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px;margin-bottom:6px}
.umcard.mock.hard{border-color:var(--ink)}
.umcard.mock .mh .t{font-size:var(--t-stem);font-weight:900}
.umcard.mock .mh .s{font-size:var(--t-cap);color:var(--muted)}
.mhist{font-size:var(--t-cap);color:var(--muted);margin:0 0 10px;line-height:1.6}
.mxbar{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.mxbar .mxt{flex:1 1 140px;font-size:var(--t-small);font-weight:700;color:var(--muted)}
.mxclock{font-size:var(--t-stem);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:.02em}
.mxclock.off{font-size:var(--t-cap);font-weight:700;color:var(--muted)}
.mxbtn{min-height:44px;padding:0 14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);color:var(--body);font-family:inherit;font-size:var(--t-small);font-weight:700;cursor:pointer}
.mxpaused{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-l);padding:22px 18px 8px;margin:6px 0 13px;text-align:center}
.mxpaused b{display:block;font-size:var(--t-stem);margin-bottom:6px}
.mxpaused p{font-size:var(--t-small);color:var(--body);line-height:1.7;margin-bottom:16px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--ink)}
.opt.sel .m{color:var(--brand-dark)}
.mxnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.omrgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.omrgrid button{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);color:var(--muted);font-family:inherit;cursor:pointer}
.omrgrid button b{font-size:var(--t-tab);font-weight:700}
.omrgrid button span{font-size:var(--t-small);line-height:1.1}
.omrgrid button.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-dark)}
.omrgrid button.cur{outline:2px solid var(--brand);outline-offset:1px}
.mxlist{display:flex;flex-direction:column}
.mxr{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 2px;border:none;border-bottom:1px solid var(--hair);background:none;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer}
.mxr:last-child{border-bottom:none}
.mxr .n{flex:0 0 30px;text-align:center;font-size:var(--t-cap);font-weight:900;color:var(--muted);background:var(--hair);border-radius:var(--r-s);padding:3px 0;font-variant-numeric:tabular-nums}
.mxr .b{flex:1;font-size:var(--t-small);line-height:1.5;color:var(--body)}
.mxr .p{flex:0 0 auto;font-size:var(--t-cap);color:var(--muted)}
.mxr .mk{flex:0 0 20px;text-align:center;font-weight:900}
.mxr.o .mk{color:var(--brand-dark)}
.mxr.x .mk{color:var(--no)}
.rxrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--hair)}
.rxrow:last-child{border-bottom:none}
.rxrow .b{flex:1 1 120px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rxrow .t{font-size:var(--t-small);font-weight:700;line-height:1.45;color:var(--ink)}
.rxrow .s{font-size:var(--t-cap);color:var(--muted)}
.rxrow .acts{display:flex;gap:6px;flex:0 0 auto}
.rxbtn{min-height:44px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--brand-line);background:var(--card);color:var(--brand-dark);font-family:inherit;font-size:var(--t-small);font-weight:700;cursor:pointer}
.qdata{border:1px dashed var(--line);background:var(--card);border-radius:var(--r-s);padding:11px 14px;margin-bottom:13px;font-size:var(--t-small);line-height:1.8;color:var(--body)}
.qtabw{overflow-x:auto;margin-bottom:13px;-webkit-overflow-scrolling:touch}
.qtab{border-collapse:collapse;width:100%;font-size:var(--t-small);line-height:1.5;color:var(--body)}
.qtab th,.qtab td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle}
.qtab th{background:var(--hair);color:var(--ink);font-weight:700}
.qclock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);background:var(--hair);border-radius:var(--r-pill);padding:2px 9px}
.labcard h3{font-size:var(--t-h2);font-weight:900;letter-spacing:-.02em;margin-bottom:4px}
.labcard .k{font-size:var(--t-cap);font-weight:700;letter-spacing:0;color:var(--u-dark);display:block;margin:14px 0 6px}
.labcard p,.labcard li{font-size:var(--t-small);line-height:1.8;color:var(--body)}
.labcard ol{padding-left:18px}
.labcard figure{margin:10px 0}
.qfig{background:var(--u-soft);border-radius:var(--r-s);padding:10px 6px;margin-bottom:12px;text-align:center;cursor:zoom-in}
.qfig svg{max-width:100%;height:auto;background:var(--figplate);border-radius:var(--r-s)}
.fv .stage svg{background:var(--figplate);border-radius:var(--r-s)}
figure.zoomable{cursor:zoom-in}
/* 그림 확대 보기 */
.fv{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;flex-direction:column;padding:var(--sat) var(--sar) 0 var(--sal)}
