<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 박찬 과학 앱 아이콘 — 원본의 '핵 + 기울어진 궤도' 모티프를 작은 크기에서도 읽히게 정리.
       원본 파일은 손대지 않았고, 형태만 따라 다시 그렸다. -->
  <rect width="1024" height="1024" fill="#147D6F"/>

  <!-- 궤도 — 핵 뒤로 지나간다 -->
  <ellipse cx="512" cy="512" rx="386" ry="152" transform="rotate(-30 512 512)"
           fill="none" stroke="#A9D9CE" stroke-width="54"/>

  <!-- 핵 — 배경색으로 채워 궤도를 가리고, 흰 테두리로 또렷하게 -->
  <circle cx="512" cy="512" r="196" fill="#147D6F" stroke="#FFFFFF" stroke-width="62"/>


  <!-- 전자 -->
  <circle cx="168" cy="678" r="72" fill="#FFFFFF"/>
  <circle cx="856" cy="346" r="72" fill="#FFFFFF"/>
</svg>
