<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:S;font-weight:800;src:url(file:///root/.fonts/static/NotoSansKR-800.ttf)}
@font-face{font-family:S;font-weight:900;src:url(file:///root/.fonts/static/NotoSansKR-900.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#333;font-family:S,sans-serif}
.b{width:1800px;height:600px;position:relative;overflow:hidden;margin-bottom:30px;display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:center;padding:0 44px;min-width:0}
.nmr{flex:0 0 314px;padding-top:10px}.midr{flex:0 0 170px}.chr{flex:1}
.nm{font-weight:900;line-height:1;letter-spacing:-.045em;white-space:nowrap}
.mid{display:inline-flex;flex:0 0 auto;align-items:baseline;gap:.35em;white-space:nowrap;font-weight:900;line-height:1}
.mid .rec{font-size:.56em;letter-spacing:-.03em}.mid .tel{letter-spacing:-.02em}.mid .tel small{font-size:.42em;font-weight:800;margin-right:.08em}
.chips{display:flex;gap:16px;width:100%;height:84px}
.chips span{flex:1;display:grid;place-items:center;font-weight:900;font-size:50px;border-radius:12px;border:6px solid;white-space:nowrap;letter-spacing:-.02em}
.chips span.loc{flex:1.25;border-color:transparent!important;background:transparent!important;font-size:48px}
.chr{padding-bottom:22px}
/* 1 검정+노랑 */
#d1{background:#000}#d1 .nm{color:#FFE600}#d1 .rec{color:#fff}#d1 .rec em{font-style:normal;color:#FFE600}#d1 .tel{color:#FFE600}
#d1 .chips span{border-color:#FFE600;color:#FFE600}#d1 .chips span.now{background:#FFE600;color:#000}#d1 .chips .loc{color:#fff}
/* 2 검정+노랑, 박찬 흰색, 아래 노랑 띠 */
#d2{background:#000}#d2 .nm{color:#FFE600}#d2 .nm b{color:#fff}
#d2 .midr{background:#FFE600}#d2 .rec{color:#000}#d2 .rec em{font-style:normal;color:#C8141E}#d2 .tel{color:#000}
#d2 .chr{padding-top:14px;padding-bottom:16px}#d2 .chips span{border-color:#FFE600;color:#FFE600}#d2 .chips span.now{background:#FFE600;color:#000}#d2 .chips .loc{color:#fff}
/* 3 노랑+검정 */
#d3{background:#FFE600}#d3 .nm{color:#000}#d3 .rec{color:#000}#d3 .rec em{font-style:normal;color:#C8141E}#d3 .tel{color:#000}
#d3 .chips span{border-color:#000;color:#000}#d3 .chips span.now{background:#000;color:#FFE600}#d3 .chips .loc{color:#000}
/* 4 위 노랑 이름 / 아래 검정 */
#d4{background:#000}#d4 .nmr{background:#FFE600}#d4 .nm{color:#000}
#d4 .rec{color:#fff}#d4 .rec em{font-style:normal;color:#FFE600}#d4 .tel{color:#FFE600}
#d4 .chips span{border-color:#FFE600;color:#FFE600}#d4 .chips span.now{background:#FFE600;color:#000}#d4 .chips .loc{color:#fff}
/* 5 남색(간판)+노랑, 박찬 하늘 */
#d5{background:#002C59}#d5 .nm{color:#FFF100}#d5 .nm b{color:#00B4FF}#d5 .rec{color:#fff}#d5 .rec em{font-style:normal;color:#FFF100}#d5 .tel{color:#FFF100}
#d5 .chips span{border-color:#FFF100;color:#FFF100}#d5 .chips span.now{background:#FFF100;color:#002C59}#d5 .chips .loc{color:#fff}
/* 6 남색+흰 이름, 아래 노랑 띠 */
#d6{background:#002C59}#d6 .nm{color:#fff}#d6 .nm b{color:#00B4FF}
#d6 .midr{background:#FFF100}#d6 .rec{color:#002C59}#d6 .rec em{font-style:normal;color:#C8141E}#d6 .tel{color:#002C59}
#d6 .chr{padding-top:14px;padding-bottom:16px}#d6 .chips span{border-color:#8FB3D9;color:#fff}#d6 .chips span.now{background:#FFF100;border-color:#FFF100;color:#002C59}#d6 .chips .loc{color:#fff}
</style></head><body>
<template id="t">
  <div class="r nmr"><div class="nm"><b>박찬</b>통합과학학원</div></div>
  <div class="r midr"><div class="mid"><span class="rec">고1 예비 (현 중3) 수강생 <em>모집!</em></span><span class="tel"><small>053)</small>213-3577</span></div></div>
  <div class="r chr"><div class="chips"><span>중등부</span><span class="now">고1 예비</span><span>고1 내신</span><span>고3 수능</span><span class="loc">월성 CGV 옆</span></div></div>
</template>
<section class="b" id="d1"></section><section class="b" id="d2"></section><section class="b" id="d3"></section>
<section class="b" id="d4"></section><section class="b" id="d5"></section><section class="b" id="d6"></section>
<script>
const W = 1800 - 88;
document.querySelectorAll('.b').forEach(b => b.append(document.getElementById('t').content.cloneNode(true)));
Promise.all([document.fonts.load('900 100px S'), document.fonts.load('800 100px S')]).then(() => document.querySelectorAll('.b').forEach(b => {
  for (const [sel, maxH] of [['.nm', 330], ['.mid', 140]]) {
    const el = b.querySelector(sel); let lo = 20, hi = 600;
    for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; el.style.fontSize = m + 'px';
      const r = el.getBoundingClientRect(); (el.scrollWidth <= W && r.width <= W && r.height <= maxH) ? lo = m : hi = m; }
    el.style.fontSize = lo + 'px';
  }
}) || (document.body.dataset.ok = 1));
</script>
</body></html>
