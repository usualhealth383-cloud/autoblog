<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:S;font-weight:800;src:url(file:///root/.fonts/static/NotoSansKR-800.ttf)}
@font-face{font-family:S;font-weight:900;src:url(file:///root/.fonts/static/NotoSansKR-900.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#333;font-family:S,sans-serif}
.b{width:1800px;height:600px;position:relative;overflow:hidden;margin-bottom:30px;display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:center;padding:0 44px;min-width:0}
.nmr{flex:0 0 298px;padding-top:12px}.midr{flex:0 0 226px}.chr{flex:0 0 76px}.chr{flex:1}
.nm{font-weight:900;line-height:1;letter-spacing:-.045em;white-space:nowrap}
.mid{display:inline-flex;flex:0 0 auto;align-items:center;gap:.22em;white-space:nowrap;font-weight:900;line-height:1}
.mid .rec{display:block;line-height:1.12;font-size:.47em;letter-spacing:-.03em}.mid .tel{letter-spacing:-.02em}.mid .tel small{font-size:.5em;font-weight:900;margin-right:.1em}
.chips{display:flex;gap:14px;width:100%;height:50px}
.chips span{flex:1;display:grid;place-items:center;font-weight:900;font-size:31px;line-height:1;border-radius:9px;border:4px solid;white-space:nowrap;letter-spacing:-.02em}
.chips span.loc{flex:2.3;border-color:transparent!important;background:transparent!important;font-size:34px;justify-items:end}
.chr{padding-bottom:16px;padding-top:6px}
/* 1 검정+노랑 */
#d1{background:#000}#d1 .nm{color:#FFE600}#d1 .nm b{color:#fff}.nm i{font-style:normal;font-size:.72em;letter-spacing:-.03em;margin-left:.04em}#d1 .rec{color:#fff}#d1 .rec em{font-style:normal;color:#FFE600}#d1 .tel{color:#FFE600}
#d1 .chips span{border-color:#FFE600;color:#FFE600}#d1 .chips span.now{background:#FFE600;color:#000}#d1 .chips .loc{color:#fff}
</style></head><body>
<template id="t">
  <div class="r nmr"><div class="nm"><b>박찬</b>통합과학<i>학원</i></div></div>
  <div class="r midr"><div class="mid"><span class="rec">고1 예비 (현 중3)<br>수강생 <em>모집!</em></span><span class="tel"><small>T.</small>213-3577</span></div></div>
  <div class="r chr"><div class="chips"><span>중등부</span><span>고1 예비</span><span>고1 내신</span><span>고3 수능</span><span class="loc">월성 CGV 옆 그루빌딩 5층</span></div></div>
</template>
<section class="b" id="d1"></section>
<script>
const W = 1800 - 88;
document.querySelectorAll('.b').forEach(b => b.append(document.getElementById('t').content.cloneNode(true)));
Promise.all([document.fonts.load('900 100px S'), document.fonts.load('800 100px S')]).then(() => document.querySelectorAll('.b').forEach(b => {
  for (const [sel, maxH] of [['.nm', 276], ['.mid', 212]]) {
    const el = b.querySelector(sel); let lo = 20, hi = 600;
    for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; el.style.fontSize = m + 'px';
      const r = el.getBoundingClientRect(); (el.scrollWidth <= W && r.width <= W && r.height <= maxH) ? lo = m : hi = m; }
    el.style.fontSize = lo + 'px';
  }
}) || (document.body.dataset.ok = 1));
</script>
</body></html>
