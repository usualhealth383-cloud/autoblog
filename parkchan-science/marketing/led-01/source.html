<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:S;font-weight:700;src:url(file:///root/.fonts/static/NotoSansKR-700.ttf)}
@font-face{font-family:S;font-weight:800;src:url(file:///root/.fonts/static/NotoSansKR-800.ttf)}
@font-face{font-family:S;font-weight:900;src:url(file:///root/.fonts/static/NotoSansKR-900.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#333;font-family:S,sans-serif;word-break:keep-all}
.b{width:1800px;height:600px;position:relative;overflow:hidden;margin-bottom:30px;padding:38px 76px 40px;display:flex;flex-direction:column;justify-content:space-between}
.pill{display:inline-block;font-weight:800;font-size:40px;letter-spacing:.06em;padding:4px 26px;border-radius:999px;align-self:flex-start}
.nm{font-weight:900;font-size:206px;line-height:1;letter-spacing:-.045em;margin-top:6px;white-space:nowrap}
.mid{display:flex;align-items:center;justify-content:space-between;gap:30px}
.rec{font-weight:900;font-size:76px;letter-spacing:-.03em;white-space:nowrap}
.tel{font-weight:900;font-size:128px;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.tel small{font-size:56px;font-weight:800;margin-right:8px;vertical-align:10px}
.chips{display:flex;gap:18px;align-items:center}
.chips .loc{margin-left:auto;border:none;padding:0;font-size:42px;font-weight:800;border-radius:0}
.chips span{font-weight:800;font-size:44px;padding:6px 30px;border-radius:12px;border:5px solid;white-space:nowrap}
/* A 남색 밤 */
#A{background:#002C59}
#A .pill{background:#FFF100;color:#002C59}
#A .nm{color:#FDF9F1}#A .nm b{color:#00A5EA}
#A .rec{color:#FDF9F1}#A .rec em{font-style:normal;color:#FFF100}
#A .tel{color:#FFF100}
#A .chips span{border-color:#5E7FA6;color:#C9D6E6}#A .chips .loc{color:#FDF9F1}#A .chips span.now{background:#FFF100;border-color:#FFF100;color:#002C59}
/* B 노랑 낮 */
#B{background:#FFE600}
#B .pill{background:#002C59;color:#FFE600}
#B .nm{color:#002C59}#B .nm b{color:#0045EB}
#B .rec{color:#002C59}#B .rec em{font-style:normal;color:#D7261E}
#B .tel{color:#002C59}
#B .chips span{border-color:#002C59;color:#002C59}#B .chips .loc{color:#002C59}#B .chips span.now{background:#002C59;color:#FFE600}
/* C 두 띠 */
#C{background:#FDF9F1;padding:0}
#C .top{padding:30px 76px 0;height:330px;display:flex;flex-direction:column}
#C .pill{background:#0045EB;color:#fff}
#C .nm{color:#002C59;font-size:196px;margin-top:0}#C .nm b{color:#0045EB}
#C .bot{position:absolute;left:0;right:0;bottom:0;height:270px;background:#002C59;padding:28px 76px 30px;display:flex;flex-direction:column;justify-content:space-between}
#C .rec{color:#fff;font-size:70px}#C .rec em{font-style:normal;color:#FFF100}
#C .tel{color:#FFF100;font-size:116px}
#C .chips span{border-color:#5E7FA6;color:#C9D6E6;font-size:40px;padding:4px 26px}#C .chips .loc{color:#FDF9F1}#C .chips span.now{background:#FFF100;border-color:#FFF100;color:#002C59}
</style></head><body>
<section class="b" id="A">
  <div><span class="pill">통합과학전문</span><div class="nm"><b>박찬</b>통합과학학원</div></div>
  <div class="mid"><div class="rec">고1 예비 (현 중3) 수강생 <em>모집!</em></div><div class="tel"><small>053)</small>213-3577</div></div>
  <div class="chips"><span>중등부</span><span class="now">고1 예비</span><span>고1 내신</span><span>고3 수능</span><span class="loc">월성 CGV 옆</span></div>
</section>
<section class="b" id="B">
  <div><span class="pill">통합과학전문</span><div class="nm"><b>박찬</b>통합과학학원</div></div>
  <div class="mid"><div class="rec">고1 예비 (현 중3) 수강생 <em>모집!</em></div><div class="tel"><small>053)</small>213-3577</div></div>
  <div class="chips"><span>중등부</span><span class="now">고1 예비</span><span>고1 내신</span><span>고3 수능</span><span class="loc">월성 CGV 옆</span></div>
</section>
<section class="b" id="C">
  <div class="top"><span class="pill">통합과학전문</span><div class="nm"><b>박찬</b>통합과학학원</div></div>
  <div class="bot"><div class="mid"><div class="rec">고1 예비 (현 중3) 수강생 <em>모집!</em></div><div class="tel"><small>053)</small>213-3577</div></div>
  <div class="chips"><span>중등부</span><span class="now">고1 예비</span><span>고1 내신</span><span>고3 수능</span><span class="loc">월성 CGV 옆</span></div></div>
</section>
</body></html>
