<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:S;font-weight:900;src:url(file:///root/.fonts/static/NotoSansKR-900.ttf)}
@font-face{font-family:S;font-weight:700;src:url(file:///root/.fonts/static/NotoSansKR-700.ttf)}
*{margin:0;padding:0;box-sizing:border-box}body{background:#888}
.b{width:2090px;height:300px;background:#FFE41C;display:flex;align-items:center;justify-content:space-between;gap:34px;padding:0 50px;position:relative;overflow:hidden;font-family:S;margin-bottom:20px}
.hd{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:14px;font-weight:900;font-size:100px;letter-spacing:-.045em;color:#111;line-height:1}
.hd .bx{background:#111;color:#fff;padding:6px 22px 14px;transform:skewX(-8deg);display:inline-block}
.hd .bx span{display:inline-block;transform:skewX(8deg)}
.hd svg{position:absolute;left:30%;bottom:-40px;width:72%;height:40px}
.bs{flex:0 1 auto;display:flex;gap:14px;min-width:0}
.k{flex:0 0 auto;height:150px;padding:0 20px;border-radius:30px;display:flex;align-items:center;justify-content:center;gap:.22em;font-weight:900;letter-spacing:-.05em;font-size:50px;letter-spacing:-.03em;white-space:nowrap}
.v1 .k{border:7px solid #111;color:#111;background:rgba(255,255,255,.18)}
.v2 .k{background:#111;color:#fff;border:5px solid #fff;box-shadow:0 0 0 6px #111}
.v2 .k em{color:#FFE41C}
.k em{font-style:normal}
.sp{position:absolute;width:16px;background:#111;border-radius:8px}
</style>
<div class="b v1" id="v1"><div class="hd">통합과학 <span class="bx"><span>전문</span></span> 학원!!<svg viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M6 30 C120 10 260 6 394 14" stroke="#E0262C" stroke-width="14" stroke-linecap="round" fill="none"/></svg></div>
<div class="bs"><div class="k">고1 <em>예비반</em></div><div class="k">고3 <em>수능반</em></div><div class="k">고1 <em>내신대비반</em></div><div class="k">중등부 <em>특강반</em></div></div></div>
<div class="b v2" id="v2"><div class="hd">통합과학 <span class="bx"><span>전문</span></span> 학원!!<svg viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M6 30 C120 10 260 6 394 14" stroke="#E0262C" stroke-width="14" stroke-linecap="round" fill="none"/></svg></div>
<div class="bs"><div class="k">고1 <em>예비반</em></div><div class="k">고3 <em>수능반</em></div><div class="k">고1 <em>내신대비반</em></div><div class="k">중등부 <em>특강반</em></div></div></div>
<script>document.fonts.ready.then(()=>{for(const b of document.querySelectorAll('.b')){const bs=b.querySelector('.bs');let f=60;while(b.scrollWidth>b.clientWidth&&f>30){f-=1;bs.querySelectorAll('.k').forEach(k=>k.style.fontSize=f+'px')}b.dataset.f=f}document.body.dataset.ok=1})</script>
