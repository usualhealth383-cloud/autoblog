name: yakjido-data

# 약지도 — 식약처 낱알식별·의약품 허가 목록을 공공데이터 OpenAPI 로 «최신»으로 받아 작업 가지에 올린다(2026-10-13).
# 필요한 것: 저장소 Secrets 의 DATA_GO_KR_KEY(공공데이터포털 일반 인증키) — 키 값은 로그·파일 어디에도 남지 않는다.
# 돌리는 법: yakjido/tools/data-refresh.txt 를 바꿔 이 가지에 올리면 돈다(main 에 병합된 뒤에는 Actions 탭 「Run workflow」와 매달 1일 자동도).
# 받는 데 실패하거나 건수가 너무 적으면 기존 자료를 그대로 두고 멈춘다(fetch_mfds.py).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 18 1 * *'   # 매달 2일 03:17(한국 시각) — 기본 가지(main)에서만 돈다
  push:
    branches: [claude/medicine-recommendation-app-na6x0m]
    paths:
      - 'yakjido/tools/data-refresh.txt'

concurrency:
  group: yakjido-data
  cancel-in-progress: false

permissions:
  contents: write   # 받은 자료를 작업 가지에 커밋

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/medicine-recommendation-app-na6x0m
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 키 확인
        id: k
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then echo "::notice::Secrets 에 DATA_GO_KR_KEY 가 아직 없어 건너뜁니다 — yakjido/현욱님-할일-1013.md ⑥"; echo "ok=0" >> $GITHUB_OUTPUT; else echo "ok=1" >> $GITHUB_OUTPUT; fi
      - name: 식약처 OpenAPI 받기
        if: steps.k.outputs.ok == '1'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 yakjido/tools/fetch_mfds.py
      - name: 빌드·자료 검사
        if: steps.k.outputs.ok == '1'
        run: |
          pip install pillow >/dev/null
          python3 yakjido/tools/remap_easy.py   # 새 e약은요 성분 → 약지도 약 연결
          python3 yakjido/tools/build.py
          git checkout -- docs/yakjido/icon-maskable-512.png || true
          python3 yakjido/tests/data.py
      - name: 받은 자료 보관(올리기가 실패해도 남게)
        if: steps.k.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: mfds-data
          path: |
            docs/yakjido/data/pills.json
            docs/yakjido/data/pills-rx.json
            docs/yakjido/data/meta.json
            yakjido/tools/permits.json
            yakjido/tools/quasi.json
            docs/yakjido/data/easy-*.json
          if-no-files-found: ignore
      - name: 작업 가지에 올리기
        if: steps.k.outputs.ok == '1'
        run: |
          git config user.name "yakjido-data-bot"
          git config user.email "yakjido-data-bot@users.noreply.github.com"
          # 받은 자료 파일만 올린다 — 화면 파일(index.html·core.json·sw.js)은 작업 세션이 당겨 와서 다시 빌드한다(겹쳐 올리다 부딪히지 않게)
          git add docs/yakjido/data/pills.json docs/yakjido/data/pills-rx.json docs/yakjido/data/meta.json docs/yakjido/data/names-rx.json
          git add -A docs/yakjido/data/easy-*.json docs/yakjido/data/easy-index.json
          for f in yakjido/tools/permits.json yakjido/tools/quasi.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "약지도 — 식약처 낱알식별·허가 목록 최신으로(OpenAPI 자동 받기)"
          # 받는 동안(10~20분) 가지에 다른 커밋이 올라올 수 있다 — 받은 자료 커밋을 그 위로 옮겨 올린다.
          # 빌드가 바꾼 화면 파일(올리지 않는 것)은 버린 뒤에 당긴다 — 남아 있으면 rebase 가 거절하고 조용히 끝났다(10-14)
          git reset -q --hard HEAD
          ok=0; for i in 1 2 3; do if git pull --rebase origin claude/medicine-recommendation-app-na6x0m && git push origin HEAD:claude/medicine-recommendation-app-na6x0m; then ok=1; break; fi; sleep 5; done
          [ "$ok" = 1 ] || { echo "::error::작업 가지에 올리지 못했습니다 — 실행 결과물 mfds-data 에 받은 자료가 있습니다"; exit 1; }
