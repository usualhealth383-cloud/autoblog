<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4B92AF"/>
      <stop offset="1" stop-color="#2E7290"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 512) scale(0.76) translate(-512 -512)">


  <!-- 바닥 타원 — 핀이 «여기» 꽂혀 있다는 느낌. 핀보다 뒤에 둔다 -->
  <ellipse cx="512" cy="792" rx="252" ry="74" fill="none" stroke="#B9DCEE" stroke-width="34" stroke-linecap="round"/>

  <!-- 반짝임 세 줄 — 「여기예요」 -->
  <g stroke="#B9DCEE" stroke-width="34" stroke-linecap="round">
    <line x1="750" y1="228" x2="722" y2="292"/>
    <line x1="846" y1="282" x2="798" y2="330"/>
    <line x1="906" y1="378" x2="842" y2="402"/>
  </g>

  <!-- 핀 -->
  <path d="M500 214 a206 206 0 0 1 206 206 c0 136 -148 284 -196 372 a12 12 0 0 1 -20 0 C442 704 294 556 294 420 A206 206 0 0 1 500 214 Z" fill="#FBFAF7"/>

  <!-- 알약 — 반은 진한 색, 반은 핀과 같은 흰색. 지도 위에 찍힌 알약 -->
  <g transform="rotate(-42 500 414)">
    <!-- 아래쪽 절반: 색이 찬 알약 -->
    <path d="M442 352 h58 v124 h-58 a62 62 0 0 1 0 -124 Z" fill="#2E7290"/>
    <!-- 위쪽 절반: 흰 알약. 핀도 희니까 테두리를 둘러야 «알약»으로 읽힌다 -->
    <path d="M500 352 h58 a62 62 0 0 1 0 124 h-58 Z" fill="#FBFAF7" stroke="#2E7290" stroke-width="16" stroke-linejoin="round"/>
    <!-- 가운데 이음선 -->
    <line x1="500" y1="352" x2="500" y2="476" stroke="#2E7290" stroke-width="16"/>
  </g>
  </g>
</svg>
