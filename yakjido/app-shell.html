<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<!-- 본문 글꼴: Pretendard Variable(토스·당근이 쓰는 한글 UI 서체). 필요한 글자 묶음만 받는 dynamic subset. 못 받으면 Noto Sans KR 로 자연히 떨어진다 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --primary:#0B6E8F; --primary-deep:#08526B; --primary-rgb:11,110,143;
  --accent:#B5711C; --accent-text:#8A5512; --accent-tint:#FBF0DC;
  --surface:#FAF8F3; --card:#FFFFFF; --ground:#EFEBE3;
  --text:#1E2A30; --body:#3B474E; --muted:#5B6770; --faint:#6E787E;
  --hairline:#E6E2DA; --tint:#DCEFF5; --tint2:#F3F1EB;
  --ui-line:#848C92;   /* 스위치·체크칸처럼 «꺼진» 조작 부품의 테두리 — 흰 바탕에 3.4:1 */
  --normal:#1A7946; --caution:#8A6313; --alert:#B63629;
  --normal-tint:#E4F1E9; --caution-tint:#F6EEDD; --alert-tint:#F6E4E1;
  --rx:#4C5FB5; --rx-tint:#E9ECF8;
  --viz-1:#0075A8; --viz-2:#B96A12;   /* 그림 두 줄 — dataviz 검사기 통과(색각·명도·대비) */
  --on-primary:#FFFFFF; --on-alert:#FFFFFF;   /* 밝은 바탕 위 글자 — 다크에서 뒤집힌다 */
  --r-card:16px; --r-input:10px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --shadow-card:0 4px 18px rgba(var(--primary-rgb),.06);
  --shadow-raised:0 6px 16px rgba(var(--primary-rgb),.22);
  --font:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primary:#5DB3D2; --primary-deep:#8CCDE3; --primary-rgb:93,179,210;
    --accent:#D9A24E; --accent-text:#E9B86A; --accent-tint:#2E2619;
    --surface:#161A1C; --card:#1E2427; --ground:#0E1214;
    --text:#E8ECEE; --body:#C3CBD0; --muted:#9AA6AD; --faint:#8A959B;
    --hairline:#2B3438; --tint:#1F3540; --tint2:#1B2226; --ui-line:#75828A; --ui-line:#75828A;
    --normal:#4FB783; --caution:#E0A83A; --alert:#E8635A;
    --normal-tint:#1C2A22; --caution-tint:#2A2418; --alert-tint:#2C1E1C;
    --rx:#9AA8EA; --rx-tint:#1F2438; --viz-1:#2E9BC8; --viz-2:#BA7B26;
    --on-primary:#06222C; --on-alert:#2A0F0C;
    --shadow-card:0 4px 18px rgba(0,0,0,.35); --shadow-raised:0 6px 16px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --primary:#5DB3D2; --primary-deep:#8CCDE3; --primary-rgb:93,179,210;
  --accent:#D9A24E; --accent-text:#E9B86A; --accent-tint:#2E2619;
  --surface:#161A1C; --card:#1E2427; --ground:#0E1214;
  --text:#E8ECEE; --body:#C3CBD0; --muted:#9AA6AD; --faint:#8A959B;
  --hairline:#2B3438; --tint:#1F3540; --tint2:#1B2226; --ui-line:#75828A;
  --normal:#4FB783; --caution:#E0A83A; --alert:#E8635A;
  --normal-tint:#1C2A22; --caution-tint:#2A2418; --alert-tint:#2C1E1C;
  --rx:#9AA8EA; --rx-tint:#1F2438; --viz-1:#2E9BC8; --viz-2:#BA7B26;
    --on-primary:#06222C; --on-alert:#2A0F0C;
  --shadow-card:0 4px 18px rgba(0,0,0,.35); --shadow-raised:0 6px 16px rgba(0,0,0,.45);
}

/* ── 그룹 색조: 배경 틴트·아이콘에만. 경고색이 아니라 '어느 방인지' 알려 주는 색 ── */
.g-pain{--gbg:#F9E9E3;--gfg:#A5462F} .g-resp{--gbg:#E1EFF6;--gfg:#1F6A8C} .g-gi{--gbg:#ECF0DE;--gfg:#5E6E1F}
.g-skin{--gbg:#EDE8F5;--gfg:#5E4B9B} .g-etc{--gbg:#E6E9F2;--gfg:#3F4D8A} .g-uro{--gbg:#E0F2EF;--gfg:#1E6F66}
.g-women{--gbg:#F7E6EC;--gfg:#9A3E63} .g-oral{--gbg:#E3F1EA;--gfg:#2A6E4A} .g-eye{--gbg:#E7ECF7;--gfg:#3A5B96}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .g-pain{--gbg:#3A2420;--gfg:#F0A08C}
 :root:not([data-theme="light"]) .g-resp{--gbg:#1C3240;--gfg:#8CCDE3} :root:not([data-theme="light"]) .g-gi{--gbg:#283020;--gfg:#C5D27A}
 :root:not([data-theme="light"]) .g-skin{--gbg:#2B2640;--gfg:#C3B3F0} :root:not([data-theme="light"]) .g-etc{--gbg:#242A3E;--gfg:#AEB9F0}
 :root:not([data-theme="light"]) .g-uro{--gbg:#1C3330;--gfg:#8CD8CC} :root:not([data-theme="light"]) .g-women{--gbg:#3A2430;--gfg:#F0A8C4}
 :root:not([data-theme="light"]) .g-oral{--gbg:#1E3328;--gfg:#9ED9B4}
 :root:not([data-theme="light"]) .g-eye{--gbg:#1F2740;--gfg:#A8BCEA} }
:root[data-theme="dark"] .g-pain{--gbg:#3A2420;--gfg:#F0A08C} :root[data-theme="dark"] .g-resp{--gbg:#1C3240;--gfg:#8CCDE3}
:root[data-theme="dark"] .g-gi{--gbg:#283020;--gfg:#C5D27A} :root[data-theme="dark"] .g-skin{--gbg:#2B2640;--gfg:#C3B3F0}
:root[data-theme="dark"] .g-etc{--gbg:#242A3E;--gfg:#AEB9F0} :root[data-theme="dark"] .g-uro{--gbg:#1C3330;--gfg:#8CD8CC}
:root[data-theme="dark"] .g-women{--gbg:#3A2430;--gfg:#F0A8C4} :root[data-theme="dark"] .g-oral{--gbg:#1E3328;--gfg:#9ED9B4}
:root[data-theme="dark"] .g-eye{--gbg:#1F2740;--gfg:#A8BCEA}
.tile .ic{background:var(--gbg,var(--tint));color:var(--gfg,var(--primary))}
.gdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gfg,var(--primary));margin-right:8px;vertical-align:1px}
.tile.wait .wait-t{background:var(--tint2);color:var(--muted)}
.tile.wait{border-style:solid;opacity:.92}
.review-stamp.wait{color:var(--muted)}

/* ── 입장 모션: 카드가 40ms 간격으로 살짝 떠오른다. 움직임을 줄인 기기는 건너뛴다 ── */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
#view>*:nth-child(2){animation-delay:40ms} #view>*:nth-child(3){animation-delay:80ms} #view>*:nth-child(4){animation-delay:120ms}
#view>*:nth-child(5){animation-delay:160ms} #view>*:nth-child(6){animation-delay:200ms} #view>*:nth-child(7){animation-delay:240ms}
#view>*:nth-child(n+8){animation-delay:280ms}
@media (prefers-reduced-motion:reduce){#view>*{animation:none}}
/* 움직임을 줄여 달라고 해 두신 분께는 전부 멈춘다 — 어지럼·멀미가 있으신 분께 필요하다 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}


/* ── 증상 상세: 똑같은 흰 막대 다섯 개 대신, 색과 아이콘이 다른 펼침 카드 ── */
.explore{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--s4)}
.xc{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);min-width:0}
.xc[open],.xc:last-child:nth-child(odd){grid-column:1/-1}
.xc summary{list-style:none;cursor:pointer;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:128px}
.xc summary::-webkit-details-marker{display:none}
.xc summary .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--xbg,var(--tint));color:var(--xfg,var(--primary));flex:none}
.xc summary b{font-size:1rem;line-height:1.3;font-weight:800}
.xc summary .pv{font-size:.8125rem;color:var(--muted);line-height:1.45;word-break:keep-all;overflow-wrap:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
/* 팁 본문은 줄바꿈이 살아야 읽힌다 — pre-line 이 없으면 35꼭지가 전부 글 덩어리가 된다 */
.tip-body{font-size:1rem;line-height:1.8;white-space:pre-line;word-break:keep-all;overflow-wrap:break-word}
/* 약 상식은 갈래마다 방 색을 쓴다 — 여섯 갈래가 한 덩어리로 보이지 않게 */
.sec[id^="tgrp"] .xc summary .ic{background:var(--gbg);color:var(--gfg)}
/* 2열 카드 + 큰 글씨: 「이부프로펜·나프록센·아스피린」처럼 붙어 있는 구절은 keep-all 로는 못 접는다 — 어쩔 수 없을 때만 글자 사이에서 */
.xc summary b,.xc summary .pv{overflow-wrap:anywhere;min-width:0}
.xc summary .cnt{margin-top:auto;font-size:.75rem;font-weight:800;color:var(--xfg,var(--primary));display:inline-flex;align-items:center;gap:4px}
.xc summary .cnt svg.i{width:14px;height:14px;transition:transform .2s}
.xc[open] summary{flex-direction:row;align-items:center;min-height:0;gap:12px}
.xc[open] summary .pv{display:none}
.xc[open] summary b{flex:1}
.xc[open] summary .cnt{margin-top:0} .xc[open] summary .cnt svg.i{transform:rotate(90deg)}
.xc .bd{padding:0 14px 16px;animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.xc .bd{animation:none}}
.xc.how{--xbg:var(--tint);--xfg:var(--primary)} .xc.talk{--xbg:var(--accent-tint);--xfg:var(--accent-text)}
.xc.self{--xbg:var(--normal-tint);--xfg:var(--normal)} .xc.nono{--xbg:var(--alert-tint);--xfg:var(--alert)}
.xc.next{--xbg:var(--caution-tint);--xfg:var(--caution)} .xc.faq{--xbg:var(--tint2);--xfg:var(--muted)}
.xc.talk .art{margin:0 0 10px}
/* 「그런 줄 알았는데」 — 흔히 듣는 말 위에 근거를 나란히 놓는다 */
.xc.myth{--xbg:var(--caution-tint);--xfg:var(--caution)}
.xc.myth summary .heard{font-size:.9375rem;line-height:1.35;font-weight:700;color:var(--muted);word-break:keep-all}
.xc.myth summary .verdict{font-size:.9375rem;line-height:1.4;font-weight:800;color:var(--body);word-break:keep-all;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.xc.myth[open] summary{flex-direction:column;align-items:flex-start}
.xc.myth[open] summary .verdict{display:block;-webkit-line-clamp:none}
.myth-n{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:800;color:var(--primary-deep);background:var(--tint);border-radius:999px;padding:6px 12px;margin-bottom:10px;word-break:keep-all}
.myth-lead{margin:10px 0 0;font-size:.9375rem;line-height:1.65;word-break:keep-all}
/* 병원에서 내는 묶음 — 성분·역할이 앞, 제품 이름은 누르면 */
.rxc{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);overflow:hidden}
.rxc-top{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 12px}
.rxc-top>svg.i{flex:none;margin-top:2px;color:var(--rx)}
.rxc-top b{display:block;font-size:1.0625rem;font-weight:800;line-height:1.35}
.rxc-top span{display:block;font-size:.875rem;color:var(--body);line-height:1.6;margin-top:4px;word-break:keep-all;white-space:pre-line}
.rxc-row{border-top:1px solid var(--hairline)}
.rxc-h{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;text-align:left;padding:13px 16px;min-height:60px}
.rxc-hd{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;width:100%}
.rxc-role{flex:none;padding:4px 9px;border-radius:8px;background:var(--rx-tint);color:var(--rx);font-size:.6875rem;font-weight:800;line-height:1.25;word-break:keep-all}
.rxc-t{flex:1;min-width:0}
.rxc-t b{display:block;font-size:1rem;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.rxc-why{display:block;font-size:.875rem;color:var(--body);line-height:1.6;word-break:keep-all}
.rxc-more{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-size:.75rem;font-weight:700;color:var(--primary)}
.rxc-more svg.i{width:14px;height:14px;transition:transform .2s}
.rxc-row.open .rxc-more svg.i{transform:rotate(90deg)}
.rxc-bd{display:none;padding:0 16px 14px}
.rxc-row.open .rxc-bd{display:block}
.rxc-names{display:flex;flex-wrap:wrap;gap:6px}
.rxc-name{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 13px;border-radius:12px;background:var(--tint2);border:1px solid var(--hairline);min-height:46px;text-align:left}
.rxc-name b{font-size:.9375rem;font-weight:700;line-height:1.3}
.rxc-name small{font-size:.6875rem;color:var(--muted)}
.rxc-foot{display:flex;gap:8px;align-items:flex-start;padding:12px 16px;background:var(--tint2);font-size:.8125rem;color:var(--muted);line-height:1.55}
.rxc-foot svg.i{flex:none;width:16px;height:16px;margin-top:2px}
/* 말풍선 — 약국 카운터에서 실제로 하는 말 */
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{position:relative;max-width:88%;padding:11px 14px;border-radius:16px 16px 16px 4px;background:var(--tint2);font-size:.9375rem;line-height:1.6;color:var(--text)}
.bubble.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--tint);color:var(--primary-deep)}
.bubble .who{display:block;font-size:.6875rem;font-weight:800;color:var(--muted);margin-bottom:3px;letter-spacing:.04em}
.bubble.me .who{color:var(--primary)}
/* 체크리스트 — 누르면 표시된다. 저장은 안 한다(재미와 확인용) */
ul.ck{list-style:none}
ul.ck li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--hairline);font-size:.9375rem;line-height:1.55;color:var(--body);cursor:pointer;user-select:none}
ul.ck li:last-child{border-bottom:0}
ul.ck li::before{content:"";flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--normal);margin-top:2px;transition:background .2s,transform .2s}
ul.ck li.on{color:var(--muted)}
ul.ck li.on::before{background:var(--normal);box-shadow:inset 0 0 0 3px var(--card);transform:scale(1.08)}
.ck-done{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--normal-tint);color:var(--normal);font-weight:700;font-size:.875rem;display:flex;gap:8px;align-items:center}
/* 하지 말 것 */
ul.nono{list-style:none}
ul.nono li{display:flex;gap:10px;padding:9px 0;font-size:.9375rem;color:var(--body);line-height:1.55;border-bottom:1px dashed var(--hairline)}
ul.nono li:last-child{border-bottom:0}
ul.nono li svg.i{flex:none;color:var(--alert);margin-top:3px;width:18px;height:18px}
/* 안 낫으면 — 시간 순서 */
ol.tl{list-style:none;position:relative;padding-left:26px}
ol.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--hairline)}
ol.tl li{position:relative;padding:0 0 14px;font-size:.9375rem;color:var(--body);line-height:1.55}
ol.tl li::before{content:"";position:absolute;left:-24px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--caution);box-shadow:0 0 0 3px var(--card)}
ol.tl li:last-child{padding-bottom:0}
/* 질문·답 */
.qa{padding:10px 0;border-bottom:1px solid var(--hairline)} .qa:last-child{border-bottom:0}
.qa .q{font-weight:800;font-size:.9375rem;display:flex;gap:8px} .qa .q::before{content:"Q";color:var(--primary);font-weight:900}
.qa .a{margin-top:4px;font-size:.9375rem;color:var(--body);line-height:1.6;padding-left:22px}
/* 신호등 — 어디까지 약국인지 한눈에. 문장을 자르지 않고 개수만 보여 준다 */
.tl3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.tl3 button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 11px;border-radius:12px;text-align:left;min-height:66px}
.tl3 .lb{font-size:.6875rem;font-weight:800;letter-spacing:.04em}
.tl3 .tx{font-size:.8125rem;line-height:1.35;color:var(--text);font-weight:600}
.tl3 .ok{background:var(--normal-tint)} .tl3 .ok .lb{color:var(--normal)}
.tl3 .cl{background:var(--caution-tint)} .tl3 .cl .lb{color:var(--caution)}
.tl3 .er{background:var(--alert-tint)} .tl3 .er .lb{color:var(--alert)}
/* 조건 칩 — 세로로 다섯 줄 대신 두 열 */
.fitme .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fitme .chips .chip{justify-content:flex-start;min-height:46px;white-space:normal;text-align:left;line-height:1.3}
.fitme .chips .chip.more{grid-column:1/-1;justify-content:center;background:transparent;border:1px dashed var(--hairline);min-height:46px}
.chip.more{min-height:46px}
/* 왜 이렇게 고르나 — 한 줄 강조 */
.lead-p{margin-top:16px;padding:12px 14px 12px 16px;border-left:3px solid var(--gfg,var(--primary));background:var(--gbg,var(--tint2));border-radius:0 12px 12px 0;font-size:.9375rem;line-height:1.7}
.ans-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:var(--s2)}
.ans-head .eyebrow{margin:0}
.speak{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:46px;height:46px;line-height:1;box-sizing:border-box;padding:0 12px;border-radius:var(--r-pill);background:var(--tint2);color:var(--primary);font-size:.8125rem;font-weight:700}
.speak.on{background:var(--primary);color:var(--on-primary)}

.netbar{display:flex;gap:8px;align-items:flex-start;padding:10px 16px;background:var(--caution-tint);color:var(--caution);font-size:.875rem;line-height:1.5;font-weight:600}
.netbar svg.i{flex:none;margin-top:2px}
.seg button{min-height:44px}
.view-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.view-row .t b{display:block;font-size:.9375rem;font-weight:700}
.view-row .t span{display:block;font-size:.8125rem;color:var(--muted)}
.fs-seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.fs-seg button{min-width:52px;min-height:44px;border-radius:12px;background:var(--tint2);color:var(--muted);font-weight:800}
.fs-seg button.on{background:var(--primary);color:var(--on-primary)}
.fs-seg button:nth-child(1){font-size:.875rem} .fs-seg button:nth-child(2){font-size:1.0625rem} .fs-seg button:nth-child(3){font-size:1.25rem} .fs-seg button:nth-child(4){font-size:1.4375rem}
.fs-seg button{min-width:46px}
.hello-fs{margin-top:var(--s3);padding:14px;border-radius:14px;background:var(--tint2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.hello-fs b{font-size:.9375rem}
.hello-close{margin-top:var(--s4);font-size:1.0625rem;line-height:1.7;color:var(--body);text-align:center}
.empty-bag{display:flex;gap:10px;align-items:flex-start;padding:12px 0 4px;color:var(--body);font-size:.9375rem;line-height:1.6}
.empty-bag svg.i{color:var(--normal);flex:none;margin-top:3px}
/* ── 홈: 오늘의 한 장 ── */
.today{display:block;margin-top:var(--s4);padding:16px 18px;border-radius:20px;
  background:linear-gradient(135deg,var(--gbg,var(--tint)) 0%,var(--card) 100%);border:1px solid var(--hairline);box-shadow:var(--shadow-card);text-align:left;width:100%}
.today-go .in{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.today-go .eb{font-size:.6875rem;font-weight:800;letter-spacing:.08em;color:var(--gfg,var(--primary));text-transform:uppercase}
.today-go b{display:block;font-size:1.125rem;font-weight:800;line-height:1.35;margin-top:3px}
.today-go span{display:block;font-size:.875rem;color:var(--body);line-height:1.5;margin-top:4px}
.today-go .ic{width:56px;height:56px;border-radius:18px;background:var(--card);color:var(--gfg,var(--primary));display:grid;place-items:center;box-shadow:var(--shadow-card)}
.today-go .ic svg.i{width:28px;height:28px}
.today-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px calc(-1 * var(--s4)) 0;padding:2px var(--s4) 6px}
.today-row::-webkit-scrollbar{display:none}
.today-row button{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 14px 0 10px;border-radius:14px;background:var(--card);border:1px solid var(--hairline);box-shadow:var(--shadow-card);font-weight:700;font-size:.9375rem}
.today-row button .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--gbg,var(--tint));color:var(--gfg,var(--primary))}
.bag-line.on .cnt{flex:none;display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--normal);color:#fff;font-weight:800;font-size:.8125rem;margin-right:2px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html{font-size:var(--fs,16px)}
body{background:var(--ground);color:var(--text);font-family:var(--font);word-break:keep-all;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  line-height:1.6;display:flex;justify-content:center;min-height:100vh;font-size:1rem;
  -webkit-font-smoothing:antialiased;text-wrap:pretty}
.app{width:100%;max-width:460px;background:var(--surface);min-height:100vh;display:flex;flex-direction:column;overflow-x:clip;
  box-shadow:0 0 40px rgba(0,0,0,.06);position:relative}
main{flex:1;padding:var(--s4) var(--s4) 104px;overflow-x:clip}
.hide{display:none!important}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* 키보드로 다니실 때 지금 어디인지 — 마우스로 누를 때는 안 나온다(:focus-visible) */
:where(button,a,summary,[role="switch"],select,input,textarea):focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{line-height:1.3;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:1.5rem;font-weight:700}
/* 숫자는 자리가 맞아야 읽힌다 — 용량·점수·번호 */
.dose-big b,.dose-hero .big,.show-list .n,.bag-line .cnt,.wx-now,.wx-stats b,.gauge,.kv b{font-variant-numeric:tabular-nums}
h2{font-size:1.125rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{color:var(--body)}
.muted{color:var(--muted)}
.small{font-size:.8125rem}
.num{font-variant-numeric:tabular-nums}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;padding:var(--s1) 0 var(--s4)}
.brand{display:flex;align-items:center;gap:10px}
/* 아래쪽의 「점선 단추」 .mark 와 이름이 겹친다 — 테두리·글꼴을 여기서 되돌린다 */
.brand .mark{width:34px;height:34px;min-height:0;margin:0;padding:0;border:0;border-radius:9px;overflow:hidden;background:none;display:grid;place-items:center;cursor:default;flex:none}
.brand .mark img{width:34px;height:34px;display:block;border-radius:9px}
.brand b{font-size:1.125rem;font-weight:800;letter-spacing:-.02em}
.brand span{display:block;font-size:.75rem;color:var(--muted);line-height:1.2}
.review-stamp{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-size:.75rem;font-weight:600}
.review-stamp svg.i{width:15px;height:15px}
.review-stamp.wait{color:var(--caution)}
.rx-stamp.wait{color:var(--caution);border-color:var(--caution)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.9375rem;font-weight:600;min-height:46px;margin-left:-6px;padding:0 6px}
.back:hover{color:var(--text)}

/* 카드 */
.card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:var(--s5) var(--s4)}
.card+.card,.sec+.sec,.card+.sec,.sec+.card{margin-top:var(--s4)}
.sec{margin-top:var(--s5)}
.sec>h2{margin-bottom:var(--s3);display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.sec>h2 small{font-size:.8125rem;font-weight:500;color:var(--muted)}
a.link.crumb,.drug-hero a.cls,.sec>h2 small a.link{display:inline-flex;align-items:center;min-height:44px}
.ach-l .nm{display:inline-flex;align-items:center;min-height:46px}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--primary);text-transform:uppercase;margin-bottom:var(--s2)}

/* 히어로(증상 선택) */
.hero{padding:var(--s2) 0 var(--s3)}
.hero .greet{font-size:1.5rem;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.hero p{margin-top:var(--s2);font-size:.9375rem}
.search{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s4);background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:0 var(--s3) 0 var(--s4);min-height:52px;box-shadow:var(--shadow-card)}
.search input{min-width:0;max-width:100%;flex:1;border:0;background:none;font:inherit;font-size:1rem;color:var(--text);min-height:50px;outline:none}
.search:focus-within{border-color:var(--primary);box-shadow:var(--shadow-card),0 0 0 3px rgba(var(--primary-rgb),.28)}
.search input::placeholder{color:var(--faint)}
.search svg.i{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--r-pill);background:var(--tint);color:var(--text);font-size:.875rem;font-weight:600;min-height:44px;border:1px solid transparent}
.chip.on,.chip:hover{border-color:var(--primary);color:var(--primary-deep)}
.chip.on{background:var(--card)}

/* 증상 타일 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.tile{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);padding:var(--s4);text-align:left;min-height:104px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-card);transition:transform .15s ease}
.tile:hover{transform:translateY(-1px)}
.tile .ic{width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--primary);display:grid;place-items:center}
.tile b{font-size:.9375rem;font-weight:700;line-height:1.3}
.tile span{font-size:.75rem;color:var(--muted);line-height:1.4}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:var(--s3);min-height:0}
.tile.wide .ic{flex:none}
.tile.wide div{flex:1;min-width:0}
.tile.wide b{display:block}
.tile.wide svg.chev{color:var(--faint)}
.tile.wait{border-style:dashed}
.tile .wait-t{display:inline-flex;align-self:flex-start;margin-top:auto;padding:2px 7px;border-radius:6px;background:var(--caution-tint);color:var(--caution);font-size:.6875rem;font-weight:700}

/* 처방 스타일 조합 카드 — 시그니처 */
.rx-card{background:var(--card);border:1px solid var(--hairline);border-radius:20px;box-shadow:0 10px 30px rgba(var(--primary-rgb),.10);overflow:hidden}
.rx-card .rx-head{padding:var(--s4) var(--s4) var(--s3);border-bottom:1px dashed var(--hairline);display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.rx-card .rx-head h2{font-size:1.0625rem}
.rx-card .rx-head .lbl{font-size:.75rem;color:var(--muted);margin-top:2px}
.rx-card .rx-stamp{font-size:.75rem;color:var(--primary);border:1.5px solid var(--primary);border-radius:6px;padding:3px 8px;white-space:nowrap;transform:rotate(-4deg);opacity:.9}
.slot{display:grid;grid-template-columns:44px 1fr;gap:var(--s3);padding:var(--s4);border-bottom:1px solid var(--hairline)}
.slot:last-child{border-bottom:0}
.slot .n{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:.75rem;line-height:1.1;text-align:center;word-break:break-all;padding:2px;overflow:hidden}
.slot .n.rx{background:var(--rx-tint);color:var(--rx)}
.slot .n.opt{background:var(--tint2);color:var(--muted)}
.slot h3{font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot .why{font-size:.875rem;color:var(--body);margin-top:2px}
/* 설명 안의 줄바꿈(· 로 시작하는 목록)이 살아야 한다 — pre-line 이 없으면 한 덩어리로 뭉친다 */
.why,.ix-why{white-space:pre-line;word-break:keep-all;overflow-wrap:break-word}
.slot .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.opt-pill{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--card);font-size:.875rem;font-weight:600;min-height:46px}
.opt-pill.pick{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.opt-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.slot .alt{margin-top:var(--s2);font-size:.8125rem;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:.6875rem;font-weight:700;letter-spacing:.02em;line-height:1.5}
.badge.otc{background:var(--normal-tint);color:var(--normal)}
.badge.cvs{background:var(--tint);color:var(--primary-deep)}
.badge.rx{background:var(--rx-tint);color:var(--rx)}
.badge.warn{background:var(--caution-tint);color:var(--caution)}
.badge.stop{background:var(--alert-tint);color:var(--alert)}

/* 리스트·행 */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--hairline);text-align:left;min-height:56px;width:100%}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.row .body{flex:1;min-width:0}
.row b{display:block;font-size:.9375rem;font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.row span{display:block;font-size:.8125rem;color:var(--muted);line-height:1.4;margin-top:1px;white-space:normal;overflow-wrap:anywhere;word-break:keep-all}
/* 배지는 글자만큼만 — .row span 의 display:block 에 먹혀 줄 전체를 채우던 것 */
.row .badge{display:inline-flex;width:auto;margin-top:0;vertical-align:middle}
/* 사진이 없을 때 그려 주는 제형 그림 */
.pimg.drawn{display:grid;place-items:center;background:var(--tint2);border:1px solid var(--hairline)}
.pimg.drawn .pform{width:78%;height:78%;fill:none;stroke:var(--primary);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
/* 제형 표시 — 먹는 약인지 바르는 약인지가 이름만으로는 안 보인다 */
/* 남은 약 — 숫자 한 칸과 남은 날 */
/* 나이가 안 되는 약 — 숫자 대신 경고가 그 자리에 */
.dose-card.young{border-color:var(--alert);background:var(--alert-tint)}
.young-stop{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.young-stop svg{width:24px;height:24px;flex:none;color:var(--alert);margin-top:2px}
.young-stop b{display:block;font-size:1.0625rem;font-weight:800;color:var(--alert);margin-bottom:4px}
.young-stop p{font-size:.9375rem;line-height:1.6;color:var(--text);word-break:keep-all}
.hero-speak{margin-top:10px}
.hero-speak .speak{position:static}
.stock{width:130px;min-height:46px;padding:0 12px;border:1px solid var(--hairline);border-radius:var(--r-input);background:var(--card);color:var(--text);font-size:1rem;font-weight:700}
.stockok{color:var(--normal);font-size:.8125rem;font-weight:800}
.stockwarn{color:var(--alert);font-size:.8125rem;font-weight:800}
.ftag{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:.75rem;font-weight:700;color:var(--muted);background:var(--tint2);border-radius:999px;padding:3px 9px}
.ftag svg{width:14px;height:14px;flex:none}
.row svg.chev{color:var(--faint)}
.unote{display:flex;align-items:flex-start;gap:5px;font-size:.8125rem;font-style:normal;font-weight:600;color:var(--caution);line-height:1.4;margin-top:4px;word-break:keep-all}
.unote svg{width:14px;height:14px;flex:none;margin-top:2px}
.usebar{display:flex;align-items:flex-start;gap:8px;background:var(--caution-tint);color:var(--caution);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.875rem;font-weight:600;line-height:1.5;word-break:keep-all}
.usebar svg{width:18px;height:18px;flex:none;margin-top:1px}
ul.plain{list-style:none}
ul.plain li{position:relative;padding-left:18px;font-size:.9375rem;color:var(--body);line-height:1.6;margin-bottom:6px}
ul.plain li::before{content:"";position:absolute;left:4px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--primary);opacity:.55}
ul.plain.x li::before{background:var(--alert);opacity:.8}
ul.steps{list-style:none;counter-reset:s}
ul.steps li{counter-increment:s;position:relative;padding-left:34px;font-size:.9375rem;color:var(--body);line-height:1.6;margin-bottom:10px}
ul.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:8px;background:var(--tint);color:var(--primary);font-weight:800;font-size:.75rem;display:grid;place-items:center}

/* 근거·면책 */
.src-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;min-height:46px;border-radius:var(--r-pill);background:var(--tint);color:var(--muted);font-size:.75rem;text-decoration:none;margin:4px 4px 0 0;max-width:100%}
.src-chip svg.i{width:13px;height:13px}
.src-chip:hover{color:var(--text)}
.src-chip.unv{background:var(--caution-tint);color:var(--caution)}
.srcs{margin-top:var(--s3)}
.disclaimer{display:flex;align-items:flex-start;gap:var(--s2);margin-top:var(--s5);padding:var(--s3) var(--s4);background:var(--tint);border-radius:var(--r-input);color:var(--muted);font-size:.8125rem;line-height:1.55}
.disclaimer svg.i{width:16px;height:16px;margin-top:2px}

/* 아이 용량 계산기 */
.kid-form{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
/* 가장 큰 글씨 × 좁은 화면에서는 두 칸이 안 들어간다 — 한 줄씩 */
@media (max-width:360px){.kid-form{grid-template-columns:1fr}}
.kid-form label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:700;color:var(--muted)}
.kid-form label.full{grid-column:1/-1}
.kid-form input,.kid-form select{min-height:48px;border:1px solid var(--hairline);border-radius:var(--r-input);padding:0 12px;font:inherit;font-size:1.0625rem;background:var(--card);color:var(--text);width:100%}
.kid-form input:focus,.kid-form select:focus{outline:2px solid var(--primary);outline-offset:1px}
.dose-card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:var(--s4);margin-top:var(--s3)}
.dose-card .eyebrow{margin-bottom:4px}
.dose-big{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.dose-big b{font-size:2.25rem;font-weight:800;letter-spacing:-.02em;color:var(--primary-deep);line-height:1.1}
.dose-big span{color:var(--muted);font-size:.9375rem}
.dose-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.dose-meta div{background:var(--tint2);border-radius:10px;padding:8px 10px}
.dose-meta small{display:block;font-size:.6875rem;font-weight:700;color:var(--muted)}
.dose-meta b{display:block;font-size:.9375rem;margin-top:1px}
.dose-card .warn{margin-top:10px}
.kid-line{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--tint);color:var(--primary-deep);font-size:.875rem;font-weight:600;margin-top:10px;line-height:1.5}
.kid-line svg.i{flex:none;margin-top:2px}
/* 결론 카드(증상 첫 화면) */
.answer{background:var(--card);border:1.5px solid var(--primary);border-radius:20px;padding:var(--s4);box-shadow:0 10px 30px rgba(var(--primary-rgb),.12)}
.answer .eyebrow{margin-bottom:var(--s2)}
.answer .buy{display:flex;flex-direction:column;gap:8px}
/* 「둘 중 하나만」 묶음 — 나란히 선 자리를 「다 사야 하는 줄」로 읽지 않으시도록 한 상자에 담는다 */
.either{display:flex;flex-direction:column;gap:8px;padding:10px;border:2px solid var(--hairline);border-radius:14px;background:var(--bg)}
.either-h{font-size:.8125rem;color:var(--muted);line-height:1.5;word-break:keep-all}
.either-h b{color:var(--text)}
.either-or{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.75rem;font-weight:700}
.either-or::before,.either-or::after{content:'';flex:1;height:1px;background:var(--hairline)}
/* 허가사항에서 뽑은 「먼저 보실 것」 — 2,000자 원문 앞에 사실 서너 개를 세운다 */
.keyfacts{display:flex;flex-direction:column;gap:0}
.kf{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:baseline;padding:11px 0;border-top:1px solid var(--hairline);word-break:keep-all}
.kf:first-child{border-top:0;padding-top:0}
.kf b{font-size:.8125rem;color:var(--muted);font-weight:700}
.kf span{font-size:1rem;line-height:1.5}
.pub-more{margin-top:8px;border-top:1px solid var(--hairline);padding-top:8px}
.pub-more>summary{display:flex;align-items:center;gap:6px;min-height:44px;cursor:pointer;font-weight:700;color:var(--primary);font-size:.9375rem;list-style:none}
.pub-more>summary::-webkit-details-marker{display:none}
.pub-more[open]>summary svg{transform:rotate(90deg)}
/* 나란히 선 단추 두 개 — 320 px·큰 글씨에서는 위아래로 접힌다 */
.actions.two{display:flex;gap:8px;flex-wrap:wrap}
.actions.two>.btn{flex:1 1 132px;min-width:0}
.buy-item{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--tint2)}
.buy-item .k{font-size:.6875rem;font-weight:800;color:var(--primary);background:var(--tint);border-radius:8px;padding:6px 0;text-align:center;line-height:1.2}
.buy-item.opt .k{background:var(--tint2);color:var(--muted);border:1px dashed var(--hairline)}
.buy-item b{font-size:1rem;display:block;line-height:1.3}
.buy-item small{display:block;color:var(--muted);font-size:.75rem;margin-top:1px}
.buy-item .rx{font-size:.6875rem}
.answer .line{display:grid;grid-template-columns:56px 1fr;gap:10px;margin-top:12px;font-size:.9375rem;line-height:1.5}
.answer .line span:first-child{font-weight:800;color:var(--muted);font-size:.8125rem;padding-top:2px}
.answer .line.stop span:first-child{color:var(--alert)}
.memo-actions{display:flex;gap:8px;margin-top:14px}
.memo-actions .btn{min-height:44px;font-size:.875rem;padding:0 14px}
/* 바로 답 항목 펼침 */
.buy-item{cursor:pointer;text-align:left;width:100%;border:0;font:inherit;color:inherit}
.buy-item .chev{color:var(--faint);justify-self:end}
.buy-more{margin:-2px 0 6px;padding:12px 14px 12px 14px;border-radius:0 0 12px 12px;background:var(--card);border:1px solid var(--hairline);border-top:0}
.buy-more .how{font-size:1rem;font-weight:700;line-height:1.5}
.buy-more .how small{display:block;font-weight:500;color:var(--muted);font-size:.8125rem;margin-top:2px}
.buy-more .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.buy-more .links a,.plink{display:inline-flex;align-items:center;gap:5px;padding:9px 13px;border-radius:var(--r-pill);background:var(--tint2);border:1px solid var(--hairline);font-size:.875rem;font-weight:600;text-decoration:none;color:var(--text);min-height:44px}
.buy-more .links a svg.i,.plink svg.i{width:14px;height:14px;color:var(--primary)}
.buy-item.open{border-radius:12px 12px 0 0}
/* 알아두기 */
.tip-card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:var(--s4);display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.tip-card .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;flex:none}
.tip-card b{display:block;font-size:1rem;line-height:1.35}
.tip-card span{display:block;color:var(--muted);font-size:.8125rem;margin-top:3px}
/* 복용 시간표 */
.sched-row{padding:12px 0;border-bottom:1px solid var(--hairline)}
.sched-row:last-child{border-bottom:0}
.note.soft{background:var(--tint2);color:var(--body)}
.how-list{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;line-height:1.6;color:var(--body)}
.note.alert{background:var(--alert-tint);color:var(--text)}
.vt-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 10px;margin-top:10px}
.vt-f{display:flex;flex-direction:column;gap:4px;font-size:.8125rem;color:var(--muted);font-weight:600}
.vt-f input{width:96px;min-height:52px;padding:0 12px;border:1px solid var(--hairline);border-radius:var(--r-input);background:var(--card);color:var(--text);font-size:1.375rem;font-weight:800;font-variant-numeric:tabular-nums}
.vt-f input::placeholder{color:var(--faint);font-weight:500;opacity:.55}
.vt-f input[type=date],.vt-f input[type=time]{width:auto;min-width:150px;font-size:1.0625rem}
.vt-f input:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.vt-sl{font-size:1.5rem;color:var(--faint);padding-bottom:10px}
.vt-big{display:flex;flex-direction:column;gap:2px}.vt-big span{font-size:.8125rem;color:var(--muted);font-weight:600}
.vt-big b{font-size:2.25rem;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.5px}.vt-big b small{font-size:1.5rem;color:var(--faint);margin:0 2px}
.vt-big em{font-style:normal;font-size:.8125rem;color:var(--muted)}
.vt-list{display:flex;flex-direction:column}
.vt-li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hairline)}.vt-li:last-child{border-bottom:0}
.vt-t{flex:1;min-width:0;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}.vt-t small{font-weight:500;color:var(--muted)}
.vt-li b{font-variant-numeric:tabular-nums;color:var(--text)}.vt-li b small{font-weight:500;color:var(--muted);font-size:.8125rem}
.vt-x{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--faint);background:none;border:0}
.vz{width:100%;height:auto;display:block;margin-top:8px}
.vz-grid{stroke:var(--hairline);stroke-width:1}.vz-ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.vz-ref{stroke:var(--faint);stroke-width:1.5;stroke-dasharray:4 4}.vz-reft{fill:var(--muted);font-size:10.5px;font-weight:600}
.vz-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.vz-dot{stroke:var(--card);stroke-width:2}
.vz-line.v1{stroke:var(--viz-1)}.vz-line.v2{stroke:var(--viz-2)}.vz-dot.v1{fill:var(--viz-1)}.vz-dot.v2{fill:var(--viz-2)}
.vz-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:.8125rem;color:var(--muted)}
.vz-legend span{display:inline-flex;align-items:center;gap:6px}.vz-legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.vz-legend i.v1{background:var(--viz-1)}.vz-legend i.v2{background:var(--viz-2)}.vz-legend i.ref{background:none;border-top:2px dashed var(--faint);height:0}
/* 홈 가운데 — ClinicScore 처럼 같은 모양 한 줄 행, 한 장 카드, 한 줄 가로 탭 (2026-09-29) */
.util{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.util-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 14px;border-radius:14px;background:var(--card);border:1px solid var(--hairline);text-align:left;color:var(--text)}
.util-row .ic{flex:0 0 36px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--tint);color:var(--primary-deep)}
.util-row .ic svg.i{width:19px;height:19px}
.util-row .t{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.util-row .t b{font-size:1rem;font-weight:700}.util-row .t small{font-size:.8125rem;color:var(--muted)}
.util-row>svg.i:last-child{flex:none;color:var(--faint)}
.today{padding:0!important;margin-top:var(--s4);border-radius:20px;background:linear-gradient(160deg,var(--gbg,var(--tint)),var(--card) 72%);border:1px solid var(--hairline);overflow:hidden}
.today-go{display:block;width:100%;text-align:left;padding:16px 18px 12px;background:none;border:0;color:var(--text)}
.wx.wx-in,.wx.wx-in.quiet{margin:0 18px;padding:12px 0 4px;border:0;border-top:1px solid var(--hairline);background:none;box-shadow:none;border-radius:0}
.wx-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:.9375rem;color:var(--body)}
.wx-line .wx-ic{display:grid;place-items:center;color:var(--gfg,var(--primary))}.wx-line .wx-ic svg.i{width:20px;height:20px}
.wx-line .wx-now{font-size:1.25rem;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.wx-line .wx-st{white-space:nowrap}.wx-line .wx-st.hi{color:var(--caution);font-weight:700}.wx-line .wx-st.bad{color:var(--alert);font-weight:700}
.wx-line .wx-city{margin-left:auto}
.wx-in .wx-retry{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 10px;border-radius:10px;background:none;border:1px solid var(--hairline);color:var(--primary-deep);font:inherit;font-size:.875rem}
.wx-in .wx-tip{margin-top:10px}
.wx-in .wx-foot{margin-top:8px;font-size:.6875rem;color:var(--muted)}
.today-links{display:flex;flex-wrap:wrap;gap:0 14px;padding:4px 18px 10px}
.today-links button{display:inline-flex;align-items:center;min-height:44px;padding:0;background:none;border:0;color:var(--gfg,var(--primary-deep));font:inherit;font-size:.9375rem;font-weight:700}
.today-links button::after{content:'›';margin-left:4px;font-weight:600;opacity:.7}
nav.gjump{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * var(--s4));margin-right:calc(-1 * var(--s4));padding:4px var(--s4) 6px}
.gjump::-webkit-scrollbar{display:none}.gjump button{flex:none}
.prn-qty{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.875rem;color:var(--muted)}
.prn-qty button{min-width:56px;min-height:44px;border-radius:12px;border:1px solid var(--hairline);background:var(--card);color:var(--body);font:inherit;font-weight:700}
.prn-qty button.on{border-color:var(--primary);color:var(--primary-deep);box-shadow:inset 0 0 0 1px var(--primary)}
.prn-undo{display:block;min-height:44px;margin:2px auto 0;padding:0 8px;background:none;border:0;color:var(--muted);font:inherit;font-size:.875rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.sched-row .nm{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.times .chip{min-height:44px;padding:0 12px}
.times .chip.on{background:var(--tint);border-color:var(--primary);color:var(--primary-deep)}
.dose-list{display:flex;flex-direction:column;gap:8px;margin-top:var(--s3)}  /* 예전 이름 .today 가 홈 카드와 충돌했다 */
.dose-tick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--hairline);width:100%;text-align:left;min-height:60px}
.dose-tick .t{font-weight:800;font-size:1.0625rem;min-width:52px;font-variant-numeric:tabular-nums}
.dose-tick .n{flex:1}
.dose-tick .n b{display:block;font-size:1rem}
.dose-tick .n small{color:var(--muted);font-size:.8125rem}
.dose-tick .bx{width:28px;height:28px;border-radius:50%;border:2px solid var(--hairline);display:grid;place-items:center;flex:none;color:#fff}
.dose-tick.done{background:var(--normal-tint);border-color:transparent}
.dose-tick.done .bx{background:var(--normal);border-color:var(--normal)}
.dose-tick.late{border-color:rgba(182,54,41,.35)}
.wait-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:52px;font-size:1.0625rem}
.wait-fold>summary::-webkit-details-marker{display:none}
.wait-fold>summary small{flex:1;font-size:.8125rem;font-weight:500;color:var(--muted)}
.wait-fold>summary svg.i{color:var(--faint);transition:transform .2s}
.wait-fold[open]>summary svg.i{transform:rotate(90deg)}
/* 홈 「오늘 약」 한 장 */
.dh{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);overflow:hidden}
.dh-go{display:block;width:100%;text-align:left;padding:13px 16px 10px}
.dh-h .eb{display:block;font-size:.6875rem;font-weight:800;letter-spacing:.04em;color:var(--primary);text-transform:none}
.dh-h b{display:block;font-size:1.0625rem;margin-top:2px;color:var(--text)}
.dh-b{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--hairline)}
.dh-b svg.i{flex:none;width:22px;height:22px;color:var(--muted)}
.dh-b span{flex:1;min-width:0}
.dh-b b{display:block;font-size:1rem;line-height:1.35;overflow-wrap:anywhere}
.dh-b small{display:block;font-size:.8125rem;color:var(--muted);margin-top:2px}
.dh-b.ok{background:var(--normal-tint)} .dh-b.ok svg.i{color:var(--normal)}
.dh-b.due{background:var(--tint)} .dh-b.due svg.i{color:var(--primary)}
.dh-tick{flex:none;min-height:44px;padding:0 14px;border-radius:var(--r-pill);background:var(--primary);color:var(--on-primary);font-weight:800;font-size:.875rem}
.dh-low{display:flex;align-items:flex-start;gap:8px;padding:10px 16px;border-top:1px solid var(--hairline);background:var(--caution-tint);color:var(--caution);font-size:.8125rem}
.dh-low svg.i{flex:none;width:17px;height:17px;margin-top:1px}
/* 지난 기록 달력 — 색만으로 뜻을 나르지 않도록 «다 드심»에는 채움, «일부»에는 반달, «빠짐»에는 테두리만 */
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.cal-dow span{text-align:center;font-size:.6875rem;font-weight:700;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:1fr;gap:4px;margin-top:4px}
.cal-d{aspect-ratio:1;min-width:0;border-radius:9px;display:grid;place-items:center;font-size:.75rem;font-weight:700;
  font-variant-numeric:tabular-nums;background:var(--tint2);color:var(--faint);border:1px solid transparent}
.cal-d.full{background:var(--normal);color:var(--on-primary);border-color:var(--normal)}
.cal-d.part{background:var(--caution-tint);color:var(--caution);border-color:var(--caution)}
.cal-d.miss{background:transparent;color:var(--alert);border:1px dashed var(--alert)}
.cal-d.soon{background:var(--tint);color:var(--primary-deep);border-color:var(--primary)}
.cal-d.fut{background:transparent;color:var(--hairline);border-color:transparent}
.cal-key{display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px;margin-top:10px;font-size:.75rem;color:var(--muted)}
.cal-key .ki{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.cal-key .k{width:12px;height:12px;border-radius:4px;flex:none;border:1px solid transparent}
.cal-key .k.full{background:var(--normal);border-color:var(--normal)}
.cal-key .k.part{background:var(--caution-tint);border-color:var(--caution)}
.cal-key .k.miss{border:1px dashed var(--alert)}
.cal-key .k.none{background:var(--tint2);border-color:var(--hairline)}
.cal-key .k.cal-now{background:transparent;box-shadow:0 0 0 2px var(--primary);border-color:transparent}
/* 불편했던 일 적기 */
.ae-list{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ae-list li{display:flex;align-items:flex-start;gap:8px;background:var(--tint2);border-radius:12px;padding:10px 10px 10px 12px}
.ae-list li>div{flex:1;min-width:0}
.ae-list b{font-size:.875rem}
.ae-list span{margin-left:6px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ae-list p{font-size:.875rem;color:var(--body);margin-top:3px;word-break:keep-all}
.ae-x{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:transparent}
.ae-form{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.ae-lbl{font-size:.75rem;font-weight:700;color:var(--muted);margin-top:6px}
.ae-inp{width:100%;min-height:48px;padding:0 12px;border-radius:var(--r-input);border:1px solid var(--ui-line);background:var(--card);color:var(--text);font:inherit;font-size:1rem}
.ae-inp:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.ae-form .btn{margin-top:10px}
.cal-span{margin-top:12px;font-size:.75rem;font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.cal-d.cal-now{box-shadow:0 0 0 2px var(--primary)}
/* 나에게 맞추기 칩 */
.fitme{margin-top:var(--s3)}
.fitme .chips .chip{min-height:40px}
.fitme .chip.on{background:var(--alert-tint);border-color:var(--alert);color:var(--alert)}
.fit-bar{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:11px 13px;border-radius:12px;background:var(--tint);color:var(--text);font-size:.9375rem;line-height:1.45;min-height:46px}
.fit-bar>svg.i{flex:none;color:var(--primary)} .fit-bar span{flex:1;min-width:0} .fit-bar>svg.i:last-child{color:var(--faint)}
.fit-me{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--tint2);color:var(--muted);font-size:.8125rem;font-weight:600;min-height:44px}
.fit-me svg.i{flex:none;width:16px;height:16px}
.fit-me span{flex:1;min-width:0}
.fit-me svg.chev{width:15px;height:15px}
/* 접이식 섹션 */
details.acc{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);margin-top:var(--s3)}
details.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px var(--s4);font-size:1.0625rem;font-weight:700;min-height:56px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary small{font-weight:500;color:var(--muted);font-size:.8125rem;flex:1;text-align:left;min-width:0}
details.acc summary svg.i{color:var(--faint);transition:transform .2s}
details.acc[open] summary svg.i{transform:rotate(90deg)}
details.acc .bd{padding:0 var(--s4) var(--s4)}
/* 홈 빠른 선택 */
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:var(--s4) calc(-1 * var(--s4)) 0;padding:0 var(--s4) 4px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 12px;border-radius:14px;background:var(--card);border:1px solid var(--hairline);box-shadow:var(--shadow-card);font-weight:700;font-size:.9375rem}
.quick button svg.i{color:var(--primary)}
/* 제품 사진 */
.pimg{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--hairline);flex:none}
.buy-item.has-img{grid-template-columns:52px 44px 1fr auto}
.drug-photo{display:flex;gap:12px;align-items:center;margin-top:var(--s3);padding:12px;background:var(--card);border:1px solid var(--hairline);border-radius:14px}
.drug-photo img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:#fff;border:1px solid var(--hairline)}
.drug-photo b{display:block;font-size:.9375rem}
.drug-photo small{color:var(--muted);font-size:.75rem}
/* 3단계 안내 */
.steps-bar{display:flex;gap:6px;margin:var(--s2) 0 var(--s4)}
.steps-bar i{flex:1;height:4px;border-radius:999px;background:var(--hairline)}
.steps-bar i.on{background:var(--primary)}
.g-list{display:flex;flex-direction:column;gap:8px}
.g-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--hairline);text-align:left;min-height:64px;box-shadow:var(--shadow-card)}
.g-item .ic{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.g-item b{display:block;font-size:1.0625rem}
.g-item span{display:block;color:var(--muted);font-size:.8125rem}
.g-grp{font-size:.75rem;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:var(--s4) 0 var(--s2)}
.g-q{font-size:1.375rem;font-weight:700;line-height:1.35;margin-bottom:6px}
.g-chips{display:flex;flex-direction:column;gap:8px;margin-top:var(--s3)}
.g-chips .chip{min-height:52px;font-size:1rem;justify-content:flex-start;padding:0 16px;border-radius:14px}
.g-chips .chip.on{background:var(--tint);border-color:var(--primary);color:var(--primary-deep)}
.hero-cta{margin-top:var(--s4)}
/* 첫 화면: 큰 그림 단추 여섯 개 */
.q6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.q6i{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:100px;padding:12px 6px;border-radius:18px;background:var(--card);border:1px solid var(--hairline);box-shadow:var(--shadow-card);font-weight:700;font-size:1rem;line-height:1.25;text-align:center;color:var(--text)}
.q6i .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--tint);color:var(--primary)} .q6i .ic svg.i{width:26px;height:26px}
.q6i b{overflow-wrap:anywhere}
/* 사진이 없는 약의 제형 그림 */
.shots .ps.form .fi{display:grid;place-items:center;width:96px;height:72px;background:var(--tint);border:1px solid var(--hairline);border-radius:10px;color:var(--primary)}
.shots .ps.form .fi svg{width:34px;height:34px}
.shots .ps.form figcaption small{display:block;color:var(--primary);font-weight:700;margin-top:1px}

/* 조건 칩 — 글자가 두 줄이 되어도 잘리지 않게 */
.chips .chip{min-height:52px;line-height:1.35;align-items:center;padding-top:10px;padding-bottom:10px}
.ans-head .eyebrow{font-size:.9375rem}

/* 누를 수 있는 것과 없는 것을 눈으로 가른다(토스 시니어 리서치: 태그와 버튼을 구분 못 하신다).
   배지는 「설명」이라 알약 모양을 버리고 글자만 남기고, 누르는 것에만 테두리를 준다. */
.buy .buy-item .badge,.slot h3 .badge{background:transparent!important;padding:0;border-radius:0;font-size:.75rem;font-weight:600;letter-spacing:0}
.buy .buy-item .badge::before,.slot h3 .badge::before{content:'· '}
.buy .buy-item{border-width:1.5px}
.buy .buy-item+.buy-item{margin-top:var(--s3)}   /* 손가락 간격 12px 이상 */
/* 2026-10-06 — 간격이 세 군데서 더해져(flex gap 8 + 위 12 + 아래 8) 카드 사이가 28px로 벌어지고, 펼친 설명은 카드에서 14px 떨어져 따로 놀았다.
   간격은 gap 하나(12px)로만, 펼친 카드와 설명은 한 장으로 붙인다 */
.answer .buy{gap:var(--s3)}
.answer .buy>.buy-item,.answer .buy>.buy-item+.buy-item{margin:0}
.answer .buy>.buy-item.open{border-bottom-left-radius:0;border-bottom-right-radius:0}
/* 제품 사진이 실제로 뜨면(폰) 옛 4칸 규칙(.buy-item.has-img 52px 44px 1fr auto)이 이겨 글자가 44px 칸에 갇혔다 — 지금 카드는 글·사진·화살표 3칸.
   샌드박스에서는 바깥 사진이 안 떠서 검사가 못 잡았다(2026-10-06). 검사 9a 가 사진을 흉내 내서 본다 */
.answer .buy .buy-item.has-img{grid-template-columns:1fr auto auto}   /* 「둘 중 하나」 묶음(.either) 안의 카드도 */
.answer .buy>.buy-more{margin:calc(-1 * var(--s3)) 0 0;border:1.5px solid var(--primary);border-top:0;border-radius:0 0 var(--r-card) var(--r-card)}
.opt-pill{border:1.5px solid var(--hairline)}

/* 「자세히」 — 긴 설명을 접어 둔다 */
.why-more{margin-top:6px}
.why-more>summary{display:inline-flex;align-items:center;gap:4px;font-size:.8125rem;font-weight:700;color:var(--primary);cursor:pointer;list-style:none;padding:4px 0;min-height:32px}
.why-more>summary::-webkit-details-marker{display:none}
.why-more>summary::after{content:'▾';font-size:.75rem}
.why-more[open]>summary::after{content:'▴'}
.why-more .why{margin-top:2px}

/* 약 줄 다시 — 역할을 위에 작게, 약 이름을 크게. 배지·칩을 줄여 눈이 쉬게 한다 */
.buy .buy-item{grid-template-columns:1fr auto auto;gap:var(--s3);padding:var(--s4);background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);align-items:center;margin-bottom:var(--s2)}
.buy .buy-item.open{border-color:var(--primary)}
.buy .buy-item .bi-t{display:block;min-width:0}
.buy .buy-item .role{display:block;font-size:.75rem;font-weight:700;color:var(--primary);letter-spacing:.01em;margin-bottom:3px}
.buy .buy-item.opt .role{color:var(--muted)}
.buy .buy-item b{display:block;font-size:1.125rem;font-weight:800;line-height:1.35;letter-spacing:-.01em;color:var(--text);overflow-wrap:anywhere}
.buy .buy-item .sub{display:block;font-size:.875rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.buy .buy-item .pimg{width:52px;height:42px;object-fit:contain;border-radius:8px;background:var(--tint2)}
.buy .buy-item .bi-r svg{width:20px;height:20px;color:var(--muted)}
.buy .buy-item .badge{margin-top:6px}

/* 병원 신호 — 세 칸 색띠 대신 한 줄 */
.nobuy{margin:0;padding:14px 16px;border-radius:14px;background:var(--soft,#f1f4f6);color:var(--ink2,#4a5b66);line-height:1.65;word-break:keep-all}
.nobuy b{color:var(--ink,#16232b)}
.wk-home h2 span{display:flex;align-items:center;gap:8px}
.wk-home h2 svg{width:20px;height:20px}
.wk-home .wk+.wk{margin-top:8px}
/* 갈래 바로가기 — 가로로 밀어 보는 한 줄 */
.gjump{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 6px;margin-top:var(--s4)}
.gjump button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--hairline);color:var(--text);font-size:.9375rem;font-weight:700;line-height:1.3;cursor:pointer;max-width:100%}
.gjump button .gdot{width:8px;height:8px;border-radius:50%;background:var(--gfg,var(--primary));flex:0 0 auto}
.pub-qa p,.qa p{white-space:pre-line}
/* 처방약이 떨어졌을 때 — 약국에서 가장 가까운 것 */
.rxout{margin-top:var(--s4);padding:var(--s4);border-radius:var(--r-card);border:1px solid var(--hairline);background:var(--card)}
.rxout.yes{border-color:var(--normal);background:var(--normal-tint)}
.rxout.no{border-color:var(--hairline);background:var(--tint2)}
.ro-h{display:flex;align-items:center;gap:8px;font-size:1rem;margin-bottom:var(--s2)}
.rxout.yes .ro-h{color:var(--normal)} .rxout.no .ro-h{color:var(--muted)}
.ro-h svg{width:20px;height:20px;flex:0 0 auto}
.rxout>p{font-size:.9375rem;line-height:1.65;color:var(--text);word-break:keep-all}
.ro-list{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
.ro{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:52px;padding:var(--s3);background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-input);text-align:left;cursor:pointer}
.ro>span{flex:1;min-width:0}
.ro b{display:block;font-size:1rem;font-weight:700}
.ro small{display:block;font-size:.8125rem;color:var(--muted);overflow-wrap:anywhere}
.ro svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}
/* 답 카드 아래 「할 수 있는 것」 — 같은 모양 줄 하나로 묶는다.
   전에는 회색 띠·파란 띠·빨간 테두리 상자·파란 단추·흰 단추가 따로 쌓여 어지러웠다. */
.acts{margin-top:var(--s4);border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--card);overflow:hidden}
.act{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:60px;padding:var(--s3) var(--s4);text-align:left;cursor:pointer;background:none;border:0;border-top:1px solid var(--hairline)}
.act:first-child{border-top:0}
.act .ai{display:grid;place-items:center;width:34px;height:34px;flex:0 0 auto;border-radius:11px;background:var(--tint2);color:var(--muted)}
.act .ai svg{width:18px;height:18px}
.act .at{flex:1;min-width:0}
.act .at b{display:block;font-size:1rem;font-weight:700;line-height:1.35;color:var(--text)}
.act .at small{display:block;font-size:.8125rem;color:var(--muted);line-height:1.4;margin-top:1px}
.act>svg:last-child{width:18px;height:18px;color:var(--faint);flex:0 0 auto}
.act.alert .ai{background:var(--alert-tint);color:var(--alert)}
.act.alert .at b{color:var(--alert)}
/* 주 단추는 하나뿐 — 여기에만 색을 쓴다 */
.btn.go-cart{margin-top:var(--s3);min-height:56px;font-size:1.0625rem;font-weight:800}
/* 펼친 약 카드 — 글자 크기 둘, 색 하나. 칩을 늘어놓지 않는다. */
.buy-more .bm-sec{margin-top:var(--s4)}
.buy-more .bm-l{display:block;font-size:.8125rem;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-bottom:4px}
.buy-more .bm-dose{font-size:1.125rem;font-weight:700;line-height:1.55;color:var(--text);word-break:keep-all}
.buy-more .bm-sub{font-size:.9375rem;color:var(--muted);line-height:1.55;margin-top:2px;word-break:keep-all}
.buy-more .bm-names{font-size:1rem;line-height:1.6;color:var(--text);word-break:keep-all}
.buy-more .shots{margin-bottom:6px}
.buy-more .shots .ps{flex:0 0 76px}
.buy-more .shots .ps img{width:76px;height:58px}
.buy-more ul.bm-rules{list-style:none;margin:0}
.buy-more ul.bm-rules li{position:relative;padding-left:15px;font-size:1rem;line-height:1.6;color:var(--text);word-break:keep-all}
.buy-more ul.bm-rules li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.buy-more ul.bm-rules li.no{color:var(--alert)}
.buy-more ul.bm-rules li.no::before{background:var(--alert)}
.buy-more .bm-links{display:flex;flex-wrap:wrap;gap:2px 20px;margin-top:var(--s3)}
.buy-more .bm-links a{display:inline-flex;align-items:center;min-height:44px;color:var(--primary);font-size:.9375rem;font-weight:700;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0}
.buy-more .bm-links a svg.i{display:none}
/* 같은 일을 하는 다른 약 */
.bm-alts{display:flex;flex-direction:column;gap:6px}
.bm-alt{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--tint2);border:1px solid var(--hairline);cursor:pointer}
.bm-alt b{display:block;font-size:1rem;font-weight:700;color:var(--text)}
.bm-alt small{display:block;font-size:.8125rem;color:var(--muted);line-height:1.45;margin-top:1px;word-break:keep-all}
/* 꼭 살 것과 「도움될 수 있는 것」을 눈으로 가른다 — 후자는 옅게(현욱님 지시 2026-09-21) */
.badge.soft{background:var(--tint2);color:var(--faint);font-weight:600}
.buy .buy-item{border-width:1.5px}
.buy .buy-item.opt{border-width:1px;border-color:var(--hairline);background:var(--surface);box-shadow:none}
.buy .buy-item.opt b{color:var(--body);font-weight:700}
.buy .buy-item.opt .role{color:var(--muted);font-weight:600}
.buy .buy-item.opt .pimg{opacity:.85}
.buy .buy-item:not(.opt) b{font-weight:800}
.buy .buy-item:not(.opt) .role{color:var(--primary);font-weight:800}
/* 영양제 「드실 만한가요」 — 어르신이 읽는 세 줄. 숫자와 시험 이름은 아래 「근거를 자세히」로 */
.verdict{margin-top:var(--s4)}
.verdict .vrow{background:none;border:0;border-radius:0;box-shadow:none;padding:var(--s3) 0 var(--s3) var(--s4);border-left:3px solid var(--hairline)}
.verdict .vrow+.vrow{margin-top:2px}
.verdict .vrow.is-yes{border-left-color:var(--normal)}
.verdict .vrow.is-no{border-left-color:var(--muted)}
.verdict .vrow.is-watch{border-left-color:var(--alert)}
.verdict .vrow>b{display:block;font-size:.8125rem;font-weight:800;letter-spacing:.02em;margin-bottom:5px;color:var(--muted)}
.verdict .vrow.is-yes>b{color:var(--normal)} .verdict .vrow.is-watch>b{color:var(--alert)}
.verdict .vrow>p{font-size:1rem;line-height:1.65;color:var(--text);word-break:keep-all}
.tl1{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;margin-top:var(--s4);padding:var(--s3) var(--s4);background:var(--alert-tint);border:1px solid var(--alert);border-radius:var(--r-card);color:var(--alert);text-align:left;cursor:pointer}
.tl1>svg:first-child{width:22px;height:22px;flex:0 0 auto}
.tl1>span{flex:1;min-width:0}
.tl1 b{display:block;font-size:1rem;font-weight:700}
.tl1 small{display:block;font-size:.8125rem;opacity:.85;font-weight:500}
.tl1 em{display:block;font-style:normal;font-size:.875rem;font-weight:700;line-height:1.4;margin-top:4px;word-break:keep-all;opacity:.95}
.tl1>svg:last-child{width:18px;height:18px;flex:0 0 auto}

/* 약 없이 할 일 — 살 것 목록과 섞이지 않게 따로 */
.care-do{margin-top:var(--s4);background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);padding:var(--s4)}
.care-do h2{font-size:1rem;margin-bottom:var(--s3)}
.do-row{padding:var(--s3) 0;border-top:1px solid var(--hairline)}
.do-row:first-of-type{border-top:0;padding-top:0}
.do-row b{display:block;font-size:1rem;font-weight:700;margin-bottom:4px}
.do-row p{font-size:.9375rem;line-height:1.6;color:var(--body);word-break:keep-all;white-space:pre-line}

/* 「+ 추가 설명」 — 상세를 접어 두는 버튼 */
.more-btn{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;min-height:56px;margin-top:var(--s4);padding:var(--s3) var(--s4);background:var(--card);border:1.5px solid var(--primary);border-radius:var(--r-card);color:var(--primary);cursor:pointer}
.more-btn span{font-size:1.0625rem;font-weight:800;letter-spacing:-.01em}
.more-btn small{font-size:.75rem;color:var(--muted);font-weight:500;word-break:keep-all;line-height:1.4}

/* 「이 약, 효과 봤어요」 기록 */
.mark{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;margin-top:var(--s3);border:1.5px dashed var(--hairline);background:var(--card);color:var(--muted);border-radius:var(--r-input);font-size:.875rem;font-weight:700;cursor:pointer}
.mark svg{width:18px;height:18px}
.mark.on{border-style:solid;border-color:var(--normal);background:var(--normal-tint);color:var(--normal)}
.wk-t{display:inline-flex;align-items:center;gap:3px;color:var(--normal);font-weight:700}
.wk-t svg{width:14px;height:14px}
.worked{margin-top:var(--s4);background:var(--normal-tint);border:1px solid var(--normal);border-radius:var(--r-card);padding:var(--s4)}
.wk-h{display:flex;align-items:center;gap:6px;color:var(--normal);font-size:.9375rem;margin-bottom:var(--s3)}
.wk-h svg{width:20px;height:20px}
.wk-list{display:flex;flex-direction:column;gap:var(--s2)}
.worked .wk, .wk-home .wk{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:52px;padding:var(--s3);background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-input);text-align:left;cursor:pointer}
.worked .wk>span, .wk-home .wk>span{flex:1;min-width:0}
.worked .wk b, .wk-home .wk b{display:block;font-size:1rem;font-weight:700}
.worked .wk small, .wk-home .wk small{display:block;font-size:.8125rem;color:var(--muted);overflow-wrap:anywhere}
.worked .wk-img, .wk-home .wk-img{width:40px;height:32px;object-fit:contain;border-radius:6px;background:var(--tint2)}
.worked .wk svg, .wk-home .wk svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto}

/* 펼친 약의 설명 한 줄과 제품 사진 */
.bm-lead{font-size:.9375rem;line-height:1.55;color:var(--body);margin-bottom:var(--s3);word-break:keep-all}
.shots{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:4px;margin-bottom:var(--s3);-webkit-overflow-scrolling:touch}
.shots .ps{flex:0 0 96px;margin:0;text-align:center}
.shots .ps img{width:96px;height:72px;object-fit:contain;background:var(--tint2);border:1px solid var(--hairline);border-radius:10px;padding:4px}
.shots .ps figcaption{font-size:.6875rem;line-height:1.3;color:var(--muted);margin-top:4px;word-break:keep-all}

/* 증상 맨 위 세 줄 — 색은 왼쪽 띠에만 두고 글자는 검정으로 읽는다(색이 많으면 어지럽다) */
.triage{margin-top:var(--s4)}
.tg-row{padding:var(--s3) 0 var(--s4) var(--s4);border-left:3px solid var(--hairline);margin-bottom:2px}
.tg-row:last-child{margin-bottom:0}
.tg-row.clinic{border-left-color:var(--primary)}
.tg-row.pharm{border-left-color:var(--primary);opacity:1}
.tg-row.esc{border-left-color:var(--alert)}
.tg-row>b{display:block;font-size:.8125rem;font-weight:800;letter-spacing:.02em;margin-bottom:5px;color:var(--muted)}
.tg-row.esc>b{color:var(--alert)}
.tg-row>p{font-size:1rem;line-height:1.65;color:var(--text);word-break:keep-all}
.tg-row>p b{font-weight:700}

.call-in{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;margin:0 1px;border-radius:8px;background:var(--alert-tint);color:var(--alert);font-weight:800;text-decoration:none;white-space:nowrap}
.chk{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--tint2);color:var(--muted);vertical-align:middle;white-space:nowrap;letter-spacing:0}
.q6-more{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--hairline);color:var(--body);font-size:1rem;min-height:52px;line-height:1.4}
.q6-more>svg.i{flex:none} .q6-more span{flex:1;min-width:0} .q6-more>svg.i:last-child{color:var(--faint)}
.q-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.q-row button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:8px 10px;border-radius:14px;background:var(--card);border:1px solid var(--hairline);font-weight:700;font-size:.9375rem;color:var(--text)}
.q-row button svg.i{flex:none;color:var(--primary)}
.easy-home .q6i,.q6i:where(.easy *){min-height:110px}
/* 블록 간 최소 여백 — 어떤 조합으로 이어져도 겹치지 않게 */
main > .answer + *, main > .sec + .care, main > .card + .care, main > .rx-card + *, main > .care + .sec, main > .care + .card, main > .care + .actions, main > details.acc + .sec, main > .answer + .sec{margin-top:var(--s5)}
/* 케어 카드 3단계 (NHS care cards → 약국/병원/응급) */
.care{border-radius:var(--r-card);overflow:hidden;border:1px solid var(--hairline);background:var(--card)}
.care+.care{margin-top:var(--s3)}
.care .hd{display:flex;align-items:center;gap:var(--s2);padding:12px var(--s4);font-weight:800;font-size:.9375rem}
.care.ok .hd{background:var(--normal-tint);color:var(--normal)} .care.clinic .hd{background:var(--caution-tint);color:var(--caution)} .care.er .hd{background:var(--alert);color:var(--on-alert)}
.care .bd{padding:var(--s3) var(--s4) var(--s4)}
.care .bd ul.plain li{margin-bottom:4px;font-size:.9rem}
.care.er .bd ul.plain li::before{background:var(--alert)} .care.clinic .bd ul.plain li::before{background:var(--caution)} .care.ok .bd ul.plain li::before{background:var(--normal)}
.care .go{margin-top:12px;padding-top:12px;border-top:1px solid var(--hairline)}
.care .go p{font-size:.875rem;color:var(--body);line-height:1.6}
.care .go .gl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.care .go .gl a,.care .go .gl button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--hairline);background:var(--card);color:var(--body);font:inherit;font-size:.875rem;font-weight:700;text-decoration:none;cursor:pointer}
.recall-chip{display:inline-flex;align-items:center;gap:4px;margin-top:6px;min-height:44px;padding:0 10px;border-radius:8px;border:1px solid var(--hairline);background:var(--card);color:var(--body);font-size:.75rem;font-weight:700;text-decoration:none}
.recall-chip .i{width:14px;height:14px}
.kid-rev{margin-top:10px;padding-top:8px;border-top:1px dashed var(--hairline);font-size:.8125rem;color:var(--muted);line-height:1.55;word-break:keep-all}
.rf{margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-card);border:1px solid var(--hairline);background:var(--card)}
.rf-h{display:flex;align-items:center;gap:8px;font-size:.9375rem;color:var(--alert)}
.rf-list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.rf-i{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:8px 0;font-size:.9rem;line-height:1.5;color:var(--body);cursor:pointer;word-break:keep-all}
.rf-i input{flex:none;width:22px;height:22px;margin-top:1px;accent-color:var(--alert)}
.rf-hit{display:none;margin-top:8px;padding:12px;border-radius:12px;background:var(--alert-tint)}
.rf-hit p{font-size:.9rem;line-height:1.6}
.rf-hit .gl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rf-hit .call{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--alert);color:var(--on-alert);font-weight:700;text-decoration:none}
.rf-hit .gl a:not(.call){display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--hairline);background:var(--card);color:var(--body);font-weight:700;text-decoration:none;font-size:.875rem}
.rf.hit .rf-hit{display:block} .rf.hit .rf-no{display:none}
.rf-no{margin-top:4px;font-size:.8125rem;color:var(--muted)}
.pshare h1{word-break:keep-all}
.ps-note{margin-top:10px;font-size:1.125rem;line-height:1.6;color:var(--body)}
.ps-list{display:flex;flex-direction:column;gap:10px}
.ps-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-card);border:1px solid var(--hairline);background:var(--card)}
.ps-item b{display:block;font-size:1.25rem;line-height:1.4;word-break:keep-all}
.ps-item span{display:block;margin-top:2px;font-size:.9375rem;color:var(--muted)}
.ps-ask{margin-top:10px;font-size:1rem;color:var(--body)}
.sf{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.sf-t{padding:12px 14px;border-radius:12px;border:1px solid var(--hairline);background:var(--card)}
.sf-t.sf-first{background:var(--surface-2,var(--card))}
.sf-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:4px}
.sf-h b{font-size:.9375rem}
.sf-h span{font-size:.8125rem;color:var(--muted)}
.sf-tip{display:block;margin-top:2px;font-size:.8125rem;color:var(--muted)}
.mo-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
@media (min-width:560px){.mo-grid{grid-template-columns:1fr 1fr}}
.mo{padding:var(--s4);border-radius:var(--r-card);border:1px solid var(--hairline);background:var(--card)}
.mo>b{display:flex;align-items:center;gap:8px;font-size:.9375rem}
.mo p{margin-top:6px;font-size:.875rem;line-height:1.65;color:var(--body);word-break:keep-all}
.mo.od{border-color:rgba(182,54,41,.3);background:var(--alert-tint)}
.mo .call{display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--alert);color:var(--on-alert);font-weight:700;text-decoration:none;font-size:.9rem}
.mo .src{display:block;margin-top:8px;font-size:.75rem;color:var(--muted)}
.care .call{display:inline-flex;align-items:center;gap:6px;margin-top:8px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--alert);color:var(--on-alert);font-weight:700;text-decoration:none;font-size:.9rem}
/* 복약 픽토그램 */
.picts{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}
.pict{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:var(--tint2);border:1px solid var(--hairline);font-size:.75rem;font-weight:700;color:var(--body)}
.pict svg.i{width:15px;height:15px;color:var(--primary)}
.pict.no{color:var(--alert)} .pict.no svg.i{color:var(--alert)}
/* 계산기 */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:700;color:var(--muted)}
.calc input{min-height:44px;border:1px solid var(--hairline);border-radius:var(--r-input);padding:0 12px;font:inherit;font-size:1rem;background:var(--card);color:var(--text);width:100%}
.calc input:focus{outline:2px solid var(--primary);outline-offset:1px}
.calc-out{margin-top:var(--s3);display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.calc-out div{background:var(--tint);border-radius:12px;padding:12px 14px}
.calc-out small{display:block;font-size:.6875rem;font-weight:700;color:var(--muted);letter-spacing:.05em}
.calc-out b{display:block;font-size:1.375rem;font-weight:800;letter-spacing:-.02em;color:var(--primary-deep)}
.dup{padding:12px 14px;border-radius:12px;background:var(--caution-tint);color:var(--caution);margin-top:var(--s3)}
.dup-h{display:flex;align-items:center;gap:8px;font-size:.9375rem;font-weight:800}
.dup ul.plain{margin-top:6px}
.dup ul.plain li{font-size:.875rem;font-weight:600;color:var(--caution);line-height:1.55;padding-left:0}
.dup ul.plain li::before{display:none}
.dup ul.plain li+li{margin-top:8px;padding-top:8px;border-top:1px solid rgba(138,99,19,.18)}
.taking{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}
.taking .chip{gap:8px} .taking .chip button{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--muted)}
.taking .chip button svg.i{width:12px;height:12px}
/* 경고·레드플래그 */
.flag{display:flex;gap:var(--s3);padding:var(--s4);border-radius:var(--r-card);background:var(--alert-tint);border:1px solid rgba(182,54,41,.25)}
.flag svg.i{color:var(--alert);margin-top:2px}
.flag b{color:var(--alert);display:block;font-size:.9375rem}
.flag p{font-size:.875rem;margin-top:2px}
.flag ul.plain li::before{background:var(--alert)}
.note{display:flex;gap:var(--s2);padding:var(--s3) var(--s4);border-radius:var(--r-input);background:var(--caution-tint);color:var(--caution);font-size:.875rem;font-weight:600;line-height:1.5}
.note svg.i{margin-top:2px;width:18px;height:18px}
.me-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
/* 항콜린 부담 카드 */
.ach{border-radius:var(--r-card);border:1px solid var(--hairline);background:var(--card);padding:var(--s4);margin-top:var(--s3)}
.ach.ok{border-color:rgba(26,121,70,.35)}
.ach.warn{border-color:var(--caution);background:var(--caution-tint)}
.ach.stop{border-color:var(--alert);background:var(--caution-tint)}
.ach.stop .ach-n{background:var(--alert);color:var(--on-alert);border-color:var(--alert)}
.ach-h{display:flex;align-items:center;gap:8px;font-size:1.0625rem;font-weight:800}
.ach.ok .ach-h{color:var(--normal)} .ach.warn .ach-h{color:var(--caution)} .ach.stop .ach-h{color:var(--alert)}
.ach-h b{flex:1;min-width:0;font-weight:800}
.ach-n{font-size:.8125rem;font-weight:800;padding:3px 10px;border-radius:var(--r-pill);background:var(--card);color:inherit;flex:none;border:1px solid currentColor}
.ach-w{margin-top:8px;font-size:.9375rem;line-height:1.6;color:var(--body)}
.ach-l{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.ach-l li{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;background:var(--card);border-radius:10px;padding:9px 12px}
.ach-l .nm{font-weight:700;font-size:.9375rem;text-decoration:none;overflow-wrap:anywhere}
.ach-l .lv{font-size:.6875rem;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--tint2);color:var(--muted)}
.ach-l .lv.l2{background:var(--caution-tint);color:var(--caution)} .ach-l .lv.l3{background:var(--alert-tint);color:var(--alert)}
.ach-l small{grid-column:1/-1;color:var(--muted);font-size:.75rem;line-height:1.4}
details.ach-alt{margin-top:10px;background:var(--card);border-radius:10px}
details.ach-alt summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;font-size:.9375rem;font-weight:700;min-height:44px}
details.ach-alt summary::-webkit-details-marker{display:none}
details.ach-alt summary svg.i{color:var(--faint);transition:transform .2s}
details.ach-alt[open] summary svg.i{transform:rotate(90deg)}
details.ach-alt .bd{padding:0 12px 12px}
details.ach-alt .bd p{font-size:.875rem;line-height:1.6;margin-bottom:8px}
details.ach-alt .bd p:last-child{margin-bottom:0}

/* ── 병용 판정 ── */
.ixline{display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;padding:12px 13px;border-radius:12px;
  text-align:left;cursor:pointer;font-size:.9375rem;line-height:1.55;border:1px solid}
.ixline>svg.i{flex:none}
.ixline>svg.i:last-child{margin-left:auto;opacity:.7}
.ixline span{flex:1;min-width:0}
.ixline.stop{background:var(--alert-tint);border-color:var(--alert);color:var(--alert)}
.ixline.warn{background:var(--caution-tint);border-color:var(--caution);color:var(--caution)}
.kind-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}
.kind{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:15px 14px;
  border-radius:var(--r-card);border:1px solid var(--hairline);background:var(--card);cursor:pointer;text-align:left;min-height:96px}
.kind .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--tint2);color:var(--primary)}
