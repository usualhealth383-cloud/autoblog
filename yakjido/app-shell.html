.ix-ask{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding:14px 15px;border-radius:var(--r-card);
  background:var(--card);border:1px solid var(--hairline)}
.ix-ask svg.i{color:var(--primary);flex:none;margin-top:2px}
.ix-ask b{font-size:.9375rem;font-weight:800}
.ix-ask p{font-size:.9375rem;line-height:1.6;color:var(--body);margin-top:4px}
.ix-ask p.small{font-size:.875rem;color:var(--muted)}
.ix-cta{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ix-cta .btn{justify-content:center;text-decoration:none}
details.ix-how{margin-top:16px;background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card)}
details.ix-how summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:13px 15px;font-size:.9375rem;font-weight:700;min-height:48px}
details.ix-how summary::-webkit-details-marker{display:none}
details.ix-how summary svg.i{color:var(--faint);transition:transform .2s}
details.ix-how[open] summary svg.i{transform:rotate(90deg)}
details.ix-how .bd{padding:0 15px 15px}
details.ix-how .bd p{font-size:.875rem;line-height:1.7;color:var(--body);margin-bottom:9px}
details.ix-how .bd p:last-child{margin-bottom:0}

.gauge{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;margin-top:10px}
.gauge .num{display:flex;align-items:baseline;gap:2px;font-variant-numeric:tabular-nums}
.gauge .num b{font-size:2.25rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.gauge .num small{font-size:.875rem;font-weight:700;color:var(--muted)}
.gauge .bar{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;height:14px}
.gauge .bar i{border-radius:4px;background:var(--tint2);opacity:.9}
.gauge .bar i.lo.on{background:var(--normal)} .gauge .bar i.mid.on{background:var(--caution)} .gauge .bar i.hi.on{background:var(--alert)}
.gauge .bar i{background:var(--card);border:1px solid var(--hairline)} .gauge .bar i.on{border-color:transparent}
.gauge .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:2px}
.gauge .lbl{grid-column:2;display:flex;justify-content:space-between;font-size:.875rem;font-weight:700;color:var(--muted)}
.gauge .lbl span:nth-child(2){transform:translateX(-10%)}
.ach-unk{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:10px 12px;border-radius:10px;
  background:var(--tint2);color:var(--body);font-size:.875rem;line-height:1.55}
.ach-unk svg.i{color:var(--faint);flex:none;margin-top:2px}
.ach-unk b{color:var(--ink)}
.ach-go{display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;padding:12px 13px;border-radius:10px;
  background:var(--tint2);border:1px solid var(--hairline);text-align:left;cursor:pointer;font-size:.9375rem;line-height:1.5;color:var(--body)}
.ach-go>svg.i{color:var(--primary);flex:none}
.ach-go>svg.i:last-child{margin-left:auto;color:var(--faint)}
.ach-go span{flex:1;min-width:0}
.ach-go b{color:var(--ink)}
.ach-risk{margin-top:10px;padding:12px 13px;border-radius:10px;background:var(--card);border:1px solid var(--hairline)}
.ach-risk>b{display:block;font-size:.9375rem;font-weight:800;margin-bottom:6px}
.ach-risk p{font-size:.875rem;line-height:1.65;color:var(--body);margin-bottom:6px}
.ach-risk p:last-child{margin-bottom:0}
.ach-risk p.small{color:var(--muted);font-size:.875rem}
.ach-ask{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:.9375rem;line-height:1.5;color:var(--body)}
.ach-ask svg.i{color:var(--primary);flex:none;margin-top:2px}

/* 약 상세 */
.drug-hero{display:flex;flex-direction:column;gap:6px}
.drug-hero .cls{font-size:.875rem;font-weight:600;color:var(--primary);display:inline-flex;align-items:center;min-height:32px}
.drug-hero h1{font-size:1.625rem}
.drug-hero .en{color:var(--muted);font-size:.9375rem;font-weight:500}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(9.5em,100%),1fr));gap:var(--s3);margin-top:var(--s4)}
.kv div{background:var(--tint2);border-radius:12px;padding:12px 14px}
.kv div small{display:block;font-size:.875rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.kv div b{display:block;font-size:.9375rem;font-weight:700;margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.dose-hero{background:var(--tint);border-radius:14px;padding:var(--s4);margin-top:var(--s4)}
.dose-hero .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:var(--primary-deep)}
.dose-hero small{display:block;color:var(--muted);font-size:.875rem;margin-top:2px}
.dose-hero .big.pc{font-size:2rem;line-height:1.2}
.dose-hero small.dl{font-size:1.0625rem;line-height:1.55;color:var(--body);margin-top:4px}
/* 3-3 — 대표 제품 한 줄 · 내 몸 한 줄 요약 */
.rep-line{display:flex;align-items:center;gap:6px;width:100%;min-height:48px;padding:4px 0;text-align:left;font-size:.9375rem;line-height:1.5;color:var(--body)}
.rep-line span{flex:1;min-width:0;overflow-wrap:anywhere} .rep-line b{color:var(--text)} .rep-line svg.i{color:var(--faint)}
.me-sum{border-color:var(--caution)} .me-sum.stop{border-color:var(--alert)}
.me-sum .eyebrow{color:var(--caution)} .me-sum.stop .eyebrow{color:var(--alert)}
.me-sum .note{margin-bottom:8px} .me-sum .note.me-stop{background:var(--alert-tint);color:var(--alert)}
.me-sum .me-more>summary{font-size:1rem;color:var(--caution)}
.risk-bars{display:flex;flex-direction:column;gap:10px;margin-top:var(--s3)}
.rb{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:10px;font-size:.875rem}
.rb .track,.rk .track{height:8px;border-radius:999px;background:var(--tint);overflow:hidden}
.rb .fill,.rk .fill{display:block;height:100%;border-radius:999px;background:var(--primary)}
.rb .fill.l3,.rk .fill.l3{background:var(--caution)} .rb .fill.l4,.rb .fill.l5,.rk .fill.l4,.rk .fill.l5{background:var(--alert)}
/* 3-5 순위 막대 — 성분 17 · 대표 제품 14 · 막대 10 · 낮음/중간/높음 */
.rk-list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.rk{display:grid;grid-template-columns:minmax(0,1fr) 30% 3.4em;align-items:center;gap:10px;min-height:48px;padding:3px 0;color:inherit;text-decoration:none;border-bottom:1px solid var(--hairline)}
.rk:last-child{border-bottom:0}
.rk b{display:block;font-size:1.0625rem;line-height:1.3;word-break:keep-all}
.rk small{display:block;font-size:.875rem;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .track{height:10px}
.rk .v{font-size:.9375rem;font-weight:700;text-align:right;word-break:keep-all}
.rk .v.na{grid-column:2/4;text-align:left;font-weight:500;color:var(--muted)}
/* 3-5 한 줄 행 — 성분 · 대표 제품 · 약국/처방 · › (펼치면 나머지 칸) */
.cmpr-list{padding:0 var(--s4);margin-top:var(--s3)}
details.cmpr{border-bottom:1px solid var(--hairline)} details.cmpr:last-child{border-bottom:0}
details.cmpr>summary{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 0;list-style:none;cursor:pointer}
details.cmpr>summary::-webkit-details-marker{display:none}
details.cmpr>summary .t{flex:1;min-width:0}
details.cmpr>summary b{display:block;font-size:1.0625rem;line-height:1.35;word-break:keep-all}
details.cmpr>summary small{display:block;font-size:.875rem;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
details.cmpr>summary svg.chev{color:var(--faint);transition:transform .2s} details.cmpr[open]>summary svg.chev{transform:rotate(90deg)}
details.cmpr>.bd{padding:0 0 14px}
details.cmpr dl{display:grid;gap:6px}
details.cmpr dl>div{display:grid;grid-template-columns:5.5em 1fr;gap:10px;align-items:baseline}
details.cmpr dt{color:var(--muted);font-size:.875rem;word-break:keep-all}
details.cmpr dd{font-size:1rem;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
details.cmpr .link{display:inline-flex;align-items:center;min-height:48px;margin-top:4px;font-weight:700}
.rb .v{text-align:right;color:var(--muted);font-weight:600}
.products{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
.prod{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:10px 12px;border:1px solid var(--hairline);border-radius:12px;font-size:.875rem}
.prod b{font-weight:700;overflow-wrap:anywhere}
.kv .lact.me{box-shadow:inset 3px 0 0 var(--caution)}
.kv .lact .badge{display:inline-flex;width:auto}
.pain-note{display:block;font-size:.875rem;color:var(--muted);margin-top:3px;line-height:1.45}
.pain-row{margin-top:4px}
/* 「알릴이소프로필아세틸우레아」처럼 긴 성분명 한 낱말이 사진 옆 좁은 칸을 넘었다(2026-10-06) */
.prod span{display:block;color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
/* 영양제 상세 — 질문 세 개(2026-10-07) */
.supp-role{margin:10px 0 0;font-size:1rem;line-height:1.65;color:var(--body)}
.who{margin-top:16px;display:flex;flex-direction:column;gap:8px}.who>b{font-size:.875rem;color:var(--muted)}.who small{font-size:.875rem;color:var(--muted);line-height:1.5}
.who-seg{display:flex;flex-wrap:wrap;gap:6px}.who-seg button{min-height:48px;padding:0 12px;border-radius:var(--r-pill);border:1.5px solid var(--hairline);background:var(--card);color:var(--body);font-size:.9375rem;font-weight:600}
.who-seg button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sq-h,.sec>h2.sq-h{display:flex;align-items:center;justify-content:flex-start;gap:8px;font-size:1.125rem}.qn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--primary-deep);display:grid;place-items:center;font-size:.875rem;font-weight:800}
.sq-sub{margin:2px 0 0;font-size:.875rem;color:var(--muted)}.sq-p{margin:10px 0 0;font-size:.9375rem;line-height:1.7;color:var(--body)}.sq-note{margin:12px 0 0;font-size:.875rem;line-height:1.65;color:var(--body)}
.sq-h3{font-size:.9375rem;margin:18px 0 0;color:var(--text)}
.fds{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.fd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.fd-t b{font-size:1rem}.fd-t span{display:block;font-size:.875rem;color:var(--muted)}
.fd-a{font-size:.875rem;color:var(--muted);white-space:nowrap}.fd-a b{font-size:1.25rem;color:var(--text);font-variant-numeric:tabular-nums}
.fd-bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--tint2);margin-top:4px}.fd-bar i{display:block;height:100%;border-radius:99px;background:var(--viz-1)}
.fd-c{grid-column:1/-1;font-size:.875rem;color:var(--body);line-height:1.5}
.vrow2{border-radius:12px;padding:12px 14px;margin-top:10px}.vrow2 b{font-size:.875rem}.vrow2 p{margin:4px 0 0;font-size:.9375rem;line-height:1.65}
.vrow2.yes{background:var(--normal-tint)}.vrow2.yes b{color:var(--normal)}.vrow2.no{background:var(--tint2)}.vrow2.no b{color:var(--muted)}
.dose2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(9.5em,100%),1fr));gap:10px;margin-top:12px}.dose2>div{background:var(--tint2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.dose2 small{font-size:.875rem;font-weight:700;color:var(--muted);line-height:1.4}.dose2 span{font-size:.875rem;color:var(--muted)}
.dn{font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}.dn i{font-style:normal;font-size:.875rem;font-weight:600;color:var(--muted);margin-left:3px}.dn.sm{font-size:.9375rem;line-height:1.5;margin-top:2px}
.pick-more{margin-top:16px}.pick-more .bd>.sec.card{box-shadow:none;border:1px solid var(--hairline);margin-top:12px}
/* 위 줄의 display:block 이 「바르는 약」 꼬리표를 칸 너비로 늘렸다 */
.prod span.ftag{display:inline-flex;font-size:.875rem}
.tabs{display:flex;gap:6px;margin:var(--s4) 0 var(--s3);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
/* 44 딱 맞추면 소수점 배치에서 43.9999 로 재져 손가락 기준에 걸렸다(2026-10-06) — 다른 단추처럼 46 */
.tab{flex:none;padding:9px 15px;border-radius:var(--r-pill);font-size:.9375rem;font-weight:600;color:var(--muted);background:var(--tint2);min-height:48px}
.tab.on{background:var(--text);color:var(--card)}
.pane{display:none}.pane.on{display:block}

/* 비교 차트 (코드로 그린 진짜 데이터) */
.pop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:var(--s3)}
.pop{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;background:var(--card);border:1px solid var(--hairline);border-radius:14px;text-align:left;box-shadow:var(--shadow-card)}
.pop-pic{position:relative;width:44px;height:44px;flex:none}
.pop-pic .pimg{width:44px;height:44px}
.pop-pic img{position:absolute;inset:0;width:44px;height:44px;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--hairline)}
.pop span{min-width:0}
.pop b{display:block;font-size:.9375rem;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.pop small{display:block;font-size:.875rem;color:var(--muted);line-height:1.35;margin-top:2px;word-break:keep-all}
/* 제품 머리(10-14 디자인 3-4) — 상자 사진 72 · 이름 24 · 성분 줄 · 이름표. 가족 고르기 칩 */
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-top:var(--s3);padding:14px;background:var(--card);border:1px solid var(--hairline);border-radius:14px}
.phead .pop-pic,.phead .pop-pic .pimg,.phead .pop-pic img{width:72px;height:72px;border-radius:12px}
.ph-b{flex:1 1 10em;min-width:0}
.ph-n{display:block;font-size:1.5rem;font-weight:800;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere;margin:0}
.ph-i{font-size:.9375rem;line-height:1.5;margin-top:6px;overflow-wrap:anywhere}
.ph-t{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ph-t .badge{font-size:.875rem;padding:3px 10px}
.phead>.ph-x{flex:1 1 100%;min-width:0;margin:0}
.fam .chip{flex-direction:column;align-items:flex-start;gap:0;text-align:left;min-height:52px}
.fam .chip small{font-size:.875rem;font-weight:500;color:var(--muted)}.fam .chip:not(.on){background:var(--card);border-color:var(--hairline)}.fam .chip.on{background:var(--tint);border-color:var(--primary)}
.gqpop{margin:-4px 0 var(--s4)}.gqpop .chip{min-height:48px}
table.cmp{width:100%;border-collapse:collapse;font-size:.875rem;margin-top:var(--s3)}
/* 3-17 — 좁은 화면에서 셋째 칸이 반쯤 잘린 채 밀 수 있다는 표시도 없었다 → 520px 미만은 성분마다 카드 */
.src-note{padding:0 var(--s4) 6px;border-bottom:1px solid var(--hairline)}.src-note>summary{display:flex;align-items:center;min-height:48px;font-size:.875rem;font-weight:600;color:var(--muted);cursor:pointer}
.src-note>p{font-size:.875rem;line-height:1.6;color:var(--muted);padding-bottom:8px;overflow-wrap:anywhere}
.cr-box{container-type:inline-size;margin-top:4px} .cr-w{display:none}
@container (min-width:600px){.cr-w{display:block}.cr-n{display:none}}
.cr{padding:12px 0;border-bottom:1px solid var(--hairline)} .cr-n>.cr:first-child{padding-top:0} .cr-n>.cr:last-child{border-bottom:0}
.cr h3{font-size:1.0625rem;font-weight:800;margin-bottom:6px}
.cr dl{display:grid;gap:6px} .cr dl>div{display:grid;grid-template-columns:minmax(4.5em,34%) minmax(0,1fr);gap:10px;align-items:baseline}
.cr dt{font-size:.9375rem;color:var(--muted);word-break:keep-all} .cr dd{margin:0;font-size:1.0625rem;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
table.cmp th{text-align:left;font-weight:700;color:var(--muted);font-size:.875rem;letter-spacing:.05em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--hairline)}
table.cmp td{padding:10px 6px;border-bottom:1px solid var(--hairline);vertical-align:top;line-height:1.45}
table.cmp td:first-child{font-weight:700;word-break:keep-all;min-width:6em}
.scroll-x{overflow-x:auto;margin:0 calc(-1 * var(--s4));padding:0 var(--s4)}

/* 영양제 비교 */


.ev{display:inline-flex;align-items:center;gap:5px;font-size:.875rem;font-weight:700;padding:3px 9px;border-radius:6px}
.ev.strong{background:var(--normal-tint);color:var(--normal)} .ev.mid{background:var(--caution-tint);color:var(--caution)} .ev.weak{background:var(--tint);color:var(--muted)}
.cmp-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;width:min(460px,100%);padding:0 var(--s4);z-index:5;pointer-events:none}
.cmp-bar>div{pointer-events:auto;background:var(--text);color:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.875rem}
.cmp-bar button{background:var(--card);color:var(--text);border-radius:9px;padding:8px 14px;font-weight:700;font-size:.875rem;min-height:36px}
.checkrow{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);min-height:52px}
.checkrow:last-child{border-bottom:0}
.checkrow input{width:20px;height:20px;accent-color:var(--primary);flex:none}
.checkrow label{flex:1;min-width:0;font-size:.9375rem;font-weight:600;overflow-wrap:anywhere}
.checkrow small{color:var(--muted);font-weight:500;display:block;font-size:.875rem}

/* 내 정보 */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);min-height:56px}
.toggle:last-child{border-bottom:0}
.toggle .t b{display:block;font-size:.9375rem;font-weight:600}
.toggle .t span{display:block;font-size:.875rem;color:var(--muted)}
/* 스위치 — 누르는 자리는 48×46(44px 이상), 보이는 막대는 가운데 28px.
   껐을 때 막대가 안 보이던 것(대비 1.29:1)을 테두리 3.4:1 로 고쳤다. */
.sw{position:relative;width:48px;height:46px;border-radius:999px;background:none;flex:none}
.sw::before{content:"";position:absolute;left:0;top:9px;width:48px;height:28px;border-radius:999px;background:var(--tint2);box-shadow:inset 0 0 0 2px var(--ui-line);transition:background .2s,box-shadow .2s}
.sw::after{content:"";position:absolute;z-index:1;top:12px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.14);transition:transform .2s}
.sw.on::before{background:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)} .sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--tint2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:48px;border-radius:9px;font-size:.9375rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--primary-deep);font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.10),inset 0 0 0 2px var(--primary)}
.privacy{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.875rem;margin-top:var(--s3)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 var(--s5);border-radius:12px;font-weight:700;font-size:.9375rem;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-raised);width:100%}
.btn.ghost{background:var(--tint);color:var(--primary-deep);box-shadow:none}
.btn.line{background:var(--card);color:var(--text);border:1.5px solid var(--ui-line);box-shadow:none}
.btn+.btn{margin-top:var(--s2)}
.actions{margin-top:var(--s4)}
.link{color:var(--primary);font-weight:600;text-decoration:none;display:inline-block;padding:2px 0;min-height:24px}
.link:hover{text-decoration:underline}

/* 탭바 */
nav.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hairline);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
body.no-nav nav.tabbar{display:none}
/* Z4 #27 — 11px → 13px 이상(글자 22px 에서도 한 줄) */
nav.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 0;font-size:max(14px,min(.875rem,17px));line-height:1.2;white-space:nowrap;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabbar button.on{color:var(--primary)}
nav.tabbar button svg.i{width:22px;height:22px}
nav.tabbar button.on svg.i{stroke-width:2.2}
/* 10-14 넓은 화면(현욱님 「PC버전/모바일버전」) — 폰은 그대로 · 600~1023 가운데 넓게 · 1024~ 왼쪽 메뉴, 본문 912, 글줄 46em */
nav.tabbar .pc{display:none}
@media (min-width:600px){.app{max-width:720px}nav.tabbar,.cmp-bar{width:min(720px,100%)}main{padding-inline:var(--s5)}}
@media (min-width:1024px){body{padding-left:248px}body.no-nav{padding-left:0}.app{max-width:none;box-shadow:none}
main{width:100%;max-width:1008px;margin:0 auto;padding:var(--s6) var(--s7) var(--s7)}
nav.tabbar{top:0;left:0;transform:none;width:248px;flex-direction:column;gap:4px;padding:20px 14px;border:0;border-right:1px solid var(--hairline);background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
nav.tabbar button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 14px;font-size:1rem}
nav.tabbar button.on{background:var(--tint);color:var(--primary-deep)}nav.tabbar .pc{display:flex}
nav.tabbar .nav-acct{margin-top:auto;border:1px solid var(--hairline)}
.top .brand{display:none}.top{justify-content:flex-end}.top:has(.back){justify-content:space-between}
body .cmp-bar,body .toast{left:calc(50% + 124px)}body .toast{bottom:40px}.cmp-bar{bottom:24px}body.no-nav .toast{left:50%}
#view p,#view li{max-width:46em}#view p[style*="text-align:center"]{margin-left:auto;margin-right:auto}
.rows-l,#view>div:has(>.srow){display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.rows-l>.srow,#view>div>.srow{margin:0}#view>div:has(>.srow)>:not(.srow){grid-column:1/-1}}

/* 검색 결과 */
.results{margin-top:var(--s3)}
.hit{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);text-align:left;width:100%;min-height:56px}
.hit:last-child{border-bottom:0}
.hit .k{font-size:.875rem;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--tint);color:var(--primary-deep);flex:none;min-width:44px;text-align:center}
.hit .k.s{background:var(--accent-tint);color:var(--accent-text)} .hit .k.p{background:var(--tint2);color:var(--muted)}
.hit b{display:block;font-size:.9375rem;overflow-wrap:anywhere}
.hit span{display:block;font-size:.875rem;color:var(--muted)}
.hit mark{background:none;color:var(--primary);font-weight:800}
.empty{padding:var(--s6) var(--s4);text-align:center;color:var(--muted);font-size:.9375rem}
.empty b{display:block;color:var(--text);margin-bottom:6px}

/* 낱알 찾기·식약처 제품 */
.pillimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--tint2);border:1px solid var(--hairline);flex:none}
.pillwrap{position:relative;width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--tint2);border:1px solid var(--hairline)}.pillwrap .pillimg{position:absolute;inset:-1px;width:64px;height:64px}
.pillimg.big{width:100%;height:auto;max-height:220px;object-fit:contain;background:#fff;margin-top:var(--s3)}
.pub-hero{display:flex;gap:var(--s3);align-items:center}.pub-hero h1{overflow-wrap:anywhere}
.qa h3,.qa h2.qa-h{margin-top:var(--s4);font-size:.9375rem;color:var(--primary-deep)}
.qa>h2.qa-h:first-child,.qa>h3:first-child{margin-top:0}
.qa p{white-space:pre-line;font-size:.9375rem;line-height:1.7;margin-top:4px;overflow-wrap:anywhere;word-break:normal}






.swatch.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.loading{padding:var(--s5);text-align:center;color:var(--muted);font-size:.875rem}
/* 약 알아보기(사진·식별) */
.big-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:18px;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-raised);min-height:76px}
.big-btn .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.big-btn .ic svg.i{width:26px;height:26px;stroke:var(--on-primary)}
.big-btn b{display:block;font-size:1.125rem;line-height:1.3}
.big-btn span{display:block;font-size:.875rem;opacity:.9;margin-top:2px}
.big-btn.soft{background:var(--card);color:var(--text);border:1px solid var(--hairline);box-shadow:var(--shadow-card)}
.big-btn.soft .ic{background:var(--tint)} .big-btn.soft .ic svg.i{stroke:var(--primary)}
.big-btn+.big-btn{margin-top:10px}
.shape-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.shape-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--card);border:1px solid var(--hairline);font-size:.875rem;font-weight:700;min-height:64px}
.shape-btn svg{width:28px;height:28px;stroke:var(--text);stroke-width:1.8;fill:var(--tint2)}
.shape-btn.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.color-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;background:var(--card);border:1px solid var(--hairline);font-size:.7rem;font-weight:700;min-height:64px}
.color-btn i{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.color-btn.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.pill-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--s3)}
.pill-cw{display:flex;flex-direction:column;gap:6px;min-width:0}.pill-cw .pill-card{flex:1}
.pc-take{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 8px;border-radius:12px;border:1px solid var(--primary);background:var(--card);color:var(--primary-deep);font:inherit;font-size:.875rem;font-weight:700;text-align:center}
.pc-take.on{background:var(--tint);border-color:var(--hairline)}
.pill-card{background:var(--card);border:1px solid var(--hairline);border-radius:14px;overflow:hidden;text-align:left;box-shadow:var(--shadow-card);display:flex;flex-direction:column}
.pill-card .ph{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;border-bottom:1px solid var(--hairline);position:relative}
.pill-card .ph img{width:100%;height:100%;object-fit:contain}
.pill-card .ph .pglyph,.pglyph{width:100%;height:100%;display:block;padding:6px}
.pill-card .ph .ph-empty{color:var(--faint);font-size:.875rem}
.pill-card .ph .sc{position:absolute;top:6px;left:6px;font-size:.875rem;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--primary);color:var(--on-primary)}
.pill-card .bd{padding:10px 12px 12px}
.pill-card b{display:block;font-size:.875rem;line-height:1.3;overflow-wrap:anywhere}
.pill-card .imp{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pill-card .imp span{font-size:.875rem;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--tint2);border:1px solid var(--hairline);font-family:ui-monospace,monospace;letter-spacing:.03em}
.pill-card small{display:block;color:var(--muted);font-size:.875rem;margin-top:4px}
.pill-hero{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:start}
.pill-hero>div{min-width:0;overflow-wrap:anywhere}
/* 사진 칸은 어두운 화면에서도 흰 바탕 — 「사진 없음」 글씨가 2.5:1 이었다 */
.pill-hero .ph .muted{color:#5B6770}
.pill-hero .ph{width:120px;height:120px;border-radius:14px;background:#fff;border:1px solid var(--hairline);display:grid;place-items:center;overflow:hidden}
.pill-hero .ph img{width:100%;height:100%;object-fit:contain}

.kv3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:var(--s3)}
.kv3 div{background:var(--tint2);border-radius:10px;padding:8px 10px}
.kv3 small{display:block;font-size:.875rem;font-weight:700;color:var(--muted)} .kv3 b{display:block;font-size:.9375rem;margin-top:1px;overflow-wrap:anywhere}
.photo-box{border:2px dashed var(--hairline);border-radius:18px;padding:var(--s5) var(--s4);text-align:center;background:var(--card)}
.photo-box img{max-width:100%;max-height:260px;border-radius:12px;margin-top:10px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--hairline);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.found{background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:12px 14px;margin-top:10px}
.found b{font-size:1rem}
.found .m{font-size:.875rem;color:var(--muted);margin-top:2px}
.found .simple{margin-top:8px;font-weight:700;line-height:1.5}
.found .chips{margin-top:8px}
/* 어르신 모드 홈 */
.easy-home .big-btn{min-height:96px}
.easy-home .big-btn b{font-size:1.375rem}
/* 삽화 — art/ 폴더에 파일이 있을 때만 렌더된다(없으면 빌드가 아예 넣지 않음) */
.art{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden;margin:var(--s4) 0 0;line-height:0}
.art img{display:block;width:100%;height:auto}
/* 원본 비율 그대로 — 원형 비네트가 잘리지 않게 crop 하지 않는다 */
.art.spot{max-width:200px;margin-left:auto;margin-right:auto;border-radius:50%;border:0;background:none}
.art.side{width:88px;height:88px;flex:none;border-radius:50%;border:0;background:none;margin:0}
.art.side img{width:88px;height:88px;object-fit:cover}


.art-row .t{flex:1;min-width:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .art img{filter:brightness(.88) saturate(.95)}}
:root[data-theme="dark"] .art img{filter:brightness(.88) saturate(.95)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .art{background:var(--card)}}
:root[data-theme="dark"] .art{background:var(--card)}
/* 답 카드 — 상품명이 주인공 */
.buy-item{grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px}
.buy-item.has-img{grid-template-columns:44px 44px 1fr auto}
.buy-item .k{font-size:.875rem;padding:5px 0;align-self:center}
.buy-item .bi-t{min-width:0}
.buy-item .bi-t b{font-size:1.0625rem;font-weight:700;line-height:1.3;display:block;overflow-wrap:anywhere}
.buy-item .bi-t small{display:block;color:var(--muted);font-size:.875rem;margin-top:2px;overflow-wrap:anywhere}
.buy-item .bi-t small.opt-t{color:var(--caution);font-weight:700}
.buy-item .bi-t small.cau,.show-list small.cau{display:flex;gap:6px;align-items:flex-start;color:var(--caution);font-weight:600;margin-top:4px}.cau svg.i{flex:none;width:16px;height:16px;margin-top:2px}
.show-sw{min-height:48px;margin-top:6px;padding:0 14px;border-radius:999px;border:1.5px solid var(--primary);background:var(--card);color:var(--primary-deep);font:inherit;font-size:.875rem;font-weight:700;cursor:pointer;max-width:100%;text-align:left}
.med-tip{margin-top:10px}.cau-l{display:flex;gap:6px;align-items:flex-start;color:var(--caution);font-weight:600;margin-top:8px}.cau-l svg.i{flex:none;width:16px;height:16px;margin-top:3px}
.buy-item .bi-r{display:flex;align-items:center;gap:4px}
.buy-item .bi-r svg.i{color:var(--faint);width:18px;height:18px;transition:transform .2s}
.buy-item.open .bi-r svg.i{transform:rotate(90deg)}
.buy-item .badge.stop,.buy-item .badge.warn{margin-top:4px;display:inline-flex}
.buy-item.do{cursor:default;background:var(--tint2)}
.buy-item.do .bi-r{opacity:.85}
/* 병원 가야 할 때 — 한 줄, 자세히는 눌러서 */
.gate{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--alert-tint);min-height:52px}
.gate .lb{font-weight:800;color:var(--alert);font-size:.875rem;flex:none}
.gate .tx{flex:1;font-size:.9375rem;line-height:1.45;color:var(--text)}
.gate svg.i{color:var(--alert);flex:none}


.bag-line.on{border-style:solid;border-color:var(--normal);background:var(--normal-tint);color:var(--normal)}
.bag-line.sm{margin-top:10px;min-height:48px;font-size:.875rem;background:var(--tint2);border-color:transparent;color:var(--muted)}


.bag-line svg.i{flex:none}




.mixline svg.i{flex:none}


/* 약국에서 보여드리기 */
.show-card{background:var(--card);border:1.5px solid var(--primary);border-radius:20px;padding:var(--s4);margin-top:var(--s4);box-shadow:0 10px 30px rgba(var(--primary-rgb),.12)}
.show-head{font-size:.875rem;font-weight:800;color:var(--primary);letter-spacing:.02em;padding-bottom:10px;border-bottom:1px dashed var(--hairline)}
.show-list{list-style:none;margin-top:6px}
.show-list li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hairline)}
.show-list li:last-child{border-bottom:0}
.show-list li>div{flex:1;min-width:0}
.show-list .n{width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:.875rem;flex:none}
.show-list b{display:block;font-size:1.25rem;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.show-list small{display:block;color:var(--muted);font-size:.875rem;margin-top:2px}
.show-head .show-mine{display:block;margin-top:4px;font-weight:600;color:var(--text);letter-spacing:0}
.show-list li.show-have b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.show-list li.show-have .n{background:var(--tint2);color:var(--muted)}
.show-ask{margin-top:12px;padding-top:12px;border-top:1px dashed var(--hairline);font-size:1rem;font-weight:600;color:var(--body);line-height:1.6}
.show-ach{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--caution-tint);color:var(--caution);font-size:.9375rem;font-weight:600;line-height:1.5}
.show-card.tone-stop{border-color:var(--alert)} .show-card.tone-warn{border-color:var(--caution)}
.show-big{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:12px 14px;border-radius:12px;font-size:1.125rem;font-weight:800;line-height:1.4}
.show-big>span{flex:1;min-width:0} .show-big small{display:block;font-size:.875rem;font-weight:600;margin-top:3px;opacity:.9;line-height:1.45}
.show-big svg.i{flex:none;margin-top:3px} .show-big em.org{font-style:normal;font-size:.875rem;font-weight:800;padding:2px 7px;border-radius:6px;border:1px solid currentColor;vertical-align:2px;margin-right:2px}
.show-big.stop{background:var(--alert-tint);color:var(--alert)} .show-big.warn{background:var(--caution-tint);color:var(--caution)}
.show-big.ok{background:var(--tint);color:var(--primary-deep)} .show-big.info{background:var(--tint2);color:var(--body)}
/* 약 상세 차례 줄 — 탭이 첫 화면 아래에 있어 있는 줄 모른다 */
.jump{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.jump button{display:flex;align-items:center;justify-content:center;gap:2px;min-height:48px;padding:6px 4px;border-radius:12px;background:var(--tint2);color:var(--body);font-size:.875rem;font-weight:700;line-height:1.25}
.jump button svg.i{width:12px;height:12px;color:var(--faint);flex:none}
/* 화면 이동 뒤 제목에 옮긴 초점 — 화면낭독기용이라 눈에 보이는 테두리는 뺀다(키보드 탭으로 온 초점은 아니다) */
#view h1[tabindex="-1"]:focus{outline:none;box-shadow:none}
/* 종이로 뽑기 — 한 장 화면은 카드만, 나머지는 숨긴다 */
/* 종이에 찍히면 안 되는 것 — 누를 수 없는 단추와 상단 바.
   「메모로 복사·전송」·「종이로 뽑기」·「자세한 판정 보기」가 그대로 찍히고 있었다. */
#printhead{display:none}
@media print{#printhead{display:block;margin:0 0 14px;padding:0 0 10px;border-bottom:2px solid #333}
#printhead b{display:block;font-size:15pt;font-weight:800}
#printhead span{display:block;font-size:9.5pt;color:#444;margin-top:3px;line-height:1.5}
nav.tabbar,.top,.topfind,.actions,.disclaimer,.netbar,#cmpbar,.eyebrow,.back,.speak,.tabs,.quick,.today-row,.memo-actions,.search,.acc>summary svg,.more-btn,.act,.tog-cta,.btn{display:none!important}details.acc,details.why-more,details.pub-more,details.fold{display:block!important}details[open]>.bd,details>.bd{display:block!important}.app,#view{max-width:none;padding:0}.show-card{box-shadow:none;border:1.5px solid #333;break-inside:avoid;page-break-inside:avoid}.show-big{border:1px solid #999}body{background:#fff;color:#000}h1{font-size:18pt}
/* 진료실에 내미는 종이 — 적는 칸과 안내는 빼고, «적어 두신 내용»만 남긴다 */
.ae-form,.ae-x,.cal-key{display:none!important}details.ae-why{display:none!important}
.ae-list li{background:none;border:1px solid #999;border-radius:0}}
/* 내 약통 줄 — 며칠만 토글 + 빼기 */
.bag-rows{margin-top:var(--s3)}
.bag-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--hairline)} .bag-row:last-child{border-bottom:0}
.bag-row .t{flex:1;min-width:0} .bag-row .t b{display:block;font-size:1rem;line-height:1.35;overflow-wrap:anywhere} .bag-row .t span{display:block;font-size:.875rem;color:var(--muted);margin-top:2px;line-height:1.4}
.bag-row .dur{display:inline-flex;align-items:center;gap:4px;min-height:48px;padding:0 12px;border-radius:var(--r-pill);background:var(--tint2);color:var(--muted);font-size:.875rem;font-weight:700;border:1px solid transparent;flex:none}
.bag-row .dur.on{background:var(--card);border-color:var(--primary);color:var(--primary-deep)} .bag-row .dur svg.i{width:13px;height:13px}
.bag-row .rm{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--tint);color:var(--muted);flex:none}
.show-ach svg.i{flex:none;margin-top:2px}
/* 권한 약 판정 카드 */
.vd{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);padding:var(--s4);box-shadow:var(--shadow-card)}

/* 항콜린 게이지 — 0~12 눈금. 0~2 낮음 · 3~5 살펴볼 것 · 6+ 높음 (KABS 기준 3점 이상이 높음) */
function achGauge(n){
  const cap = Math.min(n, 12);
  const cells = Array.from({ length: 12 }, (_, i) => { const v = i + 1; const band = v <= 2 ? 'lo' : v <= 5 ? 'mid' : 'hi'; return `<i class="${band} ${v <= cap ? 'on' : ''}"></i>`; }).join('');
  return `<div class="gauge" role="img" aria-label="항콜린 부담 ${n}점, 12점 만점 눈금"><div class="num"><b>${n > 12 ? '12+' : n}</b><small>점</small></div><div class="bar">${cells}<span class="mk" style="left:calc(${(cap / 12) * 100}% - 1px)"></span></div><div class="lbl"><span>낮음</span><span>살펴볼 것</span><span>높음</span></div></div>`;
}

/* 증상 화면용 한 줄 — 이번에 사려는 약이 처방약과 부딪히는지 그 자리에서 알린다 */
function ixLine(extra){
  if (!takingItems().length) return '';
  const res = ixRun(extra);
  /* 추천 약이 한쪽 자리에 들어간 것만 — 내 약통끼리의 문제는 병용 화면에서 따로 본다 */
  /* 내 약통 「과」 지금 보는 약 사이에 걸친 것만. 추천끼리의 겹침은 위쪽 planDup 이 더 정확히 말한다
     — 여기에 같이 태우면 「이 중 하나만」인 두 자리가 서로를 고발한다 */
  const now = res.hits.filter(h => h.r.lv !== 'info' && h.items.some(i => i.from === '지금 보는 약') && h.items.some(i => i.from === '내 약통'));
  /* 추천 안에서 성분이 겹치는 것은 위쪽 '사시기 전에 확인할 것'이 이미 말한다.
     여기서는 내 약통과 이번 추천 사이에 걸친 것만 — 모르고 두 배로 드시게 되는 자리다 */
  const dup = res.dupe.filter(d => d.items.some(i => i.from === '지금 보는 약') && d.items.some(i => i.from === '내 약통'));
  if (!now.length && !dup.length) return '';
  const spans = h => h.items.some(i => i.from === '내 약통') && h.items.some(i => i.from === '지금 보는 약');
  /* 「내 약통 × 지금 보는 약」이 먼저다.
     화면 안 선택지끼리의 겹침은 「하나만 고르면」 풀리지만, 내가 이미 드시는 약과의 충돌은 고를 수가 없다.
     경고가 많아지면 요약 한 줄로 접히는데, 그때 개인 경고가 묻히던 문제를 막는다. */
  const worst = now.find(h => h.r.lv === 'stop' && spans(h)) || now.find(spans)
             || now.find(h => h.r.lv === 'stop') || now[0];
  const lv = dup.length || (worst && worst.r.lv === 'stop') ? 'stop' : 'warn';
  const t = dup.length ? `${dup[0].e?.n || ''} — 지금 드시는 약에 이미 들어 있어요` : worst.r.t;
  const more = now.length + dup.length - 1;
  return `<button class="ixline ${lv}" onclick="go('/together')">${I.alert}<span>${lv === 'stop' ? '사시기 전에 꼭 보세요' : '지금 드시는 약과' } — <b>${esc(t)}</b>${more > 0 ? ` 외 ${more}가지` : ''}</span>${I.chev}</button>`;
}

/* 읽어 주기 — 기기에 내장된 음성(Web Speech). 어디로도 보내지 않는다. 핵심 세 줄만 */

   기기에 한국어 음성이 없으면 읽지 않고 그렇다고 말씀드린다(엉뚱한 발음으로 읽느니 낫다). */
function speakNow(text, btn){
  const t = String(text || '').trim(); if (!t) return;
  const done = () => { SPEAKING = null; document.querySelectorAll('.speak.on').forEach(b => b.classList.remove('on')); };
  let voices = []; try { voices = speechSynthesis.getVoices() || []; } catch (e) {}
  if (voices.length && !voices.some(v => (v.lang || '').toLowerCase().startsWith('ko'))) {
    toast('이 기기에 한국어 음성이 없어요 — 기기 설정에서 한국어 음성을 받으시면 읽어 드릴 수 있어요');
    return;
  }
  const u = new SpeechSynthesisUtterance(t.slice(0, 1200)); u.lang = 'ko-KR'; u.rate = 0.92;
  u.onend = done;
  u.onerror = () => { done(); toast('읽어 주기가 안 됐어요. 기기 소리와 한국어 음성을 확인해 주세요'); };
  SPEAKING = u; btn?.classList.add('on');
  try { speechSynthesis.speak(u); } catch (e) { done(); toast('읽어 주기가 안 됐어요'); }
}
function speakAnswer(sid, btn){

  /* 4차 #1 — 응급 신호에 체크했으면 약 이름·먹는 법을 읽지 않는다. 아니어도 내 몸 조건에 걸린 약의 먹는 법은 뺀다 */
  if (RF.sid === sid && RF.er.size) { speakNow(`${s.name}. 응급 신호에 체크하셨어요. 약을 먹고 기다리지 말고 119에 전화하거나 응급실로 가세요.`, btn); return; }
  const bk = basket(s), ban = tipBan(s);
  const buy = bk.map(x => `${x.slot}, ${prodName(x.product) || ingrName(x.d)}${x.optional ? ', 도움이 될 수 있어요' : ''}`).join('. ');
  const how = (banList(s.how, ban) || []).slice(0, 2).map(t => String(t).replace(/\*\*/g, '')).join(' ');

  const t3 = s.triage || {};

  /* 살 약이 없는 증상은 「이렇게 사시면 돼요」 라고 읽으면 안 된다 */
  const text = buy
    ? `${s.name}. 이렇게 사시면 돼요. ${buy}. ${how} ${care ? '병원은, ' + care : ''}`

}

   화면마다 「무엇을 읽을지」만 넘겨 주면 같은 방식으로 읽는다. */
function speakText(text, btn){
  if (!('speechSynthesis' in window)) { toast('이 기기는 읽어 주기를 지원하지 않아요'); return; }

}

    /* 이부프로펜 시럽 설명서는 2026-03 통일조정으로 «나이별» 1회·1일 최대가 정해졌다(식약처).
       계산식(몸무게 기준)은 그대로 두고 설명서 칸을 나란히 보인다 — 계산이 설명서보다 많으면 그렇다고 말한다. */
    if (k === 'ibu' && m != null) { const row = ibuRow(m);

        if (over) overLine = `<div class="kid-over">${I.alert}<span>설명서 표(${row[2]} 1회 ${row[3]}~${row[4]} mL · 하루 ${row[5]} mL)보다 많아요 — 먹이기 전에 약사·의사와 확인하세요.</span></div>`; }
      else if (m < 12) rev = `<p class="kid-rev">최근 개정(2026년 3월 약병 설명서): 용량표는 만 1세부터 — 그보다 어린 아기는 진료에서 확인</p>`; }
    /* Z4 #2 — 생년월일이 없으면 나이를 몰라 비교할 수 없다 — 설명서 표 전체를 펼쳐 둔다 */

      <p class="small muted" style="margin-top:6px">${(() => { const dm = mlTxt(r.day / conc.mgPerMl), mg = Math.round(dm * conc.mgPerMl).toLocaleString();
        /* #32 — 어른 하루 상한에 걸리면 «몸무게 × mg/kg» 등식처럼 쓰지 않고 실제로 적용한 상한을 말한다 */
        return r.rawDay > r.capDay + .5 ? `몸무게 계산값은 하루 ${r.rawDay.toLocaleString()} mg이지만, 성인 상한을 적용해 하루 최대 ${mg} mg(${dm} mL)까지만 표시했어요` : `하루 최대 ${dm} mL(${mg} mg)는 <b>몸무게 ${w} kg × ${r.perKgDay} mg/kg</b> 기준이에요`; })()}${k === 'apap' ? ` · 하루 ${D.maxPerDay}번까지` : ''}.</p>
      ${label}
      <p class="small muted" style="margin-top:8px">${esc(D.note)}</p>
      ${fold('계산 근거', `${r.capped ? `<div class="note" style="margin-top:8px">${I.info}<span>몸무게로만 곱하면 1회 ${r.rawHi} mg·하루 ${r.rawDay} mg이지만, 어른 상한(1회 ${D.capDose}·하루 ${D.capDay} mg)에서 멈춰요.</span></div>` : ''}
${k === 'apap' && m != null && m < 24 ? `<p class="small muted" style="margin-top:8px">두 돌 전이라 하루 한도를 60 mg/kg으로 봤어요(그 뒤 75 mg/kg).</p>` : ''}`)}
      ${rev}
      <a class="link small" href="#/drug/${D.drugId}">성분 자세히 ›</a></div>`; };
  /* 현욱님 10-13(Z2-2 → B) — 생년월일이 없고 6 kg 미만이면 결과 위에 「생후 3개월 안팎일 수 있어요」(접지 않음). 결과는 그대로 보인다 */
  return `${topBar({ back:'홈' })}

  <p class="small muted" style="margin-top:6px">아이 용량 계산 · 내 약통과 내 나이 설정은 바뀌지 않아요</p>
  ${leadHtml(K.lead, 'margin-top:8px')}
  <section class="sec card">
    <h2>${c.name ? esc(c.name) + ' ' : ''}아이 정보 ${m != null ? `<small>${esc(kidAgeText(m))}${w ? ' · ' + w + ' kg' : ''}</small>` : ''}</h2>
    <div class="kid-form"><label>이름(선택)<input id="k-name" value="${esc(c.name || '')}" placeholder="예: 서아"></label><label>생년월일<input id="k-birth" type="date" max="${todayKey()}" value="${esc(c.birth || '')}"${bad ? ' aria-invalid="true" aria-describedby="k-err"' : ''}></label><label class="full">몸무게 (kg) — 해열제 양은 몸무게로 계산하고, 먹여도 되는 나이인지도 함께 확인해요<input id="k-w" type="number" inputmode="decimal" step="0.1" min="2" max="120" value="${c.weight || ''}" placeholder="예: 12.4"${bad ? ' aria-invalid="true" aria-describedby="k-err"' : ''}></label></div>
    ${bad ? `<p id="k-err" class="kid-over" role="alert">${I.alert}<span>생년월일이나 몸무게를 다시 확인해 주세요. 생년월일은 오늘까지, 몸무게는 2~120 kg으로 넣어 주세요.</span></p>` : ''}
    <div class="actions" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="flex:1 1 140px;min-width:0" onclick="saveKid()">${I.check} 계산하기</button><button class="btn line" style="flex:1 1 140px;min-width:0" onclick="kidImport()">${I.user} ${esc(K.import?.title || '우리집 소아과에서 가져오기')}</button></div>
    <p class="small muted" style="margin-top:10px">${esc(K.import?.text || '')}</p>
    <p class="privacy">${I.lock}${savedWhere()}</p>
  </section>

  ${m == null && w > 0 ? `<div class="note" style="margin-top:16px">${I.info}<span><b>아이 생년월일을 넣어 주세요.</b> 그래야 <b>3개월 미만 발열</b>(해열제보다 진료가 먼저)과 약마다 <b>쓸 수 있는 개월 수</b>까지 함께 봐 드려요.</span></div>` : ''}
  ${m != null && m < 3 ? `<div class="flag" style="margin-top:16px">${I.alert}<div><b>생후 ${m}개월이에요</b><p>3개월 미만 아기가 열이 나면 해열제를 먹이지 말고 <b>바로 진료</b>를 받으세요. 열을 낮추면 원인을 찾기 어려워져요.</p><a class="call" href="tel:119">${I.alert} 119</a></div></div>` : ''}
  ${w > 0 ? `<section class="sec"><h2>한 번에 이만큼 <small>몸무게 ${w} kg 기준</small></h2>${m == null && w < 6 ? `<div class="kid-over kid-young" role="note">${I.alert}<span>생후 3개월 안팎일 수 있어요 — 생년월일을 넣어 주세요. 생후 3개월 미만 아기의 열은 해열제보다 진료가 먼저예요.</span></div>` : ''}${doseCard('apap')}${doseCard('ibu')}<div class="note" style="margin-top:12px">${I.info}<span>${esc(K.dexibuNote || '')}</span></div></section>` : `<section class="sec"><div class="empty"><b>몸무게를 넣으면 바로 계산해 드려요</b>아세트아미노펜·이부프로펜 시럽 mL, 간격, 하루 한도까지.</div></section>`}
  ${acc('이렇게 먹이세요', list(K.rules, 'steps'), '교차·중복·계량', true)}
  <section class="sec"><h2>병원에 가야 할 때</h2>${careCards({ clinic: K.care?.clinic, er: K.care?.er }, true)}</section>

/* ───────── 알아두면 좋은 것(건강정보) ───────── */
function vTips(_, q){
  const T = D.tips || [];
  const TG = ['약 이름과 고르기', '제대로 드시는 법', '조심할 것', '열·감기·배탈일 때', '보관하고 버리기', '병원·헌혈 가실 때'];
  const card = t => `<details class="xc faq" id="tip-${t.id}" ${q.open === t.id ? 'open' : ''}><summary><div class="ic">${icon(t.icon)}</div><b>${esc(t.title)}</b><span class="pv">${esc(t.body.replace(/\*\*/g, '').slice(0, 44))}…</span><span class="cnt">읽기${I.chev}</span></summary><div class="bd"><p class="tip-body">${fmt(t.body)}</p><div class="actions" style="margin-top:2px">${speakBtn(`(D.tips.find(x=>x.id==='${t.id}')||{}).body`, t.title + ' 읽어 주기')}</div>${srcChips(t.src, true)}${t.link ? `<div class="actions"><a class="btn ghost" href="#${t.link}">${I.chev} ${esc(t.linkText || '관련 화면 보기')}</a></div>` : ''}</div></details>`;
  const groups = TG.map(g => [g, T.filter(t => t.group === g)]).filter(([, xs]) => xs.length);
  const rest = T.filter(t => !TG.includes(t.group));
  return `${topBar({ back:'홈' })}<div class="eyebrow">약 상식</div><h1>알아두면 좋은 것</h1><p style="margin-top:6px">약국에서 약을 고르기 전에 알면 안전이 달라지는 것들이에요. 짧게, 하나씩. 모두 ${T.length}꼭지.</p>
  ${(() => { const today = T[new Date().getDate() % T.length]; return `<div class="rows-l" style="margin-top:14px">
    ${lrow(icon(today.icon), `오늘의 한 장 — ${esc(today.title)}`, `${esc(today.body.replace(/\*\*/g, '').slice(0, 60))}…`, `go('/tips?open=${today.id}')`)}
    ${lrow(I.scale, '그런 줄 알았는데', '「숙취해소제가 듣는다」 「철분은 비타민 C와」 — 자료를 찾아보면 달랐던 것들', "go('/myths')")}</div>`; })()}
  ${(() => {
    /* 2026-09-29 — 갈래 여섯을 모두 펼치면 폰 6장이었다. ClinicScore 처럼 탭, 고른 갈래만 */
    const G = [...groups, ...(rest.length ? [['그 밖에', rest]] : [])];
    const oi = q.open ? G.findIndex(([, xs]) => xs.some(t => t.id === q.open)) : -1;
    const k = oi >= 0 ? oi : Math.max(0, Math.min(G.length - 1, +(q.g || 0) || 0)), [g, xs] = G[k];
    return `<nav class="tabs" role="tablist" aria-label="갈래" style="margin-top:20px">${G.map(([gn, L], i) => `<button class="tab ${i === k ? 'on' : ''}" role="tab" aria-selected="${i === k}" onclick="go('/tips?g=${i}')">${esc(gn)}<span class="n">${L.length}</span></button>`).join('')}</nav>

    <div class="explore">${xs.map(card).join('')}</div>`; })()}
  ${disclaimer()}`;
}

/* ───────── 병원에서 내는 묶음 ─────────
   현욱님: 「성분 역할로 하고 클릭하면 제품명을 볼 수 있게 하자」(2026-09-21).
   성분과 역할을 앞에 두고, 실제 제품 이름은 누를 때 식약처 자료에서 찾아 보여 준다.
   제품 목록을 글로 박아 두면 낡는다 — 낱알 자료에서 그때그때 찾는다. */
/* 성분 → 제품 이름 몇 개 (한 번 찾으면 담아 둔다) */
const RXP = {};
async function rxProducts(ing){
  if (RXP[ing]) return RXP[ing];
  const pool = [];
  try { (await pubPillsRx()).forEach(r => pool.push(r)); } catch (e) {}
  try { (await pubIndex()).forEach(r => pool.push({ n: r.n, m: r.m, ingr: (r.i || []).join(' '), seq: r.seq, rx: 0 })); } catch (e) {}
  const hit = pool.filter(r => (r.ingr || '').includes(ing));
  hit.sort((a, b) => a.n.length - b.n.length);
  const seen = new Set(), out = [];
  for (const r of hit) {
    const base = r.n.split('(')[0].replace(/정.*$|캡슐.*$|서방.*$/, '');
    if (seen.has(base)) continue;
    seen.add(base); out.push(r);
    if (out.length >= 6) break;
  }
  RXP[ing] = { list: out, total: hit.length };
  return RXP[ing];
}
function rxOpen(i, ing){
  const box = document.getElementById('rxp' + i); if (!box) return;
  const row = box.closest('.rxc-row'); const on = row.classList.toggle('open');
  if (!on) return;
  if (box.dataset.done) return;
  box.innerHTML = '<p class="loading">제품 이름을 찾는 중…</p>';
  rxProducts(ing).then(r => {
    box.dataset.done = '1';
    box.innerHTML = r.list.length
      ? `<div class="rxc-names">${r.list.map(x => `<button class="rxc-name" onclick="event.stopPropagation();go('/pillinfo/${esc(x.seq)}')"><b>${esc(x.n.split('(')[0])}</b><small>${esc(x.m || '')}</small></button>`).join('')}</div>
         <p class="small muted" style="margin-top:8px">${r.total > r.list.length ? `식약처에 등록된 <b>${r.total}가지</b> 가운데 몇 개예요. ` : '식약처에 등록된 것은 이것뿐이에요. '}<b>성분·함량·제형이 같으면 같은 약이에요</b> — 병원마다 쓰는 회사가 다를 뿐이에요. 확실하지 않으면 약사에게 확인하세요.</p>`
      : '<p class="small muted">식약처 자료에서 제품을 찾지 못했어요. 성분 이름으로 여쭤 보세요.</p>';
  });
}
function rxComboCard(rc){
  if (!rc || !(rc.rows || []).length) return '';
  const row = (r, i) => `<div class="rxc-row"><button class="rxc-h" onclick="rxOpen(${i},'${esc(r.ing)}')">
      <span class="rxc-hd"><span class="rxc-role">${esc(r.role)}</span><span class="rxc-t"><b>${esc(r.ing)}</b></span><span class="rxc-more">제품 이름${I.chev}</span></span>
      <small class="rxc-why">${fmt(r.why || '')}</small></button>
      <div class="rxc-bd" id="rxp${i}"></div></div>`;
  return `<section class="sec"><div class="rxc">

/* ───────── 복용 시간 알림 ───────── */
/* 「취침 전」·「자기 전」을 「자기 전」 하나로(3-20) */
const SLOTS = [['아침', '08:00'], ['점심', '13:00'], ['저녁', '19:00'], ['자기 전', '22:00']];
/* 날짜는 «그 사람의 시계»로 세야 한다. toISOString() 은 세계 표준시라서,
   한국에서 아침 9시 전에 드신 약이 «어제»로 적히고 있었다. */
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayKey = () => dayKey(new Date());
/* 약의 용법에서 「하루 몇 번」을 읽어 기본 시간을 미리 골라 둔다.
   전에는 네 칸이 모두 비어 있어서, 약 네 개면 어르신이 칩을 열두 번 눌러야 알림이 잡혔다.
   화면은 「하루 3번 식후가 기본」이라고 적어 놓고 실제로는 하나도 안 골라 둔 상태였다.
   고르신 적이 있으면(ME.sched 에 값이 있으면) 그것을 그대로 쓴다 — 사람이 고른 것이 우선이다. */
function defaultSlots(item){
  const t = String(item?.psim ? item.simple : (item?.d?.dose?.interval || '') + ' ' + (item?.simple || '') + ' ' + (item?.d?.simple || '')).replace(/\s+/g, '');
  const NUM = { '한': 1, '두': 2, '세': 3, '네': 4 };
  let n = 0;
  let m = t.match(/(?:하루|1일)([0-9])~?([0-9])?[회번]/);
  if (m) n = +m[1];
  else { m = t.match(/(?:하루|1일)(한|두|세|네)[회번]/); if (m) n = NUM[m[1]]; }
  if (!n) return [];
  if (/취침|자기전|잘때|자기直/.test(t) && n === 1) return ['22:00'];
  if (n >= 4) return SLOTS.map(x => x[1]);
  if (n === 3) return ['08:00', '13:00', '19:00'];
  /* 12시간 간격 약(파모티딘 등)은 08:00·20:00 — 기본값이 스스로 「촘촘해요」 경고에 걸리던 것(3-09) */
  if (n === 2) return minGapH(item) >= 12 ? ['08:00', '20:00'] : ['08:00', '19:00'];
  return ['08:00'];
}
/* Z4 #15 — 담기만 하고 시각을 정하지 않은 약에 「08:00 — 드실 시간이 지났어요」 일정이 생기던 것. 정해 둔 시각(ME.sched)만 일정·지난 표시·알림이 된다.
   허가 용법으로 고른 기본 시각(defaultSlots)은 «제안»으로만 보이고, 「이 시간으로 정하기」를 눌러야 저장된다. 옛 기록(ME.sched 가 없는 약)도 같은 규칙 */
function schedOf(id, item){ ME.sched = ME.sched || {}; if (isPrn(id)) return []; return ME.sched[id] || []; }
const schedUnset = item => !isPrn(item.id) && !((ME.sched || {})[item.id] || []).length;
function schedConfirm(id){ const item = takingItems().find(x => x.id === id); const L = defaultSlots(item); if (!L.length) return; ME.sched = ME.sched || {}; ME.sched[id] = L.slice(); saveMe(); rollDay(); armNotifications(); route(); toast(`${L.join(' · ')}에 알려 드릴게요`); }
/* ── 필요할 때만 드시는 약 ──
   진통제·해열제·제산제처럼 아플 때만 드시는 약은 시간 알람이 맞지 않는다. 대신 «드신 때»를 적고,
   허가 간격으로 «다음은 몇 시부터»와 하루 상한 대비 «오늘 몇 번»을 보여 드린다 — 겹쳐 드시는 것을 막는 자리.
   (메디세이프의 「필요 시 복용」은 적기만 한다. 간격·상한을 약마다 계산해 주는 것은 약지도가 앞서는 곳) */
const isPrn = id => !!(ME.prn || {})[id];
const hhmm = d => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
function prnLog(k){ ME.prnLog = ME.prnLog || {}; k = k || todayKey(); ME.prnLog[k] = ME.prnLog[k] || []; return ME.prnLog[k]; }
function togglePrn(id){ ME.prn = ME.prn || {}; if (ME.prn[id]) delete ME.prn[id]; else ME.prn[id] = true; saveMe(); rollDay(); armNotifications(); route(); }
function prnLast(id){
  let last = null;
  for (const k of [dayBefore(1), todayKey()]) for (const x of ((ME.prnLog || {})[k] || [])) if (x.id === id) { const d = new Date(k + 'T' + x.t + ':00'); if (!last || d > last) last = d; }
  return last;
}
function prnState(item){
  const gap = minGapH(item), max = maxPerDay(item), last = prnLast(item.id), now = new Date();
  const count = ((ME.prnLog || {})[todayKey()] || []).filter(x => x.id === item.id).length;
  const next = last && gap ? new Date(last.getTime() + gap * 3600000) : null;
  return { gap, max, last, next, count, early: !!(next && next > now), full: !!(max && count >= max) };
}
async function prnTook(id){
  const item = takingItems().find(x => x.id === id); if (!item) return;
  const st = prnState(item);
  if (st.early && !(await appConfirm(`마지막으로 드신 때가 ${hhmm(st.last)}이에요. 이 약은 ${st.gap}시간쯤 띄우기를 권해요(설명서·약사 안내를 따르세요).\n\n그래도 지금 드신 것으로 적을까요?`, { ok:'그래도 적을게요', cancel:'그만둘게요' }))) return;
  if (st.full && !(await appConfirm(`오늘 벌써 ${st.count}번 드셨어요 — 이 약은 하루 ${st.max}번까지로 안내드려요.\n\n그래도 적을까요?`, { ok:'그래도 적을게요', cancel:'그만둘게요' }))) return;
  const n = prnQty(id); prnLog().push({ id, t: hhmm(new Date()), n }); saveMe(); toast(`드신 시각을 적어 두었어요 (${n}알)`); route();
}
const prnQty = id => ((ME.prnQty || {})[id] || 1);
function setPrnQty(id, n){ ME.prnQty = ME.prnQty || {}; ME.prnQty[id] = n; saveMe(); route(); }
function prnUndo(id){ const L = prnLog(); for (let i = L.length - 1; i >= 0; i--) if (L[i].id === id) { L.splice(i, 1); break; } saveMe(); route(); }
function toggleSlot(id, t){ ME.sched = ME.sched || {};
  /* 아직 손대지 않은 약이면 「미리 골라 둔 것」에서 출발한다 — 누르자마자 나머지가 사라지면 놀라신다 */
  const item = takingItems().find(x => x.id === id);
  /* Z4 #15 — 제안은 저장 전이라 빈 데서 출발 */
  const cur = new Set(ME.sched[id] || []);
  cur.has(t) ? cur.delete(t) : cur.add(t); ME.sched[id] = [...cur].sort(); saveMe(); rollDay(); armNotifications(); route(); }
/* 3-09 — 네 칸 말고 «직접 시각»(06:30 에 일어나 드시는 분·12시간 간격 약) */
function addSlot(id, t){ if (!SAFE_HM.test(String(t || ''))) { toast('시각을 골라 주세요'); return; } ME.sched = ME.sched || {};
  const cur = new Set(ME.sched[id] || []);
  if (cur.has(t)) { toast('이미 있는 시각이에요'); return; } cur.add(t); ME.sched[id] = [...cur].sort(); saveMe(); rollDay(); armNotifications(); route(); toast(`${t}에 알려 드릴게요`); }
/* ── 지난 기록을 남긴다 ──
   전에는 «오늘»만 두고 어제 것을 지웠다. 그러면 달력도 복용률도 만들 수 없고,
   진료 때 「요즘 잘 드셨어요?」에 대답할 근거가 없다. 해외 복약 앱(메디세이프)의
   «복약 리포트», 국내 「오늘의약」의 «달력 기록»이 바로 이 자리다.
   60일치만 둔다 — 그 이상은 이 휴대폰 저장칸을 잡아먹기만 한다. 서버로는 가지 않는다. */
const DAYS_KEEP = 60;
const dayBefore = n => { const d = new Date(); d.setDate(d.getDate() - n); return dayKey(d); };
function takenSet(){ ME.taken = ME.taken || {}; const k = todayKey(); ME.taken[k] = ME.taken[k] || []; return ME.taken[k]; }
/* 그날 «몇 번 드시기로 했는지»를 그날 안에 적어 둔다.
   나중에 약을 빼도 지난 날의 기록이 뒤바뀌지 않아야 한다. */
function rollDay(){
  ME.taken = ME.taken || {}; ME.days = ME.days || {};
  const k = todayKey(), cut = dayBefore(DAYS_KEEP);
  let dirty = false;
  for (const d in ME.taken) if (d < cut) { delete ME.taken[d]; dirty = true; }
  for (const d in ME.days) if (d < cut) { delete ME.days[d]; dirty = true; }
  for (const d in (ME.prnLog || {})) if (d < cut) { delete ME.prnLog[d]; dirty = true; }
  for (const d in (ME.skipped || {})) if (d < cut || !ME.skipped[d].length) { delete ME.skipped[d]; dirty = true; }
  /* 몇 번인지뿐 아니라 «어느 때»였는지도 적는다 — 아침을 놓치시는지 저녁을 놓치시는지가
     진료에서 실제로 약을 바꾸는 근거가 된다. */
  const slots = {}; let plan = 0;
  for (const d of takingItems()) for (const t of schedOf(d.id, d)) { slots[t] = (slots[t] || 0) + 1; plan++; }
  if (plan) { const cur = ME.days[k];
    const same = cur && typeof cur === 'object' && cur.n === plan && JSON.stringify(cur.s) === JSON.stringify(slots);
    if (!same) { ME.days[k] = { n: plan, s: slots }; dirty = true; } }
  if (dirty) saveMe();
}
/* 옛 기록은 숫자 하나로만 적혀 있었다 — 둘 다 읽는다 */
function dayPlan(k){ const v = (ME.days || {})[k]; if (!v) return { n: 0, s: {} };
  return typeof v === 'number' ? { n: v, s: {} } : { n: v.n || 0, s: v.s || {} }; }
/* 하루의 상태 — 다 드심 / 일부 / 빠짐 / 정해 둔 것이 없던 날 */
/* Z6 — 건너뛴 회차(skip)는 «먹은 것»으로 세지 않고 따로 센다. 남은 회차가 모두 건너뛴 것이면 'skip'(달력 「–」) */
function dayStat(k){
  const plan = dayPlan(k).n, took = (ME.taken || {})[k] || [];
  const done = took.length, skip = ((ME.skipped || {})[k] || []).filter(x => !took.includes(x)).length;
  if (!plan) return { s: 'none', plan: 0, done, skip };
  if (done >= plan) return { s: 'full', plan, done, skip: 0 };
  if (skip && done + skip >= plan) return { s: 'skip', plan, done, skip };

}
/* 어느 때를 가장 많이 놓치시나 — 30일을 시간대별로 센다.
   「아침은 잘 드시는데 저녁을 자주 놓치십니다」는 하루 한 번짜리로 바꿀 근거가 된다. */
function slotMiss(n = 30){
  const tally = {};
  /* 오늘은 빼고 센다 — 아직 저녁이 오지도 않았는데 「저녁을 놓치셨다」고 하면 안 된다 */
  for (let i = 1; i <= n; i++) { const k = dayBefore(i); const p = dayPlan(k); if (!p.n) continue;
    const took = (ME.taken || {})[k] || [];
    for (const t in p.s) { const want = p.s[t];
      const got = took.filter(x => x.endsWith('@' + t)).length;
      const a = tally[t] || (tally[t] = { want: 0, got: 0 });
      a.want += want; a.got += Math.min(got, want); } }
  const rows = Object.keys(tally).sort().map(t => ({ t, ...tally[t], miss: tally[t].want - tally[t].got }));
  /* 표본이 너무 적으면 말하지 않는다 */
  return rows.filter(r => r.want >= 5);

const SLOT_WORD = { '08:00': '아침', '13:00': '점심', '19:00': '저녁', '22:00': '자기 전' };
function slotLine(){
  const rows = slotMiss(); if (rows.length < 2) return '';
  const worst = rows.reduce((a, b) => (b.miss / b.want > a.miss / a.want ? b : a));
  const best = rows.reduce((a, b) => (b.miss / b.want < a.miss / a.want ? b : a));
  if (worst.t === best.t || worst.miss === 0) return '';
  const w = SLOT_WORD[worst.t] || worst.t, g = SLOT_WORD[best.t] || best.t;
  if (worst.miss / worst.want < 0.3) return '';

/* ───────── 혈압·혈당 수첩 ─────────
   메디세이프의 「측정값 기록」 자리. 기록은 이 휴대폰에만 둔다(ME.vitals).
   기준 숫자는 검증된 것만: 가정혈압 135/85 mmHg — 대한고혈압학회 2018·2022.
   «위험한 숫자»(예: 180/120)는 지침 원문에서 확인하지 못해 숫자로 겁주지 않고, 증상으로만 안내한다.
   혈당 기준(공복 80~130 · 식후 2시간 180 미만 · 70 미만 저혈당)은 현욱님 승인(2026-09-29), 근거 ADA 2025.
   아주 높은 혈압(180/120)은 «바르게 재고, 5분 쉬고 다시 잰 값»으로만 판단한다 — 커프를 세게 감거나
   팔을 심장보다 낮게 두고 재서 높게 나오는 분이 많다(현욱님). */
const VREF = { bp: { s: 135, d: 85, hs: 180, hd: 120, lo: 90, ld: 60, src: ['ksh2018hbpm', 'ksh2022'] }, bg: { fLo: 80, fHi: 130, pHi: 180, hypo: 70, hi: 300, src: ['ada2025glyc'], hiSrc: ['umpierrez2024hhs'] } };
/* Z9 B6 — 아주 높은 혈당(300 이상, 현욱님 10-14 「증상에 따라 다르지, 케톤산증·고삼투압 감별, 식사에 따라 다르고」): 숫자만으로 겁주지 않고

  const out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//yakjido//ko', 'CALSCALE:GREGORIAN'];
  for (const v of visits().filter(x => new Date(x.at).getTime() > Date.now())) { const at = new Date(v.at), eve = visitTimes(v)[0][0];

/* 지금 고른 약·내 약통과 겹치는 조합을 찾아 준다 */
function mixFor(extra){
  if (!LEX.mix) { lexLoad(); return []; }
  const ids = new Set();
  for (const x of takingItems()) if (x.d) ids.add(x.d.id);
  for (const d of (extra || [])) if (d) ids.add(d.id);
  if (!ids.size) return [];
  const f = activeFlags();
  /* who_* 는 「사람 조건」 묶음이라 성분이 겹친다고 띄우면 안 된다 — 내 정보에 해당할 때만 */
  const WHO = { who_elder:'senior', who_kidney:'kidney', who_liver:'liver', who_preg:'pregnant' };

const PH = { ocr:null, step:'', q:'', busy:false, result:null, img:'', err:'' };

function photoEndpoint(){ return ''; }
async function photoPick(file){ PH.none = 0;

    const bmp = await createImageBitmap(file); const max = 1024; const r = Math.min(1, max / Math.max(bmp.width, bmp.height));

function bagText(){

  if (res.dupe.length) L.push('· 같은 성분 두 번: ' + res.dupe.map(d => d.e?.n || '').join(', '));

    const sm = slotMiss().filter(r => r.miss);
    if (sm.length) L.push('· 시간대별로 못 드신 횟수: ' + sm.map(r => `${SLOT_WORD[r.t] || r.t} ${r.want}번 중 ${r.miss}번`).join(', ')); }
  const bp = bpAvg(14); if (bp) L.push('', '[집에서 잰 혈압]', `· 최근 2주 평균 ${bp.s}/${bp.d} mmHg (${bp.days}일 ${bp.n}번)`);

/* ───────── 약사님이 권한 약 확인 ───────── */

  if (blocked) return { lv:'stop', t:'제 상태에는 주의가 필요한 약이에요', w:`<b>${esc(flagWords([...new Set(avs.flatMap(a => a.flags.filter(x => f.includes(x))))], ', '))}</b> — 설명서: ${esc(plainTxt(avs[0].text))}. <b>“저는 ${f.map(k => esc(FLAG_LABEL[k])).join(', ')}이 있는데 괜찮을까요?”</b>라고 꼭 여쭤보세요.`, sub: v.t };

/* ───────── 계열 비교 ───────── */
