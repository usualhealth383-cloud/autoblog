<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>약지도 · 증상에 맞는 약, 의사가 고르듯</title>
<meta name="description" content="증상별 일반의약품 선택 가이드·성분 비교·영양제 비교. 임상에서 처방하는 조합을 약국 구입 기준으로 풀어드립니다.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="약지도">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
