<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>약지도 · 증상에 맞는 약, 의사가 고르듯</title>
<meta name="description" content="증상별 일반의약품 선택 가이드·성분 비교·영양제 비교. 임상에서 처방하는 조합을 약국 구입 기준으로 풀어드립니다.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B6E8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="약지도">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Gowun+Batang:wght@400;700&display=swap">
<style>
:root{
  --primary:#0B6E8F; --primary-deep:#08526B; --primary-rgb:11,110,143;
  --accent:#B5711C; --accent-tint:#FBF0DC;
  --surface:#FAF8F3; --card:#FFFFFF; --ground:#EFEBE3;
  --text:#1E2A30; --body:#3B474E; --muted:#5B6770; --faint:#8C969C;
  --hairline:#E6E2DA; --tint:#DCEFF5; --tint2:#F3F1EB;
  --normal:#1A7946; --caution:#8A6313; --alert:#B63629;
  --normal-tint:#E4F1E9; --caution-tint:#F6EEDD; --alert-tint:#F6E4E1;
  --rx:#4C5FB5; --rx-tint:#E9ECF8;
  --r-card:16px; --r-input:10px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --shadow-card:0 4px 18px rgba(var(--primary-rgb),.06);
  --shadow-raised:0 6px 16px rgba(var(--primary-rgb),.22);
  --font:"Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --serif:"Gowun Batang","Noto Serif KR",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primary:#5DB3D2; --primary-deep:#8CCDE3; --primary-rgb:93,179,210;
    --accent:#D9A24E; --accent-tint:#2E2619;
    --surface:#161A1C; --card:#1E2427; --ground:#0E1214;
    --text:#E8ECEE; --body:#C3CBD0; --muted:#9AA6AD; --faint:#6E7A81;
    --hairline:#2B3438; --tint:#1F3540; --tint2:#1B2226;
    --normal:#4FB783; --caution:#E0A83A; --alert:#E8635A;
    --normal-tint:#1C2A22; --caution-tint:#2A2418; --alert-tint:#2C1E1C;
    --rx:#9AA8EA; --rx-tint:#1F2438;
    --shadow-card:0 4px 18px rgba(0,0,0,.35); --shadow-raised:0 6px 16px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --primary:#5DB3D2; --primary-deep:#8CCDE3; --primary-rgb:93,179,210;
  --accent:#D9A24E; --accent-tint:#2E2619;
  --surface:#161A1C; --card:#1E2427; --ground:#0E1214;
  --text:#E8ECEE; --body:#C3CBD0; --muted:#9AA6AD; --faint:#6E7A81;
  --hairline:#2B3438; --tint:#1F3540; --tint2:#1B2226;
  --normal:#4FB783; --caution:#E0A83A; --alert:#E8635A;
  --normal-tint:#1C2A22; --caution-tint:#2A2418; --alert-tint:#2C1E1C;
  --rx:#9AA8EA; --rx-tint:#1F2438;
  --shadow-card:0 4px 18px rgba(0,0,0,.35); --shadow-raised:0 6px 16px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html{font-size:var(--fs,16px)}
body{background:var(--ground);color:var(--text);font-family:var(--font);word-break:keep-all;
  line-height:1.6;display:flex;justify-content:center;min-height:100vh;font-size:1rem;
  -webkit-font-smoothing:antialiased;text-wrap:pretty}
.app{width:100%;max-width:460px;background:var(--surface);min-height:100vh;display:flex;flex-direction:column;overflow-x:clip;
  box-shadow:0 0 40px rgba(0,0,0,.06);position:relative}
main{flex:1;padding:var(--s4) var(--s4) 104px;overflow-x:clip}
.hide{display:none!important}
a{color:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{line-height:1.3;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.125rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{color:var(--body)}
.muted{color:var(--muted)}
.small{font-size:.8125rem}
.num{font-variant-numeric:tabular-nums}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;padding:var(--s1) 0 var(--s4)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:11px;background:var(--primary);display:grid;place-items:center;color:#fff}
.brand .mark svg{width:20px;height:20px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.brand b{font-size:1.125rem;font-weight:800;letter-spacing:-.02em}
.brand span{display:block;font-size:.75rem;color:var(--muted);line-height:1.2}
.review-stamp{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-size:.75rem;font-weight:600}
.review-stamp svg.i{width:15px;height:15px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.9375rem;font-weight:600;min-height:44px;margin-left:-6px;padding:0 6px}
.back:hover{color:var(--text)}

/* 카드 */
.card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:var(--s5) var(--s4)}
.card+.card,.sec+.sec,.card+.sec,.sec+.card{margin-top:var(--s4)}
.sec{margin-top:var(--s5)}
.sec>h2{margin-bottom:var(--s3);display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.sec>h2 small{font-size:.8125rem;font-weight:500;color:var(--muted)}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--primary);text-transform:uppercase;margin-bottom:var(--s2)}

/* 히어로(증상 선택) */
.hero{padding:var(--s2) 0 var(--s3)}
.hero .greet{font-family:var(--serif);font-size:1.5rem;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.hero p{margin-top:var(--s2);font-size:.9375rem}
.search{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s4);background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:0 var(--s3) 0 var(--s4);min-height:52px;box-shadow:var(--shadow-card)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:1rem;color:var(--text);min-height:50px;outline:none}
.search input::placeholder{color:var(--faint)}
.search svg.i{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-pill);background:var(--tint);color:var(--text);font-size:.875rem;font-weight:600;min-height:38px;border:1px solid transparent}
.chip.on,.chip:hover{border-color:var(--primary);color:var(--primary-deep)}
.chip.on{background:var(--card)}

/* 증상 타일 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.tile{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);padding:var(--s4);text-align:left;min-height:104px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-card);transition:transform .15s ease}
.tile:hover{transform:translateY(-1px)}
.tile .ic{width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--primary);display:grid;place-items:center}
.tile b{font-size:.9375rem;font-weight:700;line-height:1.3}
.tile span{font-size:.75rem;color:var(--muted);line-height:1.4}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:var(--s3);min-height:0}
.tile.wide .ic{flex:none}
.tile.wide div{flex:1}
.tile.wide svg.chev{color:var(--faint)}

/* 처방 스타일 조합 카드 — 시그니처 */
.rx-card{background:var(--card);border:1px solid var(--hairline);border-radius:20px;box-shadow:0 10px 30px rgba(var(--primary-rgb),.10);overflow:hidden}
.rx-card .rx-head{padding:var(--s4) var(--s4) var(--s3);border-bottom:1px dashed var(--hairline);display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.rx-card .rx-head h2{font-size:1.0625rem}
.rx-card .rx-head .lbl{font-size:.75rem;color:var(--muted);margin-top:2px}
.rx-card .rx-stamp{font-family:var(--serif);font-size:.75rem;color:var(--primary);border:1.5px solid var(--primary);border-radius:6px;padding:3px 8px;white-space:nowrap;transform:rotate(-4deg);opacity:.9}
.slot{display:grid;grid-template-columns:44px 1fr;gap:var(--s3);padding:var(--s4);border-bottom:1px solid var(--hairline)}
.slot:last-child{border-bottom:0}
.slot .n{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:.75rem;line-height:1.1;text-align:center;word-break:break-all;padding:2px;overflow:hidden}
.slot .n.rx{background:var(--rx-tint);color:var(--rx)}
.slot .n.opt{background:var(--tint2);color:var(--muted)}
.slot h3{font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot .why{font-size:.875rem;color:var(--body);margin-top:2px}
.slot .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.opt-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--card);font-size:.8125rem;font-weight:600;min-height:34px}
.opt-pill.pick{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.opt-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.slot .alt{margin-top:var(--s2);font-size:.8125rem;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:.6875rem;font-weight:700;letter-spacing:.02em;line-height:1.5}
.badge.otc{background:var(--normal-tint);color:var(--normal)}
.badge.cvs{background:var(--tint);color:var(--primary-deep)}
.badge.rx{background:var(--rx-tint);color:var(--rx)}
.badge.warn{background:var(--caution-tint);color:var(--caution)}
.badge.stop{background:var(--alert-tint);color:var(--alert)}

/* 리스트·행 */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--hairline);text-align:left;min-height:56px;width:100%}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.row .body{flex:1;min-width:0}
.row b{display:block;font-size:.9375rem;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.row span{display:block;font-size:.8125rem;color:var(--muted);line-height:1.4;margin-top:1px}
.row svg.chev{color:var(--faint)}
ul.plain{list-style:none}
ul.plain li{position:relative;padding-left:18px;font-size:.9375rem;color:var(--body);line-height:1.6;margin-bottom:6px}
ul.plain li::before{content:"";position:absolute;left:4px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--primary);opacity:.55}
ul.plain.x li::before{background:var(--alert);opacity:.8}
ul.steps{list-style:none;counter-reset:s}
ul.steps li{counter-increment:s;position:relative;padding-left:34px;font-size:.9375rem;color:var(--body);line-height:1.6;margin-bottom:10px}
ul.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:8px;background:var(--tint);color:var(--primary);font-weight:800;font-size:.75rem;display:grid;place-items:center}

/* 근거·면책 */
.src-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);background:var(--tint);color:var(--muted);font-size:.75rem;text-decoration:none;margin:4px 4px 0 0;max-width:100%}
.src-chip svg.i{width:13px;height:13px}
.src-chip:hover{color:var(--text)}
.srcs{margin-top:var(--s3)}
.disclaimer{display:flex;align-items:flex-start;gap:var(--s2);margin-top:var(--s5);padding:var(--s3) var(--s4);background:var(--tint);border-radius:var(--r-input);color:var(--muted);font-size:.8125rem;line-height:1.55}
.disclaimer svg.i{width:16px;height:16px;margin-top:2px}

/* 아이 용량 계산기 */
.kid-form{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.kid-form label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:700;color:var(--muted)}
.kid-form label.full{grid-column:1/-1}
.kid-form input,.kid-form select{min-height:48px;border:1px solid var(--hairline);border-radius:var(--r-input);padding:0 12px;font:inherit;font-size:1.0625rem;background:var(--card);color:var(--text);width:100%}
.kid-form input:focus,.kid-form select:focus{outline:2px solid var(--primary);outline-offset:1px}
.dose-card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:var(--s4);margin-top:var(--s3)}
.dose-card .eyebrow{margin-bottom:4px}
.dose-big{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.dose-big b{font-size:2.25rem;font-weight:800;letter-spacing:-.02em;color:var(--primary-deep);line-height:1.1}
.dose-big span{color:var(--muted);font-size:.9375rem}
.dose-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.dose-meta div{background:var(--tint2);border-radius:10px;padding:8px 10px}
.dose-meta small{display:block;font-size:.6875rem;font-weight:700;color:var(--muted)}
.dose-meta b{display:block;font-size:.9375rem;margin-top:1px}
.dose-card .warn{margin-top:10px}
.kid-line{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--tint);color:var(--primary-deep);font-size:.875rem;font-weight:600;margin-top:10px;line-height:1.5}
.kid-line svg.i{flex:none;margin-top:2px}
/* 결론 카드(증상 첫 화면) */
.answer{background:var(--card);border:1.5px solid var(--primary);border-radius:20px;padding:var(--s4);box-shadow:0 10px 30px rgba(var(--primary-rgb),.12)}
.answer .eyebrow{margin-bottom:var(--s2)}
.answer .buy{display:flex;flex-direction:column;gap:8px}
.buy-item{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--tint2)}
.buy-item .k{font-size:.6875rem;font-weight:800;color:var(--primary);background:var(--tint);border-radius:8px;padding:6px 0;text-align:center;line-height:1.2}
.buy-item.opt .k{background:var(--tint2);color:var(--muted);border:1px dashed var(--hairline)}
.buy-item b{font-size:1rem;display:block;line-height:1.3}
.buy-item small{display:block;color:var(--muted);font-size:.75rem;margin-top:1px}
.buy-item .rx{font-size:.6875rem}
.answer .line{display:grid;grid-template-columns:56px 1fr;gap:10px;margin-top:12px;font-size:.9375rem;line-height:1.5}
.answer .line span:first-child{font-weight:800;color:var(--muted);font-size:.8125rem;padding-top:2px}
.answer .line.stop span:first-child{color:var(--alert)}
.memo-actions{display:flex;gap:8px;margin-top:14px}
.memo-actions .btn{min-height:44px;font-size:.875rem;padding:0 14px}
/* 바로 답 항목 펼침 */
.buy-item{cursor:pointer;text-align:left;width:100%;border:0;font:inherit;color:inherit}
.buy-item .chev{color:var(--faint);justify-self:end}
.buy-more{margin:-2px 0 6px;padding:12px 14px 12px 14px;border-radius:0 0 12px 12px;background:var(--card);border:1px solid var(--hairline);border-top:0}
.buy-more .how{font-size:1rem;font-weight:700;line-height:1.5}
.buy-more .how small{display:block;font-weight:500;color:var(--muted);font-size:.8125rem;margin-top:2px}
.buy-more .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.buy-more .links a,.plink{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:var(--r-pill);background:var(--tint2);border:1px solid var(--hairline);font-size:.8125rem;font-weight:600;text-decoration:none;color:var(--text);min-height:34px}
.buy-more .links a svg.i,.plink svg.i{width:14px;height:14px;color:var(--primary)}
.buy-item.open{border-radius:12px 12px 0 0}
/* 알아두기 */
.tip-card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:var(--s4);display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.tip-card .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;flex:none}
.tip-card b{display:block;font-size:1rem;line-height:1.35}
.tip-card span{display:block;color:var(--muted);font-size:.8125rem;margin-top:3px}
/* 복용 시간표 */
.sched-row{padding:12px 0;border-bottom:1px solid var(--hairline)}
.sched-row:last-child{border-bottom:0}
.sched-row .nm{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.times .chip{min-height:38px;padding:0 12px}
.times .chip.on{background:var(--tint);border-color:var(--primary);color:var(--primary-deep)}
.today{display:flex;flex-direction:column;gap:8px;margin-top:var(--s3)}
.dose-tick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--hairline);width:100%;text-align:left;min-height:60px}
.dose-tick .t{font-weight:800;font-size:1.0625rem;min-width:52px;font-variant-numeric:tabular-nums}
.dose-tick .n{flex:1}
.dose-tick .n b{display:block;font-size:1rem}
.dose-tick .n small{color:var(--muted);font-size:.8125rem}
.dose-tick .bx{width:28px;height:28px;border-radius:50%;border:2px solid var(--hairline);display:grid;place-items:center;flex:none;color:#fff}
.dose-tick.done{background:var(--normal-tint);border-color:transparent}
.dose-tick.done .bx{background:var(--normal);border-color:var(--normal)}
.dose-tick.late{border-color:rgba(182,54,41,.35)}
/* 나에게 맞추기 칩 */
.fitme{margin-top:var(--s3)}
.fitme .chips .chip{min-height:40px}
.fitme .chip.on{background:var(--alert-tint);border-color:var(--alert);color:var(--alert)}
/* 접이식 섹션 */
details.acc{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-card);margin-top:var(--s3)}
details.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px var(--s4);font-size:1.0625rem;font-weight:700;min-height:56px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary small{font-weight:500;color:var(--muted);font-size:.8125rem;flex:1;text-align:left;min-width:0}
details.acc summary svg.i{color:var(--faint);transition:transform .2s}
details.acc[open] summary svg.i{transform:rotate(90deg)}
details.acc .bd{padding:0 var(--s4) var(--s4)}
/* 홈 빠른 선택 */
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:var(--s4) calc(-1 * var(--s4)) 0;padding:0 var(--s4) 4px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 12px;border-radius:14px;background:var(--card);border:1px solid var(--hairline);box-shadow:var(--shadow-card);font-weight:700;font-size:.9375rem}
.quick button svg.i{color:var(--primary)}
/* 제품 사진 */
.pimg{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#fff;border:1px solid var(--hairline);flex:none}
.buy-item.has-img{grid-template-columns:52px 44px 1fr auto}
.drug-photo{display:flex;gap:12px;align-items:center;margin-top:var(--s3);padding:12px;background:var(--card);border:1px solid var(--hairline);border-radius:14px}
.drug-photo img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:#fff;border:1px solid var(--hairline)}
.drug-photo b{display:block;font-size:.9375rem}
.drug-photo small{color:var(--muted);font-size:.75rem}
/* 3단계 안내 */
.steps-bar{display:flex;gap:6px;margin:var(--s2) 0 var(--s4)}
.steps-bar i{flex:1;height:4px;border-radius:999px;background:var(--hairline)}
.steps-bar i.on{background:var(--primary)}
.g-list{display:flex;flex-direction:column;gap:8px}
.g-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--hairline);text-align:left;min-height:64px;box-shadow:var(--shadow-card)}
.g-item .ic{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.g-item b{display:block;font-size:1.0625rem}
.g-item span{display:block;color:var(--muted);font-size:.8125rem}
.g-grp{font-size:.75rem;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:var(--s4) 0 var(--s2)}
.g-q{font-family:var(--serif);font-size:1.375rem;font-weight:700;line-height:1.35;margin-bottom:6px}
.g-chips{display:flex;flex-direction:column;gap:8px;margin-top:var(--s3)}
.g-chips .chip{min-height:52px;font-size:1rem;justify-content:flex-start;padding:0 16px;border-radius:14px}
.g-chips .chip.on{background:var(--tint);border-color:var(--primary);color:var(--primary-deep)}
.hero-cta{margin-top:var(--s4)}
/* 블록 간 최소 여백 — 어떤 조합으로 이어져도 겹치지 않게 */
main > .answer + *, main > .sec + .care, main > .card + .care, main > .rx-card + *, main > .care + .sec, main > .care + .card, main > .care + .actions, main > details.acc + .sec, main > .answer + .sec{margin-top:var(--s5)}
/* 케어 카드 3단계 (NHS care cards → 약국/병원/응급) */
.care{border-radius:var(--r-card);overflow:hidden;border:1px solid var(--hairline);background:var(--card)}
.care+.care{margin-top:var(--s3)}
.care .hd{display:flex;align-items:center;gap:var(--s2);padding:12px var(--s4);font-weight:800;font-size:.9375rem}
.care.ok .hd{background:var(--normal-tint);color:var(--normal)} .care.clinic .hd{background:var(--caution-tint);color:var(--caution)} .care.er .hd{background:var(--alert);color:#fff}
.care .bd{padding:var(--s3) var(--s4) var(--s4)}
.care .bd ul.plain li{margin-bottom:4px;font-size:.9rem}
.care.er .bd ul.plain li::before{background:var(--alert)} .care.clinic .bd ul.plain li::before{background:var(--caution)} .care.ok .bd ul.plain li::before{background:var(--normal)}
.care .call{display:inline-flex;align-items:center;gap:6px;margin-top:8px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--alert);color:#fff;font-weight:700;text-decoration:none;font-size:.9rem}
/* 복약 픽토그램 */
.picts{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}
.pict{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:var(--tint2);border:1px solid var(--hairline);font-size:.75rem;font-weight:700;color:var(--body)}
.pict svg.i{width:15px;height:15px;color:var(--primary)}
.pict.no{color:var(--alert)} .pict.no svg.i{color:var(--alert)}
/* 계산기 */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:700;color:var(--muted)}
.calc input{min-height:44px;border:1px solid var(--hairline);border-radius:var(--r-input);padding:0 12px;font:inherit;font-size:1rem;background:var(--card);color:var(--text);width:100%}
.calc input:focus{outline:2px solid var(--primary);outline-offset:1px}
.calc-out{margin-top:var(--s3);display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.calc-out div{background:var(--tint);border-radius:12px;padding:12px 14px}
.calc-out small{display:block;font-size:.6875rem;font-weight:700;color:var(--muted);letter-spacing:.05em}
.calc-out b{display:block;font-size:1.375rem;font-weight:800;letter-spacing:-.02em;color:var(--primary-deep)}
.dup{display:flex;gap:var(--s2);align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--alert-tint);color:var(--alert);font-size:.875rem;font-weight:600;line-height:1.5;margin-top:var(--s3)}
.taking{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}
.taking .chip{gap:8px} .taking .chip button{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--card);color:var(--muted)}
.taking .chip button svg.i{width:12px;height:12px}
/* 경고·레드플래그 */
.flag{display:flex;gap:var(--s3);padding:var(--s4);border-radius:var(--r-card);background:var(--alert-tint);border:1px solid rgba(182,54,41,.25)}
.flag svg.i{color:var(--alert);margin-top:2px}
.flag b{color:var(--alert);display:block;font-size:.9375rem}
.flag p{font-size:.875rem;margin-top:2px}
.flag ul.plain li::before{background:var(--alert)}
.note{display:flex;gap:var(--s2);padding:var(--s3) var(--s4);border-radius:var(--r-input);background:var(--caution-tint);color:var(--caution);font-size:.875rem;font-weight:600;line-height:1.5}
.note svg.i{margin-top:2px;width:18px;height:18px}
.me-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}

/* 약 상세 */
.drug-hero{display:flex;flex-direction:column;gap:6px}
.drug-hero .cls{font-size:.8125rem;font-weight:600;color:var(--primary)}
.drug-hero h1{font-size:1.625rem}
.drug-hero .en{color:var(--muted);font-size:.9375rem;font-weight:500}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.kv div{background:var(--tint2);border-radius:12px;padding:12px 14px}
.kv div small{display:block;font-size:.6875rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.kv div b{display:block;font-size:.9375rem;font-weight:700;margin-top:2px;line-height:1.35}
.dose-hero{background:var(--tint);border-radius:14px;padding:var(--s4);margin-top:var(--s4)}
.dose-hero .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:var(--primary-deep)}
.dose-hero small{display:block;color:var(--muted);font-size:.8125rem;margin-top:2px}
.risk-bars{display:flex;flex-direction:column;gap:10px;margin-top:var(--s3)}
.rb{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:10px;font-size:.8125rem}
.rb .track{height:8px;border-radius:999px;background:var(--tint);overflow:hidden}
.rb .fill{height:100%;border-radius:999px;background:var(--primary)}
.rb .fill.l3{background:var(--caution)} .rb .fill.l4,.rb .fill.l5{background:var(--alert)}
.rb .v{text-align:right;color:var(--muted);font-weight:600}
.products{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
.prod{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:10px 12px;border:1px solid var(--hairline);border-radius:12px;font-size:.875rem}
.prod b{font-weight:700;overflow-wrap:anywhere}
.prod span{display:block;color:var(--muted);font-size:.75rem}
.tabs{display:flex;gap:6px;margin:var(--s4) 0 var(--s3);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:var(--r-pill);font-size:.875rem;font-weight:600;color:var(--muted);background:var(--tint2);min-height:38px}
.tab.on{background:var(--text);color:var(--card)}
.pane{display:none}.pane.on{display:block}

/* 비교 차트 (코드로 그린 진짜 데이터) */
.chart{margin-top:var(--s3);background:var(--tint2);border-radius:14px;padding:var(--s3)}
.chart svg{width:100%;height:auto;display:block;font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s2);font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
table.cmp{width:100%;border-collapse:collapse;font-size:.8125rem;margin-top:var(--s3)}
table.cmp th{text-align:left;font-weight:700;color:var(--muted);font-size:.6875rem;letter-spacing:.05em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--hairline)}
table.cmp td{padding:10px 6px;border-bottom:1px solid var(--hairline);vertical-align:top;line-height:1.45}
table.cmp td:first-child{font-weight:700;white-space:nowrap}
.scroll-x{overflow-x:auto;margin:0 calc(-1 * var(--s4));padding:0 var(--s4)}

/* 영양제 비교 */
.supp-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.ev{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:6px}
.ev.strong{background:var(--normal-tint);color:var(--normal)} .ev.mid{background:var(--caution-tint);color:var(--caution)} .ev.weak{background:var(--tint);color:var(--muted)}
.cmp-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;width:min(460px,100%);padding:0 var(--s4);z-index:5;pointer-events:none}
.cmp-bar>div{pointer-events:auto;background:var(--text);color:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.875rem}
.cmp-bar button{background:var(--card);color:var(--text);border-radius:9px;padding:8px 14px;font-weight:700;font-size:.8125rem;min-height:36px}
.checkrow{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);min-height:52px}
.checkrow:last-child{border-bottom:0}
.checkrow input{width:20px;height:20px;accent-color:var(--primary);flex:none}
.checkrow label{flex:1;font-size:.9375rem;font-weight:600}
.checkrow small{color:var(--muted);font-weight:500;display:block;font-size:.8125rem}

/* 내 정보 */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);min-height:56px}
.toggle:last-child{border-bottom:0}
.toggle .t b{display:block;font-size:.9375rem;font-weight:600}
.toggle .t span{display:block;font-size:.8125rem;color:var(--muted)}
.sw{position:relative;width:48px;height:28px;border-radius:999px;background:var(--hairline);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--primary)} .sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--tint2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:.875rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.privacy{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.8125rem;margin-top:var(--s3)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 var(--s5);border-radius:12px;font-weight:700;font-size:.9375rem;background:var(--primary);color:#fff;box-shadow:var(--shadow-raised);width:100%}
.btn.ghost{background:var(--tint);color:var(--primary-deep);box-shadow:none}
.btn.line{background:var(--card);color:var(--text);border:1px solid var(--hairline);box-shadow:none}
.btn+.btn{margin-top:var(--s2)}
.actions{margin-top:var(--s4)}
.link{color:var(--primary);font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline}

/* 탭바 */
nav.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hairline);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 0;font-size:.6875rem;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabbar button.on{color:var(--primary)}
nav.tabbar button svg.i{width:22px;height:22px}
nav.tabbar button.on svg.i{stroke-width:2.2}

/* 검색 결과 */
.results{margin-top:var(--s3)}
.hit{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);text-align:left;width:100%;min-height:56px}
.hit:last-child{border-bottom:0}
.hit .k{font-size:.6875rem;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--tint);color:var(--primary-deep);flex:none;min-width:44px;text-align:center}
.hit .k.s{background:var(--accent-tint);color:var(--accent)} .hit .k.p{background:var(--tint2);color:var(--muted)}
.hit b{display:block;font-size:.9375rem;overflow-wrap:anywhere}
.hit span{display:block;font-size:.8125rem;color:var(--muted)}
.hit mark{background:none;color:var(--primary);font-weight:800}
.empty{padding:var(--s6) var(--s4);text-align:center;color:var(--muted);font-size:.9375rem}
.empty b{display:block;color:var(--text);margin-bottom:6px}

/* 낱알 찾기·식약처 제품 */
.pillimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--tint2);border:1px solid var(--hairline);flex:none}
.pillimg.big{width:100%;height:auto;max-height:220px;object-fit:contain;background:#fff;margin-top:var(--s3)}
.pub-hero{display:flex;gap:var(--s3);align-items:center}.pub-hero h1{overflow-wrap:anywhere}
.qa h3{margin-top:var(--s4);font-size:.9375rem;color:var(--primary-deep)}
.qa p{white-space:pre-line;font-size:.9375rem;line-height:1.7;margin-top:4px;overflow-wrap:anywhere;word-break:normal}
.shape-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.swatch{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--card);font-size:.8125rem;font-weight:600;min-height:36px}
.swatch i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:inline-block}
.swatch.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.loading{padding:var(--s5);text-align:center;color:var(--muted);font-size:.875rem}
/* 약 알아보기(사진·식별) */
.big-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:18px;background:var(--primary);color:#fff;box-shadow:var(--shadow-raised);min-height:76px}
.big-btn .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.big-btn .ic svg.i{width:26px;height:26px;stroke:#fff}
.big-btn b{display:block;font-size:1.125rem;line-height:1.3}
.big-btn span{display:block;font-size:.8125rem;opacity:.9;margin-top:2px}
.big-btn.soft{background:var(--card);color:var(--text);border:1px solid var(--hairline);box-shadow:var(--shadow-card)}
.big-btn.soft .ic{background:var(--tint)} .big-btn.soft .ic svg.i{stroke:var(--primary)}
.big-btn+.big-btn{margin-top:10px}
.shape-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.shape-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--card);border:1px solid var(--hairline);font-size:.75rem;font-weight:700;min-height:64px}
.shape-btn svg{width:28px;height:28px;stroke:var(--text);stroke-width:1.8;fill:var(--tint2)}
.shape-btn.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.color-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;background:var(--card);border:1px solid var(--hairline);font-size:.7rem;font-weight:700;min-height:64px}
.color-btn i{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.color-btn.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.pill-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--s3)}
.pill-card{background:var(--card);border:1px solid var(--hairline);border-radius:14px;overflow:hidden;text-align:left;box-shadow:var(--shadow-card);display:flex;flex-direction:column}
.pill-card .ph{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;border-bottom:1px solid var(--hairline);position:relative}
.pill-card .ph img{width:100%;height:100%;object-fit:contain}
.pill-card .ph .ph-empty{color:var(--faint);font-size:.75rem}
.pill-card .ph .sc{position:absolute;top:6px;left:6px;font-size:.6875rem;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--primary);color:#fff}
.pill-card .bd{padding:10px 12px 12px}
.pill-card b{display:block;font-size:.875rem;line-height:1.3;overflow-wrap:anywhere}
.pill-card .imp{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pill-card .imp span{font-size:.6875rem;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--tint2);border:1px solid var(--hairline);font-family:ui-monospace,monospace;letter-spacing:.03em}
.pill-card small{display:block;color:var(--muted);font-size:.75rem;margin-top:4px}
.pill-hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.pill-hero .ph{width:120px;height:120px;border-radius:14px;background:#fff;border:1px solid var(--hairline);display:grid;place-items:center;overflow:hidden}
.pill-hero .ph img{width:100%;height:100%;object-fit:contain}

.kv3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:var(--s3)}
.kv3 div{background:var(--tint2);border-radius:10px;padding:8px 10px}
.kv3 small{display:block;font-size:.6875rem;font-weight:700;color:var(--muted)} .kv3 b{display:block;font-size:.9375rem;margin-top:1px;overflow-wrap:anywhere}
.photo-box{border:2px dashed var(--hairline);border-radius:18px;padding:var(--s5) var(--s4);text-align:center;background:var(--card)}
.photo-box img{max-width:100%;max-height:260px;border-radius:12px;margin-top:10px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--hairline);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.found{background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:12px 14px;margin-top:10px}
.found b{font-size:1rem}
.found .m{font-size:.8125rem;color:var(--muted);margin-top:2px}
.found .simple{margin-top:8px;font-weight:700;line-height:1.5}
.found .chips{margin-top:8px}
/* 어르신 모드 홈 */
.easy-home .big-btn{min-height:96px}
.easy-home .big-btn b{font-size:1.375rem}
/* 삽화 — art/ 폴더에 파일이 있을 때만 렌더된다(없으면 빌드가 아예 넣지 않음) */
.art{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden;margin:var(--s4) 0 0;line-height:0}
.art img{display:block;width:100%;height:auto}
/* 원본 비율 그대로 — 원형 비네트가 잘리지 않게 crop 하지 않는다 */
.art.spot{max-width:200px;margin-left:auto;margin-right:auto;border-radius:50%;border:0;background:none}
.art.side{width:88px;height:88px;flex:none;border-radius:50%;border:0;background:none;margin:0}
.art.side img{width:88px;height:88px;object-fit:cover}
.art-row{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s4)}
.art-row .t{flex:1;min-width:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .art img{filter:brightness(.88) saturate(.95)}}

function prodNames(d, max = 4){

  const isKid = t => /어린이|소아|키즈|베이비/.test(t);
  const FORM = /^(정|정제|현탁액|시럽|캡슐|연질캡슐|캅셀|액|내복액|겔|크림|연고|산|과립|좌제|패치|파프|카타플라스마|점안액|안연고|트로키|분말|건조시럽)$/;
  const out = [];

}

function monthsFrom(birth){ if (!birth) return null; const b = new Date(birth); if (isNaN(b)) return null; const n = new Date(); let m = (n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth()); if (n.getDate() < b.getDate()) m--; return m >= 0 ? m : null; }

function takenSet(){ ME.taken = ME.taken || {}; const k = todayKey(); for (const d in ME.taken) if (d !== k) delete ME.taken[d]; ME.taken[k] = ME.taken[k] || []; return ME.taken[k]; }

async function askNoti(){ if (!('Notification' in window)) { toast('이 브라우저는 알림을 지원하지 않아요'); return; } const r = await Notification.requestPermission(); if (r === 'granted') { toast('알림을 켰어요 — 앱이 열려 있을 때 울려요'); armNotifications(); } else toast('알림이 꺼져 있어요'); route(); }
function icsText(){
  const pad = n => String(n).padStart(2, '0'); const d0 = new Date(); const ds = `${d0.getFullYear()}${pad(d0.getMonth() + 1)}${pad(d0.getDate())}`;

  for (const id in (ME.sched || {})) for (const t of ME.sched[id]) { const d = takingItems().find(x => x.id === id); if (!d) continue; const [h, m] = t.split(':');
    out.push('BEGIN:VEVENT', `UID:yakjido-${id}-${t}@yakjido`, `DTSTAMP:${ds}T000000`, `DTSTART:${ds}T${h}${m}00`, `DURATION:PT10M`, 'RRULE:FREQ=DAILY', `SUMMARY:💊 ${d.name} 드실 시간`, `DESCRIPTION:${(d.simple || '').replace(/,/g, '\\,')}`, 'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', `DESCRIPTION:${d.name}`, 'END:VALARM', 'END:VEVENT'); }

      const prod = prodName(x.product);
      return `<li><span class="n">${i + 1}</span><div><b>${esc(prod || ingrName(x.d))}</b><small>${prod ? '성분: ' + esc(ingrName(x.d)) : ''}</small>${(() => { const alt = prodNames(x.d).filter(n => n !== prod).slice(0, 3); return alt.length ? `<small class="alt">또는 ${alt.map(esc).join(' · ')}</small>` : ''; })()}${x.optional ? '<span class="badge warn" style="margin-top:4px">필요할 때만</span>' : ''}</div><span class="badge ${x.d.rx === '안전상비' ? 'cvs' : 'otc'}">${x.d.rx === '안전상비' ? '편의점' : '약국'}</span></li>`;

    <p class="show-ask">같은 성분이면 다른 제품도 괜찮습니다.<br>겹치는 성분이 없게 부탁드립니다.</p>
  </div>

  <div class="actions"><button class="btn line" onclick="go('/check/${s.id}')">${I.shield} 다른 걸 권하시면 여기서 확인</button><button class="btn ghost" onclick="shareMemo('${s.id}')">${I.cart} 메모로 복사·전송</button></div>
  ${disclaimer('약사님이 더 나은 것을 권하실 수 있어요. 그때는 위 단추로 성분이 같은지 확인해 보세요.')}`;

/* ───────── 약사님이 권한 약 확인 ───────── */
/* 성분명을 모르는 어르신이 카운터에서 바로 확인할 수 있게 — 이름만 넣으면 같은 약인지 판정한다. */
const CHK = { q:'', sid:'' };
function verdictOf(mine, theirs){
  const f = activeFlags();
  if (!theirs) return { lv:'unknown', t:'무슨 성분인지 확인이 안 돼요', w:'약사님께 <b>“성분 이름이 뭔가요?”</b>라고 여쭤보세요. 상자 뒷면에도 적혀 있어요.' };
  const blocked = (theirs.avoid || []).some(a => (a.flags || []).some(x => f.includes(x)));
  const careful = (theirs.caution || []).some(c => (c.flags || []).some(x => f.includes(x)));
  let v;
  if (theirs.id === mine.id) v = { lv:'ok', t:'같은 약이에요', w:'이름만 다르고 <b>성분이 같아요</b>. 그대로 사셔도 괜찮습니다.' };
  else if ((theirs.contains || []).includes(mine.id)) v = { lv:'warn', t:'찾던 성분이 들어 있지만, 다른 성분도 함께예요', w:`<b>${esc(theirs.name)}</b>에는 찾으시던 성분 말고도 여러 성분이 같이 들어 있어요. 필요 없는 성분까지 드시게 될 수 있으니 <b>“한 가지 성분만 있는 걸로 주세요”</b>라고 하셔도 됩니다.` };
  else if (theirs.class === mine.class) v = { lv:'ok2', t:'같은 계열이에요', w:'같은 목적의 약이라 <b>대개 괜찮아요</b>. 다만 성분마다 위장·심장 부담이 조금씩 달라요.' };
  else v = { lv:'no', t:'목적이 다른 약이에요', w:`찾으시던 <b>${esc(mine.name)}</b>과(와) 계열이 달라요. <b>“이건 어디에 쓰는 약인가요?”</b>라고 꼭 여쭤보세요.` };
  if (blocked) return { lv:'stop', t:'제 상태에는 주의가 필요한 약이에요', w:`<b>${f.map(k => esc(FLAG_LABEL[k])).join(', ')}</b> — 이 조건에서는 조심해야 하는 약이에요. <b>“저는 ${f.map(k => esc(FLAG_LABEL[k])).join(', ')}이 있는데 괜찮을까요?”</b>라고 꼭 여쭤보세요.`, sub: v.t };
  if (careful) return { lv:'warn', t:'괜찮지만 한 번 여쭤보세요', w:v.w + `<br>제 상태(<b>${f.map(k => esc(FLAG_LABEL[k])).join(', ')}</b>)에서 주의가 붙는 약이에요.`, sub: v.t };
  return v;
}
function vCheck(sid){
  const s = byId(D.symptoms, sid); if (!s) return vHome();
  const bk = basket(s);
  const q = CHK.q.trim();
  let body = '';
  if (q) {
    const { d } = matchName(q, []);
    const theirs = d || null;
    const RANK = { stop:0, warn:1, ok:2, ok2:3, no:4, unknown:5 };   /* 주의가 먼저, 그다음 '같은 약' */
    const rows = bk.map(x => ({ x, v: verdictOf(x.d, theirs) }));
    rows.sort((p, r) => RANK[p.v.lv] - RANK[r.v.lv]);
    const main = rows[0], rest = rows.slice(1).filter(r => r.v.lv !== 'no');
    const card = (r, big) => {
      const v = r.v, x = r.x;
      const ico = { ok:I.check, ok2:I.check, warn:I.alert, stop:I.alert, no:I.x, unknown:I.info }[v.lv];
      return `<div class="vd ${v.lv}"><div class="vd-h">${ico}<b>${esc(v.t)}</b></div>
        <div class="vd-b"><div class="vd-row"><span>찾던 것</span><b>${esc(prodName(x.product) || ingrName(x.d))}</b></div>
        <div class="vd-row"><span>권한 것</span><b>${esc(theirs ? (prodName(theirs.products?.[0]?.name) || ingrName(theirs)) : q)}</b></div></div>
        ${big ? `<p class="vd-w">${v.w}</p>${v.sub ? `<p class="small muted" style="margin-top:6px">성분만 보면: ${esc(v.sub)}</p>` : ''}` : ''}
        ${big && theirs ? `<div class="actions" style="margin-top:10px"><button class="btn ghost" style="min-height:44px" onclick="go('/drug/${theirs.id}')">${I.pill} ${esc(ingrName(theirs))} 자세히 보기</button></div>` : ''}</div>`;
    };
    body = `<section class="sec">${card(main, true)}</section>
      ${rest.length ? `<details class="acc"><summary>다른 항목과도 비교<small>${rest.length}가지</small>${I.chev}</summary><div class="bd">${rest.map(r => card(r, true)).join('')}</div></details>` : ''}
      <div class="card" style="margin-top:12px"><b>이럴 때 쓰실 말</b>
      <ul class="plain" style="margin-top:8px">
        <li>“제가 찾던 것과 <b>성분이 같은가요?</b>”</li>
        <li>“<b>값이 많이 차이 나는데</b> 왜 그런가요?”</li>
        <li>“<b>한 가지 성분만</b> 있는 것으로 주세요.”</li>
        ${activeFlags().length ? `<li>“저는 <b>${activeFlags().map(k => esc(FLAG_LABEL[k])).join(', ')}</b>이 있는데 괜찮을까요?”</li>` : ''}
      </ul></div>`;
  } else {
    body = `<div class="empty card"><b>권하신 약의 이름을 넣어 주세요</b>상자에 큰 글씨로 적힌 이름이면 돼요. 사진으로 찍으셔도 됩니다.</div>`;
  }
  return `${topBar({ back:'이전' })}
  <div class="eyebrow">약사님이 권한 약 확인</div>
  <h1 style="font-size:1.375rem">이 약, 괜찮은가요?</h1>
  <p style="margin-top:6px">권하신 약 이름을 넣으시면 <b>찾던 것과 같은 약인지</b> 알려드려요.</p>
  <div class="search" style="margin-top:12px">${I.search}<input id="chk" placeholder="예: 게보린, 이지엔6, 탁센" value="${esc(CHK.q)}" autocomplete="off" style="font-size:1.0625rem"></div>
  <div class="sec"><button class="big-btn soft" onclick="go('/photo?mode=box')"><div class="ic">${I.eye}</div><div><b>상자를 사진으로 찍기</b><span>글자를 읽어 성분을 찾아드려요</span></div></button></div>
  ${body}
  ${disclaimer('약사님은 재고와 개인 상태를 보고 더 나은 것을 권하실 수 있어요. 이 화면은 성분이 같은지 확인해 드리는 것이지, 약사님 판단을 대신하지 않아요.')}`;
}

/* ───────── 계열 비교(차트는 코드로) ───────── */
function scatter(c){
  const pts = (c.members || []).map(id => drug(id)).filter(d => d?.risk?.gi && d?.risk?.cv);
  if (!pts.length) return '';
  const W = 400, H = 320, P = { l:28, r:20, t:44, b:40 };
  const x = v => P.l + (v - 0.5) / 5 * (W - P.l - P.r), y = v => H - P.b - (v - 0.5) / 5 * (H - P.t - P.b);
  const grid = [1, 2, 3, 4, 5].map(v => `<line x1="${x(v)}" y1="${P.t}" x2="${x(v)}" y2="${H - P.b}" stroke="var(--hairline)" stroke-dasharray="2 4"/><line x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}" stroke="var(--hairline)" stroke-dasharray="2 4"/>`).join('');
  const groups = {};
  pts.forEach(d => { const k = d.risk.gi + ',' + d.risk.cv; (groups[k] = groups[k] || []).push(d); });
  const dots = Object.entries(groups).map(([k, arr], i) => {
    const [gi, cv] = k.split(',').map(Number); const cx = x(gi), cy = y(cv);
    const anchor = cx > W - 90 ? 'end' : cx < P.l + 70 ? 'start' : 'middle'; const tx = anchor === 'end' ? cx + 10 : anchor === 'start' ? cx - 10 : cx;
    const above = cv >= 3; // 위쪽 점은 라벨을 아래로, 아래쪽 점은 위로
    const lines = arr.map((d, j) => { const dy = above ? 22 + j * 15 : -(14 + (arr.length - 1 - j) * 15); return `<text x="${tx}" y="${cy + dy}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="${d.rx === '전문' ? 'var(--rx)' : 'var(--text)'}">${esc(d.name.replace(/ \(.*?\)/, ''))}</text>`; }).join('');
    const rx = arr.every(d => d.rx === '전문');
    return `<circle cx="${cx}" cy="${cy}" r="${arr.length > 1 ? 8 : 7}" fill="${rx ? 'var(--rx)' : 'var(--primary)'}" opacity=".9"/>${arr.length > 1 && !rx && arr.some(d => d.rx === '전문') ? `<circle cx="${cx}" cy="${cy}" r="3" fill="var(--rx)"/>` : ''}${lines}`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.name)} 위장 부담과 심혈관 부담 비교 산점도">
    ${grid}
    <text x="${P.l}" y="${P.t - 22}" font-size="11" font-weight="700" fill="var(--muted)">↑ 심혈관 부담 (위로 갈수록 큼)</text>
    <text x="${W - P.r}" y="${H - 12}" text-anchor="end" font-size="11" font-weight="700" fill="var(--muted)">위장 부담 (오른쪽으로 갈수록 큼) →</text>
    <text x="${P.l + 4}" y="${H - P.b - 8}" font-size="10" fill="var(--normal)" font-weight="700">둘 다 낮음</text>
    ${dots}</svg>
    <div class="legend"><span><i style="background:var(--primary)"></i>약국·편의점 구입</span><span><i style="background:var(--rx)"></i>처방 필요</span><span>같은 자리의 성분은 한 점에 묶었어요</span></div>
    <p class="small muted" style="margin-top:6px">${esc(c.chartNote || '위치는 대규모 관찰연구·메타분석의 상대위험을 5단계로 옮긴 것으로, 개인 용량·기간·기저질환에 따라 달라져요.')}</p></div>`;
}
function vClass(id){
  const c = cls(id); if (!c) return vDrugs('', {});
  const cols = c.columns || [];

/* ───────── 영양제 ───────── */

  ${D.suppRules ? `<section class="sec card"><h2>라벨 읽는 법 5가지</h2>${list(D.suppRules.label, 'steps')}</section><section class="sec card"><h2>같이 먹을 때 조심할 조합</h2>${list(D.suppRules.stack, 'plain x')}${srcChips(D.suppRules.sources)}</section>` : ''}

function toggleCmp(id, on){ CMP = on ? [...new Set([...CMP, id])] : CMP.filter(x => x !== id); renderCmpBar(); }
function renderCmpBar(){ const b = document.getElementById('cmpbar'); const onSupp = location.hash.startsWith('#/supp') && !location.hash.startsWith('#/supp/'); if (!onSupp || CMP.length < 1) { b.classList.add('hide'); return; } b.classList.remove('hide'); b.innerHTML = `<div><span>${CMP.length}개 선택 · ${CMP.map(i => esc(supp(i)?.name || i)).join(', ')}</span><button onclick="go('/compare?ids=${CMP.join(',')}')">비교하기</button></div>`; }

  ${s.calc ? `<section class="sec card"><h2>내 제품 계산해 보기 <small>유효용량 대비 %</small></h2><p class="small muted" style="margin-top:4px">라벨의 1회 함량과 가격을 넣으면 임상 유효용량 대비 몇 %인지, 유효용량 1회분당 가격이 얼마인지 보여드려요.</p>

    <div class="calc-out"><div><small>유효용량 대비</small><b id="c-pct">—</b><span class="small muted">기준 ${esc(String(s.calc.typical))} ${esc(s.calc.unit)}${s.calc.note ? ' · ' + esc(s.calc.note) : ''}</span></div><div><small>유효용량 1회분 가격</small><b id="c-won">—</b><span class="small muted">낮을수록 경제적</span></div></div>

function vCompare(_, q){
  const ids = (q.ids || '').split(',').filter(Boolean); const items = ids.map(supp).filter(Boolean);
  if (!items.length) return vSupp();
  const rows = [['근거', s => evTag(s.evidence)], ['용도', s => esc(s.for || '')], ['유효 용량', s => esc(s.dose?.typical || '—')], ['상한(UL)', s => esc(s.dose?.ul || '—')], ['좋은 제형', s => esc(s.bestForm || s.forms?.[0]?.name || '—')], ['복용 시점', s => fmt(s.timingShort || s.timing || '—')], ['주의', s => fmt((s.cautions || []).slice(0, 2).join(' / '))]];
  const overlap = (D.suppRules?.overlaps || []).filter(o => o.ids.every(i => ids.includes(i)));
  return `${topBar({ back:'영양제' })}<h1>성분 비교</h1><p style="margin-top:6px">${items.map(s => esc(s.name)).join(' · ')}</p>
  ${overlap.length ? `<section class="sec">${overlap.map(o => `<div class="note">${I.alert}<span>${fmt(o.text)}</span></div>`).join('')}</section>` : ''}
  <section class="sec card"><div class="scroll-x"><table class="cmp"><thead><tr><th></th>${items.map(s => `<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(([lab, fn]) => `<tr><td>${lab}</td>${items.map(s => `<td>${fn(s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
  ${disclaimer(D.meta?.suppDisclaimer)}`;
}

/* ───────── 내 정보 ───────── */
function vMe(){
  const T = (k, t, sub) => `<div class="toggle"><div class="t"><b>${esc(t)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div><button class="sw ${ME[k] ? 'on' : ''}" role="switch" aria-checked="${!!ME[k]}" aria-label="${esc(t)}" onclick="ME['${k}']=!ME['${k}'];saveMe();route()"></button></div>`;
  return `${topBar()}
  <h1>내 정보</h1><p style="margin-top:6px">여기 표시한 상태에 따라 약 추천에 <b>주의 표시</b>가 붙어요. 진료실에서 의사가 처방 전에 꼭 묻는 것들이에요.</p>
  <section class="sec card"><h2>어르신 모드</h2>${hasArt('easy-mode') ? `<div class="art-row">${art('easy-mode', 'side')}<div class="t small muted">글씨와 단추가 커지고, 홈은 꼭 필요한 세 가지만 남아요. 어르신께 권해 드리세요.</div></div>` : ''}<div class="toggle"><div class="t"><b>큰 글씨 · 큰 단추 · 단순한 홈</b><span>사진 찍기 / 어디가 불편한지 / 오늘 약 체크, 세 가지만</span></div><button class="sw ${ME.easy ? 'on' : ''}" role="switch" aria-checked="${!!ME.easy}" aria-label="어르신 모드" onclick="ME.easy=!ME.easy;saveMe();setFs(ME.easy?'20px':'16px')"></button></div></section>
  <section class="sec card"><h2>글자 크기</h2><div class="seg" style="margin-top:12px">${[['16px', '보통'], ['18px', '크게'], ['20px', '더 크게']].map(([k, n]) => `<button class="${(localStorage.getItem('yakjido.fs') || '16px') === k ? 'on' : ''}" onclick="setFs('${k}')">${n}</button>`).join('')}</div></section>
  <section class="sec card"><h2>나이</h2><div class="seg" style="margin-top:12px">${[['adult', '성인'], ['senior', '65세 이상'], ['child', '소아·청소년']].map(([k, n]) => `<button class="${ME.age === k ? 'on' : ''}" onclick="ME.age='${k}';saveMe();route()">${n}</button>`).join('')}</div></section>
  ${ME.age === 'child' ? `<section class="sec card"><h2>아이 정보</h2><p class="small" style="margin-top:6px">${ME.child?.weight ? esc((ME.child.name || '아이') + ' · ' + ME.child.weight + ' kg' + (monthsFrom(ME.child.birth) != null ? ' · ' + kidAgeText(monthsFrom(ME.child.birth)) : '')) : '아직 몸무게가 없어요.'}</p><div class="actions"><button class="btn ghost" onclick="go('/kids')">${I.user} 아이 해열제 용량 계산</button></div></section>` : ''}
  <section class="sec card"><h2>해당하는 것을 켜 주세요</h2>
    ${T('pregnant', '임신 중이거나 수유 중', '소염진통제는 임신 20주 이후 피해요')}
    ${T('ulcer', '위궤양·위장출혈 병력', '소염진통제를 고를 때 가장 중요해요')}
    ${T('kidney', '신장 질환', '소염진통제·마그네슘 등에 주의')}
    ${T('liver', '간 질환', '아세트아미노펜 용량에 주의')}
    ${T('alcohol', '술을 자주 마심', '주 3회 이상이면 켜 주세요')}
    ${T('heart', '심장·혈관 질환, 고혈압', '일부 소염진통제·코감기약에 주의')}
    ${T('asthma', '천식', '아스피린·소염진통제로 악화될 수 있어요')}
    ${T('anticoag', '항응고제·항혈소판제 복용', '와파린·아스피린·클로피도그렐 등')}
    ${T('gout', '통풍', '아스피린 저용량은 요산을 올려요')}
    ${T('glaucoma', '녹내장', '일부 감기약·멀미약 성분에 주의')}
    ${T('bph', '전립선비대', '코감기약·항히스타민제로 소변이 막힐 수 있어요')}
    <p class="privacy">${I.lock}입력한 내용은 이 기기에만 저장되고 어디로도 전송되지 않아요.</p>
  </section>
  <section class="sec card"><h2>지금 먹는 약 <small class="muted" style="font-weight:500;font-size:.8125rem">중복 성분을 잡아드려요</small></h2>
    <p class="small" style="margin-top:6px">감기약·진통제·처방약을 등록해 두면, 증상별 추천에서 <b>같은 성분이 겹치는지</b> 알려드려요.</p>
    <div class="taking">${takingItems().map(x => `<span class="chip">${esc(x.name)}<button aria-label="${esc(x.name)} 빼기" onclick="${x.id.startsWith('pub:') ? `togglePub('${x.id.slice(4)}')` : `toggleTaking('${x.id}')`}">${I.x}</button></span>`).join('') || '<span class="small muted">아직 등록한 약이 없어요.</span>'}</div>
    <div class="actions" style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" onclick="go('/photo')">${I.eye} 사진으로 등록</button><button class="btn ghost" style="flex:1" onclick="go('/pill')">${I.search} 알약으로 찾기</button></div>
    <div class="search" style="margin-top:12px">${I.search}<input id="mq" placeholder="약 이름으로 찾아 등록 (예: 타이레놀)" value="${esc(MQ)}" autocomplete="off"></div>
    ${MQ.trim() ? `<div class="card rows" style="margin-top:8px">${(search(MQ.trim()).filter(h => h.h.startsWith('/drug/')).slice(0, 6).map(h => { const id = h.h.slice(6); const on = (ME.taking || []).includes(id); return `<button class="row" onclick="${on ? '' : `toggleTaking('${id}');`}MQ='';route()"><div class="ic">${I.pill}</div><div class="body"><b>${esc(h.t)}</b><span>${on ? '이미 등록돼 있어요' : '눌러서 내 약통에 담기'}</span></div>${I.chev}</button>`; }).join('')) || '<div class="empty">찾는 약이 없어요</div>'}</div>` : ''}
    <div class="actions"><button class="btn ghost" onclick="go('/schedule')">${I.clock} 복용 시간 알림 만들기</button></div>
  </section>
  <section class="sec card"><h2>알아두면 좋은 것</h2><p class="small" style="margin-top:6px">상품명과 성분명, 해열제는 치료가 아니라는 것, 소염제는 한 가지만 — 짧은 건강정보 ${(D.tips || []).length}가지.</p><div class="actions"><button class="btn ghost" onclick="go('/tips')">${I.info} 읽어 보기</button></div></section>
  <section class="sec card"><h2>사진 서버 <small class="muted" style="font-weight:500;font-size:.8125rem">관리자용</small></h2><p class="small" style="margin-top:6px">사진 읽기(Gemini) 서버 주소예요. yakjido/server 를 배포한 뒤 붙여 넣으세요. 비워 두면 기본값(${esc(D.meta?.photoEndpoint || '없음')}).</p><div class="search" style="margin-top:10px">${I.link}<input id="ep" placeholder="https://yakjido-photo.xxx.workers.dev" value="${esc((() => { try { return localStorage.getItem('yakjido.photo') || ''; } catch (e) { return ''; } })())}" onchange="try{localStorage.setItem('yakjido.photo',this.value.trim())}catch(e){};toast('저장했어요')"></div></section>
  <section class="sec card"><h2>이 앱에 대해</h2><p class="small" style="margin-top:6px">${esc(D.meta?.about || '')}</p><div class="actions"><button class="btn line" onclick="go('/about')">근거·검수 기준 보기</button></div></section>
  <p class="small muted" style="margin-top:16px;text-align:center">약지도 v${esc(D.meta?.version || '')} · 빌드 ${BUILD}</p>`;
}
function vAbout(){
  const S = D.sources || {};
  return `${topBar({ back:'내 정보' })}<h1>근거와 검수 기준</h1>
  <section class="sec card"><h2>이렇게 만들었어요</h2>${list(D.meta?.method || [])}</section>
  <section class="sec card"><h2>참고 문헌·지침 <small>${Object.keys(S).length}건</small></h2><div class="rows">${Object.entries(S).map(([k, s]) => `<a class="row" href="${esc(s.url)}" target="_blank" rel="noopener" style="text-decoration:none"><div class="body"><b>${esc(s.label)}</b><span>${esc(s.type || '')}${s.note ? ' · ' + esc(s.note) : ''}</span></div>${I.link}</a>`).join('')}</div></section>
  ${disclaimer()}`;
}

document.addEventListener('input', e => { if (!e.target.closest('.calc')) return; const id = location.hash.split('/')[2]?.split('?')[0]; const s = supp(id); if (!s?.calc) return; const amt = +document.getElementById('c-amt').value, per = +document.getElementById('c-per').value || 1, price = +document.getElementById('c-price').value, n = +document.getElementById('c-n').value; const pct = document.getElementById('c-pct'), won = document.getElementById('c-won'); if (amt > 0) { const perServing = amt * per; const r = perServing / s.calc.typical; pct.textContent = Math.round(r * 100) + '%'; pct.style.color = r > (s.calc.ulRatio || 99) ? 'var(--alert)' : r < 0.5 ? 'var(--caution)' : 'var(--primary-deep)'; if (price > 0 && n > 0) { const unitPrice = price / n; const effDoses = perServing / s.calc.typical; won.textContent = Math.round(unitPrice * per / effDoses).toLocaleString('ko-KR') + '원'; } else won.textContent = '—'; } else { pct.textContent = '—'; won.textContent = '—'; } });
function setFs(v){ try { localStorage.setItem('yakjido.fs', v); } catch (e) {} document.documentElement.style.setProperty('--fs', v); route(); }
try { const fs = localStorage.getItem('yakjido.fs'); if (fs) document.documentElement.style.setProperty('--fs', fs); } catch (e) {}
/* ───────── 시작 ───────── */
try { if (!localStorage.getItem('yakjido.seen') && !location.hash) { localStorage.setItem('yakjido.seen', '1'); location.hash = '#/guide/1'; } } catch (e) {}
armNotifications();
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
