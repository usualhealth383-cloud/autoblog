.kind .cnt{position:absolute;top:10px;right:10px;min-width:22px;height:22px;display:grid;place-items:center;
  border-radius:11px;background:var(--primary);color:var(--on-primary);font-size:.75rem;font-weight:800}
.kind-subs{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.kind-sub{display:flex;flex-direction:column;gap:4px;padding:15px 15px;border-radius:var(--r-card);
  border:1px solid var(--hairline);background:var(--card);cursor:pointer;text-align:left;min-height:56px}
.kind-sub.on{border-color:var(--primary);background:var(--tint)}
.kind-sub .tk{display:flex;align-items:center;gap:7px}
.kind-sub .tk svg.i{color:var(--primary);flex:none}
.kind-sub b{font-size:1.0625rem;font-weight:700;line-height:1.4}
.kind-sub span{font-size:.875rem;line-height:1.55;color:var(--muted)}
.kind-sub .ach-tag{font-style:normal;align-self:flex-start;margin-top:3px;font-size:.75rem;font-weight:800;
  padding:2px 8px;border-radius:6px;background:var(--caution-tint);color:var(--caution)}
.kind-note{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:.875rem;line-height:1.6;color:var(--body)}
.kind-note svg.i{color:var(--faint);flex:none;margin-top:2px}
.kind-why{display:flex;align-items:flex-start;gap:10px;margin-top:18px;padding:14px 15px;border-radius:var(--r-card);
  background:var(--card);border:1px solid var(--hairline)}
.kind-why svg.i{color:var(--primary);flex:none;margin-top:2px}
.kind-why b{font-size:.9375rem;font-weight:800}
.kind-why p{font-size:.875rem;line-height:1.7;color:var(--body);margin-top:5px}
.ix-chip.approx{border:1px dashed var(--primary);background:transparent}
.tog-cta{display:flex;align-items:center;gap:11px;width:100%;margin-top:14px;padding:14px 15px;
  border-radius:var(--r-card);border:1px solid var(--primary);background:var(--card);text-align:left;cursor:pointer}
.tog-cta>svg.i{color:var(--primary);flex:none}
.tog-cta>svg.i:last-child{color:var(--faint);margin-left:auto}
.tog-cta div{flex:1;min-width:0}
.tog-cta b{display:block;font-size:1rem;font-weight:800;color:var(--primary)}
.tog-cta span{display:block;font-size:.8125rem;line-height:1.5;color:var(--body);margin-top:2px}
.ix-lead{font-size:1rem;line-height:1.7;color:var(--body);margin:6px 0 14px}
.ix-sum{display:flex;align-items:flex-start;gap:10px;padding:14px 15px;border-radius:var(--r-card);margin-bottom:14px;border:1px solid}
.ix-sum svg.i{flex:none;margin-top:2px}
.ix-sum b{display:block;font-size:1.0625rem;font-weight:800;line-height:1.4}
.ix-sum p{font-size:.9375rem;line-height:1.6;margin-top:4px}
.ix-sum.stop{background:var(--alert-tint);border-color:var(--alert);color:var(--alert)}
.ix-sum.warn{background:var(--caution-tint);border-color:var(--caution);color:var(--caution)}
.ix-sum.ok{background:var(--card);border-color:rgba(26,121,70,.35);color:var(--normal)}
.ix-sum p{color:var(--body)}
.ix-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ix-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--r-pill);
  background:var(--tint2);font-size:.875rem;font-weight:600;color:var(--body);max-width:100%}
.ix-chip a{color:inherit;text-decoration:none;overflow-wrap:anywhere}
.ix-chip.unk{background:transparent;border:1px dashed var(--hairline)}
.ix-chip em{font-style:normal;font-size:.75rem;color:var(--faint);font-weight:700}
.ix-unk,.ix-lead+.ix-unk{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;
  background:var(--tint2);color:var(--body);font-size:.875rem;line-height:1.55;margin-bottom:12px}
.ix-unk svg.i{color:var(--faint);flex:none;margin-top:2px}
.ix{border-radius:var(--r-card);border:1px solid var(--hairline);background:var(--card);padding:var(--s4);margin-bottom:12px}
.ix.stop{border-color:var(--alert)} .ix.warn{border-color:var(--caution)}
.ix-h{display:flex;align-items:flex-start;gap:8px;font-size:1.0625rem;font-weight:800;line-height:1.4}
.ix-h>svg.i{margin-top:3px}
.ix-h b{flex:1;min-width:0;overflow-wrap:break-word;word-break:keep-all}
.ix.stop .ix-h{color:var(--alert)} .ix.warn .ix-h{color:var(--caution)} .ix.info .ix-h{color:var(--primary)}
.ix-lv{flex:none;margin-top:2px;font-size:.6875rem;font-weight:800;padding:3px 9px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.ix-w{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.ix-p{display:inline-flex;flex-direction:column;padding:7px 11px;border-radius:9px;background:var(--tint2);
  font-size:.875rem;font-weight:700;line-height:1.35;max-width:100%;overflow-wrap:anywhere}
.ix-p em{font-style:normal;font-size:.6875rem;font-weight:600;color:var(--faint);margin-top:1px}
.ix-plus{font-weight:800;color:var(--faint);font-size:.9375rem}
/* 조합 → 장기: 무엇이 어디를 건드리는지 한눈에 */
.ix-arrow{display:inline-grid;place-items:center;color:var(--faint)} .ix-arrow svg.i{width:16px;height:16px}
.ix-org{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 7px;border-radius:9px;background:var(--tint);color:var(--primary-deep);font-size:.875rem;font-weight:800;border:1px solid transparent}
.ix-org .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--card);color:inherit} .ix-org .ic svg.i{width:17px;height:17px}
.ix.stop .ix-org{background:var(--alert-tint);color:var(--alert)} .ix.warn .ix-org{background:var(--caution-tint);color:var(--caution)}
.ix-why{margin-top:10px;font-size:.9375rem;line-height:1.7;color:var(--body)}
.ix-do{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:11px 12px;border-radius:10px;
  background:var(--tint2);font-size:.9375rem;line-height:1.65;color:var(--ink)}
.ix-do svg.i{color:var(--normal);flex:none;margin-top:3px}
.ix-ask{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding:14px 15px;border-radius:var(--r-card);
  background:var(--card);border:1px solid var(--hairline)}
.ix-ask svg.i{color:var(--primary);flex:none;margin-top:2px}
.ix-ask b{font-size:.9375rem;font-weight:800}
.ix-ask p{font-size:.9375rem;line-height:1.6;color:var(--body);margin-top:4px}
.ix-ask p.small{font-size:.8125rem;color:var(--muted)}
.ix-cta{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ix-cta .btn{justify-content:center;text-decoration:none}
details.ix-how{margin-top:16px;background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card)}
details.ix-how summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:13px 15px;font-size:.9375rem;font-weight:700;min-height:44px}
details.ix-how summary::-webkit-details-marker{display:none}
details.ix-how summary svg.i{color:var(--faint);transition:transform .2s}
details.ix-how[open] summary svg.i{transform:rotate(90deg)}
details.ix-how .bd{padding:0 15px 15px}
details.ix-how .bd p{font-size:.875rem;line-height:1.7;color:var(--body);margin-bottom:9px}
details.ix-how .bd p:last-child{margin-bottom:0}

.gauge{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;margin-top:10px}
.gauge .num{display:flex;align-items:baseline;gap:2px;font-variant-numeric:tabular-nums}
.gauge .num b{font-size:2.25rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.gauge .num small{font-size:.875rem;font-weight:700;color:var(--muted)}
.gauge .bar{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;height:14px}
.gauge .bar i{border-radius:4px;background:var(--tint2);opacity:.9}
.gauge .bar i.lo.on{background:var(--normal)} .gauge .bar i.mid.on{background:var(--caution)} .gauge .bar i.hi.on{background:var(--alert)}
.gauge .bar i{background:var(--card);border:1px solid var(--hairline)} .gauge .bar i.on{border-color:transparent}
.gauge .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:2px}
.gauge .lbl{grid-column:2;display:flex;justify-content:space-between;font-size:.6875rem;font-weight:700;color:var(--muted)}
.gauge .lbl span:nth-child(2){transform:translateX(-10%)}
.ach-unk{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:10px 12px;border-radius:10px;
  background:var(--tint2);color:var(--body);font-size:.875rem;line-height:1.55}
.ach-unk svg.i{color:var(--faint);flex:none;margin-top:2px}
.ach-unk b{color:var(--ink)}
.ach-go{display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;padding:12px 13px;border-radius:10px;
  background:var(--tint2);border:1px solid var(--hairline);text-align:left;cursor:pointer;font-size:.9375rem;line-height:1.5;color:var(--body)}
.ach-go>svg.i{color:var(--primary);flex:none}
.ach-go>svg.i:last-child{margin-left:auto;color:var(--faint)}
.ach-go span{flex:1;min-width:0}
.ach-go b{color:var(--ink)}
.ach-risk{margin-top:10px;padding:12px 13px;border-radius:10px;background:var(--card);border:1px solid var(--hairline)}
.ach-risk>b{display:block;font-size:.9375rem;font-weight:800;margin-bottom:6px}
.ach-risk p{font-size:.875rem;line-height:1.65;color:var(--body);margin-bottom:6px}
.ach-risk p:last-child{margin-bottom:0}
.ach-risk p.small{color:var(--muted);font-size:.8125rem}
.ach-ask{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:.9375rem;line-height:1.5;color:var(--body)}
.ach-ask svg.i{color:var(--primary);flex:none;margin-top:2px}

/* 약 상세 */
.drug-hero{display:flex;flex-direction:column;gap:6px}
.drug-hero .cls{font-size:.8125rem;font-weight:600;color:var(--primary);display:inline-flex;align-items:center;min-height:32px}
.drug-hero h1{font-size:1.625rem}
.drug-hero .en{color:var(--muted);font-size:.9375rem;font-weight:500}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s4)}
.kv div{background:var(--tint2);border-radius:12px;padding:12px 14px}
.kv div small{display:block;font-size:.6875rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.kv div b{display:block;font-size:.9375rem;font-weight:700;margin-top:2px;line-height:1.35}
.dose-hero{background:var(--tint);border-radius:14px;padding:var(--s4);margin-top:var(--s4)}
.dose-hero .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:var(--primary-deep)}
.dose-hero small{display:block;color:var(--muted);font-size:.8125rem;margin-top:2px}
.risk-bars{display:flex;flex-direction:column;gap:10px;margin-top:var(--s3)}
.rb{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:10px;font-size:.8125rem}
.rb .track{height:8px;border-radius:999px;background:var(--tint);overflow:hidden}
.rb .fill{height:100%;border-radius:999px;background:var(--primary)}
.rb .fill.l3{background:var(--caution)} .rb .fill.l4,.rb .fill.l5{background:var(--alert)}
.rb .v{text-align:right;color:var(--muted);font-weight:600}
.products{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
.prod{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:10px 12px;border:1px solid var(--hairline);border-radius:12px;font-size:.875rem}
.prod b{font-weight:700;overflow-wrap:anywhere}
.pain-note{display:block;font-size:.8125rem;color:var(--muted);margin-top:3px;line-height:1.45}
.pain-row{margin-top:4px}
.prod span{display:block;color:var(--muted);font-size:.75rem;overflow-wrap:anywhere}   /* 「알릴이소프로필아세틸우레아」처럼 긴 성분명 한 낱말이 사진 옆 좁은 칸을 넘었다(2026-10-06) */
.tabs{display:flex;gap:6px;margin:var(--s4) 0 var(--s3);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 15px;border-radius:var(--r-pill);font-size:.9375rem;font-weight:600;color:var(--muted);background:var(--tint2);min-height:46px}   /* 44 딱 맞추면 소수점 배치에서 43.9999 로 재져 손가락 기준에 걸렸다(2026-10-06) — 다른 단추처럼 46 */
.tab.on{background:var(--text);color:var(--card)}
.pane{display:none}.pane.on{display:block}

/* 비교 차트 (코드로 그린 진짜 데이터) */
.chart{margin-top:var(--s3);background:var(--tint2);border-radius:14px;padding:var(--s3)}
.chart svg{width:100%;height:auto;display:block;font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);margin-top:var(--s2);font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
table.cmp{width:100%;border-collapse:collapse;font-size:.8125rem;margin-top:var(--s3)}
table.cmp th{text-align:left;font-weight:700;color:var(--muted);font-size:.6875rem;letter-spacing:.05em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--hairline)}
table.cmp td{padding:10px 6px;border-bottom:1px solid var(--hairline);vertical-align:top;line-height:1.45}
table.cmp td:first-child{font-weight:700;white-space:nowrap}
.scroll-x{overflow-x:auto;margin:0 calc(-1 * var(--s4));padding:0 var(--s4)}

/* 영양제 비교 */
.supp-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.ev{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:6px}
.ev.strong{background:var(--normal-tint);color:var(--normal)} .ev.mid{background:var(--caution-tint);color:var(--caution)} .ev.weak{background:var(--tint);color:var(--muted)}
.cmp-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;width:min(460px,100%);padding:0 var(--s4);z-index:5;pointer-events:none}
.cmp-bar>div{pointer-events:auto;background:var(--text);color:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.875rem}
.cmp-bar button{background:var(--card);color:var(--text);border-radius:9px;padding:8px 14px;font-weight:700;font-size:.8125rem;min-height:36px}
.checkrow{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);min-height:52px}
.checkrow:last-child{border-bottom:0}
.checkrow input{width:20px;height:20px;accent-color:var(--primary);flex:none}
.checkrow label{flex:1;font-size:.9375rem;font-weight:600}
.checkrow small{color:var(--muted);font-weight:500;display:block;font-size:.8125rem}

/* 내 정보 */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);min-height:56px}
.toggle:last-child{border-bottom:0}
.toggle .t b{display:block;font-size:.9375rem;font-weight:600}
.toggle .t span{display:block;font-size:.8125rem;color:var(--muted)}
/* 스위치 — 누르는 자리는 48×46(44px 이상), 보이는 막대는 가운데 28px.
   껐을 때 막대가 안 보이던 것(대비 1.29:1)을 테두리 3.4:1 로 고쳤다. */
.sw{position:relative;width:48px;height:46px;border-radius:999px;background:none;flex:none}
.sw::before{content:"";position:absolute;left:0;top:9px;width:48px;height:28px;border-radius:999px;background:var(--tint2);box-shadow:inset 0 0 0 2px var(--ui-line);transition:background .2s,box-shadow .2s}
.sw::after{content:"";position:absolute;z-index:1;top:12px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3),0 0 0 1px rgba(0,0,0,.14);transition:transform .2s}
.sw.on::before{background:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)} .sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--tint2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:9px;font-size:.9375rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--primary-deep);font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.10),inset 0 0 0 2px var(--primary)}
.privacy{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.8125rem;margin-top:var(--s3)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 var(--s5);border-radius:12px;font-weight:700;font-size:.9375rem;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-raised);width:100%}
.btn.ghost{background:var(--tint);color:var(--primary-deep);box-shadow:none}
.btn.line{background:var(--card);color:var(--text);border:1.5px solid var(--ui-line);box-shadow:none}
.btn+.btn{margin-top:var(--s2)}
.actions{margin-top:var(--s4)}
.link{color:var(--primary);font-weight:600;text-decoration:none;display:inline-block;padding:2px 0;min-height:24px}
.link:hover{text-decoration:underline}

/* 탭바 */
nav.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hairline);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 0;font-size:.6875rem;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabbar button.on{color:var(--primary)}
nav.tabbar button svg.i{width:22px;height:22px}
nav.tabbar button.on svg.i{stroke-width:2.2}

/* 검색 결과 */
.results{margin-top:var(--s3)}
.hit{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hairline);text-align:left;width:100%;min-height:56px}
.hit:last-child{border-bottom:0}
.hit .k{font-size:.6875rem;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--tint);color:var(--primary-deep);flex:none;min-width:44px;text-align:center}
.hit .k.s{background:var(--accent-tint);color:var(--accent)} .hit .k.p{background:var(--tint2);color:var(--muted)}
.hit b{display:block;font-size:.9375rem;overflow-wrap:anywhere}
.hit span{display:block;font-size:.8125rem;color:var(--muted)}
.hit mark{background:none;color:var(--primary);font-weight:800}
.empty{padding:var(--s6) var(--s4);text-align:center;color:var(--muted);font-size:.9375rem}
.empty b{display:block;color:var(--text);margin-bottom:6px}

/* 낱알 찾기·식약처 제품 */
.pillimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--tint2);border:1px solid var(--hairline);flex:none}
.pillimg.big{width:100%;height:auto;max-height:220px;object-fit:contain;background:#fff;margin-top:var(--s3)}
.pub-hero{display:flex;gap:var(--s3);align-items:center}.pub-hero h1{overflow-wrap:anywhere}
.qa h3{margin-top:var(--s4);font-size:.9375rem;color:var(--primary-deep)}
.qa p{white-space:pre-line;font-size:.9375rem;line-height:1.7;margin-top:4px;overflow-wrap:anywhere;word-break:normal}
.shape-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.swatch{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--card);font-size:.8125rem;font-weight:600;min-height:36px}
.swatch i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:inline-block}
.swatch.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.loading{padding:var(--s5);text-align:center;color:var(--muted);font-size:.875rem}
/* 약 알아보기(사진·식별) */
.big-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:18px;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-raised);min-height:76px}
.big-btn .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.big-btn .ic svg.i{width:26px;height:26px;stroke:var(--on-primary)}
.big-btn b{display:block;font-size:1.125rem;line-height:1.3}
.big-btn span{display:block;font-size:.8125rem;opacity:.9;margin-top:2px}
.big-btn.soft{background:var(--card);color:var(--text);border:1px solid var(--hairline);box-shadow:var(--shadow-card)}
.big-btn.soft .ic{background:var(--tint)} .big-btn.soft .ic svg.i{stroke:var(--primary)}
.big-btn+.big-btn{margin-top:10px}
.shape-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.shape-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--card);border:1px solid var(--hairline);font-size:.75rem;font-weight:700;min-height:64px}
.shape-btn svg{width:28px;height:28px;stroke:var(--text);stroke-width:1.8;fill:var(--tint2)}
.shape-btn.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.color-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;background:var(--card);border:1px solid var(--hairline);font-size:.7rem;font-weight:700;min-height:64px}
.color-btn i{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.color-btn.on{border-color:var(--primary);background:var(--tint);color:var(--primary-deep)}
.pill-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--s3)}
.pill-card{background:var(--card);border:1px solid var(--hairline);border-radius:14px;overflow:hidden;text-align:left;box-shadow:var(--shadow-card);display:flex;flex-direction:column}
.pill-card .ph{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;border-bottom:1px solid var(--hairline);position:relative}
.pill-card .ph img{width:100%;height:100%;object-fit:contain}
.pill-card .ph .pglyph,.pglyph{width:100%;height:100%;display:block;padding:6px}
.pill-card .ph .ph-empty{color:var(--faint);font-size:.75rem}
.pill-card .ph .sc{position:absolute;top:6px;left:6px;font-size:.6875rem;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--primary);color:var(--on-primary)}
.pill-card .bd{padding:10px 12px 12px}
.pill-card b{display:block;font-size:.875rem;line-height:1.3;overflow-wrap:anywhere}
.pill-card .imp{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pill-card .imp span{font-size:.6875rem;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--tint2);border:1px solid var(--hairline);font-family:ui-monospace,monospace;letter-spacing:.03em}
.pill-card small{display:block;color:var(--muted);font-size:.75rem;margin-top:4px}
.pill-hero{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.pill-hero .ph{width:120px;height:120px;border-radius:14px;background:#fff;border:1px solid var(--hairline);display:grid;place-items:center;overflow:hidden}
.pill-hero .ph img{width:100%;height:100%;object-fit:contain}

.kv3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:var(--s3)}
.kv3 div{background:var(--tint2);border-radius:10px;padding:8px 10px}
.kv3 small{display:block;font-size:.6875rem;font-weight:700;color:var(--muted)} .kv3 b{display:block;font-size:.9375rem;margin-top:1px;overflow-wrap:anywhere}
.photo-box{border:2px dashed var(--hairline);border-radius:18px;padding:var(--s5) var(--s4);text-align:center;background:var(--card)}
.photo-box img{max-width:100%;max-height:260px;border-radius:12px;margin-top:10px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--hairline);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.found{background:var(--card);border:1px solid var(--hairline);border-radius:14px;padding:12px 14px;margin-top:10px}
.found b{font-size:1rem}
.found .m{font-size:.8125rem;color:var(--muted);margin-top:2px}
.found .simple{margin-top:8px;font-weight:700;line-height:1.5}
.found .chips{margin-top:8px}
/* 어르신 모드 홈 */
.easy-home .big-btn{min-height:96px}
.easy-home .big-btn b{font-size:1.375rem}
/* 삽화 — art/ 폴더에 파일이 있을 때만 렌더된다(없으면 빌드가 아예 넣지 않음) */
.art{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden;margin:var(--s4) 0 0;line-height:0}
.art img{display:block;width:100%;height:auto}
/* 원본 비율 그대로 — 원형 비네트가 잘리지 않게 crop 하지 않는다 */
.art.spot{max-width:200px;margin-left:auto;margin-right:auto;border-radius:50%;border:0;background:none}
.art.side{width:88px;height:88px;flex:none;border-radius:50%;border:0;background:none;margin:0}
.art.side img{width:88px;height:88px;object-fit:cover}
.art-row{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s4)}
.art-row .t{flex:1;min-width:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .art img{filter:brightness(.88) saturate(.95)}}
:root[data-theme="dark"] .art img{filter:brightness(.88) saturate(.95)}
/* 답 카드 — 상품명이 주인공 */
.buy-item{grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px}
.buy-item.has-img{grid-template-columns:44px 44px 1fr auto}
.buy-item .k{font-size:.6875rem;padding:5px 0;align-self:center}
.buy-item .bi-t{min-width:0}
.buy-item .bi-t b{font-size:1.0625rem;font-weight:700;line-height:1.3;display:block;overflow-wrap:anywhere}
.buy-item .bi-t small{display:block;color:var(--muted);font-size:.8125rem;margin-top:2px;overflow-wrap:anywhere}
.buy-item .bi-t small.opt-t{color:var(--caution);font-weight:700}
.buy-item .bi-r{display:flex;align-items:center;gap:4px}
.buy-item .bi-r svg.i{color:var(--faint);width:18px;height:18px;transition:transform .2s}
.buy-item.open .bi-r svg.i{transform:rotate(90deg)}
.buy-item .badge.stop,.buy-item .badge.warn{margin-top:4px;display:inline-flex}
.buy-item.do{cursor:default;background:var(--tint2)}
.buy-item.do .bi-r{opacity:.85}
/* 병원 가야 할 때 — 한 줄, 자세히는 눌러서 */
.gate{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--alert-tint);min-height:52px}
.gate .lb{font-weight:800;color:var(--alert);font-size:.8125rem;flex:none}
.gate .tx{flex:1;font-size:.9375rem;line-height:1.45;color:var(--text)}
.gate svg.i{color:var(--alert);flex:none}
.bag-line{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin-top:var(--s4);padding:12px 14px;border-radius:14px;background:var(--card);border:1px dashed var(--hairline);color:var(--body);font-size:.9375rem;font-weight:600;min-height:52px;line-height:1.45}
.bag-line.on{border-style:solid;border-color:var(--normal);background:var(--normal-tint);color:var(--normal)}
.bag-line.sm{margin-top:10px;min-height:46px;font-size:.875rem;background:var(--tint2);border-color:transparent;color:var(--muted)}
.bag-line span{flex:1;min-width:0}
.bag-line svg.i{flex:none}
.mixline{display:flex;align-items:center;gap:9px;width:100%;text-align:left;margin-top:10px;padding:11px 13px;border-radius:12px;background:var(--tint);color:var(--primary-deep);font-size:.9375rem;font-weight:600;min-height:48px;line-height:1.45}
.mixline span{flex:1;min-width:0}
.mixline svg.i{flex:none}
.rxline{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 12px;border-radius:var(--r-pill);background:var(--rx-tint);color:var(--rx);font-size:.8125rem;font-weight:700}
/* 약국에서 보여드리기 */
.show-card{background:var(--card);border:1.5px solid var(--primary);border-radius:20px;padding:var(--s4);margin-top:var(--s4);box-shadow:0 10px 30px rgba(var(--primary-rgb),.12)}
.show-head{font-size:.8125rem;font-weight:800;color:var(--primary);letter-spacing:.02em;padding-bottom:10px;border-bottom:1px dashed var(--hairline)}
.show-list{list-style:none;margin-top:6px}
.show-list li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hairline)}
.show-list li:last-child{border-bottom:0}
.show-list li>div{flex:1;min-width:0}
.show-list .n{width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:.875rem;flex:none}
.show-list b{display:block;font-size:1.25rem;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.show-list small{display:block;color:var(--muted);font-size:.875rem;margin-top:2px}
.show-ask{margin-top:12px;padding-top:12px;border-top:1px dashed var(--hairline);font-size:1rem;font-weight:600;color:var(--body);line-height:1.6}
.show-ach{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--caution-tint);color:var(--caution);font-size:.9375rem;font-weight:600;line-height:1.5}
.show-card.tone-stop{border-color:var(--alert)} .show-card.tone-warn{border-color:var(--caution)}

/* 출처 칩은 「저자·연도」까지만. 예전 규칙은 괄호 「(」에서만 잘라서, 「—」로 쓴 출처 44개가
   문장째로 화면에 깔렸다(어지럼 화면이 출처 문단 여섯 개로 끝나고 있었다).
   연도(19xx·20xx)를 만나면 거기서 끊고, 연도가 없으면 「—」·「·」 앞에서 끊는다. */
const srcShort = t => {
  let x = String(t || '').replace(/\*\*/g, '').split(' (')[0];
  const m = x.match(/^(.{0,60}?(?:19|20)\d{2}[a-z]?)\b/);
  /* 「2023 AGS Beers Criteria」처럼 「연도로 시작」하는 출처는 연도만 남으면 무엇인지 알 수 없다 */
  if (m && m[1].length >= 10) return m[1];
  for (const sep of [' — ', ' – ', ' - ', ' · ']) if (x.includes(sep)) {
    const head = x.split(sep)[0];
    /* 「식약처 허가사항」처럼 앞머리가 같은 출처가 여럿이면 뒤를 조금 더 붙여 구분한다 */
    const tail = x.slice(head.length + sep.length);
    const one = head.length < 12 && tail ? head + ' — ' + tail.split(/[(,]/)[0].trim() : head;
    return one.length > 46 ? one.slice(0, 44).replace(/[\s,·]+$/, '') + '…' : one;
  }
  return x.length > 46 ? x.slice(0, 44).replace(/[\s,·]+$/, '') + '…' : x;
};

/* 본문 안 [[drug:id|표시]] 링크와 **강조** 처리 */
function fmt(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[\[(\w+):([\w-]+)\|([^\]]+)\]\]/g, (m, k, id, lab) => `<a class="link" href="#/${k}/${id}">${lab}</a>`)/* 「확인 필요」는 원문을 아직 확인하지 못한 값이라는 표시 — 조용한 칩으로 */.replace(/\[([^\[\]]*확인 필요[^\[\]]*)\]/g, '<span class="chk">$1</span>')
  /* 위기·응급 번호는 눌러서 바로 걸리게. 글로 읽고 직접 눌러 거는 것과, 한 번에 걸리는 것은
     그 순간에 아주 다르다. 정해 둔 번호만 바꾼다(용량 숫자가 전화번호가 되면 안 되므로). */
  .replace(/(자살예방상담|정신건강상담|생명의전화|응급의료정보센터|중독관리)(<\/b>)?(\s*)(109|119|1339|129|1588-9191)/g,
    (m, w, cb, sp, num) => `${w}${cb || ''}${sp}<a class="call-in" href="tel:${num}">${num}</a>`)
  /* 119 는 본문 어디에 나와도 누르면 걸리게. 이 앱의 모든 119 는 «지금 전화하세요»라는 뜻이고,
     용량·개수로 119 가 쓰인 곳은 없다(검사로 확인). 이미 링크가 된 것은 건드리지 않는다. */
  .replace(/(?<!tel:)(?<![\d>-])119(?![\d-])/g, '<a class="call-in" href="tel:119">119</a>'); }
/* 여러 성분의 「내 정보 기준」 경고를 한 목록으로 — 성분 이름을 앞에 붙인다 */
function meWarningsMany(list){
  const f = activeFlags(); if (!f.length) return '';
  const rows = [];
  for (const dr of list) {
    (dr.avoid || []).forEach(a => { if (a.flags?.some(x => f.includes(x))) rows.push(['stop', dr, a.text || a]); });
    (dr.caution || []).forEach(a => { if (a.flags?.some(x => f.includes(x))) rows.push(['warn', dr, a.text || a]); });
  }
  if (!rows.length) return '';
  return `<ul class="plain mew">${rows.map(([lv, dr, t]) => `<li class="${lv}"><b>${esc(ingrName(dr))}</b> — ${fmt(t)}</li>`).join('')}</ul><p class="small muted" style="margin-top:6px">내 정보 탭에서 표시한 상태를 기준으로 골라낸 항목이에요. 최종 판단은 약사·의사와 함께 하세요.</p>`;
}
function meWarnings(dr){
  const f = activeFlags(); if (!f.length) return '';
  const hits = [];
  (dr.avoid || []).forEach(a => { if (a.flags?.some(x => f.includes(x))) hits.push({ lv:'stop', t:a.text || a }); });
  (dr.caution || []).forEach(a => { if (a.flags?.some(x => f.includes(x))) hits.push({ lv:'warn', t:a.text || a }); });

}

        (() => { const dr = items.filter(x => x.e.achSrc === '의사 검수'); return dr.length

    ${opts.compact ? '' : achRisk(n)}

  </div>`;
}

/* 항콜린 게이지 — 0~12 눈금. 0~2 낮음 · 3~5 살펴볼 것 · 6+ 높음 (KABS 기준 3점 이상이 높음) */
function achGauge(n){
  const cap = Math.min(n, 12);
  const cells = Array.from({ length: 12 }, (_, i) => { const v = i + 1; const band = v <= 2 ? 'lo' : v <= 5 ? 'mid' : 'hi'; return `<i class="${band} ${v <= cap ? 'on' : ''}"></i>`; }).join('');
  return `<div class="gauge" role="img" aria-label="항콜린 부담 ${n}점, 12점 만점 눈금"><div class="num"><b>${n > 12 ? '12+' : n}</b><small>점</small></div><div class="bar">${cells}<span class="mk" style="left:calc(${(cap / 12) * 100}% - 1px)"></span></div><div class="lbl"><span>낮음</span><span>살펴볼 것</span><span>높음</span></div></div>`;
}
/* 점수가 실제로 무엇을 뜻하는지 — 자연빈도로 */
function achRisk(n){

    <p>한국 노인 46만 명을 본 연구에서, 항콜린 부담 3점 이상인 분들은 0점인 분들보다 <b>헛것이 보이고 정신이 흐려져(섬망) 응급실에 가는 일이 약 3배</b>, <b>소변이 막혀 가는 일이 약 2배</b>, 넘어져 다치는 일이 1.5배였어요.</p>
    <p>4만 2천 명을 5.7년 따라간 연구에서는 1년에 <b>1,000명 중 약 10명(0점) → 약 18명(3점 이상)</b>이 돌아가셨어요. 나이·병·다른 약을 감안한 뒤의 수치입니다.</p>
    <p class="small">약을 끊으라는 뜻이 아니라, <b>꼭 필요한 약인지 한 번 여쭤볼 만하다</b>는 뜻이에요. 필요해서 드시는 약이 대부분입니다.</p></div>`;
}
/* 증상 화면용 한 줄 — 이번에 사려는 약이 처방약과 부딪히는지 그 자리에서 알린다 */
function ixLine(extra){
  if (!takingItems().length) return '';
  const res = ixRun(extra);
  /* 추천 약이 한쪽 자리에 들어간 것만 — 내 약통끼리의 문제는 병용 화면에서 따로 본다 */
  /* 내 약통 「과」 지금 보는 약 사이에 걸친 것만. 추천끼리의 겹침은 위쪽 planDup 이 더 정확히 말한다
     — 여기에 같이 태우면 「이 중 하나만」인 두 자리가 서로를 고발한다 */
  const now = res.hits.filter(h => h.r.lv !== 'info' && h.items.some(i => i.from === '지금 보는 약') && h.items.some(i => i.from === '내 약통'));
  /* 추천 안에서 성분이 겹치는 것은 위쪽 '사시기 전에 확인할 것'이 이미 말한다.
     여기서는 내 약통과 이번 추천 사이에 걸친 것만 — 모르고 두 배로 드시게 되는 자리다 */
  const dup = res.dupe.filter(d => d.items.some(i => i.from === '지금 보는 약') && d.items.some(i => i.from === '내 약통'));
  if (!now.length && !dup.length) return '';
  const spans = h => h.items.some(i => i.from === '내 약통') && h.items.some(i => i.from === '지금 보는 약');
  /* 「내 약통 × 지금 보는 약」이 먼저다.
     화면 안 선택지끼리의 겹침은 「하나만 고르면」 풀리지만, 내가 이미 드시는 약과의 충돌은 고를 수가 없다.
     경고가 많아지면 요약 한 줄로 접히는데, 그때 개인 경고가 묻히던 문제를 막는다. */
  const worst = now.find(h => h.r.lv === 'stop' && spans(h)) || now.find(spans)
             || now.find(h => h.r.lv === 'stop') || now[0];
  const lv = dup.length || (worst && worst.r.lv === 'stop') ? 'stop' : 'warn';
  const t = dup.length ? `${dup[0].e?.n || ''} — 지금 드시는 약에 이미 들어 있어요` : worst.r.t;
  const more = now.length + dup.length - 1;
  return `<button class="ixline ${lv}" onclick="go('/together')">${I.alert}<span>${lv === 'stop' ? '사시기 전에 꼭 보세요' : '지금 드시는 약과' } — <b>${esc(t)}</b>${more > 0 ? ` 외 ${more}가지` : ''}</span>${I.chev}</button>`;
}

/* 읽어 주기 — 기기에 내장된 음성(Web Speech). 어디로도 보내지 않는다. 핵심 세 줄만 */
let SPEAKING = null;
/* 읽어 주기 한 군데로 — 실패했을 때 단추가 켜진 채 굳어 버리던 것을 막는다.
   기기에 한국어 음성이 없으면 읽지 않고 그렇다고 말씀드린다(엉뚱한 발음으로 읽느니 낫다). */
function speakNow(text, btn){
  const t = String(text || '').trim(); if (!t) return;
  const done = () => { SPEAKING = null; document.querySelectorAll('.speak.on').forEach(b => b.classList.remove('on')); };
  let voices = []; try { voices = speechSynthesis.getVoices() || []; } catch (e) {}
  if (voices.length && !voices.some(v => (v.lang || '').toLowerCase().startsWith('ko'))) {
    toast('이 기기에 한국어 음성이 없어요 — 기기 설정에서 한국어 음성을 받으시면 읽어 드릴 수 있어요');
    return;
  }
  const u = new SpeechSynthesisUtterance(t.slice(0, 1200)); u.lang = 'ko-KR'; u.rate = 0.92;
  u.onend = done;
  u.onerror = () => { done(); toast('읽어 주기가 안 됐어요. 기기 소리와 한국어 음성을 확인해 주세요'); };
  SPEAKING = u; btn?.classList.add('on');
  try { speechSynthesis.speak(u); } catch (e) { done(); toast('읽어 주기가 안 됐어요'); }
}
function speakAnswer(sid, btn){
  const s = byId(D.symptoms, sid); if (!s || !('speechSynthesis' in window)) { toast('이 기기는 읽어 주기를 지원하지 않아요'); return; }
  if (SPEAKING) { speechSynthesis.cancel(); SPEAKING = null; document.querySelectorAll('.speak.on').forEach(b => b.classList.remove('on')); return; }
  const bk = basket(s);
  const buy = bk.map(x => `${x.slot}, ${prodName(x.product) || ingrName(x.d)}${x.optional ? ', 도움이 될 수 있어요' : ''}`).join('. ');
  const how = (s.how || []).slice(0, 2).map(t => String(t).replace(/\*\*/g, '')).join(' ');
  const care = (s.care?.clinic || []).slice(0, 1).map(t => String(t).replace(/\*\*/g, '')).join('');
  const t3 = s.triage || {};
  const plain = t => String(t || '').replace(/\*\*/g, '');
  /* 살 약이 없는 증상은 「이렇게 사시면 돼요」 라고 읽으면 안 된다 */
  const text = buy

    : `${s.name}. 약국에서 사실 약은 없어요. ${plain(t3.clinic)} ${plain(t3.escalate)}`;
  speakNow(text, btn);
}
/* ── 어디서든 읽어 주기 ──
   읽어 주기가 증상 화면에만 있었다. 어르신 앱인데 「가장 긴 글」인 약 설명과 약 상식에는 없었다.
   화면마다 「무엇을 읽을지」만 넘겨 주면 같은 방식으로 읽는다. */
function speakText(text, btn){
  if (!('speechSynthesis' in window)) { toast('이 기기는 읽어 주기를 지원하지 않아요'); return; }

  speakNow(t, btn);
}
const speakBtn = (expr, label) => `<button class="speak" onclick="speakText(${expr}, this)" aria-label="${esc(label || '읽어 주기')}">${I.info}읽어 주기</button>`;

const GROUP_CLS = { '통증':'g-pain', '감기·호흡기':'g-resp', '소화기':'g-gi', '알레르기·피부':'g-skin', '수면·기타':'g-etc', '비뇨기':'g-uro', '여성 건강':'g-women', '입·치아':'g-oral', '눈·귀':'g-eye',

const WX_KEY = 'yakjido.wx.v1';
const WX_CITIES = [['서울',37.57,126.98],['부산',35.18,129.08],['대구',35.87,128.60],['인천',37.46,126.71],['광주',35.16,126.85],['대전',36.35,127.38],['울산',35.54,129.31],['세종',36.48,127.29],['수원',37.26,127.03],['춘천',37.88,127.73],['강릉',37.75,128.88],['청주',36.64,127.49],['전주',35.82,127.15],['창원',35.23,128.68],['포항',36.02,129.36],['목포',34.81,126.39],['제주',33.50,126.53]];
let WX = {}; try { WX = JSON.parse(localStorage.getItem(WX_KEY) || '{}'); } catch (e) {}
let WX_BUSY = false;
function wxSave(){ try { localStorage.setItem(WX_KEY, JSON.stringify(WX)); } catch (e) {} }
function wxLoc(){ if (WX.city === '내 위치' && WX.lat != null) return { name:'내 위치', lat:WX.lat, lon:WX.lon }; const c = WX_CITIES.find(x => x[0] === WX.city) || WX_CITIES[0]; return { name:c[0], lat:c[1], lon:c[2] }; }
let WX_TRIED = '';  /* 이 화면 세션에서 이미 시도한 지역 — 실패해도 홈을 그릴 때마다 다시 가지 않는다 */
async function wxFetch(force){
  if (WX_BUSY || (typeof navigator !== 'undefined' && navigator.onLine === false)) return;

function search(q){
  q = (q || '').toLowerCase().trim();
  /* 띄어쓰기를 틀려도 찾아진다 — 「타이 레놀」·「이부 프로펜」 */
  const qs = q.replace(/\s+/g, '');
  const q0 = q;
  const syn = SEARCH_SYN[qs];
  if (syn) q = syn;
  const out = [];
  /* 「어깨 아파」·「무릎 통증」·「벌레 물림」처럼 두 마디로 치시는 분이 많다. 전에는 전부 0건이었다.
     ① 이름과 태그를 한 줄로 이어 붙여 놓고 찾는다 — 「벌레」는 이름에, 「물림」은 태그에 있을 수 있다.
     ② 「아파·통증·약」 같은 곁말은 빼고 본다 — 「어깨 아파」에서 알맹이는 「어깨」다.
     ③ 낱말마다 구어 사전을 한 번 더 태운다 — 「녹내장 안약」의 「안약」은 「눈」이다. */

     그래서 반대로 한다 — 우리 자료 어디에도 없는 낱말은 「곁말」로 보고 버린다.
     「잠이 안 와요」에서 자료에 있는 말은 「잠」 하나뿐이고, 그것이 정확히 알맹이다. */

  const stem = w => {
    let x = w.replace(/(요|예요|입니다|습니다)$/, '');          /* 「말라요」→「말라」 */
    const m2 = x.match(/^(.+?)(이|가|은|는|을|를|에|의|도|만|에서|으로|로)$/);
    if (m2 && m2[1].length >= 1) x = m2[1];

  };

     「변비가」라는 없는 말이 생겨, 「변비가 있어요」가 엉뚱한 화면으로 갔다. */

    ...(D.symptoms || []).flatMap(x => [x.name, ...(x.tags || [])]),
    ...(D.drugs || []).flatMap(x => [x.name, x.en, ...(x.for || [])]),
    ...(D.supplements || []).flatMap(x => [x.name, ...(x.tags || [])]),
    /* 처방약을 드시는 분이 「와파린」·「혈압약」·「갑상선약」을 치면 0건이었다.
       종류로 담는 «빠른 묶음»과 성분표가 말뭉치에 빠져 있었다(2026-09-23). */
    ...(D.ingredients?.quick || []).flatMap(g => [g.n, ...(g.subs || []).flatMap(x => [x.n, ...(x.aka || [])])]),
    ...(D.ingredients?.ing || []).flatMap(e => [e.n, ...(e.aka || [])]),

  /* 원래 친 말도 함께 남긴다 — 구어 사전이 「해열제」를 「열」로 바꿔 버리면

     한 글자까지 내려가되, 그때는 자료에 «낱말 그대로» 있는 것만 인정한다(2026-09-23). */

     「허리아파」 안에 있다)까지 요구 조건으로 삼으면 엉뚱한 것만 남는다(2026-09-23). */
  const isWord = w => SEARCH_CORPUS.includes('|' + norm(w) + '|');

  const many = words.length > 0 && (q.split(/\s+/).length > 1 || words.some(w => norm(w) !== qs));

  const q1 = q.length === 1 ? new RegExp('(^|[\\s·(,/])' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')) : null;

    if (q1) return q1.test(x);

/* 약국에 있을 만한 제품 이름들 — 진열대에서 뭘 집어야 할지 알 수 있게 여러 개를 보여 준다 */
function prodNames(d, max = 4){
  const kid = ME.age === 'child';
  const isKid = t => /어린이|소아|키즈|베이비/.test(t);
  const FORM = /^(정|정제|현탁액|시럽|캡슐|연질캡슐|캅셀|액|내복액|겔|크림|연고|산|과립|좌제|패치|파프|카타플라스마|점안액|안연고|트로키|분말|건조시럽)$/;
  const out = [];
  for (const pr of (d?.products || [])) for (const one of String(pr.name).split('·')) {
    const t = prodName(one);
    if (!t || out.includes(t) || FORM.test(t)) continue;   /* '현탁액' 같은 제형 조각은 제품 이름이 아니다 */
    if (isKid(t) !== kid) continue;            /* 어른에게 어린이 제품을, 아이에게 어른 제품을 권하지 않는다 */
    out.push(t);

  }
  if (!out.length) for (const pr of (d?.products || [])) { const t = prodName(String(pr.name).split('·')[0]); if (t) return [t]; }
  return out;
}

function formclass2(d){

  if (/연고|크림|로션|겔|에멀/.test(t)) return 'skin';

function monthsFrom(birth){ if (!birth) return null; const b = new Date(birth); if (isNaN(b)) return null; const n = new Date(); let m = (n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth()); if (n.getDate() < b.getDate()) m--; return m >= 0 ? m : null; }

/* ───────── 병원에서 내는 묶음 ─────────
   현욱님: 「성분 역할로 하고 클릭하면 제품명을 볼 수 있게 하자」(2026-09-21).
   성분과 역할을 앞에 두고, 실제 제품 이름은 누를 때 식약처 자료에서 찾아 보여 준다.
   제품 목록을 글로 박아 두면 낡는다 — 낱알 자료에서 그때그때 찾는다. */
const RXP = {};                       /* 성분 → 제품 이름 몇 개 (한 번 찾으면 담아 둔다) */
async function rxProducts(ing){
  if (RXP[ing]) return RXP[ing];
  const pool = [];
  try { (await pubPillsRx()).forEach(r => pool.push(r)); } catch (e) {}
  try { (await pubIndex()).forEach(r => pool.push({ n: r.n, m: r.m, ingr: (r.i || []).join(' '), seq: r.seq, rx: 0 })); } catch (e) {}
  const hit = pool.filter(r => (r.ingr || '').includes(ing));
  hit.sort((a, b) => a.n.length - b.n.length);
  const seen = new Set(), out = [];
  for (const r of hit) {
    const base = r.n.split('(')[0].replace(/정.*$|캡슐.*$|서방.*$/, '');
    if (seen.has(base)) continue;
    seen.add(base); out.push(r);
    if (out.length >= 6) break;
  }
  RXP[ing] = { list: out, total: hit.length };
  return RXP[ing];
}
function rxOpen(i, ing){
  const box = document.getElementById('rxp' + i); if (!box) return;
  const row = box.closest('.rxc-row'); const on = row.classList.toggle('open');

  if (box.dataset.done) return;
  box.innerHTML = '<p class="loading">제품 이름을 찾는 중…</p>';
  rxProducts(ing).then(r => {
    box.dataset.done = '1';
    box.innerHTML = r.list.length
      ? `<div class="rxc-names">${r.list.map(x => `<button class="rxc-name" onclick="event.stopPropagation();go('/pillinfo/${esc(x.seq)}')"><b>${esc(x.n.split('(')[0])}</b><small>${esc(x.m || '')}</small></button>`).join('')}</div>
         <p class="small muted" style="margin-top:8px">${r.total > r.list.length ? `식약처에 등록된 <b>${r.total}가지</b> 가운데 몇 개예요. ` : '식약처에 등록된 것은 이것뿐이에요. '}<b>같은 성분이면 어느 제품이든 같습니다</b> — 병원마다 쓰는 회사가 다를 뿐이에요.</p>`
      : '<p class="small muted">식약처 자료에서 제품을 찾지 못했어요. 성분 이름으로 여쭤 보세요.</p>';

}

/* ───────── 「그런 줄 알았는데」 ─────────

  const end = new Date(today); end.setDate(end.getDate() + (6 - today.getDay()));
  const cells = [];
  for (let i = 34; i >= 0; i--) { const d = new Date(end); d.setDate(d.getDate() - i); cells.push(d); }
  const a = adherence(30);
  const LBL = { full: '다 드셨어요', part: '일부만', miss: '빠짐', none: '정해 둔 것 없음', soon: '아직 남은 시간이 있어요' };
  const grid = cells.map(d => {
    const k = dayKey(d);
    const future = k > todayKey();
    let st = dayStat(k).s;
    /* 오늘은 아직 끝나지 않았다 — 덜 드셨다고 «빠짐»으로 칠하면 억울하시다 */
    if (k === todayKey() && st !== 'full') st = 'soon';
    const stat = dayStat(k);
    return `<div class="cal-d ${future ? 'fut' : st}${k === todayKey() ? ' cal-now' : ''}" ${future ? '' : `title="${d.getMonth() + 1}월 ${d.getDate()}일 — ${stat.plan ? `${stat.plan}번 중 ${Math.min(stat.done, stat.plan)}번` : LBL.none}"`}>
      <span class="n">${d.getDate()}</span></div>`;

  const span = `${first.getMonth() + 1}월 ${first.getDate()}일 — ${last.getMonth() + 1}월 ${last.getDate()}일`;
  return `<section class="sec card"><h2>지난 기록 <small>${DAYS_KEEP}일까지 이 휴대폰에만</small></h2>
  ${a.days ? `<p style="margin-top:6px"><b>어제까지 30일 가운데 약을 드시기로 한 날이 ${a.days}일</b>이었고, 그중 <b>${a.full}일</b>은 빠짐없이 드셨어요.${a.doses ? ` 전체로는 ${a.doses}번 중 ${a.took}번이에요.` : ''}</p>`

  <div class="cal-dow">${DOW.map(x => `<span>${x}</span>`).join('')}</div>

  ${slotLine()}
  <div class="cal-key">${[['full', '다 드심'], ['part', '일부'], ['miss', '빠짐'], ['none', '정해 둔 것 없음'], ['cal-now', '오늘']].map(([c, n]) => `<span class="ki"><span class="k ${c}"></span>${n}</span>`).join('')}</div>

/* 추세 그림 — 그림도 진짜 숫자로만 그린다. 한 축(mmHg 또는 mg/dL), 기준선은 점선 + 글자 */
function vitalChart(k){
  const L = vitals().filter(x => x.k === k && x.t.slice(0, 10) >= dayBefore(13)).sort((a, b) => a.t.localeCompare(b.t));
  if (L.length < 2) return `<p class="small muted" style="margin-top:8px">두 번 이상 적으시면 2주 흐름을 그림으로 보여 드려요.</p>`;
  const W = 340, H = 190, pl = 34, pr = 12, pt = 12, pb = 26;

  const X = t => pl + (new Date(t).getTime() - t0) / (t1 - t0) * (W - pl - pr);
  const vals = k === 'bp' ? L.flatMap(x => [x.s, x.d]) : L.map(x => x.v);
  const ref = k === 'bp' ? [VREF.bp.s, VREF.bp.d] : [];

  const step = k === 'bp' ? 20 : 50; lo = Math.floor((lo - 5) / step) * step; hi = Math.ceil((hi + 5) / step) * step;

  const ticks = []; for (let v = lo; v <= hi; v += step) ticks.push(v);
  const grid = ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" class="vz-grid"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" class="vz-ax">${v}</text>`).join('');
  const days = [13, 6, 0].map(n => { const d = new Date(); d.setDate(d.getDate() - n); return `<text x="${X(dayKey(d) + 'T12:00')}" y="${H - 6}" text-anchor="middle" class="vz-ax">${d.getMonth() + 1}/${d.getDate()}</text>`; }).join('');
  const refs = ref.map((v, i) => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" class="vz-ref"/><text x="${W - pr}" y="${Y(v) - 4}" text-anchor="end" class="vz-reft">${i ? '아래' : '위'} ${v}</text>`).join('');
  const line = (f, c) => `<polyline points="${L.map(x => `${X(x.t).toFixed(1)},${Y(x[f]).toFixed(1)}`).join(' ')}" class="vz-line ${c}"/>` +
    L.map(x => `<circle cx="${X(x.t).toFixed(1)}" cy="${Y(x[f]).toFixed(1)}" r="4.5" class="vz-dot ${c}"><title>${x.t.slice(5, 10).replace('-', '/')} ${x.t.slice(11)} · ${k === 'bp' ? x.s + '/' + x.d + ' mmHg' : x.v + ' mg/dL'}</title></circle>`).join('');

/* 지금 고른 약·내 약통과 겹치는 조합을 찾아 준다 */
function mixFor(extra){
  if (!LEX.mix) { lexLoad(); return []; }
  const ids = new Set();
  for (const x of takingItems()) if (x.d) ids.add(x.d.id);
  for (const d of (extra || [])) if (d) ids.add(d.id);
  if (!ids.size) return [];
  const f = activeFlags();
  /* who_* 는 「사람 조건」 묶음이라 성분이 겹친다고 띄우면 안 된다 — 내 정보에 해당할 때만 */
  const WHO = { who_elder:'senior', who_kidney:'kidney', who_liver:'liver', who_preg:'pregnant' };
  return (LEX.mix || []).map(m => {
    if (m.id in WHO) return { m, n: f.includes(WHO[m.id]) ? 3 : 0 };
    if (m.id.startsWith('who_')) return { m, n: 0 };
    return { m, n: m.items.filter(i => ids.has(i.id)).length };
  }).filter(x => x.n >= 2).sort((a, b) => b.n - a.n).map(x => x.m);
}

/* ───────── 같이 먹어도 되나요 ─────────
   증상이 아니라 「조합」을 묻는 자리. 약끼리·지병 약·영양제·음식술·사람에 따라. */
const MIX_KINDS = ['약끼리', '지병 약', '영양제', '음식·술', '사람에 따라'];
/* ───────── 병용 판정 ─────────
   "병원에서 받아 온 약이랑 같이 먹어도 되나요" 에 답하는 자리.
   내 약통(처방약 포함)과 지금 사려는 약을 성분으로 바꾼 뒤, 규칙표에 걸리는 것을 모은다.
   여기서 아무것도 안 나와도 '안전하다'는 뜻이 아니다 — 그 말을 화면에 반드시 적는다. */

/* 판정에 들어갈 약들: {name, ings:[성분], link, src:'내 약통'|'지금 보는 약'} */
function ixItems(extra){
  const out = [];
  for (const x of takingItems()) {
    const r = ingOf(x);
    out.push({ name: x.name, ings: r.ings, known: r.known, approx: !!r.approx, from: '내 약통',
               link: x.d ? '#/drug/' + x.d.id : (x.pub ? '#/pillinfo/' + x.pub.seq : '') });
  }
  for (const d of (extra || [])) {
    const ings = drugIngs(d).slice();
    if (!ings.length) ingFind(d.name).forEach(e => { if (!ings.includes(e)) ings.push(e); });
    out.push({ name: ingrName(d), ings, known: ings.length > 0, from: '지금 보는 약', link: '#/drug/' + d.id });
  }
  return out;
}
/* 한 약이 어떤 묶음(계열 또는 k:성분)에 해당하는가 */
function ixMatch(item, group){
  for (const e of item.ings) {
    for (const g of group) {
      if (g.startsWith('k:')) { if (e.k === g.slice(2)) return e; }
      else if ((e.cls || []).includes(g)) return e;
    }
  }
  return null;
}
function ixRun(extra){
  const items = ixItems(extra);
  const rules = D.interactions?.rules || [];
  const flags = activeFlags();
  const hits = [];
  for (const r of rules) {
    if (r.flags && !r.flags.some(f => flags.includes(f))) continue;
    let why = null;
    if (r.count) {
      const got = items.filter(it => it.ings.some(e => (e.cls || []).includes(r.count.tag)));
      /* 한 제품이 「자기 자신과」 겹쳤다고 세지 않도록 — 제품 안의 성분은 묶어서 한 가지로 본다.
         복합제는 약 이름과 그 안의 성분이 둘 다 잡히므로 그대로 세면 한 통이 두 가지가 된다.
         또 같은 성분이 두 제품에 들어 있으면(성분표가 똑같으면) 그것도 한 가지로 본다. */
      /* 같은 약을 두 번 담으신 경우만 하나로 본다 — 성분표 «전체»가 같을 때다.
         예전에는 «그 태그를 가진 성분»만 비교해서, 타이레놀과 판콜에이(아세트아미노펜이 든
         감기약)가 둘 다 「apap」 하나로 보여 «두 군데 겹쳤다»는 경고가 아예 안 떴다. */
      const sigs = new Set();
      got.forEach(it => sigs.add(it.ings.map(e => e.k).sort().join('|')));
      if (sigs.size >= r.count.n) why = got;
    } else {
      const used = []; const picked = [];
      let ok = true;
      for (const g of r.need) {
        const it = items.find(x => !used.includes(x) && ixMatch(x, g));
        if (!it) { ok = false; break; }
        used.push(it); picked.push(it);
      }
      if (ok) why = picked;
    }
    if (why) hits.push({ r, items: why });
  }
  /* 더 센 규칙이 걸리면 약한 쪽은 감춘다 */
  const killed = new Set();
  hits.forEach(h => (h.r.over || []).forEach(o => killed.add(o)));
  const keep = hits.filter(h => !killed.has(h.r.id));
  const ord = { stop: 0, warn: 1, info: 2 };
  keep.sort((a, b) => ord[a.r.lv] - ord[b.r.lv]);
  /* 같은 성분이 두 제품에 — 규칙표가 아니라 그 자리에서 찾는다 */
  const dupe = [];
  const byIng = new Map();
  for (const it of items) for (const e of it.ings) {
    if (!byIng.has(e.k)) byIng.set(e.k, []);
    if (!byIng.get(e.k).includes(it)) byIng.get(e.k).push(it);
  }
  for (const [k, list] of byIng) if (list.length > 1) dupe.push({ e: ingIndex().byKey[k], items: list });
  return { items, hits: keep, dupe, unknown: items.filter(x => !x.known) };
}
const IX_LV = { stop: ['같이 드시면 안 돼요', I.alert], warn: ['조심해서 드세요', I.alert], info: ['시간만 띄우면 돼요', I.clock] };

/* ───────── 성분 사전(넓게) · 제품 이름 사전 ─────────
   약지도가 깊게 쓴 성분은 /drug/ 로, 나머지 넓은 사전은 여기서 본다. */
const RISK_LBL = { gi:'위장', kd:'신장', lv:'간', sd:'졸음' };
function lexRisk(r){
  const ks = Object.keys(RISK_LBL).filter(k => (r || {})[k] > 0);
  if (!ks.length) return '';
  return `<div class="risk-bars">${ks.map(k => { const v = Math.min(3, r[k]); const w = ['', '낮음', '보통', '높은 편'][v];
    return `<div class="rb"><span>${RISK_LBL[k]}</span><div class="track"><div class="fill l${v === 3 ? 4 : v + 1}" style="width:${v * 33}%"></div></div><span class="v">${w}</span></div>`; }).join('')}</div>`;
}
const lexMark = t => fmt(String(t || '').replace(/「(.+?)」/g, '**$1**'));

  ${disclaimer()}`;

  const b = brandOf(decodeURIComponent(name || ''));
  if (!b) return `${topBar({ back:'뒤로' })}<div class="empty"><b>찾는 제품이 없어요</b>위 검색창에 제품 이름을 넣어 보세요.</div>`;
  const ings = (b.ing || []).map(lexOf).filter(Boolean);
  return `${topBar({ back:'뒤로' })}
  <div class="drug-hero"><span class="cls">제품 이름으로 보기</span><h1>${esc(b.n)}</h1><div class="en">${badge(b.rx === '둘 다' ? '' : b.rx)}${b.rx === '둘 다' ? '<span class="badge warn">제품에 따라 일반·전문</span>' : ''}</div></div>
  ${b.comp ? `<div class="dose-hero" style="margin-top:12px"><small>무엇이 들었나</small><div style="font-size:1.0625rem;font-weight:700;line-height:1.5;margin-top:4px">${esc(b.comp)}</div></div>` : ''}
  ${b.use ? `<section class="sec card"><h2>이런 때 도움이 될 수 있어요</h2><p>${lexMark(b.use)}</p></section>` : ''}
  ${b.how ? `<section class="sec card"><h2>이렇게 드세요</h2><p>${lexMark(b.how)}</p></section>` : ''}
  ${b.who ? `<div class="note" style="margin-top:16px">${I.alert}<span>${lexMark(b.who)}</span></div>` : ''}
  ${ings.length ? `<section class="sec"><h2>성분 하나하나 보기</h2><div class="card rows">${ings.map(x => { const d = x.drug && drug(x.drug); return `<button class="row" onclick="go('${d ? '/drug/' + x.drug : '/ingr/' + x.id}')"><div class="ic">${icon(d ? (cls(d.class)?.icon || 'pill') : 'pill')}</div><div class="body"><b>${esc(x.n)}</b><span>${esc(x.cls)}</span>${d ? useTag(d) : ''}</div>${d?.ach ? `<span class="badge ${d.ach >= 3 ? 'stop' : 'warn'}">항콜린 ${esc(ACH_WORD[d.ach])}</span>` : ''}${I.chev}</button>`; }).join('')}</div>${ings.map(x => x.drug && drug(x.drug) ? meWarnings(drug(x.drug)) : '').join('')}
  ${achPanel(ings.map(x => x.drug && drug(x.drug)).filter(Boolean), { compact:true })}</section>` : ''}
  <div class="actions">${ings.length ? takeBtn(ings[0].drug && drug(ings[0].drug) ? ings[0].drug : 'lex:' + ings[0].id, '이 약을 내 약통에 담기') : ''}<button class="btn line" onclick="go('/pillinfo')">${I.eye} 이 약이 맞는지 사진으로 확인</button></div>
  ${disclaimer('제품 정보는 식약처 허가사항 기준이에요. 실제 복용은 포장 문구와 약사 안내가 우선입니다.')}`;
}

function vNut(id){
  if (!LEX.nut) { lexLoad(); return `${topBar({ back:'영양제' })}<p class="loading">영양제 사전을 불러오는 중…</p>`; }
  const x = (LEX.nut || []).find(v => v.id === id);
  if (!x) return `${topBar({ back:'영양제' })}<div class="empty"><b>찾는 성분이 없어요</b>위 검색창에 다른 이름으로 찾아보세요.</div>`;
  if (x.supp && supp(x.supp)) { go('/supp/' + x.supp); return ''; }
  const R = [['form', '제형·함량 읽는 법'], ['read', '라벨에서 볼 것'], ['tip', '언제, 어떻게'], ['with', '같이 드실 때']];
  return `${topBar({ back:'영양제' })}
  <div class="drug-hero"><span class="cls">영양제 성분</span><h1>${esc(x.n)}</h1><div class="en">${esc(x.what || '')}</div></div>
  ${x.ul ? `<div class="dose-hero" style="margin-top:12px"><small>상한·기준</small><div style="font-size:1.0625rem;font-weight:700;line-height:1.5;margin-top:4px">${esc(x.ul)}</div></div>` : ''}
  ${R.map(([k, t]) => x[k] ? `<section class="sec card"><h2>${t}</h2><p>${lexMark(x[k])}</p></section>` : '').join('')}
  ${x.src?.length ? `<div class="srcs">${x.src.map(t => `<span class="src-chip${/미확인/.test(t) ? ' unv' : ''}">${I.link}${esc(t)}</span>`).join('')}</div>` : ''}
  ${disclaimer(D.meta?.suppDisclaimer)}`;
}

/* ───────── 약 사전 ───────── */
function vDrugs(_, q){
  /* 2026-09-29 — ClinicScore 문법. 전에는 「전체」가 갈래 25개를 3개씩 모두 펼쳐 폰 14장 길이였다.
     이제 [갈래별 · 편의점 · 전체] 탭, 처음은 갈래별 칸(ClinicScore 「과별」과 같은 모양) — 누르면 그 갈래 목록만 */
  const CL = (D.classes || []).filter(c => (D.drugs || []).some(d => d.class === c.id));
  const cat = q.cat || 'grid';
  let items = (D.drugs || []);
  if (cat === 'cvs') items = items.filter(d => d.rx === '안전상비' || d.products?.some(p => p.rx === '안전상비'));
  else if (cat !== 'all' && cat !== 'grid') items = items.filter(d => d.class === cat);
  const c0 = cat !== 'all' && cat !== 'cvs' && cat !== 'grid' ? cls(cat) : null;
  const cvsN = (D.drugs || []).filter(d => d.rx === '안전상비' || d.products?.some(p => p.rx === '안전상비')).length;
  const tabs = [['grid', '갈래별', I.book, CL.length], ['cvs', '편의점', I.cart, cvsN], ['all', '전체', I.pill, (D.drugs || []).length], ...(c0 ? [[cat, c0.short || c0.name, '', items.length]] : [])];
  const rowOf = d => `<button class="row" onclick="go('/drug/${d.id}')">${(() => { const pr = (d.products || []).find(x => pimg(x.name)); return pr ? imgTag(pimg(pr.name), 'pimg', pr.name) : `<div class="ic">${icon(cls(d.class)?.icon || 'pill')}</div>`; })()}<div class="body"><b>${esc(d.name)} <span style="display:inline;color:var(--faint);font-weight:500">${esc(d.en || '')}</span></b><span>${esc((d.for || []).join(' · '))}</span>${useTag(d)}</div>${badge(d.rx)}</button>`;
  return `${topBar()}
  <h1>약 사전</h1><p style="margin-top:6px">성분 기준으로 정리했어요. 제품 이름이 달라도 성분이 같으면 같은 약이에요.</p>
  <div class="rows-l" style="margin-top:14px">
    ${lrow(I.eye, '이 알약이 무슨 약인지 찾기', `모양·색·각인으로 식약처 낱알 ${(D.public?.pills_count || 0).toLocaleString()}건 검색`, "go('/pill')")}
    ${lrow(I.scale, '같이 먹어도 되나요', `혈압약과 진통제, 항생제와 유산균, 한방약 겹침 — ${(D.public?.mixes_count || 0)}가지`, "go('/mix')")}
    ${lrow(I.user, '나이가 들면 달라지는 약', `65세 이상이 한 번 더 살펴볼 약국 약 ${seniorItems().filter(i => i.d.rx !== '전문').length}가지 — 왜 그런지와 대신 쓸 것`, "go('/senior')")}
    ${lrow(I.cross, '처방받은 약이 떨어졌어요', `약국에서 이어 갈 수 있는 것과 없는 것 — 처방약 ${(D.drugs || []).filter(d => d.otcAlt).length}가지`, "go('/rxout')")}
    ${lrow(I.book || I.search, '제품 이름으로 찾기', `게보린·판피린·훼스탈처럼 아시는 이름으로 — 제품 ${(D.public?.brands_count || 0).toLocaleString()}개 · 성분 ${(D.public?.lexicon_count || 0).toLocaleString()}가지`, "lexLoad();document.getElementById('gq')?.focus()")}
  </div>
  <nav class="tabs" role="tablist" aria-label="약 묶음" style="margin-top:20px">${tabs.map(([k, n, ic, c]) => `<button class="tab ${cat === k ? 'on' : ''}" role="tab" aria-selected="${cat === k}" onclick="go('/drugs?cat=${k}')">${ic}${esc(n)}<span class="n">${c}</span></button>`).join('')}</nav>
  ${cat === 'grid' ? `<div class="sech"><h2 class="sec-h">갈래별로 보기</h2><span class="secn">${CL.length}갈래</span></div><p class="viewnote">갈래를 누르면 그 약만 모아 보여 드려요</p>
    <div class="cgrid">${CL.map(c => { const L = (D.drugs || []).filter(d => d.class === c.id); return `<button class="cg" onclick="go('/drugs?cat=${c.id}')"><span class="ab">${icon(c.icon || 'pill')}</span><b>${esc(c.short || c.name)}</b><small>${L.length}가지</small></button>`; }).join('')}</div>`
  : `${c0 ? `<div class="sech"><h2 class="sec-h">${esc(c0.name)}</h2><span class="secn">${items.length}가지</span></div><div class="rows-l" style="margin-bottom:12px">${lrow(I.scale, `${esc(c0.name)} 한눈에 비교`, esc(c0.short2 || '위장·심혈관 부담, 지속시간, 구입 방법'), `go('/class/${cat}')`)}</div>`
      : `<div class="sech"><h2 class="sec-h">${cat === 'cvs' ? '편의점에서 살 수 있는 약' : '전체'}</h2><span class="secn">${items.length}가지</span></div>`}
    <div class="card rows">${items.map(rowOf).join('') || '<div class="empty">아직 등록된 약이 없어요.</div>'}</div>`}
  ${disclaimer()}`;
}
/* 「처방받은 약이 떨어졌어요」 — 처방약 하나하나에 약국에서 가장 가까운 것을 붙여 둔 목록.
   현욱님 설계(2026-09-21): 없으면 없다고 분명히 말하는 것이 이 화면의 값이다. */
/* ───────── 어르신이 조심할 약 — 65세 이상 주의를 한 자리에 ───────── */
/* 갈래는 글자에서 추측하지 않고 약마다 정해 둔다 — 한 약이 여러 갈래에 걸리면 「어르신이 가장 먼저 겪는 일」로 */
const SENIOR_WHY = [
  ['넘어질 수 있어요', 'alert', '졸리거나 어지러워서', ['chlorpheniramine','diphenhydramine','doxylamine','dimenhydrinate','scopolamine','butylscopolamine','chlorzoxazone','relax-combo','dextromethorphan','pancol-a','panpyrin-t','coldaewon','tylenol-cold','theraflu','vitamin-d-rx','eperisone','cyclobenzaprine','dihydrocodeine','cough-syrup-rx','hydroxyzine','tamsulosin']],
  ['위에서 피가 날 수 있어요', 'stomach', '소염진통제 계열', ['ibuprofen','naproxen','dexibuprofen','aspirin','loxoprofen','gnalen','easy6-eve','penzal','ethenzamide','aceclofenac']],
  ['소변·변비가 막힐 수 있어요', 'drop', '', ['solifenacin','loperamide']],
  ['혈압·심장이 부담을 받아요', 'temp', '', ['pseudoephedrine','phenylephrine','methylephedrine','caffeine','diosmin']],
  ['콩팥에 쌓이거나 물·소금이 빠져요', 'scale', '', ['magnesium-oxide','antacid-mg','almagate','bisacodyl']],
];
const SENIOR_OF = (() => { const m = {}; for (const w of SENIOR_WHY) for (const id of w[3]) m[id] = w[0]; return m; })();
/* 식약처 고시 노인주의 성분(2025.5.30 공고, 한국의약품안전관리원 「노인주의 성분리스트」) 가운데 우리 사전에 있는 것 — 2026-09-30 원문 대조.
   스코폴라민은 먹는 제형만 목록에 있고 붙이는 패치(키미테)는 없다. 플루르비프로펜은 트로키제가 목록에 있다 */
const DUR_SENIOR = new Set(['chlorpheniramine', 'diphenhydramine', 'doxylamine', 'dimenhydrinate', 'butylscopolamine', 'hydroxyzine', 'ibuprofen', 'naproxen', 'dexibuprofen', 'aspirin', 'loxoprofen', 'aceclofenac', 'ethenzamide', 'solifenacin', 'flurbiprofen', 'celecoxib', 'meloxicam']);
const durSenior = d => d && (DUR_SENIOR.has(d.id) || (d.contains || []).some(x => DUR_SENIOR.has(x)));
function seniorItems(){
  const out = [];
  for (const d of (D.drugs || [])) {
    const hits = [...(d.avoid || []), ...(d.caution || [])].filter(c => c && c.flags && c.flags.includes('senior'));
    if (!hits.length) continue;
    const t = hits.map(h => h.text || '').join(' ');
    const why = SENIOR_OF[d.id] || '그 밖에 조심할 것';
    const w = SENIOR_WHY.find(x => x[0] === why);
    out.push({ d, text: hits[0].text || '', why, ico: w ? w[1] : 'info',
      stop: (d.avoid || []).some(c => c.flags && c.flags.includes('senior')) || /권하지 않|피하는 것이 원칙|되도록 피하/.test(t) });
  }
  return out;
}
function vSenior(_, q){
  const all = seniorItems();
  const items = all.filter(i => i.d.rx !== '전문'), rx = all.filter(i => i.d.rx === '전문');
  const order = [...SENIOR_WHY.map(w => w[0]), '그 밖에 조심할 것'];
  const byWhy = order.map(w => [w, items.filter(i => i.why === w)]).filter(([, xs]) => xs.length);
  const srow = i => `<button class="row" onclick="go('/drug/${i.d.id}')"><div class="ic">${icon(cls(i.d.class)?.icon || 'pill')}</div>
      <div class="body"><b>${esc(i.d.name)} ${i.stop ? '<span class="badge stop">되도록 피하기</span>' : '<span class="badge soft">조심해서</span>'}${durSenior(i.d) ? '<span class="badge dur">심평원 노인주의</span>' : ''}</b><span>${esc(firstSentence(i.text.replace(/\*\*/g, ''), 62))}</span></div>${I.chev}</button>`;
  const meta = w => SENIOR_WHY.find(x => x[0] === w) || [w, 'info', ''];
  return `${topBar({ back:'약 사전' })}
  <div class="eyebrow">65세 이상</div><h1>나이가 들면 달라지는 약</h1>
  <div class="hero-speak">${speakBtn("'나이가 들면 달라지는 약. 같은 약 같은 용량인데 나이가 들면 몸이 다르게 받습니다. 콩팥이 걸러 내는 양이 줄고, 위 점막이 얇아지고, 조금만 졸려도 넘어집니다. 먹지 마세요가 아닙니다. 더 안전한 대안이 있으면 그것을 적어 두었어요. 드시던 약을 스스로 끊지는 마세요.'", '이 화면 읽어 주기')}</div>
  <p style="margin-top:6px">같은 약, 같은 용량인데 <b>나이가 들면 몸이 다르게 받습니다.</b> 콩팥이 걸러 내는 양이 줄고, 위 점막이 얇아지고, 조금만 졸려도 넘어집니다. 그래서 <b>약국 약 ${items.length}가지</b>는 어르신께 한 번 더 살펴볼 것이 있어요.</p>
  <div class="note" style="margin-top:12px">${I.info}<span><b>「먹지 마세요」가 아닙니다.</b> 더 안전한 대안이 있으면 그것을 적어 두었어요. 드시던 약을 <b>스스로 끊지는 마세요</b> — 바꾸는 것은 약사·의사와 함께.</span></div>
  ${(() => { /* 2026-09-29 — 갈래를 모두 펼치면 폰 9장이었다. ClinicScore 처럼 까닭별 탭, 고른 것만 */
    const T = [...byWhy.map(([w, xs], i) => [String(i), w, xs, meta(w)[1], meta(w)[2]]), ...(rx.length ? [['rx', '처방약 중에도', rx, 'info', '']] : [])];
    const k = T.some(t => t[0] === q?.w) ? q.w : '0', cur = T.find(t => t[0] === k);
    return `<nav class="tabs" role="tablist" aria-label="까닭별" style="margin-top:20px">${T.map(([id, w, xs, ic]) => `<button class="tab ${id === k ? 'on' : ''}" role="tab" aria-selected="${id === k}" onclick="go('/senior?w=${id}')">${icon(ic)}${esc(w)}<span class="n">${xs.length}</span></button>`).join('')}</nav>
    <div class="sech"><h2 class="sec-h">${esc(k === 'rx' ? '처방으로 받으시는 약 중에도' : cur[1])}</h2><span class="secn">${cur[2].length}가지</span></div>
    ${k === 'rx' ? '<p class="viewnote">약국에서 사는 약은 아니지만, 어르신 약통에 흔히 들어 있는 것들이에요. <b>임의로 끊지 마시고</b> 다음 진료 때 물어보실 거리로 보세요.</p>' : cur[4] ? `<p class="viewnote">${esc(cur[4])}</p>` : ''}
    <div class="card rows">${cur[2].map(srow).join('')}</div>`; })()}
  <section class="sec card"><h2>무엇을 보고 고른 것인가요</h2>
    <p>미국 노인병학회가 65세 이상에서 「되도록 피할 약」을 정리한 기준(2023년 판)과, 같은 기준을 국내에 옮긴 <b>건강보험심사평가원 「노인주의 의약품」</b>을 봤습니다. 그중 <b>약국에서 살 수 있는 약</b>만 골라, 왜 조심해야 하는지와 <b>대신 쓸 것</b>을 적었어요.</p>
    <p class="small muted" style="margin-top:8px"><b>「심평원 노인주의」</b> 딱지는 식약처 고시로 정한 노인주의 성분 목록(2025년 5월 30일 공고, 한국의약품안전관리원 배포)에 실제로 있는 성분이에요 — 약국에서 약을 지을 때 약사 화면에 뜨는 그 목록입니다. 딱지가 없는 것은 그 목록에는 없지만 미국 노인병학회 기준과 식약처 허가사항의 「고령자 주의」에서 가져왔어요. 목록의 사유가 다를 때도 있어요 — 졸리는 콧물약(1세대 항히스타민)은 공식 목록에서 <b>항콜린 부작용</b>(기억력·섬망·입마름·소변 막힘·변비)이 이유입니다.</p>
    ${srcChips(['beers2023', 'kids_senior2025'])}</section>
  ${disclaimer()}`;
}

function vRxOut(){
  const rx = (D.drugs || []).filter(d => d.otcAlt);
  const yes = rx.filter(d => d.otcAlt.has), no = rx.filter(d => !d.otcAlt.has);
  const row = d => { const opts = (d.otcAlt.options || []).map(drug).filter(Boolean);
    return `<button class="row" onclick="go('/drug/${d.id}')"><div class="ic">${icon(cls(d.class)?.icon || 'pill')}</div>
      <div class="body"><b>${esc(ingrName(d))} <span class="badge rx">처방 필요</span></b><span>${opts.length ? '약국에서는 → <b style="color:var(--normal)">' + opts.map(o => esc(ingrName(o))).join(' · ') + '</b>' : esc(firstSentence(d.otcAlt.text, 40))}</span></div>${I.chev}</button>`; };
  return `${topBar({ back:'약 사전' })}

function scatter(c){
  const pts = (c.members || []).map(id => drug(id)).filter(d => d?.risk?.gi && d?.risk?.cv);
  /* 점이 둘뿐이거나 전부 같은 자리면 그림이 아무것도 말해 주지 않는다 — 그런 그림은 그리지 않는다 */
  if (pts.length < 3) return '';
  if (new Set(pts.map(d => d.risk.gi + ',' + d.risk.cv)).size < 2) return '';
  /* 전부 «낮음» 칸 근처면 이름표만 겹쳐 쌓인다(피부·눈 계열) — 그림 대신 한 줄로 말한다 */
  if (pts.every(d => d.risk.gi <= 2 && d.risk.cv <= 2)) return '';
  const W = 400, H = 340, P = { l:28, r:20, t:46, b:42 };
  const x = v => P.l + (v - 0.5) / 5 * (W - P.l - P.r), y = v => H - P.b - (v - 0.5) / 5 * (H - P.t - P.b);
  const grid = [1, 2, 3, 4, 5].map(v => `<line x1="${x(v)}" y1="${P.t}" x2="${x(v)}" y2="${H - P.b}" stroke="var(--hairline)" stroke-dasharray="2 4"/><line x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}" stroke="var(--hairline)" stroke-dasharray="2 4"/>`).join('');
  const groups = {};
  pts.forEach(d => { const k = d.risk.gi + ',' + d.risk.cv; (groups[k] = groups[k] || []).push(d); });
  /* 점은 그 자리에 두고, 이름표만 서로 비켜 세운다 — 한글은 글자 하나가 글씨 크기만큼 넓어서 그냥 두면 겹친다 */
  const FS = 11, CH = FS * 0.98, LH = 14;          /* 한글 한 글자 ≈ 글씨 크기, 줄 간격 14 */
  const labels = [], dots = [];
  Object.entries(groups).forEach(([k, arr]) => {
    const [gi, cv] = k.split(',').map(Number), cx = x(gi), cy = y(cv);
    const rx = arr.every(d => d.rx === '전문');
    dots.push(`<circle cx="${cx}" cy="${cy}" r="${arr.length > 1 ? 8 : 7}" fill="${rx ? 'var(--rx)' : 'var(--primary)'}" opacity=".9"/>${arr.length > 1 && !rx && arr.some(d => d.rx === '전문') ? `<circle cx="${cx}" cy="${cy}" r="3" fill="var(--rx)"/>` : ''}`);
    const anchor = cx > W - 90 ? 'end' : cx < P.l + 70 ? 'start' : 'middle';
    const tx = anchor === 'end' ? cx + 10 : anchor === 'start' ? cx - 10 : cx;
    const down = cv >= 3;                           /* 위쪽 점은 이름표를 아래로 */
    arr.forEach((d, j) => {
      const t = d.name.replace(/ \(.*?\)/, '');
      const wHalf = t.length * CH / 2;
      labels.push({ t, cx, cy, tx, anchor, fill: d.rx === '전문' ? 'var(--rx)' : 'var(--text)',
        want: cy + (down ? 21 + j * LH : -(13 + (arr.length - 1 - j) * LH)),
        x0: anchor === 'end' ? tx - t.length * CH : anchor === 'start' ? tx : tx - wHalf,
        x1: anchor === 'end' ? tx : anchor === 'start' ? tx + t.length * CH : tx + wHalf });
    });
  });
  labels.sort((a, b) => a.want - b.want);
  const placed = [];
  for (const L of labels) {
    L.y = Math.max(P.t - 8, Math.min(H - 6, L.want));
    let guard = 0;
    while (guard++ < 40 && placed.some(q => Math.abs(q.y - L.y) < LH - 1 && q.x1 > L.x0 - 7 && L.x1 > q.x0 - 7)) L.y += LH;
    if (L.y > H - 6) { L.y = L.want; while (guard++ < 80 && placed.some(q => Math.abs(q.y - L.y) < LH - 1 && q.x1 > L.x0 - 7 && L.x1 > q.x0 - 7)) L.y -= LH; }
    placed.push(L);
  }
  const lead = placed.map(L => Math.abs(L.y - L.want) > 9 ? `<line x1="${L.cx}" y1="${L.cy + (L.y > L.cy ? 8 : -8)}" x2="${L.anchor === 'middle' ? L.tx : (L.x0 + L.x1) / 2}" y2="${L.y + (L.y > L.cy ? -9 : 3)}" stroke="var(--hairline)" stroke-width="1"/>` : '').join('');
  const text = placed.map(L => `<text x="${L.tx}" y="${L.y}" text-anchor="${L.anchor}" font-size="${FS}" font-weight="700" fill="${L.fill}" stroke="var(--card)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${esc(L.t)}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.name)} 위장 부담과 심혈관 부담 비교 산점도">
    ${grid}
    <text x="${P.l}" y="${P.t - 24}" font-size="11" font-weight="700" fill="var(--muted)">↑ 심혈관 부담 (위로 갈수록 큼)</text>
    <text x="${W - P.r}" y="${H - 12}" text-anchor="end" font-size="11" font-weight="700" fill="var(--muted)">위장 부담 (오른쪽으로 갈수록 큼) →</text>
    <text x="${P.l + 4}" y="${H - P.b - 8}" font-size="10" fill="var(--normal)" font-weight="700" stroke="var(--card)" stroke-width="3" paint-order="stroke">둘 다 낮음</text>
    ${lead}${dots.join('')}${text}</svg>
    <div class="legend"><span><i style="background:var(--primary)"></i>약국·편의점 구입</span><span><i style="background:var(--rx)"></i>처방 필요</span><span>같은 자리의 성분은 한 점에 묶었어요</span></div>
    <p class="small muted" style="margin-top:6px">${esc(c.chartNote || '위치는 대규모 관찰연구·메타분석의 상대위험을 5단계로 옮긴 것으로, 개인 용량·기간·기저질환에 따라 달라져요.')}</p></div>`;
}

async function wipeMe(){
  const n = (ME.taking || []).length, d = Object.keys(ME.taken || {}).length;

  try { localStorage.removeItem(ME_KEY); localStorage.removeItem(WX_KEY); } catch (e) {}

  const LN = plug('LocalNotifications');
  if (LN) { try { const pend = (await LN.getPending()).notifications || []; if (pend.length) await LN.cancel({ notifications: pend.map(p => ({ id: p.id })) }); } catch (e) {} }

}
async function importMe(file){
  if (!file) return;
  let j; try { j = JSON.parse(await file.text()); } catch (e) { toast('읽을 수 없는 파일이에요'); return; }
  const me = j && (j.me || (j.app === 'yakjido' ? null : j));
  if (!me || typeof me !== 'object' || Array.isArray(me)) { toast('약지도에서 받은 파일이 아니에요'); return; }
  const n = (me.taking || []).length, d = Object.keys(me.taken || {}).length, ae = (me.ae || []).length;
  if (!confirm(`가져오면 지금 이 휴대폰의 기록을 «덮어씁니다».\n\n들어 있는 것 — 약 ${n}가지 · 복용 기록 ${d}일치 · 불편했던 일 ${ae}건\n\n계속할까요?`)) return;
  ME = { ...ME_DEF, ...me };   /* 옛 파일에 없는 칸은 기본값으로 채운다 */

}

  /* 설치된 앱이 비행기 모드에서도 쓸 수 있게, 한가할 때 핵심 자료를 미리 받아 캐시에 넣는다.
     서비스워커의 fetch 처리가 응답을 캐시하므로 여기서는 「부르기만」 하면 된다. */
  const warm = () => { ['lexicon.json', 'brands.json', 'qa.json', 'mixes.json', 'nutrients.json', 'easy-index.json', 'pills.json']
    .forEach((f, i) => setTimeout(() => fetch('data/' + f, { cache:'force-cache' }).catch(() => {}), i * 1200)); };
  if ('requestIdleCallback' in window) requestIdleCallback(warm, { timeout:8000 }); else setTimeout(warm, 4000);
}
</script>
